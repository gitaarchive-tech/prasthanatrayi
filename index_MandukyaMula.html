        const manifest = [{"id": "B_000000", "originalText": "माण्डूक्योपनिषत्।", "padacchedaText": "", "audioFile": "B_000000.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000001", "originalText": "आगमप्रकरणम्।", "padacchedaText": "", "audioFile": "B_000001.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000002", "originalText": "ओमित्येतदक्षरमिदं सर्वं तस्योपव्याख्यानं भूतं भवद्भविष्यदिति सर्वमोङ्कार एव। यच्चान्यत्त्रिकालातीतं तदप्योङ्कार एव॥ १॥", "padacchedaText": "", "audioFile": "B_000002.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000003", "originalText": "सर्वं ह्येतद्ब्रह्मायमात्मा ब्रह्म सोऽयमात्मा चतुष्पात्॥ २॥", "padacchedaText": "", "audioFile": "B_000003.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000004", "originalText": "जागरितस्थानो बहिःप्रज्ञः सप्ताङ्ग एकोनविंशतिमुखः स्थूलभुग्वैश्वानरः प्रथमः पादः॥ ३॥", "padacchedaText": "", "audioFile": "B_000004.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000005", "originalText": "स्वप्नस्थानोऽन्तःप्रज्ञः सप्ताङ्ग एकोनविंशतिमुखः प्रविविक्तभुक्तैजसो द्वितीयः पादः॥ ४॥", "padacchedaText": "", "audioFile": "B_000005.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000006", "originalText": "यत्र सुप्तो न कञ्चन कामं कामयते न कञ्चन स्वप्नं पश्यति तत्सुषुप्तम्। सुषुप्तस्थान एकीभूतः प्रज्ञानघन एवानन्दमयो ह्यानन्दभुक्चेतोमुखः प्राज्ञस्तृतीयः पादः॥ ५॥", "padacchedaText": "", "audioFile": "B_000006.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000007", "originalText": "एष सर्वेश्वर एष सर्वज्ञ एषोऽन्तर्याम्येष योनिः सर्वस्य प्रभवाप्ययौ हि भूतानाम्॥ ६॥", "padacchedaText": "", "audioFile": "B_000007.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000008", "originalText": "बहिःप्रज्ञो विभुर्विश्वो ह्यन्तःप्रज्ञस्तु तैजसः। घनप्रज्ञस्तथा प्राज्ञ एक एव त्रिधा स्थितः॥ १॥", "padacchedaText": "", "audioFile": "B_000008.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000009", "originalText": "दक्षिणाक्षिमुखे विश्वो मनस्यन्तस्तु तैजसः। आकाशे च हृदि प्राज्ञस्त्रिधा देहे व्यवस्थितः॥ २॥", "padacchedaText": "", "audioFile": "B_000009.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000010", "originalText": "विश्वो हि स्थूलभुङ् नित्यं तैजसः प्रविविक्तभुक्। आनन्दभुक्तथा प्राज्ञस्त्रिधा भोगं निबोधत॥ ३॥", "padacchedaText": "", "audioFile": "B_000010.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000011", "originalText": "स्थूलं तर्पयते विश्वं प्रविविक्तं तु तैजसम्। आनन्दश्च तथा प्राज्ञं त्रिधा तृप्तिं निबोधत॥ ४॥", "padacchedaText": "", "audioFile": "B_000011.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000012", "originalText": "त्रिषु धामसु यद्भोज्यं भोक्ता यश्च प्रकीर्तितः। वेदैतदुभयं यस्तु स भुञ्जानो न लिप्यते॥ ५॥", "padacchedaText": "", "audioFile": "B_000012.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000013", "originalText": "प्रभवः सर्वभावानां सतामिति विनिश्चयः। सर्वं जनयति प्राणश्चेतोंशून्पुरुषः पृथक्॥ ६॥", "padacchedaText": "", "audioFile": "B_000013.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000014", "originalText": "विभूतिं प्रसवं त्वन्ये मन्यन्ते सृष्टिचिन्तकाः। स्वप्नमायासरूपेति सृष्टिरन्यैर्विकल्पिता॥ ७॥", "padacchedaText": "", "audioFile": "B_000014.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000015", "originalText": "इच्छामात्रं प्रभोः सृष्टिरिति सृष्टौ विनिश्चिताः। कालात्प्रसूतिं भूतानां मन्यन्ते कालचिन्तकाः॥ ८॥", "padacchedaText": "", "audioFile": "B_000015.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000016", "originalText": "भोगार्थं सृष्टिरित्यन्ये क्रीडार्थमिति चापरे। देवस्यैष स्वभावोऽयमाप्तकामस्य का स्पृहा॥ ९॥", "padacchedaText": "", "audioFile": "B_000016.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000017", "originalText": "नान्तःप्रज्ञं नबहिःप्रज्ञं नोभयतःप्रज्ञं नप्रज्ञानघनं नप्रज्ञं नाप्रज्ञम्। अदृश्यमव्यवहार्यमग्राह्यमलक्षणमचिन्त्यमव्यपदेश्यमेकात्मप्रत्ययसारं प्रपञ्चोपशमं शान्तं शिवमद्वैतं चतुर्थं मन्यन्ते स आत्मा स विज्ञेयः॥ ७॥", "padacchedaText": "", "audioFile": "B_000017.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000018", "originalText": "निवृत्तेः सर्वदुःखानामीशानः प्रभुरव्ययः। अद्वैतः सर्वभावानां देवस्तुर्यो विभुः स्मृतः॥ १०॥", "padacchedaText": "", "audioFile": "B_000018.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000019", "originalText": "कार्यकारणबद्धौ ताविष्येते विश्वतैजसौ। प्राज्ञः कारणबद्धस्तु द्वौ तौ तुर्ये न सिध्यतः॥ ११॥", "padacchedaText": "", "audioFile": "B_000019.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000020", "originalText": "नात्मानं न परं चैव न सत्यं नापि चानृतम्। प्राज्ञः किञ्चन संवेत्ति तुर्यं तत्सर्वदृक्सदा॥ १२॥", "padacchedaText": "", "audioFile": "B_000020.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000021", "originalText": "द्वैतस्याग्रहणं तुल्यमुभयोः प्राज्ञतुर्ययोः। बीजनिद्रायुतः प्राज्ञः सा च तुर्ये न विद्यते॥ १३॥", "padacchedaText": "", "audioFile": "B_000021.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000022", "originalText": "स्वप्ननिद्रायुतावाद्यौ प्राज्ञस्त्वस्वप्ननिद्रया। न निद्रां नैव च स्वप्नं तुर्ये पश्यन्ति निश्चिताः॥ १४॥", "padacchedaText": "", "audioFile": "B_000022.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000023", "originalText": "अन्यथा गृह्णतः स्वप्नो निद्रा तत्त्वमजानतः। विपर्यासे तयोः क्षीणे तुरीयं पदमश्नुते॥ १५॥", "padacchedaText": "", "audioFile": "B_000023.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000024", "originalText": "अनादिमायया सुप्तो यदा जीवः प्रबुध्यते। अजमनिद्रमस्वप्नमद्वैतं बुध्यते तदा॥ १६॥", "padacchedaText": "", "audioFile": "B_000024.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000025", "originalText": "प्रपञ्चो यदि विद्येत निवर्तेत न संशयः। मायामात्रमिदं द्वैतमद्वैतं परमार्थतः॥ १७॥", "padacchedaText": "", "audioFile": "B_000025.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000026", "originalText": "विकल्पो विनिवर्तेत कल्पितो यदि केनचित्। उपदेशादयं वादो ज्ञाते द्वैतं न विद्यते॥ १८॥", "padacchedaText": "", "audioFile": "B_000026.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000027", "originalText": "सोऽयमात्माध्यक्षरमोङ्कारोऽधिमात्रं पादा मात्रा मात्राश्च पादा अकार उकारो मकार इति॥ ८॥", "padacchedaText": "", "audioFile": "B_000027.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000028", "originalText": "जागरितस्थानो वैश्वानरोऽकारः प्रथमा मात्राप्तेरादिमत्त्वाद्वाप्नोति ह वै सर्वान्कामानादिश्च भवति य एवं वेद॥ ९॥", "padacchedaText": "", "audioFile": "B_000028.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000029", "originalText": "स्वप्नस्थानस्तैजस उकारो द्वितीया मात्रोत्कर्षादुभयत्वाद्वोत्कर्षति ह वै ज्ञानसन्ततिं समानश्च भवति नास्याब्रह्मवित्कुले भवति य एवं वेद॥ १०॥", "padacchedaText": "", "audioFile": "B_000029.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000030", "originalText": "सुषुप्तस्थानः प्राज्ञो मकारस्तृतीया मात्रा मितेरपीतेर्वा मिनोति ह वा इदं सर्वमपीतिश्च भवति य एवं वेद॥ ११॥", "padacchedaText": "", "audioFile": "B_000030.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000031", "originalText": "विश्वस्यात्वविवक्षायामादिसामान्यमुत्कटम्। मात्रासम्प्रतिपत्तौ स्यादाप्तिसामान्यमेव च॥ १९॥", "padacchedaText": "", "audioFile": "B_000031.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000032", "originalText": "तैजसस्योत्वविज्ञान उत्कर्षो दृश्यते स्फुटम्। मात्रासम्प्रतिपत्तौ स्यादुभयत्वं तथाविधम्॥ २०॥", "padacchedaText": "", "audioFile": "B_000032.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000033", "originalText": "मकारभावे प्राज्ञस्य मानसामान्यमुत्कटम्। मात्रासम्प्रतिपत्तौ तु लयसामान्यमेव च॥ २१॥", "padacchedaText": "", "audioFile": "B_000033.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000034", "originalText": "त्रिषु धामसु यस्तुल्यं सामान्यं वेत्ति निश्चितः। स पूज्यः सर्वभूतानां वन्द्यश्चैव महामुनिः॥ २२॥", "padacchedaText": "", "audioFile": "B_000034.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000035", "originalText": "अकारो नयते विश्वमुकारश्चापि तैजसम्। मकारश्च पुनः प्राज्ञं नामात्रे विद्यते गतिः॥ २३॥", "padacchedaText": "", "audioFile": "B_000035.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000036", "originalText": "अमात्रश्चतुर्थोऽव्यवहार्यः प्रपञ्चोपशमः शिवोऽद्वैत एवमोङ्कार आत्मैव संविशत्यात्मनात्मानं य एवं वेद॥ १२॥", "padacchedaText": "", "audioFile": "B_000036.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000037", "originalText": "ओङ्कारं पादशो विद्यात्पादा मात्रा न संशयः। ओङ्कारं पादशो ज्ञात्वा न किञ्चिदपि चिन्तयेत्॥ २४॥", "padacchedaText": "", "audioFile": "B_000037.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000038", "originalText": "युञ्जीत प्रणवे चेतः प्रणवो ब्रह्म निर्भयम्। प्रणवे नित्ययुक्तस्य न भयं विद्यते क्वचित्॥ २५॥", "padacchedaText": "", "audioFile": "B_000038.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000039", "originalText": "प्रणवो ह्यपरं ब्रह्म प्रणवश्च परं स्मृतः। अपूर्वोऽनन्तरोऽबाह्योऽनपरः प्रणवोऽव्ययः॥ २६॥", "padacchedaText": "", "audioFile": "B_000039.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000040", "originalText": "सर्वस्य प्रणवो ह्यादिर्मध्यमन्तस्तथैव च। एवं हि प्रणवं ज्ञात्वा व्यश्नुते तदनन्तरम्॥ २७॥", "padacchedaText": "", "audioFile": "B_000040.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000041", "originalText": "प्रणवं हीश्वरं विद्यात्सर्वस्य हृदये स्थितम्। सर्वव्यापिनमोङ्कारं मत्वा धीरो न शोचति॥ २८॥", "padacchedaText": "", "audioFile": "B_000041.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000042", "originalText": "अमात्रोऽनन्तमात्रश्च द्वैतस्योपशमः शिवः। ओङ्कारो विदितो येन स मुनिर्नेतरो जनः॥ २९॥", "padacchedaText": "", "audioFile": "B_000042.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000043", "originalText": "इति प्रथममागमप्रकरणं सम्पूर्णम्॥", "padacchedaText": "", "audioFile": "B_000043.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000044", "originalText": "वैतथ्यप्रकरणम्।", "padacchedaText": "", "audioFile": "B_000044.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000045", "originalText": "वैतथ्यं सर्वभावानां स्वप्न आहुर्मनीषिणः। अन्तःस्थानात्तु भावानां संवृतत्वेन हेतुना॥ १॥", "padacchedaText": "", "audioFile": "B_000045.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000046", "originalText": "अदीर्घत्वाच्च कालस्य गत्वा देहान्न पश्यति। प्रतिबुद्धश्च वै सर्वस्तस्मिन्देशे न विद्यते॥ २॥", "padacchedaText": "", "audioFile": "B_000046.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000047", "originalText": "अभावश्च रथादीनां श्रूयते न्यायपूर्वकम्। वैतथ्यं तेन वै प्राप्तं स्वप्न आहुः प्रकाशितम्॥ ३॥", "padacchedaText": "", "audioFile": "B_000047.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000048", "originalText": "अन्तःस्थानात्तु भेदानां तस्माज्जागरिते स्मृतम्। यथा तत्र तथा स्वप्ने संवृतत्वेन भिद्यते॥ ४॥", "padacchedaText": "", "audioFile": "B_000048.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000049", "originalText": "स्वप्नजागरिते स्थाने ह्येकमाहुर्मनीषिणः। भेदानां हि समत्वेन प्रसिद्धेनैव हेतुना॥ ५॥", "padacchedaText": "", "audioFile": "B_000049.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000050", "originalText": "आदावन्ते च यन्नास्ति वर्तमानेऽपि तत्तथा। वितथैः सदृशाः सन्तोऽवितथा इव लक्षिताः॥ ६॥", "padacchedaText": "", "audioFile": "B_000050.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000051", "originalText": "सप्रयोजनता तेषां स्वप्ने विप्रतिपद्यते। तस्मादाद्यन्तवत्त्वेन मिथ्यैव खलु ते स्मृताः॥ ७॥", "padacchedaText": "", "audioFile": "B_000051.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000052", "originalText": "अपूर्वं स्थानिधर्मो हि यथा स्वर्गनिवासिनाम्। तानयं प्रेक्षते गत्वा यथैवेह सुशिक्षितः॥ ८॥", "padacchedaText": "", "audioFile": "B_000052.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000053", "originalText": "स्वप्नवृत्तावपि त्वन्तश्चेतसा कल्पितं त्वसत्। बहिश्चेतो गृहीतं सद्दृष्टं वैतथ्यमेतयोः॥ ९॥", "padacchedaText": "", "audioFile": "B_000053.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000054", "originalText": "जाग्रद्वृत्तावपि त्वन्तश्चेतसा कल्पितं त्वसत्। बहिश्चेतोगृहीतं सद्युक्तं वैतथ्यमेतयोः॥ १०॥", "padacchedaText": "", "audioFile": "B_000054.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000055", "originalText": "उभयोरपि वैतथ्यं भेदानां स्थानयोर्यदि। क एतान्बुध्यते भेदान्को वै तेषां विकल्पकः॥ ११॥", "padacchedaText": "", "audioFile": "B_000055.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000056", "originalText": "कल्पयत्यात्मनात्मानमात्मा देवः स्वमायया। स एव बुध्यते भेदानिति वेदान्तनिश्चयः॥ १२॥", "padacchedaText": "", "audioFile": "B_000056.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000057", "originalText": "विकरोत्यपरान्भावानन्तश्चित्ते व्यवस्थितान्। नियतांश्च बहिश्चित्त एवं कल्पयते प्रभुः॥ १३॥", "padacchedaText": "", "audioFile": "B_000057.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000058", "originalText": "चित्तकाला हि येऽन्तस्तु द्वयकालाश्च ये बहिः। कल्पिता एव ते सर्वे विशेषो नान्यहेतुकः॥ १४॥", "padacchedaText": "", "audioFile": "B_000058.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000059", "originalText": "अव्यक्ता एव येऽन्तस्तु स्फुटा एव च ये बहिः। कल्पिता एव ते सर्वे विशेषस्त्विन्द्रियान्तरे॥ १५॥", "padacchedaText": "", "audioFile": "B_000059.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000060", "originalText": "जीवं कल्पयते पूर्वं ततो भावान्पृथग्विधान्। बाह्यानाध्यात्मिकांश्चैव यथाविद्यस्तथास्मृतिः॥ १६॥", "padacchedaText": "", "audioFile": "B_000060.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000061", "originalText": "अनिश्चिता यथा रज्जुरन्धकारे विकल्पिता। सर्पधारादिभिर्भावैस्तद्वदात्मा विकल्पितः॥ १७॥", "padacchedaText": "", "audioFile": "B_000061.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000062", "originalText": "निश्चितायां यथा रज्ज्वां विकल्पो विनिवर्तते। रज्जुरेवेति चाद्वैतं तद्वदात्मविनिश्चयः॥ १८॥", "padacchedaText": "", "audioFile": "B_000062.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000063", "originalText": "प्राणादिभिरनन्तैस्तु भावैरेतैर्विकल्पितः। मायैषा तस्य देवस्य ययायं मोहितः स्वयम्॥ १९॥", "padacchedaText": "", "audioFile": "B_000063.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000064", "originalText": "प्राण इति प्राणविदो भूतानीति च तद्विदः। गुणा इति गुणविदस्तत्त्वानीति च तद्विदः॥ २०॥", "padacchedaText": "", "audioFile": "B_000064.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000065", "originalText": "पादा इति पादविदो विषया इति तद्विदः। लोका इति लोकविदो देवा इति च तद्विदः॥ २१॥", "padacchedaText": "", "audioFile": "B_000065.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000066", "originalText": "वेदा इति वेदविदो यज्ञा इति च तद्विदः। भोक्तेति च भोक्तृविदो भोज्यमिति च तद्विदः॥ २२॥", "padacchedaText": "", "audioFile": "B_000066.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000067", "originalText": "सूक्ष्म इति सूक्ष्मविदः स्थूल इति च तद्विदः। मूर्त इति मूर्तविदोऽमूर्त इति च तद्विदः॥ २३॥", "padacchedaText": "", "audioFile": "B_000067.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000068", "originalText": "काल इति कालविदो दिश इति च तद्विदः। वादा इति वादविदो भुवनानीति तद्विदः॥ २४॥", "padacchedaText": "", "audioFile": "B_000068.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000069", "originalText": "मन इति मनोविदो बुद्धिरिति च तद्विदः। चित्तमिति चित्तविदो धर्माधर्मौ च तद्विदः॥ २५॥", "padacchedaText": "", "audioFile": "B_000069.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000070", "originalText": "पञ्चविंशक इत्येके षड्विंश इति चापरे। एकत्रिंशक इत्याहुरनन्त इति चापरे॥ २६॥", "padacchedaText": "", "audioFile": "B_000070.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000071", "originalText": "लोकांल्लोकविदः प्राहुराश्रमा इति तद्विदः। स्त्रीपुंनपुंसकं लैङ्गाः परापरमथापरे॥ २७॥", "padacchedaText": "", "audioFile": "B_000071.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000072", "originalText": "सृष्टिरिति सृष्टिविदो लय इति च तद्विदः। स्थितिरिति स्थितिविदः सर्वे चेह तु सर्वदा॥ २८॥", "padacchedaText": "", "audioFile": "B_000072.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000073", "originalText": "यं भावं दर्शयेद्यस्य तं भावं स तु पश्यति। तं चावति स भूत्वासौ तद्ग्रहः समुपैति तम्॥ २९॥", "padacchedaText": "", "audioFile": "B_000073.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000074", "originalText": "एतैरेषोऽपृथग्भावैः पृथगेवेति लक्षितः। एवं यो वेद तत्त्वेन कल्पयेत्सोऽविशङ्कितः॥ ३०॥", "padacchedaText": "", "audioFile": "B_000074.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000075", "originalText": "स्वप्नमाये यथा दृष्टे गन्धर्वनगरं यथा। तथा विश्वमिदं दृष्टं वेदान्तेषु विचक्षणैः॥ ३१॥", "padacchedaText": "", "audioFile": "B_000075.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000076", "originalText": "न निरोधो न चोत्पत्तिर्न बद्धो न च साधकः। न मुमुक्षुर्न वै मुक्त इत्येषा परमार्थता॥ ३२॥", "padacchedaText": "", "audioFile": "B_000076.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000077", "originalText": "भावैरसद्भिरेवायमद्वयेन च कल्पितः। भावा अप्यद्वयेनैव तस्मादद्वयता शिवा॥ ३३॥", "padacchedaText": "", "audioFile": "B_000077.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000078", "originalText": "नात्मभावेन नानेदं न स्वेनापि कथञ्चन। न पृथङ् नापृथक्किञ्चिदिति तत्त्वविदो विदुः॥ ३४॥", "padacchedaText": "", "audioFile": "B_000078.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000079", "originalText": "वीतरागभयक्रोधैर्मुनिभिर्वेदपारगैः। निर्विकल्पो ह्ययं दृष्टः प्रपञ्चोपशमोऽद्वयः॥ ३५॥", "padacchedaText": "", "audioFile": "B_000079.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000080", "originalText": "तस्मादेवं विदित्वैनमद्वैते योजयेत्स्मृतिम्। अद्वैतं समनुप्राप्य जडवल्लोकमाचरेत्॥ ३६॥", "padacchedaText": "", "audioFile": "B_000080.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000081", "originalText": "निःस्तुतिर्निर्नमस्कारो निःस्वधाकार एव च। चलाचलनिकेतश्च यतिर्यादृच्छिको भवेत्॥ ३७॥", "padacchedaText": "", "audioFile": "B_000081.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000082", "originalText": "तत्त्वमाध्यात्मिकं दृष्ट्वा तत्त्वं दृष्ट्वा तु बाह्यतः। तत्त्वीभूतस्तदारामस्तत्त्वादप्रच्युतो भवेत्॥ ३८॥", "padacchedaText": "", "audioFile": "B_000082.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000083", "originalText": "इति द्वितीयं वैतथ्यप्रकरणं सम्पूर्णम्॥", "padacchedaText": "", "audioFile": "B_000083.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000084", "originalText": "अद्वैतप्रकरणम्।", "padacchedaText": "", "audioFile": "B_000084.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000085", "originalText": "उपासनाश्रितो धर्मो जाते ब्रह्मणि वर्तते। प्रागुत्पत्तेरजं सर्वं तेनासौ कृपणः स्मृतः॥ १॥", "padacchedaText": "", "audioFile": "B_000085.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000086", "originalText": "अतो वक्ष्याम्यकार्पण्यमजाति समतां गतम्। यथा न जायते किञ्चिज्जायमानं समन्ततः॥ २॥", "padacchedaText": "", "audioFile": "B_000086.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000087", "originalText": "आत्मा ह्याकाशवज्जीवैर्घटाकाशैरिवोदितः। घटादिवच्च सङ्घातैर्जातावेतन्निदर्शनम्॥ ३॥", "padacchedaText": "", "audioFile": "B_000087.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000088", "originalText": "घटादिषु प्रलीनेषु घटाकाशादयो यथा। आकाशे सम्प्रलीयन्ते तद्वज्जीवा इहात्मनि॥ ४॥", "padacchedaText": "", "audioFile": "B_000088.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000089", "originalText": "यथैकस्मिन्घटाकाशे रजोधूमादिभिर्युते। न सर्वे सम्प्रयुज्यन्ते तद्वज्जीवाः सुखादिभिः॥ ५॥", "padacchedaText": "", "audioFile": "B_000089.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000090", "originalText": "रूपकार्यसमाख्याश्च भिद्यन्ते तत्र तत्र वै। आकाशस्य न भेदोऽस्ति तद्वज्जीवेषु निर्णयः॥ ६॥", "padacchedaText": "", "audioFile": "B_000090.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000091", "originalText": "नाकाशस्य घटाकाशो विकारावयवौ यथा। नैवात्मनः सदा जीवो विकारावयवौ तथा॥ ७॥", "padacchedaText": "", "audioFile": "B_000091.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000092", "originalText": "यथा भवति बालानां गगनं मलिनं मलैः। तथा भवत्यबुद्धानामात्मापि मलिनो मलैः॥ ८॥", "padacchedaText": "", "audioFile": "B_000092.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000093", "originalText": "मरणे सम्भवे चैव गत्यागमनयोरपि। स्थितौ सर्वशरीरेषु चाकाशेनाविलक्षणः॥ ९॥", "padacchedaText": "", "audioFile": "B_000093.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000094", "originalText": "सङ्घाताः स्वप्नवत्सर्व आत्ममायाविसर्जिताः। आधिक्ये सर्वसाम्ये वा नोपपत्तिर्हि विद्यते॥ १०॥", "padacchedaText": "", "audioFile": "B_000094.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000095", "originalText": "रसादयो हि ये कोशा व्याख्यातास्तैत्तिरीयके। तेषामात्मा परो जीवः खं यथा सम्प्रकाशितः॥ ११॥", "padacchedaText": "", "audioFile": "B_000095.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000096", "originalText": "द्वयोर्द्वयोर्मधुज्ञाने परं ब्रह्म प्रकाशितम्। पृथिव्यामुदरे चैव यथाकाशः प्रकाशितः॥ १२॥", "padacchedaText": "", "audioFile": "B_000096.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000097", "originalText": "जीवात्मनोरनन्यत्वमभेदेन प्रशस्यते। नानात्वं निन्द्यते यच्च तदेवं हि समञ्जसम्॥ १३॥", "padacchedaText": "", "audioFile": "B_000097.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000098", "originalText": "जीवात्मनोः पृथक्त्वं यत्प्रागुत्पत्तेः प्रकीर्तितम्। भविष्यद्वृत्त्या गौणं तन्मुख्यत्वं हि न युज्यते॥ १४॥", "padacchedaText": "", "audioFile": "B_000098.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000099", "originalText": "मृल्लोहविस्फुलिङ्गाद्यैः सृष्टिर्या चोदितान्यथा। उपायः सोऽवताराय नास्ति भेदः कथञ्चन॥ १५॥", "padacchedaText": "", "audioFile": "B_000099.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000100", "originalText": "आश्रमास्त्रिविधा हीनमध्यमोत्कृष्टदृष्टयः। उपासनोपदिष्टेयं तदर्थमनुकम्पया॥ १६॥", "padacchedaText": "", "audioFile": "B_000100.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000101", "originalText": "स्वसिद्धान्तव्यवस्थासु द्वैतिनो निश्चिता दृढम्। परस्परं विरुध्यन्ते तैरयं न विरुध्यते॥ १७॥", "padacchedaText": "", "audioFile": "B_000101.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000102", "originalText": "अद्वैतं परमार्थो हि द्वैतं तद्भेद उच्यते। तेषामुभयथा द्वैतं तेनायं न विरुध्यते॥ १८॥", "padacchedaText": "", "audioFile": "B_000102.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000103", "originalText": "मायया भिद्यते ह्येतन्नान्यथाजं कथञ्चन। तत्त्वतो भिद्यमाने हि मर्त्यताममृतं व्रजेत्॥ १९॥", "padacchedaText": "", "audioFile": "B_000103.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000104", "originalText": "अजातस्यैव भावस्य जातिमिच्छन्ति वादिनः। अजातो ह्यमृतो भावो मर्त्यतां कथमेष्यति॥ २०॥", "padacchedaText": "", "audioFile": "B_000104.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000105", "originalText": "न भवत्यमृतं मर्त्यं न मर्त्यममृतं तथा। प्रकृतेरन्यथाभावो न कथञ्चिद्भविष्यति॥ २१॥", "padacchedaText": "", "audioFile": "B_000105.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000106", "originalText": "स्वभावेनामृतो यस्य भावो गच्छति मर्त्यताम्। कृतकेनामृतस्तस्य कथं स्थास्यति निश्चलः॥ २२॥", "padacchedaText": "", "audioFile": "B_000106.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000107", "originalText": "भूततोऽभूततो वापि सृज्यमाने समा श्रुतिः। निश्चितं युक्तियुक्तं च यत्तद्भवति नेतरत्॥ २३॥", "padacchedaText": "", "audioFile": "B_000107.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000108", "originalText": "नेह नानेति चाम्नायादिन्द्रो मायाभिरित्यपि। अजायमानो बहुधा जायते मायया तु सः॥ २४॥", "padacchedaText": "", "audioFile": "B_000108.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000109", "originalText": "सम्भूतेरपवादाच्च सम्भवः प्रतिषिध्यते। को न्वेनं जनयेदिति कारणं प्रतिषिध्यते॥ २५॥", "padacchedaText": "", "audioFile": "B_000109.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000110", "originalText": "स एष नेति नेतीति व्याख्यातं निह्नुते यतः। सर्वमग्राह्यभावेन हेतुनाजं प्रकाशते॥ २६॥", "padacchedaText": "", "audioFile": "B_000110.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000111", "originalText": "सतो हि मायया जन्म युज्यते न तु तत्त्वतः। तत्त्वतो जायते यस्य जातं तस्य हि जायते॥ २७॥", "padacchedaText": "", "audioFile": "B_000111.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000112", "originalText": "असतो मायया जन्म तत्त्वतो नैव युज्यते। वन्ध्यापुत्रो न तत्त्वेन मायया वापि जायते॥ २८॥", "padacchedaText": "", "audioFile": "B_000112.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000113", "originalText": "यथा स्वप्ने द्वयाभासं स्पन्दते मायया मनः। तथा जाग्रद्द्वयाभासं स्पन्दते मायया मनः॥ २९॥", "padacchedaText": "", "audioFile": "B_000113.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000114", "originalText": "अद्वयं च द्वयाभासं मनः स्वप्ने न संशयः। अद्वयं च द्वयाभासं तथा जाग्रन्न संशयः॥ ३०॥", "padacchedaText": "", "audioFile": "B_000114.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000115", "originalText": "मनोदृश्यमिदं द्वैतं यत्किञ्चित्सचराचरम्। मनसो ह्यमनीभावे द्वैतं नैवोपलभ्यते॥ ३१॥", "padacchedaText": "", "audioFile": "B_000115.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000116", "originalText": "आत्मसत्यानुबोधेन न सङ्कल्पयते यदा। अमनस्तां तदा याति ग्राह्याभावे तदग्रहम्॥ ३२॥", "padacchedaText": "", "audioFile": "B_000116.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000117", "originalText": "अकल्पकमजं ज्ञानं ज्ञेयाभिन्नं प्रचक्षते। ब्रह्म ज्ञेयमजं नित्यमजेनाजं विबुध्यते॥ ३३॥", "padacchedaText": "", "audioFile": "B_000117.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000118", "originalText": "निगृहीतस्य मनसो निर्विकल्पस्य धीमतः। प्रचारः स तु विज्ञेयः सुषुप्तेऽन्यो न तत्समः॥ ३४॥", "padacchedaText": "", "audioFile": "B_000118.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000119", "originalText": "लीयते हि सुषुप्तौ तन्निगृहीतं न लीयते। तदेव निर्भयं ब्रह्म ज्ञानालोकं समन्ततः॥ ३५॥", "padacchedaText": "", "audioFile": "B_000119.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000120", "originalText": "अजमनिद्रमस्वप्नमनामकमरूपकम्। सकृद्विभातं सर्वज्ञं नोपचारः कथञ्चन॥ ३६॥", "padacchedaText": "", "audioFile": "B_000120.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000121", "originalText": "सर्वाभिलापविगतः सर्वचिन्तासमुत्थितः। सुप्रशान्तः सकृज्ज्योतिः समाधिरचलोऽभयः॥ ३७॥", "padacchedaText": "", "audioFile": "B_000121.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000122", "originalText": "ग्रहो न तत्र नोत्सर्गश्चिन्ता यत्र न विद्यते। आत्मसंस्थं तदा ज्ञानमजाति समतां गतम्॥ ३८॥", "padacchedaText": "", "audioFile": "B_000122.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000123", "originalText": "अस्पर्शयोगो वै नाम दुर्दर्शः सर्वयोगिणाम्। योगिनो बिभ्यति ह्यस्मादभये भयदर्शिनः॥ ३९॥", "padacchedaText": "", "audioFile": "B_000123.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000124", "originalText": "मनसो निग्रहायत्तमभयं सर्वयोगिणाम्। दुःखक्षयः प्रबोधश्चाप्यक्षया शान्तिरेव च॥ ४०॥", "padacchedaText": "", "audioFile": "B_000124.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000125", "originalText": "उत्सेक उदधेर्यद्वत्कुशाग्रेणैकबिन्दुना। मनसो निग्रहस्तद्वद्भवेदपरिखेदतः॥ ४१॥", "padacchedaText": "", "audioFile": "B_000125.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000126", "originalText": "उपायेन निगृह्णीयाद्विक्षिप्तं कामभोगयोः। सुप्रसन्नं लये चैव यथा कामो लयस्तथा॥ ४२॥", "padacchedaText": "", "audioFile": "B_000126.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000127", "originalText": "दुःखं सर्वमनुस्मृत्य कामभोगान्निवर्तयेत्। अजं सर्वमनुस्मृत्य जातं नैव तु पश्यति॥ ४३॥", "padacchedaText": "", "audioFile": "B_000127.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000128", "originalText": "लये सम्बोधयेच्चित्तं विक्षिप्तं शमयेत्पुनः। सकषायं विजानीयात्समप्राप्तं न चालयेत्॥ ४४॥", "padacchedaText": "", "audioFile": "B_000128.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000129", "originalText": "नास्वादयेत्सुखं तत्र निःसङ्गः प्रज्ञया भवेत्। निश्चलं निश्चरच्चित्तमेकीकुर्यात्प्रयत्नतः॥ ४५॥", "padacchedaText": "", "audioFile": "B_000129.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000130", "originalText": "यदा न लीयते चित्तं न च विक्षिप्यते पुनः। अनिङ्गनमनाभासं निष्पन्नं ब्रह्म तत्तदा॥ ४६॥", "padacchedaText": "", "audioFile": "B_000130.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000131", "originalText": "स्वस्थं शान्तं सनिर्वाणमकथ्यं सुखमुत्तमम्। अजमजेन ज्ञेयेन सर्वज्ञं परिचक्षते॥ ४७॥", "padacchedaText": "", "audioFile": "B_000131.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000132", "originalText": "न कश्चिज्जायते जीवः सम्भवोऽस्य न विद्यते। एतत्तदुत्तमं सत्यं यत्र किञ्चिन्न जायते॥ ४८॥", "padacchedaText": "", "audioFile": "B_000132.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000133", "originalText": "इति तृतीयमद्वैतप्रकरणं सम्पूर्णम्॥", "padacchedaText": "", "audioFile": "B_000133.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000134", "originalText": "अलातशान्तिप्रकरणम्।", "padacchedaText": "", "audioFile": "B_000134.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000135", "originalText": "ज्ञानेनाकाशकल्पेन धर्मान्यो गगनोपमान्। ज्ञेयाभिन्नेन सम्बुद्धस्तं वन्दे द्विपदां वरम्॥ १॥", "padacchedaText": "", "audioFile": "B_000135.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000136", "originalText": "अस्पर्शयोगो वै नाम सर्वसत्त्वसुखो हितः। अविवादोऽविरुद्धश्च देशितस्तं नमाम्यहम्॥ २॥", "padacchedaText": "", "audioFile": "B_000136.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000137", "originalText": "भूतस्य जातिमिच्छन्ति वादिनः केचिदेव हि। अभूतस्यापरे धीरा विवदन्तः परस्परम्॥ ३॥", "padacchedaText": "", "audioFile": "B_000137.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000138", "originalText": "भूतं न जायते किञ्चिदभूतं नैव जायते। विवदन्तोऽद्वया ह्येवमजातिं ख्यापयन्ति ते॥ ४॥", "padacchedaText": "", "audioFile": "B_000138.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000139", "originalText": "ख्याप्यमानामजातिं तैरनुमोदामहे वयम्। विवदामो न तैः सार्धमविवादं निबोधत॥ ५॥", "padacchedaText": "", "audioFile": "B_000139.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000140", "originalText": "अजातस्यैव धर्मस्य जातिमिच्छन्ति वादिनः। अजातो ह्यमृतो धर्मो मर्त्यतां कथमेष्यति॥ ६॥", "padacchedaText": "", "audioFile": "B_000140.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000141", "originalText": "न भवत्यमृतं मर्त्यं न मर्त्यममृतं तथा। प्रकृतेरन्यथाभावो न कथञ्चिद्भविष्यति॥ ७॥", "padacchedaText": "", "audioFile": "B_000141.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000142", "originalText": "स्वभावेनामृतो यस्य धर्मो गच्छति मर्त्यतात्। कृतकेनामृतस्तस्य कथं स्थास्यति निश्चलः॥ ८॥", "padacchedaText": "", "audioFile": "B_000142.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000143", "originalText": "सांसिद्धिकी स्वाभाविकी सहजा अकृता च या। प्रकृतिः सेति विज्ञेया स्वभावं न जहाति या॥ ९॥", "padacchedaText": "", "audioFile": "B_000143.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000144", "originalText": "जरामरणनिर्मुक्ताः सर्वे धर्माः स्वभावतः। जरामरणमिच्छन्तश्च्यवन्ते तन्मनीषया॥ १०॥", "padacchedaText": "", "audioFile": "B_000144.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000145", "originalText": "कारणं यस्य वै कार्यं कारणं तस्य जायते। जायमानं कथमजं भिन्नं नित्यं कथं च तत्॥ ११॥", "padacchedaText": "", "audioFile": "B_000145.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000146", "originalText": "कारणाद्यद्यनन्यत्वमतः कार्यमजं तव। जायमानाद्धि वै कार्यात्कारणं ते कथं ध्रुवम्॥ १२॥", "padacchedaText": "", "audioFile": "B_000146.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000147", "originalText": "अजाद्वै जायते यस्य दृष्टान्तस्तस्य नास्ति वै। जाताच्च जायमानस्य न व्यवस्था प्रसज्यते॥ १३॥", "padacchedaText": "", "audioFile": "B_000147.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000148", "originalText": "हेतोरादिः फलं येषामादिर्हेतुः फलस्य च। हेतोः फलस्य चानादिः कथं तैरुपवर्ण्यते॥ १४॥", "padacchedaText": "", "audioFile": "B_000148.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000149", "originalText": "हेतोरादिः फलं येषामादिर्हेतुः फलस्य च। तथा जन्म भवेत्तेषां पुत्राज्जन्म पितुर्यथा॥ १५॥", "padacchedaText": "", "audioFile": "B_000149.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000150", "originalText": "सम्भवे हेतुफलयोरेषितव्यः क्रमस्त्वया। युगपत्सम्भवे यस्मादसम्बन्धो विषाणवत्॥ १६॥", "padacchedaText": "", "audioFile": "B_000150.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000151", "originalText": "फलादुत्पद्यमानः सन्न ते हेतुः प्रसिध्यति। अप्रसिद्धः कथं हेतुः फलमुत्पादयिष्यति॥ १७॥", "padacchedaText": "", "audioFile": "B_000151.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000152", "originalText": "यदि हेतोः फलात्सिद्धिः फलसिद्धिश्च हेतुतः। कतरत्पूर्वनिष्पन्नं यस्य सिद्धिरपेक्षया॥ १८॥", "padacchedaText": "", "audioFile": "B_000152.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000153", "originalText": "अशक्तिरपरिज्ञानं क्रमकोपोऽथ वा पुनः। एवं हि सर्वथा बुद्धैरजातिः परिदीपिता॥ १९॥", "padacchedaText": "", "audioFile": "B_000153.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000154", "originalText": "बीजाङ्कुराख्यो दृष्टान्तः सदा साध्यसमो हि सः। न हि साध्यसमो हेतुः सिद्धौ साध्यस्य युज्यते॥ २०॥", "padacchedaText": "", "audioFile": "B_000154.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000155", "originalText": "पूर्वापरापरिज्ञानमजातेः परिदीपकम्। जायमानाद्धि वै धर्मात्कथं पूर्वं न गृह्यते॥ २१॥", "padacchedaText": "", "audioFile": "B_000155.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000156", "originalText": "स्वतो वा परतो वापि न किञ्चिद्वस्तु जायते। सदसत्सदसद्वापि न किञ्चिद्वस्तु जायते॥ २२॥", "padacchedaText": "", "audioFile": "B_000156.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000157", "originalText": "हेतुर्न जायतेऽनादेः फलं चापि स्वभावतः। आदिर्न विद्यते यस्य तस्य ह्यादिर्न विद्यते॥ २३॥", "padacchedaText": "", "audioFile": "B_000157.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000158", "originalText": "प्रज्ञप्तेः सनिमित्तत्वमन्यथा द्वयनाशतः। सङ्क्लेशस्योपलब्धेश्च परतन्त्रास्तिता मता॥ २४॥", "padacchedaText": "", "audioFile": "B_000158.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000159", "originalText": "प्रज्ञप्तेः सनिमित्तत्वमिष्यते युक्तिदर्शनात्। निमित्तस्यानिमित्तत्वमिष्यते भूतदर्शनात्॥ २५॥", "padacchedaText": "", "audioFile": "B_000159.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000160", "originalText": "चित्तं न संस्पृशत्यर्थं नार्थाभासं तथैव च। अभूतो हि यतश्चार्थो नार्थाभासस्ततः पृथक्॥ २६॥", "padacchedaText": "", "audioFile": "B_000160.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000161", "originalText": "निमित्तं न सदा चित्तं संस्पृशत्यध्वसु त्रिषु। अनिमित्तो विपर्यासः कथं तस्य भविष्यति॥ २७॥", "padacchedaText": "", "audioFile": "B_000161.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000162", "originalText": "तस्मान्न जायते चित्तं चित्तदृश्यं न जायते। तस्य पश्यन्ति ये जातिं खे वै पश्यन्ति ते पदम्॥ २८॥", "padacchedaText": "", "audioFile": "B_000162.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000163", "originalText": "अजातं जायते यस्मादजातिः प्रकृतिस्ततः। प्रकृतेरन्यथाभावो न कथञ्चिद्भविष्यति॥ २९॥", "padacchedaText": "", "audioFile": "B_000163.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000164", "originalText": "अनादेरन्तवत्त्वं च संसारस्य न सेत्स्यति। अनन्तता चादिमतो मोक्षस्य न भविष्यति॥ ३०॥", "padacchedaText": "", "audioFile": "B_000164.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000165", "originalText": "आदावन्ते च यन्नास्ति वर्तमानेऽपि तत्तथा। वितथैः सदृशाः सन्तोऽवितथा इव लक्षिताः॥ ३१॥", "padacchedaText": "", "audioFile": "B_000165.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000166", "originalText": "सप्रयोजनता तेषां स्वप्ने विप्रतिपद्यते। तस्मादाद्यन्तवत्त्वेन मिथ्यैव खलु ते स्मृताः॥ ३२॥", "padacchedaText": "", "audioFile": "B_000166.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000167", "originalText": "सर्वे धर्मा मृषा स्वप्ने कायस्यान्तर्निदर्शनात्। संवृतेऽस्मिन्प्रदेशे वै भूतानां दर्शनं कुतः॥ ३३॥", "padacchedaText": "", "audioFile": "B_000167.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000168", "originalText": "न युक्तं दर्शनं गत्वा कालस्यानियमाद्गतौ। प्रतिबुद्धश्च वै सर्वस्तस्मिन्देशे न विद्यते॥ ३४॥", "padacchedaText": "", "audioFile": "B_000168.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000169", "originalText": "मित्राद्यैः सह संमन्त्र्य सम्बुद्धो न प्रपद्यते। गृहीतं चापि यत्किञ्चित्प्रतिबुद्धो न पश्यति॥ ३५॥", "padacchedaText": "", "audioFile": "B_000169.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000170", "originalText": "स्वप्ने चावस्तुकः कायः पृथगन्यस्य दर्शनात्। यथा कायस्तथा सर्वं चित्तदृश्यमवस्तुकम्॥ ३६॥", "padacchedaText": "", "audioFile": "B_000170.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000171", "originalText": "ग्रहणाज्जागरितवत्तद्धेतुः स्वप्न इष्यते। तद्धेतुत्वात्तु तस्यैव सज्जागरितमिष्यते॥ ३७॥", "padacchedaText": "", "audioFile": "B_000171.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000172", "originalText": "उत्पादस्याप्रसिद्धत्वादजं सर्वमुदाहृतम्। न च भूतादभूतस्य सम्भवोऽस्ति कथञ्चन॥ ३८॥", "padacchedaText": "", "audioFile": "B_000172.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000173", "originalText": "असज्जागरिते दृष्ट्वा स्वप्ने पश्यति तन्मयः। असत्स्वप्नेऽपि दृष्ट्वा च प्रतिबुद्धो न पश्यति॥ ३९॥", "padacchedaText": "", "audioFile": "B_000173.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000174", "originalText": "नास्त्यसद्धेतुकमसत्सदसद्धेतुकं तथा। सच्च सद्धेतुकं नास्ति सद्धेतुकमसत्कुतः॥ ४०॥", "padacchedaText": "", "audioFile": "B_000174.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000175", "originalText": "विपर्यासाद्यथा जाग्रदचिन्त्यान्भूतवत्स्पृशेत्। तथा स्वप्ने विपर्यासाद्धर्मांस्तत्रैव पश्यति॥ ४१॥", "padacchedaText": "", "audioFile": "B_000175.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000176", "originalText": "उपलम्भात्समाचारादस्तिवस्तुत्ववादिनाम्। जातिस्तु देशिता बुद्धैरजातेस्त्रसतां सदा॥ ४२॥", "padacchedaText": "", "audioFile": "B_000176.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000177", "originalText": "अजातेस्त्रसतां तेषामुपलम्भाद्वियन्ति ये। जातिदोषा न सेत्स्यन्ति दोषोऽप्यल्पो भविष्यति॥ ४३॥", "padacchedaText": "", "audioFile": "B_000177.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000178", "originalText": "उपलम्भात्समाचारान्मायाहस्ती यथोच्यते। उपलम्भात्समाचारादस्ति वस्तु तथोच्यते॥ ४४॥", "padacchedaText": "", "audioFile": "B_000178.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000179", "originalText": "जात्याभासं चलाभासं वस्त्वाभासं तथैव च। अजाचलमवस्तुत्वं विज्ञानं शान्तमद्वयम्॥ ४५॥", "padacchedaText": "", "audioFile": "B_000179.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000180", "originalText": "एवं न जायते चित्तमेवं धर्मा अजाः स्मृताः। एवमेव विजानन्तो न पतन्ति विपर्यये॥ ४६॥", "padacchedaText": "", "audioFile": "B_000180.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000181", "originalText": "ऋजुवक्रादिकाभासमलातस्पन्दितं यथा। ग्रहणग्राहकाभासं विज्ञानस्पन्दितं तथा॥ ४७॥", "padacchedaText": "", "audioFile": "B_000181.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000182", "originalText": "अस्पन्दमानमलातमनाभासमजं यथा। अस्पन्दमानं विज्ञानमनाभासमजं तथा॥ ४८॥", "padacchedaText": "", "audioFile": "B_000182.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000183", "originalText": "अलाते स्पन्दमाने वै नाभासा अन्यतोभुवः। न ततोऽन्यत्र निःस्पन्दान्नालातं प्रविशन्ति ते॥ ४९॥", "padacchedaText": "", "audioFile": "B_000183.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000184", "originalText": "न निर्गता अलातात्ते द्रव्यत्वाभावयोगतः। विज्ञानेऽपि तथैव स्युराभासस्याविशेषतः॥ ५०॥", "padacchedaText": "", "audioFile": "B_000184.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000185", "originalText": "विज्ञाने स्पन्दमाने वै नाभासा अन्यतोभुवः। न ततोऽन्यत्र निःस्पन्दान्न विज्ञानं विशन्ति ते॥ ५१॥", "padacchedaText": "", "audioFile": "B_000185.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000186", "originalText": "न निर्गतास्ते विज्ञानाद्द्रव्यत्वाभावयोगतः। कार्यकारणताभावाद्यतोऽचिन्त्याः सदैव ते॥ ५२॥", "padacchedaText": "", "audioFile": "B_000186.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000187", "originalText": "द्रव्यं द्रव्यस्य हेतुः स्यादन्यदन्यस्य चैव हि। द्रव्यत्वमन्यभावो वा धर्माणां नोपपद्यते॥ ५३॥", "padacchedaText": "", "audioFile": "B_000187.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000188", "originalText": "एवं न चित्तजा धर्माश्चित्तं वापि न धर्मजम्। एवं हेतुफलाजातिं प्रविशन्ति मनीषिणः॥ ५४॥", "padacchedaText": "", "audioFile": "B_000188.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000189", "originalText": "यावद्धेतुफलावेशस्तावद्धेतुफलोद्भवः। क्षीणे हेतुफलावेशे नास्ति हेतुफलोद्भवः॥ ५५॥", "padacchedaText": "", "audioFile": "B_000189.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000190", "originalText": "यावद्धेतुफलावेशः संसारस्तावदायतः। क्षीणे हेतुफलावेशे संसारं न प्रपद्यते॥ ५६॥", "padacchedaText": "", "audioFile": "B_000190.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000191", "originalText": "संवृत्या जायते सर्वं शाश्वतं नास्ति तेन वै। सद्भावेन ह्यजं सर्वमुच्छेदस्तेन नास्ति वै॥ ५७॥", "padacchedaText": "", "audioFile": "B_000191.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000192", "originalText": "धर्मा य इति जायन्ते जायन्ते ते न तत्त्वतः। जन्म मायोपमं तेषां सा च माया न विद्यते॥ ५८॥", "padacchedaText": "", "audioFile": "B_000192.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000193", "originalText": "यथा मायामयाद्बीजाज्जायते तन्मयोऽङ्कुरः। नासौ नित्यो न चोच्छेदी तद्वद्धर्मेषु योजना॥ ५९॥", "padacchedaText": "", "audioFile": "B_000193.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000194", "originalText": "नाजेषु सर्वधर्मेषु शाश्वताशाश्वताभिधा। यत्र वर्णा न वर्तन्ते विवेकस्तत्र नोच्यते॥ ६०॥", "padacchedaText": "", "audioFile": "B_000194.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000195", "originalText": "यथा स्वप्ने द्वयाभासं चित्तं चलति मायया। तथा जाग्रद्द्वयाभासं चित्तं चलति मायया॥ ६१॥", "padacchedaText": "", "audioFile": "B_000195.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000196", "originalText": "अद्वयं च द्वयाभासं चित्तं स्वप्ने न संशयः। अद्वयं च द्वयाभासं तथा जाग्रन्न संशयः॥ ६२॥", "padacchedaText": "", "audioFile": "B_000196.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000197", "originalText": "स्वप्नदृक्प्रचरन्स्वप्ने दिक्षु वै दशसु स्थितान्। अण्डजान्स्वेदजान्वापि जीवान्पश्यति यान्सदा॥ ६३॥", "padacchedaText": "", "audioFile": "B_000197.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000198", "originalText": "स्वप्नदृक्चित्तदृश्यास्ते न विद्यन्ते ततः पृथक्। तथा तद्दृश्यमेवेदं स्वप्नदृक्चित्तमिष्यते॥ ६४॥", "padacchedaText": "", "audioFile": "B_000198.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000199", "originalText": "चरञ्जागरिते जाग्रद्दिक्षु वै दशसु स्थितान्। अण्डजान्स्वेदजान्वापि जीवान्पश्यति यान्सदा॥ ६५॥", "padacchedaText": "", "audioFile": "B_000199.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000200", "originalText": "जाग्रच्चित्तेक्षणीयास्ते न विद्यन्ते ततः पृथक्। तथा तद्दृश्यमेवेदं जाग्रतश्चित्तमिष्यते॥ ६६॥", "padacchedaText": "", "audioFile": "B_000200.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000201", "originalText": "उभे ह्यन्योन्यदृश्ये ते किं तदस्तीति चोच्यते। लक्षणाशून्यमुभयं तन्मते नैव गृह्यते॥ ६७॥", "padacchedaText": "", "audioFile": "B_000201.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000202", "originalText": "यथा स्वप्नमयो जीवो जायते म्रियतेऽपि च। तथा जीवा अमी सर्वे भवन्ति न भवन्ति च॥ ६८॥", "padacchedaText": "", "audioFile": "B_000202.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000203", "originalText": "यथा मायामयो जीवो जायते म्रियतेऽपि च। तथा जीवा अमी सर्वे भवन्ति न भवन्ति च॥ ६९॥", "padacchedaText": "", "audioFile": "B_000203.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000204", "originalText": "यथा निर्मितको जीवो जायते म्रियतेऽपि च। तथा जीवा अमी सर्वे भवन्ति न भवन्ति च॥ ७०॥", "padacchedaText": "", "audioFile": "B_000204.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000205", "originalText": "न कश्चिज्जायते जीवः सम्भवोऽस्य न विद्यते। एतत्तदुत्तमं सत्यं यत्र किञ्चिन्न जायते॥ ७१॥", "padacchedaText": "", "audioFile": "B_000205.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000206", "originalText": "चित्तस्पन्दितमेवेदं ग्राह्यग्राहकवद्द्वयम्। चित्तं निर्विषयं नित्यमसङ्गं तेन कीर्तितम्॥ ७२॥", "padacchedaText": "", "audioFile": "B_000206.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000207", "originalText": "योऽस्ति कल्पितसंवृत्या परमार्थेन नास्त्यसौ। परतन्त्राभिसंवृत्या स्यान्नास्ति परमार्थतः॥ ७३॥", "padacchedaText": "", "audioFile": "B_000207.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000208", "originalText": "अजः कल्पितसंवृत्या परमार्थेन नाप्यजः। परतन्त्राभिनिष्पत्त्या संवृत्या जायते तु सः॥ ७४॥", "padacchedaText": "", "audioFile": "B_000208.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000209", "originalText": "अभूताभिनिवेशोऽस्ति द्वयं तत्र न विद्यते। द्वयाभावं स बुद्ध्वैव निर्निमित्तो न जायते॥ ७५॥", "padacchedaText": "", "audioFile": "B_000209.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000210", "originalText": "यदा न लभते हेतूनुत्तमाधममध्यमान्। तदा न जायते चित्तं हेत्वभावे फलं कुतः॥ ७६॥", "padacchedaText": "", "audioFile": "B_000210.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000211", "originalText": "अनिमित्तस्य चित्तस्य यानुत्पत्तिः समाद्वया। अजातस्यैव सर्वस्य चित्तदृश्यं हि तद्यतः॥ ७७॥", "padacchedaText": "", "audioFile": "B_000211.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000212", "originalText": "बुद्ध्वानिमित्ततां सत्यां हेतुं पृथगनाप्नुवन्। वीतशोकं तथा काममभयं पदमश्नुते॥ ७८॥", "padacchedaText": "", "audioFile": "B_000212.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000213", "originalText": "अभूताभिनिवेशाद्धि सदृशे तत्प्रवर्तते। वस्त्वभावं स बुद्ध्वैव निःसङ्गं विनिवर्तते॥ ७९॥", "padacchedaText": "", "audioFile": "B_000213.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000214", "originalText": "निवृत्तस्याप्रवृत्तस्य निश्चला हि तदा स्थितिः। विषयः स हि बुद्धानां तत्साम्यमजमद्वयम्॥ ८०॥", "padacchedaText": "", "audioFile": "B_000214.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000215", "originalText": "अजमनिद्रमस्वप्नं प्रभातं भवति स्वयम्। सकृद्विभातो ह्येवैष धर्मो धातुस्वभावतः॥ ८१॥", "padacchedaText": "", "audioFile": "B_000215.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000216", "originalText": "सुखमाव्रियते नित्यं दुःखं विव्रियते सदा। यस्य कस्य च धर्मस्य ग्रहेण भगवानसौ॥ ८२॥", "padacchedaText": "", "audioFile": "B_000216.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000217", "originalText": "अस्ति नास्त्यस्ति नास्तीति नास्ति नास्तीति वा पुनः। चलस्थिरोभयाभावैरावृणोत्येव बालिशः॥ ८३॥", "padacchedaText": "", "audioFile": "B_000217.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000218", "originalText": "कोट्यश्चतस्र एतास्तु ग्रहैर्यासां सदावृतः। भगवानाभिरस्पृष्टो येन दृष्टः स सर्वदृक्॥ ८४॥", "padacchedaText": "", "audioFile": "B_000218.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000219", "originalText": "प्राप्य सर्वज्ञतां कृत्स्नां ब्राह्मण्यं पदमद्वयम्। अनापन्नादिमध्यान्तं किमतः परमीहते॥ ८५॥", "padacchedaText": "", "audioFile": "B_000219.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000220", "originalText": "विप्राणां विनयो ह्येष शमः प्राकृत उच्यते। दमः प्रकृतिदान्तत्वादेवं विद्वाञ्शमं व्रजेत्॥ ८६॥", "padacchedaText": "", "audioFile": "B_000220.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000221", "originalText": "सवस्तु सोपलम्भं च द्वयं लौकिकमिष्यते। अवस्तु सोपलम्भं च शुद्धं लौकिकमिष्यते॥ ८७॥", "padacchedaText": "", "audioFile": "B_000221.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000222", "originalText": "अवस्त्वनुपलम्भं च लोकोत्तरमिति स्मृतम्। ज्ञानं ज्ञेयं च विज्ञेयं सदा बुद्धैः प्रकीर्तितम्॥ ८८॥", "padacchedaText": "", "audioFile": "B_000222.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000223", "originalText": "ज्ञाने च त्रिविधे ज्ञेये क्रमेण विदिते स्वयम्। सर्वज्ञता हि सर्वत्र भवतीह महाधियः॥ ८९॥", "padacchedaText": "", "audioFile": "B_000223.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000224", "originalText": "हेयज्ञेयाप्यपाक्यानि विज्ञेयान्यग्रयाणतः। तेषामन्यत्र विज्ञेयादुपलम्भस्त्रिषु स्मृतः॥ ९०॥", "padacchedaText": "", "audioFile": "B_000224.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000225", "originalText": "प्रकृत्याकाशवज्ज्ञेयाः सर्वे धर्मा अनादयः। विद्यते न हि नानात्वं तेषां क्वचन किञ्चन॥ ९१॥", "padacchedaText": "", "audioFile": "B_000225.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000226", "originalText": "आदिबुद्धाः प्रकृत्यैव सर्वे धर्माः सुनिश्चिताः। यस्यैवं भवति क्षान्तिः सोऽमृतत्वाय कल्पते॥ ९२॥", "padacchedaText": "", "audioFile": "B_000226.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000227", "originalText": "आदिशान्ता ह्यनुत्पन्नाः प्रकृत्यैव सुनिर्वृताः। सर्वे धर्माः समाभिन्ना अजं साम्यं विशारदम्॥ ९३॥", "padacchedaText": "", "audioFile": "B_000227.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000228", "originalText": "वैशारद्यं तु वै नास्ति भेदे विचरतां सदा। भेदनिम्नाः पृथग्वादास्तस्मात्ते कृपणाः स्मृताः॥ ९४॥", "padacchedaText": "", "audioFile": "B_000228.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000229", "originalText": "अजे साम्ये तु ये केचिद्भविष्यन्ति सुनिश्चिताः। ते हि लोके महाज्ञानास्तच्च लोको न गाहते॥ ९५॥", "padacchedaText": "", "audioFile": "B_000229.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000230", "originalText": "अजेष्वजमसङ्क्रान्तं धर्मेषु ज्ञानमिष्यते। यतो न क्रमते ज्ञानमसङ्गं तेन कीर्तितम्॥ ९६॥", "padacchedaText": "", "audioFile": "B_000230.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000231", "originalText": "अणुमात्रेऽपि वैधर्म्ये जायमानेऽविपश्चितः। असङ्गता सदा नास्ति किमुतावरणच्युतिः॥ ९७॥", "padacchedaText": "", "audioFile": "B_000231.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000232", "originalText": "अलब्धावरणाः सर्वे धर्माः प्रकृतिनिर्मलाः। आदौ बुद्धास्तथा मुक्ता बुध्यन्त इति नायकाः॥ ९८॥", "padacchedaText": "", "audioFile": "B_000232.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000233", "originalText": "क्रमते न हि बुद्धस्य ज्ञानं धर्मेषु तायिनः। सर्वे धर्मास्तथा ज्ञानं नैतद्बुद्धेन भाषितम्॥ ९९॥", "padacchedaText": "", "audioFile": "B_000233.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000234", "originalText": "दुर्दर्शमतिगम्भीरमजं साम्यं विशारदम्। बुद्ध्वा पदमनानात्वं नमस्कुर्मो यथाबलम्॥ १००॥", "padacchedaText": "", "audioFile": "B_000234.wav", "zipFile": "MandukyaMula.zip"}, {"id": "B_000235", "originalText": "इति अलातशान्तिप्रकरणम् सम्पूर्णम्॥", "padacchedaText": "", "audioFile": "B_000235.wav", "zipFile": "MandukyaMula.zip"}];
        const contentDiv = document.getElementById('content');
        
        let currentIndex = -1;
        let isPlaying = false;
        
        // Use standard HTML5 audio to preserve pitch on speed changes
        const audioEl = new Audio();
        audioEl.preservesPitch = true;
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            audioEl.playbackRate = this.value;
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        let currentScript = 'devanagari';
        const scriptSelect = document.getElementById('script-select');
        scriptSelect.onchange = function() {
            currentScript = this.value;
            document.querySelectorAll('.sentence-text').forEach((span, index) => {
                let origText = manifest[index].originalText;
                if (currentScript === 'devanagari') {
                    span.innerText = origText;
                } else {
                    span.innerText = Sanscript.t(origText, 'devanagari', currentScript);
                }
            });
        };
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        playPauseBtn.onclick = () => {
            if (isPlaying) {
                audioEl.pause();
                isPlaying = false;
                playPauseBtn.innerText = "Resume";
            } else {
                playAudio(Math.max(0, currentIndex));
                playPauseBtn.innerText = "Stop";
            }
        };
        
        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'sentence-text';
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => {
                playPauseBtn.innerText = "Stop";
                playAudio(index);
            };
            contentDiv.appendChild(div);
        });
        
        // --- HTML5 Audio Prefetching Logic (via Blob URLs) ---
        const PREFETCH_BUFFER_SIZE = 3;
        let prefetchQueue = new Map(); // index -> Blob URL

        function getAudioUrl(index) {
            if (index < 0 || index >= manifest.length) return null;
            const item = manifest[index];
            const zipToUse = item.zipFile || ZIP_NAME;
            return WORKER_URL + '/' + BUCKET_NAME + '/' + zipToUse + '/' + item.audioFile;
        }

        async function fetchBlobUrl(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        async function prefetchNext(fromIndex) {
            for (let i = fromIndex + 1; i <= fromIndex + PREFETCH_BUFFER_SIZE; i++) {
                if (i >= manifest.length) break;
                if (!prefetchQueue.has(i)) {
                    prefetchQueue.set(i, 'fetching');
                    const url = getAudioUrl(i);
                    try {
                        const blobUrl = await fetchBlobUrl(url);
                        if (prefetchQueue.get(i) === 'fetching') {
                            prefetchQueue.set(i, blobUrl);
                        } else {
                            URL.revokeObjectURL(blobUrl);
                        }
                    } catch (err) {
                        console.error("Prefetch failed for index", i, err);
                        prefetchQueue.delete(i);
                    }
                }
            }
            // Cleanup old blobs to free memory
            for (let [key, val] of prefetchQueue.entries()) {
                if (key < fromIndex) {
                    if (typeof val === 'string' && val.startsWith('blob:')) {
                        URL.revokeObjectURL(val);
                    }
                    prefetchQueue.delete(key);
                }
            }
        }
        // ------------------------

        async function playAudio(index) {
            if (index < 0 || index >= manifest.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Start Reading";
                return;
            }
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            audioEl.pause();
            
            try {
                let audioUrl;
                if (prefetchQueue.has(index) && prefetchQueue.get(index) !== 'fetching') {
                    audioUrl = prefetchQueue.get(index);
                } else {
                    const sourceUrl = getAudioUrl(index);
                    audioUrl = await fetchBlobUrl(sourceUrl);
                }
                
                audioEl.src = audioUrl;
                audioEl.playbackRate = speedSlider.value;
                audioEl.onended = () => { playAudio(currentIndex + 1); };
                
                await audioEl.play();
                isPlaying = true;
                
            } catch (e) {
                console.error("Audio play error:", e);
                // Fallback to next track if error
                setTimeout(() => playAudio(currentIndex + 1), 500);
            }
            
            // Trigger prefetch for upcoming sentences
            prefetchNext(index);
        }
    </script>
