: "B_000017", "originalText": "तस्य तु संस्कारार्थान्येव कर्माणि भवन्ति तन्निर्वर्तकप्राणविज्ञानसहितानि।", "padacchedaText": "", "audioFile": "PB_hear2read_000017.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000018", "originalText": "‘देवयाजी श्रेयानात्मयाजी वा’इत्युपक्रम्य ‘आत्मयाजी तु करोतीदं मेऽनेनाङ्गं संस्क्रियते’ इति संस्कारार्थमेव कर्माणीति वाजसनेयके, ‘महायज्ञैश्च यज्ञैश्च ब्राह्मीयं क्रियते तनुः।", "padacchedaText": "", "audioFile": "PB_hear2read_000018.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000019", "originalText": "’ (मनु.२.२८)‘यज्ञो दानं तपश्चैव पावनानि मनीषिणाम्’ (भ.गी.१८.५) इत्यादिस्मृतेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000019.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000020", "originalText": "प्राणादिविज्ञानं च केवलं कर्मसमुच्चितं वा सकामस्य प्राणात्मप्राप्त्यर्थमेव भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000020.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000021", "originalText": "निष्कामस्य त्वात्मज्ञानप्रतिबन्धकनिर्मृष्ट्यै भवत्यादर्शनिर्मार्जनवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000021.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000022", "originalText": "उत्पन्नात्मविद्यस्य त्वनारम्भः, निरर्थकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000022.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000023", "originalText": "‘कर्मणा बध्यते जन्तुर्विद्यया च विमुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000023.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000024", "originalText": "तस्मात्कर्म न कुर्वन्ति यतयः पारदर्शिनः’ (मो.ध.२४१_७) इति, क्रियापथश्चैव पुरस्तात्संन्यासश्च तयोः संन्यास एवात्यरेचयत् इति, ‘त्यागेनैके’ (तै.ना.२८) ‘नान्यः पन्था विद्यते’ (श्वे.३.८) इत्यादिश्रुतिभ्यश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000024.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000025", "originalText": "न्यायाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000025.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000026", "originalText": "उपायभूतानि हि कर्माणि संस्कारद्वारेण ज्ञानस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000026.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000027", "originalText": "ज्ञानेन त्वमृतत्वप्राप्तिः, ‘अमृतत्वं हि विन्दते’ (के.२.४) ‘विद्यया विन्दतेऽमृतम्’ (के.२.४) इत्यादिश्रुतिस्मृतिभ्यश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000027.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000028", "originalText": "न हि नद्याः पारगो नावं न मुञ्चति यथेष्टदेशगमनं प्रति स्वातन्त्र्ये सति।", "padacchedaText": "", "audioFile": "PB_hear2read_000028.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000029", "originalText": "न हि स्वभावसिद्धं वस्तु सिषाधयिषति साधनैः।", "padacchedaText": "", "audioFile": "PB_hear2read_000029.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000030", "originalText": "स्वभावसिद्धश्चात्मा।", "padacchedaText": "", "audioFile": "PB_hear2read_000030.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000031", "originalText": "तथा नापिपयिषितः, आत्मत्वे सति नित्याप्तत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000031.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000032", "originalText": "नापि विचिकारयिषितः, आत्मत्वे सति नित्यत्वादविकारित्वादविषयत्वादमूर्तत्वाच्च, श्रुतेश्च ‘न वर्धते कर्मणा’ (बृ.४.४.२३) इत्यादि, स्मृतेश्च ‘अविकार्योऽयमुच्यते’ (भ.गी.२.२५) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000032.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000033", "originalText": "न च सञ्चिस्कीर्षितः, ‘शुद्धमपापविद्धम्’ (ई.८) इत्यादिश्रुतिभ्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_000033.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000034", "originalText": "अनन्यत्वाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000034.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000035", "originalText": "अन्येनान्यत्संस्क्रियते।", "padacchedaText": "", "audioFile": "PB_hear2read_000035.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000036", "originalText": "न चात्मनोऽन्यभूता क्रियास्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000036.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000037", "originalText": "न च स्वेनैवात्मना स्वमात्मानं सञ्चिस्कीर्षेत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000037.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000038", "originalText": "न च वस्त्वन्तराधानं नित्यप्राप्तिर्वा वस्त्वन्तरस्य नित्या।", "padacchedaText": "", "audioFile": "PB_hear2read_000038.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000039", "originalText": "नित्यत्वं चेष्टं मोक्षस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000039.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000040", "originalText": "अत उत्पन्नविद्यस्य कर्मारम्भोऽनुपपन्नः। अतो व्यावृत्तबाह्यबुद्धेरात्मविज्ञानाय ‘केनेषितम्’ इत्याद्यारम्भः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000040.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000041", "originalText": "केनेषितं पतति प्रेषितं मनः केन प्राणः प्रथमः प्रैति युक्तः। केनेषितां वाचमिमां वदन्ति चक्षुःश्रोत्रं क उ देवो युनक्ति॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000041.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000042", "originalText": "प्रवृत्तिलिङ्गाद्विशेषार्थः प्रश्न उपपन्नः।", "padacchedaText": "", "audioFile": "PB_hear2read_000042.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000043", "originalText": "रथादीनां हि चेतनावदधिष्ठितानां प्रवृत्तिर्दृष्टा, न अनधिष्ठितानाम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000043.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000044", "originalText": "मनआदीनां च अचेतनानां प्रवृत्तिर्दृश्यते, तद्धि लिङ्गं चेतनावतोऽधिष्ठातुरस्तित्वे।", "padacchedaText": "", "audioFile": "PB_hear2read_000044.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000045", "originalText": "करणानि हि मनआदीनि नियमेन प्रवर्तन्ते, तन्नासति चेतनावत्यधिष्ठातर्युपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000045.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000046", "originalText": "तद्विशेषस्य चानधिगमाच्चेतनावत्यधिष्ठातृसामान्ये चाधिगते विशेषार्थः प्रश्न उपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000046.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000047", "originalText": "केनेषितं केनेष्टं कस्येच्छामात्रेण मनः पतति गच्छति, स्वविषये नियमेन व्याप्रियत इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000047.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000048", "originalText": "मनुतेऽनेनेति विज्ञाननिमित्तमन्तःकरणं मनः।", "padacchedaText": "", "audioFile": "PB_hear2read_000048.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000049", "originalText": "प्रेषितमिवेत्युपमार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000049.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000050", "originalText": "न त्विषितप्रेषितशब्दयोरर्थाविह सम्भवतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000050.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000051", "originalText": "न हि शिष्यानिव मनआदीनि विषयेभ्यः प्रेषयत्यात्मा।", "padacchedaText": "", "audioFile": "PB_hear2read_000051.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000052", "originalText": "विविक्तनित्यचित्स्वरूपतया तु निमित्तमात्रं प्रवृत्तौ नित्यचिकित्साधिष्ठातृवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000052.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000053", "originalText": "प्राण इति नासिकाभवः प्रकरणात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000053.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000054", "originalText": "प्रथमत्वं च क्रियायाः प्राणनिमित्तत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000054.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000055", "originalText": "स्वतो विषयावभासमात्रं करणानां प्रवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000055.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000056", "originalText": "चलिक्रिया तु प्राणस्यैव मनआदिषु।", "padacchedaText": "", "audioFile": "PB_hear2read_000056.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000057", "originalText": "तस्मात्प्राथम्यं प्राणस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000057.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000058", "originalText": "प्रैति गच्छति।", "padacchedaText": "", "audioFile": "PB_hear2read_000058.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000059", "originalText": "युक्तः प्रयुक्त इत्येतत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000059.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000060", "originalText": "वाचो वचनं किंनिमित्तं प्राणिनाम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000060.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000061", "originalText": "चक्षुःश्रोत्रयोश्च को देवः प्रयोक्ता। करणानामधिष्ठाता चेतनावान्यः, स किंविशेषण इत्यर्थः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000061.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000062", "originalText": "श्रोत्रस्य श्रोत्रं मनसो मनो यद्वाचो ह वाचं स उ प्राणस्य प्राणः। चक्षुषश्चक्षुरतिमुच्य धीराः प्रेत्यास्माल्लोकादमृता भवन्ति॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000062.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000063", "originalText": "‘श्रोत्रस्य श्रोत्रम्’ इत्यादिप्रतिवचनं निर्विशेषस्य निमित्तत्वार्थम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000063.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000064", "originalText": "विक्रियादिविशेषरहितस्यात्मनो मनआदिप्रवृत्तौ निमित्तत्वमित्येतत् ‘श्रोत्रस्य श्रोत्रम्’ इत्यादिप्रतिवचनस्यार्थः, अनुगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000064.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000065", "originalText": "अनुगतानि ह्यस्मिन्नर्थेऽक्षराणि।", "padacchedaText": "", "audioFile": "PB_hear2read_000065.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000066", "originalText": "कथम्? शृणोत्यनेनेति श्रोत्रम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000066.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000067", "originalText": "तस्य शब्दावभासकत्वं श्रोत्रत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000067.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000068", "originalText": "शब्दोपलब्धृरूपतयावभासकत्वं न स्वतः श्रोत्रस्य, अचिद्रूपत्वात्, आत्मनश्च चिद्रूपत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000068.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000069", "originalText": "यच्छ्रोत्रस्योपलब्धृत्वेनावभासकत्वं तदात्मनिमित्तत्वाच्छ्रोत्रस्य श्रोत्रमित्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000069.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000070", "originalText": "यथा क्षत्रस्य क्षत्रम्, यथा वा उदकस्यौष्ण्यमग्निनिमित्तमिति दग्धुरप्युदकस्य दग्धाग्निरुच्यते उदकमपि ह्यग्निसंयोगादग्निरुच्यते, तद्वत् अनित्यं यत्संयोगादुपलब्धृत्वं तत्करणं श्रोत्रादि।", "padacchedaText": "", "audioFile": "PB_hear2read_000070.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000071", "originalText": "उदकस्येव दग्धृत्वमनित्यं हि तत्र तत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000071.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000072", "originalText": "यत्र तु नित्यमुपलब्धृत्वमग्नाविवौष्ण्यं स नित्योपलब्धिस्वरूपत्वात् दग्धेवोपलब्धोच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000072.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000073", "originalText": "श्रोत्रादिषु श्रोतृत्वाद्युपलब्धिरनित्या, नित्या चात्मनि।", "padacchedaText": "", "audioFile": "PB_hear2read_000073.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000074", "originalText": "अतः श्रोत्रस्य श्रोत्रमित्याद्यक्षराणामर्थानुगमादुपपद्यते निर्विशेषस्योपलब्धिस्वरूपस्यात्मनो मनआदिप्रवृत्तिनिमित्तत्वमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000074.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000075", "originalText": "मनआदिष्वेवं यथोक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000075.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000076", "originalText": "वाचो ह वाचं प्राणस्य प्राण इति विभक्तिद्वयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000076.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000077", "originalText": "सर्वत्रैवं हि द्रष्टव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000077.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000078", "originalText": "कथम्? पृष्टत्वात् स्वरूपनिर्देशः।", "padacchedaText": "", "audioFile": "PB_hear2read_000078.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000079", "originalText": "प्रथमयैव च निर्देशः।", "padacchedaText": "", "audioFile": "PB_hear2read_000079.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000080", "originalText": "तस्य च ज्ञेयत्वात्कर्मत्वमिति द्वितीया।", "padacchedaText": "", "audioFile": "PB_hear2read_000080.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000081", "originalText": "अतो वाचो ह वाचं प्राणस्य प्राण इत्यस्मात्सर्वत्रैव विभक्तिद्वयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000081.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000082", "originalText": "यदेतच्छ्रोत्राद्युपलब्धिनिमित्तं श्रोत्रस्य श्रोत्रमित्यादिलक्षणं तत् नित्योपलब्धिस्वरूपं निर्विशेषमात्मतत्त्वं बुद्ध्वा अतिमुच्य अनवबोधनिमित्ताध्यारोपिताद्बुद्ध्यादिलक्षणात्संसारान्मोक्षणं कृत्वा धीराः धीमन्तः प्रेत्य अस्मात् लोकात् शरीरात् प्रेत्य वियुज्य अन्यस्मिन्नप्रतिसन्धीयमाने निर्निमित्तत्वादमृता भवन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000082.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000083", "originalText": "सति ह्यज्ञाने कर्माणि शरीरान्तरं प्रतिसन्दधते।", "padacchedaText": "", "audioFile": "PB_hear2read_000083.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000084", "originalText": "आत्मावबोधे तु सर्वकर्मारम्भनिमित्ताज्ञानविपरीतविद्याग्निविप्लुष्टत्वात्कर्मणामिति अनारम्भेऽमृता एव भवन्ति। शरीरादिसन्तानाविच्छेदप्रतिसन्धानाद्यपेक्षया अध्यारोपितमृत्युवियोगात्पूर्वमप्यमृताः सन्तो नित्यात्मस्वरूपत्वादमृता भवन्तीत्युपचर्यते॥", "padacchedaText": "", "audioFile": "PB_hear2read_000084.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000085", "originalText": "न तत्र चक्षुर्गच्छति न वाग्गच्छति नो मनः। न विद्मो न विजानीमो यथैतदनुशिष्यात्॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000085.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000086", "originalText": "न तत्र चक्षुर्गच्छतीत्युक्तेऽपि पर्यनुयोगे हेतुरप्रतिपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000086.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000087", "originalText": "‘श्रोत्रस्य श्रोत्रम्’ इत्येवमादिनोक्तेऽप्यात्मतत्त्वे अप्रतिपन्नत्वात्सूक्ष्मत्वहेतोर्वस्तुनः पुनः पुनः पर्यनुयुयुक्षाकारणमाह— न तत्र चक्षुर्गच्छतीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000087.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000088", "originalText": "तत्र श्रोत्राद्यात्मभूते चक्षुरादीनि, वाक्चक्षुषोः सर्वेन्द्रियोपलक्षणार्थत्वात्, न विज्ञानमुत्पादयन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000088.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000089", "originalText": "सुखादिवत्तर्हि गृह्येतान्तःकरणेन अत आह— नो मनः, न सुखादिवन्मनसो विषयस्तत्, इन्द्रियाविषयत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000089.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000090", "originalText": "न विद्मो न विजानीमः अन्तःकरणेन, यथा एतत् ब्रह्म मनआदिकरणजातम् अनुशिष्यात् अनुशासनं कुर्यात् प्रवृत्तिनिमित्तं यथा भवेत्, तथा अविषयत्वान्न विद्मो न विजानीमः।", "padacchedaText": "", "audioFile": "PB_hear2read_000090.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000091", "originalText": "अथवा श्रोत्रादीनां श्रोत्रादिलक्षणं ब्रह्म विशेषेण दर्शयेत्युक्त आचार्य आह— न शक्यते दर्शयितुम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000091.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000092", "originalText": "कस्मात्? न तत्र चक्षुर्गच्छतीत्यादि पूर्ववत्सर्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000092.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000093", "originalText": "अत्र तु विशेषो यथैतदनुशिष्यादिति। यथैतत् अनुशिष्यात् प्रतिपादयेत् अन्योऽपि शिष्यानितोऽन्येन विधिनेत्यभिप्रायः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000093.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000094", "originalText": "अन्यदेव तद्विदितादथो अविदितादधि। इति शुश्रुम पूर्वेषां ये नस्तद्व्याचचक्षिरे॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000094.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000095", "originalText": "सर्वथापि ब्रह्म बोधयेत्युक्त आचार्य आह ‘अन्यदेव तद्विदितादथो अविदितादधि’ इत्यागमम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000095.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000096", "originalText": "विदिताविदिताभ्यामन्यत्त्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000096.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000097", "originalText": "यो हि ज्ञाता स एव सः, सर्वात्मकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000097.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000098", "originalText": "अतः सर्वात्मनो ज्ञातुर्ज्ञात्रन्तराभावाद्विदितादन्यत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000098.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000099", "originalText": "‘स वेत्ति वेद्यं न च तस्यास्ति वेत्ता’ (श्वे.३.१९) इति च मन्त्रवर्णात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000099.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000100", "originalText": "‘विज्ञातारमरे केन विजानीयात्’ (बृ.२.४.१४) इति च वाजसनेयके।", "padacchedaText": "", "audioFile": "PB_hear2read_000100.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000101", "originalText": "अपि च व्यक्तमेव विदितं तस्मादन्यदित्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_hear2read_000101.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000102", "originalText": "यद्विदितं व्यक्तं तदन्यविषयत्वादल्पं सविरोधं ततोऽनित्यम् अत एवानेकत्वादशुद्धम् अत एव तद्विलक्षणं ब्रह्मेति सिद्धम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000102.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000103", "originalText": "अस्तु तर्ह्यविदितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000103.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000104", "originalText": "न, विज्ञानानपेक्षत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000104.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000105", "originalText": "यद्ध्यविदितं तद्विज्ञानापेक्षम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000105.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000106", "originalText": "अविदितविज्ञानाय हि लोकप्रवृत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000106.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000107", "originalText": "इदं तु विज्ञानानपेक्षम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000107.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000108", "originalText": "कस्मात्? विज्ञानस्वरूपत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000108.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000109", "originalText": "न हि यस्य यत्स्वरूपं तत्तेनान्यतोऽपेक्ष्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000109.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000110", "originalText": "न च स्वत एव वापेक्षा, अनपेक्षमेव सिद्धत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000110.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000111", "originalText": "न हि प्रदीपः स्वरूपाभिव्यक्तौ प्रकाशान्तरमन्यतोऽपेक्षते, स्वतो वा।", "padacchedaText": "", "audioFile": "PB_hear2read_000111.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000112", "originalText": "यद्ध्यनपेक्षं तत्स्वत एव सिद्धम्, प्रकाशात्मकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000112.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000113", "originalText": "प्रदीपस्यान्योऽपेक्षितोऽप्यनर्थकः स्यात्, प्रकाशे विशेषाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000113.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000114", "originalText": "न हि प्रदीपस्य स्वरूपाभिव्यक्तौ प्रदीपप्रकाशोऽर्थवान्।", "padacchedaText": "", "audioFile": "PB_hear2read_000114.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000115", "originalText": "न चैवमात्मनोऽन्यत्र विज्ञानमस्ति, येन स्वरूपविज्ञानेऽप्यपेक्ष्येत।", "padacchedaText": "", "audioFile": "PB_hear2read_000115.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000116", "originalText": "विरोध इति चेत्, न, अन्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000116.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000117", "originalText": "स्वरूपविज्ञाने विज्ञानस्वरूपत्वाद्विज्ञानान्तरं नापेक्षत इत्येतदसत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000117.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000118", "originalText": "दृश्यते हि विपरीतज्ञानमात्मनि सम्यग्ज्ञानं च— न जानाम्यात्मानमिति च, श्रुतेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000118.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000119", "originalText": "‘तत्त्वमसि’ (छा.६.८.७) ‘आत्मानमेवावेत्’ (बृ.१.४.१०) ‘एतं वै तमात्मानं विदित्वा’ (बृ.३.५.१) इति च सर्वत्र श्रुतिष्वात्मविज्ञाने विज्ञानान्तरापेक्षत्वं दृश्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000119.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000120", "originalText": "तस्मात्प्रत्यक्षश्रुतिविरोध इति चेत्, न।", "padacchedaText": "", "audioFile": "PB_hear2read_000120.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000121", "originalText": "कस्मात्? अन्यो हि स आत्मा बुद्ध्यादिकार्यकरणसङ्घातात्माभिमानसन्तानाविच्छेदलक्षणोऽविवेकात्मको बुद्ध्याद्यवभासप्रधानश्चक्षुरादिकरणो नित्यचित्स्वरूपात्मान्तःसारो यत्रानित्यं विज्ञानमवभासते।", "padacchedaText": "", "audioFile": "PB_hear2read_000121.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000122", "originalText": "बौद्धप्रत्ययानामाविर्भावतिरोभावधर्मकत्वात्तद्धर्मतयैव विलक्षणमपि चावभासते।", "padacchedaText": "", "audioFile": "PB_hear2read_000122.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000123", "originalText": "अन्तःकरणस्य मनसोऽपि मनोऽन्तर्गतत्वात् सर्वान्तरश्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000123.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000124", "originalText": "अन्तर्गतेन नित्यविज्ञानस्वरूपेण आकाशवदप्रचलितात्मना अन्तर्गर्भभूतेन स बाह्यो बुद्ध्यात्मा तद्विलक्षणः, अनग्निरिवाग्निः अर्चिर्भिरिवाग्नेः प्रत्ययैराविर्भावतिरोभावधर्मकैर्विज्ञानाभासरूपैरनित्यैः अनित्यविज्ञान आत्मा सुखी दुःखी इत्यभ्युपगतो लौकिकैः, अतोऽन्यो नित्यविज्ञानस्वरूपादात्मनः।", "padacchedaText": "", "audioFile": "PB_hear2read_000124.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000125", "originalText": "तत्र हि विज्ञानापेक्षा विपरीतज्ञानत्वं चोपपद्यते, न पुनर्नित्यविज्ञाने।", "padacchedaText": "", "audioFile": "PB_hear2read_000125.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000126", "originalText": "‘तत्त्वमसि’ (छा.६.८.७) इति बोधोपदेशो नोपपद्यत इति चेत्, ‘आत्मानमेवावेत्’ (बृ.१.४.१०) इत्येवमादीनि च, नित्यबोधात्मकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000126.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000127", "originalText": "न ह्यादित्योऽन्येन प्रकाश्यते, अतस्तदर्थबोधोपदेशोऽनर्थक एवेति चेत्, न, लोकाध्यारोपापोहार्थत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000127.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000128", "originalText": "सर्वात्मनि हि नित्यविज्ञाने बुद्ध्याद्यनित्यधर्मा लोकैरध्यारोपिता आत्माविवेकतः, तदपोहार्थो बोधोपदेशो बोधात्मनः।", "padacchedaText": "", "audioFile": "PB_hear2read_000128.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000129", "originalText": "तत्र च बोधाबोधौ समञ्जसौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000129.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000130", "originalText": "अन्यनिमित्तत्वादुदक इवौष्ण्यमग्निनिमित्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000130.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000131", "originalText": "रात्र्यहनी इवादित्यनिमित्ते लोके नित्यावौष्ण्यप्रकाशावग्न्यादित्ययोरन्यत्र भावाभावयोः सनिमित्तत्वादनित्याविवोपचर्येते।", "padacchedaText": "", "audioFile": "PB_hear2read_000131.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000132", "originalText": "धक्ष्यत्यग्निः प्रकाशयिष्यति सविता इति तद्वत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000132.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000133", "originalText": "एवं च सुखदुःखबन्धमोक्षाद्यध्यारोपो लोकस्य तदपेक्ष्य ‘तत्त्वमसि’ (छा.६.८.७) ‘आत्मानमेवावेत्’ इत्यात्मावबोधोपदेशिन्यः श्रुतयः केवलमध्यारोपापोहार्थाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000133.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000134", "originalText": "यथा सवितासौ प्रकाशयत्यात्मानम् इति तद्वत् बोधकर्तृत्वं च नित्यबोधात्मनि।", "padacchedaText": "", "audioFile": "PB_hear2read_000134.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000135", "originalText": "तस्मादन्यदविदितात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000135.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000136", "originalText": "अधिशब्दश्चान्यार्थे।", "padacchedaText": "", "audioFile": "PB_hear2read_000136.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000137", "originalText": "यद्वा यद्धि यस्याधि तत्ततोऽन्यत्सामर्थ्यात्, यथाधि भृत्यादीनां राजा।", "padacchedaText": "", "audioFile": "PB_hear2read_000137.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000138", "originalText": "अव्यक्तमेवाविदितं ततोऽन्यदित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000138.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000139", "originalText": "विदितमविदितं च व्यक्ताव्यक्ते कार्यकारणत्वेन विकल्पिते, ताभ्यामन्यद्ब्रह्म विज्ञानस्वरूपं सर्वविशेषप्रत्यस्तमितमित्ययं समुदायार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000139.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000140", "originalText": "अत एवात्मत्वान्न हेय उपादेयो वा।", "padacchedaText": "", "audioFile": "PB_hear2read_000140.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000141", "originalText": "अन्यद्ध्यन्येन हेयमुपादेयं वा’ न तेनैव तद्यस्य कस्यचिद्घेयमुपादेयं वा भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000141.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000142", "originalText": "आत्मा च ब्रह्म सर्वान्तरत्वादविषयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000142.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000143", "originalText": "अतोऽन्यस्यापि न हेयमुपादेयं वा।", "padacchedaText": "", "audioFile": "PB_hear2read_000143.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000144", "originalText": "अन्याभावाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000144.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000145", "originalText": "इति शुश्रुम पूर्वेषामित्यागमोपदेशः।", "padacchedaText": "", "audioFile": "PB_hear2read_000145.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000146", "originalText": "व्याचचक्षिरे इत्यस्वातन्त्र्यं तर्कप्रतिषेधार्थम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000146.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000147", "originalText": "ये नः तत् ब्रह्म उक्तवन्तः ते तमेवागमं ब्रह्मप्रतिपादकं व्याख्यातवन्तः, न पुनः स्वबुद्धिप्रभवेण तर्केणोक्तवन्त इति तस्यैव द्रढिम्ने आगमपारम्पर्याविच्छेदं दर्शयति विद्यास्तुतये।", "padacchedaText": "", "audioFile": "PB_hear2read_000147.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000148", "originalText": "तर्कस्त्वनवस्थितो भ्रान्तोऽपि भवतीति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000148.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000149", "originalText": "यद्वाचानभ्युदितं येन वागभ्युद्यते। तदेव ब्रह्म त्वं विद्धि नेदं यदिदमुपासते॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000149.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000150", "originalText": "यद्वाचेति मन्त्रानुवादो दृढप्रतीत्यै।", "padacchedaText": "", "audioFile": "PB_hear2read_000150.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000151", "originalText": "‘अन्यदेव तद्विदितात्’ इति योऽयमागमार्थो ब्राह्मणोक्तः अस्यैव द्रढिम्ने इमे मन्त्राः यद्वाचा इत्यादयः पठ्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000151.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000152", "originalText": "यत् ब्रह्म वाचा शब्देन अनभ्युदितम् अनभ्युक्तम्, अप्रकाशितमित्येतत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000152.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000153", "originalText": "येन वागभ्युद्यत इति वाक्प्रकाशहेतुत्वोक्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000153.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000154", "originalText": "येन प्रकाश्यत इति वाचोऽभिधानस्य अभिधेयप्रकाशकत्वस्य हेतुत्वमुच्यते ब्रह्मणः।", "padacchedaText": "", "audioFile": "PB_hear2read_000154.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000155", "originalText": "उक्तं च ‘केनेषितां वाचमिमां वदन्ति’ (के.१.१) ‘यद्वाचो ह वाचम्’ (के.१.२) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000155.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000156", "originalText": "तदेव ब्रह्म त्वं विद्धि इत्यविषयत्वेन ब्रह्मण आत्मन्यवस्थापनार्थ आम्नायः।", "padacchedaText": "", "audioFile": "PB_hear2read_000156.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000157", "originalText": "यद्वाचानभ्युदितं वाक्प्रकाशनिमित्तं चेति ब्रह्मणोऽविषयत्वेन वस्त्वन्तरजिघृक्षां निवर्त्य स्वात्मन्येवावस्थापयत्याम्नायः तदेव ब्रह्म त्वं विद्धि इति, यत्नत उपरमयति नेदमित्युपास्यप्रतिषेधाच्च॥", "padacchedaText": "", "audioFile": "PB_hear2read_000157.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000158", "originalText": "यन्मनसा न मनुते येनाहुर्मनो मतम्। तदेव ब्रह्म त्वं विद्धि नेदं यदिदमुपासते॥ ६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000158.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000159", "originalText": "यच्चक्षुषा न पश्यति येन चक्षूंषि पश्यति। तदेव ब्रह्म त्वं विद्धि नेदं यदिदमुपासते॥ ७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000159.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000160", "originalText": "यच्छ्रोत्रेण न शृणोति येन श्रोत्रमिदं श्रुतम्। तदेव ब्रह्म त्वं विद्धि नेदं यदिदमुपासते॥ ८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000160.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000161", "originalText": "यत्प्राणेन न प्राणिति येन प्राणः प्रणीयते। तदेव ब्रह्म त्वं विद्धि नेदं यदिदमुपासते॥ ९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000161.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000162", "originalText": "यन्मनसेत्यादि समानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000162.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000163", "originalText": "मनो मतमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000163.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000164", "originalText": "येन ब्रह्मणा मनोऽपि विषयीकृतं नित्यविज्ञानस्वरूपेणेत्येतत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000164.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000165", "originalText": "सर्वकरणानामविषयस्तानि च सव्यापाराणि सविषयाणि नित्यविज्ञानस्वरूपावभासतया येनावभास्यन्त इति श्लोकार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000165.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000166", "originalText": "‘क्षेत्रं क्षेत्री तथा कृत्स्नं प्रकाशयति भारत’ (भ.गी.१३.३३) इति स्मृतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000166.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000167", "originalText": "‘तस्य भासा’ (मु.२.२.१०) इति चाथर्वणे। येन प्राण इति क्रियाशक्तिरप्यात्मविज्ञाननिमित्तेत्येतत्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000167.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000168", "originalText": "इति प्रथमखण्डभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000168.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000169", "originalText": "द्वितीयः खण्डः\nयदि मन्यसे सु वेदेति दभ्रमेवापि नूनं त्वं वेत्थ ब्रह्मणो रूपं यदस्य त्वं यदस्य देवेष्वथ नु मीमांस्यमेव ते मन्ये विदितम्॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000169.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000170", "originalText": "यदि मन्यसे सु वेदेति शिष्यबुद्धिविचालना गृहीतस्थिरतायै।", "padacchedaText": "", "audioFile": "PB_hear2read_000170.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000171", "originalText": "विदिताविदिताभ्यां निवर्त्य बुद्धिं शिष्यस्य स्वात्मन्यवस्थाप्य ‘तदेव ब्रह्म त्वं विद्धि’ इति स्वाराज्येऽभिषिच्य उपास्यप्रतिषेधेनाथास्य बुद्धिं विचालयति— यदि मन्यसे सुष्ठु वेद अहं ब्रह्मतत्त्वमिति, ततोऽल्पमेव ब्रह्मणो रूपं वेत्थ त्वमिति नूनं निश्चितं मन्यते आचार्यः।", "padacchedaText": "", "audioFile": "PB_hear2read_000171.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000172", "originalText": "सा पुनर्विचालना किमर्थेति, उच्यते— पूर्वगृहीते वस्तुनि बुद्धेः स्थिरतायै।", "padacchedaText": "", "audioFile": "PB_hear2read_000172.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000173", "originalText": "देवेष्वपि सु वेदाहमिति मन्यते यः सोऽप्यस्य ब्रह्मणो रूपं दभ्रमेव वेत्ति नूनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000173.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000174", "originalText": "कस्मात्? अविषयत्वात्कस्यचिद्ब्रह्मणः।", "padacchedaText": "", "audioFile": "PB_hear2read_000174.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000175", "originalText": "अथवा अल्पमेवास्याध्यात्मिकं मनुष्येषु देवेषु चाधिदैविकमस्य ब्रह्मणो यद्रूपं तदिति सम्बन्धः।", "padacchedaText": "", "audioFile": "PB_hear2read_000175.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000176", "originalText": "अथ नु इति हेतुर्मीमांसायाः।", "padacchedaText": "", "audioFile": "PB_hear2read_000176.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000177", "originalText": "यस्माद्दभ्रमेव सुविदितं ब्रह्मणो रूपम् ‘अन्यदेव तद्विदितात्’ इत्युक्तत्वात्, सु वेदेति च मन्यसे, अतः अल्पमेव वेत्थ त्वं ब्रह्मणो रूपं यस्मात् अथ नु तस्मात् मीमांस्यमेव अद्यापि ते तव ब्रह्म विचार्यमेव यावद्विदिताविदितप्रतिषेधागमार्थानुभव इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000177.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000178", "originalText": "मन्ये विदितमिति शिष्यस्य मीमांसानन्तरोक्तिः प्रत्ययत्रयसङ्गतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000178.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000179", "originalText": "सम्यग्वस्तुनिश्चयाय विचालितः शिष्य आचार्येण मीमांस्यमेव ते इति चोक्तः एकान्ते समाहितो भूत्वा विचार्य यथोक्तं सुपरिनिश्चितः सन्नाह आगमाचार्यात्मानुभवप्रत्ययत्रयस्यैकविषयत्वेन सङ्गत्यर्थम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000179.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000180", "originalText": "एवं हि ‘सुपरिनिष्ठिता विद्या सफला स्यान्नानिश्चिता’ इति न्यायः प्रदर्शितो भवति, मन्ये विदितमिति परिनिष्ठितनिश्चितविज्ञानप्रतिज्ञाहेतूक्तेः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000180.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000181", "originalText": "नाह मन्ये सु वेदेति नो न वेदेति वेद च। यो नस्तद्वेद तद्वेद नो न वेदेति वेद च॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000181.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000182", "originalText": "परिनिष्ठितं सफलं विज्ञानं प्रतिजानीते आचार्यात्मनिश्चययोस्तुल्यतायै यस्माद्धेतुमाह— नाह मन्ये सु वेदेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000182.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000183", "originalText": "अहेत्यवधारणार्थो निपातः।", "padacchedaText": "", "audioFile": "PB_hear2read_000183.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000184", "originalText": "नैव मन्ये इत्येतत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000184.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000185", "originalText": "यावदपरिनिष्ठितं विज्ञानं तावत् सु वेद सुष्ठु वेद अहं ब्रह्मेति विपरीतो मम निश्चय आसीत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000185.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000186", "originalText": "सोऽपजगाम भवद्भिर्विचालितस्य यथोक्तार्थमीमांसाफलभूतात्स्वात्मब्रह्मत्वनिश्चयरूपात्सम्यक्प्रत्ययात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000186.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000187", "originalText": "विरुद्धत्वादतो नाह मन्ये सु वेदेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000187.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000188", "originalText": "यस्माच्चैतत् नैव न वेद नो न वेदेति, मन्ये इत्यनुवर्तते, अविदितब्रह्मप्रतिषेधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000188.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000189", "originalText": "कथं तर्हि मन्यसे इत्युक्त आह— वेद च।", "padacchedaText": "", "audioFile": "PB_hear2read_000189.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000190", "originalText": "च—शब्दाद्वेद च न वेद च इत्यभिप्रायः, विदिताविदिताभ्यामन्यत्वाद्ब्रह्मणः।", "padacchedaText": "", "audioFile": "PB_hear2read_000190.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000191", "originalText": "तस्मान्मया विदितं ब्रह्मेति मन्ये इति वाक्यार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000191.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000192", "originalText": "अथवा वेद चेति नित्यविज्ञानब्रह्मस्वरूपतया नो न वेद वेदैव चाहं स्वरूपविक्रियाभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000192.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000193", "originalText": "विशेषविज्ञानं च पराध्यस्तं न स्वत इति परमार्थतो न च वेदेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000193.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000194", "originalText": "यो नस्तद्वेद तद्वेदेति पक्षान्तरनिरासार्थमाम्नाय उक्तार्थानुवादात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000194.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000195", "originalText": "यः नः अस्माकं मध्ये तद्वेद स एव तद्ब्रह्म वेद नान्यः, उपास्यब्रह्मवित्त्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000195.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000196", "originalText": "अतोऽन्यस्य यथाहं वेदेति पक्षान्तरे ब्रह्मवित्त्वं निरस्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000196.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000197", "originalText": "कुतोऽयमर्थोऽवसीयत इति, उच्यते— उक्तानुवादात्। उक्तं ह्यनुवदति नो न वेदेति वेद चेति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000197.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000198", "originalText": "यस्यामतं तस्य मतं मतं यस्य न वेद सः। अविज्ञातं विजानतां विज्ञातमविजानताम्॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000198.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000199", "originalText": "यस्यामतमिति श्रौतमाख्यायिकार्थोपसंहारार्थम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000199.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000200", "originalText": "शिष्याचार्योक्तिप्रत्युक्तिलक्षणया अनुभवयुक्तिप्रधानया आख्यायिकया योऽर्थः सिद्धः स श्रौतेन वचनेनागमप्रधानेन निगमनस्थानीयेन सङ्क्षेपत उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000200.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000201", "originalText": "यदुक्तं विदिताविदिताभ्यामन्यद्वागादीनामगोचरत्वात् मीमांसितं चानुभवोपपत्तिभ्यां ब्रह्म, तत्तथैव ज्ञातव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000201.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000202", "originalText": "कस्मात्? यस्यामतं यस्य विविदिषाप्रयुक्तप्रवृत्तस्य साधकस्य अमतम् अविज्ञातम् अविदितं ब्रह्म इत्यात्मतत्त्वनिश्चयफलावसानावबोधतया विविदिषा निवृत्तेत्यभिप्रायः, तस्य मतं ज्ञातम्, तेन विदितं ब्रह्म येनाविषयत्वेन आत्मत्वेन प्रतिबुद्धमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000202.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000203", "originalText": "स सम्यग्दर्शी यस्य विज्ञानानन्तरमेव ब्रह्मात्मभावस्यावसितत्वात् सर्वतः कार्यभावो विपर्ययेण मिथ्याज्ञानो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000203.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000204", "originalText": "कथम्? मतं विदितं ज्ञातं मया ब्रह्म इति यस्य विज्ञानम्, स मिथ्यादर्शी विपरीतविज्ञानो विदितादन्यत्वाद्ब्रह्मणो न वेद सः न विजानाति।", "padacchedaText": "", "audioFile": "PB_hear2read_000204.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000205", "originalText": "ततश्च सिद्धमवैदिकस्य विज्ञानस्य मिथ्यात्वम्, अब्रह्मविषयतया निन्दितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000205.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000206", "originalText": "तथा कपिलकणभुगादिसमयस्यापि विदितब्रह्मविषयत्वात् अनवस्थिततर्कजन्यत्वाविदितविषयतया विविदिषानिवृत्तेश्च मिथ्यात्वमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000206.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000207", "originalText": "स्मृतेश्च— ‘या वेदबाह्याः स्मृतयो याश्च काश्च कुदृष्टयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000207.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000208", "originalText": "सर्वास्ता निष्फलाः प्रोक्तास्तमोनिष्ठा हि ताः स्मृताः’ (मनु.१२.९५) इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000208.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000209", "originalText": "‘अविज्ञातं विजानतां विज्ञातमविजानताम्’ इति पूर्वहेतूक्तिः अनुवादस्यानर्थक्यात्— अनुवादमात्रेऽनर्थकं वचनमिति विपर्ययमिथ्याज्ञानयोर्नष्टत्वात् पूर्वोक्तयोः यस्यामतमित्यादिज्ञानाज्ञानयोर्हेत्वर्थत्वेनेदमुच्यते— अविज्ञातम् अविदितमात्मत्वेनाविषयतया ब्रह्म विजानतां यस्मात्, तस्मात्तदेव ज्ञानं यत्तेषां विज्ञातं विदितं व्यक्तमेव बुद्ध्यादिविषयं ब्रह्म अविजानतां विदिताविदितव्यावृत्तमात्मभूतं नित्यविज्ञानस्वरूपमात्मस्थमविक्रियममृतमजरमभयमनन्यत्वादविषयमित्येवमविजानतां बुद्ध्यादिविषयात्मतयैव नित्यं विज्ञातं ब्रह्म।", "padacchedaText": "", "audioFile": "PB_hear2read_000209.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000210", "originalText": "तस्माद्विदिताविदितव्यक्ताव्यक्तधर्माध्यारोपेण कार्यकारणभावेन सविकल्पमयथार्थविषयत्वात्। शुक्तिकादौ रजताद्यध्यारोपणज्ञानवन्मिथ्याज्ञानं तेषाम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000210.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000211", "originalText": "प्रतिबोधविदितं मतममृतत्वं हि विन्दते। आत्मना विन्दते वीर्यं विद्यया विन्दतेऽमृतम्॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000211.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000212", "originalText": "प्रतिबोधविदितमिति वीप्साप्रत्ययानामात्मावबोधद्वारत्वात् बोधं प्रति बोधं प्रतीति वीप्सा सर्वप्रत्ययव्याप्त्यर्था।", "padacchedaText": "", "audioFile": "PB_hear2read_000212.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000213", "originalText": "बौद्धा हि सर्वे प्रत्ययास्तप्तलोहवन्नित्यविज्ञानस्वरूपात्मव्याप्तत्वाद्विज्ञानस्वरूपावभासाः तदन्यावभासश्चात्मा तद्विलक्षणोऽग्निवदुपलभ्यत इति ते द्वारीभवन्त्यात्मोपलब्धौ।", "padacchedaText": "", "audioFile": "PB_hear2read_000213.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000214", "originalText": "तस्मात्प्रतिबोधावभासप्रत्यगात्मतया यद्विदितं तद्ब्रह्म, तदेव मतं तदेव सम्यग्ज्ञानं यत्प्रत्यगात्मविज्ञानम्, न विषयविज्ञानम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000214.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000215", "originalText": "आत्मत्वेन ‘प्रत्यगात्मानमैक्षत्’ (क.२.१.१) इति च काठके।", "padacchedaText": "", "audioFile": "PB_hear2read_000215.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000216", "originalText": "अमृतत्वं हि विन्दते इति हेतुवचनं विपर्यये मृत्युप्राप्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000216.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000217", "originalText": "विषयात्मविज्ञाने हि मृत्युः प्रारभते इत्यात्मविज्ञानममृतत्वनिमित्तमिति युक्तं हेतुवचनममृतत्वं हि विन्दते इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000217.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000218", "originalText": "आत्मज्ञानेन किममृतत्वमुत्पाद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000218.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000219", "originalText": "न।", "padacchedaText": "", "audioFile": "PB_hear2read_000219.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000220", "originalText": "कथं तर्हि? आत्मना विन्दते स्वेनैव नित्यात्मस्वभावेनामृतत्वं विन्दते, नालम्बनपूर्वकं विन्दत इति आत्मविज्ञानापेक्षम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000220.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000221", "originalText": "यदि हि विद्योत्पाद्यममृतत्वं स्यात्, अनित्यं भवेत्कर्मकार्यवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000221.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000222", "originalText": "अतो न विद्योत्पाद्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000222.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000223", "originalText": "यदि चात्मनैवामृतत्वं विन्दते, किं पुनर्विद्यया क्रियत इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000223.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000224", "originalText": "अनात्मविज्ञानं निवर्तयन्ती सा तन्निवृत्त्या स्वाभाविकस्यामृतत्वस्य निमित्तमिति कल्प्यते, यत आह— वीर्यं विद्यया विन्दते।", "padacchedaText": "", "audioFile": "PB_hear2read_000224.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000225", "originalText": "वीर्यं सामर्थ्यम् अनात्माध्यारोपमायास्वान्तध्वान्तानभिभाव्यलक्षणं बलं विद्यया विन्दते।", "padacchedaText": "", "audioFile": "PB_hear2read_000225.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000226", "originalText": "तच्च किंविशिष्टम्? अमृतम् अविनाशि।", "padacchedaText": "", "audioFile": "PB_hear2read_000226.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000227", "originalText": "अविद्याजं हि वीर्यं विनाशि, विद्ययाविद्याया बाध्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000227.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000228", "originalText": "न तु विद्याया बाधकोऽस्तीति विद्याजममृतं वीर्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000228.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000229", "originalText": "अतो विद्या अमृतत्वे निमित्तमात्रं भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000229.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000230", "originalText": "‘नायमात्मा बलहीनेन लभ्यः’ (मु.३.२.४) इति चाथर्वणे।", "padacchedaText": "", "audioFile": "PB_hear2read_000230.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000231", "originalText": "लोकेऽपि विद्याजमेव बलमभिभवति न शरीरादिसामर्थ्यम्, यथा हस्त्यादेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000231.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000232", "originalText": "अथवा प्रतिबोधविदितं मतमिति सकृदेवाशेषविपरीतनिरस्तसंस्कारेण स्वप्नप्रतिबोधवद्यद्विदितं तदेव मतं ज्ञातं भवतीति।", "padacchedaText": "", "audioFile": "PB_hear2read_000232.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000233", "originalText": "अथवा गुरूपदेशः प्रतिबोधः।", "padacchedaText": "", "audioFile": "PB_hear2read_000233.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000234", "originalText": "तेन वा विदितं मतमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000234.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000235", "originalText": "उभयत्र प्रतिबोधशब्दप्रयोगोऽस्ति— ‘सुप्तप्रतिबुद्धः’ ‘गुरुणा प्रतिबोधितः’ इति। पूर्वं तु यथार्थम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000235.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000236", "originalText": "इह चेदवेदीदथ सत्यमस्ति न चेदिहावेदीन्महती विनष्टिः। भूतेषु भूतेषु विचित्य धीराः प्रेत्यास्माल्लोकादमृता भवन्ति॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000236.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000237", "originalText": "इह चेदवेदीदिति अवश्यकर्तव्यतोक्तिः विपर्यये विनाशश्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000237.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000238", "originalText": "इह मनुष्यजन्मनि सति अवश्यमात्मा वेदितव्य इत्येतद्विधीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000238.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000239", "originalText": "कथम्? इह चेत् अवेदीत् विदितवान्, अथ सत्यं परमार्थतत्त्वम् अस्ति अवाप्तम्, तस्य जन्म सफलमित्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_hear2read_000239.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000240", "originalText": "न चेदिहावेदीत् न विदितवान्, वृथैव जन्म।", "padacchedaText": "", "audioFile": "PB_hear2read_000240.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000241", "originalText": "अपि च महती विनष्टिः महान्विनाशो जन्ममरणप्रबन्धाविच्छेदप्राप्तिलक्षणः स्याद्यतः, तस्मादवश्यं तद्विच्छेदाय ज्ञेय आत्मा।", "padacchedaText": "", "audioFile": "PB_hear2read_000241.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000242", "originalText": "ज्ञानेन तु किं स्यादिति, उच्यते— भूतेषु भूतेषु चराचरेषु सर्वेष्वित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000242.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000243", "originalText": "विचित्य विचार्य पृथङ्निष्कृष्यैकमात्मतत्त्वं संसारधर्मैरस्पृष्टमात्मभावेनोपलभ्येत्यर्थः, अनेकार्थत्वाद्धातूनाम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000243.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000244", "originalText": "न पुनश्चित्वेति सम्भवति, विरोधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000244.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000245", "originalText": "धीराः धीमन्तः विवेकिनः विनिवृत्तबाह्यविषयाभिलाषाः, प्रेत्य मृत्वा अस्मात् लोकात् शरीराद्यनात्मलक्षणात् व्यावृत्तममत्वाहङ्काराः सन्त इत्यर्थः, अमृताः अमरणधर्माणो नित्यविज्ञानामृतत्वस्वभावा एव भवन्ति॥", "padacchedaText": "", "audioFile": "PB_hear2read_000245.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000246", "originalText": "इति द्वितीयखण्डभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000246.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000247", "originalText": "तृतीयः खण्डः\nब्रह्म ह देवेभ्यो विजिग्ये तस्य ह ब्रह्मणो विजये देवा अमहीयन्त त ऐक्षन्तास्माकमेवायं विजयोऽस्माकमेवायं महिमेति॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000247.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000248", "originalText": "तद्धैषां विजज्ञौ तेभ्यो ह प्रादुर्बभूव तन्न व्यजानत किमिदं यक्षमिति॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000248.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000249", "originalText": "तेऽग्निमब्रुवन् जातवेद एतद्विजानीहि किमेतद्यक्षमिति तथेति॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000249.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000250", "originalText": "तदभ्यद्रवत्तमभ्यवदत् कोऽसीत्यग्निर्वा अहमस्मीत्यब्रवीज्जातवेदा वा अहमस्मीति॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000250.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000251", "originalText": "तस्मिंस्त्वयि किं वीर्यमित्यपीदं सर्वं दहेयं यदिदं पृथिव्यामिति॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000251.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000252", "originalText": "तस्मै तृणं निदधावेतद्दहेति तदुपप्रेयाय सर्वजवेन तन्न शशाक दग्धुं स तत एव निववृते नैतदशकं विज्ञातुं यदेतद्यक्षमिति॥ ६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000252.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000253", "originalText": "अथ वायुमब्रुवन् वायवेतद्विजानीहि किमेतद्यक्षमिति तथेति॥ ७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000253.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000254", "originalText": "तदभ्यद्रवत्तमभ्यवदत्कोऽसीति वायुर्वा अहमस्मीत्यब्रवीन्मातरिश्वा वा अहमस्मीति॥ ८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000254.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000255", "originalText": "तस्मिंस्त्वयि किं वीर्यमित्यपीदं सर्वमाददीय यदिदं पृथिव्यामिति॥ ९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000255.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000256", "originalText": "तस्मै तृणं निदधावेतदादत्स्वेति तदुपप्रेयाय सर्वजवेन तन्न शशाकादातुं स तत एव निववृते नैतदशकं विज्ञातुं यदेतद्यक्षमिति॥ १०॥", "padacchedaText": "", "audioFile": "PB_hear2read_000256.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000257", "originalText": "अथेन्द्रमब्रुवन्मघवन्नेतद्विजानीहि किमेतद्यक्षमिति तथेति तदभ्यद्रवत्तस्मात्तिरोदधे॥ ११॥", "padacchedaText": "", "audioFile": "PB_hear2read_000257.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000258", "originalText": "स तस्मिन्नेवाकाशे स्त्रियमाजगाम बहु शोभमानामुमां हैमवतीं तां होवाच किमेतद्यक्षमिति॥ १२॥", "padacchedaText": "", "audioFile": "PB_hear2read_000258.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000259", "originalText": "ब्रह्म ह देवेभ्य इति ब्रह्मणो दुर्विज्ञेयतोक्तिः यत्नाधिक्यार्था।", "padacchedaText": "", "audioFile": "PB_hear2read_000259.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000260", "originalText": "समाप्ता ब्रह्मविद्या यदधीनः पुरुषार्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000260.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000261", "originalText": "अत ऊर्ध्वमर्थवादेन ब्रह्मणो दुर्विज्ञेयतोच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000261.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000262", "originalText": "तद्विज्ञाने कथं नु नाम यत्नमधिकं कुर्यादिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000262.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000263", "originalText": "शमाद्यर्थो वाम्नायः अभिमानशातनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000263.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000264", "originalText": "शमादि वा ब्रह्मविद्यासाधनं विधित्सितं तदर्थोऽयमर्थवादाम्नायः।", "padacchedaText": "", "audioFile": "PB_hear2read_000264.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000265", "originalText": "न हि शमादिसाधनरहितस्य अभिमानरागद्वेषादियुक्तस्य ब्रह्मविज्ञाने सामर्थ्यमस्ति, व्यावृत्तबाह्यमिथ्याप्रत्ययग्राह्यत्वाद्ब्रह्मणः।", "padacchedaText": "", "audioFile": "PB_hear2read_000265.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000266", "originalText": "यस्माच्चाग्न्यादीनां जयाभिमानं शातयति, ततश्च ब्रह्मविज्ञानं दर्शयत्यभिमानोपशमे, तस्माच्छमादिसाधनविधानार्थोऽयमर्थवाद इत्यवसीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000266.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000267", "originalText": "सगुणोपासनार्थो वा, अपोदितत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000267.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000268", "originalText": "‘नेदं यदिदमुपासते’ (के.१.५) (के.१.६) (के.१.७) (के.१.८) (के.१.९) इत्युपास्यत्वं ब्रह्मणोऽपोदितम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000268.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000269", "originalText": "अपोदितत्वादनुपास्यत्वे प्राप्ते तस्यैव ब्रह्मणः सगुणत्वेनाधिदैवतमध्यात्मं चोपासनं विधातव्यमित्येवमर्थो वेति।", "padacchedaText": "", "audioFile": "PB_hear2read_000269.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000270", "originalText": "अधिदैवतम् ‘तद्वनमित्युपासितव्यम्’ (के.४.६) इति हि वक्ष्यति।", "padacchedaText": "", "audioFile": "PB_hear2read_000270.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000271", "originalText": "ब्रह्मेति परः, लिङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000271.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000272", "originalText": "न ह्यन्यत्र परादीश्वरान्नित्यसर्वज्ञात्परिभूयाग्न्यादींस्तृणं वज्रीकर्तुं सामर्थ्यमस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000272.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000273", "originalText": "‘तन्न शशाक दग्धुम्’ (के.३.६) इत्यादिलिङ्गाद्ब्रह्मशब्दवाच्य ईश्वर इत्यवसीयते।", "padacchedaText": "", "audioFile": "PB_hear2read_000273.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000274", "originalText": "न ह्यन्यथा अग्निस्तृणं दग्धुं नोत्सहते वायुर्वा आदातुम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000274.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000275", "originalText": "ईश्वरेच्छया तु तृणमपि वज्रीभवतीत्युपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000275.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000276", "originalText": "तत्सिद्धिर्जगतो नियतप्रवृत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000276.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000277", "originalText": "श्रुतिस्मृतिप्रसिद्धिभिर्नित्यसर्वविज्ञाने ईश्वरे सर्वात्मनि सर्वशक्तौ सिद्धेऽपि शास्त्रार्थनिश्चयार्थमुच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000277.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000278", "originalText": "तस्येश्वरस्य सद्भावसिद्धिः कुतो भवतीति, उच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000278.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000279", "originalText": "यदिदं जगद्देवगन्धर्वयक्षरक्षःपितृपिशाचादिलक्षणं द्युवियत्पृथिव्यादित्यचन्द्रग्रहनक्षत्रविचित्रं विविधप्राण्युपभोगयोग्यस्थानसाधनसम्बन्धि, तदत्यन्तकुशलशिल्पिभिरपि दुर्निर्माणं देशकालनिमित्तानुरूपनियतप्रवृत्तिनिवृत्तिक्रमम् एतद्भोक्तृकर्मविभागज्ञप्रयत्नपूर्वकं भवितुमर्हति, कार्यत्वे सति यथोक्तलक्षणत्वात्, गृहप्रासादरथशयनासनादिवत्, विपक्षे आत्मादिवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000279.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000280", "originalText": "कर्मण एवेति चेत्, न, परतन्त्रस्य निमित्तमात्रत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000280.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000281", "originalText": "यदिदमुपभोगवैचित्र्यं प्राणिनां तत्साधनवैचित्र्यं च देशकालनिमित्तानुरूपनियतप्रवृत्तिनिवृत्तिक्रमं च, तन्न नित्यसर्वज्ञकर्तृकम्, किं तर्हि, कर्मण एव, तस्याचिन्त्यप्रभावत्वात् सर्वैश्च फलहेतुत्वाभ्युपगमाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000281.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000282", "originalText": "सति कर्मणः फलहेतुत्वे किमीश्वराधिककल्पनयेति न नित्यस्येश्वरस्य नित्यसर्वज्ञशक्तेः फलहेतुत्वं चेति चेत्, न, कर्मण एवोपभोगवैचित्र्याद्युपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000282.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000283", "originalText": "कस्मात्? कर्तृतन्त्रत्वात्कर्मणः।", "padacchedaText": "", "audioFile": "PB_hear2read_000283.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000284", "originalText": "चितिमत्प्रयत्ननिर्वृत्तं हि कर्म तत्प्रयत्नोपरमादुपरतं सद्देशान्तरे कालान्तरे वा नियतनिमित्तविशेषापेक्षं कर्तुः फलं जनयिष्यतीति न युक्तमनपेक्ष्यान्यदात्मनः प्रयोक्तृ, कर्तैव फलकाले प्रयोक्तेति चेत्, मया निवर्तितोऽसि त्वां प्रयोक्ष्ये फलाय यदात्मानुरूपं फलमिति न देशकालनिमित्तविशेषानभिज्ञत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000284.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000285", "originalText": "यदि हि कर्ता देशादिविशेषाभिज्ञः सन्स्वातन्त्र्येण कर्म नियुञ्ज्यात्, ततोऽनिष्टफलस्याप्रयोक्ता स्यात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000285.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000286", "originalText": "न च निर्निमित्तं तदनिच्छयात्मसमवेतं तच्चर्मवद्विकरोति कर्म।", "padacchedaText": "", "audioFile": "PB_hear2read_000286.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000287", "originalText": "न चात्मकृतमकर्तृसमवेतमयस्कान्तमणिवदाक्रष्टृ भवति, प्रधानकर्तृसमवेतत्वात्कर्मणः।", "padacchedaText": "", "audioFile": "PB_hear2read_000287.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000288", "originalText": "भूताश्रयमिति चेत्, न, साधनत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000288.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000289", "originalText": "कर्तृक्रियायाः साधनभूतानि भूतानि क्रियाकालेऽनुभूतव्यापाराणि समाप्तौ च हलादिवत्कर्त्रा परित्यक्तानि न फलं कालान्तरे कर्तुमुत्सहन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000289.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000290", "originalText": "न हि हलं क्षेत्राद्व्रीहीन्गृहं प्रवेशयति।", "padacchedaText": "", "audioFile": "PB_hear2read_000290.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000291", "originalText": "भूतकर्मणोश्चाचेतनत्वात्स्वतः प्रवृत्त्यनुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000291.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000292", "originalText": "वायुवदिति चेत्, न, असिद्धत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000292.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000293", "originalText": "न हि वायोरचितिमतः स्वतः प्रवृत्तिः सिद्धा, रथादिष्वदर्शनात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000293.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000294", "originalText": "शास्त्रात्कर्मण एवेति चेत्— शास्त्रं हि क्रियातः फलसिद्धिमाह नेश्वरादेः ‘स्वर्गकामो यजेत’ इत्यादि।", "padacchedaText": "", "audioFile": "PB_hear2read_000294.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000295", "originalText": "न च प्रमाणाधिगतत्वादानर्थक्यं युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000295.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000296", "originalText": "न चेश्वरास्तित्वे प्रमाणान्तरमस्तीति चेत्, न, दृष्टन्यायहानानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000296.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000297", "originalText": "क्रिया हि द्विविधा दृष्टफला अदृष्टफला च।", "padacchedaText": "", "audioFile": "PB_hear2read_000297.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000298", "originalText": "दृष्टफलापि द्विविधा अनन्तरफला कालान्तरफला च।", "padacchedaText": "", "audioFile": "PB_hear2read_000298.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000299", "originalText": "अनन्तरफला गतिभुजिलक्षणा।", "padacchedaText": "", "audioFile": "PB_hear2read_000299.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000300", "originalText": "कालान्तरफला च कृषिसेवादिलक्षणा।", "padacchedaText": "", "audioFile": "PB_hear2read_000300.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000301", "originalText": "तत्रानन्तरफला फलापवर्गिण्येव।", "padacchedaText": "", "audioFile": "PB_hear2read_000301.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000302", "originalText": "कालान्तरफला तु उत्पन्नप्रध्वंसिनी।", "padacchedaText": "", "audioFile": "PB_hear2read_000302.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000303", "originalText": "आत्मसेव्याद्यधीनं हि कृषिसेवादेः फलं यतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000303.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000304", "originalText": "न चोभयन्यायव्यतिरेकेण स्वतन्त्रं कर्म ततो वा फलं दृष्टम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000304.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000305", "originalText": "तथा च कर्मफलप्राप्तौ न दृष्टन्यायहानमुपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000305.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000306", "originalText": "तस्माच्छान्ते यागादिकर्मणि नित्यः कर्तृकर्मफलविभागज्ञ ईश्वरः सेव्यादिवद्यागाद्यनुरूपफलदातोपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000306.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000307", "originalText": "स चात्मभूतः सर्वस्य सर्वक्रियाफलप्रत्ययसाक्षी नित्यविज्ञानस्वभावः संसारधर्मैरसंस्पृष्टः।", "padacchedaText": "", "audioFile": "PB_hear2read_000307.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000308", "originalText": "श्रुतेश्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000308.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000309", "originalText": "‘न लिप्यते लोकदुःखेन बाह्यः’ (क.२.२.११) ‘जरां मृत्युमत्येति’ (बृ.३.५.१) ‘विजरो विमृत्युः’ (छा.८.७.१) ‘सत्यकामः सत्यसङ्कल्पः’ (छा.८.७.१) ‘एष सर्वेश्वरः’ (बृ.४.४.२२) ‘पुण्यं कर्म कारयति’ ‘अनश्नन्नन्यो अभिचाकशीति’ (मु.३.१.१) ‘एतस्य वा अक्षरस्य प्रशासने’ (बृ.३.८.९) इत्याद्या असंसारिण एकस्यात्मनो नित्यमुक्तस्य सिद्धौ श्रुतयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000309.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000310", "originalText": "स्मृतयश्च सहस्रशो विद्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000310.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000311", "originalText": "न चार्थवादाः शक्यन्ते कल्पयितुम्, अनन्ययोगित्वे सति विज्ञानोत्पादकत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000311.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000312", "originalText": "न चोत्पन्नं विज्ञानं बाध्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000312.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000313", "originalText": "अप्रतिषेधाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000313.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000314", "originalText": "न चेश्वरो नास्तीति निषेधोऽस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000314.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000315", "originalText": "प्राप्त्यभावादिति चेत्, न, उक्तत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000315.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000316", "originalText": "‘न हिंस्यात्’ इतिवत्प्राप्त्यभावात्प्रतिषेधो नारभ्यत इति चेत्, न, ईश्वरसद्भावे न्यायस्योक्तत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000316.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000317", "originalText": "अथवा अप्रतिषेधादिति कर्मणः फलदाने ईश्वरकालादीनां न प्रतिषेधोऽस्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000317.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000318", "originalText": "न च निमित्तान्तरनिरपेक्षं केवलेन कर्त्रैव प्रयुक्तं फलदं दृष्टम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000318.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000319", "originalText": "न च विनष्टोऽपि यागः कालान्तरे फलदो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000319.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000320", "originalText": "सेव्यबुद्धिवत्सेवकेन सर्वज्ञेश्वरबुद्धौ तु संस्कृतायां यागादिकर्मणा विनष्टेऽपि कर्मणि सेव्यादिवेश्वरात्फलं कर्तुर्भवतीति युक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000320.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000321", "originalText": "न तु पुनः पदार्था वाक्यशतेनापि देशान्तरे कालान्तरे वा स्वं स्वं स्वभावं जहति।", "padacchedaText": "", "audioFile": "PB_hear2read_000321.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000322", "originalText": "न हि देशकालान्तरेषु चाग्निरनुष्णो भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000322.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000323", "originalText": "एवं कर्मणोऽपि कालान्तरे फलं द्विप्रकारमेवोपलभ्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000323.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000324", "originalText": "बीजक्षेत्रसंस्कारपरिरक्षाविज्ञानवत्कर्त्रपेक्षफलं कृष्यादि, विज्ञानवत्सेव्यबुद्धिसंस्कारापेक्षफलं च सेवादि।", "padacchedaText": "", "audioFile": "PB_hear2read_000324.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000325", "originalText": "यागादेः कर्मणस्तथाविज्ञानवत्कर्त्रपेक्षफलत्वानुपपत्तौ कालान्तरफलत्वात्कर्मदेशकालनिमित्तविपाकविभागज्ञबुद्धिसंस्कारापेक्षं फलं भवितुमर्हति, सेवादिकर्मानुरूपफलज्ञसेव्यबुद्धिसंस्कारापेक्षफलस्येव।", "padacchedaText": "", "audioFile": "PB_hear2read_000325.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000326", "originalText": "तस्मात्सिद्धः सर्वज्ञ ईश्वरः सर्वजन्तुबुद्धिकर्मफलविभागसाक्षी सर्वभूतान्तरात्मा।", "padacchedaText": "", "audioFile": "PB_hear2read_000326.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000327", "originalText": "‘यत्साक्षादपरोक्षात्’ (बृ.३.४.१) ‘य आत्मा सर्वान्तरः’ (बृ.३.४.१) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_hear2read_000327.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000328", "originalText": "स एव चात्रात्मा जन्तूनाम्, ‘नान्योऽतोऽस्ति द्रष्टा श्रोता मन्ता विज्ञाता’ (बृ.३.७.२३) ‘नान्यदतोऽस्ति विज्ञातृ’ (बृ.३.८.११) इत्याद्यात्मान्तरप्रतिषेधश्रुतेः ‘तत्त्वमसि’ (छा.६.८.७) इति चात्मत्वोपदेशात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000328.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000329", "originalText": "न हि मृत्पिण्डः काञ्चनात्मत्वेनोपदिश्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000329.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000330", "originalText": "ज्ञानशक्तिकर्मोपास्योपासकशुद्धाशुद्धमुक्तामुक्तभेदादात्मभेद एवेति चेत्, न, भेददृष्ट्यपवादात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000330.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000331", "originalText": "यदुक्तं संसारिणः ईश्वारादनन्या इति तन्न।", "padacchedaText": "", "audioFile": "PB_hear2read_000331.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000332", "originalText": "किं तर्हि? भेद एव संसार्यात्मनाम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000332.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000333", "originalText": "कस्मात्? लक्षणभेदात्, अश्वमहिषवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000333.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000334", "originalText": "कथं लक्षणभेद इति, उच्यते— ईश्वरस्य तावन्नित्यं सर्वविषयं ज्ञानं सवितृप्रकाशवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000334.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000335", "originalText": "तद्विपरीतं संसारिणां खद्योतस्येव।", "padacchedaText": "", "audioFile": "PB_hear2read_000335.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000336", "originalText": "तथैव शक्तिभेदोऽपि।", "padacchedaText": "", "audioFile": "PB_hear2read_000336.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000337", "originalText": "नित्या सर्वविषया चेश्वरशक्तिः, विपरीतेतरस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000337.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000338", "originalText": "कर्म च चित्स्वरूपात्मसत्तामात्रनिमित्तमीश्वरस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000338.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000339", "originalText": "औष्ण्यस्वरूपद्रव्यसत्तामात्रनिमित्तदहनकर्मवत् राजायस्कान्तप्रकाशकर्मवच्च स्वात्मनोऽविक्रिया रूपम्, विपरीतमितरस्य।", "padacchedaText": "", "audioFile": "PB_hear2read_000339.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000340", "originalText": "‘उपासीत’ इति वचनादुपास्य ईश्वरो गुरुराजवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000340.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000341", "originalText": "उपासकश्चेतरः शिष्यभृत्यवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000341.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000342", "originalText": "अपहतपाप्मादिश्रवणान्नित्यशुद्ध ईश्वरः।", "padacchedaText": "", "audioFile": "PB_hear2read_000342.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000343", "originalText": "‘पुण्यो वै पुण्येन’ (बृ.३.२.१३) इति वचनाद्विपरीत इतरः।", "padacchedaText": "", "audioFile": "PB_hear2read_000343.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000344", "originalText": "अत एव नित्यमुक्त ईश्वरः।", "padacchedaText": "", "audioFile": "PB_hear2read_000344.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000345", "originalText": "नित्याशुद्धियोगात्संसारीतरः।", "padacchedaText": "", "audioFile": "PB_hear2read_000345.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000346", "originalText": "यत्र च ज्ञानादिलक्षणभेदोऽस्ति तत्र भेदो दृष्टः यथा अश्वमहिषयोः।", "padacchedaText": "", "audioFile": "PB_hear2read_000346.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000347", "originalText": "तथा ज्ञानादिलक्षणभेदादीश्वरादात्मनां भेदोऽस्तीति चेत्, न।", "padacchedaText": "", "audioFile": "PB_hear2read_000347.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000348", "originalText": "कस्मात्? ‘अन्योऽसावन्योऽहमस्मीति न स वेद’ (बृ.१.४.१०) ‘ते क्षय्यलोका भवन्ति’ (छा.७.२५.२) ‘मृत्योः स मृत्युमाप्नोति’ (क.२.१.१०) इति भेददृष्टिर्ह्यपोद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000348.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000349", "originalText": "एकत्वप्रतिपादिन्यश्च श्रुतयः सहस्रशो विद्यन्ते।", "padacchedaText": "", "audioFile": "PB_hear2read_000349.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000350", "originalText": "यदुक्तं ज्ञानादिलक्षणभेदादिति अत्रोच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000350.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000351", "originalText": "न, अनभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000351.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000352", "originalText": "बुद्ध्यादिभ्यो व्यतिरिक्ता विलक्षणाश्चेश्वराद्भिन्नलक्षणा आत्मानो न सन्ति।", "padacchedaText": "", "audioFile": "PB_hear2read_000352.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000353", "originalText": "एक एवेश्वरश्चात्मा सर्वभूतानां नित्यमुक्तोऽभ्युपगम्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000353.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000354", "originalText": "बाह्यश्च बुद्ध्यादिसमाहारसन्तानाहङ्कारममत्वादिविपरीतप्रत्ययप्रबन्धाविच्छेदलक्षणो नित्यशुद्धबुद्धमुक्तस्वरूपविज्ञानात्मेश्वरगर्भो नित्यविज्ञानावभासः चित्तचैत्त्यबीजबीजिस्वभावः कल्पितोऽनित्यविज्ञान ईश्वरलक्षणविपरीतोऽभ्युपगम्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000354.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000355", "originalText": "यस्याविच्छेदे संसारव्यवहारः, विच्छेदे च मोक्षव्यवहारः।", "padacchedaText": "", "audioFile": "PB_hear2read_000355.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000356", "originalText": "अन्यश्च मृत्प्रलेपवत्प्रत्यक्षप्रध्वंसो देवपितृमनुष्यादिलक्षणो भूतविशेषसमाहारो न पुनश्चतुर्थोऽन्यो भिन्नलक्षण ईश्वरादभ्युपगम्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000356.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000357", "originalText": "बुद्ध्यादिकल्पितात्मव्यतिरेकाभिप्रायेण तु लक्षणभेदादित्याश्रयासिद्धो हेतुः, ईश्वरादन्यस्यात्मनोऽसत्त्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000357.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000358", "originalText": "ईश्वरस्यैव विरुद्धलक्षणत्वमयुक्तमिति चेत् सुखदुःखादियोगश्च, न, निमित्तत्वे सति लोकविपर्ययाध्यारोपणात्, सवितृवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000358.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000359", "originalText": "यथा हि सविता नित्यप्रकाशरूपत्वाल्लोकाभिव्यक्त्यनभिव्यक्तिनिमित्तत्वे सति लोकदृष्टिविपर्ययेणोदयास्तमयाहोरात्रादिकर्तृत्वाध्यारोपभाग्भवति, एवमीश्वरे नित्यविज्ञानशक्तिरूपे लोकज्ञानापोहसुखदुःखस्मृत्यादिनिमित्तत्वे सति लोकविपरीतबुद्ध्याध्यारोपितं विपरीतलक्षणत्वं सुखदुःखादयश्च, न स्वतः।", "padacchedaText": "", "audioFile": "PB_hear2read_000359.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000360", "originalText": "आत्मदृष्ट्यनुरूपाध्यारोपाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000360.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000361", "originalText": "यथा घनादिविप्रकीर्णेऽम्बरे येनैव सवितृप्रकाशो न दृश्यते, स आत्मदृष्ट्यनुरूपमेवाध्यस्यति सवितेदानीमिह न प्रकाशयतीति सत्येव प्रकाशेऽन्यत्र भ्रान्त्या।", "padacchedaText": "", "audioFile": "PB_hear2read_000361.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000362", "originalText": "एवमिह बौद्धादिवृत्त्युद्भवाभिभवाकुलभ्रान्त्याध्यारोपितः सुखदुःखादियोग उपपद्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000362.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000363", "originalText": "तत्स्मरणाच्च।", "padacchedaText": "", "audioFile": "PB_hear2read_000363.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000364", "originalText": "तस्यैव ईश्वरस्यैव हि स्मरणम् ‘मत्तः स्मृतिर्ज्ञानमपोहनं च’ (भ.गी.१५.१५) ‘नादत्ते कस्यचित्पापम्’ (भ.गी.५.१५) इत्यादि।", "padacchedaText": "", "audioFile": "PB_hear2read_000364.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000365", "originalText": "अतो नित्यमुक्त एकस्मिन्सवितरीव लोकाविद्याध्यारोपितमीश्वरे संसारित्वम्, शास्त्रादिप्रामाण्यादभ्युपगतमसंसारित्वमित्यविरोध इति।", "padacchedaText": "", "audioFile": "PB_hear2read_000365.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000366", "originalText": "एतेन प्रत्येकं ज्ञानादिभेदः प्रत्युक्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000366.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000367", "originalText": "सौक्ष्म्यचैतन्यसर्वगतत्वाद्यविशेषे च भेदहेत्वभावात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000367.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000368", "originalText": "विक्रियावत्त्वे चानित्यत्वात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000368.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000369", "originalText": "मोक्षे च विशेषानभ्युपगमात् अभ्युपगमे चानित्यत्वप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000369.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000370", "originalText": "अविद्यावदुपलभ्यत्वाच्च भेदस्य तत्क्षयेऽनुपपत्तिरिति सिद्धमेकत्वम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000370.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000371", "originalText": "तस्माच्छरीरेन्द्रियमनोबुद्धिविषयवेदनासन्तानस्याहङ्कारसम्बन्धादज्ञानबीजस्य नित्यविज्ञानान्यनिमित्तस्यात्मतत्त्वयाथात्म्यविज्ञानाद्विनिवृत्तावज्ञानबीजस्य विच्छेद आत्मनो मोक्षसंज्ञा, विपर्यये च बन्धसंज्ञा, स्वरूपापेक्षत्वादुभयोः।", "padacchedaText": "", "audioFile": "PB_hear2read_000371.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000372", "originalText": "ब्रह्म— ह इत्यैतिह्यार्थः— पुरा किल देवासुरसङ्ग्रामे जगत्स्थितिपरिपिपालयिषया आत्मानुशासनानुवर्तिभ्यो देवेभ्यः अर्थिभ्योऽर्थाय विजिग्ये अजैषीदसुरान्।", "padacchedaText": "", "audioFile": "PB_hear2read_000372.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000373", "originalText": "ब्रह्मण इच्छानिमित्तो विजयो देवानां बभूवेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000373.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000374", "originalText": "तस्य ह ब्रह्मणो विजये देवा अमहीयन्त।", "padacchedaText": "", "audioFile": "PB_hear2read_000374.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000375", "originalText": "यज्ञादिलोकस्थित्यपहारिष्वसुरेषु पराजितेषु देवा वृद्धिं पूजां वा प्राप्तवन्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000375.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000376", "originalText": "त ऐक्षन्तेति मिथ्याप्रत्ययत्वाद्धेयत्वख्यापनार्थ आम्नायः।", "padacchedaText": "", "audioFile": "PB_hear2read_000376.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000377", "originalText": "ईश्वरनिमित्ते विजये स्वसामर्थ्यनिमित्तोऽस्माकमेवायं विजयोऽस्माकमेवायं महिमेत्यात्मनो जयादिश्रेयोनिमित्तं सर्वात्मानमात्मस्थं सर्वकल्याणास्पदमीश्वरमेवात्मत्वेनाबुद्ध्वा पिण्डमात्राभिमानाः सन्तो यं मिथ्याप्रत्ययं चक्रुः तस्य पिण्डमात्रविषयत्वेन मिथ्याप्रत्ययत्वात्सर्वात्मेश्वरयाथात्म्यावबोधेन हातव्यताख्यापनार्थः तद्धैषामित्याद्याख्यायिकाम्नायः।", "padacchedaText": "", "audioFile": "PB_hear2read_000377.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000378", "originalText": "तद्ब्रह्म ह किल एषां देवानामभिप्रायं मिथ्याहङ्काररूपं विजज्ञौ विज्ञातवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000378.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000379", "originalText": "ज्ञात्वा च मिथ्याभिमानशातनेन तदनुजिघृक्षया देवेभ्योऽर्थाय तेषामेवेन्द्रियगोचरे नातिदूरे प्रादुर्बभूव महेश्वरशक्तिमायोपात्तेनात्यन्ताद्भुतेन प्रादुर्भूतं किल केनचिद्रूपविशेषेण।", "padacchedaText": "", "audioFile": "PB_hear2read_000379.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000380", "originalText":
