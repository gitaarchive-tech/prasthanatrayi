 "तत्किलोपलभमाना अपि देवा न व्यजानत न विज्ञातवन्तः किमिदं यदेतद्यक्षं पूज्यमिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000380.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000381", "originalText": "तद्विज्ञानायाग्निमब्रुवन्।", "padacchedaText": "", "audioFile": "PB_hear2read_000381.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000382", "originalText": "तृणनिधानेऽयमभिप्रायः— अत्यन्तसम्भावितयोरग्निमारुतयोस्तृणदहनादानाशक्त्या आत्मसम्भावना शातिता भवेदिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000382.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000383", "originalText": "इन्द्र आदित्यो वज्रभृद्वा, अविरोधात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000383.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000384", "originalText": "इन्द्रोपसर्पणे ब्रह्म तिरोदध इत्यस्यायमभिप्रायः— इन्द्रोऽहमित्यधिकतमोऽभिमानोऽस्य, सोऽहमग्न्यादिभिः प्राप्तं वाक्सम्भाषणमात्रमप्यनेन न प्राप्तोऽस्मीत्यभिमानं कथं न नाम जह्यादिति।", "padacchedaText": "", "audioFile": "PB_hear2read_000384.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000385", "originalText": "तदनुग्रहायैवान्तर्हितं तद्ब्रह्म बभूव।", "padacchedaText": "", "audioFile": "PB_hear2read_000385.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000386", "originalText": "स शान्ताभिमान इन्द्रः अत्यर्थं ब्रह्म विजिज्ञासुः यस्मिन्नाकाशे ब्रह्मणः प्रादुर्भाव आसीत्तिरोधानं च, तस्मिन्नेव स्त्रियमतिरूपिणीं विद्यामाजगाम।", "padacchedaText": "", "audioFile": "PB_hear2read_000386.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000387", "originalText": "अभिप्रायोद्बोधहेतुत्वाद्रुद्रपत्नी उमा हैमवतीव बहु शोभमाना विद्यैव। विरूपोऽपि विद्यावान्बहु शोभते॥", "padacchedaText": "", "audioFile": "PB_hear2read_000387.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000388", "originalText": "इति तृतीयखण्डभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000388.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000389", "originalText": "चतुर्थः खण्डः\nब्रह्मेति होवाच ब्रह्मणो वा एतद्विजये महीयध्वमिति ततो हैव विदाञ्चकार ब्रह्मेति॥ १॥", "padacchedaText": "", "audioFile": "PB_hear2read_000389.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000390", "originalText": "तस्माद्वा एते देवा अतितरामिवान्यान्देवान्यदग्निर्वायुरिन्द्रस्ते ह्येनन्नेदिष्ठं पस्पर्शुस्ते ह्येनत्प्रथमो विदाञ्चकार ब्रह्मेति॥ २॥", "padacchedaText": "", "audioFile": "PB_hear2read_000390.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000391", "originalText": "तस्माद्वा इन्द्रोऽतितरामिवान्यान्देवान्स ह्येनन्नेदिष्ठं पस्पर्श स ह्येनत्प्रथमो विदाञ्चकार ब्रह्मेति॥ ३॥", "padacchedaText": "", "audioFile": "PB_hear2read_000391.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000392", "originalText": "तस्यैष आदेशो यदेतद्विद्युतो व्यद्युतदा३ इतीन्न्यमीमिषदा३ इत्यधिदैवतम्॥ ४॥", "padacchedaText": "", "audioFile": "PB_hear2read_000392.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000393", "originalText": "तां च पृष्ट्वा तस्या एव वचनात् विदाञ्चकार विदितवान्।", "padacchedaText": "", "audioFile": "PB_hear2read_000393.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000394", "originalText": "अत इन्द्रस्य बोधहेतुत्वाद्विद्यैवोमा।", "padacchedaText": "", "audioFile": "PB_hear2read_000394.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000395", "originalText": "‘विद्यासहायवानीश्वरः’ इति स्मृतिः।", "padacchedaText": "", "audioFile": "PB_hear2read_000395.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000396", "originalText": "यस्मादिन्द्रविज्ञानपूर्वकमग्निवाय्विन्द्रास्ते हि एनत् नेदिष्ठम् अतिसमीपं ब्रह्मविद्यया ब्रह्म प्राप्ताः सन्तः पस्पर्शुः स्पृष्टवन्तः।", "padacchedaText": "", "audioFile": "PB_hear2read_000396.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000397", "originalText": "ते हि एनत् प्रथमः प्रथमं विदाञ्चकार विदाञ्चक्रुरित्येतत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000397.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000398", "originalText": "तस्मात् अतितराम् अतीत्य अतिशयेन दीप्यन्तेऽन्यान् देवान्।", "padacchedaText": "", "audioFile": "PB_hear2read_000398.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000399", "originalText": "ततोऽपीन्द्रोऽतितरां दीप्यते, आदौ ब्रह्मविज्ञानात्।", "padacchedaText": "", "audioFile": "PB_hear2read_000399.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000400", "originalText": "तस्यैष आदेशः तस्य ब्रह्मण एष वक्ष्यमाणः आदेशः उपासनोपदेश इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000400.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000401", "originalText": "यस्माद्देवेभ्यो विद्युदिव सहसैव प्रादुर्भूतं ब्रह्म द्युतिमत्, तस्माद्विद्युतो विद्योतनं यथा यदेतद्ब्रह्म व्यद्युतत् विद्योतितवत्।", "padacchedaText": "", "audioFile": "PB_hear2read_000401.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000402", "originalText": "आ इत्युपमार्थ आ—शब्दः।", "padacchedaText": "", "audioFile": "PB_hear2read_000402.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000403", "originalText": "यथा घनान्धकारं विदार्य विद्युत्सर्वतः प्रकाशते, एवं तद्ब्रह्म देवानां पुरतः सर्वतःप्रकाशवद्व्यक्तीभूतम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000403.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000404", "originalText": "अतो व्यद्युतदिवेत्युपास्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000404.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000405", "originalText": "‘यथा सकृद्विद्युतम्’ (बृ.२.३.६) इति च वाजसनेयके।", "padacchedaText": "", "audioFile": "PB_hear2read_000405.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000406", "originalText": "यस्माच्चेन्द्रोपसर्पणकाले न्यमीमिषत्— यथा कश्चिच्चक्षुर्निमेषणं कृतवानिति। इतीदित्यनर्थकौ निपातौ— निमिषितवदिव तिरोभूतमित्येवमधिदैवतं देवताया अधि यद्दर्शनमधिदैवतं तत्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000406.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000407", "originalText": "अथाध्यात्मं यदेतद्गच्छतीव च मनोऽनेन चैतदुपस्मरत्यभीक्ष्णं सङ्कल्पः॥ ५॥", "padacchedaText": "", "audioFile": "PB_hear2read_000407.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000408", "originalText": "अथ अनन्तरम् अध्यात्मम् आत्मनः अधि आत्मविषयम् अध्यात्मम् उच्यत इति वाक्यशेषः।", "padacchedaText": "", "audioFile": "PB_hear2read_000408.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000409", "originalText": "यदेतत् यथोक्तलक्षणं ब्रह्म गच्छतीव प्राप्नोतीव विषयीकरोतीवेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000409.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000410", "originalText": "न पुनर्विषयीकरोति मनः, अविषयत्वाद्ब्रह्मणः।", "padacchedaText": "", "audioFile": "PB_hear2read_000410.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000411", "originalText": "अतो मनो न गच्छति।", "padacchedaText": "", "audioFile": "PB_hear2read_000411.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000412", "originalText": "‘येनाहुर्मनो मतम्’ (के.१.५) इति चोक्तम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000412.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000413", "originalText": "गच्छतीवेति तु मनसोऽपि मनस्त्वात् आत्मभूतत्वाच्च ब्रह्मणः तत्समीपे मनो वर्तते इति उपस्मरति अनेन मनसैव तद्ब्रह्म विद्वान्यस्मात्, तस्माद्ब्रह्म गच्छतीवेत्युच्यते।", "padacchedaText": "", "audioFile": "PB_hear2read_000413.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000414", "originalText": "अभीक्ष्णं पुनः पुनः।", "padacchedaText": "", "audioFile": "PB_hear2read_000414.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000415", "originalText": "सङ्कल्पः ब्रह्मप्रेषितस्य मनसः। अत उपस्मरणसङ्कल्पादिभिर्लिङ्गैर्ब्रह्म मनआद्यात्मभूतमित्युपास्यमित्यभिप्रायः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000415.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000416", "originalText": "तद्ध तद्वनं नाम तद्वनमित्युपासितव्यं स य एतदेवं वेदाभि हैनं सर्वाणि भूतानि संवाञ्छन्ति॥ ६॥", "padacchedaText": "", "audioFile": "PB_hear2read_000416.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000417", "originalText": "तस्य चाध्यात्ममुपासने गुणो विधीयते— तद्ध तद्वनं तदेतद्ब्रह्म तच्च तद्वनं च तत् परोक्षं वनं सम्भजनीयम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000417.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000418", "originalText": "वनतेस्तत्कर्मणः।", "padacchedaText": "", "audioFile": "PB_hear2read_000418.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000419", "originalText": "तस्मात्तद्वनं नाम।", "padacchedaText": "", "audioFile": "PB_hear2read_000419.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000420", "originalText": "ब्रह्मणो गौणं हीदं नाम।", "padacchedaText": "", "audioFile": "PB_hear2read_000420.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000421", "originalText": "तस्मादनेन गुणेन तद्वनमित्युपासितव्यम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000421.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000422", "originalText": "स यः कश्चिदेतद्यथोक्तमेवं यथोक्तेन गुणेन वनमित्यनेन नाम्नाभिधेयं ब्रह्म वेद उपास्ते तस्यैतत्फलमुच्यते— सर्वाणि भूतानि एनम् उपासकम् अभिसंवाञ्छन्ति इहाभिसम्भजन्ते सेवंते स्मेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000422.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000423", "originalText": "यथागुणोपासनं हि फलम्। उपनिषदं भो ब्रूहीत्युक्ता त उपनिषद्ब्राह्मीं वाव त उपनिषदमब्रूमेति॥ ७॥", "padacchedaText": "", "audioFile": "PB_hear2read_000423.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000424", "originalText": "उपनिषदं भो ब्रूहीत्युक्तायामुपनिषदि शिष्येणोक्त आचार्य आह— उक्ता कथिता ते तुभ्यम् उपनिषदात्मोपासनम्।", "padacchedaText": "", "audioFile": "PB_hear2read_000424.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000425", "originalText": "अधुना ब्राह्मीं वाव ते तुभ्यं ब्रह्मणो ब्राह्मणजातेः उपनिषदम् अब्रूम वक्ष्याम इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000425.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000426", "originalText": "वक्ष्यति हि।", "padacchedaText": "", "audioFile": "PB_hear2read_000426.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000427", "originalText": "ब्राह्मी नोक्ता।", "padacchedaText": "", "audioFile": "PB_hear2read_000427.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000428", "originalText": "उक्ता त्वात्मोपनिषत्। तस्मान्न भूताभिप्रायोऽब्रूमेत्ययं शब्दः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000428.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000429", "originalText": "तस्यै तपो दमः कर्मेति प्रतिष्ठा वेदाः सर्वाङ्गानि सत्यमायतनम्॥ ८॥", "padacchedaText": "", "audioFile": "PB_hear2read_000429.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000430", "originalText": "तस्यै तस्या वक्ष्यमाणाया उपनिषदः तपः ब्रह्मचर्यादि दमः उपशमः कर्म अग्निहोत्रादि इत्येतानि प्रतिष्ठा आश्रयः।", "padacchedaText": "", "audioFile": "PB_hear2read_000430.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000431", "originalText": "एतेषु हि सत्सु ब्राह्म्युपनिषत्प्रतिष्ठिता भवति।", "padacchedaText": "", "audioFile": "PB_hear2read_000431.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000432", "originalText": "वेदाः चत्वारः अङ्गानि च सर्वाणि।", "padacchedaText": "", "audioFile": "PB_hear2read_000432.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000433", "originalText": "प्रतिष्ठेत्यनुवर्तते।", "padacchedaText": "", "audioFile": "PB_hear2read_000433.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000434", "originalText": "ब्रह्माश्रया हि विद्या।", "padacchedaText": "", "audioFile": "PB_hear2read_000434.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000435", "originalText": "सत्यं यथाभूतवचनमपीडाकरम् आयतनं निवासः। सत्यवत्सु हि सर्वं यथोक्तमायतन इवावस्थितम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000435.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000436", "originalText": "यो वा एतामेवं वेदापहत्य पाप्मानमनन्ते स्वर्गे लोके ज्येये प्रतितिष्ठति प्रतितिष्ठति॥ ९॥", "padacchedaText": "", "audioFile": "PB_hear2read_000436.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000437", "originalText": "तामेतां तपआद्यङ्गां तत्प्रतिष्ठां ब्राह्मीमुपनिषदं सायतनामात्मज्ञानहेतुभूताम् एवं यथावत् यो वेद अनुवर्तते अनुतिष्ठति, तस्यैतत्फलमाह— अपहत्य पाप्मानम् अपक्षय्य धर्माधर्मावित्यर्थः।", "padacchedaText": "", "audioFile": "PB_hear2read_000437.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000438", "originalText": "अनन्ते अपारे अविद्यमानान्ते स्वर्गे लोके सुखप्राये निर्दुःखात्मनि परे ब्रह्मणि ज्येये महति सर्वमहत्तरे प्रतितिष्ठति सर्ववेदान्तवेद्यं ब्रह्म आत्मत्वेनावगम्य तदेव ब्रह्म प्रतिपद्यत इत्यर्थः॥", "padacchedaText": "", "audioFile": "PB_hear2read_000438.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}, {"id": "B_000439", "originalText": "इति चतुर्थखण्डभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_hear2read_000439.mp3", "zipFile": "002b_KenaVakyaBhashya.zip"}];
        const contentDiv = document.getElementById('content');
        
        let currentIndex = -1;
        let isPlaying = false;
        
        // Use standard HTML5 audio to preserve pitch on speed changes
        const audioEl = new Audio();
        audioEl.preservesPitch = true;
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            audioEl.playbackRate = this.value;
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        let currentScript = 'devanagari';
        const scriptSelect = document.getElementById('script-select');
        scriptSelect.onchange = function() {
            currentScript = this.value;
            document.querySelectorAll('.sentence-text').forEach((span, index) => {
                let origText = manifest[index].originalText;
                if (currentScript === 'devanagari') {
                    span.innerText = origText;
                } else {
                    span.innerText = Sanscript.t(origText, 'devanagari', currentScript);
                }
            });
        };
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        playPauseBtn.onclick = () => {
            if (isPlaying) {
                audioEl.pause();
                isPlaying = false;
                playPauseBtn.innerText = "Resume";
            } else {
                playAudio(Math.max(0, currentIndex));
                playPauseBtn.innerText = "Stop";
            }
        };
        
        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'sentence-text';
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => {
                playPauseBtn.innerText = "Stop";
                playAudio(index);
            };
            contentDiv.appendChild(div);
        });
        
        // --- HTML5 Audio Prefetching Logic (via Blob URLs) ---
        const PREFETCH_BUFFER_SIZE = 3;
        let prefetchQueue = new Map(); // index -> Blob URL

        function getAudioUrl(index) {
            if (index < 0 || index >= manifest.length) return null;
            const item = manifest[index];
            const zipToUse = item.zipFile || ZIP_NAME;
            return WORKER_URL + '/' + BUCKET_NAME + '/' + zipToUse + '/' + item.audioFile;
        }

        async function fetchBlobUrl(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        async function prefetchNext(fromIndex) {
            for (let i = fromIndex + 1; i <= fromIndex + PREFETCH_BUFFER_SIZE; i++) {
                if (i >= manifest.length) break;
                if (!prefetchQueue.has(i)) {
                    prefetchQueue.set(i, 'fetching');
                    const url = getAudioUrl(i);
                    try {
                        const blobUrl = await fetchBlobUrl(url);
                        if (prefetchQueue.get(i) === 'fetching') {
                            prefetchQueue.set(i, blobUrl);
                        } else {
                            URL.revokeObjectURL(blobUrl);
                        }
                    } catch (err) {
                        console.error("Prefetch failed for index", i, err);
                        prefetchQueue.delete(i);
                    }
                }
            }
            // Cleanup old blobs to free memory
            for (let [key, val] of prefetchQueue.entries()) {
                if (key < fromIndex) {
                    if (typeof val === 'string' && val.startsWith('blob:')) {
                        URL.revokeObjectURL(val);
                    }
                    prefetchQueue.delete(key);
                }
            }
        }
        // ------------------------

        async function playAudio(index) {
            if (index < 0 || index >= manifest.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Start Reading";
                return;
            }
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            audioEl.pause();
            
            try {
                let audioUrl;
                if (prefetchQueue.has(index) && prefetchQueue.get(index) !== 'fetching') {
                    audioUrl = prefetchQueue.get(index);
                } else {
                    const sourceUrl = getAudioUrl(index);
                    audioUrl = await fetchBlobUrl(sourceUrl);
                }
                
                audioEl.src = audioUrl;
                audioEl.playbackRate = speedSlider.value;
                audioEl.onended = () => { playAudio(currentIndex + 1); };
                
                await audioEl.play();
                isPlaying = true;
                
            } catch (e) {
                console.error("Audio play error:", e);
                // Fallback to next track if error
                setTimeout(() => playAudio(currentIndex + 1), 500);
            }
            
            // Trigger prefetch for upcoming sentences
            prefetchNext(index);
        }
    </script>
