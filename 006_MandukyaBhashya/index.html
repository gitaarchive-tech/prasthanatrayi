adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000540.mp3", "sections": []}, {"id": "B_000541", "originalText": "तस्मान्निरवयवमजं नान्यथा कथञ्चन, केनचिदपि प्रकारेण न भिद्यत इत्यभिप्रायः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000541.mp3", "sections": []}, {"id": "B_000542", "originalText": "तत्त्वतो भिद्यमानं हि अमृतमजमद्वयं स्वभावतः सत् मर्त्यतां व्रजेत्, यथा अग्निः शीतताम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000542.mp3", "sections": []}, {"id": "B_000543", "originalText": "तच्चानिष्टं स्वभाववैपरीत्यगमनम्, सर्वप्रमाणविरोधात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000543.mp3", "sections": []}, {"id": "B_000544", "originalText": "अजमद्वयमात्मतत्त्वं माययैव भिद्यते, न परमार्थतः। तस्मान्न परमार्थसद्द्वैतम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000544.mp3", "sections": []}, {"id": "B_000545", "originalText": "अजातस्यैव भावस्य जातिमिच्छन्ति वादिनः। अजातो ह्यमृतो भावो मर्त्यतां कथमेष्यति॥ २०॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000545.mp3", "sections": []}, {"id": "B_000546", "originalText": "ये तु पुनः केचिदुपनिषद्व्याख्यातारो ब्रह्मवादिनो वावदूकाः अजातस्यैव आत्मतत्त्वस्यामृतस्य स्वभावतो जातिम् उत्पत्तिम् इच्छन्ति परमार्थत एव, तेषां जातं चेत्, तदेव मर्त्यतामेष्यत्यवश्यम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000546.mp3", "sections": []}, {"id": "B_000547", "originalText": "स च अजातो ह्यमृतो भावः स्वभावतः सन्नात्मा कथं मर्त्यतामेष्यति? न कथञ्चन मर्त्यत्वं स्वभाववैपरीत्यमेष्यतीत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000547.mp3", "sections": []}, {"id": "B_000548", "originalText": "न भवत्यमृतं मर्त्यं न मर्त्यममृतं तथा। प्रकृतेरन्यथाभावो न कथञ्चिद्भविष्यति॥ २१॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000548.mp3", "sections": []}, {"id": "B_000549", "originalText": "यस्मान्न भवति अमृतं मर्त्यं लोके नापि मर्त्यममृतं तथा, ततः प्रकृतेः स्वभावस्य अन्यथाभावः स्वतः प्रच्युतिः न कथञ्चिद्भविष्यति, अग्नेरिवौष्ण्यस्य॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000549.mp3", "sections": []}, {"id": "B_000550", "originalText": "स्वभावेनामृतो यस्य भावो गच्छति मर्त्यताम्। कृतकेनामृतस्तस्य कथं स्थास्यति निश्चलः॥ २२॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000550.mp3", "sections": []}, {"id": "B_000551", "originalText": "यस्य पुनर्वादिनः स्वभावेन अमृतो भावः मर्त्यतां गच्छति परमार्थतो जायते, तस्य प्रागुत्पत्तेः स भावः स्वभावतोऽमृत इति प्रतिज्ञा मृषैव।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000551.mp3", "sections": []}, {"id": "B_000552", "originalText": "कथं तर्हि? कृतकेनामृतः तस्य स्वभावः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000552.mp3", "sections": []}, {"id": "B_000553", "originalText": "कृतकेनामृतः स कथं स्थास्यति निश्चलः? अमृतस्वभावतया न कथञ्चित्स्थास्यति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000553.mp3", "sections": []}, {"id": "B_000554", "originalText": "आत्मजातिवादिनः सर्वथा अजं नाम नास्त्येव। सर्वमेतन्मर्त्यम्, अतः अनिर्मोक्षप्रसङ्ग इत्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000554.mp3", "sections": []}, {"id": "B_000555", "originalText": "भूततोऽभूततो वापि सृज्यमाने समा श्रुतिः। निश्चितं युक्तियुक्तं च यत्तद्भवति नेतरत्॥ २३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000555.mp3", "sections": []}, {"id": "B_000556", "originalText": "नन्वजातिवादिनः सृष्टिप्रतिपादिका श्रुतिर्न सङ्गच्छते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000556.mp3", "sections": []}, {"id": "B_000557", "originalText": "बाढम्, विद्यते सृष्टिप्रतिपादिका श्रुतिः, सा त्वन्यपरा, ‘उपायः सोऽवतारय’ (मा.का.३.१५) इत्यवोचाम।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000557.mp3", "sections": []}, {"id": "B_000558", "originalText": "इदानीमुक्तेऽपि परिहारे पुनश्चोद्यपरिहारौ विवक्षितार्थं प्रति सृष्टिश्रुत्यक्षराणामानुलोम्यविरोधशङ्कामात्रपरिहारार्थौ।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000558.mp3", "sections": []}, {"id": "B_000559", "originalText": "भूततः परमार्थतः सृज्यमाने वस्तुनि, अभूततः मायया वा मायाविनेव सृज्यमाने वस्तुनि समा तुल्या सृष्टिश्रुतिः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000559.mp3", "sections": []}, {"id": "B_000560", "originalText": "ननु गौणमुख्ययोर्मुख्ये शब्दार्थप्रतिपत्तिर्युक्ता, न, अन्यथासृष्टेरप्रसिद्धत्वान्निष्प्रयोजनत्वाच्च इत्यवोचाम।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000560.mp3", "sections": []}, {"id": "B_000561", "originalText": "अविद्यासृष्टिविषयैव सर्वा गौणी मुख्या च सृष्टिः, न परमार्थतः, ‘सबाह्याभ्यन्तरो ह्यजः’ (मु.२.१.२) इति श्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000561.mp3", "sections": []}, {"id": "B_000562", "originalText": "तस्मात् श्रुत्या निश्चितं यत् एकमेवाद्वितीयमजममृतमिति, युक्तियुक्तं च युक्त्या च सम्पन्नम्, तदेवेत्यवोचाम पूर्वैर्ग्रन्थैः, तदेव श्रुत्यर्थो भवति, नेतरत्कदाचिदपि क्वचिदपि॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000562.mp3", "sections": []}, {"id": "B_000563", "originalText": "नेह नानेति चाम्नायादिन्द्रो मायाभिरित्यपि। अजायमानो बहुधा जायते मायया तु सः॥ २४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000563.mp3", "sections": []}, {"id": "B_000564", "originalText": "कथं श्रुतिनिश्चय इत्याह— यदि हि भूतत एव सृष्टिः स्यात्, ततः सत्यमेव नानावस्त्विति तदभावप्रदर्शनार्थ आम्नायो न स्यात्, अस्ति च ‘नेह नानास्ति किञ्चन’ (क.२.१.११) इत्याम्नायो द्वैतभावप्रतिषेधार्थः, तस्मादात्मैकत्वप्रतिपत्त्यर्था कल्पिता सृष्टिरभूतैव प्राणसंवादवत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000564.mp3", "sections": []}, {"id": "B_000565", "originalText": "‘इन्द्रो मायाभिः’ (बृ.२.५.१९) इत्यभूतार्थप्रतिपादकेन मायाशब्देन व्यपदेशात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000565.mp3", "sections": []}, {"id": "B_000566", "originalText": "ननु प्रज्ञावचनो मायाशब्दः, सत्यम्, इन्द्रियप्रज्ञाया अविद्यामयत्वेन मायात्वाभ्युपगमाददोषः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000566.mp3", "sections": []}, {"id": "B_000567", "originalText": "मायाभिः इन्द्रियप्रज्ञाभिरविद्यारूपाभिरित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000567.mp3", "sections": []}, {"id": "B_000568", "originalText": "‘अजायमानो बहुधा विजायते’ (तै.आ.३.१३) इति श्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000568.mp3", "sections": []}, {"id": "B_000569", "originalText": "तस्मात् जायते मायया तु सः, तु—शब्दोऽवधारणार्थः माययैवेति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000569.mp3", "sections": []}, {"id": "B_000570", "originalText": "न ह्यजायमानत्वं बहुधाजन्म च एकत्र सम्भवति, अग्नाविव शैत्यमौष्ण्यं च।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000570.mp3", "sections": []}, {"id": "B_000571", "originalText": "फलवत्त्वाच्चात्मैकत्वदर्शनमेव श्रुतिनिश्चितोऽर्थः, ‘तत्र को मोहः कः शोक एकत्वमनुपश्यतः’ (ई.७) इत्यादिमन्त्रवर्णात् ‘मृत्योः स मृत्युमाप्नोति’ (क.२.४.१०) इति निन्दितत्वाच्च सृष्ट्यादिभेददृष्टेः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000571.mp3", "sections": []}, {"id": "B_000572", "originalText": "सम्भूतेरपवादाच्च सम्भवः प्रतिषिध्यते। को न्वेनं जनयेदिति कारणं प्रतिषिध्यते॥ २५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000572.mp3", "sections": []}, {"id": "B_000573", "originalText": "‘अन्धं तमः प्रविशन्ति ये सम्भूतिमुपासते’ (ई.मा.९) इति सम्भूतेरुपास्यत्वापवादात्सम्भवः प्रतिषिध्यते, न हि परमार्थसद्भूतायां सम्भूतौ तदपवाद उपपद्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000573.mp3", "sections": []}, {"id": "B_000574", "originalText": "ननु विनाशेन सम्भूतेः समुच्चयविधानार्थः सम्भूत्यपवादः, यथा ‘अन्धं तमः प्रविशन्ति येऽविद्यामुपासते’ (ई.मा.१२) इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000574.mp3", "sections": []}, {"id": "B_000575", "originalText": "सत्यमेव, देवतादर्शनस्य सम्भूतिविषयस्य विनाशशब्दवाच्यस्य च कर्मणः समुच्चयविधानार्थः सम्भूत्यपवादः, तथापि विनाशाख्यस्य कर्मणः स्वाभाविकाज्ञानप्रवृत्तिरूपस्य मृत्योरतितरणार्थत्ववत् देवतादर्शनकर्मसमुच्चयस्य पुरुषसंस्कारार्थस्य कर्मफलरागप्रवृत्तिरूपस्य साध्यसाधनैषणाद्वयलक्षणस्य मृत्योरतितरणार्थत्वम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000575.mp3", "sections": []}, {"id": "B_000576", "originalText": "एवं ह्येषणाद्वयरूपान्मृत्योरशुद्धेर्वियुक्तः पुरुषः संस्कृतः स्यात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000576.mp3", "sections": []}, {"id": "B_000577", "originalText": "अतो मृत्योरतितरणार्था देवतादर्शनकर्मसमुच्चयलक्षणा ह्यविद्या।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000577.mp3", "sections": []}, {"id": "B_000578", "originalText": "एवमेव एषणाद्वयलक्षणाविद्याया मृत्योरतितीर्णस्य विरक्तस्योपनिषच्छास्त्रार्थालोचनपरस्य नान्तरीयिका परमात्मैकत्वविद्योत्पत्तिरिति पूर्वभाविनीमविद्यामपेक्ष्य पश्चाद्भाविनी ब्रह्मविद्या अमृतत्वसाधना एकेन पुरुषेण सम्बध्यमाना अविद्यया समुच्चीयत इत्युच्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000578.mp3", "sections": []}, {"id": "B_000579", "originalText": "अतः अन्यार्थत्वादमृतत्वसाधनं ब्रह्मविद्यामपेक्ष्य, निन्दार्थ एव भवति सम्भूत्यपवादः यद्यप्यशुद्धिवियोगहेतुः अतन्निष्ठत्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000579.mp3", "sections": []}, {"id": "B_000580", "originalText": "अत एव सम्भूतेरपवादात्सम्भूतेरापेक्षिकमेव सत्त्वमिति परमार्थसदात्मैकत्वमपेक्ष्य अमृताख्यः सम्भवः प्रतिषिध्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000580.mp3", "sections": []}, {"id": "B_000581", "originalText": "एवं मायानिर्मितस्यैव जीवस्य अविद्यया प्रत्युपस्थापितस्य अविद्यानाशे स्वभावरूपत्वात्परमार्थतः को न्वेनं जनयेत्? न हि रज्ज्वामविद्याध्यारोपितं सर्पं पुनर्विवेकतो नष्टं जनयेत्कश्चित्, तथा न कश्चिदेनं जनयेदिति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000581.mp3", "sections": []}, {"id": "B_000582", "originalText": "को न्वित्याक्षेपार्थत्वात्कारणं प्रतिषिध्यते। अविद्योद्भूतस्य नष्टस्य जनयितृ कारणं न किञ्चिदस्तीत्यभिप्रायः, ‘नायं कुतश्चिन्न बभूव कश्चित्’ (क.१.२.१८) इति श्रुतेः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000582.mp3", "sections": []}, {"id": "B_000583", "originalText": "स एष नेति नेतीति व्याख्यातं निह्नुते यतः। सर्वमग्राह्यभावेन हेतुनाजं प्रकाशते॥ २६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000583.mp3", "sections": []}, {"id": "B_000584", "originalText": "सर्वविशेषप्रतिषेधेन ‘अथात आदेशो नेति नेति’ (बृ.२.३.६) इति प्रतिपादितस्यात्मनो दुर्बोधत्वं मन्यमाना श्रुतिः पुनः पुनरुपायान्तरत्वेन तस्यैव प्रतिपिपादयिषया यद्यद्व्याख्यातं तत्सर्वं निह्नुते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000584.mp3", "sections": []}, {"id": "B_000585", "originalText": "ग्राह्यं जनिमद्बुद्धिविषयमपलपत्यर्थात् ‘स एष नेति नेति’ (बृ.३.९.२६), (बृ.४.२.४), (बृ.४.४.२२), (बृ.४.५.१५) इत्यात्मनोऽदृश्यतां दर्शयन्ती श्रुतिः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000585.mp3", "sections": []}, {"id": "B_000586", "originalText": "उपायस्योपेयनिष्ठतामजानत उपायत्वेन व्याख्यातस्य उपेयवद्ग्राह्यता मा भूदिति अग्राह्यभावेन हेतुना कारणेन निह्नुत इत्यर्थः। ततश्चैवमुपायस्योपेयनिष्ठतामेव जानत उपेयस्य च नित्यैकरूपत्वमिति तस्य सबाह्याभ्यन्तरमजमात्मतत्त्वं प्रकाशते स्वयमेव॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000586.mp3", "sections": []}, {"id": "B_000587", "originalText": "सतो हि मायया जन्म युज्यते न तु तत्त्वतः। तत्त्वतो जायते यस्य जातं तस्य हि जायते॥ २७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000587.mp3", "sections": []}, {"id": "B_000588", "originalText": "एवं हि श्रुतिवाक्यशतैः सबाह्याभ्यन्तरमजमात्मतत्त्वमद्वयं न ततोऽन्यदस्तीति निश्चितमेतत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000588.mp3", "sections": []}, {"id": "B_000589", "originalText": "युक्त्या चाधुनैतदेव पुनर्निर्धार्यत इत्याह— तत्रैतत्स्यात् सदा अग्राह्यमेव चेदसदेवात्मतत्त्वमिति, तन्न, कार्यग्रहणात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000589.mp3", "sections": []}, {"id": "B_000590", "originalText": "यथा सतो मायाविनः मायया जन्म कार्यम्, एवं जगतो जन्म कार्यं गृह्यमाणं मायाविनमिव परमार्थसन्तमात्मानं जगज्जन्म मायास्पदमेव गमयति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000590.mp3", "sections": []}, {"id": "B_000591", "originalText": "यस्मात् सतो हि विद्यमानात्कारणात् मायानिर्मितस्य हस्त्यादिकार्यस्येव जगज्जन्म युज्यते, नासतः कारणात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000591.mp3", "sections": []}, {"id": "B_000592", "originalText": "न तु तत्त्वत एव आत्मनो जन्म युज्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000592.mp3", "sections": []}, {"id": "B_000593", "originalText": "अथवा, सतः विद्यमानस्य वस्तुनो रज्ज्वादेः सर्पादिवत् मायया जन्म युज्यते न तु तत्त्वतो यथा, तथा अग्राह्यस्यापि सत एवात्मनो रज्जुसर्पवज्जगद्रूपेण मायया जन्म युज्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000593.mp3", "sections": []}, {"id": "B_000594", "originalText": "न तु तत्त्वत एवाजस्यात्मनो जन्म।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000594.mp3", "sections": []}, {"id": "B_000595", "originalText": "यस्य पुनः परमार्थसदजमात्मतत्त्वं जगद्रूपेण जायते वादिनः, न हि तस्य अजं जायत इति शक्यं वक्तुम्, विरोधात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000595.mp3", "sections": []}, {"id": "B_000596", "originalText": "ततः तस्यार्थाज्जातं जायत इत्यापन्नम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000596.mp3", "sections": []}, {"id": "B_000597", "originalText": "ततश्चानवस्थापाताज्जायमानत्वं न। तस्मादजमेकमेवात्मतत्त्वमिति सिद्धम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000597.mp3", "sections": []}, {"id": "B_000598", "originalText": "असतो मायया जन्म तत्त्वतो नैव युज्यते। वन्ध्यापुत्रो न तत्त्वेन मायया वापि जायते॥ २८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000598.mp3", "sections": []}, {"id": "B_000599", "originalText": "असद्वादिनाम् असतो भावस्य मायया तत्त्वतो वा न कथञ्चन जन्म युज्यते, अदृष्टत्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000599.mp3", "sections": []}, {"id": "B_000600", "originalText": "न हि वन्ध्यापुत्रो मायया तत्त्वतो वा जायते। तस्मादत्रासद्वादो दूरत एवानुपपन्न इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000600.mp3", "sections": []}, {"id": "B_000601", "originalText": "यथा स्वप्ने द्वयाभासं स्पन्दते मायया मनः। तथा जाग्रद्द्वयाभासं स्पन्दते मायया मनः॥ २९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000601.mp3", "sections": []}, {"id": "B_000602", "originalText": "कथं पुनः सतो माययैव जन्मेत्युच्यते— यथा रज्ज्वां विकल्पितः सर्पो रज्जुरूपेणावेक्ष्यमाणः सन्, एवं मनः परमात्मविज्ञप्त्यात्मरूपेणावेक्ष्यमाणं सत् ग्राह्यग्राहकरूपेण द्वयाभासं स्पन्दते स्वप्ने मायया, रज्ज्वामिव सर्पः, तथा तद्वदेव जाग्रत् जागरिते स्पन्दते मायया मनः, स्पन्दत इवेत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000602.mp3", "sections": []}, {"id": "B_000603", "originalText": "अद्वयं च द्वयाभासं मनः स्वप्ने न संशयः। अद्वयं च द्वयाभासं तथा जाग्रन्न संशयः॥ ३०॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000603.mp3", "sections": []}, {"id": "B_000604", "originalText": "रज्जुरूपेण सर्प इव परमार्थत आत्मरूपेण अद्वयं सत् द्वयाभासं मनः स्वप्ने, न संशयः। न हि स्वप्ने हस्त्यादि ग्राह्यं तद्ग्राहकं वा चक्षुरादि, द्वयं विज्ञानव्यतिरेकेणास्ति, जाग्रदपि तथैवेत्यर्थः, परमार्थसद्विज्ञानमात्राविशेषात्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000604.mp3", "sections": []}, {"id": "B_000605", "originalText": "मनोदृश्यमिदं द्वैतं यत्किञ्चित्सचराचरम्। मनसो ह्यमनीभावे द्वैतं नैवोपलभ्यते॥ ३१॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000605.mp3", "sections": []}, {"id": "B_000606", "originalText": "रज्जुसर्पवद्विकल्पनारूपं द्वैतरूपेण मन एवेत्युक्तम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000606.mp3", "sections": []}, {"id": "B_000607", "originalText": "तत्र किं प्रमाणमिति, अन्वयव्यतिरेकलक्षणमनुमानमाह।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000607.mp3", "sections": []}, {"id": "B_000608", "originalText": "कथम्? तेन हि मनसा विकल्प्यमानेन दृश्यं मनोदृश्यम् इदं द्वैतं सर्वं मन इति प्रतिज्ञा, तद्भावे भावात् तदभावे चाभावात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000608.mp3", "sections": []}, {"id": "B_000609", "originalText": "मनसो हि अमनीभावे निरुद्धे विवेकदर्शनाभ्यासवैराग्याभ्यां रज्ज्वामिव सर्पे लयं गते वा सुषुप्ते द्वैतं नैवोपलभ्यत इति अभावात्सिद्धं द्वैतस्यासत्त्वमित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000609.mp3", "sections": []}, {"id": "B_000610", "originalText": "आत्मसत्यानुबोधेन न सङ्कल्पयते यदा। अमनस्तां तदा याति ग्राह्याभावे तदग्रहम्॥ ३२॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000610.mp3", "sections": []}, {"id": "B_000611", "originalText": "कथं पुनरयममनीभाव इत्युच्यते— आत्मैव सत्यमात्मसत्यम्, मृत्तिकावत्, ‘वाचारम्भणं विकारो नामधेयं मृत्तिकेत्येव सत्यम्’ (छा.६.१.४) इति श्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000611.mp3", "sections": []}, {"id": "B_000612", "originalText": "तस्य शास्त्राचार्योपदेशमन्ववबोध आत्मसत्यानुबोधः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000612.mp3", "sections": []}, {"id": "B_000613", "originalText": "तेन सङ्कल्प्याभावात्तन्न सङ्कल्पयते दाह्याभावे ज्वलनमिवाग्नेः यदा यस्मिन्काले, तदा तस्मिन्काले अमनस्ताम् अमनोभावं याति, ग्राह्याभावे तत् मनः अग्रहं ग्रहणविकल्पनावर्जितमित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000613.mp3", "sections": []}, {"id": "B_000614", "originalText": "अकल्पकमजं ज्ञानं ज्ञेयाभिन्नं प्रचक्षते। ब्रह्म ज्ञेयमजं नित्यमजेनाजं विबुध्यते॥ ३३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000614.mp3", "sections": []}, {"id": "B_000615", "originalText": "यद्यसदिदं द्वैतम्, केन समञ्जसमात्मतत्त्वं विबुध्यत इति, उच्यते— अकल्पकं सर्वकल्पनावर्जितम्, अत एव अजं ज्ञानं ज्ञप्तिमात्रं ज्ञेयेन परमार्थसता ब्रह्मणा अभिन्नं प्रचक्षते कथयन्ति ब्रह्मविदः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000615.mp3", "sections": []}, {"id": "B_000616", "originalText": "‘न हि विज्ञातुर्विज्ञातेर्विपरिलोपो विद्यते’ (बृ.४.३.३०) अग्न्युष्णवत्, ‘विज्ञानमानन्दं ब्रह्म’ (बृ.३.९.२८) ‘सत्यं ज्ञानमनन्तं ब्रह्म’ (तै.२.१.१) इत्यादिश्रुतिभ्यः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000616.mp3", "sections": []}, {"id": "B_000617", "originalText": "तस्यैव विशेषणम्— ब्रह्म ज्ञेयं यस्य, स्वस्थं तदिदं ब्रह्म ज्ञेयम् औष्ण्यस्येवाग्निवदभिन्नम्, तेन आत्मस्वरूपेण अजेन ज्ञानेन अजं ज्ञेयमात्मतत्त्वं स्वयमेव विबुध्यते अवगच्छति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000617.mp3", "sections": []}, {"id": "B_000618", "originalText": "नित्यप्रकाशस्वरूप इव सविता नित्यविज्ञानैकरसघनत्वान्न ज्ञानान्तरमपेक्षत इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000618.mp3", "sections": []}, {"id": "B_000619", "originalText": "निगृहीतस्य मनसो निर्विकल्पस्य धीमतः। प्रचारः स तु विज्ञेयः सुषुप्तेऽन्यो न तत्समः॥ ३४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000619.mp3", "sections": []}, {"id": "B_000620", "originalText": "आत्मसत्यानुबोधेन सङ्कल्पमकुर्वत् बाह्यविषयाभावे निरिन्धनाग्निवत्प्रशान्तं सत् निगृहीतं निरुद्धं मनो भवतीत्युक्तम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000620.mp3", "sections": []}, {"id": "B_000621", "originalText": "एवं च मनसो ह्यमनीभावे द्वैताभावश्चोक्तः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000621.mp3", "sections": []}, {"id": "B_000622", "originalText": "तस्यैवं निगृहीतस्य निरुद्धस्य मनसः निर्विकल्पस्य सर्वकल्पनावर्जितस्य धीमतः विवेकवतः प्रचरणं प्रचारो यः, स तु प्रचारः विशेषेण ज्ञेयो विज्ञेयो योगिभिः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000622.mp3", "sections": []}, {"id": "B_000623", "originalText": "ननु सर्वप्रत्ययाभावे यादृशः सुषुप्तिस्थस्य मनसः प्रचारः, तादृश एव निरुद्धस्यापि, प्रत्ययाभावाविशेषात्, किं तत्र विज्ञेयमिति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000623.mp3", "sections": []}, {"id": "B_000624", "originalText": "अत्रोच्यते— नैवम्, यस्मात्सुषुप्ते अन्यः प्रचारोऽविद्यामोहतमोग्रस्तस्य अन्तर्लीनानेकानर्थप्रवृत्तिबीजवासनावतो मनसः आत्मसत्यानुबोधहुताशविप्लुष्टाविद्याद्यनर्थप्रवृत्तिबीजस्य निरुद्धस्य अन्य एव प्रशान्तसर्वक्लेशरजसः स्वतन्त्रः प्रचारः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000624.mp3", "sections": []}, {"id": "B_000625", "originalText": "अतो न तत्समः। तस्माद्युक्तः स विज्ञातुमित्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000625.mp3", "sections": []}, {"id": "B_000626", "originalText": "लीयते हि सुषुप्तौ तन्निगृहीतं न लीयते। तदेव निर्भयं ब्रह्म ज्ञानालोकं समन्ततः॥ ३५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000626.mp3", "sections": []}, {"id": "B_000627", "originalText": "प्रचारभेदे हेतुमाह— लीयते सुषुप्तौ हि यस्मात्सर्वाभिरविद्यादिप्रत्ययबीजवासनाभिः सह तमोरूपम् अविशेषरूपं बीजभावमापद्यते तद्विवेकविज्ञानपूर्वकं निगृहीतं निरुद्धं सत् न लीयते तमोबीजभावं नापद्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000627.mp3", "sections": []}, {"id": "B_000628", "originalText": "तस्माद्युक्तः प्रचारभेदः सुषुप्तस्य समाहितस्य मनसः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000628.mp3", "sections": []}, {"id": "B_000629", "originalText": "यदा ग्राह्यग्राहकाविद्याकृतमलद्वयवर्जितम्, तदा परमद्वयं ब्रह्मैव तत्संवृत्तमित्यतः तदेव निर्भयम्, द्वैतग्रहणस्य भयनिमित्तस्याभावात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000629.mp3", "sections": []}, {"id": "B_000630", "originalText": "शान्तमभयं ब्रह्म यद्विद्वान्न बिभेति कुतश्चन।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000630.mp3", "sections": []}, {"id": "B_000631", "originalText": "तदेव विशेष्यते— ज्ञप्तिर्ज्ञानम् आत्मस्वभावचैतन्यम्, तदेव ज्ञानमालोकः प्रकाशो यस्य, तद्ब्रह्म ज्ञानालोकं विज्ञानैकरसघनमित्यर्थः। समन्ततः समन्तात्, सर्वतो व्योमवन्नैरन्तर्येण व्यापकमित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000631.mp3", "sections": []}, {"id": "B_000632", "originalText": "अजमनिद्रमस्वप्नमनामकमरूपकम्। सकृद्विभातं सर्वज्ञं नोपचारः कथञ्चन॥ ३६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000632.mp3", "sections": []}, {"id": "B_000633", "originalText": "जन्मनिमित्ताभावात्सबाह्याभ्यन्तरम् अजम्, अविद्यानिमित्तं हि जन्म रज्जुसर्पवदित्यवोचाम।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000633.mp3", "sections": []}, {"id": "B_000634", "originalText": "सा चाविद्या आत्मसत्यानुबोधेन निरुद्धा यतः, अतः अजम्, अत एव अनिद्रम् अविद्यालक्षणानादिर्मायानिद्रास्वापात्प्रबुद्धम् अद्वयस्वरूपेणात्मना, अतः अस्वप्नम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000634.mp3", "sections": []}, {"id": "B_000635", "originalText": "अप्रबोधकृते ह्यस्य नामरूपे, प्रबोधाच्च ते रज्जुसर्पवद्विनष्टे।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000635.mp3", "sections": []}, {"id": "B_000636", "originalText": "न नाम्नाभिधीयते ब्रह्म, रूप्यते वा न केनचित्प्रकारेण इति अनामकम् अरूपकं च तत्, ‘यतो वाचो निवर्तन्ते’ (तै.२.४.१) इत्यादिश्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000636.mp3", "sections": []}, {"id": "B_000637", "originalText": "किञ्च, सकृद्विभातं सदैव विभातं सदा भारूपम्, अग्रहणान्यथाग्रहणाविर्भावतिरोभाववर्जितत्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000637.mp3", "sections": []}, {"id": "B_000638", "originalText": "ग्रहणाग्रहणे हि रात्र्यहनी, तमश्चाविद्यालक्षणं सदा अप्रभातत्वे कारणम्, तदभावान्नित्यचैतन्यभारूपत्वाच्च युक्तं सकृद्विभातमिति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000638.mp3", "sections": []}, {"id": "B_000639", "originalText": "अत एव सर्वं च तत् ज्ञप्तिस्वरूपं चेति सर्वज्ञम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000639.mp3", "sections": []}, {"id": "B_000640", "originalText": "नेह ब्रह्मण्येवंविधे उपचरणमुपचारः कर्तव्यः, यथा अन्येषामात्मस्वरूपव्यतिरेकेण समाधानाद्युपचारः। नित्यशुद्धबुद्धमुक्तस्वभावत्वाद्ब्रह्मणः कथञ्चन न कथञ्चिदपि कर्तव्यसम्भवः अविद्यानाशे इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000640.mp3", "sections": []}, {"id": "B_000641", "originalText": "सर्वाभिलापविगतः सर्वचिन्तासमुत्थितः। सुप्रशान्तः सकृज्ज्योतिः समाधिरचलोऽभयः॥ ३७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000641.mp3", "sections": []}, {"id": "B_000642", "originalText": "अनामकत्वाद्युक्तार्थसिद्धये हेतुमाह— अभिलप्यते अनेनेति अभिलापः वाक्करणं सर्वप्रकारस्याभिधानस्य, तस्माद्विगतः, वागत्रोपलक्षणार्था, सर्वबाह्यकरणवर्जित इत्येतत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000642.mp3", "sections": []}, {"id": "B_000643", "originalText": "तथा, सर्वचिन्तासमुत्थितः, चिन्त्यते अनयेति चिन्ता बुद्धिः, तस्याः समुत्थितः, अन्तःकरणविवर्जित इत्यर्थः, ‘अप्राणो ह्यमनाः शुभ्रः अक्षरात्परतः परः’ (मु.२.१.२) इत्यादिश्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000643.mp3", "sections": []}, {"id": "B_000644", "originalText": "यस्मात्सर्वविषयवर्जितः, अतः सुप्रशान्तः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000644.mp3", "sections": []}, {"id": "B_000645", "originalText": "सकृज्ज्योतिः सदैव ज्योतिः आत्मचैतन्यस्वरूपेण।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000645.mp3", "sections": []}, {"id": "B_000646", "originalText": "समाधिः समाधिनिमित्तप्रज्ञावगम्यत्वात्, समाधीयते अस्मिन्निति वा समाधिः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000646.mp3", "sections": []}, {"id": "B_000647", "originalText": "अचलः अविक्रियः। अत एव अभयः विक्रियाभावात्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000647.mp3", "sections": []}, {"id": "B_000648", "originalText": "ग्रहो न तत्र नोत्सर्गश्चिन्ता यत्र न विद्यते। आत्मसंस्थं तदा ज्ञानमजाति समतां गतम्॥ ३८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000648.mp3", "sections": []}, {"id": "B_000649", "originalText": "यस्माद्ब्रह्मैव ‘समाधिरचलोऽभयः’ इत्युक्तम्, अतः न तत्र तस्मिन्ब्रह्मणि ग्रहः ग्रहणमुपादानम्, न उत्सर्गः उत्सर्जनं हानं वा विद्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000649.mp3", "sections": []}, {"id": "B_000650", "originalText": "यत्र हि विक्रिया तद्विषयत्वं वा, तत्र हानोपादाने स्याताम्, न तद्द्वयमिह ब्रह्मणि सम्भवति, विकारहेतोरन्यस्याभावान्निरवयवत्वाच्च, अतो न तत्र हानोपादाने सम्भवतः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000650.mp3", "sections": []}, {"id": "B_000651", "originalText": "चिन्ता यत्र न विद्यते, सर्वप्रकारैव चिन्ता न सम्भवति यत्र अमनस्त्वात्, कुतस्तत्र हानोपादाने इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000651.mp3", "sections": []}, {"id": "B_000652", "originalText": "यदैव आत्मसत्यानुबोधो जातः, तदैव आत्मसंस्थं विषयाभावादग्न्युष्णवदात्मन्येव स्थितं ज्ञानम्, अजाति जातिवर्जितम्, समतां गतम् परं साम्यमापन्नं भवति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000652.mp3", "sections": []}, {"id": "B_000653", "originalText": "यदादौ प्रतिज्ञातम् ‘अतो वक्ष्याम्यकार्पण्यमजाति समतां गतम्’ (मा.का.३.२) इति, इदं तदुपपत्तितः शास्त्रतश्चोक्तमुपसंह्रियते— अजाति समतां गतमिति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000653.mp3", "sections": []}, {"id": "B_000654", "originalText": "एतस्मादात्मसत्यानुबोधात्कार्पण्यविषयमन्यत्, ‘यो वा एतदक्षरं गार्ग्यविदित्वास्माल्लोकात्प्रैति स कृपणः’ (बृ.३.८.१०) इति श्रुतेः। प्राप्यैतत्सर्वः कृतकृत्यो ब्राह्मणो भवतीत्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000654.mp3", "sections": []}, {"id": "B_000655", "originalText": "अस्पर्शयोगो वै नाम दुर्दर्शः सर्वयोगिणाम्। योगिनो बिभ्यति ह्यस्मादभये भयदर्शिनः॥ ३९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000655.mp3", "sections": []}, {"id": "B_000656", "originalText": "यद्यपीदमित्थं परमार्थतत्त्वम्, अस्पर्शयोगो नाम अयं सर्वसम्बन्धाख्यस्पर्शवर्जितत्वात् अस्पर्शयोगो नाम वै स्मर्यते प्रसिद्ध उपनिषत्सु।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000656.mp3", "sections": []}, {"id": "B_000657", "originalText": "दुःखेन दृश्यत इति दुर्दर्शः सर्वयोगिणाम् वेदान्तविज्ञानरहितानाम्, आत्मसत्यानुबोधायासलभ्य एवेत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000657.mp3", "sections": []}, {"id": "B_000658", "originalText": "योगिनः बिभ्यति हि अस्मात्सर्वभयवर्जितादपि आत्मनाशरूपमिमं योगं मन्यमाना भयं कुर्वन्ति, अभये अस्मिन् भयदर्शिनः भयनिमित्तात्मनाशदर्शनशीलाः अविवेकिनः इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000658.mp3", "sections": []}, {"id": "B_000659", "originalText": "मनसो निग्रहायत्तमभयं सर्वयोगिणाम्। दुःखक्षयः प्रबोधश्चाप्यक्षया शान्तिरेव च॥ ४०॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000659.mp3", "sections": []}, {"id": "B_000660", "originalText": "येषां पुनर्ब्रह्मस्वरूपव्यतिरेकेण रज्जुसर्पवत्कल्पितमेव मन इन्द्रियादि च न परमार्थतो विद्यते, तेषां ब्रह्मस्वरूपाणामभयं मोक्षाख्या च अक्षया शान्तिः स्वभावत एव सिद्धा, नान्यायत्ता, ‘नोपचारः कथञ्चन’ (मा.का.३.३६) इत्युक्तेः, ये त्वतोऽन्ये योगिनो मार्गगा हीनमध्यमदृष्टयो मनोऽन्यदात्मव्यतिरिक्तमात्मसम्बन्धि पश्यन्ति, तेषामात्मसत्यानुबोधरहितानां मनसो निग्रहायत्तमभयं सर्वेषां योगिनाम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000660.mp3", "sections": []}, {"id": "B_000661", "originalText": "किञ्च, दुःखक्षयोऽपि।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000661.mp3", "sections": []}, {"id": "B_000662", "originalText": "न ह्यात्मसम्बन्धिनि मनसि प्रचलिते दुःखक्षयोऽस्त्यविवेकिनाम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000662.mp3", "sections": []}, {"id": "B_000663", "originalText": "किञ्च, आत्मप्रबोधोऽपि मनोनिग्रहायत्त एव। तथा, अक्षयापि मोक्षाख्या शान्तिस्तेषां मनोनिग्रहायत्तैव॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000663.mp3", "sections": []}, {"id": "B_000664", "originalText": "उत्सेक उदधेर्यद्वत्कुशाग्रेणैकबिन्दुना। मनसो निग्रहस्तद्वद्भवेदपरिखेदतः॥ ४१॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000664.mp3", "sections": []}, {"id": "B_000665", "originalText": "मनोनिग्रहोऽपि तेषाम् उदधेः कुशाग्रेण एकबिन्दुना उत्सेचनेन शोषणव्यवसायवत् व्यवसायवतामनवसन्नान्तःकरणानामनिर्वेदात् अपरिखेदतः भवतीत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000665.mp3", "sections": []}, {"id": "B_000666", "originalText": "उपायेन निगृह्णीयाद्विक्षिप्तं कामभोगयोः। सुप्रसन्नं लये चैव यथा कामो लयस्तथा॥ ४२॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000666.mp3", "sections": []}, {"id": "B_000667", "originalText": "किमपरिखिन्नव्यवसायमात्रमेव मनोनिग्रहे उपायः? नेत्युच्यते, अपरिखिन्नव्यवसायवान्सन्, वक्ष्यमाणेनोपायेन कामभोगविषयेषु विक्षिप्तं मनो निगृह्णीयात् निरुन्ध्यादात्मन्येवेत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000667.mp3", "sections": []}, {"id": "B_000668", "originalText": "किञ्च, लीयतेऽस्मिन्निति सुषुप्तो लयः, तस्मिन् लये च सुप्रसन्नम् आयासवर्जितमपीत्येतत्, निगृह्णीयादित्यनुवर्तते। सुप्रसन्नं चेत्कस्मान्निगृह्यत इति, उच्यते, यस्मात् यथा कामः अनर्थहेतुः, तथा लयोऽपि, अतः कामविषयस्य मनसो निग्रहवल्लयादपि निरोद्धव्यत्वमित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000668.mp3", "sections": []}, {"id": "B_000669", "originalText": "दुःखं सर्वमनुस्मृत्य कामभोगान्निवर्तयेत्। अजं सर्वमनुस्मृत्य जातं नैव तु पश्यति॥ ४३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000669.mp3", "sections": []}, {"id": "B_000670", "originalText": "कः स उपाय इति, उच्यते— सर्वं द्वैतमविद्याविजृम्भितं दुःखमेव इत्यनुस्मृत्य कामभोगात् कामनिमित्तो भोगः इच्छाविषयः तस्मात् विप्रसृतं मनो निवर्तयेत् वैराग्यभावनयेत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000670.mp3", "sections": []}, {"id": "B_000671", "originalText": "अजं ब्रह्म सर्वम् इत्येतच्छास्त्राचार्योपदेशतः अनुस्मृत्य तद्विपरीतं द्वैतजातं नैव तु पश्यति अभावात्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000671.mp3", "sections": []}, {"id": "B_000672", "originalText": "लये सम्बोधयेच्चित्तं विक्षिप्तं शमयेत्पुनः। सकषायं विजानीयात्समप्राप्तं न चालयेत्॥ ४४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000672.mp3", "sections": []}, {"id": "B_000673", "originalText": "एवमनेन ज्ञानाभ्यासवैराग्यद्वयोपायेन लये सुषुप्ते लीनं सम्बोधयेत् मनः आत्मविवेकदर्शनेन योजयेत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000673.mp3", "sections": []}, {"id": "B_000674", "originalText": "चित्तं मन इत्यनर्थान्तरम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000674.mp3", "sections": []}, {"id": "B_000675", "originalText": "विक्षिप्तं च कामभोगेषु शमयेत्पुनः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000675.mp3", "sections": []}, {"id": "B_000676", "originalText": "एवं पुनः पुनरभ्यासतो लयात्सम्बोधितं विषयेभ्यश्च व्यावर्तितम्, नापि साम्यापन्नमन्तरालावस्थं सकषायं सरागं बीजसंयुक्तं मन इति विजानीयात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000676.mp3", "sections": []}, {"id": "B_000677", "originalText": "ततोऽपि यत्नतः साम्यमापादयेत्। यदा तु समप्राप्तं भवति, समप्राप्त्यभिमुखीभवतीत्यर्थः, ततः तत् न चालयेत्, विषयाभिमुखं न कुर्यादित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000677.mp3", "sections": []}, {"id": "B_000678", "originalText": "नास्वादयेत्सुखं तत्र निःसङ्गः प्रज्ञया भवेत्। निश्चलं निश्चरच्चित्तमेकीकुर्यात्प्रयत्नतः॥ ४५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000678.mp3", "sections": []}, {"id": "B_000679", "originalText": "समाधित्सतो योगिनो यत्सुखं जायते, तत् नास्वादयेत् तत्र न रज्येतेत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000679.mp3", "sections": []}, {"id": "B_000680", "originalText": "कथं तर्हि? निःसङ्गः निःस्पृहः प्रज्ञया विवेकबुद्ध्या यदुपलभ्यते सुखम्, तदविद्यापरिकल्पितं मृषैवेति विभावयेत्, ततोऽपि सुखरागान्निगृह्णीयादित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000680.mp3", "sections": []}, {"id": "B_000681", "originalText": "यदा पुनः सुखरागान्निवृत्तं निश्चलस्वभावं सत् निश्चरत् बहिर्निर्गच्छद्भवति चित्तम्, ततस्ततो नियम्य उक्तोपायेन आत्मन्येव एकीकुर्यात् प्रयत्नतः। चित्स्वरूपसत्तामात्रमेवापादयेदित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000681.mp3", "sections": []}, {"id": "B_000682", "originalText": "यदा न लीयते चित्तं न च विक्षिप्यते पुनः। अनिङ्गनमनाभासं निष्पन्नं ब्रह्म तत्तदा॥ ४६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000682.mp3", "sections": []}, {"id": "B_000683", "originalText": "यथोक्तेनोपायेन निगृहीतं चित्तं यदा सुषुप्ते न लीयते, न च पुनर्विषयेषु विक्षिप्यते, अनिङ्गनम् अचलं निवातप्रदीपकल्पम्, अनाभासं न केनचित्कल्पितेन विषयभावेनावभासते इति, यदा एवंलक्षणं चित्तम्, तदा निष्पन्नं ब्रह्म, ब्रह्मस्वरूपेण निष्पन्नं चित्तं भवतीत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000683.mp3", "sections": []}, {"id": "B_000684", "originalText": "स्वस्थं शान्तं सनिर्वाणमकथ्यं सुखमुत्तमम्। अजमजेन ज्ञेयेन सर्वज्ञं परिचक्षते॥ ४७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000684.mp3", "sections": []}, {"id": "B_000685", "originalText": "यथोक्तं परमार्थसुखमात्मसत्यानुबोधलक्षणं स्वस्थं स्वात्मनि स्थितम्, शान्तं सर्वानर्थोपशमरूपम्, सनिर्वाणम्, निर्वृतिर्निर्वाणं कैवल्यम्, सह निर्वाणेन वर्तते, तच्च अकथ्यं न शक्यते कथयितुम्, अत्यन्तासाधारणविषयत्वात्, सुखमुत्तमं निरतिशयं हि तद्योगिप्रत्यक्षमेव, न जातमिति अजम्, यथा विषयविषयम्, अजेन अनुत्पन्नेन ज्ञेयेन अव्यतिरिक्तं सत् स्वेन सर्वज्ञरूपेण सर्वज्ञं ब्रह्मैव सुखं परिचक्षते कथयन्ति ब्रह्मविदः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000685.mp3", "sections": []}, {"id": "B_000686", "originalText": "न कश्चिज्जायते जीवः सम्भवोऽस्य न विद्यते। एतत्तदुत्तमं सत्यं यत्र किञ्चिन्न जायते॥ ४८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000686.mp3", "sections": []}, {"id": "B_000687", "originalText": "सर्वोऽप्ययं मनोनिग्रहादिः मृल्लोहादिवत्सृष्टिरुपासना च उक्ता परमार्थस्वरूपप्रतिपत्त्युपायत्वेन, न परमार्थसत्येति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000687.mp3", "sections": []}, {"id": "B_000688", "originalText": "परमार्थसत्यं तु न कश्चिज्जायते जीवः कर्ता भोक्ता च नोत्पद्यते केनचिदपि प्रकारेण।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000688.mp3", "sections": []}, {"id": "B_000689", "originalText": "अतः स्वभावतः अजस्य अस्य एकस्यात्मनः सम्भवः कारणं न विद्यते नास्ति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000689.mp3", "sections": []}, {"id": "B_000690", "originalText": "यस्मान्न विद्यतेऽस्य कारणम्, तस्मान्न कश्चिज्जायते जीव इत्येतत्। पूर्वेषूपायत्वेनोक्तानां सत्यानाम् एतत् उत्तमं सत्यं यस्मिन्सत्यस्वरूपे ब्रह्मणि अणुमात्रमपि किञ्चिन्न जायते इति॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000690.mp3", "sections": []}, {"id": "B_000691", "originalText": "इति तृतीयमद्वैतप्रकरणं सम्पूर्णम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000691.mp3", "sections": []}, {"id": "B_000692", "originalText": "अलातशान्तिप्रकरणम्\nज्ञानेनाकाशकल्पेन धर्मान्यो गगनोपमान्। ज्ञेयाभिन्नेन सम्बुद्धस्तं वन्दे द्विपदां वरम्॥ १॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000692.mp3", "sections": ["अलातशान्तिप्रकरणम्"]}, {"id": "B_000693", "originalText": "ओङ्कारनिर्णयद्वारेण आगमतः प्रतिज्ञातस्याद्वैतस्य बाह्यविषयभेदवैतथ्याच्च सिद्धस्य पुनरद्वैते शास्त्रयुक्तिभ्यां साक्षान्निर्धारितस्य एतदुत्तमं सत्यमित्युपसंहारः कृतोऽन्ते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000693.mp3", "sections": []}, {"id": "B_000694", "originalText": "तस्यैतस्यागमार्थस्य अद्वैतदर्शनस्य प्रतिपक्षभूता द्वैतिनो वैनाशिकाश्च।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000694.mp3", "sections": []}, {"id": "B_000695", "originalText": "तेषां चान्योन्यविरोधाद्रागद्वेषादिक्लेशास्पदं दर्शनमिति मिथ्यादर्शनत्वं सूचितम्, क्लेशानास्पदत्वात्सम्यग्दर्शनमित्यद्वैतदर्शनस्तुतये।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000695.mp3", "sections": []}, {"id": "B_000696", "originalText": "तदिह विस्तरेणान्योन्यविरुद्धतया असम्यग्दर्शनत्वं प्रदर्श्य तत्प्रतिषेधेनाद्वैतदर्शनसिद्धिरुपसंहर्तव्या आवीतन्यायेनेत्यलातशान्तिप्रकरणमारभ्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000696.mp3", "sections": []}, {"id": "B_000697", "originalText": "तत्राद्वैतदर्शनसम्प्रदायकर्तुरद्वैतस्वरूपेणैव नमस्कारार्थोऽयमाद्यश्लोकः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000697.mp3", "sections": []}, {"id": "B_000698", "originalText": "आचार्यपूजा हि अभिप्रेतार्थसिद्ध्यर्थेष्यते शास्त्रारम्भे।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000698.mp3", "sections": []}, {"id": "B_000699", "originalText": "आकाशेन ईषदसमाप्तमाकाशकल्पमाकाशतुल्यमित्येतत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000699.mp3", "sections": []}, {"id": "B_000700", "originalText": "तेन आकाशकल्पेन ज्ञानेन।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000700.mp3", "sections": []}, {"id": "B_000701", "originalText": "किम्? धर्मानात्मनः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000701.mp3", "sections": []}, {"id": "B_000702", "originalText": "किंविशिष्टान्? गगनोपमान् गगनमुपमा येषां ते गगनोपमाः, तानात्मनो धर्मान्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000702.mp3", "sections": []}, {"id": "B_000703", "originalText": "ज्ञानस्यैव पुनर्विशेषणम्— ज्ञेयैर्धर्मैरात्मभिरभिन्नम् अग्न्युष्णवत् सवितृप्रकाशवच्च यत् ज्ञानम्, तेन ज्ञेयाभिन्नेन ज्ञानेन आकाशकल्पेन ज्ञेयात्मस्वरूपाव्यतिरिक्तेन, गगनोपमान्धर्मान्यः सम्बुद्धः सम्बुद्धवान्नित्यमेव ईश्वरो यो नारायणाख्यः, तं वन्दे अभिवादये।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000703.mp3", "sections": []}, {"id": "B_000704", "originalText": "द्विपदां वरं द्विपदोपलक्षितानां पुरुषाणां वरं प्रधानम्, पुरुषोत्तममित्यभिप्रायः। उपदेष्टृनमस्कारमुखेन ज्ञानज्ञेयज्ञातृभेदरहितं परमार्थतत्त्वदर्शनमिह प्रकरणे प्रतिपिपादयिषितं प्रतिपक्षप्रतिषेधद्वारेण प्रतिज्ञातं भवति॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000704.mp3", "sections": []}, {"id": "B_000705", "originalText": "अस्पर्शयोगो वै नाम सर्वसत्त्वसुखो हितः। अविवादोऽविरुद्धश्च देशितस्तं नमाम्यहम्॥ २॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000705.mp3", "sections": []}, {"id": "B_000706", "originalText": "अधुना अद्वैतदर्शनयोगस्य नमस्कारः तत्स्तुतये— स्पर्शनं स्पर्शः सम्बन्धो न विद्यते यस्य योगस्य केनचित्कदाचिदपि, सः अस्पर्शयोगः ब्रह्मस्वभाव एव वै नामेति, ब्रह्मविदामस्पर्शयोग इत्येवं प्रसिद्ध इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000706.mp3", "sections": []}, {"id": "B_000707", "originalText": "स च सर्वसत्त्वसुखो भवति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000707.mp3", "sections": []}, {"id": "B_000708", "originalText": "कश्चिदत्यन्तसुखसाधनविशिष्टोऽपि दुःखस्वरूपः, यथा तपः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000708.mp3", "sections": []}, {"id": "B_000709", "originalText": "अयं तु न तथा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000709.mp3", "sections": []}, {"id": "B_000710", "originalText": "किं तर्हि? सर्वसत्त्वानां सुखः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000710.mp3", "sections": []}, {"id": "B_000711", "originalText": "तथा इह भवति कश्चिद्विषयोपभोगः सुखो न हितः, अयं तु सुखो हितश्च, नित्यमप्रचलितस्वभावत्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000711.mp3", "sections": []}, {"id": "B_000712", "originalText": "किं च अविवादः, विरुद्धं वदनं विवादः पक्षप्रतिपक्षपरिग्रहेण यस्मिन्न विद्यते सः अविवादः। कस्मात्? यतः अविरुद्धश्च, य ईदृशो योगः देशितः उपदिष्टः शास्त्रेण, तं नमाम्यहं प्रणमामीत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000712.mp3", "sections": []}, {"id": "B_000713", "originalText": "भूतस्य जातिमिच्छन्ति वादिनः केचिदेव हि। अभूतस्यापरे धीरा विवदन्तः परस्परम्॥ ३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000713.mp3", "sections": []}, {"id": "B_000714", "originalText": "कथं द्वैतिनः परस्परं विरुध्यन्त इति, उच्यते— भूतस्य विद्यमानस्य वस्तुनः जातिम् उत्पत्तिम् इच्छन्ति वादिनः केचिदेव हि साङ्ख्याः, न सर्व एव द्वैतिनः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000714.mp3", "sections": []}, {"id": "B_000715", "originalText": "यस्मात् अभूतस्य अविद्यमानस्य अपरे वैशेषिका नैयायिकाश्च धीराः धीमन्तः, प्राज्ञाभिमानिन इत्यर्थः। विवदन्तः विरुद्धं वदन्तो हि अन्योन्यमिच्छन्ति जेतुमित्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000715.mp3", "sections": []}, {"id": "B_000716", "originalText": "भूतं न जायते किञ्चिदभूतं नैव जायते। विवदन्तोऽद्वया ह्येवमजातिं ख्यापयन्ति ते॥ ४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000716.mp3", "sections": []}, {"id": "B_000717", "originalText": "तैरेवं विरुद्धवदनेन अन्योन्यपक्षप्रतिषेधं कुर्वद्भिः किं ख्यापितं भवतीति, उच्यते— भूतं विद्यमानं वस्तु न जायते किञ्चिद्विद्यमानत्वादेव आत्मवत् इत्येवं वदन् असद्वादी साङ्ख्यपक्षं प्रतिषेधति सज्जन्म।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000717.mp3", "sections": []}, {"id": "B_000718", "originalText": "तथा अभूतम् अविद्यमानम् अविद्यमानत्वान्नैव जायते शशविषाणवत् इत्येवं वदन्साङ्ख्योऽपि असद्वादिपक्षमसज्जन्म प्रतिषेधति। विवदन्तः विरुद्धं वदन्तः अद्वयाः अद्वैतिनो ह्येते अन्योन्यस्य पक्षौ सदसतोर्जन्मनी प्रतिषेधन्तः अजातिम् अनुत्पत्तिमर्थात्ख्यापयन्ति प्रकाशयन्ति ते॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000718.mp3", "sections": []}, {"id": "B_000719", "originalText": "ख्याप्यमानामजातिं तैरनुमोदामहे वयम्। विवदामो न तैः सार्धमविवादं निबोधत॥ ५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000719.mp3", "sections": []}, {"id": "B_000720", "originalText": "तैरेवं ख्यप्यमानामजातिम् एवमस्तु इति अनुमोदामहे केवलम्, न तैः सार्धं विवदामः पक्षप्रतिपक्षपरिग्रहेण, यथा ते अन्योन्यमित्यभिप्रायः। अतः तम् अविवादं विवादरहितं परमार्थदर्शनमनुज्ञातमस्माभिः निबोधत हे शिष्याः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000720.mp3", "sections": []}, {"id": "B_000721", "originalText": "अजातस्यैव धर्मस्य जातिमिच्छन्ति वादिनः। अजातो ह्यमृतो धर्मो मर्त्यतां कथमेष्यति॥ ६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000721.mp3", "sections": []}, {"id": "B_000722", "originalText": "सदसद्वादिनः सर्वे। अयं तु पुरस्तात्कृतभाष्यः श्लोकः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000722.mp3", "sections": []}, {"id": "B_000723", "originalText": "न भवत्यमृतं मर्त्यं न मर्त्यममृतं तथा। प्रकृतेरन्यथाभावो न कथञ्चिद्भविष्यति॥ ७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000723.mp3", "sections": []}, {"id": "B_000724", "originalText": "स्वभावेनामृतो यस्य धर्मो गच्छति मर्त्यतात्। कृतकेनामृतस्तस्य कथं स्थास्यति निश्चलः॥ ८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000724.mp3", "sections": []}, {"id": "B_000725", "originalText": "उक्तार्थानां श्लोकानामिहोपन्यासः परवादिपक्षाणामन्योन्यविरोधख्यापितानुत्पत्त्यामोदनप्रदर्शनार्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000725.mp3", "sections": []}, {"id": "B_000726", "originalText": "सांसिद्धिकी स्वाभाविकी सहजा अकृता च या। प्रकृतिः सेति विज्ञेया स्वभावं न जहाति या॥ ९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000726.mp3", "sections": []}, {"id": "B_000727", "originalText": "यस्माल्लौकिक्यपि प्रकृतिर्न विपर्येति, कासावित्याह— सम्यक्सिद्धिः संसिद्धिः, तत्र भवा सांसिद्धिकी, यथा योगिनां सिद्धानामणिमाद्यैश्वर्यप्राप्तिः प्रकृतिः, सा भूतभविष्यत्कालयोरपि योगिनां न विपर्येति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000727.mp3", "sections": []}, {"id": "B_000728", "originalText": "तथैव सा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000728.mp3", "sections": []}, {"id": "B_000729", "originalText": "स्वाभाविकी द्रव्यस्वभावत एव सिद्धा, यथा अग्न्यादीनामुष्णप्रकाशादिलक्षणा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000729.mp3", "sections": []}, {"id": "B_000730", "originalText": "सापि न कालान्तरे व्यभिचरति देशान्तरे वा, तथा सहजा आत्मना सहैव जाता, यथा पक्ष्यादीनामाकाशगमनादिलक्षणा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000730.mp3", "sections": []}, {"id": "B_000731", "originalText": "अन्यापि या काचित् अकृता केनचिन्न कृता, यथा अपां निम्नदेशगमनादिलक्षणा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000731.mp3", "sections": []}, {"id": "B_000732", "originalText": "अन्यापि या काचित्स्वभावं न जहाति, सा सर्वा प्रकृतिरिति विज्ञेया लोके। मिथ्याकल्पितेषु लौकिकेष्वपि वस्तुषु प्रकृतिर्नान्यथा भवति, किमुत अजस्वभावेषु परमार्थवस्तुषु? अमृतत्वलक्षणा प्रकृतिर्नान्यथा भवेदित्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000732.mp3", "sections": []}, {"id": "B_000733", "originalText": "जरामरणनिर्मुक्ताः सर्वे धर्माः स्वभावतः। जरामरणमिच्छन्तश्च्यवन्ते तन्मनीषया॥ १०॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000733.mp3", "sections": []}, {"id": "B_000734", "originalText": "किंविषया पुनः सा प्रकृतिः, यस्या अन्यथाभावो वादिभिः कल्प्यते? कल्पनायां वा को दोष इत्याह जरामरणनिर्मुक्ताः जरामरणादिसर्वविक्रियावर्जिता इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000734.mp3", "sections": []}, {"id": "B_000735", "originalText": "के? सर्वे धर्माः सर्वे आत्मान इत्येतत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000735.mp3", "sections": []}, {"id": "B_000736", "originalText": "स्वभावतः प्रकृतित एव।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000736.mp3", "sections": []}, {"id": "B_000737", "originalText": "अत एवंस्वभावाः सन्तो धर्मा जरामरणमिच्छन्त इवेच्छन्तः रज्ज्वामिव सर्पमात्मनि कल्पयन्तः च्यवन्ते, स्वभावतश्चलन्तीत्यर्थः। तन्मनीषया जरामरणचिन्तया तद्भावभावितत्वदोषेणेत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000737.mp3", "sections": []}, {"id": "B_000738", "originalText": "कारणं यस्य वै कार्यं कारणं तस्य जायते। जायमानं कथमजं भिन्नं नित्यं कथं च तत्॥ ११॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000738.mp3", "sections": []}, {"id": "B_000739", "originalText": "कथं सज्जातिवादिभिः साङ्ख्यैरनुपपन्नमुच्यते इति, आह वैशेषिकः— कारणं मृद्वदुपादानलक्षणं यस्य वादिनः वै कार्यम्, कारणमेव कार्याकारेण परिणमते यस्य वादिन इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000739.mp3", "sections": []}, {"id": "B_000740", "originalText": "तस्य अजमेव सत् प्रधानादि कारणं महदादिकार्यरूपेण जायत इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000740.mp3", "sections": []}, {"id": "B_000741", "originalText": "महदाद्याकारेण चेज्जायमानं प्रधानम्, कथमजमुच्यते तैः? विप्रतिषिद्धं चेदम्— जायते अजं चेति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000741.mp3", "sections": []}, {"id": "B_000742", "originalText": "नित्यं च तैरुच्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000742.mp3", "sections": []}, {"id": "B_000743", "originalText": "प्रधानं भिन्नं विदीर्णम्, स्फुटितमेकदेशेन सत् कथं नित्यं भवेदित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000743.mp3", "sections": []}, {"id": "B_000744", "originalText": "न हि सावयवं घटादि एकदेशेन स्फुटनधर्मि नित्यं दृष्टं लोके इत्यर्थः। विदीर्णं च स्यादेकदेशेनाजं नित्यं चेत्येतत् विप्रतिषिद्धं तैरभिधीयत इत्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000744.mp3", "sections": []}, {"id": "B_000745", "originalText": "कारणाद्यद्यनन्यत्वमतः कार्यमजं तव। जायमानाद्धि वै कार्यात्कारणं ते कथं ध्रुवम्॥ १२॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000745.mp3", "sections": []}, {"id": "B_000746", "originalText": "उक्तस्यैवार्थस्य स्पष्टीकरणार्थमाह— कारणात् अजात् कार्यस्य यदि अनन्यत्वमिष्टं त्वया, ततः कार्यमप्यजमिति प्राप्तम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000746.mp3", "sections": []}, {"id": "B_000747", "originalText": "इदं चान्यद्विप्रतिषिद्धं कार्यमजं चेति तव।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000747.mp3", "sections": []}, {"id": "B_000748", "originalText": "किञ्चान्यत्, कार्यकारणयोरनन्यत्वे जायमानाद्धि वै कार्यात् कारणम् अनन्यन्नित्यं ध्रुवं च ते कथं भवेत्? न हि कुक्कुट्या एकदेशः पच्यते, एकदेशः प्रसवाय कल्प्यते॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000748.mp3", "sections": []}, {"id": "B_000749", "originalText": "अजाद्वै जायते यस्य दृष्टान्तस्तस्य नास्ति वै। जाताच्च जायमानस्य न व्यवस्था प्रसज्यते॥ १३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000749.mp3", "sections": []}, {"id": "B_000750", "originalText": "किञ्चान्यत्, यत् अजात् अनुत्पन्नाद्वस्तुनः जायते यस्य वादिनः कार्यम्, दृष्टान्तः तस्य नास्ति वै, दृष्टान्ताभावे अर्थादजान्न किञ्चिज्जायते इति सिद्धं भवतीत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000750.mp3", "sections": []}, {"id": "B_000751", "originalText": "यदा पुनः जातात् जायमानस्य वस्तुनः अभ्युपगमः, तदपि अन्यस्माज्जातात्तदप्यन्यस्मादिति न व्यवस्था प्रसज्यते। अनवस्था स्यादित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000751.mp3", "sections": []}, {"id": "B_000752", "originalText": "हेतोरादिः फलं येषामादिर्हेतुः फलस्य च। हेतोः फलस्य चानादिः कथं तैरुपवर्ण्यते॥ १४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000752.mp3", "sections": []}, {"id": "B_000753", "originalText": "‘यत्र त्वस्य सर्वमात्मैवाभूत्’ (बृ.४.५.१५) इति परमार्थतो द्वैताभावः श्रुत्योक्तः, तमाश्रित्याह— हेतोः धर्मादेः आदिः कारणं देहादिसङ्घातः फलं येषां वादिनाम्, तथा आदिः कारणं हेतुर्धर्मादिः फलस्य च देहादिसङ्घातस्य, एवं हेतुफलयोरितरेतरकार्यकारणत्वेन आदिमत्त्वं ब्रुवद्भिः एवं हेतोः फलस्य च अनादित्वं कथं तैरुपवर्ण्यते विप्रतिषिद्धमित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000753.mp3", "sections": []}, {"id": "B_000754", "originalText": "न हि नित्यस्य कूटस्थस्यात्मनो हेतुफलात्मकता सम्भवति॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000754.mp3", "sections": []}, {"id": "B_000755", "originalText": "हेतोरादिः फलं येषामादिर्हेतुः फलस्य च। तथा जन्म भवेत्तेषां पुत्राज्जन्म पितुर्यथा॥ १५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000755.mp3", "sections": []}, {"id": "B_000756", "originalText": "कथं तैर्विरुद्धमभ्युपगम्यत इति, उच्यते— हेतुजन्यादेव फलात् हेतोर्जन्माभ्युपगच्छतां तेषामीदृशो विरोध उक्तो भवति, यथा पुत्राज्जन्म पितुः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000756.mp3", "sections": []}, {"id": "B_000757", "originalText": "सम्भवे हेतुफलयोरेषितव्यः क्रमस्त्वया। युगपत्सम्भवे यस्मादसम्बन्धो विषाणवत्॥ १६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000757.mp3", "sections": []}, {"id": "B_000758", "originalText": "यथोक्तो विरोधो न युक्तोऽभ्युपगन्तुमिति चेन्मन्यसे, सम्भवे उत्पत्तौ हेतुफलयोः क्रमः एषितव्यः अन्वेष्टव्यः त्वया— हेतुः पूर्वं पश्चात्फलं चेति। इतश्च युगपत्सम्भवे यस्माद्धेतुफलयोः कार्यकारणत्वेन असम्बन्धः, यथा युगपत्सम्भवतोः सव्येतरगोविषाणयोः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000758.mp3", "sections": []}, {"id": "B_000759", "originalText": "फलादुत्पद्यमानः सन्न ते हेतुः प्रसिध्यति। अप्रसिद्धः कथं हेतुः फलमुत्पादयिष्यति॥ १७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000759.mp3", "sections": []}, {"id": "B_000760", "originalText": "कथमसम्बन्ध इत्याह— जन्यात्स्वतोऽलब्धात्मकात् फलात् उत्पद्यमानः सन् शशविषाणादेरिवासतो न हेतुः प्रसिध्यति जन्म न लभते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000760.mp3", "sections": []}, {"id": "B_000761", "originalText": "अलब्धात्मकः अप्रसिद्धः सन् शशविषाणादिकल्पः तव स कथं फलमुत्पादयिष्यति? न हि इतरेतरापेक्षसिद्ध्योः शशविषाणकल्पयोः कार्यकारणभावेन सम्बन्धः क्वचिद्दृष्टः अन्यथा वेत्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000761.mp3", "sections": []}, {"id": "B_000762", "originalText": "यदि हेतोः फलात्सिद्धिः फलसिद्धिश्च हेतुतः। कतरत्पूर्वनिष्पन्नं यस्य सिद्धिरपेक्षया॥ १८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000762.mp3", "sections": []}, {"id": "B_000763", "originalText": "असम्बन्धतादोषेणापाकृतेऽपि हेतुफलयोः कार्यकारणभावे, यदि हेतुफलयोरन्योन्यसिद्धिरभ्युपगम्यत एव त्वया, कतरत्पूर्वनिष्पन्नं हेतुफलयोः? यस्य पश्चाद्भाविनः सिद्धिः स्यात्पूर्वसिद्धापेक्षया, तद्ब्रूहीत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000763.mp3", "sections": []}, {"id": "B_000764", "originalText": "अशक्तिरपरिज्ञानं क्रमकोपोऽथ वा पुनः। एवं हि सर्वथा बुद्धैरजातिः परिदीपिता॥ १९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000764.mp3", "sections": []}, {"id": "B_000765", "originalText": "अथ एतन्न शक्यते वक्तुमिति मन्यसे, सेयमशक्तिः अपरिज्ञानं तत्त्वाविवेकः, मूढतेत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000765.mp3", "sections": []}, {"id": "B_000766", "originalText": "अथ वा, योऽयं त्वयोक्तः क्रमः हेतोः फलस्य सिद्धिः फलाच्च हेतोः सिद्धिरिति इतरेतरानन्तर्यलक्षणः, तस्य कोपः विपर्यासोऽन्यथाभावः स्यादित्यभिप्रायः। एवं हेतुफलयोः कार्यकारणभावानुपपत्तेः अजातिः सर्वस्यानुत्पत्तिः परिदीपिता प्रकाशिता अन्योन्यपक्षदोषं ब्रुवद्भिर्वादिभिः बुद्धैः पण्डितैरित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000766.mp3", "sections": []}, {"id": "B_000767", "originalText": "बीजाङ्कुराख्यो दृष्टान्तः सदा साध्यसमो हि सः। न हि साध्यसमो हेतुः सिद्धौ साध्यस्य युज्यते॥ २०॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000767.mp3", "sections": []}, {"id": "B_000768", "originalText": "ननु हेतुफलयोः कार्यकारणभाव इत्यस्माभिरुक्तं शब्दमात्रमाश्रित्य च्छलमिदं त्वयोक्तम्— ‘पुत्राज्जन्म पितुर्यथा’ (मा.का.४.१५) ‘विषाणवच्चासम्बन्धः’ (मा.का.४.१६) इत्यादि।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000768.mp3", "sections": []}, {"id": "B_000769", "originalText": "न ह्यस्माभिः असिद्धाद्धेतोः फलसिद्धिः, असिद्धाद्वा फलाद्धेतुसिद्धिरभ्युपगता।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000769.mp3", "sections": []}, {"id": "B_000770", "originalText": "किं तर्हि? बीजाङ्कुरवत्कार्यकारणभावोऽभ्युपगम्यत इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000770.mp3", "sections": []}, {"id": "B_000771", "originalText": "अत्रोच्यते— बीजाङ्कुराख्यो दृष्टान्तो यः, स साध्येन समः तुल्यो ममेत्यभिप्रायः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000771.mp3", "sections": []}, {"id": "B_000772", "originalText": "ननु प्रत्यक्षः कार्यकारणभावो बीजाङ्कुरयोरनादिः, न, पूर्वस्य पूर्वस्य अपरभावादादिमत्त्वाभ्युपगमात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000772.mp3", "sections": []}, {"id": "B_000773", "originalText": "यथा इदानीमुत्पन्नोऽपरोऽङ्कुरो बीजादादिमान् बीजं चापरमन्यस्मादङ्कुरादिति क्रमेणोत्पन्नत्वादादिमत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000773.mp3", "sections": []}, {"id": "B_000774", "originalText": "एवं पूर्वः पूर्वोऽङ्कुरो बीजं च पूर्वं पूर्वमादिमदेवेति प्रत्येकं सर्वस्य बीजाङ्कुरजातस्यादिमत्त्वात्कस्यचिदप्यनादित्वानुपपत्तिः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000774.mp3", "sections": []}, {"id": "B_000775", "originalText": "एवं हेतुफलयोः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000775.mp3", "sections": []}, {"id": "B_000776", "originalText": "अथ बीजाङ्कुरसन्ततेरनादिमत्त्वमिति चेत्, न, एकत्वानुपपत्तेः, न हि बीजाङ्कुरव्यतिरेकेण बीजाङ्कुरसन्ततिर्नामैका अभ्युपगम्यते हेतुफलसन्ततिर्वा तदनादित्ववादिभिः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000776.mp3", "sections": []}, {"id": "B_000777", "originalText": "तस्मात्सूक्तम् ‘हेतोः फलस्य चानादिः कथं तैरुपवर्ण्यते’ इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000777.mp3", "sections": []}, {"id": "B_000778", "originalText": "तथा च अन्यदप्यनुपपत्तेर्न च्छलमित्यभिप्रायः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000778.mp3", "sections": []}, {"id": "B_000779", "originalText": "न च लोके साध्यसमो हेतुः साध्यस्य सिद्धौ सिद्धिनिमित्तं युज्यते प्रयुज्यते प्रमाणकुशलैरित्यर्थः। हेतुरिति दृष्टान्तोऽत्रभिप्रेतः, गमकत्वात्, प्रकृतो हि दृष्टान्तः, न हेतुरिति॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000779.mp3", "sections": []}, {"id": "B_000780", "originalText": "पूर्वापरापरिज्ञानमजातेः परिदीपकम्। जायमानाद्धि वै धर्मात्कथं पूर्वं न गृह्यते॥ २१॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000780.mp3", "sections": []}, {"id": "B_000781", "originalText": "कथं बुद्धैरजातिः परिदीपितेति, आह— यदेतत् हेतुफलयोः पूर्वापरापरिज्ञानम्, तच्चैतत् अजातेः परिदीपकम् अवबोधकमित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000781.mp3", "sections": []}, {"id": "B_000782", "originalText": "जायमानो हि चेद्धर्मो गृह्यते, कथं तस्मात्पूर्वं कारणं न गृह्यते? अवश्यं हि जायमानस्य ग्रहीत्रा तज्जनकं ग्रहीतव्यम्, जन्यजनकयोः सम्बन्धस्यानपेतत्वात्, तस्मादजातिपरिदीपकं तदित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000782.mp3", "sections": []}, {"id": "B_000783", "originalText": "स्वतो वा परतो वापि न किञ्चिद्वस्तु जायते। सदसत्सदसद्वापि न किञ्चिद्वस्तु जायते॥ २२॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000783.mp3", "sections": []}, {"id": "B_000784", "originalText": "इतश्च न जायते किञ्चित् यज्जायमानं वस्तु स्वतः परतः उभयतो वा सत् असत् सदसद्वा न जायते, न तस्य केनचिदपि प्रकारेण जन्म सम्भवति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000784.mp3", "sections": []}, {"id": "B_000785", "originalText": "न तावत्स्वयमेवापरिनिष्पन्नात्स्वतः स्वरूपात्स्वयमेव जायते, यथा घटस्तस्मादेव घटात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000785.mp3", "sections": []}, {"id": "B_000786", "originalText": "नापि परतः अन्यस्मादन्यः, यथा घटात्पटः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000786.mp3", "sections": []}, {"id": "B_000787", "originalText": "तथा नोभयतः, विरोधात्, यथा घटपटाभ्यां घटः पटो वा न जायते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000787.mp3", "sections": []}, {"id": "B_000788", "originalText": "ननु मृदो घटो जायते पितुश्च पुत्रः, सत्यम्, अस्ति जायत इति प्रत्ययः शब्दश्च मूढानाम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000788.mp3", "sections": []}, {"id": "B_000789", "originalText": "तावेव तु शब्दप्रत्ययौ विवेकिभिः परीक्ष्येते— किं सत्यमेव तौ, उत मृषा इति, यावता परीक्ष्यमाणे शब्दप्रत्ययविषयं वस्तु घटपुत्रादिलक्षणं शब्दमात्रमेव तत्, ‘वाचारम्भणम्’ (छा.६.४.४) इति श्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000789.mp3", "sections": []}, {"id": "B_000790", "originalText": "सच्चेत् न जायते, सत्त्वात्, मृत्पित्रादिवत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000790.mp3", "sections": []}, {"id": "B_000791", "originalText": "यद्यसत्, तथापि न जायते, असत्त्वादेव, शशविषाणादिवत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000791.mp3", "sections": []}, {"id": "B_000792", "originalText": "अथ सदसत्, तथापि न जायते विरुद्धस्यैकस्यासम्भवात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000792.mp3", "sections": []}, {"id": "B_000793", "originalText": "अतो न किञ्चिद्वस्तु जायत इति सिद्धम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000793.mp3", "sections": []}, {"id": "B_000794", "originalText": "येषां पुनर्जनिरेव जायत इति क्रियाकारकफलैकत्वमभ्युपगम्यते क्षणिकत्वं च वस्तुनः, ते दूरत एव न्यायापेताः। इदमित्थमित्यवधारणक्षणान्तरानवस्थानात्, अननुभूतस्य स्मृत्यनुपपत्तेश्च॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000794.mp3", "sections": []}, {"id": "B_000795", "originalText": "हेतुर्न जायतेऽनादेः फलं चापि स्वभावतः। आदिर्न विद्यते यस्य तस्य ह्यादिर्न विद्यते॥ २३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000795.mp3", "sections": []}, {"id": "B_000796", "originalText": "किञ्च, हेतुफलयोरनादित्वमभ्युपगच्छता त्वया बलाद्धेतुफलयोरजन्मैवाभ्युपगतं स्यात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000796.mp3", "sections": []}, {"id": "B_000797", "originalText": "कथम्? अनादेः आदिरहितात्फलात् हेतुः न जायते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000797.mp3", "sections": []}, {"id": "B_000798", "originalText": "न ह्यनुत्पन्नादनादेः फलाद्धेतोर्जन्मेष्यते त्वया, फलं चापि आदिरहितादनादेर्हेतोरजात्स्वभावत एव निर्निमित्तं जायत इति नाभ्युपगम्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000798.mp3", "sections": []}, {"id": "B_000799", "originalText": "तस्मादनादित्वमभ्युपगच्छता त्वया हेतुफलयोरजन्मैवाभ्युपगम्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000799.mp3", "sections": []}, {"id": "B_000800", "originalText": "यस्मात् आदिः कारणं न विद्यते यस्य लोके, तस्य ह्यादिः पूर्वोक्ता जातिर्न विद्यते। कारणवत एव ह्यादिरभ्युपगम्यते, न अकारणवतः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000800.mp3", "sections": []}, {"id": "B_000801", "originalText": "प्रज्ञप्तेः सनिमित्तत्वमन्यथा द्वयनाशतः। सङ्क्लेशस्योपलब्धेश्च परतन्त्रास्तिता मता॥ २४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000801.mp3", "sections": []}, {"id": "B_000802", "originalText": "उक्तस्यैवार्थस्य दृढीकरणचिकीर्षया पुनराक्षिपति— प्रज्ञानं प्रज्ञप्तिः शब्दादिप्रतीतिः, तस्याः सनिमित्तत्वम्, निमित्तं कारणं विषय इत्येतत्, सनिमित्तत्वं सविषयत्वं स्वात्मव्यतिरिक्तविषयतेत्येतत्, प्रतिजानीमहे।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000802.mp3", "sections": []}, {"id": "B_000803", "originalText": "न हि निर्विषया प्रज्ञप्तिः शब्दादिप्रतीतिः स्यात्, तस्याः सनिमित्तत्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000803.mp3", "sections": []}, {"id": "B_000804", "originalText": "अन्यथा निर्विषयत्वे शब्दस्पर्शनीलपीतलोहितादिप्रत्ययवैचित्र्यस्य द्वयस्य नाशतः नाशोऽभावः प्रसज्येतेत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000804.mp3", "sections": []}, {"id": "B_000805", "originalText": "न च प्रत्ययवैचित्र्यस्य द्वयस्याभावोऽस्ति, प्रत्यक्षत्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000805.mp3", "sections": []}, {"id": "B_000806", "originalText": "अतः प्रत्ययवैचित्र्यस्य द्वयस्य दर्शनात्, परेषां तन्त्रं परतन्त्रमित्यन्यशास्त्रम्, तस्य परतन्त्रस्य परतन्त्राश्रयस्य बाह्यार्थस्य प्रज्ञानव्यतिरिक्तस्य अस्तिता मता अभिप्रेता।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000806.mp3", "sections": []}, {"id": "B_000807", "originalText": "न हि प्रज्ञप्तेः प्रकाशमात्रस्वरूपाया नीलपीतादिबाह्यालम्बनवैचित्र्यमन्तरेण स्वभावभेदेनैतद्वैचित्र्यं सम्भवति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000807.mp3", "sections": []}, {"id": "B_000808", "originalText": "स्फटिकस्येव नीलाद्युपाध्याश्रयैर्विना वैचित्र्यं न घटत इत्यभिप्रायः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000808.mp3", "sections": []}, {"id": "B_000809", "originalText": "इतश्च परतन्त्राश्रयस्य बाह्यार्थस्य ज्ञानव्यतिरिक्तस्यास्तिता।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000809.mp3", "sections": []}, {"id": "B_000810", "originalText": "सङ्क्लेशनं सङ्क्लेशः, दुःखमित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000810.mp3", "sections": []}, {"id": "B_000811", "originalText": "उपलभ्यते हि अग्निदाहादिनिमित्तं दुःखम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000811.mp3", "sections": []}, {"id": "B_000812", "originalText": "यद्यग्न्यादिबाह्यं दाहादिनिमित्तं विज्ञानव्यतिरिक्तं न स्यात्, ततो दाहादिदुःखं नोपलभ्येत।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000812.mp3", "sections": []}, {"id": "B_000813", "originalText": "उपलभ्यते तु।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000813.mp3", "sections": []}, {"id": "B_000814", "originalText": "अतः तेन मन्यामहे अस्ति बाह्योऽर्थ इति। न हि विज्ञानमात्रे सङ्क्लेशो युक्तः, अन्यत्रादर्शनादित्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000814.mp3", "sections": []}, {"id": "B_000815", "originalText": "प्रज्ञप्तेः सनिमित्तत्वमिष्यते युक्तिदर्शनात्। निमित्तस्यानिमित्तत्वमिष्यते भूतदर्शनात्॥ २५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000815.mp3", "sections": []}, {"id": "B_000816", "originalText": "अत्रोच्यते— बाढमेवं प्रज्ञप्तेः सनिमित्तत्वं द्वयसङ्क्लेशोपलब्धियुक्तिदर्शनादिष्यते त्वया।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000816.mp3", "sections": []}, {"id": "B_000817", "originalText": "स्थिरीभव तावत्त्वं युक्तिदर्शनं वस्तुनस्तथात्वाभ्युपगमे कारणमित्यत्र।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000817.mp3", "sections": []}, {"id": "B_000818", "originalText": "ब्रूहि किं तत इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000818.mp3", "sections": []}, {"id": "B_000819", "originalText": "उच्यते— निमित्तस्य प्रज्ञप्त्यालम्बनाभिमतस्य तव घटादेरनिमित्तत्वमनालम्बनत्वं वैचित्र्याहेतुत्वमिष्यतेऽस्माभिः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000819.mp3", "sections": []}, {"id": "B_000820", "originalText": "कथम्? भूतदर्शनात् परमार्थदर्शनादित्येतत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000820.mp3", "sections": []}, {"id": "B_000821", "originalText": "न हि घटो यथाभूतमृद्रूपदर्शने सति तद्व्यतिरेकेणास्ति, यथा अश्वान्महिषः, पटो वा तन्तुव्यतिरेकेण तन्तवश्चांशुव्यतिरेकेण इत्येवमुत्तरोत्तरभूतदर्शन आ शब्दप्रत्ययनिरोधान्नैव निमित्तमुपलभामहे इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000821.mp3", "sections": []}, {"id": "B_000822", "originalText": "अथ वा, अभूतदर्शनाद्बाह्यार्थस्य अनिमित्तत्वमिष्यते रज्ज्वादाविव सर्पादेरित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000822.mp3", "sections": []}, {"id": "B_000823", "originalText": "भ्रान्तिदर्शनविषयत्वाच्च निमित्तस्यानिमित्तत्वं भवेत्, तदभावे अभानात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000823.mp3", "sections": []}, {"id": "B_000824", "originalText": "न हि सुषुप्तसमाहितमुक्तानां भ्रान्तिदर्शनाभावे आत्मव्यतिरिक्तो बाह्योऽर्थ उपलभ्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000824.mp3", "sections": []}, {"id": "B_000825", "originalText": "न ह्युन्मत्तावगतं वस्त्वनुन्मत्तैरपि तथाभूतं गम्यते। एतेन द्वयदर्शनं सङ्क्लेशोपलब्धिश्च प्रत्युक्ता॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000825.mp3", "sections": []}, {"id": "B_000826", "originalText": "चित्तं न संस्पृशत्यर्थं नार्थाभासं तथैव च। अभूतो हि यतश्चार्थो नार्थाभासस्ततः पृथक्॥ २६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000826.mp3", "sections": []}, {"id": "B_000827", "originalText": "यस्मान्नास्ति बाह्यं निमित्तम्, अतः चित्तं न स्पृशत्यर्थं बाह्यालम्बनविषयम्, नाप्यर्थाभासम्, चित्तत्वात्, स्वप्नचित्तवत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000827.mp3", "sections": []}, {"id": "B_000828", "originalText": "अभूतो हि जागरितेऽपि स्वप्नार्थवदेव बाह्यः शब्दाद्यर्थो यतः उक्तहेतुत्वाच्च।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000828.mp3", "sections": []}, {"id": "B_000829", "originalText": "नाप्यर्थाभासश्चित्तात्पृथक्। चित्तमेव हि घटाद्यर्थवदवभासते यथा स्वप्ने॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2re
