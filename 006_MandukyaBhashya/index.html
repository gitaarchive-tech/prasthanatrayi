    <script>
        const manifest = [{"id": "B_000000", "originalText": "श्रीमच्छङ्करभगवत्पादविरचितम् माण्डूक्योपनिषद्भाष्यम्\n\nआगमप्रकरणम्\nप्रज्ञानांशुप्रतानैः स्थिरचरनिकरव्यापिभिर्व्याप्य लोका—\nन्भुक्त्वा भोगान्स्थविष्ठान्पुनरपि धिषणोद्भासितान्कामजन्यान्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000000.mp3", "sections": ["आगमप्रकरणम्"]}, {"id": "B_000001", "originalText": "पीत्वा सर्वान्विशेषान्स्वपिति मधुरभुङ्मायया भोजयन्नो\nमायासङ्ख्यातुरीयं परममृतमजं ब्रह्म यत्तन्नतोऽस्मि॥ १॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000001.mp3", "sections": []}, {"id": "B_000002", "originalText": "यो विश्वात्मा विधिजविषयान्प्राश्य भोगान्स्थविष्ठा—\nन्पश्चाच्चान्यान्स्वमतिविभवाञ्ज्योतिषा स्वेन सूक्ष्मान्। सर्वानेतान्पुनरपि शनैः स्वात्मनि स्थापयित्वा\nहित्वा सर्वान्विशेषान्विगतगुणगणः पात्वसौ नस्तुरीयः॥ २॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000002.mp3", "sections": []}, {"id": "B_000003", "originalText": "ओमित्येतदक्षरमिदं सर्वं तस्योपव्याख्यानम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000003.mp3", "sections": []}, {"id": "B_000004", "originalText": "वेदान्तार्थसारसङ्ग्रहभूतमिदं प्रकरणचतुष्टयम् ओमित्येतदक्षरमित्यादि आरभ्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000004.mp3", "sections": []}, {"id": "B_000005", "originalText": "अत एव न पृथक् सम्बन्धाभिधेयप्रयोजनानि वक्तव्यानि।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000005.mp3", "sections": []}, {"id": "B_000006", "originalText": "यान्येव तु वेदान्ते सम्बन्धाभिधेयप्रयोजनानि, तान्येवेहापि भवितुमर्हन्ति, तथापि प्रकरणव्याचिख्यासुना सङ्क्षेपतो वक्तव्यानीति मन्यन्ते व्याख्यातारः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000006.mp3", "sections": []}, {"id": "B_000007", "originalText": "तत्र प्रयोजनवत्साधनाभिव्यञ्जकत्वेनाभिधेयसम्बद्धं शास्त्रं पारम्पर्येण विशिष्टसम्बन्धाभिधेयप्रयोजनवद्भवति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000007.mp3", "sections": []}, {"id": "B_000008", "originalText": "किं पुनस्तत्प्रयोजनमिति, उच्यते— रोगार्तस्येव रोगनिवृत्तौ स्वस्थता, तथा दुःखात्मकस्यात्मनो द्वैतप्रपञ्चोपशमे स्वस्थता, अद्वैतभावः प्रयोजनम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000008.mp3", "sections": []}, {"id": "B_000009", "originalText": "द्वैतप्रपञ्चस्य चाविद्याकृतत्वाद्विद्यया तदुपशमः स्यादिति ब्रह्मविद्याप्रकाशनाय अस्यारम्भः क्रियते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000009.mp3", "sections": []}, {"id": "B_000010", "originalText": "‘यत्र हि द्वैतमिव भवति’ (बृ.२.४.१४), (बृ.४.५.१५) ‘यत्र वान्यदिव स्यात्तत्रान्योऽन्यत्पश्येदन्योऽन्यद्विजानीयात्’ (बृ.४.३.३१) ‘यत्र त्वस्य सर्वमात्मैवाभूत्तत्केन कं पश्येत्तत्केन कं विजानीयात्’ (बृ.४.५.१५) इत्यादिश्रुतिभ्योऽस्यार्थस्य सिद्धिः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000010.mp3", "sections": []}, {"id": "B_000011", "originalText": "तत्र तावदोङ्कारनिर्णयाय प्रथमं प्रकरणमागमप्रधानमात्मतत्त्वप्रतिपत्त्युपायभूतम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000011.mp3", "sections": []}, {"id": "B_000012", "originalText": "यस्य द्वैतप्रपञ्चस्योपशमे अद्वैतप्रतिपत्तिः रज्ज्वामिव सर्पादिविकल्पोपशमे रज्जुतत्त्वप्रतिपत्तिः, तस्य द्वैतस्य हेतुतो वैतथ्यप्रतिपादनाय द्वितीयं प्रकरणम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000012.mp3", "sections": []}, {"id": "B_000013", "originalText": "तथा अद्वैतस्यापि वैतथ्यप्रसङ्गप्राप्तौ, युक्तितस्तथात्वप्रतिपादनाय तृतीयं प्रकरणम्। अद्वैतस्य तथात्वप्रतिपत्तिविपक्षभूतानि यानि वादान्तराण्यवैदिकानि सन्ति, तेषामन्योन्यविरोधित्वादतथार्थत्वेन तदुपपत्तिभिरेव निराकरणाय चतुर्थं प्रकरणम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000013.mp3", "sections": []}, {"id": "B_000014", "originalText": "ओमित्येतदक्षरमिदं सर्वं तस्योपव्याख्यानं भूतं भवद्भविष्यदिति सर्वमोङ्कार एव। यच्चान्यत्त्रिकालातीतं तदप्योङ्कार एव॥ १॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000014.mp3", "sections": []}, {"id": "B_000015", "originalText": "कथं पुनरोङ्कारनिर्णय आत्मतत्त्वप्रतिपत्त्युपायत्वं प्रतिपद्यत इति, उच्यते— ‘ओमित्येतत्’ (क.१.२.१५) ‘एतदालम्बनम्’ (क.१.२.१७) ‘एतद्वै सत्यकाम परं चापरं च ब्रह्म यदोङ्कारः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000015.mp3", "sections": []}, {"id": "B_000016", "originalText": "तस्माद्विद्वानेतेनैवायतनेनैकतरमन्वेति’ (प्र.५.२) ‘ओमित्यात्मानं युञ्जीत’ (ना.७९) ‘ओमिति ब्रह्म’ (तै.१.८.१) ‘ओङ्कार एवेदं सर्वम्’ (छा.२.२३.३) इत्यादिश्रुतिभ्यः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000016.mp3", "sections": []}, {"id": "B_000017", "originalText": "रज्ज्वादिरिव सर्पादिविकल्पस्यास्पदमद्वय आत्मा परमार्थतः सन्प्राणादिविकल्पस्यास्पदं यथा, तथा सर्वोऽपि वाक्प्रपञ्चः प्राणाद्यात्मविकल्पविषय ओङ्कार एव।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000017.mp3", "sections": []}, {"id": "B_000018", "originalText": "स चात्मस्वरूपमेव, तदभिधायकत्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000018.mp3", "sections": []}, {"id": "B_000019", "originalText": "ओङ्कारविकारशब्दाभिधेयश्च सर्वः प्राणादिरात्मविकल्पः अभिधानव्यतिरेकेण नास्ति, ‘वाचारम्भणं विकारो नामधेयम्’ (छा.६.१.४) ‘तदस्येदं वाचा तन्त्या नामभिर्दामभिः सर्वं सितम्, सर्वं हीदं नामनि’ (ऐ.आ.२.१.६) इत्यादिश्रुतिभ्यः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000019.mp3", "sections": []}, {"id": "B_000020", "originalText": "अत आह— ओमित्येतदक्षरमिदं सर्वमिति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000020.mp3", "sections": []}, {"id": "B_000021", "originalText": "यदिदम् अर्थजातमभिधेयभूतम्, तस्य अभिधानाव्यतिरेकात्, अभिधानभेदस्य च ओङ्काराव्यतिरेकात् ओङ्कार एवेदं सर्वम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000021.mp3", "sections": []}, {"id": "B_000022", "originalText": "परं च ब्रह्म अभिधानाभिधेयोपायपूर्वकमवगम्यत इत्योङ्कार एव।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000022.mp3", "sections": []}, {"id": "B_000023", "originalText": "तस्य एतस्य परापरब्रह्मरूपस्याक्षरस्य ओमित्येतस्य उपव्याख्यानम्, ब्रह्मप्रतिपत्त्युपायत्वाद्ब्रह्मसमीपतया विस्पष्टं प्रकथनमुपव्याख्यानम्, प्रस्तुतं वेदितव्यमिति वाक्यशेषः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000023.mp3", "sections": []}, {"id": "B_000024", "originalText": "भूतं भवत् भविष्यत् इति कालत्रयपरिच्छेद्यं यत्, तदपि ओङ्कार एव, उक्तन्यायतः। यच्च अन्यत् त्रिकालातीतं कार्याधिगम्यं कालापरिच्छेद्यमव्याकृतादि, तदपि ओङ्कार एव॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000024.mp3", "sections": []}, {"id": "B_000025", "originalText": "सर्वं ह्येतद्ब्रह्मायमात्मा ब्रह्म सोऽयमात्मा चतुष्पात्॥ २॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000025.mp3", "sections": []}, {"id": "B_000026", "originalText": "अभिधानाभिधेययोरेकत्वेऽपि अभिधानप्राधान्येन निर्देशः कृतः ‘ओमित्येतदक्षरमिदं सर्वम्’ इत्यादि।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000026.mp3", "sections": []}, {"id": "B_000027", "originalText": "अभिधानप्राधान्येन निर्दिष्टस्य पुनरभिधेयप्राधान्येन निर्देशः अभिधानाभिधेययोरेकत्वप्रतिपत्त्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000027.mp3", "sections": []}, {"id": "B_000028", "originalText": "इतरथा हि अभिधानतन्त्राभिधेयप्रतिपत्तिरिति अभिधेयस्याभिधानत्वं गौणमित्याशङ्का स्यात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000028.mp3", "sections": []}, {"id": "B_000029", "originalText": "एकत्वप्रतिपत्तेश्च प्रयोजनमभिधानाभिधेययोः— एकेनैव प्रयत्नेन युगपत्प्रविलापयंस्तद्विलक्षणं ब्रह्म प्रतिपद्येतेति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000029.mp3", "sections": []}, {"id": "B_000030", "originalText": "तथा च वक्ष्यति— ‘पादा मात्रा मात्राश्च पादाः’ (मा.८) इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000030.mp3", "sections": []}, {"id": "B_000031", "originalText": "तदाह— सर्वं ह्येतद्ब्रह्मेति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000031.mp3", "sections": []}, {"id": "B_000032", "originalText": "सर्वं यदुक्तमोङ्कारमात्रमिति, तदेतत् ब्रह्म।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000032.mp3", "sections": []}, {"id": "B_000033", "originalText": "तच्च ब्रह्म परोक्षाभिहितं प्रत्यक्षतो विशेषेण निर्दिशति— अयमात्मा ब्रह्मेति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000033.mp3", "sections": []}, {"id": "B_000034", "originalText": "अयम् इति चतुष्पात्त्वेन प्रविभज्यमानं प्रत्यगात्मतयाभिनयेन निर्दिशति अयमात्मेति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000034.mp3", "sections": []}, {"id": "B_000035", "originalText": "सोऽयमात्मा ओङ्काराभिधेयः परापरत्वेन व्यवस्थितः चतुष्पात् कार्षापणवत्, न गौरिव। त्रयाणां विश्वादीनां पूर्वपूर्वप्रविलापनेन तुरीयस्य प्रतिपत्तिरिति करणसाधनः पादशब्दः, तुरीयस्य तु पद्यत इति कर्मसाधनः पादशब्दः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000035.mp3", "sections": []}, {"id": "B_000036", "originalText": "जागरितस्थानो बहिःप्रज्ञः सप्ताङ्ग एकोनविंशतिमुखः स्थूलभुग्वैश्वानरः प्रथमः पादः॥ ३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000036.mp3", "sections": []}, {"id": "B_000037", "originalText": "कथं चतुष्पात्त्वमित्याह— जागरितस्थान इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000037.mp3", "sections": []}, {"id": "B_000038", "originalText": "जागरितं स्थानमस्येति जागरितस्थानः, बहिःप्रज्ञः स्वात्मव्यतिरिक्ते विषये प्रज्ञा यस्य, सः बहिःप्रज्ञः, बहिर्विषयेव प्रज्ञा यस्याविद्याकृतावभासत इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000038.mp3", "sections": []}, {"id": "B_000039", "originalText": "तथा सप्त अङ्गान्यस्य, ‘तस्य ह वा एतस्यात्मनो वैश्वानरस्य मूर्धैव सुतेजाश्चक्षुर्विश्वरूपः प्राणः पृथग्वर्त्मात्मा सन्देहो बहुलो वस्तिरेव रयिः पृथिव्येव पादौ’ (छा.५.१८.२) इत्यग्निहोत्राहुतिकल्पनाशेषत्वेनाग्निर्मुखत्वेनाहवनीय उक्त इत्येवं सप्ताङ्गानि यस्य, सः सप्ताङ्गः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000039.mp3", "sections": []}, {"id": "B_000040", "originalText": "तथा एकोनविंशतिर्मुखान्यस्य, बुद्धीन्द्रियाणि कर्मेन्द्रियाणि च दश, वायवश्च प्राणादयः पञ्च, मनो बुद्धिरहङ्कारश्चित्तमिति, मुखानीव मुखानि तानि, उपलब्धिद्वाराणीत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000040.mp3", "sections": []}, {"id": "B_000041", "originalText": "स एवंविशिष्टो वैश्वानरः यथोक्तैर्द्वारैः शब्दादीन्स्थूलान्विषयान्भुङ्क्त इति स्थूलभुक्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000041.mp3", "sections": []}, {"id": "B_000042", "originalText": "विश्वेषां नराणामनेकधा सुखादिनयनाद्विश्वानरः, यद्वा विश्वश्चासौ नरश्चेति विश्वानरः, विश्वानर एव वैश्वानरः, सर्वपिण्डात्मानन्यत्वात्, स प्रथमः पादः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000042.mp3", "sections": []}, {"id": "B_000043", "originalText": "एतत्पूर्वकत्वादुत्तरपादाधिगमस्य प्राथम्यमस्य।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000043.mp3", "sections": []}, {"id": "B_000044", "originalText": "कथम् ‘अयमात्मा ब्रह्म’ इति प्रत्यगात्मनोऽस्य चतुष्पात्त्वे प्रकृते द्युलोकादीनां मूर्धाद्यङ्गत्वमिति? नैष दोषः, सर्वस्य प्रपञ्चस्य साधिदैविकस्य अनेनात्मना चतुष्पात्त्वस्य विवक्षितत्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000044.mp3", "sections": []}, {"id": "B_000045", "originalText": "एवं च सति सर्वप्रपञ्चोपशमे अद्वैतसिद्धिः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000045.mp3", "sections": []}, {"id": "B_000046", "originalText": "सर्वभूतस्थश्च आत्मा एको दृष्टः स्यात्, सर्वभूतानि चात्मनि।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000046.mp3", "sections": []}, {"id": "B_000047", "originalText": "‘यस्तु सर्वाणि भूतानि’ (ई.६) इत्यादिश्रुत्यर्थश्चैवमुपसंहृतः स्यात्, अन्यथा हि स्वदेहपरिच्छिन्न एव प्रत्यगात्मा साङ्‍ख्यादिभिरिव दृष्टः स्यात्, तथा च सति अद्वैतमिति श्रुतिकृतो विशेषो न स्यात्, साङ्‍ख्यादिदर्शनेनाविशेषात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000047.mp3", "sections": []}, {"id": "B_000048", "originalText": "इष्यते च सर्वोपनिषदां सर्वात्मैक्यप्रतिपादकत्वम्, ततो युक्तमेवास्य आध्यात्मिकस्य पिण्डात्मनो द्युलोकाद्यङ्गत्वेन विराडात्मनाधिदैविकेनैकत्वमित्यभिप्रेत्य सप्ताङ्गत्ववचनम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000048.mp3", "sections": []}, {"id": "B_000049", "originalText": "‘मूर्धा ते व्यपतिष्यत्’ (छा.५.१२.२) इत्यादिलिङ्गदर्शनाच्च।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000049.mp3", "sections": []}, {"id": "B_000050", "originalText": "विराजैकत्वमुपलक्षणार्थं हिरण्यगर्भाव्याकृतात्मनोः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000050.mp3", "sections": []}, {"id": "B_000051", "originalText": "उक्तं चैतन्मधुब्राह्मणे— ‘यश्चायमस्यां पृथिव्यां तेजोमयोऽमृतमयः पुरुषो यश्चायमध्यात्मम्’ (बृ.२.५.१) इत्यादि।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000051.mp3", "sections": []}, {"id": "B_000052", "originalText": "सुषुप्ताव्याकृतयोस्त्वेकत्वं सिद्धमेव, निर्विशेषत्वात्। एवं च सत्येतत्सिद्धं भविष्यति— सर्वद्वैतोपशमे चाद्वैतमिति॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000052.mp3", "sections": []}, {"id": "B_000053", "originalText": "स्वप्नस्थानोऽन्तःप्रज्ञः सप्ताङ्ग एकोनविंशतिमुखः प्रविविक्तभुक्तैजसो द्वितीयः पादः॥ ४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000053.mp3", "sections": []}, {"id": "B_000054", "originalText": "स्वप्नः स्थानमस्य तैजसस्येति स्वप्नस्थानः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000054.mp3", "sections": []}, {"id": "B_000055", "originalText": "जाग्रत्प्रज्ञा अनेकसाधना बहिर्विषयेवावभासमाना मनःस्पन्दनमात्रा सती तथाभूतं संस्कारं मनस्याधत्ते, तन्मनः तथा संस्कृतं चित्रित इव पटो बाह्यसाधनानपेक्षमविद्याकामकर्मभिः प्रेर्यमाणं जाग्रद्वदवभासते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000055.mp3", "sections": []}, {"id": "B_000056", "originalText": "तथा चोक्तम्— ‘अस्य लोकस्य सर्वावतो मात्रामपादाय’ (बृ.४.३.९) इत्यादि।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000056.mp3", "sections": []}, {"id": "B_000057", "originalText": "तथा ‘परे देवे मनस्येकीभवति’ (प्र.४.२) इति प्रस्तुत्य ‘अत्रैष देवः स्वप्ने महिमानमनुभवति’ (प्र.४.५) इत्याथर्वणे।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000057.mp3", "sections": []}, {"id": "B_000058", "originalText": "इन्द्रियापेक्षया अन्तःस्थत्वान्मनसः तद्वासनारूपा च स्वप्ने प्रज्ञा यस्येति अन्तःप्रज्ञः, विषयशून्यायां प्रज्ञायां केवलप्रकाशस्वरूपायां विषयित्वेन भवतीति तैजसः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000058.mp3", "sections": []}, {"id": "B_000059", "originalText": "विश्वस्य सविषयत्वेन प्रज्ञायाः स्थूलाया भोज्यत्वम्, इह पुनः केवला वासनामात्रा प्रज्ञा भोज्येति प्रविविक्तो भोग इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000059.mp3", "sections": []}, {"id": "B_000060", "originalText": "समानमन्यत्। द्वितीयः पादः तैजसः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000060.mp3", "sections": []}, {"id": "B_000061", "originalText": "यत्र सुप्तो न कञ्चन कामं कामयते न कञ्चन स्वप्नं पश्यति तत्सुषुप्तम्। सुषुप्तस्थान एकीभूतः प्रज्ञानघन एवानन्दमयो ह्यानन्दभुक्चेतोमुखः प्राज्ञस्तृतीयः पादः॥ ५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000061.mp3", "sections": []}, {"id": "B_000062", "originalText": "दर्शनादर्शनवृत्त्योः स्वापस्य तुल्यत्वात्सुषुप्तग्रहणार्थं यत्र सुप्त इत्यादिविशेषणम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000062.mp3", "sections": []}, {"id": "B_000063", "originalText": "अथवा, त्रिष्वपि स्थानेषु तत्त्वाप्रतिबोधलक्षणः स्वापोऽविशिष्ट इति पूर्वाभ्यां सुषुप्तं विभजते— यत्र यस्मिन्स्थाने काले वा सुप्तो न कञ्चन कामं कामयते न कञ्चन स्वप्नं पश्यति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000063.mp3", "sections": []}, {"id": "B_000064", "originalText": "न हि सुषुप्ते पूर्वयोरिवान्यथाग्रहणलक्षणं स्वप्नदर्शनं कामो वा कश्चन विद्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000064.mp3", "sections": []}, {"id": "B_000065", "originalText": "तदेतत्सुषुप्तं स्थानमस्येति सुषुप्तस्थानः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000065.mp3", "sections": []}, {"id": "B_000066", "originalText": "स्थानद्वयप्रविभक्तं मनःस्पन्दितं द्वैतजातं तथा रूपापरित्यागेनाविवेकापन्नं नैशतमोग्रस्तमिवाहः सप्रपञ्चमेकीभूतमित्युच्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000066.mp3", "sections": []}, {"id": "B_000067", "originalText": "अत एव स्वप्नजाग्रन्मनःस्पन्दनानि प्रज्ञानानि घनीभूतानीव, सेयमवस्था अविवेकरूपत्वात्प्रज्ञानघन उच्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000067.mp3", "sections": []}, {"id": "B_000068", "originalText": "यथा रात्रौ नैशेन तमसा अविभज्यमानं सर्वं घनमिव, तद्वत्प्रज्ञानघन एव।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000068.mp3", "sections": []}, {"id": "B_000069", "originalText": "एवशब्दान्न जात्यन्तरं प्रज्ञानव्यतिरेकेणास्तीत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000069.mp3", "sections": []}, {"id": "B_000070", "originalText": "मनसो विषयविषय्याकारस्पन्दनायासदुःखाभावात् आनन्दमयः आनन्दप्रायः, नानन्द एव, अनात्यन्तिकत्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000070.mp3", "sections": []}, {"id": "B_000071", "originalText": "यथा लोके निरायासः स्थितः सुख्यानन्दभुगुच्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000071.mp3", "sections": []}, {"id": "B_000072", "originalText": "अत्यन्तानायासरूपा हीयं स्थितिरनेनात्मनानुभूयत इत्यानन्दभुक्, ‘एषोऽस्य परम आनन्दः’ (बृ.४.३.३२) इति श्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000072.mp3", "sections": []}, {"id": "B_000073", "originalText": "स्वप्नादिप्रतिबोधं चेतः प्रति द्वारीभूतत्वात् चेतोमुखः, बोधलक्षणं वा चेतो द्वारं मुखमस्य स्वप्नाद्यागमनं प्रतीति चेतोमुखः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000073.mp3", "sections": []}, {"id": "B_000074", "originalText": "भूतभविष्यज्ज्ञातृत्वं सर्वविषयज्ञातृत्वमस्यैवेति प्राज्ञः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000074.mp3", "sections": []}, {"id": "B_000075", "originalText": "सुषुप्तोऽपि हि भूतपूर्वगत्या प्राज्ञ उच्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000075.mp3", "sections": []}, {"id": "B_000076", "originalText": "अथवा, प्रज्ञप्तिमात्रमस्यैव असाधारणं रूपमिति प्राज्ञः, इतरयोर्विशिष्टमपि विज्ञानमस्तीति। सोऽयं प्राज्ञस्तृतीयः पादः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000076.mp3", "sections": []}, {"id": "B_000077", "originalText": "एष सर्वेश्वर एष सर्वज्ञ एषोऽन्तर्याम्येष योनिः सर्वस्य प्रभवाप्ययौ हि भूतानाम्॥ ६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000077.mp3", "sections": []}, {"id": "B_000078", "originalText": "एषः हि स्वरूपावस्थः सर्वेश्वरः साधिदैविकस्य भेदजातस्य सर्वस्य ईश्वरः ईशिता, नैतस्माज्जात्यन्तरभूतोऽन्येषामिव, ‘प्राणबन्धनं हि सोम्य मनः’ (छा.६.८.२) इति श्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000078.mp3", "sections": []}, {"id": "B_000079", "originalText": "अयमेव हि सर्वस्य सर्वभेदावस्थो ज्ञातेति एषः सर्वज्ञः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000079.mp3", "sections": []}, {"id": "B_000080", "originalText": "अत एव एषः अन्तर्यामी, अन्तरनुप्रविश्य सर्वेषां भूतानां यमयिता नियन्ताप्येष एव।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000080.mp3", "sections": []}, {"id": "B_000081", "originalText": "अत एव यथोक्तं सभेदं जगत्प्रसूयत इति एषः योनिः सर्वस्य। यत एवम्, प्रभवश्चाप्ययश्च प्रभवाप्ययौ हि भूतानामेष एव॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000081.mp3", "sections": []}, {"id": "B_000082", "originalText": "अत्रैते श्लोका भवन्ति—\nबहिःप्रज्ञो विभुर्विश्वो ह्यन्तःप्रज्ञस्तु तैजसः। घनप्रज्ञस्तथा प्राज्ञ एक एव त्रिधा स्थितः॥ १॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000082.mp3", "sections": []}, {"id": "B_000083", "originalText": "अत्र एतस्मिन्यथोक्तेऽर्थे एते श्लोका भवन्ति— बहिःप्रज्ञ इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000083.mp3", "sections": []}, {"id": "B_000084", "originalText": "पर्यायेण त्रिस्थानत्वात् सोऽहमिति स्मृत्या प्रतिसन्धानाच्च स्थानत्रयव्यतिरिक्तत्वमेकत्वं शुद्धत्वमसङ्गत्वं च सिद्धमित्यभिप्रायः, महामत्स्यादिदृष्टान्तश्रुतेः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000084.mp3", "sections": []}, {"id": "B_000085", "originalText": "दक्षिणाक्षिमुखे विश्वो मनस्यन्तस्तु तैजसः। आकाशे च हृदि प्राज्ञस्त्रिधा देहे व्यवस्थितः॥ २॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000085.mp3", "sections": []}, {"id": "B_000086", "originalText": "जागरितावस्थायामेव विश्वादीनां त्रयाणामनुभवप्रदर्शनार्थोऽयं श्लोकः— दक्षिणाक्षीति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000086.mp3", "sections": []}, {"id": "B_000087", "originalText": "दक्षिणमक्ष्येव मुखम्, तस्मिन्प्राधान्येन द्रष्टा स्थूलानां विश्वः अनुभूयते, ‘इन्धो ह वै नामैष योऽयं दक्षिणेऽक्षन्पुरुषः’ (बृ.४.२.२) इति श्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000087.mp3", "sections": []}, {"id": "B_000088", "originalText": "इन्धो दीप्तिगुणो वैश्वानर आदीत्यान्तर्गतो वैराज आत्मा चक्षुषि च द्रष्टैकः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000088.mp3", "sections": []}, {"id": "B_000089", "originalText": "नन्वन्यो हिरण्यगर्भः, क्षेत्रज्ञो दक्षिणेऽक्षिण्यक्ष्णोर्नियन्ता द्रष्टा चान्यो देहस्वामी, न, स्वतो भेदानभ्युपगमात्, ‘एको देवः सर्वभूतेषु गूढः’ (श्वे.६.११) इति श्रुतेः, ‘क्षेत्रज्ञं चापि मां विद्धि सर्वक्षेत्रेषु भारत’ (भ.गी.१३.२) ‘अविभक्तं च भूतेषु विभक्तमिव च स्थितम्’ (भ.गी.१३.१६) इति स्मृतेश्च, सर्वेषु करणेष्वविशेषेष्वपि दक्षिणाक्षिण्युपलब्धिपाटवदर्शनात्तत्र विशेषेण निर्देशोऽस्य विश्वस्य।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000089.mp3", "sections": []}, {"id": "B_000090", "originalText": "दक्षिणाक्षिगतो दृष्ट्वा रूपं निमीलिताक्षस्तदेव स्मरन्मनस्यन्तः स्वप्न इव तदेव वासनारूपाभिव्यक्तं पश्यति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000090.mp3", "sections": []}, {"id": "B_000091", "originalText": "यथा तत्र तथा स्वप्ने, अतः मनसि अन्तस्तु तैजसोऽपि विश्व एव।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000091.mp3", "sections": []}, {"id": "B_000092", "originalText": "आकाशे च हृदि स्मरणाख्यव्यापारोपरमे प्राज्ञ एकीभूतो घनप्रज्ञ एव भवति, मनोव्यापाराभावात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000092.mp3", "sections": []}, {"id": "B_000093", "originalText": "दर्शनस्मरणे एव हि मनःस्पन्दितम्, तदभावे हृद्येवाविशेषेण प्राणात्मनावस्थानम्, ‘प्राणो ह्येवैतान्सर्वान्संवृङ्क्ते’ (छा.४.३.३) इति श्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000093.mp3", "sections": []}, {"id": "B_000094", "originalText": "तैजसः हिरण्यगर्भः, मनःस्थत्वात्, ‘लिङ्गं मनः’ (बृ.४.४.६) ‘मनोमयोऽयं पुरुषः’ (बृ.५.६.१) इत्यादिश्रुतिभ्यः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000094.mp3", "sections": []}, {"id": "B_000095", "originalText": "ननु, व्याकृतः प्राणः सुषुप्ते, तदात्मकानि करणानि भवन्ति, कथमव्याकृतता? नैष दोषः, अव्याकृतस्य देशकालविशेषाभावात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000095.mp3", "sections": []}, {"id": "B_000096", "originalText": "यद्यपि प्राणाभिमाने सति व्याकृततैव प्राणस्य, तथापि पिण्डपरिच्छिन्नविशेषाभिमाननिरोधः प्राणे भवतीत्यव्याकृत एव प्राणः सुषुप्ते परिच्छिन्नाभिमानवताम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000096.mp3", "sections": []}, {"id": "B_000097", "originalText": "यथा प्राणलये परिच्छिन्नाभिमानिनां प्राणोऽव्याकृतः, तथा प्राणाभिमानिनोऽप्यविशेषापत्तावव्याकृतता समाना, प्रसवबीजात्मकत्वं च।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000097.mp3", "sections": []}, {"id": "B_000098", "originalText": "तदध्यक्षश्चैकोऽव्याकृतावस्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000098.mp3", "sections": []}, {"id": "B_000099", "originalText": "परिच्छिन्नाभिमानिनामध्यक्षाणां च तेनैकत्वमिति पूर्वोक्तं विशेषणमेकीभूतः प्रज्ञानघन इत्याद्युपपन्नम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000099.mp3", "sections": []}, {"id": "B_000100", "originalText": "तस्मिन्नेतस्मिन्नुक्तहेतुसत्त्वाच्च।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000100.mp3", "sections": []}, {"id": "B_000101", "originalText": "कथं प्राणशब्दत्वमव्याकृतस्य? ‘प्राणबन्धनं हि सोम्य मनः’ (छा.६.८.२) इति श्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000101.mp3", "sections": []}, {"id": "B_000102", "originalText": "ननु, तत्र ‘सदेव सोम्य’ (छा.६.२.१) इति प्रकृतं सद्ब्रह्म प्राणशब्दवाच्यम्, नैष दोषः, बीजात्मकत्वाभ्युपगमात्सतः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000102.mp3", "sections": []}, {"id": "B_000103", "originalText": "यद्यपि सद्ब्रह्म प्राणशब्दवाच्यं तत्र, तथापि जीवप्रसवबीजात्मकत्वमपरित्यज्यैव प्राणशब्दत्वं सतः सच्छब्दवाच्यता च।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000103.mp3", "sections": []}, {"id": "B_000104", "originalText": "यदि हि निर्बीजरूपं विवक्षितं ब्रह्माभविष्यत्, ‘नेति नेति’ (बृ.४.५.३) ‘यतो वाचो निवर्तन्ते’ (तै.२.९.१) ‘अन्यदेव तद्विदितादथो अविदितादधि’ (के.१.४) इत्यवक्ष्यत्, ‘न सत्तन्नासदुच्यते’ (भ.गी.१३.१२) इति स्मृतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000104.mp3", "sections": []}, {"id": "B_000105", "originalText": "निर्बीजतयैव चेत्, सति प्रलीनानां सम्पन्नानां सुषुप्तिप्रलययोः पुनरुत्थानानुपपत्तिः स्यात्, मुक्तानां च पुनरुत्पत्तिप्रसङ्गः, बीजाभावाविशेषात्, ज्ञानदाह्यबीजाभावे च ज्ञानानर्थक्यप्रसङ्गः, तस्मात्सबीजत्वाभ्युपगमेनैव सतः प्राणत्वव्यपदेशः, सर्वश्रुतिषु च कारणत्वव्यपदेशः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000105.mp3", "sections": []}, {"id": "B_000106", "originalText": "अत एव ‘अक्षरात्परतः परः’ (मु.२.१.२) ‘सबाह्याभ्यन्तरो ह्यजः’ (मु.२.१.२) ‘यतो वाचो निवर्तन्ते’ (तै.२.९.१) ‘नेति नेति’ (बृ.२.३.६) इत्यादिना बीजत्वापनयनेन व्यपदेशः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000106.mp3", "sections": []}, {"id": "B_000107", "originalText": "तामबीजावस्थां तस्यैव प्राज्ञशब्दवाच्यस्य तुरीयत्वेन देहादिसम्बन्धजाग्रदादिरहितां पारमार्थिकीं पृथग्वक्ष्यति। बीजावस्थापि ‘न किञ्चिदवेदिषम्’ इत्युत्थितस्य प्रत्ययदर्शनाद्देहेऽनुभूयत एवेति त्रिधा देहे व्यवस्थित इत्युच्यते॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000107.mp3", "sections": []}, {"id": "B_000108", "originalText": "विश्वो हि स्थूलभुङ् नित्यं तैजसः प्रविविक्तभुक्। आनन्दभुक्तथा प्राज्ञस्त्रिधा भोगं निबोधत॥ ३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000108.mp3", "sections": []}, {"id": "B_000109", "originalText": "स्थूलं तर्पयते विश्वं प्रविविक्तं तु तैजसम्। आनन्दश्च तथा प्राज्ञं त्रिधा तृप्तिं निबोधत॥ ४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000109.mp3", "sections": []}, {"id": "B_000110", "originalText": "उक्तार्थौ हि श्लोकौ॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000110.mp3", "sections": []}, {"id": "B_000111", "originalText": "त्रिषु धामसु यद्भोज्यं भोक्ता यश्च प्रकीर्तितः। वेदैतदुभयं यस्तु स भुञ्जानो न लिप्यते॥ ५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000111.mp3", "sections": []}, {"id": "B_000112", "originalText": "त्रिषु धामसु जाग्रदादिषु स्थूलप्रविविक्तानन्दाख्यं यद्भोज्यमेकं त्रिधाभूतम्, यश्च विश्वतैजसप्राज्ञाख्यो भोक्तैकः ‘सोऽहम्’ इत्येकत्वेन प्रतिसन्धानात् द्रष्टृत्वाविशेषाच्च प्रकीर्तितः, यो वेद एतदुभयं भोज्यभोक्तृतया अनेकधा भिन्नम्, सः भुञ्जानः न लिप्यते, भोज्यस्य सर्वस्यैकभोक्तृभोज्यत्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000112.mp3", "sections": []}, {"id": "B_000113", "originalText": "न हि यस्य यो विषयः, स तेन हीयते वर्धते वा। न ह्यग्निः स्वविषयं दग्ध्वा काष्ठादि, तद्वत्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000113.mp3", "sections": []}, {"id": "B_000114", "originalText": "प्रभवः सर्वभावानां सतामिति विनिश्चयः। सर्वं जनयति प्राणश्चेतोंशून्पुरुषः पृथक्॥ ६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000114.mp3", "sections": []}, {"id": "B_000115", "originalText": "सतां विद्यमानानां स्वेन अविद्याकृतनामरूपमायास्वरूपेण सर्वभावानां विश्वतैजसप्राज्ञभेदानां प्रभवः उत्पत्तिः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000115.mp3", "sections": []}, {"id": "B_000116", "originalText": "वक्ष्यति च— ‘वन्ध्यापुत्रो न तत्त्वेन मायया वापि जायते’ (मा.का.३.२८) इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000116.mp3", "sections": []}, {"id": "B_000117", "originalText": "यदि ह्यसतामेव जन्म स्यात्, ब्रह्मणोऽव्यवहार्यस्य ग्रहणद्वाराभावादसत्त्वप्रसङ्गः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000117.mp3", "sections": []}, {"id": "B_000118", "originalText": "दृष्टं च रज्जुसर्पादीनामविद्याकृतमायाबीजोत्पन्नानां रज्ज्वाद्यात्मना सत्त्वम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000118.mp3", "sections": []}, {"id": "B_000119", "originalText": "न हि निरास्पदा रज्जुसर्पमृगतृष्णिकादयः क्वचिदुपलभ्यन्ते केनचित्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000119.mp3", "sections": []}, {"id": "B_000120", "originalText": "यथा रज्ज्वां प्राक्सर्पोत्पत्तेः रज्ज्वात्मना सर्पः सन्नेवासीत्, एवं सर्वभावानामुत्पत्तेः प्राक्प्राणबीजात्मनैव सत्त्वमिति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000120.mp3", "sections": []}, {"id": "B_000121", "originalText": "श्रुतिरपि वक्ति ‘ब्रह्मैवेदम्’ (मु.२.२.१२) ‘आत्मैवेदमग्र आसीत्’ (बृ.१.४.१) इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000121.mp3", "sections": []}, {"id": "B_000122", "originalText": "अतः सर्वं जनयति प्राणः चेतोंशून् अंशव इव रवेश्चिदात्मकस्य पुरुषस्य चेतोरूपा जलार्कसमाः प्राज्ञतैजसविश्वभेदेन देवमनुष्यतिर्यगादिदेहभेदेषु विभाव्यमानाश्चेतोंशवो ये, तान् पुरुषः पृथक् सृजति विषयभावविलक्षणानग्निविस्फुलिङ्गवत्सलक्षणान् जलार्कवच्च जीवलक्षणांस्त्वितरान्सर्वभावान् प्राणो बीजात्मा जनयति, ‘यथोर्णनाभिः... यथाग्नेः क्षुद्रा विस्फुलिङ्गाः’ (बृ.२.१.२०) इत्यादिश्रुतेः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000122.mp3", "sections": []}, {"id": "B_000123", "originalText": "विभूतिं प्रसवं त्वन्ये मन्यन्ते सृष्टिचिन्तकाः। स्वप्नमायासरूपेति सृष्टिरन्यैर्विकल्पिता॥ ७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000123.mp3", "sections": []}, {"id": "B_000124", "originalText": "विभूतिर्विस्तार ईश्वरस्य सृष्टिरिति सृष्टिचिन्तका मन्यन्ते, न तु परमार्थचिन्तकानां सृष्टावादर इत्यर्थः, ‘इन्द्रो मायाभिः पुरुरूप ईयते’ (बृ.२.५.१९) इति श्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000124.mp3", "sections": []}, {"id": "B_000125", "originalText": "न हि मायाविनं सूत्रमाकाशे निःक्षिप्य तेन सायुधमारुह्य चक्षुर्गोचरतामतीत्य युद्धेन खण्डशश्छिन्नं पतितं पुनरुत्थितं च पश्यतां तत्कृतमायादिसतत्त्वचिन्तायामादरो भवति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000125.mp3", "sections": []}, {"id": "B_000126", "originalText": "तथैवायं मायाविनः सूत्रप्रसारणसमः सुषुप्तस्वप्नादिविकासः, तदारूढमायाविसमश्च तत्स्थप्राज्ञतैजसादिः, सूत्रतदारूढाभ्यामन्यः परमार्थमायावी।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000126.mp3", "sections": []}, {"id": "B_000127", "originalText": "स एव भूमिष्ठो मायाच्छन्नः अदृश्यमान एव स्थितो यथा, तथा तुरीयाख्यं परमार्थतत्त्वम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000127.mp3", "sections": []}, {"id": "B_000128", "originalText": "अतस्तच्चिन्तायामेवादरो मुमुक्षूणामार्याणाम्, न निष्प्रयोजनायां सृष्टावादर इत्यतः सृष्टिचिन्तकानामेवैते विकल्पा इत्याह— स्वप्नमायासरूपेति। स्वप्नसरूपा मायासरूपा चेति॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000128.mp3", "sections": []}, {"id": "B_000129", "originalText": "इच्छामात्रं प्रभोः सृष्टिरिति सृष्टौ विनिश्चिताः। कालात्प्रसूतिं भूतानां मन्यन्ते कालचिन्तकाः॥ ८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000129.mp3", "sections": []}, {"id": "B_000130", "originalText": "इच्छामात्रं प्रभोः सत्यसङ्कल्पत्वात् सृष्टिः घटादीनां सङ्कल्पनामात्रम्, न सङ्कल्पनातिरिक्तम्। कालादेव सृष्टिरिति केचित्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000130.mp3", "sections": []}, {"id": "B_000131", "originalText": "भोगार्थं सृष्टिरित्यन्ये क्रीडार्थमिति चापरे। देवस्यैष स्वभावोऽयमाप्तकामस्य का स्पृहा॥ ९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000131.mp3", "sections": []}, {"id": "B_000132", "originalText": "भोगार्थम्, क्रीडार्थमिति च अन्ये सृष्टिं मन्यन्ते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000132.mp3", "sections": []}, {"id": "B_000133", "originalText": "अनयोः पक्षयोर्दूषणं देवस्यैष स्वभावोऽयमिति देवस्य स्वभावपक्षमाश्रित्य, सर्वेषां वा पक्षाणाम्— आप्तकामस्य का स्पृहेति। न हि रज्ज्वादीनामविद्यास्वभावव्यतिरेकेण सर्पाद्याभासत्वे कारणं शक्यं वक्तुम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000133.mp3", "sections": []}, {"id": "B_000134", "originalText": "इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000134.mp3", "sections": []}, {"id": "B_000135", "originalText": "नान्तःप्रज्ञं नबहिःप्रज्ञं नोभयतःप्रज्ञं नप्रज्ञानघनं नप्रज्ञं नाप्रज्ञम्। अदृश्यमव्यवहार्यमग्राह्यमलक्षणमचिन्त्यमव्यपदेश्यमेकात्मप्रत्ययसारं प्रपञ्चोपशमं शान्तं शिवमद्वैतं चतुर्थं मन्यन्ते स आत्मा स विज्ञेयः॥ ७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000135.mp3", "sections": []}, {"id": "B_000136", "originalText": "चतुर्थः पादः क्रमप्राप्तो वक्तव्य इत्याह— नान्तःप्रज्ञमित्यादिना।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000136.mp3", "sections": []}, {"id": "B_000137", "originalText": "सर्वशब्दप्रवृत्तिनिमित्तशून्यत्वात्तस्य शब्दानभिधेयत्वमिति विशेषप्रतिषेधेनैव तुरीयं निर्दिदिक्षति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000137.mp3", "sections": []}, {"id": "B_000138", "originalText": "शून्यमेव तर्हि, तन्न, मिथ्याविकल्पस्य निर्निमित्तत्वानुपपत्तेः, न हि रजतसर्पपुरुषमृगतृष्णिकादिविकल्पाः शुक्तिकारज्जुस्थाणूषरादिव्यतिरेकेण अवस्त्वास्पदाः शक्याः कल्पयितुम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000138.mp3", "sections": []}, {"id": "B_000139", "originalText": "एवं तर्हि प्राणादिसर्वविकल्पास्पदत्वात्तुरीयस्य शब्दवाच्यत्वमिति न प्रतिषेधैः प्रत्याय्यत्वमुदकाधारादेरिव घटादेः, न, प्राणादिविकल्पस्यावस्तुत्वाच्छुक्तिकादिष्विव रजतादेः, न हि सदसतोः सम्बन्धः शब्दप्रवृत्तिनिमित्तभाक्, अवस्तुत्वात्, नापि प्रमाणान्तरविषयत्वं स्वरूपेण गवादिवत्, आत्मनो निरुपाधिकत्वात्, गवादिवन्नापि जातिमत्त्वम्, अद्वितीयत्वेन सामान्यविशेषाभावात्, नापि क्रियावत्त्वं पाचकादिवत्, अविक्रियत्वात्, नापि गुणवत्त्वं नीलादिवत्, निर्गुणत्वात्, अतो नाभिधानेन निर्देशमर्हति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000139.mp3", "sections": []}, {"id": "B_000140", "originalText": "शशविषाणादिसमत्वान्निरर्थकत्वं तर्हि, न, आत्मत्वावगमे तुरीयस्यानात्मतृष्णाव्यावृत्तिहेतुत्वात् शुक्तिकावगम इव रजततृष्णायाः, न हि तुरीयस्यात्मत्वावगमे सति अविद्यातृष्णादिदोषाणां सम्भवोऽस्ति, न च तुरीयस्यात्मत्वानवगमे कारणमस्ति, सर्वोपनिषदां तादर्थ्येनोपक्षयात्— ‘तत्त्वमसि’ (छा.६.८.७) ‘अयमात्मा ब्रह्म’ (बृ.२.५.१९) ‘तत्सत्यं स आत्मा’ (छा.६.८.७) ‘यत्साक्षादपरोक्षाद्ब्रह्म’ (बृ.३.४.१) ‘सबाह्याभ्यन्तरो ह्यजः’ (मु.२.१.२) ‘आत्मैवेदं सर्वम्’ (छा.७.२५.२) इत्यादीनाम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000140.mp3", "sections": []}, {"id": "B_000141", "originalText": "सोऽयमात्मा परमार्थापरमार्थरूपश्चतुष्पादित्युक्तः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000141.mp3", "sections": []}, {"id": "B_000142", "originalText": "तस्यापरमार्थरूपमविद्याकृतं रज्जुसर्पादिसममुक्तं पादत्रयलक्षणं बीजाङ्कुरस्थानीयम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000142.mp3", "sections": []}, {"id": "B_000143", "originalText": "अथेदानीमबीजात्मकं परमार्थस्वरूपं रज्जुस्थानीयं सर्पादिस्थानीयोक्तस्थानत्रयनिराकरणेनाह— नान्तःप्रज्ञमित्यादिना।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000143.mp3", "sections": []}, {"id": "B_000144", "originalText": "नन्वात्मनश्चतुष्पात्त्वं प्रतिज्ञाय पादत्रयकथनेनैव चतुर्थस्यान्तःप्रज्ञादिभ्योऽन्यत्वे सिद्धे ‘नान्तःप्रज्ञम्’ इत्यादिप्रतिषेधोऽनर्थकः, न, सर्पादिविकल्पप्रतिषेधेनैव रज्जुस्वरूपप्रतिपत्तिवत्त्र्यवस्थस्यैवात्मनस्तुरीयत्वेन प्रतिपिपादयिषितत्वात्, ‘तत्त्वमसि’ इतिवत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000144.mp3", "sections": []}, {"id": "B_000145", "originalText": "यदि हि त्र्यवस्थात्मविलक्षणं तुरीयमन्यत्, तत्प्रतिपत्तिद्वाराभावात् शास्त्रोपदेशानर्थक्यं शून्यतापत्तिर्वा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000145.mp3", "sections": []}, {"id": "B_000146", "originalText": "रज्जुरिव सर्पादिभिर्विकल्प्यमाना स्थानत्रयेऽप्यात्मैक एव अन्तःप्रज्ञादित्वेन विकल्प्यते यदा, तदा अन्तःप्रज्ञादित्वप्रतिषेधविज्ञानप्रमाणसमकालमेव आत्मन्यनर्थप्रपञ्चनिवृत्तिलक्षणं फलं परिसमाप्तमिति तुरीयाधिगमे प्रमाणान्तरं साधनान्तरं वा न मृग्यम्, रज्जुसर्पविवेकसमकाल इव रज्ज्वां सर्पनिवृत्तिफले सति रज्ज्वधिगमस्य।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000146.mp3", "sections": []}, {"id": "B_000147", "originalText": "येषां पुनस्तमोपनयनव्यतिरेकेण घटाधिगमे प्रमाणं व्याप्रियते, तेषां छेद्यावयवसम्बन्धवियोगव्यतिरेकेण अन्यतरावयवेऽपि च्छिदिर्व्याप्रियत इत्युक्तं स्यात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000147.mp3", "sections": []}, {"id": "B_000148", "originalText": "यदा पुनर्घटतमसोर्विवेककरणे प्रवृत्तं प्रमाणमनुपादित्सिततमोनिवृत्तिफलावसानं छिदिरिव च्छेद्यावयवसम्बन्धविवेककरणे प्रवृत्ता तदवयवद्वैधीभावफलावसाना, तदा नान्तरीयकं घटविज्ञानं न प्रमाणफलम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000148.mp3", "sections": []}, {"id": "B_000149", "originalText": "न च तद्वदप्यात्मन्यध्यारोपितान्तःप्रज्ञत्वादिविवेककरणे प्रवृत्तस्य प्रतिषेधविज्ञानप्रमाणस्य अनुपादित्सितान्तःप्रज्ञत्वादिनिवृत्तिव्यतिरेकेण तुरीये व्यापारोपपत्तिः, अन्तःप्रज्ञत्वादि निवृत्तिसमकालमेव प्रमातृत्वादिभेदनिवृत्तेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000149.mp3", "sections": []}, {"id": "B_000150", "originalText": "तथा च वक्ष्यति— ‘ज्ञाते द्वैतं न विद्यते’ (मा.का.१.१८) इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000150.mp3", "sections": []}, {"id": "B_000151", "originalText": "ज्ञानस्य द्वैतनिवृत्तिक्षणव्यतिरेकेण क्षणान्तरानवस्थानात्, अवस्थाने वा अनवस्थाप्रसङ्गाद्द्वैतानिवृत्तिः, तस्मात्प्रतिषेधविज्ञानप्रमाणव्यापारसमकालैव आत्मन्यध्यारोपितान्तःप्रज्ञत्वाद्यनर्थनिवृत्तिरिति सिद्धम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000151.mp3", "sections": []}, {"id": "B_000152", "originalText": "नान्तःप्रज्ञमिति तैजसप्रतिषेधः, नबहिःप्रज्ञमिति विश्वप्रतिषेधः, नोभयतःप्रज्ञमिति जागरितस्वप्नयोरन्तरालावस्थाप्रतिषेधः, नप्रज्ञानघनमिति सुषुप्तावस्थाप्रतिषेधः, बीजभावाविवेकस्वरूपत्वात्, नप्रज्ञमिति युगपत्सर्वविषयज्ञातृत्वप्रतिषेधः, नाप्रज्ञमित्यचैतन्यप्रतिषेधः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000152.mp3", "sections": []}, {"id": "B_000153", "originalText": "कथं पुनरन्तःप्रज्ञत्वादीनामात्मनि गम्यमानानां रज्ज्वादौ सर्पादिवत्प्रतिषेधादसत्त्वं गम्यत इति, उच्यते, ज्ञस्वरूपाविशेषेऽपि इतरेतरव्यभिचारादसत्यत्वं रज्ज्वादाविव सर्पधारादिविकल्पभेदवत्, सर्वत्राव्यभिचाराज्ज्ञस्वरूपस्य सत्यत्वम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000153.mp3", "sections": []}, {"id": "B_000154", "originalText": "सुषुप्ते व्यभिचरतीति चेत्, न, सुषुप्तस्यानुभूयमानत्वात्, ‘न हि विज्ञातुर्विज्ञातेर्विपरिलोपो विद्यते’ (बृ.४.३.३०) इति श्रुतेः, अत एव अदृश्यम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000154.mp3", "sections": []}, {"id": "B_000155", "originalText": "यस्माददृश्यम्, तस्मादव्यवहार्यम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000155.mp3", "sections": []}, {"id": "B_000156", "originalText": "अग्राह्यं कर्मेन्द्रियैः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000156.mp3", "sections": []}, {"id": "B_000157", "originalText": "अलक्षणम् अलिङ्गमित्येतत्, अननुमेयमित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000157.mp3", "sections": []}, {"id": "B_000158", "originalText": "अत एव अचिन्त्यम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000158.mp3", "sections": []}, {"id": "B_000159", "originalText": "अत एव अव्यपदेश्यं शब्दैः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000159.mp3", "sections": []}, {"id": "B_000160", "originalText": "एकात्मप्रत्ययसारं जाग्रदादिस्थानेषु एक एवायमात्मा इत्यव्यभिचारी यः प्रत्ययः, तेनानुसरणीयम्, अथवा, एक आत्मप्रत्ययः सारः प्रमाणं यस्य तुरीयस्याधिगमे, तत्तुरीयमेकात्मप्रत्ययसारम्, ‘आत्मेत्येवोपासीत’ (बृ.१.४.७) इति श्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000160.mp3", "sections": []}, {"id": "B_000161", "originalText": "अन्तःप्रज्ञत्वादिस्थानिधर्मप्रतिषेधः कृतः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000161.mp3", "sections": []}, {"id": "B_000162", "originalText": "प्रपञ्चोपशममिति जाग्रदादिस्थानधर्माभाव उच्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000162.mp3", "sections": []}, {"id": "B_000163", "originalText": "अत एव शान्तम् अविक्रियम्, शिवं यतः अद्वैतं भेदविकल्परहितं चतुर्थं तुरीयं मन्यन्ते, प्रतीयमानपादत्रयरूपवैलक्षण्यात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000163.mp3", "sections": []}, {"id": "B_000164", "originalText": "स आत्मा स विज्ञेयः इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000164.mp3", "sections": []}, {"id": "B_000165", "originalText": "प्रतीयमानसर्पदण्डभूच्छिद्रादिव्यतिरिक्ता यथा रज्जुः, तथा ‘तत्त्वमसि’ इत्यादिवाक्यार्थः आत्मा ‘अदृष्टो द्रष्टा’ (बृ.३.७.२३) ‘न हि द्रष्टुदृष्टेर्विपरिलोपो विद्यते’ (बृ.४.३.२३) इत्यादिभिरुक्तो यः, स विज्ञेय इति भूतपूर्वगत्या।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000165.mp3", "sections": []}, {"id": "B_000166", "originalText": "ज्ञाते द्वैताभावः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000166.mp3", "sections": []}, {"id": "B_000167", "originalText": "अत्रैते श्लोका भवन्ति—\nनिवृत्तेः सर्वदुःखानामीशानः प्रभुरव्ययः। अद्वैतः सर्वभावानां देवस्तुर्यो विभुः स्मृतः॥ १०॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000167.mp3", "sections": []}, {"id": "B_000168", "originalText": "अत्रैते श्लोका भवन्ति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000168.mp3", "sections": []}, {"id": "B_000169", "originalText": "प्राज्ञतैजसविश्वलक्षणानां सर्वदुःखानां निवृत्तेः ईशानः तुरीय आत्मा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000169.mp3", "sections": []}, {"id": "B_000170", "originalText": "ईशान इत्यस्य पदस्य व्याख्यानं प्रभुरिति, दुःखनिवृत्तिं प्रति प्रभुर्भवतीत्यर्थः, तद्विज्ञाननिमित्तत्वाद्दुःखनिवृत्तेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000170.mp3", "sections": []}, {"id": "B_000171", "originalText": "अव्ययः न व्येति, स्वरूपान्न व्यभिचरति न च्यवत इत्येतत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000171.mp3", "sections": []}, {"id": "B_000172", "originalText": "कुतः? यस्मात् अद्वैतः, सर्वभावानाम्— सर्पादीनां रज्जुरद्वया सत्या च, एवं तुरीयः, ‘न हि द्रष्टुर्दृष्टेर्विपरिलोपो विद्यते’ (बृ.४.३.२३) इति श्रुतेः— अतो रज्जुसर्पवन्मृषात्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000172.mp3", "sections": []}, {"id": "B_000173", "originalText": "स एष देवः द्योतनात् तुर्यः चतुर्थः विभुः व्यापी स्मृतः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000173.mp3", "sections": []}, {"id": "B_000174", "originalText": "कार्यकारणबद्धौ ताविष्येते विश्वतैजसौ। प्राज्ञः कारणबद्धस्तु द्वौ तौ तुर्ये न सिध्यतः॥ ११॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000174.mp3", "sections": []}, {"id": "B_000175", "originalText": "विश्वादीनां सामान्यविशेषभावो निरूप्यते तुर्ययाथात्म्यावधारणार्थम्— कार्यं क्रियत इति फलभावः, कारणं करोतीति बीजभावः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000175.mp3", "sections": []}, {"id": "B_000176", "originalText": "तत्त्वाग्रहणान्यथाग्रहणाभ्यां बीजफलभावाभ्यां तौ यथोक्तौ विश्वतैजसौ बद्धौ सङ्गृहीतौ इष्येते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000176.mp3", "sections": []}, {"id": "B_000177", "originalText": "प्राज्ञस्तु बीजभावेनैव बद्धः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000177.mp3", "sections": []}, {"id": "B_000178", "originalText": "तत्त्वाप्रतिबोधमात्रमेव हि बीजं प्राज्ञत्वे निमित्तम्। ततः द्वौ तौ बीजफलभावौ तत्त्वाग्रहणान्यथाग्रहणे तुरीये न सिध्यतः न विद्येते, न सम्भवत इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000178.mp3", "sections": []}, {"id": "B_000179", "originalText": "नात्मानं न परं चैव न सत्यं नापि चानृतम्। प्राज्ञः किञ्चन संवेत्ति तुर्यं तत्सर्वदृक्सदा॥ १२॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000179.mp3", "sections": []}, {"id": "B_000180", "originalText": "कथं पुनः कारणबद्धत्वं प्राज्ञस्य तुरीये वा तत्त्वाग्रहणान्यथाग्रहणलक्षणौ बन्धौ न सिध्यत इति? यस्मात्— आत्मानम्, विलक्षणम्, अविद्याबीजप्रसूतं वेद्यं बाह्यं द्वैतम्— प्राज्ञो न किञ्चन संवेत्ति, यथा विश्वतैजसौ, ततश्चासौ तत्त्वाग्रहणेन तमसा अन्यथाग्रहणबीजभूतेन बद्धो भवति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000180.mp3", "sections": []}, {"id": "B_000181", "originalText": "यस्मात् तुर्यं तत्सर्वदृक्सदा तुरीयादन्यस्याभावात् सर्वदा सदैव भवति, सर्वं च तद्दृक्चेति सर्वदृक्, तस्मान्न तत्त्वाग्रहणलक्षणं बीजम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000181.mp3", "sections": []}, {"id": "B_000182", "originalText": "तत्र तत्प्रसूतस्यान्यथाग्रहणस्याप्यत एवाभावः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000182.mp3", "sections": []}, {"id": "B_000183", "originalText": "न हि सवितरि सदाप्रकाशात्मके तद्विरुद्धमप्रकाशनमन्यथाप्रकाशनं वा सम्भवति, ‘न हि द्रष्टुर्दृष्टेर्विपरिलोपो विद्यते’ (बृ.४.३.२३) इति श्रुतेः। अथवा, जाग्रत्स्वप्नयोः सर्वभूतावस्थः सर्ववस्तुदृगाभासस्तुरीय एवेति सर्वदृक्सदा, ‘नान्यदतोऽस्ति द्रष्टृ’ (बृ.३.८.११) इत्यादिश्रुतेः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000183.mp3", "sections": []}, {"id": "B_000184", "originalText": "द्वैतस्याग्रहणं तुल्यमुभयोः प्राज्ञतुर्ययोः। बीजनिद्रायुतः प्राज्ञः सा च तुर्ये न विद्यते॥ १३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000184.mp3", "sections": []}, {"id": "B_000185", "originalText": "निमित्तान्तरप्राप्ताशङ्कानिवृत्त्यर्थोऽयं श्लोकः— कथं द्वैताग्रहणस्य तुल्यत्वे कारणबद्धत्वं प्राज्ञस्यैव, न तुरीयस्येति प्राप्ता आशङ्का निवर्त्यते, यस्मात् बीजनिद्रायुतः, तत्त्वाप्रतिबोधो निद्रा, सैव च विशेषप्रतिबोधप्रसवस्य बीजम्, सा बीजनिद्रा, तया युतः प्राज्ञः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000185.mp3", "sections": []}, {"id": "B_000186", "originalText": "सदासर्वदृक्स्वभावत्वात्तत्त्वाप्रतिबोधलक्षणा बीजनिद्रा तुर्ये न विद्यते, अतो न कारणबन्धस्तस्मिन्नित्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000186.mp3", "sections": []}, {"id": "B_000187", "originalText": "स्वप्ननिद्रायुतावाद्यौ प्राज्ञस्त्वस्वप्ननिद्रया। न निद्रां नैव च स्वप्नं तुर्ये पश्यन्ति निश्चिताः॥ १४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000187.mp3", "sections": []}, {"id": "B_000188", "originalText": "स्वप्नः अन्यथाग्रहणं सर्प इव रज्ज्वाम्, निद्रोक्ता तत्त्वाप्रतिबोधलक्षणं तम इति, ताभ्यां स्वप्ननिद्राभ्यां युतौ विश्वतैजसौ, अतस्तौ कार्यकारणबद्धावित्युक्तौ।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000188.mp3", "sections": []}, {"id": "B_000189", "originalText": "प्राज्ञस्तु स्वप्नवर्जितया केवलयैव निद्रया युत इति कारणबद्ध इत्युक्तम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000189.mp3", "sections": []}, {"id": "B_000190", "originalText": "नोभयं पश्यन्ति तुरीये निश्चिताः ब्रह्मविद इत्यर्थः, विरुद्धत्वात्सवितरीव तमः। अतो न कार्यकारणबद्ध इत्युक्तस्तुरीयः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000190.mp3", "sections": []}, {"id": "B_000191", "originalText": "अन्यथा गृह्णतः स्वप्नो निद्रा तत्त्वमजानतः। विपर्यासे तयोः क्षीणे तुरीयं पदमश्नुते॥ १५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000191.mp3", "sections": []}, {"id": "B_000192", "originalText": "कदा तुरीये निश्चितो भवतीत्युच्यते— स्वप्नजागरितयोः अन्यथा रज्ज्वां सर्पवत् गृह्णतः तत्त्वं स्वप्नो भवति, निद्रा तत्त्वमजानतः तिसृष्ववस्थासु तुल्या।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000192.mp3", "sections": []}, {"id": "B_000193", "originalText": "स्वप्ननिद्रयोस्तुल्यत्वाद्विश्वतैजसयोरेकराशित्वम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000193.mp3", "sections": []}, {"id": "B_000194", "originalText": "अन्यथाग्रहणप्राधान्याच्च गुणभूता निद्रेति तस्मिन्विपर्यासः स्वप्नः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000194.mp3", "sections": []}, {"id": "B_000195", "originalText": "तृतीये तु स्थाने तत्त्वाग्रहणलक्षणा निद्रैव केवला विपर्यासः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000195.mp3", "sections": []}, {"id": "B_000196", "originalText": "अतः तयोः कार्यकारणस्थानयोः अन्यथाग्रहणतत्त्वाग्रहणलक्षणविपर्यासे कार्यकारणबन्धरूपे परमार्थतत्त्वप्रतिबोधतः क्षीणे तुरीयं पदमश्नुते, तदा उभयलक्षणं बन्धनं तत्रापश्यंस्तुरीये निश्चितो भवतीत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000196.mp3", "sections": []}, {"id": "B_000197", "originalText": "अनादिमायया सुप्तो यदा जीवः प्रबुध्यते। अजमनिद्रमस्वप्नमद्वैतं बुध्यते तदा॥ १६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000197.mp3", "sections": []}, {"id": "B_000198", "originalText": "योऽयं संसारी जीवः, सः उभयलक्षणेन तत्त्वाप्रतिबोधरूपेण बीजात्मना, अन्यथाग्रहणलक्षणेन चानादिकालप्रवृत्तेन मायालक्षणेन स्वापेन, ममायं पिता पुत्रोऽयं नप्ता क्षेत्रं गृहं पशवः, अहमेषां स्वामी सुखी दुःखी क्षयितोऽहमनेन वर्धितश्चानेन इत्येवंप्रकारान्स्वप्नान् स्थानद्वयेऽपि पश्यन्सुप्तः, यदा वेदान्तार्थतत्त्वाभिज्ञेन परमकारुणिकेन गुरुणा ‘नास्येवं त्वं हेतुफलात्मकः, किन्तु तत्त्वमसि’ इति प्रतिबोध्यमानः, तदैवं प्रतिबुध्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000198.mp3", "sections": []}, {"id": "B_000199", "originalText": "कथम्? नास्मिन्बाह्यमाभ्यन्तरं वा जन्मादिभावविकारोऽस्ति, अतः अजम् ‘सबाह्याभ्यन्तरो ह्यजः’ (मु.२.१.२) इति श्रुतेः, सर्वभावविकारवर्जितमित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000199.mp3", "sections": []}, {"id": "B_000200", "originalText": "यस्माज्जन्मादिकारणभूतम्, नास्मिन्नविद्यातमोबीजं निद्रा विद्यत इति अनिद्रम्, अनिद्रं हि तत्तुरीयम्, अत एव अस्वप्नम्, तन्निमित्तत्वादन्यथाग्रहणस्य। यस्माच्च अनिद्रमस्वप्नम्, तस्मादजम् अद्वैतं तुरीयमात्मानं बुध्यते तदा॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000200.mp3", "sections": []}, {"id": "B_000201", "originalText": "प्रपञ्चो यदि विद्येत निवर्तेत न संशयः। मायामात्रमिदं द्वैतमद्वैतं परमार्थतः॥ १७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000201.mp3", "sections": []}, {"id": "B_000202", "originalText": "प्रपञ्चनिवृत्त्या चेत्प्रतिबुध्यते, अनिवृत्ते प्रपञ्चे कथमद्वैतमिति, उच्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000202.mp3", "sections": []}, {"id": "B_000203", "originalText": "सत्यमेवं स्यात्प्रपञ्चो यदि विद्येत, रज्ज्वां सर्प इव कल्पितत्वान्न तु स विद्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000203.mp3", "sections": []}, {"id": "B_000204", "originalText": "विद्यमानश्चेत् निवर्तेत, न संशयः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000204.mp3", "sections": []}, {"id": "B_000205", "originalText": "न हि रज्ज्वां भ्रान्तिबुद्ध्या कल्पितः सर्पो विद्यमानः सन्विवेकतो निवृत्तः, न च माया मायाविना प्रयुक्ता तद्दर्शिनां चक्षुर्बन्धापगमे विद्यमाना सती निवृत्ता, तथेदं प्रपञ्चाख्यं मायामात्रं द्वैतम्, रज्जुवन्मायाविवच्च अद्वैतं परमार्थतः, तस्मान्न कश्चित्प्रपञ्चः प्रवृत्तो निवृत्तो वास्तीत्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000205.mp3", "sections": []}, {"id": "B_000206", "originalText": "विकल्पो विनिवर्तेत कल्पितो यदि केनचित्। उपदेशादयं वादो ज्ञाते द्वैतं न विद्यते॥ १८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000206.mp3", "sections": []}, {"id": "B_000207", "originalText": "ननु शास्ता शास्त्रं शिष्य इत्ययं विकल्पः कथं निवृत्त इति, उच्यते— विकल्पो विनिवर्तेत यदि केनचित्कल्पितः स्यात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000207.mp3", "sections": []}, {"id": "B_000208", "originalText": "यथा अयं प्रपञ्चो मायारज्जुसर्पवत्, तथा अयं शिष्यादिभेदविकल्पोऽपि प्राक्प्रतिबोधादेवोपदेशनिमित्तः, अत उपदेशादयं वादः— शिष्यः शास्ता शास्त्रमिति। उपदेशकार्ये तु ज्ञाने निर्वृत्ते ज्ञाते परमार्थतत्त्वे, द्वैतं न विद्यते॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000208.mp3", "sections": []}, {"id": "B_000209", "originalText": "इति। सोऽयमात्माध्यक्षरमोङ्कारोऽधिमात्रं पादा मात्रा मात्राश्च पादा अकार उकारो मकार इति॥ ८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000209.mp3", "sections": []}, {"id": "B_000210", "originalText": "अभिधेयप्राधान्येन ओङ्कारश्चतुष्पादात्मेति व्याख्यातो यः, सोऽयम् आत्मा अध्यक्षरम् अक्षरमधिकृत्य अभिधानप्राधान्येन वर्ण्यमानोऽध्यक्षरम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000210.mp3", "sections": []}, {"id": "B_000211", "originalText": "किं पुनस्तदक्षरमित्याह— ओङ्कारः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000211.mp3", "sections": []}, {"id": "B_000212", "originalText": "सोऽयमोङ्कारः पादशः प्रविभज्यमानः, अधिमात्रं मात्रामधिकृत्य वर्तत इत्यधिमात्रम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000212.mp3", "sections": []}, {"id": "B_000213", "originalText": "कथम्? आत्मनो ये पादाः, ते ओङ्कारस्य मात्राः। कास्ताः? अकार उकारो मकार इति॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000213.mp3", "sections": []}, {"id": "B_000214", "originalText": "जागरितस्थानो वैश्वानरोऽकारः प्रथमा मात्राप्तेरादिमत्त्वाद्वाप्नोति ह वै सर्वान्कामानादिश्च भवति य एवं वेद॥ ९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000214.mp3", "sections": []}, {"id": "B_000215", "originalText": "तत्र विशेषनियमः क्रियते— जागरितस्थानः वैश्वानरः यः, स ओङ्कारस्य अकारः प्रथमा मात्रा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000215.mp3", "sections": []}, {"id": "B_000216", "originalText": "केन सामान्येनेत्याह— आप्तेः, आप्तिर्व्याप्तिः, अकारेण सर्वा वाग्व्याप्ता, ‘अकारो वै सर्वा वाक्’ (ऐ.आ.२.३.१९) इति श्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000216.mp3", "sections": []}, {"id": "B_000217", "originalText": "तथा वैश्वानरेण जगत्, ‘तस्य ह वा एतस्यात्मनो वैश्वानरस्य मूर्धैव सुतेजाः’ (छा.५.१८.२) इत्यादिश्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000217.mp3", "sections": []}, {"id": "B_000218", "originalText": "अभिधानाभिधेययोरेकत्वं चावोचाम।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000218.mp3", "sections": []}, {"id": "B_000219", "originalText": "आदिरस्य विद्यत इत्यादिमत्, यथैव आदिमदकाराख्यमक्षरम्, तथा वैश्वानरः, तस्माद्वा सामान्यादकारत्वं वैश्वानरस्य। तदेकत्वविदः फलमाह— आप्नोति ह वै सर्वान्कामान्, आदिः प्रथमश्च भवति महताम्, य एवं वेद, यथोक्तमेकत्वं वेदेत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000219.mp3", "sections": []}, {"id": "B_000220", "originalText": "स्वप्नस्थानस्तैजस उकारो द्वितीया मात्रोत्कर्षादुभयत्वाद्वोत्कर्षति ह वै ज्ञानसन्ततिं समानश्च भवति नास्याब्रह्मवित्कुले भवति य एवं वेद॥ १०॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000220.mp3", "sections": []}, {"id": "B_000221", "originalText": "स्वप्नस्थानः तैजसः यः, स ओङ्कारस्य उकारः द्वितीया मात्रा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000221.mp3", "sections": []}, {"id": "B_000222", "originalText": "केन सामान्येनेत्याह— उत्कर्षात्, अकारादुत्कृष्ट इव ह्युकारः, तथा तैजसो विश्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000222.mp3", "sections": []}, {"id": "B_000223", "originalText": "उभयत्वाद्वा, अकारमकारयोर्मध्यस्थ उकारः, तथा विश्वप्राज्ञयोर्मध्ये तैजसः, अत उभयभाक्त्वसामान्यात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000223.mp3", "sections": []}, {"id": "B_000224", "originalText": "विद्वत्फलमुच्यते— उत्कर्षति ह वै ज्ञानसन्ततिं विज्ञानसन्ततिं वर्धयतीत्यर्थः, समानः तुल्यश्च, मित्रपक्षस्येव शत्रुपक्षाणामप्यप्रद्वेष्यो भवति, अब्रह्मविच्च अस्य कुले न भवति, य एवं वेद॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000224.mp3", "sections": []}, {"id": "B_000225", "originalText": "सुषुप्तस्थानः प्राज्ञो मकारस्तृतीया मात्रा मितेरपीतेर्वा मिनोति ह वा इदं सर्वमपीतिश्च भवति य एवं वेद॥ ११॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000225.mp3", "sections": []}, {"id": "B_000226", "originalText": "सुषुप्तस्थानः प्राज्ञः यः, स ओङ्कारस्य मकारः तृतीया मात्रा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000226.mp3", "sections": []}, {"id": "B_000227", "originalText": "केन सामान्येनेत्याह— सामान्यमिदमत्र— मितेः, मितिर्मानम्, मीयेते इव हि विश्वतैजसौ प्राज्ञेन प्रलयोत्पत्त्योः प्रवेशनिर्गमाभ्यां प्रस्थेनेव यवाः, तथा ओङ्कारसमाप्तौ पुनः प्रयोगे च प्रविश्य निर्गच्छत इव अकारोकारौ मकारे।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000227.mp3", "sections": []}, {"id": "B_000228", "originalText": "अपीतेर्वा, अपीतिरप्यय एकीभावः, ओङ्कारोच्चारणे हि अन्त्येऽक्षरे एकीभूताविव अकारोकारौ, तथा विश्वतैजसौ सुषुप्तकाले प्राज्ञे।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000228.mp3", "sections": []}, {"id": "B_000229", "originalText": "अतो वा सामान्यादेकत्वं प्राज्ञमकारयोः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000229.mp3", "sections": []}, {"id": "B_000230", "originalText": "विद्वत्फलमाह— मिनोति ह वै इदं सर्वम्, जगद्याथात्म्यं जानातीत्यर्थः, अपीतिश्च जगत्कारणात्मा च भवतीत्यर्थः। अत्रावान्तरफलवचनं प्रधानसाधनस्तुत्यर्थम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000230.mp3", "sections": []}, {"id": "B_000231", "originalText": "अत्रैते श्लोका भवन्ति—\nविश्वस्यात्वविवक्षायामादिसामान्यमुत्कटम्। मात्रासम्प्रतिपत्तौ स्यादाप्तिसामान्यमेव च॥ १९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000231.mp3", "sections": []}, {"id": "B_000232", "originalText": "अत्र एते श्लोका भवन्ति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000232.mp3", "sections": []}, {"id": "B_000233", "originalText": "विश्वस्य अत्वम् अकारमात्रत्वं यदा विवक्ष्यते, तदा आदित्वसामान्यम् उक्तन्यायेन उत्कटम् उद्भूतं दृश्यत इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000233.mp3", "sections": []}, {"id": "B_000234", "originalText": "अत्वविवक्षायामित्यस्य व्याख्यानम्— मात्रासम्प्रतिपत्तौ इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000234.mp3", "sections": []}, {"id": "B_000235", "originalText": "विश्वस्य अकारमात्रत्वं यदा सम्प्रतिपद्यते इत्यर्थः। आप्तिसामान्यमेव च, उत्कटमित्यनुवर्तते, च— शब्दात्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000235.mp3", "sections": []}, {"id": "B_000236", "originalText": "तैजसस्योत्वविज्ञान उत्कर्षो दृश्यते स्फुटम्। मात्रासम्प्रतिपत्तौ स्यादुभयत्वं तथाविधम्॥ २०॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000236.mp3", "sections": []}, {"id": "B_000237", "originalText": "तैजसस्य उत्वविज्ञाने उकारत्वविवक्षायाम् उत्कर्षो दृश्यते स्फुटं स्पष्टमित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000237.mp3", "sections": []}, {"id": "B_000238", "originalText": "उभयत्वं च स्फुटमेवेति। पूर्ववत्सर्वम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000238.mp3", "sections": []}, {"id": "B_000239", "originalText": "मकारभावे प्राज्ञस्य मानसामान्यमुत्कटम्। मात्रासम्प्रतिपत्तौ तु लयसामान्यमेव च॥ २१॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000239.mp3", "sections": []}, {"id": "B_000240", "originalText": "मकारत्वे प्राज्ञस्य मितिलयावुत्कृष्टे सामान्ये इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000240.mp3", "sections": []}, {"id": "B_000241", "originalText": "त्रिषु धामसु यस्तुल्यं सामान्यं वेत्ति निश्चितः। स पूज्यः सर्वभूतानां वन्द्यश्चैव महामुनिः॥ २२॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000241.mp3", "sections": []}, {"id": "B_000242", "originalText": "यथोक्तस्थानत्रये यः तुल्यमुक्तं सामान्यं वेत्ति, एवमेवैतदिति निश्चितः सन् सः पूज्यः वन्द्यश्च ब्रह्मवित् लोके भवति॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000242.mp3", "sections": []}, {"id": "B_000243", "originalText": "अकारो नयते विश्वमुकारश्चापि तैजसम्। मकारश्च पुनः प्राज्ञं नामात्रे विद्यते गतिः॥ २३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000243.mp3", "sections": []}, {"id": "B_000244", "originalText": "यथोक्तैः सामान्यैः आत्मपादानां मात्राभिः सह एकत्वं कृत्वा यथोक्तोङ्कारं प्रतिपद्यते यो ध्यायी, तम् अकारः नयते विश्वं प्रापयति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000244.mp3", "sections": []}, {"id": "B_000245", "originalText": "अकारालम्बनमोङ्कारं विद्वान्वैश्वानरो भवतीत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000245.mp3", "sections": []}, {"id": "B_000246", "originalText": "तथा उकारः तैजसम्, मकारश्चापि पुनः प्राज्ञम्, च— शब्दान्नयत इत्यनुवर्तते। क्षीणे तु मकारे बीजभावक्षयात् अमात्रे ओङ्कारे गतिः न विद्यते क्वचिदित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000246.mp3", "sections": []}, {"id": "B_000247", "originalText": "इति। अमात्रश्चतुर्थोऽव्यवहार्यः प्रपञ्चोपशमः शिवोऽद्वैत एवमोङ्कार आत्मैव संविशत्यात्मनात्मानं य एवं वेद॥ १२॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000247.mp3", "sections": []}, {"id": "B_000248", "originalText": "अमात्रः मात्रा यस्य न सन्ति, सः अमात्रः ओङ्कारः चतुर्थः तुरीयः आत्मैव केवलः अभिधानाभिधेयरूपयोर्वाङ्मनसयोः क्षीणत्वात् अव्यवहार्यः, प्रपञ्चोपशमः शिवः अद्वैतः संवृत्तः एवं यथोक्तविज्ञानवता प्रयुक्त ओङ्कारस्त्रिमात्रस्त्रिपाद आत्मैव, संविशति आत्मना स्वेनैव स्वं पारमार्थिकमात्मानम्, य एवं वेद, परमार्थदर्शनात् ब्रह्मवित् तृतीयं बीजभावं दग्ध्वा आत्मानं प्रविष्ट इति न पुनर्जायते, तुरीयस्याबीजत्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000248.mp3", "sections": []}, {"id": "B_000249", "originalText": "न हि रज्जुसर्पयोर्विवेके रज्ज्वां प्रविष्टः सर्पः बुद्धिसंस्कारात्पुनः पूर्ववत्तद्विवेकिनामुत्थास्यति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000249.mp3", "sections": []}, {"id": "B_000250", "originalText": "मन्दमध्यमधियां तु प्रतिपन्नसाधकभावानां सन्मार्गगामिनां संन्यासिनां मात्राणां पादानां च क्लृप्तसामान्यविदां यथावदुपास्यमान ओङ्कारो ब्रह्मप्रतिपत्तये आलम्बनीभवति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000250.mp3", "sections": []}, {"id": "B_000251", "originalText": "तथा च वक्ष्यति— ‘आश्रमास्त्रिविधाः’ (मा.का.३.१६) इत्यादि॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000251.mp3", "sections": []}, {"id": "B_000252", "originalText": "इति माण्डूक्योपनिषत्समाप्ता॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000252.mp3", "sections": []}, {"id": "B_000253", "originalText": "अत्रैते श्लोका भवन्ति—\nओङ्कारं पादशो विद्यात्पादा मात्रा न संशयः। ओङ्कारं पादशो ज्ञात्वा न किञ्चिदपि चिन्तयेत्॥ २४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000253.mp3", "sections": []}, {"id": "B_000254", "originalText": "पूर्ववदत्रैते श्लोका भवन्ति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000254.mp3", "sections": []}, {"id": "B_000255", "originalText": "यथोक्तैः सामान्यैः पादा एव मात्राः, मात्राश्च पादाः, तस्मात् ओङ्कारं पादशः विद्यात् इत्यर्थः। एवमोङ्कारे ज्ञाते दृष्टार्थमदृष्टार्थं वा न किञ्चिदपि प्रयोजनं चिन्तयेत्, कृतार्थत्वादित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000255.mp3", "sections": []}, {"id": "B_000256", "originalText": "युञ्जीत प्रणवे चेतः प्रणवो ब्रह्म निर्भयम्। प्रणवे नित्ययुक्तस्य न भयं विद्यते क्वचित्॥ २५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000256.mp3", "sections": []}, {"id": "B_000257", "originalText": "युञ्जीत समादध्यात् यथाव्याख्याते परमार्थरूपे प्रणवे चेतः मनः, यस्मात्प्रणवः ब्रह्म निर्भयम्, न हि तत्र सदायुक्तस्य भयं विद्यते क्वचित्, ‘विद्वान्न बिभेति कुतश्चन’ (तै.२.९.१) इति श्रुतेः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000257.mp3", "sections": []}, {"id": "B_000258", "originalText": "प्रणवो ह्यपरं ब्रह्म प्रणवश्च परं स्मृतः। अपूर्वोऽनन्तरोऽबाह्योऽनपरः प्रणवोऽव्ययः॥ २६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000258.mp3", "sections": []}, {"id": "B_000259", "originalText": "परापरे ब्रह्मणी प्रणवः, परमार्थतः क्षीणेषु मात्रापादेषु पर एवात्मा ब्रह्म इति, न पूर्वं कारणमस्य विद्यत इत्यपूर्वः, नास्य अन्तरं भिन्नजातीयं किञ्चिद्विद्यत इति अनन्तरः, तथा बाह्यमन्यत् न विद्यत इत्यबाह्यः, अपरं कार्यमस्य न विद्यत इत्यनपरः, सबाह्याभ्यन्तरो ह्यजः सैन्धवघनवत्प्रज्ञानघन इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000259.mp3", "sections": []}, {"id": "B_000260", "originalText": "सर्वस्य प्रणवो ह्यादिर्मध्यमन्तस्तथैव च। एवं हि प्रणवं ज्ञात्वा व्यश्नुते तदनन्तरम्॥ २७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000260.mp3", "sections": []}, {"id": "B_000261", "originalText": "आदिमध्यान्ता उत्पत्तिस्थितिप्रलयाः सर्वस्य प्रणव एव।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000261.mp3", "sections": []}, {"id": "B_000262", "originalText": "मायाहस्तिरज्जुसर्पमृगतृष्णिकास्वप्नादिवदुत्पद्यमानस्य वियदादिप्रपञ्चस्य यथा मायाव्यादयः, एवं हि प्रणवमात्मानं मायाव्यादिस्थानीयं ज्ञात्वा तत्क्षणादेव तदात्मभावं व्यश्नुत इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000262.mp3", "sections": []}, {"id": "B_000263", "originalText": "प्रणवं हीश्वरं विद्यात्सर्वस्य हृदये स्थितम्। सर्वव्यापिनमोङ्कारं मत्वा धीरो न शोचति॥ २८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000263.mp3", "sections": []}, {"id": "B_000264", "originalText": "सर्वस्य प्राणिजातस्य स्मृतिप्रत्ययास्पदे हृदये स्थितमीश्वरं प्रणवं विद्यात् सर्वव्यापिनं व्योमवत् ओङ्कारमात्मानमसंसारिणं धीरः धीमान्बुद्धिमान् आत्मतत्त्वं मत्वा ज्ञात्वा न शोचति, शोकनिमित्तानुपपत्तेः, ‘तरति शोकमात्मवित्’ (छा.७.१.३) इत्यादिश्रुतिभ्यः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000264.mp3", "sections": []}, {"id": "B_000265", "originalText": "अमात्रोऽनन्तमात्रश्च द्वैतस्योपशमः शिवः। ओङ्कारो विदितो येन स मुनिर्नेतरो जनः॥ २९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000265.mp3", "sections": []}, {"id": "B_000266", "originalText": "अमात्रः तुरीय ओङ्कारः, मीयते अनयेति मात्रा परिच्छित्तिः, सा अनन्ता यस्य सः अनन्तमात्रः, नैतावत्त्वमस्य परिच्छेत्तुं शक्यत इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000266.mp3", "sections": []}, {"id": "B_000267", "originalText": "सर्वद्वैतोपशमत्वादेव शिवः। ओङ्कारो यथाव्याख्यातो विदितो येन, स एव परमार्थतत्त्वस्य मननान्मुनिः, नेतरो जनः शास्त्रविदपीत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000267.mp3", "sections": []}, {"id": "B_000268", "originalText": "इति प्रथममागमप्रकरणं सम्पूर्णम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000268.mp3", "sections": []}, {"id": "B_000269", "originalText": "वैतथ्यप्रकरणम्\nवैतथ्यं सर्वभावानां स्वप्न आहुर्मनीषिणः। अन्तःस्थानात्तु भावानां संवृतत्वेन हेतुना॥ १॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000269.mp3", "sections": ["वैतथ्यप्रकरणम्"]}, {"id": "B_000270", "originalText": "‘ज्ञाते द्वैतं न विद्यते’ इत्युक्तम् ‘एकमेवाद्वितीयम्’ (छा.६.२.१) इत्यादिश्रुतिभ्यः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000270.mp3", "sections": []}, {"id": "B_000271", "originalText": "आगममात्रं तत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000271.mp3", "sections": []}, {"id": "B_000272", "originalText": "तत्र उपपत्त्यापि द्वैतस्य वैतथ्यं शक्यतेऽवधारयितुमिति द्वितीयं प्रकरणमारभ्यते— वैतथ्यमित्यादिना।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000272.mp3", "sections": []}, {"id": "B_00027
