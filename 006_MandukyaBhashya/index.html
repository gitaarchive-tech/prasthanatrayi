ad_000829.mp3", "sections": []}, {"id": "B_000830", "originalText": "निमित्तं न सदा चित्तं संस्पृशत्यध्वसु त्रिषु। अनिमित्तो विपर्यासः कथं तस्य भविष्यति॥ २७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000830.mp3", "sections": []}, {"id": "B_000831", "originalText": "ननु विपर्यासस्तर्हि असति घटादौ घटाद्याभासता चित्तस्य, तथा च सति अविपर्यासः क्वचिद्वक्तव्य इति, अत्रोच्यते— निमित्तं विषयम् अतीतानागतवर्तमानाध्वसु त्रिष्वपि सदा चित्तं न संस्पृशेदेव हि।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000831.mp3", "sections": []}, {"id": "B_000832", "originalText": "यदि हि क्वचित्संस्पृशेत्, सः अविपर्यासः परमार्थ इत्यतस्तदपेक्षया असति घटे घटाभासता विपर्यासः स्यात्, न तु तदस्ति कदाचिदपि चित्तस्यार्थसंस्पर्शनम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000832.mp3", "sections": []}, {"id": "B_000833", "originalText": "तस्मात् अनिमित्तः विपर्यासः कथं तस्य चित्तस्य भविष्यति? न कथञ्चिद्विपर्यासोऽस्तीत्यभिप्रायः। अयमेव हि स्वभावश्चित्तस्य, यदुत असति निमित्ते घटादौ तद्वदवभासनम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000833.mp3", "sections": []}, {"id": "B_000834", "originalText": "तस्मान्न जायते चित्तं चित्तदृश्यं न जायते। तस्य पश्यन्ति ये जातिं खे वै पश्यन्ति ते पदम्॥ २८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000834.mp3", "sections": []}, {"id": "B_000835", "originalText": "‘प्रज्ञप्तेः सनिमित्तत्वम्’ (मा.का.४.२५) इत्यादि एतदन्तं विज्ञानवादिनो बौद्धस्य वचनं बाह्यार्थवादिपक्षप्रतिषेधपरम् आचार्येणानुमोदितम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000835.mp3", "sections": []}, {"id": "B_000836", "originalText": "तदेव हेतुं कृत्वा तत्पक्षप्रतिषेधाय तदिदमुच्यते— तस्मादित्यादि।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000836.mp3", "sections": []}, {"id": "B_000837", "originalText": "यस्मादसत्येव घटादौ घटाद्याभासता चित्तस्य विज्ञानवादिना अभ्युपगता, तदनुमोदितमस्माभिरपि भूतदर्शनात्, तस्मात्तस्यापि चित्तस्य जायमानावभासता असत्येव जन्मनि युक्ता भवितुमिति अतो न जायते चित्तम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000837.mp3", "sections": []}, {"id": "B_000838", "originalText": "यथा चित्तदृश्यं न जायते अतस्तस्य चित्तस्य ये जातिं पश्यन्ति विज्ञानवादिनः क्षणिकत्वदुःखित्वशून्यत्वानात्मत्वादि च, तेनैव चित्तेन चित्तस्वरूपं द्रष्टुमशक्यं पश्यन्तः खे वै पश्यन्ति ते पदं पक्ष्यादीनाम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000838.mp3", "sections": []}, {"id": "B_000839", "originalText": "अत इतरेभ्योऽपि द्वैतिभ्योऽत्यन्तसाहसिका इत्यर्थः। येऽपि शून्यवादिनः पश्यन्त एव सर्वशून्यतां स्वदर्शनस्यापि शून्यतां प्रतिजानते, ते ततोऽपि साहसिकतराः खं मुष्टिनापि जिघृक्षन्ति॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000839.mp3", "sections": []}, {"id": "B_000840", "originalText": "अजातं जायते यस्मादजातिः प्रकृतिस्ततः। प्रकृतेरन्यथाभावो न कथञ्चिद्भविष्यति॥ २९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000840.mp3", "sections": []}, {"id": "B_000841", "originalText": "उक्तैर्हेतुभिरजमेकं ब्रह्मेति सिद्धम्, यत्पुनरादौ प्रतिज्ञातम्, तत्फलोपसंहारार्थोऽयं श्लोकः— अजातं यच्चित्तं ब्रह्मैव जायत इति वादिभिः परिकल्प्यते, तत् अजातं जायते यस्मात् अजातिः प्रकृतिः तस्य, ततः तस्मात् अजातरूपायाः प्रकृतेरन्यथाभावो जन्म न कथञ्चिद्भविष्यति॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000841.mp3", "sections": []}, {"id": "B_000842", "originalText": "अनादेरन्तवत्त्वं च संसारस्य न सेत्स्यति। अनन्तता चादिमतो मोक्षस्य न भविष्यति॥ ३०॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000842.mp3", "sections": []}, {"id": "B_000843", "originalText": "अयं चापर आत्मनः संसारमोक्षयोः परमार्थसद्भाववादिनां दोष उच्यते— अनादेः अतीतकोटिरहितस्य संसारस्य अन्तवत्त्वं समाप्तिः न सेत्स्यति युक्तितः सिद्धिं नोपयास्यति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000843.mp3", "sections": []}, {"id": "B_000844", "originalText": "न ह्यनादिः सन् अन्तवान्कश्चित्पदार्थो दृष्टो लोके।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000844.mp3", "sections": []}, {"id": "B_000845", "originalText": "बीजाङ्कुरसम्बन्धनैरन्तर्यविच्छेदो दृष्ट इति चेत्, न, एकवस्त्वभावेनापोदितत्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000845.mp3", "sections": []}, {"id": "B_000846", "originalText": "तथा अनन्ततापि विज्ञानप्राप्तिकालप्रभवस्य मोक्षस्य आदिमतो न भविष्यति, घटादिष्वदर्शनात्। घटादिविनाशवदवस्तुत्वाददोष इति चेत्, तथा च मोक्षस्य परमार्थसद्भावप्रतिज्ञाहानिः, असत्त्वादेव शशविषाणस्येव आदिमत्त्वाभावश्च॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000846.mp3", "sections": []}, {"id": "B_000847", "originalText": "आदावन्ते च यन्नास्ति वर्तमानेऽपि तत्तथा। वितथैः सदृशाः सन्तोऽवितथा इव लक्षिताः॥ ३१॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000847.mp3", "sections": []}, {"id": "B_000848", "originalText": "सप्रयोजनता तेषां स्वप्ने विप्रतिपद्यते। तस्मादाद्यन्तवत्त्वेन मिथ्यैव खलु ते स्मृताः॥ ३२॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000848.mp3", "sections": []}, {"id": "B_000849", "originalText": "वैतथ्ये कृतव्याख्यानौ श्लोकाविह संसारमोक्षाभावप्रसङ्गेन पठितौ॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000849.mp3", "sections": []}, {"id": "B_000850", "originalText": "सर्वे धर्मा मृषा स्वप्ने कायस्यान्तर्निदर्शनात्। संवृतेऽस्मिन्प्रदेशे वै भूतानां दर्शनं कुतः॥ ३३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000850.mp3", "sections": []}, {"id": "B_000851", "originalText": "‘निमित्तस्यानिमित्तत्वमिष्यते भूतदर्शनात्’ (मा.का.४.२५) इत्ययमर्थः प्रपञ्च्यते एतैः श्लोकैः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000851.mp3", "sections": []}, {"id": "B_000852", "originalText": "न युक्तं दर्शनं गत्वा कालस्यानियमाद्गतौ। प्रतिबुद्धश्च वै सर्वस्तस्मिन्देशे न विद्यते॥ ३४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000852.mp3", "sections": []}, {"id": "B_000853", "originalText": "जागरिते गत्यागमनकालौ नियतौ, देशः प्रमाणतो यः, तस्य अनियमात् नियमस्याभावात् स्वप्ने न देशान्तरगमनमित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000853.mp3", "sections": []}, {"id": "B_000854", "originalText": "मित्राद्यैः सह संमन्त्र्य सम्बुद्धो न प्रपद्यते। गृहीतं चापि यत्किञ्चित्प्रतिबुद्धो न पश्यति॥ ३५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000854.mp3", "sections": []}, {"id": "B_000855", "originalText": "मित्राद्यैः सह संमन्त्र्य तदेव मन्त्रणं प्रतिबुद्धो न प्रपद्यते, गृहीतं च यत्किञ्चिद्धिरण्यादि न प्राप्नोति, ततश्च न देशान्तरं गच्छति स्वप्ने॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000855.mp3", "sections": []}, {"id": "B_000856", "originalText": "स्वप्ने चावस्तुकः कायः पृथगन्यस्य दर्शनात्। यथा कायस्तथा सर्वं चित्तदृश्यमवस्तुकम्॥ ३६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000856.mp3", "sections": []}, {"id": "B_000857", "originalText": "स्वप्ने च अटन्दृश्यते यः कायः, सः अवस्तुकः ततोऽन्यस्य स्वापदेशस्थस्य पृथक्कायान्तरस्य दर्शनात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000857.mp3", "sections": []}, {"id": "B_000858", "originalText": "यथा स्वप्नदृश्यः कायः असन्, तथा सर्वं चित्तदृश्यम् अवस्तुकं जागरितेऽपि चित्तदृश्यत्वादित्यर्थः। स्वप्नसमत्वादसज्जागरितमपीति प्रकरणार्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000858.mp3", "sections": []}, {"id": "B_000859", "originalText": "ग्रहणाज्जागरितवत्तद्धेतुः स्वप्न इष्यते। तद्धेतुत्वात्तु तस्यैव सज्जागरितमिष्यते॥ ३७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000859.mp3", "sections": []}, {"id": "B_000860", "originalText": "इतश्च असत्त्वं जाग्रद्वस्तुनः जागरितवत् जागरितस्येव ग्रहणात् ग्राह्यग्राहकरूपेण स्वप्नस्य, तज्जागरितं हेतुः अस्य स्वप्नस्य स स्वप्नः तद्धेतुः जागरितकार्यम् इष्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000860.mp3", "sections": []}, {"id": "B_000861", "originalText": "तद्धेतुत्वात् जागरितकार्यत्वात् तस्यैव स्वप्नदृश एव सज्जागरितम्, न त्वन्येषाम्, यथा स्वप्न इत्यभिप्रायः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000861.mp3", "sections": []}, {"id": "B_000862", "originalText": "यथा स्वप्नः स्वप्नदृश एव सन् साधारणविद्यमानवस्तुवदवभासते, तथा तत्कारणत्वात्साधारणविद्यमानवस्तुवदवभासनम्, न तु साधारणं विद्यमानवस्तु स्वप्नवदेवेत्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000862.mp3", "sections": []}, {"id": "B_000863", "originalText": "उत्पादस्याप्रसिद्धत्वादजं सर्वमुदाहृतम्। न च भूतादभूतस्य सम्भवोऽस्ति कथञ्चन॥ ३८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000863.mp3", "sections": []}, {"id": "B_000864", "originalText": "ननु स्वप्नकारणत्वेऽपि जागरितवस्तुनो न स्वप्नवदवस्तुत्वम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000864.mp3", "sections": []}, {"id": "B_000865", "originalText": "अत्यन्तचलो हि स्वप्नः जागरितं तु स्थिरं लक्ष्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000865.mp3", "sections": []}, {"id": "B_000866", "originalText": "सत्यमेवमविवेकिनां स्यात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000866.mp3", "sections": []}, {"id": "B_000867", "originalText": "विवेकिनां तु न कस्यचिद्वस्तुन उत्पादः प्रसिद्धः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000867.mp3", "sections": []}, {"id": "B_000868", "originalText": "अतः अप्रसिद्धत्वात् उत्पादस्य आत्मैव सर्वमिति अजं सर्वम् उदाहृतं वेदान्तेषु ‘सबाह्याभ्यन्तरो ह्यजः’ (मु.२.१.२) इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000868.mp3", "sections": []}, {"id": "B_000869", "originalText": "यदपि मन्यसे जागरितात्सतः असन्स्वप्नो जायत इति, तदसत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000869.mp3", "sections": []}, {"id": "B_000870", "originalText": "न भूतात् विद्यमानात् अभूतस्य असतः सम्भवोऽस्ति लोके। न ह्यसतः शशविषाणादेः सम्भवो दृष्टः कथञ्चिदपि॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000870.mp3", "sections": []}, {"id": "B_000871", "originalText": "असज्जागरिते दृष्ट्वा स्वप्ने पश्यति तन्मयः। असत्स्वप्नेऽपि दृष्ट्वा च प्रतिबुद्धो न पश्यति॥ ३९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000871.mp3", "sections": []}, {"id": "B_000872", "originalText": "ननु उक्तं त्वयैव स्वप्नो जागरितकार्यमिति, तत्कथमुत्पादोऽप्रसिद्ध इति उच्यते? शृणु तत्र यथा कार्यकारणभावोऽस्माभिरभिप्रेत इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000872.mp3", "sections": []}, {"id": "B_000873", "originalText": "असत् अविद्यमानं रज्जुसर्पवद्विकल्पितं वस्तु जागरिते दृष्ट्वा तद्भावभावितस्तन्मयः स्वप्नेऽपि जागरितवत् ग्राह्यग्राहकरूपेण विकल्पयन्पश्यति, तथा असत्स्वप्नेऽपि दृष्ट्वा च प्रतिबुद्धो न पश्यति अविकल्पयन्, च— शब्दात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000873.mp3", "sections": []}, {"id": "B_000874", "originalText": "तथा जागरितेऽपि दृष्ट्वा स्वप्ने न पश्यति कदाचिदित्यर्थः। तस्माज्जागरितं स्वप्नहेतुरित्युच्यते, न तु परमार्थसदिति कृत्वा॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000874.mp3", "sections": []}, {"id": "B_000875", "originalText": "नास्त्यसद्धेतुकमसत्सदसद्धेतुकं तथा। सच्च सद्धेतुकं नास्ति सद्धेतुकमसत्कुतः॥ ४०॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000875.mp3", "sections": []}, {"id": "B_000876", "originalText": "परमार्थतस्तु न कस्यचित्केनचिदपि प्रकारेण कार्यकारणभाव उपपद्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000876.mp3", "sections": []}, {"id": "B_000877", "originalText": "कथम्? नास्ति असद्धेतुकम् असत् शशविषाणादि हेतुः कारणं यस्य असत एव खपुष्पादेः, तत् असद्धेतुकम् असत् न विद्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000877.mp3", "sections": []}, {"id": "B_000878", "originalText": "तथा सदपि घटादिवस्तु असद्धेतुकम् शशविषाणादिकार्यं नास्ति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000878.mp3", "sections": []}, {"id": "B_000879", "originalText": "तथा सच्च विद्यमानं घटादि वस्त्वन्तरकार्यं नास्ति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000879.mp3", "sections": []}, {"id": "B_000880", "originalText": "सत्कार्यम् असत् कुत एव सम्भवति? न चान्यः कार्यकारणभावः सम्भवति शक्यो वा कल्पयितुम्। अतो विवेकिनामसिद्ध एव कार्यकारणभावः कस्यचिदित्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000880.mp3", "sections": []}, {"id": "B_000881", "originalText": "विपर्यासाद्यथा जाग्रदचिन्त्यान्भूतवत्स्पृशेत्। तथा स्वप्ने विपर्यासाद्धर्मांस्तत्रैव पश्यति॥ ४१॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000881.mp3", "sections": []}, {"id": "B_000882", "originalText": "पुनरपि जाग्रत्स्वप्नयोरसतोरपि कार्यकारणभावाशङ्कामपनयन्नाह— विपर्यासात् अविवेकतः यथा जाग्रत् जागरिते अचिन्त्यान्भावान् अशक्यचिन्तनान् रज्जुसर्पादीन् भूतवत् परमार्थवत् स्पृशेत्, स्पृशन्निव विकल्पयेदित्यर्थः, कश्चिद्यथा, तथा स्वप्ने विपर्यासात् हस्त्यादीन्पश्यन्निव विकल्पयति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000882.mp3", "sections": []}, {"id": "B_000883", "originalText": "तत्रैव पश्यति, न तु जागरितादुत्पद्यमानानित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000883.mp3", "sections": []}, {"id": "B_000884", "originalText": "उपलम्भात्समाचारादस्तिवस्तुत्ववादिनाम्। जातिस्तु देशिता बुद्धैरजातेस्त्रसतां सदा॥ ४२॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000884.mp3", "sections": []}, {"id": "B_000885", "originalText": "यापि बुद्धैः अद्वैतवादिभिः जातिः देशिता उपदिष्टा, उपलम्भनमुपलम्भः, तस्मात् उपलब्धेरित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000885.mp3", "sections": []}, {"id": "B_000886", "originalText": "समाचारात् वर्णाश्रमादिधर्मसमाचरणाच्च ताभ्यां हेतुभ्याम् अस्तिवस्तुत्ववादिनाम् अस्ति वस्तुभाव इत्येवंवदनशीलानां दृढाग्रहवतां श्रद्दधानां मन्दविवेकिनामर्थोपायत्वेन सा देशिता जातिः तां गृह्णन्तु तावत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000886.mp3", "sections": []}, {"id": "B_000887", "originalText": "वेदान्ताभ्यासिनां तु स्वयमेव अजाद्वयात्मविषयो विवेको भविष्यतीति, न तु परमार्थबुद्ध्या।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000887.mp3", "sections": []}, {"id": "B_000888", "originalText": "ते हि श्रोत्रियाः स्थूलबुद्धित्वात् अजातेः अजातिवस्तुनः सदा त्रस्यन्ति आत्मनाशं मन्यमाना अविवेकिन इत्यर्थः। ‘उपायः सोऽवताराय’ (मा.का.३.१५) इत्युक्तम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000888.mp3", "sections": []}, {"id": "B_000889", "originalText": "अजातेस्त्रसतां तेषामुपलम्भाद्वियन्ति ये। जातिदोषा न सेत्स्यन्ति दोषोऽप्यल्पो भविष्यति॥ ४३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000889.mp3", "sections": []}, {"id": "B_000890", "originalText": "ये च एवमुपलम्भात्समाचाराच्च अजातेः अजातिवस्तुनः त्रसन्तः अस्ति वस्त्विति अद्वयादात्मनः, वियन्ति विरुद्धं यन्ति द्वैतं प्रतिपद्यन्त इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000890.mp3", "sections": []}, {"id": "B_000891", "originalText": "तेषाम् अजातेः त्रसतां श्रद्दधानानां सन्मार्गावलम्बिनां जातिदोषाः जात्युपलम्भकृता दोषाः न सेत्स्यन्ति सिद्धिं नोपयास्यन्ति, विवेकमार्गप्रवृत्तत्वात्। यद्यपि कश्चिद्दोषः स्यात्, सोऽप्यल्प एव भविष्यति, सम्यग्दर्शनाप्रतिपत्तिहेतुक इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000891.mp3", "sections": []}, {"id": "B_000892", "originalText": "उपलम्भात्समाचारान्मायाहस्ती यथोच्यते। उपलम्भात्समाचारादस्ति वस्तु तथोच्यते॥ ४४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000892.mp3", "sections": []}, {"id": "B_000893", "originalText": "ननु उपलम्भसमाचारयोः प्रमाणत्वादस्त्येव द्वैतं वस्त्विति, न, उपलम्भसमाचारयोर्व्यभिचारात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000893.mp3", "sections": []}, {"id": "B_000894", "originalText": "कथं व्यभिचार इति, उच्यते— उपलभ्यते हि मायाहस्ती हस्तीव, हस्तिनमिवात्र समाचरन्ति बन्धनारोहणादिहस्तिसम्बन्धिभिर्धर्मैः, हस्तीति चोच्यते असन्नपि यथा, तथैव उपलम्भात्समाचारात् द्वैतं भेदरूपं अस्ति वस्तु इत्युच्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000894.mp3", "sections": []}, {"id": "B_000895", "originalText": "तस्मान्नोपलम्भसमाचारौ द्वैतवस्तुसद्भावे हेतू भवत इत्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000895.mp3", "sections": []}, {"id": "B_000896", "originalText": "जात्याभासं चलाभासं वस्त्वाभासं तथैव च। अजाचलमवस्तुत्वं विज्ञानं शान्तमद्वयम्॥ ४५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000896.mp3", "sections": []}, {"id": "B_000897", "originalText": "किं पुनः परमार्थसद्वस्तु, यदास्पदा जात्याद्यसद्बुद्धय इत्याह— अजाति सत् जातिवदवभासत इति जात्याभासम्, तद्यथा देवदत्तो जायत इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000897.mp3", "sections": []}, {"id": "B_000898", "originalText": "चलाभासं चलमिवाभासत इति, यथा स एव देवदत्तो गच्छतीति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000898.mp3", "sections": []}, {"id": "B_000899", "originalText": "वस्त्वाभासं वस्तु द्रव्यं धर्मि, तद्वदवभासत इति वस्त्वाभासम्, यथा स एव देवदत्तो गौरो दीर्घ इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000899.mp3", "sections": []}, {"id": "B_000900", "originalText": "जायते देवदत्तः स्पन्दते दीर्घो गौर इत्येवमवभासते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000900.mp3", "sections": []}, {"id": "B_000901", "originalText": "परमार्थतस्तु अजमचलमवस्तुत्वमद्रव्यं च। किं तदेवंप्रकारम्? विज्ञानं विज्ञप्तिः, जात्यादिरहितत्वाच्छान्तम् अत एव अद्वयं च तदित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000901.mp3", "sections": []}, {"id": "B_000902", "originalText": "एवं न जायते चित्तमेवं धर्मा अजाः स्मृताः। एवमेव विजानन्तो न पतन्ति विपर्यये॥ ४६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000902.mp3", "sections": []}, {"id": "B_000903", "originalText": "एवं यथोक्तेभ्यो हेतुभ्यः न जायते चित्तम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000903.mp3", "sections": []}, {"id": "B_000904", "originalText": "एवं धर्माः आत्मानः अजाः स्मृताः ब्रह्मविद्भिः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000904.mp3", "sections": []}, {"id": "B_000905", "originalText": "धर्मा इति बहुवचनं देहभेदानुविधायित्वादद्वयस्यैव उपचारतः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000905.mp3", "sections": []}, {"id": "B_000906", "originalText": "एवमेव यथोक्तं विज्ञानं जात्यादिरहितमद्वयमात्मतत्त्वं विजानन्तः त्यक्तबाह्यैषणाः पुनर्न पतन्ति अविद्याध्वान्तसागरे विपर्यये, ‘तत्र को मोहः कः शोक एकत्वमनुपश्यतः’ (ई.७) इत्यादिमन्त्रवर्णात्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000906.mp3", "sections": []}, {"id": "B_000907", "originalText": "ऋजुवक्रादिकाभासमलातस्पन्दितं यथा। ग्रहणग्राहकाभासं विज्ञानस्पन्दितं तथा॥ ४७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000907.mp3", "sections": []}, {"id": "B_000908", "originalText": "यथोक्तं परमार्थदर्शनं प्रपञ्चयिष्यन्नाह— यथा हि लोके ऋजुवक्रादिप्रकाराभासम् अलातस्पन्दितम् उल्काचलनम्, तथा ग्रहणग्राहकाभासं विषयिविषयाभासमित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000908.mp3", "sections": []}, {"id": "B_000909", "originalText": "किं तत्? विज्ञानस्पन्दितं स्पन्दितमिव स्पन्दितमविद्यया। न ह्यचलस्य विज्ञानस्य स्पन्दनमस्ति, ‘अजाचलम्’ (मा.का.४.४५) इति ह्युक्तम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000909.mp3", "sections": []}, {"id": "B_000910", "originalText": "अस्पन्दमानमलातमनाभासमजं यथा। अस्पन्दमानं विज्ञानमनाभासमजं तथा॥ ४८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000910.mp3", "sections": []}, {"id": "B_000911", "originalText": "अस्पन्दमानं स्पन्दनवर्जितं तदेव अलातम् ऋज्वाद्याकारेणाजायमानम् अनाभासम् अजं यथा, तथा अविद्यया स्पन्दमानम् अविद्योपरमे अस्पन्दमानं जात्याद्याकारेण अनाभासम् अजम् अचलं भविष्यतीत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000911.mp3", "sections": []}, {"id": "B_000912", "originalText": "अलाते स्पन्दमाने वै नाभासा अन्यतोभुवः। न ततोऽन्यत्र निःस्पन्दान्नालातं प्रविशन्ति ते॥ ४९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000912.mp3", "sections": []}, {"id": "B_000913", "originalText": "किं च, तस्मिन्नेव अलाते स्पन्दमाने ऋजुवक्राद्याभासाः अलातादन्यतः कुतश्चिदागत्यालाते नैव भवन्तीति नान्यतोभुवः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000913.mp3", "sections": []}, {"id": "B_000914", "originalText": "न च तस्मान्निःस्पन्दादलातादन्यत्र निर्गताः। न च निःस्पन्दमलातमेव प्रविशन्ति ते॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000914.mp3", "sections": []}, {"id": "B_000915", "originalText": "न निर्गता अलातात्ते द्रव्यत्वाभावयोगतः। विज्ञानेऽपि तथैव स्युराभासस्याविशेषतः॥ ५०॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000915.mp3", "sections": []}, {"id": "B_000916", "originalText": "किं च, न निर्गता अलातात् ते आभासाः गृहादिव, द्रव्यत्वाभावयोगतः, द्रव्यस्य भावो द्रव्यत्वम्, तदभावः द्रव्यत्वाभावः, द्रव्यत्वाभावयोगतः द्रव्यत्वाभावयुक्तेः वस्तुत्वाभावादित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000916.mp3", "sections": []}, {"id": "B_000917", "originalText": "वस्तुनो हि प्रवेशादि सम्भवति, नावस्तुनः। विज्ञानेऽपि जात्याद्याभासाः तथैव स्युः, आभासस्य अविशेषतः तुल्यत्वात्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000917.mp3", "sections": []}, {"id": "B_000918", "originalText": "विज्ञाने स्पन्दमाने वै नाभासा अन्यतोभुवः। न ततोऽन्यत्र निःस्पन्दान्न विज्ञानं विशन्ति ते॥ ५१॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000918.mp3", "sections": []}, {"id": "B_000919", "originalText": "न निर्गतास्ते विज्ञानाद्द्रव्यत्वाभावयोगतः। कार्यकारणताभावाद्यतोऽचिन्त्याः सदैव ते॥ ५२॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000919.mp3", "sections": []}, {"id": "B_000920", "originalText": "कथं तुल्यत्वमित्याह— अलातेन समानं सर्वं विज्ञानस्य, सदा अचलत्वं तु विज्ञानस्य विशेषः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000920.mp3", "sections": []}, {"id": "B_000921", "originalText": "जात्याद्याभासा विज्ञाने अचले किङ्कृता इत्याह— कार्यकारणताभावात् जन्यजनकत्वानुपपत्तेरभावरूपत्वात् अचिन्त्याः ते यतः सदैव। यथा असत्सु ऋज्वाद्याभासेषु ऋज्वादिबुद्धिर्दृष्टा अलातमात्रे, तथा असत्स्वेव जात्यादिषु विज्ञानमात्रे जात्यादिबुद्धिर्मृषैवेति समुदायार्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000921.mp3", "sections": []}, {"id": "B_000922", "originalText": "द्रव्यं द्रव्यस्य हेतुः स्यादन्यदन्यस्य चैव हि। द्रव्यत्वमन्यभावो वा धर्माणां नोपपद्यते॥ ५३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000922.mp3", "sections": []}, {"id": "B_000923", "originalText": "अजमेकमात्मतत्त्वमिति स्थितम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000923.mp3", "sections": []}, {"id": "B_000924", "originalText": "तत्र यैरपि कार्यकारणभावः कल्प्यते, तेषां द्रव्यं द्रव्यस्यान्यस्यान्यत् हेतुः कारणं स्यात्, न तु तस्यैव तत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000924.mp3", "sections": []}, {"id": "B_000925", "originalText": "नाप्यद्रव्यं कस्यचित्कारणं स्वतन्त्रं दृष्टं लोके।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000925.mp3", "sections": []}, {"id": "B_000926", "originalText": "न च द्रव्यत्वं धर्माणाम् आत्मनाम् उपपद्यते अन्यत्वं वा कुतश्चित्, येन अन्यस्य कारणत्वं कार्यत्वं वा प्रतिपद्येत। अतः अद्रव्यत्वादनन्यत्वाच्च न कस्यचित्कार्यं कारणं वा आत्मेत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000926.mp3", "sections": []}, {"id": "B_000927", "originalText": "एवं न चित्तजा धर्माश्चित्तं वापि न धर्मजम्। एवं हेतुफलाजातिं प्रविशन्ति मनीषिणः॥ ५४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000927.mp3", "sections": []}, {"id": "B_000928", "originalText": "एवं यथोक्तेभ्यो हेतुभ्यः आत्मविज्ञानस्वरूपमेव चित्तमिति, न चित्तजाः बाह्यधर्माः, नापि बाह्यधर्मजं चित्तम्, विज्ञानस्वरूपाभासमात्रत्वात्सर्वधर्माणाम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000928.mp3", "sections": []}, {"id": "B_000929", "originalText": "एवं न हेतोः फलं जायते, नापि फलाद्धेतुरिति हेतुफलयोरजातिं हेतुफलाजातिं प्रविशन्ति अध्यवस्यन्ति। आत्मनि हेतुफलयोरभावमेव प्रतिपद्यन्ते ब्रह्मविद इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000929.mp3", "sections": []}, {"id": "B_000930", "originalText": "यावद्धेतुफलावेशस्तावद्धेतुफलोद्भवः। क्षीणे हेतुफलावेशे नास्ति हेतुफलोद्भवः॥ ५५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000930.mp3", "sections": []}, {"id": "B_000931", "originalText": "ये पुनर्हेतुफलयोरभिनिविष्टाः, तेषां किं स्यादिति, उच्यते— धर्माधर्माख्यस्य हेतोः अहं कर्ता मम धर्माधर्मौ तत्फलं कालान्तरे क्वचित्प्राणिनिकाये जातो भोक्ष्ये इति यावद्धेतुफलयोरावेशः हेतुफलाग्रह आत्मन्यध्यारोपणम्, तच्चित्ततेत्यर्थः, तावद्धेतुफलयोरुद्भवः धर्माधर्मयोस्तत्फलस्य चानुच्छेदेन प्रवृत्तिरित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000931.mp3", "sections": []}, {"id": "B_000932", "originalText": "यदा पुनर्मन्त्रौषधिवीर्येणेव ग्रहावेशो यथोक्ताद्वैतदर्शनेन अविद्योद्भूतहेतुफलावेशोपनीतो भवति, तदा तस्मिन्क्षीणे नास्ति हेतुफलोद्भवः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000932.mp3", "sections": []}, {"id": "B_000933", "originalText": "यावद्धेतुफलावेशः संसारस्तावदायतः। क्षीणे हेतुफलावेशे संसारं न प्रपद्यते॥ ५६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000933.mp3", "sections": []}, {"id": "B_000934", "originalText": "यदि हेतुफलोद्भवः, तदा को दोष इति, उच्यते— यावत् सम्यग्दर्शनेन हेतुफलावेशः न निवर्तते, अक्षीणः संसारः तावत् आयातः दीर्घो भवतीत्यर्थः। क्षीणे पुनः हेतुफलावेशे संसारं न प्रपद्यते, कारणाभावात्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000934.mp3", "sections": []}, {"id": "B_000935", "originalText": "संवृत्या जायते सर्वं शाश्वतं नास्ति तेन वै। सद्भावेन ह्यजं सर्वमुच्छेदस्तेन नास्ति वै॥ ५७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000935.mp3", "sections": []}, {"id": "B_000936", "originalText": "ननु अजादात्मनोऽन्यन्नास्त्येव, तत्कथं हेतुफलयोः संसारस्य च उत्पत्तिविनाशावुच्येते त्वया? शृणु, संवृत्या संवरणं संवृतिः अविद्याविषयो लौकिकव्यवहारः, तया संवृत्या जायते सर्वम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000936.mp3", "sections": []}, {"id": "B_000937", "originalText": "तेन अविद्याविषये शाश्वतं नित्यं नास्ति वै।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000937.mp3", "sections": []}, {"id": "B_000938", "originalText": "अतः उत्पत्तिविनाशलक्षणः संसारः आयत इत्युच्यते। परमार्थसद्भावेन तु अजं सर्वम् आत्मैव यस्मात्, अतो जात्यभावात् उच्छेदः तेन नास्ति वै कस्यचिद्धेतुफलादेरित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000938.mp3", "sections": []}, {"id": "B_000939", "originalText": "धर्मा य इति जायन्ते जायन्ते ते न तत्त्वतः। जन्म मायोपमं तेषां सा च माया न विद्यते॥ ५८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000939.mp3", "sections": []}, {"id": "B_000940", "originalText": "येऽप्यात्मानोऽन्ये च धर्मा जायन्त इति कल्प्यन्ते, ते इति एवंप्रकारा यथोक्ता संवृतिर्निर्दिश्यत इति संवृत्यैव धर्मा जायन्ते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000940.mp3", "sections": []}, {"id": "B_000941", "originalText": "न ते तत्त्वतः परमार्थतः जायन्ते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000941.mp3", "sections": []}, {"id": "B_000942", "originalText": "यत्पुनस्तत्संवृत्या जन्म तेषां धर्माणां यथोक्तानां यथा मायया जन्म तथा तत् मायोपमं प्रत्येतव्यम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000942.mp3", "sections": []}, {"id": "B_000943", "originalText": "माया नाम वस्तु तर्हि, नैवम्, सा च माया न विद्यते। मायेत्यविद्यमानस्याख्येत्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000943.mp3", "sections": []}, {"id": "B_000944", "originalText": "यथा मायामयाद्बीजाज्जायते तन्मयोऽङ्कुरः। नासौ नित्यो न चोच्छेदी तद्वद्धर्मेषु योजना॥ ५९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000944.mp3", "sections": []}, {"id": "B_000945", "originalText": "कथं मायोपमं तेषां धर्माणां जन्मेति, आह— यथा मायामयात् आम्रादिबीजात् जायते तन्मयः मायामयः अङ्कुरः, नासावङ्कुरो नित्यः, न च उच्छेदी विनाशी वा। अभूतत्वादेव धर्मेषु जन्मनाशादियोजना युक्तिः, न तु परमार्थतो धर्माणां जन्म नाशो वा युज्यत इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000945.mp3", "sections": []}, {"id": "B_000946", "originalText": "नाजेषु सर्वधर्मेषु शाश्वताशाश्वताभिधा। यत्र वर्णा न वर्तन्ते विवेकस्तत्र नोच्यते॥ ६०॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000946.mp3", "sections": []}, {"id": "B_000947", "originalText": "परमार्थतस्त्वात्मस्वजेषु नित्यैकरसविज्ञप्तिमात्रसत्ताकेषु शाश्वतः अशाश्वतः इति वा न अभिधा, नाभिधानं प्रवर्तत इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000947.mp3", "sections": []}, {"id": "B_000948", "originalText": "यत्र येषु वर्ण्यन्ते यैरर्थाः, ते वर्णाः शब्दा न वर्तन्ते अभिधातुं प्रकाशयितुं न प्रवर्तन्त इत्यर्थः। इदमेवमिति विवेकः विविक्तता तत्र नित्योऽनित्य इति नोच्यते, ‘यतो वाचो निवर्तन्ते’ (तै.२.९.१) इति श्रुतेः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000948.mp3", "sections": []}, {"id": "B_000949", "originalText": "यथा स्वप्ने द्वयाभासं चित्तं चलति मायया। तथा जाग्रद्द्वयाभासं चित्तं चलति मायया॥ ६१॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000949.mp3", "sections": []}, {"id": "B_000950", "originalText": "अद्वयं च द्वयाभासं चित्तं स्वप्ने न संशयः। अद्वयं च द्वयाभासं तथा जाग्रन्न संशयः॥ ६२॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000950.mp3", "sections": []}, {"id": "B_000951", "originalText": "यत्पुनर्वाग्गोचरत्वं परमार्थतः अद्वयस्य विज्ञानमात्रस्य, तन्मनसः स्पन्दनमात्रम्, न परमार्थतः इत्युक्तार्थौ श्लोकौ॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000951.mp3", "sections": []}, {"id": "B_000952", "originalText": "स्वप्नदृक्प्रचरन्स्वप्ने दिक्षु वै दशसु स्थितान्। अण्डजान्स्वेदजान्वापि जीवान्पश्यति यान्सदा॥ ६३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000952.mp3", "sections": []}, {"id": "B_000953", "originalText": "इतश्च वाग्गोचरस्याभावो द्वैतस्य— स्वप्नान्पश्यतीति स्वप्नदृक् प्रचरन् पर्यटन्स्वप्ने स्वप्नस्थाने दिक्षु वै दशसु स्थितान् वर्तमानान् जीवान्प्राणिनः अण्डजान्स्वेदजान्वा यान् सदा पश्यतीति॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000953.mp3", "sections": []}, {"id": "B_000954", "originalText": "स्वप्नदृक्चित्तदृश्यास्ते न विद्यन्ते ततः पृथक्। तथा तद्दृश्यमेवेदं स्वप्नदृक्चित्तमिष्यते॥ ६४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000954.mp3", "sections": []}, {"id": "B_000955", "originalText": "यद्येवम्, ततः किम्? उच्यते— स्वप्नदृशश्चित्तं स्वप्नदृक्चित्तम्, तेन दृश्याः ते जीवाः, ततः तस्मात् स्वप्नदृक्चित्तात् पृथक् न विद्यन्ते न सन्तीत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000955.mp3", "sections": []}, {"id": "B_000956", "originalText": "चित्तमेव ह्यनेकजीवादिभेदाकारेण विकल्प्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000956.mp3", "sections": []}, {"id": "B_000957", "originalText": "तथा तदपि स्वप्नदृक्चित्तमिदं तद्दृश्यमेव, तेन स्वप्नदृशा दृश्यं तद्दृश्यम्। अतः स्वप्नदृग्व्यतिरेकेण चित्तं नाम नास्तीत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000957.mp3", "sections": []}, {"id": "B_000958", "originalText": "चरञ्जागरिते जाग्रद्दिक्षु वै दशसु स्थितान्। अण्डजान्स्वेदजान्वापि जीवान्पश्यति यान्सदा॥ ६५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000958.mp3", "sections": []}, {"id": "B_000959", "originalText": "जाग्रच्चित्तेक्षणीयास्ते न विद्यन्ते ततः पृथक्। तथा तद्दृश्यमेवेदं जाग्रतश्चित्तमिष्यते॥ ६६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000959.mp3", "sections": []}, {"id": "B_000960", "originalText": "जाग्रतो दृश्या जीवाः तच्चित्ताव्यतिरिक्ताः, चित्तेक्षणीयत्वात्, स्वप्नदृक्चित्तेक्षणीयजीववत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000960.mp3", "sections": []}, {"id": "B_000961", "originalText": "तच्च जीवेक्षणात्मकं चित्तं द्रष्टुरव्यतिरिक्तं द्रष्टृदृश्यत्वात् स्वप्नचित्तवत्। उक्तार्थमन्यत्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000961.mp3", "sections": []}, {"id": "B_000962", "originalText": "उभे ह्यन्योन्यदृश्ये ते किं तदस्तीति चोच्यते। लक्षणाशून्यमुभयं तन्मते नैव गृह्यते॥ ६७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000962.mp3", "sections": []}, {"id": "B_000963", "originalText": "जीवचित्ते उभे चित्तचैत्त्ये ते अन्योन्यदृश्ये इतरेतरगम्ये।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000963.mp3", "sections": []}, {"id": "B_000964", "originalText": "जीवादिविषयापेक्षं हि चित्तं नाम भवति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000964.mp3", "sections": []}, {"id": "B_000965", "originalText": "चित्तापेक्षं हि जीवादि दृश्यम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000965.mp3", "sections": []}, {"id": "B_000966", "originalText": "अतस्ते अन्योन्यदृश्ये।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000966.mp3", "sections": []}, {"id": "B_000967", "originalText": "तस्मान्न किञ्चिदस्तीति चोच्यते चित्तं वा चित्तेक्षणीयं वा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000967.mp3", "sections": []}, {"id": "B_000968", "originalText": "किं तदस्तीति विवेकिनोच्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000968.mp3", "sections": []}, {"id": "B_000969", "originalText": "न हि स्वप्ने हस्ती हस्तिचित्तं वा विद्यते, तथा इहापि विवेकिनामित्यभिप्रायः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000969.mp3", "sections": []}, {"id": "B_000970", "originalText": "कथम्? लक्षणाशून्यं लक्ष्यते अनयेति लक्षणा प्रमाणम्, प्रमाणशून्यमुभयं चित्तं चैत्त्यं द्वयं यतः, तन्मतेनैव तच्चित्ततयैव तत् गृह्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000970.mp3", "sections": []}, {"id": "B_000971", "originalText": "न हि घटमतिं प्रत्याख्याय घटो गृह्यते, नापि घटं प्रत्याख्याय घटमतिः। न हि तत्र प्रमाणप्रमेयभेदः शक्यते कल्पयितुमित्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000971.mp3", "sections": []}, {"id": "B_000972", "originalText": "यथा स्वप्नमयो जीवो जायते म्रियतेऽपि च। तथा जीवा अमी सर्वे भवन्ति न भवन्ति च॥ ६८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000972.mp3", "sections": []}, {"id": "B_000973", "originalText": "यथा मायामयो जीवो जायते म्रियतेऽपि च। तथा जीवा अमी सर्वे भवन्ति न भवन्ति च॥ ६९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000973.mp3", "sections": []}, {"id": "B_000974", "originalText": "यथा निर्मितको जीवो जायते म्रियतेऽपि च। तथा जीवा अमी सर्वे भवन्ति न भवन्ति च॥ ७०॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000974.mp3", "sections": []}, {"id": "B_000975", "originalText": "मायामयः मायाविना यः कृतो निर्मितकः मन्त्रौषध्यादिभिर्निष्पादितः। स्वप्नमायानिर्मितका अण्डजादयो जीवा यथा जायन्ते म्रियन्ते च, तथा मनुष्यादिलक्षणा अविद्यमाना एव चित्तविकल्पनामात्रा इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000975.mp3", "sections": []}, {"id": "B_000976", "originalText": "न कश्चिज्जायते जीवः सम्भवोऽस्य न विद्यते। एतत्तदुत्तमं सत्यं यत्र किञ्चिन्न जायते॥ ७१॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000976.mp3", "sections": []}, {"id": "B_000977", "originalText": "व्यवहारसत्यविषये जीवानां जन्ममरणादिः स्वप्नादिजीववदित्युक्तम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000977.mp3", "sections": []}, {"id": "B_000978", "originalText": "उत्तमं तु परमार्थसत्यं न कश्चिज्जायते जीव इति। उक्तार्थमन्यत्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000978.mp3", "sections": []}, {"id": "B_000979", "originalText": "चित्तस्पन्दितमेवेदं ग्राह्यग्राहकवद्द्वयम्। चित्तं निर्विषयं नित्यमसङ्गं तेन कीर्तितम्॥ ७२॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000979.mp3", "sections": []}, {"id": "B_000980", "originalText": "सर्वं ग्राह्यग्राहकवच्चित्तस्पन्दितमेव द्वयम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000980.mp3", "sections": []}, {"id": "B_000981", "originalText": "चित्तं परमार्थत आत्मैवेति निर्विषयम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000981.mp3", "sections": []}, {"id": "B_000982", "originalText": "तेन निर्विषयत्वेन नित्यम् असङ्गं कीर्तितम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000982.mp3", "sections": []}, {"id": "B_000983", "originalText": "‘असङ्गो ह्ययं पुरुषः’ (बृ.४.३.१५) इति श्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000983.mp3", "sections": []}, {"id": "B_000984", "originalText": "सविषयस्य हि विषये सङ्गः। निर्विषयत्वाच्चित्तमसङ्गमित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000984.mp3", "sections": []}, {"id": "B_000985", "originalText": "योऽस्ति कल्पितसंवृत्या परमार्थेन नास्त्यसौ। परतन्त्राभिसंवृत्या स्यान्नास्ति परमार्थतः॥ ७३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000985.mp3", "sections": []}, {"id": "B_000986", "originalText": "ननु निर्विषयत्वेन चेदसङ्गत्वम्, चित्तस्य न निःसङ्गता भवति, यस्मात् शास्ता शास्त्रं शिष्यश्चेत्येवमादेर्विषयस्य विद्यमानत्वात्, नैष दोषः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000986.mp3", "sections": []}, {"id": "B_000987", "originalText": "कस्मात्? यः पदार्थः शास्त्रादिर्विद्यते, स कल्पितसंवृत्या।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000987.mp3", "sections": []}, {"id": "B_000988", "originalText": "कल्पिता च सा परमार्थप्रतिपत्त्युपायत्वेन संवृतिश्च सा तया योऽस्ति परमार्थेन, नास्त्यसौ न विद्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000988.mp3", "sections": []}, {"id": "B_000989", "originalText": "‘ज्ञाते द्वैतं न विद्यते’ (मा.का.१.१८) इत्युक्तम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000989.mp3", "sections": []}, {"id": "B_000990", "originalText": "यश्च परतन्त्राभिसंवृत्या परशास्त्रव्यवहारेण स्यात्पदार्थः, स परमार्थतो निरूप्यमाणो नास्त्येव। तेन युक्तमुक्तम् ‘असङ्गं तेन कीर्तितम्’ (मा.का.४.७२) इति॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000990.mp3", "sections": []}, {"id": "B_000991", "originalText": "अजः कल्पितसंवृत्या परमार्थेन नाप्यजः। परतन्त्राभिनिष्पत्त्या संवृत्या जायते तु सः॥ ७४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000991.mp3", "sections": []}, {"id": "B_000992", "originalText": "ननु शास्त्रादीनां संवृतित्वे अज इतीयमपि कल्पना संवृतिः स्यात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000992.mp3", "sections": []}, {"id": "B_000993", "originalText": "सत्यमेवम्, शास्त्रादिकल्पितसंवृत्यैव अज इत्युच्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000993.mp3", "sections": []}, {"id": "B_000994", "originalText": "परमार्थेन नाप्यजः, यस्मात् परतन्त्राभिनिष्पत्त्या परशास्त्रसिद्धिमपेक्ष्य यः अज इत्युक्तः, स संवृत्या जायते। अतः अज इतीयमपि कल्पना परमार्थविषये नैव क्रमत इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000994.mp3", "sections": []}, {"id": "B_000995", "originalText": "अभूताभिनिवेशोऽस्ति द्वयं तत्र न विद्यते। द्वयाभावं स बुद्ध्वैव निर्निमित्तो न जायते॥ ७५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000995.mp3", "sections": []}, {"id": "B_000996", "originalText": "यस्मादसद्विषयः, तस्मात् असत्यभूते द्वैते अभिनिवेशोऽस्ति केवलम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000996.mp3", "sections": []}, {"id": "B_000997", "originalText": "अभिनिवेशः आग्रहमात्रम्। द्वयं तत्र न विद्यते मिथ्याभिनिवेशमात्रं च जन्मनः कारणं यस्मात्, तस्मात् द्वयाभावं बुद्ध्वा निर्निमित्तः निवृत्तमिथ्याद्वयाभिनिवेशः यः, सः न जायते॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000997.mp3", "sections": []}, {"id": "B_000998", "originalText": "यदा न लभते हेतूनुत्तमाधममध्यमान्। तदा न जायते चित्तं हेत्वभावे फलं कुतः॥ ७६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000998.mp3", "sections": []}, {"id": "B_000999", "originalText": "जात्याश्रमविहिता आशीर्वर्जितैरनुष्ठीयमाना धर्मा देवत्वादिप्राप्तिहेतव उत्तमाः केवलाश्च।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000999.mp3", "sections": []}, {"id": "B_001000", "originalText": "धर्माः अधर्मव्यामिश्रामनुष्यत्वादिप्राप्त्यर्था मध्यमाः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001000.mp3", "sections": []}, {"id": "B_001001", "originalText": "तिर्यगादिप्राप्तिनिमित्ता अधर्मलक्षणाः प्रवृत्तिविशेषाश्चाधमाः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001001.mp3", "sections": []}, {"id": "B_001002", "originalText": "तानुत्तममध्यमाधमानविद्यापरिकल्पितान् यदा एकमेवाद्वितीयमात्मतत्त्वं सर्वकल्पनावर्जितं जानन् न लभते न पश्यति, यथा बालैर्दृश्यमानं गगने मलं विवेकी न पश्यति, तद्वत्, तदा न जायते नोत्पद्यते चित्तं देवाद्याकारैः उत्तमाधममध्यमफलरूपेण।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001002.mp3", "sections": []}, {"id": "B_001003", "originalText": "न ह्यसति हेतौ फलमुत्पद्यते बीजाद्यभाव इव सस्यादि॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001003.mp3", "sections": []}, {"id": "B_001004", "originalText": "अनिमित्तस्य चित्तस्य यानुत्पत्तिः समाद्वया। अजातस्यैव सर्वस्य चित्तदृश्यं हि तद्यतः॥ ७७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001004.mp3", "sections": []}, {"id": "B_001005", "originalText": "हेत्वभावे चित्तं नोत्पद्यत इति हि उक्तम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001005.mp3", "sections": []}, {"id": "B_001006", "originalText": "सा पुनरनुत्पत्तिश्चित्तस्य कीदृशीत्युच्यते— परमार्थदर्शनेन निरस्तधर्माधर्माख्योत्पत्तिनिमित्तस्य अनिमित्तस्य चित्तस्येति या मोक्षाख्या अनुत्पत्तिः, सा सर्वदा सर्वावस्थासु समा निर्विशेषा अद्वया च, पूर्वमपि अजातस्यैव अनुत्पन्नस्य चित्तस्य सर्वस्याद्वयस्येत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001006.mp3", "sections": []}, {"id": "B_001007", "originalText": "यस्मात्प्रागपि विज्ञानात् चित्तं दृश्यं तद्द्वयं जन्म च, तस्मादजातस्य सर्वस्य सर्वदा चित्तस्य समा अद्वयैव अनुत्पत्तिः न पुनः कदाचिद्भवति, कदाचिद्वा न भवति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001007.mp3", "sections": []}, {"id": "B_001008", "originalText": "सर्वदा एकरूपैवेत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001008.mp3", "sections": []}, {"id": "B_001009", "originalText": "बुद्ध्वानिमित्ततां सत्यां हेतुं पृथगनाप्नुवन्। वीतशोकं तथा काममभयं पदमश्नुते॥ ७८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001009.mp3", "sections": []}, {"id": "B_001010", "originalText": "यथोक्तेन न्यायेन जन्मनिमित्तस्य द्वयस्य अभावादनिमित्ततां च सत्यां परमार्थरूपां बुद्ध्वा हेतुं धर्मादिकारणं देवादियोनिप्राप्तये पृथगनाप्नुवन् अनुपाददानः त्यक्तबाह्यैषणः सन् कामशोकादिवर्जितम् अविद्यादिरहितम् अभयं पदम् अश्नुते, पुनर्न जायत इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001010.mp3", "sections": []}, {"id": "B_001011", "originalText": "अभूताभिनिवेशाद्धि सदृशे तत्प्रवर्तते। वस्त्वभावं स बुद्ध्वैव निःसङ्गं विनिवर्तते॥ ७९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001011.mp3", "sections": []}, {"id": "B_001012", "originalText": "यस्मात् अभूताभिनिवेशात् असति द्वये द्वयास्तित्वनिश्चयः अभूताभिनिवेशः, तस्मात् अविद्याव्यामोहरूपाद्धि सदृशे तदनुरूपे तत् चित्तं प्रवर्तते। तस्य द्वयस्य वस्तुनः अभावं यदा बुद्धवान्, तदा तस्मात् निःसङ्गं निरपेक्षं सत् विनिवर्तते अभूताभिनिवेशविषयात्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001012.mp3", "sections": []}, {"id": "B_001013", "originalText": "निवृत्तस्याप्रवृत्तस्य निश्चला हि तदा स्थितिः। विषयः स हि बुद्धानां तत्साम्यमजमद्वयम्॥ ८०॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001013.mp3", "sections": []}, {"id": "B_001014", "originalText": "निवृत्तस्य द्वैतविषयात्, विषयान्तरे च अप्रवृत्तस्य अभावदर्शनेन चित्तस्य निश्चला चलनवर्जिता ब्रह्मस्वरूपैव तदा स्थितिः, यैषा ब्रह्मस्वरूपा स्थितिः चित्तस्य अद्वयविज्ञानैकरसघनलक्षणा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001014.mp3", "sections": []}, {"id": "B_001015", "originalText": "स हि यस्मात् विषयः गोचरः परमार्थदर्शिनां बुद्धानाम्, तस्मात् तत्साम्यं परं निर्विशेषमजमद्वयं च॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001015.mp3", "sections": []}, {"id": "B_001016", "originalText": "अजमनिद्रमस्वप्नं प्रभातं भवति स्वयम्। सकृद्विभातो ह्येवैष धर्मो धातुस्वभावतः॥ ८१॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001016.mp3", "sections": []}, {"id": "B_001017", "originalText": "पुनरपि कीदृशश्चासौ बुद्धानां विषय इत्याह— स्वयमेव तत् प्रभातं भवति न आदित्याद्यपेक्षम्, स्वयं ज्योतिःस्वभावमित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001017.mp3", "sections": []}, {"id": "B_001018", "originalText": "सकृद्विभातः सदैव विभात इत्येतत्। एषः एवंलक्षणः आत्माख्यो धर्मः धातुस्वभावतः वस्तुस्वभावत इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001018.mp3", "sections": []}, {"id": "B_001019", "originalText": "सुखमाव्रियते नित्यं दुःखं विव्रियते सदा। यस्य कस्य च धर्मस्य ग्रहेण भगवानसौ॥ ८२॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001019.mp3", "sections": []}, {"id": "B_001020", "originalText": "एवं बहुश उच्यमानमपि परमार्थतत्त्वं कस्माल्लौकिकैर्न गृह्यत इत्युच्यते— यस्मात् यस्य कस्यचित् द्वयवस्तुनो धर्मस्य ग्रहेण ग्रहणावेशेन मिथ्याभिनिविष्टतया सुखमाव्रियते अनायासेन आच्छाद्यत इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001020.mp3", "sections": []}, {"id": "B_001021", "originalText": "द्वयोपलब्धिनिमित्तं हि तत्रावरणं न यत्नान्तरमपेक्षते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001021.mp3", "sections": []}, {"id": "B_001022", "originalText": "दुःखं च विव्रियते प्रकटीक्रियते, परमार्थज्ञानस्य दुर्लभत्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001022.mp3", "sections": []}, {"id": "B_001023", "originalText": "भगवानसौ आत्माद्वयो देव इत्यर्थः। अतो वेदान्तैराचार्यैश्च बहुश उच्यमानोऽपि नैव ज्ञातुं शक्य इत्यर्थः, ‘आश्चर्यो वक्ता कुशलोऽस्य लब्धा’ (क.१.२.७) इति श्रुतेः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001023.mp3", "sections": []}, {"id": "B_001024", "originalText": "अस्ति नास्त्यस्ति नास्तीति नास्ति नास्तीति वा पुनः। चलस्थिरोभयाभावैरावृणोत्येव बालिशः॥ ८३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001024.mp3", "sections": []}, {"id": "B_001025", "originalText": "अस्ति नास्तीत्यादि सूक्ष्मविषया अपि पण्डितानां ग्रहाः भगवतः परमात्मन आवरणा एव, किमुत मूढजनानां बुद्धिलक्षणा इत्येवमर्थं प्रदर्शयन्नाह— अस्तीति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001025.mp3", "sections": []}, {"id": "B_001026", "originalText": "अस्त्यात्मेति कश्चिद्वादी प्रतिपद्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001026.mp3", "sections": []}, {"id": "B_001027", "originalText": "नास्तीत्यपरो वैनाशिकः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001027.mp3", "sections": []}, {"id": "B_001028", "originalText": "अस्ति नास्तीत्यपरोऽर्धवैनाशिकः सदसद्वादी दिग्वासाः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001028.mp3", "sections": []}, {"id": "B_001029", "originalText": "नास्ति नास्तीत्यत्यन्तशून्यवादी।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001029.mp3", "sections": []}, {"id": "B_001030", "originalText": "तत्रास्तिभावश्चलः, घटाद्यनित्यविलक्षणत्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001030.mp3", "sections": []}, {"id": "B_001031", "originalText": "नास्तिभावः स्थिरः, सदाविशेषत्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001031.mp3", "sections": []}, {"id": "B_001032", "originalText": "उभयं चलस्थिरविषयत्वात् सदसद्भावः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001032.mp3", "sections": []}, {"id": "B_001033", "originalText": "अभावोऽत्यन्ताभावः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001033.mp3", "sections": []}, {"id": "B_001034", "originalText": "प्रकारचतुष्टयस्यापि तैरेतैश्चलस्थिरोभयाभावैः सदसदादिवादी सर्वोऽपि भगवन्तमावृणोत्येव बालिशोऽविवेकी। यद्यपि पण्डितो बालिश एव परमार्थतत्त्वानवबोधात्, किमु स्वभावमूढो जन इत्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001034.mp3", "sections": []}, {"id": "B_001035", "originalText": "कोट्यश्चतस्र एतास्तु ग्रहैर्यासां सदावृतः। भगवानाभिरस्पृष्टो येन दृष्टः स सर्वदृक्॥ ८४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001035.mp3", "sections": []}, {"id": "B_001036", "originalText": "कीदृक्पुनः परमार्थतत्त्वम्, यदवबोधादबालिशः पण्डितो भवतीत्याह— कोट्यः प्रावादुकशास्त्रनिर्णयान्ताः एताः उक्ता अस्ति नास्तीत्याद्याः चतस्रः, यासां कोटीनां ग्रहैः ग्रहणैः उपलब्धिनिश्चयैः सदा सर्वदा आवृतः आच्छादितः तेषामेव प्रावादुकानां यः, स भगवान् आभिः अस्ति नास्तीत्यादिकोटिभिः चतसृभिरपि अस्पृष्टः अस्त्यादिविकल्पनावर्जित इत्येतत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001036.mp3", "sections": []}, {"id": "B_001037", "originalText": "येन मुनिना दृष्टो ज्ञातः वेदान्तेष्वौपनिषदः पुरुषः, स सर्वदृक् सर्वज्ञः, परमार्थपण्डित इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001037.mp3", "sections": []}, {"id": "B_001038", "originalText": "प्राप्य सर्वज्ञतां कृत्स्नां ब्राह्मण्यं पदमद्वयम्। अनापन्नादिमध्यान्तं किमतः परमीहते॥ ८५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001038.mp3", "sections": []}, {"id": "B_001039", "originalText": "प्राप्य एतां यथोक्तां कृत्स्नां समस्तां सर्वज्ञतां ब्राह्मण्यं पदम् ‘स ब्राह्मणः’ (बृ.३.८.१०) ‘एष नित्यो महिमा ब्राह्मणस्य’ (बृ.४.४.२३) इति श्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001039.mp3", "sections": []}, {"id": "B_001040", "originalText": "अनापन्नादिमध्यान्तम् आदिमध्यान्ताः उत्पत्तिस्थितिलयाः अनापन्ना अप्राप्ता यस्य अद्वयस्य पदस्य न विद्यन्ते, तत् अनापन्नादिमध्यान्तं ब्राह्मण्यं पदम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001040.mp3", "sections": []}, {"id": "B_001041", "originalText": "तदेव प्राप्य लब्ध्वा किमतः परमस्मादात्मलाभादूर्ध्वम् ईहते चेष्टते, निष्प्रयोजनमित्यर्थः। ‘नैव तस्य कृतेनार्थः’ (भ.गी.३.१८) इत्यादिस्मृतेः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001041.mp3", "sections": []}, {"id": "B_001042", "originalText": "विप्राणां विनयो ह्येष शमः प्राकृत उच्यते। दमः प्रकृतिदान्तत्वादेवं विद्वाञ्शमं व्रजेत्॥ ८६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001042.mp3", "sections": []}, {"id": "B_001043", "originalText": "विप्राणां ब्राह्मणानां विनयः विनीतत्वं स्वाभाविकं यदेतदात्मस्वरूपेणावस्थानम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001043.mp3", "sections": []}, {"id": "B_001044", "originalText": "एष विनयः शमोऽप्येष एव प्राकृतः स्वाभाविकः अकृतकः उच्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001044.mp3", "sections": []}, {"id": "B_001045", "originalText": "दमोऽप्येष एव प्रकृतिदान्तत्वात् स्वभावत एव चोपशान्तरूपत्वाद्ब्रह्मणः। एवं यथोक्तं स्वभावोपशान्तं ब्रह्म विद्वान् शमम् उपशान्तिं स्वाभाविकीं ब्रह्मस्वरूपां व्रजेत् ब्रह्मस्वरूपेणावतिष्ठत इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001045.mp3", "sections": []}, {"id": "B_001046", "originalText": "सवस्तु सोपलम्भं च द्वयं लौकिकमिष्यते। अवस्तु सोपलम्भं च शुद्धं लौकिकमिष्यते॥ ८७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001046.mp3", "sections": []}, {"id": "B_001047", "originalText": "एवमन्योन्यविरुद्धत्वात् संसारकारणरागद्वेषदोषास्पदानि प्रावादुकानां दर्शनानि।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001047.mp3", "sections": []}, {"id": "B_001048", "originalText": "अतो मिथ्यादर्शनानि तानीति तद्युक्तिभिरेव दर्शयित्वा चतुष्कोटिवर्जितत्वात् रागादिदोषानास्पदं स्वभावशान्तमद्वैतदर्शनमेव सम्यग्दर्शनमित्युपसंहृतम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001048.mp3", "sections": []}, {"id": "B_001049", "originalText": "अथेदानीं स्वप्रक्रियाप्रदर्शनार्थ आरम्भः— सवस्तु संवृतिसता वस्तुना सह वर्तत इति सवस्तु, तथा च उपलब्धिरुपलम्भः, तेन सह वर्तत इति सोपलम्भं च शास्त्रादिसर्वव्यवहारास्पदं ग्राह्यग्रहणलक्षणं द्वयं लोकादनपेतं लौकिकं जागरितमित्येतत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001049.mp3", "sections": []}, {"id": "B_001050", "originalText": "एवंलक्षणं जागरितमिष्यते वेदान्तेषु।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001050.mp3", "sections": []}, {"id": "B_001051", "originalText": "अवस्तु संवृतेरप्यभावात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001051.mp3", "sections": []}, {"id": "B_001052", "originalText": "सोपलम्भं वस्तुवदुपलम्भनमुपलम्भः असत्यपि वस्तुनि, तेन सह वर्तत इति सोपलम्भं च। शुद्धं केवलं प्रविभक्तं जागरितात्स्थूलाल्लौकिकं सर्वप्राणिसाधारणत्वात् इष्यते स्वप्न इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001052.mp3", "sections": []}, {"id": "B_001053", "originalText": "अवस्त्वनुपलम्भं च लोकोत्तरमिति स्मृतम्। ज्ञानं ज्ञेयं च विज्ञेयं सदा बुद्धैः प्रकीर्तितम्॥ ८८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001053.mp3", "sections": []}, {"id": "B_001054", "originalText": "अवस्त्वनुपलम्भं च ग्राह्यग्रहणवर्जितमित्येतत्, लोकोत्तरम्, अत एव लोकातीतम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001054.mp3", "sections": []}, {"id": "B_001055", "originalText": "ग्राह्यग्रहणविषयो हि लोकः, तदभावात् सर्वप्रवृत्तिबीजं सुषुप्तमित्येतत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001055.mp3", "sections": []}, {"id": "B_001056", "originalText": "एवं स्मृतं सोपायं परमार्थतत्त्वं लौकिकं शुद्धलौकिकं लोकोत्तरं च क्रमेण येन ज्ञानेन ज्ञायते, तत् ज्ञानं ज्ञेयम् एतान्येव त्रीणि, एतद्व्यतिरेकेण ज्ञेयानुपपत्तेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001056.mp3", "sections": []}, {"id": "B_001057", "originalText": "सर्वप्रावादुककल्पितवस्तुनोऽत्रैवान्तर्भावात्, विज्ञेयं यत्परमार्थसत्यं तुर्याख्यमद्वयमजमात्मतत्त्वमित्यर्थः, सदा सर्वदैव, तल्लौकिकादि विज्ञेयान्तं बुद्धैः परमार्थदर्शिभिर्ब्रह्मविद्भिः प्रकीर्तितम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001057.mp3", "sections": []}, {"id": "B_001058", "originalText": "ज्ञाने च त्रिविधे ज्ञेये क्रमेण विदिते स्वयम्। सर्वज्ञता हि सर्वत्र भवतीह महाधियः॥ ८९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001058.mp3", "sections": []}, {"id": "B_001059", "originalText": "ज्ञाने च लौकिकादिविषये ज्ञेये च लौकिकादौ त्रिविधे, पूर्वं लौकिकं स्थूलम्, तदभावेन पश्चाच्छुद्धं लौकिकम्, तदभावेन लोकोत्तरमित्येवं क्रमेण स्थानत्रयाभावेन परमार्थसत्ये तुर्ये अद्वये अजे अभये विदिते, स्वयमेव आत्मस्वरूपमेव सर्वज्ञता सर्वश्चासौ ज्ञश्च सर्वज्ञः, तद्भावः सर्वज्ञता इह अस्मिन् लोके भवति महाधियः महाबुद्धेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001059.mp3", "sections": []}, {"id": "B_001060", "originalText": "सर्वलोकातिशयवस्तुविषयबुद्धित्वादेवंविदः सर्वत्र सर्वदा भवति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001060.mp3", "sections": []}, {"id": "B_001061", "originalText": "सकृद्विदिते स्वरूपे व्यभिचाराभावादित्यर्थः। न हि परमार्थविदो ज्ञानिनः ज्ञानोद्भवाभिभवौ स्तः, यथा अन्येषां प्रावादुकानाम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001061.mp3", "sections": []}, {"id": "B_001062", "originalText": "हेयज्ञेयाप्यपाक्यानि विज्ञेयान्यग्रयाणतः। तेषामन्यत्र विज्ञेयादुपलम्भस्त्रिषु स्मृतः॥ ९०॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001062.mp3", "sections": []}, {"id": "B_001063", "originalText": "लौकिकादीनां क्रमेण ज्ञेयत्वेन निर्देशादस्तित्वाशङ्का परमार्थतो मा भूदित्याह— हेयानि च लौकिकादीनि त्रीणि जागरितस्वप्नसुषुप्तानि आत्मन्यसत्त्वेन रज्ज्वां सर्पवद्धातव्यानीत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001063.mp3", "sections": []}, {"id": "B_001064", "originalText": "ज्ञेयमिह चतुष्कोटिवर्जितं परमार्थतत्त्वम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001064.mp3", "sections": []}, {"id": "B_001065", "originalText": "आप्यानि आप्तव्यानि त्यक्तबाह्यैषणात्रयेण भिक्षुणा पाण्डित्यबाल्यमौनाख्यानि साधनानि।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001065.mp3", "sections": []}, {"id": "B_001066", "originalText": "पाक्यानि रागद्वेषमोहादयो दोषाः कषायाख्यानि पक्तव्यानि।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001066.mp3", "sections": []}, {"id": "B_001067", "originalText": "सर्वाण्येतानि हेयज्ञेयाप्यपाक्यानि विज्ञेयानि भिक्षुणा उपायत्वेनेत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001067.mp3", "sections": []}, {"id": "B_001068", "originalText": "अग्रयाणतः प्रथमतः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001068.mp3", "sections": []}, {"id": "B_001069", "originalText": "तेषां हेयादीनामन्यत्र विज्ञेयात्परमार्थसत्यं विज्ञेयं ब्रह्मैकं वर्जयित्वा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001069.mp3", "sections": []}, {"id": "B_001070", "originalText": "उपलम्भनमुपलम्भः अविद्याकल्पनामात्रम्। हेयाप्यपाक्येषु त्रिष्वपि स्मृतो ब्रह्मविद्भिः न परमार्थसत्यता त्रयाणामित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001070.mp3", "sections": []}, {"id": "B_001071", "originalText": "प्रकृत्याकाशवज्ज्ञेयाः सर्वे धर्मा अनादयः। विद्यते न हि नानात्वं तेषां क्वचन किञ्चन॥ ९१॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001071.mp3", "sections": []}, {"id": "B_001072", "originalText": "परमार्थतस्तु प्रकृत्या स्वभावतः आकाशवत् आकाशतुल्याः सूक्ष्मनिरञ्जनसर्वगतत्वैः सर्वे धर्मा आत्मानो ज्ञेया मुमुक्षुभिः अनादयः नित्याः। बहुवचनकृतभेदाशङ्कां निराकुर्वन्नाह— क्वचन क्वचिदपि किञ्चन किञ्चित् अणुमात्रमपि तेषां न विद्यते नानात्वमिति॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001072.mp3", "sections": []}, {"id": "B_001073", "originalText": "आदिबुद्धाः प्रकृत्यैव सर्वे धर्माः सुनिश्चिताः। यस्यैवं भवति क्षान्तिः सोऽमृतत्वाय कल्पते॥ ९२॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001073.mp3", "sections": []}, {"id": "B_001074", "originalText": "ज्ञेयतापि धर्माणां संवृत्यैव, न परमार्थत इत्याह— यस्मात् आदौ बुद्धाः आदिबुद्धाः प्रकृत्यैव स्वभावत एव यथा नित्यप्रकाशस्वरूपः सविता, एवं नित्यबोधस्वरूपा इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001074.mp3", "sections": []}, {"id": "B_001075", "originalText": "सर्वे धर्माः सर्व आत्मानः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001075.mp3", "sections": []}, {"id": "B_001076", "originalText": "न च तेषां निश्चयः कर्तव्यः नित्यनिश्चितस्वरूपा इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001076.mp3", "sections": []}, {"id": "B_001077", "originalText": "न सन्दिह्यमानस्वरूपा एवं नैवं वेति यस्य मुमुक्षोः एवं यथोक्तप्रकारेण सर्वदा बोधनिश्चयनिरपेक्षता आत्मार्थं परार्थं वा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001077.mp3", "sections": []}, {"id": "B_001078", "originalText": "यथा सविता नित्यं प्रकाशान्तरनिरपेक्षः स्वार्थं परार्थं वेत्येवं भवति क्षान्तिः बोधकर्तव्यतानिरपेक्षता सर्वदा स्वात्मनि, सः अमृतत्वाय अमृतभावाय कल्पते, मोक्षाय समर्थो भवतीत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001078.mp3", "sections": []}, {"id": "B_001079", "originalText": "आदिशान्ता ह्यनुत्पन्नाः प्रकृत्यैव सुनिर्वृताः। सर्वे धर्माः समाभिन्ना अजं साम्यं विशारदम्॥ ९३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001079.mp3", "sections": []}, {"id": "B_001080", "originalText": "तथा नापि शान्तिकर्तव्यता आत्मनीत्याह— यस्मात् आदिशान्ताः नित्यमेव शान्ताः अनुत्पन्ना अजाश्च प्रकृत्यैव सुनिर्वृताः सुष्ठूपरतस्वभावाः नित्यमुक्तस्वभावा इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001080.mp3", "sections": []}, {"id": "B_001081", "originalText": "सर्वे धर्माः समाश्च अभिन्नाश्च समाभिन्नाः अजं साम्यं विशारदं विशुद्धमात्मतत्त्वं यस्मात्, तस्मात् शान्तिर्मोक्षो वा नास्ति कर्तव्य इत्यर्थः। न हि नित्यैकस्वभावस्य कृतं किञ्चिदर्थवत्स्यात्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001081.mp3", "sections": []}, {"id": "B_001082", "originalText": "वैशारद्यं तु वै नास्ति भेदे विचरतां सदा। भेदनिम्नाः पृथग्वादास्तस्मात्ते कृपणाः स्मृताः॥ ९४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001082.mp3", "sections": []}, {"id": "B_001083", "originalText": "ये यथोक्तं परमार्थतत्त्वं प्रतिपन्नाः, ते एव अकृपणा लोके, कृपणास्त्वन्ये इत्याह— यस्मात् भेदनिम्नाः भेदानुयायिनः संसारानुगा इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001083.mp3", "sections": []}, {"id": "B_001084", "originalText": "के? पृथग्वादाः पृथक् नाना वस्तु इत्येवं वदनं येषां ते पृथग्वादाः द्वैतिन इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001084.mp3", "sections": []}, {"id": "B_001085", "originalText": "तस्मात्ते कृपणाः क्षुद्राः स्मृताः, यस्मात् वैशारद्यं विशुद्धिः तन्नास्ति तेषां भेदे विचरतां द्वैतमार्गे अविद्यापरिकल्पिते सर्वदा वर्तमानानामित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001085.mp3", "sections": []}, {"id": "B_001086", "originalText": "अतो युक्तमेव तेषां कार्पण्यमित्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001086.mp3", "sections": []}, {"id": "B_001087", "originalText": "अजे साम्ये तु ये केचिद्भविष्यन्ति सुनिश्चिताः। ते हि लोके महाज्ञानास्तच्च लोको न गाहते॥ ९५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001087.mp3", "sections": []}, {"id": "B_001088", "originalText": "यदिदं परमार्थतत्त्वम्, अमहात्मभिरपण्डितैर्वेदान्तबहिःष्ठैः क्षुद्रैरल्पप्रज्ञैरनवगाह्यमित्याह— अजे साम्ये परमार्थतत्त्वे एवमेवेति ये केचित् स्त्र्यादयोऽपि सुनिश्चिता भविष्यन्ति चेत्, त एव हि लोके महाज्ञानाः निरतिशयतत्त्वविषयज्ञाना इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001088.mp3", "sections": []}, {"id": "B_001089", "originalText": "तच्च तेषां वर्त्म तेषां विदितं परमार्थतत्त्वं सामान्यबुद्धिरन्यो लोको न गाहते नावतरति न विषयीकरोतीत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001089.mp3", "sections": []}, {"id": "B_001090", "originalText": "‘सर्वभूतात्मभूतस्य समैकार्थं प्रपश्यतः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001090.mp3", "sections": []}, {"id": "B_001091", "originalText": "देवा अपि मार्गे मुह्यन्त्यपदस्य पदैषिणः। शकुनीनामिवाकाशे गतिर्नैवोपलभ्यते’ इत्यादिस्मरणात्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001091.mp3", "sections": []}, {"id": "B_001092", "originalText": "अजेष्वजमसङ्क्रान्तं धर्मेषु ज्ञानमिष्यते। यतो न क्रमते ज्ञानमसङ्गं तेन कीर्तितम्॥ ९६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001092.mp3", "sections": []}, {"id": "B_001093", "originalText": "कथं महाज्ञानत्वमित्याह— अजेषु अनुत्पन्नेषु अचलेषु धर्मेषु आत्मसु अजमचलं च ज्ञानमिष्यते सवितरीव औष्ण्यं प्रकाशश्च यतः, तस्मात् असङ्क्रान्तम् अर्थान्तरे ज्ञानमजमिष्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001093.mp3", "sections": []}, {"id": "B_001094", "originalText": "यस्मान्न क्रमते अर्थान्तरे ज्ञानम्, तेन कारणेन असङ्गं तत् कीर्तितम् आकाशकल्पमित्युक्तम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001094.mp3", "sections": []}, {"id": "B_001095", "originalText": "अणुमात्रेऽपि वैधर्म्ये जायमानेऽविपश्चितः। असङ्गता सदा नास्ति किमुतावरणच्युतिः॥ ९७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001095.mp3", "sections": []}, {"id": "B_001096", "originalText": "इतोऽन्येषां वादिनाम् अणुमात्रे अल्पेऽपि वैधर्म्ये वस्तुनि बहिरन्तर्वा जायमाने उत्पद्यमाने अविपश्चितः अविवेकिनः असङ्गता असङ्गत्वं सदा नास्ति, किमुत वक्तव्यम् आवरणच्युतिः बन्धनाशो नास्तीति॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001096.mp3", "sections": []}, {"id": "B_001097", "originalText": "अलब्धावरणाः सर्वे धर्माः प्रकृतिनिर्मलाः। आदौ बुद्धास्तथा मुक्ता बुध्यन्त इति नायकाः॥ ९८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001097.mp3", "sections": []}, {"id": "B_001098", "originalText": "तेषामावरणच्युतिर्नास्तीति ब्रुवतां स्वसिद्धान्ते अभ्युपगतं तर्हि धर्माणामावरणम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001098.mp3", "sections": []}, {"id": "B_001099", "originalText": "नेत्युच्यते— अलब्धावरणाः अलब्धमप्राप्तमावरणम् अविद्यादिबन्धनं येषां ते धर्माः अलब्धावरणाः बन्धनरहिता इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001099.mp3", "sections": []}, {"id": "B_001100", "originalText": "प्रकृतिनिर्मलाः स्वभावशुद्धाः आदौ बुद्धाः तथा मुक्ताः, यस्मात् नित्यशुद्धबुद्धमुक्तस्वभावाः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001100.mp3", "sections": []}, {"id": "B_001101", "originalText": "यद्येवं कथं तर्हि बुध्यन्त इत्युच्यते— नायकाः स्वामिनः समर्थाः बोद्धुं बोधशक्तिमत्स्वभावा इत्यर्थः। यथा नित्यप्रकाशस्वरूपोऽपि सन् सविता प्रकाशत इत्युच्यते, यथा वा नित्यनिवृत्तगतयोऽपि नित्यमेव शैलास्तिष्ठन्तीत्युच्यते, तद्वत्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001101.mp3", "sections": []}, {"id": "B_001102", "originalText": "क्रमते न हि बुद्धस्य ज्ञानं धर्मेषु तायिनः। सर्वे धर्मास्तथा ज्ञानं नैतद्बुद्धेन भाषितम्॥ ९९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001102.mp3", "sections": []}, {"id": "B_001103", "originalText": "यस्मात् न हि क्रमते बुद्धस्य परमार्थदर्शिनो ज्ञानं विषयान्तरेषु धर्मेषु धर्मसंस्थं सवितरीव प्रभा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001103.mp3", "sections": []}, {"id": "B_001104", "originalText": "तायिनः तायोऽस्यास्तीति तायी, सन्तानवतो निरन्तरस्य आकाशकल्पस्येत्यर्थः, पूजावतो वा प्रज्ञावतो वा सर्वे धर्मा आत्मानोऽपि तथा ज्ञानवदेव आकाशकल्पत्वान्न क्रमन्ते क्वचिदप्यर्थान्तर इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001104.mp3", "sections": []}, {"id": "B_001105", "originalText": "यदादावुपन्यस्तम् ‘ज्ञानेनाकाशकल्पेन’ (मा.का.४.१) इत्यादि, तदिदमाकाशकल्पस्य तायिनो बुद्धस्य तदनन्यत्वादाकाशकल्पं ज्ञानं न क्रमते क्वचिदप्यर्थान्तरे।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001105.mp3", "sections": []}, {"id": "B_001106", "originalText": "तथा धर्मा इति आकाशमिव अचलमविक्रियं निरवयवं नित्यमद्वितीयमसङ्गमदृश्यमग्राह्यमशनायाद्यतीतं ब्रह्मात्मतत्त्वम्, ‘न हि द्रष्टुर्दृष्टेर्विपरिलोपो विद्यते’ (बृ.४.३.२३) इति श्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001106.mp3", "sections": []}, {"id": "B_001107", "originalText": "ज्ञानज्ञेयज्ञातृभेदरहितं परमार्थतत्त्वमद्वयमेतन्न बुद्धेन भाषितम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001107.mp3", "sections": []}, {"id": "B_001108", "originalText": "यद्यपि बाह्यार्थनिराकरणं ज्ञानमात्रकल्पना च अद्वयवस्तुसामीप्यमुक्तम्। इदं तु परमार्थतत्त्वमद्वैतं वेदान्तेष्वेव विज्ञेयमित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001108.mp3", "sections": []}, {"id": "B_001109", "originalText": "दुर्दर्शमतिगम्भीरमजं साम्यं विशारदम्। बुद्ध्वा पदमनानात्वं नमस्कुर्मो यथाबलम्॥ १००॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001109.mp3", "sections": []}, {"id": "B_001110", "originalText": "शास्त्रसमाप्तौ परमार्थतत्त्वस्तुत्यर्थं नमस्कार उच्यते— दुर्दर्शं दुःखेन दर्शनमस्येति दुर्दर्शम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001110.mp3", "sections": []}, {"id": "B_001111", "originalText": "अस्ति नास्तीति चतुष्कोटिवर्जितत्वाद्दुर्विज्ञेयमित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001111.mp3", "sections": []}, {"id": "B_001112", "originalText": "अत एव अतिगम्भीरं दुष्प्रवेशं महासमुद्रवदकृतप्रज्ञैः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001112.mp3", "sections": []}, {"id": "B_001113", "originalText": "अजं साम्यं विशारदम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001113.mp3", "sections": []}, {"id": "B_001114", "originalText": "ईदृक् पदम् अनानात्वं नानात्ववर्जितं बुद्ध्वा अवगम्य तद्भूताः सन्तः नमस्कुर्मः तस्मै पदाय। अव्यवहार्यमपि व्यवहारगोचरतामापाद्य यथाबलं यथाशक्तीत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001114.mp3", "sections": []}, {"id": "B_001115", "originalText": "अजमपि जनियोगं प्रापदैश्वर्ययोगा—\nदगति च गतिमत्तां प्रापदेकं ह्यनेकम्। विविधविषयधर्मग्राहि मुग्धेक्षणानां\nप्रणतभयविहन्तृ ब्रह्म यत्तन्नतोऽस्मि॥ १॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001115.mp3", "sections": []}, {"id": "B_001116", "originalText": "प्रज्ञावैशाखवेधक्षुभितजलनिधेर्वेदनाम्नोऽन्तरस्थं\nभूतान्यालोक्य मग्नान्यविरतजननग्राहघोरे समुद्रे। कारुण्यादुद्दधारामृतमिदममरैर्दुर्लभं भूतहेतो—\nर्यस्तं पूज्याभिपूज्यं परमगुरुममुं पादपातैर्नतोऽस्मि॥ २॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001116.mp3", "sections": []}, {"id": "B_001117", "originalText": "यत्प्रज्ञालोकभासा प्रतिहतिमगमत्स्वान्तमोहान्धकारो\nमज्जोन्मज्जच्च घोरे ह्यसकृदुपजनोदन्वति त्रासने मे। यत्पादावाश्रितानां श्रुतिशमविनयप्राप्तिरग्न्या ह्यमोघा\nतत्पादौ पावनीयौ भवभयविनुदौ सर्वभावैर्नमस्ये॥ ३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001117.mp3", "sections": []}, {"id": "B_001118", "originalText": "इति अलातशान्तिप्रकरणम् सम्पूर्णम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_001118.mp3", "sections": []}];
        const contentDiv = document.getElementById('content');
        const audioPlayer = document.getElementById('audio-player');
        const sidebar = document.getElementById('mySidebar');
        const overlay = document.getElementById('myOverlay');
        
        function toggleNav() {
            if (sidebar.style.width === "300px") {
                sidebar.style.width = "0";
                overlay.style.display = "none";
            } else {
                sidebar.style.width = "300px";
                overlay.style.display = "block";
            }
        }

        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            let val = parseInt(this.value);
            let rate = 1.0;
            if (val < 0) rate = 1.0 + (val / 100);
            else rate = 1.0 + (val / 50); 
            if (rate < 0.2) rate = 0.2;
            audioPlayer.playbackRate = rate;
            speedDisplay.innerText = rate.toFixed(1);
        };
        speedSlider.oninput();
        
        let currentIndex = -1;

        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => playAudio(index);
            contentDiv.appendChild(div);
            
            if (item.sections && item.sections.length > 0) {
                item.sections.forEach(secTitle => {
                    const link = document.createElement('a');
                    link.href = "#";
                    link.innerText = secTitle;
                    link.onclick = (e) => {
                        e.preventDefault();
                        toggleNav();
                        playAudio(index);
                    };
                    sidebar.appendChild(link);
                });
            }
        });

        function playAudio(index) {
            if (index < 0 || index >= manifest.length) return;
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            const item = manifest[currentIndex];
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            if (item.audioFile) {
                audioPlayer.src = item.audioFile;
                let val = parseInt(document.getElementById('speed-slider').value);
                let rate = val < 0 ? 1.0 + (val / 100) : 1.0 + (val / 50);
                if (rate < 0.2) rate = 0.2;
                audioPlayer.playbackRate = rate;
                audioPlayer.play().catch(e => console.log("Audio play error:", e));
            } else {
                setTimeout(() => playAudio(index + 1), 2000);
            }
        }

        audioPlayer.onended = () => playAudio(currentIndex + 1);
    </script>
</body>
</html>
