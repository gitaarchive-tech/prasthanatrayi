3", "originalText": "वितथस्य भावो वैतथ्यम्, असत्यत्वमित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000273.mp3", "sections": []}, {"id": "B_000274", "originalText": "कस्य? सर्वेषां बाह्याध्यात्मिकानां भावानां पदार्थानां स्वप्ने उपलभ्यमानानाम्, आहुः कथयन्ति मनीषिणः प्रमाणकुशलाः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000274.mp3", "sections": []}, {"id": "B_000275", "originalText": "वैतथ्ये हेतुमाह— अन्तःस्थानात्, अन्तः शरीरस्य मध्ये स्थानं येषाम्, तत्र हि भावा उपलभ्यन्ते पर्वतहस्त्यादयः, न बहिः शरीरात्, तस्मात् ते वितथा भवितुमर्हन्ति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000275.mp3", "sections": []}, {"id": "B_000276", "originalText": "ननु अपवरकाद्यन्तरुपलभ्यमानैर्घटादिभिरनैकान्तिको हेतुरित्याशङ्क्याह— संवृतत्वेन हेतुनेति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000276.mp3", "sections": []}, {"id": "B_000277", "originalText": "अन्तः संवृतस्थानादित्यर्थः। न ह्यन्तः संवृते देहान्तर्नाडीषु पर्वतहस्त्यादीनां सम्भवोऽस्ति, न हि देहे पर्वतोऽस्ति॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000277.mp3", "sections": []}, {"id": "B_000278", "originalText": "अदीर्घत्वाच्च कालस्य गत्वा देहान्न पश्यति। प्रतिबुद्धश्च वै सर्वस्तस्मिन्देशे न विद्यते॥ २॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000278.mp3", "sections": []}, {"id": "B_000279", "originalText": "स्वप्नदृश्यानां भावानामन्तः संवृतस्थानमित्येतदसिद्धम्, यस्मात्प्राच्येषु सुप्त उदक्षु स्वप्नान्पश्यन्निव दृश्यत इत्येतदाशङ्क्याह— न देहाद्बहिर्देशान्तरं गत्वा स्वप्नान्पश्यति, यस्मात्सुप्तमात्र एव देहदेशाद्योजनशतान्तरिते मासमात्रप्राप्ये देशे स्वप्नान्पश्यन्निव दृश्यते, न च तद्देशप्राप्तेरागमनस्य च दीर्घः कालोऽस्ति, अतः अदीर्घत्वाच्च कालस्य न स्वप्नदृग्देशान्तरं गच्छति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000279.mp3", "sections": []}, {"id": "B_000280", "originalText": "किञ्च, प्रतिबुद्धश्च वै सर्वः स्वप्नदृक् स्वप्नदर्शनदेशे न विद्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000280.mp3", "sections": []}, {"id": "B_000281", "originalText": "यदि च स्वप्ने देशान्तरं गच्छेत्, यस्मिन्देशे स्वप्नान्पश्येत्, तत्रैव प्रतिबुध्येत।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000281.mp3", "sections": []}, {"id": "B_000282", "originalText": "न चैतदस्ति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000282.mp3", "sections": []}, {"id": "B_000283", "originalText": "रात्रौ सुप्तः अहनीव भावान्पश्यति, बहुभिः सङ्गतो भवति, यैश्च सङ्गतः स तैर्गृह्येत, न च गृह्यते, गृहीतश्चेत्त्वामद्य तत्रोपलब्धवन्तो वयमिति ब्रूयुः, न चैतदस्ति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000283.mp3", "sections": []}, {"id": "B_000284", "originalText": "तस्मान्न देशान्तरं गच्छति स्वप्ने॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000284.mp3", "sections": []}, {"id": "B_000285", "originalText": "अभावश्च रथादीनां श्रूयते न्यायपूर्वकम्। वैतथ्यं तेन वै प्राप्तं स्वप्न आहुः प्रकाशितम्॥ ३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000285.mp3", "sections": []}, {"id": "B_000286", "originalText": "इतश्च स्वप्नदृश्या भावा वितथाः, यतः अभावश्च रथादीनां स्वप्नदृश्यानां श्रूयते, न्यायपूर्वकं युक्तितः श्रुतौ ‘न तत्र रथाः’ (बृ.४.३.१०) इत्यत्र। तेन अन्तःस्थानसंवृतत्वादिहेतुना प्राप्तं वैतथ्यं तदनुवादिन्या श्रुत्या स्वप्ने स्वयञ्ज्योतिष्ट्वप्रतिपादनपरया प्रकाशितमाहुः ब्रह्मविदः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000286.mp3", "sections": []}, {"id": "B_000287", "originalText": "अन्तःस्थानात्तु भेदानां तस्माज्जागरिते स्मृतम्। यथा तत्र तथा स्वप्ने संवृतत्वेन भिद्यते॥ ४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000287.mp3", "sections": []}, {"id": "B_000288", "originalText": "जाग्रद्दृश्यानां भावानां वैतथ्यमिति प्रतिज्ञा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000288.mp3", "sections": []}, {"id": "B_000289", "originalText": "दृश्यत्वादिति हेतुः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000289.mp3", "sections": []}, {"id": "B_000290", "originalText": "स्वप्नदृश्यभाववदिति दृष्टान्तः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000290.mp3", "sections": []}, {"id": "B_000291", "originalText": "यथा तत्र स्वप्ने दृश्यानां भावानां वैतथ्यम्, तथा जागरितेऽपि दृश्यत्वमविशिष्टमिति हेतूपनयः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000291.mp3", "sections": []}, {"id": "B_000292", "originalText": "तस्माज्जागरितेऽपि वैतथ्यं स्मृतमिति निगमनम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000292.mp3", "sections": []}, {"id": "B_000293", "originalText": "अन्तःस्थानात्संवृतत्वेन च स्वप्नदृश्यानां भावानां जाग्रद्दृश्येभ्यो भेदः। दृश्यत्वमसत्यत्वं चाविशिष्टमुभयत्र॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000293.mp3", "sections": []}, {"id": "B_000294", "originalText": "स्वप्नजागरिते स्थाने ह्येकमाहुर्मनीषिणः। भेदानां हि समत्वेन प्रसिद्धेनैव हेतुना॥ ५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000294.mp3", "sections": []}, {"id": "B_000295", "originalText": "प्रसिद्धेनैव भेदानां ग्राह्यत्वेन हेतुना समत्वेन स्वप्नजागरितस्थानयोरेकत्वमाहुर्विवेकिन इति पूर्वप्रमाणसिद्धस्यैव फलम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000295.mp3", "sections": []}, {"id": "B_000296", "originalText": "आदावन्ते च यन्नास्ति वर्तमानेऽपि तत्तथा। वितथैः सदृशाः सन्तोऽवितथा इव लक्षिताः॥ ६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000296.mp3", "sections": []}, {"id": "B_000297", "originalText": "इतश्च वैतथ्यं जाग्रद्दृश्यानां भेदानाम् आद्यन्तयोरभावात्, यदादावन्ते च नास्ति वस्तु मृगतृष्णिकादि, तन्मध्येऽपि नास्तीति निश्चितं लोके, तथेमे जाग्रद्दृश्या भेदाः आद्यन्तयोरभावात् वितथैरेव मृगतृष्णिकादिभिः सदृशत्वाद्वितथा एव, तथापि अवितथा इव लक्षिता मूढैरनात्मविद्भिः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000297.mp3", "sections": []}, {"id": "B_000298", "originalText": "सप्रयोजनता तेषां स्वप्ने विप्रतिपद्यते। तस्मादाद्यन्तवत्त्वेन मिथ्यैव खलु ते स्मृताः॥ ७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000298.mp3", "sections": []}, {"id": "B_000299", "originalText": "स्वप्नदृश्यवज्जागरितदृश्यानामप्यसत्त्वमिति यदुक्तम् तदयुक्तम्, यस्माज्जाग्रद्दृश्या अन्नपानवाहनादयः क्षुत्पिपासादिनिवृत्तिं कुर्वन्तो गमनागमनादि कार्यं च सप्रयोजना दृष्टाः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000299.mp3", "sections": []}, {"id": "B_000300", "originalText": "न तु स्वप्नदृश्यानां तदस्ति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000300.mp3", "sections": []}, {"id": "B_000301", "originalText": "तस्मात्स्वप्नदृश्यवज्जाग्रद्दृश्यानामसत्त्वं मनोरथमात्रमिति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000301.mp3", "sections": []}, {"id": "B_000302", "originalText": "तन्न।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000302.mp3", "sections": []}, {"id": "B_000303", "originalText": "कस्मात्? यस्माद्या सप्रयोजनता दृष्टा अन्नपानादीनाम्, सा स्वप्ने विप्रतिपद्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000303.mp3", "sections": []}, {"id": "B_000304", "originalText": "जागरिते हि भुक्त्वा पीत्वा च तृप्तो विनिवर्तिततृट् सुप्तमात्र एव क्षुत्पिपासाद्यार्तमहोरात्रोपोषितमभुक्तवन्तमात्मानं मन्यते, यथा स्वप्ने भुक्त्वा पीत्वा च अतृप्तोत्थितः, तथा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000304.mp3", "sections": []}, {"id": "B_000305", "originalText": "तस्माज्जाग्रद्दृश्यानां स्वप्ने विप्रतिपत्तिर्दृष्टा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000305.mp3", "sections": []}, {"id": "B_000306", "originalText": "अतो मन्यामहे तेषामप्यसत्त्वं स्वप्नदृश्यवदनाशङ्कनीयमिति। तस्मादाद्यन्तवत्त्वमुभयत्र समानमिति मिथ्यैव खलु ते स्मृताः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000306.mp3", "sections": []}, {"id": "B_000307", "originalText": "अपूर्वं स्थानिधर्मो हि यथा स्वर्गनिवासिनाम्। तानयं प्रेक्षते गत्वा यथैवेह सुशिक्षितः॥ ८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000307.mp3", "sections": []}, {"id": "B_000308", "originalText": "स्वप्नजाग्रद्भेदयोः समत्वाज्जाग्रद्भेदानामसत्त्वमिति यदुक्तम्, तदसत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000308.mp3", "sections": []}, {"id": "B_000309", "originalText": "कस्मात्? दृष्टान्तस्यासिद्धत्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000309.mp3", "sections": []}, {"id": "B_000310", "originalText": "कथम्? न हि जाग्रद्दृश्या ये, ते भेदाः स्वप्ने दृश्यन्ते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000310.mp3", "sections": []}, {"id": "B_000311", "originalText": "किं तर्हि? अपूर्वं स्वप्ने पश्यति चतुर्दन्तं गजमारूढोऽष्टभुजमात्मानम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000311.mp3", "sections": []}, {"id": "B_000312", "originalText": "अन्यदप्येवंप्रकारमपूर्वं पश्यति स्वप्ने।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000312.mp3", "sections": []}, {"id": "B_000313", "originalText": "तन्नान्येनासता सममिति सदेव।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000313.mp3", "sections": []}, {"id": "B_000314", "originalText": "अतो दृष्टान्तोऽसिद्धः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000314.mp3", "sections": []}, {"id": "B_000315", "originalText": "तस्मात्स्वप्नवज्जागरितस्यासत्त्वमित्ययुक्तम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000315.mp3", "sections": []}, {"id": "B_000316", "originalText": "तन्न।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000316.mp3", "sections": []}, {"id": "B_000317", "originalText": "स्वप्ने दृष्टमपूर्वं यन्मन्यसे, न तत्स्वतः सिद्धम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000317.mp3", "sections": []}, {"id": "B_000318", "originalText": "किं तर्हि? अपूर्वं स्थानिधर्मो हि, स्थानिनो द्रष्टुरेव हि स्वप्नस्थानवतो धर्मः, यथा स्वर्गनिवासिनामिन्द्रादीनां सहस्राक्षत्वादि, तथा स्वप्नदृशोऽपूर्वोऽयं धर्मः, न स्वतःसिद्धो द्रष्टुः स्वरूपवत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000318.mp3", "sections": []}, {"id": "B_000319", "originalText": "तान् एवंप्रकारानपूर्वान्स्वचित्तविकल्पान् अयं स्थानी यः स्वप्नदृक्स्वप्नस्थानं गत्वा प्रेक्षते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000319.mp3", "sections": []}, {"id": "B_000320", "originalText": "यथैव इह लोके सुशिक्षितदेशान्तरमार्गस्तेन मार्गेण देशान्तरं गत्वा पदार्थान्पश्यति, तद्वत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000320.mp3", "sections": []}, {"id": "B_000321", "originalText": "तस्माद्यथा स्थानिधर्माणां रज्जुसर्पमृगतृष्णिकादीनामसत्त्वम्, तथा स्वप्नदृश्यानामप्यपूर्वाणां स्थानिधर्मत्वमेवेत्यसत्त्वम्, अतो न स्वप्नदृष्टान्तस्यासिद्धत्वम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000321.mp3", "sections": []}, {"id": "B_000322", "originalText": "स्वप्नवृत्तावपि त्वन्तश्चेतसा कल्पितं त्वसत्। बहिश्चेतो गृहीतं सद्दृष्टं वैतथ्यमेतयोः॥ ९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000322.mp3", "sections": []}, {"id": "B_000323", "originalText": "अपूर्वत्वाशङ्कां निराकृत्य स्वप्नदृष्टान्तस्य पुनः स्वप्नतुल्यतां जाग्रद्भेदानां प्रपञ्चयन्नाह— स्वप्नवृत्तावपि स्वप्नस्थानेऽपि अन्तश्चेतसा मनोरथसङ्कल्पितमसत्, सङ्कल्पानन्तरसमकालमेवादर्शनात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000323.mp3", "sections": []}, {"id": "B_000324", "originalText": "तत्रैव स्वप्ने बहिश्चेतसा गृहीतं चक्षुरादिद्वारेणोपलब्धं घटादि सदित्येवमसत्यमिति निश्चितेऽपि सदसद्विभागो दृष्टः। उभयोरप्यन्तर्बहिश्चेतः कल्पितयोर्वैतथ्यमेव दृष्टम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000324.mp3", "sections": []}, {"id": "B_000325", "originalText": "जाग्रद्वृत्तावपि त्वन्तश्चेतसा कल्पितं त्वसत्। बहिश्चेतोगृहीतं सद्युक्तं वैतथ्यमेतयोः॥ १०॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000325.mp3", "sections": []}, {"id": "B_000326", "originalText": "सदसतोर्वैतथ्यं युक्तम्, अन्तर्बहिश्चेतःकल्पितत्वाविशेषादिति। व्याख्यातमन्यत्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000326.mp3", "sections": []}, {"id": "B_000327", "originalText": "उभयोरपि वैतथ्यं भेदानां स्थानयोर्यदि। क एतान्बुध्यते भेदान्को वै तेषां विकल्पकः॥ ११॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000327.mp3", "sections": []}, {"id": "B_000328", "originalText": "चोदक आह— स्वप्नजाग्रत्स्थानयोर्भेदानां यदि वैतथ्यम्, क एतानन्तर्बहिश्चेतःकल्पितान्बुध्यते। को वै तेषां विकल्पकः, स्मृतिज्ञानयोः क आलम्बनमित्यभिप्रायः, न चेन्निरात्मवाद इष्टः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000328.mp3", "sections": []}, {"id": "B_000329", "originalText": "कल्पयत्यात्मनात्मानमात्मा देवः स्वमायया। स एव बुध्यते भेदानिति वेदान्तनिश्चयः॥ १२॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000329.mp3", "sections": []}, {"id": "B_000330", "originalText": "स्वयं स्वमायया स्वमात्मानमात्मा देवः आत्मन्येव वक्ष्यमाणं भेदाकारं कल्पयति रज्ज्वादाविव सर्पादीन्, स्वयमेव च तान्बुध्यते भेदान्, तद्वदेवेत्येवं वेदान्तनिश्चयः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000330.mp3", "sections": []}, {"id": "B_000331", "originalText": "नान्योऽस्ति ज्ञानस्मृत्याश्रयः। न च निरास्पदे एव ज्ञानस्मृती वैनाशिकानामिवेत्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000331.mp3", "sections": []}, {"id": "B_000332", "originalText": "विकरोत्यपरान्भावानन्तश्चित्ते व्यवस्थितान्। नियतांश्च बहिश्चित्त एवं कल्पयते प्रभुः॥ १३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000332.mp3", "sections": []}, {"id": "B_000333", "originalText": "सङ्कल्पयन्केन प्रकारेण कल्पयतीत्युच्यते— विकरोति नाना करोति अपरान् लौकिकान् भावान् पदार्थाञ्शब्दादीनन्यांश्च अन्तश्चित्ते वासनारूपेण व्यवस्थितानव्याकृतान् नियतांश्च पृथिव्यादीननियतांश्च कल्पनाकालान् बहिश्चित्तः सन्, तथा अन्तश्चित्तो मनोरथादिलक्षणानित्येवं कल्पयति, प्रभुः ईश्वरः, आत्मेत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000333.mp3", "sections": []}, {"id": "B_000334", "originalText": "चित्तकाला हि येऽन्तस्तु द्वयकालाश्च ये बहिः। कल्पिता एव ते सर्वे विशेषो नान्यहेतुकः॥ १४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000334.mp3", "sections": []}, {"id": "B_000335", "originalText": "स्वप्नवच्चित्तपरिकल्पितं सर्वमित्येतदाशङ्क्यते— यस्माच्चित्तपरिकल्पितैर्मनोरथादिलक्षणैश्चित्तपरिच्छेद्यैर्वैलक्षण्यं बाह्यानामन्योन्यपरिच्छेद्यत्वमिति, सा न युक्ताशङ्का।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000335.mp3", "sections": []}, {"id": "B_000336", "originalText": "चित्तकाला हि येऽन्तस्तु चित्तपरिच्छेद्याः, नान्यश्चित्तकालव्यतिरेकेण परिच्छेदकः कालो येषाम्, ते चित्तकालाः, कल्पनाकाल एवोपलभ्यन्त इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000336.mp3", "sections": []}, {"id": "B_000337", "originalText": "द्वयकालाश्च भेदकाला अन्योन्यपरिच्छेद्याः, यथा आगोदोहनमास्ते, यावदास्ते तावद्गां दोग्धि, यावद्गां दोग्धि तावदास्ते, तावानयमेतावान्स इति परस्परपरिच्छेद्यपरिच्छेदकत्वं बाह्यानां भेदानाम्, ते द्वयकालाः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000337.mp3", "sections": []}, {"id": "B_000338", "originalText": "अन्तश्चित्तकाला बाह्याश्च द्वयकालाः कल्पिता एव ते सर्वे।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000338.mp3", "sections": []}, {"id": "B_000339", "originalText": "न बाह्यो द्वयकालत्वविशेषः कल्पितत्वव्यतिरेकेणान्यहेतुकः। अत्रापि हि स्वप्नदृष्टान्तो भवत्येव॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000339.mp3", "sections": []}, {"id": "B_000340", "originalText": "अव्यक्ता एव येऽन्तस्तु स्फुटा एव च ये बहिः। कल्पिता एव ते सर्वे विशेषस्त्विन्द्रियान्तरे॥ १५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000340.mp3", "sections": []}, {"id": "B_000341", "originalText": "यदपि अन्तरव्यक्तत्वं भावानां मनोवासनामात्राभिव्यक्तानां स्फुटत्वं वा बहिश्चक्षुरादीन्द्रियान्तरे विशेषः, नासौ भेदानामस्तित्वकृतः, स्वप्नेऽपि तथा दर्शनात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000341.mp3", "sections": []}, {"id": "B_000342", "originalText": "किं तर्हि? इन्द्रियान्तरकृत एव। अतः कल्पिता एव जाग्रद्भावा अपि स्वप्नभाववदिति सिद्धम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000342.mp3", "sections": []}, {"id": "B_000343", "originalText": "जीवं कल्पयते पूर्वं ततो भावान्पृथग्विधान्। बाह्यानाध्यात्मिकांश्चैव यथाविद्यस्तथास्मृतिः॥ १६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000343.mp3", "sections": []}, {"id": "B_000344", "originalText": "बाह्याध्यात्मिकानां भावानामितरेतरनिमित्तनैमित्तिकतया कल्पनायाः किं मूलमित्युच्यते— जीवं हेतुफलात्मकम् ‘अहं करोमि, मम सुखदुःखे’ इत्येवंलक्षणम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000344.mp3", "sections": []}, {"id": "B_000345", "originalText": "अनेवंलक्षण एव शुद्ध आत्मनि रज्ज्वामिव सर्पं कल्पयते पूर्वम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000345.mp3", "sections": []}, {"id": "B_000346", "originalText": "ततस्तादर्थ्येन क्रियाकारकफलभेदेन प्राणादीन्नानाविधान्भावान्बाह्यानाध्यात्मिकांश्चैव कल्पयते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000346.mp3", "sections": []}, {"id": "B_000347", "originalText": "तत्र कल्पनायां को हेतुरित्युच्यते— योऽसौ स्वयं कल्पितो जीवः सर्वकल्पनायामधिकृतः, सः यथाविद्यः यादृशी विद्या विज्ञानमस्येति यथाविद्यः, तथाविधैव स्मृतिस्तस्येति तथास्मृतिर्भवति स इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000347.mp3", "sections": []}, {"id": "B_000348", "originalText": "अतो हेतुकल्पनाविज्ञानात्फलविज्ञानम्, ततो हेतुफलस्मृतिः, ततस्तद्विज्ञानम्, ततः तदर्थक्रियाकारकतत्फलभेदविज्ञानानि, तेभ्यस्तत्स्मृतिः, तत्स्मृतेश्च पुनस्तद्विज्ञानानि इत्येवं बाह्यानाध्यात्मिकांश्च इतरेतरनिमित्तनैमित्तिकभावेनानेकधा कल्पयते॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000348.mp3", "sections": []}, {"id": "B_000349", "originalText": "अनिश्चिता यथा रज्जुरन्धकारे विकल्पिता। सर्पधारादिभिर्भावैस्तद्वदात्मा विकल्पितः॥ १७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000349.mp3", "sections": []}, {"id": "B_000350", "originalText": "तत्र जीवकल्पना सर्वकल्पनामूलमित्युक्तम्, सैव जीवकल्पना किंनिमित्तेति दृष्टान्तेन प्रतिपादयति— यथा लोके स्वेन रूपेण अनिश्चिता अनवधारिता एवमेवेति रज्जुः मन्दान्धकारे किं सर्प उदकधारा दण्ड इति वा अनेकधा विकल्पिता भवति पूर्वं स्वरूपानिश्चयनिमित्तम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000350.mp3", "sections": []}, {"id": "B_000351", "originalText": "यदि हि पूर्वमेव रज्जुः स्वरूपेण निश्चिता स्यात्, न सर्पादिविकल्पोऽभविष्यत्, यथा स्वहस्ताङ्गुल्यादिषु, एष दृष्टान्तः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000351.mp3", "sections": []}, {"id": "B_000352", "originalText": "तद्वद्धेतुफलादिसंसारधर्मानर्थविलक्षणतया स्वेन विशुद्धविज्ञप्तिमात्रसत्ताद्वयरूपेणानिश्चितत्वाज्जीवप्राणाद्यनन्तभावभेदैरात्मा विकल्पित इत्येष सर्वोपनिषदां सिद्धान्तः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000352.mp3", "sections": []}, {"id": "B_000353", "originalText": "निश्चितायां यथा रज्ज्वां विकल्पो विनिवर्तते। रज्जुरेवेति चाद्वैतं तद्वदात्मविनिश्चयः॥ १८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000353.mp3", "sections": []}, {"id": "B_000354", "originalText": "रज्जुरेवेति निश्चये सर्पादिविकल्पनिवृत्तौ रज्जुरेवेति चाद्वैतं यथा, तथा नेति नेतीति सर्वसंसारधर्मशून्यप्रतिपादकशास्त्रजनितविज्ञानसूर्यालोककृतात्मविनिश्चयः ‘आत्मैवेदं सर्वमपूर्वोऽनपरोऽनन्तरोऽबाह्यः सबाह्याभ्यन्तरो ह्यजोऽजरोऽमृतोऽभय एक एवाद्वयः’ इति॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000354.mp3", "sections": []}, {"id": "B_000355", "originalText": "प्राणादिभिरनन्तैस्तु भावैरेतैर्विकल्पितः। मायैषा तस्य देवस्य ययायं मोहितः स्वयम्॥ १९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000355.mp3", "sections": []}, {"id": "B_000356", "originalText": "यदि आत्मैक एवेति निश्चयः, कथं प्राणादिभिरनन्तैर्भावैरेतैः संसारलक्षणैर्विकल्पित इति? उच्यते शृणु— मायैषा तस्यात्मनो देवस्य।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000356.mp3", "sections": []}, {"id": "B_000357", "originalText": "यथा मायाविना विहिता माया गगनमतिविमलं कुसुमितैः सपलाशैस्तरुभिराकीर्णमिव करोति, तथा इयमपि देवस्य माया, यया अयं स्वयमपि मोहित इव मोहितो भवति। ‘मम माया दुरत्यया’ (भ.गी.७.१४) इत्युक्तम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000357.mp3", "sections": []}, {"id": "B_000358", "originalText": "प्राण इति प्राणविदो भूतानीति च तद्विदः। गुणा इति गुणविदस्तत्त्वानीति च तद्विदः॥ २०॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000358.mp3", "sections": []}, {"id": "B_000359", "originalText": "पादा इति पादविदो विषया इति तद्विदः। लोका इति लोकविदो देवा इति च तद्विदः॥ २१॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000359.mp3", "sections": []}, {"id": "B_000360", "originalText": "वेदा इति वेदविदो यज्ञा इति च तद्विदः। भोक्तेति च भोक्तृविदो भोज्यमिति च तद्विदः॥ २२॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000360.mp3", "sections": []}, {"id": "B_000361", "originalText": "सूक्ष्म इति सूक्ष्मविदः स्थूल इति च तद्विदः। मूर्त इति मूर्तविदोऽमूर्त इति च तद्विदः॥ २३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000361.mp3", "sections": []}, {"id": "B_000362", "originalText": "काल इति कालविदो दिश इति च तद्विदः। वादा इति वादविदो भुवनानीति तद्विदः॥ २४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000362.mp3", "sections": []}, {"id": "B_000363", "originalText": "मन इति मनोविदो बुद्धिरिति च तद्विदः। चित्तमिति चित्तविदो धर्माधर्मौ च तद्विदः॥ २५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000363.mp3", "sections": []}, {"id": "B_000364", "originalText": "पञ्चविंशक इत्येके षड्विंश इति चापरे। एकत्रिंशक इत्याहुरनन्त इति चापरे॥ २६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000364.mp3", "sections": []}, {"id": "B_000365", "originalText": "लोकांल्लोकविदः प्राहुराश्रमा इति तद्विदः। स्त्रीपुंनपुंसकं लैङ्गाः परापरमथापरे॥ २७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000365.mp3", "sections": []}, {"id": "B_000366", "originalText": "सृष्टिरिति सृष्टिविदो लय इति च तद्विदः। स्थितिरिति स्थितिविदः सर्वे चेह तु सर्वदा॥ २८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000366.mp3", "sections": []}, {"id": "B_000367", "originalText": "प्राणः प्राज्ञो बीजात्मा, तत्कार्यभेदा हीतरे स्थित्यन्ताः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000367.mp3", "sections": []}, {"id": "B_000368", "originalText": "अन्ये च सर्वे लौकिकाः सर्वप्राणिपरिकल्पिता भेदा रज्ज्वामिव सर्पादयः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000368.mp3", "sections": []}, {"id": "B_000369", "originalText": "तच्छून्ये आत्मन्यात्मस्वरूपानिश्चयहेतोरविद्यया कल्पिता इति पिण्डितोऽर्थः। प्राणादिश्लोकानां प्रत्येकं पदार्थव्याख्याने फल्गुप्रयोजनत्वात्सिद्धपदार्थत्वाच्च यत्नो न कृतः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000369.mp3", "sections": []}, {"id": "B_000370", "originalText": "यं भावं दर्शयेद्यस्य तं भावं स तु पश्यति। तं चावति स भूत्वासौ तद्ग्रहः समुपैति तम्॥ २९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000370.mp3", "sections": []}, {"id": "B_000371", "originalText": "किं बहुना? प्राणादीनामन्यतममुक्तमनुक्तं वा अन्यं यं भावं पदार्थं दर्शयेद्यस्याचार्योऽन्यो वा आप्तः इदमेव तत्त्वमिति, स तं भावमात्मभूतं पश्यत्ययमहमिति वा ममेति वा, तं च द्रष्टारं स भावोऽवति, यो दर्शितो भावः, असौ स भूत्वा रक्षति, स्वेनात्मना सर्वतो निरुणद्धि।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000371.mp3", "sections": []}, {"id": "B_000372", "originalText": "तस्मिन्ग्रहस्तद्ग्रहस्तदभिनिवेशः इदमेव तत्त्वमिति स तं ग्रहीतारमुपैति, तस्यात्मभावं निगच्छतीत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000372.mp3", "sections": []}, {"id": "B_000373", "originalText": "एतैरेषोऽपृथग्भावैः पृथगेवेति लक्षितः। एवं यो वेद तत्त्वेन कल्पयेत्सोऽविशङ्कितः॥ ३०॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000373.mp3", "sections": []}, {"id": "B_000374", "originalText": "एतैः प्राणादिभिः आत्मनोऽपृथग्भूतैरपृथग्भावैः एषः आत्मा रज्जुरिव सर्पादिविकल्पनारूपैः पृथगेवेति लक्षितः अभिलक्षितः निश्चितः मूढैरित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000374.mp3", "sections": []}, {"id": "B_000375", "originalText": "विवेकिनां तु रज्ज्वामिव कल्पिताः सर्पादयो नात्मव्यतिरेकेण प्राणादयः सन्तीत्यभिप्रायः, ‘इदं सर्वं यदयमात्मा’ (बृ.२.४.६) इति श्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000375.mp3", "sections": []}, {"id": "B_000376", "originalText": "एवमात्मव्यतिरेकेणासत्त्वं रज्जुसर्पवदात्मनि कल्पितानामात्मानं च केवलं निर्विकल्पं यो वेद तत्त्वेन श्रुतितो युक्तितश्च, सः अविशङ्कितो वेदार्थं विभागतः कल्पयेत् कल्पयतीत्यर्थः— इदमेवंपरं वाक्यम् अदोऽन्यपरम् इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000376.mp3", "sections": []}, {"id": "B_000377", "originalText": "न ह्यनध्यात्मविद्वेदान्ज्ञातुं शक्नोति तत्त्वतः, ‘न ह्यनध्यात्मवित्कश्चित्क्रियाफलमुपाश्नुते’ (मनु.६.८२) इति हि मानवं वचनम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000377.mp3", "sections": []}, {"id": "B_000378", "originalText": "स्वप्नमाये यथा दृष्टे गन्धर्वनगरं यथा। तथा विश्वमिदं दृष्टं वेदान्तेषु विचक्षणैः॥ ३१॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000378.mp3", "sections": []}, {"id": "B_000379", "originalText": "यदेतद्द्वैतस्यासत्त्वमुक्तं युक्तितः, तदेतद्वेदान्तप्रमाणावगतमित्याह— स्वप्नश्च माया च स्वप्नमाये असद्वस्त्वात्मिके सत्यौ सद्वस्त्वात्मिके इव लक्ष्येते अविवेकिभिः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000379.mp3", "sections": []}, {"id": "B_000380", "originalText": "यथा च प्रसारितपण्यापणगृहप्रासादस्त्रीपुञ्जनपदव्यवहाराकीर्णमिव गन्धर्वनगरं दृश्यमानमेव सत् अकस्मादभावतां गतं दृष्टम्, यथा च स्वप्नमाये दृष्टे असद्रूपे, तथा विश्वमिदं द्वैतं समस्तमसद्दृष्टम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000380.mp3", "sections": []}, {"id": "B_000381", "originalText": "क्वेत्याह— वेदान्तेषु, ‘नेह नानास्ति किञ्चन’ (क.२.१.११) ‘इन्द्रो मायाभिः’ (बृ.२.५.१९) ‘आत्मैवेदमग्र आसीत्’ (बृ.१.४.१) ‘ब्रह्मैवेदमग्र आसीत्’ (बृ.१.४.१०) ‘द्वितीयाद्वै भयं भवति’ (बृ.१.४.२) ‘न तु तद्द्वितीयमस्ति’ (बृ.४.३.२३) ‘यत्र त्वस्य सर्वमात्मैवाभूत्’ (बृ.४.५.१५) इत्यादिषु विचक्षणैः निपुणतरवस्तुदर्शिभिः पण्डितैरित्यर्थः, ‘तमः श्वभ्रनिभं दृष्टं वर्षबुद्बुदसंनिभम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000381.mp3", "sections": []}, {"id": "B_000382", "originalText": "नाशप्रायं सुखाद्धीनं नाशोत्तरमभावगम्’ (मो.ध.३०१.६०) इति व्यासस्मृतेः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000382.mp3", "sections": []}, {"id": "B_000383", "originalText": "न निरोधो न चोत्पत्तिर्न बद्धो न च साधकः। न मुमुक्षुर्न वै मुक्त इत्येषा परमार्थता॥ ३२॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000383.mp3", "sections": []}, {"id": "B_000384", "originalText": "प्रकरणार्थोपसंहारार्थोऽयं श्लोकः— यदा वितथं द्वैतम् आत्मैवैकः परमार्थतः सन्, तदा इदं निष्पन्नं भवति— सर्वोऽयं लौकिको वैदिकश्च व्यवहारोऽविद्याविषय एवेति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000384.mp3", "sections": []}, {"id": "B_000385", "originalText": "तदा न निरोधः, निरोधनं निरोधः प्रलयः, उत्पत्तिः जननम्, बद्धः संसारी जीवः, साधकः साधनवान्मोक्षस्य, मुमुक्षुः मोचनार्थी, मुक्तः विमुक्तबन्धः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000385.mp3", "sections": []}, {"id": "B_000386", "originalText": "उत्पत्तिप्रलययोरभावाद्बद्धादयो न सन्तीत्येषा परमार्थता।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000386.mp3", "sections": []}, {"id": "B_000387", "originalText": "कथमुत्पत्तिप्रलययोरभाव इति, उच्यते— द्वैतस्यासत्त्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000387.mp3", "sections": []}, {"id": "B_000388", "originalText": "‘यत्र हि द्वैतमिव भवति’ (बृ.२.४.१४) ‘य इह नानेव पश्यति’ (क.२.१.१०) ‘आत्मैवेदं सर्वम्’ (छा.७.२५.२) ‘ब्रह्मैवेदं सर्वम्’ ‘एकमेवाद्वितीयम्’ (छा.६.२.१) ‘इदं सर्वं यदयमात्मा’ (बृ.२.४.६) इत्यादिनानाश्रुतिभ्यो द्वैतस्यासत्त्वं सिद्धम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000388.mp3", "sections": []}, {"id": "B_000389", "originalText": "सतो ह्युत्पत्तिः प्रलयो वा स्यात्, नासतः शशविषाणादेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000389.mp3", "sections": []}, {"id": "B_000390", "originalText": "नाप्यद्वैतमुत्पद्यते प्रलीयते वा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000390.mp3", "sections": []}, {"id": "B_000391", "originalText": "अद्वैतं च, उत्पत्तिप्रलयवच्चेति विप्रतिषिद्धम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000391.mp3", "sections": []}, {"id": "B_000392", "originalText": "यस्तु पुनर्द्वैतसंव्यवहारः, स रज्जुसर्पवदात्मनि प्राणादिलक्षणः कल्पित इत्युक्तम्, न हि मनोविकल्पनाया रज्जुसर्पादिलक्षणाया रज्ज्वां प्रलय उत्पत्तिर्वा, न च मनसि रज्जुसर्पस्योत्पत्तिः प्रलयो वा, न चोभयतो वा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000392.mp3", "sections": []}, {"id": "B_000393", "originalText": "तथा मानसत्वाविशेषाद्द्वैतस्य।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000393.mp3", "sections": []}, {"id": "B_000394", "originalText": "न हि नियते मनसि सुषुप्ते वा द्वैतं गृह्यते, अतो मनोविकल्पनामात्रं द्वैतमिति सिद्धम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000394.mp3", "sections": []}, {"id": "B_000395", "originalText": "तस्मात्सूक्तम्— द्वैतस्यासत्त्वान्निरोधाद्यभावः परमार्थतेति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000395.mp3", "sections": []}, {"id": "B_000396", "originalText": "यद्येवं द्वैताभावे शास्त्रव्यापारः, नाद्वैते, विरोधात्, तथा च सत्यद्वैतस्य वस्तुत्वे प्रमाणाभावाच्छून्यवादप्रसङ्गः, द्वैतस्य चाभावात्, न, रज्जुवत्सर्पादिकल्पनाया निरास्पदत्वेऽनुपपत्तिरिति प्रत्युक्तमेतत्कथमुज्जीवयसीति, आह— रज्जुरपि सर्पविकल्पस्यास्पदभूता कल्पितैवेति दृष्टान्तानुपपत्तिः, न, विकल्पनाक्षये अविकल्पितस्याविकल्पितत्वादेव सत्त्वोपपत्तेः, रज्जुसर्पवदसत्त्वमिति चेत्, न एकान्तेनाविकल्पितत्वात् अविकल्पितरज्ज्वंशवत्प्राक्सर्पाभावविज्ञानात्, विकल्पयितुश्च प्राग्विकल्पनोत्पत्तेः सिद्धत्वाभ्युपगमादेवासत्त्वानुपपत्तिः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000396.mp3", "sections": []}, {"id": "B_000397", "originalText": "कथं पुनः स्वरूपे व्यापाराभावे शास्त्रस्य द्वैतविज्ञाननिवर्तकत्वम्? नैष दोषः, रज्ज्वां सर्पादिवदात्मनि द्वैतस्याविद्याध्यस्तत्वात् कथं सुख्यहं दुःखी मूढो जातो मृतो जीर्णो देहवान् पश्यामि व्यक्ताव्यक्तः कर्ता फली संयुक्तो वियुक्तः क्षीणो वृद्धोऽहं ममैते इत्येवमादयः सर्वे आत्मन्यध्यारोप्यन्ते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000397.mp3", "sections": []}, {"id": "B_000398", "originalText": "आत्मा एतेष्वनुगतः, सर्वत्राव्यभिचारात्, यथा सर्पधारादिभेदेषु रज्जुः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000398.mp3", "sections": []}, {"id": "B_000399", "originalText": "यदा चैवं विशेष्यस्वरूपप्रत्ययस्य सिद्धत्वान्न कर्तव्यत्वं शास्त्रेण।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000399.mp3", "sections": []}, {"id": "B_000400", "originalText": "अकृतकर्तृ च शास्त्रं कृतानुकारित्वे अप्रमाणम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000400.mp3", "sections": []}, {"id": "B_000401", "originalText": "यतः अविद्याध्यारोपितसुखित्वादिविशेषप्रतिबन्धादेवात्मनः स्वरूपेणानवस्थानम्, स्वरूपावस्थानं च श्रेयः इति सुखित्वादिनिवर्तकं शास्त्रमात्मन्यसुखित्वादिप्रत्ययकरणेन नेति नेत्यस्थूलादिवाक्यैः, आत्मस्वरूपवदसुखित्वादिरपि सुखित्वादिभेदेषु नानुवृत्तोऽस्ति धर्मः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000401.mp3", "sections": []}, {"id": "B_000402", "originalText": "यद्यनुवृत्तः स्यात्, नाध्यारोप्येत सुखित्वादिलक्षणो विशेषः, यथोष्णत्वगुणविशेषवत्यग्नौ शीतता, तस्मान्निर्विशेष एवात्मनि सुखित्वादयो विशेषाः कल्पिताः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000402.mp3", "sections": []}, {"id": "B_000403", "originalText": "यत्त्वसुखित्वादिशास्त्रमात्मनः, तत्सुखित्वादिविशेषनिवृत्त्यर्थमेवेति सिद्धम्। ‘सिद्धं तु निवर्तकत्वात्’ इत्यागमविदां सूत्रम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000403.mp3", "sections": []}, {"id": "B_000404", "originalText": "भावैरसद्भिरेवायमद्वयेन च कल्पितः। भावा अप्यद्वयेनैव तस्मादद्वयता शिवा॥ ३३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000404.mp3", "sections": []}, {"id": "B_000405", "originalText": "पूर्वश्लोकार्थस्य हेतुमाह— यथा रज्ज्वामसद्भिः सर्पधारादिभिः अद्वयेन च रज्जुद्रव्येण सता अयं सर्प इति धारेयं दण्डोऽयमिति वा रज्जुद्रव्यमेव कल्प्यते, एवं प्राणादिभिरनन्तैः असद्भिरेव अविद्यमानैः, न परमार्थतः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000405.mp3", "sections": []}, {"id": "B_000406", "originalText": "न ह्यप्रचलिते मनसि कश्चिद्भाव उपलक्षयितुं शक्यते केनचित्, न चात्मनः प्रचलनमस्ति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000406.mp3", "sections": []}, {"id": "B_000407", "originalText": "प्रचलितस्यैवोपलभ्यमाना भावा न परमार्थतः सन्तः कल्पयितुं शक्याः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000407.mp3", "sections": []}, {"id": "B_000408", "originalText": "अतः असद्भिरेव प्राणादिभिर्भावैरद्वयेन च परमार्थसता आत्मना रज्जुवत्सर्वविकल्पास्पदभूतेन अयं स्वयमेवात्मा कल्पितः सदैकस्वभावोऽपि सन्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000408.mp3", "sections": []}, {"id": "B_000409", "originalText": "ते चापि प्राणादिभावाः अद्वयेनैव सता आत्मना विकल्पिताः, न हि निरास्पदा काचित्कल्पना उपपद्यते, अतः सर्वकल्पनास्पदत्वात्स्वेनात्मना अद्वयस्य अव्यभिचारात् कल्पनावस्थायामपि अद्वयता शिवा, कल्पना एव त्वशिवाः, रज्जुसर्पादिवत्त्रासादिकारिण्यो हि ताः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000409.mp3", "sections": []}, {"id": "B_000410", "originalText": "अद्वयता अभया, अतः सैव शिवा॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000410.mp3", "sections": []}, {"id": "B_000411", "originalText": "नात्मभावेन नानेदं न स्वेनापि कथञ्चन। न पृथङ् नापृथक्किञ्चिदिति तत्त्वविदो विदुः॥ ३४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000411.mp3", "sections": []}, {"id": "B_000412", "originalText": "कुतश्चाद्वयता शिवा? नानाभूतं प्रथक्त्वम् अन्यस्य अन्यस्मात् यत्र दृष्टम्, तत्राशिवं भवेत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000412.mp3", "sections": []}, {"id": "B_000413", "originalText": "न ह्यत्राद्वये परमार्थसत्यात्मनि प्राणादिसंसारजातमिदं जगत् आत्मभावेन परमार्थस्वरूपेण निरूप्यमाणं नाना वस्त्वन्तरभूतं भवति, यथा रज्जुस्वरूपेण प्रकाशेन निरूप्यमाणो न नानाभूतः कल्पितः सर्पोऽस्ति, तद्वत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000413.mp3", "sections": []}, {"id": "B_000414", "originalText": "नापि स्वेन प्राणाद्यात्मना इदं विद्यते कदाचिदपि, रज्जुसर्पवत्कल्पितत्वादेव।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000414.mp3", "sections": []}, {"id": "B_000415", "originalText": "तथा अन्योन्यं न पृथक् प्राणादि वस्तु, यथा अश्वान्महिषः पृथग्विद्यते, एवम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000415.mp3", "sections": []}, {"id": "B_000416", "originalText": "अतः असत्त्वात् नापि अपृथक् विद्यतेऽन्योन्यं परेण वा किञ्चिदिति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000416.mp3", "sections": []}, {"id": "B_000417", "originalText": "एवं परमार्थतत्त्वविदो ब्राह्मणा विदुः। अतः अशिवहेतुत्वाभावादद्वयतैव शिवेत्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000417.mp3", "sections": []}, {"id": "B_000418", "originalText": "वीतरागभयक्रोधैर्मुनिभिर्वेदपारगैः। निर्विकल्पो ह्ययं दृष्टः प्रपञ्चोपशमोऽद्वयः॥ ३५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000418.mp3", "sections": []}, {"id": "B_000419", "originalText": "तदेतत्सम्यग्दर्शनं स्तूयते— विगतरागभयक्रोधादिसर्वदोषैः सर्वदा मुनिभिः मननशीलैर्विवेकिभिः वेदपारगैः अवगतवेदान्तार्थतत्त्वैर्ज्ञानिभिः निर्विकल्पः सर्वविकल्पशून्यः अयम् आत्मा दृष्टः उपलब्धो वेदान्तार्थतत्परैः, प्रपञ्चोपशमः, प्रपञ्चो द्वैतभेदविस्तारः, तस्योपशमोऽभावो यस्मिन्, स आत्मा प्रपञ्चोपशमः, अत एव अद्वयः विगतदोषैरेव पण्डितैर्वेदान्तार्थतत्परैः संन्यासिभिः अयमात्मा द्रष्टुं शक्यः, नान्यैः रागादिकलुषितचेतोभिः स्वपक्षपातिदर्शनैस्तार्किकादिभिरित्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000419.mp3", "sections": []}, {"id": "B_000420", "originalText": "तस्मादेवं विदित्वैनमद्वैते योजयेत्स्मृतिम्। अद्वैतं समनुप्राप्य जडवल्लोकमाचरेत्॥ ३६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000420.mp3", "sections": []}, {"id": "B_000421", "originalText": "यस्मात्सर्वानर्थोपशमरूपत्वादद्वयं शिवमभयम्, अतः एवं विदित्वैनम् अद्वैते स्मृतिं योजयेत्, अद्वैतावगमायैव स्मृतिं कुर्यादित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000421.mp3", "sections": []}, {"id": "B_000422", "originalText": "तच्च अद्वैतम् अवगम्य ‘अहमस्मि परं ब्रह्म’ इति विदित्वा अशनायाद्यतीतं साक्षादपरोक्षादजमात्मानं सर्वलोकव्यवहारातीतं जडवत् लोकमाचरेत्, अप्रख्यापयन्नात्मानमहमेवंविध इत्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000422.mp3", "sections": []}, {"id": "B_000423", "originalText": "निःस्तुतिर्निर्नमस्कारो निःस्वधाकार एव च। चलाचलनिकेतश्च यतिर्यादृच्छिको भवेत्॥ ३७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000423.mp3", "sections": []}, {"id": "B_000424", "originalText": "कया चर्यया लोकमाचरेदिति, आह— स्तुतिनमस्कारादिसर्वकर्मविवर्जितः त्यक्तसर्वबाह्यैषणः प्रतिपन्नपरमहंसपारिव्राज्य इत्यभिप्रायः, ‘एतं वै तमात्मानं विदित्वा’ (बृ.३.५.१) इत्यादिश्रुतेः, ‘तद्बुद्धयस्तदात्मानस्तन्निष्ठास्तत्परायणाः’ (भ.गी.५.१७) इत्यादिस्मृतेश्च।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000424.mp3", "sections": []}, {"id": "B_000425", "originalText": "चलं शरीरम्, प्रतिक्षणमन्यथाभावात्, अचलम् आत्मतत्त्वम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000425.mp3", "sections": []}, {"id": "B_000426", "originalText": "यदा कदाचिद्भोजनादिसंव्यवहारनिमित्तमाकाशवदचलं स्वरूपमात्मतत्त्वम् आत्मनो निकेतमाश्रयमात्मस्थितिं विस्मृत्य अहमिति मन्यते यदा, तदा चलो देहो निकेतो यस्य सोऽयमेवं चलाचलनिकेतो विद्वान्न पुनर्बाह्यविषयाश्रयः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000426.mp3", "sections": []}, {"id": "B_000427", "originalText": "स च यादृच्छिको भवेत्, यदृच्छाप्राप्तकौपीनाच्छादनग्रासमात्रदेहस्थितिरित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000427.mp3", "sections": []}, {"id": "B_000428", "originalText": "तत्त्वमाध्यात्मिकं दृष्ट्वा तत्त्वं दृष्ट्वा तु बाह्यतः। तत्त्वीभूतस्तदारामस्तत्त्वादप्रच्युतो भवेत्॥ ३८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000428.mp3", "sections": []}, {"id": "B_000429", "originalText": "बाह्यं पृथिव्यादि तत्त्वमाध्यात्मिकं च देहादिलक्षणं रज्जुसर्पादिवत्स्वप्नमायादिवच्च असत्, ‘वाचारम्भणं विकारो नामधेयम्’ (छा.६.१.४) इत्यादिश्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000429.mp3", "sections": []}, {"id": "B_000430", "originalText": "आत्मा च सबाह्याभ्यन्तरो ह्यजोऽपूर्वोऽनपरोऽनन्तरोऽबाह्यः कृत्स्नः तथा आकाशवत्सर्वगतः सूक्ष्मोऽचलो निर्गुणो निष्कलो निष्क्रियः ‘तत्सत्यं स आत्मा तत्त्वमसि’ (छा.६.८.७) इति श्रुतेः, इत्येवं तत्त्वं दृष्ट्वा तत्त्वीभूतस्तदारामो न बाह्यरमणः, यथा अतत्त्वदर्शी कश्चित्तमात्मत्वेन प्रतिपन्नश्चित्तचलनमनु चलितमात्मानं मन्यमानः तत्त्वाच्चलितं देहादिभूतमात्मानं कदाचिन्मन्यते प्रच्युतोऽहमात्मतत्त्वादिदानीमिति, समाहिते तु मनसि कदाचित्तत्त्वभूतं प्रसन्नमात्मानं मन्यते इदानीमस्मि तत्त्वीभूत इति, न तथा आत्मविद्भवेत्, आत्मन एकरूपत्वात्, स्वरूपप्रच्यवनासम्भवाच्च।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000430.mp3", "sections": []}, {"id": "B_000431", "originalText": "सदैव ब्रह्मास्मीत्यप्रच्युतो भवेत्तत्त्वात्, सदा अप्रच्युतात्मतत्त्वदर्शनो भवेदित्यभिप्रायः, ‘शुनि चैव श्वपाके च’ (भ.गी.५.१८) ‘समं सर्वेषु भूतेषु’ (भ.गी.१३.२७) इत्यादिस्मृतेः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000431.mp3", "sections": []}, {"id": "B_000432", "originalText": "इति द्वितीयं वैतथ्यप्रकरणं सम्पूर्णम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000432.mp3", "sections": []}, {"id": "B_000433", "originalText": "अद्वैतप्रकरणम्\nउपासनाश्रितो धर्मो जाते ब्रह्मणि वर्तते। प्रागुत्पत्तेरजं सर्वं तेनासौ कृपणः स्मृतः॥ १॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000433.mp3", "sections": ["अद्वैतप्रकरणम्"]}, {"id": "B_000434", "originalText": "ओङ्कारनिर्णये उक्तः प्रपञ्चोपशमः शिवोऽद्वैत आत्मेति प्रतिज्ञामात्रेण, ‘ज्ञाते द्वैतं न विद्यते’ (मा.का.१.१८) इति च।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000434.mp3", "sections": []}, {"id": "B_000435", "originalText": "तत्र द्वैताभावस्तु वैतथ्यप्रकरणेन स्वप्नमायागन्धर्वनगरादिदृष्टान्तैर्दृश्यत्वाद्यन्तवत्त्वादिहेतुभिस्तर्केण च प्रतिपादितः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000435.mp3", "sections": []}, {"id": "B_000436", "originalText": "अद्वैतं किमागममात्रेण प्रतिपत्तव्यम्, आहोस्वित्तर्केणापीत्यत आह— शक्यते तर्केणापि ज्ञातुम्, तत्कथमित्यद्वैतप्रकरणमारभ्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000436.mp3", "sections": []}, {"id": "B_000437", "originalText": "उपास्योपासनादिभेदजातं सर्वं वितथम्, केवलश्चात्मा अद्वयः परमार्थ इति स्थितमतीते प्रकरणे, यतः उपासनाश्रितः उपासनामात्मनो मोक्षसाधनत्वेन गतः उपासकोऽहं ममोपास्यं ब्रह्म।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000437.mp3", "sections": []}, {"id": "B_000438", "originalText": "तदुपासनं कृत्वा जाते ब्रह्मणीदानीं वर्तमानः अजं ब्रह्म शरीरपातादूर्ध्वं प्रतिपत्स्ये प्रागुत्पत्तेश्चाजमिदं सर्वमहं च।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000438.mp3", "sections": []}, {"id": "B_000439", "originalText": "यदात्मकोऽहं प्रागुत्पत्तेरिदानीं जातो जाते ब्रह्मणि च वर्तमान उपासनया पुनस्तदेव प्रतिपत्स्ये इत्येवमुपासनाश्रितो धर्मः साधकः येनैवं क्षुद्रब्रह्मवित्, तेनासौ कारणेन कृपणो दीनोऽल्पकः स्मृतो नित्याजब्रह्मदर्शिभिर्महात्मभिरित्यभिप्रायः, ‘यद्वाचानभ्युदितं येन वागभ्युद्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000439.mp3", "sections": []}, {"id": "B_000440", "originalText": "तदेव ब्रह्म त्वं विद्धि नेदं यदिदमुपासते’ (के.१.५) इत्यादिश्रुतेस्तलवकाराणाम्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000440.mp3", "sections": []}, {"id": "B_000441", "originalText": "अतो वक्ष्याम्यकार्पण्यमजाति समतां गतम्। यथा न जायते किञ्चिज्जायमानं समन्ततः॥ २॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000441.mp3", "sections": []}, {"id": "B_000442", "originalText": "सबाह्याभ्यन्तरमजमात्मानं प्रतिपत्तुमशक्नुवन् अविद्यया दीनमात्मानं मन्यमानः जातोऽहं जाते ब्रह्मणि वर्ते तदुपासनाश्रितः सन्ब्रह्म प्रतिपत्स्ये इत्येवं प्रतिपन्नः कृपणो भवति यस्मात्, अतो वक्ष्यामि अकार्पण्यम् अकृपणभावमजं ब्रह्म।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000442.mp3", "sections": []}, {"id": "B_000443", "originalText": "तद्धि कार्पण्यास्पदम्, ‘यत्रान्योऽन्यत्पश्यत्यन्यच्छृणोत्यन्यद्विजानाति तदल्पम्’ (छा.७.२४.१) ‘मर्त्यं तत्’ ‘वाचारम्भणं विकारो नामधेयम्’ (छा.६.१.४) इत्यादिश्रुतिभ्यः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000443.mp3", "sections": []}, {"id": "B_000444", "originalText": "तद्विपरीतं सबाह्याभ्यन्तरमजमकार्पण्यं भूमाख्यं ब्रह्म, यत्प्राप्याविद्याकृतसर्वकार्पण्यनिवृत्तिः, तदकार्पण्यं वक्ष्यामीत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000444.mp3", "sections": []}, {"id": "B_000445", "originalText": "तत् अजाति अविद्यमाना जातिरस्य।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000445.mp3", "sections": []}, {"id": "B_000446", "originalText": "समतां गतं सर्वसाम्यं गतम्, कस्मात्? अवयववैषम्याभावात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000446.mp3", "sections": []}, {"id": "B_000447", "originalText": "यद्धि सावयवं वस्तु, तदवयववैषम्यं गच्छज्जायत इत्युच्यते, इदं तु निरवयवत्वात्समतां गतमिति न कैश्चिदवयवैः स्फुटति, अतः अजाति अकार्पण्यं समन्ततः समन्तात्, यथा न जायते किञ्चित् अल्पमपि न स्फुटति रज्जुसर्पवदविद्याकृतदृष्ट्या जायमानं येन प्रकारेण न जायते सर्वतः अजमेव ब्रह्म भवति, तथा तं प्रकारं शृण्वित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000447.mp3", "sections": []}, {"id": "B_000448", "originalText": "आत्मा ह्याकाशवज्जीवैर्घटाकाशैरिवोदितः। घटादिवच्च सङ्घातैर्जातावेतन्निदर्शनम्॥ ३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000448.mp3", "sections": []}, {"id": "B_000449", "originalText": "अजाति ब्रह्माकार्पण्यं वक्ष्यामीति प्रतिज्ञातम्, तत्सिद्ध्यर्थं हेतुं दृष्टान्तं च वक्ष्यामीत्याह— आत्मा परः हि यस्मात् आकाशवत् सूक्ष्मो निरवयवः सर्वगत आकाशवदुक्तः जीवैः क्षेत्रज्ञैः घटाकाशैरिव घटाकाशतुल्यैः उदितः उक्तः, स एव आकाशसमः पर आत्मा।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000449.mp3", "sections": []}, {"id": "B_000450", "originalText": "अथवा घटाकाशैर्यथा आकाश उदितः उत्पन्नः, तथा परो जीवात्मभिरुत्पन्नः, जीवात्मनां परस्मादात्मन उत्पत्तिर्या श्रूयते वेदान्तेषु, सा महाकाशाद्घटाकाशोत्पत्तिसमा, न परमार्थत इत्यभिप्रायः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000450.mp3", "sections": []}, {"id": "B_000451", "originalText": "तस्मादेवाकाशाद्घटादयः सङ्घाता यथा उत्पद्यन्ते, एवमाकाशस्थानीयात्परमात्मनः पृथिव्यादिभूतसङ्घाता आध्यात्मिकाश्च कार्यकरणलक्षणा रज्जुसर्पवद्विकल्पिता जायन्ते, अत उच्यते— घटादिवच्च सङ्घातैरुदित इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000451.mp3", "sections": []}, {"id": "B_000452", "originalText": "यदा मन्दबुद्धिप्रतिपिपादयिषया श्रुत्या आत्मनो जातिरुच्यते जीवादीनाम्, तदा जातावुपगम्यमानायाम् एतत् निदर्शनं दृष्टान्तः यथोदिताकाशवदित्यादिः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000452.mp3", "sections": []}, {"id": "B_000453", "originalText": "घटादिषु प्रलीनेषु घटाकाशादयो यथा। आकाशे सम्प्रलीयन्ते तद्वज्जीवा इहात्मनि॥ ४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000453.mp3", "sections": []}, {"id": "B_000454", "originalText": "यथा घटाद्युत्पत्त्या घटाकाशाद्युत्पत्तिः, यथा च घटादिप्रलयेन घटाकाशादिप्रलयः, तद्वद्देहादिसङ्घातोत्पत्त्या जीवोत्पत्तिः तत्प्रलयेन च जीवानाम् इह आत्मनि प्रलयः, न स्वत इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000454.mp3", "sections": []}, {"id": "B_000455", "originalText": "यथैकस्मिन्घटाकाशे रजोधूमादिभिर्युते। न सर्वे सम्प्रयुज्यन्ते तद्वज्जीवाः सुखादिभिः॥ ५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000455.mp3", "sections": []}, {"id": "B_000456", "originalText": "सर्वदेहेष्वात्मैकत्वे एकस्मिन् जननमरणसुखदुःखादिमत्यात्मनि सर्वात्मनां तत्सम्बन्धः क्रियाफलसाङ्कर्यं च स्यादिति ये त्वाहुर्द्वैतिनः, तान्प्रतीदमुच्यते— यथा एकस्मिन् घटाकाशे रजोधूमादिभिः युते संयुक्ते, न सर्वे घटाकाशादयः तद्रजोधूमादिभिः संयुज्यन्ते, तद्वत् जीवाः सुखादिभिः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000456.mp3", "sections": []}, {"id": "B_000457", "originalText": "ननु, एक एवात्मा, बाढम्, ननु न श्रुतं त्वया आकाशवत्सर्वसङ्घातेष्वेक एवात्मेति? यद्येक एवात्मा, तर्हि सर्वत्र सुखी दुःखी च स्यात्, न चेदं साङ्ख्यस्य चोद्यं सम्भवति, न हि साङ्ख्य आत्मनः सुखदुःखादिमत्त्वमिच्छति, बुद्धिसमवायाभ्युपगमात्सुखदुःखादीनाम्, न चोपलब्धिस्वरूपस्यात्मनो भेदकल्पनायां प्रमाणमस्ति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000457.mp3", "sections": []}, {"id": "B_000458", "originalText": "भेदाभावे प्रधानस्य पारार्थ्यानुपपत्तिरिति चेत्, न, प्रधानकृतस्यार्थस्यात्मन्यसमवायात्, यदि हि प्रधानकृतो बन्धो मोक्षो वा अर्थः पुरुषेषु भेदेन समवैति, ततः प्रधानस्य पारार्थ्यमात्मैकत्वे नोपपद्यत इति युक्ता पुरुषभेदकल्पना, न च साङ्ख्यैर्बन्धो मोक्षो वार्थः पुरुषसमवेतोऽभ्युपगम्यते, निर्विशेषाश्च चेतनमात्रा आत्मानोऽभ्युपगम्यन्ते, अतः पुरुषसत्तामात्रप्रयुक्तमेव प्रधानस्य पारार्थ्यं सिद्धम्, न तु पुरुषभेदप्रयुक्तमिति, अतः पुरुषभेदकल्पनायां न प्रधानस्य पारार्थ्यं हेतुः, न चान्यत्पुरुषभेदकल्पनायां प्रमाणमस्ति साङ्‍ख्यानाम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000458.mp3", "sections": []}, {"id": "B_000459", "originalText": "परसत्तामात्रमेव चैतन्निमित्तीकृत्य स्वयं बध्यते मुच्यते च प्रधानम्, परश्चोपलब्धिमात्रसत्तास्वरूपेण प्रधानप्रवृत्तौ हेतुः, न केनचिद्विशेषेणेति, केवलमूढतयैव पुरुषभेदकल्पना वेदार्थपरित्यागश्च।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000459.mp3", "sections": []}, {"id": "B_000460", "originalText": "ये त्वाहुर्वैशेषिकादयः इच्छादय आत्मसमवायिन इति, तदप्यसत्, स्मृतिहेतूनां संस्काराणामप्रदेशवत्यात्मन्यसमवायात्, आत्ममनःसंयोगाच्च स्मृत्युत्पत्तेः स्मृतिनियमानुपपत्तिः, युगपद्वा सर्वस्मृत्युत्पत्तिप्रसङ्गः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000460.mp3", "sections": []}, {"id": "B_000461", "originalText": "न च भिन्नजातीयानां स्पर्शादिहीनानामात्मनां मनआदिभिः सम्बन्धो युक्तः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000461.mp3", "sections": []}, {"id": "B_000462", "originalText": "न च द्रव्याद्रूपादयो गुणाः कर्मसामान्यविशेषसमवाया वा भिन्नाः सन्ति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000462.mp3", "sections": []}, {"id": "B_000463", "originalText": "परेषां यदि ह्यत्यन्तभिन्ना एव द्रव्यात्स्युः इच्छादयश्चात्मनः, तथा सति द्रव्येण तेषां सम्बन्धानुपपत्तिः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000463.mp3", "sections": []}, {"id": "B_000464", "originalText": "अयुतसिद्धानां समवायलक्षणः सम्बन्धो न विरुध्यत इति चेत्, न, इच्छादिभ्योऽनित्येभ्य आत्मनो नित्यस्य पूर्वसिद्धत्वान्नायुतसिद्धत्वोपपत्तिः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000464.mp3", "sections": []}, {"id": "B_000465", "originalText": "आत्मना अयुतसिद्धत्वे च इच्छादीनामात्मगतमहत्त्ववन्नित्यत्वप्रसङ्गः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000465.mp3", "sections": []}, {"id": "B_000466", "originalText": "स चानिष्टः, आत्मनोऽनिर्मोक्षप्रसङ्गात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000466.mp3", "sections": []}, {"id": "B_000467", "originalText": "समवायस्य च द्रव्यादन्यत्वे सति द्रव्येण सम्बन्धान्तरं वाच्यम्, यथा द्रव्यगुणयोः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000467.mp3", "sections": []}, {"id": "B_000468", "originalText": "समवायो नित्यसम्बन्ध एवेति न वाच्यमिति चेत्, तथा सति समवायसम्बन्धवतां नित्यसम्बन्धप्रसङ्गात्पृथक्त्वानुपपत्तिः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000468.mp3", "sections": []}, {"id": "B_000469", "originalText": "अत्यन्तपृथक्त्वे च द्रव्यादीनां स्पर्शवदस्पर्शद्रव्ययोरिव षष्ठ्यर्थानुपपत्तिः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000469.mp3", "sections": []}, {"id": "B_000470", "originalText": "इच्छाद्युपजनापायवद्गुणवत्त्वे च आत्मनोऽनित्यत्वप्रसङ्गः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000470.mp3", "sections": []}, {"id": "B_000471", "originalText": "देहफलादिवत्सावयवत्वं विक्रियावत्त्वं च देहादिवदेवेति दोषावपरिहार्यौ।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000471.mp3", "sections": []}, {"id": "B_000472", "originalText": "यथा त्वाकाशस्य अविद्याध्यारोपितघटाद्युपाधिकृतरजोधूममलवत्त्वादिदोषवत्त्वम्, तथा आत्मनः अविद्याध्यारोपितबुद्ध्याद्युपाधिकृतसुखदुःखादिदोषवत्त्वे बन्धमोक्षादयो व्यावहारिका न विरुध्यन्ते, सर्ववादिभिरविद्याकृतव्यवहाराभ्युपगमात् परमार्थानभ्युपगमाच्च।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000472.mp3", "sections": []}, {"id": "B_000473", "originalText": "तस्मादात्मभेदपरिकल्पना वृथैव तार्किकैः क्रियत इति॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000473.mp3", "sections": []}, {"id": "B_000474", "originalText": "रूपकार्यसमाख्याश्च भिद्यन्ते तत्र तत्र वै। आकाशस्य न भेदोऽस्ति तद्वज्जीवेषु निर्णयः॥ ६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000474.mp3", "sections": []}, {"id": "B_000475", "originalText": "कथं पुनरात्मभेदनिमित्त इव व्यवहार एकस्मिन्नात्मन्यविद्याकृत उपपद्यत इति, उच्यते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000475.mp3", "sections": []}, {"id": "B_000476", "originalText": "यथा इहाकाशे एकस्मिन्घटकरकापवरकाद्याकाशानामल्पत्वमहत्त्वादिरूपाणि भिद्यन्ते, तथा कार्यमुदकाहरणधारणशयनादि, समाख्याश्च घटाकाशः करकाकाश इत्याद्याः तत्कृताश्च भिन्ना दृश्यन्ते, तत्र तत्र वै व्यवहारविषये इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000476.mp3", "sections": []}, {"id": "B_000477", "originalText": "सर्वोऽयमाकाशे रूपादिभेदकृतो व्यवहारः अपरमार्थ एव।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000477.mp3", "sections": []}, {"id": "B_000478", "originalText": "परमार्थतस्त्वाकाशस्य न भेदोऽस्ति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000478.mp3", "sections": []}, {"id": "B_000479", "originalText": "न चाकाशभेदनिमित्तो व्यवहारोऽस्ति अन्तरेण परोपाधिकृतं द्वारम्। यथैतत्, तद्वद्देहोपाधिभेदकृतेषु जीवेषु घटाकाशस्थानीयेष्वात्मसु निरूपणात्कृतः बुद्धिमद्भिः निर्णयः निश्चय इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000479.mp3", "sections": []}, {"id": "B_000480", "originalText": "नाकाशस्य घटाकाशो विकारावयवौ यथा। नैवात्मनः सदा जीवो विकारावयवौ तथा॥ ७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000480.mp3", "sections": []}, {"id": "B_000481", "originalText": "ननु तत्र परमार्थकृत एव घटाकाशादिषु रूपकार्यादिभेदव्यवहार इति, नैतदस्ति, यस्मात्परमार्थाकाशस्य घटाकाशो न विकारः, यथा सुवर्णस्य रुचकादिः, यथा वा अपां फेनबुद्बुदहिमादिः, नाप्यवयवः, यथा वृक्षस्य शाखादिः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000481.mp3", "sections": []}, {"id": "B_000482", "originalText": "न तथा आकाशस्य घटाकाशो विकारावयवौ यथा, तथा नैवात्मनः परस्य परमार्थसतो महाकाशस्थानीयस्य घटाकाशस्थानीयो जीवः सदा सर्वदा यथोक्तदृष्टान्तवन्न विकारः, नाप्यवयवः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000482.mp3", "sections": []}, {"id": "B_000483", "originalText": "अत आत्मभेदकृतो व्यवहारो मृषैवेत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000483.mp3", "sections": []}, {"id": "B_000484", "originalText": "यथा भवति बालानां गगनं मलिनं मलैः। तथा भवत्यबुद्धानामात्मापि मलिनो मलैः॥ ८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000484.mp3", "sections": []}, {"id": "B_000485", "originalText": "यस्माद्यथा घटाकाशादिभेदबुद्धिनिबन्धनो रूपकार्यादिभेदव्यवहारः, तथा देहोपाधिजीवभेदकृतो जन्ममरणादिव्यवहारः, तस्मात्तत्कृतमेव क्लेशकर्मफलमलवत्त्वमात्मनः, न परमार्थत इत्येतमर्थं दृष्टान्तेन प्रतिपिपादयिषन्नाह— यथा भवति लोके बालानाम् अविवेकिनां गगनम् आकाशं घनरजोधूमादिमलैः मलिनं मलवत्, न गगनयाथात्म्यविवेकवताम्, तथा भवति आत्मा परोऽपि— यो विज्ञाता प्रत्यक्— क्लेशकर्मफलमलैर्मलिनः अबुद्धानां प्रत्यगात्मविवेकरहितानाम्, नात्मविवेकवताम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000485.mp3", "sections": []}, {"id": "B_000486", "originalText": "न ह्यूषरदेशः तृड्वत्प्राण्यध्यारोपितोदकफेनतरङ्गादिमान्, तथा नात्मा अबुधारोपितक्लेशादिमलैः मलिनो भवतीत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000486.mp3", "sections": []}, {"id": "B_000487", "originalText": "मरणे सम्भवे चैव गत्यागमनयोरपि। स्थितौ सर्वशरीरेषु चाकाशेनाविलक्षणः॥ ९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000487.mp3", "sections": []}, {"id": "B_000488", "originalText": "पुनरप्युक्तमेवार्थं प्रपञ्चयति— घटाकाशजन्मनाशगमनागमनस्थितिवत्सर्वशरीरेष्वात्मनो जन्ममरणादिराकाशेनाविलक्षणः प्रत्येतव्य इत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000488.mp3", "sections": []}, {"id": "B_000489", "originalText": "सङ्घाताः स्वप्नवत्सर्व आत्ममायाविसर्जिताः। आधिक्ये सर्वसाम्ये वा नोपपत्तिर्हि विद्यते॥ १०॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000489.mp3", "sections": []}, {"id": "B_000490", "originalText": "घटादिस्थानीयास्तु देहादिसङ्घाताः स्वप्नदृश्यदेहादिवन्मायाविकृतदेहादिवच्च आत्ममायाविसर्जिताः, आत्मनो माया अविद्या, तया प्रत्युपस्थापिताः, न परमार्थतः सन्तीत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000490.mp3", "sections": []}, {"id": "B_000491", "originalText": "यदि आधिक्यमधिकभावः तिर्यग्देहाद्यपेक्षया देवादिकार्यकरणसङ्घातानाम्, यदि वा सर्वेषां समतैव, तेषां न ह्युपपत्तिसम्भवः, सम्भवप्रतिपादको हेतुः न विद्यते नास्ति, हि यस्मात्, तस्मादविद्याकृता एव, न परमार्थतः सन्तीत्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000491.mp3", "sections": []}, {"id": "B_000492", "originalText": "रसादयो हि ये कोशा व्याख्यातास्तैत्तिरीयके। तेषामात्मा परो जीवः खं यथा सम्प्रकाशितः॥ ११॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000492.mp3", "sections": []}, {"id": "B_000493", "originalText": "उत्पत्त्यादिवर्जितस्याद्वयस्यास्यात्मतत्त्वस्य श्रुतिप्रमाणकत्वप्रदर्शनार्थं वाक्यान्युपन्यस्यन्ते— रसादयः अन्नरसमयः प्राणमय इत्येवमादयः कोशा इव कोशाः अस्यादेः, उत्तरोत्तरापेक्षया बहिर्भावात्पूर्वपूर्वस्य व्याख्याताः विस्पष्टमाख्याताः तैत्तिरीयके तैत्तिरीयकशाखोपनिषद्वल्ल्याम्, तेषां कोशानामात्मा येनात्मना पञ्चापि कोशा आत्मवन्तोऽन्तरतमेन।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000493.mp3", "sections": []}, {"id": "B_000494", "originalText": "स हि सर्वेषां जीवननिमित्तत्वाज्जीवः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000494.mp3", "sections": []}, {"id": "B_000495", "originalText": "कोऽसावित्याह— पर एवात्मा यः पूर्वम् ‘सत्यं ज्ञानमनन्तं ब्रह्म’ (तै.२.१.१) इति प्रकृतः, यस्मादात्मनः स्वप्नमायादिवदाकाशादिक्रमेण रसादयः कोशलक्षणाः सङ्घाता आत्ममायाविसर्जिता इत्युक्तम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000495.mp3", "sections": []}, {"id": "B_000496", "originalText": "स आत्मा अस्माभिः यथा खं तथेति सम्प्रकाशितः, ‘आत्मा ह्याकाशवत्’ (मा.का.३.३) इत्यादिश्लोकैः। न तार्किकपरिकल्पितात्मवत्पुरुषबुद्धिप्रमाणगम्य इत्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000496.mp3", "sections": []}, {"id": "B_000497", "originalText": "द्वयोर्द्वयोर्मधुज्ञाने परं ब्रह्म प्रकाशितम्। पृथिव्यामुदरे चैव यथाकाशः प्रकाशितः॥ १२॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000497.mp3", "sections": []}, {"id": "B_000498", "originalText": "किञ्च, अधिदैवतमध्यात्मं च तेजोमयोऽमृतमयः पुरुषः पृथिव्याद्यन्तर्गतो यो विज्ञाता पर एवात्मा ब्रह्म सर्वमिति द्वयोर्द्वयोः आ द्वैतक्षयात् परं ब्रह्म प्रकाशितम्, क्वेत्याह— ब्रह्मविद्याख्यं मधु अमृतम्, अमृतत्वं मोदनहेतुत्वात्, तद्विज्ञायते यस्मिन्निति मधुज्ञानं मधुब्राह्मणम्, तस्मिन्नित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000498.mp3", "sections": []}, {"id": "B_000499", "originalText": "किमिवेत्याह— पृथिव्याम् उदरे चैव यथा एक आकाशः अनुमानेन प्रकाशितः लोके, तद्वदित्यर्थः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000499.mp3", "sections": []}, {"id": "B_000500", "originalText": "जीवात्मनोरनन्यत्वमभेदेन प्रशस्यते। नानात्वं निन्द्यते यच्च तदेवं हि समञ्जसम्॥ १३॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000500.mp3", "sections": []}, {"id": "B_000501", "originalText": "यद्युक्तितः श्रुतितश्च निर्धारितं जीवस्य परस्य चात्मनोऽनन्यत्वम् अभेदेन प्रशस्यते स्तूयते शास्त्रेण व्यासादिभिश्च, यच्च सर्वप्राणिसाधारणं स्वाभाविकं शास्त्रबहिर्मुखैः कुतार्किकैर्विरचितं नानात्वदर्शनं निन्द्यते, ‘न तु तद्द्वितीयमस्ति’ (बृ.४.३.२३) ‘द्वितीयाद्वै भयं भवति’ (बृ.१.४.२) ‘उदरमन्तरं कुरुते, अथ तस्य भयं भवति’ (तै.२.७.१) ‘इदं सर्वं यदयमात्मा’ (बृ.२.४.६) ‘मृत्योः स मृत्युमाप्नोति य इह नानेव पश्यति’ (क.२.४.१०) इत्येवमादिवाक्यैरन्यैश्च ब्रह्मविद्भिः यच्चैतत्, तदेवं हि समञ्जसम् ऋज्ववबोधं न्याय्यमित्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000501.mp3", "sections": []}, {"id": "B_000502", "originalText": "यास्तु तार्किकपरिकल्पिताः कुदृष्टयः, ताः अनृज्व्यो निरूप्यमाणा न घटनां प्राञ्चन्तीत्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000502.mp3", "sections": []}, {"id": "B_000503", "originalText": "जीवात्मनोः पृथक्त्वं यत्प्रागुत्पत्तेः प्रकीर्तितम्। भविष्यद्वृत्त्या गौणं तन्मुख्यत्वं हि न युज्यते॥ १४॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000503.mp3", "sections": []}, {"id": "B_000504", "originalText": "ननु श्रुत्यापि जीवपरमात्मनोः पृथक्त्वं यत् प्रागुत्पत्तेः उत्पत्त्यर्थोपनिषद्वाक्येभ्यः पूर्वं प्रकीर्तितं कर्मकाण्डे अनेकशः कामभेदतः इदङ्कामः अदःकाम इति, परश्च ‘स दाधार पृथिवीं द्याम्’ (ऋ.१०.१२१.१) इत्यादिमन्त्रवर्णैः, तत्र कथं कर्मज्ञानकाण्डवाक्यविरोधे ज्ञानकाण्डवाक्यार्थस्यैवैकत्वस्य सामञ्जस्यमवधार्यत इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000504.mp3", "sections": []}, {"id": "B_000505", "originalText": "अत्रोच्यते— ‘यतो वा इमानि भूतानि जायन्ते’ (तै.३.१.१) ‘यथाग्नेः क्षुद्रा विस्फुलिङ्गाः’ (बृ.२.१.२०) ‘तस्माद्वा एतस्मादात्मन आकाशः सम्भूतः’ (तै.२.१.१) ‘तदैक्षत तत्तेजोऽसृजत’ (छा.६.२.३) इत्याद्युत्पत्त्यर्थोपनिषद्वाक्येभ्यः प्राक्पृथक्त्वं कर्मकाण्डे प्रकीर्तितं यत्, तन्न परमार्थतः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000505.mp3", "sections": []}, {"id": "B_000506", "originalText": "किं तर्हि? गौणम्, महाकाशघटाकाशादिभेदवत्, यथा ओदनं पचतीति भविष्यद्वृत्त्या, तद्वत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000506.mp3", "sections": []}, {"id": "B_000507", "originalText": "न हि भेदवाक्यानां कदाचिदपि मुख्यभेदार्थकत्वमुपपद्यते, स्वाभाविकाविद्यावत्प्राणिभेददृष्ट्यनुवादित्वादात्मभेदवाक्यानाम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000507.mp3", "sections": []}, {"id": "B_000508", "originalText": "इह च उपनिषत्सु उत्पत्तिप्रलयादिवाक्यैर्जीवपरात्मनोरेकत्वमेव प्रतिपिपादयिषितम् ‘तत्त्वमसि’ (छा.६.८.७) ‘अन्योऽसावन्योऽहमस्मीति न स वेद’ (बृ.१.४.१०) इत्यादिभिः, अत उपनिषत्स्वेकत्वं श्रुत्या प्रतिपिपादयिषितं भविष्यतीति भाविनीमिव वृत्तिमाश्रित्य लोके भेददृष्ट्यनुवादो गौण एवेत्यभिप्रायः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000508.mp3", "sections": []}, {"id": "B_000509", "originalText": "अथवा, ‘तदैक्षत... तत्तेजोऽसृजत’ (छा.६.२.३) इत्याद्युत्पत्तेः प्राक् ‘एकमेवाद्वितीयम्’ (छा.६.२.२) इत्येकत्वं प्रकीर्तितम्, तदेव च ‘तत्सत्यं स आत्मा, तत्त्वमसि’ (छा.६.८.७) इत्येकत्वं भविष्यतीति तां भविष्यद्वृत्तिमपेक्ष्य यज्जीवात्मनोः पृथक्त्वं यत्र क्वचिद्वाक्ये गम्यमानम्, तद्गौणम्, यथा ओदनं पचतीति, तद्वत्॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000509.mp3", "sections": []}, {"id": "B_000510", "originalText": "मृल्लोहविस्फुलिङ्गाद्यैः सृष्टिर्या चोदितान्यथा। उपायः सोऽवताराय नास्ति भेदः कथञ्चन॥ १५॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000510.mp3", "sections": []}, {"id": "B_000511", "originalText": "ननु यद्युत्पत्तेः प्रागजं सर्वमेकमेवाद्वितीयम्, तथापि उत्पत्तेरूर्ध्वं जातमिदं सर्वं जीवाश्च भिन्ना इति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000511.mp3", "sections": []}, {"id": "B_000512", "originalText": "मैवम्, अन्यार्थत्वादुत्पत्तिश्रुतीनाम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000512.mp3", "sections": []}, {"id": "B_000513", "originalText": "पूर्वमपि परिहृत एवायं दोषः— स्वप्नवदात्ममायाविसर्जिताः सङ्घाताः, घटाकाशोत्पत्तिभेदादिवज्जीवानामुत्पत्तिभेदादिरिति।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000513.mp3", "sections": []}, {"id": "B_000514", "originalText": "इत एव उत्पत्तिभेदादिश्रुतिभ्य आकृष्य इह पुनरुत्पत्तिश्रुतीनामैदम्पर्यप्रतिपिपादयिषयोपन्यासः मृल्लोहविस्फुलिङ्गादिदृष्टान्तोपन्यासैः सृष्टिः या च उदिता प्रकाशिता कल्पिता अन्यथान्यथा च, स सर्वः सृष्टिप्रकारो जीवपरमात्मैकत्वबुद्ध्यवतारायोपायोऽस्माकम्, यथा प्राणसंवादे वागाद्यासुरपाप्मवेधाद्याख्यायिका कल्पिता प्राणवैशिष्ट्यबोधावताराय, तदप्यसिद्धमिति चेत्, न, शाखाभेदेष्वन्यथान्यथा च प्राणादिसंवादश्रवणात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000514.mp3", "sections": []}, {"id": "B_000515", "originalText": "यदि हि वादः परमार्थ एवाभूत्, एकरूप एव संवादः सर्वशाखास्वश्रोष्यत, विरुद्धानेकप्रकारेण नाश्रोष्यत, श्रूयते तु, तस्मान्न तादर्थ्यं संवादश्रुतीनाम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000515.mp3", "sections": []}, {"id": "B_000516", "originalText": "तथोत्पत्तिवाक्यानि प्रत्येतव्यानि।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000516.mp3", "sections": []}, {"id": "B_000517", "originalText": "कल्पसर्गभेदात्संवादश्रुतीनामुत्पत्तिश्रुतीनां च प्रतिसर्गमन्यथात्वमिति चेत्, न, निष्प्रयोजनत्वाद्यथोक्तबुद्ध्यवतारप्रयोजनव्यतिरेकेण।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000517.mp3", "sections": []}, {"id": "B_000518", "originalText": "न ह्यन्यप्रयोजनवत्त्वं संवादोत्पत्तिश्रुतीनां शक्यं कल्पयितुम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000518.mp3", "sections": []}, {"id": "B_000519", "originalText": "तथात्वप्रत्तिपत्तये ध्यानार्थमिति चेत्, न, कलहोत्पत्तिप्रलयानां प्रतिपत्तेरनिष्टत्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000519.mp3", "sections": []}, {"id": "B_000520", "originalText": "तस्मादुत्पत्त्यादिश्रुतय आत्मैकत्वबुद्ध्यवतारायैव, नान्यार्थाः कल्पयितुं युक्ताः। अतो नास्त्युत्पत्त्यादिकृतो भेदः कथञ्चन॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000520.mp3", "sections": []}, {"id": "B_000521", "originalText": "आश्रमास्त्रिविधा हीनमध्यमोत्कृष्टदृष्टयः। उपासनोपदिष्टेयं तदर्थमनुकम्पया॥ १६॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000521.mp3", "sections": []}, {"id": "B_000522", "originalText": "यदि हि पर एवात्मा नित्यशुद्धबुद्धमुक्तस्वभाव एकः परमार्थतः सन् ‘एकमेवाद्वितीयम्’ (छा.६.२.२) इत्यादिश्रुतिभ्यः, असदन्यत्, किमर्थेयमुपासनोपदिष्टा ‘आत्मा वा अरे द्रष्टव्यः’ (बृ.२.४.५) ‘य आत्मापहतपाप्मा’ (छा.८.७.१) ‘स क्रतुं कुर्वीत’ (छा.३.१४.१) ‘आत्मेत्येवोपासीत’ (बृ.१.४.७) इत्यादिश्रुतिभ्यः, कर्माणि चाग्निहोत्रादीनि? शृणु तत्र कारणम्— आश्रमाः आश्रमिणोऽधिकृताः, वर्णिनश्च मार्गगाः, आश्रमशब्दस्य प्रदर्शनार्थत्वात्, त्रिविधाः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000522.mp3", "sections": []}, {"id": "B_000523", "originalText": "कथम्? हीनमध्यमोत्कृष्टदृष्टयः हीना निकृष्टा मध्यमा उत्कृष्टा च दृष्टिः दर्शनसामर्थ्यं येषां ते, मन्दमध्यमोत्तमबुद्धिसामर्थ्योपेता इत्यर्थः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000523.mp3", "sections": []}, {"id": "B_000524", "originalText": "उपासना उपदिष्टा इयं तदर्थं मन्दमध्यमदृष्ट्याश्रमाद्यर्थं कर्माणि च।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000524.mp3", "sections": []}, {"id": "B_000525", "originalText": "न चात्मैक एवाद्वितीय इति निश्चितोत्तमदृष्ट्यर्थम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000525.mp3", "sections": []}, {"id": "B_000526", "originalText": "दयालुना देवेनानुकम्पया सन्मार्गगाः सन्तः कथमिमामुत्तमामेकत्वदृष्टिं प्राप्नुयुरिति, ‘यन्मनसा न मनुते येनाहुर्मनो मतम्। तदेव ब्रह्म त्वं विद्धि नेदं यदिदमुपासते’ (के.१.५) ‘तत्त्वमसि’ (छा.६.८.७) ‘आत्मैवेदं सर्वम्’ (छा.७.२५.२) इत्यादिश्रुतिभ्यः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000526.mp3", "sections": []}, {"id": "B_000527", "originalText": "स्वसिद्धान्तव्यवस्थासु द्वैतिनो निश्चिता दृढम्। परस्परं विरुध्यन्ते तैरयं न विरुध्यते॥ १७॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000527.mp3", "sections": []}, {"id": "B_000528", "originalText": "शास्त्रोपपत्तिभ्यामवधारितत्वादद्वयात्मदर्शनं सम्यग्दर्शनम्, तद्बाह्यत्वान्मिथ्यादर्शनमन्यत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000528.mp3", "sections": []}, {"id": "B_000529", "originalText": "इतश्च मिथ्यादर्शनं द्वैतिनां रागद्वेषादिदोषास्पदत्वात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000529.mp3", "sections": []}, {"id": "B_000530", "originalText": "कथम्? स्वसिद्धान्तव्यवस्थासु स्वसिद्धान्तरचनानियमेषु कपिलकणादबुद्धार्हतादिदृष्ट्यनुसारिणो द्वैतिनो निश्चिताः, एवमेवैष परमार्थो नान्यथेति, तत्र तत्रानुरक्ताः प्रतिपक्षं चात्मनः पश्यन्तस्तं द्विषन्त इत्येवं रागद्वेषोपेताः स्वसिद्धान्तदर्शननिमित्तमेव परस्परम् अन्योन्यं विरुध्यन्ते।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000530.mp3", "sections": []}, {"id": "B_000531", "originalText": "तैरन्योन्यविरोधिभिरस्मदीयोऽयं वैदिकः सर्वानन्यत्वादात्मैकत्वदर्शनपक्षो न विरुध्यते, यथा स्वहस्तपादादिभिः। एवं रागद्वेषादिदोषानास्पदत्वादात्मैकत्वबुद्धिरेव सम्यग्दर्शनमित्यभिप्रायः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000531.mp3", "sections": []}, {"id": "B_000532", "originalText": "अद्वैतं परमार्थो हि द्वैतं तद्भेद उच्यते। तेषामुभयथा द्वैतं तेनायं न विरुध्यते॥ १८॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000532.mp3", "sections": []}, {"id": "B_000533", "originalText": "केन हेतुना तैर्न विरुध्यत इत्युच्यते— अद्वैतं परमार्थः, हि यस्मात् द्वैतं नानात्वं तस्याद्वैतस्य भेदः तद्भेदः, तस्य कार्यमित्यर्थः, ‘एकमेवाद्वितीयम्’ (छा.६.२.१) ‘तत्तेजोऽसृजत’ (छा.६.२.३) इति श्रुतेः, उपपत्तेश्च, स्वचित्तस्पन्दनाभावे समाधौ मूर्छायां सुषुप्तौ वा अभावात्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000533.mp3", "sections": []}, {"id": "B_000534", "originalText": "अतः तद्भेद उच्यते द्वैतम्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000534.mp3", "sections": []}, {"id": "B_000535", "originalText": "द्वैतिनां तु तेषां परमार्थतोऽपरमार्थतश्च उभयथापि द्वैतमेव, यदि च तेषां भ्रान्तानां द्वैतदृष्टिः अस्माकमद्वैतदृष्टिरभ्रान्तानाम्, तेनायं हेतुना अस्मत्पक्षो न विरुध्यते तैः, ‘इन्द्रो मायाभिः’ (बृ.२.५.१९) ‘न तु तद्द्वितीयमस्ति’ (बृ.४.३.२३) इति श्रुतेः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000535.mp3", "sections": []}, {"id": "B_000536", "originalText": "यथा मत्तगजारूढः उन्मत्तं भूमिष्ठम् ‘प्रतिगजारूढोऽहं गजं वाहय मां प्रति’ इति ब्रुवाणमपि तं प्रति न वाहयत्यविरोधबुद्ध्या, तद्वत्।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000536.mp3", "sections": []}, {"id": "B_000537", "originalText": "ततः परमार्थतो ब्रह्मविदात्मैव द्वैतिनाम्। तेनायं हेतुना अस्मत्पक्षो न विरुध्यते तैः॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000537.mp3", "sections": []}, {"id": "B_000538", "originalText": "मायया भिद्यते ह्येतन्नान्यथाजं कथञ्चन। तत्त्वतो भिद्यमाने हि मर्त्यताममृतं व्रजेत्॥ १९॥", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000538.mp3", "sections": []}, {"id": "B_000539", "originalText": "द्वैतमद्वैतभेद इत्युक्ते द्वैतमप्यद्वैतवत्परमार्थसदिति स्यात्कस्यचिदाशङ्केत्यत आह— यत्परमार्थसदद्वैतम्, मायया भिद्यते ह्येतत् तैमिरिकानेकचन्द्रवत् रज्जुः सर्पधारादिभिर्भेदैरिव, न परमार्थतः, निरवयवत्वादात्मनः।", "audioFile": "https://pub-04b3cc3397264adb849fe928d833533e.r2.dev/006_MandukyaBhashya/PB_hear2read_000539.mp3", "sections": []}, {"id": "B_000540", "originalText": "सावयवं ह्यवयवान्यथात्वेन भिद्यते, यथा मृत् घटादिभेदैः।", "audioFile": "https://pub-04b3cc3397264
