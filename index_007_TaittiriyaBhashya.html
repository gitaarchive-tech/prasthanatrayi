le": "PB_001231.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001232", "originalText": "को ह्येवान्यात्कः प्राण्यात्।", "padacchedaText": "", "audioFile": "PB_001232.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001233", "originalText": "यदेष आकाश आनन्दो न स्यात्।", "padacchedaText": "", "audioFile": "PB_001233.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001234", "originalText": "एष ह्येवानन्दयाति।", "padacchedaText": "", "audioFile": "PB_001234.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001235", "originalText": "यदा ह्येवैष एतस्मिन्नदृश्येऽनात्म्येऽनिरुक्तेऽनिलयनेऽभयं प्रतिष्ठां विन्दते।", "padacchedaText": "", "audioFile": "PB_001235.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001236", "originalText": "अथ सोऽभयं गतो भवति।", "padacchedaText": "", "audioFile": "PB_001236.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001237", "originalText": "यदा ह्येवैष एतस्मिन्नुदरमन्तरं कुरुते।", "padacchedaText": "", "audioFile": "PB_001237.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001238", "originalText": "अथ तस्य भयं भवति।", "padacchedaText": "", "audioFile": "PB_001238.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001239", "originalText": "तत्त्वेव भयं विदुषोऽमन्वानस्य। तदप्येष श्लोको भवति॥ १॥", "padacchedaText": "", "audioFile": "PB_001239.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001240", "originalText": "असद्वा इदमग्र आसीत्।", "padacchedaText": "", "audioFile": "PB_001240.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001241", "originalText": "असदिति व्याकृतनामरूपविशेषविपरीतरूपम् अव्याकृतं ब्रह्म उच्यते, न पुनरत्यन्तमेवासत्।", "padacchedaText": "", "audioFile": "PB_001241.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001242", "originalText": "न ह्यसतः सज्जन्मास्ति।", "padacchedaText": "", "audioFile": "PB_001242.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001243", "originalText": "इदम् इति नामरूपविशेषवद्व्याकृतं जगत्, अग्रे पूर्वं प्रागुत्पत्तेः ब्रह्मैव असच्छब्दवाच्यमासीत्।", "padacchedaText": "", "audioFile": "PB_001243.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001244", "originalText": "ततः असतः वै सत् प्रविभक्तनामरूपविशेषम् अजायत उत्पन्नम्।", "padacchedaText": "", "audioFile": "PB_001244.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001245", "originalText": "किं ततः प्रविभक्तं कार्यमिति— पितुरिव पुत्रः? नेत्याह।", "padacchedaText": "", "audioFile": "PB_001245.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001246", "originalText": "तत् असच्छब्दवाच्यं स्वयमेव आत्मानमेव अकुरुत कृतवत्।", "padacchedaText": "", "audioFile": "PB_001246.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001247", "originalText": "यस्मादेवम्, तस्मात् तत् ब्रह्मैव सुकृतं स्वयं कर्तृ उच्यते।", "padacchedaText": "", "audioFile": "PB_001247.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001248", "originalText": "स्वयं कर्तृ ब्रह्मेति प्रसिद्धं लोके सर्वकारणत्वात्।", "padacchedaText": "", "audioFile": "PB_001248.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001249", "originalText": "यस्माद्वा स्वयमकरोत्सर्वं सर्वात्मना, तस्मात्पुण्यरूपेणापि तदेव ब्रह्म कारणं सुकृतम् उच्यते।", "padacchedaText": "", "audioFile": "PB_001249.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001250", "originalText": "सर्वथापि तु फलसम्बन्धादिकारणं सुकृतशब्दवाच्यं प्रसिद्धं लोके।", "padacchedaText": "", "audioFile": "PB_001250.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001251", "originalText": "यदि पुण्यं यदि वा अन्यत् सा प्रसिद्धिः नित्ये चेतनकारणे सति उपपद्यते, तस्मादस्ति ब्रह्म, सुकृतप्रसिद्धेरिति।", "padacchedaText": "", "audioFile": "PB_001251.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001252", "originalText": "इतश्चास्ति, कुतः? रसत्वात्।", "padacchedaText": "", "audioFile": "PB_001252.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001253", "originalText": "कुतो रसत्वप्रसिद्धिर्ब्रह्मण इत्यत आह— यद्वै तत्सुकृतं रसो वै सः।", "padacchedaText": "", "audioFile": "PB_001253.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001254", "originalText": "रसो नाम तृप्तिहेतुः आनन्दकरो मधुराम्लादिः प्रसिद्धो लोके।", "padacchedaText": "", "audioFile": "PB_001254.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001255", "originalText": "रसमेव हि अयं लब्ध्वा प्राप्य आनन्दी सुखी भवति।", "padacchedaText": "", "audioFile": "PB_001255.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001256", "originalText": "नासत आनन्दहेतुत्वं दृष्टं लोके।", "padacchedaText": "", "audioFile": "PB_001256.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001257", "originalText": "बाह्यानन्दसाधनरहिता अपि अनीहा निरेषणा ब्राह्मणा बाह्यरसलाभादिव सानन्दा दृश्यन्ते विद्वांसः, नूनं ब्रह्मैव रसस्तेषाम्।", "padacchedaText": "", "audioFile": "PB_001257.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001258", "originalText": "तस्मादस्ति तत्तेषामानन्दकारणं रसवद्ब्रह्म।", "padacchedaText": "", "audioFile": "PB_001258.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001259", "originalText": "इतश्चास्ति, कुतः? प्राणनादिक्रियादर्शनात्।", "padacchedaText": "", "audioFile": "PB_001259.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001260", "originalText": "अयमपि हि पिण्डो जीवतः प्राणेन प्राणिति अपानेन अपानिति।", "padacchedaText": "", "audioFile": "PB_001260.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001261", "originalText": "एवं वायवीया ऐन्द्रियकाश्च चेष्टाः संहतैः कार्यकरणैर्निर्वर्त्यमाना दृश्यन्ते।", "padacchedaText": "", "audioFile": "PB_001261.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001262", "originalText": "तच्चैकार्थवृत्तित्वेन संहननं नान्तरेण चेतनमसंहतं सम्भवति, अन्यत्रादर्शनात्।", "padacchedaText": "", "audioFile": "PB_001262.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001263", "originalText": "तदाह— यत् यदि एषः आकाशे परमे व्योम्नि गुहायां निहित आनन्दो न स्यात् न भवेत्, को ह्येव लोके अन्यात् अपानचेष्टां कुर्यादित्यर्थः।", "padacchedaText": "", "audioFile": "PB_001263.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001264", "originalText": "कः प्राण्यात् प्राणनं वा कुर्यात्, तस्मादस्ति तद्ब्रह्म, यदर्थाः कार्यकरणप्राणनादिचेष्टाः, तत्कृत एव च आनन्दो लोकस्य।", "padacchedaText": "", "audioFile": "PB_001264.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001265", "originalText": "कुतः? एष ह्येव पर आत्मा आनन्दयाति आनन्दयति सुखयति लोकं धर्मानुरूपम्।", "padacchedaText": "", "audioFile": "PB_001265.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001266", "originalText": "स एवात्मा आनन्दरूपोऽविद्यया परिच्छिन्नो विभाव्यते प्राणिभिरित्यर्थः।", "padacchedaText": "", "audioFile": "PB_001266.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001267", "originalText": "भयाभयहेतुत्वाद्विद्वदविदुषोरस्ति तद्ब्रह्म।", "padacchedaText": "", "audioFile": "PB_001267.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001268", "originalText": "सद्वस्त्वाश्रयणेन हि अभयं भवति, नासद्वस्त्वाश्रयणेन भयनिवृत्तिरुपपद्यते।", "padacchedaText": "", "audioFile": "PB_001268.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001269", "originalText": "कथमभयहेतुत्वमिति, उच्यते— यदा ह्येव यस्मात् एषः साधकः एतस्मिन् ब्रह्मणि— किंविशिष्टे? अदृश्ये दृश्यं नाम द्रष्टव्यं विकारः, दर्शनार्थत्वाद्विकारस्य, न दृश्यम् अदृश्यम्, अविकार इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001269.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001270", "originalText": "एतस्मिन्नदृश्ये अविकारेऽविषयभूते, अनात्म्ये अशरीरे, यस्माददृश्यं तस्मादनात्म्यम्, यस्मादनात्म्यं तस्मादनिरुक्तम्, विशेषो हि निरुच्यते, विशेषश्च विकारः, अविकारं च ब्रह्म, सर्वविकारहेतुत्वात्, तस्मात् अनिरुक्तम्।", "padacchedaText": "", "audioFile": "PB_001270.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001271", "originalText": "यत एवम्, तस्मादनिलयनं निलयनं नीड आश्रयः न निलयनम् अनिलयनम् अनाधारं तस्मिन् एतस्मिन् अदृश्येऽनात्म्येऽनिरुक्तेऽनिलयने सर्वकार्यधर्मविलक्षणे ब्रह्मणीति वाक्यार्थः।", "padacchedaText": "", "audioFile": "PB_001271.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001272", "originalText": "अभयमिति क्रियाविशेषणम्।", "padacchedaText": "", "audioFile": "PB_001272.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001273", "originalText": "अभयामिति वा लिङ्गान्तरं परिणम्यते।", "padacchedaText": "", "audioFile": "PB_001273.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001274", "originalText": "प्रतिष्ठां स्थितिमात्मभावं विन्दते लभते।", "padacchedaText": "", "audioFile": "PB_001274.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001275", "originalText": "अथ तदा सः तस्मिन्नानात्वस्य भयहेतोरविद्याकृतस्यादर्शनादभयं गतो भवति।", "padacchedaText": "", "audioFile": "PB_001275.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001276", "originalText": "स्वरूपप्रतिष्ठो ह्यसौ यदा भवति, तदा नान्यत्पश्यति नान्यच्छृणोति नान्यद्विजानाति।", "padacchedaText": "", "audioFile": "PB_001276.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001277", "originalText": "अन्यस्य ह्यन्यतो भयं भवति, न आत्मन एव आत्मनो भयं युक्तम्, तस्मात् आत्मैव आत्मनः अभयकारणम्।", "padacchedaText": "", "audioFile": "PB_001277.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001278", "originalText": "सर्वतो हि निर्भया ब्राह्मणा दृश्यन्ते सत्सु भयहेतुषु, तच्चायुक्तमसति भयत्राणे ब्रह्मणि।", "padacchedaText": "", "audioFile": "PB_001278.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001279", "originalText": "तस्मात्तेषामभयदर्शनादस्ति तदभयकारणं ब्रह्मेति।", "padacchedaText": "", "audioFile": "PB_001279.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001280", "originalText": "कदा असौ अभयं गतो भवति साधकः? यदा नान्यत्पश्यति आत्मनि च अन्तरं भेदं न कुरुते, तदा अभयं गतो भवतीत्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_001280.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001281", "originalText": "यदा पुनरविद्यावस्थायां हि यस्मात् एषः अविद्यावान् अविद्यया प्रत्युपस्थापितं वस्तु तैमिरिकद्वितीयचन्द्रवत्पश्यत्यात्मनि च एतस्मिन् ब्रह्मणि, उत अपि, अरम् अल्पमपि, अन्तरं छिद्रं भेददर्शनं कुरुते, भेददर्शनमेव हि भयकारणम्, अल्पमपि भेदं पश्यतीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001281.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001282", "originalText": "अथ तस्माद्भेददर्शनाद्धेतोः तस्य भेददर्शिनः आत्मनो भयं भवति।", "padacchedaText": "", "audioFile": "PB_001282.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001283", "originalText": "तस्मादात्मैवात्मनो भयकारणमविदुषः, तदेतदाह— तत् ब्रह्म त्वेव भयं भेददर्शिनो विदुषः ईश्वरोऽन्यो मत्तः अहमन्यः संसारीत्येवंविदुषः भेददृष्टमीश्वराख्यं तदेव ब्रह्म अल्पमप्यन्तरं कुर्वतः भयं भवति एकत्वेन अमन्वानस्य।", "padacchedaText": "", "audioFile": "PB_001283.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001284", "originalText": "तस्मात् विद्वानप्यविद्वानेव असौ, योऽयमेकमभिन्नमात्मतत्त्वं न पश्यति।", "padacchedaText": "", "audioFile": "PB_001284.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001285", "originalText": "उच्छेदहेतुदर्शनाद्ध्युच्छेद्याभिमतस्य भयं भवति, अनुच्छेद्यो ह्युच्छेदहेतुः, तत्र असत्युच्छेदहेतौ उच्छेद्ये न तद्दर्शनकार्यं भयं युक्तम्।", "padacchedaText": "", "audioFile": "PB_001285.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001286", "originalText": "सर्वं च जगद्भयवद्दृश्यते।", "padacchedaText": "", "audioFile": "PB_001286.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001287", "originalText": "तस्माज्जगतो भयदर्शनाद्गम्यते— नूनं तदस्ति भयकारणमुच्छेदहेतुरनुच्छेद्यात्मकम्, यतो जगद्बिभेतीति। तत् एतस्मिन्नप्यर्थे एषः श्लोकः भवति॥", "padacchedaText": "", "audioFile": "PB_001287.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001288", "originalText": "इति सप्तमनुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_001288.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001289", "originalText": "अष्टमोऽनुवाकः\nभीषास्माद्वातः पवते।", "padacchedaText": "", "audioFile": "PB_001289.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001290", "originalText": "भीषोदेति सूर्यः।", "padacchedaText": "", "audioFile": "PB_001290.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001291", "originalText": "भीषास्मादग्निश्चेन्द्रश्च।", "padacchedaText": "", "audioFile": "PB_001291.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001292", "originalText": "मृत्युर्धावति पञ्चम इति।", "padacchedaText": "", "audioFile": "PB_001292.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001293", "originalText": "सैषानन्दस्य मीमां सा भवति।", "padacchedaText": "", "audioFile": "PB_001293.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001294", "originalText": "युवा स्यात्साधुयुवाध्यायकः।", "padacchedaText": "", "audioFile": "PB_001294.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001295", "originalText": "आशिष्ठो दृढिष्ठो बलिष्ठः।", "padacchedaText": "", "audioFile": "PB_001295.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001296", "originalText": "तस्येयं पृथिवी सर्वा वित्तस्य पूर्णा स्यात्।", "padacchedaText": "", "audioFile": "PB_001296.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001297", "originalText": "स एको मानुष आनन्दः। ते ये शतं मानुषा आनन्दाः॥ १॥", "padacchedaText": "", "audioFile": "PB_001297.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001298", "originalText": "स एको मनुष्यगन्धर्वाणामानन्दः।", "padacchedaText": "", "audioFile": "PB_001298.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001299", "originalText": "श्रोत्रियस्य चाकामहतस्य।", "padacchedaText": "", "audioFile": "PB_001299.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001300", "originalText": "ते ये शतं मनुष्यगन्धर्वाणामानन्दाः।", "padacchedaText": "", "audioFile": "PB_001300.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001301", "originalText": "स एको देवगन्धर्वाणामानन्दः।", "padacchedaText": "", "audioFile": "PB_001301.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001302", "originalText": "श्रोत्रियस्य चाकामहतस्य।", "padacchedaText": "", "audioFile": "PB_001302.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001303", "originalText": "ते ये शतं देवगन्धर्वाणामानन्दाः।", "padacchedaText": "", "audioFile": "PB_001303.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001304", "originalText": "स एकः पितॄणां चिरलोकलोकानामानन्दः।", "padacchedaText": "", "audioFile": "PB_001304.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001305", "originalText": "श्रोत्रियस्य चाकामहतस्य।", "padacchedaText": "", "audioFile": "PB_001305.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001306", "originalText": "ते ये शतं पितॄणां चिरलोकलोकानामानन्दाः। स एक आजानजानां देवानामानन्दः॥ २॥", "padacchedaText": "", "audioFile": "PB_001306.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001307", "originalText": "श्रोत्रियस्य चाकामहतस्य।", "padacchedaText": "", "audioFile": "PB_001307.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001308", "originalText": "ते ये शतमाजानजानां देवानामानन्दाः।", "padacchedaText": "", "audioFile": "PB_001308.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001309", "originalText": "स एकः कर्मदेवानां देवानामानन्दः।", "padacchedaText": "", "audioFile": "PB_001309.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001310", "originalText": "ये कर्मणा देवानपियन्ति।", "padacchedaText": "", "audioFile": "PB_001310.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001311", "originalText": "श्रोत्रियस्य चाकामहतस्य।", "padacchedaText": "", "audioFile": "PB_001311.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001312", "originalText": "ते ये शतं कर्मदेवानां देवानामानन्दाः।", "padacchedaText": "", "audioFile": "PB_001312.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001313", "originalText": "स एको देवानामानन्दः।", "padacchedaText": "", "audioFile": "PB_001313.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001314", "originalText": "श्रोत्रियस्य चाकामहतस्य।", "padacchedaText": "", "audioFile": "PB_001314.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id" Text": "", "audioFile": "PB_001327.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001328", "originalText": "मृत्युर्धावति पञ्चम इति।", "padacchedaText": "", "audioFile": "PB_001328.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001329", "originalText": "वातादयो हि महार्हाः स्वयमीश्वराः सन्तः पवनादिकार्येष्वायासबहुलेषु नियताः प्रवर्तन्ते, तद्युक्तं प्रशास्तरि सति, यस्मात् नियमेन तेषां प्रवर्तनम्, तस्मादस्ति भयकारणं तेषां प्रशास्तृ ब्रह्म।", "padacchedaText": "", "audioFile": "PB_001329.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001330", "originalText": "यतस्ते भृत्या इव राज्ञः अस्मात् ब्रह्मणः भयेन प्रवर्तन्ते तच्च भयकारणमानन्दं ब्रह्म।", "padacchedaText": "", "audioFile": "PB_001330.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001331", "originalText": "तस्य अस्य ब्रह्मणः आनन्दस्य एषा मीमांसा विचारणा भवति। किमानन्दस्य मीमांस्यमिति, उच्यते— किमानन्दो विषयविषयिसम्बन्धजनितः लौकिकानन्दवत्, आहोस्वित् स्वाभाविकः, इत्येवमेषा आनन्दस्य मीमांसा॥", "padacchedaText": "", "audioFile": "PB_001331.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001332", "originalText": "तत्र लौकिक आनन्दो बाह्याध्यात्मिकसाधनसम्पत्तिनिमित्त उत्कृष्टः।", "padacchedaText": "", "audioFile": "PB_001332.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001333", "originalText": "सः य एष निर्दिश्यते ब्रह्मानन्दानुगमार्थम्।", "padacchedaText": "", "audioFile": "PB_001333.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001334", "originalText": "अनेन हि प्रसिद्धेन आनन्देन व्यावृत्तविषयबुद्धिगम्य आनन्दोऽनुगन्तुं शक्यते।", "padacchedaText": "", "audioFile": "PB_001334.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001335", "originalText": "लौकिकोऽप्यानन्दः ब्रह्मानन्दस्यैव मात्रा, अविद्यया तिरस्क्रियमाणे विज्ञाने उत्कृष्यमाणायां च अविद्यायां ब्रह्मादिभिः कर्मवशात् यथाविज्ञानं विषयादिसाधनसम्बन्धवशाच्च विभाव्यमानश्च लोकेऽनवस्थितो लौकिकः सम्पद्यते, स एव अविद्याकामकर्मापकर्षेण मनुष्यगन्धर्वाद्युत्तरोत्तरभूमिषु अकामहतविद्वच्छ्रोत्रियप्रत्यक्षो विभाव्यते शतगुणोत्तरोत्तरोत्कर्षेण यावद्धिरण्यगर्भस्य ब्रह्मण आनन्द इति॥", "padacchedaText": "", "audioFile": "PB_001335.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001336", "originalText": "निरस्ते त्वविद्याकृते विषयविषयिविभागे, विद्यया स्वाभाविकः परिपूर्णः एकः आनन्दः अद्वैतः भवतीत्येतमर्थं विभावयिष्यन्नाह— युवा प्रथमवयाः, साधुयुवेति साधुश्चासौ युवा चेति यूनो विशेषणम्, युवाप्यसाधुर्भवति साधुरप्ययुवा, अतो विशेषणं युवा स्यात्साधुयुवेति, अध्यायकः अधीतवेदः।", "padacchedaText": "", "audioFile": "PB_001336.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001337", "originalText": "आशिष्ठः आशास्तृतमः, दृढिष्ठः दृढतमः, बलिष्ठः बलवत्तमः, एवमाध्यात्मिकसाधनसम्पन्नः।", "padacchedaText": "", "audioFile": "PB_001337.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001338", "originalText": "तस्येयं पृथिवी उर्वी सर्वा वित्तस्य वित्तेनोपभोगसाधनेन दृष्टार्थेनादृष्टार्थेन च कर्मसाधनेन सम्पन्ना पूर्णा राजा पृथिवीपतिरित्यर्थः।", "padacchedaText": "", "audioFile": "PB_001338.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001339", "originalText": "तस्य च य आनन्दः, सः एकः मानुषः मनुष्याणां प्रकृष्टः एक आनन्दः।", "padacchedaText": "", "audioFile": "PB_001339.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001340", "originalText": "ते ये शतं मानुषा आनन्दाः, स एको मनुष्यगन्धर्वाणामानन्दः, मानुषानन्दात् शतगुणेनोत्कृष्टः मनुष्यगन्धर्वाणामानन्दः भवति।", "padacchedaText": "", "audioFile": "PB_001340.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001341", "originalText": "मनुष्याः सन्तः कर्मविद्याविशेषात् गन्धर्वत्वं प्राप्ता मनुष्यगन्धर्वाः।", "padacchedaText": "", "audioFile": "PB_001341.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001342", "originalText": "ते ह्यन्तर्धानादिशक्तिसम्पन्नाः सूक्ष्मकार्यकरणाः, तस्मात्प्रतिघाताल्पत्वं तेषां द्वन्द्वप्रतिघातशक्तिसाधनसम्पत्तिश्च।", "padacchedaText": "", "audioFile": "PB_001342.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001343", "originalText": "ततः अप्रतिहन्यमानस्य प्रतीकारवतः मनुष्यगन्धर्वस्य स्याच्चित्तप्रसादः।", "padacchedaText": "", "audioFile": "PB_001343.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001344", "originalText": "तत्प्रसादविशेषात्सुखविशेषाभिव्यक्तिः।", "padacchedaText": "", "audioFile": "PB_001344.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001345", "originalText": "एवं पूर्वस्याः पूर्वस्या भूमेरुत्तरस्यामुत्तरस्यां भूमौ प्रसादविशेषतः शतगुणेन आनन्दोत्कर्ष उपपद्यते।", "padacchedaText": "", "audioFile": "PB_001345.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001346", "originalText": "प्रथमं तु अकामहताग्रहणं मनुष्यविषयभोगकामानभिहतस्य श्रोत्रियस्य मनुष्यानन्दात् शतगुणेन आनन्दोत्कर्षः मनुष्यगन्धर्वेण तुल्यो वक्तव्य इत्येवमर्थम्।", "padacchedaText": "", "audioFile": "PB_001346.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001347", "originalText": "साधुयुवा अध्यायक इति श्रोत्रियत्वावृजिनत्वे गृह्येते।", "padacchedaText": "", "audioFile": "PB_001347.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001348", "originalText": "ते ह्यविशिष्टे सर्वत्र।", "padacchedaText": "", "audioFile": "PB_001348.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001349", "originalText": "अकामहतत्वं तु विषयोत्कर्षापकर्षतः सुखोत्कर्षापकर्षाय विशेष्यते।", "padacchedaText": "", "audioFile": "PB_001349.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001350", "originalText": "अतः अकामहतग्रहणम्, तद्विशेषतः शतगुणसुखोत्कर्षोपलब्धेः अकामहतत्वस्य परमानन्दप्राप्तिसाधनत्वविधानार्थम्।", "padacchedaText": "", "audioFile": "PB_001350.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001351", "originalText": "व्याख्यातमन्यत्।", "padacchedaText": "", "audioFile": "PB_001351.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001352", "originalText": "देवगन्धर्वा जातित एव।", "padacchedaText": "", "audioFile": "PB_001352.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001353", "originalText": "चिरलोकलोकानामिति पितॄणां विशेषणम्।", "padacchedaText": "", "audioFile": "PB_001353.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001354", "originalText": "चिरकालस्थायी लोको येषां पितॄणाम्, ते चिरलोकलोका इति।", "padacchedaText": "", "audioFile": "PB_001354.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001355", "originalText": "आजान इति देवलोकः तस्मिन्नाजाने जाता आजानजा देवाः, स्मार्तकर्मविशेषतो देवस्थानेषु जाताः।", "padacchedaText": "", "audioFile": "PB_001355.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001356", "originalText": "कर्मदेवा ये वैदिकेन कर्मणा अग्निहोत्रादिना केवलेन देवानपियन्ति।", "padacchedaText": "", "audioFile": "PB_001356.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001357", "originalText": "देवा इति त्रयस्त्रिंशद्धविर्भुजः, इन्द्रस्तेषां स्वामी, तस्य आचार्यो बृहस्पतिः।", "padacchedaText": "", "audioFile": "PB_001357.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001358", "originalText": "प्रजापतिः विराट् त्रैलोक्यशरीरो ब्रह्मा समष्टिव्यष्टिरूपः संसारमण्डलव्यापी।", "padacchedaText": "", "audioFile": "PB_001358.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001359", "originalText": "यत्रैते आनन्दभेदा एकतां गच्छन्ति, धर्मश्च तन्निमित्तः ज्ञानं च तद्विषयम् अकामहतत्वं च निरतिशयं यत्र, स एष हिरण्यगर्भो ब्रह्मा, तस्यैष आनन्दः श्रोत्रियेण अवृजिनेन अकामहतेन च सर्वतः प्रत्यक्षमुपलभ्यते।", "padacchedaText": "", "audioFile": "PB_001359.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001360", "originalText": "तस्मादेतानि त्रीणि साधनानीत्यवगम्यते।", "padacchedaText": "", "audioFile": "PB_001360.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001361", "originalText": "तत्र श्रोत्रियत्वावृजिनत्वे नियते अकामहतत्वं तु उत्कृष्यत इति प्रकृष्टसाधनता अवगम्यते।", "padacchedaText": "", "audioFile": "PB_001361.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001362", "originalText": "तस्य अकामहतत्वप्रकर्षतश्चोपलभ्यमानः श्रोत्रियप्रत्यक्षो ब्रह्मण आनन्दः यस्य परमानन्दस्य मात्रा एकदेशः, ‘एतस्यैवानन्दस्यान्यानि भूतानि मात्रामुपजीवन्ति’ (बृ.४.३.३२) इति श्रुत्यन्तरात्।", "padacchedaText": "", "audioFile": "PB_001362.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001363", "originalText": "स एष आनन्दः— यस्य मात्रा समुद्राम्भस इव विप्रुषः प्रविभक्ताः यत्रैकतां गताः— स एष परमानन्दः स्वाभाविकः, अद्वैतात्, आनन्दानन्दिनोश्च अविभागोऽत्र॥", "padacchedaText": "", "audioFile": "PB_001363.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001364", "originalText": "तदेतन्मीमांसाफलमुपसंह्रियते—\nस यश्चायं पुरुषे।", "padacchedaText": "", "audioFile": "PB_001364.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001365", "originalText": "यश्चासावादित्ये।", "padacchedaText": "", "audioFile": "PB_001365.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001366", "originalText": "स एकः।", "padacchedaText": "", "audioFile": "PB_001366.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001367", "originalText": "स य एवंवित्।", "padacchedaText": "", "audioFile": "PB_001367.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001368", "originalText": "अस्माल्लोकात्प्रेत्य।", "padacchedaText": "", "audioFile": "PB_001368.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001369", "originalText": "एतमन्नमयमात्मानमुपसङ्क्रामति।", "padacchedaText": "", "audioFile": "PB_001369.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001370", "originalText": "एतं प्राणमयमात्मानमुपसङ्क्रामति।", "padacchedaText": "", "audioFile": "PB_001370.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001371", "originalText": "एतं मनोमयमात्मानमुपसङ्क्रामति।", "padacchedaText": "", "audioFile": "PB_001371.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001372", "originalText": "एतं विज्ञानमयमात्मानमुपसङ्क्रामति।", "padacchedaText": "", "audioFile": "PB_001372.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001373", "originalText": "एतमानन्दमयमात्मानमुपसङ्क्रामति। तदप्येष श्लोको भवति॥ ५॥", "padacchedaText": "", "audioFile": "PB_001373.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001374", "originalText": "स यश्चायं पुरुष इति।", "padacchedaText": "", "audioFile": "PB_001374.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001375", "originalText": "यः गुहायां निहितः परमे व्योम्नि आकाशादिकार्यं सृष्ट्वा अन्नमयान्तम्, तदेवानुप्रविष्टः, सः य इति निश्चीयते।", "padacchedaText": "", "audioFile": "PB_001375.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001376", "originalText": "कोऽसौ? अयं पुरुषे।", "padacchedaText": "", "audioFile": "PB_001376.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001377", "originalText": "यश्चासावादित्ये यः परमानन्दः श्रोत्रियप्रत्यक्षो निर्दिष्टः, यस्यैकदेशं ब्रह्मादीनि भूतानि सुखार्हाण्युपजीवन्ति, सः यश्चासावादित्ये इति निर्दिश्यते।", "padacchedaText": "", "audioFile": "PB_001377.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001378", "originalText": "स एकः भिन्नप्रदेशघटाकाशाकाशैकत्ववत्।", "padacchedaText": "", "audioFile": "PB_001378.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001379", "originalText": "ननु तन्निर्देशे स यश्चायं पुरुष इत्यविशेषतोऽध्यात्मं न युक्तो निर्देशः, यश्चायं दक्षिणेऽक्षन्निति तु युक्तः, प्रसिद्धत्वात्।", "padacchedaText": "", "audioFile": "PB_001379.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001380", "originalText": "न, पराधिकारात्।", "padacchedaText": "", "audioFile": "PB_001380.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001381", "originalText": "परो ह्यात्मा अत्र अधिकृतः ‘अदृश्येऽनात्म्ये’ ‘भीषास्माद्वातः पवते’ ‘सैषानन्दस्य मीमांसा’ इति।", "padacchedaText": "", "audioFile": "PB_001381.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001382", "originalText": "न हि अकस्मादप्रकृतो युक्तो निर्देष्टुम्, परमात्मविज्ञानं च विवक्षितम्।", "padacchedaText": "", "audioFile": "PB_001382.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001383", "originalText": "तस्मात् पर एव निर्दिश्यते— स एक इति।", "padacchedaText": "", "audioFile": "PB_001383.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001384", "originalText": "नन्वानन्दस्य मीमांसा प्रकृता, तस्या अपि फलमुपसंहर्तव्यम्।", "padacchedaText": "", "audioFile": "PB_001384.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001385", "originalText": "अभिन्नः स्वाभाविकः आनन्दः परमात्मैव, न विषयविषयिसम्बन्धजनित इति।", "padacchedaText": "", "audioFile": "PB_001385.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001386", "originalText": "ननु तदनुरूप एव अयं निर्देशः— ‘स यश्चायं पुरुषे यश्चासावादित्ये स एकः’ इति भिन्नाधिकरणस्थविशेषोपमर्देन।", "padacchedaText": "", "audioFile": "PB_001386.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001387", "originalText": "नन्वेवमप्यादित्यविशेषग्रहणमनर्थकम्, न अनर्थकम्, उत्कर्षापकर्षापोहार्थत्वात्।", "padacchedaText": "", "audioFile": "PB_001387.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001388", "originalText": "द्वैतस्य हि यो मूर्तामूर्तलक्षणस्य पर उत्कर्षः सवित्रभ्यन्तर्गतः स चेत्पुरुषगतविशेषोपमर्देन परमानन्दमपेक्ष्य समो भवति, न कश्चिदुत्कर्षोऽपकर्षो वा तां गतिं गतस्येत्यभयं प्रतिष्ठां विन्दत इत्युपपन्नम्॥", "padacchedaText": "", "audioFile": "PB_001388.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001389", "originalText": "अस्ति नास्तीत्यनुप्रश्नो व्याख्यातः।", "padacchedaText": "", "audioFile": "PB_001389.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001390", "originalText": "कार्यरसलाभप्राणनाभयप्रतिष्ठाभयदर्शनोपपत्तिभ्योऽस्त्येव तदाकाशादिकारणं ब्रह्मेत्यपाकृतः अनुप्रश्न एकः, द्वावन्यानुप्रश्नौ विद्वदविदुषोर्ब्रह्मप्राप्त्यप्राप्तिविषयौ, तत्र विद्वान्समश्नुते न समश्नुत इत्यनुप्रश्नोऽन्त्यः, तदपाकरणायोच्यते।", "padacchedaText": "", "audioFile": "PB_001390.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001391", "originalText": "मध्यमोऽनुप्रश्नः अन्त्यापाकरणादेव अपाकृत इति तदपाकरणाय न यत्यते।", "padacchedaText": "", "audioFile": "PB_001391.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001392", "originalText": "स यः कश्चित् एवं यथोक्तं ब्रह्म उत्सृज्योत्कर्षापकर्षमद्वैतं सत्यं ज्ञानमनन्तमस्मीत्येवं वेत्तीति एवंवित्, एवंशब्दस्य प्रकृतपरामर्शार्थत्वात्।", "padacchedaText": "", "audioFile": "PB_001392.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001393", "originalText": "स किम्? अस्माल्लोकात्प्रेत्य दृष्टादृष्टेष्टविषयसमुदायो हि अयं लोकः, तस्मादस्माल्लोकात्प्रेत्य प्रत्यावृत्य निरपेक्षो भूत्वा एतं यथाव्याख्यातम् अन्नमयमात्मानमुपसङ्क्रामति विषयजातमन्नमयात्पिण्डात्मनो व्यतिरिक्तं न पश्यति, सर्वं स्थूलभूतमन्नमयमात्मानं पश्यतीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001393.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001394", "originalText": "ततः अभ्यन्तरमेतं प्राणमयं सर्वान्नमयात्मस्थमविभक्तम्।", "padacchedaText": "", "audioFile": "PB_001394.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001395", "originalText": "अथैतं मनोमयं विज्ञानमयमानन्दमयमात्मानमुपसङ्क्रामति। अथादृश्येऽनात्म्येऽनिरुक्तेऽनिलयनेऽभयं प्रतिष्ठां विन्दते॥", "padacchedaText": "", "audioFile": "PB_001395.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001396", "originalText": "तत्रैतच्चिन्त्यम्— कोऽयमेवंवित्, कथं वा सङ्क्रामतीति, किं परस्मादात्मनोऽन्यः सङ्क्रमणकर्ता प्रविभक्तः, उत स एवेति।", "padacchedaText": "", "audioFile": "PB_001396.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001397", "originalText": "किं ततः? यद्यन्यः स्यात्, श्रुतिविरोधः— ‘तत्सृष्ट्वा तदेवानुप्राविशत्’ (तै.२.६.१) ‘अन्योऽसावन्योऽहमस्मीति।", "padacchedaText": "", "audioFile": "PB_001397.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001398", "originalText": "न स वेद’ (बृ.१.४.१०) ‘एकमेवाद्वितीयम्’ (छा.६.२.१) ‘तत्त्वमसि’ (छा.६.८.१६) इति।", "padacchedaText": "", "audioFile": "PB_001398.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001399", "originalText": "अथ स एव आनन्दमयमात्मानमुपसङ्क्रामतीति, कर्मकर्तृत्वानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_001399.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001400", "originalText": "परस्यैव च संसारित्वं पराभावो वा।", "padacchedaText": "", "audioFile": "PB_001400.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001401", "originalText": "यद्युभयथा प्राप्तो दोषो न परिहर्तुं शक्यत इति, व्यर्था चिन्ता।", "padacchedaText": "", "audioFile": "PB_001401.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001402", "originalText": "अथ अन्यतरस्मिन्पक्षे दोषाप्राप्तिः तृतीये वा पक्षे अदुष्टे, स एव शास्त्रार्थ इति व्यर्थैव चिन्ता, न, तन्निर्धारणार्थत्वात्।", "padacchedaText": "", "audioFile": "PB_001402.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001403", "originalText": "सत्यं प्राप्तो दोषो न शक्यः परिहर्तुमन्यतरस्मिन् तृतीये वा पक्षे अदुष्टे अवधृते व्यर्था चिन्ता स्यात्, न तु सोऽवधृत इति तदवधारणार्थत्वादर्थवत्येवैषा चिन्ता।", "padacchedaText": "", "audioFile": "PB_001403.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001404", "originalText": "सत्यमर्थवती चिन्ता, शास्त्रार्थावधारणार्थत्वात्।", "padacchedaText": "", "audioFile": "PB_001404.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001405", "originalText": "चिन्तयसि च त्वम्, न तु निर्णेष्यसि, किं न निर्णेतव्यमिति वेदवचनम्? न, कथं तर्हि? बहुप्रतिपक्षत्वात्, एकत्ववादी त्वम्, वेदार्थपरत्वात्, बहवो हि नानात्ववादिनो वेदबाह्याः त्वत्प्रतिपक्षाः, अतो ममाशङ्का— न निर्णेष्यसीति।", "padacchedaText": "", "audioFile": "PB_001405.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001406", "originalText": "एतदेव मे स्वस्त्ययनम्— यन्मामेकयोगिनमनेकयोगिबहुप्रतिपक्षमात्थ। अतो जेष्यामि सर्वान्, आरभे च चिन्ताम्॥", "padacchedaText": "", "audioFile": "PB_001406.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001407", "originalText": "स एव तु स्यात्, तद्भावस्य विवक्षितत्वात्।", "padacchedaText": "", "audioFile": "PB_001407.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001408", "originalText": "तद्विज्ञानेन परमात्मभावो हि अत्र विवक्षितः— ‘ब्रह्मविदाप्नोति परम्’ इति।", "padacchedaText": "", "audioFile": "PB_001408.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001409", "originalText": "न हि अन्यस्य अन्यभावापत्तिरुपपद्यते।", "padacchedaText": "", "audioFile": "PB_001409.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001410", "originalText": "ननु तस्यापि तद्भावापत्तिरनुपपन्नैव।", "padacchedaText": "", "audioFile": "PB_001410.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001411", "originalText": "न, अविद्याकृतानात्मापोहार्थत्वात्।", "padacchedaText": "", "audioFile": "PB_001411.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001412", "originalText": "या हि ब्रह्मविद्यया स्वात्मप्राप्तिरुपदिश्यते, सा अविद्याकृतस्य अन्नादिविशेषात्मनः आत्मत्वेनाध्यारोपितस्य अनात्मनः अपोहार्था।", "padacchedaText": "", "audioFile": "PB_001412.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001413", "originalText": "कथमेवमर्थता अवगम्यते? विद्यामात्रोपदेशात्।", "padacchedaText": "", "audioFile": "PB_001413.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001414", "originalText": "विद्यायाश्च दृष्टं कार्यमविद्यानिवृत्तिः, तच्चेह विद्यामात्रमात्मप्राप्तौ साधनमुपदिश्यते।", "padacchedaText": "", "audioFile": "PB_001414.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001415", "originalText": "मार्गविज्ञानोपदेशवदिति चेत्, तदात्मत्वे विद्यामात्रसाधनोपदेशोऽहेतुः।", "padacchedaText": "", "audioFile": "PB_001415.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001416", "originalText": "कस्मात्? देशान्तरप्राप्तौ मार्गविज्ञानोपदेशदर्शनात्।", "padacchedaText": "", "audioFile": "PB_001416.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001417", "originalText": "न हि ग्राम एव गन्तेति चेत्, न, वैधर्म्यात्।", "padacchedaText": "", "audioFile": "PB_001417.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001418", "originalText": "तत्र हि ग्रामविषयं नोपदिश्यते, तत्प्राप्तिमार्गविषयमेवोपदिश्यते विज्ञानम्, न तथेह ब्रह्मविज्ञानव्यतिरेकेण साधनान्तरविषयं विज्ञानमुपदिश्यते।", "padacchedaText": "", "audioFile": "PB_001418.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001419", "originalText": "उक्तकर्मादिसाधनापेक्षं ब्रह्मविज्ञानं परप्राप्तौ साधनमुपदिश्यत इति चेत्, न, नित्यत्वान्मोक्षस्येत्यादिना प्रत्युक्तत्वात्।", "padacchedaText": "", "audioFile": "PB_001419.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001420", "originalText": "श्रुतिश्च ‘तत्सृष्ट्वा तदेवानुप्राविशत्’ इति कार्यस्य तदात्मत्वं दर्शयति।", "padacchedaText": "", "audioFile": "PB_001420.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001421", "originalText": "अभयप्रतिष्ठोपपत्तेश्च।", "padacchedaText": "", "audioFile": "PB_001421.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001422", "originalText": "यदि हि विद्यावान् स्वात्मनोऽन्यन्न पश्यति, ततः अभयं प्रतिष्ठां विन्दत इति स्यात्, भयहेतोः परस्य अन्यस्य अभावात्।", "padacchedaText": "", "audioFile": "PB_001422.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001423", "originalText": "अन्यस्य च अविद्याकृतत्वे विद्यया अवस्तुत्वदर्शनोपपत्तिः, तद्धि द्वितीयस्य चन्द्रस्य असत्त्वम्, यदतैमिरिकेण चक्षुष्मता न गृह्यते, नैवं न गृह्यत इति चेत्, न, सुषुप्तसमाहितयोरग्रहणात्।", "padacchedaText": "", "audioFile": "PB_001423.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001424", "originalText": "सुषुप्तेऽग्रहणमन्यासक्तवदिति चेत्, न, सर्वाग्रहणात्।", "padacchedaText": "", "audioFile": "PB_001424.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001425", "originalText": "जाग्रत्स्वप्नयोरन्यस्य ग्रहणात्सत्त्वमेवेति चेत्, न, अविद्याकृतत्वात् जाग्रत्स्वप्नयोः, यदन्यग्रहणं जाग्रत्स्वप्नयोः, तदविद्याकृतम्, विद्याभावे अभावात्।", "padacchedaText": "", "audioFile": "PB_001425.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001426", "originalText": "सुषुप्ते अग्रहणमपि अविद्याकृतमिति चेत्, न, स्वाभाविकत्वात्।", "padacchedaText": "", "audioFile": "PB_001426.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001427", "originalText": "द्रव्यस्य हि तत्त्वमविक्रिया, परानपेक्षत्वात्, विक्रिया न तत्त्वम्, परापेक्षत्वात्।", "padacchedaText": "", "audioFile": "PB_001427.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001428", "originalText": "न हि कारकापेक्षं वस्तुनस्तत्त्वम्, सतो विशेषः कारकापेक्षः, विशेषश्च विक्रिया, जाग्रत्स्वप्नयोश्च ग्रहणं विशेषः।", "padacchedaText": "", "audioFile": "PB_001428.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001429", "originalText": "यद्धि यस्य नान्यापेक्षं स्वरूपम्, तत्तस्य तत्त्वम्, यदन्यापेक्षम्, न तत्तत्त्वम्, अन्याभावे अभावात्।", "padacchedaText": "", "audioFile": "PB_001429.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001430", "originalText": "तस्मात् स्वाभाविकत्वात् जाग्रत्स्वप्नवत् न सुषुप्ते विशेषः।", "padacchedaText": "", "audioFile": "PB_001430.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001431", "originalText": "येषां पुनरीश्वरो अन्य आत्मनः, कार्यं च अन्यत्, तेषां भयानिवृत्तिः, भयस्य अन्यनिमित्तत्वात्, सतश्च अन्यस्य आत्महानानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_001431.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001432", "originalText": "न च असत आत्मलाभः।", "padacchedaText": "", "audioFile": "PB_001432.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001433", "originalText": "सापेक्षस्य अन्यस्य भयहेतुत्वमिति चेत्, न, तस्यापि तुल्यत्वात्।", "padacchedaText": "", "audioFile": "PB_001433.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001434", "originalText": "यद्धर्माद्यनुसहायीभूतं नित्यमनित्यं वा निमित्तमपेक्ष्य अन्यद्भयकारणं स्यात्, तस्यापि तथाभूतस्य आत्महानाभावात् भयानिवृत्तिः, आत्महाने वा सदसतोरितरेतरापत्तौ सर्वत्र अनाश्वास एव।", "padacchedaText": "", "audioFile": "PB_001434.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001435", "originalText": "एकत्वपक्षे पुनः सनिमित्तस्य संसारस्य अविद्याकल्पितत्वाददोषः।", "padacchedaText": "", "audioFile": "PB_001435.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001436", "originalText": "तैमिरिकदृष्टस्य हि द्वितीयचन्द्रस्य न आत्मलाभो नाशो वा अस्ति।", "padacchedaText": "", "audioFile": "PB_001436.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001437", "originalText": "विद्याविद्ययोः तद्धर्मत्वमिति चेत्, न, प्रत्यक्षत्वात्।", "padacchedaText": "", "audioFile": "PB_001437.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001438", "originalText": "विवेकाविवेकौ रूपादिवत् प्रत्यक्षावुपलभ्येते अन्तःकरणस्थौ।", "padacchedaText": "", "audioFile": "PB_001438.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001439", "originalText": "न हि रूपस्य प्रत्यक्षस्य सतो द्रष्ट्टधर्मत्वम्।", "padacchedaText": "", "audioFile": "PB_001439.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001440", "originalText": "अविद्या च स्वानुभवेन रूप्यते— मूढोऽहम् अविविक्तं मम विज्ञानम् इति।", "padacchedaText": "", "audioFile": "PB_001440.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001441", "originalText": "तथा विद्याविवेको अनुभूयते।", "padacchedaText": "", "audioFile": "PB_001441.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001442", "originalText": "उपदिशन्ति च अन्येभ्य आत्मनो विद्यां बुधाः।", "padacchedaText": "", "audioFile": "PB_001442.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001443", "originalText": "तथा च अन्ये अवधारयन्ति।", "padacchedaText": "", "audioFile": "PB_001443.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001444", "originalText": "तस्मात् नामरूपपक्षस्यैव विद्याविद्ये नामरूपे च, न आत्मधर्मौ, ‘नामरूपयोर्निर्वहिता ते यदन्तरा तद्ब्रह्म’ (छा.८.१४.१) इति श्रुत्यन्तरात्।", "padacchedaText": "", "audioFile": "PB_001444.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001445", "originalText": "ते च पुनर्नामरूपे सवितर्यहोरात्रे इव कल्पिते, न परमार्थतो विद्यमाने।", "padacchedaText": "", "audioFile": "PB_001445.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001446", "originalText": "अभेदे ‘एतमानन्दमयमात्मानमुपसङ्क्रामति’ (तै.२.८.५) इति कर्मकर्तृत्वानुपपत्तिरिति चेत्, न, विज्ञानमात्रत्वात् सङ्क्रमणस्य।", "padacchedaText": "", "audioFile": "PB_001446.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001447", "originalText": "न जलूकादिवत् सङ्क्रमणमिहोपदिश्यते, किं तर्हि, विज्ञानमात्रं सङ्क्रमणश्रुतेरर्थः।", "padacchedaText": "", "audioFile": "PB_001447.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001448", "originalText": "ननु मुख्यमेव सङ्क्रमणं श्रूयते— उपसङ्क्रामतीति इति चेत्, न, अन्नमये अदर्शनात्।", "padacchedaText": "", "audioFile": "PB_001448.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001449", "originalText": "न हि अन्नमयमुपसङ्क्रामतः बाह्यादस्माल्लोकात् जलूकावत् सङ्क्रमणं दृश्यते, अन्यथा वा।", "padacchedaText": "", "audioFile": "PB_001449.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001450", "originalText": "मनोमयस्य बहिर्निर्गतस्य विज्ञानमयस्य वा पुनः प्रत्यावृत्त्या आत्मसङ्क्रमणमिति चेत्, न, स्वात्मनि क्रियाविरोधात्।", "padacchedaText": "", "audioFile": "PB_001450.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001451", "originalText": "अन्योऽन्नमयमन्यमुपसङ्क्रामतीति प्रकृत्य मनोमयो विज्ञानमयो वा स्वात्मानमेवोपसङ्क्रामतीति विरोधः स्यात्।", "padacchedaText": "", "audioFile": "PB_001451.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001452", "originalText": "तथा न आनन्दमयस्य आत्मसङ्क्रमणमुपपद्यते।", "padacchedaText": "", "audioFile": "PB_001452.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001453", "originalText": "तस्मात् न प्राप्तिः सङ्क्रमणम्, नापि अन्नमयादीनामन्यतमकर्तृकं पारिशेष्यादन्नमयाद्यानन्दमयान्तात्मव्यतिरिक्तकर्तृकं ज्ञानमात्रं च सङ्क्रमणमुपपद्यते।", "padacchedaText": "", "audioFile": "PB_001453.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001454", "originalText": "ज्ञानमात्रत्वे च आनन्दमयान्तःस्थस्यैव सर्वान्तरस्य आकाशाद्यन्नमयान्तं कार्यं सृष्ट्वा अनुप्रविष्टस्य हृदयगुहाभिसम्बन्धादन्नमयादिषु अनात्मसु आत्मविभ्रमः सङ्क्रमणात्मकविवेकविज्ञानोत्पत्त्या विनश्यति।", "padacchedaText": "", "audioFile": "PB_001454.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001455", "originalText": "तदेतस्मिन्नविद्याविभ्रमनाशे सङ्क्रमणशब्द उपचर्यते, न हि अन्यथा सर्वगतस्य आत्मनः सङ्क्रमणमुपपद्यते।", "padacchedaText": "", "audioFile": "PB_001455.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001456", "originalText": "वस्त्वन्तराभावाच्च।", "padacchedaText": "", "audioFile": "PB_001456.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001457", "originalText": "न च स्वात्मन एव सङ्क्रमणम्।", "padacchedaText": "", "audioFile": "PB_001457.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001458", "originalText": "न हि जलूका आत्मानमेव सङ्क्रामति।", "padacchedaText": "", "audioFile": "PB_001458.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001459", "originalText": "तस्मात् सत्यं ज्ञानमनन्तं ब्रह्मेति यथोक्तलक्षणात्मप्रतिपत्त्यर्थमेव बहुभवनसर्गप्रवेशरसलाभाभयसङ्क्रमणादि परिकल्प्यते ब्रह्मणि सर्वव्यवहारविषये, न तु परमार्थतो निर्विकल्पे ब्रह्मणि कश्चिदपि विकल्प उपपद्यते।", "padacchedaText": "", "audioFile": "PB_001459.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001460", "originalText": "तमेतं निर्विकल्पमात्मानम् एवं क्रमेणोपसङ्क्रम्य विदित्वा न बिभेति कुतश्चन अभयं प्रतिष्ठां विन्दत इत्येतस्मिन्नर्थेऽपि एषः श्लोकः भवति। सर्वस्यैव अस्य प्रकरणस्य आनन्दवल्ल्यर्थस्य सङ्क्षेपतः प्रकाशनाय एष मन्त्रो भवति॥", "padacchedaText": "", "audioFile": "PB_001460.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001461", "originalText": "इति अष्टमानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_001461.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001462", "originalText": "नवमोऽनुवाकः\nयतो वाचो निवर्तन्ते।", "padacchedaText": "", "audioFile": "PB_001462.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001463", "originalText": "अप्राप्य मनसा सह।", "padacchedaText": "", "audioFile": "PB_001463.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001464", "originalText": "आनन्दं ब्रह्मणो विद्वान्।", "padacchedaText": "", "audioFile": "PB_001464.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001465", "originalText": "न बिभेति कुतश्चनेति।", "padacchedaText": "", "audioFile": "PB_001465.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001466", "originalText": "एतं ह वाव न तपति।", "padacchedaText": "", "audioFile": "PB_001466.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001467", "originalText": "किमहं साधु ना करवम्।", "padacchedaText": "", "audioFile": "PB_001467.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001468", "originalText": "किमहं पापमकरवमिति।", "padacchedaText": "", "audioFile": "PB_001468.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001469", "originalText": "स य एवं विद्वानेते आत्मानं स्पृणुते।", "padacchedaText": "", "audioFile": "PB_001469.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001470", "originalText": "उभे ह्येवैष एते आत्मानं स्पृणुते।", "padacchedaText": "", "audioFile": "PB_001470.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001471", "originalText": "य एवं वेद। इत्युपनिषत्॥ १॥", "padacchedaText": "", "audioFile": "PB_001471.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001472", "originalText": "यतः यस्मात् निर्विकल्पात् यथोक्तलक्षणात् अद्वयानन्दात् आत्मनः, वाचः अभिधानानि द्रव्यादिसविकल्पवस्तुविषयाणि वस्तुसामान्यान्निर्विकल्पे अद्वयेऽपि ब्रह्मणि प्रयोक्तृभिः प्रकाशनाय प्रयुज्यमानानि, अप्राप्य अप्रकाश्यैव निवर्तन्ते स्वसामर्थ्याद्धीयन्ते।", "padacchedaText": "", "audioFile": "PB_001472.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001473", "originalText": "मन इति प्रत्ययो विज्ञानम्।", "padacchedaText": "", "audioFile": "PB_001473.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001474", "originalText": "तच्च, यत्राभिधानं प्रवृत्तमतीन्द्रियेऽप्यर्थे, तदर्थे च प्रवर्तते प्रकाशनाय।", "padacchedaText": "", "audioFile": "PB_001474.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001475", "originalText": "यत्र च विज्ञानम्, तत्र वाचः प्रवृत्तिः।", "padacchedaText": "", "audioFile": "PB_001475.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001476", "originalText": "तस्मात् सहैव वाङ्मनसयोः अभिधानप्रत्ययोः प्रवृत्तिः सर्वत्र।", "padacchedaText": "", "audioFile": "PB_001476.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001477", "originalText": "तस्मात् ब्रह्मप्रकाशनाय सर्वथा प्रयोक्तृभिः प्रयुज्यमाना अपि वाचः यस्मादप्रत्ययविषयादनभिधेयाददृश्यादिविशेषणात् सहैव मनसा विज्ञानेन सर्वप्रकाशनसमर्थेन निवर्तन्ते, तं ब्रह्मण आनन्दं श्रोत्रियस्य अवृजिनस्य अकामहतस्य सर्वैषणाविनिर्मुक्तस्य आत्मभूतं विषयविषयिसम्बन्धविनिर्मुक्तं स्वाभाविकं नित्यमविभक्तं परमानन्दं ब्रह्मणो विद्वान् यथोक्तेन विधिना न बिभेति कुतश्चन, निमित्ताभावात्।", "padacchedaText": "", "audioFile": "PB_001477.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001478", "originalText": "न हि तस्माद्विदुषः अन्यद्वस्त्वन्तरमस्ति भिन्नं यतो बिभेति।", "padacchedaText": "", "audioFile": "PB_001478.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001479", "originalText": "अविद्यया यदा उदरमन्तरं कुरुते, अथ तस्य भयं भवतीति हि युक्तम्।", "padacchedaText": "", "audioFile": "PB_001479.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001480", "originalText": "विदुषश्च अविद्याकार्यस्य तैमिरिकदृष्टद्वितीयचन्द्रवत् नाशाद्भयनिमित्तस्य न बिभेति कुतश्चनेति युज्यते।", "padacchedaText": "", "audioFile": "PB_001480.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001481", "originalText": "मनोमये च उदाहृतः मन्त्रः, मनसो ब्रह्मविज्ञानसाधनत्वात्।", "padacchedaText": "", "audioFile": "PB_001481.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001482", "originalText": "तत्र ब्रह्मत्वमध्यारोप्य तत्स्तुत्यर्थं न बिभेति कदाचनेति भयमात्रं प्रतिषिद्धम्, इह अद्वैतविषये न बिभेति कुतश्चनेति भयनिमित्तमेव प्रतिषिध्यते।", "padacchedaText": "", "audioFile": "PB_001482.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001483", "originalText": "नन्वस्ति भयनिमित्तं साध्वकरणं पापक्रिया च।", "padacchedaText": "", "audioFile": "PB_001483.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001484", "originalText": "नैवम्।", "padacchedaText": "", "audioFile": "PB_001484.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001485", "originalText": "कथमिति, उच्यते— एतं यथोक्तमेवंविदम्, ह वाव इत्यवधारणार्थौ, न तपति नोद्वेजयति न सन्तापयति।", "padacchedaText": "", "audioFile": "PB_001485.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001486", "originalText": "कथं पुनः साध्वकरणं पापक्रिया च न तपतीति, उच्यते— किं कस्मात् साधु शोभनं कर्म नाकरवं न कृतवानस्मि इति पश्चात्सन्तापो भवति आसन्ने मरणकाले, तथा किं कस्मात् पापं प्रतिषिद्धं कर्म अकरवं कृतवानस्मि इति च नरकपतनादिदुःखभयात् तापो भवति।", "padacchedaText": "", "audioFile": "PB_001486.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001487", "originalText": "ते एते साध्वकरणपापक्रिये एवमेनं न तपतः, यथा अविद्वांसं तपतः।", "padacchedaText": "", "audioFile": "PB_001487.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001488", "originalText": "कस्मात्पुनर्विद्वांसं न तपत इति, उच्यते— स य एवंविद्वान् एते साध्वसाधुनी तापहेतू इति आत्मानं स्पृणुते प्रीणाति बलयति वा, परमात्मभावेन उभे पश्यतीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001488.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001489", "originalText": "उभे पुण्यपापे हि यस्मात् एवम् एष विद्वान् एते आत्मानात्मरूपेणैव पुण्यपापे स्वेन विशेषरूपेण शून्ये कृत्वा आत्मानं स्पृणुत एव।", "padacchedaText": "", "audioFile": "PB_001489.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001490", "originalText": "कः? य एवं वेद यथोक्तमद्वैतमानन्दं ब्रह्म वेद, तस्य आत्मभावेन दृष्टे पुण्यपापे निर्वीर्ये अतापके जन्मान्तरारम्भके न भवतः। इतीयम् एवं यथोक्ता अस्यां वल्ल्यां ब्रह्मविद्योपनिषत्, सर्वाभ्यः विद्याभ्यः परमरहस्यं दर्शितमित्यर्थः— परं श्रेयः अस्यां निषण्णमिति॥", "padacchedaText": "", "audioFile": "PB_001490.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001491", "originalText": "इति नवमानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_001491.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001492", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ तैत्तिरीयोपनिषद्भाष्ये ब्रह्मानन्दवल्लीभाष्यं सम्पूर्णम्॥", "padacchedaText": "", "audioFile": "PB_001492.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001493", "originalText": "भृगुवल्ली\nप्रथमोऽनुवाकः\nॐ सह नाववतु।", "padacchedaText": "", "audioFile": "PB_001493.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001494", "originalText": "सह नौ भुनक्तु।", "padacchedaText": "", "audioFile": "PB_001494.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001495", "originalText": "सह वीर्यं करवावहै। तेजस्वि नावधीतमस्तु मा विद्विषावहै॥", "padacchedaText": "", "audioFile": "PB_001495.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001496", "originalText": "ॐशान्तिःशान्तिःशान्तिः॥", "padacchedaText": "", "audioFile": "PB_001496.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001497", "originalText": "सत्यं ज्ञानमनन्तं ब्रह्म आकाशादिकार्यमन्नमयान्तं सृष्ट्वा तदेवानुप्रविष्टं विशेषवदिवोपलभ्यमानं यस्मात्, तस्मात् सर्वकार्यविलक्षणम् अदृश्यादिधर्मकमेव आनन्दं तदेवाहमिति विजानीयात्, अनुप्रवेशस्य तदर्थत्वात्, तस्यैवं विजानतः शुभाशुभे कर्मणी जन्मान्तरारम्भके न भवतः इत्येवमानन्दवल्ल्यां विवक्षितोऽर्थः।", "padacchedaText": "", "audioFile": "PB_001497.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001498", "originalText": "परिसमाप्ता च ब्रह्मविद्या।", "padacchedaText": "", "audioFile": "PB_001498.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001499", "originalText": "अतः परं ब्रह्मविद्यासाधनं तपो वक्तव्यम्, अन्नादिविषयाणि च उपासनान्यनुक्तानीत्यतः इदमारभ्यते—\nभृगुर्वै वारुणिः।", "padacchedaText": "", "audioFile": "PB_001499.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001500", "originalText": "वरुणं पितरमुपससार।", "padacchedaText": "", "audioFile": "PB_001500.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001501", "originalText": "अधीहि भगवो ब्रह्मेति।", "padacchedaText": "", "audioFile": "PB_001501.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001502", "originalText": "तस्मा एतत्प्रोवाच।", "padacchedaText": "", "audioFile": "PB_001502.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001503", "originalText": "अन्नं प्राणं चक्षुः श्रोत्रं मनो वाचमिति।", "padacchedaText": "", "audioFile": "PB_001503.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001504", "originalText": "तं होवाच।", "padacchedaText": "", "audioFile": "PB_001504.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001505", "originalText": "यतो वा इमानि भूतानि जायन्ते।", "padacchedaText": "", "audioFile": "PB_001505.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001506", "originalText": "येन जातानि जीवन्ति।", "padacchedaText": "", "audioFile": "PB_001506.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001507", "originalText": "यत्प्रयन्त्यभिसंविशन्ति।", "padacchedaText": "", "audioFile": "PB_001507.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001508", "originalText": "तद्विजिज्ञासस्व।", "padacchedaText": "", "audioFile": "PB_001508.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001509", "originalText": "तद्ब्रह्मेति।", "padacchedaText": "", "audioFile": "PB_001509.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001510", "originalText": "स तपोऽतप्यत। स तपस्तप्त्वा॥ १॥", "padacchedaText": "", "audioFile": "PB_001510.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001511", "originalText": "आख्यायिका विद्यास्तुतये, प्रियाय पुत्राय पित्रोक्तेति— भृगुर्वै वारुणिः।", "padacchedaText": "", "audioFile": "PB_001511.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001512", "originalText": "वै— शब्दः प्रसिद्धानुस्मारकः, भृगुरित्येवं नामा प्रसिद्धो अनुस्मार्यते, वारुणिः वरुणस्यापत्यं वारुणिः वरुणं पितरं ब्रह्म विजिज्ञासुः उपससार उपगतवान्— अधीहि भगवो ब्रह्म इत्यनेन मन्त्रेण।", "padacchedaText": "", "audioFile": "PB_001512.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001513", "originalText": "अधीहि अध्यापय कथय।", "padacchedaText": "", "audioFile": "PB_001513.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001514", "originalText": "स च पिता विधिवदुपसन्नाय तस्मै पुत्राय एतत् वचनं प्रोवाच— अन्नं प्राणं चक्षुः श्रोत्रम् मनो वाचम् इति।", "padacchedaText": "", "audioFile": "PB_001514.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001515", "originalText": "अन्नं शरीरं तदभ्यन्तरं च प्राणम् अत्तारम् अनन्तरमुपलब्धिसाधनानि चक्षुः श्रोत्रं मनो वाचम् इत्येतानि ब्रह्मोपलब्धौ द्वाराण्युक्तवान्।", "padacchedaText": "", "audioFile": "PB_001515.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001516", "originalText": "उक्त्वा च द्वारभूतान्येतान्यन्नादीनि तं भृगुं होवाच ब्रह्मणो लक्षणम्।", "padacchedaText": "", "audioFile": "PB_001516.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001517", "originalText": "किं तत्? यतः यस्मात् वा इमानि ब्रह्मादीनि स्तम्बपर्यन्तानि भूतानि जायन्ते, येन जातानि जीवन्ति प्राणान्धारयन्ति वर्धन्ते, विनाशकाले च यत्प्रयन्ति यद्ब्रह्म प्रतिगच्छन्ति, अभिसंविशन्ति तादात्म्यमेव प्रतिपद्यन्ते, उत्पत्तिस्थितिलयकालेषु यदात्मतां न जहति भूतानि, तदेतद्ब्रह्मणो लक्षणम्, तद्ब्रह्म विजिज्ञासस्व विशेषेण ज्ञातुमिच्छस्व, यदेवंलक्षणं ब्रह्म तदन्नादिद्वारेण प्रतिपद्यस्वेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001517.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001518", "originalText": "श्रुत्यन्तरं च— ‘प्राणस्य प्राणमुत चक्षुषश्चक्षुरुत श्रोत्रस्य श्रोत्रमन्नस्यान्नं मनसो ये मनो विदुस्ते निचिक्युर्ब्रह्म पुराणमग्र्यम्’ (बृ.४.४.१८) इति ब्रह्मोपलब्धौ द्वाराण्येतानीति दर्शयति।", "padacchedaText": "", "audioFile": "PB_001518.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001519", "originalText": "स भृगुः ब्रह्मोपलब्धिद्वाराणि ब्रह्मलक्षणं च श्रुत्वा पितुः, तपो ब्रह्मोपलब्धिसाधनत्वेन अतप्यत तप्तवान्।", "padacchedaText": "", "audioFile": "PB_001519.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001520", "originalText": "कुतः पुनरनुपदिष्टस्यैव तपसः साधनत्वप्रतिपत्तिर्भृगोः? सावशेषोक्तेः।", "padacchedaText": "", "audioFile": "PB_001520.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001521", "originalText": "अन्नादिब्रह्मणः प्रतिपत्तौ द्वारं लक्षणं च यतो वा इमानि इत्याद्युक्तवान्।", "padacchedaText": "", "audioFile": "PB_001521.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001522", "originalText": "सावशेषं हि तत्, साक्षाद्ब्रह्मणोऽनिर्देशात्।", "padacchedaText": "", "audioFile": "PB_001522.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001523", "originalText": "अन्यथा हि स्वरूपेणैव ब्रह्म निर्देष्टव्यं जिज्ञासवे पुत्राय इदमित्थंरूपं ब्रह्म इति, न चैवं निरदिशत्, किं तर्हि, सावशेषमेवोक्तवान्।", "padacchedaText": "", "audioFile": "PB_001523.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001524", "originalText": "अतोऽवगम्यते नूनं साधनान्तरमप्यपेक्षते पिता ब्रह्मविज्ञानं प्रतीति।", "padacchedaText": "", "audioFile": "PB_001524.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001525", "originalText": "तपोविशेषप्रतिपत्तिस्तु सर्वसाधकतमत्वात्, सर्वेषां हि नियतसाध्यविषयाणां साधनानां तप एव साधकतमं साधनमिति हि प्रसिद्धं लोके।", "padacchedaText": "", "audioFile": "PB_001525.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001526", "originalText": "तस्मात् पित्रा अनुपदिष्टमपि ब्रह्मविज्ञानसाधनत्वेन तपः प्रतिपेदे भृगुः।", "padacchedaText": "", "audioFile": "PB_001526.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001527", "originalText": "तच्च तपो बाह्यान्तःकरणसमाधानम्, तद्द्वारकत्वाद्ब्रह्मप्रतिपत्तेः, ‘मनसश्चेन्द्रियाणां च ह्यैकाग्र्यं परमं तपः।", "padacchedaText": "", "audioFile": "PB_001527.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001528", "originalText": "तज्ज्यायः सर्वधर्मेभ्यः स धर्मः पर उच्यते’ इति स्मृतेः। स च तपस्तप्त्वा॥", "padacchedaText": "", "audioFile": "PB_001528.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001529", "originalText": "इति प्रथमानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_001529.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001530", "originalText": "द्वितीयोऽनुवाकः\nअन्नं ब्रह्मेति व्यजानात्।", "padacchedaText": "", "audioFile": "PB_001530.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001531", "originalText": "अन्नाद्ध्येव खल्विमानि भूतानि जायन्ते।", "padacchedaText": "", "audioFile": "PB_001531.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001532", "originalText": "अन्नेन जातानि जीवन्ति।", "padacchedaText": "", "audioFile": "PB_001532.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001533", "originalText": "अन्नं प्रयन्त्यभिसंविशन्तीति।", "padacchedaText": "", "audioFile": "PB_001533.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001534", "originalText": "तद्विज्ञाय।", "padacchedaText": "", "audioFile": "PB_001534.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001535", "originalText": "पुनरेव वरुणं पितरमुपससार।", "padacchedaText": "", "audioFile": "PB_001535.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001536", "originalText": "अधीहि भगवो ब्रह्मेति।", "padacchedaText": "", "audioFile": "PB_001536.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001537", "originalText": "तं होवाच।", "padacchedaText": "", "audioFile": "PB_001537.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001538", "originalText": "तपसा ब्रह्म विजिज्ञासस्व।", "padacchedaText": "", "audioFile": "PB_001538.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001539", "originalText": "तपो ब्रह्मेति।", "padacchedaText": "", "audioFile": "PB_001539.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001540", "originalText": "स तपोऽतप्यत। स तपस्तप्त्वा॥ १॥", "padacchedaText": "", "audioFile": "PB_001540.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001541", "originalText": "अन्नं ब्रह्मेति व्यजानात् विज्ञातवान्।", "padacchedaText": "", "audioFile": "PB_001541.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001542", "originalText": "तद्धि यथोक्तलक्षणोपेतम्।", "padacchedaText": "", "audioFile": "PB_001542.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001543", "originalText": "कथम्? अन्नाद्ध्येव खलु इमानि भूतानि जायन्ते।", "padacchedaText": "", "audioFile": "PB_001543.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001544", "originalText": "अन्नेन जातानि जीवन्ति।", "padacchedaText": "", "audioFil audioFile": "PB_001602.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001603", "originalText": "एवमन्नमत्तीत्यन्नादः, दीप्ताग्निर्भवतीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001603.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001604", "originalText": "महान्भवति।", "padacchedaText": "", "audioFile": "PB_001604.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001605", "originalText": "केन महत्त्वमित्यत आह— प्रजया पुत्रादिना पशुभिः गवाश्वादिभिः ब्रह्मवर्चसेन शमदमज्ञानादिनिमित्तेन तेजसा। महान्भवति कीर्त्या ख्यात्या शुभाचारनिमित्तया॥", "padacchedaText": "", "audioFile": "PB_001605.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001606", "originalText": "इति षष्ठानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_001606.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001607", "originalText": "सप्तमोऽनुवाकः\nअन्नं न निन्द्यात्।", "padacchedaText": "", "audioFile": "PB_001607.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001608", "originalText": "तद्व्रतम्।", "padacchedaText": "", "audioFile": "PB_001608.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001609", "originalText": "प्राणो वा अन्नम्।", "padacchedaText": "", "audioFile": "PB_001609.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001610", "originalText": "शरीरमन्नादम्।", "padacchedaText": "", "audioFile": "PB_001610.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001611", "originalText": "प्राणे शरीरं प्रतिष्ठितम्।", "padacchedaText": "", "audioFile": "PB_001611.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001612", "originalText": "शरीरे प्राणः प्रतिष्ठितः।", "padacchedaText": "", "audioFile": "PB_001612.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001613", "originalText": "तदेतदन्नमन्ने प्रतिष्ठितम्।", "padacchedaText": "", "audioFile": "PB_001613.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001614", "originalText": "स य एतदन्नमन्ने प्रतिष्ठितं वेद प्रतितिष्ठति।", "padacchedaText": "", "audioFile": "PB_001614.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001615", "originalText": "अन्नवानन्नादो भवति।", "padacchedaText": "", "audioFile": "PB_001615.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001616", "originalText": "महान् भवति।", "padacchedaText": "", "audioFile": "PB_001616.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001617", "originalText": "प्रजया पशुभिर्ब्रह्मवर्चसेन। महान् कीर्त्या॥ १॥", "padacchedaText": "", "audioFile": "PB_001617.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001618", "originalText": "किं च, अन्नेन द्वारभूतेन ब्रह्म विज्ञातं यस्मात्, तस्मात् गुरुमिव अन्नं न निन्द्यात्, तत् अस्य एवं ब्रह्मविदो व्रतम् उपदिश्यते।", "padacchedaText": "", "audioFile": "PB_001618.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001619", "originalText": "व्रतोपदेशो अन्नस्तुतये, स्तुतिभाक्त्वं च अन्नस्य ब्रह्मोपलब्ध्युपायत्वात्।", "padacchedaText": "", "audioFile": "PB_001619.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001620", "originalText": "प्राणो वा अन्नम्, शरीरान्तर्भावात्प्राणस्य।", "padacchedaText": "", "audioFile": "PB_001620.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001621", "originalText": "यत् यस्यान्तः प्रतिष्ठितं भवति, तत्तस्यान्नं भवतीति।", "padacchedaText": "", "audioFile": "PB_001621.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001622", "originalText": "शरीरे च प्राणः प्रतिष्ठितः, तस्मात् प्राणोऽन्नं शरीरमन्नादम्।", "padacchedaText": "", "audioFile": "PB_001622.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001623", "originalText": "तथा शरीरमप्यन्नं प्राणोऽन्नादः।", "padacchedaText": "", "audioFile": "PB_001623.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001624", "originalText": "कस्मात् प्राणे शरीरं प्रतिष्ठितम्? तन्निमित्तत्वाच्छरीरस्थितेः।", "padacchedaText": "", "audioFile": "PB_001624.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001625", "originalText": "तस्मात् तदेतत् उभयं शरीरं प्राणश्च अन्न
