acchedaText": "", "audioFile": "PB_001649.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001650", "originalText": "आकाशे पृथिवी प्रतिष्ठिता।", "padacchedaText": "", "audioFile": "PB_001650.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001651", "originalText": "तदेतदन्नमन्ने प्रतिष्ठितम्।", "padacchedaText": "", "audioFile": "PB_001651.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001652", "originalText": "स य एतदन्नमन्ने प्रतिष्ठितं वेद प्रतितिष्ठति।", "padacchedaText": "", "audioFile": "PB_001652.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001653", "originalText": "अन्नवानन्नादो भवति।", "padacchedaText": "", "audioFile": "PB_001653.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001654", "originalText": "महान्भवति।", "padacchedaText": "", "audioFile": "PB_001654.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001655", "originalText": "प्रजया पशुभिर्ब्रह्मवर्चसेन। महान्कीर्त्या॥", "padacchedaText": "", "audioFile": "PB_001655.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001656", "originalText": "अप्सु ज्योतिः इत्यब्ज्योतिषोरन्नान्नादगुणत्वेनोपासकस्य अन्नस्य बहुकरणं व्रतम्॥", "padacchedaText": "", "audioFile": "PB_001656.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001657", "originalText": "इति नवमानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_001657.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001658", "originalText": "दशमोऽनुवाकः\nन कञ्चन वसतौ प्रत्याचक्षीत।", "padacchedaText": "", "audioFile": "PB_001658.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001659", "originalText": "तद्व्रतम्।", "padacchedaText": "", "audioFile": "PB_001659.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001660", "originalText": "तस्माद्यया कया च विधया बह्वन्नं प्राप्नुयात्।", "padacchedaText": "", "audioFile": "PB_001660.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001661", "originalText": "अराध्यस्मा अन्नमित्याचक्षते।", "padacchedaText": "", "audioFile": "PB_001661.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001662", "originalText": "एतद्वै मुखतोऽन्नं राद्धम्।", "padacchedaText": "", "audioFile": "PB_001662.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001663", "originalText": "मुखतोऽस्मा अन्नं राध्यते।", "padacchedaText": "", "audioFile": "PB_001663.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001664", "originalText": "एतद्वै मध्यतोऽन्नं राद्धम्।", "padacchedaText": "", "audioFile": "PB_001664.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001665", "originalText": "मध्यतोऽस्मा अन्नं राध्यते।", "padacchedaText": "", "audioFile": "PB_001665.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001666", "originalText": "एतद्वा अन्ततोऽन्नं राद्धम्। अन्ततोऽस्मा अन्नं राध्यते॥ १॥", "padacchedaText": "", "audioFile": "PB_001666.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001667", "originalText": "तथा पृथिव्याकाशोपासकस्य वसतौ वसतिनिमित्तं कञ्चन कञ्चिदपि न प्रत्याचक्षीत, वसत्यर्थमागतं न निवारयेदित्यर्थः।", "padacchedaText": "", "audioFile": "PB_001667.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001668", "originalText": "वासे च दत्ते अवश्यं हि अशनं दातव्यम्।", "padacchedaText": "", "audioFile": "PB_001668.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001669", "originalText": "तस्माद्यया कया च विधया येन केन च प्रकारेण बह्वन्नं प्राप्नुयात् बह्वन्नसङ्ग्रहं कुर्यादित्यर्थः।", "padacchedaText": "", "audioFile": "PB_001669.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001670", "originalText": "यस्मादन्नवन्तो विद्वांसः अभ्यागताय अन्नार्थिने अराधि संसिद्धम् अस्मै अन्नम् इत्याचक्षते, न नास्तीति प्रत्याख्यानं कुर्वन्ति, तस्माच्च हेतोः बह्वन्नं प्राप्नुयादिति पूर्वेण सम्बन्धः।", "padacchedaText": "", "audioFile": "PB_001670.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001671", "originalText": "अपि च अन्नदानस्य माहात्म्यमुच्यते— यथा यत्कालं प्रयच्छत्यन्नम्, तथा तत्कालमेव प्रत्युपनमते।", "padacchedaText": "", "audioFile": "PB_001671.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001672", "originalText": "कथमिति तदेतदाह— एतद्वै अन्नं मुखतः मुख्ये प्रथमे वयसि मुख्यया वा वृत्त्या पूजापुरःसरमभ्यागतायान्नार्थिने राद्धं संसिद्धं प्रयच्छतीति वाक्यशेषः।", "padacchedaText": "", "audioFile": "PB_001672.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001673", "originalText": "तस्य किं फलं स्यादिति, उच्यते— मुखतः पूर्वे वयसि मुख्यया वा वृत्त्या अस्मै अन्नदाय अन्नं राध्यते, यथादत्तमुपतिष्ठत इत्यर्थः। एवं मध्यतो मध्यमे वयसि मध्यमेन च उपचारेण, तथा अन्ततः अन्ते वयसि जघन्येन च उपचारेण परिभवेन तथैवास्मै राध्यते संसिध्यत्यन्नम्॥", "padacchedaText": "", "audioFile": "PB_001673.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001674", "originalText": "य एवं वेद।", "padacchedaText": "", "audioFile": "PB_001674.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001675", "originalText": "क्षेम इति वाचि।", "padacchedaText": "", "audioFile": "PB_001675.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001676", "originalText": "योगक्षेम इति प्राणापानयोः।", "padacchedaText": "", "audioFile": "PB_001676.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001677", "originalText": "कर्मेति हस्तयोः।", "padacchedaText": "", "audioFile": "PB_001677.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001678", "originalText": "गतिरिति पादयोः।", "padacchedaText": "", "audioFile": "PB_001678.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001679", "originalText": "विमुक्तिरिति पायौ।", "padacchedaText": "", "audioFile": "PB_001679.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001680", "originalText": "इति मानुषीः समाज्ञाः।", "padacchedaText": "", "audioFile": "PB_001680.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001681", "originalText": "अथ दैवीः।", "padacchedaText": "", "audioFile": "PB_001681.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001682", "originalText": "तृप्तिरिति वृष्टौ। बलमिति विद्युति॥ २॥", "padacchedaText": "", "audioFile": "PB_001682.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001683", "originalText": "य एवं वेद य एवमन्नस्य यथोक्तं माहात्म्यं वेद तद्दानस्य च फलम्, तस्य यथोक्तं फलमुपनमते।", "padacchedaText": "", "audioFile": "PB_001683.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001684", "originalText": "इदानीं ब्रह्मण उपासनप्रकारः उच्यते— क्षेम इति वाचि।", "padacchedaText": "", "audioFile": "PB_001684.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001685", "originalText": "क्षेमो नाम उपात्तपरिरक्षणम्।", "padacchedaText": "", "audioFile": "PB_001685.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001686", "originalText": "ब्रह्म वाचि क्षेमरूपेण प्रतिष्ठितमित्युपास्यम्।", "padacchedaText": "", "audioFile": "PB_001686.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001687", "originalText": "योगक्षेम इति, योगः अनुपात्तस्योपादानम्।", "padacchedaText": "", "audioFile": "PB_001687.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001688", "originalText": "तौ हि योगक्षेमौ प्राणापानयोः बलवतोः सतोर्भवतः यद्यपि, तथापि न प्राणापाननिमित्तावेव, किं तर्हि, ब्रह्मनिमित्तौ।", "padacchedaText": "", "audioFile": "PB_001688.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001689", "originalText": "तस्माद्ब्रह्म योगक्षेमात्मना प्राणापानयोः प्रतिष्ठितमित्युपास्यम्।", "padacchedaText": "", "audioFile": "PB_001689.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001690", "originalText": "एवमुत्तरेष्वन्येषु तेन तेन आत्मना ब्रह्मैवोपास्यम्।", "padacchedaText": "", "audioFile": "PB_001690.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001691", "originalText": "कर्मणो ब्रह्मनिर्वर्त्यत्वात् हस्तयोः कर्मात्मना ब्रह्म प्रतिष्ठितमित्युपास्यम्।", "padacchedaText": "", "audioFile": "PB_001691.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001692", "originalText": "गतिरिति पादयोः।", "padacchedaText": "", "audioFile": "PB_001692.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001693", "originalText": "विमुक्तिरिति पायौ।", "padacchedaText": "", "audioFile": "PB_001693.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001694", "originalText": "इत्येता मानुषीः मनुष्येषु भवा मानुष्याः समाज्ञाः, आध्यात्मिक्यः समाज्ञा ज्ञानानि विज्ञानान्युपासनानीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001694.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001695", "originalText": "अथ अनन्तरं दैवीः दैव्यः देवेषु भवाः समाज्ञा उच्यन्ते।", "padacchedaText": "", "audioFile": "PB_001695.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001696", "originalText": "तृप्तिरिति वृष्टौ।", "padacchedaText": "", "audioFile": "PB_001696.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001697", "originalText": "वृष्टेरन्नादिद्वारेण तृप्तिहेतुत्वाद्ब्रह्मैव तृप्त्यात्मना वृष्टौ व्यवस्थितमित्युपास्यम्, तथा अन्येषु तेन तेनात्मना ब्रह्मैवोपास्यम्। तथा बलरूपेण विद्युति॥", "padacchedaText": "", "audioFile": "PB_001697.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001698", "originalText": "यश इति पशुषु।", "padacchedaText": "", "audioFile": "PB_001698.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001699", "originalText": "ज्योतिरिति नक्षत्रेषु।", "padacchedaText": "", "audioFile": "PB_001699.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001700", "originalText": "प्रजातिरमृतमानन्द इत्युपस्थे।", "padacchedaText": "", "audioFile": "PB_001700.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001701", "originalText": "सर्वमित्याकाशे।", "padacchedaText": "", "audioFile": "PB_001701.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001702", "originalText": "तत्प्रतिष्ठेत्युपासीत।", "padacchedaText": "", "audioFile": "PB_001702.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001703", "originalText": "प्रतिष्ठावान् भवति।", "padacchedaText": "", "audioFile": "PB_001703.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001704", "originalText": "तन्मह इत्युपासीत।", "padacchedaText": "", "audioFile": "PB_001704.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001705", "originalText": "महान् भवति।", "padacchedaText": "", "audioFile": "PB_001705.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001706", "originalText": "तन्मन इत्युपासीत। मानवान् भवति॥ ३॥", "padacchedaText": "", "audioFile": "PB_001706.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001707", "originalText": "यशोरूपेण पशुषु।", "padacchedaText": "", "audioFile": "PB_001707.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001708", "originalText": "ज्योतीरूपेण नक्षत्रेषु।", "padacchedaText": "", "audioFile": "PB_001708.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001709", "originalText": "प्रजातिः अमृतम् अमृतत्वप्राप्तिः पुत्रेण ऋणविमोक्षद्वारेण आनन्दः सुखमित्येतत्सर्वमुपस्थनिमित्तं ब्रह्मैव अनेनात्मना उपस्थे प्रतिष्ठितमित्युपास्यम्।", "padacchedaText": "", "audioFile": "PB_001709.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001710", "originalText": "सर्वं हि आकाशे प्रतिष्ठितम्, अतो यत्सर्वमाकाशे तद्ब्रह्मैवेत्युपास्यम्, तच्चाकाशं ब्रह्मैव।", "padacchedaText": "", "audioFile": "PB_001710.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001711", "originalText": "तस्मात् तत् सर्वस्य प्रतिष्ठेत्युपासीत।", "padacchedaText": "", "audioFile": "PB_001711.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001712", "originalText": "प्रतिष्ठागुणोपासनात् प्रतिष्ठावान् भवति।", "padacchedaText": "", "audioFile": "PB_001712.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001713", "originalText": "एवं सर्वेष्वपि।", "padacchedaText": "", "audioFile": "PB_001713.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001714", "originalText": "यद्यत्राधिगतं फलम्, तत् ब्रह्मैव, तदुपासनात्तद्वान्भवतीति द्रष्टव्यम्, श्रुत्यन्तराच्च— ‘तं यथा यथोपासते तदेव भवति’ इति।", "padacchedaText": "", "audioFile": "PB_001714.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001715", "originalText": "तन्मह इत्युपासीत।", "padacchedaText": "", "audioFile": "PB_001715.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001716", "originalText": "महः महत्त्वगुणवत् तदुपासीत।", "padacchedaText": "", "audioFile": "PB_001716.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001717", "originalText": "महान्भवति।", "padacchedaText": "", "audioFile": "PB_001717.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001718", "originalText": "तन्मन इत्युपासीत।", "padacchedaText": "", "audioFile": "PB_001718.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001719", "originalText": "मननं मनः। मानवान्भवति मननसमर्थो भवति॥", "padacchedaText": "", "audioFile": "PB_001719.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001720", "originalText": "तन्नम इत्युपासीत।", "padacchedaText": "", "audioFile": "PB_001720.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001721", "originalText": "नम्यन्तेऽस्मै कामाः।", "padacchedaText": "", "audioFile": "PB_001721.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001722", "originalText": "तद्ब्रह्मेत्युपासीत।", "padacchedaText": "", "audioFile": "PB_001722.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001723", "originalText": "ब्रह्मवान् भवति।", "padacchedaText": "", "audioFile": "PB_001723.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001724", "originalText": "तद्ब्रह्मणः परिमर इत्युपासीत।", "padacchedaText": "", "audioFile": "PB_001724.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001725", "originalText": "पर्येणं म्रियन्ते द्विषन्तः सपत्नाः।", "padacchedaText": "", "audioFile": "PB_001725.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001726", "originalText": "परि येऽप्रिया भ्रातृव्याः।", "padacchedaText": "", "audioFile": "PB_001726.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001727", "originalText": "स यश्चायं पुरुषे।", "padacchedaText": "", "audioFile": "PB_001727.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001728", "originalText": "यश्चासावादित्ये। स एकः॥ ४॥", "padacchedaText": "", "audioFile": "PB_001728.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001729", "originalText": "तन्नम इत्युपासीत नमनं नमः नमनगुणवत् तदुपासीत।", "padacchedaText": "", "audioFile": "PB_001729.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001730", "originalText": "नम्यन्ते प्रह्वीभवन्ति अस्मै उपासित्रे कामाः काम्यन्त इति भोग्या विषया इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001730.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001731", "originalText": "तद्ब्रह्मेत्युपासीत।", "padacchedaText": "", "audioFile": "PB_001731.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001732", "originalText": "ब्रह्म परिबृढतममित्युपासीत।", "padacchedaText": "", "audioFile": "PB_001732.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001733", "originalText": "ब्रह्मवान् तद्गुणो भवति।", "padacchedaText": "", "audioFile": "PB_001733.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001734", "originalText": "तद्ब्रह्मणः परिमर इत्युपासीत ब्रह्मणः परिमरः परिम्रियन्तेऽस्मिन्पञ्च देवता विद्युद्वृष्टिश्चन्द्रमा आदित्योऽग्निरित्येताः।", "padacchedaText": "", "audioFile": "PB_001734.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001735", "originalText": "अतः वायुः परिमरः, श्रुत्यन्तरप्रसिद्धेः।", "padacchedaText": "", "audioFile": "PB_001735.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001736", "originalText": "स एवायं वायुराकाशेनानन्य इत्याकाशो ब्रह्मणः परिमरः, तस्मादाकाशं वाय्वात्मानं ब्रह्मणः परिमर इत्युपासीत।", "padacchedaText": "", "audioFile": "PB_001736.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001737", "originalText": "एनम् एवंविदं प्रतिस्पर्धिनो द्विषन्तः, अद्विषन्तोऽपि सपत्ना यतो भवन्ति, अतो विशेष्यन्ते द्विषन्तः सपत्ना इति।", "padacchedaText": "", "audioFile": "PB_001737.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001738", "originalText": "एनं द्विषन्तः सपत्नाः ते परिम्रियन्ते प्राणान् जहति। किं च, ये च अप्रिया अस्य भ्रातृव्या अद्विषन्तोऽपि ते च परिम्रियन्ते॥", "padacchedaText": "", "audioFile": "PB_001738.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001739", "originalText": "‘प्राणो वा अन्नं शरीरमन्नादम्’ इत्यारभ्य आकाशान्तस्य कार्यस्यैव अन्नान्नादत्वमुक्तम्।", "padacchedaText": "", "audioFile": "PB_001739.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001740", "originalText": "उक्तं नाम— किं तेन? तेनैतत्सिद्धं भवति— कार्यविषय एव भोज्यभोक्तृत्वकृतः संसारः, न त्वात्मनीति।", "padacchedaText": "", "audioFile": "PB_001740.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001741", "originalText": "आत्मनि तु भ्रान्त्या उपचर्यते।", "padacchedaText": "", "audioFile": "PB_001741.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001742", "originalText": "नन्वात्मापि परमात्मनः कार्यम्, ततो युक्तः तस्य संसार इति, न, असंसारिण एव प्रवेशश्रुतेः।", "padacchedaText": "", "audioFile": "PB_001742.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001743", "originalText": "‘तत्सृष्ट्वा तदेवानुप्राविशत्’ (तै.२.६.१) इत्याकाशादिकारणस्य हि असंसारिण एव परमात्मनः कार्येष्वनुप्रवेशः श्रूयते।", "padacchedaText": "", "audioFile": "PB_001743.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001744", "originalText": "तस्मात्कार्यानुप्रविष्टो जीव आत्मा पर एव असंसारी, सृष्ट्वा अनुप्राविशदिति समानकर्तृत्वोपपत्तेश्च।", "padacchedaText": "", "audioFile": "PB_001744.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001745", "originalText": "सर्गप्रवेशक्रिययोश्चैकश्चेत्कर्ता, ततः क्त्वाप्रत्ययो युक्तः।", "padacchedaText": "", "audioFile": "PB_001745.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001746", "originalText": "प्रविष्टस्य तु भावान्तरापत्तिरिति चेत्, न, प्रवेशस्यान्यार्थत्वेन प्रत्याख्यातत्वात्।", "padacchedaText": "", "audioFile": "PB_001746.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001747", "originalText": "‘अनेन जीवेन आत्मना’ (छा.६.३.२)इति विशेषश्रुतेः धर्मान्तरेणानुप्रवेश इति चेत्, न, ‘तत् त्वमसि’ (छा.६.८.१६) इति पुनः तद्भावोक्तेः।", "padacchedaText": "", "audioFile": "PB_001747.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001748", "originalText": "भावान्तरापन्नस्यैव तदपोहार्था संपत् इति चेत्— न, ‘तत् सत्यम्’ ‘स आत्मा’ ‘तत् त्वमसि’ (छा.६.८.१६) इति सामानाधिकरण्यात्।", "padacchedaText": "", "audioFile": "PB_001748.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001749", "originalText": "दृष्टं जीवस्य संसारित्वमिति चेत्, न, उपलब्धुरनुपलभ्यत्वात्।", "padacchedaText": "", "audioFile": "PB_001749.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001750", "originalText": "संसारधर्मविशिष्ट आत्मोपलभ्यत इति चेत्, न, धर्माणां धर्मिणोऽव्यतिरेकात् कर्मत्वानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_001750.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001751", "originalText": "उष्णप्रकाशयोर्दाह्यप्रकाश्यत्वानुपपत्तिवत् त्रासादिदर्शनाद्दुःखित्वाद्यनुमीयत इति चेत्, न, त्रासादेर्दुःखस्य च उपलभ्यमानत्वात् नोपलब्धृधर्मत्वम्।", "padacchedaText": "", "audioFile": "PB_001751.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001752", "originalText": "कापिलकाणादादितर्कशास्त्रविरोध इति चेत्, न, तेषां मूलाभावे वेदविरोधे च भ्रान्तत्वोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_001752.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001753", "originalText": "श्रुत्युपपत्तिभ्यां च सिद्धम् आत्मनोऽसंसारित्वम्, एकत्वाच्च। कथमेकत्वमिति, उच्यते— स यश्चायं पुरुषे यश्चासावादित्ये स एकः इत्येवमादि पूर्ववत्सर्वम्॥", "padacchedaText": "", "audioFile": "PB_001753.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001754", "originalText": "स य एवंवित्।", "padacchedaText": "", "audioFile": "PB_001754.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001755", "originalText": "अस्माल्लोकात्प्रेत्य।", "padacchedaText": "", "audioFile": "PB_001755.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001756", "originalText": "एतमन्नमयमात्मानमुपसङ्क्रम्य।", "padacchedaText": "", "audioFile": "PB_001756.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001757", "originalText": "एतं प्राणमयमात्मानमुपसङ्क्रम्य।", "padacchedaText": "", "audioFile": "PB_001757.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001758", "originalText": "एतं मनोमयमात्मानमुपसङ्क्रम्य।", "padacchedaText": "", "audioFile": "PB_001758.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001759", "originalText": "एतं विज्ञानमयमात्मानमुपसङ्क्रम्य।", "padacchedaText": "", "audioFile": "PB_001759.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001760", "originalText": "एतमानन्दमयमात्मानमुपसङ्क्रम्य।", "padacchedaText": "", "audioFile": "PB_001760.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001761", "originalText": "इमांल्लोकान्कामान्नी कामरूप्यनुसञ्चरन्।", "padacchedaText": "", "audioFile": "PB_001761.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001762", "originalText": "एतत्साम गायन्नास्ते। हा३वु हा३वु हा३वु॥ ५॥", "padacchedaText": "", "audioFile": "PB_001762.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001763", "originalText": "अन्नमयादिक्रमेण आनन्दमयमात्मानमुपसङ्क्रम्य एतत्साम गायन्नास्ते।", "padacchedaText": "", "audioFile": "PB_001763.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001764", "originalText": "‘सत्यं ज्ञानम्’ इत्यस्या ऋचः अर्थः व्याख्यातः विस्तरेण तद्विवरणभूतया आनन्दवल्ल्या।", "padacchedaText": "", "audioFile": "PB_001764.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001765", "originalText": "‘सोऽश्नुते सर्वान्कामान्सह ब्रह्मणा विपश्चिता’ (तै.२.१.१) इति तस्य फलवचनस्य अर्थविस्तारो नोक्तः।", "padacchedaText": "", "audioFile": "PB_001765.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001766", "originalText": "के ते? किंविषया वा सर्वे कामाः? कथं वा ब्रह्मणा सह समश्नुते?— इत्येतद्वक्तव्यमितीदमिदानीमारभ्यते।", "padacchedaText": "", "audioFile": "PB_001766.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001767", "originalText": "तत्र पितापुत्राख्यायिकायां पूर्वविद्याशेषभूतायां तपः ब्रह्मविद्यासाधनमुक्तम्।", "padacchedaText": "", "audioFile": "PB_001767.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001768", "originalText": "प्राणादेराकाशान्तस्य च कार्यस्य अन्नान्नादत्वेन विनियोगश्च उक्तः, ब्रह्मविषयोपासनानि च।", "padacchedaText": "", "audioFile": "PB_001768.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001769", "originalText": "ये च सर्वे कामाः प्रतिनियतानेकसाधनसाध्या आकाशादिकार्यभेदविषयाः, एते दर्शिताः।", "padacchedaText": "", "audioFile": "PB_001769.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001770", "originalText": "एकत्वे पुनः कामकामित्वानुपपत्तिः, भेदजातस्य सर्वस्य आत्मभूतत्वात्।", "padacchedaText": "", "audioFile": "PB_001770.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001771", "originalText": "तत्र कथं युगपद्ब्रह्मस्वरूपेण सर्वान्कामान् एवंवित्समश्नुत इति, उच्यते— सर्वात्मत्वोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_001771.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001772", "originalText": "कथं सर्वात्मत्वोपपत्तिरिति, आह— पुरुषादित्यस्थात्मैकत्वविज्ञानेनापोह्योत्कर्षापकर्षावन्नमयादीन्आत्मनोऽविद्याकल्पितान् क्रमेण सङ्क्रम्य आनन्दमयान्तान् सत्यं ज्ञानमनन्तं ब्रह्म अदृश्यादिधर्मकं स्वाभाविकमानन्दमजममृतमभयमद्वैतं फलभूतमापन्नः इमँल्लोकान्भूरादीननुसञ्चरन्निति व्यवहितेन सम्बन्धः।", "padacchedaText": "", "audioFile": "PB_001772.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001773", "originalText": "कथमनुसञ्चरन्? कामान्नी कामतोऽन्नमस्येति कामान्नी, तथा कामतो रूपाण्यस्येति कामरूपी, अनुसञ्चरन् सर्वात्मना इमान् लोकानात्मत्वेन अनुभवन्।", "padacchedaText": "", "audioFile": "PB_001773.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001774", "originalText": "किम्? एतत्साम गायन्नास्ते।", "padacchedaText": "", "audioFile": "PB_001774.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001775", "originalText": "समत्वाद्ब्रह्मैव साम सर्वानन्यरूपं गायन् शब्दयन् आत्मैकत्वं प्रख्यापयन् लोकानुग्रहार्थं तद्विज्ञानफलं च अतीव कृतार्थत्वं गायन् आस्ते तिष्ठति।", "padacchedaText": "", "audioFile": "PB_001775.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001776", "originalText": "कथम्? हा३वु हा३वु हा३वु। अहो इत्येतस्मिन्नर्थेऽत्यन्तविस्मयख्यापनार्थम्॥", "padacchedaText": "", "audioFile": "PB_001776.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001777", "originalText": "कः पुनरसौ विस्मय इति, उच्यते—\nअहमन्नमहमन्नमहमन्नम्।", "padacchedaText": "", "audioFile": "PB_001777.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001778", "originalText": "अहमन्नादो३ऽहमन्नादो३ऽहमन्नादः।", "padacchedaText": "", "audioFile": "PB_001778.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001779", "originalText": "अहं श्लोककृदहं श्लोककृदहं श्लोककृत्।", "padacchedaText": "", "audioFile": "PB_001779.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001780", "originalText": "अहमस्मि प्रथमजा ऋता३स्य।", "padacchedaText": "", "audioFile": "PB_001780.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001781", "originalText": "पूर्वं देवेभ्योऽमृतस्य ना३भायि।", "padacchedaText": "", "audioFile": "PB_001781.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001782", "originalText": "यो मा ददाति स इदेव मा३वाः।", "padacchedaText": "", "audioFile": "PB_001782.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001783", "originalText": "अहमन्नमन्नमदन्तमा३द्मि।", "padacchedaText": "", "audioFile": "PB_001783.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001784", "originalText": "अहं विश्वं भुवनमभ्यभवा३म्।", "padacchedaText": "", "audioFile": "PB_001784.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001785", "originalText": "सुवर्न ज्योतीः।", "padacchedaText": "", "audioFile": "PB_001785.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001786", "originalText": "य एवं वेद। इत्युपनिषत्॥ ६॥", "padacchedaText": "", "audioFile": "PB_001786.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001787", "originalText": "अद्वैत आत्मा निरञ्जनोऽपि सन् अहमेवान्नमन्नादश्च।", "padacchedaText": "", "audioFile": "PB_001787.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001788", "originalText": "किञ्च, अहमेव श्लोककृत्।", "padacchedaText": "", "audioFile": "PB_001788.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001789", "originalText": "श्लोको नाम अन्नान्नादयोः सङ्घातः, तस्य कर्ता चेतनावान्।", "padacchedaText": "", "audioFile": "PB_001789.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001790", "originalText": "अन्नस्यैव वा परार्थस्य अन्नादार्थस्य सतोऽनेकात्मकस्य पारार्थ्येन हेतुना सङ्घातकृत्।", "padacchedaText": "", "audioFile": "PB_001790.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001791", "originalText": "त्रिरुक्तिः विस्मयत्वख्यापनार्था।", "padacchedaText": "", "audioFile": "PB_001791.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001792", "originalText": "अहमस्मि भवामि।", "padacchedaText": "", "audioFile": "PB_001792.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001793", "originalText": "प्रथमजाः प्रथमजः प्रथमोत्पन्नः।", "padacchedaText": "", "audioFile": "PB_001793.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001794", "originalText": "ऋतस्य सत्यस्य मूर्तामूर्तस्यास्य जगतो देवेभ्यश्च पूर्वममृतस्य नाभिः अमृतत्वस्य नाभिः, मध्यं मत्संस्थम् अमृतत्वं प्राणिनामित्यर्थः।", "padacchedaText": "", "audioFile": "PB_001794.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001795", "originalText": "यः कश्चित् मा माम् अन्नमन्नार्थिभ्यो ददाति प्रयच्छति— अन्नात्मना ब्रवीति, सः इत् इत्थमेवेत्यर्थः, एवमविनष्टं यथाभूतं माम् आवा अवतीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001795.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001796", "originalText": "यः पुनरन्यो मामदत्वा अर्थिभ्यः काले प्राप्तेऽन्नमत्ति तमन्नमदन्तं भक्षयन्तं पुरुषमहमन्नमेव संप्रत्यद्मि भक्षयामि।", "padacchedaText": "", "audioFile": "PB_001796.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001797", "originalText": "अत्राह— एवं तर्हि बिभेमि सर्वात्मत्वप्राप्तेर्मोक्षात्, अस्तु संसार एव, यतो मुक्तोऽप्यहम् अन्नभूतः अद्यः स्याम् अन्यस्य।", "padacchedaText": "", "audioFile": "PB_001797.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001798", "originalText": "एवं मा भैषीः, संव्यवहारविषयत्वात् सर्वकामाशनस्य, अतीत्यायं संव्यवहारविषयमन्नान्नादादिलक्षणमविद्याकृतं विद्यया ब्रह्मत्वमापन्नः विद्वान्, तस्य नैव द्वितीयं वस्त्वन्तरमस्ति, यतो बिभेति, अतो न भेतव्यं मोक्षात्।", "padacchedaText": "", "audioFile": "PB_001798.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001799", "originalText": "एवं तर्हि किमिदमाह— अहमन्नमहमन्नाद इति? उच्यते।", "padacchedaText": "", "audioFile": "PB_001799.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001800", "originalText": "योऽयमन्नान्नादादिलक्षणः संव्यवहारः कार्यभूतः, स संव्यवहारमात्रमेव, न परमार्थवस्तु।", "padacchedaText": "", "audioFile": "PB_001800.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001801", "originalText": "स एवंभूतोऽपि ब्रह्मनिमित्तो ब्रह्मव्यतिरेकेणासन्निति कृत्वा ब्रह्मविद्याकार्यस्य ब्रह्मभावस्य स्तुत्यर्थमुच्यते— ‘अहमन्नमहमन्नमहमन्नम्।", "padacchedaText": "", "audioFile": "PB_001801.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001802", "originalText": "अहमन्नादोऽहमन्नादोऽहमन्नादः’ इत्यादि।", "padacchedaText": "", "audioFile": "PB_001802.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001803", "originalText": "अतः भयादिदोषगन्धोऽपि अविद्यानिमित्तः अविद्योच्छेदाद्ब्रह्मभूतस्य नास्तीति।", "padacchedaText": "", "audioFile": "PB_001803.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001804", "originalText": "अहं विश्वं समस्तं भुवनं भूतैः सम्भजनीयं ब्रह्मादिभिर्भवन्तीति वा अस्मिन् भूतानीति भुवनम् अभ्यभवाम् अभिभवामि परेणेश्वरेण स्वरूपेण।", "padacchedaText": "", "audioFile": "PB_001804.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001805", "originalText": "सुवर्न ज्योतीः सुवः आदित्यः, नकार उपमार्थे, आदित्य इव सकृद्विभातमस्मदीयं ज्योतीः ज्योतिः, प्रकाश इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001805.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001806", "originalText": "इति वल्लीद्वयविहिता उपनिषत् परमात्मज्ञानम्, तामेतां यथोक्तामुपनिषदं शान्तो दान्त उपरतस्तितिक्षुः समाहितो भूत्वा भृगुवत् तपो महदास्थाय य एवं वेद, तस्येदं फलं यथोक्तमोक्ष इति॥", "padacchedaText": "", "audioFile": "PB_001806.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001807", "originalText": "इति दशमानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_001807.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001808", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ तैत्तिरीयोपनिषद्भाष्ये भृगुवल्लीभाष्यं सम्पूर्णम्॥", "padacchedaText": "", "audioFile": "PB_001808.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001809", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ तैत्तिरीयोपनिषद्भाष्यं सम्पूर्णम्॥", "padacchedaText": "", "audioFile": "PB_001809.wav", "zipFile": "007_TaittiriyaBhashya.zip"}];
        const contentDiv = document.getElementById('content');
        
        let currentIndex = -1;
        let isPlaying = false;
        
        // Use standard HTML5 audio to preserve pitch on speed changes
        const audioEl = new Audio();
        audioEl.preservesPitch = true;
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            audioEl.playbackRate = this.value;
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        let currentScript = 'devanagari';
        const scriptSelect = document.getElementById('script-select');
        scriptSelect.onchange = function() {
            currentScript = this.value;
            document.querySelectorAll('.sentence-text').forEach((span, index) => {
                let origText = manifest[index].originalText;
                if (currentScript === 'devanagari') {
                    span.innerText = origText;
                } else {
                    span.innerText = Sanscript.t(origText, 'devanagari', currentScript);
                }
            });
        };
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        playPauseBtn.onclick = () => {
            if (isPlaying) {
                audioEl.pause();
                isPlaying = false;
                playPauseBtn.innerText = "Resume";
            } else {
                playAudio(Math.max(0, currentIndex));
                playPauseBtn.innerText = "Stop";
            }
        };
        
        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'sentence-text';
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => {
                playPauseBtn.innerText = "Stop";
                playAudio(index);
            };
            contentDiv.appendChild(div);
        });
        
        // --- HTML5 Audio Prefetching Logic (via Blob URLs) ---
        const PREFETCH_BUFFER_SIZE = 3;
        let prefetchQueue = new Map(); // index -> Blob URL

        function getAudioUrl(index) {
            if (index < 0 || index >= manifest.length) return null;
            const item = manifest[index];
            const zipToUse = item.zipFile || ZIP_NAME;
            return WORKER_URL + '/' + BUCKET_NAME + '/' + zipToUse + '/' + item.audioFile;
        }

        async function fetchBlobUrl(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        async function prefetchNext(fromIndex) {
            for (let i = fromIndex + 1; i <= fromIndex + PREFETCH_BUFFER_SIZE; i++) {
                if (i >= manifest.length) break;
                if (!prefetchQueue.has(i)) {
                    prefetchQueue.set(i, 'fetching');
                    const url = getAudioUrl(i);
                    try {
                        const blobUrl = await fetchBlobUrl(url);
                        if (prefetchQueue.get(i) === 'fetching') {
                            prefetchQueue.set(i, blobUrl);
                        } else {
                            URL.revokeObjectURL(blobUrl);
                        }
                    } catch (err) {
                        console.error("Prefetch failed for index", i, err);
                        prefetchQueue.delete(i);
                    }
                }
            }
            // Cleanup old blobs to free memory
            for (let [key, val] of prefetchQueue.entries()) {
                if (key < fromIndex) {
                    if (typeof val === 'string' && val.startsWith('blob:')) {
                        URL.revokeObjectURL(val);
                    }
                    prefetchQueue.delete(key);
                }
            }
        }
        // ------------------------

        async function playAudio(index) {
            if (index < 0 || index >= manifest.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Start Reading";
                return;
            }
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            audioEl.pause();
            
            try {
                let audioUrl;
                if (prefetchQueue.has(index) && prefetchQueue.get(index) !== 'fetching') {
                    audioUrl = prefetchQueue.get(index);
                } else {
                    const sourceUrl = getAudioUrl(index);
                    audioUrl = await fetchBlobUrl(sourceUrl);
                }
                
                audioEl.src = audioUrl;
                audioEl.playbackRate = speedSlider.value;
                audioEl.onended = () => { playAudio(currentIndex + 1); };
                
                await audioEl.play();
                isPlaying = true;
                
            } catch (e) {
                console.error("Audio play error:", e);
                // Fallback to next track if error
                setTimeout(() => playAudio(currentIndex + 1), 500);
            }
            
            // Trigger prefetch for upcoming sentences
            prefetchNext(index);
        }
    </script>
