ं पशूनामशनायापिपासे एवाभिविज्ञानम्’ इत्यादि श्रुत्यन्तरदर्शनात्॥", "padacchedaText": "", "audioFile": "PB_000822.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000823", "originalText": "स हि पुरुषः इह विद्यया आन्तरतमं ब्रह्म सङ्क्रामयितुमिष्टः।", "padacchedaText": "", "audioFile": "PB_000823.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000824", "originalText": "तस्य च बाह्याकारविशेषेष्वनात्मसु आत्मभाविताबुद्धिः विना आलम्बनविशेषं कञ्चित् सहसा आन्तरतमप्रत्यगात्मविषया निरालम्बना च कर्तुमशक्येति दृष्टशरीरात्मसामान्यकल्पनया शाखाचन्द्रनिदर्शनवदन्तः प्रवेशयन्नाह— तस्येदमेव शिरः।", "padacchedaText": "", "audioFile": "PB_000824.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000825", "originalText": "तस्य अस्य पुरुषस्यान्नरसमयस्य इदमेव शिरः प्रसिद्धम्।", "padacchedaText": "", "audioFile": "PB_000825.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000826", "originalText": "प्राणमयादिष्वशिरसां शिरस्त्वदर्शनादिहापि तत्प्रसङ्गो मा भूदिति इदमेव शिर इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_000826.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000827", "originalText": "एवं पक्षादिषु योजना।", "padacchedaText": "", "audioFile": "PB_000827.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000828", "originalText": "अयं दक्षिणो बाहुः पूर्वाभिमुखस्य दक्षिणः पक्षः।", "padacchedaText": "", "audioFile": "PB_000828.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000829", "originalText": "अयं सव्यो बाहुः उत्तरः पक्षः।", "padacchedaText": "", "audioFile": "PB_000829.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000830", "originalText": "अयं मध्यमो देहभागः आत्मा अङ्गानाम्, ‘मध्यं ह्येषामङ्गानामात्मा’ इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_000830.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000831", "originalText": "इदमिति नाभेरधस्ताद्यदङ्गम्, तत् पुच्छं प्रतिष्ठा।", "padacchedaText": "", "audioFile": "PB_000831.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000832", "originalText": "प्रतितिष्ठत्यनयेति प्रतिष्ठा।", "padacchedaText": "", "audioFile": "PB_000832.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000833", "originalText": "पुच्छमिव पुच्छम्, अधोलम्बनसामान्यात्, यथा गोः पुच्छम्।", "padacchedaText": "", "audioFile": "PB_000833.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000834", "originalText": "एतत्प्रकृत्य उत्तरेषां प्राणमयादीनां रूपकत्वसिद्धिः, मूषानिषिक्तद्रुतताम्रप्रतिमावत्।", "padacchedaText": "", "audioFile": "PB_000834.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000835", "originalText": "तदप्येष श्लोको भवति। तत् तस्मिन्नेवार्थे ब्राह्मणोक्ते अन्नमयात्मप्रकाशके एष श्लोकः मन्त्रः भवति॥", "padacchedaText": "", "audioFile": "PB_000835.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000836", "originalText": "इति प्रथमानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000836.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000837", "originalText": "द्वितीयोऽनुवाकः\nअन्नाद्वै प्रजाः प्रजायन्ते।", "padacchedaText": "", "audioFile": "PB_000837.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000838", "originalText": "याः काश्च पृथिवीं श्रिताः।", "padacchedaText": "", "audioFile": "PB_000838.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000839", "originalText": "अथो अन्नेनैव जीवन्ति।", "padacchedaText": "", "audioFile": "PB_000839.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000840", "originalText": "अथैनदपि यन्त्यन्ततः।", "padacchedaText": "", "audioFile": "PB_000840.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000841", "originalText": "अन्नं हि भूतानां ज्येष्ठम्।", "padacchedaText": "", "audioFile": "PB_000841.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000842", "originalText": "तस्मात्सर्वौषधमुच्यते।", "padacchedaText": "", "audioFile": "PB_000842.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000843", "originalText": "सर्वं वै तेऽन्नमाप्नुवन्ति।", "padacchedaText": "", "audioFile": "PB_000843.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000844", "originalText": "येऽन्नं ब्रह्मोपासते।", "padacchedaText": "", "audioFile": "PB_000844.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000845", "originalText": "अन्नं हि भूतानां ज्येष्ठम्।", "padacchedaText": "", "audioFile": "PB_000845.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000846", "originalText": "तस्मात्सर्वौषधमुच्यते।", "padacchedaText": "", "audioFile": "PB_000846.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000847", "originalText": "अन्नाद्भूतानि जायन्ते।", "padacchedaText": "", "audioFile": "PB_000847.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000848", "originalText": "जातान्यन्नेन वर्धन्ते।", "padacchedaText": "", "audioFile": "PB_000848.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000849", "originalText": "अद्यतेऽत्ति च भूतानि।", "padacchedaText": "", "audioFile": "PB_000849.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000850", "originalText": "तस्मादन्नं तदुच्यत इति।", "padacchedaText": "", "audioFile": "PB_000850.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000851", "originalText": "तस्माद्वा एतस्मादन्नरसमयात्।", "padacchedaText": "", "audioFile": "PB_000851.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000852", "originalText": "अन्योऽन्तर आत्मा प्राणमयः।", "padacchedaText": "", "audioFile": "PB_000852.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000853", "originalText": "तेनैष पूर्णः।", "padacchedaText": "", "audioFile": "PB_000853.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000854", "originalText": "स वा एष पुरुषविध एव।", "padacchedaText": "", "audioFile": "PB_000854.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000855", "originalText": "तस्य पुरुषविधताम्।", "padacchedaText": "", "audioFile": "PB_000855.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000856", "originalText": "अन्वयं पुरुषविधः।", "padacchedaText": "", "audioFile": "PB_000856.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000857", "originalText": "तस्य प्राण एव शिरः।", "padacchedaText": "", "audioFile": "PB_000857.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000858", "originalText": "व्यानो दक्षिणः पक्षः।", "padacchedaText": "", "audioFile": "PB_000858.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000859", "originalText": "अपान उत्तरः पक्षः।", "padacchedaText": "", "audioFile": "PB_000859.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000860", "originalText": "आकाश आत्मा।", "padacchedaText": "", "audioFile": "PB_000860.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000861", "originalText": "पृथिवी पुच्छं प्रतिष्ठा। तदप्येष श्लोको भवति॥ १॥", "padacchedaText": "", "audioFile": "PB_000861.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000862", "originalText": "अन्नात् रसादिभावपरिणतात्, वै इति स्मरणार्थः, प्रजाः स्थावरजङ्गमात्मकाः, प्रजायन्ते।", "padacchedaText": "", "audioFile": "PB_000862.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000863", "originalText": "याः काश्च अविशिष्टाः पृथिवीं श्रिताः पृथिवीमाश्रिताः, ताः सर्वा अन्नादेव प्रजायन्ते।", "padacchedaText": "", "audioFile": "PB_000863.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000864", "originalText": "अथो अपि, जाताः अन्नेनैव जीवन्ति प्राणान्धारयन्ति, वर्धन्त इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000864.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000865", "originalText": "अथ अपि, एनत् अन्नम्, अपियन्ति अपिगच्छन्ति, अपि शब्दः प्रतिशब्दार्थे, अन्नं प्रति लीयन्त इत्यर्थः, अन्ततः अन्ते जीवनलक्षणाया वृत्तेः परिसमाप्तौ।", "padacchedaText": "", "audioFile": "PB_000865.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000866", "originalText": "कस्मात्? अन्नं हि यस्मात् भूतानां प्राणिनां ज्येष्ठं प्रथमजम्।", "padacchedaText": "", "audioFile": "PB_000866.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000867", "originalText": "अन्नमयादीनां हि इतरेषां भूतानां कारणमन्नम्, अतः अन्नप्रभवा अन्नजीवना अन्नप्रलयाश्च सर्वाः प्रजाः। यस्माच्चैवम्, तस्मात् सर्वौषधं सर्वप्राणिनां देहदाहप्रशमनमन्नमुच्यते॥", "padacchedaText": "", "audioFile": "PB_000867.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000868", "originalText": "अन्नब्रह्मविदः फलमुच्यते— सर्वं वै ते समस्तमन्नजातम् आप्नुवन्ति।", "padacchedaText": "", "audioFile": "PB_000868.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000869", "originalText": "के? ये अन्नं ब्रह्म यथोक्तम् उपासते।", "padacchedaText": "", "audioFile": "PB_000869.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000870", "originalText": "कथम्? अन्नजोऽन्नात्मान्नप्रलयोऽहम्, तस्मादन्नं ब्रह्म इति।", "padacchedaText": "", "audioFile": "PB_000870.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000871", "originalText": "कुतः पुनः सर्वान्नप्राप्तिफलमन्नात्मोपासनमिति, उच्यते— अन्नं हि भूतानां ज्येष्ठं भूतेभ्यः पूर्वमुत्पन्नत्वाज्ज्येष्ठं हि यस्मात्, तस्मात्सर्वौषधमुच्यते, तस्मादुपपन्ना सर्वान्नात्मोपासकस्य सर्वान्नप्राप्तिः।", "padacchedaText": "", "audioFile": "PB_000871.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000872", "originalText": "अन्नाद्भूतानि जायन्ते, जातान्यन्नेन वर्धन्ते इति उपसंहारार्थं पुनर्वचनम्।", "padacchedaText": "", "audioFile": "PB_000872.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000873", "originalText": "इदानीमन्नशब्दनिर्वचनमुच्यते— अद्यते भुज्यते चैव यद्भूतैः अत्ति च भूतानि स्वयम्, तस्मात् भूतैर्भुज्यमानत्वाद्भूतभोक्तृत्वाच्च अन्नं तत् उच्यते।", "padacchedaText": "", "audioFile": "PB_000873.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000874", "originalText": "इति शब्दः प्रथमकोशपरिसमाप्त्यर्थः।", "padacchedaText": "", "audioFile": "PB_000874.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000875", "originalText": "अन्नमयादिभ्य आनन्दमयान्तेभ्य आत्मभ्यः अभ्यन्तरतमं ब्रह्म विद्यया प्रत्यगात्मत्वेन दिदर्शयिषु शास्त्रम् अविद्याकृतपञ्चकोशापनयनेन अनेकतुषकोद्रववितुषीकरणेनेव तण्डुलान् प्रस्तौति— तस्माद्वा एतस्मादन्नरसमयादित्यादि।", "padacchedaText": "", "audioFile": "PB_000875.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000876", "originalText": "तस्माद्वै एतस्मात् यथोक्तात् अन्नरसमयात्पिण्डात् अन्यः व्यतिरिक्तः अन्तरः अभ्यन्तरः आत्मा पिण्डवदेव मिथ्यापरिकल्पित आत्मत्वेन प्राणमयः, प्राणः वायुः, तन्मयः तत्प्रायः।", "padacchedaText": "", "audioFile": "PB_000876.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000877", "originalText": "तेन प्राणमयेन एषः अन्नरसमय आत्मा पूर्णः वायुनेव दृतिः।", "padacchedaText": "", "audioFile": "PB_000877.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000878", "originalText": "स वै एष प्राणमय आत्मा पुरुषविध एव पुरुषाकार एव शिरःपक्षादिभिः।", "padacchedaText": "", "audioFile": "PB_000878.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000879", "originalText": "किं स्वत एव? नेत्याह— प्रसिद्धं तावदन्नरसमयस्यात्मनः पुरुषविधत्वम्, तस्य अन्नरसमयस्य पुरुषविधतां पुरुषाकारताम् अनु अयं प्राणमयः पुरुषविधः मूषानिषिक्तप्रतिमावत्, न स्वत एव।", "padacchedaText": "", "audioFile": "PB_000879.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000880", "originalText": "एवं पूर्वस्य पूर्वस्य पुरुषविधता, तामनु उत्तरोत्तरः पुरुषविधो भवति, पूर्वः पूर्वश्चोत्तरोत्तरेण पूर्णः।", "padacchedaText": "", "audioFile": "PB_000880.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000881", "originalText": "कथं पुनः पुरुषविधता अस्येति, उच्यते— तस्य प्राणमयस्य प्राण एव शिरः प्राणमयस्य वायुविकारस्य प्राणः मुखनासिकानिःसरणो वृत्तिविशेषः शिर इति कल्प्यते, वचनात्।", "padacchedaText": "", "audioFile": "PB_000881.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000882", "originalText": "सर्वत्र वचनादेव पक्षादिकल्पना।", "padacchedaText": "", "audioFile": "PB_000882.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000883", "originalText": "व्यानः व्यानवृत्तिः दक्षिणः पक्षः।", "padacchedaText": "", "audioFile": "PB_000883.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000884", "originalText": "अपानः उत्तरः पक्षः।", "padacchedaText": "", "audioFile": "PB_000884.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000885", "originalText": "आकाश आत्मा, य आकाशस्थो वृत्तिविशेषः समानाख्यः, स आत्मेव आत्मा प्राणवृत्त्यधिकारात्।", "padacchedaText": "", "audioFile": "PB_000885.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000886", "originalText": "मध्यस्थत्वादितराः पर्यन्ता वृत्तीरपेक्ष्य आत्मा, ‘मध्यं ह्येषामङ्गानामात्मा’ इति प्रसिद्धं मध्यस्थस्यात्मत्वम्।", "padacchedaText": "", "audioFile": "PB_000886.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000887", "originalText": "पृथिवी पुच्छं प्रतिष्ठा।", "padacchedaText": "", "audioFile": "PB_000887.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000888", "originalText": "पृथिवीति पृथिवीदेवता आध्यात्मिकस्य प्राणस्य धारयित्री स्थितिहेतुत्वात्।", "padacchedaText": "", "audioFile": "PB_000888.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000889", "originalText": "‘सैषा पुरुषस्यापानमवष्टभ्य’ (प्र.३.८) इति हि श्रुत्यन्तरम्।", "padacchedaText": "", "audioFile": "PB_000889.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000890", "originalText": "अन्यथा उदानवृत्त्या ऊर्ध्वगमनं गुरुत्वात्पतनं वा स्याच्छरीरस्य।", "padacchedaText": "", "audioFile": "PB_000890.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000891", "originalText": "तस्मात्पृथिवी देवता पुच्छं प्रतिष्ठा प्राणमयस्य आत्मनः। तत् तस्मिन्नेवार्थे प्राणमयात्मविषये एष श्लोको भवति॥", "padacchedaText": "", "audioFile": "PB_000891.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000892", "originalText": "इति द्वितीयानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000892.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000893", "originalText": "तृतीयोऽनुवाकः\nप्राणं देवा अनु प्राणन्ति।", "padacchedaText": "", "audioFile": "PB_000893.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000894", "originalText": "मनुष्याः पशवश्च ये।", "padacchedaText": "", "audioFile": "PB_000894.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000895", "originalText": "प्राणो हि भूतानामायुः।", "padacchedaText": "", "audioFile": "PB_000895.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000896", "originalText": "तस्मात्सर्वायुषमुच्यते।", "padacchedaText": "", "audioFile": "PB_000896.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000897", "originalText": "सर्वमेव त आयुर्यन्ति।", "padacchedaText": "", "audioFile": "PB_000897.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000898", "originalText": "ये प्राणं ब्रह्मोपासते।", "padacchedaText": "", "audioFile": "PB_000898.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000899", "originalText": "प्राणो हि भूतानामायुः।", "padacchedaText": "", "audioFile": "PB_000899.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000900", "originalText": "तस्मात्सर्वायुषमुच्यत इति।", "padacchedaText": "", "audioFile": "PB_000900.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000901", "originalText": "तस्यैष एव शारीर आत्मा।", "padacchedaText": "", "audioFile": "PB_000901.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000902", "originalText": "यः पूर्वस्य।", "padacchedaText": "", "audioFile": "PB_000902.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000903", "originalText": "तस्माद्वा एतस्मात्प्राणमयात्।", "padacchedaText": "", "audioFile": "PB_000903.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000904", "originalText": "अन्योऽन्तर आत्मा मनोमयः।", "padacchedaText": "", "audioFile": "PB_000904.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000905", "originalText": "तेनैष पूर्णः।", "padacchedaText": "", "audioFile": "PB_000905.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000906", "originalText": "स वा एष पुरुषविध एव।", "padacchedaText": "", "audioFile": "PB_000906.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000907", "originalText": "तस्य पुरुषविधताम्।", "padacchedaText": "", "audioFile": "PB_000907.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000908", "originalText": "अन्वयं पुरुषविधः।", "padacchedaText": "", "audioFile": "PB_000908.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000909", "originalText": "तस्य यजुरेव शिरः।", "padacchedaText": "", "audioFile": "PB_000909.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000910", "originalText": "ऋग्दक्षिणः पक्षः।", "padacchedaText": "", "audioFile": "PB_000910.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000911", "originalText": "सामोत्तरः पक्षः।", "padacchedaText": "", "audioFile": "PB_000911.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000912", "originalText": "आदेश आत्मा।", "padacchedaText": "", "audioFile": "PB_000912.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000913", "originalText": "अथर्वाङ्गिरसः पुच्छं प्रतिष्ठा। तदप्येष श्लोको भवति॥ १॥", "padacchedaText": "", "audioFile": "PB_000913.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000914", "originalText": "प्राणं देवा अनु प्राणन्ति।", "padacchedaText": "", "audioFile": "PB_000914.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000915", "originalText": "अग्न्यादयः देवाः प्राणं वाय्वात्मानं प्राणनशक्तिमन्तम् अनु तदात्मभूताः सन्तः प्राणन्ति प्राणनकर्म कुर्वन्ति, प्राणनक्रियया क्रियावन्तो भवन्ति।", "padacchedaText": "", "audioFile": "PB_000915.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000916", "originalText": "अध्यात्माधिकारात् देवाः इन्द्रियाणि प्राणमनु प्राणन्ति।", "padacchedaText": "", "audioFile": "PB_000916.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000917", "originalText": "मुख्यप्राणमनु चेष्टन्त इति वा।", "padacchedaText": "", "audioFile": "PB_000917.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000918", "originalText": "तथा मनुष्याः पशवश्च ये, ते प्राणनकर्मणैव चेष्टावन्तो भवन्ति।", "padacchedaText": "", "audioFile": "PB_000918.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000919", "originalText": "अतश्च नान्नमयेनैव परिच्छिन्नात्मना आत्मवन्तः प्राणिनः।", "padacchedaText": "", "audioFile": "PB_000919.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000920", "originalText": "किं तर्हि? तदन्तर्गतप्राणमयेनापि साधारणेनैव सर्वपिण्डव्यापिना आत्मवन्तो मनुष्यादयः।", "padacchedaText": "", "audioFile": "PB_000920.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000921", "originalText": "एवं मनोमयादिभिः पूर्वपूर्वव्यापिभिः उत्तरोत्तरैः सूक्ष्मैः आनन्दमयान्तैराकाशादिभूतारब्धैरविद्याकृतैः आत्मवन्तः सर्वे प्राणिनः, तथा, स्वाभाविकेनाप्याकाशादिकारणेन नित्येनाविकृतेन सर्वगतेन सत्यज्ञानानन्तलक्षणेन पञ्चकोशातिगेन सर्वात्मना आत्मवन्तः, स हि परमार्थत आत्मा सर्वेषामित्येतदप्यर्थादुक्तं भवति।", "padacchedaText": "", "audioFile": "PB_000921.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000922", "originalText": "प्राणं देवा अनु प्राणन्तीत्याद्युक्तम्, तत्कस्मादित्याह— प्राणः हि यस्मात् भूतानां प्राणिनाम् आयुः जीवनम्, ‘यावद्ध्यस्मिञ्शरीरे प्राणो वसति तावदेवायुः’ (कौ.३.२) इति श्रुत्यन्तरात्।", "padacchedaText": "", "audioFile": "PB_000922.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000923", "originalText": "तस्मात् सर्वायुषम्, सर्वेषामायुः सर्वायुः, सर्वायुरेव सर्वायुषम् इत्युच्यते, प्राणापगमे मरणप्रसिद्धेः।", "padacchedaText": "", "audioFile": "PB_000923.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000924", "originalText": "प्रसिद्धं हि लोके सर्वायुष्ट्वं प्राणस्य।", "padacchedaText": "", "audioFile": "PB_000924.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000925", "originalText": "अतः अस्माद्बाह्यादसाधारणादन्नमयादात्मनोऽपक्रम्य अन्तः साधारणं प्राणमयमात्मानं ब्रह्म उपासते ये ‘अहमस्मि प्राणः सर्वभूतानामात्मा आयुः, जीवनहेतुत्वात्’ इति, ते सर्वमेव आयुः अस्मिंल्लोके यन्ति, नापमृत्युना म्रियन्ते प्राक्प्राप्तादायुष इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000925.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000926", "originalText": "शतं वर्षाणीति तु युक्तम्, ‘सर्वमायुरेति’ (छा.२.११.२)(छा.४.११.२) इति श्रुतिप्रसिद्धेः।", "padacchedaText": "", "audioFile": "PB_000926.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000927", "originalText": "किं कारणम्?— प्राणो हि भूतानामायुः तस्मात्सर्वायुषमुच्यत इति।", "padacchedaText": "", "audioFile": "PB_000927.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000928", "originalText": "यो यद्गुणकं ब्रह्मोपास्ते, स तद्गुणभाग्भवतीति विद्याफलप्राप्तेर्हेत्वर्थं पुनर्वचनम्— प्राणो हीत्यादि।", "padacchedaText": "", "audioFile": "PB_000928.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000929", "originalText": "तस्य पूर्वस्य अन्नमयस्य एष एव शरीरे अन्नमये भवः शारीरः आत्मा।", "padacchedaText": "", "audioFile": "PB_000929.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000930", "originalText": "कः? य एष प्राणमयः।", "padacchedaText": "", "audioFile": "PB_000930.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000931", "originalText": "तस्माद्वा एतस्मादित्याद्युक्तार्थमन्यत्।", "padacchedaText": "", "audioFile": "PB_000931.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000932", "originalText": "अन्योऽन्तर आत्मा मनोमयः।", "padacchedaText": "", "audioFile": "PB_000932.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000933", "originalText": "मन इति सङ्कल्पविकल्पात्मकमन्तःकरणम्, तन्मयो मनोमयः, सोऽयं प्राणमयस्याभ्यन्तर आत्मा।", "padacchedaText": "", "audioFile": "PB_000933.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000934", "originalText": "तस्य यजुरेव शिरः।", "padacchedaText": "", "audioFile": "PB_000934.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000935", "originalText": "यजुरिति अनियताक्षरपादावसानो मन्त्रविशेषः, तज्जातीयवचनो यजुःशब्दः, तस्य शिरस्त्वम्, प्राधान्यात्। प्राधान्यं च यागादौ संनिपत्योपकारकत्वात् यजुषा हि हविर्दीयते स्वाहाकारादिना॥", "padacchedaText": "", "audioFile": "PB_000935.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000936", "originalText": "वाचनिकी वा शिरआदिकल्पना सर्वत्र।", "padacchedaText": "", "audioFile": "PB_000936.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000937", "originalText": "मनसो हि स्थानप्रयत्ननादस्वरवर्णपदवाक्यविषया तत्सङ्कल्पात्मिका तद्भाविता वृत्तिः श्रोत्रकरणद्वारा यजुःसङ्केतेन विशिष्टा यजुरित्युच्यते।", "padacchedaText": "", "audioFile": "PB_000937.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000938", "originalText": "एवम् ऋक्, एवं साम च।", "padacchedaText": "", "audioFile": "PB_000938.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000939", "originalText": "एवं च मनोवृत्तित्वे मन्त्राणाम्, वृत्तिरेव आवर्त्यत इति मानसो जप उपपद्यते।", "padacchedaText": "", "audioFile": "PB_000939.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000940", "originalText": "अन्यथा अविषयत्वान्मन्त्रो नावर्तयितुं शक्यः घटादिवत् इति मानसो जपो नोपपद्यते।", "padacchedaText": "", "audioFile": "PB_000940.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000941", "originalText": "मन्त्रावृत्तिश्चोद्यते बहुशः कर्मसु।", "padacchedaText": "", "audioFile": "PB_000941.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000942", "originalText": "अक्षरविषयस्मृत्यावृत्त्या मन्त्रावृत्तिः स्यात् इति चेत्, न, मुख्यार्थासम्भवात्।", "padacchedaText": "", "audioFile": "PB_000942.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000943", "originalText": "‘त्रिः प्रथमामन्वाह त्रिरुत्तमाम्’ इति ऋगावृत्तिः श्रूयते।", "padacchedaText": "", "audioFile": "PB_000943.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000944", "originalText": "तत्र ऋचः अविषयत्वे तद्विषयस्मृत्यावृत्त्या मन्त्रावृत्तौ च क्रियमाणायाम् ‘त्रिः प्रथमामन्वाह’ इति ऋगावृत्तिर्मुख्योऽर्थश्चोदितः परित्यक्तः स्यात्।", "padacchedaText": "", "audioFile": "PB_000944.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000945", "originalText": "तस्मान्मनोवृत्त्युपाधिपरिच्छिन्नं मनोवृत्तिनिष्ठमात्मचैतन्यमनादिनिधनं यजुःशब्दवाच्यम् आत्मविज्ञानं मन्त्रा इति।", "padacchedaText": "", "audioFile": "PB_000945.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000946", "originalText": "एवं च नित्यत्वोपपत्तिर्वेदानाम्।", "padacchedaText": "", "audioFile": "PB_000946.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000947", "originalText": "अन्यथाविषयत्वे रूपादिवदनित्यत्वं च स्यात्, नैतद्युक्तम्।", "padacchedaText": "", "audioFile": "PB_000947.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000948", "originalText": "‘सर्वे वेदा यत्रैकं भवन्ति स मानसीन आत्मा’ इति च श्रुतिः नित्यात्मनैकत्वं ब्रुवन्ती ऋगादीनां नित्यत्वे समञ्जसा स्यात्।", "padacchedaText": "", "audioFile": "PB_000948.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000949", "originalText": "‘ऋचोऽक्षरे परमे व्योमन्यस्मिन्देवा अधि विश्वे निषेदुः’ (श्वे.४.८) इति च मन्त्रवर्णः।", "padacchedaText": "", "audioFile": "PB_000949.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000950", "originalText": "आदेशः अत्र ब्राह्मणम्, आदेष्टव्यविशेषानादिशतीति।", "padacchedaText": "", "audioFile": "PB_000950.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000951", "originalText": "अथर्वणाङ्गिरसा च दृष्टा मन्त्रा ब्राह्मणं च शान्तिकपौष्टिकादिप्रतिष्ठाहेतुकर्मप्रधानत्वात् पुच्छं प्रतिष्ठा। तदप्येष श्लोको भवति मनोमयात्मप्रकाशकः पूर्ववत्॥", "padacchedaText": "", "audioFile": "PB_000951.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000952", "originalText": "इति तृतीयानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000952.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000953", "originalText": "चतुर्थोऽनुवाकः\nयतो वाचो निवर्तन्ते।", "padacchedaText": "", "audioFile": "PB_000953.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000954", "originalText": "अप्राप्य मनसा सह।", "padacchedaText": "", "audioFile": "PB_000954.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000955", "originalText": "आनन्दं ब्रह्मणो विद्वान्।", "padacchedaText": "", "audioFile": "PB_000955.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000956", "originalText": "न बिभेति कदाचनेति।", "padacchedaText": "", "audioFile": "PB_000956.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000957", "originalText": "तस्यैष एव शारीर आत्मा।", "padacchedaText": "", "audioFile": "PB_000957.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000958", "originalText": "यः पूर्वस्य।", "padacchedaText": "", "audioFile": "PB_000958.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000959", "originalText": "तस्माद्वा एतस्मान्मनोमयात्।", "padacchedaText": "", "audioFile": "PB_000959.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000960", "originalText": "अन्योऽन्तर आत्मा विज्ञानमयः।", "padacchedaText": "", "audioFile": "PB_000960.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000961", "originalText": "तेनैष पूर्णः।", "padacchedaText": "", "audioFile": "PB_000961.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000962", "originalText": "स वा एष पुरुषविध एव।", "padacchedaText": "", "audioFile": "PB_000962.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000963", "originalText": "तस्य पुरुषविधताम्।", "padacchedaText": "", "audioFile": "PB_000963.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000964", "originalText": "अन्वयं पुरुषविधः।", "padacchedaText": "", "audioFile": "PB_000964.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000965", "originalText": "तस्य श्रद्धैव शिरः।", "padacchedaText": "", "audioFile": "PB_000965.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000966", "originalText": "ऋतं दक्षिणः पक्षः।", "padacchedaText": "", "audioFile": "PB_000966.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000967", "originalText": "सत्यमुत्तरः पक्षः।", "padacchedaText": "", "audioFile": "PB_000967.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000968", "originalText": "योग आत्मा।", "padacchedaText": "", "audioFile": "PB_000968.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000969", "originalText": "महः पुच्छं प्रतिष्ठा। तदप्येष श्लोको भवति॥ १॥", "padacchedaText": "", "audioFile": "PB_000969.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000970", "originalText": "यतो वाचो निवर्तन्ते अप्राप्य मनसा सहेत्यादि।", "padacchedaText": "", "audioFile": "PB_000970.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000971", "originalText": "तस्य पूर्वस्य प्राणमयस्य एष एव आत्मा शारीरः शरीरे प्राणमये भवः शरीरः।", "padacchedaText": "", "audioFile": "PB_000971.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000972", "originalText": "कः? य एष मनोमयः।", "padacchedaText": "", "audioFile": "PB_000972.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000973", "originalText": "तस्माद्वा एतस्मादिति पूर्ववत्।", "padacchedaText": "", "audioFile": "PB_000973.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000974", "originalText": "अन्योऽन्तर आत्मा विज्ञानमयः मनोमयस्याभ्यन्तरो विज्ञानमयः।", "padacchedaText": "", "audioFile": "PB_000974.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000975", "originalText": "मनोमयो वेदात्मा उक्तः।", "padacchedaText": "", "audioFile": "PB_000975.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000976", "originalText": "वेदार्थविषया बुद्धिर्निश्चयात्मिका विज्ञानम्, तच्चाध्यवसायलक्षणमन्तःकरणस्य धर्मः, तन्मयः निश्चयविज्ञानैः प्रमाणस्वरूपैर्निर्वर्तितः आत्मा विज्ञानमयः प्रमाणविज्ञानपूर्वको हि यज्ञादिः तायते।", "padacchedaText": "", "audioFile": "PB_000976.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000977", "originalText": "यज्ञादिहेतुत्वं च वक्ष्यति श्लोकेन।", "padacchedaText": "", "audioFile": "PB_000977.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000978", "originalText": "निश्चयविज्ञानवतो हि कर्तव्येष्वर्थेषु पूर्वं श्रद्धा उपपद्यते।", "padacchedaText": "", "audioFile": "PB_000978.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000979", "originalText": "सा सर्वकर्तव्यानां प्राथम्यात् शिर इव शिरः।", "padacchedaText": "", "audioFile": "PB_000979.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000980", "originalText": "ऋतसत्ये यथाव्याख्याते एव।", "padacchedaText": "", "audioFile": "PB_000980.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000981", "originalText": "योगः युक्तिः समाधानम् आत्मैव आत्मा।", "padacchedaText": "", "audioFile": "PB_000981.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000982", "originalText": "आत्मवतो हि युक्तस्य समाधानवतः अङ्गानीव श्रद्धादीनि यथार्थप्रतिपत्तिक्षमाणि भवन्ति।", "padacchedaText": "", "audioFile": "PB_000982.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000983", "originalText": "तस्मात्समाधानं योग आत्मा विज्ञानमयस्य।", "padacchedaText": "", "audioFile": "PB_000983.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000984", "originalText": "महः पुच्छं प्रतिष्ठा।", "padacchedaText": "", "audioFile": "PB_000984.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000985", "originalText": "मह इति महत्तत्त्वं प्रथमजम्, ‘महद्यक्षं प्रथमजं वेद’ (बृ.५.४.१) इति श्रुत्यन्तरात्, पुच्छं प्रतिष्ठा कारणत्वात्।", "padacchedaText": "", "audioFile": "PB_000985.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000986", "originalText": "कारणं हि कार्याणां प्रतिष्ठा, यथा वृक्षवीरुधां पृथिवी।", "padacchedaText": "", "audioFile": "PB_000986.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000987", "originalText": "सर्वविज्ञानानां च महत्तत्त्वं कारणम्।", "padacchedaText": "", "audioFile": "PB_000987.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000988", "originalText": "तेन तद्विज्ञानमयस्यात्मनः प्रतिष्ठा।", "padacchedaText": "", "audioFile": "PB_000988.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000989", "originalText": "तदप्येष श्लोको भवति पूर्ववत्। यथा अन्नमयादीनां ब्राह्मणोक्तानां प्रकाशकाः श्लोकाः, एवं विज्ञानमयस्यापि॥", "padacchedaText": "", "audioFile": "PB_000989.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000990", "originalText": "इति चतुर्थानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000990.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000991", "originalText": "पञ्चमोऽनुवाकः\nविज्ञानं यज्ञं तनुते।", "padacchedaText": "", "audioFile": "PB_000991.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000992", "originalText": "कर्माणि तनुतेऽपि च।", "padacchedaText": "", "audioFile": "PB_000992.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000993", "originalText": "विज्ञानं देवाः सर्वे।", "padacchedaText": "", "audioFile": "PB_000993.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000994", "originalText": "ब्रह्म ज्येष्ठमुपासते।", "padacchedaText": "", "audioFile": "PB_000994.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000995", "originalText": "विज्ञानं ब्रह्म चेद्वेद।", "padacchedaText": "", "audioFile": "PB_000995.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000996", "originalText": "तस्माच्चेन्न प्रमाद्यति।", "padacchedaText": "", "audioFile": "PB_000996.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000997", "originalText": "शरीरे पाप्मनो हित्वा।", "padacchedaText": "", "audioFile": "PB_000997.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000998", "originalText": "सर्वान्कामान्समश्नुत इति।", "padacchedaText": "", "audioFile": "PB_000998.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000999", "originalText": "तस्यैष एव शारीर आत्मा।", "padacchedaText": "", "audioFile": "PB_000999.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001000", "originalText": "यः पूर्वस्य।", "padacchedaText": "", "audioFile": "PB_001000.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001001", "originalText": "तस्माद्वा एतस्माद्विज्ञानमयात्।", "padacchedaText": "", "audioFile": "PB_001001.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001002", "originalText": "अन्योऽन्तर आत्मानन्दमयः।", "padacchedaText": "", "audioFile": "PB_001002.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001003", "originalText": "तेनैष पूर्णः।", "padacchedaText": "", "audioFile": "PB_001003.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001004", "originalText": "स वा एष पुरुषविध एव।", "padacchedaText": "", "audioFile": "PB_001004.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001005", "originalText": "तस्य पुरुष विधताम्।", "padacchedaText": "", "audioFile": "PB_001005.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001006", "originalText": "अन्वयं पुरुषविधः।", "padacchedaText": "", "audioFile": "PB_001006.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001007", "originalText": "तस्य प्रियमेव शिरः।", "padacchedaText": "", "audioFile": "PB_001007.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001008", "originalText": "मोदो दक्षिणः पक्षः।", "padacchedaText": "", "audioFile": "PB_001008.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001009", "originalText": "प्रमोद उत्तरः पक्षः।", "padacchedaText": "", "audioFile": "PB_001009.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001010", "originalText": "आनन्द आत्मा।", "padacchedaText": "", "audioFile": "PB_001010.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001011", "originalText": "ब्रह्म पुच्छं प्रतिष्ठा। तदप्येष श्लोको भवति॥ १॥", "padacchedaText": "", "audioFile": "PB_001011.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001012", "originalText": "विज्ञानं यज्ञं तनुते, विज्ञानवान्हि यज्ञं तनोति श्रद्धापूर्वकम्, अतो विज्ञानस्य कर्तृत्वं तनुत इति।", "padacchedaText": "", "audioFile": "PB_001012.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001013", "originalText": "कर्माणि च तनुते।", "padacchedaText": "", "audioFile": "PB_001013.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001014", "originalText": "यस्माद्विज्ञानकर्तृकं सर्वम्, तस्माद्युक्तं विज्ञानमय आत्मा ब्रह्मेति।", "padacchedaText": "", "audioFile": "PB_001014.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001015", "originalText": "किञ्च, विज्ञानं ब्रह्म सर्वे देवाः इन्द्रादयः ज्येष्ठम्, प्रथमजत्वात्, सर्ववृत्तीनां वा तत्पूर्वकत्वात्प्रथमजं विज्ञानं ब्रह्म उपासते ध्यायन्ति, तस्मिन्विज्ञानमये ब्रह्मण्यभिमानं कृत्वा उपासत इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001015.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001016", "originalText": "तस्मात्ते महतो ब्रह्मण उपासनात् ज्ञानैश्वर्यवन्तो भवन्ति।", "padacchedaText": "", "audioFile": "PB_001016.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001017", "originalText": "तच्च विज्ञानं ब्रह्म चेत् यदि वेद विजानाति, न केवलं वेदैव, तस्मात् ब्रह्मणः चेत् न प्रमाद्यति, बाह्येष्वनात्मस्वात्मा भावितः, तस्मात्प्राप्तं विज्ञानमये ब्रह्मण्यात्मभावनायाः प्रमदनम्, तन्निवृत्त्यर्थमुच्यते— तस्माच्चेन्न प्रमाद्यतीति।", "padacchedaText": "", "audioFile": "PB_001017.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001018", "originalText": "अन्नमयादिष्वात्मभावं हित्वा केवले विज्ञानमये ब्रह्मण्यात्मत्वं भावयन्नास्ते चेदित्यर्थः।", "padacchedaText": "", "audioFile": "PB_001018.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001019", "originalText": "ततः किं स्यादिति, उच्यते— शरीरे पाप्मनो हित्वा, शरीराभिमाननिमित्ता हि सर्वे पाप्मानः, तेषां च विज्ञानमये ब्रह्मण्यात्माभिमानात् निमित्तापाये हानमुपपद्यते, छत्रापाय इव च्छायायाः।", "padacchedaText": "", "audioFile": "PB_001019.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001020", "originalText": "तस्मात् शरीराभिमाननिमित्तान्सर्वान् पाप्मनः शरीरप्रभवान् शरीरे एव हित्वा विज्ञानमयब्रह्मस्वरूपापन्नः तत्स्थान् सर्वान् कामान् विज्ञानमयेनैवात्मना समश्नुते सम्यग्भुङ्क्ते इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001020.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001021", "originalText": "तस्य पूर्वस्य मनोमयस्य आत्मा एष एव शरीरे मनोमये भवः शारीरः।", "padacchedaText": "", "audioFile": "PB_001021.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001022", "originalText": "कः? य एष विज्ञानमयः।", "padacchedaText": "", "audioFile": "PB_001022.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001023", "originalText": "तस्माद्वा एतस्मादित्युक्तार्थम्।", "padacchedaText": "", "audioFile": "PB_001023.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001024", "originalText": "आनन्दमय इति कार्यात्मप्रतीतिः, अधिकारात् मयट्शब्दाच्च।", "padacchedaText": "", "audioFile": "PB_001024.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001025", "originalText": "अन्नादिमया हि कार्यात्मानो भौतिका इहाधिकृताः।", "padacchedaText": "", "audioFile": "PB_001025.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001026", "originalText": "तदधिकारपतितश्चायमानन्दमयः।", "padacchedaText": "", "audioFile": "PB_001026.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001027", "originalText": "मयट् चात्र विकारार्थे दृष्टः, यथा अन्नमय इत्यत्र।", "padacchedaText": "", "audioFile": "PB_001027.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001028", "originalText": "तस्मात्कार्यात्मा आनन्दमयः प्रत्येतव्यः।", "padacchedaText": "", "audioFile": "PB_001028.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001029", "originalText": "सङ्क्रमणाच्च।", "padacchedaText": "", "audioFile": "PB_001029.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001030", "originalText": "‘आनन्दमयमात्मानमुपसङ्क्रामति’ इति वक्ष्यति।", "padacchedaText": "", "audioFile": "PB_001030.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001031", "originalText": "कार्यात्मनां च सङ्क्रमणमन्नात्मनां दृष्टम्।", "padacchedaText": "", "audioFile": "PB_001031.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001032", "originalText": "सङ्क्रमणकर्मत्वेन च आनन्दमय आत्मा श्रूयते, यथा ‘अन्नमयमात्मानमुपसङ्क्रामति’ इति।", "padacchedaText": "", "audioFile": "PB_001032.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001033", "originalText": "न च आत्मन एवोपसङ्क्रमणम्, अधिकारविरोधात्।", "padacchedaText": "", "audioFile": "PB_001033.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001034", "originalText": "असम्भवाच्च।", "padacchedaText": "", "audioFile": "PB_001034.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001035", "originalText": "न ह्यात्मनैव आत्मन उपसङ्क्रमणं सम्भवति, स्वात्मनि भेदाभावात्, आत्मभूतं च ब्रह्म सङ्क्रमितुः।", "padacchedaText": "", "audioFile": "PB_001035.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001036", "originalText": "शिरआदिकल्पनानुपपत्तेश्च।", "padacchedaText": "", "audioFile": "PB_001036.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001037", "originalText": "न हि यथोक्तलक्षणे आकाशादिकारणे अकार्यपतिते शिरआद्यवयवरूपकल्पना उपपद्यते।", "padacchedaText": "", "audioFile": "PB_001037.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001038", "originalText": "‘अदृश्येऽनात्म्येऽनिरुक्तेऽनिलयने’ (तै.२.७.१) ‘अस्थूलमनणु’ (बृ.३.८.८) ‘नेति नेत्यात्मा’ (बृ.३.९.२६) इत्यादिविशेषापोहश्रुतिभ्यश्च।", "padacchedaText": "", "audioFile": "PB_001038.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001039", "originalText": "मन्त्रोदाहरणानुपपत्तेश्च।", "padacchedaText": "", "audioFile": "PB_001039.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001040", "originalText": "न हि, प्रियशिरआद्यवयवविशिष्टे प्रत्यक्षतोऽनुभूयमाने आनन्दमये आत्मनि ब्रह्मणि नास्ति ब्रह्मेत्याशङ्काभावात् ‘असन्नेव स भवति असद्ब्रह्मेति वेद चेत्’ (तै.२.६.१) इति मन्त्रोदाहरणमुपपद्यते।", "padacchedaText": "", "audioFile": "PB_001040.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001041", "originalText": "‘ब्रह्म पुच्छं प्रतिष्ठा’ इत्यपि चानुपपन्नं पृथग्ब्रह्मणः प्रतिष्ठात्वेन ग्रहणम्।", "padacchedaText": "", "audioFile": "PB_001041.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001042", "originalText": "तस्मात्कार्यपतित एवानन्दमयः, न पर एवात्मा।", "padacchedaText": "", "audioFile": "PB_001042.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001043", "originalText": "आनन्द इति विद्याकर्मणोः फलम्, तद्विकार आनन्दमयः।", "padacchedaText": "", "audioFile": "PB_001043.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001044", "originalText": "स च विज्ञानमयादान्तरः, यज्ञादिहेतोर्विज्ञानमयादस्यान्तरत्वश्रुतेः।", "padacchedaText": "", "audioFile": "PB_001044.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001045", "originalText": "ज्ञानकर्मणोर्हि फलं भोक्त्रर्थत्वादान्तरतमं स्यात्, आन्तरतमश्च आनन्दमय आत्मा पूर्वेभ्यः।", "padacchedaText": "", "audioFile": "PB_001045.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001046", "originalText": "विद्याकर्मणोः प्रियाद्यर्थत्वाच्च।", "padacchedaText": "", "audioFile": "PB_001046.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001047", "originalText": "प्रियादिप्रयुक्ते हि विद्याकर्मणी, तस्मात्प्रियादीनां फलरूपाणामात्मसंनिकर्षात् विज्ञानमयादस्याभ्यन्तरत्वमुपपद्यते, प्रियादिवासनानिर्वर्तितो ह्यात्मा आनन्दमयो विज्ञानमयाश्रितः स्वप्ने उपलभ्यते।", "padacchedaText": "", "audioFile": "PB_001047.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001048", "originalText": "तस्य आनन्दमयस्यात्मनः इष्टपुत्रादिदर्शनजं प्रियं शिर इव शिरः, प्राधान्यात्।", "padacchedaText": "", "audioFile": "PB_001048.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001049", "originalText": "मोद इति प्रियलाभनिमित्तो हर्षः।", "padacchedaText": "", "audioFile": "PB_001049.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001050", "originalText": "स एव च प्रकृष्टो हर्षः प्रमोदः।", "padacchedaText": "", "audioFile": "PB_001050.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001051", "originalText": "आनन्द इति सुखसामान्यम् आत्मा प्रियादीनां सुखावयवानाम्, तेष्वनुस्यूतत्वात्।", "padacchedaText": "", "audioFile": "PB_001051.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001052", "originalText": "आनन्द इति परं ब्रह्म, तद्धि शुभकर्मणा प्रत्युपस्थाप्यमाने पुत्रमित्रादिविषयविशेषोपाधौ अन्तःकरणवृत्तिविशेषे तमसा अप्रच्छाद्यमाने प्रसन्ने अभिव्यज्यते।", "padacchedaText": "", "audioFile": "PB_001052.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001053", "originalText": "तद्विषयसुखमिति प्रसिद्धं लोके।", "padacchedaText": "", "audioFile": "PB_001053.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001054", "originalText": "तद्वृत्तिविशेषप्रत्युपस्थापकस्य कर्मणोऽनवस्थितत्वात् सुखस्य क्षणिकत्वम्।", "padacchedaText": "", "audioFile": "PB_001054.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001055", "originalText": "तद्यदन्तःकरणं तपसा तमोघ्नेन विद्यया ब्रह्मचर्येण श्रद्धया च निर्मलत्वमापद्यते यावत्, तावत् विविक्ते प्रसन्ने अन्तःकरणे आनन्दविशेष उत्कृष्यते विपुलीभवति।", "padacchedaText": "", "audioFile": "PB_001055.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001056", "originalText": "वक्ष्यति च— ‘रसो वै सः, रसं ह्येवायं लब्ध्वानन्दी भवति, एष ह्येवानन्दयाति’ (तै.२.७.१) ‘एतस्यैवानन्दस्यान्यानि भूतानि मात्रामुपजीवन्ति’ (बृ.४.३.३२) इति श्रुत्यन्तरात्।", "padacchedaText": "", "audioFile": "PB_001056.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001057", "originalText": "एवं च कामोपशमोत्कर्षापेक्षया शतगुणोत्तरोत्तरोत्कर्षः आनन्दस्य वक्ष्यते।", "padacchedaText": "", "audioFile": "PB_001057.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001058", "originalText": "एवं च उत्कृष्यमाणस्य आनन्दमयस्यात्मनः परमार्थब्रह्मविज्ञानापेक्षया ब्रह्म परमेव यत्प्रकृतं सत्यज्ञानानन्तलक्षणम्, यस्य च प्रतिपत्त्यर्थं पञ्च अन्नादिमयाः कोशा उपन्यस्ताः, यच्च तेभ्य आभ्यन्तरम्, येन च ते सर्वे आत्मवन्तः, तत् ब्रह्म पुच्छं प्रतिष्ठा।", "padacchedaText": "", "audioFile": "PB_001058.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001059", "originalText": "तदेव च सर्वस्याविद्यापरिकल्पितस्य द्वैतस्य अवसानभूतम् अद्वैतं ब्रह्म प्रतिष्ठा, आनन्दमयस्य एकत्वावसानत्वात्।", "padacchedaText": "", "audioFile": "PB_001059.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001060", "originalText": "अस्ति तदेकमविद्याकल्पितस्य द्वैतस्यावसानभूतमद्वैतं ब्रह्म प्रतिष्ठा पुच्छम्। तदेतस्मिन्नप्यर्थे एष श्लोको भवति॥", "padacchedaText": "", "audioFile": "PB_001060.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001061", "originalText": "इति पञ्चमानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_001061.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001062", "originalText": "षष्ठोऽनुवाकः\nअसन्नेव स भवति।", "padacchedaText": "", "audioFile": "PB_001062.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001063", "originalText": "असद्ब्रह्मेति वेद चेत्।", "padacchedaText": "", "audioFile": "PB_001063.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001064", "originalText": "अस्ति ब्रह्मेति चेद्वेद।", "padacchedaText": "", "audioFile": "PB_001064.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001065", "originalText": "सन्तमेन न्ततो विदुरिति।", "padacchedaText": "", "audioFile": "PB_001065.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001066", "originalText": "तस्यैष एव शारीर आत्मा।", "padacchedaText": "", "audioFile": "PB_001066.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001067", "originalText": "यः पूर्वस्य।", "padacchedaText": "", "audioFile": "PB_001067.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001068", "originalText": "अथातोऽनुप्रश्नाः।", "padacchedaText": "", "audioFile": "PB_001068.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001069", "originalText": "उताविद्वानमुं लोकं प्रेत्य।", "padacchedaText": "", "audioFile": "PB_001069.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001070", "originalText": "कश्चन गच्छती ३।", "padacchedaText": "", "audioFile": "PB_001070.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001071", "originalText": "आहो विद्वानमुं लोकं प्रेत्य।", "padacchedaText": "", "audioFile": "PB_001071.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001072", "originalText": "कश्चित्समश्नुता ३ उ।", "padacchedaText": "", "audioFile": "PB_001072.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001073", "originalText": "सोऽकामयत।", "padacchedaText": "", "audioFile": "PB_001073.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001074", "originalText": "बहु स्यां प्रजायेयेति।", "padacchedaText": "", "audioFile": "PB_001074.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001075", "originalText": "स तपोऽतप्यत।", "padacchedaText": "", "audioFile": "PB_001075.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001076", "originalText": "स तपस्तप्त्वा।", "padacchedaText": "", "audioFile": "PB_001076.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001077", "originalText": "इदं सर्वमसृजत।", "padacchedaText": "", "audioFile": "PB_001077.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001078", "originalText": "यदिदं किञ्च।", "padacchedaText": "", "audioFile": "PB_001078.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001079", "originalText": "तत्सृष्ट्वा।", "padacchedaText": "", "audioFile": "PB_001079.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001080", "originalText": "तदेवानुप्राविशत्।", "padacchedaText": "", "audioFile": "PB_001080.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001081", "originalText": "तदनुप्रविश्य।", "padacchedaText": "", "audioFile": "PB_001081.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001082", "originalText": "सच्च त्यच्चाभवत्।", "padacchedaText": "", "audioFile": "PB_001082.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001083", "originalText": "निरुक्तं चानिरुक्तं च।", "padacchedaText": "", "audioFile": "PB_001083.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001084", "originalText": "निलयनं चानिलयनं च।", "padacchedaText": "", "audioFile": "PB_001084.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001085", "originalText": "विज्ञानं चाविज्ञानं च।", "padacchedaText": "", "audioFile": "PB_001085.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001086", "originalText": "सत्यं चानृतं च सत्यमभवत्।", "padacchedaText": "", "audioFile": "PB_001086.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001087", "originalText": "यदिदं किञ्च।", "padacchedaText": "", "audioFile": "PB_001087.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001088", "originalText": "तत्सत्यमित्याचक्षते। तदप्येष श्लोको भवति॥ १॥", "padacchedaText": "", "audioFile": "PB_001088.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001089", "originalText": "असन्नेव असत्सम एव, यथा असन् अपुरुषार्थसम्बन्धी, एवं सः भवति अपुरुषार्थसम्बन्धी।", "padacchedaText": "", "audioFile": "PB_001089.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001090", "originalText": "कोऽसौ? यः असत् अविद्यमानं ब्रह्म इति वेद विजानाति चेत् यदि।", "padacchedaText": "", "audioFile": "PB_001090.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001091", "originalText": "तद्विपर्ययेण यत्सर्वविकल्पास्पदं सर्वप्रवृत्तिबीजं सर्वविशेषप्रत्यस्तमितमपि, अस्ति तत् ब्रह्म इति वेद चेत्, कुतः पुनराशङ्का तन्नास्तित्वे? व्यवहारातीतत्वं ब्रह्मण इति ब्रूमः।", "padacchedaText": "", "audioFile": "PB_001091.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001092", "originalText": "व्यवहारविषये हि वाचारम्भणमात्रे अस्तित्वभावितबुद्धिः तद्विपरीते व्यवहारातीते नास्तित्वमपि प्रतिपद्यते।", "padacchedaText": "", "audioFile": "PB_001092.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001093", "originalText": "यथा ‘घटादिर्व्यवहारविषयतयोपपन्नः सन्, तद्विपरीतः असन्’ इति प्रसिद्धम्, एवं तत्सामान्यादिहापि स्याद्ब्रह्मणो नास्तित्वं प्रत्याशङ्का।", "padacchedaText": "", "audioFile": "PB_001093.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001094", "originalText": "तस्मादुच्यते— अस्ति ब्रह्मेति चेद्वेदेति।", "padacchedaText": "", "audioFile": "PB_001094.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001095", "originalText": "किं पुनः स्यात्तदस्तीति विजानतः? तदाह— सन्तं विद्यमानं ब्रह्मस्वरूपेण परमार्थसदात्मापन्नम् एनम् एवंविदं विदुः ब्रह्मविदः।", "padacchedaText": "", "audioFile": "PB_001095.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001096", "originalText": "ततः तस्मात् अस्तित्ववेदनात् सः अन्येषां ब्रह्मवद्विज्ञेयो भवतीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001096.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001097", "originalText": "अथवा यो नास्ति ब्रह्मेति मन्यते, स सर्वस्यैव सन्मार्गस्य वर्णाश्रमादिव्यवस्थालक्षणस्य नास्तित्वं प्रतिपद्यते, ब्रह्मप्रतिपत्त्यर्थत्वात्तस्य।", "padacchedaText": "", "audioFile": "PB_001097.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001098", "originalText": "अतः नास्तिकः सः असन् असाधुरुच्यते लोके।", "padacchedaText": "", "audioFile": "PB_001098.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001099", "originalText": "तद्विपरीतः सन् यः अस्ति ब्रह्मेति चेद्वेद, स तद्ब्रह्मप्रतिपत्तिहेतुं सन्मार्गं वर्णाश्रमादिव्यवस्थालक्षणं श्रद्दधानतया यथावत्प्रतिपद्यते यस्मात्, ततः तस्मात् सन्तं साधुमार्गस्थम् एनं विदुः साधवः।", "padacchedaText": "", "audioFile": "PB_001099.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001100", "originalText": "तस्मादस्तीत्येव ब्रह्म प्रतिपत्तव्यमिति वाक्यार्थः।", "padacchedaText": "", "audioFile": "PB_001100.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001101", "originalText": "तस्य पूर्वस्य विज्ञानमयस्य एष एव शरीरे विज्ञानमये भवः शारीरः आत्मा।", "padacchedaText": "", "audioFile": "PB_001101.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001102", "originalText": "कोऽसौ? य एष आनन्दमयः।", "padacchedaText": "", "audioFile": "PB_001102.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001103", "originalText": "तं प्रति नास्त्याशङ्का नास्तित्वे।", "padacchedaText": "", "audioFile": "PB_001103.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001104", "originalText": "अपोढसर्वविशेषत्वात्तु ब्रह्मणो नास्तित्वं प्रत्याशङ्का युक्ता, सर्वसाम्याच्च ब्रह्मणः।", "padacchedaText": "", "audioFile": "PB_001104.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001105", "originalText": "यस्मादेवम्, अतः तस्मात् अथ अनन्तरं श्रोतुः शिष्यस्य अनुप्रश्नाः आचार्योक्तिमनु एते प्रश्नाः।", "padacchedaText": "", "audioFile": "PB_001105.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001106", "originalText": "सामान्यं हि ब्रह्म आकाशादिकारणत्वात् विदुषः अविदुषश्च, अतः अविदुषोऽपि ब्रह्मप्राप्तिराशङ्क्यते— उत अपि अविद्वान् अमुं लोकं परमात्मानम् इतः प्रेत्य कश्चन, चनशब्दः अप्यर्थे, अविद्वानपि गच्छति प्राप्नोति? ‘किं वा न गच्छति? ’इति द्वितीयोऽपि प्रश्नो द्रष्टव्यः, अनुप्रश्ना इति बहुवचनात्।", "padacchedaText": "", "audioFile": "PB_001106.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001107", "originalText": "विद्वांसं प्रत्यन्यौ प्रश्नौ— यद्यविद्वान्सामान्यं कारणमपि ब्रह्म न गच्छति, अतो विदुषोऽपि ब्रह्मागमनमाशङ्क्यते, अतस्तं प्रति प्रश्नः— आहो विद्वानिति।", "padacchedaText": "", "audioFile": "PB_001107.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001108", "originalText": "उकारं च वक्ष्यमाणमधस्तादपकृष्य तकारं च पूर्वस्मादुतशब्दाद्व्यासज्य आहो इत्येतस्मात्पूर्वमुतशब्दं संयोज्य पृच्छति— उताहो विद्वानिति।", "padacchedaText": "", "audioFile": "PB_001108.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001109", "originalText": "विद्वान् ब्रह्मविदपि कश्चित् इतः प्रेत्य अमुं लोकं समश्नुते प्राप्नोति।", "padacchedaText": "", "audioFile": "PB_001109.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001110", "originalText": "समश्नुते उ इत्येवं स्थिते, अयादेशे यलोपे च कृते, अकारस्य प्लुतिः— समश्नुता ३ उ इति।", "padacchedaText": "", "audioFile": "PB_001110.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001111", "originalText": "विद्वान्समश्नुते अमुं लोकम्, किं वा, यथा अविद्वान्, एवं विद्वानपि न समश्नुते इत्यपरः प्रश्नः।", "padacchedaText": "", "audioFile": "PB_001111.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001112", "originalText": "द्वावेव वा प्रश्नौ विद्वदविद्वद्विषयौ, बहुवचनं तु सामर्थ्यप्राप्तप्रश्नान्तरापेक्षया घटते।", "padacchedaText": "", "audioFile": "PB_001112.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001113", "originalText": "‘असद् ब्रह्मेति वेद चेत्’ ‘अस्ति ब्रह्मेति चेद्वेद’ इति श्रवणादस्ति नास्तीति संशयः।", "padacchedaText": "", "audioFile": "PB_001113.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001114", "originalText": "ततः अर्थप्राप्तः किमस्ति नास्तीति प्रथमोऽनुप्रश्नः।", "padacchedaText": "", "audioFile": "PB_001114.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001115", "originalText": "ब्रह्मणः अपक्षपातित्वात् अविद्वान्गच्छति न गच्छतीति द्वितीयः। ब्रह्मणः समत्वेऽपि अविदुष इव विदुषोऽप्यगमनमाशङ्क्य किं विद्वान्समश्नुते न समश्नुते इति तृतीयोऽनुप्रश्नः॥", "padacchedaText": "", "audioFile": "PB_001115.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001116", "originalText": "एतेषां प्रतिवचनार्थ उत्तरो ग्रन्थ आरभ्यते।", "padacchedaText": "", "audioFile": "PB_001116.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001117", "originalText": "तत्र अस्तित्वमेव तावदुच्यते।", "padacchedaText": "", "audioFile": "PB_001117.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001118", "originalText": "यच्चोक्तम् ‘सत्यं ज्ञानमनन्तं ब्रह्म’ इति, तत्र च कथं सत्यत्वमित्येतद्वक्तव्यमिति इदमुच्यते।", "padacchedaText": "", "audioFile": "PB_001118.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001119", "originalText": "सत्त्वोक्त्यैव सत्यत्वमुच्यते।", "padacchedaText": "", "audioFile": "PB_001119.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001120", "originalText": "उक्तं हि सदेव सत्यमिति, तस्मात्सत्त्वोक्त्यैव सत्यत्वमुच्यते।", "padacchedaText": "", "audioFile": "PB_001120.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001121", "originalText": "कथमेवमर्थता अवगम्यते अस्य ग्रन्थस्य? शब्दानुगमात्।", "padacchedaText": "", "audioFile": "PB_001121.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001122", "originalText": "अनेनैव ह्यर्थेनान्वितानि उत्तरवाक्यानि— ‘तत्सत्यमित्याचक्षते’ (तै.२.६.१) ‘यदेष आकाश आनन्दो न स्यात्’ (तै.२.७.१) इत्यादीनि।", "padacchedaText": "", "audioFile": "PB_001122.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001123", "originalText": "तत्र असदेव ब्रह्मेत्याशङ्क्यते।", "padacchedaText": "", "audioFile": "PB_001123.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001124", "originalText": "कस्मात्? यदस्ति, तद्विशेषतो गृह्यते, यथा घटादि।", "padacchedaText": "", "audioFile": "PB_001124.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001125", "originalText": "यन्नास्ति, तन्नोपलभ्यते, यथा शशविषाणादि।", "padacchedaText": "", "audioFile": "PB_001125.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001126", "originalText": "तथा नोपलभ्यते ब्रह्म, तस्माद्विशेषतः अग्रहणान्नास्तीति।", "padacchedaText": "", "audioFile": "PB_001126.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001127", "originalText": "तन्न, आकाशादिकारणत्वाद्ब्रह्मणः।", "padacchedaText": "", "audioFile": "PB_001127.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001128", "originalText": "न नास्ति ब्रह्म।", "padacchedaText": "", "audioFile": "PB_001128.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001129", "originalText": "कस्मात्? आकाशादि हि सर्वं कार्यं ब्रह्मणो जातं गृह्यते, यस्माच्च जायते किञ्चित्, तदस्तीति दृष्टं लोके, यथा घटाङ्कुरादिकारणं मृद्बीजादि, तस्मादाकाशादिकारणत्वादस्ति ब्रह्म।", "padacchedaText": "", "audioFile": "PB_001129.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001130", "originalText": "न चासतो जातं किञ्चिद्गृह्यते लोके कार्यम्।", "padacchedaText": "", "audioFile": "PB_001130.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001131", "originalText": "असतश्चेन्नामरूपादि कार्यम्, निरात्मकत्वान्नोपलभ्येत, उपलभ्यते तु, तस्मादस्ति ब्रह्म।", "padacchedaText": "", "audioFile": "PB_001131.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001132", "originalText": "असतश्चेत्कार्यं गृह्यमाणमपि असदन्वितमेव स्यात्, न चैवम्, तस्मादस्ति ब्रह्म।", "padacchedaText": "", "audioFile": "PB_001132.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001133", "originalText": "तत्र ‘कथमसतः सज्जायेत’ (छा.६.२.२) इति श्रुत्यन्तरमसतः सज्जन्मासम्भवमन्वाचष्टे न्यायतः।", "padacchedaText": "", "audioFile": "PB_001133.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001134", "originalText": "तस्मात्सदेव ब्रह्मेति युक्तम्।", "padacchedaText": "", "audioFile": "PB_001134.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001135", "originalText": "तद्यदि मृद्बीजादिवत् कारणं स्यात्, अचेतनं तर्हि।", "padacchedaText": "", "audioFile": "PB_001135.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001136", "originalText": "न, कामयितृत्वात्।", "padacchedaText": "", "audioFile": "PB_001136.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001137", "originalText": "न हि कामयित्रचेतनमस्ति लोके।", "padacchedaText": "", "audioFile": "PB_001137.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001138", "originalText": "सर्वज्ञं हि ब्रह्मेत्यवोचाम, अतः कामयितृत्वोपपत्तिः।", "padacchedaText": "", "audioFile": "PB_001138.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001139", "originalText": "कामयितृत्वादस्मदादिवदनाप्तकाममिति चेत्, न, स्वातन्त्र्यात्।", "padacchedaText": "", "audioFile": "PB_001139.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001140", "originalText": "यथा अन्यान्परवशीकृत्य कामादिदोषाः प्रवर्तयन्ति, न तथा ब्रह्मणः प्रवर्तकाः कामाः।", "padacchedaText": "", "audioFile": "PB_001140.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001141", "originalText": "कथं तर्हि? सत्यज्ञानलक्षणाः स्वात्मभूतत्वाद्विशुद्धाः।", "padacchedaText": "", "audioFile": "PB_001141.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001142", "originalText": "न तैर्ब्रह्म प्रवर्त्यते, तेषां तु तत्प्रवर्तकं ब्रह्म प्राणिकर्मापेक्षया।", "padacchedaText": "", "audioFile": "PB_001142.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001143", "originalText": "तस्मात्स्वातन्त्र्यं कामेषु ब्रह्मणः, अतो न अनाप्तकामं ब्रह्म।", "padacchedaText": "", "audioFile": "PB_001143.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001144", "originalText": "साधनान्तरानपेक्षत्वाच्च।", "padacchedaText": "", "audioFile": "PB_001144.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001145", "originalText": "यथा अन्येषामनात्मभूता धर्मादिनिमित्तापेक्षाः कामाः स्वात्मव्यतिरिक्तकार्यकरणसाधनान्तरापेक्षाश्च, न तथा ब्रह्मणः।", "padacchedaText": "", "audioFile": "PB_001145.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001146", "originalText": "किं तर्हि? स्वात्मनोऽनन्याः।", "padacchedaText": "", "audioFile": "PB_001146.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001147", "originalText": "तदेतदाह— सोऽकामयत।", "padacchedaText": "", "audioFile": "PB_001147.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001148", "originalText": "सः आत्मा यस्मादाकाशः सम्भूतः, अकामयत कामितवान्।", "padacchedaText": "", "audioFile": "PB_001148.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001149", "originalText": "कथम्? बहु प्रभूतं स्यां भवेयम्।", "padacchedaText": "", "audioFile": "PB_001149.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001150", "originalText": "कथमेकस्यार्थान्तराननुप्रवेशे बहुत्वं स्यादिति, उच्यते— प्रजायेय उत्पद्येय।", "padacchedaText": "", "audioFile": "PB_001150.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001151", "originalText": "न हि पुत्रोत्पत्तेरिवार्थान्तरविषयं बहुभवनम्।", "padacchedaText": "", "audioFile": "PB_001151.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001152", "originalText": "कथं तर्हि? आत्मस्थानभिव्यक्तनामरूपाभिव्यक्त्या।", "padacchedaText": "", "audioFile": "PB_001152.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001153", "originalText": "यदा आत्मस्थे अनभिव्यक्ते नामरूपे व्याक्रियेते, तदा आत्मस्वरूपापरित्यागेनैव ब्रह्मणः अप्रविभक्तदेशकाले सर्वावस्थासु व्याक्रियेते।", "padacchedaText": "", "audioFile": "PB_001153.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001154", "originalText": "तदेतन्नामरूपव्याकरणं ब्रह्मणो बहुभवनम्।", "padacchedaText": "", "audioFile": "PB_001154.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001155", "originalText": "नान्यथा निरवयवस्य ब्रह्मणो बहुत्वापत्तिरुपपद्यते अल्पत्वं वा, यथा आकाशस्याल्पत्वं बहुत्वं च वस्त्वन्तरकृतमेव।", "padacchedaText": "", "audioFile": "PB_001155.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001156", "originalText": "अतः तद्द्वारेणैवात्मा बहु भवति।", "padacchedaText": "", "audioFile": "PB_001156.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001157", "originalText": "न ह्यात्मनोऽन्यदनात्मभूतं तत्प्रविभक्तदेशकालं सूक्ष्मं व्यवहितं विप्रकृष्टं भूतं भवद्भविष्यद्वा वस्तु विद्यते।", "padacchedaText": "", "audioFile": "PB_001157.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001158", "originalText": "अतः नामरूपे सर्वावस्थे ब्रह्मणैवात्मवती।", "padacchedaText": "", "audioFile": "PB_001158.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001159", "originalText": "न ब्रह्म तदात्मकम्।", "padacchedaText": "", "audioFile": "PB_001159.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001160", "originalText": "ते तत्प्रत्याख्याने न स्त एवेति तदात्मके उच्येते।", "padacchedaText": "", "audioFile": "PB_001160.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001161", "originalText": "ताभ्यां च उपाधिभ्यां ज्ञातृज्ञेयज्ञानशब्दार्थादिसर्वसंव्यवहारभाग्ब्रह्म।", "padacchedaText": "", "audioFile": "PB_001161.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001162", "originalText": "सः आत्मा एवंकामः सन् तपः अतप्यत।", "padacchedaText": "", "audioFile": "PB_001162.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001163", "originalText": "तप इति ज्ञानमुच्यते, ‘यस्य ज्ञानमयं तपः’ (मु.१.१.८) इति श्रुत्यन्तरात्।", "padacchedaText": "", "audioFile": "PB_001163.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001164", "originalText": "आप्तकामत्वाच्च इतरस्य असम्भव एव तपसः।", "padacchedaText": "", "audioFile": "PB_001164.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001165", "originalText": "तत्तपः अतप्यत तप्तवान्, सृज्यमानजगद्रचनादिविषयामालोचनामकरोदात्मेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001165.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001166", "originalText": "सः एवमालोच्य तपः तप्त्वा प्राणिकर्मादिनिमित्तानुरूपम् इदं सर्वं जगत् देशतः कालतः नाम्ना रूपेण च यथानुभवं सर्वैः प्राणिभिः सर्वावस्थैरनुभूयमानम् असृजत सृष्टवान्।", "padacchedaText": "", "audioFile": "PB_001166.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001167", "originalText": "यदिदं किञ्च यत्किञ्चेदमविशिष्टम्, तत् इदं जगत् सृष्ट्वा, किमकरोदिति, उच्यते— तदेव सृष्टं जगत् अनुप्राविशदिति॥", "padacchedaText": "", "audioFile": "PB_001167.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001168", "originalText": "तत्रैतच्चिन्त्यम्— कथमनुप्राविशदिति।", "padacchedaText": "", "audioFile": "PB_001168.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001169", "originalText": "किम्, यः स्रष्टा, स तेनैवात्मनानुप्राविशत्, उत अन्येनेति? किं तावद्युक्तम्? क्त्वाप्रत्ययश्रवणात्, यः स्रष्टा, स एवानुप्राविशदिति।", "padacchedaText": "", "audioFile": "PB_001169.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001170", "originalText": "ननु न युक्तं मृद्वच्चेत्कारणं ब्रह्म, तदात्मकत्वात्कार्यस्य, कारणमेव हि कार्यात्मना परिणमते, अतः अप्रविष्टस्यैव कार्योत्पत्तेरूर्ध्वं पृथक्कारणस्य पुनः प्रवेशोऽनुपपन्नः।", "padacchedaText": "", "audioFile": "PB_001170.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001171", "originalText": "न हि घटपरिणामव्यतिरेकेण मृदो घटे प्रवेशोऽस्ति।", "padacchedaText": "", "audioFile": "PB_001171.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001172", "originalText": "यथा घटे चूर्णात्मना मृदोऽनुप्रवेशः, एवमनेन आत्मना नामरूपकार्ये अनुप्रवेश आत्मनः इति चेत्, श्रुत्यन्तराच्च ‘अनेन जीवेनात्मनानुप्रविश्य’ (छा.६.३.२) इति, नैवं युक्तम्, एकत्वाद्ब्रह्मणः।", "padacchedaText": "", "audioFile": "PB_001172.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001173", "originalText": "मृदात्मनस्त्वनेकत्वात् सावयवत्वाच्च युक्तो घटे मृदश्चूर्णात्मनानुप्रवेशः, मृदश्चूर्णस्य अप्रविष्टदेशत्वाच्च।", "padacchedaText": "", "audioFile": "PB_001173.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001174", "originalText": "न त्वात्मन एकत्वे सति निरवयवत्वादप्रविष्टदेशाभावाच्च प्रवेश उपपद्यते, कथं तर्हि प्रवेशः स्यात्? युक्तश्च प्रवेशः, श्रुतत्वात्— ‘तदेवानुप्राविशत्’ इति।", "padacchedaText": "", "audioFile": "PB_001174.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001175", "originalText": "सावयवमेवास्तु, तर्हि सावयवत्वात् मुखो हस्तप्रवेशवत् नामरूपकार्ये जीवात्मनानुप्रवेशो युक्त एवेति चेत्, न, अशून्यदेशत्वात्।", "padacchedaText": "", "audioFile": "PB_001175.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001176", "originalText": "न हि कार्यात्मना परिणतस्य नामरूपकार्यदेशव्यतिरेकेण आत्मशून्यः प्रदेशोऽस्ति, यं प्रविशेज्जीवात्मना।", "padacchedaText": "", "audioFile": "PB_001176.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001177", "originalText": "कारणमेव चेत्प्रविशेत्, जीवात्मत्वं जह्यात्, यथा घटो मृत्प्रवेशे घटत्वं जहाति।", "padacchedaText": "", "audioFile": "PB_001177.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001178", "originalText": "‘तदेवानुप्राविशत्’ इति च श्रुतेर्न कारणानुप्रवेशो युक्तः।", "padacchedaText": "", "audioFile": "PB_001178.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001179", "originalText": "कार्यान्तरमेव स्यादिति चेत्— तदेवानुप्राविशदिति जीवात्मरूपं कार्यं नामरूपपरिणतं कार्यान्तरमेव आपद्यत इति चेत्, न, विरोधात्।", "padacchedaText": "", "audioFile": "PB_001179.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001180", "originalText": "न हि घटो घटान्तरमापद्यते, व्यतिरेकश्रुतिविरोधाच्च।", "padacchedaText": "", "audioFile": "PB_001180.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001181", "originalText": "जीवस्य नामरूपकार्यव्यतिरेकानुवादिन्यः श्रुतयो विरुध्येरन्, तदापत्तौ मोक्षासम्भवाच्च।", "padacchedaText": "", "audioFile": "PB_001181.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001182", "originalText": "न हि यतो मुच्यमानः, तदेव आपद्यते।", "padacchedaText": "", "audioFile": "PB_001182.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001183", "originalText": "न हि शृङ्खलापत्तिः बद्धस्य तस्करादेः।", "padacchedaText": "", "audioFile": "PB_001183.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001184", "originalText": "बाह्यान्तर्भेदेन परिणतमिति चेत्— तदेव कारणं ब्रह्म शरीराद्याधारत्वेन तदन्तर्जीवात्मना आधेयत्वेन च परिणतमिति चेत्, न, बहिष्ठस्य प्रवेशोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_001184.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001185", "originalText": "न हि यो यस्यान्तःस्थः स एव तत्प्रविष्ट उच्यते।", "padacchedaText": "", "audioFile": "PB_001185.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001186", "originalText": "बहिष्ठस्यानुप्रवेशः स्यात्, प्रवेशशब्दार्थस्यैवं दृष्टत्वात्— यथा गृहं कृत्वा प्राविशदिति।", "padacchedaText": "", "audioFile": "PB_001186.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001187", "originalText": "जलसूर्यकादिप्रतिबिम्बवत् प्रवेशः स्यादिति चेत्, न, अपरिच्छिन्नत्वादमूर्तत्वाच्च।", "padacchedaText": "", "audioFile": "PB_001187.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001188", "originalText": "परिच्छिन्नस्य मूर्तस्यान्यस्य अन्यत्र प्रसादस्वभावके जलादौ सूर्यकादिप्रतिबिम्बोदयः स्यात्, न त्वात्मनः, अमूर्तत्वात्, आकाशादिकारणस्य आत्मनः व्यापकत्वात्।", "padacchedaText": "", "audioFile": "PB_001188.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001189", "originalText": "तद्विप्रकृष्टदेशप्रतिबिम्बाधारवस्त्वन्तराभावाच्च प्रतिबिम्बवत्प्रवेशो न युक्तः।", "padacchedaText": "", "audioFile": "PB_001189.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001190", "originalText": "एवं तर्हि नैवास्ति प्रवेशः, न च गत्यन्तरमुपलभामहे, ‘तदेवानुप्राविशत्’ इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_001190.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001191", "originalText": "श्रुतिश्च नोऽतीन्द्रियविषये विज्ञानोत्पत्तौ निमित्तम्।", "padacchedaText": "", "audioFile": "PB_001191.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001192", "originalText": "न चास्माद्वाक्यात् यत्नवतामपि विज्ञानमुत्पद्यते।", "padacchedaText": "", "audioFile": "PB_001192.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001193", "originalText": "हन्त तर्ह्यनर्थकत्वादपोह्यमेतद्वाक्यम् ‘तत्सृष्ट्वा तदेवानुप्राविशत्’ इति, न, अन्यार्थत्वात्।", "padacchedaText": "", "audioFile": "PB_001193.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001194", "originalText": "किमर्थमस्थाने चर्चा? प्रकृतो ह्यन्यो विवक्षितोऽस्य वाक्यार्थः अस्ति, स स्मर्तव्यः— ‘ब्रह्मविदाप्नोति परम्’ (तै.२.१.१) ‘सत्यं ज्ञानमनन्तं ब्रह्म’ (तै.२.१.१) ‘यो वेद निहितं गुहायाम्’ (तै.२.१.१) इति।", "padacchedaText": "", "audioFile": "PB_001194.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001195", "originalText": "तद्विज्ञानं च विवक्षितम्, प्रकृतं च तत्।", "padacchedaText": "", "audioFile": "PB_001195.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001196", "originalText": "ब्रह्मस्वरूपावगमाय च आकाशाद्यन्नमयान्तं कार्यं प्रदर्शितम्, ब्रह्मावगमश्च आरब्धः।", "padacchedaText": "", "audioFile": "PB_001196.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001197", "originalText": "तत्र अन्नमयादात्मनोऽन्योऽन्तर आत्मा प्राणमयः, तदन्तर्मनोमयो विज्ञानमय इति विज्ञानगुहायां प्रवेशितः, तत्र च आनन्दमयो विशिष्ट आत्मा प्रदर्शितः।", "padacchedaText": "", "audioFile": "PB_001197.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001198", "originalText": "अतः परमानन्दमयलिङ्गाधिगमद्वारेण आनन्दविवृद्ध्यवसान आत्मा।", "padacchedaText": "", "audioFile": "PB_001198.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001199", "originalText": "ब्रह्म पुच्छं प्रतिष्ठा सर्वविकल्पास्पदो निर्विकल्पोऽस्यामेव गुहायामधिगन्तव्य इति तत्प्रवेशः प्रकल्प्यते।", "padacchedaText": "", "audioFile": "PB_001199.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001200", "originalText": "न ह्यन्यत्रोपलभ्यते ब्रह्म, निर्विशेषत्वात्, विशेषसम्बन्धो ह्युपलब्धिहेतुर्दृष्टः— यथा राहोश्चन्द्रार्कविशेषसम्बन्धः।", "padacchedaText": "", "audioFile": "PB_001200.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001201", "originalText": "एवमन्तःकरणगुहात्मसम्बन्धो ब्रह्मण उपलब्धिहेतुः, संनिकर्षात्, अवभासात्मकत्वाच्च अन्तःकरणस्य।", "padacchedaText": "", "audioFile": "PB_001201.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001202", "originalText": "यथा च आलोकविशिष्टघटाद्युपलब्धिः, एवं बुद्धिप्रत्ययालोकविशिष्टात्मोपलब्धिः स्यात्, तस्मात् उपलब्धिहेतौ गुहायां निहितमिति प्रकृतमेव। तद्वृत्तिस्थानीये त्विह पुनस्तत्सृष्ट्वा तदेवानुप्राविशदित्युच्यते॥", "padacchedaText": "", "audioFile": "PB_001202.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001203", "originalText": "देवेदमाकाशादिकारणं कार्यं सृष्ट्वा तदनुप्रविष्टमिवान्तर्गुहायां बुद्धौ द्रष्टृ श्रोतृ मन्तृ विज्ञात्रित्येवं विशेषवदुपलभ्यते।", "padacchedaText": "", "audioFile": "PB_001203.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001204", "originalText": "स एव तस्य प्रवेशः, तस्मादस्ति तत्कारणं ब्रह्म।", "padacchedaText": "", "audioFile": "PB_001204.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001205", "originalText": "अतः अस्तित्वादस्तीत्येवोपलब्धव्यं तत्।", "padacchedaText": "", "audioFile": "PB_001205.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001206", "originalText": "तत् कार्यमनुप्रविश्य, किम्? सच्च मूर्तं त्यच्च अमूर्तम् अभवत्।", "padacchedaText": "", "audioFile": "PB_001206.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001207", "originalText": "मूर्तामूर्ते ह्यव्याकृतनामरूपे आत्मस्थे अन्तर्गतेन आत्मना व्याक्रियेते मूर्तामूर्तशब्दवाच्ये।", "padacchedaText": "", "audioFile": "PB_001207.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001208", "originalText": "ते आत्मना त्वप्रविभक्तदेशकाले इति कृत्वा आत्मा ते अभवदित्युच्यते।", "padacchedaText": "", "audioFile": "PB_001208.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001209", "originalText": "किं च, निरुक्तं चानिरुक्तं च, निरुक्तं नाम निष्कृष्य समानासमानजातीयेभ्यः देशकालविशिष्टतया इदं तदित्युक्तम्, अनिरुक्तं तद्विपरीतम्, निरुक्तानिरुक्ते अपि मूर्तामूर्तयोरेव विशेषणे।", "padacchedaText": "", "audioFile": "PB_001209.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001210", "originalText": "यथा सच्च त्यच्च प्रत्यक्षपरोक्षे, तथा निलयनं चानिलयनं च।", "padacchedaText": "", "audioFile": "PB_001210.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001211", "originalText": "निलयनं नीडम् आश्रयः मूर्तस्यैव धर्मः, अनिलयनं तद्विपरीतम् अमूर्तस्यैव धर्मः।", "padacchedaText": "", "audioFile": "PB_001211.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001212", "originalText": "त्यदनिरुक्तानिलयनानि अमूर्तधर्मत्वेऽपि व्याकृतविषयाण्येव, सर्गोत्तरकालभावश्रवणात्।", "padacchedaText": "", "audioFile": "PB_001212.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001213", "originalText": "त्यदिति प्राणाद्यनिरुक्तं तदेवानिलयनं च।", "padacchedaText": "", "audioFile": "PB_001213.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001214", "originalText": "अतो विशेषणानि अमूर्तस्य व्याकृतविषयाण्येवैतानि।", "padacchedaText": "", "audioFile": "PB_001214.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001215", "originalText": "विज्ञानं चेतनम्, अविज्ञानं तद्रहितमचेतनं पाषाणादि।", "padacchedaText": "", "audioFile": "PB_001215.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001216", "originalText": "सत्यं च व्यवहारविषयम्, अधिकारात्, न परमार्थसत्यम्, एकमेव हि परमार्थसत्यं ब्रह्म।", "padacchedaText": "", "audioFile": "PB_001216.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001217", "originalText": "इह पुनः व्यवहारविषयमापेक्षिकं सत्यम्, मृगतृष्णिकाद्यनृतापेक्षया उदकादि सत्यमुच्यते।", "padacchedaText": "", "audioFile": "PB_001217.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001218", "originalText": "अनृतं च तद्विपरीतम्।", "padacchedaText": "", "audioFile": "PB_001218.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001219", "originalText": "किं पुनः? एतत्सर्वमभवत्, सत्यं परमार्थसत्यम्, किं पुनस्तत्? ब्रह्म, ‘सत्यं ज्ञानमनन्तं ब्रह्म’ इति प्रकृतत्वात्।", "padacchedaText": "", "audioFile": "PB_001219.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001220", "originalText": "यस्मात्, सत्त्यदादिकं मूर्तामूर्तधर्मजातं यत्किञ्चेदं सर्वमविशिष्टं विकारजातमेकमेव सच्छब्दवाच्यं ब्रह्माभवत्, तद्व्यतिरेकेणाभावान्नामरूपविकारस्य, तस्मात् तत् ब्रह्म सत्यमित्याचक्षते ब्रह्मविदः।", "padacchedaText": "", "audioFile": "PB_001220.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001221", "originalText": "अस्ति नास्तीत्यनुप्रश्नः प्रकृतः, तस्य प्रतिवचनविषये एतदुक्तम्— ‘आत्माकामयत बहु स्याम्’ इति।", "padacchedaText": "", "audioFile": "PB_001221.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001222", "originalText": "स यथाकामं च आकाशादिकार्यं सत्त्यदादिलक्षणं सृष्ट्वा तदनुप्रविश्य पश्यञ्शृण्वन्मन्वानो विजानन् बह्वभवत्, तस्मात् तदेवेदमाकाशादिकारणं कार्यस्थं परमे व्योमन् हृदयगुहायां निहितं तत्प्रत्ययावभासविशेषेणोपलभ्यमानमस्तीत्येवं विजानीयादित्युक्तं भवति।", "padacchedaText": "", "audioFile": "PB_001222.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001223", "originalText": "तत् एतस्मिन्नर्थे ब्राह्मणोक्ते एषः श्लोकः मन्त्रः भवति। यथा पूर्वेष्वन्नमयाद्यात्मप्रकाशकाः पञ्चस्वपि, एवं सर्वान्तरतमात्मास्तित्वप्रकाशकोऽपि मन्त्रः कार्यद्वारेण भवति॥", "padacchedaText": "", "audioFile": "PB_001223.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001224", "originalText": "इति षष्ठानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_001224.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001225", "originalText": "सप्तमोऽनुवाकः\nअसद्वा इदमग्र आसीत्।", "padacchedaText": "", "audioFile": "PB_001225.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001226", "originalText": "ततो वै सदजायत।", "padacchedaText": "", "audioFile": "PB_001226.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001227", "originalText": "तदात्मानं स्वयमकुरुत।", "padacchedaText": "", "audioFile": "PB_001227.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001228", "originalText": "तस्मात्तत्सुकृतमुच्यत इति।", "padacchedaText": "", "audioFile": "PB_001228.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001229", "originalText": "यद्वै तत्सुकृतम्।", "padacchedaText": "", "audioFile": "PB_001229.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001230", "originalText": "रसो वै सः।", "padacchedaText": "", "audioFile": "PB_001230.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_001231", "originalText": "रसं ह्येवायं लब्ध्वानन्दी भवति।", "padacchedaText": "", "audioFi
