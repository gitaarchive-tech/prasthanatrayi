hya.zip"}, {"id": "B_000010", "originalText": "अतः अविद्यानिवृत्तौ स्वात्मन्यवस्थानं परप्राप्तिः, ‘अभयं प्रतिष्ठां विन्दते’ (तै.२.७.१) ‘एतमानन्दमयमात्मानमुपसङ्क्रामति’ (तै.२.८.५)इत्यादि श्रुतेः।", "padacchedaText": "", "audioFile": "PB_000010.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000011", "originalText": "काम्यप्रतिषिद्धयोरनारम्भात् आरब्धस्य च उपभोगेन क्षयात् नित्यानुष्ठानेन च प्रत्यवायाभावात् अयत्नत एव स्वात्मन्यवस्थानं मोक्षः।", "padacchedaText": "", "audioFile": "PB_000011.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000012", "originalText": "अथवा, निरतिशयायाः प्रीतेः स्वर्गशब्दवाच्याया कर्महेतुत्वात्कर्मभ्य एव मोक्ष इति चेत्, न, कर्मानेकत्वात्।", "padacchedaText": "", "audioFile": "PB_000012.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000013", "originalText": "अनेकानि हि आरब्धफलानि अनारब्धफलानि च अनेकजन्मान्तरकृतानि विरुद्धफलानि कर्माणि सम्भवन्ति।", "padacchedaText": "", "audioFile": "PB_000013.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000014", "originalText": "अतः तेष्वनारब्धफलानामेकस्मिञ्जन्मन्युपभोगेन क्षयासम्भवात् शेषकर्मनिमित्तशरीरारम्भोपपत्तिः।", "padacchedaText": "", "audioFile": "PB_000014.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000015", "originalText": "कर्मशेषसद्भावसिद्धिश्च ‘तद्य इह रमणीयचरणाः’ (छा.५.१०.७) ‘ततः शेषेण’ (आ.ध.२.२.२.३)(गो.स्मृ.११) इत्यादि श्रुतिस्मृतिशतेभ्यः।", "padacchedaText": "", "audioFile": "PB_000015.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000016", "originalText": "इष्टानिष्टफलानामनारब्धानां क्षयार्थानि नित्यानि इति चेत्, न, अकरणे प्रत्यवायश्रवणात्।", "padacchedaText": "", "audioFile": "PB_000016.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000017", "originalText": "प्रत्यवायशब्दो हि अनिष्टविषयः।", "padacchedaText": "", "audioFile": "PB_000017.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000018", "originalText": "नित्याकरणनिमित्तस्य प्रत्यवायस्य दुःखरूपस्य आगामिनः परिहारार्थानि नित्यानीत्यभ्युपगमात् न अनारब्धफलकर्मक्षयार्थानि।", "padacchedaText": "", "audioFile": "PB_000018.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000019", "originalText": "यदि नाम अनारब्धफलकर्मक्षयार्थानि नित्यानि कर्माणि, तथाप्यशुद्धमेव क्षपयेयुः, न शुद्धम्, विरोधाभावात्।", "padacchedaText": "", "audioFile": "PB_000019.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000020", "originalText": "न हि इष्टफलस्य कर्मणः शुद्धरूपत्वान्नित्यैर्विरोध उपपद्यते।", "padacchedaText": "", "audioFile": "PB_000020.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000021", "originalText": "शुद्धाशुद्धयोर्हि विरोधो युक्तः।", "padacchedaText": "", "audioFile": "PB_000021.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000022", "originalText": "न च कर्महेतूनां कामानां ज्ञानाभावे निवृत्त्यसम्भवादशेषकर्मक्षयोपपत्तिः।", "padacchedaText": "", "audioFile": "PB_000022.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000023", "originalText": "अनात्मविदो हि कामः, अनात्मफलविषयत्वात्।", "padacchedaText": "", "audioFile": "PB_000023.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000024", "originalText": "स्वात्मनि च कामानुपपत्तिः, नित्यप्राप्तत्वात्।", "padacchedaText": "", "audioFile": "PB_000024.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000025", "originalText": "स्वयं चात्मा परं ब्रह्मेत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_000025.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000026", "originalText": "नित्यानां च अकरणमभावः ततः प्रत्यवायानुपपत्तिरिति।", "padacchedaText": "", "audioFile": "PB_000026.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000027", "originalText": "अतः पूर्वोपचितदुरितेभ्यः प्राप्यमाणायाः प्रत्यवायक्रियाया नित्याकरणं लक्षणमिति शतृप्रत्ययस्य नानुपपत्तिः— ‘अकुर्वन्विहितं कर्म’ (मनु.११.४४) इति।", "padacchedaText": "", "audioFile": "PB_000027.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000028", "originalText": "अन्यथा हि अभावाद्भावोत्पत्तिरिति सर्वप्रमाणव्याकोप इति।", "padacchedaText": "", "audioFile": "PB_000028.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000029", "originalText": "अतः अयत्नतः स्वात्मन्यवस्थानमित्यनुपपन्नम्।", "padacchedaText": "", "audioFile": "PB_000029.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000030", "originalText": "यच्चोक्तं निरतिशयप्रीतेः स्वर्गशब्दवाच्यायाः कर्मनिमित्तत्वात्कर्मारभ्य एव मोक्ष इति, तन्न, नित्यत्वान्मोक्षस्य।", "padacchedaText": "", "audioFile": "PB_000030.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000031", "originalText": "न हि नित्यं किञ्चिदारभ्यते, लोके यदारब्धम्, तदनित्यमिति।", "padacchedaText": "", "audioFile": "PB_000031.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000032", "originalText": "अतो न कर्मारभ्यो मोक्षः।", "padacchedaText": "", "audioFile": "PB_000032.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000033", "originalText": "विद्यासहितानां कर्मणां नित्यारम्भसामर्थ्यमिति चेत्, न, विरोधात्।", "padacchedaText": "", "audioFile": "PB_000033.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000034", "originalText": "नित्यं चारभ्यत इति विरुद्धम्।", "padacchedaText": "", "audioFile": "PB_000034.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000035", "originalText": "यद्धि नष्टम्, तदेव नोत्पद्यत इति प्रध्वंसाभाववन्नित्योऽपि मोक्ष आरभ्य एवेति चेत्, न, मोक्षस्य भावरूपत्वात्।", "padacchedaText": "", "audioFile": "PB_000035.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000036", "originalText": "प्रध्वंसाभावोऽप्यारभ्यत इति न सम्भवति अभावस्य विशेषाभावाद्विकल्पमात्रमेतत्।", "padacchedaText": "", "audioFile": "PB_000036.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000037", "originalText": "भावप्रतियोगी ह्यभावः।", "padacchedaText": "", "audioFile": "PB_000037.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000038", "originalText": "यथा ह्यभिन्नोऽपि भावो घटपटादिभिर्विशेष्यते भिन्न इव घटभावः पटभाव इति, एवं निर्विशेषोऽप्यभावः क्रियागुणयोगाद्द्रव्यादिवद्विकल्प्यते।", "padacchedaText": "", "audioFile": "PB_000038.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000039", "originalText": "न ह्यभाव उत्पलादिवद्विशेषणसहभावी।", "padacchedaText": "", "audioFile": "PB_000039.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000040", "originalText": "विशेषणवत्त्वे भाव एव स्यात्।", "padacchedaText": "", "audioFile": "PB_000040.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000041", "originalText": "विद्याकर्मकर्तुर्नित्यत्वात् विद्याकर्मसन्तानजनितमोक्षनित्यत्वमिति चेत्, न, गङ्गास्रोतोवत्कर्तृत्वस्य दुःखरूपत्वात्, कर्तृत्वोपरमे च मोक्षविच्छेदात्।", "padacchedaText": "", "audioFile": "PB_000041.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000042", "originalText": "तस्मादविद्याकामकर्मोपादानहेतुनिवृत्तौ स्वात्मन्यवस्थानं मोक्ष इति।", "padacchedaText": "", "audioFile": "PB_000042.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000043", "originalText": "स्वयं चात्मा ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000043.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000044", "originalText": "तद्विज्ञानादविद्यानिवृत्तिरिति।", "padacchedaText": "", "audioFile": "PB_000044.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000045", "originalText": "अतः ब्रह्मविद्यार्थोपनिषदारभ्यते।", "padacchedaText": "", "audioFile": "PB_000045.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000046", "originalText": "उपनिषदिति विद्योच्यते, तत्सेविनां गर्भजन्मजरादिनिशातनात्, तदवसादनाद्वा ब्रह्मण उपनिगमयितृत्वात्, उपनिषण्णं वा अस्यां परं श्रेय इति। तदर्थत्वाद्ग्रन्थोऽप्युपनिषत्॥", "padacchedaText": "", "audioFile": "PB_000046.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000047", "originalText": "ॐ शं नो मित्रः शं वरुणः।", "padacchedaText": "", "audioFile": "PB_000047.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000048", "originalText": "शं नो भवत्वर्यमा।", "padacchedaText": "", "audioFile": "PB_000048.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000049", "originalText": "शं न इन्द्रो बृहस्पतिः।", "padacchedaText": "", "audioFile": "PB_000049.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000050", "originalText": "शं नो विष्णुरुरुक्रमः।", "padacchedaText": "", "audioFile": "PB_000050.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000051", "originalText": "नमो ब्रह्मणे।", "padacchedaText": "", "audioFile": "PB_000051.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000052", "originalText": "नमस्ते वायो।", "padacchedaText": "", "audioFile": "PB_000052.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000053", "originalText": "त्वमेव प्रत्यक्षं ब्रह्मासि।", "padacchedaText": "", "audioFile": "PB_000053.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000054", "originalText": "त्वामेव प्रत्यक्षं ब्रह्म वदिष्यामि।", "padacchedaText": "", "audioFile": "PB_000054.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000055", "originalText": "ऋतं वदिष्यामि।", "padacchedaText": "", "audioFile": "PB_000055.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000056", "originalText": "सत्यं वदिष्यामि।", "padacchedaText": "", "audioFile": "PB_000056.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000057", "originalText": "तन्मामवतु।", "padacchedaText": "", "audioFile": "PB_000057.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000058", "originalText": "तद्वक्तारमवतु।", "padacchedaText": "", "audioFile": "PB_000058.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000059", "originalText": "अवतु माम्। अवतु वक्तारम्॥", "padacchedaText": "", "audioFile": "PB_000059.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000060", "originalText": "ॐशान्तिःशान्तिःशान्तिः॥ १॥", "padacchedaText": "", "audioFile": "PB_000060.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000061", "originalText": "शं सुखं प्राणवृत्तेरह्नश्चाभिमानी देवतात्मा मित्रः नः अस्माकं भवतु।", "padacchedaText": "", "audioFile": "PB_000061.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000062", "originalText": "तथैव अपानवृत्तेः रात्रेश्चाभिमानी देवतात्मा वरुणः, चक्षुषि आदित्ये चाभिमानी अर्यमा, बले इन्द्रः, वाचि बुद्धौ च बृहस्पतिः, विष्णुः उरुक्रमः विस्तीर्णक्रमः पादयोरभिमानी, एवमाद्या अध्यात्मदेवताः शं नः, भवतु इति सर्वत्रानुषङ्गः।", "padacchedaText": "", "audioFile": "PB_000062.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000063", "originalText": "तासु हि सुखकृत्सु विद्याश्रवणधारणोपयोगाः अप्रतिबन्धेन भविष्यन्तीति तत्सुखकृत्त्वं प्रार्थ्यते— शं नो भवतु इति।", "padacchedaText": "", "audioFile": "PB_000063.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000064", "originalText": "ब्रह्मविद्याविविदिषुणा नमस्कारब्रह्मवदनक्रिये वायुविषये ब्रह्मविद्योपसर्गशान्त्यर्थे क्रियेते— सर्वत्र क्रियाफलानां तदधीनत्वात्।", "padacchedaText": "", "audioFile": "PB_000064.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000065", "originalText": "ब्रह्म वायुः, तस्मै ब्रह्मणे नमः प्रह्वीभावम्, करोमीति वाक्यशेषः।", "padacchedaText": "", "audioFile": "PB_000065.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000066", "originalText": "नमः ते तुभ्यं हे वायो नमस्करोमि इति परोक्षप्रत्यक्षाभ्यां वायुरेवाभिधीयते।", "padacchedaText": "", "audioFile": "PB_000066.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000067", "originalText": "किं च, त्वमेव चक्षुराद्यपेक्ष्य बाह्यं संनिकृष्टमव्यवहितं प्रत्यक्षं ब्रह्मासि यस्मात्, तस्मात् त्वामेव प्रत्यक्षं ब्रह्म वदिष्यामि, ऋतं यथाशास्त्रं यथाकर्तव्यं बुद्धौ सुपरिनिश्चितमर्थं त्वदधीनत्वात् त्वामेव वदिष्यामि, सत्यमिति स एव वाक्कायाभ्यां सम्पाद्यमानः, सोऽपि त्वदधीन एव सम्पाद्यत इति त्वामेव सत्यं वदिष्यमि।", "padacchedaText": "", "audioFile": "PB_000067.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000068", "originalText": "तत् सर्वात्मकं वाय्वाख्यं ब्रह्म मयैवं स्तुतं सत् विद्यार्थिनं माम् अवतु विद्यासंयोजनेन।", "padacchedaText": "", "audioFile": "PB_000068.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000069", "originalText": "तदेव ब्रह्म वक्तारम् आचार्यं च वक्तृत्वसामर्थ्यसंयोजनेन अवतु।", "padacchedaText": "", "audioFile": "PB_000069.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000070", "originalText": "अवतु माम् अवतु वक्तारम् इति पुनर्वचनमादरार्थम्। शान्तिः शान्तिः शान्तिः इति त्रिर्वचनम् आध्यात्मिकाधिभौतिकाधिदैविकानां विद्याप्राप्त्युपसर्गाणां प्रशमनार्थम्॥", "padacchedaText": "", "audioFile": "PB_000070.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000071", "originalText": "इति प्रथमानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000071.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000072", "originalText": "द्वितीयोऽनुवाकः\nअर्थज्ञानप्रधानत्वादुपनिषदः ग्रन्थपाठे यत्नोपरमो मा भूदिति शीक्षाध्याय आरभ्यते—\nशीक्षां व्याख्यास्यामः।", "padacchedaText": "", "audioFile": "PB_000072.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000073", "originalText": "वर्णः स्वरः।", "padacchedaText": "", "audioFile": "PB_000073.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000074", "originalText": "मात्रा बलम्।", "padacchedaText": "", "audioFile": "PB_000074.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000075", "originalText": "साम सन्तानः। इत्युक्तः शीक्षाध्यायः॥ १॥", "padacchedaText": "", "audioFile": "PB_000075.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000076", "originalText": "शिक्षा शिक्ष्यते अनयेति वर्णाद्युच्चारणलक्षणम्, शिक्ष्यन्ते अस्मिन् इति वा शिक्षा वर्णादयः।", "padacchedaText": "", "audioFile": "PB_000076.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000077", "originalText": "शिक्षैव शीक्षा।", "padacchedaText": "", "audioFile": "PB_000077.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000078", "originalText": "दैर्घ्यं छान्दसम्।", "padacchedaText": "", "audioFile": "PB_000078.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000079", "originalText": "तां शीक्षां व्याख्यास्यामः विस्पष्टम् आ समन्तात्प्रकथयिष्यामः।", "padacchedaText": "", "audioFile": "PB_000079.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000080", "originalText": "चक्षिङः ख्याञादिष्टस्य व्याङ्पूर्वस्य व्यक्तवाक्कर्मण एतद्रूपम्।", "padacchedaText": "", "audioFile": "PB_000080.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000081", "originalText": "तत्र वर्णः अकारादिः।", "padacchedaText": "", "audioFile": "PB_000081.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000082", "originalText": "स्वर उदात्तादिः।", "padacchedaText": "", "audioFile": "PB_000082.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000083", "originalText": "मात्रा ह्रस्वाद्याः।", "padacchedaText": "", "audioFile": "PB_000083.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000084", "originalText": "बलं प्रयत्नविशेषः।", "padacchedaText": "", "audioFile": "PB_000084.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000085", "originalText": "साम वर्णानां मध्यमवृत्त्योच्चारणं समता।", "padacchedaText": "", "audioFile": "PB_000085.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000086", "originalText": "सन्तानः सन्ततिः, संहितेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000086.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000087", "originalText": "एवं शिक्षितव्योऽर्थः शिक्षा यस्मिन्नध्याये, सोऽयं शीक्षाध्यायः इति एवम् उक्तः उदितः। उक्त इत्युपसंहारार्थः॥", "padacchedaText": "", "audioFile": "PB_000087.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000088", "originalText": "इति द्वितीयानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000088.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000089", "originalText": "तृतीयोऽनुवाकः\nसह नौ यशः।", "padacchedaText": "", "audioFile": "PB_000089.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000090", "originalText": "सह नौ ब्रह्मवर्चसम्।", "padacchedaText": "", "audioFile": "PB_000090.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000091", "originalText": "अथातः सं हिताया उपनिषदं व्याख्यास्यामः।", "padacchedaText": "", "audioFile": "PB_000091.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000092", "originalText": "पञ्चस्वधिकरणेषु।", "padacchedaText": "", "audioFile": "PB_000092.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000093", "originalText": "अधिलोकमधिज्यौतिषमधिविद्यमधिप्रजमध्यात्मम्।", "padacchedaText": "", "audioFile": "PB_000093.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000094", "originalText": "ता महासं हिता इत्याचक्षते।", "padacchedaText": "", "audioFile": "PB_000094.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000095", "originalText": "अथाधििलोकम्।", "padacchedaText": "", "audioFile": "PB_000095.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000096", "originalText": "पृथिवी पूर्वरूपम्।", "padacchedaText": "", "audioFile": "PB_000096.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000097", "originalText": "द्यौरुत्तररूपम्। आकाशः सन्धिः॥ १॥", "padacchedaText": "", "audioFile": "PB_000097.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000098", "originalText": "अधुना संहितोपनिषदुच्यते।", "padacchedaText": "", "audioFile": "PB_000098.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000099", "originalText": "तत्र संहिताद्युपनिषत्परिज्ञाननिमित्तं यत् यशः प्राप्यते, तत् नौ आवयोः शिष्यार्चार्ययोः सहैव अस्तु।", "padacchedaText": "", "audioFile": "PB_000099.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000100", "originalText": "तन्निमित्तं च यत् ब्रह्मवर्चसं तेजः, तच्च सहैवास्तु इति शिष्यवचनमाशीः।", "padacchedaText": "", "audioFile": "PB_000100.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000101", "originalText": "शिष्यस्य हि अकृतार्थत्वात्प्रार्थनोपपद्यते, नाचार्यस्य, कृतार्थत्वात्।", "padacchedaText": "", "audioFile": "PB_000101.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000102", "originalText": "कृतार्थो ह्याचार्यो नाम भवति।", "padacchedaText": "", "audioFile": "PB_000102.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000103", "originalText": "अथ अनन्तरम् अध्ययनलक्षणविधानस्य पूर्ववृत्तस्य, अतः यतोऽत्यर्थं ग्रन्थभाविता बुद्धिर्न शक्यते सहसार्थज्ञानविषयेऽवतारयितुमित्यतः, संहितायाः उपनिषदं संहिताविषयं दर्शनमित्येतत् ग्रन्थसंनिकृष्टामेव व्याख्यास्यामः, पञ्चसु अधिकरणेषु आश्रयेषु, ज्ञानविषयेष्वित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000103.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000104", "originalText": "कानि तानीत्याह—— अधिलोकं लोकेष्वधि यद्दर्शनम्, तदधिलोकम्, तथा अधिज्यौतिषम् अधिविद्यम् अधिप्रजम् अध्यात्ममिति।", "padacchedaText": "", "audioFile": "PB_000104.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000105", "originalText": "ताः एताः पञ्चविषया उपनिषदः लोकादिमहावस्तुविषयत्वात्संहिताविषयत्वाच्च महत्यश्च ताः संहिताश्च महासंहिताः इति आचक्षते कथयन्ति वेदविदः।", "padacchedaText": "", "audioFile": "PB_000105.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000106", "originalText": "अथ तासां यथोपन्यस्तानां मध्ये अधिलोकं दर्शनमुच्यते।", "padacchedaText": "", "audioFile": "PB_000106.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000107", "originalText": "दर्शनक्रमविवक्षार्थः अथशब्दः सर्वत्र।", "padacchedaText": "", "audioFile": "PB_000107.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000108", "originalText": "पृथिवी पूर्वरूपम्, पूर्वो वर्णः पूर्वरूपम्, संहितायाः पूर्वे वर्णे पृथिवीदृष्टिः कर्तव्येत्युक्तं भवति।", "padacchedaText": "", "audioFile": "PB_000108.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000109", "originalText": "तथा द्यौः उत्तररूपम्। आकाशः अन्तरिक्षलोकः सन्धिः मध्यं पूर्वोत्तररूपयोः सन्धीयते अस्मिन्पूर्वोत्तररूपे इति॥", "padacchedaText": "", "audioFile": "PB_000109.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000110", "originalText": "वायुः सन्धानम्।", "padacchedaText": "", "audioFile": "PB_000110.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000111", "originalText": "इत्यधिलोकम्।", "padacchedaText": "", "audioFile": "PB_000111.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000112", "originalText": "अथाधिज्यौतिषम्।", "padacchedaText": "", "audioFile": "PB_000112.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000113", "originalText": "अग्निः पूर्वरूपम्।", "padacchedaText": "", "audioFile": "PB_000113.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000114", "originalText": "आदित्य उत्तररूपम्।", "padacchedaText": "", "audioFile": "PB_000114.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000115", "originalText": "आपः सन्धिः।", "padacchedaText": "", "audioFile": "PB_000115.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000116", "originalText": "वैद्युतः सन्धानम्।", "padacchedaText": "", "audioFile": "PB_000116.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000117", "originalText": "इत्यधिज्यौतिषम्।", "padacchedaText": "", "audioFile": "PB_000117.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000118", "originalText": "अथाधिविद्यम्। आचार्यः पूर्वरूपम्॥ २॥", "padacchedaText": "", "audioFile": "PB_000118.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000119", "originalText": "अन्तेवास्युत्तररूपम्।", "padacchedaText": "", "audioFile": "PB_000119.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000120", "originalText": "विद्या सन्धिः।", "padacchedaText": "", "audioFile": "PB_000120.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000121", "originalText": "प्रवचनं सन्धानम्।", "padacchedaText": "", "audioFile": "PB_000121.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000122", "originalText": "इत्यधिविद्यम्।", "padacchedaText": "", "audioFile": "PB_000122.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000123", "originalText": "अथाधिप्रजम्।", "padacchedaText": "", "audioFile": "PB_000123.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000124", "originalText": "माता पूर्वरूपम्।", "padacchedaText": "", "audioFile": "PB_000124.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000125", "originalText": "पितोत्तररूपम्।", "padacchedaText": "", "audioFile": "PB_000125.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000126", "originalText": "प्रजा सन्धिः।", "padacchedaText": "", "audioFile": "PB_000126.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000127", "originalText": "प्रजननं सन्धानम्। इत्यधिप्रजम्॥ ३॥", "padacchedaText": "", "audioFile": "PB_000127.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000128", "originalText": "अथाध्यात्मम्।", "padacchedaText": "", "audioFile": "PB_000128.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000129", "originalText": "अधरा हनुः पूर्वरूपम्।", "padacchedaText": "", "audioFile": "PB_000129.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000130", "originalText": "उत्तरा हनुरुत्तररूपम्।", "padacchedaText": "", "audioFile": "PB_000130.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000131", "originalText": "वाक्सन्धिः।", "padacchedaText": "", "audioFile": "PB_000131.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000132", "originalText": "जिह्वा सन्धानम्।", "padacchedaText": "", "audioFile": "PB_000132.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000133", "originalText": "इत्यध्यात्मम्।", "padacchedaText": "", "audioFile": "PB_000133.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000134", "originalText": "इतीमा महासं हिताः।", "padacchedaText": "", "audioFile": "PB_000134.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000135", "originalText": "य एवमेता महासं हिता व्याख्याता वेद।", "padacchedaText": "", "audioFile": "PB_000135.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000136", "originalText": "सन्धीयते प्रजया पशुभिः। ब्रह्मवर्चसेनान्नाद्येन सुवर्गेण लोकेन॥ ४॥", "padacchedaText": "", "audioFile": "PB_000136.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000137", "originalText": "वायुः सन्धानम्।", "padacchedaText": "", "audioFile": "PB_000137.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000138", "originalText": "सन्धीयते अनेनेति सन्धानम्।", "padacchedaText": "", "audioFile": "PB_000138.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000139", "originalText": "इति अधिलोकं दर्शनमुक्तम्।", "padacchedaText": "", "audioFile": "PB_000139.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000140", "originalText": "अथाधिज्यौतिषम् इत्यादि समानम्।", "padacchedaText": "", "audioFile": "PB_000140.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000141", "originalText": "इतीमा इति उक्ता उपप्रदर्श्यन्ते।", "padacchedaText": "", "audioFile": "PB_000141.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000142", "originalText": "यः कश्चित् एवम् एताः महासंहिताः व्याख्याताः वेद उपास्ते, वेदेत्युपासनं स्यात्, विज्ञानाधिकारात्, ‘इति प्राचीनयोग्योपास्स्व’ इति च वचनात्।", "padacchedaText": "", "audioFile": "PB_000142.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000143", "originalText": "उपासनं च यथाशास्त्रं तुल्यप्रत्ययसन्ततिरसङ्कीर्णा च अतत्प्रत्ययैः शास्त्रोक्तालम्बनविषया च।", "padacchedaText": "", "audioFile": "PB_000143.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000144", "originalText": "प्रसिद्धश्चोपासनशब्दार्थो लोके—— ‘गुरुमुपास्ते’ ‘राजानमुपास्ते’ इति।", "padacchedaText": "", "audioFile": "PB_000144.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000145", "originalText": "यो हि गुर्वादीन्सन्ततमुपचरति, स उपास्त इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_000145.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000146", "originalText": "स च फलमाप्नोत्युपासनस्य।", "padacchedaText": "", "audioFile": "PB_000146.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000147", "originalText": "अतः अत्रापि य एवं वेद, सन्धीयते प्रजादिभिः स्वर्गान्तैः। प्रजादिफलं प्राप्नोतीत्यर्थः॥", "padacchedaText": "", "audioFile": "PB_000147.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000148", "originalText": "इति तृतीयानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000148.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000149", "originalText": "चतुर्थोऽनुवाकः\nयश्छन्दसामृषभो विश्वरूपः।", "padacchedaText": "", "audioFile": "PB_000149.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000150", "originalText": "छन्दोभ्योऽध्यमृतात्सम्बभूव।", "padacchedaText": "", "audioFile": "PB_000150.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000151", "originalText": "स मेन्द्रो मेधया स्पृणोतु।", "padacchedaText": "", "audioFile": "PB_000151.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000152", "originalText": "अमृतस्य देव धारणो भूयासम्।", "padacchedaText": "", "audioFile": "PB_000152.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000153", "originalText": "शरीरं मे विचर्षणम्।", "padacchedaText": "", "audioFile": "PB_000153.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000154", "originalText": "जिह्वा मे मधुमत्तमा।", "padacchedaText": "", "audioFile": "PB_000154.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000155", "originalText": "कर्णाभ्यां भूरि विश्रुवम्।", "padacchedaText": "", "audioFile": "PB_000155.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000156", "originalText": "ब्रह्मणः कोशोऽसि मेधया पिहितः।", "padacchedaText": "", "audioFile": "PB_000156.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000157", "originalText": "श्रुतं मे गोपाय। आवहन्ती वितन्वाना॥ १॥", "padacchedaText": "", "audioFile": "PB_000157.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000158", "originalText": "कुर्वाणाचीरमात्मनः।", "padacchedaText": "", "audioFile": "PB_000158.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000159", "originalText": "वासां सि मम गावश्च।", "padacchedaText": "", "audioFile": "PB_000159.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000160", "originalText": "अन्नपाने च सर्वदा।", "padacchedaText": "", "audioFile": "PB_000160.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000161", "originalText": "ततो मे श्रियमावह।", "padacchedaText": "", "audioFile": "PB_000161.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000162", "originalText": "लोमशां पशुभिः सह स्वाहा।", "padacchedaText": "", "audioFile": "PB_000162.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000163", "originalText": "आमायन्तु ब्रह्मचारिणः स्वाहा।", "padacchedaText": "", "audioFile": "PB_000163.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000164", "originalText": "विमायन्तु ब्रह्मचारिणः स्वाहा।", "padacchedaText": "", "audioFile": "PB_000164.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000165", "originalText": "प्रमायन्तु ब्रह्मचारिणः स्वाहा।", "padacchedaText": "", "audioFile": "PB_000165.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000166", "originalText": "दमायन्तु ब्रह्मचारिणः स्वाहा। शमायन्तु ब्रह्मचारिणः स्वाहा॥ २॥", "padacchedaText": "", "audioFile": "PB_000166.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000167", "originalText": "यशो जनेऽसानि स्वाहा।", "padacchedaText": "", "audioFile": "PB_000167.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000168", "originalText": "श्रेयान् वस्यसोऽसानि स्वाहा।", "padacchedaText": "", "audioFile": "PB_000168.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000169", "originalText": "तं त्वा भग प्रविशानि स्वाहा।", "padacchedaText": "", "audioFile": "PB_000169.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000170", "originalText": "स मा भग प्रविश स्वाहा।", "padacchedaText": "", "audioFile": "PB_000170.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000171", "originalText": "तस्मिन्सहस्रशाखे।", "padacchedaText": "", "audioFile": "PB_000171.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000172", "originalText": "निभगाहं त्वयि मृजे स्वाहा।", "padacchedaText": "", "audioFile": "PB_000172.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000173", "originalText": "यथापः प्रवता यन्ति।", "padacchedaText": "", "audioFile": "PB_000173.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000174", "originalText": "यथा मासा अहर्जरम्।", "padacchedaText": "", "audioFile": "PB_000174.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000175", "originalText": "एवं मां ब्रह्मचारिणः।", "padacchedaText": "", "audioFile": "PB_000175.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000176", "originalText": "धातरायन्तु सर्वतः स्वाहा। प्रतिवेशोऽसि प्रमा पाहि प्र मा पद्यस्व॥ ३॥", "padacchedaText": "", "audioFile": "PB_000176.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000177", "originalText": "यश्छन्दसामिति मेधाकामस्य श्रीकामस्य च तत्प्राप्तिसाधनं जपहोमावुच्येते, ‘स मेन्द्रो मेधया स्पृणोतु’ ‘ततो मे श्रियमावह’ इति च लिङ्गदर्शनात्।", "padacchedaText": "", "audioFile": "PB_000177.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000178", "originalText": "यः छन्दसां वेदानाम् ऋषभ इव ऋषभः, प्राधान्यात्।", "padacchedaText": "", "audioFile": "PB_000178.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000179", "originalText": "विश्वरूपः सर्वरूपः, सर्ववाग्व्याप्तेः ‘तद्यथा शङ्कुना सर्वाणि पर्णानि सन्तृण्णान्येवमोङ्कारेण सर्वा वाक्सन्तृण्णोङ्कार एवेदं सर्वम्’ (छा.२.२३.३) इत्यादिश्रुत्यन्तरात्।", "padacchedaText": "", "audioFile": "PB_000179.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000180", "originalText": "अत एव ऋषभत्वमोङ्कारस्य।", "padacchedaText": "", "audioFile": "PB_000180.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000181", "originalText": "ओङ्कारो ह्यत्रोपास्य इति ऋषभादिशब्दैः स्तुतिर्न्याय्यैव ओङ्कारस्य।", "padacchedaText": "", "audioFile": "PB_000181.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000182", "originalText": "छन्दोभ्यः वेदेभ्यः, वेदा ह्यमृतम्, तस्मात् अमृतात् अधि सम्बभूव लोकदेववेदव्याहृतिभ्यः सारिष्ठं जिघृक्षोः प्रजापतेस्तपस्यतः ओङ्कारः सारिष्ठत्वेन प्रत्यभादित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000182.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000183", "originalText": "न हि नित्यस्य ओङ्कारस्य अञ्जसैवोत्पत्तिरवकल्पते।", "padacchedaText": "", "audioFile": "PB_000183.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000184", "originalText": "सः एवंभूत ओङ्कारः इन्द्रः सर्वकामेशः परमेश्वरः मा मां मेधया प्रज्ञया स्पृणोतु प्रीणयतु, बलयतु वा, प्रज्ञाबलं हि प्रार्थ्यते।", "padacchedaText": "", "audioFile": "PB_000184.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000185", "originalText": "अमृतस्य अमृतत्वहेतुभूतस्य ब्रह्मज्ञानस्य, तदधिकारात्, हे देव धारणः धारयिता भूयासं भवेयम्।", "padacchedaText": "", "audioFile": "PB_000185.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000186", "originalText": "किं च, शरीरं मे मम विचर्षणं विचक्षणं योग्यमित्येतत्, भूयादिति प्रथमपुरुषविपरिणामः।", "padacchedaText": "", "audioFile": "PB_000186.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000187", "originalText": "जिह्वा मे मम मधुमत्तमा मधुमती, अतिशयेन मधुरभाषिणीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000187.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000188", "originalText": "कर्णाभ्यां श्रोत्राभ्यां भूरि बहु विश्रुवं व्यश्रवम्, श्रोता भूयासमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000188.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000189", "originalText": "आत्मज्ञानयोग्यः कार्यकरणसङ्घातोऽस्त्विति वाक्यार्थः।", "padacchedaText": "", "audioFile": "PB_000189.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000190", "originalText": "मेधा च तदर्थमेव हि प्रार्थ्यते— ब्रह्मणः परमात्मनः कोशः असि असेरिव, उपलब्ध्यधिष्ठानत्वात्, त्वं हि ब्रह्मणः प्रतीकम्, त्वयि ब्रह्मोपलभ्यते।", "padacchedaText": "", "audioFile": "PB_000190.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000191", "originalText": "मेधया लौकिकप्रज्ञया पिहितः आच्छादितः स त्वं सामान्यप्रज्ञैरविदिततत्त्व इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000191.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000192", "originalText": "श्रुतं श्रवणपूर्वकमात्मज्ञानादिकं विज्ञानं मे गोपाय रक्ष, तत्प्राप्त्यविस्मरणादिकं कुर्वित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000192.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000193", "originalText": "जपार्था एते मन्त्रा मेधाकामस्य।", "padacchedaText": "", "audioFile": "PB_000193.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000194", "originalText": "श्रीकामस्य होमार्थास्त्वधुनोच्यन्ते मन्त्राः— आवहन्ती आनयन्ती, वितन्वाना विस्तारयन्ती, तनोतेस्तत्कर्मकत्वात्, कुर्वाणा निर्वर्तयन्ती अचीरम् अचिरं क्षिप्रमेव, छान्दसो दीर्घः, चिरं वा, कुर्वाणा, आत्मनः मम, किमित्याह वासांसि वस्त्राणि, मम, गावश्च गाश्चेति यावत्, अन्नपाने च सर्वदा, एवमादीनि कुर्वाणा श्रीर्या, तां ततः मेधानिर्वर्तनात्परम् आवह आनय, अमेधसो हि श्रीरनर्थायैवेति।", "padacchedaText": "", "audioFile": "PB_000194.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000195", "originalText": "किंविशिष्टाम्? लोमशाम् अजाव्यादियुक्ताम् अन्यैश्च पशुभिः सह युक्ताम् आवहेति।", "padacchedaText": "", "audioFile": "PB_000195.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000196", "originalText": "अधिकारादोङ्कार एवाभिसम्बध्यते।", "padacchedaText": "", "audioFile": "PB_000196.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000197", "originalText": "स्वाहा, स्वाहाकारो होमार्थमन्त्रान्तज्ञापनार्थः।", "padacchedaText": "", "audioFile": "PB_000197.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000198", "originalText": "आमायन्त्विति।", "padacchedaText": "", "audioFile": "PB_000198.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000199", "originalText": "आयन्तु, मामिति व्यवहितेन सम्बन्धः, ब्रह्मचारिणः।", "padacchedaText": "", "audioFile": "PB_000199.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000200", "originalText": "विमायन्तु प्रमायन्तु दमायन्तु शमायन्तु इत्यादि।", "padacchedaText": "", "audioFile": "PB_000200.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000201", "originalText": "यशोजने यशस्विजनेषु असानि भवानि।", "padacchedaText": "", "audioFile": "PB_000201.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000202", "originalText": "श्रेयान् प्रशस्यतरः, वस्यसः वसीयसः वसुतराद्वसुमत्तराद्वा धनवज्जातीयपुरुषाद्विशेषवानहमसानीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000202.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000203", "originalText": "किं च, तं ब्रह्मणः कोशभूतं त्वा त्वां हे भग भगवन् पूजार्ह, प्रविशानि।", "padacchedaText": "", "audioFile": "PB_000203.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000204", "originalText": "प्रविश्य चानन्यस्त्वदात्मैव भवानीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000204.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000205", "originalText": "सः त्वमपि मा मां भग भगवन्, प्रविश, आवयोरेकात्मत्वमेवास्तु।", "padacchedaText": "", "audioFile": "PB_000205.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000206", "originalText": "तस्मिन् त्वयि सहस्रशाखे बहुशाखाभेदे हे भगवन्, निमृजे शोधयामि अहं पापकृत्याम्।", "padacchedaText": "", "audioFile": "PB_000206.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000207", "originalText": "यथा लोके आपः प्रवता प्रवणवता निम्नवता देशेन यन्ति गच्छन्ति यथा च मासाः अहर्जरम्, संवत्सरोऽहर्जरः अहोभिः परिवर्तमानो लोकाञ्जरयतीति, अहानि वा अस्मिन् जीर्यन्ति अन्तर्भवन्तीत्यहर्जरः, तं च यथा मासाः यन्ति, एवं मां ब्रह्मचारिणः हे धातः सर्वस्य विधातः, माम् आयन्तु आगच्छन्तु सर्वतः सर्वदिग्भ्यः।", "padacchedaText": "", "audioFile": "PB_000207.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000208", "originalText": "प्रतिवेशः श्रमापनयनस्थानम् आसन्नं गृहमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000208.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000209", "originalText": "एवं त्वं प्रतिवेश इव प्रतिवेशः त्वच्छीलिनां सर्वपापदुःखापनयनस्थानमसि।", "padacchedaText": "", "audioFile": "PB_000209.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000210", "originalText": "अतः मा मां प्रति प्रभाहि प्रकाशयात्मानम्, प्र मा पद्यस्व प्रपद्यस्व च माम्।", "padacchedaText": "", "audioFile": "PB_000210.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000211", "originalText": "रसविद्धमिव लोहं त्वन्मयं त्वदात्मानं कुर्वित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000211.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000212", "originalText": "श्रीकामोऽस्मिन्विद्याप्रकरणे अभिधीयमानो धनार्थः, धनं च कर्मार्थम्, कर्म च उपात्तदुरितक्षयार्थम्, तत्क्षये हि विद्या प्रकाशते।", "padacchedaText": "", "audioFile": "PB_000212.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000213", "originalText": "तथा च स्मृतिः— ‘ज्ञानमुत्पद्यते पुंसां क्षयात्पापस्य कर्मणः। यथादर्शतले प्रख्ये पश्यत्यात्मानमात्मनि’ (म.भा.शां.२०४.८)(गरुड.१.२३७.६) इति॥", "padacchedaText": "", "audioFile": "PB_000213.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000214", "originalText": "इति चतुर्थानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000214.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000215", "originalText": "पञ्चमोऽनुवाकः\nसंहिताविषयमुपासनमुक्तम्।", "padacchedaText": "", "audioFile": "PB_000215.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000216", "originalText": "तदनु मेधाकामस्य श्रीकामस्य चानुक्रान्ता मन्त्राः।", "padacchedaText": "", "audioFile": "PB_000216.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000217", "originalText": "ते च पारम्पर्येण विद्योपयोगार्था एव।", "padacchedaText": "", "audioFile": "PB_000217.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000218", "originalText": "अनन्तरं व्याहृत्यात्मनो ब्रह्मणः अन्तरुपासनं स्वाराज्यफलं प्रस्तूयते—\nभूर्भुवः सुवरिति वा एतास्तिस्रो व्याहृतयः।", "padacchedaText": "", "audioFile": "PB_000218.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000219", "originalText": "तासामु ह स्मैतां चतुर्थीम्।", "padacchedaText": "", "audioFile": "PB_000219.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000220", "originalText": "माहाचमस्यः प्रवेदयते।", "padacchedaText": "", "audioFile": "PB_000220.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000221", "originalText": "मह इति।", "padacchedaText": "", "audioFile": "PB_000221.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000222", "originalText": "तद्ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000222.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000223", "originalText": "स आत्मा।", "padacchedaText": "", "audioFile": "PB_000223.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000224", "originalText": "अङ्गान्यन्या देवताः।", "padacchedaText": "", "audioFile": "PB_000224.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000225", "originalText": "भूरिति वा अयं लोकः।", "padacchedaText": "", "audioFile": "PB_000225.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000226", "originalText": "भुव इत्यन्तरिक्षम्। सुवरित्यसौ लोकः॥ १॥", "padacchedaText": "", "audioFile": "PB_000226.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000227", "originalText": "मह इत्यादित्यः।", "padacchedaText": "", "audioFile": "PB_000227.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000228", "originalText": "आदित्येन वाव सर्वे लोका महीयन्ते।", "padacchedaText": "", "audioFile": "PB_000228.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000229", "originalText": "भूरिति वा अग्निः।", "padacchedaText": "", "audioFile": "PB_000229.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000230", "originalText": "भुव इति वायुः।", "padacchedaText": "", "audioFile": "PB_000230.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000231", "originalText": "सुवरित्यादित्यः।", "padacchedaText": "", "audioFile": "PB_000231.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000232", "originalText": "मह इति चन्द्रमाः।", "padacchedaText": "", "audioFile": "PB_000232.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000233", "originalText": "चन्द्रमसा वाव सर्वाणि ज्योतींषि महीयन्ते।", "padacchedaText": "", "audioFile": "PB_000233.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000234", "originalText": "भूरिति वा ऋचः।", "padacchedaText": "", "audioFile": "PB_000234.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000235", "originalText": "भुव इति सामानि। सुवरिति यजूंषि॥ २॥", "padacchedaText": "", "audioFile": "PB_000235.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000236", "originalText": "मह इति ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000236.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000237", "originalText": "ब्रह्मणा वाव सर्वे वेदा महीयन्ते।", "padacchedaText": "", "audioFile": "PB_000237.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000238", "originalText": "भूरिति वै प्राणः।", "padacchedaText": "", "audioFile": "PB_000238.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000239", "originalText": "भुव इत्यपानः।", "padacchedaText": "", "audioFile": "PB_000239.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000240", "originalText": "सुवरिति व्यानः।", "padacchedaText": "", "audioFile": "PB_000240.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000241", "originalText": "मह इत्यन्नम्।", "padacchedaText": "", "audioFile": "PB_000241.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000242", "originalText": "अन्नेन वाव सर्वे प्राणा महीयन्ते।", "padacchedaText": "", "audioFile": "PB_000242.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000243", "originalText": "ता वा एताश्चतस्रश्चतुर्धा।", "padacchedaText": "", "audioFile": "PB_000243.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000244", "originalText": "चतस्रश्चतस्रो व्याहृतयः।", "padacchedaText": "", "audioFile": "PB_000244.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000245", "originalText": "ता यो वेद।", "padacchedaText": "", "audioFile": "PB_000245.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000246", "originalText": "स वेद ब्रह्म। सर्वेऽस्मै देवा बलिमावहन्ति॥ ३॥", "padacchedaText": "", "audioFile": "PB_000246.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000247", "originalText": "भूर्भुवः सुवरिति।", "padacchedaText": "", "audioFile": "PB_000247.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000248", "originalText": "इतीत्युक्तोपप्रदर्शनार्थः।", "padacchedaText": "", "audioFile": "PB_000248.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000249", "originalText": "एतास्तिस्र इति च प्रदर्शितानां परामर्शार्थः परामृष्टाः स्मर्यन्ते वै इत्यनेन।", "padacchedaText": "", "audioFile": "PB_000249.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000250", "originalText": "तिस्र एताः प्रसिद्धा व्याहृतयः स्मर्यन्त इति यावत्।", "padacchedaText": "", "audioFile": "PB_000250.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000251", "originalText": "तासाम् इयं चतुर्थी व्याहृतिर्मह इति, तामेतां चतुर्थीं महाचमसस्यापत्यं माहाचमस्यः प्रवेदयते, उ ह स्म इत्येतेषां वृत्तानुकथनार्थत्वात् विदितवान् ददर्शेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000251.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000252", "originalText": "माहाचमस्यग्रहणमार्षानुस्मरणार्थम्।", "padacchedaText": "", "audioFile": "PB_000252.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000253", "originalText": "ऋष्यनुस्मरणमप्युपासनाङ्गमिति गम्यते, इहोपदेशात्।", "padacchedaText": "", "audioFile": "PB_000253.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000254", "originalText": "येयं माहाचमस्येन दृष्टा व्याहृतिः मह इति, तत् ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000254.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000255", "originalText": "महद्धि ब्रह्म, महश्च व्याहृतिः।", "padacchedaText": "", "audioFile": "PB_000255.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000256", "originalText": "किं पुनस्तत्? स आत्मा, आप्नोतेर्व्याप्तिकर्मणः आत्मा, इतराश्च व्याहृतयो लोका देवा वेदाः प्राणाश्च मह इत्यनेन व्याहृत्यात्मना आदित्यचन्द्रब्रह्मान्नभूतेन व्याप्यन्ते यतः, अत अङ्गानि अवयवाः अन्याः देवताः।", "padacchedaText": "", "audioFile": "PB_000256.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000257", "originalText": "देवताग्रहणमुपलक्षणार्थं लोकादीनाम्।", "padacchedaText": "", "audioFile": "PB_000257.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000258", "originalText": "मह इत्यस्य व्याहृत्यात्मनो देवा लोकादयश्च सर्वे अवयवभूता यतः, अत आह— आदित्यादिभिर्लोकादयो महीयन्त इति।", "padacchedaText": "", "audioFile": "PB_000258.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000259", "originalText": "आत्मना ह्यङ्गानि महीयन्ते महनं वृद्धिः उपचयः।", "padacchedaText": "", "audioFile": "PB_000259.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000260", "originalText": "महीयन्ते वर्धन्त इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000260.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000261", "originalText": "अयं लोकः अग्निः ऋग्वेदः प्राण इति प्रथमा व्याहृतिः भूः, अन्तरिक्षं वायुः सामानि अपानः इति द्वितीया व्याहृतिः भुवः, असौ लोकः आदित्यः यजूंषि व्यानः इति तृतीया व्याहृतिः सुवः, आदित्यः चन्द्रमाः ब्रह्म अन्नम् इति चतुर्थी व्याहृतिः महः इत्येवम् एकैकाश्चतुर्धा भवन्ति।", "padacchedaText": "", "audioFile": "PB_000261.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000262", "originalText": "मह इति ब्रह्म ब्रह्मेत्योङ्कारः, शब्दाधिकारे अन्यस्यासम्भवात्।", "padacchedaText": "", "audioFile": "PB_000262.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000263", "originalText": "उक्तार्थमन्यत्।", "padacchedaText": "", "audioFile": "PB_000263.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000264", "originalText": "ता वा एताश्चतस्रश्चतुर्धेति।", "padacchedaText": "", "audioFile": "PB_000264.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000265", "originalText": "ता वै एताः भूर्भुवःसुवर्मह इति चतस्रः एकैकशः चतुर्धा चतुःप्रकाराः।", "padacchedaText": "", "audioFile": "PB_000265.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000266", "originalText": "धाशब्दः प्रकारवचनः।", "padacchedaText": "", "audioFile": "PB_000266.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000267", "originalText": "चतस्रश्चतस्रः सत्यः चतुर्धा भवन्तीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000267.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000268", "originalText": "तासां यथाक्लृप्तानां पुनरुपदेशस्तथैवोपासननियमार्थः।", "padacchedaText": "", "audioFile": "PB_000268.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000269", "originalText": "ताः यथोक्ता व्याहृतीः यः वेद, स वेद विजानाति।", "padacchedaText": "", "audioFile": "PB_000269.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000270", "originalText": "किं तत्? ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000270.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000271", "originalText": "ननु, ‘तद्ब्रह्म स आत्मा’ इति ज्ञाते ब्रह्मणि, न वक्तव्यमविज्ञातवत् ‘स वेद ब्रह्म’ इति, न, तद्विशेषविवक्षुत्वाददोषः।", "padacchedaText": "", "audioFile": "PB_000271.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000272", "originalText": "सत्यं विज्ञातं चतुर्थव्याहृत्या आत्मा ब्रह्मेति, न तु तद्विशेषः, हृदयान्तरुपलभ्यत्वं मनोमयत्वादिश्च।", "padacchedaText": "", "audioFile": "PB_000272.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000273", "originalText": "‘शान्तिसमृद्धम्’ इत्येवमन्तो विशेषणविशेषरूपो धर्मपूगो न विज्ञायत इति, तद्विवक्षु हि शास्त्रमविज्ञातमिव ब्रह्म मत्वा ‘स वेद ब्रह्म’ इत्याह।", "padacchedaText": "", "audioFile": "PB_000273.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000274", "originalText": "अतो न दोषः।", "padacchedaText": "", "audioFile": "PB_000274.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000275", "originalText": "यो वा वक्ष्यमाणेन धर्मपूगेण विशिष्टं ब्रह्म वेद, स वेद ब्रह्म इत्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_000275.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000276", "originalText": "अतो वक्ष्यमाणानुवाकेनैकवाक्यता अस्य, उभयोर्ह्यनुवाकयोरेकमुपासनम्।", "padacchedaText": "", "audioFile": "PB_000276.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000277", "originalText": "लिङ्गाच्च।", "padacchedaText": "", "audioFile": "PB_000277.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000278", "originalText": "‘भूरित्यग्नौ प्रतितिष्ठति’ इत्यादिकं लिङ्गमुपासनैकत्वे।", "padacchedaText": "", "audioFile": "PB_000278.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000279", "originalText": "विधायकाभावाच्च।", "padacchedaText": "", "audioFile": "PB_000279.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000280", "originalText": "न हि वेद उपासीत वेति विधायकः कश्चिच्छब्दोऽस्ति।", "padacchedaText": "", "audioFile": "PB_000280.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000281", "originalText": "व्याहृत्यनुवाके ‘ता यो वेद’ इति तु वक्ष्यमाणार्थत्वान्नोपासनाभेदकः।", "padacchedaText": "", "audioFile": "PB_000281.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000282", "originalText": "वक्ष्यमाणार्थत्वं च तद्विशेषविवक्षुत्वादित्यादिनोक्तम्। सर्वे देवाः अस्मै एवंविदुषे अङ्गभूताः आवहन्ति आनयन्ति बलिम्, स्वाराज्यप्राप्तौ सत्यामित्यर्थः॥", "padacchedaText": "", "audioFile": "PB_000282.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000283", "originalText": "इति पञ्चमानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000283.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000284", "originalText": "षष्ठोऽनुवाकः\nभूर्भुवः सुवः स्वरूपा मह इत्येतस्य हिरण्यगर्भस्य व्याहृत्यात्मनो ब्रह्मणोऽङ्गान्यन्या देवता इत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_000284.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000285", "originalText": "यस्य ता अङ्गभूताः, तस्यैतस्य ब्रह्मणः साक्षादुपलब्ध्यर्थमुपासनार्थं च हृदयाकाशः स्थानमुच्यते, सालग्राम इव विष्णोः।", "padacchedaText": "", "audioFile": "PB_000285.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000286", "originalText": "तस्मिन्हि तद्ब्रह्म उपास्यमानं मनोमयत्वादिधर्मविशिष्टं साक्षादुपलभ्यते, पाणाविवामलकम्।", "padacchedaText": "", "audioFile": "PB_000286.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000287", "originalText": "मार्गश्च सर्वात्मभावप्रतिपत्तये वक्तव्य इत्यनुवाक आरभ्यते—\nस य एषोऽन्तर्हृदय आकाशः।", "padacchedaText": "", "audioFile": "PB_000287.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000288", "originalText": "तस्मिन्नयं पुरुषो मनोमयः।", "padacchedaText": "", "audioFile": "PB_000288.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000289", "originalText": "अमृतो हिरण्मयः।", "padacchedaText": "", "audioFile": "PB_000289.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000290", "originalText": "अन्तरेण तालुके।", "padacchedaText": "", "audioFile": "PB_000290.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000291", "originalText": "य एष स्तन इवावलम्बते।", "padacchedaText": "", "audioFile": "PB_000291.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000292", "originalText": "सेन्द्रयोनिः।", "padacchedaText": "", "audioFile": "PB_000292.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000293", "originalText": "यत्रासौ केशान्तो विवर्तते।", "padacchedaText": "", "audioFile": "PB_000293.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000294", "originalText": "व्यपोह्य शीर्षकपाले।", "padacchedaText": "", "audioFile": "PB_000294.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000295", "originalText": "भूरित्यग्नौ प्रतितिष्ठति। भुव इति वायौ॥ १॥", "padacchedaText": "", "audioFile": "PB_000295.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000296", "originalText": "सुवरित्यादित्ये।", "padacchedaText": "", "audioFile": "PB_000296.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000297", "originalText": "मह इति ब्रह्मणि।", "padacchedaText": "", "audioFile": "PB_000297.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000298", "originalText": "आप्नोति स्वाराज्यम्।", "padacchedaText": "", "audioFile": "PB_000298.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000299", "originalText": "आप्नोति मनसस्पतिम्।", "padacchedaText": "", "audioFile": "PB_000299.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000300", "originalText": "वाक्पतिश्चक्षुष्पतिः।", "padacchedaText": "", "audioFile": "PB_000300.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000301", "originalText": "श्रोत्रपतिर्विज्ञानपतिः।", "padacchedaText": "", "audioFile": "PB_000301.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000302", "originalText": "एतत्ततो भवति।", "padacchedaText": "", "audioFile": "PB_000302.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000303", "originalText": "आकाशशरीरं ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000303.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000304", "originalText": "सत्यात्म प्राणारामं मन आनन्दम्।", "padacchedaText": "", "audioFile": "PB_000304.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000305", "originalText": "शान्तिसमृद्धममृतम्। इति प्राचीनयोग्योपास्स्व॥ २॥", "padacchedaText": "", "audioFile": "PB_000305.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000306", "originalText": "स इति व्युत्क्रम्य अयं पुरुष इत्यनेन सम्बन्ध्यते।", "padacchedaText": "", "audioFile": "PB_000306.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000307", "originalText": "य एष अन्तर्हृदये हृदयस्यान्तः।", "padacchedaText": "", "audioFile": "PB_000307.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000308", "originalText": "हृदयमिति पुण्डरीकाकारो मांसपिण्डः प्राणायतनोऽनेकनाडीसुषिर ऊर्ध्वनालोऽधोमुखो विशस्यमाने पशौ प्रसिद्ध उपलभ्यते।", "padacchedaText": "", "audioFile": "PB_000308.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000309", "originalText": "तस्यान्तः य एष आकाशः प्रसिद्ध एव करकाकाशवत्, तस्मिन् सोऽयं पुरुषः, पुरि शयनात्, पूर्णा वा भूरादयो लोका येनेति पुरुषः मनोमयः, मनः विज्ञानं मनुतेर्ज्ञानकर्मणः, तन्मयः तत्प्रायः, तदुपलभ्यत्वात्।", "padacchedaText": "", "audioFile": "PB_000309.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000310", "originalText": "मनुते अनेनेति वा मनः अन्तःकरणम्, तदभिमानी तन्मयः, तल्लिङ्गो वा।", "padacchedaText": "", "audioFile": "PB_000310.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000311", "originalText": "अमृतः अमरणधर्मा।", "padacchedaText": "", "audioFile": "PB_000311.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000312", "originalText": "हिरण्मयः ज्योतिर्मयः।", "padacchedaText": "", "audioFile": "PB_000312.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000313", "originalText": "तस्यैवंलक्षणस्य हृदयाकाशे साक्षात्कृतस्य विदुष आत्मभूतस्य ईश्वररूपस्य प्रतिपत्तये मार्गोऽभिधीयते— हृदयादूर्ध्वं प्रवृत्ता सुषुम्ना नाम नाडी योगशास्त्रेषु प्रसिद्धा।", "padacchedaText": "", "audioFile": "PB_000313.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000314", "originalText": "सा च अन्तरेण तालुके मध्ये तालुकयोर्गता।", "padacchedaText": "", "audioFile": "PB_000314.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000315", "originalText": "यश्च एष तालुकयोर्मध्ये स्तन इव अवलम्बते मांसखण्डः, तस्य च अन्तरेण इत्येतत्।", "padacchedaText": "", "audioFile": "PB_000315.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000316", "originalText": "यत्र च असौ केशान्तः केशानामन्तो मूलं केशान्तः विवर्तते विभागेन वर्तते, मूर्धप्रदेश इत्यर्थः, तं देशं प्राप्य तेनान्तरेण व्यपोह्य विभज्य विदार्य शीर्षकपाले शिरःकपाले, विनिर्गता या, सा इन्द्रयोनिः इन्द्रस्य ब्रह्मणः योनिः मार्गः, स्वरूपप्रतिपत्तिद्वारमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000316.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000317", "originalText": "तथा एवं विद्वान्मनोमयात्मदर्शी मूर्ध्नो विनिष्क्रम्य अस्य लोकस्याधिष्ठाता भूरिति व्याहृतिरूपो योऽग्निः महतो ब्रह्मणोऽङ्गभूतः, तस्मिन् अग्नौ प्रतितिष्ठति, अग्न्यात्मना इमं लोकं व्याप्नोतीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000317.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000318", "originalText": "तथा भुव इति द्वितीयव्याहृत्यात्मनि वायौ, प्रतितिष्ठतीत्यनुवर्तते।", "padacchedaText": "", "audioFile": "PB_000318.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000319", "originalText": "सुवरिति तृतीयव्याहृत्यात्मनि आदित्ये।", "padacchedaText": "", "audioFile": "PB_000319.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000320", "originalText": "मह इत्यङ्गिनि चतुर्थव्याहृत्यात्मनि ब्रह्मणि प्रतितिष्ठतीति।", "padacchedaText": "", "audioFile": "PB_000320.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000321", "originalText": "तेष्वात्मभावेन स्थित्वा आप्नोति ब्रह्मभूतं स्वाराज्यं स्वराड्भावं स्वयमेव राजा अधिपतिर्भवति अङ्गभूतानां देवतानां यथा ब्रह्म, देवाश्च सर्वे अस्मै अङ्गिने बलिमावहन्ति अङ्गभूताः यथा ब्रह्मणे।", "padacchedaText": "", "audioFile": "PB_000321.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000322", "originalText": "आप्नोति मनसस्पतिम्, सर्वेषां हि मनसां पतिः, सर्वात्मकत्वाद्ब्रह्मणः सर्वैर्हि मनोभिस्तन्मनुते।", "padacchedaText": "", "audioFile": "PB_000322.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000323", "originalText": "तदाप्नोत्येवं विद्वान्।", "padacchedaText": "", "audioFile": "PB_000323.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000324", "originalText": "किं च, वाक्पतिः सर्वासां वाचां पतिर्भवति।", "padacchedaText": "", "audioFile": "PB_000324.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000325", "originalText": "तथैव चक्षुष्पतिः चक्षुषां पतिः।", "padacchedaText": "", "audioFile": "PB_000325.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000326", "originalText": "श्रोत्रपतिः श्रोत्राणां च पतिः।", "padacchedaText": "", "audioFile": "PB_000326.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000327", "originalText": "विज्ञानपतिः विज्ञानानां च पतिः।", "padacchedaText": "", "audioFile": "PB_000327.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000328", "originalText": "सर्वात्मकत्वात्सर्वप्राणिनां करणैस्तद्वान्भवतीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000328.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000329", "originalText": "किं च, ततोऽपि अधिकतरम् एतत् भवति।", "padacchedaText": "", "audioFile": "PB_000329.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000330", "originalText": "किं तत्? उच्यते— आकाशशरीरम् आकाशः शरीरमस्य, आकाशवद्वा सूक्ष्मं शरीरमस्येत्याकाशशरीरम्।", "padacchedaText": "", "audioFile": "PB_000330.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000331", "originalText": "किं तत्? प्रकृतं ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000331.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000332", "originalText": "सत्यात्म, सत्यं मूर्तामूर्तम् अवितथं स्वरूपं वा आत्मा स्वभावोऽस्य, तदिदं सत्यात्म।", "padacchedaText": "", "audioFile": "PB_000332.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000333", "originalText": "प्राणारामम्, प्राणेष्वारमणमाक्रीडा यस्य तत्प्राणारामम्, प्राणानां वा आरामो यस्मिन्, तत्प्राणारामम्।", "padacchedaText": "", "audioFile": "PB_000333.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000334", "originalText": "मन आनन्दम्, आनन्दभूतं सुखकृदेव यस्य मनः, तन्मन आनन्दम्।", "padacchedaText": "", "audioFile": "PB_000334.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000335", "originalText": "शान्तिसमृद्धम्, शान्तिरुपशमः, शान्तिश्च तत्समृद्धं च शान्तिसमृद्धम्, शान्त्या वा समृद्धवत्तदुपलभ्यत इति शान्तिसमृद्धम्।", "padacchedaText": "", "audioFile": "PB_000335.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000336", "originalText": "अमृतम् अमरणधर्मि, एतच्चाधिकरणविशेषणं तत्रैव मनोमय इत्यादौ द्रष्टव्यमिति।", "padacchedaText": "", "audioFile": "PB_000336.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000337", "originalText": "एवं मनोमयत्वादिधर्मैर्विशिष्टं यथोक्तं ब्रह्म हे प्राचीनयोग्य, उपास्स्व इत्याचार्यवचनोक्तिरादरार्था। उक्तस्तूपासनाशब्दार्थः॥", "padacchedaText": "", "audioFile": "PB_000337.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000338", "originalText": "इति षष्ठोनुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000338.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000339", "originalText": "सप्तमोऽनुवाकः\nयदेतद्व्याहृत्यात्मकं ब्रह्मोपास्यमुक्तम्, तस्यैवेदानीं पृथिव्यादिपाङ्क्तस्वरूपेणोपासनमुच्यते—\nपृथिव्यन्तरिक्षं द्यौर्दिशोऽवान्तरदिशः।", "padacchedaText": "", "audioFile": "PB_000339.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000340", "originalText": "अग्निर्वायुरादित्यश्चन्द्रमा नक्षत्राणि।", "padacchedaText": "", "audioFile": "PB_000340.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000341", "originalText": "आप ओषधयो वनस्पतय आकाश आत्मा।", "padacchedaText": "", "audioFile": "PB_000341.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000342", "originalText": "इत्यधिभूतम्।", "padacchedaText": "", "audioFile": "PB_000342.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000343", "originalText": "अथाध्यात्मम्।", "padacchedaText": "", "audioFile": "PB_000343.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000344", "originalText": "प्राणो व्यानोऽपान उदानः समानः।", "padacchedaText": "", "audioFile": "PB_000344.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000345", "originalText": "चक्षुः श्रोत्रं मनो वाक् त्वक्।", "padacchedaText": "", "audioFile": "PB_000345.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000346", "originalText": "चर्म मांसंस्नावास्थि मज्जा।", "padacchedaText": "", "audioFile": "PB_000346.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000347", "originalText": "एतदधिविधाय ऋषिरवोचत्।", "padacchedaText": "", "audioFile": "PB_000347.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000348", "originalText": "पाङ्क्तं वा इदं सर्वम्। पाङ्क्तेनैव पाङ्क्तं स्पृणोतीति॥ १॥", "padacchedaText": "", "audioFile": "PB_000348.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000349", "originalText": "पञ्चसङ्ख्यायोगात्पङ्क्तिच्छन्दः सम्पक्तिः, ततः पाङ्क्तत्वं सर्वस्य।", "padacchedaText": "", "audioFile": "PB_000349.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000350", "originalText": "पाङ्क्तश्च यज्ञः, ‘पञ्चपदा पङ्क्तिः पाङ्क्तो यज्ञः’ इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_000350.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000351", "originalText": "तेन यत्सर्वं लोकाद्यात्मान्तं च पाङ्क्तं परिकल्पयति, यज्ञमेव तत्परिकल्पयति।", "padacchedaText": "", "audioFile": "PB_000351.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000352", "originalText": "तेन यज्ञेन परिकल्पितेन पाङ्क्तात्मकं प्रजापतिमभिसम्पद्यते।", "padacchedaText": "", "audioFile": "PB_000352.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000353", "originalText": "तत्कथं पाङ्क्तं वा इदं सर्वमित्यत आह— पृथिवी अन्तरिक्षं द्यौः दिशः अवान्तरदिशः इति लोकपाङ्क्तम्।", "padacchedaText": "", "audioFile": "PB_000353.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000354", "originalText": "अग्निः वायुः आदित्यः चन्द्रमाः नक्षत्राणि इति देवतापाङ्क्तम्।", "padacchedaText": "", "audioFile": "PB_000354.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000355", "originalText": "आपः ओषधयः वनस्पतयः आकाशः आत्मा इति भूतपाङ्क्तम्।", "padacchedaText": "", "audioFile": "PB_000355.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000356", "originalText": "आत्मेति विराट्, भूताधिकारात्।", "padacchedaText": "", "audioFile": "PB_000356.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000357", "originalText": "इत्यधिभूतमिति अधिलोकाधिदैवतपाङ्क्तद्वयोपलक्षणार्थम्, लोकदेवतापाङ्क्तयोर्द्वयोश्चाभिहितत्वात्।", "padacchedaText": "", "audioFile": "PB_000357.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000358", "originalText": "अथ अनन्तरम् अध्यात्मं पाङ्क्तत्रयमुच्यते— प्राणादि वायुपाङ्क्तम्।", "padacchedaText": "", "audioFile": "PB_000358.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000359", "originalText": "चक्षुरादि इन्द्रियपाङ्क्तम्।", "padacchedaText": "", "audioFile": "PB_000359.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000360", "originalText": "चर्मादि धातुपाङ्क्तम्।", "padacchedaText": "", "audioFile": "PB_000360.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000361", "originalText": "एतावद्धीदं सर्वमध्यात्मं बाह्यं च पाङ्क्तमेव इति एतत् एवम् अधिविधाय परिकल्प्य ऋषिः वेदः एतद्दर्शनसम्पन्नो वा कश्चिदृषिः, अवोचत् उक्तवान्।", "padacchedaText": "", "audioFile": "PB_000361.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000362", "originalText": "किमित्याह— पाङ्क्तं वा इदं सर्वं पाङ्क्तेनैव आध्यात्मिकेन, सङ्ख्यासामान्यात्, पाङ्क्तं बाह्यं स्पृणोति बलयति पूरयति एकात्मतयोपलभ्यत इत्येतत्। एवं पाङ्क्तमिदं सर्वमिति यो वेद, स प्रजापत्यात्मैव भवतीत्यर्थः॥", "padacchedaText": "", "audioFile": "PB_000362.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000363", "originalText": "इति सप्तमानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000363.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000364", "originalText": "अष्टमोऽनुवाकः\nव्याहृत्यात्मनो ब्रह्मण उपासनमुक्तम्।", "padacchedaText": "", "audioFile": "PB_000364.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000365", "originalText": "अनन्तरं च पाङ्क्तस्वरूपेण तस्यैवोपासनमुक्तम्।", "padacchedaText": "", "audioFile": "PB_000365.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000366", "originalText": "इदानीं सर्वोपासनाङ्गभूतस्य ओङ्कारस्योपासनं विधित्स्यते।", "padacchedaText": "", "audioFile": "PB_000366.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000367", "originalText": "ओमिति ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000367.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000368", "originalText": "ओमितीदं सर्वम्।", "padacchedaText": "", "audioFile": "PB_000368.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000369", "originalText": "ओमित्येतदनुकृतिर्ह स्म वा अप्यो श्रावयेत्याश्रावयन्ति।", "padacchedaText": "", "audioFile": "PB_000369.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000370", "originalText": "ओमिति सामानि गायन्ति।", "padacchedaText": "", "audioFile": "PB_000370.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000371", "originalText": "ॐ शोमिति शस्त्राणि शंसन्ति।", "padacchedaText": "", "audioFile": "PB_000371.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000372", "originalText": "ओमित्यध्वर्युः प्रतिगरं प्रतिगृणाति।", "padacchedaText": "", "audioFile": "PB_000372.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000373", "originalText": "ओमिति ब्रह्मा प्रसौति।", "padacchedaText": "", "audioFile": "PB_000373.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000374", "originalText": "ओमित्यग्निहोत्रमनुजानाति।", "padacchedaText": "", "audioFile": "PB_000374.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000375", "originalText": "ओमिति ब्राह्मणः प्रवक्ष्यन्नाह ब्रह्मोपाप्नवानीति। ब्रह्मैवोपाप्नोति॥ १॥", "padacchedaText": "", "audioFile": "PB_000375.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000376", "originalText": "परापरब्रह्मदृष्ट्या हि उपास्यमान ओङ्कारः शब्दमात्रोऽपि परापरब्रह्मप्राप्तिसाधनं भवति, स ह्यालम्बनं ब्रह्मणः परस्यापरस्य च, प्रतिमेव विष्णोः, ‘एतेनैवायतनेनैकतरमन्वेति’ (प्र.५.२) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_000376.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000377", "originalText": "ओमिति, इतिशब्दः स्वरूपपरिच्छेदार्थः, ओमित्येतच्छब्दरूपं ब्रह्म इति मनसा धारयेत् उपासीत, यतः ओमितीदं सर्वं हि शब्दस्वरूपमोङ्कारेण व्याप्तम्, ‘तद्यथा शङ्कुना’ (छा.२.२३.३) इति श्रुत्यन्तरात्।", "padacchedaText": "", "audioFile": "PB_000377.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000378", "originalText": "‘अभिधानतन्त्रं ह्यभिधेयम्’ इत्यतः इदं सर्वमोङ्कार इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_000378.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000379", "originalText": "ओङ्कारस्तुत्यर्थ उत्तरो ग्रन्थः, उपास्यत्वात्तस्य।", "padacchedaText": "", "audioFile": "PB_000379.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000380", "originalText": "ॐ इत्येतत् अनुकृतिः अनुकरणम्।", "padacchedaText": "", "audioFile": "PB_000380.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000381", "originalText": "करोमि यास्यामि चेति कृतमुक्त ओमित्यनुकरोत्यन्यः, अतः ओङ्कारोऽनुकृतिः।", "padacchedaText": "", "audioFile": "PB_000381.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000382", "originalText": "ह स्म वै इति प्रसिद्धार्थद्योतकाः।", "padacchedaText": "", "audioFile": "PB_000382.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000383", "originalText": "प्रसिद्धं ह्योङ्कारस्यानुकृतित्वम्।", "padacchedaText": "", "audioFile": "PB_000383.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000384", "originalText": "अपि च ओश्रावय इति प्रैषपूर्वमाश्रावयन्ति प्रतिश्रावयन्ति।", "padacchedaText": "", "audioFile": "PB_000384.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000385", "originalText": "तथा ॐ इति सामानि गायन्ति सामगाः।", "padacchedaText": "", "audioFile": "PB_000385.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000386", "originalText": "ॐ शोमिति शस्त्राणि शंसन्ति शस्त्रशंसितारोऽपि।", "padacchedaText": "", "audioFile": "PB_000386.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000387", "originalText": "तथा ॐ इति अध्वर्युः प्रतिगरं प्रतिगृणाति।", "padacchedaText": "", "audioFile": "PB_000387.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000388", "originalText": "ॐ इति ब्रह्मा प्रसौति अनुजानाति।", "padacchedaText": "", "audioFile": "PB_000388.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000389", "originalText": "ॐ इति अग्निहोत्रम् अनुजानाति जुहोमीत्युक्ते ॐ इत्येव अनुज्ञां प्रयच्छति।", "padacchedaText": "", "audioFile": "PB_000389.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000390", "originalText": "ॐ इत्येव ब्राह्मणः प्रवक्ष्यन् प्रवचनं करिष्यन् अध्येष्यमाणः ओमित्याह ओमित्येव प्रतिपद्यते अध्येतुमित्यर्थः, ब्रह्म वेदम् उपाप्नवानि इति प्राप्नुयां ग्रहीष्यामीति उपाप्नोत्येव ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000390.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000391", "originalText": "अथवा, ब्रह्म परमात्मानम् उपाप्नवानीत्यात्मानं प्रवक्ष्यन् प्रापयिष्यन् ओमित्येवाह।", "padacchedaText": "", "audioFile": "PB_000391.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000392", "originalText": "स च तेनोङ्कारेण ब्रह्म प्राप्नोत्येव। ओङ्कारपूर्वं प्रवृत्तानां क्रियाणां फलवत्त्वं यस्मात्, तस्मादोङ्कारं ब्रह्मेत्युपासीतेति वाक्यार्थः॥", "padacchedaText": "", "audioFile": "PB_000392.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000393", "originalText": "इत्यष्टमानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000393.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000394", "originalText": "नवमोऽनुवाकः\nविज्ञानादेवाप्नोति स्वाराज्यमित्युक्तत्वात् श्रौतस्मार्तानां कर्मणामानर्थक्यं प्राप्तमित्येतन्मा प्रापदिति कर्मणां पुरुषार्थं प्रति साधनत्वप्रदर्शनार्थ इहोपन्यासः—\nऋतं च स्वाध्यायप्रवचने च।", "padacchedaText": "", "audioFile": "PB_000394.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000395", "originalText": "सत्यं च स्वाध्यायप्रवचने च।", "padacchedaText": "", "audioFile": "PB_000395.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000396", "originalText": "तपश्च स्वाध्यायप्रवचने च।", "padacchedaText": "", "audioFile": "PB_000396.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000397", "originalText": "दमश्च स्वाध्यायप्रवचने च।", "padacchedaText": "", "audioFile": "PB_000397.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000398", "originalText": "शमश्च स्वाध्यायप्रवचने च।", "padacchedaText": "", "audioFile": "PB_000398.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000399", "originalText": "अग्नयश्य स्वाध्यायप्रवचने च।", "padacchedaText": "", "audioFile": "PB_000399.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000400", "originalText": "अग्निहोत्रं च स्वाध्यायप्रवचने च।", "padacchedaText": "", "audioFile": "PB_000400.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000401", "originalText": "अतिथयश्च स्वाध्यायप्रवचने च।", "padacchedaText": "", "audioFile": "PB_000401.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000402", "originalText": "मानुषं च स्वाध्यायप्रवचने च।", "padacchedaText": "", "audioFile": "PB_000402.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000403", "originalText": "प्रजा च स्वाध्यायप्रवचने च।", "padacchedaText": "", "audioFile": "PB_000403.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000404", "originalText": "प्रजनश्च स्वाध्यायप्रवचने च।", "padacchedaText": "", "audioFile": "PB_000404.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000405", "originalText": "प्रजातिश्च स्वाध्यायप्रवचने च।", "padacchedaText": "", "audioFile": "PB_000405.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000406", "originalText": "सत्यमिति सत्यवचा राथीतरः।", "padacchedaText": "", "audioFile": "PB_000406.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000407", "originalText": "तप इति तपोनित्यः पौरुशिष्टिः।", "padacchedaText": "", "audioFile": "PB_000407.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000408", "originalText": "स्वाध्यायप्रवचने एवेति नाको मौद्गल्यः। तद्धि तपस्तद्धि तपः॥ १॥", "padacchedaText": "", "audioFile": "PB_000408.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000409", "originalText": "ऋतमिति व्याख्यातम्।", "padacchedaText": "", "audioFile": "PB_000409.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000410", "originalText": "स्वाध्यायः अध्ययनम्।", "padacchedaText": "", "audioFile": "PB_000410.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000411", "originalText": "प्रवचनमध्यापनं ब्रह्मयज्ञो वा।", "padacchedaText": "", "audioFile": "PB_000411.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000412", "originalText": "एतानि ऋतादीनि, अनुष्ठेयानि इति वाक्यशेषः।", "padacchedaText": "", "audioFile": "PB_000412.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000413", "originalText": "सत्यं सत्यवचनं यथाव्याख्यातार्थं वा।", "padacchedaText": "", "audioFile": "PB_000413.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000414", "originalText": "तपः कृच्छ्रादि।", "padacchedaText": "", "audioFile": "PB_000414.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000415", "originalText": "दमः बाह्यकरणोपशमः।", "padacchedaText": "", "audioFile": "PB_000415.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000416", "originalText": "शमः अन्तःकरणोपशमः।", "padacchedaText": "", "audioFile": "PB_000416.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000417", "originalText": "अग्नयश्च आधातव्याः।", "padacchedaText": "", "audioFile": "PB_000417.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000418", "originalText": "अग्निहोत्रं च होतव्यम्।", "padacchedaText": "", "audioFile": "PB_000418.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000419", "originalText": "अतिथयश्च पूज्याः।", "padacchedaText": "", "audioFile": "PB_000419.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000420", "originalText": "मानुषमिति लौकिकः संव्यवहारः।", "padacchedaText": "", "audioFile": "PB_000420.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000421", "originalText": "तच्च यथाप्राप्तमनुष्ठेयम्।", "padacchedaText": "", "audioFile": "PB_000421.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000422", "originalText": "प्रजा च उत्पाद्या।", "padacchedaText": "", "audioFile": "PB_000422.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000423", "originalText": "प्रजनश्च प्रजननम्, ऋतौ भार्यागमनमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000423.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000424", "originalText": "प्रजातिः पौत्रोत्पत्तिः, पुत्रो निवेशयितव्य इत्येतत्।", "padacchedaText": "", "audioFile": "PB_000424.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000425", "originalText": "सर्वैरेतैः कर्मभिर्युक्तस्यापि स्वाध्यायप्रवचने यत्नतोऽनुष्ठेये इत्येवमर्थं सर्वेण सह स्वाध्यायप्रवचनग्रहणम्।", "padacchedaText": "", "audioFile": "PB_000425.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000426", "originalText": "स्वाध्यायाधीनं ह्यर्थज्ञानम्।", "padacchedaText": "", "audioFile": "PB_000426.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000427", "originalText": "अर्थज्ञानाधीनं च परं श्रेयः।", "padacchedaText": "", "audioFile": "PB_000427.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000428", "originalText": "प्रवचनं च तदविस्मरणार्थं धर्मवृद्ध्यर्थं च।", "padacchedaText": "", "audioFile": "PB_000428.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000429", "originalText": "ततः स्वाध्यायप्रवचनयोरादरः कार्यः।", "padacchedaText": "", "audioFile": "PB_000429.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000430", "originalText": "सत्यमिति सत्यमेवानुष्ठेयमिति सत्यवचाः सत्यमेव वचो यस्य सोऽयं सत्यवचाः, नाम वा तस्य, राथीतरः रथीतरसगोत्रः राथीतर आचार्यो मन्यते।", "padacchedaText": "", "audioFile": "PB_000430.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000431", "originalText": "तप इति तप एव कर्तव्यमिति तपोनित्यः तपसि नित्यः तपःपरः, तपोनित्य इति वा नाम, पौरुशिष्टिः पुरुशिष्टस्यापत्यं पौरुशिष्टिराचार्यो मन्यते।", "padacchedaText": "", "audioFile": "PB_000431.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000432", "originalText": "स्वाध्यायप्रवचने एव अनुष्ठेये इति नाको नामतः मुद्गलस्यापत्यं मौद्गल्य आचार्यो मन्यते।", "padacchedaText": "", "audioFile": "PB_000432.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000433", "originalText": "तद्धि तपस्तद्धि तपः।", "padacchedaText": "", "audioFile": "PB_000433.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000434", "originalText": "यस्मात्स्वाध्यायप्रवचने एव तपः, तस्मात्ते एवानुष्ठेये इति। उक्तानामपि सत्यतपःस्वाध्यायप्रवचनानां पुनर्ग्रहणमादरार्थम्॥", "padacchedaText": "", "audioFile": "PB_000434.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000435", "originalText": "इति नवमानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000435.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000436", "originalText": "दशमोऽनुवाकः\nअहं वृक्षस्य रेरिवा।", "padacchedaText": "", "audioFile": "PB_000436.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000437", "originalText": "कीर्तिः पृष्ठं गिरेरिव।", "padacchedaText": "", "audioFile": "PB_000437.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000438", "originalText": "ऊर्ध्वपवित्रो वाजिनीव स्वमृतमस्मि।", "padacchedaText": "", "audioFile": "PB_000438.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000439", "originalText": "द्रविणं सवर्चसम्।",
