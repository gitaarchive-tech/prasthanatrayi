 "padacchedaText": "", "audioFile": "PB_000439.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000440", "originalText": "सुमेधा अमृतोक्षितः। इति त्रिशङ्कोर्वेदानुवचनम्॥ १॥", "padacchedaText": "", "audioFile": "PB_000440.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000441", "originalText": "अहं वृक्षस्य रेरिवेति स्वाध्यायार्थो मन्त्राम्नायः।", "padacchedaText": "", "audioFile": "PB_000441.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000442", "originalText": "स्वाध्यायश्च विद्योत्पत्तये, प्रकरणात्।", "padacchedaText": "", "audioFile": "PB_000442.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000443", "originalText": "विद्यार्थं हीदं प्रकरणम्, न च अन्यार्थत्वमवगम्यते।", "padacchedaText": "", "audioFile": "PB_000443.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000444", "originalText": "स्वाध्यायेन च विशुद्धसत्त्वस्य विद्योत्पत्तिरवकल्पते।", "padacchedaText": "", "audioFile": "PB_000444.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000445", "originalText": "अहं वृक्षस्य उच्छेद्यात्मकस्य संसारवृक्षस्य रेरिवा प्रेरयिता अन्तर्याम्यात्मना।", "padacchedaText": "", "audioFile": "PB_000445.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000446", "originalText": "कीर्तिः ख्यातिः गिरेः पृष्ठमिव उच्छ्रिता मम।", "padacchedaText": "", "audioFile": "PB_000446.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000447", "originalText": "ऊर्ध्वपवित्रः ऊर्ध्वं कारणं पवित्रं पावनं ज्ञानप्रकाश्यं परं ब्रह्म यस्य सर्वात्मनो मम, सोऽहमूर्ध्वपवित्रः, वाजिनि इव वाजवतीव, वाजमन्नम्, तद्वति सवितरीवेत्यर्थः, यथा सवितरि अमृतमात्मतत्त्वं विशुद्धं प्रसिद्धं श्रुतिस्मृतिशतेभ्यः, एवं सु अमृतं शोभनं विशुद्धमात्मतत्त्वम् अस्मि भवामि।", "padacchedaText": "", "audioFile": "PB_000447.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000448", "originalText": "द्रविणं धनं सवर्चसं दीप्तिमत् तदेव आत्मतत्त्वम्, अस्मीत्यनुवर्तते।", "padacchedaText": "", "audioFile": "PB_000448.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000449", "originalText": "ब्रह्मज्ञानं वा आत्मतत्त्वप्रकाशकत्वात्सवर्चसम्, द्रविणमिव द्रविणम्, मोक्षसुखहेतुत्वात्।", "padacchedaText": "", "audioFile": "PB_000449.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000450", "originalText": "अस्मिन्पक्षे प्राप्तं मयेत्यध्याहारः कर्तव्यः।", "padacchedaText": "", "audioFile": "PB_000450.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000451", "originalText": "सुमेधाः शोभना मेधा सर्वज्ञत्वलक्षणा यस्य मम, सोऽहं सुमेधाः, संसारस्थित्युत्पत्तिसंहारकौशलयोगात्सुमेधस्त्वम्, अत एव अमृतः अमरणधर्मा, अक्षितः अक्षीणः अव्ययः अक्षतो वा, अमृतेन वा उक्षितः सिक्तः ‘अमृतोक्षितोऽहम्’ इत्यादि ब्राह्मणम्।", "padacchedaText": "", "audioFile": "PB_000451.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000452", "originalText": "इति एवं त्रिशङ्कोः ऋषेः ब्रह्मभूतस्य ब्रह्मविदः वेदानुवचनम्, वेदः वेदनम् आत्मैकत्वविज्ञानम्, तस्य प्राप्तिमनु वचनं वेदानुवचनम्, आत्मनः कृतकृत्यताप्रख्यापनार्थं वामदेववत्त्रिशङ्कुना आर्षेण दर्शनेन दृष्टो मन्त्राम्नाय आत्मविद्याप्रकाशक इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000452.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000453", "originalText": "अस्य च जपो विद्योत्पत्त्यर्थोऽधिगम्यते।", "padacchedaText": "", "audioFile": "PB_000453.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000454", "originalText": "‘ऋतं च’ इति धर्मोपन्यासादनन्तरं च वेदानुवचनपाठादेतदवगम्यते। एवं श्रौतस्मार्तेषु नित्येषु कर्मसु युक्तस्य निष्कामस्य परं ब्रह्म विविदिषोरार्षाणि दर्शनानि प्रादुर्भवन्त्यात्मादिविषयाणीति॥", "padacchedaText": "", "audioFile": "PB_000454.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000455", "originalText": "इति दशमानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000455.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000456", "originalText": "एकादशोऽनुवाकः\nवेदमनूच्याचार्योऽन्तेवासिनमनुशास्ति।", "padacchedaText": "", "audioFile": "PB_000456.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000457", "originalText": "सत्यं वद।", "padacchedaText": "", "audioFile": "PB_000457.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000458", "originalText": "धर्मं चर।", "padacchedaText": "", "audioFile": "PB_000458.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000459", "originalText": "स्वाध्यायान्मा प्रमदः।", "padacchedaText": "", "audioFile": "PB_000459.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000460", "originalText": "आचार्याय प्रियं धनमाहृत्य प्रजातन्तुं मा व्यवच्छेत्सीः।", "padacchedaText": "", "audioFile": "PB_000460.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000461", "originalText": "सत्यान्न प्रमदितव्यम्।", "padacchedaText": "", "audioFile": "PB_000461.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000462", "originalText": "धर्मान्न प्रमदितव्यम्।", "padacchedaText": "", "audioFile": "PB_000462.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000463", "originalText": "कुशलान्न प्रमदितव्यम्।", "padacchedaText": "", "audioFile": "PB_000463.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000464", "originalText": "भूत्यै न प्रमदितव्यम्। स्वाध्यायप्रवचनाभ्यां न प्रमदितव्यम्॥ १॥", "padacchedaText": "", "audioFile": "PB_000464.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000465", "originalText": "देवपितृकार्याभ्यां न प्रमदितव्यम्।", "padacchedaText": "", "audioFile": "PB_000465.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000466", "originalText": "मातृदेवो भव।", "padacchedaText": "", "audioFile": "PB_000466.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000467", "originalText": "पितृदेवो भव।", "padacchedaText": "", "audioFile": "PB_000467.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000468", "originalText": "आचार्यदेवो भव।", "padacchedaText": "", "audioFile": "PB_000468.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000469", "originalText": "अतिथिदेवो भव।", "padacchedaText": "", "audioFile": "PB_000469.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000470", "originalText": "यान्यनवद्यानि कर्माणि।", "padacchedaText": "", "audioFile": "PB_000470.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000471", "originalText": "तानि सेवितव्यानि।", "padacchedaText": "", "audioFile": "PB_000471.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000472", "originalText": "नो इतराणि।", "padacchedaText": "", "audioFile": "PB_000472.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000473", "originalText": "यान्यस्माकं सुचरितानि। तानि त्वयोपास्यानि॥ २॥", "padacchedaText": "", "audioFile": "PB_000473.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000474", "originalText": "नो इतराणि।", "padacchedaText": "", "audioFile": "PB_000474.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000475", "originalText": "ये के चास्मच्छ्रेयांसो ब्राह्मणाः।", "padacchedaText": "", "audioFile": "PB_000475.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000476", "originalText": "तेषां त्वयासनेन प्रश्वसितव्यम्।", "padacchedaText": "", "audioFile": "PB_000476.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000477", "originalText": "श्रद्धया देयम्।", "padacchedaText": "", "audioFile": "PB_000477.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000478", "originalText": "अश्रद्धयादेयम्।", "padacchedaText": "", "audioFile": "PB_000478.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000479", "originalText": "श्रिया देयम्।", "padacchedaText": "", "audioFile": "PB_000479.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000480", "originalText": "ह्रिया देयम्।", "padacchedaText": "", "audioFile": "PB_000480.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000481", "originalText": "भिया देयम्।", "padacchedaText": "", "audioFile": "PB_000481.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000482", "originalText": "संविदा देयम्। अथ यदि ते कर्मविचिकित्सा वा वृत्तविचिकित्सा वा स्यात्॥ ३॥", "padacchedaText": "", "audioFile": "PB_000482.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000483", "originalText": "ये तत्र ब्राह्मणाः संमर्शिनः।", "padacchedaText": "", "audioFile": "PB_000483.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000484", "originalText": "युक्ता आयुक्ताः।", "padacchedaText": "", "audioFile": "PB_000484.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000485", "originalText": "अलूक्षा धर्मकामाः स्युः।", "padacchedaText": "", "audioFile": "PB_000485.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000486", "originalText": "यथा ते तत्र वर्तेरन्।", "padacchedaText": "", "audioFile": "PB_000486.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000487", "originalText": "तथा तत्र वर्तेथाः।", "padacchedaText": "", "audioFile": "PB_000487.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000488", "originalText": "अथाभ्याख्यातेषु।", "padacchedaText": "", "audioFile": "PB_000488.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000489", "originalText": "ये तत्र ब्राह्मणाः संमर्शिनः।", "padacchedaText": "", "audioFile": "PB_000489.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000490", "originalText": "युक्ता आयुक्ताः।", "padacchedaText": "", "audioFile": "PB_000490.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000491", "originalText": "अलूक्षा धर्मकामाः स्युः।", "padacchedaText": "", "audioFile": "PB_000491.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000492", "originalText": "यथा ते तेषु वर्तेरन्।", "padacchedaText": "", "audioFile": "PB_000492.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000493", "originalText": "तथा तेषु वर्तेथाः।", "padacchedaText": "", "audioFile": "PB_000493.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000494", "originalText": "एष आदेशः।", "padacchedaText": "", "audioFile": "PB_000494.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000495", "originalText": "एष उपदेशः।", "padacchedaText": "", "audioFile": "PB_000495.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000496", "originalText": "एषा वेदोपनिषत्।", "padacchedaText": "", "audioFile": "PB_000496.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000497", "originalText": "एतदनुशासनम्।", "padacchedaText": "", "audioFile": "PB_000497.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000498", "originalText": "एवमुपासितव्यम्। एवमु चैतदुपास्यम्॥ ४॥", "padacchedaText": "", "audioFile": "PB_000498.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000499", "originalText": "वेदमनूच्येत्येवमादिकर्तव्यतोपदेशारम्भः प्राग्ब्रह्मात्मविज्ञानान्नियमेन कर्तव्यानि श्रौतस्मार्तानि कर्माणीत्येवमर्थः, अनुशासनश्रुतेः पुरुषसंस्कारार्थत्वात्।", "padacchedaText": "", "audioFile": "PB_000499.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000500", "originalText": "संस्कृतस्य हि विशुद्धसत्त्वस्य आत्मज्ञानमञ्जसैवोपजायते।", "padacchedaText": "", "audioFile": "PB_000500.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000501", "originalText": "‘तपसा कल्मषं हन्ति विद्ययामृतमश्नुते’ (मनु.१२.१०४) इति हि स्मृतिः।", "padacchedaText": "", "audioFile": "PB_000501.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000502", "originalText": "वक्ष्यति च— ‘तपसा ब्रह्म विजिज्ञासस्व’ (तै.३.२.१) इति।", "padacchedaText": "", "audioFile": "PB_000502.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000503", "originalText": "अतो विद्योत्पत्त्यर्थमनुष्ठेयानि कर्माणि।", "padacchedaText": "", "audioFile": "PB_000503.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000504", "originalText": "अनुशास्तीत्यनुशासनशब्दादनुशासनातिक्रमे हि दोषोत्पत्तिः।", "padacchedaText": "", "audioFile": "PB_000504.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000505", "originalText": "प्रागुपन्यासाच्च कर्मणाम्, केवलब्रह्मविद्यारम्भाच्च पूर्वं कर्माण्युपन्यस्तानि।", "padacchedaText": "", "audioFile": "PB_000505.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000506", "originalText": "उदितायां च ब्रह्मविद्यायाम् ‘अभयं प्रतिष्ठां विन्दते’ (तै.२.७.१) ‘न बिभेति कुतश्चन’ (तै.२.९.१) ‘किमहं साधु नाकरवम्’ (तै.२.९.१) इत्यादिना कर्मनैष्किञ्चन्यं दर्शयिष्यति।", "padacchedaText": "", "audioFile": "PB_000506.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000507", "originalText": "अतः अवगम्यते— पूर्वोपचितदुरितक्षयद्वारेण विद्योत्पत्त्यर्थानि कर्माणीति।", "padacchedaText": "", "audioFile": "PB_000507.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000508", "originalText": "मन्त्रवर्णाच्च— ‘अविद्यया मृत्युं तीर्त्वा विद्ययामृतमश्नुते’ (ई.११) इति ऋतादीनां पूर्वत्रोपदेशः आनर्थक्यपरिहारार्थः, इह तु ज्ञानोत्पत्त्यर्थत्वात्कर्तव्यतानियमार्थः।", "padacchedaText": "", "audioFile": "PB_000508.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000509", "originalText": "वेदम् अनूच्य अध्याप्य आचार्यः अन्तेवासिनं शिष्यम् अनुशास्ति ग्रन्थग्रहणात् अनु पश्चात् शास्ति तदर्थं ग्राहयतीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000509.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000510", "originalText": "अतोऽवगम्यते अधीतवेदस्य धर्मजिज्ञासामकृत्वा गुरुकुलान्न समावर्तितव्यमिति।", "padacchedaText": "", "audioFile": "PB_000510.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000511", "originalText": "‘बुद्ध्वा कर्माणि कुर्वीत’ इति स्मृतेश्च।", "padacchedaText": "", "audioFile": "PB_000511.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000512", "originalText": "कथमनुशास्तीत्यत आह— सत्यं वद यथाप्रमाणावगतं वक्तव्यं च वद।", "padacchedaText": "", "audioFile": "PB_000512.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000513", "originalText": "तद्वत् धर्मं चर, धर्म इत्यनुष्ठेयानां सामान्यवचनम्, सत्यादिविशेषनिर्देशात्।", "padacchedaText": "", "audioFile": "PB_000513.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000514", "originalText": "स्वाध्यायात् अध्ययनात् मा प्रमदः प्रमादं मा कार्षीः।", "padacchedaText": "", "audioFile": "PB_000514.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000515", "originalText": "आचार्याय आचार्यार्थं प्रियम् इष्टं धनम् आहृत्य आनीय दत्त्वा विद्यानिष्क्रयार्थम् आचार्येण च अनुज्ञातः अनुरूपान्दारानाहृत्य प्रजातन्तुं प्रजासन्तानं मा व्यवच्छेत्सीः, प्रजासन्ततेर्विच्छित्तिर्न कर्तव्या, अनुत्पद्यमानेऽपि पुत्रे पुत्रकाम्यादिकर्मणा तदुत्पत्तौ यत्नः कर्तव्य इत्यभिप्रायः, प्रजाप्रजनप्रजातित्रयनिर्देशसामर्थ्यात्, अन्यथा प्रजनश्चेत्येतदेकमेवावक्ष्यत्।", "padacchedaText": "", "audioFile": "PB_000515.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000516", "originalText": "सत्यात् न प्रमदितव्यं प्रमादो न कर्तव्यः, सत्याच्च प्रमदनमनृतप्रसङ्गः, प्रमादशब्दसामर्थ्याद्विस्मृत्याप्यनृतं न वक्तव्यमित्यर्थः, अन्यथा असत्यवदनप्रतिषेध एव स्यात्।", "padacchedaText": "", "audioFile": "PB_000516.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000517", "originalText": "धर्मात् न प्रमदितव्यम्, धर्मशब्दस्यानुष्ठेयविशेषविषयत्वादननुष्ठानं प्रमादः, स न कर्तव्यः, अनुष्ठातव्य एव धर्म इति यावत्।", "padacchedaText": "", "audioFile": "PB_000517.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000518", "originalText": "एवं कुशलात् आत्मरक्षार्थात्कर्मणः न प्रमदितव्यम्।", "padacchedaText": "", "audioFile": "PB_000518.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000519", "originalText": "भूतिः विभूतिः, तस्यै भूत्यै भूत्यर्थान्मङ्गलयुक्तात्कर्मणः न प्रमदितव्यम्।", "padacchedaText": "", "audioFile": "PB_000519.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000520", "originalText": "स्वाध्यायप्रवचनाभ्यां न प्रमदितव्यम्, ते हि नियमेन कर्तव्ये इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000520.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000521", "originalText": "तथा देवपितृकार्याभ्यां न प्रमदितव्यम्, दैवपित्र्ये कर्मणी कर्तव्ये।", "padacchedaText": "", "audioFile": "PB_000521.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000522", "originalText": "मातृदेवः माता देवो यस्य सः, त्वं मातृदेवः भव स्याः।", "padacchedaText": "", "audioFile": "PB_000522.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000523", "originalText": "एवं पितृदेवो भव, आचार्यदेवो भव, अतिथिदेवो भव, देवतावदुपास्या एते इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000523.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000524", "originalText": "यान्यपि च अन्यानि अनवद्यानि अनिन्दितानि शिष्टाचारलक्षणानि कर्माणि, तानि सेवितव्यानि कर्तव्यानि त्वया।", "padacchedaText": "", "audioFile": "PB_000524.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000525", "originalText": "नो न कर्तव्यानि इतराणि सावद्यानि शिष्टकृतान्यपि।", "padacchedaText": "", "audioFile": "PB_000525.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000526", "originalText": "यानि अस्माकम् आचार्याणां सुचरितानि शोभनचरितानि आम्नायाद्यविरुद्धानि, तान्येव त्वया उपास्यानि अदृष्टार्थान्यनुष्ठेयानि, नियमेन कर्तव्यानीत्येतत्।", "padacchedaText": "", "audioFile": "PB_000526.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000527", "originalText": "नो इतराणि विपरीतान्याचार्यकृतान्यपि।", "padacchedaText": "", "audioFile": "PB_000527.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000528", "originalText": "ये के च विशेषिता आचार्यत्वादिधर्मैः अस्मत् अस्मत्तः श्रेयांसः प्रशस्ततराः, ते च ब्राह्मणाः, न क्षत्रियादयः, तेषाम् आसनेन आसनदानादिना त्वया प्रश्वसितव्यम्, प्रश्वसनं प्रश्वासः श्रमापनयः, तेषां श्रमस्त्वया अपनेतव्य इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000528.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000529", "originalText": "तेषां वा आसने गोष्ठीनिमित्ते समुदिते, तेषु न प्रश्वसितव्यं प्रश्वासोऽपि न कर्तव्यः, केवलं तदुक्तसारग्राहिणा भवितव्यम्।", "padacchedaText": "", "audioFile": "PB_000529.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000530", "originalText": "किं च, यत्किञ्चिद्देयम्, तत् श्रद्धयैव दातव्यम्।", "padacchedaText": "", "audioFile": "PB_000530.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000531", "originalText": "अश्रद्धया अदेयं न दातव्यम्।", "padacchedaText": "", "audioFile": "PB_000531.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000532", "originalText": "श्रिया विभूत्या देयं दातव्यम्।", "padacchedaText": "", "audioFile": "PB_000532.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000533", "originalText": "ह्रिया लज्जया च देयम्।", "padacchedaText": "", "audioFile": "PB_000533.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000534", "originalText": "भिया भीत्या च देयम्।", "padacchedaText": "", "audioFile": "PB_000534.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000535", "originalText": "संविदा च मैत्र्य्यादिकार्येण देयम्।", "padacchedaText": "", "audioFile": "PB_000535.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000536", "originalText": "अथ एवं वर्तमानस्य यदि कदाचित् ते तव श्रौते स्मार्ते वा कर्मणि वृत्ते वा आचारलक्षणे विचिकित्सा संशयः स्यात् भवेत्, ये तत्र तस्मिन्देशे काले वा ब्राह्मणाः तत्र कर्मादौ युक्ता इति व्यवहितेन सम्बन्धः कर्तव्यः, संमर्शिनः विचारक्षमाः, युक्ताः अभियुक्ताः, कर्मणि वृत्ते वा आयुक्ताः अपरप्रयुक्ताः, अलूक्षाः अरूक्षाः अक्रूरमतयः, धर्मकामाः अदृष्टार्थिनः अकामहता इत्येतत्, स्युः भवेयुः, ते ब्राह्मणाः यथा येन प्रकारेण तत्र तस्मिन्कर्मणि वृत्ते वा वर्तेरन्, तथा त्वमपि वर्तेथाः।", "padacchedaText": "", "audioFile": "PB_000536.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000537", "originalText": "अथ अभ्याख्यातेषु, अभ्याख्याता अभ्युक्ताः दोषेण सन्दिह्यमानेन संयोजिताः केनचित्, तेषु च, यथोक्तं सर्वमुपनयेत्— ये तत्रेत्यादि।", "padacchedaText": "", "audioFile": "PB_000537.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000538", "originalText": "एषः आदेशः विधिः।", "padacchedaText": "", "audioFile": "PB_000538.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000539", "originalText": "एषः उपदेशः पुत्रादिभ्यः पित्रादीनामपि।", "padacchedaText": "", "audioFile": "PB_000539.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000540", "originalText": "एषा वेदोपनिषत् वेदरहस्यम्, वेदार्थ इत्येतत्।", "padacchedaText": "", "audioFile": "PB_000540.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000541", "originalText": "एतदेव अनुशासनम् ईश्वरवचनम्, आदेशवाच्यस्य विधेरुक्तत्वात्।", "padacchedaText": "", "audioFile": "PB_000541.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000542", "originalText": "सर्वेषां वा प्रमाणभूतानामनुशासनमेतत्।", "padacchedaText": "", "audioFile": "PB_000542.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000543", "originalText": "यस्मादेवम्, तस्मात् एवं यथोक्तं सर्वम् उपासितव्यं कर्तव्यम्। एवमु च एतत् उपास्यम् उपास्यमेव चैतत् नानुपास्यम् इत्यादरार्थं पुनर्वचनम्॥", "padacchedaText": "", "audioFile": "PB_000543.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000544", "originalText": "अत्रैतच्चिन्त्यते विद्याकर्मणोर्विवेकार्थम्— किं कर्मभ्य एव केवलेभ्यः परं श्रेयः, उत विद्यासंव्यपेक्षेभ्यः, आहोस्विद्विद्याकर्मभ्यां संहताभ्याम्, विद्याया वा कर्मापेक्षायाः, उत केवलाया एव विद्याया इति।", "padacchedaText": "", "audioFile": "PB_000544.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000545", "originalText": "तत्र केवलेभ्य एव कर्मभ्यः स्यात्, समस्तवेदार्थज्ञानवतः कर्माधिकारात् ‘वेदः कृत्स्नोऽधिगन्तव्यः सरहस्यो द्विजन्मना’ इति स्मरणात्।", "padacchedaText": "", "audioFile": "PB_000545.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000546", "originalText": "अधिगमश्च सहोपनिषदर्थेनात्मज्ञानादिना।", "padacchedaText": "", "audioFile": "PB_000546.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000547", "originalText": "‘विद्वान्यजते’ ‘विद्वान्याजयति’ इति च विदुष एव कर्मण्यधिकारः प्रदर्श्यते सर्वत्र ज्ञात्वानुष्ठानमिति च।", "padacchedaText": "", "audioFile": "PB_000547.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000548", "originalText": "कृत्स्नश्च वेदः कर्मार्थ इति हि मन्यन्ते केचित्।", "padacchedaText": "", "audioFile": "PB_000548.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000549", "originalText": "कर्मभ्यश्चेत्परं श्रेयो नावाप्यते, वेदोऽनर्थकः स्यात्।", "padacchedaText": "", "audioFile": "PB_000549.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000550", "originalText": "न, नित्यत्वान्मोक्षस्य।", "padacchedaText": "", "audioFile": "PB_000550.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000551", "originalText": "नित्यो हि मोक्ष इष्यते।", "padacchedaText": "", "audioFile": "PB_000551.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000552", "originalText": "कर्मकार्यस्य चानित्यत्वं प्रसिद्धं लोके।", "padacchedaText": "", "audioFile": "PB_000552.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000553", "originalText": "कर्मभ्यश्चेच्छ्रेयोऽनित्यं स्यात्, तच्चानिष्टम्।", "padacchedaText": "", "audioFile": "PB_000553.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000554", "originalText": "ननु काम्यप्रतिषिद्धयोरनारम्भात् आरब्धस्य च कर्मण उपभोगेनैव क्षयात् नित्यानुष्ठानाच्च प्रत्यवायानुपपत्तेः ज्ञाननिरपेक्ष एव मोक्ष इति चेत्, तच्च न, कर्मशेषसम्भवात् तन्निमित्ता शरीरान्तरोत्पत्तिः प्राप्नोतीति प्रत्युक्तम्, कर्मशेषस्य च नित्यानुष्ठानेनाविरोधात्क्षयानुपपत्तिरिति च।", "padacchedaText": "", "audioFile": "PB_000554.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000555", "originalText": "यदुक्तं समस्तवेदार्थज्ञानवतः कर्माधिकारादित्यादि, तच्च न, श्रुतज्ञानव्यतिरेकादुपासनस्य।", "padacchedaText": "", "audioFile": "PB_000555.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000556", "originalText": "श्रुतज्ञानमात्रेण हि कर्मण्यधिक्रियते, नोपासनज्ञानमपेक्षते।", "padacchedaText": "", "audioFile": "PB_000556.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000557", "originalText": "उपासनं च श्रुतज्ञानादर्थान्तरं विधीयते मोक्षफलम्, अर्थान्तरप्रसिद्धेश्च स्यात्, ‘श्रोतव्यः’ इत्युक्त्वा तद्व्यतिरेकेण ‘मन्तव्यो निदिध्यासितव्यः’ इति यत्नान्तरविधानात् मनननिदिध्यासनयोश्च प्रसिद्धं श्रवणज्ञानादर्थान्तरत्वम्।", "padacchedaText": "", "audioFile": "PB_000557.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000558", "originalText": "एवं तर्हि विद्यासंव्यपेक्षेभ्यः कर्मभ्यः स्यान्मोक्षः, विद्यासहितानां च कर्मणां भवेत्कार्यान्तरारम्भसामर्थ्यम्, यथा स्वतो मरणज्वरादिकार्यारम्भसमर्थानामपि विषदध्यादीनां मन्त्रसशर्करादिसंयुक्तानां कार्यान्तरारम्भसामर्थ्यम्, एवं विद्याहितैः कर्मभिः मोक्ष आरभ्यत इति चेत्, न, आरभ्यस्यानित्यत्वादित्युक्तो दोषः।", "padacchedaText": "", "audioFile": "PB_000558.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000559", "originalText": "वचनादारभ्योऽपि नित्य एवेति चेत्, न, ज्ञापकत्वाद्वचनस्य।", "padacchedaText": "", "audioFile": "PB_000559.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000560", "originalText": "वचनं नाम यथाभूतस्यार्थस्य ज्ञापकम्, नाविद्यमानस्य कर्तृ।", "padacchedaText": "", "audioFile": "PB_000560.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000561", "originalText": "न हि वचनशतेनापि नित्यमारभ्यते, आरब्धं वा अविनाशि भवेत्। एतेन विद्याकर्मणोः संहतयोर्मोक्षारम्भकत्वं प्रत्युक्तम्॥", "padacchedaText": "", "audioFile": "PB_000561.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000562", "originalText": "विद्याकर्मणी मोक्षप्रतिबन्धहेतुनिवर्तके इति चेत्, न, कर्मणः फलान्तरदर्शनात्।", "padacchedaText": "", "audioFile": "PB_000562.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000563", "originalText": "उत्पत्तिविकारसंस्काराप्तयो हि फलं कर्मणो दृश्यन्ते।", "padacchedaText": "", "audioFile": "PB_000563.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000564", "originalText": "उत्पत्त्यादिफलविपरीतश्च मोक्षः।", "padacchedaText": "", "audioFile": "PB_000564.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000565", "originalText": "गतिश्रुतेराप्य इति चेत्— ‘सूर्यद्वारेण’ ‘तयोर्ध्वमायन्’ (क.२.३.१६) इत्येवमादिगतिश्रुतिभ्यः प्राप्यो मोक्ष इति चेत्, न, सर्वगतत्वात् गन्तृभ्यश्चानन्यत्वात्।", "padacchedaText": "", "audioFile": "PB_000565.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000566", "originalText": "आकाशादिकारणत्वात्सर्वगतं ब्रह्म, ब्रह्माव्यतिरिक्ताश्च सर्वे विज्ञानात्मानः, अतो नाप्यो मोक्षः।", "padacchedaText": "", "audioFile": "PB_000566.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000567", "originalText": "गन्तुरन्यद्विभिन्नदेशं च भवति गन्तव्यम्।", "padacchedaText": "", "audioFile": "PB_000567.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000568", "originalText": "न हि, येनैवाव्यतिरिक्तं यत्, तत्तेनैव गम्यते।", "padacchedaText": "", "audioFile": "PB_000568.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000569", "originalText": "तदनन्यत्वसिद्धिश्च ‘तत्सृष्ट्वा तदेवानुप्राविशत्’ (तै.२.६.१) ‘क्षेत्रज्ञं चापि मां विद्धि सर्वक्षेत्रेषु’ (भ.गी.१३.२) इत्येवमादिश्रुतिस्मृतिशतेभ्यः।", "padacchedaText": "", "audioFile": "PB_000569.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000570", "originalText": "गत्यैश्वर्यादिश्रुतिविरोध इति चेत्— अथापि स्यात् यद्यप्राप्यो मोक्षः, तदा गतिश्रुतीनाम् ‘स एकधा’ (छा.७.२६.२) ‘स यदि पितृलोककामः भवति’ (छा.८.२.१) ‘स्त्रीभिर्वा यानैर्वा’ (छा.८.१२.३) इत्यादिश्रुतीनां च कोपः स्यात् इति चेत्, न, कार्यब्रह्मविषयत्वात्तासाम्।", "padacchedaText": "", "audioFile": "PB_000570.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000571", "originalText": "कार्ये हि ब्रह्मणि स्त्र्यादयः स्युः, न कारणे, ‘एकमेवाद्वितीयम्’ (छा.६.२.१) ‘यत्र नान्यत्पश्यति’ (छा.७.२४.१) ‘तत्केन कं पश्येत्’ (बृ.२.४.१४)(बृ.४.५.१५) इत्यादिश्रुतिभ्यः।", "padacchedaText": "", "audioFile": "PB_000571.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000572", "originalText": "विरोधाच्च विद्याकर्मणोः समुच्चयानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_000572.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000573", "originalText": "प्रलीनकर्त्रादिकारकविशेषतत्त्वविषया हि विद्या तद्विपरीतकारकसाध्येन कर्मणा विरुध्यते।", "padacchedaText": "", "audioFile": "PB_000573.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000574", "originalText": "न ह्येकं वस्तु परमार्थतः कर्त्रादिविशेषवत् तच्छून्यं चेति उभयथा द्रष्टुं शक्यते।", "padacchedaText": "", "audioFile": "PB_000574.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000575", "originalText": "अवश्यं ह्यन्तरन्मिथ्या स्यात्।", "padacchedaText": "", "audioFile": "PB_000575.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000576", "originalText": "अन्यतरस्य च मिथ्यात्वप्रसङ्गे युक्तं यत्स्वाभाविकाज्ञानविषयस्य द्वैतस्य मिथ्यात्वम्, ‘यत्र हि द्वैतमिव भवति’ (बृ.२.४.१४) ‘मृत्योः स मृत्युमाप्नोति’ (क.२.१.१०)(बृ.४.४.१९) ‘अथ यत्रान्यत्पश्यति तदल्पम्’ (छा.७.२४.१) ‘अन्योऽसावन्योऽहमस्मि’ (बृ.१.४.१०) ‘उदरमन्तरं कुरुते’ ‘अथ तस्य भयं भवति’ (तै.२.७.१) इत्यादिश्रुतिशतेभ्यः।", "padacchedaText": "", "audioFile": "PB_000576.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000577", "originalText": "सत्यत्वं च एकत्वस्य ‘एकधैवानुद्रष्टव्यम्’ (बृ.४.४.२०) ‘एकमेवाद्वितीयम्’ (छा.६.२.१) ‘ब्रह्मैवेदं सर्वम्’ ‘आत्मैवेदं सर्वम्’ (छा.७.२५.२) इत्यादिश्रुतिभ्यः।", "padacchedaText": "", "audioFile": "PB_000577.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000578", "originalText": "न च सम्प्रदानादिकारकभेदादर्शने कर्मोपपद्यते।", "padacchedaText": "", "audioFile": "PB_000578.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000579", "originalText": "अन्यत्वदर्शनापवादाश्च विद्याविषये सहस्रशः श्रूयन्ते।", "padacchedaText": "", "audioFile": "PB_000579.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000580", "originalText": "अतो विरोधो विद्याकर्मणोः। अतश्च समुच्चयानुपपत्तिः॥", "padacchedaText": "", "audioFile": "PB_000580.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000581", "originalText": "तत्र यदुक्तं संहताभ्यां विद्याकर्मभ्यां मोक्ष इत्येतदनुपपन्नमिति, तदयुक्तम्, तद्विहितत्वात्कर्मणां श्रुतिविरोध इति चेत्— यद्युपमृद्य कर्त्रादिकारकविशेषमात्मैकत्वविज्ञानं विधीयते सर्पादिभ्रान्तिज्ञानोपमर्दकरज्ज्वादिविषयविज्ञानवत्, प्राप्तः कर्मविधिश्रुतीनां निर्विषयत्वाद्विरोधः।", "padacchedaText": "", "audioFile": "PB_000581.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000582", "originalText": "विहितानि च कर्माणि।", "padacchedaText": "", "audioFile": "PB_000582.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000583", "originalText": "स च विरोधो न युक्तः, प्रमाणत्वाच्छ्रुतीनामिति चेत्, न, पुरुषार्थोपदेशपरत्वाच्छ्रुतीनाम्।", "padacchedaText": "", "audioFile": "PB_000583.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000584", "originalText": "विद्योपदेशपरा तावच्छ्रुतिः संसारात्पुरुषो मोक्षयितव्य इति संसारहेतोरविद्यायाः विद्यया निवृत्तिः कर्तव्येति विद्याप्रकाशकत्वेन प्रवृत्तेति न विरोधः।", "padacchedaText": "", "audioFile": "PB_000584.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000585", "originalText": "एवमपि कर्त्रादिकारकसद्भावप्रतिपादनपरं शास्त्रं विरुध्यत एवेति चेत्, न, यथाप्राप्तमेव कारकास्तित्वमुपादाय उपात्तदुरितक्षयार्थं कर्माणि विदधच्छास्त्रं मुमुक्षूणां फलार्थिनां च फलसाधनं न कारकास्तित्वे व्याप्रियते।", "padacchedaText": "", "audioFile": "PB_000585.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000586", "originalText": "उपचितदुरितप्रतिबन्धस्य हि विद्योत्पत्तिर्नावकल्पते।", "padacchedaText": "", "audioFile": "PB_000586.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000587", "originalText": "तत्क्षये च विद्योत्पत्तिः स्यात्, ततश्चाविद्यानिवृत्तिः, तत आत्यन्तिकः संसारोपरमः।", "padacchedaText": "", "audioFile": "PB_000587.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000588", "originalText": "अपि च, अनात्मदर्शिनो ह्यनात्मविषयः कामः, कामयमानश्च करोति कर्माणि, ततस्तत्फलोपभोगाय शरीराद्युपादानलक्षणः संसारः।", "padacchedaText": "", "audioFile": "PB_000588.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000589", "originalText": "तद्व्यतिरेकेणात्मैकत्वदर्शिनो विषयाभावात्कामानुपपत्तिः, आत्मनि चानन्यत्वात्कामानुपपत्तौ स्वात्मन्यवस्थानं मोक्ष इति अतोऽपि विद्याकर्मणोर्विरोधः।", "padacchedaText": "", "audioFile": "PB_000589.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000590", "originalText": "विरोधादेव च विद्या मोक्षं प्रति न कर्माण्यपेक्षते।", "padacchedaText": "", "audioFile": "PB_000590.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000591", "originalText": "स्वात्मलाभे तु पूर्वोपचितदुरितप्रतिबन्धापनयनद्वारेण विद्याहेतुत्वं प्रतिपद्यन्ते कर्माणि नित्यानीति।", "padacchedaText": "", "audioFile": "PB_000591.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000592", "originalText": "अत एवास्मिन्प्रकरणे उपन्यस्तानि कर्माणीत्यवोचाम।", "padacchedaText": "", "audioFile": "PB_000592.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000593", "originalText": "एवं च अविरोधः कर्मविधिश्रुतीनाम्। अतः केवलाया एव विद्यायाः परं श्रेय इति सिद्धम्॥", "padacchedaText": "", "audioFile": "PB_000593.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000594", "originalText": "एवं तर्हि आश्रमान्तरानुपपत्तिः, कर्मनिमित्तत्वाद्विद्योत्पत्तेः।", "padacchedaText": "", "audioFile": "PB_000594.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000595", "originalText": "गृहस्थस्यैव विहितानि कर्माणीत्यैकाश्रम्यमेव।", "padacchedaText": "", "audioFile": "PB_000595.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000596", "originalText": "अतश्च यावज्जीवादिश्रुतयः अनुकूलतराः स्युः।", "padacchedaText": "", "audioFile": "PB_000596.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000597", "originalText": "न, कर्मानेकत्वात्।", "padacchedaText": "", "audioFile": "PB_000597.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000598", "originalText": "न ह्यग्निहोत्रादीन्येव कर्माणि, ब्रह्मचर्यं तपः सत्यवचनं शमः दमः अहिंसा इत्येवमादीन्यपि कर्माणि इतराश्रमप्रसिद्धानि विद्योत्पत्तौ साधकतमान्यसङ्कीर्णा विद्यन्ते ध्यानधारणादिलक्षणानि च।", "padacchedaText": "", "audioFile": "PB_000598.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000599", "originalText": "वक्ष्यति च— ‘तपसा ब्रह्म विजिज्ञासस्व’ (तै.३.२.१) इति।", "padacchedaText": "", "audioFile": "PB_000599.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000600", "originalText": "जन्मान्तरकृतकर्मभ्यश्च प्रागपि गार्हस्थ्याद्विद्योत्पत्तिसम्भवात्, कर्मार्थत्वाच्च गार्हस्थ्यप्रतिपत्तेः, कर्मसाध्यायां च विद्यायां सत्यां गार्हस्थ्यप्रतिपत्तिरनर्थिकैव।", "padacchedaText": "", "audioFile": "PB_000600.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000601", "originalText": "लोकार्थत्वाच्च पुत्रादीनाम्।", "padacchedaText": "", "audioFile": "PB_000601.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000602", "originalText": "पुत्रादिसाध्येभ्यश्च अयं लोकः पितृलोको देवलोक इत्येतेभ्यो व्यावृत्तकामस्य, नित्यसिद्धात्मदर्शिनः, कर्मणि प्रयोजनमपश्यतः, कथं प्रवृत्तिरुपपद्यते? प्रतिपन्नगार्हस्थ्यस्यापि विद्योत्पत्तौ विद्यापरिपाकाद्विरक्तस्य कर्मसु प्रयोजनमपश्यतः कर्मभ्यो निवृत्तिरेव स्यात्, ‘प्रव्रजिष्यन्वा अरेऽहमस्मात्स्थानादस्मि’ (बृ.४.५.२) इत्येवमादिश्रुतिलिङ्गदर्शनात्।", "padacchedaText": "", "audioFile": "PB_000602.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000603", "originalText": "कर्म प्रति श्रुतेर्यत्नाधिक्यदर्शनादयुक्तमिति चेत्,— अग्निहोत्रादिकर्म प्रति श्रुतेरधिको यत्नः, महांश्च कर्मण्यायासः, अनेकसाधनसाध्यत्वादग्निहोत्रादीनाम्, तपोब्रह्मचर्यादीनां च इतराश्रमकर्मणां गार्हस्थ्येऽपि समानत्वादल्पसाधनापेक्षत्वाच्चेतरेषां न युक्तस्तुल्यवद्विकल्प आश्रमिभिस्तस्य इति चेत्, न, जन्मान्तरकृतानुग्रहात्।", "padacchedaText": "", "audioFile": "PB_000603.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000604", "originalText": "यदुक्तं कर्मणि श्रुतेरधिको यत्न इत्यादि, नासौ दोषः, यतो जन्मान्तरकृतमप्यग्निहोत्रादिलक्षणं कर्म ब्रह्मचर्यादिलक्षणं चानुग्राहकं भवति विद्योत्पत्तिं प्रति, येन च जन्मनैव विरक्ता दृश्यन्ते केचित्, केचित्तु कर्मसु प्रवृत्ता अविरक्ता विद्याविद्वेषिणः।", "padacchedaText": "", "audioFile": "PB_000604.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000605", "originalText": "तस्माज्जन्मान्तरकृतसंस्कारेभ्यो विरक्तानामाश्रमान्तरप्रतिपत्तिरेवेष्यते।", "padacchedaText": "", "audioFile": "PB_000605.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000606", "originalText": "कर्मफलबाहुल्याच्च।", "padacchedaText": "", "audioFile": "PB_000606.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000607", "originalText": "पुत्रस्वर्गब्रह्मवर्चसादिलक्षणस्य कर्मफलस्यासङ्ख्येयत्वात् तत्प्रति च पुरुषाणां कामबाहुल्यात्तदर्थः श्रुतेरधिको यत्नः कर्मसूपपद्यते, आशिषां बाहुल्यदर्शनात्— इदं मे स्यादिदं मे स्यादिति।", "padacchedaText": "", "audioFile": "PB_000607.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000608", "originalText": "उपायत्वाच्च।", "padacchedaText": "", "audioFile": "PB_000608.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000609", "originalText": "उपायभूतानि हि कर्माणि विद्यां प्रति इत्यवोचाम।", "padacchedaText": "", "audioFile": "PB_000609.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000610", "originalText": "उपाये च अधिको यत्नः कर्तव्यः, न उपेये।", "padacchedaText": "", "audioFile": "PB_000610.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000611", "originalText": "कर्मनिमित्तत्वाद्विद्याया यत्नान्तरानर्थक्यमिति चेत्— कर्मभ्य एव पूर्वोपचितदुरितप्रतिबन्धक्षयाद्विद्योत्पद्यते चेत्, कर्मभ्यः पृथगुपनिषच्छ्रवणादियत्नोऽनर्थक इति चेत्, न, नियमाभावात्।", "padacchedaText": "", "audioFile": "PB_000611.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000612", "originalText": "न हि, ‘प्रतिबन्धक्षयादेव विद्योत्पद्यते, न त्वीश्वरप्रसादतपोध्यानाद्यनुष्ठानात्’ इति नियमोऽस्ति, अहिंसाब्रह्मचर्यादीनां च विद्यां प्रत्युपकारकत्वात्, साक्षादेव च कारणत्वाच्छ्रवणमनननिदिध्यासनादीनाम्।", "padacchedaText": "", "audioFile": "PB_000612.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000613", "originalText": "अतः सिद्धान्याश्रमान्तराणि। सर्वेषां चाधिकारो विद्यायाम्, परं च श्रेयः केवलाया विद्याया एवेति सिद्धम्॥", "padacchedaText": "", "audioFile": "PB_000613.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000614", "originalText": "इत्येकादशानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000614.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000615", "originalText": "द्वादशोऽनुवाकः\nअतीतविद्याप्राप्त्युपसर्गशमनार्थां शान्तिं पठति—\nशं नो मित्रः शं वरुणः।", "padacchedaText": "", "audioFile": "PB_000615.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000616", "originalText": "शं नो भवत्वर्यमा।", "padacchedaText": "", "audioFile": "PB_000616.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000617", "originalText": "शं न इन्द्रो बृहस्पतिः।", "padacchedaText": "", "audioFile": "PB_000617.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000618", "originalText": "शं नो विष्णुरुरुक्रमः।", "padacchedaText": "", "audioFile": "PB_000618.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000619", "originalText": "नमो ब्रह्मणे।", "padacchedaText": "", "audioFile": "PB_000619.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000620", "originalText": "नमस्ते वायो।", "padacchedaText": "", "audioFile": "PB_000620.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000621", "originalText": "त्वमेव प्रत्यक्षं ब्रह्मासि।", "padacchedaText": "", "audioFile": "PB_000621.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000622", "originalText": "त्वामेव प्रत्यक्षं ब्रह्मावादिषम्।", "padacchedaText": "", "audioFile": "PB_000622.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000623", "originalText": "ऋतमवादिषम्।", "padacchedaText": "", "audioFile": "PB_000623.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000624", "originalText": "सत्यमवादिषम्।", "padacchedaText": "", "audioFile": "PB_000624.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000625", "originalText": "तन्मामावीत्।", "padacchedaText": "", "audioFile": "PB_000625.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000626", "originalText": "तद्वक्तारमावीत्।", "padacchedaText": "", "audioFile": "PB_000626.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000627", "originalText": "आवीन्माम्। आवीद्वक्तारम्॥", "padacchedaText": "", "audioFile": "PB_000627.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000628", "originalText": "शं नो मित्र इत्यादि। व्याख्यातमेतत्पूर्वम्॥", "padacchedaText": "", "audioFile": "PB_000628.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000629", "originalText": "इति द्वादशानुवाकभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000629.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000630", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ तैत्तिरीयोपनिषद्भाष्ये शीक्षावल्लीभाष्यम् सम्पूर्णम्॥", "padacchedaText": "", "audioFile": "PB_000630.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000631", "originalText": "ब्रह्मानन्दवल्ली\nप्रथमोऽनुवाकः\nअतीतविद्याप्राप्त्युपसर्गप्रशमनार्था शान्तिः पठिता।", "padacchedaText": "", "audioFile": "PB_000631.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000632", "originalText": "इदानीं तु वक्ष्यमाणब्रह्मविद्याप्राप्त्युपसर्गोपशमनार्था शान्तिः पठ्यते—\nॐ सह नाववतु।", "padacchedaText": "", "audioFile": "PB_000632.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000633", "originalText": "सह नौ भुनक्तु।", "padacchedaText": "", "audioFile": "PB_000633.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000634", "originalText": "सह वीर्यं करवावहै। तेजस्वि नावधीतमस्तु मा विद्विषावहै॥", "padacchedaText": "", "audioFile": "PB_000634.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000635", "originalText": "ॐशान्तिःशान्तिःशान्तिः॥", "padacchedaText": "", "audioFile": "PB_000635.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000636", "originalText": "सह नाववत्विति।", "padacchedaText": "", "audioFile": "PB_000636.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000637", "originalText": "सह नाववतु, नौ शिष्याचार्यौ सहैव अवतु रक्षतु।", "padacchedaText": "", "audioFile": "PB_000637.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000638", "originalText": "सह नौ भुनक्तु ब्रह्म भोजयतु।", "padacchedaText": "", "audioFile": "PB_000638.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000639", "originalText": "सह वीर्यं विद्यानिमित्तं सामर्थ्यं करवावहै निर्वर्तयावहै।", "padacchedaText": "", "audioFile": "PB_000639.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000640", "originalText": "तेजस्वि नौ तेजस्विनोरावयोः अधीतं स्वधीतम् अस्तु अर्थज्ञानयोग्यमस्त्वित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000640.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000641", "originalText": "मा विद्विषावहै, विद्याग्रहणनिमित्तं शिष्यस्य आचार्यस्य वा प्रमादकृतादन्यायाद्विद्वेषः प्राप्तः, तच्छमनायेयमाशीः— मा विद्विषावहै इति।", "padacchedaText": "", "audioFile": "PB_000641.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000642", "originalText": "मैव नावितरेतरं विद्वेषमापद्यावहै।", "padacchedaText": "", "audioFile": "PB_000642.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000643", "originalText": "शान्तिः शान्तिः शान्तिरिति त्रिर्वचनमुक्तार्थम्।", "padacchedaText": "", "audioFile": "PB_000643.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000644", "originalText": "वक्ष्यमाणविद्याविघ्नप्रशमनार्था चेयं शान्तिः। अविघ्नेनात्मविद्याप्राप्तिराशास्यते, तन्मूलं हि परं श्रेय इति॥", "padacchedaText": "", "audioFile": "PB_000644.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000645", "originalText": "संहितादिविषयाणि कर्मभिरविरुद्धान्युपासनान्युक्तानि।", "padacchedaText": "", "audioFile": "PB_000645.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000646", "originalText": "अनन्तरं च अन्तःसोपाधिकमात्मदर्शनमुक्तं व्याहृतिद्वारेण स्वाराज्यफलम्।", "padacchedaText": "", "audioFile": "PB_000646.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000647", "originalText": "न चैतावता अशेषतः संसारबीजस्य उपमर्दनमस्ति।", "padacchedaText": "", "audioFile": "PB_000647.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000648", "originalText": "अतः अशेषोपद्रवबीजस्य अज्ञानस्य निवृत्त्यर्थं विधूतसर्वोपाधिविशेषात्मदर्शनार्थमिदमारभ्यते—\nब्रह्मविदाप्नोति परम्।", "padacchedaText": "", "audioFile": "PB_000648.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000649", "originalText": "तदेषाभ्युक्ता।", "padacchedaText": "", "audioFile": "PB_000649.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000650", "originalText": "सत्यं ज्ञानमनन्तं ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000650.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000651", "originalText": "यो वेद निहितं गुहायां परमे व्योमन्।", "padacchedaText": "", "audioFile": "PB_000651.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000652", "originalText": "सोऽश्नुते सर्वान् कामान् सह।", "padacchedaText": "", "audioFile": "PB_000652.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000653", "originalText": "ब्रह्मणा विपश्चितेति।", "padacchedaText": "", "audioFile": "PB_000653.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000654", "originalText": "तस्माद्वा एतस्मादात्मन आकाशः सम्भूतः।", "padacchedaText": "", "audioFile": "PB_000654.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000655", "originalText": "आकाशाद्वायुः।", "padacchedaText": "", "audioFile": "PB_000655.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000656", "originalText": "वायोरग्निः।", "padacchedaText": "", "audioFile": "PB_000656.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000657", "originalText": "अग्नेरापः।", "padacchedaText": "", "audioFile": "PB_000657.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000658", "originalText": "अद्भ्यः पृथिवी।", "padacchedaText": "", "audioFile": "PB_000658.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000659", "originalText": "पृथिव्या ओषधयः।", "padacchedaText": "", "audioFile": "PB_000659.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000660", "originalText": "ओषधीभ्योऽन्नम्।", "padacchedaText": "", "audioFile": "PB_000660.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000661", "originalText": "अन्नात्पुरुषः।", "padacchedaText": "", "audioFile": "PB_000661.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000662", "originalText": "स वा एष पुरुषोऽन्नरसमयः।", "padacchedaText": "", "audioFile": "PB_000662.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000663", "originalText": "तस्येदमेव शिरः।", "padacchedaText": "", "audioFile": "PB_000663.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000664", "originalText": "अयं दक्षिणः पक्षः।", "padacchedaText": "", "audioFile": "PB_000664.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000665", "originalText": "अयमुत्तरः पक्षः।", "padacchedaText": "", "audioFile": "PB_000665.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000666", "originalText": "अयमात्मा।", "padacchedaText": "", "audioFile": "PB_000666.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000667", "originalText": "इदं पुच्छं प्रतिष्ठा। तदप्येष श्लोको भवति॥ १॥", "padacchedaText": "", "audioFile": "PB_000667.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000668", "originalText": "ब्रह्मविदाप्नोति परमित्यादि।", "padacchedaText": "", "audioFile": "PB_000668.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000669", "originalText": "प्रयोजनं चास्या ब्रह्मविद्याया अविद्यानिवृत्तिः, ततश्च आत्यन्तिकः संसाराभावः।", "padacchedaText": "", "audioFile": "PB_000669.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000670", "originalText": "वक्ष्यति च— ‘विद्वान्न बिभेति कुतश्चन’ (तै.२.९.१) इति।", "padacchedaText": "", "audioFile": "PB_000670.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000671", "originalText": "संसारनिमित्ते च सति अभयं प्रतिष्ठां विन्दत इत्यनुपपन्नम्, कृताकृते पुण्यपापे न तपत इति च।", "padacchedaText": "", "audioFile": "PB_000671.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000672", "originalText": "अतोऽवगम्यते— अस्माद्विज्ञानात्सर्वात्मब्रह्मविषयादात्यन्तिकः संसाराभाव इति।", "padacchedaText": "", "audioFile": "PB_000672.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000673", "originalText": "स्वयमेवाह प्रयोजनम् ‘ब्रह्मविदाप्नोति परम्’ इत्यादावेव सम्बन्धप्रयोजनज्ञापनार्थम्।", "padacchedaText": "", "audioFile": "PB_000673.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000674", "originalText": "निर्ज्ञातयोर्हि सम्बन्धप्रयोजनयोः विद्याश्रवणग्रहणधारणाभ्यासार्थं प्रवर्तते।", "padacchedaText": "", "audioFile": "PB_000674.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000675", "originalText": "श्रवणादिपूर्वकं हि विद्याफलम्, ‘श्रोतव्यो मन्तव्यो निदिध्यासितव्यः’ (बृ.२.४.५) इत्यादिश्रुत्यन्तरेभ्यः।", "padacchedaText": "", "audioFile": "PB_000675.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000676", "originalText": "ब्रह्मवित्, ब्रह्मेति वक्ष्यमाणलक्षणम्, बृहत्तमत्वात् ब्रह्म, तद्वेत्ति विजानातीति ब्रह्मवित्, आप्नोति प्राप्नोति परं निरतिशयम्, तदेव ब्रह्म परम्, न ह्यन्यस्य विज्ञानादन्यस्य प्राप्तिः।", "padacchedaText": "", "audioFile": "PB_000676.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000677", "originalText": "स्पष्टं च श्रुत्यन्तरं ब्रह्मप्राप्तिमेव ब्रह्मविदो दर्शयति— ‘स यो हि वै तत्परमं ब्रह्म वेद ब्रह्मैव भवति’ (मु.३.२.९) इत्यादि॥", "padacchedaText": "", "audioFile": "PB_000677.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000678", "originalText": "ननु, सर्वगतं सर्वस्य चात्मभूतं ब्रह्म वक्ष्यति।", "padacchedaText": "", "audioFile": "PB_000678.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000679", "originalText": "अतो नाप्यम्।", "padacchedaText": "", "audioFile": "PB_000679.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000680", "originalText": "आप्तिश्च अन्यस्यान्येन परिच्छिन्नस्य च परिच्छिन्नेन दृष्टा।", "padacchedaText": "", "audioFile": "PB_000680.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000681", "originalText": "अपरिच्छिन्नं सर्वात्मकं च ब्रह्मेत्यतः परिच्छिन्नवत् अनात्मवच्च तस्याप्तिरनुपपन्ना।", "padacchedaText": "", "audioFile": "PB_000681.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000682", "originalText": "नायं दोषः।", "padacchedaText": "", "audioFile": "PB_000682.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000683", "originalText": "कथम्? दर्शनादर्शनापेक्षत्वाद्ब्रह्मण आप्त्यनाप्त्योः, परमार्थतो ब्रह्मस्वरूपस्यापि सतः अस्य जीवस्य भूतमात्राकृतबाह्यपरिच्छिन्नान्नमयाद्यात्मदर्शिनः तदासक्तचेतसः।", "padacchedaText": "", "audioFile": "PB_000683.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000684", "originalText": "प्रकृतसङ्ख्यापूरणस्यात्मनः अव्यवहितस्यापि बाह्यसङ्ख्येयविषयासक्तचित्ततया स्वरूपाभावदर्शनवत् परमार्थब्रह्मस्वरूपाभावदर्शनलक्षणया अविद्यया अन्नमयादीन्बाह्याननात्मन आत्मत्वेन प्रतिपन्नत्वात् अन्नमयाद्यनात्मभ्यो नान्योऽहमस्मीत्यभिमन्यते।", "padacchedaText": "", "audioFile": "PB_000684.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000685", "originalText": "एवमविद्यया आत्मभूतमपि ब्रह्म अनाप्तं स्यात्।", "padacchedaText": "", "audioFile": "PB_000685.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000686", "originalText": "तस्यैवमविद्यया अनाप्तब्रह्मस्वरूपस्य प्रकृतसङ्ख्यापूरणस्यात्मनः अविद्ययानाप्तस्य सतः केनचित्स्मारितस्य पुनस्तस्यैव विद्यया आप्तिर्यथा, तथा श्रुत्युपदिष्टस्य सर्वात्मब्रह्मण आत्मत्वदर्शनेन विद्यया तदाप्तिरुपपद्यत एव।", "padacchedaText": "", "audioFile": "PB_000686.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000687", "originalText": "ब्रह्मविदाप्नोति परमिति वाक्यं सूत्रभूतं सर्वस्य वल्ल्यर्थस्य।", "padacchedaText": "", "audioFile": "PB_000687.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000688", "originalText": "ब्रह्मविदाप्नोति परमित्यनेन वाक्येन वेद्यतया सूत्रितस्य ब्रह्मणोऽनिर्धारितस्वरूपविशेषस्य सर्वतो व्यावृत्तस्वरूपविशेषसमर्पणसमर्थस्य लक्षणस्याभिधानेन स्वरूपनिर्धारणाय अविशेषेण च उक्तवेदनस्य ब्रह्मणो वक्ष्यमाणलक्षणस्य विशेषेण प्रत्यगात्मतया अनन्यरूपेण विज्ञेयत्वाय, ब्रह्मविद्याफलं च ब्रह्मविदो यत्परप्राप्तिलक्षणमुक्तम्, स सर्वात्मभावः सर्वसंसारधर्मातीतब्रह्मस्वरूपत्वमेव, नान्यदित्येतत्प्रदर्शनाय च एषा ऋगुदाह्रियते— तदेषाभ्युक्तेति।", "padacchedaText": "", "audioFile": "PB_000688.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000689", "originalText": "तत् तस्मिन्नेव ब्राह्मणवाक्योक्तार्थे एषा ऋक् अभ्युक्ता आम्नाता।", "padacchedaText": "", "audioFile": "PB_000689.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000690", "originalText": "सत्यं ज्ञानमनन्तं ब्रह्म इति ब्रह्मणो लक्षणार्थं वाक्यम्।", "padacchedaText": "", "audioFile": "PB_000690.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000691", "originalText": "सत्यादीनि हि त्रीणि विशेषणार्थानि पदानि विशेष्यस्य ब्रह्मणः।", "padacchedaText": "", "audioFile": "PB_000691.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000692", "originalText": "विशेष्यं ब्रह्म, विवक्षितत्वाद्वेद्यतया।", "padacchedaText": "", "audioFile": "PB_000692.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000693", "originalText": "वेद्यत्वेन यतो ब्रह्म प्राधान्येन विवक्षितम्, तस्माद्विशेष्यं विज्ञेयम्।", "padacchedaText": "", "audioFile": "PB_000693.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000694", "originalText": "अतः अस्माद्विशेषणविशेष्यत्वादेव सत्यादीनि एकविभक्त्यन्तानि पदानि समानाधिकरणानि।", "padacchedaText": "", "audioFile": "PB_000694.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000695", "originalText": "सत्यादिभिस्त्रिभिर्विशेषणैर्विशेष्यमाणं ब्रह्म विशेष्यान्तरेभ्यो निर्धार्यते।", "padacchedaText": "", "audioFile": "PB_000695.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000696", "originalText": "एवं हि तज्ज्ञातं भवति, यदन्येभ्यो निर्धारितम्, यथा लोके नीलं महत्सुगन्ध्युत्पलमिति।", "padacchedaText": "", "audioFile": "PB_000696.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000697", "originalText": "ननु, विशेष्यं विशेषणान्तरं व्यभिचरद्विशेष्यते, यथा नीलं रक्तं चोत्पलमिति, यदा ह्यनेकानि द्रव्याणि एकजातीयान्यनेकविशेषणयोगीनि च, तदा विशेषणस्यार्थवत्त्वम्, न ह्येकस्मिन्नेव वस्तुनि, विशेषणान्तरायोगात्, यथा असावेक आदित्य इति, तथा एकमेव ब्रह्म, न ब्रह्मान्तराणि, येभ्यो विशेष्येत नीलोत्पलवत्।", "padacchedaText": "", "audioFile": "PB_000697.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000698", "originalText": "न, लक्षणार्थत्वाद्विशेषणानाम्।", "padacchedaText": "", "audioFile": "PB_000698.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000699", "originalText": "नायं दोषः।", "padacchedaText": "", "audioFile": "PB_000699.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000700", "originalText": "कस्मात्? लक्षणार्थप्रधानानि विशेषणानि, न विशेषणप्रधानान्येव।", "padacchedaText": "", "audioFile": "PB_000700.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000701", "originalText": "कः पुनर्लक्षणलक्ष्ययोर्विशेषणविशेष्ययोर्वा विशेषः? उच्यते।", "padacchedaText": "", "audioFile": "PB_000701.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000702", "originalText": "सजातीयेभ्य एव निवर्तकानि विशेषणानि विशेष्यस्य, लक्षणं तु सर्वत एव, यथा अवकाशप्रदात्राकाशमिति। लक्षणार्थं च वाक्यमित्यवोचाम॥", "padacchedaText": "", "audioFile": "PB_000702.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000703", "originalText": "सत्यादिशब्दा न परस्परं सम्बध्यन्ते, परार्थत्वात्, विशेष्यार्था हि ते।", "padacchedaText": "", "audioFile": "PB_000703.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000704", "originalText": "अत एव एकैको विशेषणशब्दः परस्परं निरपेक्षो ब्रह्मशब्देन सम्बध्यते— सत्यं ब्रह्म ज्ञानं ब्रह्म अनन्तं ब्रह्मेति।", "padacchedaText": "", "audioFile": "PB_000704.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000705", "originalText": "सत्यमिति यद्रूपेण यन्निश्चितं तद्रूपं न व्यभिचरति, तत्सत्यम्।", "padacchedaText": "", "audioFile": "PB_000705.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000706", "originalText": "यद्रूपेण यन्निश्चितं तद्रूपं व्यभिचरति, तदनृतमित्युच्यते।", "padacchedaText": "", "audioFile": "PB_000706.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000707", "originalText": "अतो विकारोऽनृतम्, ‘ वाचारम्भणं विकारो नामधेयं मृत्तिकेत्येव सत्यम्’ (छा.६.१.४) एवं सदेव सत्यमित्यवधारणात्।", "padacchedaText": "", "audioFile": "PB_000707.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000708", "originalText": "अतः ‘सत्यं ब्रह्म’ इति ब्रह्म विकारान्निवर्तयति।", "padacchedaText": "", "audioFile": "PB_000708.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000709", "originalText": "अतः कारणत्वं प्राप्तं ब्रह्मणः।", "padacchedaText": "", "audioFile": "PB_000709.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000710", "originalText": "कारणस्य च कारकत्वम्, वस्तुत्वात् मृद्वत् अचिद्रूपता च प्राप्ता, अत इदमुच्यते— ज्ञानं ब्रह्मेति।", "padacchedaText": "", "audioFile": "PB_000710.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000711", "originalText": "ज्ञानं ज्ञप्तिः अवबोधः,— भावसाधनो ज्ञानशब्दः— न तु ज्ञानकर्तृ, ब्रह्मविशेषणत्वात्सत्यानन्ताभ्यां सह।", "padacchedaText": "", "audioFile": "PB_000711.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000712", "originalText": "न हि सत्यता अनन्तता च ज्ञानकर्तृत्वे सत्युपपद्येते।", "padacchedaText": "", "audioFile": "PB_000712.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000713", "originalText": "ज्ञानकर्तृत्वेन हि विक्रियमाणं कथं सत्यं भवेत्, अनन्तं च? यद्धि न कुतश्चित्प्रविभज्यते, तदनन्तम्।", "padacchedaText": "", "audioFile": "PB_000713.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000714", "originalText": "ज्ञानकर्तृत्वे च ज्ञेयज्ञानाभ्यां प्रविभक्तमित्यनन्तता न स्यात्, ‘यत्र नान्यद्विजानाति स भूमा, अथ यत्रान्यद्विजानाति तदल्पम्’ (छा.७.२४.१) इति श्रुत्यन्तरात्।", "padacchedaText": "", "audioFile": "PB_000714.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000715", "originalText": "‘नान्यद्विजानाति’ इति विशेषप्रतिषेधात् आत्मानं विजानातीति चेत्, न, भूमलक्षणविधिपरत्वाद्वाक्यस्य।", "padacchedaText": "", "audioFile": "PB_000715.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000716", "originalText": "‘यत्र नान्यत्पश्यति’ इत्यादि भूम्नो लक्षणविधिपरं वाक्यम्।", "padacchedaText": "", "audioFile": "PB_000716.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000717", "originalText": "यथाप्रसिद्धमेव अन्योऽन्यत्पश्यतीत्येतदुपादाय यत्र तन्नास्ति, स भूमा इति भूमस्वरूपं तत्र ज्ञाप्यते।", "padacchedaText": "", "audioFile": "PB_000717.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000718", "originalText": "अन्यग्रहणस्य प्राप्तप्रतिषेधार्थत्वात् न स्वात्मनि क्रियास्तित्वपरं वाक्यम्।", "padacchedaText": "", "audioFile": "PB_000718.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000719", "originalText": "स्वात्मनि च भेदाभावाद्विज्ञानानुपपत्तिः। आत्मनश्च विज्ञेयत्वे ज्ञात्रभावप्रसङ्गः, ज्ञेयत्वेनैव विनियुक्तत्वात्॥", "padacchedaText": "", "audioFile": "PB_000719.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000720", "originalText": "एक एवात्मा ज्ञेयत्वेन ज्ञातृत्वेन च उभयथा भवतीति चेत्, न, युगपदनंशत्वात्।", "padacchedaText": "", "audioFile": "PB_000720.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000721", "originalText": "न हि निरवयवस्य युगपज्ज्ञेयज्ञातृत्वोपपत्तिः।", "padacchedaText": "", "audioFile": "PB_000721.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000722", "originalText": "आत्मनश्च घटादिवद्विज्ञेयत्वे ज्ञानोपदेशानर्थक्यम्।", "padacchedaText": "", "audioFile": "PB_000722.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000723", "originalText": "न हि घटादिवत्प्रसिद्धस्य ज्ञानोपदेशः अर्थवान्।", "padacchedaText": "", "audioFile": "PB_000723.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000724", "originalText": "तस्मात् ज्ञातृत्वे सति आनन्त्यानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_000724.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000725", "originalText": "सन्मात्रत्वं चानुपपन्नं ज्ञानकर्तृत्वादिविशेषवत्त्वे सति, सन्मात्रत्वं च सत्यम्, ‘तत् सत्यम्’ (छा.६.८.१६) इति श्रुत्यन्तरात्।", "padacchedaText": "", "audioFile": "PB_000725.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000726", "originalText": "तस्मात्सत्यानन्तशब्दाभ्यां सह विशेषणत्वेन ज्ञानशब्दस्य प्रयोगाद्भावसाधनो ज्ञानशब्दः।", "padacchedaText": "", "audioFile": "PB_000726.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000727", "originalText": "‘ज्ञानं ब्रह्म’ इति कर्तृत्वादिकारकनिवृत्त्यर्थं मृदादिवदचिद्रूपतानिवृत्त्यर्थं च प्रयुज्यते।", "padacchedaText": "", "audioFile": "PB_000727.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000728", "originalText": "‘ज्ञानं ब्रह्म’ इति वचनात्प्राप्तमन्तवत्त्वम्, लौकिकस्य ज्ञानस्य अन्तवत्त्वदर्शनात्।", "padacchedaText": "", "audioFile": "PB_000728.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000729", "originalText": "अतः तन्निवृत्त्यर्थमाह— अनन्तमिति।", "padacchedaText": "", "audioFile": "PB_000729.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000730", "originalText": "सत्यादीनामनृतादिधर्मनिवृत्तिपरत्वात् विशेष्यस्य च ब्रह्मणः उत्पलादिवदप्रसिद्धत्वात् ‘मृगतृष्णाम्भसि स्नातः खपुष्पकृतशेखरः।", "padacchedaText": "", "audioFile": "PB_000730.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000731", "originalText": "एष वन्ध्यासुतो याति शशशृङ्गधनुर्धरः’ इतिवत् शून्यार्थतैव प्राप्ता सत्यादिवाक्यस्येति चेत्, न, लक्षणार्थत्वात्।", "padacchedaText": "", "audioFile": "PB_000731.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000732", "originalText": "विशेषणत्वेऽपि सत्यादीनां लक्षणार्थप्राधान्यमित्यवोचाम।", "padacchedaText": "", "audioFile": "PB_000732.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000733", "originalText": "शून्ये हि लक्ष्ये अनर्थकं लक्षणवचनम्।", "padacchedaText": "", "audioFile": "PB_000733.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000734", "originalText": "अतः लक्षणार्थत्वान्मन्यामहे न शून्यार्थतेति।", "padacchedaText": "", "audioFile": "PB_000734.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000735", "originalText": "विशेषणार्थत्वेऽपि च सत्यादीनां स्वार्थापरित्याग एव।", "padacchedaText": "", "audioFile": "PB_000735.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000736", "originalText": "शून्यार्थत्वे हि सत्यादिशब्दानां विशेष्यनियन्तृत्वानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_000736.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000737", "originalText": "सत्याद्यर्थैरर्थवत्त्वे तु तद्विपरीतधर्मवद्भ्यो विशेष्येभ्यो ब्रह्मणो विशेष्यस्य नियन्तृत्वमुपपद्यते।", "padacchedaText": "", "audioFile": "PB_000737.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000738", "originalText": "ब्रह्मशब्दोऽपि स्वार्थेनार्थवानेव।", "padacchedaText": "", "audioFile": "PB_000738.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000739", "originalText": "तत्र अनन्तशब्दः अन्तवत्त्वप्रतिषेधद्वारेण विशेषणम्। सत्यज्ञानशब्दौ तु स्वार्थसमर्पणेनैव विशेषणे भवतः॥", "padacchedaText": "", "audioFile": "PB_000739.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000740", "originalText": "‘तस्माद्वा एतस्मादात्मनः’ इति ब्रह्मण्येव आत्मशब्दप्रयोगात् वेदितुरात्मैव ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000740.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000741", "originalText": "‘एतमानन्दमयमात्मानमुपसङ्क्रामति’ (तै.२.८.५) इति च आत्मतां दर्शयति।", "padacchedaText": "", "audioFile": "PB_000741.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000742", "originalText": "तत्प्रवेशाच्च, ‘तत्सृष्ट्वा तदेवानुप्राविशत्’ (तै.२.६.१) इति च तस्यैव जीवरूपेण शरीरप्रवेशं दर्शयति।", "padacchedaText": "", "audioFile": "PB_000742.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000743", "originalText": "अतो वेदितुः स्वरूपं ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000743.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000744", "originalText": "एवं तर्हि, आत्मत्वाज्ज्ञानकर्तृत्वम्, ‘आत्मा ज्ञाता’ इति हि प्रसिद्धम्, ‘सोऽकामयत’ (तै.२.६.१) इति च कामिनो ज्ञानकर्तृत्वप्रसिद्धिः, अतो ज्ञानकर्तृत्वात् ज्ञप्तिर्ब्रह्मेत्ययुक्तम्, अनित्यत्वप्रसङ्गाच्च, यदि नाम ज्ञप्तिर्ज्ञानमिति भावरूपता ब्रह्मणः, तदाप्यनित्यत्वं प्रसज्येत, पारतन्त्र्यं च, धात्वर्थानां कारकापेक्षत्वात्, ज्ञानं च धात्वर्थः, अतोऽस्य अनित्यत्वं परतन्त्रता च।", "padacchedaText": "", "audioFile": "PB_000744.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000745", "originalText": "न, स्वरूपाव्यतिरेकेण कार्यत्वोपचारात्।", "padacchedaText": "", "audioFile": "PB_000745.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000746", "originalText": "आत्मनः स्वरूपं ज्ञप्तिः न ततो व्यतिरिच्यते।", "padacchedaText": "", "audioFile": "PB_000746.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000747", "originalText": "अतो नित्यैव।", "padacchedaText": "", "audioFile": "PB_000747.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000748", "originalText": "तथापि बुद्धेरुपाधिलक्षणायाश्चक्षुरादिद्वारैर्विषयाकारपरिणामिन्याः ये शब्दाद्याकारावभासाः, ते आत्मविज्ञानस्य विषयभूता उत्पद्यमाना एव आत्मविज्ञानेन व्याप्ता उत्पद्यन्ते।", "padacchedaText": "", "audioFile": "PB_000748.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000749", "originalText": "तस्मादात्मविज्ञानावभास्याश्च ते विज्ञानशब्दवाच्याश्च धात्वर्थभूता आत्मन एव धर्मा विक्रियारूपा इत्यविवेकिभिः परिकल्प्यन्ते।", "padacchedaText": "", "audioFile": "PB_000749.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000750", "originalText": "यत्तु ब्रह्मणो विज्ञानम्, तत् सवितृप्रकाशवत् अग्न्युष्णत्ववच्च ब्रह्मस्वरूपाव्यतिरिक्तं स्वरूपमेव तत्।", "padacchedaText": "", "audioFile": "PB_000750.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000751", "originalText": "न तत्कारणान्तरसव्यपेक्षम्, नित्यस्वरूपत्वात्, सर्वभावानां च तेनाविभक्तदेशकालत्वात् कालाकाशादिकारणत्वात् निरतिशयसूक्ष्मत्वाच्च।", "padacchedaText": "", "audioFile": "PB_000751.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000752", "originalText": "न तस्यान्यदविज्ञेयं सूक्ष्मं व्यवहितं विप्रकृष्टं भूतं भवद्भविष्यद्वा अस्ति।", "padacchedaText": "", "audioFile": "PB_000752.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000753", "originalText": "तस्मात्सर्वज्ञं तद्ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000753.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000754", "originalText": "मन्त्रवर्णाच्च ‘अपाणिपादो जवनो ग्रहीता पश्यत्यचक्षुः स शृणोत्यकर्णः।", "padacchedaText": "", "audioFile": "PB_000754.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000755", "originalText": "स वेत्ति वेद्यं न च तस्यास्ति वेत्ता तमाहुरग्र्यं पुरुषं महान्तम्’ (श्वे.३.१९) इति।", "padacchedaText": "", "audioFile": "PB_000755.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000756", "originalText": "‘न हि विज्ञतुर्विज्ञातेर्विपरिलोपो विद्यतेऽविनाशित्वान्न तु तद्द्वितीयमस्ति’ (बृ.४.३.३०) इत्यादिश्रुतेश्च।", "padacchedaText": "", "audioFile": "PB_000756.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000757", "originalText": "विज्ञातृस्वरूपाव्यतिरेकात्करणादिनिमित्तानपेक्षत्वाच्च ब्रह्मणो ज्ञानस्वरूपत्वेऽपि नित्यत्वप्रसिद्धिः।", "padacchedaText": "", "audioFile": "PB_000757.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000758", "originalText": "अतो नैव धात्वर्थस्तत्, अक्रियारूपत्वात्।", "padacchedaText": "", "audioFile": "PB_000758.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000759", "originalText": "अत एव च न ज्ञानकर्तृ, तस्मादेव च न ज्ञानशब्दवाच्यमपि तद्ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000759.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000760", "originalText": "तथापि तदाभासवाचकेन बुद्धिधर्मविशेषेण ज्ञानशब्देन तल्लक्ष्यते, न तु उच्यते, शब्दप्रवृत्तिहेतुजात्यादिधर्मरहितत्वात्।", "padacchedaText": "", "audioFile": "PB_000760.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000761", "originalText": "तथा सत्यशब्देनापि।", "padacchedaText": "", "audioFile": "PB_000761.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000762", "originalText": "सर्वविशेषप्रत्यस्तमितस्वरूपत्वाद्ब्रह्मणः बाह्यसत्तासामान्यविषयेण सत्यशब्देन लक्ष्यते ‘सत्यं ब्रह्म’ इति, न तु सत्यशब्दवाच्यं ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000762.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000763", "originalText": "एवं सत्यादिशब्दा इतरेतरसंनिधानादन्योन्यनियम्यनियामकाः सन्तः सत्यादिशब्दवाच्यात् निवर्तका ब्रह्मणः, लक्षणार्थाश्च भवन्तीति। अतः सिद्धम् ‘यतो वाचो निवर्तन्ते अप्राप्य मनसा सह’ (तै.२.४.१) ‘अनिरुक्तेऽनिलयने’ (तै.२.७.१) इति च अवाच्यत्वम्, नीलोत्पलवदवाक्यार्थत्वं च ब्रह्मणः॥", "padacchedaText": "", "audioFile": "PB_000763.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000764", "originalText": "तद्यथाव्याख्यातं ब्रह्म यः वेद विजानाति निहितं स्थितं गुहायाम्, गूहतेः संवरणार्थस्य निगूढा अस्यां ज्ञानज्ञेयज्ञातृपदार्था इति गुहा बुद्धिः, गूढावस्यां भोगापवर्गौ पुरुषार्थाविति वा, तस्यां परमे प्रकृष्टे व्योमन् व्योम्नि आकाशे अव्याकृताख्ये, तद्धि परमं व्योम, ‘एतस्मिन्खल्वक्षरे गार्ग्याकाशः’ (बृ.३.८.११) इत्यक्षरसंनिकर्षात्, ‘गुहायां व्योमन्’ इति वा सामानाधिकरण्यादव्याकृताकाशमेव गुहा, तत्रापि निगूढाः सर्वे पदार्थास्त्रिषु कालेषु, कारणत्वात्सूक्ष्मतरत्वाच्च, तस्मिन्नन्तर्निहितं ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000764.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000765", "originalText": "हार्दमेव तु परमं व्योमेति न्याय्यम्, विज्ञानाङ्गत्वेन व्योम्नो विवक्षितत्वात्।", "padacchedaText": "", "audioFile": "PB_000765.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000766", "originalText": "‘यो वै स बहिर्धा पुरुषादाकाशो यो वै सोऽन्तः पुरुष आकाशो योऽयमन्तर्हृदय आकाशः’ (छा.३.१२.७), (छा.३.१२.८) इति श्रुत्यन्तरात्प्रसिद्धं हार्दस्य व्योम्नः परमत्वम्।", "padacchedaText": "", "audioFile": "PB_000766.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000767", "originalText": "तस्मिन्हार्दे व्योम्नि या बुद्धिर्गुहा, तस्यां निहितं ब्रह्म तद्व्यावृत्त्या विविक्ततयोपलभ्यत इति।", "padacchedaText": "", "audioFile": "PB_000767.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000768", "originalText": "न ह्यन्यथा विशिष्टदेशकालसम्बन्धोऽस्ति ब्रह्मणः, सर्वगतत्वान्निर्विशेषत्वाच्च।", "padacchedaText": "", "audioFile": "PB_000768.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000769", "originalText": "सः एवं ब्रह्म विजानन्, किमित्याह— अश्नुते भुङ्क्ते सर्वान् निरवशेषान् कामान् काम्यभोगानित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000769.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000770", "originalText": "किमस्मदादिवत्पुत्रस्वर्गादीन्पर्यायेण? नेत्याह— सह युगपत् एकक्षणोपारूढानेव एकयोपलब्ध्या सवितृप्रकाशवन्नित्यया ब्रह्मस्वरूपाव्यतिरिक्तया, यामवोचाम ‘सत्यं ज्ञानम्’ इति।", "padacchedaText": "", "audioFile": "PB_000770.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000771", "originalText": "एतत्तदुच्यते— ब्रह्मणा सहेति।", "padacchedaText": "", "audioFile": "PB_000771.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000772", "originalText": "ब्रह्मभूतो विद्वान् ब्रह्मस्वरूपेणैव सर्वान्कामान् सह अश्नुते।", "padacchedaText": "", "audioFile": "PB_000772.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000773", "originalText": "न तथा यथोपाधिकृतेन स्वरूपेणात्मनो जलसूर्यकादिवत्प्रतिबिम्बभूतेन सांसारिकेण धर्मादिनिमित्तापेक्षांश्चक्षुरादिकरणापेक्षांश्च सर्वान्कामान्पर्यायेणाश्नुते लोकः।", "padacchedaText": "", "audioFile": "PB_000773.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000774", "originalText": "कथं तर्हि? यथोक्तेन प्रकारेण सर्वज्ञेन सर्वगतेन सर्वात्मना नित्यब्रह्मात्मस्वरूपेण धर्मादिनिमित्तानपेक्षान् चक्षुरादिकरणानपेक्षांश्च सर्वान्कामान्सहाश्नुत इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000774.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000775", "originalText": "विपश्चिता मेधाविना सर्वज्ञेन।", "padacchedaText": "", "audioFile": "PB_000775.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000776", "originalText": "तद्धि वैपश्चित्यम्, यत्सर्वज्ञत्वम्।", "padacchedaText": "", "audioFile": "PB_000776.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000777", "originalText": "तेन सर्वज्ञस्वरूपेण ब्रह्मणा अश्नुत इति। इतिशब्दो मन्त्रपरिसमाप्त्यर्थः॥", "padacchedaText": "", "audioFile": "PB_000777.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000778", "originalText": "सर्व एव वल्ल्यर्थः ‘ब्रह्मविदाप्नोति परम्’ इति ब्राह्मण वाक्येन सूत्रितः।", "padacchedaText": "", "audioFile": "PB_000778.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000779", "originalText": "स च सूत्रितोऽर्थः सङ्क्षेपतो मन्त्रेण व्याख्यातः।", "padacchedaText": "", "audioFile": "PB_000779.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000780", "originalText": "पुनस्तस्यैव विस्तरेणार्थनिर्णयः कर्तव्य इत्युत्तरस्तद्वृत्तिस्थानीयो ग्रन्थ आरभ्यते— तस्माद्वा एतस्मादित्यादिः।", "padacchedaText": "", "audioFile": "PB_000780.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000781", "originalText": "तत्र च ‘सत्यं ज्ञानमनन्तं ब्रह्म’ इत्युक्तं मन्त्रादौ, तत्कथं सत्यमनन्तं चेत्यत आह।", "padacchedaText": "", "audioFile": "PB_000781.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000782", "originalText": "त्रिविधं ह्यानन्त्यम्— देशतः कालतो वस्तुतश्चेति।", "padacchedaText": "", "audioFile": "PB_000782.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000783", "originalText": "तद्यथा— देशतोऽनन्त आकाशः, न हि देशतस्तस्य परिच्छेदोऽस्ति।", "padacchedaText": "", "audioFile": "PB_000783.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000784", "originalText": "न तु कालतश्चानन्त्यं वस्तुतश्च आकाशस्य।", "padacchedaText": "", "audioFile": "PB_000784.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000785", "originalText": "कस्मात्? कार्यत्वात्।", "padacchedaText": "", "audioFile": "PB_000785.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000786", "originalText": "नैवं ब्रह्मण आकाशवत्कालतोऽप्यन्तवत्त्वम्।", "padacchedaText": "", "audioFile": "PB_000786.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000787", "originalText": "अकार्यत्वात्।", "padacchedaText": "", "audioFile": "PB_000787.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000788", "originalText": "कार्यं हि वस्तु कालेन परिच्छिद्यते।", "padacchedaText": "", "audioFile": "PB_000788.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000789", "originalText": "अकार्यं च ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000789.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000790", "originalText": "तस्मात्कालतोऽस्यानन्त्यम्।", "padacchedaText": "", "audioFile": "PB_000790.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000791", "originalText": "तथा वस्तुतः।", "padacchedaText": "", "audioFile": "PB_000791.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000792", "originalText": "कथं पुनर्वस्तुत आनन्त्यम्? सर्वानन्यत्वात्।", "padacchedaText": "", "audioFile": "PB_000792.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000793", "originalText": "भिन्नं हि वस्तु वस्त्वन्तरस्य अन्तो भवति, वस्त्वन्तरबुद्धिर्हि प्रसक्ताद्वस्त्वन्तरान्निवर्तते।", "padacchedaText": "", "audioFile": "PB_000793.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000794", "originalText": "यतो यस्य बुद्धेर्निवृत्तिः, स तस्यान्तः।", "padacchedaText": "", "audioFile": "PB_000794.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000795", "originalText": "तद्यथा गोत्वबुद्धिरश्वत्वान्निवर्तत इत्यश्वत्वान्तं गोत्वमित्यन्तवदेव भवति।", "padacchedaText": "", "audioFile": "PB_000795.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000796", "originalText": "स चान्तो भिन्नेषु वस्तुषु दृष्टः।", "padacchedaText": "", "audioFile": "PB_000796.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000797", "originalText": "नैवं ब्रह्मणो भेदः।", "padacchedaText": "", "audioFile": "PB_000797.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000798", "originalText": "अतो वस्तुतोऽप्यानन्त्यम्।", "padacchedaText": "", "audioFile": "PB_000798.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000799", "originalText": "कथं पुनः सर्वानन्यत्वं ब्रह्मण इति, उच्यते— सर्ववस्तुकारणत्वात्।", "padacchedaText": "", "audioFile": "PB_000799.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000800", "originalText": "सर्वेषां हि वस्तूनां कालाकाशादीनां कारणं ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000800.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000801", "originalText": "कार्यापेक्षया वस्तुतोऽन्तवत्त्वमिति चेत्, न, अनृतत्वात्कार्यस्य वस्तुनः।", "padacchedaText": "", "audioFile": "PB_000801.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000802", "originalText": "न हि कारणव्यतिरेकेण कार्यं नाम वस्तुतोऽस्ति, यतः कारणबुद्धिर्विनिवर्तेत, ‘वाचारम्भणं विकारो नामधेयं मृत्तिकेत्येव सत्यम्’ (छा.६.१.४) एवं सदेव सत्यमिति श्रुत्यन्तरात्।", "padacchedaText": "", "audioFile": "PB_000802.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000803", "originalText": "तस्मादाकाशादिकारणत्वाद्देशतस्तावदनन्तं ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000803.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000804", "originalText": "आकाशो ह्यनन्त इति प्रसिद्धं देशतः, तस्येदं कारणम्, तस्मात्सिद्धं देशत आत्मन आनन्त्यम्।", "padacchedaText": "", "audioFile": "PB_000804.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000805", "originalText": "न ह्यसर्वगतात्सर्वगतमुत्पद्यमानं लोके किञ्चिद्दृश्यते।", "padacchedaText": "", "audioFile": "PB_000805.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000806", "originalText": "अतो निरतिशयमात्मन आनन्त्यं देशतः।", "padacchedaText": "", "audioFile": "PB_000806.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000807", "originalText": "तथा अकार्यत्वात्कालतः, तद्भिन्नवस्त्वन्तराभावाच्च वस्तुतः। अत एव निरतिशयसत्यत्वम्॥", "padacchedaText": "", "audioFile": "PB_000807.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000808", "originalText": "तस्मात् इति मूलवाक्यसूत्रितं ब्रह्म परामृश्यते, एतस्मात् इति मन्त्रवाक्येन अनन्तरं यथालक्षितम्।", "padacchedaText": "", "audioFile": "PB_000808.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000809", "originalText": "यद्ब्रह्म आदौ ब्राह्मणवाक्येन सूत्रितम्, यच्च ‘सत्यं ज्ञानमनन्तं ब्रह्म’ इत्यनन्तरमेव लक्षितम्, तस्मादेतस्माद्ब्रह्मण आत्मनः आत्मशब्दवाच्यात्, आत्मा हि तत् सर्वस्य, ‘तत्सत्यं स आत्मा’ (छा.६.८.१६) इति श्रुत्यन्तरात्, अतो ब्रह्म आत्मा, तस्मादेतस्माद्ब्रह्मण आत्मस्वरूपात् आकाशः सम्भूतः समुत्पन्नः।", "padacchedaText": "", "audioFile": "PB_000809.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000810", "originalText": "आकाशो नाम शब्दगुणः अवकाशकरो मूर्तद्रव्याणाम्।", "padacchedaText": "", "audioFile": "PB_000810.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000811", "originalText": "तस्मात् आकाशात् स्वेन स्पर्शगुणेन पूर्वेण च आकाशगुणेन शब्देन द्विगुणः वायुः, सम्भूत इत्यनुवर्तते।", "padacchedaText": "", "audioFile": "PB_000811.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000812", "originalText": "वायोश्च स्वेन रूपगुणेन पूर्वाभ्यां च त्रिगुणः अग्निः सम्भूतः।", "padacchedaText": "", "audioFile": "PB_000812.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000813", "originalText": "अग्नेश्च स्वेन रसगुणेन पूर्वैश्च त्रिभिः चतुर्गुणा आपः सम्भूताः।", "padacchedaText": "", "audioFile": "PB_000813.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000814", "originalText": "अद्भ्यः स्वेन गन्धगुणेन पूर्वैश्च चतुर्भिः पञ्चगुणा पृथिवी सम्भूता।", "padacchedaText": "", "audioFile": "PB_000814.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000815", "originalText": "पृथिव्याः ओषधयः।", "padacchedaText": "", "audioFile": "PB_000815.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000816", "originalText": "ओषधीभ्यः अन्नम्।", "padacchedaText": "", "audioFile": "PB_000816.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000817", "originalText": "अन्नात् रेतोरूपेण परिणतात् पुरुषः शिरः— पाण्याद्याकृतिमान्।", "padacchedaText": "", "audioFile": "PB_000817.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000818", "originalText": "स वै एष पुरुषः अन्नरसमयः अन्नरसविकारः पुरुषाकृतिभावितं हि सर्वेभ्योऽङ्गेभ्यः तेजःसम्भूतं रेतो बीजम्।", "padacchedaText": "", "audioFile": "PB_000818.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000819", "originalText": "तस्माद्यो जायते, सोऽपि तथा पुरुषाकृतिरेव स्यात्, सर्वजातिषु जायमानानां जनकाकृतिनियमदर्शनात्।", "padacchedaText": "", "audioFile": "PB_000819.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000820", "originalText": "सर्वेषामप्यन्नरसविकारत्वे ब्रह्मवंश्यत्वे च अविशिष्टे, कस्मात्पुरुष एव गृह्यते? प्राधान्यात्।", "padacchedaText": "", "audioFile": "PB_000820.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000821", "originalText": "किं पुनः प्राधान्यम्? कर्मज्ञानाधिकारः।", "padacchedaText": "", "audioFile": "PB_000821.wav", "zipFile": "007_TaittiriyaBhashya.zip"}, {"id": "B_000822", "originalText": "पुरुष एव हि शक्तत्वादर्थित्वादपर्युदस्तत्वाच्च कर्मज्ञानयोरधिक्रियते, ‘पुरुषे त्वेवाविस्तरामात्मा स हि प्रज्ञानेन सम्पन्नतमो विज्ञातं वदति विज्ञातं पश्यति वेद श्वस्तनं वेद लोकालोकौ मर्त्येनामतमीक्षतीत्येवं सम्पन्नः, अथेतरेषा
