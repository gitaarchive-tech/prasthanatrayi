PadaBhashya.zip"}, {"id": "B_000008", "originalText": "तदेतद्वस्तु प्रश्नप्रतिवचनलक्षणया श्रुत्या प्रदर्श्यते ‘केनेषितम्’ इत्याद्यया।", "padacchedaText": "", "audioFile": "PB_000008.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000009", "originalText": "काठके चोक्तम् ‘पराञ्चि खानि व्यतृणत्स्वयम्भूस्तस्मात्पराङ् पश्यति नान्तरात्मन्।", "padacchedaText": "", "audioFile": "PB_000009.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000010", "originalText": "कश्चिद्धीरः प्रत्यगात्मानमैक्षदावृत्तचक्षुरमृतत्वमिच्छन्’ (क.२.१.१) इत्यादि।", "padacchedaText": "", "audioFile": "PB_000010.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000011", "originalText": "‘परीक्ष्य लोकान्कर्मचितान्ब्राह्मणो निर्वेदमायान्नास्त्यकृतः कृतेन।", "padacchedaText": "", "audioFile": "PB_000011.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000012", "originalText": "तद्विज्ञानार्थं स गुरुमेवाभिगच्छेत्समित्पाणिः श्रोत्रियं ब्रह्मनिष्ठम्’ (मु.१.२.१२) इत्याद्याथर्वणे च।", "padacchedaText": "", "audioFile": "PB_000012.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000013", "originalText": "एवं हि विरक्तस्य प्रत्यगात्मविषयं विज्ञानं श्रोतुं मन्तुं विज्ञातुं च सामर्थ्यमुपपद्यते, नान्यथा।", "padacchedaText": "", "audioFile": "PB_000013.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000014", "originalText": "एतस्माच्च प्रत्यगात्मब्रह्मविज्ञानात्संसारबीजमज्ञानं कामकर्मप्रवृत्तिकारणमशेषतो निवर्तते, ‘तत्र को मोहः कः शोक एकत्वमनुपश्यतः’ (ई.७) इति मन्त्रवर्णात्, ‘तरति शोकमात्मवित्’ (छा.७.१.३) ‘भिद्यते हृदयग्रन्थिश्छिद्यन्ते सर्वसंशयाः।", "padacchedaText": "", "audioFile": "PB_000014.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000015", "originalText": "क्षीयन्ते चास्य कर्माणि तस्मिन्दृष्टे परावरे’ (मु.२.२.९) इत्यादिश्रुतिभ्यश्च।", "padacchedaText": "", "audioFile": "PB_000015.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000016", "originalText": "कर्मसहितादपि ज्ञानादेतत्सिध्यतीति चेत्, न, वाजसनेयके तस्यान्यकारणत्ववचनात्।", "padacchedaText": "", "audioFile": "PB_000016.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000017", "originalText": "‘जाया मे स्यात्’ (बृ.१.४.१७) इति प्रस्तुत्य ‘पुत्रेणायं लोको जय्यो नान्येन कर्मणा, कर्मणा पितृलोको विद्यया देवलोकः’ (बृ.१.५.१६) इत्यात्मनोऽन्यस्य लोकत्रयस्य कारणत्वमुक्तं वाजसनेयके।", "padacchedaText": "", "audioFile": "PB_000017.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000018", "originalText": "तत्रैव च पारिव्राज्यविधाने हेतुरुक्तः ‘किं प्रजया करिष्यामो येषां नोऽयमात्मायं लोकः’ (बृ.४.४.२२) इति।", "padacchedaText": "", "audioFile": "PB_000018.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000019", "originalText": "तत्रायं हेत्वर्थः— प्रजाकर्मतत्संयुक्तविद्याभिर्मनुष्यपितृदेवलोकत्रयसाधनैरनात्मलोकप्रतिपत्तिकारणैः किं करिष्यामः।", "padacchedaText": "", "audioFile": "PB_000019.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000020", "originalText": "न चास्माकं लोकत्रयमनित्यं साधनसाध्यमिष्टम्, येषामस्माकं स्वाभाविकोऽजोऽजरोऽमृतोऽभयो न वर्धते कर्मणा नो कनीयान्नित्यश्च लोक इष्टः।", "padacchedaText": "", "audioFile": "PB_000020.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000021", "originalText": "स च नित्यत्वान्नाविद्यानिवृत्तिव्यतिरेकेणान्यसाधननिष्पाद्यः।", "padacchedaText": "", "audioFile": "PB_000021.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000022", "originalText": "तस्मात्प्रत्यगात्मब्रह्मविज्ञानपूर्वकः सर्वैषणासंन्यास एव कर्तव्य इति।", "padacchedaText": "", "audioFile": "PB_000022.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000023", "originalText": "कर्मसहभावित्वविरोधाच्च प्रत्यगात्मब्रह्मविज्ञानस्य।", "padacchedaText": "", "audioFile": "PB_000023.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000024", "originalText": "न ह्युपात्तकारकफलभेदविज्ञानेन कर्मणा प्रत्यस्तमितसर्वभेददर्शनस्य प्रत्यगात्मब्रह्मविषयस्य सहभावित्वमुपपद्यते, वस्तुप्राधान्ये सत्यपुरुषतन्त्रत्वाद्ब्रह्मविज्ञानस्य।", "padacchedaText": "", "audioFile": "PB_000024.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000025", "originalText": "तस्माद्दृष्टादृष्टेभ्यो बाह्यसाधनसाध्येभ्यो विरक्तस्य प्रत्यगात्मविषया ब्रह्मजिज्ञासेयम् ‘केनेषितम्’ इत्यादिश्रुत्या प्रदर्श्यते।", "padacchedaText": "", "audioFile": "PB_000025.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000026", "originalText": "शिष्याचार्यप्रश्नप्रतिवचनरूपेण कथनं तु सूक्ष्मवस्तुविषयत्वात्सुखप्रतिपत्तिकारणं भवति। केवलतर्कागम्यत्वं च दर्शितं भवति॥", "padacchedaText": "", "audioFile": "PB_000026.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000027", "originalText": "केनेषितं पतति प्रेषितं मनः केन प्राणः प्रथमः प्रैति युक्तः। केनेषितां वाचमिमां वदन्ति चक्षुःश्रोत्रं क उ देवो युनक्ति॥ १॥", "padacchedaText": "", "audioFile": "PB_000027.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000028", "originalText": "‘नैषा तर्केण मतिरापनेया’ (क.१.२.९) इति श्रुतेश्च।", "padacchedaText": "", "audioFile": "PB_000028.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000029", "originalText": "‘आचार्यवान्पुरुषो वेद’ (छा.६.१४.२) ‘आचार्याद्धैव विद्या विदिता साधिष्ठं प्रापदिति’ (छा.४.९.३) ‘तद्विद्धि प्रणिपातेन’ (भ.गी.४.३४) इत्यादिश्रुतिस्मृतिनियमाच्च कश्चिद्गुरुं ब्रह्मनिष्ठं विधिवदुपेत्य प्रत्यगात्मविषयादन्यत्र शरणमपश्यन्नभयं नित्यं शिवमचलमिच्छन्पप्रच्छेति कल्प्यते— केनेषितमित्यादि।", "padacchedaText": "", "audioFile": "PB_000029.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000030", "originalText": "केन इषितं केन कर्त्रा इषितम् इष्टमभिप्रेतं सत् मनः पतति गच्छति स्वविषयं प्रतीति सम्बध्यते।", "padacchedaText": "", "audioFile": "PB_000030.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000031", "originalText": "इषेराभीक्ष्ण्यार्थस्य गत्यर्थस्य चेहासम्भवादिच्छार्थस्यैवैतद्रूपमिति गम्यते।", "padacchedaText": "", "audioFile": "PB_000031.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000032", "originalText": "इषितमिति इट्प्रयोगस्तु च्छान्दसः।", "padacchedaText": "", "audioFile": "PB_000032.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000033", "originalText": "तस्यैव प्रपूर्वस्य नियोगार्थे प्रेषितमित्येतत्।", "padacchedaText": "", "audioFile": "PB_000033.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000034", "originalText": "तत्र प्रेषितमित्येवोक्ते प्रेषयितृप्रेषणविशेषविषयाकाङ्क्षा स्यात्— केन प्रेषयितृविशेषेण, कीदृशं वा प्रेषणमिति।", "padacchedaText": "", "audioFile": "PB_000034.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000035", "originalText": "इषितमिति तु विशेषणे सति तदुभयं निवर्तते, कस्येच्छामात्रेण प्रेषितमित्यर्थविशेषनिर्धारणात्।", "padacchedaText": "", "audioFile": "PB_000035.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000036", "originalText": "यद्येषोऽर्थोऽभिप्रेतः स्यात्, केनेषितमित्येतावतैव सिद्धत्वात्प्रेषितमिति न वक्तव्यम्।", "padacchedaText": "", "audioFile": "PB_000036.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000037", "originalText": "अपि च शब्दाधिक्यादर्थाधिक्यं युक्तमिति इच्छया कर्मणा वाचा वा केन प्रेषितमित्यर्थविशेषोऽवगन्तुं युक्तः।", "padacchedaText": "", "audioFile": "PB_000037.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000038", "originalText": "न, प्रश्नसामर्थ्यात्, देहादिसङ्घातादनित्यात्कर्मकार्याद्विरक्तः अतोऽन्यत्कूटस्थं नित्यं वस्तु बुभुत्समानः पृच्छतीति सामर्थ्यादुपपद्यते।", "padacchedaText": "", "audioFile": "PB_000038.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000039", "originalText": "इतरथा इच्छावाक्कर्मभिर्देहादिसङ्घातस्य प्रेरयितृत्वं प्रसिद्धमिति प्रश्नोऽनर्थक एव स्यात्।", "padacchedaText": "", "audioFile": "PB_000039.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000040", "originalText": "एवमपि प्रेषितशब्दस्यार्थो न प्रदर्शित एव।", "padacchedaText": "", "audioFile": "PB_000040.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000041", "originalText": "न, संशयवतोऽयं प्रश्न इति प्रेषितशब्दस्यार्थविशेष उपपद्यते।", "padacchedaText": "", "audioFile": "PB_000041.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000042", "originalText": "किं यथाप्रसिद्धमेव कार्यकरणसङ्घातस्य प्रेषयितृत्वम्, किं वा सङ्घातव्यतिरिक्तस्य स्वतन्त्रस्येच्छामात्रेणैव मनआदिप्रेषयितृत्वम्, इत्यस्यार्थस्य प्रदर्शनार्थं केनेषितं पतति प्रेषितं मन इति विशेषणद्वयमुपपद्यते।", "padacchedaText": "", "audioFile": "PB_000042.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000043", "originalText": "ननु स्वतन्त्रं मनः स्वविषये स्वयं पततीति प्रसिद्धम्, तत्र कथं प्रश्न उपपद्यते इति, उच्यते— यदि स्वतन्त्रं मनः प्रवृत्तिनिवृत्तिविषये स्यात्, तर्हि सर्वस्यानिष्टचिन्तनं न स्यात्।", "padacchedaText": "", "audioFile": "PB_000043.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000044", "originalText": "अनर्थं च जानन्सङ्कल्पयति।", "padacchedaText": "", "audioFile": "PB_000044.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000045", "originalText": "अभ्यग्रदुःखे च कार्ये वार्यमाणमपि प्रवर्तत एव मनः।", "padacchedaText": "", "audioFile": "PB_000045.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000046", "originalText": "तस्माद्युक्त एव केनेषितमित्यादिप्रश्नः।", "padacchedaText": "", "audioFile": "PB_000046.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000047", "originalText": "केन प्राणः युक्तः नियुक्तः प्रेरितः सन् प्रैति गच्छति स्वव्यापारं प्रति।", "padacchedaText": "", "audioFile": "PB_000047.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000048", "originalText": "प्रथम इति प्राणविशेषणं स्यात्, तत्पूर्वकत्वात्सर्वेन्द्रियप्रवृत्तीनाम्।", "padacchedaText": "", "audioFile": "PB_000048.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000049", "originalText": "केन इषितां वाचम् इमां शब्दलक्षणां वदन्ति लौकिकाः। तथा चक्षुः श्रोत्रं च स्वे स्वे विषये क उ देवः द्योतनवान् युनक्ति नियुङ्क्ते प्रेरयति॥", "padacchedaText": "", "audioFile": "PB_000049.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000050", "originalText": "श्रोत्रस्य श्रोत्रं मनसो मनो यद्वाचो ह वाचं स उ प्राणस्य प्राणः। चक्षुषश्चक्षुरतिमुच्य धीराः प्रेत्यास्माल्लोकादमृता भवन्ति॥ २॥", "padacchedaText": "", "audioFile": "PB_000050.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000051", "originalText": "एवं पृष्टवते योग्यायाह गुरुः।", "padacchedaText": "", "audioFile": "PB_000051.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000052", "originalText": "शृणु यत् त्वं पृच्छसि, मनआदिकरणजातस्य को देवः स्वविषयं प्रति प्रेरयिता कथं वा प्रेरयतीति।", "padacchedaText": "", "audioFile": "PB_000052.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000053", "originalText": "श्रोत्रस्य श्रोत्रं शृणोत्यनेनेति श्रोत्रम्, शब्दस्य श्रवणं प्रति करणं शब्दाभिव्यञ्जकं श्रोत्रमिन्द्रियम्, तस्य श्रोत्रं सः यस्त्वया पृष्टः ‘चक्षुःश्रोत्रं क उ देवो युनक्ति’ (के.१.१) इति।", "padacchedaText": "", "audioFile": "PB_000053.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000054", "originalText": "असावेवंविशिष्टः श्रोत्रादीनि नियुङ्क्त इति वक्तव्ये, नन्वेतदननुरूपं प्रतिवचनं श्रोत्रस्य श्रोत्रमिति।", "padacchedaText": "", "audioFile": "PB_000054.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000055", "originalText": "नैष दोषः, तस्यान्यथा विशेषानवगमात्।", "padacchedaText": "", "audioFile": "PB_000055.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000056", "originalText": "यदि हि श्रोत्रादिव्यापारव्यतिरिक्तेन स्वव्यापारेण विशिष्टः श्रोत्रादिनियोक्ता अवगम्येत दात्रादिप्रयोक्तृवत्, तदेदमननुरूपं प्रतिवचनं स्यात्।", "padacchedaText": "", "audioFile": "PB_000056.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000057", "originalText": "न त्विह श्रोत्रादीनां प्रयोक्ता स्वव्यापारविशिष्टो लवित्रादिवदधिगम्यते।", "padacchedaText": "", "audioFile": "PB_000057.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000058", "originalText": "श्रोत्रादीनामेव तु संहतानां व्यापारेणालोचनसङ्कल्पाध्यवसायलक्षणेन फलावसानलिङ्गेनावगम्यते— अस्ति हि श्रोत्रादिभिरसंहतः, यत्प्रयोजनप्रयुक्तः श्रोत्रादिकलापः गृहादिवदिति।", "padacchedaText": "", "audioFile": "PB_000058.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000059", "originalText": "संहतानां परार्थत्वादवगम्यते श्रोत्रादीनां प्रयोक्ता।", "padacchedaText": "", "audioFile": "PB_000059.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000060", "originalText": "तस्मादनुरूपमेवेदं प्रतिवचनं श्रोत्रस्य श्रोत्रमित्यादि।", "padacchedaText": "", "audioFile": "PB_000060.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000061", "originalText": "कः पुनरत्र पदार्थः श्रोत्रस्य श्रोत्रमित्यादेः? न ह्यत्र श्रोत्रस्य श्रोत्रान्तरेणार्थः, यथा प्रकाशस्य प्रकाशान्तरेण।", "padacchedaText": "", "audioFile": "PB_000061.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000062", "originalText": "नैष दोषः।", "padacchedaText": "", "audioFile": "PB_000062.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000063", "originalText": "अयमत्र पदार्थः— श्रोत्रं तावत्स्वविषयव्यञ्जनसमर्थं दृष्टम्।", "padacchedaText": "", "audioFile": "PB_000063.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000064", "originalText": "तत्तु स्वविषयव्यञ्जनसामर्थ्यं श्रोत्रस्य चैतन्ये ह्यात्मज्योतिषि नित्येऽसंहते सर्वान्तरे सति भवति, न असति इति।", "padacchedaText": "", "audioFile": "PB_000064.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000065", "originalText": "अतः श्रोत्रस्य श्रोत्रमित्याद्युपपद्यते।", "padacchedaText": "", "audioFile": "PB_000065.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000066", "originalText": "तथा च श्रुत्यन्तराणि— ‘आत्मनैवायं ज्योतिषास्ते’ (बृ.४.३.६) ‘तस्य भासा सर्वमिदं विभाति’ (मु.२.२.१०) ‘येन सूर्यस्तपति तेजसेद्धः’ (तै.ब्रा.३.१२.९.७) इत्यादीनि।", "padacchedaText": "", "audioFile": "PB_000066.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000067", "originalText": "‘यदादित्यगतं तेजो जगद्भासयतेऽखिलम्।", "padacchedaText": "", "audioFile": "PB_000067.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000068", "originalText": "’ (भ.गी.१५.१२) ‘क्षेत्रं क्षेत्री तथा कृत्स्नं प्रकाशयति भारत’ (भ.गी.१३.३३) इति च गीतासु।", "padacchedaText": "", "audioFile": "PB_000068.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000069", "originalText": "काठके च ‘नित्यो नित्यानां चेतनश्चेतनानाम्’ (क.२.२.१३) इति।", "padacchedaText": "", "audioFile": "PB_000069.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000070", "originalText": "श्रोत्राद्येव सर्वस्यात्मभूतं चेतनमिति प्रसिद्धम्, तदिह निवर्त्यते।", "padacchedaText": "", "audioFile": "PB_000070.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000071", "originalText": "अस्ति किमपि विद्वद्बुद्धिगम्यं सर्वान्तरतमं कूटस्थमजमजरममृतमभयं श्रोत्रादेरपि श्रोत्रादि तत्सामर्थ्यनिमित्तम् इति प्रतिवचनं शब्दार्थश्चोपपद्यत एव।", "padacchedaText": "", "audioFile": "PB_000071.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000072", "originalText": "तथा मनसः अन्तःकरणस्य मनः।", "padacchedaText": "", "audioFile": "PB_000072.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000073", "originalText": "न ह्यन्तःकरणम् अन्तरेण चैतन्यज्योतिषो दीधितिं स्वविषयसङ्कल्पाध्यवसायादिसमर्थं स्यात्।", "padacchedaText": "", "audioFile": "PB_000073.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000074", "originalText": "तस्मान्मनसोऽपि मन इति।", "padacchedaText": "", "audioFile": "PB_000074.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000075", "originalText": "इह बुद्धिमनसी एकीकृत्य निर्देशो मनस इति।", "padacchedaText": "", "audioFile": "PB_000075.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000076", "originalText": "यद्वाचो ह वाचम्, यच्छब्दो यस्मादर्थे श्रोत्रादिभिः सर्वैः सम्बध्यते— यस्माच्छ्रोत्रस्य श्रोत्रम्, यस्मान्मनसो मन इत्येवम्।", "padacchedaText": "", "audioFile": "PB_000076.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000077", "originalText": "वाचो ह वाचमिति द्वितीया प्रथमात्वेन विपरिणम्यते, प्राणस्य प्राण इति दर्शनात्।", "padacchedaText": "", "audioFile": "PB_000077.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000078", "originalText": "वाचो ह वाचमित्येतदनुरोधेन प्राणस्य प्राणमिति कस्माद्द्वितीयैव न क्रियते? न, बहूनामनुरोधस्य युक्तत्वात्।", "padacchedaText": "", "audioFile": "PB_000078.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000079", "originalText": "वाचमित्यस्य वागित्येतावद्वक्तव्यं स उ प्राणस्य प्राण इति शब्दद्वयानुरोधेन, एवं हि बहूनामनुरोधो युक्तः कृतः स्यात्।", "padacchedaText": "", "audioFile": "PB_000079.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000080", "originalText": "पृष्टं च वस्तु प्रथमयैव निर्देष्टुं युक्तम्।", "padacchedaText": "", "audioFile": "PB_000080.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000081", "originalText": "स यस्त्वया पृष्टः प्राणस्य प्राणाख्यवृत्तिविशेषस्य प्राणः, तत्कृतं हि प्राणस्य प्राणनसामर्थ्यम्।", "padacchedaText": "", "audioFile": "PB_000081.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000082", "originalText": "न ह्यात्मनानधिष्ठितस्य प्राणनमुपपद्यते, ‘को ह्येवान्यात्कः प्राण्याद्यदेष आकाश आनन्दो न स्यात्’ (तै.२.७.१) ‘ऊर्ध्वं प्राणमुन्नयत्यपानं प्रत्यगस्यति’ (क.२.२.३) इत्यादिश्रुतिभ्यः।", "padacchedaText": "", "audioFile": "PB_000082.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000083", "originalText": "इहापि च वक्ष्यते ‘येन प्राणः प्रणीयते तदेव ब्रह्म त्वं विद्धि’ (के.१.८) इति।", "padacchedaText": "", "audioFile": "PB_000083.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000084", "originalText": "श्रोत्रादीन्द्रियप्रस्तावे घ्राणस्येव प्राणस्य न तु युक्तं ग्रहणम्।", "padacchedaText": "", "audioFile": "PB_000084.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000085", "originalText": "सत्यमेवम्।", "padacchedaText": "", "audioFile": "PB_000085.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000086", "originalText": "प्राणग्रहणेनैव तु घ्राणस्य ग्रहणं कृतमेव मन्यते श्रुतिः।", "padacchedaText": "", "audioFile": "PB_000086.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000087", "originalText": "सर्वस्यैव करणकलापस्य यदर्थप्रयुक्ता प्रवृत्तिः, तद्ब्रह्मेति प्रकरणार्थो विवक्षितः।", "padacchedaText": "", "audioFile": "PB_000087.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000088", "originalText": "तथा चक्षुषश्चक्षुः रूपप्रकाशकस्य चक्षुषो यद्रूपग्रहणसामर्थ्यं तदात्मचैतन्याधिष्ठितस्यैव।", "padacchedaText": "", "audioFile": "PB_000088.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000089", "originalText": "अतश्चक्षुषश्चक्षुः।", "padacchedaText": "", "audioFile": "PB_000089.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000090", "originalText": "प्रष्टुः पृष्टस्यार्थस्य ज्ञातुमिष्टत्वात् श्रोत्रादेः श्रोत्रादिलक्षणं यथोक्तं ब्रह्म ‘ज्ञात्वा’ इत्यध्याह्रियते, अमृता भवन्ति इति फलश्रुतेश्च।", "padacchedaText": "", "audioFile": "PB_000090.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000091", "originalText": "ज्ञानाद्ध्यमृतत्वं प्राप्यते।", "padacchedaText": "", "audioFile": "PB_000091.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000092", "originalText": "ज्ञात्वा अतिमुच्य इति सामर्थ्यात् श्रोत्रादिकरणकलापमुज्झित्वा— श्रोत्रादौ ह्यात्मभावं कृत्वा, तदुपाधिः सन्, तदात्मना जायते म्रियते संसरति च।", "padacchedaText": "", "audioFile": "PB_000092.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000093", "originalText": "अतः श्रोत्रादेः श्रोत्रादिलक्षणं ब्रह्मात्मेति विदित्वा, अतिमुच्य श्रोत्राद्यात्मभावं परित्यज्य— ये श्रोत्राद्यात्मभावं परित्यजन्ति, ते धीराः धीमन्तः।", "padacchedaText": "", "audioFile": "PB_000093.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000094", "originalText": "न हि विशिष्टधीमत्त्वमन्तरेण श्रोत्राद्यात्मभावः शक्यः परित्युक्तम्।", "padacchedaText": "", "audioFile": "PB_000094.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000095", "originalText": "प्रेत्य व्यावृत्य अस्मात् लोकात् पुत्रमित्रकलत्रबन्धुषु ममाहम्भावसंव्यवहारलक्षणात्, त्यक्तसर्वैषणा भूत्वेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000095.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000096", "originalText": "अमृताः अमरणधर्माणः भवन्ति।", "padacchedaText": "", "audioFile": "PB_000096.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000097", "originalText": "‘न कर्मणा न प्रजया धनेन त्यागेनैके अमृतत्वमानशुः’ (तै.ना.२८) ‘पराञ्चि खानि व्यतृणत्... आवृत्तचक्षुरमृतत्वमिच्छन्’ (क.२.१.१) ‘यदा सर्वे प्रमुच्यन्ते... अत्र ब्रह्म समश्नुते’ (क.२.३.१४) इत्यादिश्रुतिभ्यः।", "padacchedaText": "", "audioFile": "PB_000097.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000098", "originalText": "अथवा, अतिमुच्येत्यनेनैवैषणात्यागस्य सिद्धत्वात् अस्माल्लोकात्प्रेत्य अस्माच्छरीरादपेत्य मृत्वेत्यर्थः॥", "padacchedaText": "", "audioFile": "PB_000098.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000099", "originalText": "न तत्र चक्षुर्गच्छति न वाग्गच्छति नो मनः। न विद्मो न विजानीमो यथैतदनुशिष्यात्॥ ३॥", "padacchedaText": "", "audioFile": "PB_000099.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000100", "originalText": "यस्माच्छ्रोत्रादेरपि श्रोत्राद्यात्मभूतं ब्रह्म, अतः न तत्र तस्मिन्ब्रह्मणि चक्षुः गच्छति, स्वात्मनि गमनासम्भवात्।", "padacchedaText": "", "audioFile": "PB_000100.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000101", "originalText": "तथा न वाक् गच्छति।", "padacchedaText": "", "audioFile": "PB_000101.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000102", "originalText": "वाचा हि शब्द उच्चार्यमाणोऽभिधेयं प्रकाशयति यदा, तदाभिधेयं प्रति वाग्गच्छतीत्युच्यते।", "padacchedaText": "", "audioFile": "PB_000102.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000103", "originalText": "तस्य च शब्दस्य तन्निर्वर्तकस्य च करणस्यात्मा ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000103.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000104", "originalText": "अतो न वाग्गच्छति।", "padacchedaText": "", "audioFile": "PB_000104.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000105", "originalText": "यथाग्निर्दाहकः प्रकाशकश्चापि सन् न ह्यात्मानं प्रकाशयति दहति वा, तद्वत्।", "padacchedaText": "", "audioFile": "PB_000105.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000106", "originalText": "नो मनः मनश्चान्यस्य सङ्कल्पयितृ अध्यवसातृ च सत् नात्मानं सङ्कल्पयत्यध्यवस्यति च, तस्यापि ब्रह्मात्मेति।", "padacchedaText": "", "audioFile": "PB_000106.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000107", "originalText": "इन्द्रियमनोभ्यां हि वस्तुनो विज्ञानम्।", "padacchedaText": "", "audioFile": "PB_000107.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000108", "originalText": "तदगोचरत्वात् न विद्मः तद्ब्रह्म ईदृशमिति।", "padacchedaText": "", "audioFile": "PB_000108.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000109", "originalText": "अतो न विजानीमः यथा येन प्रकारेण एतत् ब्रह्म अनुशिष्यात् उपदिशेच्छिष्यायेत्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_000109.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000110", "originalText": "यद्धि करणगोचरः, तदन्यस्मै उपदेष्टुं शक्यं जातिगुणक्रियाविशेषणैः।", "padacchedaText": "", "audioFile": "PB_000110.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000111", "originalText": "न तज्जात्यादिविशेषणवद्ब्रह्म। तस्माद्विषमं शिष्यानुपदेशेन प्रत्याययितुमिति उपदेशे तदर्थग्रहणे च यत्नातिशयकर्तव्यतां दर्शयति॥", "padacchedaText": "", "audioFile": "PB_000111.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000112", "originalText": "अन्यदेव तद्विदितादथो अविदितादधि। इति शुश्रुम पूर्वेषां ये नस्तद्व्याचचक्षिरे॥ ४॥", "padacchedaText": "", "audioFile": "PB_000112.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000113", "originalText": "‘न विद्मो न विजानीमो यथैतदनुशिष्यात्’ (के.१.३) इति अत्यन्तमेवोपदेशप्रकारप्रत्याख्याने प्राप्ते तदपवादोऽयमुच्यते।", "padacchedaText": "", "audioFile": "PB_000113.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000114", "originalText": "सत्यमेवं प्रत्यक्षादिभिः प्रमाणैर्न परः प्रत्याययितुं शक्यः, आगमेन तु शक्यत एव प्रत्याययितुमिति तदुपदेशार्थमागममाह— अन्यदेव तद्विदितादथो अविदितादधीति।", "padacchedaText": "", "audioFile": "PB_000114.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000115", "originalText": "अन्यदेव पृथगेव तत् यत्प्रकृतं श्रोत्रादीनां श्रोत्रादीत्युक्तमविषयश्च तेषाम्।", "padacchedaText": "", "audioFile": "PB_000115.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000116", "originalText": "तत् विदितात् अन्यदेव हि।", "padacchedaText": "", "audioFile": "PB_000116.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000117", "originalText": "विदितं नाम यद्विदिक्रिययातिशयेनाप्तं विदिक्रियाकर्मभूतम्।", "padacchedaText": "", "audioFile": "PB_000117.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000118", "originalText": "क्वचित्किञ्चित्कस्यचिद्विदितं स्यादिति सर्वमेव व्याकृतं विदितमेव, तस्मादन्यदेवेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000118.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000119", "originalText": "अविदितमज्ञातं तर्हीति प्राप्ते आह— अथो अपि अविदितात् विदितविपरीतादव्याकृतादविद्यालक्षणाद्व्याकृतबीजात्।", "padacchedaText": "", "audioFile": "PB_000119.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000120", "originalText": "अधि इति उपर्यर्थे, लक्षणया अन्यदित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000120.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000121", "originalText": "यद्धि यस्मादधि उपरि भवति, तत्तस्मादन्यदिति प्रसिद्धम्।", "padacchedaText": "", "audioFile": "PB_000121.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000122", "originalText": "यद्विदितं तदल्पं मर्त्यं दुःखात्मकं चेति हेयम्।", "padacchedaText": "", "audioFile": "PB_000122.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000123", "originalText": "तस्माद्विदितादन्यद्ब्रह्मेत्युक्ते त्वहेयत्वमुक्तं स्यात्।", "padacchedaText": "", "audioFile": "PB_000123.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000124", "originalText": "तथा अविदितादधीत्युक्तेऽनुपादेयत्वमुक्तं स्यात्।", "padacchedaText": "", "audioFile": "PB_000124.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000125", "originalText": "कार्यार्थं हि कारणमन्यदन्येनोपादीयते।", "padacchedaText": "", "audioFile": "PB_000125.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000126", "originalText": "अतश्च न वेदितुरन्यस्मै प्रयोजनायान्यदुपादेयं भवतीत्येवं विदिताविदिताभ्यामन्यदिति हेयोपादेयप्रतिषेधेन स्वात्मनोऽनन्यत्वात् ब्रह्मविषया जिज्ञासा शिष्यस्य निर्वर्तिता स्यात्।", "padacchedaText": "", "audioFile": "PB_000126.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000127", "originalText": "न ह्यन्यस्य स्वात्मनो विदिताविदिताभ्यामन्यत्वं वस्तुनः सम्भवतीत्यात्मा ब्रह्मेत्येष वाक्यार्थः, ‘अयमात्मा ब्रह्म’ (बृ.४.४.५) ‘य आत्मापहतपाप्मा’ (छा.८.७.१) ‘यत्साक्षादपरोक्षाद्ब्रह्म य आत्मा सर्वान्तरः’ (बृ.३.४.१) इत्यादिश्रुत्यन्तरेभ्यश्चेति।", "padacchedaText": "", "audioFile": "PB_000127.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000128", "originalText": "एवं सर्वात्मनः सर्वविशेषरहितस्य चिन्मात्रज्योतिषो ब्रह्मत्वप्रतिपादकस्य वाक्यार्थस्याचार्योपदेशपरम्परया प्राप्तत्वमाह— इति शुश्रुमेत्यादि।", "padacchedaText": "", "audioFile": "PB_000128.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000129", "originalText": "ब्रह्म चैवमाचार्योपदेशपरम्परयैवाधिगन्तव्यं न तर्कतः प्रवचनमेधाबहुश्रुततपोयज्ञादिभ्यश्च, इति एवं शुश्रुम श्रुतवन्तो वयं पूर्वेषाम् आचार्याणां वचनम्, ये आचार्याः नः अस्मभ्यं तत् ब्रह्म व्याचचक्षिरे व्याख्यातवन्तः विस्पष्टं कथितवन्तः तेषामित्यर्थः॥", "padacchedaText": "", "audioFile": "PB_000129.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000130", "originalText": "यद्वाचानभ्युदितं येन वागभ्युद्यते। तदेव ब्रह्म त्वं विद्धि नेदं यदिदमुपासते॥ ५॥", "padacchedaText": "", "audioFile": "PB_000130.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000131", "originalText": "‘अन्यदेव तद्विदितादथो अविदितादधि’ (के.१.४) इत्यनेन वाक्येन आत्मा ब्रह्मेति प्रतिपादिते श्रोतुराशङ्का जाता— कथं न्वात्मा ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000131.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000132", "originalText": "आत्मा हि नामाधिकृतः कर्मण्युपासने च संसारी कर्मोपासनं वा साधनमनुष्ठाय ब्रह्मादिदेवान्स्वर्गं वा प्राप्तुमिच्छति।", "padacchedaText": "", "audioFile": "PB_000132.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000133", "originalText": "तत्तस्मादन्य उपास्यो विष्णुरीश्वर इन्द्रः प्राणो वा ब्रह्म भवितुमर्हति, न त्वात्मा, लोकप्रत्ययविरोधात्।", "padacchedaText": "", "audioFile": "PB_000133.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000134", "originalText": "यथान्ये तार्किका ईश्वरादन्य आत्मेत्याचक्षते, तथा कर्मिणोऽमुं यजामुं यजेत्यन्या एव देवता उपासते।", "padacchedaText": "", "audioFile": "PB_000134.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000135", "originalText": "तस्माद्युक्तं यद्विदितमुपास्यं तद्ब्रह्म भवेत्, ततोऽन्य उपासक इति।", "padacchedaText": "", "audioFile": "PB_000135.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000136", "originalText": "तामेतामाशङ्कां शिष्यलिङ्गेनोपलक्ष्य तद्वाक्याद्वा आह— मैवं शङ्किष्ठाः।", "padacchedaText": "", "audioFile": "PB_000136.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000137", "originalText": "यत् चैतन्यमात्रसत्ताकम्, वाचा— वागिति जिह्वामूलादिष्वष्टसु स्थानेषु विषक्तमाग्नेयं वर्णानामभिव्यञ्जकं करणम्, वर्णाश्चार्थसङ्केतपरिच्छिन्ना एतावन्त एवंक्रमप्रयुक्ता इति, एवं तदभिव्यङ्ग्यः शब्दः पदं वागित्युच्यते, ‘अकारो वै सर्वा वाक्सैषास्य स्पर्शान्तःस्थोष्मभिर्व्यज्यमाना बह्वी नानारूपा भवति’ (ऐ.आ.२.३.६) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_000137.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000138", "originalText": "मितममितं स्वरः सत्यानृते एष विकारो यस्याः तया वाचा पदत्वेन परिच्छिन्नया करणगुणवत्या— अनभ्युदितम् अप्रकाशितमनभ्युक्तम्।", "padacchedaText": "", "audioFile": "PB_000138.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000139", "originalText": "येन ब्रह्मणा विवक्षितेऽर्थे सकरणा वाक् अभ्युद्यते चैतन्यज्योतिषा प्रकाश्यते प्रयुज्यत इत्येतत्।", "padacchedaText": "", "audioFile": "PB_000139.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000140", "originalText": "यत् ‘वाचो ह वाक्’ (के.१.२) इत्युक्तम्, ‘वदन्वाक्’ (बृ.१.४.७) ‘यो वाचमन्तरो यमयति’ (बृ.३.७.१०) इत्यादि च वाजसनेयके।", "padacchedaText": "", "audioFile": "PB_000140.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000141", "originalText": "‘या वाक् पुरुषेषु सा घोषेषु प्रतिष्ठिता कश्चित्तां वेद ब्राह्मणः’ इति प्रश्नमुत्पाद्य प्रतिवचनमुक्तम् ‘सा वाग्यया स्वप्ने भाषते’ (?) इति।", "padacchedaText": "", "audioFile": "PB_000141.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000142", "originalText": "सा हि वक्तुर्वक्तिर्नित्या वाक् चैतन्यज्योतिःस्वरूपा, ‘न हि वक्तुर्वक्तेर्विपरिलोपो विद्यते’ (बृ.४.३.२६) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_000142.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000143", "originalText": "तदेव आत्मस्वरूपं ब्रह्म निरतिशयं भूमाख्यं बृहत्त्वाद्ब्रह्मेति विद्धि विजानीहि त्वम्।", "padacchedaText": "", "audioFile": "PB_000143.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000144", "originalText": "यैर्वागाद्युपाधिभिः ‘वाचो ह वाक्’ ‘चक्षुषश्चक्षुः’ ‘श्रोत्रस्य श्रोत्रं मनसो मनः’ (के.१.२) ‘कर्ता भोक्ता विज्ञाता नियन्ता प्रशासिता’ ‘विज्ञानमानन्दं ब्रह्म’ (बृ.३.९.७) इत्येवमादयः संव्यवहारा असंव्यवहार्ये निर्विशेषे परे साम्ये ब्रह्मणि प्रवर्तन्ते, तान्व्युदस्य आत्मानमेव निर्विशेषं ब्रह्म विद्धीति एवशब्दार्थः।", "padacchedaText": "", "audioFile": "PB_000144.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000145", "originalText": "नेदं ब्रह्म यदिदम् इत्युपाधिभेदविशिष्टमनात्मेश्वरादि उपासते ध्यायन्ति। तदेव ब्रह्म त्वं विद्धि इत्युक्तेऽपि नेदं ब्रह्म इत्यनात्मनोऽब्रह्मत्वं पुनरुच्यते नियमार्थम् अन्यब्रह्मबुद्धिपरिसङ्ख्यानार्थं वा॥", "padacchedaText": "", "audioFile": "PB_000145.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000146", "originalText": "यन्मनसा न मनुते येनाहुर्मनो मतम्। तदेव ब्रह्म त्वं विद्धि नेदं यदिदमुपासते॥ ६॥", "padacchedaText": "", "audioFile": "PB_000146.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000147", "originalText": "यन्मनसा न मनुते।", "padacchedaText": "", "audioFile": "PB_000147.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000148", "originalText": "मन इत्यन्तःकरणं बुद्धिमनसोरेकत्वेन गृह्यते।", "padacchedaText": "", "audioFile": "PB_000148.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000149", "originalText": "मनुतेऽनेनेति मनः सर्वकरणसाधारणम्, सर्वविषयव्यापकत्वात्।", "padacchedaText": "", "audioFile": "PB_000149.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000150", "originalText": "‘कामः सङ्कल्पो विचिकित्सा श्रद्धाश्रद्धा धृतिरधृतिर्ह्रीर्धीर्भीरित्येतत्सर्वं मन एव’ (बृ.१.५.३) इति श्रुतेः कामादिवृत्तिमन्मनः।", "padacchedaText": "", "audioFile": "PB_000150.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000151", "originalText": "तेन मनसा यत् चैतन्यज्योतिर्मनसोऽवभासकं न मनुते न सङ्कल्पयति नापि निश्चिनोति लोकः, मनसोऽवभासकत्वेन नियन्तृत्वात्।", "padacchedaText": "", "audioFile": "PB_000151.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000152", "originalText": "सर्वविषयं प्रति प्रत्यगेवेति स्वात्मनि न प्रवर्ततेऽन्तःकरणम्।", "padacchedaText": "", "audioFile": "PB_000152.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000153", "originalText": "अन्तःस्थेन हि चैतन्यज्योतिषावभासितस्य मनसो मननसामर्थ्यम्, तेन सवृत्तिकं मनः येन ब्रह्मणा मतं विषयीकृतं व्याप्तम् आहुः कथयन्ति ब्रह्मविदः।", "padacchedaText": "", "audioFile": "PB_000153.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000154", "originalText": "तस्मात् तदेव मनस आत्मानं प्रत्यक्चेतयितारं ब्रह्म विद्धि। नेदमित्यादि पूर्ववत्॥", "padacchedaText": "", "audioFile": "PB_000154.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000155", "originalText": "यच्चक्षुषा न पश्यति येन चक्षूंषि पश्यति। तदेव ब्रह्म त्वं विद्धि नेदं यदिदमुपासते॥ ७॥", "padacchedaText": "", "audioFile": "PB_000155.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000156", "originalText": "यत् चक्षुषा न पश्यति न विषयीकरोति अन्तःकरणवृत्तिसंयुक्तेन लोकः, येन चक्षूंषि अन्तःकरणवृत्तिभेदभिन्नाश्चक्षुर्वृत्तीः पश्यति चैतन्यात्मज्योतिषा विषयीकरोति व्याप्नोति।", "padacchedaText": "", "audioFile": "PB_000156.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000157", "originalText": "तदेवेत्यादि पूर्ववत्॥", "padacchedaText": "", "audioFile": "PB_000157.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000158", "originalText": "यच्छ्रोत्रेण न शृणोति येन श्रोत्रमिदं श्रुतम्। तदेव ब्रह्म त्वं विद्धि नेदं यदिदमुपासते॥ ८॥", "padacchedaText": "", "audioFile": "PB_000158.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000159", "originalText": "यत् श्रोत्रेण न शृणोति दिग्देवताधिष्ठितेन आकाशकार्येण मनोवृत्तिसंयुक्तेन न विषयीकरोति लोकः, येन श्रोत्रम् इदं श्रुतं यत्प्रसिद्धं चैतन्यात्मज्योतिषा विषयीकृतम्।", "padacchedaText": "", "audioFile": "PB_000159.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000160", "originalText": "तदेवेत्यादि पूर्ववत्॥", "padacchedaText": "", "audioFile": "PB_000160.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000161", "originalText": "यत्प्राणेन न प्राणिति येन प्राणः प्रणीयते। तदेव ब्रह्म त्वं विद्धि नेदं यदिदमुपासते॥ ९॥", "padacchedaText": "", "audioFile": "PB_000161.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000162", "originalText": "यत् प्राणेन घ्राणेन पार्थिवेन नासिकापुटान्तरवस्थितेनान्तःकरणप्राणवृत्तिभ्यां सहितेन यन्न प्राणिति गन्धवन्न विषयीकरोति, येन चैतन्यात्मज्योतिषावभास्यत्वेन स्वविषयं प्रति प्राणः प्रणीयते तदेवेत्यादि सर्वं समानम्॥", "padacchedaText": "", "audioFile": "PB_000162.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000163", "originalText": "इति प्रथमखण्डभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000163.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000164", "originalText": "द्वितीयः खण्डः\nयदि मन्यसे सु वेदेति दभ्रमेवापि नूनं त्वं वेत्थ ब्रह्मणो रूपं यदस्य त्वं यदस्य देवेष्वथ नु मीमांस्यमेव ते मन्ये विदितम्॥ १॥", "padacchedaText": "", "audioFile": "PB_000164.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000165", "originalText": "एवं हेयोपादेयविपरीतस्त्वमात्मा ब्रह्मेति प्रत्यायितः शिष्यः अहमेव ब्रह्मेति सुष्ठु वेदाहमिति मा गृह्णीयादित्याशयादाहाचार्यः शिष्यबुद्धिविचालनार्थम्— यदीत्यादि।", "padacchedaText": "", "audioFile": "PB_000165.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000166", "originalText": "नन्विष्टैव सु वेदाहम् इति निश्चिता प्रतिपत्तिः।", "padacchedaText": "", "audioFile": "PB_000166.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000167", "originalText": "सत्यम्, इष्टा निश्चिता प्रतिपत्तिः, न हि सु वेदाहमिति।", "padacchedaText": "", "audioFile": "PB_000167.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000168", "originalText": "यद्धि वेद्यं वस्तु विषयीभवति, तत्सुष्ठु वेदितुं शक्यम्, दाह्यमिव दग्धुम् अग्नेर्दग्धुः न त्वग्नेः स्वरूपमेव।", "padacchedaText": "", "audioFile": "PB_000168.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000169", "originalText": "सर्वस्य हि वेदितुः स्वात्मा ब्रह्मेति सर्ववेदान्तानां सुनिश्चितोऽर्थः।", "padacchedaText": "", "audioFile": "PB_000169.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000170", "originalText": "इह च तदेव प्रतिपादितं प्रश्नप्रतिवचनोक्त्या ‘श्रोत्रस्य श्रोत्रम्’ (के.१.२) इत्याद्यया।", "padacchedaText": "", "audioFile": "PB_000170.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000171", "originalText": "‘यद्वाचानभ्युदितम्’ (के.१.५) इति च विशेषतोऽवधारितम्।", "padacchedaText": "", "audioFile": "PB_000171.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000172", "originalText": "ब्रह्मवित्सम्प्रदायनिश्चयश्चोक्तः ‘अन्यदेव तद्विदितादथो अविदितादधि’ (के.१.४) इति।", "padacchedaText": "", "audioFile": "PB_000172.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000173", "originalText": "उपन्यस्तमुपसंहरिष्यति च ‘अविज्ञातं विजानतां विज्ञातमविजानताम्’ (के.२.३) इति।", "padacchedaText": "", "audioFile": "PB_000173.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000174", "originalText": "तस्माद्युक्तमेव शिष्यस्य सु वेदेति बुद्धिं निराकर्तुम्।", "padacchedaText": "", "audioFile": "PB_000174.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000175", "originalText": "न हि वेदिता वेदितुर्वेदितुं शक्यः, अग्निर्दग्धुरिव दग्धुमग्नेः।", "padacchedaText": "", "audioFile": "PB_000175.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000176", "originalText": "न चान्यो वेदिता ब्रह्मणोऽस्ति यस्य वेद्यमन्यत्स्याद्ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000176.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000177", "originalText": "‘नान्यदतोऽस्ति विज्ञातृ’ (बृ.३.८.११) इत्यन्यो विज्ञाता प्रतिषिध्यते।", "padacchedaText": "", "audioFile": "PB_000177.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000178", "originalText": "तस्मात् सुष्ठु वेदाहं ब्रह्मेति प्रतिपत्तिर्मिथ्यैव।", "padacchedaText": "", "audioFile": "PB_000178.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000179", "originalText": "तस्माद्युक्तमेवाहाचार्यो यदीत्यादि।", "padacchedaText": "", "audioFile": "PB_000179.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000180", "originalText": "यदि कदाचित् मन्यसे सु वेदेति सुष्ठु वेदाहं ब्रह्मेति।", "padacchedaText": "", "audioFile": "PB_000180.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000181", "originalText": "कदाचिद्यथाश्रुतं दुर्विज्ञेयमपि क्षीणदोषः सुमेधाः कश्चित्प्रतिपद्यते कश्चिन्नेति साशङ्कमाह यदीत्यादि।", "padacchedaText": "", "audioFile": "PB_000181.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000182", "originalText": "दृष्टं च ‘य एषोऽक्षिणि पुरुषो दृश्यत एष आत्मेति होवाचैतदमृतमभयमेतद्ब्रह्म’ (छा.८.७.४) इत्युक्ते प्राजापत्यः पण्डितोऽप्यसुरराड्विरोचनः स्वभावदोषवशादनुपपद्यमानमपि विपरीतमर्थं शरीरमात्मेति प्रतिपन्नः।", "padacchedaText": "", "audioFile": "PB_000182.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000183", "originalText": "तथेन्द्रो देवराट् सकृद्द्विस्त्रिरुक्तं चाप्रतिपद्यमानः स्वभावदोषक्षयमपेक्ष्य चतुर्थे पर्याये प्रथमोक्तमेव ब्रह्म प्रतिपन्नवान्।", "padacchedaText": "", "audioFile": "PB_000183.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000184", "originalText": "लोकेऽपि एकस्माद्गुरोः शृण्वतां कश्चिद्यथावत्प्रतिपद्यते कश्चिदयथावत् कश्चिद्विपरीतं कश्चिन्न प्रतिपद्यते।", "padacchedaText": "", "audioFile": "PB_000184.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000185", "originalText": "किमु वक्तव्यमतीन्द्रियमात्मतत्त्वम्।", "padacchedaText": "", "audioFile": "PB_000185.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000186", "originalText": "अत्र हि विप्रतिपन्नाः सदसद्वादिनस्तार्किकाः सर्वे।", "padacchedaText": "", "audioFile": "PB_000186.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000187", "originalText": "तस्माद्विदितं ब्रह्मेति सुनिश्चितोक्तमपि विषमप्रतिपत्तित्वात् यदि मन्यसे इत्यादि साशङ्कं वचनं युक्तमेवाचार्यस्य।", "padacchedaText": "", "audioFile": "PB_000187.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000188", "originalText": "दभ्रम् अल्पमेवापि नूनं त्वं वेत्थ जानीषे ब्रह्मणो रूपम्।", "padacchedaText": "", "audioFile": "PB_000188.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000189", "originalText": "किमनेकानि ब्रह्मणो रूपाणि महान्त्यर्भकाणि च, येनाह दभ्रमेवेत्यादि? बाढम्।", "padacchedaText": "", "audioFile": "PB_000189.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000190", "originalText": "अनेकानि हि नामरूपोपाधिकृतानि ब्रह्मणो रूपाणि, न स्वतः।", "padacchedaText": "", "audioFile": "PB_000190.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000191", "originalText": "स्वतस्तु ‘अशब्दमस्पर्शमरूपमव्ययं तथारसं नित्यमगन्धवच्च यत्’ (क.१.३.१५) इति शब्दादिभिः सह रूपाणि प्रतिषिध्यन्ते।", "padacchedaText": "", "audioFile": "PB_000191.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000192", "originalText": "ननु येनैव धर्मेण यद्रूप्यते तदेव तस्य स्वरूपमिति ब्रह्मणोऽपि येन विशेषेण निरूपणं तदेव तस्य स्वरूपं स्यात्।", "padacchedaText": "", "audioFile": "PB_000192.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000193", "originalText": "अत उच्यते— चैतन्यम्, पृथिव्यादीनामन्यतमस्य सर्वेषां विपरिणतानां वा धर्मो न भवति, तथा श्रोत्रादीनामन्तःकरणस्य च धर्मो न भवतीति ब्रह्मणो रूपमिति ब्रह्म रूप्यते चैतन्येन।", "padacchedaText": "", "audioFile": "PB_000193.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000194", "originalText": "तथा चोक्तम्।", "padacchedaText": "", "audioFile": "PB_000194.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000195", "originalText": "‘विज्ञानमानन्दं ब्रह्म’ (बृ.३.९.७) ‘विज्ञानघन एव’ (बृ.२.४.१२) ‘सत्यं ज्ञानमनन्तं ब्रह्म’ (तै.२.१.१) ‘प्रज्ञानं ब्रह्म’ (ऐ.३.१.३) इति च ब्रह्मणो रूपं निर्दिष्टं श्रुतिषु।", "padacchedaText": "", "audioFile": "PB_000195.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000196", "originalText": "सत्यमेवम्, तथापि तदन्तःकरणदेहेन्द्रियोपाधिद्वारेणैव विज्ञानादिशब्दैर्निर्दिश्यते, तदनुकारित्वाद्देहादिवृद्धिसङ्कोचच्छेदादिषु नाशेषु च, न स्वतः।", "padacchedaText": "", "audioFile": "PB_000196.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000197", "originalText": "स्वतस्तु ‘अविज्ञातं विजानतां विज्ञातमविजानताम्’ (के.२.३) इति स्थितं भविष्यति।", "padacchedaText": "", "audioFile": "PB_000197.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000198", "originalText": "‘यदस्य ब्रह्मणो रूपम्’ इति पूर्वेण सम्बन्धः।", "padacchedaText": "", "audioFile": "PB_000198.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000199", "originalText": "न केवलमध्यात्मोपाधिपरिच्छिन्नस्यास्य ब्रह्मणो रूपं त्वमल्पं वेत्थ, यदप्यधिदैवतोपाधिपरिच्छिन्नस्यास्य ब्रह्मणो रूपं देवेषु वेत्थ त्वम्, तदपि नूनं दभ्रमेव वेत्थ इति मन्येऽहम्।", "padacchedaText": "", "audioFile": "PB_000199.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000200", "originalText": "यदध्यात्मं यदपि देवेषु तदपि चोपाधिपरिच्छिन्नत्वाद्दभ्रत्वान्न निवर्तते।", "padacchedaText": "", "audioFile": "PB_000200.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000201", "originalText": "यत्तु विध्वस्तसर्वोपाधिविशेषं शान्तमनन्तमेकमद्वैतं भूमाख्यं नित्यं ब्रह्म, न तत्सुवेद्यमित्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_000201.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000202", "originalText": "यत एवम् अथ नु तस्मात् मन्ये अद्यापि मीमांस्यं विचार्यमेव ते तव ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000202.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000203", "originalText": "एवमाचार्योक्तः शिष्यः एकान्ते उपविष्टः समाहितः सन्, यथोक्तमाचार्येण आगममर्थतो विचार्य, तर्कतश्च निर्धार्य, स्वानुभवं कृत्वा, आचार्यसकाशमुपगम्य, उवाच— मन्येऽहमथेदानीं विदितं ब्रह्मेति॥", "padacchedaText": "", "audioFile": "PB_000203.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000204", "originalText": "नाह मन्ये सु वेदेति नो न वेदेति वेद च। यो नस्तद्वेद तद्वेद नो न वेदेति वेद च॥ २॥", "padacchedaText": "", "audioFile": "PB_000204.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000205", "originalText": "कथमिति, शृणु— न अह मन्ये सु वेदेति, नैवाहं मन्ये सु वेद ब्रह्मेति।", "padacchedaText": "", "audioFile": "PB_000205.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000206", "originalText": "नैव तर्हि विदितं त्वया ब्रह्मेत्युक्ते आह— नो न वेदेति वेद च।", "padacchedaText": "", "audioFile": "PB_000206.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000207", "originalText": "वेद चेति च—शब्दात् न वेद च।", "padacchedaText": "", "audioFile": "PB_000207.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000208", "originalText": "ननु विप्रतिषिद्धं नाह मन्ये सु वेदेति, नो न वेदेति, वेद च इति।", "padacchedaText": "", "audioFile": "PB_000208.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000209", "originalText": "यदि न मन्यसे सु वेदेति, कथं मन्यसे वेद चेति।", "padacchedaText": "", "audioFile": "PB_000209.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000210", "originalText": "अथ मन्यसे वेदैवेति, कथं न मन्यसे सुवेदेति।", "padacchedaText": "", "audioFile": "PB_000210.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000211", "originalText": "एकं वस्तु येन ज्ञायते, तेनैव तदेव वस्तु न सु विज्ञायत इति विप्रतिषिद्धं संशयविपर्ययौ वर्जयित्वा।", "padacchedaText": "", "audioFile": "PB_000211.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000212", "originalText": "न च ब्रह्म संशयितत्वेन ज्ञेयं विपरीतत्वेन वेति नियन्तुं शक्यम्।", "padacchedaText": "", "audioFile": "PB_000212.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000213", "originalText": "संशयविपर्ययौ हि सर्वत्रानर्थकरत्वेनैव प्रसिद्धौ।", "padacchedaText": "", "audioFile": "PB_000213.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000214", "originalText": "एवमाचार्येण विचाल्यमानोऽपि शिष्यो न विचचाल, ‘अन्यदेव तद्विदितादथो अविदितादधि’ (के.१.४) इत्याचार्योक्तागमसम्प्रदायबलात् उपपत्त्यनुभवबलाच्च, जगर्ज च ब्रह्मविद्यायां दृढनिश्चयतां दर्शयन्नात्मनः।", "padacchedaText": "", "audioFile": "PB_000214.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000215", "originalText": "कथमित्युच्यते— यः यः कश्चित् नः अस्माकं सब्रह्मचारिणां मध्ये तत् मदुक्तं वचनं तत्त्वतो वेद, सः तत् ब्रह्म वेद।", "padacchedaText": "", "audioFile": "PB_000215.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000216", "originalText": "किं पुनस्तद्वचनमित्यत आह— नो न वेदेति वेद च इति।", "padacchedaText": "", "audioFile": "PB_000216.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000217", "originalText": "यदेव ‘अन्यदेव तद्विदितादथो अविदितादधि’ (के.१.४) इत्युक्तम्, तदेव वस्तु अनुमानानुभवाभ्यां संयोज्य निश्चितं वाक्यान्तरेण नो न वेदेति वेद च इत्यवोचत् आचार्यबुद्धिसंवादार्थं मन्दबुद्धिग्रहणव्यपोहार्थं च।", "padacchedaText": "", "audioFile": "PB_000217.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000218", "originalText": "तथा च गर्जितमुपपन्नं भवति ‘यो नस्तद्वेद तद्वेद’ इति॥", "padacchedaText": "", "audioFile": "PB_000218.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000219", "originalText": "यस्यामतं तस्य मतं मतं यस्य न वेद सः। अविज्ञातं विजानतां विज्ञातमविजानताम्॥ ३॥", "padacchedaText": "", "audioFile": "PB_000219.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000220", "originalText": "शिष्याचार्यसंवादात्प्रतिनिवृत्य स्वेन रूपेण श्रुतिः समस्तसंवादनिर्वृत्तमर्थमेव बोधयति— यस्यामतमित्यादिना।", "padacchedaText": "", "audioFile": "PB_000220.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000221", "originalText": "यस्य ब्रह्मविदः अमतम् अविज्ञातम् अविदितं ब्रह्मेति मतम् अभिप्रायः निश्चयः, तस्य मतं ज्ञातं सम्यग्ब्रह्मेत्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_000221.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000222", "originalText": "यस्य पुनः मतं ज्ञातं विदितं मया ब्रह्मेति निश्चयः, न वेदैव सः न ब्रह्म विजानाति सः।", "padacchedaText": "", "audioFile": "PB_000222.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000223", "originalText": "विद्वदविदुषोर्यर्थोक्तौ पक्षाववधारयति— अविज्ञातं विजानतामिति, अविज्ञातम् अमतम् अविदितमेव ब्रह्म विजानतां सम्यग्विदितवतामित्येतत्।", "padacchedaText": "", "audioFile": "PB_000223.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000224", "originalText": "विज्ञातं विदितं ब्रह्म अविजानताम् असम्यग्दर्शिनाम्, इन्द्रियमनोबुद्धिष्वेवात्मदर्शिनामित्यर्थः, न त्वत्यन्तमेवाव्युत्पन्नबुद्धीनाम्।", "padacchedaText": "", "audioFile": "PB_000224.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000225", "originalText": "न हि तेषां विज्ञातमस्माभिर्ब्रह्मेति मतिर्भवति।", "padacchedaText": "", "audioFile": "PB_000225.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000226", "originalText": "इन्द्रियमनोबुद्ध्युपाधिष्वात्मदर्शिनां तु ब्रह्मोपाधिविवेकानुपलम्भात्, बुद्ध्याद्युपाधेश्च विज्ञातत्वात् विदितं ब्रह्मेत्युपपद्यते भ्रान्तिरित्यतः असम्यग्दर्शनं पूर्वपक्षत्वेनोपन्यस्यते— विज्ञातमविजानतामिति।", "padacchedaText": "", "audioFile": "PB_000226.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000227", "originalText": "अथवा हेत्वर्थ उत्तरार्धोऽविज्ञातमित्यादिः॥", "padacchedaText": "", "audioFile": "PB_000227.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000228", "originalText": "प्रतिबोधविदितं मतममृतत्वं हि विन्दते। आत्मना विन्दते वीर्यं विद्यया विन्दतेऽमृतम्॥ ४॥", "padacchedaText": "", "audioFile": "PB_000228.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000229", "originalText": "‘अविज्ञातं विजानताम्’ (के.२.३) इत्यवधृतम्।", "padacchedaText": "", "audioFile": "PB_000229.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000230", "originalText": "यदि ब्रह्मात्यन्तमेवाविज्ञातम्, लौकिकानां ब्रह्मविदां चाविशेषः प्राप्तः।", "padacchedaText": "", "audioFile": "PB_000230.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000231", "originalText": "‘अविज्ञातं विजानताम्’ (के.२.३) इति च परस्परविरुद्धम्।", "padacchedaText": "", "audioFile": "PB_000231.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000232", "originalText": "कथं तु तद्ब्रह्म सम्यग्विदितं भवतीत्येवमर्थमाह— प्रतिबोधविदितं बोधं बोधं प्रति विदितम्।", "padacchedaText": "", "audioFile": "PB_000232.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000233", "originalText": "बोधशब्देन बौद्धाः प्रत्यया उच्यन्ते।", "padacchedaText": "", "audioFile": "PB_000233.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000234", "originalText": "सर्वे प्रत्यया विषयीभवन्ति यस्य, स आत्मा सर्वबोधान्प्रतिबुध्यते सर्वप्रत्ययदर्शी चिच्छक्तिस्वरूपमात्रः प्रत्ययैरेव प्रत्ययेष्वविशिष्टतया लक्ष्यते, नान्यद्द्वारमन्तरात्मनो विज्ञानाय।", "padacchedaText": "", "audioFile": "PB_000234.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000235", "originalText": "अतः प्रत्ययप्रत्यगात्मतया विदितं ब्रह्म यदा, तदा तत् मतं तत्सम्यग्दर्शनमित्यर्थः सर्वप्रत्ययदर्शित्वे चोपजननापायवर्जितदृक्स्वरूपता नित्यत्वं विशुद्धस्वरूपत्वमात्मत्वं निर्विशेषतैकत्वं च सर्वभूतेषु सिद्धं भवेत्, लक्षणभेदाभावाद्व्योन्न इव घटगिरिगुहादिषु।", "padacchedaText": "", "audioFile": "PB_000235.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000236", "originalText": "विदिताविदिताभ्यामन्यद्ब्रह्मेत्यागमवाक्यार्थ एवं परिशुद्ध एवोपसंहृतो भवति।", "padacchedaText": "", "audioFile": "PB_000236.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000237", "originalText": "‘दृष्टेद्रष्टा श्रुतेः श्रोता मतेर्मन्ता विज्ञातेर्विज्ञाता’ (बृ.३.४.२) इति हि श्रुत्यन्तरम्।", "padacchedaText": "", "audioFile": "PB_000237.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000238", "originalText": "यदा पुनर्बोधक्रियाकर्तेति बोधक्रियालक्षणेन तत्कर्तारं विजानातीति बोधलक्षणेन विदितं प्रतिबोधविदितमिति व्याख्यायते, यथा यो वृक्षशाखाश्चालयति स वायुरिति तद्वत्, तदा बोधक्रियाशक्तिमानात्मा द्रव्यम्, न बोधस्वरूप एव।", "padacchedaText": "", "audioFile": "PB_000238.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000239", "originalText": "बोधस्तु जायते विनश्यति च।", "padacchedaText": "", "audioFile": "PB_000239.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000240", "originalText": "यदा बोधो जायते, तदा बोधक्रियया सविशेषः।", "padacchedaText": "", "audioFile": "PB_000240.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000241", "originalText": "यदा बोधो नश्यति, तदा नष्टबोधो द्रव्यमात्रं निर्विशेषः।", "padacchedaText": "", "audioFile": "PB_000241.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000242", "originalText": "तत्रैवं सति विक्रियात्मकः सावयवोऽनित्योऽशुद्ध इत्यादयो दोषा न परिहर्तुं शक्यन्ते।", "padacchedaText": "", "audioFile": "PB_000242.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000243", "originalText": "यदपि काणादानाम् आत्ममनःसंयोगजो बोध आत्मनि समवैति, अत आत्मनि बोद्धृत्वम्, न तु विक्रियात्मक आत्मा, द्रव्यमात्रस्तु भवति घट इव रागसमवायी।", "padacchedaText": "", "audioFile": "PB_000243.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000244", "originalText": "अस्मिन्पक्षेऽप्यचेतनं द्रव्यमात्रं ब्रह्मेति ‘विज्ञानमानन्दं ब्रह्म’ (बृ.३.९.२७) ‘प्रज्ञानं ब्रह्म’ इत्याद्याः श्रुतयो बाधिताः स्युः।", "padacchedaText": "", "audioFile": "PB_000244.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000245", "originalText": "आत्मनो निरवयवत्वेन प्रदेशाभावात् नित्यसंयुक्तत्वाच्च मनसः स्मृत्युत्पत्तिनियमानुपपत्तिरपरिहार्या स्यात्।", "padacchedaText": "", "audioFile": "PB_000245.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000246", "originalText": "संसर्गधर्मित्वं चात्मनः श्रुतिस्मृतिन्यायविरुद्धं कल्पितं स्यात्।", "padacchedaText": "", "audioFile": "PB_000246.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000247", "originalText": "‘असङ्गो न हि सज्जते’ (बृ.३.९.२६), (बृ.४.५.१५) ‘असक्तं सर्वभृत्’ (भ.गी.१३.१४) इति हि श्रुतिस्मृती।", "padacchedaText": "", "audioFile": "PB_000247.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000248", "originalText": "न्यायश्च— गुणवद्गुणवता संसृज्यते, नातुल्यजातीयम्।", "padacchedaText": "", "audioFile": "PB_000248.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000249", "originalText": "अतः निर्गुणं निर्विशेषं सर्वविलक्षणं केनचिदप्यतुल्यजातीयेन संसृज्यत इत्येतत् न्यायविरुद्धं भवेत्।", "padacchedaText": "", "audioFile": "PB_000249.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000250", "originalText": "तस्मात् नित्यालुप्तज्ञानस्वरूपज्योतिरात्मा ब्रह्मेत्ययमर्थः सर्वबोधबोद्धृत्वे आत्मनः सिध्यति, नान्यथा।", "padacchedaText": "", "audioFile": "PB_000250.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000251", "originalText": "तस्मात् ‘प्रतिबोधविदितं मतम्’ इति यथाव्याख्यात एवार्थोऽस्माभिः।", "padacchedaText": "", "audioFile": "PB_000251.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000252", "originalText": "यत्पुनः स्वसंवेद्यता प्रतिबोधविदित्यस्य वाक्यस्यार्थो वर्ण्यते, तत्र भवति सोपाधिकत्वे आत्मनो बुद्ध्युपाधिस्वरूपत्वेन भेदं परिकल्प्यात्मनात्मानं वेत्तीति संव्यवहारः— ‘आत्मन्येवात्मानं पश्यति’ (बृ.४.४.२३) ‘स्वयमेवात्मनात्मानं वेत्थ त्वं पुरुषोत्तम’ (भ.गी.१०.१५) इति।", "padacchedaText": "", "audioFile": "PB_000252.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000253", "originalText": "न तु निरुपाधिकस्यात्मन एकत्वे स्वसंवेद्यता परसंवेद्यता वा सम्भवति।", "padacchedaText": "", "audioFile": "PB_000253.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000254", "originalText": "संवेदनरूपत्वात्संवेदनान्तरापेक्षा च न सम्भवति, यथा प्रकाशस्य प्रकाशान्तरापेक्षाया न सम्भवः तद्वत्।", "padacchedaText": "", "audioFile": "PB_000254.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000255", "originalText": "बौद्धपक्षे स्वसंवेद्यतायां तु क्षणभङ्गुरत्वं निरात्मकत्वं च विज्ञानस्य स्यात्, ‘न हि विज्ञातुर्विज्ञातेर्विपरिलोपो विद्यतेऽविनाशित्वात्’ (बृ.४.३.३०) ‘नित्यं विभुं सर्वगतम्’ (मु.१.१.६) ‘स वा एष महानज आत्माजरोऽमरोऽमृतोऽभयः’ (बृ.४.४.२५) इत्याद्याः श्रुतयो बाध्येरन्।", "padacchedaText": "", "audioFile": "PB_000255.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000256", "originalText": "यत्पुनः प्रतिबोधशब्देन निर्निमित्तो बोधः प्रतिबोधः यथा सुप्तस्य इत्यर्थं परिकल्पयन्ति, सकृद्विज्ञानं प्रतिबोध इत्यपरे, निर्निमित्तः सनिमित्तः सकृद्वासकृद्वा प्रतिबोध एव हि सः।", "padacchedaText": "", "audioFile": "PB_000256.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000257", "originalText": "अमृतत्वम् अमरणभावं स्वात्मन्यवस्थानं मोक्षं हि यस्मात् विन्दते लभते यथोक्तात्प्रतिबोधात्प्रतिबोधविदितात्मकात्, तस्मात्प्रतिबोधविदितमेव मतमित्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_000257.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000258", "originalText": "बोधस्य हि प्रत्यगात्मविषयत्वं च मतममृतत्वे हेतुः।", "padacchedaText": "", "audioFile": "PB_000258.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000259", "originalText": "न ह्यात्मनोऽनात्मत्वममृतत्वं भवति।", "padacchedaText": "", "audioFile": "PB_000259.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000260", "originalText": "आत्मत्वादात्मनोऽमृतत्वं निर्निमित्तमेव।", "padacchedaText": "", "audioFile": "PB_000260.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000261", "originalText": "एवं मर्त्यत्वमात्मनो यदविद्यया अनात्मत्वप्रतिपत्तिः।", "padacchedaText": "", "audioFile": "PB_000261.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000262", "originalText": "कथं पुनर्यथोक्तयात्मविद्ययामृतत्वं विन्दत इत्यत आह— आत्मना स्वेन रूपेण विन्दते लभते वीर्यं बलं सामर्थ्यम्।", "padacchedaText": "", "audioFile": "PB_000262.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000263", "originalText": "धनसहायमन्त्रौषधितपोयोगकृतं वीर्यं मृत्युं न शक्नोत्यभिभवितुम्, अनित्यवस्तुकृतत्वात्, आत्मविद्याकृतं तु वीर्यमात्मनैव विन्दते, नान्येनेत्यतोऽनन्यसाधनत्वादात्मविद्यावीर्यस्य तदेव वीर्यं मृत्युं शक्नोत्यभिभवितुम्।", "padacchedaText": "", "audioFile": "PB_000263.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000264", "originalText": "यत एवमात्मविद्याकृतं वीर्यमात्मनैव विन्दते, अतः विद्यया आत्मविषयया विन्दतेऽमृतम् अमृतत्वम्।", "padacchedaText": "", "audioFile": "PB_000264.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000265", "originalText": "‘नायमात्मा बलहीनेन लभ्यः’ (मु.३.२.४)इत्याथर्वणे। अतः समर्थो हेतुः अमृतत्वं हि विन्दत इति॥", "padacchedaText": "", "audioFile": "PB_000265.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000266", "originalText": "इह चेदवेदीदथ सत्यमस्ति न चेदिहावेदीन्महती विनष्टिः। भूतेषु भूतेषु विचित्य धीराः प्रेत्यास्माल्लोकादमृता भवन्ति॥ ५॥", "padacchedaText": "", "audioFile": "PB_000266.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000267", "originalText": "कष्टा खलु सुरनरतिर्यक्प्रेतादिषु संसारदुःखबहुलेषु प्राणिनिकायेषु जन्मजरामरणरोगादिसम्प्राप्तिरज्ञानात्।", "padacchedaText": "", "audioFile": "PB_000267.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000268", "originalText": "अतः इह एव चेत् मनुष्योऽधिकृतः समर्थः सन् यदि अवेदीत् आत्मानं यथोक्तलक्षणं विदितवान् यथोक्तेन प्रकारेण, अथ तदा अस्ति सत्यं मनुष्यजन्मन्यस्मिन्नविनाशोऽर्थवत्ता वा सद्भावो वा परमार्थता वा सत्यं विद्यते।", "padacchedaText": "", "audioFile": "PB_000268.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000269", "originalText": "न चेदिहावेदीदिति, न चेत् इह जीवंश्चेत् अधिकृतः अवेदीत् न विदितवान्, तदा महती दीर्घा अनन्ता विनष्टिः विनाशनं जन्मजरामरणादिप्रबन्धाविच्छेदलक्षणा संसारगतिः।", "padacchedaText": "", "audioFile": "PB_000269.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000270", "originalText": "तस्मादेवं गुणदोषौ विजानन्तो ब्राह्मणाः भूतेषु भूतेषु सर्वभूतेषु स्थावरेषु चरेषु च एकमात्मतत्त्वं ब्रह्म विचित्य विज्ञाय साक्षात्कृत्य धीराः धीमन्तः प्रेत्य व्यावृत्य ममाहम्भावलक्षणादविद्यारूपादस्माल्लोकात् उपरम्य सर्वात्मैकभावमद्वैतमापन्नाः सन्तः अमृता भवन्ति ब्रह्मैव भवन्तीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000270.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000271", "originalText": "‘स यो ह वै तत्परं ब्रह्म वेद ब्रह्मैव भवति’ (मु.३.२.९) इति श्रुतेः॥", "padacchedaText": "", "audioFile": "PB_000271.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000272", "originalText": "इति द्वितीयखण्डभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000272.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000273", "originalText": "तृतीयः खण्डः\nब्रह्म ह देवेभ्यो विजिग्ये तस्य ह ब्रह्मणो विजये देवा अमहीयन्त त ऐक्षन्तास्माकमेवायं विजयोऽस्माकमेवायं महिमेति॥ १॥", "padacchedaText": "", "audioFile": "PB_000273.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000274", "originalText": "ब्रह्म ह देवेभ्यो विजिग्ये।", "padacchedaText": "", "audioFile": "PB_000274.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000275", "originalText": "‘अविज्ञातं विजानतां विज्ञातमविजानताम्’ (के.२.३) इत्यादिश्रवणात् यदस्ति तद्विज्ञातं प्रमाणैः यन्नास्ति तदविज्ञातं शशविषाणकल्पमत्यन्तमेवासद्दृष्टम्।", "padacchedaText": "", "audioFile": "PB_000275.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000276", "originalText": "तथेदं ब्रह्माविज्ञातत्वादसदेवेति मन्दबुद्धीनां व्यामोहो मा भूदिति तदर्थेयमाख्यायिका आरभ्यते।", "padacchedaText": "", "audioFile": "PB_000276.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000277", "originalText": "तदेव हि ब्रह्म सर्वप्रकारेण प्रशास्तृ देवानामपि परो देवः, ईश्वराणामपि परमेश्वरः, दुर्विज्ञेयः, देवानां जयहेतुः, असुराणां पराजयहेतुः, तत्कथं नास्तीत्येतस्यार्थस्यानुकूलानि ह्युत्तराणि वचांसि दृश्यन्ते।", "padacchedaText": "", "audioFile": "PB_000277.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000278", "originalText": "अथवा ब्रह्मविद्यायाः स्तुतये।", "padacchedaText": "", "audioFile": "PB_000278.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000279", "originalText": "कथम्? ब्रह्मविज्ञानाद्धि अग्न्यादयो देवा देवानां श्रेष्ठत्वं जग्मुः।", "padacchedaText": "", "audioFile": "PB_000279.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000280", "originalText": "ततोऽप्यतितरामिन्द्र इति।", "padacchedaText": "", "audioFile": "PB_000280.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000281", "originalText": "अथवा दुर्विज्ञेयं ब्रह्मेत्येतत्प्रदर्श्यते— येनाग्न्यादयोऽतितेजसोऽपि क्लेशेनैव ब्रह्म विदितवन्तस्तथेन्द्रो देवानामीश्वरोऽपि सन्निति।", "padacchedaText": "", "audioFile": "PB_000281.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000282", "originalText": "वक्ष्यमाणोपनिषद्विधिपरं वा सर्वम्।", "padacchedaText": "", "audioFile": "PB_000282.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000283", "originalText": "ब्रह्मविद्याव्यतिरेकेण प्राणिनां कर्तृत्वभोक्तृत्वाद्यभिमानो मिथ्येत्येतद्दर्शनार्थं वा आख्यायिका, यथा देवानां जयाद्यभिमानस्तद्वदिति।", "padacchedaText": "", "audioFile": "PB_000283.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000284", "originalText": "ब्रह्म यथोक्तलक्षणं परं ह किल देवेभ्योऽर्थाय विजिग्ये जयं लब्धवत् देवानामसुराणां च सङ्ग्रामेऽसुराञ्जित्वा जगदरातीनीश्वरसेतुर्भेत्तॄन् देवेभ्यो जयं तत्फलं च प्रायच्छज्जगतः स्थेम्ने।", "padacchedaText": "", "audioFile": "PB_000284.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000285", "originalText": "तस्य ह किल ब्रह्मणो विजये देवाः अग्न्यादयः अमहीयन्त महिमानं प्राप्तवन्तः।", "padacchedaText": "", "audioFile": "PB_000285.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000286", "originalText": "तदा आत्मसंस्थस्य प्रत्यगात्मन ईश्वरस्य सर्वज्ञस्य सर्वक्रियाफलसंयोजयितुः प्राणिनां सर्वशक्तेः जगतः स्थितिं चिकीर्षोः अयं जयो महिमा चेत्यजानन्तः ते देवाः ऐक्षन्त ईक्षितवन्तः अग्न्यादिस्वरूपपरिच्छिन्नात्मकृतः अस्माकमेवायं विजयः अस्माकमेवायं महिमा अग्निवाय्विन्द्रत्वादिलक्षणो जयफलभूतोऽस्माभिरनुभूयते नास्मत्प्रत्यगात्मभूतेश्वरकृत इति॥", "padacchedaText": "", "audioFile": "PB_000286.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000287", "originalText": "तद्धैषां विजज्ञौ तेभ्यो ह प्रादुर्बभूव तन्न व्यजानत किमिदं यक्षमिति॥ २॥", "padacchedaText": "", "audioFile": "PB_000287.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000288", "originalText": "एवं मिथ्याभिमानेक्षणवतां तत् ह किल एषां मिथ्येक्षणं विजज्ञौ विज्ञातवद्ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000288.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000289", "originalText": "सर्वेक्षितृ हि तत् सर्वभूतकरणप्रयोक्तृत्वात् देवानां च मिथ्याज्ञानमुपलभ्य मैवासुरवद्देवा मिथ्याभिमानात्पराभवेयुरिति तदनुकम्पया देवान्मिथ्याभिमानापनोदनेनानुगृह्णीयामिति तेभ्यः देवेभ्यः ह किल अर्थाय प्रादुर्बभूव स्वयोगमाहात्म्यनिर्मितेनात्यद्भुतेन विस्मापनीयेन रूपेण देवानामिन्द्रियगोचरे प्रादुर्बभूव प्रादुर्भूतवत्।", "padacchedaText": "", "audioFile": "PB_000289.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000290", "originalText": "तत् प्रादुर्भूतं ब्रह्म न व्यजानत नैव विज्ञातवन्तः देवाः किमिदं यक्षं पूज्यं महद्भूतमिति॥", "padacchedaText": "", "audioFile": "PB_000290.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000291", "originalText": "तेऽग्निमब्रुवन् जातवेद एतद्विजानीहि किमेतद्यक्षमिति तथेति॥ ३॥", "padacchedaText": "", "audioFile": "PB_000291.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000292", "originalText": "तदभ्यद्रवत्तमभ्यवदत् कोऽसीत्यग्निर्वा अहमस्मीत्यब्रवीज्जातवेदा वा अहमस्मीति॥ ४॥", "padacchedaText": "", "audioFile": "PB_000292.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000293", "originalText": "तस्मिंस्त्वयि किं वीर्यमित्यपीदं सर्वं दहेयं यदिदं पृथिव्यामिति॥ ५॥", "padacchedaText": "", "audioFile": "PB_000293.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000294", "originalText": "तस्मै तृणं निदधावेतद्दहेति तदुपप्रेयाय सर्वजवेन तन्न शशाक दग्धुं स तत एव निववृते नैतदशकं विज्ञातुं यदेतद्यक्षमिति॥ ६॥", "padacchedaText": "", "audioFile": "PB_000294.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000295", "originalText": "ते तदजानन्तो देवाः सान्तर्भयास्तद्विजिज्ञासवः अग्निम् अग्रगामिनं जातवेदसं सर्वज्ञकल्पम् अब्रुवन् उक्तवन्तः।", "padacchedaText": "", "audioFile": "PB_000295.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000296", "originalText": "हे जातवेदः एतत् अस्मद्गोचरस्थं यक्षं विजानीहि विशेषतो बुध्यस्व त्वं नस्तेजस्वी किमेतद्यक्षमिति।", "padacchedaText": "", "audioFile": "PB_000296.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000297", "originalText": "तथा अस्तु इति तत् यक्षम् अभि अद्रवत् तत्प्रति गतवानग्निः।", "padacchedaText": "", "audioFile": "PB_000297.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000298", "originalText": "तं च गतवन्तं पिपृच्छिषुं तत्समीपेऽप्रगल्भत्वात्तूष्णीम्भूतं तद्यक्षम् अभ्यवदत् अग्निं प्रति अभाषत कोऽसीति।", "padacchedaText": "", "audioFile": "PB_000298.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000299", "originalText": "एवं ब्रह्मणा पृष्टोऽग्निः अब्रवीत् अग्निर्वै अग्निर्नामाहं प्रसिद्धो जातवेदा इति च नामद्वयेन प्रसिद्धतयात्मानं श्लाघयन्निति।", "padacchedaText": "", "audioFile": "PB_000299.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000300", "originalText": "एवमुक्तवन्तं ब्रह्मावोचत् तस्मिन् एवं प्रसिद्धगुणनामवति त्वयि किं वीर्यं सामर्थ्यम् इति।", "padacchedaText": "", "audioFile": "PB_000300.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000301", "originalText": "सोऽब्रवीत् इदं जगत् सर्वं दहेयं भस्मीकुर्यां यत् इदं स्थावरादि पृथिव्याम् इति।", "padacchedaText": "", "audioFile": "PB_000301.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000302", "originalText": "पृथिव्यामित्युपलक्षणार्थम्, यतोऽन्तरिक्षस्थमपि दह्यत एवाग्निना।", "padacchedaText": "", "audioFile": "PB_000302.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000303", "originalText": "तस्मै एवमभिमानवते ब्रह्म तृणं निदधौ पुरोऽग्नेः स्थापितवत्।", "padacchedaText": "", "audioFile": "PB_000303.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000304", "originalText": "ब्रह्मणा ‘एतत् तृणमात्रं ममाग्रतः दह, न चेदसि दग्धुं समर्थः, मुञ्च दग्धृत्वाभिमानं सर्वत्र’ इत्युक्तः तत् तृणम् उपप्रेयाय तृणसमीपं गतवान् सर्वजवेन सर्वोत्साहकृतेन वेगेन।", "padacchedaText": "", "audioFile": "PB_000304.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000305", "originalText": "गत्वा तत् न शशाक नाशकत् दग्धुम्।", "padacchedaText": "", "audioFile": "PB_000305.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000306", "originalText": "सः जातवेदाः तृणं दग्धुमशक्तो व्रीडितो हतप्रतिज्ञः तत एव यक्षादेव तूष्णीं देवान्प्रति निववृते निवृत्तः प्रतिगतवान् न एतत् यक्षम् अशकं शक्तवानहं विज्ञातुं विशेषतः यदेतद्यक्षमिति॥", "padacchedaText": "", "audioFile": "PB_000306.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000307", "originalText": "अथ वायुमब्रुवन् वायवेतद्विजानीहि किमेतद्यक्षमिति तथेति॥ ७॥", "padacchedaText": "", "audioFile": "PB_000307.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000308", "originalText": "तदभ्यद्रवत्तमभ्यवदत्कोऽसीति वायुर्वा अहमस्मीत्यब्रवीन्मातरिश्वा वा अहमस्मीति॥ ८॥", "padacchedaText": "", "audioFile": "PB_000308.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000309", "originalText": "तस्मिंस्त्वयि किं वीर्यमित्यपीदं सर्वमाददीय यदिदं पृथिव्यामिति॥ ९॥", "padacchedaText": "", "audioFile": "PB_000309.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000310", "originalText": "तस्मै तृणं निदधावेतदादत्स्वेति तदुपप्रेयाय सर्वजवेन तन्न शशाकादातुं स तत एव निववृते नैतदशकं विज्ञातुं यदेतद्यक्षमिति॥ १०॥", "padacchedaText": "", "audioFile": "PB_000310.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000311", "originalText": "अथ अनन्तरं वायुमब्रुवन् हे वायो एतद्विजानीहीत्यादि समानार्थं पूर्वेण।", "padacchedaText": "", "audioFile": "PB_000311.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000312", "originalText": "वानाद्गमनाद्गन्धनाद्वा वायुः।", "padacchedaText": "", "audioFile": "PB_000312.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000313", "originalText": "मातर्यन्तरिक्षे श्वयतीति मातरिश्वा।", "padacchedaText": "", "audioFile": "PB_000313.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000314", "originalText": "इदं सर्वमपि आददीय गृह्णीयाम्। यदिदं पृथिव्यामित्यादि समानमेव॥", "padacchedaText": "", "audioFile": "PB_000314.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000315", "originalText": "अथेन्द्रमब्रुवन्मघवन्नेतद्विजानीहि किमेतद्यक्षमिति तथेति तदभ्यद्रवत्तस्मात्तिरोदधे॥ ११॥", "padacchedaText": "", "audioFile": "PB_000315.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000316", "originalText": "स तस्मिन्नेवाकाशे स्त्रियमाजगाम बहु शोभमानामुमां हैमवतीं तां होवाच किमेतद्यक्षमिति॥ १२॥", "padacchedaText": "", "audioFile": "PB_000316.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000317", "originalText": "अथेन्द्रमब्रुवन्मघवन्नेतद्विजानीहीत्यादि पूर्ववत्।", "padacchedaText": "", "audioFile": "PB_000317.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000318", "originalText": "इन्द्रः परमेश्वरो मघवा बलवत्त्वात् तथेति तदभ्यद्रवत्।", "padacchedaText": "", "audioFile": "PB_000318.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000319", "originalText": "तस्मात् इन्द्रादात्मसमीपं गतात् तद्ब्रह्म तिरोदधे तिरोभूतम्।", "padacchedaText": "", "audioFile": "PB_000319.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000320", "originalText": "इन्द्रस्येन्द्रत्वाभिमानोऽतितरां निराकर्तव्य इत्यतः संवादमात्रमपि नादाद्ब्रह्मेन्द्राय।", "padacchedaText": "", "audioFile": "PB_000320.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000321", "originalText": "तद्यक्षं यस्मिन्नाकाशे आकाशप्रदेशे आत्मानं दर्शयित्वा तिरोभूतमिन्द्रश्च ब्रह्मणस्तिरोधानकाले यस्मिन्नाकाशे आसीत्, सः इन्द्रः तस्मिन्नेव आकाशे तस्थौ किं यद्यक्षमिति ध्यायन्, न निववृतेऽग्न्यादिवत्।", "padacchedaText": "", "audioFile": "PB_000321.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000322", "originalText": "तस्येन्द्रस्य यक्षे भक्तिं बुद्ध्वा विद्या उमारूपिणी प्रादुरभूत्स्त्रीरूपा।", "padacchedaText": "", "audioFile": "PB_000322.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000323", "originalText": "सः इन्द्रः ताम् उमां बहु शोभमानाम्, सर्वेषां हि शोभमानानां शोभनतमा विद्या।", "padacchedaText": "", "audioFile": "PB_000323.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000324", "originalText": "तदा बहु शोभमानेति विशेषणमुपपन्नं भवति।", "padacchedaText": "", "audioFile": "PB_000324.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000325", "originalText": "हैमवतीं हेमकृताभरणवतीमिव बहु शोभमानामित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000325.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000326", "originalText": "अथवा उमैव हिमवतो दुहिता हैमवती नित्यमेव सर्वज्ञेनेश्वरेण सह वर्तत इति ज्ञातुं समर्थेति कृत्वा तामुपजगाम। इन्द्रः तां ह उमां किल उवाच पप्रच्छ ब्रूहि किमेतद्दर्शयित्वा तिरोभूतं यक्षमिति॥", "padacchedaText": "", "audioFile": "PB_000326.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000327", "originalText": "इति तृतीयखण्डभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000327.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000328", "originalText": "चतुर्थः खण्डः\nब्रह्मेति होवाच ब्रह्मणो वा एतद्विजये महीयध्वमिति ततो हैव विदाञ्चकार ब्रह्मेति॥ १॥", "padacchedaText": "", "audioFile": "PB_000328.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000329", "originalText": "सा ब्रह्मेति होवाच ह किल ब्रह्मणः वै ईश्वरस्यैव विजये— ईश्वरेणैव जिता असुराः।", "padacchedaText": "", "audioFile": "PB_000329.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000330", "originalText": "यूयं तत्र निमित्तमात्रम्।", "padacchedaText": "", "audioFile": "PB_000330.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000331", "originalText": "तस्यैव विजये— यूयं महीयध्वं महिमानं प्राप्नुथ।", "padacchedaText": "", "audioFile": "PB_000331.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000332", "originalText": "एतदिति क्रियाविशेषणार्थम्।", "padacchedaText": "", "audioFile": "PB_000332.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000333", "originalText": "मिथ्याभिमानस्तु युष्माकम्— अस्माकमेवायं विजयोऽस्माकमेवायं महिमेति। ततः तस्मादुमावाक्यात् ह एव विदाञ्चकार ब्रह्मेति इन्द्रः, अवधारणात् ततो हैव इति, न स्वातन्त्र्येण॥", "padacchedaText": "", "audioFile": "PB_000333.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000334", "originalText": "तस्माद्वा एते देवा अतितरामिवान्यान्देवान्यदग्निर्वायुरिन्द्रस्ते ह्येनन्नेदिष्ठं पस्पर्शुस्ते ह्येनत्प्रथमो विदाञ्चकार ब्रह्मेति॥ २॥", "padacchedaText": "", "audioFile": "PB_000334.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000335", "originalText": "यस्मादग्निवाय्विन्द्रा एते देवा ब्रह्मणः संवाददर्शनादिना सामीप्यमुपगताः, तस्मात् स्वैर्गुणैः अतितरामिव शक्तिगुणादिमहाभाग्यैः अन्यान् देवान् अतितराम् अतिशेरत इव एते देवाः।", "padacchedaText": "", "audioFile": "PB_000335.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000336", "originalText": "इवशब्दोऽनर्थकोऽवधारणार्थो वा।", "padacchedaText": "", "audioFile": "PB_000336.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000337", "originalText": "यत् अग्निः वायुः इन्द्रः ते हि देवा यस्मात् एनत् ब्रह्म नेदिष्ठम् अन्तिकतमं प्रियतमं पस्पर्शुः स्पृष्टवन्तो यथोक्तैर्ब्रह्मणः संवादादिप्रकारैः, ते हि यस्माच्च हेतोः एनत् ब्रह्म प्रथमः प्रथमाः प्रधानाः सन्त इत्येतत्, विदाञ्चकार विदाञ्चक्रुरित्येतत्, ब्रह्मेति॥", "padacchedaText": "", "audioFile": "PB_000337.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000338", "originalText": "तस्माद्वा इन्द्रोऽतितरामिवान्यान्देवान्स ह्येनन्नेदिष्ठं पस्पर्श स ह्येनत्प्रथमो विदाञ्चकार ब्रह्मेति॥ ३॥", "padacchedaText": "", "audioFile": "PB_000338.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000339", "originalText": "यस्मादग्निवायू अपि इन्द्रवाक्यादेव विदाञ्चक्रतुः, इन्द्रेण हि उमावाक्यात्प्रथमं श्रुतं ब्रह्मेति, तस्माद्वै इन्द्रः अतितरामिव अतिशेत इव अन्यान् देवान्।", "padacchedaText": "", "audioFile": "PB_000339.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000340", "originalText": "स ह्येनन्नेदिष्ठं पस्पर्श यस्मात् स ह्येनत्प्रथमो विदाञ्चकार ब्रह्मेत्युक्तार्थं वाक्यम्॥", "padacchedaText": "", "audioFile": "PB_000340.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000341", "originalText": "तस्यैष आदेशो यदेतद्विद्युतो व्यद्युतदा३ इतीन्न्यमीमिषदा३ इत्यधिदैवतम्॥ ४॥", "padacchedaText": "", "audioFile": "PB_000341.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000342", "originalText": "तस्य प्रकृतस्य ब्रह्मणः एषः आदेशः उपमोपदेशः।", "padacchedaText": "", "audioFile": "PB_000342.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000343", "originalText": "निरुपमस्य ब्रह्मणो येनोपमानेनोपदेशः सोऽयमादेश इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_000343.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000344", "originalText": "किं तत्? यदेतत् प्रसिद्धं लोके विद्युतः व्यद्युतत् विद्योतनं कृतवदित्येतदनुपपन्नमिति विद्युतो विद्योतनमिति कल्प्यते।", "padacchedaText": "", "audioFile": "PB_000344.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000345", "originalText": "आ३ इत्युपमार्थः।", "padacchedaText": "", "audioFile": "PB_000345.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000346", "originalText": "विद्युतो विद्योतनमिवेत्यर्थः, ‘यथा सकृद्विद्युतम्’ (बृ.२.३.६) इति श्रुत्यन्तरे च दर्शनात्।", "padacchedaText": "", "audioFile": "PB_000346.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000347", "originalText": "विद्युदिव हि सकृदात्मानं दर्शयित्वा तिरोभूतं ब्रह्म देवेभ्यः।", "padacchedaText": "", "audioFile": "PB_000347.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000348", "originalText": "अथवा विद्युतः ‘तेजः’ इत्यध्याहार्यम्।", "padacchedaText": "", "audioFile": "PB_000348.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000349", "originalText": "व्यद्युतत् विद्योतितवत् आ३ इव।", "padacchedaText": "", "audioFile": "PB_000349.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000350", "originalText": "विद्युतस्तेजः सकृद्विद्योतितवदिवेत्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_000350.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000351", "originalText": "इतिशब्दः आदेशप्रतिनिर्देशार्थः— इत्ययमादेश इति।", "padacchedaText": "", "audioFile": "PB_000351.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000352", "originalText": "इच्छब्दः समुच्चयार्थः।", "padacchedaText": "", "audioFile": "PB_000352.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000353", "originalText": "अयं चापरस्तस्यादेशः।", "padacchedaText": "", "audioFile": "PB_000353.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000354", "originalText": "कोऽसौ? न्यमीमिषत् यथा चक्षुः।", "padacchedaText": "", "audioFile": "PB_000354.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000355", "originalText": "न्यमीमिषत् निमेषं कृतवत्।", "padacchedaText": "", "audioFile": "PB_000355.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000356", "originalText": "स्वार्थे णिच्।", "padacchedaText": "", "audioFile": "PB_000356.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000357", "originalText": "उपमार्थ एव आकारः।", "padacchedaText": "", "audioFile": "PB_000357.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000358", "originalText": "चक्षुषो विषयं प्रति प्रकाशतिरोभाव इव चेत्यर्थः। इति अधिदैवतं देवताविषयं ब्रह्मण उपमानदर्शनम्॥", "padacchedaText": "", "audioFile": "PB_000358.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000359", "originalText": "अथाध्यात्मं यदेतद्गच्छतीव च मनोऽनेन चैतदुपस्मरत्यभीक्ष्णं सङ्कल्पः॥ ५॥", "padacchedaText": "", "audioFile": "PB_000359.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000360", "originalText": "अथ अनन्तरम् अध्यात्मं प्रत्यगात्मविषय आदेश उच्यते।", "padacchedaText": "", "audioFile": "PB_000360.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000361", "originalText": "यदेतत् गच्छतीव च मनः।", "padacchedaText": "", "audioFile": "PB_000361.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000362", "originalText": "एतद्ब्रह्म ढौकत इव विषयीकरोतीव।", "padacchedaText": "", "audioFile": "PB_000362.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000363", "originalText": "यच्च अनेन मनसा एतत् ब्रह्म उपस्मरति समीपतः स्मरति साधकः अभीक्ष्णं भृशम्।", "padacchedaText": "", "audioFile": "PB_000363.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000364", "originalText": "सङ्कल्पश्च मनसो ब्रह्मविषयः।", "padacchedaText": "", "audioFile": "PB_000364.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000365", "originalText": "मनउपाधिकत्वाद्धि मनसः सङ्कल्पस्मृत्यादिप्रत्ययैरभिव्यज्यते ब्रह्म, विषयीक्रियमाणमिव।", "padacchedaText": "", "audioFile": "PB_000365.
