wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000366", "originalText": "अतः स एष ब्रह्मणोऽध्यात्ममादेशः।", "padacchedaText": "", "audioFile": "PB_000366.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000367", "originalText": "विद्युन्निमेषणवदधिदैवतं द्रुतप्रकाशनधर्मि, अध्यात्मं च मनःप्रत्ययसमकालाभिव्यक्तिधर्मि, इत्येष आदेशः।", "padacchedaText": "", "audioFile": "PB_000367.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000368", "originalText": "एवमादिश्यमानं हि ब्रह्म मन्दबुद्धिगम्यं भवतीति ब्रह्मण आदेश उपदेशः। न हि निरुपाधिकमेव ब्रह्म मन्दबुद्धिभिराकलयितुं शक्यम्॥", "padacchedaText": "", "audioFile": "PB_000368.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000369", "originalText": "तद्ध तद्वनं नाम तद्वनमित्युपासितव्यं स य एतदेवं वेदाभि हैनं सर्वाणि भूतानि संवाञ्छन्ति॥ ६॥", "padacchedaText": "", "audioFile": "PB_000369.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000370", "originalText": "किञ्च, तत् ब्रह्म ह किल तद्वनं नाम तस्य वनं तद्वनं तस्य प्राणिजातस्य प्रत्यगात्मभूतत्वाद्वनं वननीयं सम्भजनीयम्।", "padacchedaText": "", "audioFile": "PB_000370.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000371", "originalText": "अतः तद्वनं नाम, प्रख्यातं ब्रह्म तद्वनमिति यतः, तस्मात् तद्वनमिति अनेनैव गुणाभिधानेन उपासितव्यं चिन्तनीयम्।", "padacchedaText": "", "audioFile": "PB_000371.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000372", "originalText": "अनेन नाम्नोपासनस्य फलमाह— स यः कश्चित् एतत् यथोक्तं ब्रह्म एवं यथोक्तगुणं वेद उपास्ते अभि ह एनम् उपासकं सर्वाणि भूतानि अभि संवाञ्छन्ति ह प्रार्थयन्त एव यथा ब्रह्म॥", "padacchedaText": "", "audioFile": "PB_000372.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000373", "originalText": "उपनिषदं भो ब्रूहीत्युक्ता त उपनिषद्ब्राह्मीं वाव त उपनिषदमब्रूमेति॥ ७॥", "padacchedaText": "", "audioFile": "PB_000373.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000374", "originalText": "एवमनुशिष्टः शिष्य आचार्यमुवाच— उपनिषदं रहस्यं यच्चिन्त्यं भो भगवन् ब्रूहि इति।", "padacchedaText": "", "audioFile": "PB_000374.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000375", "originalText": "एवमुक्तवति शिष्ये आहाचार्यः— उक्ता अभिहिता ते तव उपनिषत्।", "padacchedaText": "", "audioFile": "PB_000375.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000376", "originalText": "का पुनः सेत्याह— ब्राह्मीं ब्रह्मणः परमात्मन इयं ब्राह्मी ताम्, परमात्मविषयत्वादतीतविज्ञानस्य, वाव एव ते उपनिषदमब्रूमेति उक्तामेव परमात्मविषयामुपनिषदमब्रूमेत्यवधारयत्युत्तरार्थम्।", "padacchedaText": "", "audioFile": "PB_000376.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000377", "originalText": "परमात्मविषयामुपनिषदं श्रुतवतः उपनिषदं भो ब्रूहीति पृच्छतः शिष्यस्य कोऽभिप्रायः? यदि तावच्छ्रुतस्यार्थस्य प्रश्नः कृतः, ततः पिष्टपेषणवत्पुनरुक्तोऽनर्थकः प्रश्नः स्यात्।", "padacchedaText": "", "audioFile": "PB_000377.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000378", "originalText": "अथ सावशेषोक्तोपनिषत्स्यात्, ततस्तस्याः फलवचनेनोपसंहारो न युक्तः ‘प्रेत्यास्माल्लोकादमृता भवन्ति’ (के.२.५) इति।", "padacchedaText": "", "audioFile": "PB_000378.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000379", "originalText": "तस्मादुक्तोपनिषच्छेषविषयोऽपि प्रश्नोऽनुपपन्न एव, अनवशेषितत्वात्।", "padacchedaText": "", "audioFile": "PB_000379.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000380", "originalText": "कस्तर्ह्यभिप्रायः प्रष्टुरिति।", "padacchedaText": "", "audioFile": "PB_000380.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000381", "originalText": "उच्यते।", "padacchedaText": "", "audioFile": "PB_000381.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000382", "originalText": "किं पूर्वोक्तोपनिषच्छेषतया तत्सहकारिसाधनान्तरापेक्षा, अथ निरपेक्षैव? सापेक्षा चेदपेक्षितविषयामुपनिषदं ब्रूहि।", "padacchedaText": "", "audioFile": "PB_000382.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000383", "originalText": "अथ निरपेक्षा चेदवधारय पिप्पलादवन्नातः परमस्तीत्येवमभिप्रायः।", "padacchedaText": "", "audioFile": "PB_000383.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000384", "originalText": "एतदुपपन्नमाचार्यस्यावधारणवचनम् ‘उक्ता त उपनिषत्’ इति।", "padacchedaText": "", "audioFile": "PB_000384.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000385", "originalText": "ननु नावधारणमिदम्, यतोऽन्यद्वक्तव्यमाह ‘तस्यै तपो दमः’ (के.४.८) इत्यादि।", "padacchedaText": "", "audioFile": "PB_000385.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000386", "originalText": "सत्यम्, वक्तव्यमुच्यते आचार्येण।", "padacchedaText": "", "audioFile": "PB_000386.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000387", "originalText": "न तूक्तोपनिषच्छेषतया तत्सहकारिसाधनान्तराभिप्रायेण वा, किन्तु ब्रह्मविद्याप्राप्त्युपायाभिप्रायेण वेदैस्तदङ्गैश्च सहपाठेन समीकरणात्तपःप्रभृतीनाम्।", "padacchedaText": "", "audioFile": "PB_000387.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000388", "originalText": "न हि वेदानां शिक्षाद्यङ्गानां च साक्षाद्ब्रह्मविद्याशेषत्वं तत्सहकारिसाधनत्वं वा सम्भवति।", "padacchedaText": "", "audioFile": "PB_000388.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000389", "originalText": "सहपठितानामपि यथायोगं विभज्य विनियोगः स्यादिति चेत्, यथा सूक्तवाकानुमन्त्रणमन्त्राणां यथादैवतं विभागः, तथा तपोदमकर्मसत्यादीनामपि ब्रह्मविद्याशेषत्वं तत्सहकारिसाधनत्वं वेति कल्प्यते।", "padacchedaText": "", "audioFile": "PB_000389.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000390", "originalText": "वेदानां तदङ्गानां चार्थप्रकाशकत्वेन कर्मात्मज्ञानोपायत्वमित्येवं ह्ययं विभागो युज्यते अर्थसम्बन्धोपपत्तिसामर्थ्यादिति चेत्, न, अयुक्तेः।", "padacchedaText": "", "audioFile": "PB_000390.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000391", "originalText": "न ह्ययं विभागो घटनां प्राञ्चति।", "padacchedaText": "", "audioFile": "PB_000391.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000392", "originalText": "न हि सर्वक्रियाकारकफलभेदबुद्धितिरस्कारिण्या ब्रह्मविद्यायाः शेषापेक्षा सहकारिसाधनसम्बन्धो वा युज्यते।", "padacchedaText": "", "audioFile": "PB_000392.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000393", "originalText": "सर्वविषयव्यावृत्तप्रत्यगात्मविषयनिष्ठत्वाच्च ब्रह्मविद्यायास्तत्फलस्य च निःश्रेयसस्य।", "padacchedaText": "", "audioFile": "PB_000393.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000394", "originalText": "‘मोक्षमिच्छन्सदा कर्म त्यजेदेव ससाधनम्।", "padacchedaText": "", "audioFile": "PB_000394.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000395", "originalText": "त्यजतैव हि तज्ज्ञेयं त्यक्तुः प्रत्यक्परं पदम्’ (?) तस्मात्कर्मणां सहकारित्वं कर्मशेषापेक्षा वा न ज्ञानस्योपपद्यते।", "padacchedaText": "", "audioFile": "PB_000395.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000396", "originalText": "ततोऽसदेव सूक्तवाकानुमन्त्रणवद्यथायोगं विभाग इति।", "padacchedaText": "", "audioFile": "PB_000396.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000397", "originalText": "तस्मादवधारणार्थतैव प्रश्नप्रतिवचनस्योपपद्यते। एतावत्येवेयमुपनिषदुक्तान्यनिरपेक्षा अमृतत्वाय॥", "padacchedaText": "", "audioFile": "PB_000397.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000398", "originalText": "तस्यै तपो दमः कर्मेति प्रतिष्ठा वेदाः सर्वाङ्गानि सत्यमायतनम्॥ ८॥", "padacchedaText": "", "audioFile": "PB_000398.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000399", "originalText": "यामिमां ब्राह्मीमुपनिषदं तवाग्रेऽब्रूमेति तस्यै तस्या उक्ताया उपनिषदः प्राप्त्युपायभूतानि तपआदीनि।", "padacchedaText": "", "audioFile": "PB_000399.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000400", "originalText": "तपः कायेन्द्रियमनसां समाधानम्।", "padacchedaText": "", "audioFile": "PB_000400.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000401", "originalText": "दमः उपशमः।", "padacchedaText": "", "audioFile": "PB_000401.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000402", "originalText": "कर्म अग्निहोत्रादि।", "padacchedaText": "", "audioFile": "PB_000402.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000403", "originalText": "एतैर्हि संस्कृतस्य सत्त्वशुद्धिद्वारा तत्त्वज्ञानोत्पत्तिर्दृष्टा।", "padacchedaText": "", "audioFile": "PB_000403.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000404", "originalText": "दृष्टा ह्यमृदितकल्मषस्योक्तेऽपि ब्रह्मण्यप्रतिपत्तिर्विपरीतप्रतिपत्तिश्च, यथेन्द्रविरोचनप्रभृतीनाम्।", "padacchedaText": "", "audioFile": "PB_000404.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000405", "originalText": "तस्मादिह वातीतेषु वा बहुषु जन्मान्तरेषु तपआदिभिः कृतसत्त्वशुद्धेर्ज्ञानं समुत्पद्यते यथाश्रुतम्, ‘यस्य देवे परा भक्तिर्यथा देवे तथा गुरौ।", "padacchedaText": "", "audioFile": "PB_000405.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000406", "originalText": "तस्यैते कथिता ह्यर्थाः प्रकाशन्ते महात्मनः’ (श्वे.६.२३) इति मन्त्रवर्णात्।", "padacchedaText": "", "audioFile": "PB_000406.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000407", "originalText": "‘ज्ञानमुत्पद्यते पुंसां क्षयात्पापस्य कर्मणः’ (मो.२०४.८) इति स्मृतेश्च।", "padacchedaText": "", "audioFile": "PB_000407.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000408", "originalText": "इतिशब्दः उपलक्षणत्वप्रदर्शनार्थः।", "padacchedaText": "", "audioFile": "PB_000408.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000409", "originalText": "इति एवमाद्यन्यदपि ज्ञानोत्पत्तेरुपकारकम् ‘अमानित्वमदम्भित्वम्’ (भ.गी.१३.७) इत्याद्युपदर्शितं भवति।", "padacchedaText": "", "audioFile": "PB_000409.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000410", "originalText": "प्रतिष्ठा पादौ पादाविवास्याः, तेषु हि सत्सु प्रतितिष्ठति ब्रह्मविद्या प्रवर्तते, पद्भ्यामिव पुरुषः।", "padacchedaText": "", "audioFile": "PB_000410.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000411", "originalText": "वेदाश्चत्वारः सर्वाणि चाङ्गानि शिक्षादीनि षट् कर्मज्ञानप्रकाशकत्वाद्वेदानां तद्रक्षणार्थत्वादङ्गानां प्रतिष्ठात्वम्।", "padacchedaText": "", "audioFile": "PB_000411.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000412", "originalText": "अथवा, प्रतिष्ठाशब्दस्य पादरूपकल्पनार्थत्वाद्वेदास्त्वितराणि सर्वाङ्गानि शिरआदीनि।", "padacchedaText": "", "audioFile": "PB_000412.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000413", "originalText": "अस्मिन्पक्षे शिक्षादीनां वेदग्रहणेनैव ग्रहणं कृतं प्रत्येतव्यम्।", "padacchedaText": "", "audioFile": "PB_000413.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000414", "originalText": "अङ्गिनि हि गृहीतेऽङ्गानि गृहीतान्येव भवन्ति, तदायत्तत्वादङ्गानाम्।", "padacchedaText": "", "audioFile": "PB_000414.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000415", "originalText": "सत्यम् आयतनं यत्र तिष्ठत्युपनिषत् तदायतनम्।", "padacchedaText": "", "audioFile": "PB_000415.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000416", "originalText": "सत्यमिति अमायिता अकौटिल्यं वाङ्मनःकायानाम्।", "padacchedaText": "", "audioFile": "PB_000416.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000417", "originalText": "तेषु ह्याश्रयति विद्या ये अमायाविनः साधवः, नासुरप्रकृतिषु मायाविषु, ‘न येषु जिह्ममनृतं न माया च’ (प्र.१.१६) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_000417.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000418", "originalText": "तस्मात्सत्यमायतनमिति कल्प्यते।", "padacchedaText": "", "audioFile": "PB_000418.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000419", "originalText": "तपआदिष्वेव प्रतिष्ठात्वेन प्राप्तस्य सत्यस्य पुनरायतनत्वेन ग्रहणं साधनातिशयत्वज्ञापनार्थम्।", "padacchedaText": "", "audioFile": "PB_000419.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000420", "originalText": "‘अश्वमेधसहस्रं च सत्यं च तुलया धृतम्। अश्वमेधसहस्राच्च सत्यमेकं विशिष्यते’ (महाभा.आ.७४.१०३) इति स्मृतेः॥", "padacchedaText": "", "audioFile": "PB_000420.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000421", "originalText": "यो वा एतामेवं वेदापहत्य पाप्मानमनन्ते स्वर्गे लोके ज्येये प्रतितिष्ठति प्रतितिष्ठति॥ ९॥", "padacchedaText": "", "audioFile": "PB_000421.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000422", "originalText": "यो वै एतां ब्रह्मविद्याम् ‘केनेषितम्’ (के.१.१) इत्यादिना यथोक्ताम् एवं महाभागाम् ‘ब्रह्म ह देवेभ्यः’ (के.३.१) इत्यादिना स्तुतां सर्वविद्याप्रतिष्ठां वेद।", "padacchedaText": "", "audioFile": "PB_000422.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000423", "originalText": "‘अमृतत्वं हि विन्दते’ (के.२.४) इत्युक्तमपि ब्रह्मविद्याफलमन्ते निगमयति— अपहत्य पाप्मानम् अविद्याकामकर्मलक्षणं संसारबीजं विधूय अनन्ते अपर्यन्ते स्वर्गे लोके सुखात्मके ब्रह्मणीत्येतत्।", "padacchedaText": "", "audioFile": "PB_000423.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000424", "originalText": "अनन्ते इति विशेषणान्न त्रिविष्टपे अनन्तशब्द औपचारिकोऽपि स्यादित्यत आह— ज्येये इति।", "padacchedaText": "", "audioFile": "PB_000424.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000425", "originalText": "ज्येये ज्यायसि सर्वमहत्तरे स्वात्मनि मुख्ये एव प्रतितिष्ठति। न पुनः संसारमापद्यत इत्यभिप्रायः॥", "padacchedaText": "", "audioFile": "PB_000425.wav", "zipFile": "002a_KenaPadaBhashya.zip"}, {"id": "B_000426", "originalText": "इति चतुर्थखण्डभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000426.wav", "zipFile": "002a_KenaPadaBhashya.zip"}];
        const contentDiv = document.getElementById('content');
        
        let currentIndex = -1;
        let isPlaying = false;
        
        // Use standard HTML5 audio to preserve pitch on speed changes
        const audioEl = new Audio();
        audioEl.preservesPitch = true;
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            audioEl.playbackRate = this.value;
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        let currentScript = 'devanagari';
        const scriptSelect = document.getElementById('script-select');
        scriptSelect.onchange = function() {
            currentScript = this.value;
            document.querySelectorAll('.sentence-text').forEach((span, index) => {
                let origText = manifest[index].originalText;
                if (currentScript === 'devanagari') {
                    span.innerText = origText;
                } else {
                    span.innerText = Sanscript.t(origText, 'devanagari', currentScript);
                }
            });
        };
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        playPauseBtn.onclick = () => {
            if (isPlaying) {
                audioEl.pause();
                isPlaying = false;
                playPauseBtn.innerText = "Resume";
            } else {
                playAudio(Math.max(0, currentIndex));
                playPauseBtn.innerText = "Stop";
            }
        };
        
        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'sentence-text';
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => {
                playPauseBtn.innerText = "Stop";
                playAudio(index);
            };
            contentDiv.appendChild(div);
        });
        
        // --- HTML5 Audio Prefetching Logic (via Blob URLs) ---
        const PREFETCH_BUFFER_SIZE = 3;
        let prefetchQueue = new Map(); // index -> Blob URL

        function getAudioUrl(index) {
            if (index < 0 || index >= manifest.length) return null;
            const item = manifest[index];
            const zipToUse = item.zipFile || ZIP_NAME;
            return WORKER_URL + '/' + BUCKET_NAME + '/' + zipToUse + '/' + item.audioFile;
        }

        async function fetchBlobUrl(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        async function prefetchNext(fromIndex) {
            for (let i = fromIndex + 1; i <= fromIndex + PREFETCH_BUFFER_SIZE; i++) {
                if (i >= manifest.length) break;
                if (!prefetchQueue.has(i)) {
                    prefetchQueue.set(i, 'fetching');
                    const url = getAudioUrl(i);
                    try {
                        const blobUrl = await fetchBlobUrl(url);
                        if (prefetchQueue.get(i) === 'fetching') {
                            prefetchQueue.set(i, blobUrl);
                        } else {
                            URL.revokeObjectURL(blobUrl);
                        }
                    } catch (err) {
                        console.error("Prefetch failed for index", i, err);
                        prefetchQueue.delete(i);
                    }
                }
            }
            // Cleanup old blobs to free memory
            for (let [key, val] of prefetchQueue.entries()) {
                if (key < fromIndex) {
                    if (typeof val === 'string' && val.startsWith('blob:')) {
                        URL.revokeObjectURL(val);
                    }
                    prefetchQueue.delete(key);
                }
            }
        }
        // ------------------------

        async function playAudio(index) {
            if (index < 0 || index >= manifest.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Start Reading";
                return;
            }
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            audioEl.pause();
            
            try {
                let audioUrl;
                if (prefetchQueue.has(index) && prefetchQueue.get(index) !== 'fetching') {
                    audioUrl = prefetchQueue.get(index);
                } else {
                    const sourceUrl = getAudioUrl(index);
                    audioUrl = await fetchBlobUrl(sourceUrl);
                }
                
                audioEl.src = audioUrl;
                audioEl.playbackRate = speedSlider.value;
                audioEl.onended = () => { playAudio(currentIndex + 1); };
                
                await audioEl.play();
                isPlaying = true;
                
            } catch (e) {
                console.error("Audio play error:", e);
                // Fallback to next track if error
                setTimeout(() => playAudio(currentIndex + 1), 500);
            }
            
            // Trigger prefetch for upcoming sentences
            prefetchNext(index);
        }
    </script>
</body>
