        const manifest = [{"id": "B_000000", "originalText": "श्रीमच्छङ्करभगवत्पादविरचितम् श्रीमद्भगवद्गीताभाष्यम्\n\nप्रथमोऽध्यायः\nनारायणः परोऽव्यक्तादण्डमव्यक्तसम्भवम्। अण्डस्यान्तस्त्विमे लोकाः सप्तद्वीपा च मेदिनी॥", "padacchedaText": "", "audioFile": "PB_000000.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000001", "originalText": "स भगवान् सृष्ट्वेदं जगत्, तस्य च स्थितिं चिकीर्षुः, मरीच्यादीनग्रे सृष्ट्वा प्रजापतीन्, प्रवृत्तिलक्षणं धर्मं ग्राहयामास वेदोक्तम्।", "padacchedaText": "", "audioFile": "PB_000001.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000002", "originalText": "ततोऽन्यांश्च सनकसनन्दनादीनुत्पाद्य, निवृत्तिलक्षणं धर्मं ज्ञानवैराग्यलक्षणं ग्राहयामास।", "padacchedaText": "", "audioFile": "PB_000002.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000003", "originalText": "द्विविधो हि वेदोक्तो धर्मः, प्रवृत्तिलक्षणो निवृत्तिलक्षणश्च, जगतः स्थितिकारणम्।", "padacchedaText": "", "audioFile": "PB_000003.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000004", "originalText": "प्राणिनां साक्षादभ्युदयनिःश्रेयसहेतुर्यः स धर्मो ब्राह्मणाद्यैर्वर्णिभिराश्रमिभिश्च श्रेयोर्थिभिः अनुष्ठीयमानो दीर्घेण कालेन।", "padacchedaText": "", "audioFile": "PB_000004.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000005", "originalText": "अनुष्ठातॄणां कामोद्भवात् हीयमानविवेकविज्ञानहेतुकेन अधर्मेण अभिभूयमाने धर्मे, प्रवर्धमाने च अधर्मे, जगतः स्थितिं परिपिपालयिषुः स आदिकर्ता नारायणाख्यो विष्णुः भौमस्य ब्रह्मणो ब्राह्मणत्वस्य रक्षणार्थं देवक्यां वसुदेवादंशेन कृष्णः किल सम्बभूव।", "padacchedaText": "", "audioFile": "PB_000005.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000006", "originalText": "ब्राह्मणत्वस्य हि रक्षणे रक्षितः स्याद्वैदिको धर्मः, तदधीनत्वाद्वर्णाश्रमभेदानाम्॥", "padacchedaText": "", "audioFile": "PB_000006.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000007", "originalText": "स च भगवान् ज्ञानैश्वर्यशक्तिबलवीर्यतेजोभिः सदा सम्पन्नः त्रिगुणात्मिकां स्वां मायां मूलप्रकृतिं वशीकृत्य, अजोऽव्ययो भूतानामीश्वरो नित्यशुद्धबुद्धमुक्तस्वभावोऽपि सन्, स्वमायया देहवानिव जात इव च लोकानुग्रहं कुर्वन् लक्ष्यते।", "padacchedaText": "", "audioFile": "PB_000007.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000008", "originalText": "स्वप्रयोजनाभावेऽपि भूतानुजिघृक्षया वैदिकं धर्मद्वयम् अर्जुनाय शोकमोहमहोदधौ निमग्नाय उपदिदेश, गुणाधिकैर्हि गृहीतोऽनुष्ठीयमानश्च धर्मः प्रचयं गमिष्यतीति।", "padacchedaText": "", "audioFile": "PB_000008.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000009", "originalText": "तं धर्मं भगवता यथोपदिष्टं वेदव्यासः सर्वज्ञो भगवान् गीताख्यैः सप्तभिः श्लोकशतैरुपनिबबन्ध॥", "padacchedaText": "", "audioFile": "PB_000009.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000010", "originalText": "तदिदं गीताशास्त्रं समस्तवेदार्थसारसङ्ग्रहभूतं दुर्विज्ञेयार्थम्, तदर्थाविष्करणायानेकैर्विवृतपदपदार्थवाक्यार्थन्यायमपि अत्यन्तविरुद्धानेकार्थवत्वेन लौकिकैर्गृह्यमाणमुपलभ्य अहं विवेकतोऽर्थनिर्धारणार्थं सङ्क्षेपतो विवरणं करिष्यामि॥", "padacchedaText": "", "audioFile": "PB_000010.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000011", "originalText": "तस्य अस्य गीताशास्त्रस्य सङ्क्षेपतः प्रयोजनं परं निःश्रेयसं सहेतुकस्य संसारस्य अत्यन्तोपरमलक्षणम्।", "padacchedaText": "", "audioFile": "PB_000011.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000012", "originalText": "तच्च सर्वकर्मसंन्यासपूर्वकादात्मज्ञाननिष्ठारूपात् धर्मात् भवति।", "padacchedaText": "", "audioFile": "PB_000012.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000013", "originalText": "तथा इममेव गीतार्थं धर्ममुद्दिश्य भगवतैवोक्तम्— ‘स हि धर्मः सुपर्याप्तो ब्रह्मणः पदवेदने’ (अश्व.१६.१२) इति अनुगीतासु।", "padacchedaText": "", "audioFile": "PB_000013.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000014", "originalText": "तत्रैव चोक्तम्— ‘नैव धर्मी न चाधर्मी न चैव हि शुभाशुभी। ’ (अश्व.१९.७) ‘यः स्यादेकासने लीनस्तूष्णीं किञ्चिदचिन्तयन्’ (अश्व.१९.१)॥", "padacchedaText": "", "audioFile": "PB_000014.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000015", "originalText": "इति‘ज्ञानंसंन्यासलक्षणम्’(अश्व.४३.२६)इतिच.इहापिचअन्तेउक्तमर्जुनाय—‘सर्वधर्मान्परित्यज्यमामेकंशरणंव्रज’(भ.गी.१८.६६)इति.अभ्युदयार्थोऽपियःप्रवृत्तिलक्षणोधर्मोवर्णानाश्रमांश्चोद्दिश्यविहितः,सदेवादिस्थानप्राप्तिहेतुरपिसन्,ईश्वरार्पणबुद्ध्याअनुष्ठीयमानःसत्त्वशुद्धयेभवतिफलाभिसन्धिवर्जितः.शुद्धसत्त्वस्यचज्ञाननिष्ठायोग्यताप्राप्तिद्वारेणज्ञानोत्पत्तिहेतुत्वेनचनिःश्रेयसहेतुत्वमपिप्रतिपद्यते.तथाचेममर्थमभिसन्धायवक्ष्यति—‘ब्रह्मण्याधायकर्माणि’(भ.गी.५.१०)‘योगिनःकर्मकुर्वन्तिसङ्गंत्यक्त्वात्मशुद्धये’(भ.गी.५.११)इति॥", "padacchedaText": "", "audioFile": "PB_000015.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000016", "originalText": "इमं द्विप्रकारं धर्मं निःश्रेयसप्रयोजनम्, परमार्थतत्त्वं च वासुदेवाख्यं परं ब्रह्माभिधेयभूतं विशेषतः अभिव्यञ्जयत् विशिष्टप्रयोजनसम्बन्धाभिधेयवद्गीताशास्त्रम्।", "padacchedaText": "", "audioFile": "PB_000016.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000017", "originalText": "यतः तदर्थविज्ञाने समस्तपुरुषार्थसिद्धिः, अतः तद्विवरणे यत्नः क्रियते मया॥", "padacchedaText": "", "audioFile": "PB_000017.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000018", "originalText": "धृतराष्ट्र उवाच—\nधर्मक्षेत्रे कुरुक्षेत्रे समवेता युयुत्सवः। मामकाः पाण्डवाश्चैव किमकुर्वत सञ्जय॥ १॥", "padacchedaText": "", "audioFile": "PB_000018.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000019", "originalText": "सञ्जय उवाच—\nदृष्ट्वा तु पाण्डवानीकं व्यूढं दुर्योधनस्तदा। आचार्यमुपसङ्गम्य राजा वचनमब्रवीत्॥ २॥", "padacchedaText": "", "audioFile": "PB_000019.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000020", "originalText": "पश्यैतां पाण्डुपुत्राणामाचार्य महतीं चमूम्। व्यूढां द्रुपदपुत्रेण तव शिष्येण धीमता॥ ३॥", "padacchedaText": "", "audioFile": "PB_000020.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000021", "originalText": "अत्र शूरा महेष्वासा भीमार्जुनसमा युधि। युयुधानो विराटश्च द्रुपदश्च महारथः॥ ४॥", "padacchedaText": "", "audioFile": "PB_000021.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000022", "originalText": "धृष्टकेतुश्चेकितानः काशीराजश्च वीर्यवान्। पुरुजित्कुन्तिभोजश्च शैब्यश्च नरपुङ्गवः॥ ५॥", "padacchedaText": "", "audioFile": "PB_000022.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000023", "originalText": "युधामन्युश्च विक्रान्त उत्तमौजाश्च वीर्यवान्। सौभद्रो द्रौपदेयाश्च सर्व एव महारथाः॥ ६॥", "padacchedaText": "", "audioFile": "PB_000023.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000024", "originalText": "अस्माकं तु विशिष्टा ये तान्निबोध द्विजोत्तम। नायका मम सैन्यस्य संज्ञार्थं तान्ब्रवीमि ते॥ ७॥", "padacchedaText": "", "audioFile": "PB_000024.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000025", "originalText": "भवान्भीष्मश्च कर्णश्च कृपश्च समितिञ्जयः। अश्वत्थामा विकर्णश्च सौमदत्तिर्जयद्रथः॥ ८॥", "padacchedaText": "", "audioFile": "PB_000025.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000026", "originalText": "अन्ये च बहवः शूरा मदर्थे त्यक्तजीविताः। नानाशस्त्रप्रहरणाः सर्वे युद्धविशारदाः॥ ९॥", "padacchedaText": "", "audioFile": "PB_000026.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000027", "originalText": "अपर्याप्तं तदस्माकं बलं भीष्माभिरक्षितम्। पर्याप्तं त्विदमेतेषां बलं भीमाभिरक्षितम्॥ १०॥", "padacchedaText": "", "audioFile": "PB_000027.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000028", "originalText": "अयनेषु च सर्वेषु यथाभागमवस्थिताः। भीष्ममेवाभिरक्षन्तु भवन्तः सर्व एव हि॥ ११॥", "padacchedaText": "", "audioFile": "PB_000028.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000029", "originalText": "तस्य सञ्जनयन्हर्षं कुरुवृद्धः पितामहः। सिंहनादं विनद्योच्चैः शङ्खं दध्मौ प्रतापवान्॥ १२॥", "padacchedaText": "", "audioFile": "PB_000029.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000030", "originalText": "ततः शङ्खाश्च भेर्यश्च पणवानकगोमुखाः। सहसैवाभ्यहन्यन्त स शब्दस्तुमुलोऽभवत्॥ १३॥", "padacchedaText": "", "audioFile": "PB_000030.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000031", "originalText": "ततः श्वेतैर्हयैर्युक्ते महति स्यन्दने स्थितौ। माधवः पाण्डवश्चैव दिव्यौ शङ्खौ प्रदध्मतुः॥ १४॥", "padacchedaText": "", "audioFile": "PB_000031.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000032", "originalText": "पाञ्चजन्यं हृषीकेशो देवदत्तं धनञ्जयः। पौण्ड्रं दध्मौ महाशङ्खं भीमकर्मा वृकोदरः॥ १५॥", "padacchedaText": "", "audioFile": "PB_000032.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000033", "originalText": "अनन्तविजयं राजा कुन्तीपुत्रो युधिष्ठिरः। नकुलः सहदेवश्च सुघोषमणिपुष्पकौ॥ १६॥", "padacchedaText": "", "audioFile": "PB_000033.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000034", "originalText": "काश्यश्च परमेष्वासः शिखण्डी च महारथः। धृष्टद्युम्नो विराटश्च सात्यकिश्चापराजितः॥ १७॥", "padacchedaText": "", "audioFile": "PB_000034.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000035", "originalText": "द्रुपदो द्रौपदेयाश्च सर्वशः पृथिवीपते। सौभद्रश्च महाबाहुः शङ्खान्दध्मुः पृथक्पृथक्॥ १८॥", "padacchedaText": "", "audioFile": "PB_000035.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000036", "originalText": "स घोषो धार्तराष्ट्राणां हृदयानि व्यदारयत्। नभश्च पृथिवीं चैव तुमुलो व्यनुनादयन्॥ १९॥", "padacchedaText": "", "audioFile": "PB_000036.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000037", "originalText": "अथ व्यवस्थितान्दृष्ट्वा धार्तराष्ट्रान्कपिध्वजः। प्रवृत्ते शस्त्रसम्पाते धनुरुद्यम्य पाण्डवः॥ २०॥", "padacchedaText": "", "audioFile": "PB_000037.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000038", "originalText": "हृषीकेशं तदा वाक्यमिदमाह महीपते। अर्जुन उवाच—\nसेनयोरुभयोर्मध्ये रथं स्थापय मेऽच्युत॥ २१॥", "padacchedaText": "", "audioFile": "PB_000038.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000039", "originalText": "यावदेतान्निरीक्षेऽहं योद्धुकामानवस्थितान्। कैर्मया सह योद्धव्यमस्मिन्रणसमुद्यमे॥ २२॥", "padacchedaText": "", "audioFile": "PB_000039.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000040", "originalText": "योत्स्यमानानवेक्षेऽहं य एतेऽत्र समागताः। धार्तराष्ट्रस्य दुर्बुद्धेर्युद्धे प्रियचिकीर्षवः॥ २३॥", "padacchedaText": "", "audioFile": "PB_000040.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000041", "originalText": "सञ्जय उवाच—\nएवमुक्तो हृषीकेशो गुडाकेशेन भारत। सेनयोरुभयोर्मध्ये स्थापयित्वा रथोत्तमम्॥ २४॥", "padacchedaText": "", "audioFile": "PB_000041.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000042", "originalText": "भीष्मद्रोणप्रमुखतः सर्वेषां च महीक्षिताम्। उवाच पार्थ पश्यैतान्समवेतान्कुरूनिति॥ २५॥", "padacchedaText": "", "audioFile": "PB_000042.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000043", "originalText": "तत्रापश्यत्स्थितान्पार्थः पितॄनथ पितामहान्। आचार्यान्मातुलान्भ्रातॄन्पुत्रान्पौत्रान्सखींस्तथा॥ २६॥", "padacchedaText": "", "audioFile": "PB_000043.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000044", "originalText": "श्वशुरान्सुहृदश्चैवसेनयोरुभयोरपि। तान्समीक्ष्य स कौन्तेयः सर्वान्बन्धूनवस्थितान्॥ २७॥", "padacchedaText": "", "audioFile": "PB_000044.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000045", "originalText": "कृपया परयाविष्टो विषीदन्निदमब्रवीत्। अर्जुन उवाच—\nदृष्ट्वेमान्स्वजनान्कृष्ण युयुत्सून्समुपस्थितान्॥ २८॥", "padacchedaText": "", "audioFile": "PB_000045.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000046", "originalText": "सीदन्ति मम गात्राणि मुखं च परिशुष्यति। वेपथुश्च शरीरे मे रोमहर्षश्च जायते॥ २९॥", "padacchedaText": "", "audioFile": "PB_000046.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000047", "originalText": "गाण्डीवं स्रंसते हस्तात्त्वक्चैव परिदह्यते। न च शक्नोम्यवस्थातुं भ्रमतीव च मे मनः॥ ३०॥", "padacchedaText": "", "audioFile": "PB_000047.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000048", "originalText": "निमित्तानि च पश्यामि विपरीतानि केशव। न च श्रेयोऽनुपश्यामि हत्वा स्वजनमाहवे॥ ३१॥", "padacchedaText": "", "audioFile": "PB_000048.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000049", "originalText": "न काङ्क्षे विजयं कृष्ण न च राज्यं सुखानि च। किं नो राज्येन गोविन्द किं भोगैर्जीवितेन वा॥ ३२॥", "padacchedaText": "", "audioFile": "PB_000049.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000050", "originalText": "येषामर्थे काङ्क्षितं नो राज्यं भोगाः सुखानि च। त इमेऽवस्थिता युद्धे प्राणांस्त्यक्त्वा धनानि च॥ ३३॥", "padacchedaText": "", "audioFile": "PB_000050.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000051", "originalText": "आचार्याः पितरः पुत्रास्तथैव च पितामहाः। मातुलाः श्वशुराः पौत्राः स्यालाः सम्बन्धिनस्तथा॥ ३४॥", "padacchedaText": "", "audioFile": "PB_000051.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000052", "originalText": "एतान्न हन्तुमिच्छामि घ्नतोऽपि मधुसूदन। अपि त्रैलोक्यराज्यस्य हेतोः किं नु महीकृते॥ ३५॥", "padacchedaText": "", "audioFile": "PB_000052.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000053", "originalText": "निहत्य धार्तराष्ट्रान्नः का प्रीतिः स्याज्जनार्दन। पापमेवाश्रयेदस्मान्हत्वैतानाततायिनः॥ ३६॥", "padacchedaText": "", "audioFile": "PB_000053.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000054", "originalText": "तस्मान्नार्हा वयं हन्तुं धार्तराष्ट्रान्सबान्धवान्। स्वजनं हि कथं हत्वा सुखिनः स्याम माधव॥ ३७॥", "padacchedaText": "", "audioFile": "PB_000054.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000055", "originalText": "यद्यप्येते न पश्यन्ति लोभोपहतचेतसः। कुलक्षयकृतं दोषं मित्रद्रोहे च पातकम्॥ ३८॥", "padacchedaText": "", "audioFile": "PB_000055.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000056", "originalText": "कथं न ज्ञेयमस्माभिः पापादस्मान्निवर्तितुम्। कुलक्षयकृतं दोषं प्रपश्यद्भिर्जनार्दन॥ ३९॥", "padacchedaText": "", "audioFile": "PB_000056.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000057", "originalText": "कुलक्षये प्रणश्यन्ति कुलधर्माः सनातनाः। धर्मे नष्टे कुलं कृत्स्नमधर्मोऽभिभवत्युत॥ ४०॥", "padacchedaText": "", "audioFile": "PB_000057.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000058", "originalText": "अधर्माभिभवात्कृष्ण प्रदुष्यन्ति कुलस्त्रियः। स्त्रीषु दुष्टासु वार्ष्णेय जायते वर्णसङ्करः॥ ४१॥", "padacchedaText": "", "audioFile": "PB_000058.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000059", "originalText": "सङ्करो नरकायैव कुलघ्नानां कुलस्य च। पतन्ति पितरो ह्येषां लुप्तपिण्डोदकक्रियाः॥ ४२॥", "padacchedaText": "", "audioFile": "PB_000059.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000060", "originalText": "दोषैरेतैः कुलघ्नानां वर्णसङ्करकारकैः। उत्साद्यन्ते जातिधर्माः कुलधर्माश्च शाश्वताः॥ ४३॥", "padacchedaText": "", "audioFile": "PB_000060.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000061", "originalText": "उत्सन्नकुलधर्माणां मनुष्याणां जनार्दन। नरके नियतं वासो भवतीत्यनुशुश्रुम॥ ४४॥", "padacchedaText": "", "audioFile": "PB_000061.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000062", "originalText": "अहो बत महत्पापं कर्तुं व्यवसिता वयम्। यद्राज्यसुखलोभेन हन्तुं स्वजनमुद्यताः॥ ४५॥", "padacchedaText": "", "audioFile": "PB_000062.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000063", "originalText": "यदि मामप्रतीकारमशस्त्रं शस्त्रपाणयः। धार्तराष्ट्रा रणे हन्युस्तन्मे क्षेमतरं भवेत्॥ ४६॥", "padacchedaText": "", "audioFile": "PB_000063.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000064", "originalText": "सञ्जय उवाच—\nएवमुक्त्वार्जुनः सं‍ख्ये रथोपस्थ उपाविशत्। विसृज्य सशरं चापं शोकसंविग्नमानसः॥ ४७॥", "padacchedaText": "", "audioFile": "PB_000064.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000065", "originalText": "इति श्रीमहाभारते शतसाहस्र्यां संहितायां वैयासिक्यां भीष्मपर्वणि श्रीमद्भगवद्गीतासूपनिषत्सु ब्रह्मविद्यायां योगशास्त्रे श्रीकृष्णार्जुनसंवादे अर्जुनविषादयोगो नाम प्रथमोऽध्यायः॥", "padacchedaText": "", "audioFile": "PB_000065.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000066", "originalText": "द्वितीयोऽध्यायः\nसञ्जय उवाच—\nतं तथा कृपयाविष्टमश्रुपूर्णाकुलेक्षणम्। विषीदन्तमिदं वाक्यमुवाच मधुसूदनः॥ १॥", "padacchedaText": "", "audioFile": "PB_000066.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000067", "originalText": "श्रीभगवानुवाच—\nकुतस्त्वा कश्मलमिदं विषमे समुपस्थितम्। अनार्यजुष्टमस्वर्ग्यमकीर्तिकरमर्जुन॥ २॥", "padacchedaText": "", "audioFile": "PB_000067.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000068", "originalText": "क्लैब्यं मा स्म गमः पार्थ नैतत्त्वय्युपपद्यते। क्षुद्रं हृदयदौर्बल्यं त्यक्त्वोत्तिष्ठ परन्तप॥ ३॥", "padacchedaText": "", "audioFile": "PB_000068.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000069", "originalText": "अर्जुन उवाच—\nकथं भीष्ममहं सं‍ख्ये द्रोणं च मधुसूदन। इषुभिः प्रतियोत्स्यामि पूजार्हावरिसूदन॥ ४॥", "padacchedaText": "", "audioFile": "PB_000069.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000070", "originalText": "गुरूनहत्वा हि महानुभावान् श्रेयो भोक्तुं भैक्षमपीह लोके। हत्वार्थकामांस्तु गुरूनिहैव भुञ्जीय भोगान्रुधिरप्रदिग्धान्॥ ५॥", "padacchedaText": "", "audioFile": "PB_000070.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000071", "originalText": "न चैतद्विद्मः कतरन्नो गरीयो यद्वा जयेम यदि वा नो जयेयुः। यानेव हत्वा न जिजीविषामस्तेऽवस्थिताः प्रमुखे धार्तराष्ट्राः॥ ६॥", "padacchedaText": "", "audioFile": "PB_000071.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000072", "originalText": "कार्पण्यदोषोपहतस्वभावः पृच्छामि त्वां धर्मसंमूढचेताः। यच्छ्रेयः स्यान्निश्चितं ब्रूहि तन्मे शिष्यस्तेऽहं शाधि मां त्वां प्रपन्नम्॥ ७॥", "padacchedaText": "", "audioFile": "PB_000072.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000073", "originalText": "न हि प्रपश्यामि ममापनुद्याद्यच्छोकमुच्छोषणमिन्द्रियाणाम्। अवाप्य भूमावसपत्नमृद्धं राज्यं सुराणामपि चाधिपत्यम्॥ ८॥", "padacchedaText": "", "audioFile": "PB_000073.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000074", "originalText": "सञ्जय उवाच—\nएवमुक्त्वा हृषीकेशं गुडाकेशः परन्तपः। न योत्स्य इति गोविन्दमुक्त्वा तूष्णीं बभूव ह॥ ९॥", "padacchedaText": "", "audioFile": "PB_000074.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000075", "originalText": "तमुवाच हृषीकेशः प्रहसन्निव भारत। सेनयोरुभयोर्मध्ये विषीदन्तमिदं वचः॥ १०॥", "padacchedaText": "", "audioFile": "PB_000075.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000076", "originalText": "अत्र ‘दृष्ट्वा तु पाण्डवानीकम्’ (भ.गी.१.२) इत्यारभ्य यावत् ‘न योत्स्य इति गोविन्दमुक्त्वा तूष्णीं बभूव ह’ (भ.गी.२.९) इत्येतदन्तः प्राणिनां शोकमोहादिसंसारबीजभूतदोषोद्भवकारणप्रदर्शनार्थत्वेन व्याख्येयो ग्रन्थः।", "padacchedaText": "", "audioFile": "PB_000076.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000077", "originalText": "तथाहि— अर्जुनेन राज्यगुरुपुत्रमित्रसुहृत्स्वजनसम्बन्धिबान्धवेषु ‘अहमेतेषाम्’ ‘ममैते’ इत्येवंप्रत्ययनिमित्तस्नेहविच्छेदादिनिमित्तौ आत्मनः शोकमोहौ प्रदर्शितौ ‘कथं भीष्ममहं सङ्‍ख्ये’ (भ.गी.२.४) इत्यादिना।", "padacchedaText": "", "audioFile": "PB_000077.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000078", "originalText": "शोकमोहाभ्यां ह्यभिभूतविवेकविज्ञानः स्वत एव क्षत्रधर्मे युद्धे प्रवृत्तोऽपि तस्माद्युद्धादुपरराम, परधर्मं च भिक्षाजीवनादिकं कर्तुं प्रववृते।", "padacchedaText": "", "audioFile": "PB_000078.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000079", "originalText": "तथा च सर्वप्राणिनां शोकमोहादिदोषाविष्टचेतसां स्वभावत एव स्वधर्मपरित्यागः प्रतिषिद्धसेवा च स्यात्।", "padacchedaText": "", "audioFile": "PB_000079.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000080", "originalText": "स्वधर्मे प्रवृत्तानामपि तेषां वाङ्मनःकायादीनां प्रवृत्तिः फलाभिसन्धिपूर्विकैव साहङ्कारा च भवति।", "padacchedaText": "", "audioFile": "PB_000080.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000081", "originalText": "तत्रैवं सति धर्माधर्मोपचयात् इष्टानिष्टजन्मसुखदुःख़ादिप्राप्तिलक्षणः संसारः अनुपरतो भवति।", "padacchedaText": "", "audioFile": "PB_000081.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000082", "originalText": "इत्यतः संसारबीजभूतौ शोकमोहौ तयोश्च सर्वकर्मसंन्यासपूर्वकादात्मज्ञानात् नान्यतो निवृत्तिरिति तदुपदिदिक्षुः सर्वलोकानुग्रहार्थम् अर्जुनं निमित्तीकृत्य आह भगवान्वासुदेवः— ‘अशोच्यान्’ (भ.गी.२.११) इत्यादि॥", "padacchedaText": "", "audioFile": "PB_000082.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000083", "originalText": "अत्र केचिदाहुः— सर्वकर्मसंन्यासपूर्वकादात्मज्ञाननिष्ठामात्रादेव केवलात् कैवल्यं न प्राप्यत एव।", "padacchedaText": "", "audioFile": "PB_000083.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000084", "originalText": "किं तर्हि? अग्निहोत्रादिश्रौतस्मार्तकर्मसहितात् ज्ञानात् कैवल्यप्राप्तिरिति सर्वासु गीतासु निश्चितोऽर्थ इति।", "padacchedaText": "", "audioFile": "PB_000084.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000085", "originalText": "ज्ञापकं च आहुरस्यार्थस्य— ‘अथ चेत्त्वमिमं धर्म्यं सङ्ग्रामं न करिष्यसि’ (भ.गी.२.३३) ‘कर्मण्येवाधिकारस्ते’ (भ.गी.२.४७) ‘कुरु कर्मैव तस्मात्त्वम्’ (भ.गी.४.१५) इत्यादि।", "padacchedaText": "", "audioFile": "PB_000085.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000086", "originalText": "हिंसादियुक्तत्वात् वैदिकं कर्म अधर्माय इतीयमप्याशङ्का न कार्या।", "padacchedaText": "", "audioFile": "PB_000086.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000087", "originalText": "कथम्? क्षात्रं कर्म युद्धलक्षणं गुरुभ्रातृपुत्रादिहिंसालक्षणमत्यन्तं क्रूरमपि स्वधर्म इति कृत्वा न अधर्माय, तदकरणे च ‘ततः स्वधर्मं कीर्तिं च हित्वा पापमवाप्स्यसि’ (भ.गी.२.३३) इति ब्रुवता यावज्जीवादिश्रुतिचोदितानां पश्वादिहिंसालक्षणानां च कर्मणां प्रागेव नाधर्मत्वमिति सुनिश्चितमुक्तं भवति— इति॥", "padacchedaText": "", "audioFile": "PB_000087.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000088", "originalText": "तदसत्, ज्ञानकर्मनिष्ठयोर्विभागवचनाद्बुद्धिद्वयाश्रययोः।", "padacchedaText": "", "audioFile": "PB_000088.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000089", "originalText": "‘अशोच्यान्’ (भ.गी.२.११) इत्यादिना भगवता यावत् ‘स्वधर्ममपि चावेक्ष्य’ (भ.गी.२.३१) इत्येतदन्तेन ग्रन्थेन यत्परमार्थात्मतत्त्वनिरूपणं कृतम्, तत्साङ्ख्यम्।", "padacchedaText": "", "audioFile": "PB_000089.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000090", "originalText": "तद्विषया बुद्धिः आत्मनो जन्मादिषड्विक्रियाभावादकर्ता आत्मेति प्रकरणार्थनिरूपणात् या जायते, सा साङ्ख्या बुद्धिः।", "padacchedaText": "", "audioFile": "PB_000090.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000091", "originalText": "सा येषां ज्ञानिनामुचिता भवति, ते साङ्ख्याः।", "padacchedaText": "", "audioFile": "PB_000091.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000092", "originalText": "एतस्या बुद्धेः जन्मनः प्राक् आत्मनो देहादिव्यतिरिक्तत्वकर्तृत्वभोक्तृत्वाद्यपेक्षो धर्माधर्मविवेकपूर्वको मोक्षसाधनानुष्ठानलक्षणो योगः।", "padacchedaText": "", "audioFile": "PB_000092.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000093", "originalText": "तद्विषया बुद्धिः योगबुद्धिः।", "padacchedaText": "", "audioFile": "PB_000093.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000094", "originalText": "सा येषां कर्मिणामुचिता भवति ते योगिनः।", "padacchedaText": "", "audioFile": "PB_000094.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000095", "originalText": "तथा च भगवता विभक्ते द्वे बुद्धी निर्दिष्टे ‘एषा तेऽभिहिता साङ्‍ख्ये बुद्धिर्योगे त्विमां शृणु’ (भ.गी.२.३९) इति।", "padacchedaText": "", "audioFile": "PB_000095.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000096", "originalText": "तयोश्च साङ्‍ख्यबुद्ध्याश्रयां ज्ञानयोगेन निष्ठां साङ्‍ख्यानां विभक्तां वक्ष्यति ‘पुरा वेदात्मना मया प्रोक्ता’ (भ.गी.३.३) इति।", "padacchedaText": "", "audioFile": "PB_000096.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000097", "originalText": "तथा च योगबुद्ध्याश्रयां कर्मयोगेन निष्ठां विभक्तां वक्ष्यति— ‘कर्मयोगेन योगिनाम्’ इति।", "padacchedaText": "", "audioFile": "PB_000097.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000098", "originalText": "एवं साङ्‍ख्यबुद्धिं योगबुद्धिं च आश्रित्य द्वे निष्ठे विभक्ते भगवतैव उक्ते ज्ञानकर्मणोः कर्तृत्वाकर्तृत्वैकत्वानेकत्वबुद्ध्याश्रययोः युगपदेकपुरुषाश्रयत्वासम्भवं पश्यता।", "padacchedaText": "", "audioFile": "PB_000098.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000099", "originalText": "यथा एतद्विभागवचनम्, तथैव दर्शितं शातपथीये ब्राह्मणे— ‘एतमेव प्रव्राजिनो लोकमिच्छन्तो ब्राह्मणाः प्रव्रजन्ति’ इति सर्वकर्मसंन्यासं विधाय तच्छेषेण ‘किं प्रजया करिष्यामो येषां नोऽयमात्मायं लोकः’ (बृ.४.४.२२) इति।", "padacchedaText": "", "audioFile": "PB_000099.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000100", "originalText": "तत्र च प्राक् दारपरिग्रहात् पुरुषः आत्मा प्राकृतो धर्मजिज्ञासोत्तरकालं लोकत्रयसाधनम्— पुत्रम्, द्विप्रकारं च वित्तं मानुषं दैवं च, तत्र मानुषं कर्मरूपं पितृलोकप्राप्तिसाधनं विद्यां च दैवं वित्तं देवलोकप्राप्तिसाधनम्— ‘सोऽकामयत’ (बृ.१.४.१७) इति अविद्याकामवत एव सर्वाणि कर्माणि श्रौतादीनि दर्शितानि।", "padacchedaText": "", "audioFile": "PB_000100.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000101", "originalText": "तेभ्यः ‘व्युत्थाय, प्रव्रजन्ति’ इति व्युत्थानमात्मानमेव लोकमिच्छतोऽकामस्य विहितम्। तदेतद्विभागवचनमनुपपन्नं स्याद्यदि श्रौतकर्मज्ञानयोः समुच्चयोऽभिप्रेतः स्याद्भगवतः॥", "padacchedaText": "", "audioFile": "PB_000101.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000102", "originalText": "न च अर्जुनस्य प्रश्न उपपन्नो भवति ‘ज्यायसी चेत्कर्मणस्ते’ (भ.गी.३.१) इत्यादिः।", "padacchedaText": "", "audioFile": "PB_000102.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000103", "originalText": "एकपुरुषानुष्ठेयत्वासम्भवं बुद्धिकर्मणोः भगवता पूर्वमनुक्तं कथमर्जुनः अश्रुतं बुद्धेश्च कर्मणो ज्यायस्त्वं भगवत्यध्यारोपयेन्मृषैव ‘ज्यायसी चेत्कर्मणस्ते मता बुद्धिः’ (भ.गी.३.१) इति॥", "padacchedaText": "", "audioFile": "PB_000103.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000104", "originalText": "किञ्च— यदि बुद्धिकर्मणोः सर्वेषां समुच्चय उक्तः स्यात् अर्जुनस्यापि स उक्त एवेति, ‘यच्छ्रेय एतयोरेकं तन्मे ब्रूहि सुनिश्चितम्’ (भ.गी.५.१) इति कथमुभयोरुपदेशे सति अन्यतरविषय एव प्रश्नः स्यात्? न हि पित्तप्रशमनार्थिनः वैद्येन मधुरं शीतलं च भोक्तव्यम् इत्युपदिष्टे तयोरन्यतरत्पित्तप्रशमनकारणं ब्रूहि इति प्रश्नः सम्भवति॥", "padacchedaText": "", "audioFile": "PB_000104.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000105", "originalText": "अथ अर्जुनस्य भगवदुक्तवचनार्थविवेकानवधारणनिमित्तः प्रश्नः कल्प्येत, तथापि भगवता प्रश्नानुरूपं प्रतिवचनं देयम्— मया बुद्धिकर्मणोः समुच्चय उक्तः, किमर्थमित्थं त्वं भ्रान्तोऽसि— इति।", "padacchedaText": "", "audioFile": "PB_000105.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000106", "originalText": "न तु पुनः प्रतिवचनमननुरूपं पृष्टादन्यदेव ‘द्वे निष्ठे मया पुरा प्रोक्ते’ (भ.गी.३.३) इति वक्तुं युक्तम्॥", "padacchedaText": "", "audioFile": "PB_000106.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000107", "originalText": "नापि स्मार्तेनैव कर्मणा बुद्धेः समुच्चये अभिप्रेते विभागवचनादि सर्वमुपपन्नम्। किञ्च— क्षत्रियस्य युद्धं स्मार्तं कर्म स्वधर्म इति जानतः ‘तत्किं कर्मणि घोरे मां नियोजयसि’ (भ.गी.३.१) इति उपालम्भोऽनुपपन्नः॥", "padacchedaText": "", "audioFile": "PB_000107.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000108", "originalText": "तस्माद्गीताशास्त्रे ईषन्मात्रेणापि श्रौतेन स्मार्तेन वा कर्मणा आत्मज्ञानस्य समुच्चयो न केनचिद्दर्शयितुं शक्यः।", "padacchedaText": "", "audioFile": "PB_000108.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000109", "originalText": "यस्य तु अज्ञानात् रागादिदोषतो वा कर्मणि प्रवृत्तस्य यज्ञेन दानेन तपसा वा विशुद्धसत्त्वस्य ज्ञानमुत्पन्नम्परमार्थतत्त्वविषयम् ‘एकमेवेदं सर्वं ब्रह्म अकर्तृ च’ इति, तस्य कर्मणि कर्मप्रयोजने च निवृत्तेऽपि लोकसङ्ग्रहार्थं यत्नपूर्वं यथा प्रवृत्तिः, तथैव प्रवृत्तस्य यत्प्रवृत्तिरूपं दृश्यते न तत्कर्म येन बुद्धेः समुच्चयः स्यात्, यथा भगवतो वासुदेवस्य क्षत्रधर्मचेष्टितं न ज्ञानेन समुच्चीयते पुरुषार्थसिद्धये, तद्वत् तत्फलाभिसन्ध्यहङ्काराभावस्य तुल्यत्वाद्विदुषः।", "padacchedaText": "", "audioFile": "PB_000109.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000110", "originalText": "तत्त्वविन्नाहं करोमीति मन्यते, न च तत्फलमभिसन्धत्ते।", "padacchedaText": "", "audioFile": "PB_000110.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000111", "originalText": "यथा च स्वर्गादिकामार्थिनः अग्निहोत्रादिकर्मलक्षणधर्मानुष्ठानाय आहिताग्नेः काम्ये एव अग्निहोत्रादौ प्रवृत्तस्य सामि कृते विनष्टेऽपि कामे तदेव अग्निहोत्राद्यनुतिष्ठतोऽपि न तत्काम्यमग्निहोत्रादि भवति।", "padacchedaText": "", "audioFile": "PB_000111.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000112", "originalText": "तथा च दर्शयति भगवान्— ‘कुर्वन्नपि न लिप्यते’ (भ.गी.५.७) ‘न करोति न लिप्यते’ (भ.गी.१३.३१) इति तत्र तत्र॥", "padacchedaText": "", "audioFile": "PB_000112.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000113", "originalText": "यच्च ‘पूर्वैः पूर्वतरं कृतम्’ (भ.गी.४.१५) ‘कर्मणैव हि संसिद्धिमास्थिता जनकादयः’ (भ.गी.३.२०) इति, तत्तु प्रविभज्य विज्ञेयम्।", "padacchedaText": "", "audioFile": "PB_000113.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000114", "originalText": "तत्कथम्? यदि तावत् पूर्वे जनकादयः तत्त्वविदोऽपि प्रवृत्तकर्माणः स्युः, ते लोकसङ्ग्रहार्थम् ‘गुणा गुणेषु वर्तन्ते’ (भ.गी.३.२८) इति ज्ञानेनैव संसिद्धिमास्थिताः, कर्मसंन्यासे प्राप्तेऽपि कर्मणा सहैव संसिद्धिमास्थिताः, न कर्मसंन्यासं कृतवन्त इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000114.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000115", "originalText": "अथ न ते तत्त्वविदः, ईश्वरसमर्पितेन कर्मणा साधनभूतेन संसिद्धिं सत्त्वशुद्धिम्, ज्ञानोत्पत्तिलक्षणां वा संसिद्धिम्, आस्थिता जनकादय इति व्याख्येयम्।", "padacchedaText": "", "audioFile": "PB_000115.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000116", "originalText": "एवमेवार्थं वक्ष्यति भगवान् ‘सत्त्वशुद्धये कर्म कुर्वन्ति’ (भ.गी.५.११) इति।", "padacchedaText": "", "audioFile": "PB_000116.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000117", "originalText": "‘स्वकर्मणा तमभ्यर्च्य सिद्धिं विन्दति मानवः’ (भ.गी.१८.४६) इत्युक्त्वा सिद्धिं प्राप्तस्य पुनर्ज्ञाननिष्ठां वक्ष्यति— ‘सिद्धिं प्राप्तो यथा ब्रह्म’ (भ.गी.१८.५०) इत्यादिना॥", "padacchedaText": "", "audioFile": "PB_000117.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000118", "originalText": "तस्माद्गीताशास्त्रे केवलादेव तत्त्वज्ञानान्मोक्षप्राप्तिः न कर्मसमुच्चितात्, इति निश्चितोऽर्थः। यथा चायमर्थः, तथा प्रकरणशो विभज्य तत्र तत्र दर्शयिष्यामः॥", "padacchedaText": "", "audioFile": "PB_000118.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000119", "originalText": "तत्रैवं धर्मसंमूढचेतसो मिथ्याज्ञानवतो महति शोकसागरे निमग्नस्य अर्जुनस्य अन्यत्रात्मज्ञानादुद्धरणमपश्यन् भगवान्वासुदेवः ततः कृपया अर्जुनमुद्दिधारयिषुः आत्मज्ञानायावतारयन्नाह—\nश्रीभगवानुवाच—\nअशोच्यानन्वशोचस्त्वं प्रज्ञावादांश्च भाषसे।", "padacchedaText": "", "audioFile": "PB_000119.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000120", "originalText": "गतासूनगतासूंश्च नानुशोचन्ति पण्डिताः॥ ११॥", "padacchedaText": "", "audioFile": "PB_000120.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000121", "originalText": "अशोच्यान् इत्यादि।", "padacchedaText": "", "audioFile": "PB_000121.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000122", "originalText": "न शोच्या अशोच्याः भीष्मद्रोणादयः, सद्वृत्तत्वात् परमार्थस्वरूपेण च नित्यत्वात्, तान् अशोच्यान् अन्वशोचः अनुशोचितवानसि ‘ते म्रियन्ते मन्निमित्तम्, अहं तैर्विनाभूतः किं करिष्यामि राज्यसुखादिना’ इति।", "padacchedaText": "", "audioFile": "PB_000122.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000123", "originalText": "त्वं प्रज्ञावादान् प्रज्ञावतां बुद्धिमतां वादांश्च वचनानि च भाषसे| तदेतत् मौढ्यं पाण्डित्यं च विरुद्धम् आत्मनि दर्शयसि उन्मत्त इव इत्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_000123.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000124", "originalText": "यस्मात् गतासून् गतप्राणान् मृतान्, अगतासून् अगतप्राणान् जीवतश्च न अनुशोचन्ति पण्डिताः आत्मज्ञाः।", "padacchedaText": "", "audioFile": "PB_000124.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000125", "originalText": "पण्डा आत्मविषया बुद्धिः येषां ते हि पण्डिताः, ‘पाण्डित्यं निर्विद्य’ (बृ.३.५.१) इति श्रुतेः। परमार्थतस्तु तान् नित्यान् अशोच्यान् अनुशोचसि, अतो मूढोऽसि इत्यभिप्रायः॥ ११॥", "padacchedaText": "", "audioFile": "PB_000125.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000126", "originalText": "कुतस्ते अशोच्याः, यतो नित्याः।", "padacchedaText": "", "audioFile": "PB_000126.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000127", "originalText": "कथम्?—\nन त्वेवाहं जातु नासं न त्वं नेमे जनाधिपाः। न चैव न भविष्यामः सर्वे वयमतः परम्॥ १२॥", "padacchedaText": "", "audioFile": "PB_000127.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000128", "originalText": "न तु एव जातु कदाचित् अहं नासम्, किं तु आसमेव।", "padacchedaText": "", "audioFile": "PB_000128.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000129", "originalText": "अतीतेषु देहोत्पत्तिविनाशेषु घटादिषु वियदिव नित्य एव अहमासमित्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_000129.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000130", "originalText": "तथा न त्वं न आसीः, किं तु आसीरेव।", "padacchedaText": "", "audioFile": "PB_000130.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000131", "originalText": "तथा न इमे जनाधिपाः न आसन्, किं तु आसन्नेव।", "padacchedaText": "", "audioFile": "PB_000131.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000132", "originalText": "तथा न च एव न भविष्यामः, किं तु भविष्याम एव, सर्वे वयम् अतः अस्मात् देहविनाशात् परम् उत्तरकाले अपि।", "padacchedaText": "", "audioFile": "PB_000132.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000133", "originalText": "त्रिष्वपि कालेषु नित्या आत्मस्वरूपेण इत्यर्थः। देहभेदानुवृत्त्या बहुवचनम्, नात्मभेदाभिप्रायेण॥ १२॥", "padacchedaText": "", "audioFile": "PB_000133.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000134", "originalText": "तत्र कथमिव नित्य आत्मेति दृष्टान्तमाह—\nदेहिनोऽस्मिन्यथा देहे कौमारं यौवनं जरा। तथा देहान्तरप्राप्तिर्धीरस्तत्र न मुह्यति॥ १३॥", "padacchedaText": "", "audioFile": "PB_000134.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000135", "originalText": "देहः अस्य अस्तीति देही, तस्य देहिनो देहवतः आत्मनः अस्मिन् वर्तमाने देहे यथा येन प्रकारेण कौमारं कुमारभावो बाल्यावस्था, यौवनं यूनो भावो मध्यमावस्था, जरा वयोहानिः जीर्णावस्था, इत्येताः तिस्रः अवस्थाः अन्योन्यविलक्षणाः।", "padacchedaText": "", "audioFile": "PB_000135.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000136", "originalText": "तासां प्रथमावस्थानाशे न नाशः, द्वितीयावस्थोपजने न उपजन आत्मनः।", "padacchedaText": "", "audioFile": "PB_000136.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000137", "originalText": "किं तर्हि? अविक्रियस्यैव द्वितीयतृतीयावस्थाप्राप्तिः आत्मनो दृष्टा।", "padacchedaText": "", "audioFile": "PB_000137.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000138", "originalText": "तथा तद्वदेव देहात् अन्यो देहो देहान्तरम्, तस्य प्राप्तिः देहान्तरप्राप्तिः अविक्रियस्यैव आत्मनः इत्यर्थः। धीरो धीमान्, तत्र एवं सति न मुह्यति न मोहमापद्यते॥ १३॥", "padacchedaText": "", "audioFile": "PB_000138.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000139", "originalText": "यद्यपि आत्मविनाशनिमित्तो मोहो न सम्भवति नित्य आत्मा इति विजानतः, तथापि शीतोष्णसुखदुःखप्राप्तिनिमित्तो मोहो लौकिको दृश्यते, सुखवियोगनिमित्तो मोहः दुःखसंयोगनिमित्तश्च शोकः।", "padacchedaText": "", "audioFile": "PB_000139.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000140", "originalText": "इत्येतदर्जुनस्य वचनमाशङ्क्य भगवानाह—\nमात्रास्पर्शास्तु कौन्तेय शीतोष्णसुखदुःखदाः। आगमापायिनोऽनित्यास्तांस्तितिक्षस्व भारत॥ १४॥", "padacchedaText": "", "audioFile": "PB_000140.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000141", "originalText": "मात्राः आभिः मीयन्ते शब्दादय इति श्रोत्रादीनि इन्द्रियाणि।", "padacchedaText": "", "audioFile": "PB_000141.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000142", "originalText": "मात्राणां स्पर्शाः शब्दादिभिः संयोगाः।", "padacchedaText": "", "audioFile": "PB_000142.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000143", "originalText": "ते शीतोष्णसुखदुःखदाः शीतम् उष्णं सुखं दुःखं च प्रयच्छन्तीति।", "padacchedaText": "", "audioFile": "PB_000143.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000144", "originalText": "अथवा स्पृश्यन्त इति स्पर्शाः विषयाः शब्दादयः।", "padacchedaText": "", "audioFile": "PB_000144.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000145", "originalText": "मात्राश्च स्पर्शाश्च शीतोष्णसुखदुःखदाः।", "padacchedaText": "", "audioFile": "PB_000145.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000146", "originalText": "शीतं कदाचित् सुखं कदाचित् दुःखम्।", "padacchedaText": "", "audioFile": "PB_000146.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000147", "originalText": "तथा उष्णमपि अनियतस्वरूपम्।", "padacchedaText": "", "audioFile": "PB_000147.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000148", "originalText": "सुखदुःखे पुनः नियतरूपे यतो न व्यभिचरतः।", "padacchedaText": "", "audioFile": "PB_000148.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000149", "originalText": "अतः ताभ्यां पृथक् शीतोष्णयोः ग्रहणम्।", "padacchedaText": "", "audioFile": "PB_000149.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000150", "originalText": "यस्मात् ते मात्रास्पर्शादयः आगमापायिनः आगमापायशीलाः तस्मात् अनित्याः।", "padacchedaText": "", "audioFile": "PB_000150.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000151", "originalText": "अतः तान् शीतोष्णादीन् तितिक्षस्व प्रसहस्व। तेषु हर्षं विषादं वा मा कार्षीः इत्यर्थः॥ १४॥", "padacchedaText": "", "audioFile": "PB_000151.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000152", "originalText": "शीतोष्णादीन् सहतः किं स्यादिति शृणु—\nयं हि न व्यथयन्त्येते पुरुषं पुरुषर्षभ। समदुःखसुखं धीरं सोऽमृतत्वाय कल्पते॥ १५॥", "padacchedaText": "", "audioFile": "PB_000152.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000153", "originalText": "यं हि पुरुषं समे दुःखसुखे यस्य तं समदुःखसुखं सुखदुःखप्राप्तौ हर्षविषादरहितं धीरं धीमन्तं न व्यथयन्ति न चालयन्ति नित्यात्मदर्शनात् एते यथोक्ताः शीतोष्णादयः, सः नित्यात्मस्वरूपदर्शननिष्ठो द्वन्द्वसहिष्णुः अमृतत्वाय अमृतभावाय मोक्षायेत्यर्थः, कल्पते समर्थो भवति॥ १५॥", "padacchedaText": "", "audioFile": "PB_000153.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000154", "originalText": "इतश्च शोकमोहौ अकृत्वा शीतोष्णादिसहनं युक्तम्, यस्मात्—\nनासतो विद्यते भावो नाभावो विद्यते सतः। उभयोरपि दृष्टोऽन्तस्त्वनयोस्तत्त्वदर्शिभिः॥ १६॥", "padacchedaText": "", "audioFile": "PB_000154.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000155", "originalText": "न असतः अविद्यमानस्य शीतोष्णादेः सकारणस्य न विद्यते नास्ति भावो भवनम् अस्तिता॥", "padacchedaText": "", "audioFile": "PB_000155.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000156", "originalText": "न हि शीतोष्णादि सकारणं प्रमाणैर्निरूप्यमाणं वस्तुसद्भवति।", "padacchedaText": "", "audioFile": "PB_000156.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000157", "originalText": "विकारो हि सः, विकारश्च व्यभिचरति।", "padacchedaText": "", "audioFile": "PB_000157.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000158", "originalText": "यथा घटादिसंस्थानं चक्षुषा निरूप्यमाणं मृद्व्यतिरेकेणानुपलब्धेरसत्, तथा सर्वो विकारः कारणव्यतिरेकेणानुपलब्धेरसन्। जन्मप्रध्वंसाभ्यां प्रागूर्ध्वं च अनुपलब्धेः कार्यस्य घटादेः मृदादिकारणस्य च तत्कारणव्यतिरेकेणानुपलब्धेरसत्त्वम्॥", "padacchedaText": "", "audioFile": "PB_000158.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000159", "originalText": "तदसत्त्वे सर्वाभावप्रसङ्ग इति चेत्, न, सर्वत्र बुद्धिद्वयोपलब्धेः, सद्बुद्धिरसद्बुद्धिरिति।", "padacchedaText": "", "audioFile": "PB_000159.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000160", "originalText": "यद्विषया बुद्धिर्न व्यभिचरति, तत् सत्, यद्विषया व्यभिचरति, तदसत्, इति सदसद्विभागे बुद्धितन्त्रे स्थिते, सर्वत्र द्वे बुद्धी सर्वैरुपलभ्येते समानाधिकरणे न नीलोत्पलवत्, सन् घटः, सन् पटः, सन् हस्ती इति।", "padacchedaText": "", "audioFile": "PB_000160.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000161", "originalText": "एवं सर्वत्र तयोर्बुद्ध्योः घटादिबुद्धिः व्यभिचरति।", "padacchedaText": "", "audioFile": "PB_000161.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000162", "originalText": "तथा च दर्शितम्।", "padacchedaText": "", "audioFile": "PB_000162.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000163", "originalText": "न तु सद्बुद्धिः। तस्मात् घटादिबुद्धिविषयः असन्, व्यभिचारात्, न तु सद्बुद्धिविषयः, अव्यभिचारात्॥", "padacchedaText": "", "audioFile": "PB_000163.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000164", "originalText": "घटे विनष्टे घटबुद्दौ व्यभिचरन्त्यां सद्बुद्धिरपि व्यभिचरतीति चेत्, न, पटादावपि सद्बुद्धिदर्शनात्। विशेषणविषयैव सा सद्बुद्धिः॥", "padacchedaText": "", "audioFile": "PB_000164.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000165", "originalText": "सद्बुद्धिवत् घटबुद्धिरपि घटान्तरे दृश्यत इति चेत्, न, पटादौ अदर्शनात्॥", "padacchedaText": "", "audioFile": "PB_000165.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000166", "originalText": "सद्बुद्धिरपि नष्टे घटे न दृश्यत इति चेत्, न, विशेष्याभावात् सद्बुद्धिः विशेषणविषया सती विशेष्याभावे विशेषणानुपपत्तौ किंविषया स्यात्? न तु पुनः सद्बुद्धेः विषयाभावात्॥", "padacchedaText": "", "audioFile": "PB_000166.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000167", "originalText": "एकाधिकरणत्वं घटादिविशेष्याभावे न युक्तमिति चेत्, न, ‘इदमुदकम्’ इति मरीच्यादौ अन्यतराभावेऽपि सामानाधिकरण्यदर्शनात्॥", "padacchedaText": "", "audioFile": "PB_000167.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000168", "originalText": "तस्माद्देहादेः द्वन्द्वस्य च सकारणस्य असतो न विद्यते भाव इति। तथा सतश्च आत्मनः अभावः अविद्यमानता न विद्यते, सर्वत्र अव्यभिचारात् इति अवोचाम॥", "padacchedaText": "", "audioFile": "PB_000168.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000169", "originalText": "एवम् आत्मानात्मनोः सदसतोः उभयोरपि दृष्टः उपलब्धः अन्तो निर्णयः सत् सदेव असत् असदेवेति, तु अनयोः यथोक्तयोः तत्त्वदर्शिभिः।", "padacchedaText": "", "audioFile": "PB_000169.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000170", "originalText": "तदिति सर्वनाम, सर्वं च ब्रह्म, तस्य नाम तदिति, तद्भावः तत्त्वम्, ब्रह्मणो याथात्म्यम्।", "padacchedaText": "", "audioFile": "PB_000170.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000171", "originalText": "तत् द्रष्टुं शीलं येषां ते तत्त्वदर्शिनः, तैः तत्त्वदर्शिभिः।", "padacchedaText": "", "audioFile": "PB_000171.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000172", "originalText": "त्वमपि तत्त्वदर्शिनां दृष्टिमाश्रित्य शोकं मोहं च हित्वा शीतोष्णादीनि नियतानियतरूपाणि द्वन्द्वानि ‘विकारोऽयमसन्नेव मरीचिजलवन्मिथ्यावभासते’ इति मनसि निश्चित्य तितिक्षस्व इत्यभिप्रायः॥ १६॥", "padacchedaText": "", "audioFile": "PB_000172.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000173", "originalText": "किं पुनस्तत्, यत् सदेव सर्वदा इति, उच्यते—\nअविनाशि तु तद्विद्धि येन सर्वमिदं ततम्। विनाशमव्ययस्यास्य न कश्चित्कर्तुमर्हति॥ १७॥", "padacchedaText": "", "audioFile": "PB_000173.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000174", "originalText": "अविनाशि न विनष्टुं शीलं यस्येति।", "padacchedaText": "", "audioFile": "PB_000174.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000175", "originalText": "तुशब्दः असतो विशेषणार्थः।", "padacchedaText": "", "audioFile": "PB_000175.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000176", "originalText": "तत् विद्धि विजानीहि।", "padacchedaText": "", "audioFile": "PB_000176.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000177", "originalText": "किम्? येन सर्वम् इदं जगत् ततं व्याप्तं सदाख्येन ब्रह्मणा साकाशम्, आकाशेनेव घटादयः।", "padacchedaText": "", "audioFile": "PB_000177.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000178", "originalText": "विनाशम् अदर्शनम् अभावम्।", "padacchedaText": "", "audioFile": "PB_000178.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000179", "originalText": "अव्ययस्य न व्येति उपचयापचयौ न याति इति अव्ययं तस्य अव्ययस्य।", "padacchedaText": "", "audioFile": "PB_000179.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000180", "originalText": "नैतत् सदाख्यं ब्रह्म स्वेन रूपेण व्येति व्यभिचरति, निरवयवत्वात्, देहादिवत्।", "padacchedaText": "", "audioFile": "PB_000180.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000181", "originalText": "नाप्यात्मीयेन, आत्मीयाभावात्।", "padacchedaText": "", "audioFile": "PB_000181.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000182", "originalText": "यथा देवदत्तो धनहान्या व्येति, न तु एवं ब्रह्म व्येति।", "padacchedaText": "", "audioFile": "PB_000182.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000183", "originalText": "अतः अव्ययस्य अस्य ब्रह्मणः विनाशं न कश्चित् कर्तुमर्हति, न कश्चित् आत्मानं विनाशयितुं शक्नोति ईश्वरोऽपि। आत्मा हि ब्रह्म, स्वात्मनि च क्रियाविरोधात्॥ १७॥", "padacchedaText": "", "audioFile": "PB_000183.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000184", "originalText": "किं पुनस्तदसत्, यत्स्वात्मसत्तां व्यभिचरतीति, उच्यते—\nअन्तवन्त इमे देहा नित्यस्योक्ताः शरीरिणः। अनाशिनोऽप्रमेयस्य तस्माद्युध्यस्व भारत॥ १८॥", "padacchedaText": "", "audioFile": "PB_000184.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000185", "originalText": "अन्तः विनाशः विद्यते येषां ते अन्तवन्तः।", "padacchedaText": "", "audioFile": "PB_000185.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000186", "originalText": "यथा मृगतृष्णिकादौ सद्बुद्धिः अनुवृत्ता प्रमाणनिरूपणान्ते विच्छिद्यते, स तस्य अन्तः, तथा इमे देहाः स्वप्नमायादेहादिवच्च अन्तवन्तः नित्यस्य शरीरिणः शरीरवतः अनाशिनः अप्रमेयस्य आत्मनः अन्तवन्त इति उक्ताः विवेकिभिरित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000186.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000187", "originalText": "‘नित्यस्य’ ‘अनाशिनः’ इति न पुनरुक्तम्, नित्यत्वस्य द्विविधत्वात् लोके, नाशस्य च।", "padacchedaText": "", "audioFile": "PB_000187.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000188", "originalText": "यथा देहो भस्मीभूतः अदर्शनं गतो नष्ट उच्यते।", "padacchedaText": "", "audioFile": "PB_000188.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000189", "originalText": "विद्यमानोऽपि यथा अन्यथा परिणतो व्याध्यादियुक्तो जातो नष्ट उच्यते।", "padacchedaText": "", "audioFile": "PB_000189.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000190", "originalText": "तत्र ‘नित्यस्य’ ‘अनाशिनः’ इति द्विविधेनापि नाशेन असम्बन्धः अस्येत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000190.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000191", "originalText": "अन्यथा पृथिव्यादिवदपि नित्यत्वं स्यात् आत्मनः, तत् मा भूदिति ‘नित्यस्य’ ‘अनाशिनः’ इत्याह। अप्रमेयस्य न प्रमेयस्य प्रत्यक्षादिप्रमाणैः अपरिच्छेद्यस्येत्यर्थः॥", "padacchedaText": "", "audioFile": "PB_000191.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000192", "originalText": "ननु आगमेन आत्मा परिच्छिद्यते, प्रत्यक्षादिना च पूर्वम्।", "padacchedaText": "", "audioFile": "PB_000192.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000193", "originalText": "न, आत्मनः स्वतःसिद्धत्वात्।", "padacchedaText": "", "audioFile": "PB_000193.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000194", "originalText": "सिद्धे हि आत्मनि प्रमातरि प्रमित्सोः प्रमाणान्वेषणा भवति।", "padacchedaText": "", "audioFile": "PB_000194.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000195", "originalText": "न हि पूर्वम् ‘इत्थमहम्’ इति आत्मानमप्रमाय पश्चात् प्रमेयपरिच्छेदाय प्रवर्तते।", "padacchedaText": "", "audioFile": "PB_000195.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000196", "originalText": "न हि आत्मा नाम कस्यचित् अप्रसिद्धो भवति।", "padacchedaText": "", "audioFile": "PB_000196.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000197", "originalText": "शास्त्रं तु अन्त्यं प्रमाणम् अतद्धर्माध्यारोपणमात्रनिवर्तकत्वेन प्रमाणत्वम् आत्मनः प्रतिपद्यते, न तु अज्ञातार्थज्ञापकत्वेन। तथा च श्रुतिः— ‘यत्साक्षादपरोक्षाद्ब्रह्म य आत्मा सर्वान्तरः’ (बृ.३.५.१) इति॥", "padacchedaText": "", "audioFile": "PB_000197.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000198", "originalText": "यस्मादेवं नित्यः अविक्रियश्च आत्मा तस्मात् युध्यस्व, युद्धात् उपरमं मा कार्षीः इत्यर्थः॥", "padacchedaText": "", "audioFile": "PB_000198.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000199", "originalText": "न हि अत्र युद्धकर्तव्यता विधीयते, युद्धे प्रवृत्त एव हि असौ शोकमोहप्रतिबद्धः तूष्णीमास्ते।", "padacchedaText": "", "audioFile": "PB_000199.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000200", "originalText": "अतः तस्य प्रतिबन्धापनयनमात्रं भगवता क्रियते। तस्मात् ‘युध्यस्व’ इति अनुवादमात्रम्, न विधिः॥ १८॥", "padacchedaText": "", "audioFile": "PB_000200.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000201", "originalText": "शोकमोहादिसंसारकारणनिवृत्त्यर्थः गीताशास्त्रम्, न प्रवर्तकम् इत्येतस्यार्थस्य साक्षिभूते ऋचौ आनीनाय भगवान्।", "padacchedaText": "", "audioFile": "PB_000201.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000202", "originalText": "यत्तु मन्यसे ‘युद्धे भीष्मादयो मया हन्यन्ते’ ‘अहमेव तेषां हन्ता’ इति, एषा बुद्धिः मृषैव ते।", "padacchedaText": "", "audioFile": "PB_000202.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000203", "originalText": "कथम्?—\nय एनं वेत्ति हन्तारं यश्चैनं मन्यते हतम्। उभौ तौ न विजानीतो नायं हन्ति न हन्यते॥ १९॥", "padacchedaText": "", "audioFile": "PB_000203.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000204", "originalText": "य एनं प्रकृतं देहिनं वेत्ति विजानाति हन्तारं हननक्रियायाः कर्तारं यश्च एनम् अन्यो मन्यते हतं देहहननेन ‘हतः अहम्’ इति हननक्रियायाः कर्मभूतम्, तौ उभौ न विजानीतः न ज्ञातवन्तौ अविवेकेन आत्मानम्।", "padacchedaText": "", "audioFile": "PB_000204.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000205", "originalText": "‘हन्ता अहम्’ ‘हतः अस्मि अहम्’ इति देहहननेन आत्मानमहं प्रत्ययविषयं यौ विजानीतः तौ आत्मस्वरूपानभिज्ञौ इत्यर्थः। यस्मात् न अयम् आत्मा हन्ति न हननक्रियायाः कर्ता भवति, न च हन्यते न च कर्म भवतीत्यर्थः, अविक्रियत्वात्॥ १९॥", "padacchedaText": "", "audioFile": "PB_000205.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000206", "originalText": "कथमविक्रय आत्मेति द्वितीयो मन्त्रः—\nन जायते म्रियते वा कदाचिन्नायं भूत्वाभविता वा न भूयः। अजो नित्यः शाश्वतोऽयं पुराणो न हन्यते हन्यमाने शरीरे॥ २०॥", "padacchedaText": "", "audioFile": "PB_000206.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000207", "originalText": "न जायते न उत्पद्यते, जनिलक्षणा वस्तुविक्रिया न आत्मनो विद्यते इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000207.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000208", "originalText": "तथा न म्रियते वा।", "padacchedaText": "", "audioFile": "PB_000208.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000209", "originalText": "वाशब्दः चार्थे।", "padacchedaText": "", "audioFile": "PB_000209.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000210", "originalText": "न म्रियते च इति अन्त्या विनाशलक्षणा विक्रिया प्रतिषिध्यते।", "padacchedaText": "", "audioFile": "PB_000210.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000211", "originalText": "कदाचिच्छब्दः सर्वविक्रियाप्रतिषेधैः सम्बध्यते— न कदाचित् जायते, न कदाचित् म्रियते, इत्येवम्।", "padacchedaText": "", "audioFile": "PB_000211.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000212", "originalText": "यस्मात् अयम् आत्मा भूत्वा भवनक्रियामनुभूय पश्चात् अभविता अभावं गन्ता न भूयः पुनः, तस्मात् न म्रियते।", "padacchedaText": "", "audioFile": "PB_000212.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000213", "originalText": "योहि भूत्वा न भविता स म्रियत इत्युच्यते लोके।", "padacchedaText": "", "audioFile": "PB_000213.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000214", "originalText": "वाशब्दात् नशब्दाच्च अयमात्मा अभूत्वा वा भविता देहवत् न भूयः।", "padacchedaText": "", "audioFile": "PB_000214.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000215", "originalText": "तस्मात् न जायते।", "padacchedaText": "", "audioFile": "PB_000215.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000216", "originalText": "यो हि अभूत्वा भविता स जायत इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_000216.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000217", "originalText": "नैवमात्मा।", "padacchedaText": "", "audioFile": "PB_000217.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000218", "originalText": "अतो न जायते।", "padacchedaText": "", "audioFile": "PB_000218.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000219", "originalText": "यस्मादेवं तस्मात् अजः, यस्मात् न म्रियते तस्मात् नित्यश्च।", "padacchedaText": "", "audioFile": "PB_000219.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000220", "originalText": "यद्यपि आद्यन्तयोर्विक्रिययोः प्रतिषेधे सर्वा विक्रियाः प्रतिषिद्धा भवन्ति, तथापि मध्यभाविनीनां विक्रियाणां स्वशब्दैरेव प्रतिषेधः कर्तव्यः अनुक्तानामपि यौवनादिसमस्तविक्रियाणां प्रतिषेधो यथा स्यात् इत्याह— शाश्वत इत्यादिना।", "padacchedaText": "", "audioFile": "PB_000220.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000221", "originalText": "शाश्वत इति अपक्षयलक्षणा विक्रिया प्रतिषिध्यते।", "padacchedaText": "", "audioFile": "PB_000221.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000222", "originalText": "शश्वद्भवः शाश्वतः।", "padacchedaText": "", "audioFile": "PB_000222.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000223", "originalText": "न अपक्षीयते स्वरूपेण, निरवयवत्वात्।", "padacchedaText": "", "audioFile": "PB_000223.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000224", "originalText": "नापि गुणक्षयेण अपक्षयः, निर्गुणत्वात्।", "padacchedaText": "", "audioFile": "PB_000224.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000225", "originalText": "अपक्षयविपरीतापि वृद्धिलक्षणा विक्रिया प्रतिषिध्यते— पुराण इति।", "padacchedaText": "", "audioFile": "PB_000225.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000226", "originalText": "यो हि अवयवागमेन उपचीयते स वर्धते अभिनव इति च उच्यते।", "padacchedaText": "", "audioFile": "PB_000226.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000227", "originalText": "अयं तु आत्मा निरवयवत्वात् पुरापि नव एवेति पुराणः, न वर्धते इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000227.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000228", "originalText": "तथा न हन्यते।", "padacchedaText": "", "audioFile": "PB_000228.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000229", "originalText": "हन्ति, अत्र विपरिणामार्थे द्रष्टव्यः अपुनरुक्ततायै।", "padacchedaText": "", "audioFile": "PB_000229.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000230", "originalText": "न विपरिणम्यते इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000230.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000231", "originalText": "हन्यमाने विपरिणम्यमानेऽपि शरीरे।", "padacchedaText": "", "audioFile": "PB_000231.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000232", "originalText": "अस्मिन् मन्त्रे षड् भावविकारा लौकिकवस्तुविक्रिया आत्मनि प्रतिषिध्यन्ते।", "padacchedaText": "", "audioFile": "PB_000232.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000233", "originalText": "सर्वप्रकारविक्रियारहित आत्मा इति वाक्यार्थः। यस्मादेवं तस्मात् ‘उभौ तौ न विजानीतः’ इति पूर्वेण मन्त्रेण अस्य सम्बन्धः॥ २०॥", "padacchedaText": "", "audioFile": "PB_000233.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000234", "originalText": "‘य एनं वेत्ति हन्तारम्’ (भ.गी.२.१९) इत्यनेन मन्त्रेण हननक्रियायाः कर्ता कर्म च न भवति इति प्रतिज्ञाय, ‘न जायते’ इत्यनेन अविक्रियत्वं हेतुमुक्त्वा प्रतिज्ञातार्थमुपसंहरति—\nवेदाविनाशिनं नित्यं य एनमजमव्ययम्।", "padacchedaText": "", "audioFile": "PB_000234.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000235", "originalText": "कथं स पुरुषः पार्थ कं घातयति हन्ति कम्॥ २१॥", "padacchedaText": "", "audioFile": "PB_000235.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000236", "originalText": "वेद विजानाति अविनाशिनम् अन्त्यभावविकाररहितं नित्यं विपरिणामरहितं यो वेद इति सम्बन्धः।", "padacchedaText": "", "audioFile": "PB_000236.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000237", "originalText": "एनं पूर्वेण मन्त्रेणोक्तलक्षणम् अजं जन्मरहितम् अव्ययम् अपक्षयरहितं कथं केन प्रकारेण सः विद्वान् पुरुषः अधिकृतः हन्ति हननक्रियां करोति, कथं वा घातयति हन्तारं प्रयोजयति।", "padacchedaText": "", "audioFile": "PB_000237.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000238", "originalText": "न कथञ्चित् कञ्चित् हन्ति, न कथञ्चित् कञ्चित् घातयति इति उभयत्र आक्षेप एवार्थः, प्रश्नार्थासम्भवात्।", "padacchedaText": "", "audioFile": "PB_000238.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000239", "originalText": "हेत्वर्थस्य च अविक्रियत्वस्य तुल्यत्वात् विदुषः सर्वकर्मप्रतिषेध एव प्रकरणार्थः अभिप्रेतो भगवता। हन्तेस्तु आक्षेपः उदाहरणार्थत्वेन कथितः॥", "padacchedaText": "", "audioFile": "PB_000239.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000240", "originalText": "विदुषः कं कर्मासम्भवहेतुविशेषं पश्यन् कर्माण्याक्षिपति भगवान् ‘कथं स पुरुषः’ इति।", "padacchedaText": "", "audioFile": "PB_000240.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000241", "originalText": "ननु उक्त एवात्मनः अविक्रियत्वं सर्वकर्मासम्भवकारणविशेषः।", "padacchedaText": "", "audioFile": "PB_000241.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000242", "originalText": "सत्यमुक्तः।", "padacchedaText": "", "audioFile": "PB_000242.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000243", "originalText": "न तु सः कारणविशेषः, अन्यत्वात् विदुषः अविक्रियादात्मनः।", "padacchedaText": "", "audioFile": "PB_000243.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000244", "originalText": "न हि अविक्रियं स्थाणुं विदितवतः कर्म न सम्भवति इति चेत्, न, विदुषः आत्मत्वात्।", "padacchedaText": "", "audioFile": "PB_000244.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000245", "originalText": "न देहादिसङ्घातस्य विद्वत्ता।", "padacchedaText": "", "audioFile": "PB_000245.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000246", "originalText": "अतः पारिशेष्यात् असंहतः आत्मा विद्वान् अविक्रियः इति तस्य विदुषः कर्मासम्भवात् आक्षेपो युक्तः ‘कथं स पुरुषः’ इति।", "padacchedaText": "", "audioFile": "PB_000246.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000247", "originalText": "यथा बुद्ध्याद्याहृतस्य शब्दाद्यर्थस्य अविक्रिय एव सन् बुद्धिवृत्त्यविवेकविज्ञानेन अविद्यया उपलब्धा आत्मा कल्प्यते, एवमेव आत्मानात्मविवेकज्ञानेन बुद्धिवृत्त्या विद्यया असत्यरूपयैव परमार्थतः अविक्रिय एव आत्मा विद्वानुच्यते।", "padacchedaText": "", "audioFile": "PB_000247.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000248", "originalText": "विदुषः कर्मासम्भववचनात् यानि कर्माणि शास्त्रेण विधीयन्ते तानि अविदुषो विहितानि इति भगवतो निश्चयोऽवगम्यते॥", "padacchedaText": "", "audioFile": "PB_000248.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000249", "originalText": "ननु विद्यापि अविदुष एव विधीयते, विदितविद्यस्य पिष्टपेषणवत् विद्याविधानानर्थक्यात्।", "padacchedaText": "", "audioFile": "PB_000249.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000250", "originalText": "तत्र अविदुषः कर्माणि विधीयन्ते न विदुषः इति विशेषो नोपपद्यते इति चेत्, न, अनुष्ठेयस्य भावाभावविशेषोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_000250.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000251", "originalText": "अग्निहोत्रादिविध्यर्थज्ञानोत्तरकालम् अग्निहोत्रादिकर्म अनेकसाधनोपसंहारपूर्वकमनुष्ठेयम् ‘कर्ता अहम्, मम कर्तव्यम्’ इत्येवंप्रकारविज्ञानवतः अविदुषः यथा अनुष्ठेयं भवति, न तु तथा ‘न जायते’ इत्याद्यात्मस्वरूपविध्यर्थज्ञानोत्तरकालभावि किञ्चिदनुष्ठेयं भवति, किं तु ‘नाहं कर्ता, नाहं भोक्ता’ इत्याद्यात्मैकत्वाकर्तृत्वादिविषयज्ञानात् नान्यदुत्पद्यते इति एष विशेष उपपद्यते।", "padacchedaText": "", "audioFile": "PB_000251.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000252", "originalText": "यः पुनः ‘कर्ता अहम्’ इति वेत्ति आत्मानम्, तस्य ‘मम इदं कर्तव्यम्’ इति अवश्यंभाविनी बुद्धिः स्यात्, तदपेक्षया सः अधिक्रियते इति तं प्रति कर्माणि सम्भवन्ति।", "padacchedaText": "", "audioFile": "PB_000252.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000253", "originalText": "स च अविद्वान्, ‘उभौ तौ न विजानीतः’ (भ.गी.२.१९) इति वचनात्, विशेषितस्य च विदुषः कर्माक्षेपवचनाच्च ‘कथं स पुरुषः’ इति।", "padacchedaText": "", "audioFile": "PB_000253.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000254", "originalText": "तस्मात् विशेषितस्य अविक्रियात्मदर्शिनः विदुषः मुमुक्षोश्च सर्वकर्मसंन्यासे एव अधिकारः।", "padacchedaText": "", "audioFile": "PB_000254.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000255", "originalText": "अत एव भगवान् नारायणः साङ्ख्यान् विदुषः अविदुषश्च कर्मिणः प्रविभज्य द्वे निष्ठे ग्राहयति— ‘ज्ञानयोगेन साङ्‍ख्यानां कर्मयोगेन योगिनाम्’ (भ.गी.३.३) इति।", "padacchedaText": "", "audioFile": "PB_000255.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000256", "originalText": "तथा च पुत्राय आह भगवान् व्यासः— ‘द्वाविमावथ पन्थानौ’ (शां.२४१.६) इत्यादि।", "padacchedaText": "", "audioFile": "PB_000256.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000257", "originalText": "तथा च क्रियापथश्चैव पुरस्तात् पश्चात्संन्यासश्चेति।", "padacchedaText": "", "audioFile": "PB_000257.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000258", "originalText": "एतमेव विभागं पुनः पुनर्दर्शयिष्यति भगवान्— अतत्त्ववित् ‘अहङ्कारविमूढात्मा कर्ताहमिति मन्यते’ (भ.गी.३.२७), तत्त्ववित्तु नाहं करोमि इति। तथा च ‘सर्वकर्माणि मनसा संन्यस्यास्ते’ (भ.गी.५.१३) इत्यादि॥", "padacchedaText": "", "audioFile": "PB_000258.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000259", "originalText": "तत्र केचित्पण्डितंमन्या वदन्ति— ‘जन्मादिषड्भावविक्रियारहितः अविक्रियः अकर्ता एकः अहमात्मा’ इति न कस्यचित् ज्ञानम् उत्पद्यते, यस्मिन् सति सर्वकर्मसंन्यासः उपदिश्यते इति।", "padacchedaText": "", "audioFile": "PB_000259.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000260", "originalText": "तन्न, ‘न जायते’ (भ.गी.२.२०) इत्यादिशास्त्रोपदेशानर्थक्यप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_000260.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000261", "originalText": "यथा च शास्त्रोपदेशसामर्थ्यात् धर्माधर्मास्तित्वविज्ञानं कर्तुश्च देहान्तरसम्बन्धविज्ञानमुत्पद्यते, तथा शास्त्रात् तस्यैव आत्मनः अविक्रियत्वाकर्तृत्वैकत्वादिविज्ञानं कस्मात् नोत्पद्यते इति प्रष्टव्याः ते।", "padacchedaText": "", "audioFile": "PB_000261.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000262", "originalText": "करणागोचरत्वात् इति चेत्, न, ‘मनसैवानुद्रष्टव्यम्’ (बृ.४.४.१९) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_000262.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000263", "originalText": "शास्त्राचार्योपदेशशमदमादिसंस्कृतं मनः आत्मदर्शने करणम्।", "padacchedaText": "", "audioFile": "PB_000263.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000264", "originalText": "तथा च तदधिगमाय अनुमाने आगमे च सति ज्ञानं नोत्पद्यत इति साहसमात्रमेतत्।", "padacchedaText": "", "audioFile": "PB_000264.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000265", "originalText": "ज्ञानं च उत्पद्यमानं तद्विपरीतमज्ञानम् अवश्यं बाधते इत्यभ्युपगन्तव्यम्।", "padacchedaText": "", "audioFile": "PB_000265.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000266", "originalText": "तच्च अज्ञानं दर्शितम् ‘हन्ता अहम्, हतः अस्मि’ इति ‘उभौ तौ न विजानीतः’ इति।", "padacchedaText": "", "audioFile": "PB_000266.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000267", "originalText": "अत्र च आत्मनः हननक्रियायाः कर्तृत्वं कर्मत्वं हेतुकर्तृत्वं च अज्ञानकृतं दर्शितम्।", "padacchedaText": "", "audioFile": "PB_000267.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000268", "originalText": "तच्च सर्वक्रियास्वपि समानं कर्तृत्वादेः अविद्याकृतत्वम्, अविक्रियत्वात् आत्मनः।", "padacchedaText": "", "audioFile": "PB_000268.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000269", "originalText": "विक्रियावान् हि कर्ता आत्मनः कर्मभूतमन्यं प्रयोजयति ‘कुरु’ इति।", "padacchedaText": "", "audioFile": "PB_000269.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000270", "originalText": "तदेतत् अविशेषेण विदुषः सर्वक्रियासु कर्तृत्वं हेतुकर्तृत्वं च प्रतिषेधति भगवान्वासुदेवः विदुषः कर्माधिकाराभावप्रदर्शनार्थम् ‘वेदाविनाशिनं... कथं स पुरुषः’ इत्यादिना।", "padacchedaText": "", "audioFile": "PB_000270.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000271", "originalText": "क्व पुनः विदुषः अधिकार इति एतदुक्तं पूर्वमेव ‘ज्ञानयोगेन साङ्ख्यानाम्’ (भ.गी.३.३) इति। तथा च सर्वकर्मसंन्यासं वक्ष्यति ‘सर्वकर्माणि मनसा’ (भ.गी.५.१३) इत्यादिना॥", "padacchedaText": "", "audioFile": "PB_000271.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000272", "originalText": "ननु मनसा इति वचनात् न वाचिकानां कायिकानां च संन्यासः इति चेत्, न, सर्वकर्माणि इति विशेषितत्वात्।", "padacchedaText": "", "audioFile": "PB_000272.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000273", "originalText": "मानसानामेव सर्वकर्मणामिति चेत्, न, मनोव्यापारपूर्वकत्वाद्वाक्कायव्यापाराणां मनोव्यापाराभावे तदनुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_000273.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000274", "originalText": "शास्त्रीयाणां वाक्कायकर्मणां कारणानि मानसानि कर्माणि वर्जयित्वा अन्यानि सर्वकर्माणि मनसा संन्यस्येदिति चेत्, न, ‘नैव कुर्वन्न कारयन्’ (भ.गी.५.१३) इति विशेषणात्।", "padacchedaText": "", "audioFile": "PB_000274.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000275", "originalText": "सर्वकर्मसंन्यासः अयं भगवता उक्तः मरिष्यतः न जीवतः इति चेत्, न, ‘नवद्वारे पुरे देही आस्ते’ (भ.गी.५.१३) इति विशेषणानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_000275.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000276", "originalText": "न हि सर्वकर्मसंन्यासेन मृतस्य तद्देहे आसनं सम्भवति।", "padacchedaText": "", "audioFile": "PB_000276.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000277", "originalText": "अकुर्वतः अकारयतश्च देहे संन्यस्य इति सम्बन्धः न देहे आस्ते इति चेत्, न, सर्वत्र आत्मनः अविक्रियत्वावधारणात्, आसनक्रियायाश्च अधिकरणापेक्षत्वात्, तदनपेक्षत्वाच्च संन्यासस्य।", "padacchedaText": "", "audioFile": "PB_000277.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000278", "originalText": "सम्पूर्वस्तु न्यासशब्दः अत्र त्यागार्थः, न निक्षेपार्थः। तस्मात् गीताशास्त्रे आत्मज्ञानवतः संन्यासे एव अधिकारः, न कर्मणि इति तत्र तत्र उपरिष्टात् आत्मज्ञानप्रकरणे दर्शयिष्यामः॥ २१॥", "padacchedaText": "", "audioFile": "PB_000278.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000279", "originalText": "प्रकृतं तु वक्ष्यामः।", "padacchedaText": "", "audioFile": "PB_000279.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000280", "originalText": "तत्र आत्मनः अविनाशित्वं प्रतिज्ञातम्।", "padacchedaText": "", "audioFile": "PB_000280.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000281", "originalText": "तत् किमिवेति, उच्यते—\nवासांसि जीर्णानि यथा विहाय नवानि गृह्णाति नरोऽपराणि। तथा शरीराणि विहाय जीर्णान्यन्यानि संयाति नवानि देही॥ २२॥", "padacchedaText": "", "audioFile": "PB_000281.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000282", "originalText": "वासांसि वस्त्राणि जीर्णानि दुर्बलतां गतानि यथा लोके विहाय परित्यज्य नवानि अभिनवानि गृह्णाति उपादत्ते नरः पुरुषः अपराणि अन्यानि, तथा तद्वदेव शरीराणि विहाय जीर्णानि अन्यानि संयाति सङ्गच्छति नवानि देही आत्मा पुरुषवत् अविक्रिय एवेत्यर्थः॥ २२॥", "padacchedaText": "", "audioFile": "PB_000282.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000283", "originalText": "कस्मात् अविक्रिय एवेति, आह—\nनैनं छिन्दन्ति शस्त्राणि नैनं दहति पावकः। न चैनं क्लेदयन्त्यापो न शोषयति मारुतः॥ २३॥", "padacchedaText": "", "audioFile": "PB_000283.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000284", "originalText": "एनं प्रकृतं देहिनं न च्छिन्दन्ति शस्त्राणि, निरवयवत्वात् न अवयवविभागं कुर्वन्ति।", "padacchedaText": "", "audioFile": "PB_000284.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000285", "originalText": "शस्त्राणि अस्यादीनि।", "padacchedaText": "", "audioFile": "PB_000285.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000286", "originalText": "तथा न एनं दहति पावकः, अग्निरपि न भस्मीकरोति।", "padacchedaText": "", "audioFile": "PB_000286.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000287", "originalText": "तथा न च एनं क्लेदयन्ति आपः।", "padacchedaText": "", "audioFile": "PB_000287.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000288", "originalText": "अपां हि सावयवस्य वस्तुनः आर्द्रीभावकरणेन अवयवविश्लेषापादने सामर्थ्यम्।", "padacchedaText": "", "audioFile": "PB_000288.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000289", "originalText": "तत् न निरवयवे आत्मनि सम्भवति।", "padacchedaText": "", "audioFile": "PB_000289.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000290", "originalText": "तथा स्नेहवत् द्रव्यं स्नेहशोषणेन नाशयति वायुः। एनं तु आत्मानं न शोषयति मारुतोऽपि॥ २३॥", "padacchedaText": "", "audioFile": "PB_000290.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000291", "originalText": "यतः एवं तस्मात्—\nअच्छेद्योऽयमदाह्योऽयमक्लेद्योऽशोष्य एव च। नित्यः सर्वगतः स्थाणुरचलोऽयं सनातनः॥ २४॥", "padacchedaText": "", "audioFile": "PB_000291.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000292", "originalText": "यस्मात् अन्योन्यनाशहेतुभूतानि एनमात्मानं नाशयितुं नोत्सहन्ते अस्यादीनि तस्मात् नित्यः।", "padacchedaText": "", "audioFile": "PB_000292.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000293", "originalText": "नित्यत्वात् सर्वगतः।", "padacchedaText": "", "audioFile": "PB_000293.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000294", "originalText": "सर्वगतत्वात् स्थाणुः इव, स्थिर इत्येतत्।", "padacchedaText": "", "audioFile": "PB_000294.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000295", "originalText": "स्थिरत्वात् अचलः अयम् आत्मा। अतः सनातनः चिरन्तनः, न कारणात्कुतश्चित् निष्पन्नः, अभिनव इत्यर्थः॥", "padacchedaText": "", "audioFile": "PB_000295.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000296", "originalText": "नैतेषां श्लोकानां पौनरुक्त्यं चोदनीयम्, यतः एकेनैव श्लोकेन आत्मनः नित्यत्वमविक्रियत्वं चोक्तम् ‘न जायते म्रियते वा’ (भ.गी.२.२०) इत्यादिना।", "padacchedaText": "", "audioFile": "PB_000296.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000297", "originalText": "तत्र यदेव आत्मविषयं किञ्चिदुच्यते, तत् एतस्मात् श्लोकार्थात् न अतिरिच्यते, किञ्चिच्छब्दतः पुनरुक्तम्, किञ्चिदर्थतः इति।", "padacchedaText": "", "audioFile": "PB_000297.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000298", "originalText": "दुर्बोधत्वात् आत्मवस्तुनः पुनः पुनः प्रसङ्गमापाद्य शब्दान्तरेण तदेव वस्तु निरूपयति भगवान् वासुदेवः कथं नु नाम संसारिणामसंसारित्वबुद्धिगोचरतामापन्नं सत् अव्यक्तं तत्त्वं संसारनिवृत्तये स्यात् इति॥ २४॥", "padacchedaText": "", "audioFile": "PB_000298.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000299", "originalText": "किं च—\nअव्यक्तोऽयमचिन्त्योऽयमविकार्योऽयमुच्यते। तस्मादेवं विदित्वैनं नानुशोचितुमर्हसि॥ २५॥", "padacchedaText": "", "audioFile": "PB_000299.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000300", "originalText": "सर्वकरणाविषयत्वात् न व्यज्यत इति अव्यक्तः अयम् आत्मा।", "padacchedaText": "", "audioFile": "PB_000300.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000301", "originalText": "अत एव अचिन्त्यः अयम्।", "padacchedaText": "", "audioFile": "PB_000301.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000302", "originalText": "यद्धि इन्द्रियगोचरः तत् चिन्ताविषयत्वमापद्यते।", "padacchedaText": "", "audioFile": "PB_000302.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000303", "originalText": "अयं त्वात्मा अनिन्द्रियगोचरत्वात् अचिन्त्यः।", "padacchedaText": "", "audioFile": "PB_000303.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000304", "originalText": "अत एव अविकार्यः, यथा क्षीरं दध्यातञ्चनादिना विकारि न तथा अयमात्मा।", "padacchedaText": "", "audioFile": "PB_000304.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000305", "originalText": "निरवयवत्वाच्च अविक्रियः।", "padacchedaText": "", "audioFile": "PB_000305.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000306", "originalText": "न हि निरवयवं किञ्चित् विक्रियात्मकं दृष्टम्।", "padacchedaText": "", "audioFile": "PB_000306.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000307", "originalText": "अविक्रियत्वात् अविकार्यः अयम् आत्मा उच्यते। तस्मात् एवं यथोक्तप्रकारेण एनम् आत्मानं विदित्वा\nत्वं न अनुशोचितुमर्हसि हन्ताहमेषाम्, मयैते हन्यन्त इति॥ २५॥", "padacchedaText": "", "audioFile": "PB_000307.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000308", "originalText": "आत्मनः अनित्यत्वमभ्युपगम्य इदमुच्यते—\nअथ चैनं नित्यजातं नित्यं वा मन्यसे मृतम्। तथापि त्वं महाबाहो नैवं शोचितुमर्हसि॥ २६॥", "padacchedaText": "", "audioFile": "PB_000308.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000309", "originalText": "अथ च इति अभ्युपगमार्थः।", "padacchedaText": "", "audioFile": "PB_000309.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000310", "originalText": "एनं प्रकृतमात्मानं नित्यजातं लोकप्रसिद्ध्या प्रत्यनेकशरीरोत्पत्ति जातो जात इति मन्यसे तथा प्रतितत्तद्विनाशं नित्यं वा मन्यसे मृतं मृतो मृत इति, तथापि तथाभावेऽपि आत्मनि त्वं महाबाहो, न एवं शोचितुमर्हसि, जन्मवतो जन्म नाशवतो नाशश्चेत्येताववश्यम्भाविनाविति॥ २६॥", "padacchedaText": "", "audioFile": "PB_000310.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000311", "originalText": "तथा च सति—\nजातस्य हि ध्रुवो मृत्युर्ध्रुवं जन्म मृतस्य च। तस्मादपरिहार्येऽर्थे न त्वं शोचितुमर्हसि॥ २७॥", "padacchedaText": "", "audioFile": "PB_000311.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000312", "originalText": "जातस्य हि लब्धजन्मनः ध्रुवः अव्यभिचारी मृत्युः मरणं ध्रुवं जन्म मृतस्य च।", "padacchedaText": "", "audioFile": "PB_000312.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000313", "originalText": "तस्मादपरिहार्योऽयं जन्ममरणलक्षणोऽर्थः। तस्मिन्नपरिहार्येऽर्थे न त्वं शोचितुमर्हसि॥ २७॥", "padacchedaText": "", "audioFile": "PB_000313.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000314", "originalText": "कार्यकरणसङ्घातात्मकान्यपि भूतान्युद्दिश्य शोको न युक्तः कर्तुम्, यतः—\nअव्यक्तादीनि भूतानि व्यक्तमध्यानि भारत। अव्यक्तनिधनान्येव तत्र का परिदेवना॥ २८॥", "padacchedaText": "", "audioFile": "PB_000314.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000315", "originalText": "अव्यक्तादीनि अव्यक्तम् अदर्शनम् अनुपलब्धिः आदिः येषां भूतानां पुत्रमित्रादिकार्यकरणसङ्घातात्मकानां तानि अव्यक्तादीनि भूतानि प्रागुत्पत्तेः, उत्पन्नानि च प्राङ्मरणात् व्यक्तमध्यानि।", "padacchedaText": "", "audioFile": "PB_000315.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000316", "originalText": "अव्यक्तनिधनान्येव पुनः अव्यक्तम् अदर्शनं निधनं मरणं येषां तानि अव्यक्तनिधनानि।", "padacchedaText": "", "audioFile": "PB_000316.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000317", "originalText": "मरणादूर्ध्वमप्यव्यक्ततामेव प्रतिपद्यन्ते इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000317.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000318", "originalText": "तथा चोक्तम्— ‘अदर्शनादापतितः पुनश्चादर्शनं गतः।", "padacchedaText": "", "audioFile": "PB_000318.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000319", "originalText": "नासौ तव न तस्य त्वं वृथा का परिदेवना’ (मो.ध.१७४.१७) इति। तत्र का परिदेवना को वा प्रलापः अदृष्टदृष्टप्रनष्टभ्रान्तिभूतेषु भूतेष्वित्यर्थः॥ २८॥", "padacchedaText": "", "audioFile": "PB_000319.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000320", "originalText": "दुर्विज्ञेयोऽयं प्रकृत आत्मा, किं त्वामेवैकमुपालभे साधारणे भ्रान्तिनिमित्ते।", "padacchedaText": "", "audioFile": "PB_000320.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000321", "originalText": "कथं दुर्विज्ञेयोऽयमात्मा इत्यत आह—\nआश्चर्यवत्पश्यति कश्चिदेनमाश्चर्यवद्वदति तथैव चान्यः। आश्चर्यवच्चैनमन्यः शृणोति श्रुत्वाप्येनं वेद न चैव कश्चित्॥ २९॥", "padacchedaText": "", "audioFile": "PB_000321.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000322", "originalText": "आश्चर्यवत् आश्चर्यम् अदृष्टपूर्वम् अद्भुतम् अकस्माद्दृश्यमानं तेन तुल्यं आश्चर्यवत् आश्चर्यमिति एनम् आत्मानं पश्यति कश्चित्।", "padacchedaText": "", "audioFile": "PB_000322.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000323", "originalText": "आश्चर्यवत् एनं वदति तथैव च अन्यः।", "padacchedaText": "", "audioFile": "PB_000323.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000324", "originalText": "आश्चर्यवच्च एनमन्यः शृणोति।", "padacchedaText": "", "audioFile": "PB_000324.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000325", "originalText": "श्रुत्वा दृष्ट्वा उक्त्वापि एनमात्मानं वेद न चैव कश्चित्।", "padacchedaText": "", "audioFile": "PB_000325.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000326", "originalText": "अथवा योऽयमात्मानं पश्यति स आश्चर्यतुल्यः, यो वदति यश्च शृणोति सः अनेकसहस्रेषु कश्चिदेव भवति। अतो दुर्बोध आत्मा इत्यभिप्रायः॥ २९॥", "padacchedaText": "", "audioFile": "PB_000326.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000327", "originalText": "अथेदानीं प्रकरणार्थमुपसंहरन्ब्रूते—\nदेही नित्यमवध्योऽयं देहे सर्वस्य भारत। तस्मात्सर्वाणि भूतानि न त्वं शोचितुमर्हसि॥ ३०॥", "padacchedaText": "", "audioFile": "PB_000327.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000328", "originalText": "देही शरीरी नित्यं सर्वदा सर्वावस्थासु अवध्यः निरवयवत्वान्नित्यत्वाच्च तत्र अवध्योऽयं देहे शरीरे सर्वस्य सर्वगतत्वात्स्थावरादिषु स्थितोऽपि सर्वस्य प्राणिजातस्य देहे वध्यमानेऽपि अयं देही न वध्यः यस्मात्, तस्मात् भीष्मादीनि सर्वाणि भूतानि उद्दिश्य न त्वं शोचितुमर्हसि॥ ३०॥", "padacchedaText": "", "audioFile": "PB_000328.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000329", "originalText": "इह परमार्थतत्त्वापेक्षायां शोको मोहो वा न सम्भवतीत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_000329.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000330", "originalText": "न केवलं परमार्थतत्त्वापेक्षायामेव।", "padacchedaText": "", "audioFile": "PB_000330.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000331", "originalText": "किं तु—\nस्वधर्ममपि चावेक्ष्य न विकम्पितुमर्हसि। धर्म्याद्धि युद्धाच्छ्रेयोऽन्यत्क्षत्त्रियस्य न विद्यते॥ ३१॥", "padacchedaText": "", "audioFile": "PB_000331.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000332", "originalText": "स्वधर्ममपि स्वो धर्मः क्षत्रियस्य युद्धं तमपि अवेक्ष्य त्वं न विकम्पितुं प्रचलितुम् नार्हसि क्षत्रियस्य स्वाभाविकाद्धर्मात् आत्मस्वाभाव्यादित्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_000332.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000333", "originalText": "तच्च युद्धं पृथिवीजयद्वारेण धर्मार्थं प्रजारक्षणार्थं चेति धर्मादनपेतं परं धर्म्यम्। तस्मात् धर्म्यात् युद्धात् श्रेयः अन्यत् क्षत्रियस्य न विद्यते हि यस्मात्॥ ३१॥", "padacchedaText": "", "audioFile": "PB_000333.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000334", "originalText": "कुतश्च तत् युद्धं कर्तव्यमिति, उच्यते—\nयदृच्छया चोपपन्नं स्वर्गद्वारमपावृतम्। सुखिनः क्षत्रियाः पार्थ लभन्ते युद्धमीदृशम्॥ ३२॥", "padacchedaText": "", "audioFile": "PB_000334.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000335", "originalText": "यदृच्छया च अप्रार्थिततया उपपन्नम् आगतं स्वर्गद्वारम् अपावृतम् उद्धाटितं ये एतत् ईदृशं युद्धं लभन्ते क्षत्रियाः हे पार्थ, किं न सुखिनः ते?॥ ३२॥", "padacchedaText": "", "audioFile": "PB_000335.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000336", "originalText": "एवं कर्तव्यताप्राप्तमपि—\nअथ चेत्त्वमिमं धर्म्यं सङ्ग्रामं न करिष्यसि। ततः स्वधर्मं कीर्तिं च हित्वा पापमवाप्स्यसि॥ ३३॥", "padacchedaText": "", "audioFile": "PB_000336.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000337", "originalText": "अथ चेत् त्वम् इमं धर्म्यं धर्मादनपेतं विहितं सङ्ग्रामं युद्धं न करिष्यसि चेत्, ततः तदकरणात् स्वधर्मं कीर्तिं च महादेवादिसमागमनिमित्तां हित्वा केवलं पापम् अवाप्स्यसि॥ ३३॥", "padacchedaText": "", "audioFile": "PB_000337.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000338", "originalText": "न केवलं स्वधर्मकीर्तिपरित्यागः—\nअकीर्तिं चापि भूतानि कथयिष्यन्ति तेऽव्ययाम्। सम्भावितस्य चाकीर्तिर्मरणादतिरिच्यते॥ ३४॥", "padacchedaText": "", "audioFile": "PB_000338.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000339", "originalText": "अकीर्तिं चापि युद्धे भूतानि कथयिष्यन्ति ते तव अव्ययां दीर्घकालाम्। धर्मात्मा शूर इत्येवमादिभिः गुणैः सम्भावितस्य च अकीर्तिः मरणात् अतिरिच्यते, सम्भावितस्य च\nअकीर्तेः वरं मरणमित्यर्थः॥ ३४॥", "padacchedaText": "", "audioFile": "PB_000339.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000340", "originalText": "किञ्च—\nभयाद्रणादुपरतं मंस्यन्ते त्वां महारथाः। येषां च त्वं बहुमतो भूत्वा यास्यसि लाघवम्॥ ३५॥", "padacchedaText": "", "audioFile": "PB_000340.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000341", "originalText": "भयात् कर्णादिभ्यः रणात् युद्धात् उपरतं निवृत्तं मंस्यन्ते चिन्तयिष्यन्ति न कृपयेति त्वां महारथाः दुर्योधनप्रभृतयः। येषां च त्वं दुर्योधनादीनां बहुमतो बहुभिः गुणैः युक्तः इत्येवं मतः बहुमतः भूत्वा पुनः यास्यसि लाघवं लघुभावम्॥ ३५॥", "padacchedaText": "", "audioFile": "PB_000341.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000342", "originalText": "किञ्च—\nअवाच्यवादांश्च बहून्वदिष्यन्ति तवाहिताः। निन्दन्तस्तव सामर्थ्यं ततो दुःखतरं नु किम्॥ ३६॥", "padacchedaText": "", "audioFile": "PB_000342.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000343", "originalText": "अवाच्यवादान् अवक्तव्यवादांश्च बहून् अनेकप्रकारान् वदिष्यन्ति तव अहिताः शत्रवः निन्दन्तः कुत्सयन्तः तव त्वदीयं सामर्थ्यं निवातकवचादियुद्धनिमित्तम्। ततः तस्मात् निन्दाप्राप्तेर्दुःखात् दुःखतरं नु किम्, ततः कष्टतरं दुःखं नास्तीत्यर्थः॥ ३६॥", "padacchedaText": "", "audioFile": "PB_000343.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000344", "originalText": "युद्धे पुनः क्रियमाणे कर्णादिभिः—\nहतो वा प्राप्स्यसि स्वर्गं जित्वा वा भोक्ष्यसे महीम्। तस्मादुत्तिष्ठ कौन्तेय युद्धाय कृतनिश्चयः॥ ३७॥", "padacchedaText": "", "audioFile": "PB_000344.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000345", "originalText": "हतो वा प्राप्स्यसि स्वर्गम्, हतः सन् स्वर्गं प्राप्स्यसि।", "padacchedaText": "", "audioFile": "PB_000345.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000346", "originalText": "जित्वा वा कर्णादीन् शूरान् भोक्ष्यसे महीम्।", "padacchedaText": "", "audioFile": "PB_000346.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000347", "originalText": "उभयथापि तव लाभ एवेत्यभिप्रायः। यत एवं तस्मात् उत्तिष्ठ कौन्तेय युद्धाय कृतनिश्चयः ‘जेष्यामि शत्रून्, मरिष्यामि
