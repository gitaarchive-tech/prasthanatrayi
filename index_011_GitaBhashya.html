ashya.zip"}, {"id": "B_000663", "originalText": "किञ्च, सङ्करस्य च कर्ता स्याम्।", "padacchedaText": "", "audioFile": "PB_000663.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000664", "originalText": "तेन कारणेन उपहन्याम् इमाः प्रजाः।", "padacchedaText": "", "audioFile": "PB_000664.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000665", "originalText": "प्रजानामनुग्रहाय प्रवृत्तः उपहतिम् उपहननं कुर्याम् इत्यर्थः। मम ईश्वरस्य अननुरूपमापद्येत॥ २४॥", "padacchedaText": "", "audioFile": "PB_000665.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000666", "originalText": "यदि पुनः अहमिव त्वं कृतार्थबुद्धिः, आत्मवित् अन्यो वा, तस्यापि आत्मनः कर्तव्याभावेऽपि परानुग्रह एव कर्तव्य इत्याह—\nसक्ताः कर्मण्यविद्वांसो यथा कुर्वन्ति भारत।", "padacchedaText": "", "audioFile": "PB_000666.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000667", "originalText": "कुर्याद्विद्वांस्तथासक्तश्चिकीर्षुर्लोकसङ्ग्रहम्॥ २५॥", "padacchedaText": "", "audioFile": "PB_000667.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000668", "originalText": "सक्ताः कर्मणि ‘अस्य कर्मणः फलं मम भविष्यति’ इति केचित् अविद्वांसः यथा कुर्वन्ति भारत, कुर्यात् विद्वान् आत्मवित् तथा असक्तः सन्। तद्वत् किमर्थं करोति? तत् शृणु— चिकीर्षुः कर्तुमिच्छुः लोकसङ्ग्रहम्॥ २५॥", "padacchedaText": "", "audioFile": "PB_000668.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000669", "originalText": "एवं लोकसङ्ग्रहं चिकीर्षोः न मम आत्मविदः कर्तव्यमस्ति अन्यस्य वा लोकसङ्ग्रहं मुक्त्वा।", "padacchedaText": "", "audioFile": "PB_000669.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000670", "originalText": "ततः तस्य आत्मविदः इदमुपदिश्यते—\nन बुद्धिभेदं जनयेदज्ञानां कर्मसङ्गिनाम्। जोषयेत्सर्वकर्माणि विद्वान्युक्तः समाचरन्॥ २६॥", "padacchedaText": "", "audioFile": "PB_000670.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000671", "originalText": "बुद्धेर्भेदः बुद्धिभेदः ‘मया इदं कर्तव्यं भोक्तव्यं चास्य कर्मणः फलम्’ इति निश्चयरूपाया बुद्धेः भेदनं चालनं बुद्धिभेदः तं न जनयेत् न उत्पादयेत् अज्ञानाम् अविवेकिनां कर्मसङ्गिनां कर्मणि आसक्तानां आसङ्गवताम्।", "padacchedaText": "", "audioFile": "PB_000671.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000672", "originalText": "किं नु कुर्यात्? जोषयेत् कारयेत् सर्वकर्माणि विद्वान् स्वयं तदेव अविदुषां कर्म युक्तः अभियुक्तः समाचरन्॥ २६॥", "padacchedaText": "", "audioFile": "PB_000672.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000673", "originalText": "अविद्वानज्ञः कथं कर्मसु सज्जते इत्याह—\nप्रकृतेः क्रियमाणानि गुणैः कर्माणि सर्वशः। अहङ्कारविमूढात्मा कर्ताहमिति मन्यते॥ २७॥", "padacchedaText": "", "audioFile": "PB_000673.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000674", "originalText": "प्रकृतेः प्रकृतिः प्रधानं सत्त्वरजस्तमसां गुणानां साम्यावस्था तस्याः प्रकृतेः गुणैः विकारैः कार्यकरणरूपैः क्रियमाणानि कर्माणि लौकिकानि शास्त्रीयाणि च सर्वशः सर्वप्रकारैः अहङ्कारविमूढात्मा कार्यकरणसङ्घातात्मप्रत्ययः अहङ्कारः तेन विविधं नानाविधं मूढः आत्मा अन्तःकरणं यस्य सः अयं कार्यकरणधर्मा कार्यकरणाभिमानी अविद्यया कर्माणि आत्मनि मन्यमानः तत्तत्कर्मणाम् अहं कर्ता इति मन्यते॥ २७॥", "padacchedaText": "", "audioFile": "PB_000674.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000675", "originalText": "यः पुनर्विद्वान्—\nतत्त्ववित्तु महाबाहो गुणकर्मविभागयोः। गुणा गुणेषु वर्तन्त इति मत्वा न सज्जते॥ २८॥", "padacchedaText": "", "audioFile": "PB_000675.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000676", "originalText": "तत्त्ववित् तु महाबाहो।", "padacchedaText": "", "audioFile": "PB_000676.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000677", "originalText": "कस्य तत्त्ववित्? गुणकर्मविभागयोः गुणविभागस्य कर्मविभागस्य च तत्त्ववित् इत्यर्थः। गुणाः करणात्मकाः गुणेषु विषयात्मकेषु वर्तन्ते न आत्मा इति मत्वा न सज्जते सक्तिं न करोति॥ २८॥", "padacchedaText": "", "audioFile": "PB_000677.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000678", "originalText": "ये पुनः—\nप्रकृतेर्गुणसंमूढाः सज्जन्ते गुणकर्मसु। तानकृत्स्नविदो मन्दान्कृत्स्नविन्न विचालयेत्॥ २९॥", "padacchedaText": "", "audioFile": "PB_000678.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000679", "originalText": "प्रकृतेः गुणैः सम्यक् मूढाः संमोहिताः सन्तः सज्जन्ते गुणानां कर्मसु गुणकर्मसु ‘वयं कर्म कुर्मः फलाय’ इति| तान् कर्मसङ्गिनः अकृत्स्नविदः कर्मफलमात्रदर्शिनः मन्दान् मन्दप्रज्ञान् कृत्स्नवित् आत्मवित् स्वयं न विचालयेत् बुद्धिभेदकरणमेव चालनं तत् न कुर्यात् इत्यर्थः॥ २९॥", "padacchedaText": "", "audioFile": "PB_000679.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000680", "originalText": "कथं पुनः कर्मण्यधिकृतेन अज्ञेन मुमुक्षुणा कर्म कर्तव्यमिति, उच्यते—\nमयि सर्वाणि कर्माणि संन्यस्याध्यात्मचेतसा। निराशीर्निर्ममो भूत्वा युध्यस्व विगतज्वरः॥ ३०॥", "padacchedaText": "", "audioFile": "PB_000680.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000681", "originalText": "मयि वासुदेवे परमेश्वरे सर्वज्ञे सर्वात्मनि सर्वाणि कर्माणि संन्यस्य निक्षिप्य अध्यात्मचेतसा विवेकबुद्ध्या ‘अहं कर्ता ईश्वराय भृत्यवत् करोमि’ इत्यनया बुद्ध्या।", "padacchedaText": "", "audioFile": "PB_000681.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000682", "originalText": "किञ्च, निराशीः त्यक्ताशीः निर्ममः ममभावश्च निर्गतः यस्य तव स त्वं निर्ममो भूत्वा युध्यस्व विगतज्वरः विगतसन्तापः विगतशोकः सन्नित्यर्थः॥ ३०॥", "padacchedaText": "", "audioFile": "PB_000682.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000683", "originalText": "यदेतन्मम मतं कर्म कर्तव्यम् इति सप्रमाणमुक्तं तत् तथा—\nये मे मतमिदं नित्यमनुतिष्ठन्ति मानवाः। श्रद्धावन्तोऽनसूयन्तो मुच्यन्ते तेऽपि कर्मभिः॥ ३१॥", "padacchedaText": "", "audioFile": "PB_000683.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000684", "originalText": "ये मे मदीयम् इदं मतं नित्यम् अनुतिष्ठन्ति अनुवर्तन्ते मानवाः मनुष्याः श्रद्धावन्तः श्रद्धधानाः अनसूयन्तः असूयां च मयि परमगुरौ वासुदेवे अकुर्वन्तः, मुच्यन्ते तेऽपि एवं भूताः कर्मभिः धर्माधर्माख्यैः॥ ३१॥", "padacchedaText": "", "audioFile": "PB_000684.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000685", "originalText": "ये त्वेतदभ्यसूयन्तो नानुतिष्ठन्ति मे मतम्। सर्वज्ञानविमूढांस्तान्विद्धि नष्टानचेतसः॥ ३२॥", "padacchedaText": "", "audioFile": "PB_000685.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000686", "originalText": "ये तु तद्विपरीताः एतत् मम मतम् अभ्यसूयन्तः निन्दन्तः न अनुतिष्ठन्ति नानुवर्तन्ते मे मतम्, सर्वेषु ज्ञानेषु विविधं मूढाः ते। सर्वज्ञानविमूढान् तान् विद्धि जानीहि\nनष्टान् नाशं गतान् अचेतसः अविवेकिनः॥ ३२॥", "padacchedaText": "", "audioFile": "PB_000686.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000687", "originalText": "कस्मात् पुनः कारणात् त्वदीयं मतं नानुतिष्ठन्ति, परधर्मान् अनुतिष्ठन्ति, स्वधर्मं च नानुवर्तन्ते, त्वत्प्रतिकूलाः कथं न बिभ्यति त्वच्छासनातिक्रमदोषात्? तत्राह—\nसदृशं चेष्टते स्वस्याः प्रकृतेर्ज्ञानवानपि।", "padacchedaText": "", "audioFile": "PB_000687.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000688", "originalText": "प्रकृतिं यान्ति भूतानि निग्रहः किं करिष्यति॥ ३३॥", "padacchedaText": "", "audioFile": "PB_000688.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000689", "originalText": "सदृशम् अनुरूपं चेष्टते चेष्टां करोति| कस्य? स्वस्याः स्वकीयायाः प्रकृतेः।", "padacchedaText": "", "audioFile": "PB_000689.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000690", "originalText": "प्रकृतिर्नाम पूर्वकृतधर्माधर्मादिसंस्कारः वर्तमानजन्मादौ अभिव्यक्तः, सा प्रकृतिः।", "padacchedaText": "", "audioFile": "PB_000690.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000691", "originalText": "तस्याः सदृशमेव सर्वो जन्तुः ज्ञानवानपि चेष्टते, किं पुनर्मूर्खः।", "padacchedaText": "", "audioFile": "PB_000691.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000692", "originalText": "तस्मात् प्रकृतिं यान्ति अनुगच्छन्ति भूतानि प्राणिनः। निग्रहः निषेधरूपः किं करिष्यति मम वा अन्यस्य वा॥ ३३॥", "padacchedaText": "", "audioFile": "PB_000692.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000693", "originalText": "यदि सर्वो जन्तुः आत्मनः प्रकृतिसदृशमेव चेष्टते, न च प्रकृतिशून्यः कश्चित् अस्ति, ततः पुरुषकारस्य विषयानुपपत्तेः शास्त्रानर्थक्यप्राप्तौ इदमुच्यते—\nइन्द्रियस्येन्द्रियस्यार्थे रागद्वेषौ व्यवस्थितौ।", "padacchedaText": "", "audioFile": "PB_000693.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000694", "originalText": "तयोर्न वशमागच्छेत्तौ ह्यस्य परिपन्थिनौ॥ ३४॥", "padacchedaText": "", "audioFile": "PB_000694.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000695", "originalText": "इन्द्रियस्येन्द्रियस्य अर्थे सर्वेन्द्रियाणामर्थे शब्दादिविषये इष्टे रागः अनिष्टे द्वेषः इत्येवं प्रतीन्द्रियार्थं रागद्वेषौ अवश्यंभाविनौ तत्र अयं पुरुषकारस्य शास्त्रार्थस्य च विषय उच्यते।", "padacchedaText": "", "audioFile": "PB_000695.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000696", "originalText": "शास्त्रार्थे प्रवृत्तः पूर्वमेव रागद्वेषयोर्वशं नागच्छेत्।", "padacchedaText": "", "audioFile": "PB_000696.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000697", "originalText": "या हि पुरुषस्य प्रकृतिः सा रागद्वेषपुरःसरैव स्वकार्ये पुरुषं प्रवर्तयति।", "padacchedaText": "", "audioFile": "PB_000697.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000698", "originalText": "तदा स्वधर्मपरित्यागः परधर्मानुष्ठानं च भवति।", "padacchedaText": "", "audioFile": "PB_000698.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000699", "originalText": "यदा पुनः रागद्वेषौ तत्प्रतिपक्षेण नियमयति तदा शास्त्रदृष्टिरेव पुरुषः भवति, न प्रकृतिवशः। तस्मात् तयोः रागद्वेषयोः वशं न आगच्छेत्, यतः तौ हि अस्य पुरुषस्य परिपन्थिनौ श्रेयोमार्गस्य विघ्नकर्तारौ तस्करौ इव पथीत्यर्थः॥ ३४॥", "padacchedaText": "", "audioFile": "PB_000699.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000700", "originalText": "तत्र रागद्वेषप्रयुक्तो मन्यते शास्त्रार्थमप्यन्यथा ‘परधर्मोऽपि धर्मत्वात् अनुष्ठेय एव’ इति, तदसत्—\nश्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात्। स्वधर्मे निधनं श्रेयः परधर्मो भयावहः॥ ३५॥", "padacchedaText": "", "audioFile": "PB_000700.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000701", "originalText": "श्रेयान् प्रशस्यतरः स्वो धर्मः स्वधर्मः विगुणः अपि विगतगुणोऽपि अनुष्ठीयमानः परधर्मात् स्वनुष्ठितात् साद्गुण्येन सम्पादितादपि।", "padacchedaText": "", "audioFile": "PB_000701.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000702", "originalText": "स्वधर्मे स्थितस्य निधनं मरणमपि श्रेयः परधर्मे स्थितस्य जीवितात्। कस्मात्? परधर्मः भयावहः नरकादिलक्षणं भयमावहति यतः॥", "padacchedaText": "", "audioFile": "PB_000702.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000703", "originalText": "यद्यपि अनर्थमूलम् ‘ध्यायतो विषयान्पुंसः’ (भ.गी.२.६२) इति ‘रागद्वेषौ ह्यस्य परिपन्थिनौ’ (भ.गी.३.३४) इति च उक्तम्, विक्षिप्तम् अनवधारितं च तदुक्तम्। तत् सङ्क्षिप्तं निश्चितं च इदमेवेति ज्ञातुमिच्छन् अर्जुनः उवाच ‘ज्ञाते हि तस्मिन् तदुच्छेदाय यत्नं कुर्याम्’ इति॥ ३५॥", "padacchedaText": "", "audioFile": "PB_000703.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000704", "originalText": "अर्जुन उवाच—\nअथ केन प्रयुक्तोऽयं पापं चरति पूरुषः। अनिच्छन्नपि वार्ष्णेय बलादिव नियोजितः॥ ३६॥", "padacchedaText": "", "audioFile": "PB_000704.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000705", "originalText": "अथ केन हेतुभूतेन प्रयुक्तः सन् राज्ञेव भृत्यः अयं पापं कर्म चरति आचरति पूरुषः पुरुषः स्वयम् अनिच्छन् अपि हे वार्ष्णेय वृष्णिकुलप्रसूत, बलात् इव नियोजितः राज्ञेव इत्युक्तो दृष्टान्तः॥", "padacchedaText": "", "audioFile": "PB_000705.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000706", "originalText": "शृणु त्वं तं वैरिणं सर्वानर्थकरं यं त्वं पृच्छसि इति भगवान् उवाच—॥ ३६॥", "padacchedaText": "", "audioFile": "PB_000706.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000707", "originalText": "श्रीभगवानुवाच—\nकाम एष क्रोध एष रजोगुणसमुद्भवः। महाशनो महापाप्मा विद्ध्येनमिह वैरिणम्॥ ३७॥", "padacchedaText": "", "audioFile": "PB_000707.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000708", "originalText": "‘ऐश्वर्यस्य समग्रस्य धर्मस्य यशसः श्रियः।", "padacchedaText": "", "audioFile": "PB_000708.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000709", "originalText": "वैराग्यस्याथ मोक्षस्य षण्णां भग इतीङ्गना’ (वि.पु.६.५.७४) ऐश्वर्यादिषट्कं यस्मिन् वासुदेवे नित्यमप्रतिबद्धत्वेन सामस्त्येन च वर्तते, ‘उत्पत्तिं प्रलयं चैव भूतानामागतिं गतिम्।", "padacchedaText": "", "audioFile": "PB_000709.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000710", "originalText": "वेत्ति विद्यामविद्यां च स वाच्यो भगवानिति’ (वि.पु.६.५.७८) उत्पत्त्यादिविषयं च विज्ञानं यस्य स वासुदेवः वाच्यः भगवान् इति॥", "padacchedaText": "", "audioFile": "PB_000710.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000711", "originalText": "काम एषः सर्वलोकशत्रुः यन्निमित्ता सर्वानर्थप्राप्तिः प्राणिनाम्।", "padacchedaText": "", "audioFile": "PB_000711.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000712", "originalText": "स एष कामः प्रतिहतः केनचित् क्रोधत्वेन परिणमते।", "padacchedaText": "", "audioFile": "PB_000712.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000713", "originalText": "अतः क्रोधः अपि एष एव रजोगुणसमुद्भवः रजश्च तत् गुणश्च रजोगुणः सः समुद्भवः यस्य सः कामः रजोगुणसमुद्भवः, रजोगुणस्य वा समुद्भवः।", "padacchedaText": "", "audioFile": "PB_000713.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000714", "originalText": "कामो हि उद्भूतः रजः प्रवर्तयन् पुरुषं प्रवर्तयति, ‘तृष्णया हि अहं कारितः’ इति दुःखिनां रजःकार्ये सेवादौ प्रवृत्तानां प्रलापः श्रूयते।", "padacchedaText": "", "audioFile": "PB_000714.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000715", "originalText": "महाशनः महत् अशनं अस्येति महाशनः, अत एव महापाप्मा, कामेन हि प्रेरितः जन्तुः पापं करोति। अतः विद्धि एनं कामम् इह संसारे वैरिणम्॥ ३७॥", "padacchedaText": "", "audioFile": "PB_000715.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000716", "originalText": "कथं वैरी इति दृष्टान्तैः प्रत्याययति—\nधूमेनाव्रियते वह्निर्यथादर्शो मलेन च। यथोल्बेनावृतो गर्भस्तथा तेनेदमावृतम्॥ ३८॥", "padacchedaText": "", "audioFile": "PB_000716.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000717", "originalText": "धूमेन सहजेन आव्रियते वह्निः प्रकाशात्मकः अप्रकाशात्मकेन, यथा वा आदर्शो मलेन च, यथा उल्बेन च जरायुणा गर्भवेष्टनेन आवृतः आच्छादितः गर्भः तथा तेन इदम् आवृतम्॥ ३८॥", "padacchedaText": "", "audioFile": "PB_000717.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000718", "originalText": "किं पुनस्तत् इदंशब्दवाच्यं यत् कामेनावृतमित्युच्यते—\nआवृतं ज्ञानमेतेन ज्ञानिनो नित्यवैरिणा। कामरूपेण कौन्तेय दुष्पूरेणानलेन च॥ ३९॥", "padacchedaText": "", "audioFile": "PB_000718.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000719", "originalText": "आवृतम् एतेन ज्ञानं ज्ञानिनः नित्यवैरिणा, ज्ञानी हि जानाति ‘अनेन अहमनर्थे प्रयुक्तः’ इति पूर्वमेव।", "padacchedaText": "", "audioFile": "PB_000719.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000720", "originalText": "दुःखी च भवति नित्यमेव।", "padacchedaText": "", "audioFile": "PB_000720.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000721", "originalText": "अतः असौ ज्ञानिनो नित्यवैरी, न तु मूर्खस्य।", "padacchedaText": "", "audioFile": "PB_000721.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000722", "originalText": "स हि कामं तृष्णाकाले मित्रमिव पश्यन् तत्कार्ये दुःखे प्राप्ते जानाति\n‘तृष्णया अहं दुःखित्वमापादितः’ इति, न पूर्वमेव।", "padacchedaText": "", "audioFile": "PB_000722.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000723", "originalText": "अतः ज्ञानिन एव नित्यवैरी। किंरूपेण? कामरूपेण कामः इच्छैव रूपमस्य इति कामरूपः तेन दुष्पूरेण दुःखेन पूरणमस्य इति दुष्पूरः तेन अनलेन न अस्य अलं पर्याप्तिः विद्यते इत्यनलः तेन च॥ ३९॥", "padacchedaText": "", "audioFile": "PB_000723.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000724", "originalText": "किमधिष्ठानः पुनः कामः ज्ञानस्य आवरणत्वेन वैरी सर्वस्य लोकस्य? इत्यपेक्षायामाह, ज्ञाते हि शत्रोरधिष्ठाने सुखेन निबर्हणं कर्तुं शक्यत इति—\nइन्द्रियाणि मनो बुद्धिरस्याधिष्ठानमुच्यते।", "padacchedaText": "", "audioFile": "PB_000724.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000725", "originalText": "एतैर्विमोहयत्येष ज्ञानमावृत्य देहिनम्॥ ४०॥", "padacchedaText": "", "audioFile": "PB_000725.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000726", "originalText": "इन्द्रियाणि मनः बुद्धिश्च अस्य कामस्य अधिष्ठानम् आश्रयः उच्यते। एतैः इन्द्रियादिभिः आश्रयैः विमोहयति विविधं मोहयति एष कामः ज्ञानम् आवृत्य आच्छाद्य देहिनं शरीरिणम्॥ ४०॥", "padacchedaText": "", "audioFile": "PB_000726.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000727", "originalText": "यतः एवम्—\nतस्मात्त्वमिन्द्रियाण्यादौ नियम्य भरतर्षभ। पाप्मानं प्रजहिह्येनं ज्ञानविज्ञाननाशनम्॥ ४१॥", "padacchedaText": "", "audioFile": "PB_000727.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000728", "originalText": "तस्मात् त्वम् इन्द्रियाणि आदौ पूर्वमेव नियम्य वशीकृत्य भरतर्षभ पाप्मानं पापाचारं कामं प्रजहिहि परित्यज एनं प्रकृतं वैरिणं ज्ञानविज्ञाननाशनं ज्ञानं शास्त्रतः आचार्यतश्च आत्मादीनाम् अवबोधः, विज्ञानं विशेषतः तदनुभवः, तयोः ज्ञानविज्ञानयोः श्रेयःप्राप्तिहेत्वोः नाशनं नाशकरं प्रजहिहि आत्मनः परित्यजेत्यर्थः॥ ४१॥", "padacchedaText": "", "audioFile": "PB_000728.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000729", "originalText": "इन्द्रियाण्यादौ नियम्य कामं शत्रुं जहिहि इत्युक्तम्, तत्र किमाश्रयः कामं जह्यात् इत्युच्यते—\nइन्द्रियाणि पराण्याहुरिन्द्रियेभ्यः परं मनः। मनसस्तु परा बुद्धिर्यो बुद्धेः परतस्तु सः॥ ४२॥", "padacchedaText": "", "audioFile": "PB_000729.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000730", "originalText": "इन्द्रियाणि श्रोत्रादीनि पञ्च देहं स्थूलं बाह्यं परिच्छिन्नं च अपेक्ष्य सौक्ष्म्यान्तरत्वव्यापित्वाद्यपेक्षया पराणि प्रकृष्टानि आहुः पण्डिताः।", "padacchedaText": "", "audioFile": "PB_000730.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000731", "originalText": "तथा इन्द्रियेभ्यः परं मनः सङ्कल्पविकल्पात्मकम्।", "padacchedaText": "", "audioFile": "PB_000731.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000732", "originalText": "तथा मनसः तु परा बुद्धिः निश्चयात्मिका।", "padacchedaText": "", "audioFile": "PB_000732.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000733", "originalText": "तथा यः सर्वदृश्येभ्यः बुद्ध्यन्तेभ्यः आभ्यन्तरः, यं देहिनम् इन्द्रियादिभिः आश्रयैः युक्तः कामः ज्ञानावरणद्वारेण मोहयति इत्युक्तम्। बुद्धेः परतस्तु सः, सः बुद्धेः द्रष्टा पर आत्मा॥ ४२॥", "padacchedaText": "", "audioFile": "PB_000733.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000734", "originalText": "ततः किम्—\nएवं बुद्धेः परं बुद्ध्वा संस्तभ्यात्मानमात्मना। जहि शत्रुं महाबाहो कामरूपं दुरासदम्॥ ४३॥", "padacchedaText": "", "audioFile": "PB_000734.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000735", "originalText": "एवं बुद्धेः परम् आत्मानं बुद्ध्वा ज्ञात्वा संस्तभ्य सम्यक् स्तम्भनं कृत्वा आत्मानं स्वेनैव आत्मना संस्कृतेन मनसा सम्यक् समाधायेत्यर्थः। जहि एनं शत्रुं हे महाबाहो कामरूपं दुरासदं दुःखेन आसदः आसादनं प्राप्तिः यस्य तं दुरासदं दुर्विज्ञेयानेकविशेषमिति॥ ४३॥", "padacchedaText": "", "audioFile": "PB_000735.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000736", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ श्रीमद्भगवद्गीताभाष्ये तृतीयोऽध्यायः॥", "padacchedaText": "", "audioFile": "PB_000736.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000737", "originalText": "चतुर्थोऽध्यायः\nयोऽयं योगः अध्यायद्वयेनोक्तः ज्ञाननिष्ठालक्षणः, ससंन्यासः कर्मयोगोपायः, यस्मिन् वेदार्थः परिसमाप्तः, प्रवृत्तिलक्षणः निवृत्तिलक्षणश्च, गीतासु च सर्वासु अयमेव योगो विवक्षितो भगवता।", "padacchedaText": "", "audioFile": "PB_000737.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000738", "originalText": "अतः परिसमाप्तं वेदार्थं मन्वानः तं वंशकथनेन स्तौति श्रीभगवान्—\nश्रीभगवानुवाच—\nइमं विवस्वते योगं प्रोक्तवानहमव्ययम्। विवस्वान्मनवे प्राह मनुरिक्ष्वाकवेऽब्रवीत्॥ १॥", "padacchedaText": "", "audioFile": "PB_000738.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000739", "originalText": "इमम् अध्यायद्वयेनोक्तं योगं विवस्वते आदित्याय सर्गादौ प्रोक्तवान् अहं जगत्परिपालयितॄणां क्षत्रियाणां बलाधानाय तेन योगबलेन युक्ताः समर्था भवन्ति ब्रह्म परिरक्षितुम्।", "padacchedaText": "", "audioFile": "PB_000739.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000740", "originalText": "ब्रह्मक्षत्रे परिपालिते जगत् परिपालयितुमलम्।", "padacchedaText": "", "audioFile": "PB_000740.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000741", "originalText": "अव्ययम् अव्ययफलत्वात्।", "padacchedaText": "", "audioFile": "PB_000741.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000742", "originalText": "न ह्यस्य योगस्य सम्यग्दर्शननिष्ठालक्षणस्य मोक्षाख्यं फलं व्येति।", "padacchedaText": "", "audioFile": "PB_000742.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000743", "originalText": "स च विवस्वान् मनवे प्राह। मनुः इक्ष्वाकवे स्वपुत्राय आदिराजाय अब्रवीत्॥ १॥", "padacchedaText": "", "audioFile": "PB_000743.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000744", "originalText": "एवं परम्पराप्राप्तमिमं राजर्षयो विदुः। स कालेनेह महता योगो नष्टः परन्तप॥ २॥", "padacchedaText": "", "audioFile": "PB_000744.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000745", "originalText": "एवं क्षत्रियपरम्पराप्राप्तम् इमं राजर्षयः राजानश्च ते ऋषयश्च राजर्षयः विदुः इमं योगम्।", "padacchedaText": "", "audioFile": "PB_000745.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000746", "originalText": "स योगः कालेन इह महता दीर्घेण नष्टः विच्छिन्नसम्प्रदायः संवृत्तः। हे परन्तप, आत्मनः विपक्षभूताः परा इति उच्यन्ते, तान् शौर्यतेजोगभस्तिभिः भानुरिव तापयतीति परन्तपः शत्रुतापन इत्यर्थः॥ २॥", "padacchedaText": "", "audioFile": "PB_000746.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000747", "originalText": "दुर्बलानजितेन्द्रियान् प्राप्य नष्टं योगमिममुपलभ्य लोकं च अपुरुषार्थसम्बन्धिनम्—\nस एवायं मया तेऽद्य योगः प्रोक्तः पुरातनः। भक्तोऽसि मे सखा चेति रहस्यं ह्येतदुत्तमम्॥ ३॥", "padacchedaText": "", "audioFile": "PB_000747.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000748", "originalText": "स एव अयं मया ते तुभ्यम् अद्य इदानीं योगः प्रोक्तः पुरातनः भक्तः असि मे सखा\nच असि इति। रहस्यं हि यस्मात् एतत् उत्तमं योगः ज्ञानम् इत्यर्थः॥ ३॥", "padacchedaText": "", "audioFile": "PB_000748.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000749", "originalText": "भगवता विप्रतिषिद्धमुक्तमिति मा भूत् कस्यचित् बुद्धिः इति परिहारार्थं चोद्यमिव कुर्वन् अर्जुन उवाच—\nअर्जुन उवाच—\nअपरं भवतो जन्म परं जन्म विवस्वतः। कथमेतद्विजानीयां त्वमादौ प्रोक्तवानिति॥ ४॥", "padacchedaText": "", "audioFile": "PB_000749.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000750", "originalText": "अपरम् अर्वाक् वसुदेवगृहे भवतो जन्म।", "padacchedaText": "", "audioFile": "PB_000750.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000751", "originalText": "परं पूर्वं सर्गादौ जन्म उत्पत्तिः विवस्वतः आदित्यस्य। तत् कथम् एतत् विजानीयाम् अविरुद्धार्थतया, यः त्वमेव आदौ प्रोक्तवान् इमं योगं स एव इदानीं मह्यं प्रोक्तवानसि इति॥ ४॥", "padacchedaText": "", "audioFile": "PB_000751.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000752", "originalText": "या वासुदेवे अनीश्वरासर्वज्ञाशङ्का मूर्खाणाम्, तां परिहरन् श्रीभगवानुवाच, यदर्थो ह्यर्जुनस्य प्रश्नः—\nश्रीभगवानुवाच—\nबहूनि मे व्यतीतानि जन्मानि तव चार्जुन।", "padacchedaText": "", "audioFile": "PB_000752.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000753", "originalText": "तान्यहं वेद सर्वाणि न त्वं वेत्थ परन्तप॥ ५॥", "padacchedaText": "", "audioFile": "PB_000753.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000754", "originalText": "बहूनि मे मम व्यतीतानि अतिक्रान्तानि जन्मानि तव च हे अर्जुन।", "padacchedaText": "", "audioFile": "PB_000754.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000755", "originalText": "तानि अहं वेद जाने सर्वाणि न त्वं वेत्थ न जानीषे, धर्माधर्मादिप्रतिबद्धज्ञानशक्तित्वात्। अहं पुनः नित्यशुद्धबुद्धमुक्तस्वभावत्वात् अनावरणज्ञानशक्तिरिति वेद अहं हे परन्तप॥ ५॥", "padacchedaText": "", "audioFile": "PB_000755.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000756", "originalText": "कथं तर्हि तव नित्येश्वरस्य धर्माधर्माभावेऽपि जन्म इति, उच्यते—\nअजोऽपि सन्नव्ययात्मा\nभूतानामीश्वरोऽपि सन्। प्रकृतिं स्वामधिष्ठाय\nसम्भवाम्यात्ममायया॥ ६॥", "padacchedaText": "", "audioFile": "PB_000756.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000757", "originalText": "अजोऽपि जन्मरहितोऽपि सन्, तथा अव्ययात्मा अक्षीणज्ञानशक्तिस्वभावोऽपि सन्, तथा भूतानां ब्रह्मादिस्तम्बपर्यन्तानाम् ईश्वरः ईशनशीलोऽपि सन्, प्रकृतिं स्वां मम वैष्णवीं मायां त्रिगुणात्मिकाम्, यस्या वशे सर्वं जगत् वर्तते, यया मोहितं सत् स्वमात्मानं वासुदेवं न जानाति, तां प्रकृतिं स्वाम् अधिष्ठाय वशीकृत्य सम्भवामि देहवानिव भवामि जात इव आत्ममायया आत्मनः मायया, न परमार्थतो लोकवत्॥ ६॥", "padacchedaText": "", "audioFile": "PB_000757.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000758", "originalText": "तच्च जन्म कदा किमर्थं च इत्युच्यते—\nयदा यदा हि धर्मस्य ग्लानिर्भवति भारत। अभ्युत्थानमधर्मस्य तदात्मानं सृजाम्यहम्॥ ७॥", "padacchedaText": "", "audioFile": "PB_000758.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000759", "originalText": "यदा यदा हि धर्मस्य ग्लानिः हानिः वर्णाश्रमादिलक्षणस्य प्राणिनामभ्युदयनिःश्रेयससाधनस्य भवति भारत, अभ्युत्थानम् उद्भवः अधर्मस्य, तदा तदा आत्मानं सृजामि अहं मायया॥ ७॥", "padacchedaText": "", "audioFile": "PB_000759.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000760", "originalText": "किमर्थम्?—\nपरित्राणाय साधूनां विनाशाय च दुष्कृताम्। धर्मसंस्थापनार्थाय सम्भवामि युगे युगे॥ ८॥", "padacchedaText": "", "audioFile": "PB_000760.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000761", "originalText": "परित्राणाय परिरक्षणाय साधूनां सन्मार्गस्थानाम्, विनाशाय च दुष्कृतां पापकारिणाम्, किञ्च धर्मसंस्थापनार्थाय धर्मस्य सम्यक् स्थापनं तदर्थं सम्भवामि युगे युगे प्रतियुगम्॥ ८॥", "padacchedaText": "", "audioFile": "PB_000761.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000762", "originalText": "तत्—\nजन्म कर्म च मे दिव्यमेवं यो वेत्ति तत्त्वतः। त्यक्त्वा देहं पुनर्जन्म नैति मामेति सोऽर्जुन॥ ९॥", "padacchedaText": "", "audioFile": "PB_000762.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000763", "originalText": "जन्म मायारूपं कर्म च साधूनां परित्राणादि मे मम दिव्यम् अप्राकृतम् ऐश्वरम् एवं यथोक्तं यः वेत्ति तत्त्वतः तत्त्वेन यथावत् त्यक्त्वा देहम् इमं पुनर्जन्म पुनरुत्पत्तिं न एति न प्राप्नोति।", "padacchedaText": "", "audioFile": "PB_000763.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000764", "originalText": "माम् एति आगच्छति सः मुच्यते हे अर्जुन॥ ९॥", "padacchedaText": "", "audioFile": "PB_000764.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000765", "originalText": "नैष मोक्षमार्ग इदानीं प्रवृत्तः, किं तर्हि? पूर्वमपि—\nवीतरागभयक्रोधा मन्मया मामुपाश्रिताः। बहवो ज्ञानतपसा पूता मद्भावमागताः॥ १०॥", "padacchedaText": "", "audioFile": "PB_000765.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000766", "originalText": "वीतरागभयक्रोधाः रागश्च भयं च क्रोधश्च वीताः विगताः येभ्यः ते वीतरागभयक्रोधाः मन्मयाः ब्रह्मविदः ईश्वराभेददर्शिनः मामेव च परमेश्वरम् उपाश्रिताः केवलज्ञाननिष्ठा इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000766.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000767", "originalText": "बहवः अनेके ज्ञानतपसा ज्ञानमेव च परमात्मविषयं तपः तेन ज्ञानतपसा पूताः परां शुद्धिं गताः सन्तः मद्भावम् ईश्वरभावं मोक्षम् आगताः समनुप्राप्ताः। इतरतपोनिरपेक्षज्ञाननिष्ठा इत्यस्य लिङ्गम् ‘ज्ञानतपसा’ इति विशेषणम्॥ १०॥", "padacchedaText": "", "audioFile": "PB_000767.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000768", "originalText": "तव तर्हि रागद्वेषौ स्तः, येन केभ्यश्चिदेव आत्मभावं प्रयच्छसि न सर्वेभ्यः इत्युच्यते—\nये यथा मां प्रपद्यन्ते तांस्तथैव भजाम्यहम्। मम वर्त्मानुवर्तन्ते मनुष्याः पार्थ सर्वशः॥ ११॥", "padacchedaText": "", "audioFile": "PB_000768.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000769", "originalText": "ये यथा येन प्रकारेण येन प्रयोजनेन यत्फलार्थितया मां प्रपद्यन्ते तान् तथैव तत्फलदानेन भजामि अनुगृह्णामि अहम् इत्येतत्।", "padacchedaText": "", "audioFile": "PB_000769.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000770", "originalText": "तेषां मोक्षं प्रति अनर्थित्वात्।", "padacchedaText": "", "audioFile": "PB_000770.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000771", "originalText": "न हि एकस्य मुमुक्षुत्वं फलार्थित्वं च युगपत् सम्भवति।", "padacchedaText": "", "audioFile": "PB_000771.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000772", "originalText": "अतः ये फलार्थिनः तान् फलप्रदानेन, ये यथोक्तकारिणस्तु अफलार्थिनः मुमुक्षवश्च तान् ज्ञानप्रदानेन, ये ज्ञानिनः संन्यासिनः मुमुक्षवश्च तान् मोक्षप्रदानेन, तथा आर्तान् आर्तिहरणेन इत्येवं यथा प्रपद्यन्ते ये तान् तथैव भजामि इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000772.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000773", "originalText": "न पुनः रागद्वेषनिमित्तं मोहनिमित्तं वा कञ्चित् भजामि।", "padacchedaText": "", "audioFile": "PB_000773.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000774", "originalText": "सर्वथापि सर्वावस्थस्य मम ईश्वरस्य वर्त्म मार्गम् अनुवर्तन्ते मनुष्याः— यत्फलार्थितया यस्मिन् कर्मणि अधिकृताः ये प्रयतन्ते ते मनुष्या अत्र उच्यन्ते— हे पार्थ सर्वशः सर्वप्रकारैः॥ ११॥", "padacchedaText": "", "audioFile": "PB_000774.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000775", "originalText": "यदि तव ईश्वरस्य रागादिदोषाभावात् सर्वप्राणिषु अनुजिघृक्षायां तुल्यायां सर्वफलप्रदानसमर्थे च त्वयि सति ‘वासुदेवः सर्वम्’ इति ज्ञानेनैव मुमुक्षवः सन्तः कस्मात् त्वामेव सर्वे न प्रतिपद्यन्ते इति? शृणु तत्र कारणम्—\nकाङ्क्षन्तः कर्मणां सिद्धिं यजन्त इह देवताः।", "padacchedaText": "", "audioFile": "PB_000775.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000776", "originalText": "क्षिप्रं हि मानुषे लोके सिद्धिर्भवति कर्मजा॥ १२॥", "padacchedaText": "", "audioFile": "PB_000776.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000777", "originalText": "काङ्क्षन्तः अभीप्सन्तः कर्मणां सिद्धिं फलनिष्पत्तिं प्रार्थयन्तः यजन्ते इह अस्मिन् लोके देवताः इन्द्राग्न्याद्याः, ‘अथ योऽन्यां देवतामुपास्ते अन्योऽसावन्योऽहमस्मीति न स वेद यथा पशुरेवं स देवानाम्’ (बृ.१.४.१०) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_000777.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000778", "originalText": "तेषां हि भिन्नदेवतायाजिनां फलाकाङ्क्षिणां क्षिप्रं शीघ्रं हि यस्मात् मानुषे लोके, मनुष्यलोके हि शास्त्राधिकारः।", "padacchedaText": "", "audioFile": "PB_000778.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000779", "originalText": "‘क्षिप्रं हि मानुषे लोके’ इति विशेषणात् अन्येष्वपि कर्मफलसिद्धिं दर्शयति भगवान्।", "padacchedaText": "", "audioFile": "PB_000779.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000780", "originalText": "मानुषे लोके वर्णाश्रमादिकर्माणि इति विशेषः, तेषां च वर्णाश्रमाद्यधिकारिकर्मणां फलसिद्धिः क्षिप्रं भवति। कर्मजा कर्मणो जाता॥ १२॥", "padacchedaText": "", "audioFile": "PB_000780.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000781", "originalText": "मानुषे एव लोके वर्णाश्रमादिकर्माधिकारः, न अन्येषु लोकेषु इति नियमः किंनिमित्त इति? अथवा वर्णाश्रमादिप्रविभागोपेताः मनुष्याः मम वर्त्म अनुवर्तन्ते सर्वशः इत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_000781.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000782", "originalText": "कस्मात्पुनः कारणात् नियमेन तवैव वर्त्म अनुवर्तन्ते न अन्यस्य इति? उच्यते—\nचातुर्वर्ण्यं मया सृष्टं गुणकर्मविभागशः। तस्य कर्तारमपि मां विद्ध्यकर्तारमव्ययम्॥ १३॥", "padacchedaText": "", "audioFile": "PB_000782.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000783", "originalText": "चत्वार एव वर्णाः चातुर्वर्ण्यं मया ईश्वरेण सृष्टम् उत्पादितम्, ‘ब्राह्मणोऽस्य मुखमासीत्’ (ऋ.१०.८.९१) इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000783.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000784", "originalText": "गुणकर्मविभागशः गुणविभागशः कर्मविभागशश्च।", "padacchedaText": "", "audioFile": "PB_000784.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000785", "originalText": "गुणाः सत्त्वरजस्तमांसि।", "padacchedaText": "", "audioFile": "PB_000785.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000786", "originalText": "तत्र सात्त्विकस्य सत्त्वप्रधानस्य ब्राह्मणस्य ‘शमो दमस्तपः’ (भ.गी.१८.४२) इत्यादीनि कर्माणि, सत्त्वोपसर्जनरजःप्रधानस्य क्षत्रियस्य शौर्यतेजःप्रभृतीनि कर्माणि, तमउपसर्जनरजःप्रधानस्य वैश्यस्य कृष्यादीनि कर्माणि, रजउपसर्जनतमःप्रधानस्य शूद्रस्य शुश्रूषैव कर्म इत्येवं गुणकर्मविभागशः चातुर्वर्ण्यं मया सृष्टम् इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000786.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000787", "originalText": "तच्च इदं चातुर्वर्ण्यं न अन्येषु लोकेषु, अतः मानुषे लोके इति विशेषणम्।", "padacchedaText": "", "audioFile": "PB_000787.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000788", "originalText": "हन्त तर्हि चातुर्वर्ण्यस्य सर्गादेः कर्मणः कर्तृत्वात् तत्फलेन युज्यसे, अतः न त्वं नित्यमुक्तः नित्येश्वरश्च इति? उच्यते— यद्यपि मायासंव्यवहारेण तस्य कर्मणः कर्तारमपि सन्तं मां परमार्थतः विद्धि अकर्तारम्।", "padacchedaText": "", "audioFile": "PB_000788.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000789", "originalText": "अत एव अव्ययम् असंसारिणं च मां विद्धि॥ १३॥", "padacchedaText": "", "audioFile": "PB_000789.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000790", "originalText": "येषां तु कर्मणां कर्तारं मां मन्यसे परमार्थतः तेषाम् अकर्ता एवाहम्, यतः—\nन मां कर्माणि लिम्पन्ति न मे कर्मफले स्पृहा। इति मां योऽभिजानाति कर्मभिर्न स बध्यते॥ १४॥", "padacchedaText": "", "audioFile": "PB_000790.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000791", "originalText": "न मां तानि कर्माणि लिम्पन्ति देहाद्यारम्भकत्वेन, अहङ्काराभावात्।", "padacchedaText": "", "audioFile": "PB_000791.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000792", "originalText": "न च तेषां कर्मणां फलेषु मे मम स्पृहा तृष्णा।", "padacchedaText": "", "audioFile": "PB_000792.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000793", "originalText": "येषां तु संसारिणाम् ‘अहं कर्ता’ इत्यभिमानः कर्मसु, स्पृहा तत्फलेषु च, तान् कर्माणि लिम्पन्ति इति युक्तम्, तदभावात् न मां कर्माणि लिम्पन्ति।", "padacchedaText": "", "audioFile": "PB_000793.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000794", "originalText": "इति एवं यः अन्योऽपि माम् आत्मत्वेन अभिजानाति ‘नाहं कर्ता न मे कर्मफले स्पृहा’ इति सः कर्मभिः न बध्यते, तस्यापि न देहाद्यारम्भकाणि कर्माणि भवन्ति इत्यर्थः॥ १४॥", "padacchedaText": "", "audioFile": "PB_000794.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000795", "originalText": "‘नाहं कर्ता न मे कर्मफले स्पृहा’ इति—\nएवं ज्ञात्वा कृतं कर्म पूर्वैरपि मुमुक्षुभिः। कुरु कर्मैव तस्मात्त्वं पूर्वैः पूर्वतरं कृतम्॥ १५॥", "padacchedaText": "", "audioFile": "PB_000795.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000796", "originalText": "एवं ज्ञात्वा कृतं कर्म पूर्वैः अपि अतिक्रान्तैः मुमुक्षुभिः।", "padacchedaText": "", "audioFile": "PB_000796.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000797", "originalText": "कुरु तेन कर्मैव त्वम्, न तूष्णीमासनं नापि संन्यासः कर्तव्यः, तस्मात् त्वं पूर्वैरपि अनुष्ठितत्वात्, यदि अनात्मज्ञः त्वं तदा आत्मशुद्ध्यर्थम्, तत्त्वविच्चेत् लोकसङ्ग्रहार्थं पूर्वैः जनकादिभिः पूर्वतरं कृतं न अधुनातनं कृतं निर्वर्तितम्॥ १५॥", "padacchedaText": "", "audioFile": "PB_000797.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000798", "originalText": "तत्र कर्म चेत् कर्तव्यं त्वद्वचनादेव करोम्यहम्, किं विशेषितेन ‘पूर्वैः पूर्वतरं कृतम्’ इत्युच्यते, यस्मात् महत् वैषम्यं कर्मणि।", "padacchedaText": "", "audioFile": "PB_000798.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000799", "originalText": "कथम्?—\nकिं कर्म किमकर्मेति\nकवयोऽप्यत्र मोहिताः। तत्ते कर्म प्रवक्ष्यामि\nयज्ज्ञात्वा मोक्ष्यसेऽशुभात्॥ १६॥", "padacchedaText": "", "audioFile": "PB_000799.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000800", "originalText": "किं कर्म किं च अकर्म इति कवयः मेधाविनः अपि अत्र अस्मिन् कर्मादिविषये मोहिताः मोहं गताः। तत् अतः ते तुभ्यम् अहं कर्म अकर्म च प्रवक्ष्यामि, यत् ज्ञात्वा विदित्वा कर्मादि मोक्ष्यसे अशुभात् संसारात्॥ १६॥", "padacchedaText": "", "audioFile": "PB_000800.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000801", "originalText": "न चैतत्त्वया मन्तव्यम्— कर्म नाम देहादिचेष्टा लोकप्रसिद्धम्, अकर्म नाम तदक्रिया तूष्णीमासनम्, किं तत्र बोद्धव्यम्? इति।", "padacchedaText": "", "audioFile": "PB_000801.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000802", "originalText": "कस्मात्, उच्यते—\nकर्मणो ह्यपि बोद्धव्यं बोद्धव्यं च विकर्मणः। अकर्मणश्च बोद्धव्यं गहना कर्मणो गतिः॥ १७॥", "padacchedaText": "", "audioFile": "PB_000802.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000803", "originalText": "कर्मणः शास्त्रविहितस्य हि यस्मात् अपि अस्ति बोद्धव्यम्, बोद्धव्यं च अस्त्येव विकर्मणः प्रतिषिद्धस्य, तथा अकर्मणश्च तूष्णीम्भावस्य बोद्धव्यम् अस्ति इति त्रिष्वप्यध्याहारः कर्तव्यः।", "padacchedaText": "", "audioFile": "PB_000803.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000804", "originalText": "यस्मात् गहना विषमा दुर्ज्ञेया— कर्मणः इति उपलक्षणार्थं कर्मादीनाम्— कर्माकर्मविकर्मणां गतिः याथात्म्यं तत्त्वम् इत्यर्थः॥ १७॥", "padacchedaText": "", "audioFile": "PB_000804.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000805", "originalText": "किं पुनस्तत्त्वं कर्मादेः यत् बोद्धव्यं वक्ष्यामि इति प्रतिज्ञातम्? उच्यते—\nकर्मण्यकर्म यः पश्येदकर्मणि च कर्म यः। स बुद्धिमान्मनुष्येषु स युक्तः कृत्स्नकर्मकृत्॥ १८॥", "padacchedaText": "", "audioFile": "PB_000805.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000806", "originalText": "कर्मणि, क्रियते इति कर्म व्यापारमात्रम्, तस्मिन् कर्मणि अकर्म कर्माभावं यः पश्येत्, अकर्मणि च कर्माभावे कर्तृतन्त्रत्वात् प्रवृत्तिनिवृत्त्योः— वस्तु अप्राप्यैव हि सर्व एव क्रियाकारकादिव्यवहारः अविद्याभूमौ एव— कर्म यः पश्येत् पश्यति, सः बुद्धिमान् मनुष्येषु, सः युक्तः योगी च, कृत्स्नकर्मकृत् समस्तकर्मकृच्च सः, इति स्तूयते कर्माकर्मणोरितरेतरदर्शी॥", "padacchedaText": "", "audioFile": "PB_000806.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000807", "originalText": "ननु किमिदं विरुद्धमुच्यते ‘कर्मणि अकर्म यः पश्येत्’ इति ‘अकर्मणि च कर्म’ इति, न हि कर्म अकर्म स्यात्, अकर्म वा कर्म।", "padacchedaText": "", "audioFile": "PB_000807.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000808", "originalText": "तत्र विरुद्धं कथं पश्येत् द्रष्टा?— न, अकर्म एव परमार्थतः सत् कर्मवत् अवभासते मूढदृष्टेः लोकस्य, तथा कर्मैव अकर्मवत्।", "padacchedaText": "", "audioFile": "PB_000808.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000809", "originalText": "तत्र यथाभूतदर्शनार्थमाह भगवान्— ‘कर्मण्यकर्म यः पश्येत्’ इत्यादि।", "padacchedaText": "", "audioFile": "PB_000809.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000810", "originalText": "अतो न विरुद्धम्।", "padacchedaText": "", "audioFile": "PB_000810.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000811", "originalText": "बुद्धिमत्त्वाद्युपपत्तेश्च।", "padacchedaText": "", "audioFile": "PB_000811.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000812", "originalText": "‘बोद्धव्यम्’ (भ.गी.४.१७) इति च यथाभूतदर्शनमुच्यते।", "padacchedaText": "", "audioFile": "PB_000812.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000813", "originalText": "न च विपरीतज्ञानात् अशुभात् मोक्षणं स्यात्, ‘यत् ज्ञात्वा मोक्ष्यसेऽशुभात्’ (भ.गी.४.१६) इति च उक्तम्।", "padacchedaText": "", "audioFile": "PB_000813.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000814", "originalText": "तस्मात् कर्माकर्मणी विपर्ययेण गृहीते प्राणिभिः तद्विपर्ययग्रहणनिवृत्त्यर्थं भगवतो वचनम् ‘कर्मण्यकर्म यः’ इत्यादि।", "padacchedaText": "", "audioFile": "PB_000814.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000815", "originalText": "न च अत्र कर्माधिकरणमकर्म अस्ति, कुण्डे बदराणीव।", "padacchedaText": "", "audioFile": "PB_000815.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000816", "originalText": "नापि अकर्माधिकरणं कर्मास्ति, कर्माभावत्वादकर्मणः।", "padacchedaText": "", "audioFile": "PB_000816.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000817", "originalText": "अतः विपरीतगृहीते एव कर्माकर्मणी लौकिकैः, यथा मृगतृष्णिकायामुदकं शुक्तिकायां वा रजतम्।", "padacchedaText": "", "audioFile": "PB_000817.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000818", "originalText": "ननु कर्म कर्मैव सर्वेषां न क्वचित् व्यभिचरति— तत् न, नौस्थस्य नावि गच्छन्त्यां तटस्थेषु अगतिषु नगेषु प्रतिकूलगतिदर्शनात्, दूरेषु चक्षुषा असंनिकृष्टेषु गच्छत्सु गत्यभावदर्शनात्, एवम् इहापि अकर्मणि कर्मदर्शनं कर्मणि च अकर्मदर्शनं विपरीतदर्शनं येन तन्निराकरणार्थमुच्यते ‘कर्मण्यकर्म यः पश्येत्’ इत्यादि॥", "padacchedaText": "", "audioFile": "PB_000818.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000819", "originalText": "तदेतत् उक्तप्रतिवचनमपि असकृत् अत्यन्तविपरीतदर्शनभाविततया मोमुह्यमानो लोकः श्रुतमपि असकृत् तत्त्वं विस्मृत्य विस्मृत्य मिथ्याप्रसङ्गम् अवतार्यावतार्य चोदयति इति पुनः पुनः उत्तरमाह भगवान्, दुर्विज्ञेयत्वं च आलक्ष्य वस्तुनः।", "padacchedaText": "", "audioFile": "PB_000819.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000820", "originalText": "‘अव्यक्तोऽयमचिन्त्योऽयम्’ (भ.गी.२.२५) ‘न जायते म्रियते’ (भ.गी.२.२०) इत्यादिना आत्मनि कर्माभावः श्रुतिस्मृतिन्यायप्रसिद्धः उक्तः वक्ष्यमाणश्च।", "padacchedaText": "", "audioFile": "PB_000820.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000821", "originalText": "तस्मिन् आत्मनि कर्माभावे अकर्मणि कर्मविपरीतदर्शनम् अत्यन्तनिरूढम्, यतः, ‘किं कर्म किमकर्मेति कवयोऽप्यत्र मोहिताः’ (भ.गी.४.१६)।", "padacchedaText": "", "audioFile": "PB_000821.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000822", "originalText": "देहाद्याश्रयं कर्म आत्मन्यध्यारोप्य ‘अहं कर्ता, मम एतत् कर्म, मया अस्य कर्मणः फलं भोक्तव्यम्’ इति च, तथा ‘अहं तूष्णीं भवामि, येन अहं निरायासः अकर्मा सुखी स्याम्’ इति कार्यकरणाश्रयं व्यापारोपरमं तत्कृतं च सुखित्वम् आत्मनि अध्यारोप्य ‘न करोमि किञ्चित्, तूष्णीं सुखमासे’ इति अभिमन्यते लोकः।", "padacchedaText": "", "audioFile": "PB_000822.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000823", "originalText": "तत्रेदं लोकस्य विपररीतदर्शनापनयाय आह भगवान्— ‘कर्मण्यकर्म यः पश्येत्’ इत्यादि॥", "padacchedaText": "", "audioFile": "PB_000823.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000824", "originalText": "अत्र च कर्म कर्मैव सत् कार्यकरणाश्रयं कर्मरहिते अविक्रिये आत्मनि सर्वैः अध्यस्तम्, यतः पण्डितोऽपि ‘अहं करोमि’ इति मन्यते।", "padacchedaText": "", "audioFile": "PB_000824.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000825", "originalText": "अतः आत्मसमवेततया सर्वलोकप्रसिद्धे कर्मणि नदीकूलस्थेष्विव वृक्षेषु गतिप्रातिलोम्येन अकर्म कर्माभावं यथाभूतं गत्यभावमिव वृक्षेषु यः पश्येत्, अकर्मणि च कार्यकरणव्यापारोपरमे कर्मवत् आत्मनि अध्यारोपिते, ‘तूष्णीं अकुर्वन् सुखं आसे’ इत्यहङ्काराभिसन्धिहेतुत्वात्, तस्मिन् अकर्मणि च कर्म यः पश्येत्, यः एवं कर्माकर्मविभागज्ञः सः बुद्धिमान् पण्डितः मनुष्येषु, सः युक्तः योगी कृत्स्नकर्मकृच्च सः अशुभात् मोक्षितः कृतकृत्यो भवति इत्यर्थः॥", "padacchedaText": "", "audioFile": "PB_000825.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000826", "originalText": "अयं श्लोकः अन्यथा व्याख्यातः कैश्चित्।", "padacchedaText": "", "audioFile": "PB_000826.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000827", "originalText": "कथम्? नित्यानां किल कर्मणाम् ईश्वरार्थे अनुष्ठीयमानानां तत्फलाभावात् अकर्माणि तानि उच्यन्ते गौण्या वृत्त्या।", "padacchedaText": "", "audioFile": "PB_000827.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000828", "originalText": "तेषां च अकरणम् अकर्म, तच्च प्रत्यवायफलत्वात् कर्म उच्यते गौण्यैव वृत्त्या।", "padacchedaText": "", "audioFile": "PB_000828.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000829", "originalText": "तत्र नित्ये कर्मणि अकर्म यः पश्येत् फलाभावात्, यथा धेनुरपि गौः अगौः इत्युच्यते क्षीराख्यं फलं न प्रयच्छति इति, तद्वत्। तथा नित्याकरणे तु अकर्मणि च कर्म यः पश्येत् नरकादिप्रत्यवायफलं प्रयच्छति इति॥", "padacchedaText": "", "audioFile": "PB_000829.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000830", "originalText": "नैतत् युक्तं व्याख्यानम्।", "padacchedaText": "", "audioFile": "PB_000830.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000831", "originalText": "एवं ज्ञानात् अशुभात् मोक्षानुपपत्तेः ‘यज्ज्ञात्वा मोक्ष्यसेऽशुभात्’ (भ.गी.४.१६) इति भगवता उक्तं वचनं बाध्येत।", "padacchedaText": "", "audioFile": "PB_000831.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000832", "originalText": "कथम्? नित्यानामनुष्ठानात् अशुभात् स्यात् नाम मोक्षणम्, न तु तेषां फलाभावज्ञानात्।", "padacchedaText": "", "audioFile": "PB_000832.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000833", "originalText": "न हि नित्यानां फलाभावज्ञानम् अशुभमुक्तिफलत्वेन चोदितम्, नित्यकर्मज्ञानं वा।", "padacchedaText": "", "audioFile": "PB_000833.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000834", "originalText": "न च भगवतैवेहोक्तम्।", "padacchedaText": "", "audioFile": "PB_000834.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000835", "originalText": "एतेन अकर्मणि कर्मदर्शनं प्रत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_000835.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000836", "originalText": "न हि अकर्मणि ‘कर्म’ इति दर्शनं कर्तव्यतया इह चोद्यते, नित्यस्य तु कर्तव्यतामात्रम्।", "padacchedaText": "", "audioFile": "PB_000836.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000837", "originalText": "न च ‘अकरणात् नित्यस्य प्रत्यवायो भवति’ इति विज्ञानात् किञ्चित् फलं स्यात्।", "padacchedaText": "", "audioFile": "PB_000837.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000838", "originalText": "नापि नित्याकरणं ज्ञेयत्वेन चोदितम्।", "padacchedaText": "", "audioFile": "PB_000838.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000839", "originalText": "नापि ‘कर्म अकर्म’ इति मिथ्यादर्शनात् अशुभात् मोक्षणं बुद्धिमत्त्वं युक्तता कृत्स्नकर्मकृत्त्वादि च फलम् उपपद्यते, स्तुतिर्वा।", "padacchedaText": "", "audioFile": "PB_000839.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000840", "originalText": "मिथ्याज्ञानमेव हि साक्षात् अशुभरूपम्। कुतः अन्यस्मादशुभात् मोक्षणम्? न हि तमः तमसो निवर्तकं भवति॥", "padacchedaText": "", "audioFile": "PB_000840.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000841", "originalText": "ननु कर्मणि यत् अकर्मदर्शनम् अकर्मणि वा कर्मदर्शनं न तत् मिथ्याज्ञानम्, किं तर्हि? गौणं फलभावाभावनिमित्तम्— न, कर्माकर्मविज्ञानादपि गौणात् फलस्य अश्रवणात्।", "padacchedaText": "", "audioFile": "PB_000841.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000842", "originalText": "नापि श्रुतहान्यश्रुतपरिकल्पनायां कश्चित् विशेष उपलभ्यते।", "padacchedaText": "", "audioFile": "PB_000842.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000843", "originalText": "स्वशब्देनापि शक्यं वक्तुम् ‘नित्यकर्मणां फलं नास्ति, अकरणाच्च तेषां नरकपातः स्यात्’ इति, तत्र व्याजेन परव्यामोहरूपेण ‘कर्मण्यकर्म यः पस्येत्’ इत्यादिना किम्? तत्र एवं व्याचक्षाणेन भगवतोक्तं वाक्यं लोकव्यामोहार्थमिति व्यक्तं कल्पितं स्यात्।", "padacchedaText": "", "audioFile": "PB_000843.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000844", "originalText": "न च एतत् छद्मरूपेण वाक्येन रक्षणीयं वस्तु, नापि शब्दान्तरेण पुनः पुनः उच्यमानं सुबोधं स्यात् इत्येवं वक्तुं युक्तम्।", "padacchedaText": "", "audioFile": "PB_000844.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000845", "originalText": "‘कर्मण्येवाधिकारस्ते’ (भ.गी.२.४७) इत्यत्र हि स्फुटतर उक्तः अर्थः, न पुनर्वक्तव्यो भवति।", "padacchedaText": "", "audioFile": "PB_000845.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000846", "originalText": "सर्वत्र च प्रशस्तं बोद्धव्यं च कर्तव्यमेव। न निष्प्रयोजनं बोद्धव्यमित्युच्यते॥", "padacchedaText": "", "audioFile": "PB_000846.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000847", "originalText": "न च मिथ्याज्ञानं बोद्धव्यं भवति, तत्प्रत्युपस्थापितं वा वस्त्वाभासम्।", "padacchedaText": "", "audioFile": "PB_000847.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000848", "originalText": "नापि नित्यानाम् अकरणात् अभावात् प्रत्यवायभावोत्पत्तिः, ‘नासतो विद्यते भावः’ (भ.गी.२.१६) इति वचनात् ‘कथं असतः सज्जायेत’ (छा.६.२.२) इति च दर्शितम् असतः सज्जन्मप्रतिषेधात्।", "padacchedaText": "", "audioFile": "PB_000848.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000849", "originalText": "असतः सदुत्पत्तिं ब्रुवता असदेव सद्भवेत्, सच्चापि असत् भवेत् इत्युक्तं स्यात्।", "padacchedaText": "", "audioFile": "PB_000849.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000850", "originalText": "तच्च अयुक्तम्, सर्वप्रमाणविरोधात्।", "padacchedaText": "", "audioFile": "PB_000850.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000851", "originalText": "न च निष्फलं विदध्यात् कर्म शास्त्रम्, दुःखस्वरूपत्वात्, दुःखस्य च बुद्धिपूर्वकतया कार्यत्वानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_000851.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000852", "originalText": "तदकरणे च नरकपाताभ्युपगमात् अनर्थायैव उभयथापि करणे च अकरणे च शास्त्रं निष्फलं कल्पितं स्यात्।", "padacchedaText": "", "audioFile": "PB_000852.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000853", "originalText": "स्वाभ्युपगमविरोधश्च ‘नित्यं निष्फलं कर्म’ इति अभ्युपगम्य ‘मोक्षफलाय’ इति ब्रुवतः।", "padacchedaText": "", "audioFile": "PB_000853.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000854", "originalText": "तस्मात् यथाश्रुत एवार्थः ‘कर्मण्यकर्म यः’ इत्यादेः। तथा च व्याख्यातः अस्माभिः श्लोकः॥ १८॥", "padacchedaText": "", "audioFile": "PB_000854.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000855", "originalText": "तदेतत् कर्मणि अकर्मदर्शनं स्तूयते—\nयस्य सर्वे समारम्भाः कामसङ्कल्पवर्जिताः। ज्ञानाग्निदग्धकर्माणं तमाहुः पण्डितं बुधाः॥ १९॥", "padacchedaText": "", "audioFile": "PB_000855.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000856", "originalText": "यस्य यथोक्तदर्शिनः सर्वे यावन्तः समारम्भाः सर्वाणि कर्माणि, समारभ्यन्ते इति समारम्भाः, कामसङ्कल्पवर्जिताः कामैः तत्कारणैश्च सङ्कल्पैः वर्जिताः मुधैव चेष्टामात्रा अनुष्ठीयन्ते, प्रवृत्तेन चेत् लोकसङ्ग्रहार्थम्, निवृत्तेन चेत् जीवनमात्रार्थम्।", "padacchedaText": "", "audioFile": "PB_000856.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000857", "originalText": "तं ज्ञानाग्निदग्धकर्माणं कर्मादौ अकर्मादिदर्शनं ज्ञानं तदेव अग्निः तेन ज्ञानाग्निना दग्धानि शुभाशुभलक्षणानि कर्माणि यस्य तम् आहुः परमार्थतः पण्डितं बुधाः ब्रह्मविदः॥ १९॥", "padacchedaText": "", "audioFile": "PB_000857.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000858", "originalText": "यस्तु अकर्मादिदर्शी, सः अकर्मादिदर्शनादेव निष्कर्मा संन्यासी जीवनमात्रार्थचेष्टः सन् कर्मणि न प्रवर्तते, यद्यपि प्राक् विवेकतः प्रवृत्तः।", "padacchedaText": "", "audioFile": "PB_000858.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000859", "originalText": "यस्तु प्रारब्धकर्मा सन् उत्तरकालमुत्पन्नात्मसम्यग्दर्शनः स्यात्, सः सर्वकर्मणि प्रयोजनमपश्यन् ससाधनं कर्म परित्यजत्येव।", "padacchedaText": "", "audioFile": "PB_000859.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000860", "originalText": "सः कुतश्चित् निमित्तात् कर्मपरित्यागासम्भवे सति कर्मणि तत्फले च सङ्गरहिततया स्वप्रयोजनाभावात् लोकसङ्ग्रहार्थं पूर्ववत् कर्मणि प्रवृत्तोऽपि नैव किञ्चित् करोति, ज्ञानाग्निदग्धकर्मत्वात् तदीयं कर्म अकर्मैव सम्पद्यते इत्येतमर्थं दर्शयिष्यन् आह—\nत्यक्त्वा कर्मफलासङ्गं नित्यतृप्तो निराश्रयः।", "padacchedaText": "", "audioFile": "PB_000860.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000861", "originalText": "कर्मण्यभिप्रवृत्तोऽपि नैव किञ्चित्करोति सः॥ २०॥", "padacchedaText": "", "audioFile": "PB_000861.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000862", "originalText": "त्यक्त्वा कर्मसु अभिमानं फलासङ्गं च यथोक्तेन ज्ञानेन नित्यतृप्तः निराकाङ्क्षो विषयेषु इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000862.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000863", "originalText": "निराश्रयः आश्रयरहितः, आश्रयो नाम यत् आश्रित्य पुरुषार्थं सिसाधयिषति, दृष्टादृष्टेष्टफलसाधनाश्रयरहित इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000863.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000864", "originalText": "विदुषा क्रियमाणं कर्म परमार्थतोऽकर्मैव, तस्य निष्क्रियात्मदर्शनसम्पन्नत्वात्।", "padacchedaText": "", "audioFile": "PB_000864.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000865", "originalText": "तेन एवंभूतेन स्वप्रयोजनाभावात् ससाधनं कर्म परित्यक्तव्यमेव इति प्राप्ते, ततः निर्गमासम्भवात् लोकसङ्ग्रहचिकीर्षया शिष्टविगर्हणापरिजिहीर्षया वा पूर्ववत् कर्मणि अभिप्रवृत्तोऽपि निष्क्रियात्मदर्शनसम्पन्नत्वात् नैव किञ्चित् करोति सः॥ २०॥", "padacchedaText": "", "audioFile": "PB_000865.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000866", "originalText": "यः पुनः पूर्वोक्तविपरीतः प्रागेव कर्मारम्भात् ब्रह्मणि सर्वान्तरे प्रत्यगात्मनि निष्क्रिये सञ्जातात्मदर्शनः स दृष्टादृष्टेष्टविषयाशीर्विवर्जिततया दृष्टादृष्टार्थे कर्मणि प्रयोजनमपश्यन् ससाधनं कर्म संन्यस्य शरीरयात्रामात्रचेष्टः यतिः ज्ञाननिष्ठो मुच्यते इत्येतमर्थं दर्शयितुमाह—\nनिराशीर्यतचित्तात्मा त्यक्तसर्वपरिग्रहः।", "padacchedaText": "", "audioFile": "PB_000866.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000867", "originalText": "शारीरं केवलं कर्म कुर्वन्नाप्नोति किल्बिषम्॥ २१॥", "padacchedaText": "", "audioFile": "PB_000867.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000868", "originalText": "निराशीः निर्गताः आशिषः यस्मात् सः निराशीः, यतचित्तात्मा चित्तम् अन्तःकरणम् आत्मा बाह्यः कार्यकरणसङ्घातः तौ उभावपि यतौ संयतौ येन सः यतचित्तात्मा, त्यक्तसर्वपरिग्रहः त्यक्तः सर्वः परिग्रहः येन सः त्यक्तसर्वपरिग्रहः, शारीरं शरीरस्थितिमात्रप्रयोजनम्, केवलं तत्रापि अभिमानवर्जितम्, कर्म कुर्वन् न आप्नोति न प्राप्नोति किल्बिषम् अनिष्टरूपं पापं धर्मं च।", "padacchedaText": "", "audioFile": "PB_000868.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000869", "originalText": "धर्मोऽपि मुमुक्षोः किल्बिषमेव बन्धापादकत्वात्। तस्मात् ताभ्यां मुक्तः भवति, संसारात् मुक्तो भवति इत्यर्थः॥", "padacchedaText": "", "audioFile": "PB_000869.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000870", "originalText": "‘शारीरं केवलं कर्म’ इत्यत्र किं शरीरनिर्वर्त्यं शारीरं कर्म अभिप्रेतम्, आहोस्वित् शरीरस्थितिमात्रप्रयोजनं शारीरं कर्म इति? किं च अतः यदि शरीरनिर्वर्त्यं शारीरं कर्म यदि वा शरीरस्थितिमात्रप्रयोजनं शारीरम् इति? उच्यते— यदा शरीरनिर्वर्त्यं कर्म शारीरम् अभिप्रेतं स्यात्, तदा दृष्टादृष्टप्रयोजनं कर्म प्रतिषिद्धमपि शरीरेण कुर्वन् नाप्नोति किल्बिषम् इति ब्रुवतो विरुद्धाभिधानं प्रसज्येत।", "padacchedaText": "", "audioFile": "PB_000870.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000871", "originalText": "शास्त्रीयं च कर्म दृष्टादृष्टप्रयोजनं शरीरेण कुर्वन् नाप्नोति किल्बिषम् इत्यपि ब्रुवतः अप्राप्तप्रतिषेधप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_000871.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000872", "originalText": "‘शारीरं कर्म कुर्वन्’ इति विशेषणात् केवलशब्दप्रयोगाच्च वाङ्मनसनिर्वर्त्यं कर्म विधिप्रतिषेधविषयं धर्माधर्मशब्दवाच्यं कुर्वन् प्राप्नोति किल्बिषम् इत्युक्तं स्यात्।", "padacchedaText": "", "audioFile": "PB_000872.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000873", "originalText": "तत्रापि वाङ्मनसाभ्यां विहितानुष्ठानपक्षे किल्बिषप्राप्तिवचनं विरुद्धम् आपद्येत।", "padacchedaText": "", "audioFile": "PB_000873.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000874", "originalText": "प्रतिषिद्धसेवापक्षेऽपि भूतार्थानुवादमात्रम् अनर्थकं स्यात्।", "padacchedaText": "", "audioFile": "PB_000874.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000875", "originalText": "यदा तु शरीरस्थितिमात्रप्रयोजनं शारीरं कर्म अभिप्रेतं भवेत्, तदा दृष्टादृष्टप्रयोजनं कर्म विधिप्रतिषेधगम्यं शरीरवाङ्मनसनिर्वर्त्यम् अन्यत् अकुर्वन् तैरेव शरीरादिभिः शरीरस्थितिमात्रप्रयोजनं केवलशब्दप्रयोगात् ‘अहं करोमि’ इत्यभिमानवर्जितः शरीरादिचेष्टामात्रं लोकदृष्ट्या कुर्वन् नाप्नोति किल्बिषं।", "padacchedaText": "", "audioFile": "PB_000875.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000876", "originalText": "एवंभूतस्य पापशब्दवाच्यकिल्बिषप्राप्त्यसम्भवात् किल्बिषं संसारं न आप्नोति, ज्ञानाग्निदग्धसर्वकर्मत्वात् अप्रतिबन्धेन मुच्यत एव इति पूर्वोक्तसम्यग्दर्शनफलानुवाद एव एषः।", "padacchedaText": "", "audioFile": "PB_000876.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000877", "originalText": "एवम् ‘शारीरं केवलं कर्म’ इत्यस्य अर्थस्य परिग्रहे निरवद्यं भवति॥ २१॥", "padacchedaText": "", "audioFile": "PB_000877.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000878", "originalText": "त्यक्तसर्वपरिग्रहस्य यतेः अन्नादेः शरीरस्थितिहेतोः परिग्रहस्य अभावात् याचनादिना शरीरस्थितौ कर्तव्यतायां प्राप्तायाम् ‘अयाचितमसङ्क्लृप्तमुपपन्नं यदृच्छया’ (अश्व.४६.१९) इत्यादिना वचनेन अनुज्ञातं यतेः शरीरस्थितिहेतोः अन्नादेः प्राप्तिद्वारम् आविष्कुर्वन् आह—\nयदृच्छालाभसन्तुष्टो द्वन्द्वातीतो विमत्सरः।", "padacchedaText": "", "audioFile": "PB_000878.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000879", "originalText": "समः सिद्धावसिद्धौ च कृत्वापि न निबध्यते॥ २२॥", "padacchedaText": "", "audioFile": "PB_000879.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000880", "originalText": "यदृच्छालाभसन्तुष्टः अप्रार्थितोपनतो लाभो यदृच्छालाभः तेन सन्तुष्टः सञ्जातालंप्रत्ययः।", "padacchedaText": "", "audioFile": "PB_000880.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000881", "originalText": "द्वन्द्वातीतः द्वन्द्वैः शीतोष्णादिभिः हन्यमानोऽपि अविषण्णचित्तः द्वन्द्वातीतः उच्यते।", "padacchedaText": "", "audioFile": "PB_000881.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000882", "originalText": "विमत्सरः विगतमत्सरः निर्वैरबुद्दिः समः तुल्यः यदृच्छालाभस्य सिद्धौ असिद्धौ च।", "padacchedaText": "", "audioFile": "PB_000882.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000883", "originalText": "यः एवंभूतो यतिः अन्नादेः शरीरस्थितिहेतोः लाभालाभयोः समः हर्षविषादवर्जितः कर्मादौ अकर्मादिदर्शी यथाभूतात्मदर्शननिष्ठः सन् शरीरस्थितिमात्रप्रयोजने भिक्षाटनादिकर्मणि शरीरादिनिर्वर्त्ये ‘नैव किञ्चित् करोम्यहम्’ (भ.गी.५.८), ‘गुणा गुणेषु वर्तन्ते’ (भ.गी.३.२८) इत्येवं सदा सम्परिचक्षाणः आत्मनः कर्तृत्वाभावं पश्यन्नैव किञ्चित् भिक्षाटनादिकं कर्म करोति, लोकव्यवहारसामान्यदर्शनेन तु लौकिकैः आरोपितकर्तृत्वे भिक्षाटनादौ कर्मणि कर्ता भवति।", "padacchedaText": "", "audioFile": "PB_000883.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000884", "originalText": "स्वानुभवेन तु शास्त्रप्रमाणादिजनितेन अकर्तैव।", "padacchedaText": "", "audioFile": "PB_000884.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000885", "originalText": "स एवं पराध्यारोपितकर्तृत्वः शरीरस्थितिमात्रप्रयोजनं भिक्षाटनादिकं कर्म कृत्वापि न निबध्यते बन्धहेतोः कर्मणः सहेतुकस्य ज्ञानाग्निना दग्धत्वात् इति उक्तानुवाद एव एषः॥ २२॥", "padacchedaText": "", "audioFile": "PB_000885.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000886", "originalText": "‘त्यक्त्वा कर्मफलासङ्गम्’ (भ.गी.४.२०) इत्यनेन श्लोकेन यः प्रारब्धकर्मा सन् यदा निष्क्रियब्रह्मात्मदर्शनसम्पन्नः स्यात् तदा तस्य आत्मनः कर्तृकर्मप्रयोजनाभावदर्शिनः कर्मपरित्यागे प्राप्ते कुतश्चिन्निमित्तात् तदसम्भवे सति पूर्ववत् तस्मिन् कर्मणि अभिप्रवृत्तस्य अपि ‘नैव किञ्चित् करोति सः’ (भ.गी.४.२०) इति कर्माभावः प्रदर्शितः।", "padacchedaText": "", "audioFile": "PB_000886.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000887", "originalText": "यस्य एवं कर्माभावो दर्शितः तस्यैव—\nगतसङ्गस्य मुक्तस्य ज्ञानावस्थितचेतसः। यज्ञायाचरतः कर्म समग्रं प्रविलीयते॥ २३॥", "padacchedaText": "", "audioFile": "PB_000887.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000888", "originalText": "गतसङ्गस्य सर्वतोनिवृत्तासक्तेः, मुक्तस्य निवृत्तधर्माधर्मादिबन्धनस्य, ज्ञानावस्थितचेतसः ज्ञाने एव अवस्थितं चेतः यस्य सोऽयं ज्ञानावस्थितचेताः तस्य, यज्ञाय यज्ञनिर्वृत्त्यर्थम् आचरतः निर्वर्तयतः कर्म समग्रं सह अग्रेण फलेन वर्तते इति समग्रं कर्म तत् समग्रं प्रविलीयते विनश्यति इत्यर्थः॥ २३॥", "padacchedaText": "", "audioFile": "PB_000888.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000889", "originalText": "कस्मात् पुनः कारणात् क्रियमाणं कर्म स्वकार्यारम्भम् अकुर्वत् समग्रं प्रविलीयते इत्युच्यते यतः—\nब्रह्मार्पणं ब्रह्म हविर्ब्रह्माग्नौ ब्रह्मणा हुतम्। ब्रह्मैव तेन गन्तव्यं ब्रह्मकर्मसमाधिना॥ २४॥", "padacchedaText": "", "audioFile": "PB_000889.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000890", "originalText": "ब्रह्म अर्पणं येन करणेन ब्रह्मवित् हविः अग्नौ अर्पयति तत् ब्रह्मैव इति पश्यति, तस्य आत्मव्यतिरेकेण अभावं पश्यति, यथा शुक्तिकायां रजताभावं पश्यति, तदुच्यते ब्रह्मैव अर्पणमिति, यथा यद्रजतं तत् शुक्तिकैवेति।", "padacchedaText": "", "audioFile": "PB_000890.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000891", "originalText": "‘ब्रह्म अर्पणम्’ इति असमस्ते पदे।", "padacchedaText": "", "audioFile": "PB_000891.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000892", "originalText": "यत् अर्पणबुद्ध्या गृह्यते लोके तत् अस्य ब्रह्मविदः ब्रह्मैव इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000892.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000893", "originalText": "ब्रह्म हविः तथा यत् हविर्बुद्ध्या गृह्यमाणं तत् ब्रह्मैव अस्य।", "padacchedaText": "", "audioFile": "PB_000893.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000894", "originalText": "तथा ‘ब्रह्माग्नौ’ इति समस्तं पदम्।", "padacchedaText": "", "audioFile": "PB_000894.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000895", "originalText": "अग्निरपि ब्रह्मैव यत्र हूयते ब्रह्मणा कर्त्रा, ब्रह्मैव कर्तेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000895.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000896", "originalText": "यत् तेन हुतं हवनक्रिया तत् ब्रह्मैव।", "padacchedaText": "", "audioFile": "PB_000896.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000897", "originalText": "यत् तेन गन्तव्यं फलं तदपि ब्रह्मैव ब्रह्मकर्मसमाधिना ब्रह्मैव कर्म ब्रह्मकर्म तस्मिन् समाधिः यस्य सः ब्रह्मकर्मसमाधिः तेन ब्रह्मकर्मसमाधिना ब्रह्मैव गन्तव्यम्॥", "padacchedaText": "", "audioFile": "PB_000897.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000898", "originalText": "एवं लोकसङ्ग्रहं चिकीर्षुणापि क्रियमाणं कर्म परमार्थतः अकर्म, ब्रह्मबुद्ध्युपमृदितत्वात्।", "padacchedaText": "", "audioFile": "PB_000898.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000899", "originalText": "एवं सति निवृत्तकर्मणोऽपि सर्वकर्मसंन्यासिनः सम्यग्दर्शनस्तुत्यर्थं यज्ञत्वसम्पादनं ज्ञानस्य सुतरामुपपद्यते, यत् अर्पणादि अधियज्ञे प्रसिद्धं तत् अस्य अध्यात्मं ब्रह्मैव परमार्थदर्शिन इति।", "padacchedaText": "", "audioFile": "PB_000899.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000900", "originalText": "अन्यथा सर्वस्य ब्रह्मत्वे अर्पणादीनामेव विशेषतो ब्रह्मत्वाभिधानम् अनर्थकं स्यात्।", "padacchedaText": "", "audioFile": "PB_000900.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000901", "originalText": "तस्मात् ब्रह्मैव इदं सर्वमिति अभिजानतः विदुषः कर्माभावः।", "padacchedaText": "", "audioFile": "PB_000901.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000902", "originalText": "कारकबुद्ध्यभावाच्च।", "padacchedaText": "", "audioFile": "PB_000902.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000903", "originalText": "न हि कारकबुद्धिरहितं यज्ञाख्यं कर्म दृष्टम्।", "padacchedaText": "", "audioFile": "PB_000903.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000904", "originalText": "सर्वमेव अग्निहोत्रादिकं कर्म शब्दसमर्पितदेवताविशेषसम्प्रदानादिकारकबुद्धिमत् कर्त्रभिमानफलाभिसन्धिमच्च दृष्टम्, न उपमृदितक्रियाकारकफलभेदबुद्धिमत् कर्तृत्वाभिमानफलाभिसन्धिरहितं वा।", "padacchedaText": "", "audioFile": "PB_000904.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000905", "originalText": "इदं तु ब्रह्मबुद्ध्युपमृदितार्पणादिकारकक्रियाफलभेदबुद्धि कर्म।", "padacchedaText": "", "audioFile": "PB_000905.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000906", "originalText": "अतः अकर्मैव तत्।", "padacchedaText": "", "audioFile": "PB_000906.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000907", "originalText": "तथा च दर्शितम् ‘कर्मण्यकर्म यः पश्येत्’ (भ.गी.४.१८) ‘कर्मण्यभिप्रवृत्तोऽपि नैव किञ्चित्करोति सः’ (भ.गी.४.२०) ‘गुणा गुणेषु वर्तन्ते’ (भ.गी.३.२८) ‘नैव किञ्चित्करोमीति युक्तो मन्येत तत्त्ववित्’ (भ.गी.५.८) इत्यादिभिः।", "padacchedaText": "", "audioFile": "PB_000907.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000908", "originalText": "तथा च दर्शयन् तत्र तत्र क्रियाकारकफलभेदबुद्ध्युपमर्दं करोति।", "padacchedaText": "", "audioFile": "PB_000908.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000909", "originalText": "दृष्टा च काम्याग्निहोत्रादौ कामोपमर्देन काम्याग्निहोत्रादिहानिः।", "padacchedaText": "", "audioFile": "PB_000909.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000910", "originalText": "तथा मतिपूर्वकामतिपूर्वकादीनां कर्मणां कार्यविशेषस्य आरम्भकत्वं दृष्टम्।", "padacchedaText": "", "audioFile": "PB_000910.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000911", "originalText": "तथा इहापि ब्रह्मबुद्ध्युपमृदितार्पणादिकारकक्रियाफलभेदबुद्धेः बाह्यचेष्टामात्रेण कर्मापि विदुषः अकर्म सम्पद्यते। अतः उक्तम् ‘समग्रं प्रविलीयते’ (भ.गी.४.२०) इति॥", "padacchedaText": "", "audioFile": "PB_000911.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000912", "originalText": "अत्र केचिदाहुः— यत् ब्रह्म तत् अर्पणादीनि, ब्रह्मैव किल अर्पणादिना पञ्चविधेन कारकात्मना व्यवस्थितं सत् तदेव कर्म करोति। तत्र न अर्पणादिबुद्धिः निवर्त्यते, किं तु अर्पणादिषु ब्रह्मबुद्धिः आधीयते, यथा प्रतिमादौ विष्ण्वादिबुद्धिः, यथा वा नामादौ ब्रह्मबुद्धिरिति॥", "padacchedaText": "", "audioFile": "PB_000912.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000913", "originalText": "सत्यम्, एवमपि स्यात् यदि ज्ञानयज्ञस्तुत्यर्थं प्रकरणं न स्यात्।", "padacchedaText": "", "audioFile": "PB_000913.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000914", "originalText": "अत्र तु सम्यग्दर्शनं ज्ञानयज्ञशब्दितम् अनेकान् यज्ञशब्दितान् क्रियाविशेषान् उपन्यस्य ‘श्रेयान् द्रव्यमयाद्यज्ञात् ज्ञानयज्ञः’ (भ.गी.४.३३) इति ज्ञानं स्तौति।", "padacchedaText": "", "audioFile": "PB_000914.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000915", "originalText": "अत्र च समर्थमिदं वचनम् ‘ब्रह्मार्पणम्’ इत्यादि ज्ञानस्य यज्ञत्वसम्पादने, अन्यथा सर्वस्य ब्रह्मत्वे अर्पणादीनामेव विशेषतो ब्रह्मत्वाभिधानमनर्थकं स्यात्।", "padacchedaText": "", "audioFile": "PB_000915.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000916", "originalText": "ये तु अर्पणादिषु प्रतिमायां विष्णुदृष्टिवत् ब्रह्मदृष्टिः क्षिप्यते नामादिष्विव चेति ब्रुवते न तेषां ब्रह्मविद्या उक्ता इह विवक्षिता स्यात्, अर्पणादिविषयत्वात् ज्ञानस्य।", "padacchedaText": "", "audioFile": "PB_000916.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000917", "originalText": "न च दृष्टिसम्पादनज्ञानेन मोक्षफलं प्राप्यते।", "padacchedaText": "", "audioFile": "PB_000917.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000918", "originalText": "‘ब्रह्मैव तेन गन्तव्यम्’ इति चोच्यते।", "padacchedaText": "", "audioFile": "PB_000918.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000919", "originalText": "विरुद्धं च सम्यग्दर्शनम् अन्तरेण मोक्षफलं प्राप्यते इति।", "padacchedaText": "", "audioFile": "PB_000919.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000920", "originalText": "प्रकृतविरोधश्च, सम्यग्दर्शनम् च प्रकृतम् ‘कर्मण्यकर्म यः पश्येत्’ (भ.गी.४.१८) इत्यत्र, अन्ते च सम्यग्दर्शनम्, तस्यैव उपसंहारात्।", "padacchedaText": "", "audioFile": "PB_000920.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000921", "originalText": "‘श्रेयान् द्रव्यमयाद्यज्ञात् ज्ञानयज्ञः’ (भ.गी.४.३३), ‘ज्ञानं लब्ध्वा परां शान्तिम्’ (भ.गी.४.३९) इत्यादिना सम्यग्दर्शनस्तुतिमेव कुर्वन् उपक्षीणः अध्यायः।", "padacchedaText": "", "audioFile": "PB_000921.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000922", "originalText": "तत्र अकस्मात् अर्पणादौ ब्रह्मदृष्टिः अप्रकरणे प्रतिमायामिव विष्णुदृष्टिः उच्यते इति अनुपपन्नम्| तस्मात् यथाव्याख्यातार्थ एव अयं श्लोकः॥ २४॥", "padacchedaText": "", "audioFile": "PB_000922.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000923", "originalText": "तत्र अधुना सम्यग्दर्शनस्य यज्ञत्वं सम्पाद्य तत्स्तुत्यर्थम् अन्येऽपि यज्ञा उपक्षिप्यन्ते—\nदैवमेवापरे यज्ञं योगिनः पर्युपासते। ब्रह्माग्नावपरे यज्ञं यज्ञेनैवोपजुह्वति॥ २५॥", "padacchedaText": "", "audioFile": "PB_000923.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000924", "originalText": "दैवमेव देवा इज्यन्ते येन यज्ञेन असौ दैवो यज्ञः तमेव अपरे यज्ञं योगिनः कर्मिणः पर्युपासते कुर्वन्तीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000924.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000925", "originalText": "ब्रह्माग्नौ ‘सत्यं ज्ञानमनन्तं ब्रह्म’ (तै.२.१.१) ‘विज्ञानमानन्दं ब्रह्म’ ‘यत् साक्षादपरोक्षात् ब्रह्म य आत्मा सर्वान्तरः’ (बृ.३.४.१) इत्यादिवचनोक्तम् अशनायादिसर्वसंसारधर्मवर्जितम् ‘नेति नेति’ (बृ.४.४.२२) इति निरस्ताशेषविशेषं ब्रह्मशब्देन उच्यते।", "padacchedaText": "", "audioFile": "PB_000925.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000926", "originalText": "ब्रह्म च तत् अग्निश्च सः होमाधिकरणत्वविवक्षया ब्रह्माग्निः।", "padacchedaText": "", "audioFile": "PB_000926.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000927", "originalText": "तस्मिन् ब्रह्माग्नौ अपरे अन्ये ब्रह्मविदः यज्ञम्— यज्ञशब्दवाच्य आत्मा, आत्मनामसु यज्ञशब्दस्य पाठात्— तम् आत्मानं यज्ञं परमार्थतः परमेव ब्रह्म सन्तं बुद्ध्याद्युपाधिसंयुक्तम् अध्यस्तसर्वोपाधिधर्मकम् आहुतिरूपं यज्ञेनैव आत्मनैव उक्तलक्षणेन उपजुह्वति प्रक्षिपन्ति, सोपाधिकस्य आत्मनः निरुपाधिकेन परब्रह्मस्वरूपेणैव यद्दर्शनं स तस्मिन् होमः तं कुर्वन्ति ब्रह्मात्मैकत्वदर्शननिष्ठाः संन्यासिनः इत्यर्थः॥ २५॥", "padacchedaText": "", "audioFile": "PB_000927.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000928", "originalText": "सोऽयं सम्यग्दर्शनलक्षणः यज्ञः दैवयज्ञादिषु यज्ञेषु उपक्षिप्यते ‘ब्रह्मार्पणम्’ इत्यादिश्लोकैः प्रस्तुतः ‘श्रेयान् द्रव्यमयाद्यज्ञात् ज्ञानयज्ञः परन्तप’ (भ.गी.४.३३) इत्यादिना स्तुत्यर्थम्—\nश्रोत्रादीनीन्द्रियाण्यन्ये संयमाग्निषु जुह्वति।", "padacchedaText": "", "audioFile": "PB_000928.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000929", "originalText": "शब्दादीन्विषयानन्य इन्द्रियाग्निषु जुह्वति॥ २६॥", "padacchedaText": "", "audioFile": "PB_000929.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000930", "originalText": "श्रोत्रादीनि इन्द्रियाणि अन्ये योगिनः संयमाग्निषु।", "padacchedaText": "", "audioFile": "PB_000930.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000931", "originalText": "प्रतीन्द्रियं संयमो भिद्यते इति बहुवचनम्।", "padacchedaText": "", "audioFile": "PB_000931.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000932", "originalText": "संयमा एव अग्नयः तेषु जुह्वति इन्द्रियसंयममेव कुर्वन्ति इत्यर्थः। शब्दादीन् विषयान् अन्ये इन्द्रियाग्निषु इन्द्रियाण्येव अग्नयः तेषु इन्द्रियाग्निषु जुह्वति श्रोत्रादिभिरविरुद्धविषयग्रहणं होमं मन्यन्ते॥ २६॥", "padacchedaText": "", "audioFile": "PB_000932.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000933", "originalText": "किञ्च—\nसर्वाणीन्द्रियकर्माणि प्राणकर्माणि चापरे। आत्मसंयमयोगाग्नौ जुह्वति ज्ञानदीपिते॥ २७॥", "padacchedaText": "", "audioFile": "PB_000933.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000934", "originalText": "सर्वाणि इन्द्रियकर्माणि इन्द्रियाणां कर्माणि इन्द्रियकर्माणि, तथा प्राणकर्माणि प्राणो वायुः आध्यात्मिकः तत्कर्माणि आकुञ्चनप्रसारणादीनि तानि च अपरे आत्मसंयमयोगाग्नौ आत्मनि संयमः आत्मसंयमः स एव योगाग्निः तस्मिन् आत्मसंयमयोगाग्नौ जुह्वति प्रक्षिपन्ति ज्ञानदीपिते स्नेहेनेव प्रदीपे विवेकविज्ञानेन उज्ज्वलभावम् आपादिते जुह्वति प्रविलापयन्ति इत्यर्थः॥ २७॥", "padacchedaText": "", "audioFile": "PB_000934.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000935", "originalText": "द्रव्ययज्ञास्तपोयज्ञा योगयज्ञास्तथापरे। स्वाध्यायज्ञानयज्ञाश्च यतयः संशितव्रताः॥ २८॥", "padacchedaText": "", "audioFile": "PB_000935.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000936", "originalText": "द्रव्ययज्ञाः तीर्थेषु द्रव्यविनियोगं यज्ञबुद्ध्या कुर्वन्ति ये ते द्रव्ययज्ञाः।", "padacchedaText": "", "audioFile": "PB_000936.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000937", "originalText": "तपोयज्ञाः तपः यज्ञः येषां तपस्विनां ते तपोयज्ञाः।", "padacchedaText": "", "audioFile": "PB_000937.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000938", "originalText": "योगयज्ञाः प्राणायामप्रत्याहारादिलक्षणो योगो यज्ञो येषां ते योगयज्ञाः।", "padacchedaText": "", "audioFile": "PB_000938.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000939", "originalText": "तथा अपरे स्वाध्यायज्ञानयज्ञाश्च स्वाध्यायः यथाविधि ऋगाद्यभ्यासः यज्ञः येषां ते स्वाध्याययज्ञाः।", "padacchedaText": "", "audioFile": "PB_000939.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000940", "originalText": "ज्ञानयज्ञाः ज्ञानं शास्त्रार्थपरिज्ञानं यज्ञः येषां ते ज्ञानयज्ञाश्च यतयः यतनशीलाः संशितव्रताः सम्यक् शितानि तनूकृतानि तीक्ष्णीकृतानि व्रतानि येषां ते संशितव्रताः॥ २८॥", "padacchedaText": "", "audioFile": "PB_000940.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000941", "originalText": "किञ्च—\nअपाने जुह्वति प्राणं प्राणेऽपानं तथापरे। प्राणापानगती रुद्ध्वा प्राणायामपरायणाः॥ २९॥", "padacchedaText": "", "audioFile": "PB_000941.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000942", "originalText": "अपाने अपानवृत्तौ जुह्वति प्रक्षिपन्ति प्राणं प्राणवृत्तिम्, पूरकाख्यं प्राणायामं कुर्वन्तीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000942.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000943", "originalText": "प्राणे अपानं तथा अपरे जुह्वति, रेचकाख्यं च प्राणायामं कुर्वन्तीत्येतत्।", "padacchedaText": "", "audioFile": "PB_000943.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000944", "originalText": "प्राणापानगती मुखनासिकाभ्यां वायोः निर्गमनं प्राणस्य गतिः, तद्विपर्ययेण अधोगमनम् अपानस्य गतिः, ते प्राणापानगती एते रुद्ध्वा निरुध्य प्राणायामपरायणाः प्राणायामतत्पराः, कुम्भकाख्यं प्राणायामं कुर्वन्तीत्यर्थः॥ २९॥", "padacchedaText": "", "audioFile": "PB_000944.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000945", "originalText": "किञ्च—\nअपरे नियताहाराः प्राणान्प्राणेषु जुह्वति। सर्वेऽप्येते यज्ञविदो यज्ञक्षपितकल्मषाः॥ ३०॥", "padacchedaText": "", "audioFile": "PB_000945.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000946", "originalText": "अपरे नियताहाराः नियतः परिमितः आहारः येषां ते नियताहाराः सन्तः प्राणान् वायुभेदान् प्राणेषु एव जुह्वति यस्य यस्य वायोः जयः क्रियते इतरान् वायुभेदान् तस्मिन् तस्मिन् जुह्वति, ते तत्र प्रविष्टा इव भवन्ति।", "padacchedaText": "", "audioFile": "PB_000946.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000947", "originalText": "सर्वेऽपि एते यज्ञविदः यज्ञक्षपितकल्मषाः यज्ञैः यथोक्तैः क्षपितः नाशितः कल्मषो येषां ते यज्ञक्षपितकल्मषाः॥ ३०॥", "padacchedaText": "", "audioFile": "PB_000947.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000948", "originalText": "एवं यथोक्तान् यज्ञान् निर्वर्त्य—\nयज्ञशिष्टामृतभुजो यान्ति ब्रह्म सनातनम्। नायं लोकोऽस्त्ययज्ञस्य कुतोऽन्यः कुरुसत्तम॥ ३१॥", "padacchedaText": "", "audioFile": "PB_000948.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000949", "originalText": "यज्ञशिष्टामृतभुजः यज्ञानां शिष्टं यज्ञशिष्टं यज्ञशिष्टं च तत् अमृतं च यज्ञशिष्टामृतं तत् भुञ्जते इति यज्ञशिष्टामृतभुजः।", "padacchedaText": "", "audioFile": "PB_000949.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000950", "originalText": "यथोक्तान् यज्ञान् कृत्वा तच्छिष्टेन कालेन यथाविधिचोदितम् अन्नम् अमृताख्यं भुञ्जते इति यज्ञशिष्टामृतभुजः यान्ति गच्छन्ति ब्रह्म सनातनं चिरन्तनं मुमुक्षवश्चेत्, कालातिक्रमापेक्षया इति सामर्थ्यात् गम्यते।", "padacchedaText": "", "audioFile": "PB_000950.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000951", "originalText": "न अयं लोकः सर्वप्राणिसाधारणोऽपि अस्ति यथोक्तानां यज्ञानां एकोऽपि यज्ञः यस्य नास्ति सः अयज्ञः तस्य। कुतः अन्यो विशिष्टसाधनसाध्यः कुरुसत्तम॥ ३१॥", "padacchedaText": "", "audioFile": "PB_000951.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000952", "originalText": "एवं बहुविधा यज्ञा वितता ब्रह्मणो मुखे। कर्मजान्विद्धि तान्सर्वानेवं ज्ञात्वा विमोक्ष्यसे॥ ३२॥", "padacchedaText": "", "audioFile": "PB_000952.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000953", "originalText": "एवं यथोक्ता बहुविधा बहुप्रकारा यज्ञाः वितताः विस्तीर्णाः ब्रह्मणो वेदस्य मुखे द्वारे वेदद्वारेण अवगम्यमानाः ब्रह्मणो मुखे वितता उच्यन्ते, तद्यथा ‘वाचि हि प्राणं जुहुमः’ (ऐ.आ.३.२.६) इत्यादयः।", "padacchedaText": "", "audioFile": "PB_000953.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000954", "originalText": "कर्मजान् कायिकवाचिकमानसकर्मोद्भावान् विद्धि तान् सर्वान् अनात्मजान्, निर्व्यापारो हि आत्मा।", "padacchedaText": "", "audioFile": "PB_000954.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000955", "originalText": "अत एवं ज्ञात्वा विमोक्ष्यसे अशुभात्। न मद्व्यापारा इमे, निर्व्यापारोऽहम् उदासीन इत्येवं ज्ञात्वा अस्मात् सम्यग्दर्शनात् मोक्ष्यसे संसारबन्धनात् इत्यर्थः॥ ३२॥", "padacchedaText": "", "audioFile": "PB_000955.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000956", "originalText": "‘ब्रह्मार्पणम्’ (भ.गी.४.२४) इत्यादिश्लोकेन सम्यग्दर्शनस्य यज्ञत्वं सम्पादितम्।", "padacchedaText": "", "audioFile": "PB_000956.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000957", "originalText": "यज्ञाश्च अनेके उपदिष्टाः।", "padacchedaText": "", "audioFile": "PB_000957.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000958", "originalText": "तैः सिद्धपुरुषार्थप्रयोजनैः ज्ञानं स्तूयते।", "padacchedaText": "", "audioFile": "PB_000958.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000959", "originalText": "कथम्?—\nश्रेयान्द्रव्यमयाद्यज्ञाज्ज्ञानयज्ञः परन्तप। सर्वं कर्माखिलं पार्थ ज्ञाने परिसमाप्यते॥ ३३॥", "padacchedaText": "", "audioFile": "PB_000959.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000960", "originalText": "श्रेयान् द्रव्यमयात् द्रव्यसाधनसाध्यात् यज्ञात् ज्ञानयज्ञः हे परन्तप।", "padacchedaText": "", "audioFile": "PB_000960.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000961", "originalText": "द्रव्यमयो हि यज्ञः फलस्यारम्भकः, ज्ञानयज्ञः न फलारम्भकः, अतः श्रेयान् प्रशस्यतरः।", "padacchedaText": "", "audioFile": "PB_000961.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000962", "originalText": "कथम्? यतः सर्वं कर्म समस्तम् अखिलम् अप्रतिबद्धं पार्थ ज्ञाने मोक्षसाधने सर्वतःसम्प्लुतोदकस्थानीये परिसमाप्यते अन्तर्भवतीत्यर्थः ‘यथा कृताय विजितायाधरेयाः संयन्त्येवमेवं सर्वं तदभिसमेति यत् किञ्चित्प्रजाः साधु कुर्वन्ति यस्तद्वेद यत्स वेद’ (छा.४.१.४) इति श्रुतेः॥ ३३॥", "padacchedaText": "", "audioFile": "PB_000962.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000963", "originalText": "तदेतत् विशिष्टं ज्ञानं तर्हि केन प्राप्यते इत्युच्यते—\nतद्विद्धि प्रणिपातेन परिप्रश्नेन सेवया। उपदेक्ष्यन्ति ते ज्ञानं ज्ञानिनस्तत्त्वदर्शिनः॥ ३४॥", "padacchedaText": "", "audioFile": "PB_000963.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000964", "originalText": "तत् विद्धि विजानीहि येन विधिना प्राप्यते इति।", "padacchedaText": "", "audioFile": "PB_000964.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000965", "originalText": "आचार्यान् अभिगम्य, प्रणिपातेन प्रकर्षेण नीचैः पतनं प्रणिपातः दीर्घनमस्कारः तेन, ‘कथं बन्धः? कथं मोक्षः? का विद्या? का चाविद्या? ’ इति परिप्रश्नेन, सेवया गुरुशुश्रूषया एवमादिना।", "padacchedaText": "", "audioFile": "PB_000965.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000966", "originalText": "प्रश्रयेण आवर्जिता आचार्या उपदेक्ष्यन्ति कथयिष्यन्ति ते ज्ञानं यथोक्तविशेषणं ज्ञानिनः।", "padacchedaText": "", "audioFile": "PB_000966.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000967", "originalText": "ज्ञानवन्तोऽपि केचित् यथावत् तत्त्वदर्शनशीलाः, अपरे न, अतो विशिनष्टि तत्त्वदर्शिनः इति। ये सम्यग्दर्शिनः तैः उपदिष्टं ज्ञानं कार्यक्षमं भवति नेतरत् इति भगवतो मतम्॥ ३४॥", "padacchedaText": "", "audioFile": "PB_000967.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000968", "originalText": "तथा च सति इदमपि समर्थं वचनम्—\nयज्ज्ञात्वा न पुनर्मोहमेवं यास्यसि पाण्डव। येन भूतान्यशेषेण द्रक्ष्यस्यात्मन्यथो मयि॥ ३५॥", "padacchedaText": "", "audioFile": "PB_000968.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000969", "originalText": "यत् ज्ञात्वा यत् ज्ञानं तैः उपदिष्टं अधिगम्य प्राप्य पुनः भूयः मोहम् एवं यथा इदानीं मोहं गतोऽसि पुनः एवं न यास्यसि हे पाण्डव।", "padacchedaText": "", "audioFile": "PB_000969.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000970", "originalText": "किञ्च— येन ज्ञानेन भूतानि अशेषेण ब्रह्मादीनि स्तम्बपर्यन्तानि द्रक्ष्यसि साक्षात् आत्मनि प्रत्यगात्मनि ‘मत्संस्थानि इमानि भूतानि’ इति अथो अपि मयि वासुदेवे ‘परमेश्वरे च इमानि’ इति, क्षेत्रज्ञेश्वरैकत्वं सर्वोपनिषत्प्रसिद्धं द्रक्ष्यसि इत्यर्थः॥ ३५॥", "padacchedaText": "", "audioFile": "PB_000970.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000971", "originalText": "किञ्च एतस्य ज्ञानस्य माहात्म्यम्—\nअपि चेदसि पापेभ्यः सर्वेभ्यः पापकृत्तमः। सर्वं ज्ञानप्लवेनैव वृजिनं सन्तरिष्यसि॥ ३६॥", "padacchedaText": "", "audioFile": "PB_000971.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000972", "originalText": "अपि चेत् असि पापेभ्यः पापकृद्भ्यः सर्वेभ्यः अतिशयेन पापकृत् पापकृत्तमः सर्वं ज्ञानप्लवेनैव ज्ञानमेव प्लवं कृत्वा वृजिनं वृजिनार्णवं पापसमुद्रं सन्तरिष्यसि।", "padacchedaText": "", "audioFile": "PB_000972.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000973", "originalText": "धर्मोऽपि इह मुमुक्षोः पापम् उच्यते॥ ३६॥", "padacchedaText": "", "audioFile": "PB_000973.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000974", "originalText": "ज्ञानं कथं नाशयति पापमिति दृष्टान्त उच्यते—\nयथैधांसि समिद्धोऽग्निर्भस्मसात्कुरुतेऽर्जुन। ज्ञानाग्निः सर्वकर्माणि भस्मसात्कुरुते तथा॥ ३७॥", "padacchedaText": "", "audioFile": "PB_000974.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000975", "originalText": "यथा एधांसि काष्ठानि समिद्धः सम्यक् इद्धः दीप्तः अग्निः भस्मसात् भस्मीभावं कुरुते हे अर्जुन, ज्ञानमेव अग्निः ज्ञानाग्निः सर्वकर्माणि भस्मसात् कुरुते तथा निर्बीजीकरोतीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000975.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000976", "originalText": "न हि साक्षादेव ज्ञानाग्निः कर्माणि इन्धनवत् भस्मीकर्तुं शक्नोति।", "padacchedaText": "", "audioFile": "PB_000976.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000977", "originalText": "तस्मात् सम्यग्दर्शनं सर्वकर्मणां निर्बीजत्वे कारणम् इत्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_000977.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000978", "originalText": "सामर्थ्यात् येन क
