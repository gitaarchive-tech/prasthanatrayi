र्मणा शरीरम् आरब्धं तत् प्रवृत्तफलत्वात् उपभोगेनैव क्षीयते। अतो यानि अप्रवृत्तफलानि ज्ञानोत्पत्तेः प्राक् कृतानि ज्ञानसहभावीनि च अतीतानेकजन्मकृतानि च तान्येव सर्वाणि भस्मसात् कुरुते॥ ३७॥", "padacchedaText": "", "audioFile": "PB_000978.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000979", "originalText": "यतः एवम् अतः—\nन हि ज्ञानेन सदृशं पवित्रमिह विद्यते। तत्स्वयं योगसंसिद्धः कालेनात्मनि विन्दति॥ ३८॥", "padacchedaText": "", "audioFile": "PB_000979.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000980", "originalText": "न हि ज्ञानेन सदृशं तुल्यं पवित्रं पावनं शुद्धिकरम् इह विद्यते। तत् ज्ञानं स्वयमेव योगसंसिद्धः योगेन कर्मयोगेन समाधियोगेन च संसिद्धः संस्कृतः योग्यताम् आपन्नः सन् मुमुक्षुः कालेन महता आत्मनि विन्दति लभते इत्यर्थः॥ ३८॥", "padacchedaText": "", "audioFile": "PB_000980.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000981", "originalText": "येन एकान्तेन ज्ञानप्राप्तिः भवति स उपायः उपदिश्यते—\nश्रद्धावांल्लभते ज्ञानं तत्परः संयतेन्द्रियः। ज्ञानं लब्ध्वा परां शान्तिमचिरेणाधिगच्छति॥ ३९॥", "padacchedaText": "", "audioFile": "PB_000981.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000982", "originalText": "श्रद्धावान् श्रद्धालुः लभते ज्ञानम्।", "padacchedaText": "", "audioFile": "PB_000982.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000983", "originalText": "श्रद्धालुत्वेऽपि भवति कश्चित् मन्दप्रस्थानः, अत आह— तत्परः, गुरूपसदनादौ अभियुक्तः ज्ञानलब्ध्युपाये श्रद्धावान्।", "padacchedaText": "", "audioFile": "PB_000983.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000984", "originalText": "तत्परः अपि अजितेन्द्रियः स्यात् इत्यतः आह— संयतेन्द्रियः, संयतानि विषयेभ्यो निवर्तितानि यस्य इन्द्रियाणि स संयतेन्द्रियः।", "padacchedaText": "", "audioFile": "PB_000984.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000985", "originalText": "य एवंभूतः श्रद्धावान् तत्परः संयतेन्द्रियश्च सः अवश्यं ज्ञानं लभते।", "padacchedaText": "", "audioFile": "PB_000985.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000986", "originalText": "प्रणिपातादिस्तु बाह्योऽनैकान्तिकोऽपि भवति, मायावित्वादिसम्भवात्, न तु तत् श्रद्धावत्त्वादौ इत्येकान्ततः ज्ञानलब्ध्युपायः।", "padacchedaText": "", "audioFile": "PB_000986.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000987", "originalText": "किं पुनः ज्ञानलाभात् स्यात् इत्युच्यते— ज्ञानं लब्ध्वा परां मोक्षाख्यां शान्तिम् उपरतिम् अचिरेण क्षिप्रमेव अधिगच्छति। सम्यग्दर्शनात् क्षिप्रमेव मोक्षो भवतीति सर्वशास्त्रन्यायप्रसिद्धः सुनिश्चितः अर्थः॥ ३९॥", "padacchedaText": "", "audioFile": "PB_000987.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000988", "originalText": "अत्र संशयः न कर्तव्यः, पापिष्ठो हि संशयः, कथम् इति उच्यते—\nअज्ञश्चाश्रद्दधानश्च संशयात्मा विनश्यति। नायं लोकोऽस्ति न परो न सुखं संशयात्मनः॥ ४०॥", "padacchedaText": "", "audioFile": "PB_000988.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000989", "originalText": "अज्ञश्च अनात्मज्ञश्च अश्रद्दधानश्च गुरुवाक्यशास्त्रेषु अविश्वासवांश्च संशयात्मा च संशयचित्तश्च विनश्यति।", "padacchedaText": "", "audioFile": "PB_000989.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000990", "originalText": "अज्ञाश्रद्दधानौ यद्यपि विनश्यतः, न तथा यथा संशयात्मा।", "padacchedaText": "", "audioFile": "PB_000990.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000991", "originalText": "संशयात्मा तु पापिष्ठः सर्वेषाम्।", "padacchedaText": "", "audioFile": "PB_000991.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000992", "originalText": "कथम्? नायं साधारणोऽपि लोकोऽस्ति।", "padacchedaText": "", "audioFile": "PB_000992.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000993", "originalText": "तथा न परः लोकः।", "padacchedaText": "", "audioFile": "PB_000993.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000994", "originalText": "न सुखम्, तत्रापि संशयोत्पत्तेः संशयात्मनः संशयचित्तस्य। तस्मात् संशयो न कर्तव्यः॥ ४०॥", "padacchedaText": "", "audioFile": "PB_000994.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000995", "originalText": "कस्मात्?—\nयोगसंन्यस्तकर्माणं ज्ञानसञ्छिन्नसंशयम्। आत्मवन्तं न कर्माणि निबध्नन्ति धनञ्जय॥ ४१॥", "padacchedaText": "", "audioFile": "PB_000995.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000996", "originalText": "योगसंन्यस्तकर्माणं परमार्थदर्शनलक्षणेन योगेन संन्यस्तानि कर्माणि येन परमार्थदर्शिना धर्माधर्माख्यानि तं योगसंन्यस्तकर्माणम्।", "padacchedaText": "", "audioFile": "PB_000996.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000997", "originalText": "कथं योगसंन्यस्तकर्मेत्याह— ज्ञानसञ्छिन्नसंशयं ज्ञानेन आत्मेश्वरैकत्वदर्शनलक्षणेन सञ्छिन्नः संशयो यस्य सः ज्ञानसञ्छिन्नसंशयः। य एवं योगसंन्यस्तकर्मा तम् आत्मवन्तम् अप्रमत्तं गुणचेष्टारूपेण दृष्टानि कर्माणि न निबध्नन्ति अनिष्टादिरूपं फलं नारभन्ते हे धनञ्जय॥ ४१॥", "padacchedaText": "", "audioFile": "PB_000997.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000998", "originalText": "यस्मात् कर्मयोगानुष्ठानात् अशुद्धिक्षयहेतुकज्ञानसञ्छिन्नसंशयः न निबध्यते कर्मभिः ज्ञानाग्निदग्धकर्मत्वादेव, यस्माच्च ज्ञानकर्मानुष्ठानविषये संशयवान् विनश्यति—\nतस्मादज्ञानसम्भूतं हृत्स्थं ज्ञानासिनात्मनः।", "padacchedaText": "", "audioFile": "PB_000998.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000999", "originalText": "छित्त्वैनं संशयं योगमातिष्ठोत्तिष्ठ भारत॥ ४२॥", "padacchedaText": "", "audioFile": "PB_000999.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001000", "originalText": "तस्मात् पापिष्ठम् अज्ञानसम्भूतम् अज्ञानात् अविवेकात् जातं हृत्स्थं हृदि बुद्धौ स्थितं ज्ञानासिना शोकमोहादिदोषहरं सम्यग्दर्शनं ज्ञानं तदेव असिः खङ्गः तेन ज्ञानासिना आत्मनः स्वस्य, आत्मविषयत्वात् संशयस्य।", "padacchedaText": "", "audioFile": "PB_001000.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001001", "originalText": "न हि परस्य संशयः परेण च्छेत्तव्यतां प्राप्तः, येन स्वस्येति विशेष्येत।", "padacchedaText": "", "audioFile": "PB_001001.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001002", "originalText": "अतः आत्मविषयोऽपि स्वस्यैव भवति।", "padacchedaText": "", "audioFile": "PB_001002.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001003", "originalText": "छित्त्वा एनं संशयं स्वविनाशहेतुभूतम्, योगं सम्यग्दर्शनोपायं कर्मानुष्ठानम् आतिष्ठ कुर्वित्यर्थः। उत्तिष्ठ च इदानीं युद्धाय भारत इति॥ ४२॥", "padacchedaText": "", "audioFile": "PB_001003.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001004", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ श्रीमद्भगवद्गीताभाष्ये चतुर्थोऽध्यायः॥", "padacchedaText": "", "audioFile": "PB_001004.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001005", "originalText": "पञ्चमोऽध्यायः\n‘कर्मण्यकर्म यः पश्येत्’ (भ.गी.४.१८) इत्यारभ्य ‘स युक्तः कृत्स्नकर्मकृत्’ (भ.गी.४.१८) ‘ज्ञानाग्निदग्धकर्माणम्’ (भ.गी.४.१९) ‘शारीरं केवलं कर्म कुर्वन्’ (भ.गी.४.२१) ‘यदृच्छालाभसन्तुष्टः’ (भ.गी.४.२२) ‘ब्रह्मार्पणं ब्रह्म हविः’ (भ.गी.४.२४) ‘कर्मजान् विद्धि तान् सर्वान्’ (भ.गी.४.३२) ‘सर्वं कर्माखिलं पार्थ’ (भ.गी.४.३३) ‘ज्ञानाग्निः सर्वकर्माणि’ (भ.गी.४.३७) ‘योगसंन्यस्तकर्माणम्’ (भ.गी.४.४१) इत्येतैः वचनैः सर्वकर्मसंन्यासम् अवोचत् भगवान्।", "padacchedaText": "", "audioFile": "PB_001005.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001006", "originalText": "‘छित्त्वैनं संशयं योगमातिष्ठ’ (भ.गी.४.४२) इत्यनेन वचनेन योगं च कर्मानुष्ठानलक्षणम् अनुतिष्ठ इत्युक्तवान्।", "padacchedaText": "", "audioFile": "PB_001006.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001007", "originalText": "तयोरुभयोश्च कर्मानुष्ठानकर्मसंन्यासयोः स्थितिगतिवत् परस्परविरोधात् एकेन सह कर्तुमशक्यत्वात्, कालभेदेन च अनुष्ठानविधानाभावात्, अर्थात् एतयोः अन्यतरकर्तव्यताप्राप्तौ सत्यां यत् प्रशस्यतरम् एतयोः कर्मानुष्ठानकर्मसंन्यासयोः तत् कर्तव्यं न इतरत् इत्येवं मन्यमानः प्रशस्यतरबुभुत्सया अर्जुन उवाच— ‘संन्यासं कर्मणां कृष्ण’ (भ.गी.५.१) इत्यादिना॥", "padacchedaText": "", "audioFile": "PB_001007.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001008", "originalText": "ननु च आत्मविदः ज्ञानयोगेन निष्ठां प्रतिपिपादयिषन् पूर्वोदाहृतैः वचनैः भगवान् सर्वकर्मसंन्यासम् अवोचत्, न तु अनात्मज्ञस्य।", "padacchedaText": "", "audioFile": "PB_001008.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001009", "originalText": "अतश्च कर्मानुष्ठानकर्मसंन्यासयोः भिन्नपुरुषविषयत्वात् अन्यतरस्य प्रशस्यतरत्वबुभुत्सया अयं प्रश्नः अनुपपन्नः।", "padacchedaText": "", "audioFile": "PB_001009.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001010", "originalText": "सत्यमेव त्वदभिप्रायेण प्रश्नो न उपपद्यते, प्रष्टुः स्वाभिप्रायेण पुनः प्रश्नः युज्यत एवेति वदामः।", "padacchedaText": "", "audioFile": "PB_001010.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001011", "originalText": "कथम्? पूर्वोदाहृतैः वचनैः भगवता कर्मसंन्यासस्य कर्तव्यतया विवक्षितत्वात्, प्राधान्यमन्तरेण च कर्तारं तस्य कर्तव्यत्वासम्भवात् अनात्मविदपि कर्ता पक्षे प्राप्तः अनूद्यत एव, न पुनः आत्मवित्कर्तृकत्वमेव संन्यासस्य विवक्षितम्, इत्येवं मन्वानस्य अर्जुनस्य कर्मानुष्ठानकर्मसंन्यासयोः अविद्वत्पुरुषकर्तृकत्वमपि अस्तीति पूर्वोक्तेन प्रकारेण तयोः परस्परविरोधात् अन्यतरस्य कर्तव्यत्वे प्राप्ते प्रशस्यतरं च कर्तव्यम् न इतरत् इति प्रशस्यतरविविदिषया प्रश्नः न अनुपपन्नः॥", "padacchedaText": "", "audioFile": "PB_001011.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001012", "originalText": "प्रतिवचनवाक्यार्थनिरूपणेनापि प्रष्टुः अभिप्रायः एवमेवेति गम्यते।", "padacchedaText": "", "audioFile": "PB_001012.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001013", "originalText": "कथम्? ‘संन्यासकर्मयोगौ निःश्रेयसकरौ तयोस्तु कर्मयोगो विशिष्यते’ (भ.गी.५.२) इति प्रतिवचनम्।", "padacchedaText": "", "audioFile": "PB_001013.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001014", "originalText": "एतत् निरूप्यम्— किं अनेन आत्मवित्कर्तृकयोः संन्यासकर्मयोगयोः निःश्रेयसकरत्वं प्रयोजनम् उक्त्वा तयोरेव कुतश्चित् विशेषात् कर्मसंन्यासात् कर्मयोगस्य विशिष्टत्वम् उच्यते? आहोस्वित् अनात्मवित्कर्तृकयोः संन्यासकर्मयोगयोः तदुभयम् उच्यते? इति।", "padacchedaText": "", "audioFile": "PB_001014.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001015", "originalText": "किञ्चातः— यदि आत्मवित्कर्तृकयोः कर्मसंन्यासकर्मयोगयोः निःश्रेयसकरत्वम्, तयोस्तु कर्मसंन्यासात् कर्मयोगस्य विशिष्टत्वम् उच्यते, यदि वा अनात्मवित्कर्तृकयोः संन्यासकर्मयोगयोः तदुभयम् उच्यते इति।", "padacchedaText": "", "audioFile": "PB_001015.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001016", "originalText": "अत्र उच्यते— आत्मवित्कर्तृकयोः संन्यासकर्मयोगयोः असम्भवात् तयोः निःश्रेयसकरत्ववचनं तदीयाच्च कर्मसंन्यासात् कर्मयोगस्य विशिष्टत्वाभिधानम् इत्येतत् उभयम् अनुपपन्नम्।", "padacchedaText": "", "audioFile": "PB_001016.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001017", "originalText": "यदि अनात्मविदः कर्मसंन्यासः तत्प्रतिकूलश्च कर्मानुष्ठानलक्षणः कर्मयोगः सम्भवेताम्, तदा तयोः निःश्रेयसकरत्वोक्तिः कर्मयोगस्य च कर्मसंन्यासात् विशिष्टत्वाभिधानम् इत्येतत् उभयम् उपपद्येत।", "padacchedaText": "", "audioFile": "PB_001017.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001018", "originalText": "आत्मविदस्तु संन्यासकर्मयोगयोः असम्भवात् तयोः निःश्रेयसकरत्वाभिधानं कर्मसंन्यासाच्च कर्मयोगः विशिष्यते इति च अनुपपन्नम्॥", "padacchedaText": "", "audioFile": "PB_001018.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001019", "originalText": "अत्र आह— किम् आत्मविदः संन्यासकर्मयोगयोः उभयोरपि असम्भवः? आहोस्वित् अन्यतरस्य असम्भवः? यदा च अन्यतरस्य असम्भवः, तदा किं कर्मसंन्यासस्य, उत कर्मयोगस्य? इति, असम्भवे कारणं च वक्तव्यम् इति।", "padacchedaText": "", "audioFile": "PB_001019.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001020", "originalText": "अत्र उच्यते— आत्मविदः निवृत्तमिथ्याज्ञानत्वात् विपर्ययज्ञानमूलस्य कर्मयोगस्य असम्भवः स्यात्।", "padacchedaText": "", "audioFile": "PB_001020.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001021", "originalText": "जन्मादिसर्वविक्रियारहितत्वेन निष्क्रियम् आत्मानम् आत्मत्वेन यो वेत्ति तस्य आत्मविदः सम्यग्दर्शनेन अपास्तमिथ्याज्ञानस्य निष्क्रियात्मस्वरूपावस्थानलक्षणं सर्वकर्मसंन्यासम् उक्त्वा तद्विपरीतस्य मिथ्याज्ञानमूलकर्तृत्वाभिमानपुरःसरस्य सक्रियात्मस्वरूपावस्थानरूपस्य कर्मयोगस्य इह गीताशास्त्रे तत्र तत्र आत्मस्वरूपनिरूपणप्रदेशेषु सम्यग्ज्ञानमिथ्याज्ञानतत्कार्यविरोधात् अभावः प्रतिपाद्यते यस्मात्, तस्मात् आत्मविदः निवृत्तमिथ्याज्ञानस्य विपर्ययज्ञानमूलः कर्मयोगो न सम्भवतीति युक्तम् उक्तं स्यात्॥", "padacchedaText": "", "audioFile": "PB_001021.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001022", "originalText": "केषु केषु पुनः आत्मस्वरूपनिरूपणप्रदेशेषु आत्मविदः कर्माभावः प्रतिपाद्यते इति अत्र उच्यते— ‘अविनाशि तु तत्’ (भ.गी.२.१७) इति प्रकृत्य ‘य एनं वेत्ति हन्तारम्’ (भ.गी.२.१९) ‘वेदाविनाशिनं नित्यम्’ (भ.गी.२.२१) इत्यादौ तत्र तत्र आत्मविदः कर्माभावः उच्यते॥", "padacchedaText": "", "audioFile": "PB_001022.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001023", "originalText": "ननु च कर्मयोगोऽपि आत्मस्वरूपनिरूपणप्रदेशेषु तत्र तत्र प्रतिपाद्यते एव, तद्यथा— ‘तस्माद्युध्यस्व भारत’ (भ.गी.२.१८) ‘स्वधर्ममपि चावेक्ष्य’ (भ.गी.२.३१) ‘कर्मण्येवाधिकारस्ते’ (भ.गी.२.४७) इत्यादौ।", "padacchedaText": "", "audioFile": "PB_001023.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001024", "originalText": "अतश्च कथम् आत्मविदः कर्मयोगस्य असम्भवः स्यादिति? अत्र उच्यते— सम्यग्ज्ञानमिथ्याज्ञानतत्कार्यविरोधात्, ‘ज्ञानयोगेन साङ्ख्यानाम्’ (भ.गी.३.३) इत्यनेन साङ्ख्यानाम् आत्मतत्त्वविदाम् अनात्मवित्कर्तृककर्मयोगनिष्ठातः निष्क्रियात्मस्वरूपावस्थानलक्षणायाः ज्ञानयोगनिष्ठायाः पृथक्करणात्, कृतकृत्यत्वेन आत्मविदः प्रयोजनान्तराभावात्, ‘तस्य कार्यं न विद्यते’ (भ.गी.३.१७) इति कर्तव्यान्तराभाववचनाच्च, ‘न कर्मणामनारम्भात्’ (भ.गी.३.४) ‘संन्यासस्तु महाबाहो दुःखमाप्तुमयोगतः’ (भ.गी.५.६) इत्यादिना च आत्मज्ञानाङ्गत्वेन कर्मयोगस्य विधानात्, ‘योगारूढस्य तस्यैव शमः कारणमुच्यते’ (भ.गी.६.३) इत्यनेन च उत्पन्नसम्यग्दर्शनस्य कर्मयोगाभाववचनात्, ‘शारीरं केवलं कर्म कुर्वन्नाप्नोति किल्बिषम्’ (भ.गी.४.२१) इति च शरीरस्थितिकारणातिरिक्तस्य कर्मणो निवारणात्, ‘नैव किञ्चित्करोमीति युक्तो मन्येत तत्त्ववित्’ (भ.गी.५.८) इत्यनेन च शरीरस्थितिमात्रप्रयुक्तेष्वपि दर्शनश्रवणादिकर्मसु आत्मयाथात्म्यविदः ‘करोमि’ इति प्रत्ययस्य समाहितचेतस्तया सदा अकर्तव्यत्वोपदेशात् आत्मतत्त्वविदः सम्यग्दर्शनविरुद्धो मिथ्याज्ञानहेतुकः कर्मयोगः स्वप्नेऽपि न सम्भावयितुं शक्यते यस्मात्, तस्मात् अनात्मवित्कर्तृकयोरेव संन्यासकर्मयोगयोः निःश्रेयसकरत्ववचनम्, तदीयाच्च कर्मसंन्यासात् पूर्वोक्तात्मवित्कर्तृकसर्वकर्मसंन्यासविलक्षणात् सत्येव कर्तृत्वविज्ञाने कर्मैकदेशविषयात् यमनियमादिसहितत्वेन च दुरनुष्ठेयात् सुकरत्वेन च कर्मयोगस्य विशिष्टत्वाभिधानम् इत्येवं प्रतिवचनवाक्यार्थनिरूपणेनापि पूर्वोक्तः प्रष्टुरभिप्रायः निश्चीयते इति स्थितम्॥", "padacchedaText": "", "audioFile": "PB_001024.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001025", "originalText": "‘ज्यायसी चेत्कर्मणस्ते’ (भ.गी.३.१) इत्यत्र ज्ञानकर्मणोः सह असम्भवे ‘यच्छ्रेय एतयोः तद्ब्रूहि’ (भ.गी.३.२) इत्येवं पृष्टोऽर्जुनेन भगवान् साङ्‍ख्यानां संन्यासिनां ज्ञानयोगेन निष्ठा पुनः कर्मयोगेन योगिनां निष्ठा प्रोक्तेति निर्णयं चकार।", "padacchedaText": "", "audioFile": "PB_001025.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001026", "originalText": "‘न च संन्यसनादेव केवलात् सिद्धिं समधिगच्छति’ (भ.गी.३.४) इति वचनात् ज्ञानसहितस्य सिद्धिसाधनत्वम् इष्टम्’ कर्मयोगस्य च, विधानात्।", "padacchedaText": "", "audioFile": "PB_001026.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001027", "originalText": "ज्ञानरहितस्य संन्यासः श्रेयान्, किं वा कर्मयोगः श्रेयान्? ’ इति एतयोः विशेषबुभुत्सया—\nअर्जुन उवाच—\nसंन्यासं कर्मणां कृष्ण पुनर्योगं च शंससि। यच्छ्रेय एतयोरेकं तन्मे ब्रूहि सुनिश्चितम्॥ १॥", "padacchedaText": "", "audioFile": "PB_001027.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001028", "originalText": "संन्यासं परित्यागं कर्मणां शास्त्रीयाणाम् अनुष्ठेयविशेषाणां शंससि प्रशंससि कथयसि इत्येतत्।", "padacchedaText": "", "audioFile": "PB_001028.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001029", "originalText": "पुनः योगं च तेषामेव अनुष्ठानम् अवश्यकर्तव्यं शंससि।", "padacchedaText": "", "audioFile": "PB_001029.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001030", "originalText": "अतः मे कतरत् श्रेयः इति संशयः— किं कर्मानुष्ठानं श्रेयः, किं वा तद्धानम् इति।", "padacchedaText": "", "audioFile": "PB_001030.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001031", "originalText": "प्रशस्यतरं च अनुष्ठेयम्।", "padacchedaText": "", "audioFile": "PB_001031.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001032", "originalText": "अतश्च यत् श्रेयः प्रशस्यतरम् एतयोः कर्मसंन्यासकर्मयोगयोः यदनुष्ठानात् श्रेयोवाप्तिः मम स्यादिति मन्यसे, तत् एकम् अन्यतरम् सह एकपुरुषानुष्ठेयत्वासम्भवात् मे ब्रूहि सुनिश्चितम् अभिप्रेतं तवेति॥ १॥", "padacchedaText": "", "audioFile": "PB_001032.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001033", "originalText": "स्वाभिप्रायम् आचक्षाणो निर्णयाय श्रीभगवानुवाच—\nश्रीभगवानुवाच—\nसंन्यासः कर्मयोगश्च निःश्रेयसकरावुभौ। तयोस्तु कर्मसंन्यासात्कर्मयोगो विशिष्यते॥ २॥", "padacchedaText": "", "audioFile": "PB_001033.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001034", "originalText": "संन्यासः कर्मणां परित्यागः कर्मयोगश्च तेषामनुष्ठानं तौ उभौ अपि निःश्रेयसकरौ मोक्षं कुर्वाते ज्ञानोत्पत्तिहेतुत्वेन। उभौ यद्यपि निःश्रेयसकरौ, तथापि तयोस्तु निःश्रेयसहेत्वोः कर्मसंन्यासात् केवलात् कर्मयोगो विशिष्यते इति कर्मयोगं स्तौति॥ २॥", "padacchedaText": "", "audioFile": "PB_001034.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001035", "originalText": "कस्मात् इति आह—\nज्ञेयः स नित्यसंन्यासी यो न द्वेष्टि न काङ्क्षति। निर्द्वन्द्वो हि महाबाहो सुखं बन्धात्प्रमुच्यते॥ ३॥", "padacchedaText": "", "audioFile": "PB_001035.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001036", "originalText": "ज्ञेयः ज्ञातव्यः स कर्मयोगी नित्यसंन्यासी इति यो न द्वेष्टि किञ्चित् न काङ्क्षति दुःखसुखे तत्साधने च।", "padacchedaText": "", "audioFile": "PB_001036.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001037", "originalText": "एवंविधो यः, कर्मणि वर्तमानोऽपि स नित्यसंन्यासी इति ज्ञातव्यः इत्यर्थः। निर्द्वन्द्वः द्वन्द्ववर्जितः हि यस्मात् महाबाहो सुखं बन्धात् अनायासेन प्रमुच्यते॥ ३॥", "padacchedaText": "", "audioFile": "PB_001037.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001038", "originalText": "संन्यासकर्मयोगयोः भिन्नपुरुषानुष्ठेययोः विरुद्धयोः फलेऽपि विरोधो युक्तः, न तु उभयोः निःश्रेयसकरत्वमेव इति प्राप्ते इदम् उच्यते—\nसाङ्‍ख्ययोगौ पृथग्बालाः प्रवदन्ति न पण्डिताः।", "padacchedaText": "", "audioFile": "PB_001038.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001039", "originalText": "एकमप्यास्थितः सम्यगुभयोर्विन्दते फलम्॥ ४॥", "padacchedaText": "", "audioFile": "PB_001039.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001040", "originalText": "साङ्‍ख्ययोगौ पृथक् विरुद्धभिन्नफलौ बालाः प्रवदन्ति न पण्डिताः।", "padacchedaText": "", "audioFile": "PB_001040.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001041", "originalText": "पण्डितास्तु ज्ञानिन एकं फलम् अविरुद्धम् इच्छन्ति।", "padacchedaText": "", "audioFile": "PB_001041.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001042", "originalText": "कथम्? एकमपि साङ्ख्ययोगयोः सम्यक् आस्थितः सम्यगनुष्ठितवान् इत्यर्थः, उभयोः विन्दते फलम्। उभयोः तदेव हि निःश्रेयसं फलम्, अतः न फले विरोधः अस्ति॥", "padacchedaText": "", "audioFile": "PB_001042.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001043", "originalText": "ननु संन्यासकर्मयोगशब्देन प्रस्तुत्य साङ्‍ख्ययोगयोः फलैकत्वं कथम् इह अप्रकृतं ब्रवीति? नैष दोषः— यद्यपि अर्जुनेन संन्यासं कर्मयोगं च केवलम् अभिप्रेत्य प्रश्नः कृतः, भगवांस्तु तदपरित्यागेनैव स्वाभिप्रेतं च विशेषं संयोज्य शब्दान्तरवाच्यतया प्रतिवचनं ददौ ‘साङ्‍ख्ययोगौ’ इति।", "padacchedaText": "", "audioFile": "PB_001043.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001044", "originalText": "तौ एव संन्यासकर्मयोगौ ज्ञानतदुपायसमबुद्धित्वादिसंयुक्तौ साङ्‍ख्ययोगशब्दवाच्यौ इति भगवतो मतम्। अतः न अप्रकृतप्रक्रियेति॥ ४॥", "padacchedaText": "", "audioFile": "PB_001044.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001045", "originalText": "एकस्यापि सम्यगनुष्ठानात् कथम् उभयोः फलं विन्दते इति उच्यते—\nयत्साङ्‍ख्यैः प्राप्यते स्थानं तद्योगैरपि गम्यते। एकं साङ्‍ख्यं च योगं च यः पश्यति स पश्यति॥ ५॥", "padacchedaText": "", "audioFile": "PB_001045.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001046", "originalText": "यत् साङ्ख्यैः ज्ञाननिष्ठैः संन्यासिभिः प्राप्यते स्थानं मोक्षाख्यम्, तत् योगैरपि ज्ञानप्राप्त्युपायत्वेन ईश्वरे समर्प्य कर्माणि आत्मनः फलम् अनभिसन्धाय अनुतिष्ठन्ति ये ते योगाः योगिनः तैरपि परमार्थज्ञानसंन्यासप्राप्तिद्वारेण गम्यते इत्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_001046.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001047", "originalText": "अतः एकं साङ्‍ख्यं च योगं च यः पश्यति फलैकत्वात् स पश्यति सम्यक् पश्यतीत्यर्थः—॥ ५॥", "padacchedaText": "", "audioFile": "PB_001047.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001048", "originalText": "एवं तर्हि योगात् संन्यास एव विशिष्यते, कथं तर्हि इदमुक्तम् ‘तयोस्तु कर्मसंन्यासात् कर्मयोगो विशिष्यते’ (भ.गी.५.२) इति? शृणु तत्र कारणम्— त्वया पृष्टं केवलं कर्मसंन्यासं कर्मयोगं च अभिप्रेत्य तयोः अन्यतरः कः श्रेयान् इति।", "padacchedaText": "", "audioFile": "PB_001048.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001049", "originalText": "तदनुरूपं प्रतिवचनं मया उक्तं कर्मसंन्यासात् कर्मयोगः विशिष्यते इति ज्ञानम् अनपेक्ष्य।", "padacchedaText": "", "audioFile": "PB_001049.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001050", "originalText": "ज्ञानापेक्षस्तु संन्यासः साङ्‍ख्यमिति मया अभिप्रेतः।", "padacchedaText": "", "audioFile": "PB_001050.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001051", "originalText": "परमार्थयोगश्च स एव।", "padacchedaText": "", "audioFile": "PB_001051.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001052", "originalText": "यस्तु कर्मयोगः वैदिकः स च तादर्थ्यात् योगः संन्यास इति च उपचर्यते।", "padacchedaText": "", "audioFile": "PB_001052.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001053", "originalText": "कथं तादर्थ्यम् इति उच्यते\nसंन्यासस्तु महाबाहो दुःखमाप्तुमयोगतः। योगयुक्तो मुनिर्ब्रह्म नचिरेणाधिगच्छति॥ ६॥", "padacchedaText": "", "audioFile": "PB_001053.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001054", "originalText": "संन्यासस्तु पारमार्थिकः हे महाबाहो दुःखम् आप्तुं प्राप्तुम् अयोगतः योगेन विना।", "padacchedaText": "", "audioFile": "PB_001054.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001055", "originalText": "योगयुक्तः वैदिकेन कर्मयोगेन ईश्वरसमर्पितरूपेण फलनिरपेक्षेण युक्तः, मुनिः मननात् ईश्वरस्वरूपस्य मुनिः, ब्रह्म— परमात्मज्ञाननिष्ठालक्षणत्वात् प्रकृतः संन्यासः ब्रह्म उच्यते, ‘न्यास इति ब्रह्मा ब्रह्मा हि परः’ (तै.ना.७८) इति श्रुतेः— ब्रह्म परमार्थसंन्यासं परमार्थज्ञाननिष्ठालक्षणं नचिरेण क्षिप्रमेव अधिगच्छति प्राप्नोति।", "padacchedaText": "", "audioFile": "PB_001055.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001056", "originalText": "अतः मया उक्तम् ‘कर्मयोगो विशिष्यते’ (भ.गी.५.२) इति॥ ६॥", "padacchedaText": "", "audioFile": "PB_001056.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001057", "originalText": "यदा पुनः अयं सम्यग्ज्ञानप्राप्त्युपायत्वेन—\nयोगयुक्तो विशुद्धात्मा\nविजितात्मा जितेन्द्रियः। सर्वभूतात्मभूतात्मा\nकुर्वन्नपि न लिप्यते॥ ७॥", "padacchedaText": "", "audioFile": "PB_001057.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001058", "originalText": "योगेन युक्तः योगयुक्तः, विशुद्धात्मा विशुद्धसत्त्वः, विजितात्मा विजितदेहः, जितेन्द्रियश्च, सर्वभूतात्मभूतात्मा सर्वेषां ब्रह्मादीनां स्तम्बपर्यन्तानां भूतानाम् आत्मभूतः आत्मा प्रत्यक्चेतनो यस्य सः सर्वभूतात्मभूतात्मा सम्यग्दर्शीत्यर्थः, स तत्रैवं वर्तमानः लोकसङ्ग्रहाय कर्म कुर्वन्नपि न लिप्यते न कर्मभिः बध्यते इत्यर्थः॥ ७॥", "padacchedaText": "", "audioFile": "PB_001058.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001059", "originalText": "न च असौ परमार्थतः करोतीत्यतः—\nनैव किञ्चित्करोमीति युक्तो मन्येत तत्त्ववित्। पश्यञ्शृण्वन्स्पृशञ्जिघ्रन्नश्नन्गच्छन्स्वपञ्श्वसन्॥ ८॥", "padacchedaText": "", "audioFile": "PB_001059.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001060", "originalText": "प्रलपन् विसृजन्गृह्णन्नुन्मिषन्निमिषन्नपि। इन्द्रियाणीन्द्रियार्थेषु वर्तन्त इति धारयन्॥ ९॥", "padacchedaText": "", "audioFile": "PB_001060.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001061", "originalText": "नैव किञ्चित् करोमीति युक्तः समाहितः सन् मन्येत चिन्तयेत्, तत्त्ववित् आत्मनो याथात्म्यं तत्त्वं वेत्तीति तत्त्ववित् परमार्थदर्शीत्यर्थः॥", "padacchedaText": "", "audioFile": "PB_001061.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001062", "originalText": "कदा कथं वा तत्त्वमवधारयन् मन्येत इति, उच्यते— पश्यन्निति।", "padacchedaText": "", "audioFile": "PB_001062.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001063", "originalText": "मन्येत इति पूर्वेण सम्बन्धः।", "padacchedaText": "", "audioFile": "PB_001063.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001064", "originalText": "यस्य एवं तत्त्वविदः सर्वकार्यकरणचेष्टासु कर्मसु अकर्मैव, पश्यतः सम्यग्दर्शिनः तस्य सर्वकर्मसंन्यासे एव अधिकारः, कर्मणः अभावदर्शनात्। न हि मृगतृष्णिकायाम् उदकबुद्ध्या पानाय प्रवृत्तः उदकाभावज्ञानेऽपि तत्रैव पानप्रयोजनाय प्रवर्तते॥ ९॥", "padacchedaText": "", "audioFile": "PB_001064.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001065", "originalText": "यस्तु पुनः अतत्त्ववित् प्रवृत्तश्च कर्मयोगे—\nब्रह्मण्याधाय कर्माणि सङ्गं त्यक्त्वा करोति यः। लिप्यते न स पापेन पद्मपत्रमिवाम्भसा॥ १०॥", "padacchedaText": "", "audioFile": "PB_001065.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001066", "originalText": "ब्रह्मणि ईश्वरे आधाय निक्षिप्य ‘तदर्थं कर्म करोमि’ इति भृत्य इव स्वाम्यर्थं सर्वाणि कर्माणि मोक्षेऽपि फले सङ्गं त्यक्त्वा करोति यः सर्वकर्माणि, लिप्यते न स पापेन न सम्बध्यते पद्मपत्रमिव अम्भसा उदकेन।", "padacchedaText": "", "audioFile": "PB_001066.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001067", "originalText": "केवलं सत्त्वशुद्धिमात्रमेव फलं तस्य कर्मणः स्यात्॥ १०॥", "padacchedaText": "", "audioFile": "PB_001067.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001068", "originalText": "यस्मात्—\nकायेन मनसा बुद्ध्या केवलैरिन्द्रियैरपि। योगिनः कर्म कुर्वन्ति सङ्गं त्यक्त्वात्मशुद्धये॥ ११॥", "padacchedaText": "", "audioFile": "PB_001068.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001069", "originalText": "कायेन देहेन मनसा बुद्ध्या च केवलैः ममत्ववर्जितैः ‘ईश्वरायैव कर्म करोमि, न मम फलाय’ इति ममत्वबुद्धिशून्यैः इन्द्रियैरपि— केवलशब्दः कायादिभिरपि प्रत्येकं सम्बध्यते— सर्वव्यापारेषु ममतावर्जनाय।", "padacchedaText": "", "audioFile": "PB_001069.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001070", "originalText": "योगिनः कर्मिणः कर्म कुर्वन्ति सङ्गं त्यक्त्वा फलविषयम् आत्मशुद्धये सत्त्वशुद्धये इत्यर्थः। तस्मात् तत्रैव तव अधिकारः इति कुरु कर्मैव॥ ११॥", "padacchedaText": "", "audioFile": "PB_001070.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001071", "originalText": "यस्माच्च—\nयुक्तः कर्मफलं त्यक्त्वा\nशान्तिमाप्नोति नैष्ठिकीम्। अयुक्तः कामकारेण\nफले सक्तो निबध्यते॥ १२॥", "padacchedaText": "", "audioFile": "PB_001071.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001072", "originalText": "युक्तः ‘ईश्वराय कर्माणि करोमि न मम फलाय’ इत्येवं समाहितः सन् कर्मफलं त्यक्त्वा परित्यज्य शान्तिं मोक्षाख्याम् आप्नोति नैष्ठिकीं निष्ठायां भवां सत्त्वशुद्धिज्ञानप्राप्तिसर्वकर्मसंन्यासज्ञाननिष्ठाक्रमेणेति वाक्यशेषः।", "padacchedaText": "", "audioFile": "PB_001072.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001073", "originalText": "यस्तु पुनः अयुक्तः असमाहितः कामकारेण करणं कारः कामस्य कारः कामकारः तेन कामकारेण, कामप्रेरिततयेत्यर्थः, ‘मम फलाय इदं करोमि कर्म’ इत्येवं फले सक्तः निबध्यते।", "padacchedaText": "", "audioFile": "PB_001073.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001074", "originalText": "अतः त्वं युक्तो भव इत्यर्थः॥ १२॥", "padacchedaText": "", "audioFile": "PB_001074.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001075", "originalText": "यस्तु परमार्थदर्शी सः—\nसर्वकर्माणि मनसा संन्यस्यास्ते सुखं वशी। नवद्वारे पुरे देही नैव कुर्वन्न कारयन्॥ १३॥", "padacchedaText": "", "audioFile": "PB_001075.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001076", "originalText": "सर्वाणि कर्माणि सर्वकर्माणि संन्यस्य परित्यज्य नित्यं नैमित्तिकं काम्यं प्रतिषिद्धं च तानि सर्वाणि कर्माणि मनसा विवेकबुद्ध्या, कर्मादौ अकर्मसन्दर्शनेन सन्त्यज्येत्यर्थः, आस्ते तिष्ठति सुखम्।", "padacchedaText": "", "audioFile": "PB_001076.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001077", "originalText": "त्यक्तवाङ्मनःकायचेष्टः निरायासः प्रसन्नचित्तः आत्मनः अन्यत्र निवृत्तसर्वबाह्यप्रयोजनः इति ‘सुखम् आस्ते’ इत्युच्यते।", "padacchedaText": "", "audioFile": "PB_001077.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001078", "originalText": "वशी जितेन्द्रिय इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001078.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001079", "originalText": "क्व कथम् आस्ते इति, आह— नवद्वारे पुरे।", "padacchedaText": "", "audioFile": "PB_001079.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001080", "originalText": "सप्त शीर्षण्यानि आत्मन उपलब्धिद्वाराणि, अवाक् द्वे मूत्रपुरीषविसर्गार्थे, तैः द्वारैः नवद्वारं पुरम् उच्यते शरीरम्, पुरमिव पुरम्, आत्मैकस्वामिकम्, तदर्थप्रयोजनैश्च इन्द्रियमनोबुद्धिविषयैः अनेकफलविज्ञानस्य उत्पादकैः पौरैरिव अधिष्ठितम्।", "padacchedaText": "", "audioFile": "PB_001080.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001081", "originalText": "तस्मिन् नवद्वारे पुरे देही सर्वं कर्म संन्यस्य आस्ते, किं विशेषणेन? सर्वो हि देही संन्यासी असंन्यासी वा देहे एव आस्ते, तत्र अनर्थकं विशेषणमिति।", "padacchedaText": "", "audioFile": "PB_001081.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001082", "originalText": "उच्यते— यस्तु अज्ञः देही देहेन्द्रियसङ्घातमात्रात्मदर्शी स सर्वोऽपि ‘गेहे भूमौ आसने वा आसे’ इति मन्यते।", "padacchedaText": "", "audioFile": "PB_001082.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001083", "originalText": "न हि देहमात्रात्मदर्शिनः गेहे इव देहे आसे इति प्रत्ययः सम्भवति।", "padacchedaText": "", "audioFile": "PB_001083.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001084", "originalText": "देहादिसङ्घातव्यतिरिक्तात्मदर्शिनस्तु ‘देहे आसे’ इति प्रत्ययः उपपद्यते।", "padacchedaText": "", "audioFile": "PB_001084.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001085", "originalText": "परकर्मणां च परस्मिन् आत्मनि अविद्यया अध्यारोपितानां विद्यया विवेकज्ञानेन मनसा संन्यास उपपद्यते।", "padacchedaText": "", "audioFile": "PB_001085.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001086", "originalText": "उत्पन्नविवेकज्ञानस्य सर्वकर्मसंन्यासिनोऽपि गेहे इव देहे एव नवद्वारे पुरे आसनम् प्रारब्धफलकर्मसंस्कारशेषानुवृत्त्या देह एव विशेषविज्ञानोत्पत्तेः। देहे एव आस्ते इति अस्त्येव विशेषणफलम्, विद्वदविद्वत्प्रत्ययभेदापेक्षत्वात्॥", "padacchedaText": "", "audioFile": "PB_001086.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001087", "originalText": "यद्यपि कार्यकरणकर्माणि अविद्यया आत्मनि अध्यारोपितानि ‘संन्यस्यास्ते’ इत्युक्तम्, तथापि आत्मसमवायि तु कर्तृत्वं कारयितृत्वं च स्यात् इति आशङ्क्य आह— नैव कुर्वन् स्वयम्, न च कार्यकरणानि कारयन् क्रियासु प्रवर्तयन्।", "padacchedaText": "", "audioFile": "PB_001087.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001088", "originalText": "किं यत् तत् कर्तृत्वं कारयितृत्वं च देहिनः स्वात्मसमवायि सत् संन्यासात् न सम्भवति, यथा गच्छतो गतिः गमनव्यापारपरित्यागे न स्यात् तद्वत्? किं वा स्वत एव आत्मनः न अस्ति इति? अत्र उच्यते— न अस्ति आत्मनः स्वतः कर्तृत्वं कारयितृत्वं च।", "padacchedaText": "", "audioFile": "PB_001088.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001089", "originalText": "उक्तं हि ‘अविकार्योऽयमुच्यते’ (भ.गी.२.२५) ‘शरीरस्थोऽपि न करोति न लिप्यते’ (भ.गी.१३.३१) इति। ‘ध्यायतीव लेलायतीव’ (बृ.४.३.७) इति श्रुतेः॥ १३॥", "padacchedaText": "", "audioFile": "PB_001089.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001090", "originalText": "किञ्च—\nन कर्तृत्वं न कर्माणि लोकस्य सृजति प्रभुः। न कर्मफलसंयोगं स्वभावस्तु प्रवर्तते॥ १४॥", "padacchedaText": "", "audioFile": "PB_001090.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001091", "originalText": "न कर्तृत्वं स्वतः कुरु इति नापि कर्माणि रथघटप्रासादादीनि ईप्सिततमानि लोकस्य सृजति उत्पादयति प्रभुः आत्मा।", "padacchedaText": "", "audioFile": "PB_001091.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001092", "originalText": "नापि रथादि कृतवतः तत्फलेन संयोगं न कर्मफलसंयोगम्।", "padacchedaText": "", "audioFile": "PB_001092.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001093", "originalText": "यदि किञ्चिदपि स्वतः न करोति न कारयति च देही, कः तर्हि कुर्वन् कारयंश्च प्रवर्तते इति, उच्यते— स्वभावस्तु स्वो भावः स्वभावः अविद्यालक्षणा प्रकृतिः माया प्रवर्तते ‘दैवी हि’ (भ.गी.७.१४) इत्यादिना वक्ष्यमाणा॥ १४॥", "padacchedaText": "", "audioFile": "PB_001093.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001094", "originalText": "परमार्थतस्तु—\nनादत्ते कस्यचित्पापं न चैव सुकृतं विभुः। अज्ञानेनावृतं ज्ञानं तेन मुह्यन्ति जन्तवः॥ १५॥", "padacchedaText": "", "audioFile": "PB_001094.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001095", "originalText": "न आदत्ते न च गृह्णाति भक्तस्यापि कस्यचित् पापम्।", "padacchedaText": "", "audioFile": "PB_001095.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001096", "originalText": "न चैव आदत्ते सुकृतं भक्तैः प्रयुक्तं विभुः।", "padacchedaText": "", "audioFile": "PB_001096.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001097", "originalText": "किमर्थं तर्हि भक्तैः पूजादिलक्षणं यागदानहोमादिकं च सुकृतं प्रयुज्यते इत्याह— अज्ञानेन आवृतं ज्ञानं विवेकविज्ञानम्, तेन मुह्यन्ति ‘करोमि कारयामि भोक्ष्ये भोजयामि’ इत्येवं मोहं गच्छन्ति अविवेकिनः संसारिणो जन्तवः॥ १५॥", "padacchedaText": "", "audioFile": "PB_001097.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001098", "originalText": "ज्ञानेन तु तदज्ञानं येषां नाशितमात्मनः। तेषामादित्यवज्ज्ञानं प्रकाशयति तत्परम्॥ १६॥", "padacchedaText": "", "audioFile": "PB_001098.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001099", "originalText": "ज्ञानेन तु येन अज्ञानेन आवृताः मुह्यन्ति जन्तवः तत् अज्ञानं येषां जन्तूनां विवेकज्ञानेन आत्मविषयेण नाशितम् आत्मनः भवति, तेषां जन्तूनाम् आदित्यवत् यथा आदित्यः समस्तं रूपजातम् अवभासयति तद्वत् ज्ञानं ज्ञेयं वस्तु सर्वं प्रकाशयति तत् परं परमार्थतत्त्वम्॥ १६॥", "padacchedaText": "", "audioFile": "PB_001099.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001100", "originalText": "यत् परं ज्ञानं प्रकाशितम्—\nतद्बुद्धयस्तदात्मानस्तन्निष्ठास्तत्परायणाः। गच्छन्त्यपुनरावृत्तिं ज्ञाननिर्धूतकल्मषाः॥ १७॥", "padacchedaText": "", "audioFile": "PB_001100.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001101", "originalText": "तस्मिन् ब्रह्मणि गता बुद्धिः येषां ते तद्बुद्धयः, तदात्मानः तदेव परं ब्रह्म आत्मा येषां ते तदात्मानः, तन्निष्ठाः निष्ठा अभिनिवेशः तात्पर्यं सर्वाणि कर्माणि संन्यस्य तस्मिन् ब्रह्मण्येव अवस्थानं येषां ते तन्निष्ठाः, तत्परायणाश्च तदेव परम् अयनं परा गतिः येषां भवति ते तत्परायणाः केवलात्मरतय इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001101.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001102", "originalText": "येषां ज्ञानेन नाशितम् आत्मनः अज्ञानं ते गच्छन्ति एवंविधाः अपुनरावृत्तिम् अपुनर्देहसम्बन्धं ज्ञाननिर्धूतकल्मषाः यथोक्तेन ज्ञानेन निर्धूतः नाशितः कल्मषः पापादिसंसारकारणदोषः येषां ते ज्ञाननिर्धूतकल्मषाः यतयः इत्यर्थः॥ १७॥", "padacchedaText": "", "audioFile": "PB_001102.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001103", "originalText": "येषां ज्ञानेन नाशितम् आत्मनः अज्ञानं ते पण्डिताः कथं तत्त्वं पश्यन्ति इत्युच्यते—\nविद्याविनयसम्पन्ने ब्राह्मणे गवि हस्तिनि। शुनि चैव श्वपाके च पण्डिताः समदर्शिनः॥ १८॥", "padacchedaText": "", "audioFile": "PB_001103.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001104", "originalText": "विद्याविनयसम्पन्ने विद्या च विनयश्च विद्याविनयौ, विनयः उपशमः, ताभ्यां विद्याविनयाभ्यां सम्पन्नः विद्याविनयसम्पन्नः विद्वान् विनीतश्च यो ब्राह्मणः तस्मिन् ब्राह्मणे गवि हस्तिनि शुनि चैव श्वपाके च पण्डिताः समदर्शिनः।", "padacchedaText": "", "audioFile": "PB_001104.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001105", "originalText": "विद्याविनयसम्पन्ने उत्तमसंस्कारवति ब्राह्मणे सात्त्विके, मध्यमायां च राजस्यां गवि, संस्कारहीनायां अत्यन्तमेव केवलतामसे हस्त्यादौ च, सत्त्वादिगुणैः तज्जैश्च संस्कारैः तथा राजसैः तथा तामसैश्च संस्कारैः अत्यन्तमेव अस्पृष्टं समम् एकम् अविक्रियं तत् ब्रह्म द्रष्टुं शीलं येषां ते पण्डिताः समदर्शिनः॥ १८॥", "padacchedaText": "", "audioFile": "PB_001105.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001106", "originalText": "ननु अभोज्यान्नाः ते दोषवन्तः, ‘समासमाभ्यां विषमसमे पूजातः’ (गौ.ध.२.८.२०,१७.१८) इति स्मृतेः।", "padacchedaText": "", "audioFile": "PB_001106.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001107", "originalText": "न ते दोषवन्तः।", "padacchedaText": "", "audioFile": "PB_001107.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001108", "originalText": "कथम्?—\nइहैव तैर्जितः सर्गो येषां साम्ये स्थितं मनः। निर्दोषं हि समं ब्रह्म तस्माद्ब्रह्मणि ते स्थिताः॥ १९॥", "padacchedaText": "", "audioFile": "PB_001108.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001109", "originalText": "इह एव जीवद्भिरेव तैः समदर्शिभिः पण्डितैः जितः वशीकृतः सर्गः जन्म, येषां साम्ये सर्वभूतेषु ब्रह्मणि समभावे स्थितं निश्चलीभूतं मनः अन्तःकरणम्।", "padacchedaText": "", "audioFile": "PB_001109.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001110", "originalText": "निर्दोषं यद्यपि दोषवत्सु श्वपाकादिषु मूढैः तद्दोषैः दोषवत् इव विभाव्यते, तथापि तद्दोषैः अस्पृष्टम् इति निर्दोषं दोषवर्जितं हि यस्मात्, नापि स्वगुणभेदभिन्नम्, निर्गुणत्वात् चैतन्यस्य।", "padacchedaText": "", "audioFile": "PB_001110.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001111", "originalText": "वक्ष्यति च भगवान् इच्छादीनां क्षेत्रधर्मत्वम्, ‘अनादित्वान्निर्गुणत्वात्’ (भ.गी.१३.३१) इति च।", "padacchedaText": "", "audioFile": "PB_001111.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001112", "originalText": "नापि अन्त्या विशेषाः आत्मनो भेदकाः सन्ति, प्रतिशरीरं तेषां सत्त्वे प्रमाणानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_001112.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001113", "originalText": "अतः समं ब्रह्म एकं च।", "padacchedaText": "", "audioFile": "PB_001113.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001114", "originalText": "तस्मात् ब्रह्मणि एव ते स्थिताः।", "padacchedaText": "", "audioFile": "PB_001114.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001115", "originalText": "तस्मात् न दोषगन्धमात्रमपि तान् स्पृशति, देहादिसङ्घातात्मदर्शनाभिमानाभावात् तेषाम्।", "padacchedaText": "", "audioFile": "PB_001115.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001116", "originalText": "देहादिसङ्घातात्मदर्शनाभिमानवद्विषयं तु तत् सूत्रम् ‘समासमाभ्यां विषमसमे पूजातः’ (गौ.ध.२.८.२०) इति, पूजाविषयत्वेन विशेषणात्।", "padacchedaText": "", "audioFile": "PB_001116.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001117", "originalText": "दृश्यते हि ब्रह्मवित् षडङ्गवित् चतुर्वेदवित् इति पूजादानादौ गुणविशेषसम्बन्धः कारणम्।", "padacchedaText": "", "audioFile": "PB_001117.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001118", "originalText": "ब्रह्म तु सर्वगुणदोषसम्बन्धवर्जितमित्यतः ‘ब्रह्मणि ते स्थिताः’ इति युक्तम्।", "padacchedaText": "", "audioFile": "PB_001118.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001119", "originalText": "कर्मविषयं च ‘समासमाभ्याम्’ (गौ.ध.२.८.२०) इत्यादि। इदं तु सर्वकर्मसंन्यासविषयं प्रस्तुतम्, ‘सर्वकर्माणि मनसा’ (भ.गी.५.१३) इत्यारभ्य अध्यायपरिसमाप्तेः॥ १९॥", "padacchedaText": "", "audioFile": "PB_001119.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001120", "originalText": "यस्मात् निर्दोषं समं ब्रह्म आत्मा, तस्मात्—\nन प्रहृष्येत्प्रियं प्राप्य नोद्विजेत्प्राप्य चाप्रियम्। स्थिरबुद्धिरसंमूढो ब्रह्मविद्ब्रह्मणि स्थितः॥ २०॥", "padacchedaText": "", "audioFile": "PB_001120.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001121", "originalText": "न प्रहृष्येत् प्रहर्षं न कुर्यात् प्रियम् इष्टं प्राप्य लब्ध्वा।", "padacchedaText": "", "audioFile": "PB_001121.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001122", "originalText": "न उद्विजेत् प्राप्य च अप्रियम् अनिष्टं लब्ध्वा।", "padacchedaText": "", "audioFile": "PB_001122.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001123", "originalText": "देहमात्रात्मदर्शिनां हि प्रियाप्रियप्राप्ती हर्षविषादौ कुर्वाते, न केवलात्मदर्शिनः, तस्य प्रियाप्रियप्राप्त्यसम्भवात्।", "padacchedaText": "", "audioFile": "PB_001123.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001124", "originalText": "किञ्च— ‘सर्वभूतेषु एकः समः निर्दोषः आत्मा’ इति स्थिरा निर्विचिकित्सा बुद्धिः यस्य सः स्थिरबुद्धिः असंमूढः संमोहवर्जितश्च स्यात् यथोक्तब्रह्मवित् ब्रह्मणि स्थितः, अकर्मकृत् सर्वकर्मसंन्यासी इत्यर्थः॥ २०॥", "padacchedaText": "", "audioFile": "PB_001124.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001125", "originalText": "किञ्च, ब्रह्मणि स्थितः—\nबाह्यस्पर्शेष्वसक्तात्मा\nविन्दत्यात्मनि यत्सुखम्। स ब्रह्मयोगयुक्तात्मा\nसुखमक्षयमश्नुते॥ २१॥", "padacchedaText": "", "audioFile": "PB_001125.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001126", "originalText": "बाह्यस्पर्शेषु बाह्याश्च ते स्पर्शाश्च बाह्यस्पर्शाः स्पृश्यन्ते इति स्पर्शाः शब्दादयो विषयाः तेषु बाह्यस्पर्शेषु, असक्तः आत्मा अन्तःकरणं यस्य सः अयम् असक्तात्मा विषयेषु प्रीतिवर्जितः सन् विन्दति लभते आत्मनि यत् सुखं तत् विन्दति इत्येतत्।", "padacchedaText": "", "audioFile": "PB_001126.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001127", "originalText": "स ब्रह्मयोगयुक्तात्मा ब्रह्मणि योगः समाधिः ब्रह्मयोगः तेन ब्रह्मयोगेन युक्तः समाहितः तस्मिन् व्यापृतः आत्मा अन्तःकरणं यस्य सः ब्रह्मयोगयुक्तात्मा, सुखम् अक्षयम् अश्नुते व्याप्नोति।", "padacchedaText": "", "audioFile": "PB_001127.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001128", "originalText": "तस्मात् बाह्यविषयप्रीतेः क्षणिकायाः इन्द्रियाणि निवर्तयेत् आत्मनि अक्षयसुखार्थी इत्यर्थः॥ २१॥", "padacchedaText": "", "audioFile": "PB_001128.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001129", "originalText": "इतश्च निवर्तयेत्—\nये हि संस्पर्शजा भोगा दुःखयोनय एव ते। आद्यन्तवन्तः कौन्तेय न तेषु रमते बुधः॥ २२॥", "padacchedaText": "", "audioFile": "PB_001129.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001130", "originalText": "ये हि यस्मात् संस्पर्शजाः विषयेन्द्रियसंस्पर्शेभ्यो जाताः भोगा भुक्तयः दुःखयोनय एव ते, अविद्याकृतत्वात्।", "padacchedaText": "", "audioFile": "PB_001130.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001131", "originalText": "दृश्यन्ते हि आध्यात्मिकादीनि दुःखानि तन्निमित्तान्येव।", "padacchedaText": "", "audioFile": "PB_001131.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001132", "originalText": "यथा इहलोके तथा परलोकेऽपि इति गम्यते एवशब्दात्।", "padacchedaText": "", "audioFile": "PB_001132.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001133", "originalText": "न संसारे सुखस्य गन्धमात्रमपि अस्ति इति बुद्ध्वा विषयमृगतृष्णिकाया इन्द्रियाणि निवर्तयेत्।", "padacchedaText": "", "audioFile": "PB_001133.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001134", "originalText": "न केवलं दुःखयोनय एव, आद्यन्तवन्तश्च, आदिः विषयेन्द्रियसंयोगो भोगानाम् अन्तश्च तद्वियोग एव, अतः आद्यन्तवन्तः अनित्याः, मध्यक्षणभावित्वात् इत्यर्थः। कौन्तेय, न तेषु भोगेषु रमते बुधः विवेकी अवगतपरमार्थतत्त्वः, अत्यन्तमूढानामेव हि विषयेषु रतिः दृश्यते, यथा पशुप्रभृतीनाम्॥ २२॥", "padacchedaText": "", "audioFile": "PB_001134.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001135", "originalText": "अयं च श्रेयोमार्गप्रतिपक्षी कष्टतमो दोषः सर्वानर्थप्राप्तिहेतुः दुर्निवारश्च इति तत्परिहारे यत्नाधिक्यं कर्तव्यम् इत्याह भगवान्—\nशक्नोतीहैव यः सोढुं प्राक्छरीरविमोक्षणात्।", "padacchedaText": "", "audioFile": "PB_001135.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001136", "originalText": "कामक्रोधोद्भवं वेगं स युक्तः स सुखी नरः॥ २३॥", "padacchedaText": "", "audioFile": "PB_001136.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001137", "originalText": "शक्नोति उत्सहते इहैव जीवन्नेव यः सोढुं प्रसहितुं प्राक् पूर्वं शरीरविमोक्षणात् आ मरणात् इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001137.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001138", "originalText": "मरणसीमाकरणं जीवतोऽवश्यम्भावि हि कामक्रोधोद्भवो वेगः, अनन्तनिमित्तवान् हि सः इति यावत् मरणं तावत् न विस्रम्भणीय इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001138.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001139", "originalText": "कामः इन्द्रियगोचरप्राप्ते इष्टे विषये श्रूयमाणे स्मर्यमाणे वा अनुभूते सुखहेतौ या गर्धिः तृष्णा स कामः, क्रोधश्च आत्मनः प्रतिकूलेषु दुःखहेतुषु दृश्यमानेषु श्रूयमाणेषु स्मर्यमाणेषु वा यो द्वेषः सः क्रोधः, तौ कामक्रोधौ उद्भवो यस्य वेगस्य सः कामक्रोधोद्भवः वेगः।", "padacchedaText": "", "audioFile": "PB_001139.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001140", "originalText": "रोमाञ्चनप्रहृष्टनेत्रवदनादिलिङ्गः अन्तःकरणप्रक्षोभरूपः कामोद्भवो वेगः, गात्रप्रकम्पप्रस्वेदसन्दष्टोष्ठपुटरक्तनेत्रादिलिङ्गः क्रोधोद्भवो वेगः, तं कामक्रोधोद्भवं वेगं यः उत्सहते प्रसहते सोढुं प्रसहितुम्, सः युक्तः योगी सुखी च इह लोके नरः॥ २३॥", "padacchedaText": "", "audioFile": "PB_001140.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001141", "originalText": "कथम्भूतश्च ब्रह्मणि स्थितः ब्रह्म प्राप्नोति इति आह भगवान्—\nयोऽन्तःसुखोऽन्तरारामस्तथान्तर्ज्योतिरेव यः। स योगी ब्रह्मनिर्वाणं ब्रह्मभूतोऽधिगच्छति॥ २४॥", "padacchedaText": "", "audioFile": "PB_001141.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001142", "originalText": "यः अन्तःसुखः अन्तः आत्मनि सुखं यस्य सः अन्तःसुखः, तथा अन्तरेव आत्मनि आरामः आरमणं क्रीडा यस्य सः अन्तरारामः, तथा एव अन्तः एव आत्मन्येव ज्योतिः प्रकाशो यस्य सः अन्तर्ज्योतिरेव, यः ईदृशः सः योगी ब्रह्मनिर्वाणं ब्रह्मणि निर्वृतिं मोक्षम् इह जीवन्नेव ब्रह्मभूतः सन् अधिगच्छति प्राप्नोति॥ २४॥", "padacchedaText": "", "audioFile": "PB_001142.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001143", "originalText": "किञ्च—\nलभन्ते ब्रह्मनिर्वाणमृषयः क्षीणकल्मषाः। छिन्नद्वैधा यतात्मानः सर्वभूतहिते रताः॥ २५॥", "padacchedaText": "", "audioFile": "PB_001143.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001144", "originalText": "लभन्ते ब्रह्मनिर्वाणं मोक्षम् ऋषयः सम्यग्दर्शिनः संन्यासिनः क्षीणकल्मषाः क्षीणपापाः निर्दोषाः छिन्नद्वैधाः छिन्नसंशयाः यतात्मानः संयतेन्द्रियाः सर्वभूतहिते रताः सर्वेषां भूतानां हिते आनुकूल्ये रताः अहिंसका इत्यर्थः॥ २५॥", "padacchedaText": "", "audioFile": "PB_001144.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001145", "originalText": "किञ्च—\nकामक्रोधवियुक्तानां यतीनां यतचेतसाम्। अभितो ब्रह्मनिर्वाणं वर्तते विदितात्मनाम्॥ २६॥", "padacchedaText": "", "audioFile": "PB_001145.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001146", "originalText": "कामक्रोधवियुक्तानां कामश्च क्रोधश्च कामक्रोधौ ताभ्यां वियुक्तानां यतीनां संन्यासिनां यतचेतसां संयतान्तःकरणानाम् अभितः उभयतः जीवतां मृतानां च ब्रह्मनिर्वाणं मोक्षो वर्तते विदितात्मनां विदितः ज्ञातः आत्मा येषां ते विदितात्मानः तेषां विदितात्मनां सम्यग्दर्शिनामित्यर्थः॥ २६॥", "padacchedaText": "", "audioFile": "PB_001146.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001147", "originalText": "सम्यग्दर्शननिष्ठानां संन्यासिनां सद्यः मुक्तिः उक्ता।", "padacchedaText": "", "audioFile": "PB_001147.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001148", "originalText": "कर्मयोगश्च ईश्वरार्पितसर्वभावेन ईश्वरे ब्रह्मणि आधाय क्रियमाणः सत्त्वशुद्धिज्ञानप्राप्तिसर्वकर्मसंन्यासक्रमेण मोक्षाय इति भगवान् पदे पदे अब्रवीत्, वक्ष्यति च।", "padacchedaText": "", "audioFile": "PB_001148.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001149", "originalText": "अथ इदानीं ध्यानयोगं सम्यग्दर्शनस्य अन्तरङ्गं विस्तरेण वक्ष्यामि इति तस्य सूत्रस्थानीयान् श्लोकान् उपदिशति स्म—\nस्पर्शान्कृत्वा बहिर्बाह्यांश्चक्षुश्चैवान्तरे भ्रुवोः।", "padacchedaText": "", "audioFile": "PB_001149.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001150", "originalText": "प्राणापानौ समौ कृत्वा नासाभ्यन्तरचारिणौ॥ २७॥", "padacchedaText": "", "audioFile": "PB_001150.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001151", "originalText": "यतेन्द्रियमनोबुद्धिर्मुनिर्मोक्षपरायणः। विगतेच्छाभयक्रोधो यः सदा मुक्त एव सः॥ २८॥", "padacchedaText": "", "audioFile": "PB_001151.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001152", "originalText": "स्पर्शान् शब्दादीन् कृत्वा बहिः बाह्यान्— श्रोत्रादिद्वारेण अन्तः बुद्धौ प्रवेशिताः शब्दादयः विषयाः तान् अचिन्तयतः शब्दादयो बाह्या बहिरेव कृताः भवन्ति— तान् एवं बहिः कृत्वा चक्षुश्चैव अन्तरे भ्रुवोः ‘कृत्वा’ इति अनुषज्यते।", "padacchedaText": "", "audioFile": "PB_001152.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001153", "originalText": "तथा प्राणापानौ नासाभ्यन्तरचारिणौ समौ कृत्वा, यतेन्द्रियमनोबुद्धिः यतानि संयतानि इन्द्रियाणि मनः बुद्धिश्च यस्य सः यतेन्द्रियमनोबुद्धिः, मननात् मुनिः संन्यासी, मोक्षपरायणः एवं देहसंस्थानात् मोक्षपरायणः मोक्ष एव परम् अयनं परा गतिः यस्य सः अयं मोक्षपरायणो मुनिः भवेत्।", "padacchedaText": "", "audioFile": "PB_001153.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001154", "originalText": "विगतेच्छाभयक्रोधः इच्छा च भयं च क्रोधश्च इच्छाभयक्रोधाः ते विगताः यस्मात् सः विगतेच्छाभयक्रोधः, यः एवं वर्तते सदा संन्यासी, मुक्त एव सः न तस्य मोक्षायान्यः कर्तव्योऽस्ति॥ २८॥", "padacchedaText": "", "audioFile": "PB_001154.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001155", "originalText": "एवं समाहितचित्तेन किं विज्ञेयम् इति, उच्यते—\nभोक्तारं यज्ञतपसां सर्वलोकमहेश्वरम्। सुहृदं सर्वभूतानां ज्ञात्वा मां शान्तिमृच्छति॥ २९॥", "padacchedaText": "", "audioFile": "PB_001155.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001156", "originalText": "भोक्तारं यज्ञतपसां यज्ञानां तपसां च कर्तृरूपेण देवतारूपेण च, सर्वलोकमहेश्वरं सर्वेषां लोकानां महान्तम् ईश्वरं सुहृदं सर्वभूतानां सर्वप्राणिनां प्रत्युपकारनिरपेक्षतया उपकारिणं सर्वभूतानां हृदयेशयं सर्वकर्मफलाध्यक्षं सर्वप्रत्ययसाक्षिणं मां नारायणं ज्ञात्वा शान्तिं सर्वसंसारोपरतिम् ऋच्छति प्राप्नोति॥ २९॥", "padacchedaText": "", "audioFile": "PB_001156.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001157", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूजयपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ श्रीमद्भगवद्गीताभाष्ये पञ्चमोऽध्यायः॥", "padacchedaText": "", "audioFile": "PB_001157.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001158", "originalText": "षष्ठोऽध्यायः\nअतीतानन्तराध्यायान्ते ध्यानयोगस्य सम्यग्दर्शनं प्रति अन्तरङ्गस्य सूत्रभूताः श्लोकाः ‘स्पर्शान् कृत्वा बहिः’ (भ.गी.५.२७) इत्यादयः उपदिष्टाः।", "padacchedaText": "", "audioFile": "PB_001158.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001159", "originalText": "तेषां वृत्तिस्थानीयः अयं षष्ठोऽध्यायः आरभ्यते। तत्र ध्यानयोगस्य बहिरङ्गं कर्म इति, यावत् ध्यानयोगारोहणसमर्थः तावत् गृहस्थेन अधिकृतेन कर्तव्यं कर्म इत्यतः तत् स्तौति— अनाश्रित इति॥", "padacchedaText": "", "audioFile": "PB_001159.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001160", "originalText": "ननु किमर्थं ध्यानयोगारोहणसीमाकरणम्, यावता अनुष्ठेयमेव विहितं कर्म यावज्जीवम्।", "padacchedaText": "", "audioFile": "PB_001160.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001161", "originalText": "न, ‘आरुरुक्षोर्मुनेर्योगं कर्म कारणमुच्यते’ (भ.गी.६.३) इति विशेषणात्, आरूढस्य च शमेनैव सम्बन्धकरणात्।", "padacchedaText": "", "audioFile": "PB_001161.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001162", "originalText": "आरुरुक्षोः आरूढस्य च शमः कर्म च उभयं कर्तव्यत्वेन अभिप्रेतं चेत्स्यात्, तदा ‘आरुरुक्षोः’ ‘आरूढस्य च’ इति शमकर्मविषयभेदेन विशेषणं विभागकरणं च अनर्थकं स्यात्॥", "padacchedaText": "", "audioFile": "PB_001162.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001163", "originalText": "तत्र आश्रमिणां कश्चित् योगमारुरुक्षुः भवति, आरूढश्च कश्चित्, अन्ये न आरुरुक्षवः न च आरूढाः, तानपेक्ष्य ‘आरुरुक्षोः’ ‘आरूढस्य च’ इति विशेषणं विभागकरणं च उपपद्यत एवेति चेत्, न, ‘तस्यैव’ इति वचनात्, पुनः योगग्रहणाच्च ‘योगारूढस्य’ इति, य आसीत् पूर्वं योगमारुरुक्षुः, तस्यैव आरूढस्य शम एव कर्तव्यः कारणं योगफलं प्रति उच्यते इति।", "padacchedaText": "", "audioFile": "PB_001163.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001164", "originalText": "अतो न यावज्जीवं कर्तव्यत्वप्राप्तिः कस्यचिदपि कर्मणः।", "padacchedaText": "", "audioFile": "PB_001164.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001165", "originalText": "योगविभ्रष्टवचनाच्च— गृहस्थस्य चेत् कर्मिणो योगो विहितः षष्ठे अध्याये, सः योगविभ्रष्टोऽपि कर्मगतिं कर्मफलं प्राप्नोति इति तस्य नाशाशङ्का अनुपपन्ना स्यात्।", "padacchedaText": "", "audioFile": "PB_001165.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001166", "originalText": "अवश्यं हि कृतं कर्म काम्यं नित्यं वा— मोक्षस्य नित्यत्वात् अनारभ्यत्वे— स्वं फलं आरभत एव।", "padacchedaText": "", "audioFile": "PB_001166.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001167", "originalText": "नित्यस्य च कर्मणः वेदप्रमाणावबुद्धत्वात् फलेन भवितव्यम् इति अवोचाम, अन्यथा वेदस्य आनर्थक्यप्रसङ्गात् इति। न च कर्मणि सति उभयविभ्रष्टवचनम्, अर्थवत् कर्मणो विभ्रंशकारणानुपपत्तेः॥", "padacchedaText": "", "audioFile": "PB_001167.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001168", "originalText": "कर्म कृतम् ईश्वरे संन्यस्य इत्यतः कर्तुः कर्म फलं नारभत इति चेत्, न, ईश्वरे संन्यासस्य अधिकतरफलहेतुत्वोपपत्तेः॥", "padacchedaText": "", "audioFile": "PB_001168.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001169", "originalText": "मोक्षायैव इति चेत्, स्वकर्मणां कृतानां ईश्वरे संन्यासो मोक्षायैव, न फलान्तराय योगसहितः, योगाच्च विभ्रष्टः, इत्यतः तं प्रति नाशाशङ्का युक्तैव इति चेत्, न, ‘एकाकी यतचित्तात्मा निराशीरपरिग्रहः’ (भ.गी.६.१०) ‘ब्रह्मचारिव्रते स्थितः’ (भ.गी.६.१४) इति कर्मसंन्यासविधानात्।", "padacchedaText": "", "audioFile": "PB_001169.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001170", "originalText": "न च अत्र ध्यानकाले स्त्रीसहायत्वाशङ्का, येन एकाकित्वं विधीयते।", "padacchedaText": "", "audioFile": "PB_001170.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001171", "originalText": "न च गृहस्थस्य ‘निराशीरपरिग्रहः’ इत्यादिवचनम् अनुकूलम्। उभयविभ्रष्टप्रश्नानुपपत्तेश्च॥", "padacchedaText": "", "audioFile": "PB_001171.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001172", "originalText": "अनाश्रित इत्यनेन कर्मिण एव संन्यासित्वं योगित्वं च उक्तम्, प्रतिषिद्धं च निरग्नेः अक्रियस्य च संन्यासित्वं योगित्वं चेति चेत्, न, ध्यानयोगं प्रति बहिरङ्गस्य यतः कर्मणः फलाकाङ्क्षासंन्यासस्तुतिपरत्वात्।", "padacchedaText": "", "audioFile": "PB_001172.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001173", "originalText": "न केवलं निरग्निः अक्रियः एव संन्यासी योगी च।", "padacchedaText": "", "audioFile": "PB_001173.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001174", "originalText": "किं तर्हि? कर्म्यपि, कर्मफलासङ्गं संन्यस्य कर्मयोगम् अनुतिष्ठन् सत्त्वशुद्ध्यर्थम्, ‘स संन्यासी च योगी च भवति’ इति स्तूयते।", "padacchedaText": "", "audioFile": "PB_001174.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001175", "originalText": "न च एकेन वाक्येन कर्मफलासङ्गसंन्यासस्तुतिः चतुर्थाश्रमप्रतिषेधश्च उपपद्यते।", "padacchedaText": "", "audioFile": "PB_001175.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001176", "originalText": "न च प्रसिद्धं निरग्नेः अक्रियस्य परमार्थसंन्यासिनः श्रुतिस्मृतिपुराणेतिहासयोगशास्त्रेषु विहितं संन्यासित्वं योगित्वं च प्रतिषेधति भगवान्।", "padacchedaText": "", "audioFile": "PB_001176.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001177", "originalText": "स्ववचनविरोधाच्च— ‘सर्वकर्माणि मनसा संन्सस्य... नैव कुर्वन्न कारयन् आस्ते’ (भ.गी.५.१३) ‘मौनी सन्तुष्टो येन केनचित् अनिकेतः स्थिरमतिः’ (भ.गी.१२.१९) ‘विहाय कामान्यः सर्वान् पुमांश्चरति निःस्पृहः’ (भ.गी.२.७१) ‘सर्वारम्भपरित्यागी’ (भ.गी.१२.१६) इति च तत्र तत्र भगवता स्ववचनानि दर्शितानि, तैः विरुध्येत चतुर्थाश्रमप्रतिषेधः।", "padacchedaText": "", "audioFile": "PB_001177.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001178", "originalText": "तस्मात् मुनेः योगम् आरुरुक्षोः प्रतिपन्नगार्हस्थ्यस्य अग्निहोत्रादिकर्म फलनिरपेक्षम् अनुष्ठीयमानं ध्यानयोगारोहणसाधनत्वं सत्त्वशुद्धिद्वारेण प्रतिपद्यते इति ‘स संन्यासी च योगी च’ इति स्तूयते॥", "padacchedaText": "", "audioFile": "PB_001178.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001179", "originalText": "श्रीभगवानुवाच—\nअनाश्रितः कर्मफलं कार्यं कर्म करोति यः। स संन्यासी च योगी च न निरग्निर्न चाक्रियः॥ १॥", "padacchedaText": "", "audioFile": "PB_001179.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001180", "originalText": "अनाश्रितः न आश्रितः अनाश्रितः।", "padacchedaText": "", "audioFile": "PB_001180.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001181", "originalText": "किम्? कर्मफलं कर्मणां फलं कर्मफलं यत् तदनाश्रितः, कर्मफलतृष्णारहित इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001181.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001182", "originalText": "यो हि कर्मफले तृष्णावान् सः कर्मफलमाश्रितो भवति, अयं तु तद्विपरीतः, अतः अनाश्रितः कर्मफलम्।", "padacchedaText": "", "audioFile": "PB_001182.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001183", "originalText": "एवंभूतः सन् कार्यं कर्तव्यं नित्यं काम्यविपरीतम् अग्निहोत्रादिकं कर्म करोति निर्वर्तयति यः कश्चित् ईदृशः कर्मी स कर्म्यन्तरेभ्यो विशिष्यते इत्येवमर्थमाह— ‘स संन्यासी च योगी च’ इति।", "padacchedaText": "", "audioFile": "PB_001183.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001184", "originalText": "संन्यासः परित्यागः स यस्यास्ति स संन्यासी च, योगी च योगः चित्तसमाधानं स यस्यास्ति स योगी च इति एवंगुणसम्पन्नः अयं मन्तव्यः’ न केवलं निरग्निः अक्रिय एव संन्यासी योगी च इति मन्तव्यः।", "padacchedaText": "", "audioFile": "PB_001184.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001185", "originalText": "निर्गताः अग्नयः कर्माङ्गभूताः यस्मात् स निरग्निः, अक्रियश्च अनग्निसाधना अपि अविद्यमानाः क्रियाः तपोदानादिकाः यस्य असौ अक्रियः॥ १॥", "padacchedaText": "", "audioFile": "PB_001185.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001186", "originalText": "ननु च निरग्नेः अक्रियस्यैव श्रुतिस्मृतियोगशास्त्रेषु संन्यासित्वं योगित्वं च प्रसिद्धम्।", "padacchedaText": "", "audioFile": "PB_001186.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001187", "originalText": "कथम् इह साग्नेः सक्रियस्य च संन्यासित्वं योगित्वं च अप्रसिद्धमुच्यते इति।", "padacchedaText": "", "audioFile": "PB_001187.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001188", "originalText": "नैष दोषः, कयाचित् गुणवृत्त्या उभयस्य सम्पिपादयिषितत्वात्।", "padacchedaText": "", "audioFile": "PB_001188.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001189", "originalText": "तत् कथम्? कर्मफलसङ्कल्पसंन्यासात् संन्यासित्वम्, योगाङ्गत्वेन च कर्मानुष्ठानात् कर्मफलसङ्कल्पस्य च चित्तविक्षेपहेतोः परित्यागात् योगित्वं च इति गौणमुभयम्, न पुनः मुख्यं संन्यासित्वं योगित्वं च अभिप्रेतमित्येतमर्थं दर्शयितुमाह—\nयं संन्यासमिति प्राहुर्योगं तं विद्धि पाण्डव।", "padacchedaText": "", "audioFile": "PB_001189.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001190", "originalText": "न ह्यसंन्यस्तसङ्कल्पो योगी भवति कश्चन॥ २॥", "padacchedaText": "", "audioFile": "PB_001190.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001191", "originalText": "यं सर्वकर्मतत्फलपरित्यागलक्षणं परमार्थसंन्यासं संन्यासम् इति प्राहुः श्रुतिस्मृतिविदः, योगं कर्मानुष्ठानलक्षणं तं परमार्थसंन्यासं विद्धि जानीहि हे पाण्डव।", "padacchedaText": "", "audioFile": "PB_001191.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001192", "originalText": "कर्मयोगस्य प्रवृत्तिलक्षणस्य तद्विपरीतेन निवृत्तिलक्षणेन परमार्थसंन्यासेन कीदृशं सामान्यमङ्गीकृत्य तद्भाव उच्यते इत्यपेक्षायाम् इदमुच्यते— अस्ति हि परमार्थसंन्यासेन सादृश्यं कर्तृद्वारकं कर्मयोगस्य।", "padacchedaText": "", "audioFile": "PB_001192.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001193", "originalText": "यो हि परमार्थसंन्यासी स त्यक्तसर्वकर्मसाधनतया सर्वकर्मतत्फलविषयं सङ्कल्पं प्रवृत्तिहेतुकामकारणं संन्यस्यति।", "padacchedaText": "", "audioFile": "PB_001193.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001194", "originalText": "अयमपि कर्मयोगी कर्म कुर्वाण एव फलविषयं सङ्कल्पं संन्यस्यति इत्येतमर्थं दर्शयिष्यन् आह— न हि यस्मात् असंन्यस्तसङ्कल्पः असंन्यस्तः अपरित्यक्तः फलविषयः सङ्कल्पः अभिसन्धिः येन सः असंन्यस्तसङ्कल्पः कश्चन कश्चिदपि कर्मी योगी समाधानवान् भवति न सम्भवतीत्यर्थः, फलसङ्कल्पस्य चित्तविक्षेपहेतुत्वात्।", "padacchedaText": "", "audioFile": "PB_001194.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001195", "originalText": "तस्मात् यः कश्चन कर्मी संन्यस्तफलसङ्कल्पो भवेत् स योगी समाधानवान् अविक्षिप्तचित्तो भवेत्, चित्तविक्षेपहेतोः फलसङ्कल्पस्य संन्यस्तत्वादित्यभिप्रायः॥ २॥", "padacchedaText": "", "audioFile": "PB_001195.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001196", "originalText": "एवं परमार्थसंन्यासकर्मयोगयोः कर्तृद्वारकं संन्याससामान्यमपेक्ष्य ‘यं संन्यासमिति प्राहुर्योगं तं विद्धि पाण्डव’ इति कर्मयोगस्य स्तुत्यर्थं संन्यासत्वम् उक्तम्।", "padacchedaText": "", "audioFile": "PB_001196.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001197", "originalText": "ध्यानयोगस्य फलनिरपेक्षः कर्मयोगो बहिरङ्गं साधनमिति तं संन्यासत्वेन स्तुत्वा अधुना कर्मयोगस्य ध्यानयोगसाधनत्वं दर्शयति—\nआरुरुक्षोर्मुनेर्योगं कर्म कारणमुच्यते।", "padacchedaText": "", "audioFile": "PB_001197.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001198", "originalText": "योगारूढस्य तस्यैव शमः कारणमुच्यते॥ ३॥", "padacchedaText": "", "audioFile": "PB_001198.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001199", "originalText": "आरुरुक्षोः आरोढुमिच्छतः, अनारूढस्य, ध्यानयोगे अवस्थातुमशक्तस्यैवेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001199.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001200", "originalText": "कस्य तस्य आरुरुक्षोः? मुनेः, कर्मफलसंन्यासिन इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001200.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001201", "originalText": "किमारुरुक्षोः? योगम्।", "padacchedaText": "", "audioFile": "PB_001201.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001202", "originalText": "कर्म कारणं साधनम् उच्यते।", "padacchedaText": "", "audioFile": "PB_001202.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001203", "originalText": "योगारूढस्य पुनः तस्यैव शमः उपशमः सर्वकर्मभ्यो निवृत्तिः कारणं योगारूढस्य साधनम् उच्यते इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001203.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001204", "originalText": "यावद्यावत् कर्मभ्यः उपरमते, तावत्तावत् निरायासस्य जितेन्द्रियस्य चित्तं समाधीयते।", "padacchedaText": "", "audioFile": "PB_001204.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001205", "originalText": "तथा सति स झटिति योगारूढो भवति।", "padacchedaText": "", "audioFile": "PB_001205.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001206", "originalText": "तथा चोक्तं व्यासेन— ‘नैतादृशं ब्राह्मणस्यास्ति वित्तं यथैकता समता सत्यता च। शीलं स्थितिर्दण्डनिधानमार्जवं ततस्ततश्चोपरमः क्रियाभ्यः’ (मो.ध.१७५.३७) इति॥ ३॥", "padacchedaText": "", "audioFile": "PB_001206.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001207", "originalText": "अथेदानीं कदा योगारूढो भवति इत्युच्यते—\nयदा हि नेन्द्रियार्थेषु न कर्मस्वनुषज्जते। सर्वसङ्कल्पसंन्यासी योगारूढस्तदोच्यते॥ ४॥", "padacchedaText": "", "audioFile": "PB_001207.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001208", "originalText": "यदा समाधीयमानचित्तो योगी हि इन्द्रियार्थेषु इन्द्रियाणामर्थाः शब्दादयः तेषु इन्द्रियार्थेषु कर्मसु च नित्यनैमित्तिककाम्यप्रतिषिद्धेषु प्रयोजनाभावबुद्ध्या न अनुषज्जते अनुषङ्गं कर्तव्यताबुद्धिं न करोतीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001208.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001209", "originalText": "सर्वसङ्कल्पसंन्यासी सर्वान् सङ्कल्पान् इहामुत्रार्थकामहेतून् संन्यसितुं शीलम् अस्य इति सर्वसङ्कल्पसंन्यासी, योगारूढः प्राप्तयोग इत्येतत्, तदा तस्मिन् काले उच्यते।", "padacchedaText": "", "audioFile": "PB_001209.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001210", "originalText": "‘सर्वसङ्कल्पसंन्यासी’ इति वचनात् सर्वांश्च कामान् सर्वाणि च कर्माणि संन्यस्येदित्यर्थः।", "padacchedaText": "", "audioFile": "PB_001210.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001211", "originalText": "सङ्कल्पमूला हि सर्वे कामाः— ‘सङ्कल्पमूलः कामो वै यज्ञाः सङ्कल्पसम्भवाः।", "padacchedaText": "", "audioFile": "PB_001211.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001212", "originalText": "’ (मनु.२.३) ‘काम जानामि ते मूलं सङ्कल्पात्किल जायसे।", "padacchedaText": "", "audioFile": "PB_001212.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001213", "originalText": "न त्वां सङ्कल्पयिष्यामि तेन मे न भविष्यसि’ (मो.ध.१७७.२५) इत्यादिस्मृतेः।", "padacchedaText": "", "audioFile": "PB_001213.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001214", "originalText": "सर्वकामपरित्यागे च सर्वकर्मसंन्यासः सिद्धो भवति, ‘स यथाकामो भवति तत्क्रतुर्भवति यत्क्रतुर्भवति तत्कर्म कुरुते’ (बृ.४.४.५) इत्यादिश्रुतिभ्यः, ‘यद्यद्धि कुरुते जन्तुः तत्तत् कामस्य चेष्टितम्’ (मनु.२.४) इत्यादिस्मृतिभ्यश्च, न्यायाच्च— न हि सर्वसङ्कल्पसंन्यासे कश्चित् स्पन्दितुमपि शक्तः।", "padacchedaText": "", "audioFile": "PB_001214.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001215", "originalText": "तस्मात् ‘सर्वसङ्कल्पसंन्यासी’ इति वचनात् सर्वान् कामान् सर्वाणि कर्माणि च त्याजयति भगवान्॥ ४॥", "padacchedaText": "", "audioFile": "PB_001215.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001216", "originalText": "यदा एवं योगारूढः, तदा तेन आत्मा उद्धृतो भवति संसारादनर्थजातात्।", "padacchedaText": "", "audioFile": "PB_001216.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001217", "originalText": "अतः—\nउद्धरेदात्मनात्मानं नात्मानमवसादयेत्। आत्मैव ह्यात्मनो बन्धुरात्मैव रिपुरात्मनः॥ ५॥", "padacchedaText": "", "audioFile": "PB_001217.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001218", "originalText": "उद्धरेत् संसारसागरे निमग्नम् आत्मना आत्मानं ततः उत् ऊर्ध्वं हरेत् उद्धरेत्, योगारूढतामापादयेदित्यर्थः।", "padacchedaText": "", "audioFile": "PB_001218.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001219", "originalText": "न आत्मानम् अवसादयेत् न अधः नयेत्, न अधः गमयेत्।", "padacchedaText": "", "audioFile": "PB_001219.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001220", "originalText": "आत्मैव हि यस्मात् आत्मनः बन्धुः।", "padacchedaText": "", "audioFile": "PB_001220.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001221", "originalText": "न हि अन्यः कश्चित् बन्धुः, यः संसारमुक्तये भवति।", "padacchedaText": "", "audioFile": "PB_001221.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001222", "originalText": "बन्धुरपि तावत् मोक्षं प्रति प्रतिकूल एव, स्नेहादिबन्धनायतनत्वात्।", "padacchedaText": "", "audioFile": "PB_001222.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001223", "originalText": "तस्मात् युक्तमवधारणम् ‘आत्मैव ह्यात्मनो बन्धुः’ इति।", "padacchedaText": "", "audioFile": "PB_001223.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001224", "originalText": "आत्मैव रिपुः शत्रुः। यः अन्यः अपकारी बाह्यः शत्रुः सोऽपि आत्मप्रयुक्त एवेति युक्तमेव अवधारणम् ‘आत्मैव रिपुरात्मनः’ इति॥ ५॥", "padacchedaText": "", "audioFile": "PB_001224.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001225", "originalText": "आत्मैव बन्धुः आत्मैव रिपुः आत्मनः इत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_001225.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001226", "originalText": "तत्र किंलक्षण आत्मा आत्मनो बन्धुः, किंलक्षणो वा आत्मा आत्मनो रिपुः इत्युच्यते—\nबन्धुरात्मात्मनस्तस्य येनात्मैवात्मना जितः। अनात्मनस्तु शत्रुत्वे वर्तेतात्मैव शत्रुवत्॥ ६॥", "padacchedaText": "", "audioFile": "PB_001226.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001227", "originalText": "बन्धुः आत्मा आत्मनः तस्य, तस्य आत्मनः स आत्मा बन्धुः येन आत्मना आत्मैव जितः, आत्मा कार्यकरणसङ्घातो येन वशीकृतः, जितेन्द्रिय इत्यर्थः। अनात्मनस्तु अजितात्मनस्तु शत्रुत्वे शत्रुभावे वर्तेत आत्मैव शत्रुवत्, यथा अनात्मा शत्रुः आत्मनः अपकारी, तथा आत्मा आत्मन अपकारे वर्तेत इत्यर्थः॥ ६॥", "padacchedaText": "", "audioFile": "PB_001227.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001228", "originalText": "जितात्मनः प्रशान्तस्य परमात्मा समाहितः। शीतोष्णसुखदुःखेषु तथा मानापमानयोः॥ ७॥", "padacchedaText": "", "audioFile": "PB_001228.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001229", "originalText": "जितात्मनः कार्यकरणसङ्घात आत्मा जितो येन सः जितात्मा तस्य जितात्मनः, प्रशान्तस्य प्रसन्नान्तःकरणस्य सतः संन्यासिनः परमात्मा समाहितः साक्षादात्मभावेन वर्तते इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001229.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001230", "originalText": "किञ्च शीतोष्णसुखदुःखेषु तथा माने अपमाने च मानापमानयोः पूजापरिभवयोः समः स्यात्॥ ७॥", "padacchedaText": "", "audioFile": "PB_001230.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001231", "originalText": "ज्ञानविज्ञानतृप्तात्मा कूटस्थो विजितेन्द्रियः। युक्त इत्युच्यते योगी समलोष्टाश्मकाञ्चनः॥ ८॥", "padacchedaText": "", "audioFile": "PB_001231.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001232", "originalText": "ज्ञानविज्ञानतृप्तात्मा ज्ञानं शास्त्रोक्तपदार्थानां परिज्ञानम्, विज्ञानं तु शास्त्रतो ज्ञातानां तथैव स्वानुभवकरणम्, ताभ्यां ज्ञानविज्ञानाभ्यां तृप्तः सञ्जातालंप्रत्ययः आत्मा अन्तःकरणं यस्य सः ज्ञानविज्ञानतृप्तात्मा, कूटस्थः अप्रकम्प्यः, भवति इत्यर्थः, विजितेन्द्रियश्च।", "padacchedaText": "", "audioFile": "PB_001232.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001233", "originalText": "य ईदृशः, युक्तः समाहितः इति स उच्यते कथ्यते। स योगी समलोष्टाश्मकाञ्चनः लोष्टाश्मकाञ्चनानि समानि यस्य सः समलोष्टाश्मकाञ्चनः॥ ८॥", "padacchedaText": "", "audioFile": "PB_001233.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001234", "originalText": "किञ्च—\nसुहृन्मित्रार्युदासीनमध्यस्थद्वेष्यबन्धुषु। साधुष्वपि च पापेषु समबुद्धिर्विशिष्यते॥ ९॥", "padacchedaText": "", "audioFile": "PB_001234.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001235", "originalText": "‘सुहृत्’ इत्यादिश्लोकार्धम् एकं पदम्।", "padacchedaText": "", "audioFile": "PB_001235.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001236", "originalText": "सुहृत् इति प्रत्युपकारमनपेक्ष्य उपकर्ता, मित्रं स्नेहवान्, अरिः शत्रुः, उदासीनः न कस्यचित् पक्षं भजते, मध्यस्थः यो विरुद्धयोः उभयोः हितैषी, द्वेष्यः आत्मनः अप्रियः, बन्धुः सम्बन्धी इत्येतेषु साधुषु शास्त्रानुवर्तिषु अपि च पापेषु प्रतिषिद्धकारिषु सर्वेषु एतेषु समबुद्धिः ‘कः किङ्कर्मा’ इत्यव्यापृतबुद्धिरित्यर्थः।", "padacchedaText": "", "audioFile": "PB_001236.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001237", "originalText": "विशिष्यते, ‘विमुच्यते’ इति वा पाठान्तरम्। योगारूढानां सर्वेषाम् अयम् उत्तम इत्यर्थः॥ ९॥", "padacchedaText": "", "audioFile": "PB_001237.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001238", "originalText": "अत एवमुत्तमफलप्राप्तये—\nयोगी युञ्जीत सततमात्मानं रहसि स्थितः। एकाकी यतचित्तात्मा निराशीरपरिग्रहः॥ १०॥", "padacchedaText": "", "audioFile": "PB_001238.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001239", "originalText": "योगी ध्यायी युञ्जीत समादध्यात् सततं सर्वदा आत्मानम् अन्तःकरणं रहसि एकान्ते गिरिगुहादौ स्थितः सन् एकाकी असहायः।", "padacchedaText": "", "audioFile": "PB_001239.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001240", "originalText": "‘रहसि स्थितः एकाकी च’ इति विशेषणात् संन्यासं कृत्वा इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001240.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001241", "originalText": "यतचित्तात्मा चित्तम् अन्तःकरणम् आत्मा देहश्च संयतौ यस्य सः यतचित्तात्मा, निराशीः वीततृष्णः अपरिग्रहः परिग्रहरहितश्चेत्यर्थः। संन्यासित्वेऽपि त्यक्तसर्वपरिग्रहः सन् युञ्जीत इत्यर्थः॥ १०॥", "padacchedaText": "", "audioFile": "PB_001241.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001242", "originalText": "अथेदानीं योगं युञ्जतः आसनाहारविहारादीनां योगसाधनत्वेन नियमो वक्तव्यः, प्राप्तयोगस्य लक्षणं तत्फलादि च, इत्यत आरभ्यते।", "padacchedaText": "", "audioFile": "PB_001242.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001243", "originalText": "तत्र आसनमेव तावत् प्रथममुच्यते—\nशुचौ देशे प्रतिष्ठाप्य स्थिरमासनमात्मनः। नात्युच्छ्रितं नातिनीचं चैलाजिनकुशोत्तरम्॥ ११॥", "padacchedaText": "", "audioFile": "PB_001243.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001244", "originalText": "शुचौ शुद्धे विविक्ते स्वभावतः संस्कारतो वा, देशे स्थाने प्रतिष्ठाप्य स्थिरम् अचलम् आत्मनः आसनं नात्युच्छ्रितं नातीव उच्छ्रितं न अपि अतिनीचम्, तच्च चैलाजिनकुशोत्तरं चैलम् अजिनं कुशाश्च उत्तरे यस्मिन् आसने तत् आसनं चैलाजिनकुशोत्तरम्।", "padacchedaText": "", "audioFile": "PB_001244.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001245", "originalText": "पाठक्रमाद्विपरीतः अत्र क्रमः चैलादीनाम्॥ ११॥", "padacchedaText": "", "audioFile": "PB_001245.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001246", "originalText": "प्रतिष्ठाप्य, किम्?—\nतत्रैकाग्रं मनः कृत्वा यतचित्तेन्द्रियक्रियः। उपविश्यासने युञ्ज्याद्योगमात्मविशुद्धये॥ १२॥", "padacchedaText": "", "audioFile": "PB_001246.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001247", "originalText": "तत्र तस्मिन् आसने उपविश्य योगं युञ्ज्यात्।", "padacchedaText": "", "audioFile": "PB_001247.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001248", "originalText": "कथम्? सर्वविषयेभ्यः उपसंहृत्य एकाग्रं मनः कृत्वा यतचित्तेन्द्रियक्रियः चित्तं च इन्द्रियाणि च चित्तेन्द्रियाणि तेषां क्रियाः संयता यस्य सः यतचित्तेन्द्रियक्रियः।", "padacchedaText": "", "audioFile": "PB_001248.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001249", "originalText": "स किमर्थं योगं युञ्ज्यात् इत्याह— आत्मविशुद्धये अन्तःकरणस्य विशुद्ध्यर्थमित्येतत्॥ १२॥", "padacchedaText": "", "audioFile": "PB_001249.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001250", "originalText": "बाह्यमासनमुक्तम्, अधुना शरीरधारणं कथम् इत्युच्यते—\nसमं कायशिरोग्रीवं धारयन्नचलं स्थिरः। सम्प्रेक्ष्य नासिकाग्रं स्वं दिशश्चानवलोकयन्॥ १३॥", "padacchedaText": "", "audioFile": "PB_001250.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001251", "originalText": "समं कायशिरोग्रीवं कायश्च शिरश्च ग्रीवा च कायशिरोग्रीवं तत् समं धारयन् अचलं च।", "padacchedaText": "", "audioFile": "PB_001251.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001252", "originalText": "समं धारयतः चलनं सम्भवति, अतः विशिनष्टि— अचलमिति।", "padacchedaText": "", "audioFile": "PB_001252.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001253", "originalText": "स्थिरः स्थिरो भूत्वा इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001253.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001254", "originalText": "स्वं नासिकाग्रं सम्प्रेक्ष्य सम्यक् प्रेक्षणं दर्शनं कृत्वेव इति।", "padacchedaText": "", "audioFile": "PB_001254.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001255", "originalText": "इवशब्दो लुप्तो द्रष्टव्यः।", "padacchedaText": "", "audioFile": "PB_001255.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001256", "originalText": "न हि स्वनासिकाग्रसम्प्रेक्षणमिह विधित्सितम्।", "padacchedaText": "", "audioFile": "PB_001256.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001257", "originalText": "किं तर्हि? चक्षुषो दृष्टिसंनिपातः।", "padacchedaText": "", "audioFile": "PB_001257.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001258", "originalText": "स च अन्तःकरणसमाधानापेक्षो विवक्षितः।", "padacchedaText": "", "audioFile": "PB_001258.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001259", "originalText": "स्वनासिकाग्रसम्प्रेक्षणमेव चेत् विवक्षितम्, मनः तत्रैव समाधीयेत, नात्मनि।", "padacchedaText": "", "audioFile": "PB_001259.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001260", "originalText": "आत्मनि हि मनसः समाधानं वक्ष्यति ‘आत्मसंस्थं मनः कृत्वा’ (भ.गी.६.२५) इति।", "padacchedaText": "", "audioFile": "PB_001260.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001261", "originalText": "तस्मात् इवशब्दलोपेन अक्ष्णोः दृष्टिसंनिपात एव ‘सम्प्रेक्ष्य’ इत्युच्यते। दिशश्च अनवलोकयन् दिशां च अवलोकनमन्तराकुर्वन् इत्येतत्॥ १३॥", "padacchedaText": "", "audioFile": "PB_001261.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001262", "originalText": "किञ्च—\nप्रशान्तात्मा विगतभीर्ब्रह्मचारिव्रते स्थितः। मनः संयम्य मच्चित्तो युक्त आसीत मत्परः॥ १४॥", "padacchedaText": "", "audioFile": "PB_001262.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001263", "originalText": "प्रशान्तात्मा प्रकर्षेण शान्तः आत्मा अन्तःकरणं यस्य सोऽयं प्रशान्तात्मा, विगतभीः विगतभयः, ब्रह्मचारिव्रते स्थितः ब्रह्मचारिणो व्रतं ब्रह्मचर्यं गुरुशुश्रूषाभिक्षान्नभुक्त्यादि तस्मिन् स्थितः, तदनुष्ठाता भवेदित्यर्थः।", "padacchedaText": "", "audioFile": "PB_001263.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001264", "originalText": "किञ्च, मनः संयम्य मनसः वृत्तीः उपसंहृत्य इत्येतत्, मच्चित्तः मयि परमेश्वरे चित्तं यस्य सोऽयं मच्चित्तः, युक्तः समाहितः सन् आसीत उपविशेत्।", "padacchedaText": "", "audioFile": "PB_001264.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001265", "originalText": "मत्परः अहं परो यस्य सोऽयं मत्परो भवति।", "padacchedaText": "", "audioFile": "PB_001265.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001266", "originalText": "कश्चित् रागी स्त्रीचित्तः, न तु स्त्रियमेव परत्वेन गृह्णाति, किं तर्हि? राजानं महादेवं वा। अयं तु मच्चित्तो मत्परश्च॥ १४॥", "padacchedaText": "", "audioFile": "PB_001266.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001267", "originalText": "अथेदानीं योगफलमुच्यते—\nयुञ्जन्नेवं सदात्मानं योगी नियतमानसः। शान्तिं निर्वाणपरमां मत्संस्थामधिगच्छति॥ १५॥", "padacchedaText": "", "audioFile": "PB_001267.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001268", "originalText": "युञ्जन् समाधानं कुर्वन् एवं यतोक्तेन विधानेन सदा आत्मानं सर्वदा योगी नियतमानसः नियतं संयतं मानसं मनो यस्य सोऽयं नियतमानसः, शान्तिम् उपरतिं निर्वाणपरमां निर्वाणं मोक्षः तत् परमा निष्ठा यस्याः शान्तेः सा निर्वाणपरमा तां निर्वाणपरमाम्, मत्संस्थां मदधीनाम् अधिगच्छति प्राप्नोति॥ १५॥", "padacchedaText": "", "audioFile": "PB_001268.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001269", "originalText": "इदानीं योगिनः आहारादिनियम उच्यते—\nनात्यश्नतस्तु योगोऽस्ति न चैकान्तमनश्नतः। न चातिस्वप्नशीलस्य जाग्रतो नैव चार्जुन॥ १६॥", "padacchedaText": "", "audioFile": "PB_001269.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001270", "originalText": "न अत्यश्नतः आत्मसंमितमन्नपरिमाणमतीत्याश्नतः अत्यश्नतः न योगः अस्ति।", "padacchedaText": "", "audioFile": "PB_001270.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001271", "originalText": "न च एकान्तम् अनश्नतः योगः अस्ति।", "padacchedaText": "", "audioFile": "PB_001271.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001272", "originalText": "‘यदु ह वा आत्मसंमितमन्नं तदवति तन्न हिनस्ति यद्भूयो हिनस्ति तद्यत् कनीयोऽन्नं न तदवति’ (श.ब्रा.?) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_001272.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001273", "originalText": "तस्मात् योगी न आत्मसंमितात् अन्नात् अधिकं न्यूनं वा अश्नीयात्।", "padacchedaText": "", "audioFile": "PB_001273.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001274", "originalText": "अथवा, योगिनः योगशास्त्रे परिपठीतात् अन्नपरिमाणात् अतिमात्रमश्नतः योगो नास्ति।", "padacchedaText": "", "audioFile": "PB_001274.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001275", "originalText": "उक्तं हि— ‘अर्धं सव्यञ्जनान्नस्य तृतीयमुदकस्य च।", "padacchedaText": "", "audioFile": "PB_001275.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001276", "originalText": "वायोः सञ्चरणार्थं तु चतुर्थमवशेषयेत्’ (?) इत्यादिपरिमाणम्। तथा— न च अतिस्वप्नशीलस्य योगो भवति नैव च अतिमात्रं जाग्रतो भवति च अर्जुन॥ १६॥", "padacchedaText": "", "audioFile": "PB_001276.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001277", "originalText": "कथं पुनः योगो भवति इत्युच्यते—\nयुक्ताहारविहारस्य युक्तचेष्टस्य कर्मसु। युक्तस्वप्नावबोधस्य योगो भवति दुःखहा॥ १७॥", "padacchedaText": "", "audioFile": "PB_001277.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001278", "originalText": "युक्ताहारविहारस्य आह्रियते इति आहारः अन्नम्, विहरणं विहारः पादक्रमः, तौ युक्तौ नियतपरिमाणौ यस्य सः युक्ताहारविहारः तस्य, तथा युक्तचेष्टस्य युक्ता नियता चेष्टा यस्य कर्मसु तस्य, तथा युक्तस्वप्नावबोधस्य युक्तौ स्वप्नश्च अवबोधश्च तौ नियतकालौ यस्य तस्य, युक्ताहारविहारस्य युक्तचेष्टस्य कर्मसु युक्तस्वप्नावबोधस्य योगिनो योगो भवति दुःखहा दुःखानि सर्वाणि हन्तीति दुःखहा, सर्वसंसारदुःखक्षयकृत् योगः भवतीत्यर्थः॥ १७॥", "padacchedaText": "", "audioFile": "PB_001278.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001279", "originalText": "अथ अधुना कदा युक्तो भवति इत्युच्यते—\nयदा विनियतं चित्तमात्मन्येवावतिष्ठते। निःस्पृहः सर्वकामेभ्यो युक्त इत्युच्यते तदा॥ १८॥", "padacchedaText": "", "audioFile": "PB_001279.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001280", "originalText": "यदा विनियतं विशेषेण नियतं संयतम् एकाग्रतामापन्नं चित्तं हित्वा बाह्यार्थचिन्ताम् आत्मन्येव केवले अवतिष्ठते, स्वात्मनि स्थितिं लभते इत्यर्थः। निःस्पृहः सर्वकामेभ्यः निर्गता दृष्टादृष्टविषयेभ्यः स्पृहा तृष्णा यस्य योगिनः सः युक्तः समाहितः इत्युच्यते तदा तस्मिन्काले॥ १८॥", "padacchedaText": "", "audioFile": "PB_001280.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001281", "originalText": "तस्य योगिनः समाहितं यत् चित्तं तस्योपमा उच्यते—\nयदा दीपो निवातस्थो नेङ्गते सोपमा स्मृता। योगिनो यतचित्तस्य युञ्जतो योगमात्मनः॥ १९॥", "padacchedaText": "", "audioFile": "PB_001281.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001282", "originalText": "यथा दीपः प्रदीपः निवातस्थः निवाते वातवर्जिते देशे स्थितः न इङ्गते न चलति, सा उपमा उपमीयते अनया इत्युपमा योगज्ञैः चित्तप्रचारदर्शिभिः स्मृता चिन्तिता योगिनो यतचित्तस्य संयतान्तःकरणस्य युञ्जतो योगम् अनुतिष्ठतः आत्मनः समाधिमनुतिष्ठत इत्यर्थः॥ १९॥", "padacchedaText": "", "audioFile": "PB_001282.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001283", "originalText": "एवं योगाभ्यासबलादेकाग्रीभूतं निवातप्रदीपकल्पं सत्—\nयत्रोपरमते चित्तं निरुद्धं योगसेवया। यत्र चैवात्मनात्मानं पश्यन्नात्मनि तुष्यति॥ २०॥", "padacchedaText": "", "audioFile": "PB_001283.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001284", "originalText": "यत्र यस्मिन् काले उपरमते चित्तम् उपरतिं गच्छति निरुद्धं सर्वतो निवारितप्रचारं योगसेवया योगानुष्ठानेन, यत्र चैव यस्मिंश्च काले आत
