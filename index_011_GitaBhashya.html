zipFile": "011_GitaBhashya.zip"}, {"id": "B_003536", "originalText": "शुश्रूषाभक्तिवियुक्ताय न तपस्विने नापि मेधाविने वाच्यम्।", "padacchedaText": "", "audioFile": "PB_003536.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003537", "originalText": "भगवति असूयायुक्ताय समस्तगुणवतेऽपि न वाच्यम्। गुरुशुश्रूषाभक्तिमते च वाच्यम् इत्येषः शास्त्रसम्प्रदायविधिः॥ ६७॥", "padacchedaText": "", "audioFile": "PB_003537.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003538", "originalText": "सम्प्रदायस्य कर्तुः फलम् इदानीम् आह—\nय इमं परमं गुह्यं\nमद्भक्तेष्वभिधास्यति। भक्तिं मयि परां कृत्वा\nमामेवैष्यत्यसंशयः॥ ६८॥", "padacchedaText": "", "audioFile": "PB_003538.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003539", "originalText": "यः इमं यथोक्तं परमं परमनिःश्रेयसार्थं केशवार्जुनयोः संवादरूपं ग्रन्थं गुह्यं गोप्यतमं मद्भक्तेषु मयि भक्तिमत्सु अभिधास्यति वक्ष्यति, ग्रन्थतः अर्थतश्च स्थापयिष्यतीत्यर्थः, यथा त्वयि मया।", "padacchedaText": "", "audioFile": "PB_003539.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003540", "originalText": "भक्तेः पुनर्ग्रहणात् भक्तिमात्रेण केवलेन शास्त्रसम्प्रदाने पात्रं भवतीति गम्यते।", "padacchedaText": "", "audioFile": "PB_003540.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003541", "originalText": "कथम् अभिधास्यति इति, उच्यते— भक्तिं मयि परां कृत्वा ‘भगवतः परमगुरोः अच्युतस्य शुश्रूषा मया क्रियते’ इत्येवं कृत्वेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_003541.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003542", "originalText": "तस्य इदं फलम्— मामेव एष्यति मुच्यते एव। असंशयः अत्र संशयः न कर्तव्यः॥ ६८॥", "padacchedaText": "", "audioFile": "PB_003542.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003543", "originalText": "किञ्च—\nन च तस्मान्मनुष्येषु कश्चिन्मे प्रियकृत्तमः। भविता न च मे तस्मादन्यः प्रियतरो भुवि॥ ६९॥", "padacchedaText": "", "audioFile": "PB_003543.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003544", "originalText": "न च तस्मात् शास्त्रसम्प्रदायकृतः मनुष्येषु मनुष्याणां मध्ये कश्चित् मे मम प्रियकृत्तमः अतिशयेन प्रियकरः, अन्यः प्रियकृत्तमः, नास्त्येव इत्यर्थः वर्तमानेषु।", "padacchedaText": "", "audioFile": "PB_003544.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003545", "originalText": "न च भविता भविष्यत्यपि काले तस्मात् द्वितीयः अन्यः प्रियतरः प्रियकृत्तरः भुवि लोकेऽस्मिन् न भविता॥ ६९॥", "padacchedaText": "", "audioFile": "PB_003545.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003546", "originalText": "योऽपि—\nअध्येष्यते च य इमं धर्म्यं संवादमावयोः। ज्ञानयज्ञेन तेनाहमिष्टः स्यामिति मे मतिः॥ ७०॥", "padacchedaText": "", "audioFile": "PB_003546.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003547", "originalText": "अध्येष्यते च पठिष्यति यः इमं धर्म्यं धर्मादनपेतं संवादरूपं ग्रन्थं आवयोः, तेन इदं कृतं स्यात्।", "padacchedaText": "", "audioFile": "PB_003547.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003548", "originalText": "ज्ञानयज्ञेन— विधिजपोपांशुमानसानां यज्ञानां ज्ञानयज्ञः मानसत्वात् विशिष्टतमः इत्यतः तेन ज्ञानयज्ञेन गीताशास्त्रस्य अध्ययनं स्तूयते, फलविधिरेव वा, देवतादिविषयज्ञानयज्ञफलतुल्यम् अस्य फलं भवतीति— तेन अध्ययनेन अहम् इष्टः पूजितः स्यां भवेयम् इति मे मम मतिः निश्चयः॥ ७०॥", "padacchedaText": "", "audioFile": "PB_003548.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003549", "originalText": "अथ श्रोतुः इदं फलम्—\nश्रद्धावाननसूयश्च शृणुयादपि यो नरः। सोऽपि मुक्तः शुभांल्लोकान्प्राप्नुयात्पुण्यकर्मणाम्॥ ७१॥", "padacchedaText": "", "audioFile": "PB_003549.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003550", "originalText": "श्रद्धावान् श्रद्दधानः अनसूयश्च असूयावर्जितः सन् इमं ग्रन्थं शृणुयादपि यो नरः, अपिशब्दात् किमुत अर्थज्ञानवान्, सोऽपि पापात् मुक्तः शुभान् प्रशस्तान् लोकान् प्राप्नुयात् पुण्यकर्मणाम् अग्निहोत्रादिकर्मवताम्॥ ७१॥", "padacchedaText": "", "audioFile": "PB_003550.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003551", "originalText": "शिष्यस्य शास्त्रार्थग्रहणाग्रहणविवेकबुभुत्सया पृच्छति।", "padacchedaText": "", "audioFile": "PB_003551.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003552", "originalText": "तदग्रहणे ज्ञाते पुनः ग्राहयिष्यामि उपायान्तरेणापि इति प्रष्टुः अभिप्रायः।", "padacchedaText": "", "audioFile": "PB_003552.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003553", "originalText": "यत्नान्तरं च आस्थाय शिष्यस्य कृतार्थता कर्तव्या इति आचार्यधर्मः प्रदर्शितो भवति—\nकच्चिदेतच्छ्रुतं पार्थ\nत्वयैकाग्रेण चेतसा। कच्चिदज्ञानसंमोहः\nप्रणष्टस्ते धनञ्जय॥ ७२॥", "padacchedaText": "", "audioFile": "PB_003553.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003554", "originalText": "कच्चित् किम् एतत् मया उक्तं श्रुतं श्रवणेन अवधारितं पार्थ, त्वया एकाग्रेण चेतसा चित्तेन? किं वा अप्रमादतः? कच्चित् अज्ञानसंमोहः अज्ञाननिमित्तः संमोहः अविविक्तभावः अविवेकः स्वाभाविकः किं प्रणष्टः? यदर्थः अयं शास्त्रश्रवणायासः तव, मम च उपदेष्टृत्वायासः प्रवृत्तः, ते तुभ्यं हे धनञ्जय॥ ७२॥", "padacchedaText": "", "audioFile": "PB_003554.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003555", "originalText": "अर्जुन उवाच—\nनष्टो मोहः स्मृतिर्लब्धा\nत्वत्प्रसादान्मयाच्युत। स्थितोऽस्मि गतसन्देहः\nकरिष्ये वचनं तव॥ ७३॥", "padacchedaText": "", "audioFile": "PB_003555.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003556", "originalText": "नष्टः मोहः अज्ञानजः समस्तसंसारानर्थहेतुः, सागर इव दुरुत्तरः।", "padacchedaText": "", "audioFile": "PB_003556.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003557", "originalText": "स्मृतिश्च आत्मतत्त्वविषया लब्धा, यस्याः लाभात् सर्वहृदयग्रन्थीनां विप्रमोक्षः, त्वत्प्रसादात् तव प्रसादात् मया त्वत्प्रसादम् आश्रितेन अच्युत।", "padacchedaText": "", "audioFile": "PB_003557.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003558", "originalText": "अनेन मोहनाशप्रश्नप्रतिवचनेन सर्वशास्त्रार्थज्ञानफलम् एतावदेवेति निश्चितं दर्शितं भवति, यतः ज्ञानात् मोहनाशः आत्मस्मृतिलाभश्चेति।", "padacchedaText": "", "audioFile": "PB_003558.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003559", "originalText": "तथा च श्रुतौ ‘अनात्मवित् शोचामि’ (छा.७.१.३) इति उपन्यस्य आत्मज्ञानेन सर्वग्रन्थीनां विप्रमोक्षः उक्तः, ‘भिद्यते हृदयग्रन्थिः’ (मु.२.२.९) ‘तत्र को मोहः कः शोकः एकत्वमनुपश्यतः’ (ई.७) इति च मन्त्रवर्णः।", "padacchedaText": "", "audioFile": "PB_003559.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003560", "originalText": "अथ इदानीं त्वच्छासने स्थितः अस्मि गतसन्देहः मुक्तसंशयः।", "padacchedaText": "", "audioFile": "PB_003560.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003561", "originalText": "करिष्ये वचनं तव। अहं त्वत्प्रसादात् कृतार्थः, न मे कर्तव्यम् अस्ति इत्यभिप्रायः॥ ७३॥", "padacchedaText": "", "audioFile": "PB_003561.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003562", "originalText": "परिसमाप्तः शास्त्रार्थः।", "padacchedaText": "", "audioFile": "PB_003562.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003563", "originalText": "अथ इदानीं कथासम्बन्धप्रदर्शनार्थं सञ्जयः उवाच—\nसञ्जय उवाच—\nइत्यहं वासुदेवस्य पार्थस्य च महात्मनः। संवादमिममश्रौषमद्भुतं रोमहर्षणम्॥ ७४॥", "padacchedaText": "", "audioFile": "PB_003563.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003564", "originalText": "इति एवम् अहं वासुदेवस्य पार्थस्य च महात्मनः संवादम् इमं यथोक्तम् अश्रौषं श्रुतवान् अस्मि अद्भुतम् अत्यन्तविस्मयकरं रोमहर्षणं रोमाञ्चकरम्॥ ७४॥", "padacchedaText": "", "audioFile": "PB_003564.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003565", "originalText": "तं च इमम्—\nव्यासप्रसादाच्छ्रुतवानिमं गुह्यतमं परम्। योगं योगेश्वरात्कृष्णात्साक्षात्कथयतः स्वयम्॥ ७५॥", "padacchedaText": "", "audioFile": "PB_003565.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003566", "originalText": "व्यासप्रसादात् ततः दिव्यचक्षुर्लाभात् श्रुतवान् इमं संवादं गुह्यतमं परं योगम्, योगार्थत्वात् ग्रन्थोऽपि योगः, संवादम् इमं योगमेव वा योगेश्वरात् कृष्णात् साक्षात् कथयतः स्वयम्, न परम्परया॥ ७५॥", "padacchedaText": "", "audioFile": "PB_003566.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003567", "originalText": "राजन् संस्मृत्य संस्मृत्य\nसंवादमिममद्भुतम्। केशवार्जुनयोः पुण्यं\nहृष्यामि च मुहुर्मुहुः॥ ७६॥", "padacchedaText": "", "audioFile": "PB_003567.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003568", "originalText": "हे राजन् धृतराष्ट्र, संस्मृत्य संस्मृत्य प्रतिक्षणं संवादम् इमम् अद्भुतं केशवार्जुनयोः पुण्यम् इमं श्रवणेनापि पापहरं श्रुत्वा हृष्यामि च मुहुर्मुहुः प्रतिक्षणम्॥ ७६॥", "padacchedaText": "", "audioFile": "PB_003568.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003569", "originalText": "तच्च संस्मृत्य संस्मृत्य\nरूपमत्यद्भुतं हरेः। विस्मयो मे महान्राजन्\nहृष्यामि च पुनः पुनः॥ ७७॥", "padacchedaText": "", "audioFile": "PB_003569.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003570", "originalText": "तच्च संस्मृत्य संस्मृत्य रूपम् अत्यद्भुतं हरेः विश्वरूपं विस्मयो मे महान् राजन्, हृष्यामि च पुनः पुनः॥ ७७॥", "padacchedaText": "", "audioFile": "PB_003570.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003571", "originalText": "किं बहुना—\nयत्र योगेश्वरः कृष्णो यत्र पार्थो धनुर्धरः। तत्र श्रीर्विजयो भूतिर्ध्रुवा नीतिर्मतिर्मम॥ ७८॥", "padacchedaText": "", "audioFile": "PB_003571.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003572", "originalText": "यत्र यस्मिन् पक्षे योगेश्वरः सर्वयोगानाम् ईश्वरः, तत्प्रभवत्वात् सर्वयोगबीजस्य, कृष्णः, यत्र पार्थः यस्मिन् पक्षे धनुर्धरः गाण्डीवधन्वा, तत्र श्रीः तस्मिन् पाण्डवानां पक्षे श्रीः विजयः, तत्रैव भूतिः श्रियो विशेषः विस्तारः भूतिः, ध्रुवा अव्यभिचारिणी नीतिः नयः, इत्येवं मतिः मम इति॥ ७८॥", "padacchedaText": "", "audioFile": "PB_003572.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003573", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ श्रीमद्भगवद्गीताभाष्ये अष्टादशोऽध्यायः॥", "padacchedaText": "", "audioFile": "PB_003573.wav", "zipFile": "011_GitaBhashya.zip"}];
        const contentDiv = document.getElementById('content');
        
        let currentIndex = -1;
        let isPlaying = false;
        
        // Use standard HTML5 audio to preserve pitch on speed changes
        const audioEl = new Audio();
        audioEl.preservesPitch = true;
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            audioEl.playbackRate = this.value;
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        let currentScript = 'devanagari';
        const scriptSelect = document.getElementById('script-select');
        scriptSelect.onchange = function() {
            currentScript = this.value;
            document.querySelectorAll('.sentence-text').forEach((span, index) => {
                let origText = manifest[index].originalText;
                if (currentScript === 'devanagari') {
                    span.innerText = origText;
                } else {
                    span.innerText = Sanscript.t(origText, 'devanagari', currentScript);
                }
            });
        };
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        playPauseBtn.onclick = () => {
            if (isPlaying) {
                audioEl.pause();
                isPlaying = false;
                playPauseBtn.innerText = "Resume";
            } else {
                playAudio(Math.max(0, currentIndex));
                playPauseBtn.innerText = "Stop";
            }
        };
        
        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'sentence-text';
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => {
                playPauseBtn.innerText = "Stop";
                playAudio(index);
            };
            contentDiv.appendChild(div);
        });
        
        // --- HTML5 Audio Prefetching Logic (via Blob URLs) ---
        const PREFETCH_BUFFER_SIZE = 3;
        let prefetchQueue = new Map(); // index -> Blob URL

        function getAudioUrl(index) {
            if (index < 0 || index >= manifest.length) return null;
            const item = manifest[index];
            const zipToUse = item.zipFile || ZIP_NAME;
            return WORKER_URL + '/' + BUCKET_NAME + '/' + zipToUse + '/' + item.audioFile;
        }

        async function fetchBlobUrl(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        async function prefetchNext(fromIndex) {
            for (let i = fromIndex + 1; i <= fromIndex + PREFETCH_BUFFER_SIZE; i++) {
                if (i >= manifest.length) break;
                if (!prefetchQueue.has(i)) {
                    prefetchQueue.set(i, 'fetching');
                    const url = getAudioUrl(i);
                    try {
                        const blobUrl = await fetchBlobUrl(url);
                        if (prefetchQueue.get(i) === 'fetching') {
                            prefetchQueue.set(i, blobUrl);
                        } else {
                            URL.revokeObjectURL(blobUrl);
                        }
                    } catch (err) {
                        console.error("Prefetch failed for index", i, err);
                        prefetchQueue.delete(i);
                    }
                }
            }
            // Cleanup old blobs to free memory
            for (let [key, val] of prefetchQueue.entries()) {
                if (key < fromIndex) {
                    if (typeof val === 'string' && val.startsWith('blob:')) {
                        URL.revokeObjectURL(val);
                    }
                    prefetchQueue.delete(key);
                }
            }
        }
        // ------------------------

        async function playAudio(index) {
            if (index < 0 || index >= manifest.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Start Reading";
                return;
            }
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            audioEl.pause();
            
            try {
                let audioUrl;
                if (prefetchQueue.has(index) && prefetchQueue.get(index) !== 'fetching') {
                    audioUrl = prefetchQueue.get(index);
                } else {
                    const sourceUrl = getAudioUrl(index);
                    audioUrl = await fetchBlobUrl(sourceUrl);
                }
                
                audioEl.src = audioUrl;
                audioEl.playbackRate = speedSlider.value;
                audioEl.onended = () => { playAudio(currentIndex + 1); };
                
                await audioEl.play();
                isPlaying = true;
                
            } catch (e) {
                console.error("Audio play error:", e);
                // Fallback to next track if error
                setTimeout(() => playAudio(currentIndex + 1), 500);
            }
            
            // Trigger prefetch for upcoming sentences
            prefetchNext(index);
        }
    </script>
