wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001598", "originalText": "पवित्रं पावनं इदम् उत्तमं सर्वेषां पावनानां शुद्धिकारणं ब्रह्मज्ञानम् उत्कृष्टतमम्।", "padacchedaText": "", "audioFile": "PB_001598.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001599", "originalText": "अनेकजन्मसहस्रसञ्चितमपि धर्माधर्मादि समूलं कर्म क्षणमात्रादेव भस्मीकरोति इत्यतः किं तस्य पावनत्वं वक्तव्यम्।", "padacchedaText": "", "audioFile": "PB_001599.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001600", "originalText": "किञ्च— प्रत्यक्षावगमं प्रत्यक्षेण सुखादेरिव अवगमो यस्य तत् प्रत्यक्षावगमम्।", "padacchedaText": "", "audioFile": "PB_001600.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001601", "originalText": "अनेकगुणवतोऽपि धर्मविरुद्धत्वं दृष्टम्, न तथा आत्मज्ञानं धर्मविरोधि, किन्तु धर्म्यं धर्मादनपेतम्।", "padacchedaText": "", "audioFile": "PB_001601.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001602", "originalText": "एवमपि, स्याद्दुःखसम्पाद्यमित्यत आह— सुसुखं कर्तुम्, यथा रत्नविवेकविज्ञानम्।", "padacchedaText": "", "audioFile": "PB_001602.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001603", "originalText": "तत्र अल्पायासानामन्येषां कर्मणां सुखसम्पाद्यानाम् अल्पफलत्वं दुष्कराणां च महाफलत्वं दृष्टमिति, इदं तु सुखसम्पाद्यत्वात् फलक्षयात् व्येति इति प्राप्ते, आह— अव्ययम् इति।", "padacchedaText": "", "audioFile": "PB_001603.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001604", "originalText": "न अस्य फलतः कर्मवत् व्ययः अस्तीति अव्ययम्। अतः श्रद्धेयम् आत्मज्ञानम्॥ २॥", "padacchedaText": "", "audioFile": "PB_001604.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001605", "originalText": "ये पुनः—\nअश्रद्दधानाः पुरुषा धर्मस्यास्य परन्तप। अप्राप्य मां निवर्तन्ते मृत्युसंसारवर्त्मनि॥ ३॥", "padacchedaText": "", "audioFile": "PB_001605.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001606", "originalText": "अश्रद्दधानाः श्रद्धाविरहिताः आत्मज्ञानस्य धर्मस्य अस्य स्वरूपे तत्फले च नास्तिकाः पापकारिणः, असुराणाम् उपनिषदं देहमात्रात्मदर्शनमेव प्रतिपन्नाः असुतृपः पापाः पुरुषाः अश्रद्दधानाः, परन्तप, अप्राप्य मां परमेश्वरम्, मत्प्राप्तौ नैव आशङ्का इति मत्प्राप्तिमार्गभेदभक्तिमात्रमपि अप्राप्य इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001606.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001607", "originalText": "निवर्तन्ते निश्चयेन वर्तन्ते, क्व?— मृत्युसंसारवर्त्मनि मृत्युयुक्तः संसारः मृत्युसंसारः तस्य वर्त्म नरकतिर्यगादिप्राप्तिमार्गः, तस्मिन्नेव वर्तन्ते इत्यर्थः॥ ३॥", "padacchedaText": "", "audioFile": "PB_001607.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001608", "originalText": "स्तुत्या अर्जुनमभिमुखीकृत्य आह—\nमया ततमिदं सर्वं जगतदव्यक्तमूर्तिना। मत्स्थानि सर्वभूतानि न चाहं तेष्ववस्थितः॥ ४॥", "padacchedaText": "", "audioFile": "PB_001608.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001609", "originalText": "मया मम यः परो भावः तेन ततं व्याप्तं सर्वम् इदं जगत् अव्यक्तमूर्तिना न व्यक्ता मूर्तिः स्वरूपं यस्य मम सोऽहमव्यक्तमूर्तिः तेन मया अव्यक्तमूर्तिना, करणागोचरस्वरूपेण इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001609.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001610", "originalText": "तस्मिन् मयि अव्यक्तमूर्तौ स्थितानि मत्स्थानि, सर्वभूतानि ब्रह्मादीनि स्तम्बपर्यन्तानि।", "padacchedaText": "", "audioFile": "PB_001610.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001611", "originalText": "न हि निरात्मकं किञ्चित् भूतं व्यवहाराय अवकल्पते।", "padacchedaText": "", "audioFile": "PB_001611.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001612", "originalText": "अतः मत्स्थानि मया आत्मना आत्मवत्त्वेन स्थितानि, अतः मयि स्थितानि इति उच्यन्ते।", "padacchedaText": "", "audioFile": "PB_001612.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001613", "originalText": "तेषां भूतानाम् अहमेव आत्मा इत्यतः तेषु स्थितः इति मूढबुद्धीनां अवभासते, अतः ब्रवीमि— न च अहं तेषु भूतेषु अवस्थितः, मूर्तवत् संश्लेषाभावेन आकाशस्यापि अन्तरतमो हि अहम्।", "padacchedaText": "", "audioFile": "PB_001613.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001614", "originalText": "न हि असंसर्गि वस्तु क्वचित् आधेयभावेन अवस्थितं भवति॥ ४॥", "padacchedaText": "", "audioFile": "PB_001614.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001615", "originalText": "अत एव असंसर्गित्वात् मम—\nन च मत्स्थानि भूतानि पश्य मे योगमैश्वरम्। भूतभृन्न च भूतस्थो ममात्मा भूतभावनः॥ ५॥", "padacchedaText": "", "audioFile": "PB_001615.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001616", "originalText": "न च मत्स्थानि भूतानि ब्रह्मादीनि।", "padacchedaText": "", "audioFile": "PB_001616.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001617", "originalText": "पश्य मे योगं युक्तिं घटनं मे मम ऐश्वरम् ईश्वरस्य इमम् ऐश्वरम्, योगम् आत्मनो याथात्म्यमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_001617.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001618", "originalText": "तथा च श्रुतिः असंसर्गित्वात् असङ्गतां दर्शयति— ‘ असङ्गो न हि सज्जते’ (बृ.३.९.२६) इति।", "padacchedaText": "", "audioFile": "PB_001618.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001619", "originalText": "इदं च आश्चर्यम् अन्यत् पश्य— भूतभृत् असङ्गोऽपि सन् भूतानि बिभर्ति, न च भूतस्थः, यथोक्तेन न्यायेन दर्शितत्वात् भूतस्थत्वानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_001619.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001620", "originalText": "कथं पुनरुच्यते ‘असौ मम आत्मा’ इति? विभज्य देहादिसङ्घातं तस्मिन् अहङ्कारम् अध्यारोप्य लोकबुद्धिम् अनुसरन् व्यपदिशति ‘मम आत्मा’ इति, न पुनः आत्मनः आत्मा अन्यः इति लोकवत् अजानन्।", "padacchedaText": "", "audioFile": "PB_001620.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001621", "originalText": "तथा भूतभावनः भूतानि भावयति उत्पादयति वर्धयतीति वा भूतभावनः॥ ५॥", "padacchedaText": "", "audioFile": "PB_001621.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001622", "originalText": "यथोक्तेन श्लोकद्वयेन उक्तम् अर्थं दृष्टान्तेन उपपादयन् आह—\nयथाकाशस्थितो नित्यं वायुः सर्वत्रगो महान्। तथा सर्वाणि भूतानि मत्स्थानीत्युपधारय॥ ६॥", "padacchedaText": "", "audioFile": "PB_001622.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001623", "originalText": "यथा लोके आकाशस्थितः आकाशे स्थितः नित्यं सदा वायुः सर्वत्र गच्छतीति सर्वत्रगः महान् परिमाणतः, तथा आकाशवत् सर्वगते मयि असंश्लेषेणैव स्थितानि इत्येवम् उपधारय विजानीहि॥ ६॥", "padacchedaText": "", "audioFile": "PB_001623.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001624", "originalText": "एवं वायुः आकाशे इव मयि स्थितानि सर्वभूतानि स्थितिकाले, तानि—\nसर्वभूतानि कौन्तेय प्रकृतिं यान्ति मामिकाम्। कल्पक्षये पुनस्तानि कल्पादौ विसृजाम्यहम्॥ ७॥", "padacchedaText": "", "audioFile": "PB_001624.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001625", "originalText": "सर्वभूतानि कौन्तेय प्रकृतिं त्रिगुणात्मिकाम् अपरां निकृष्टां यान्ति मामिकां मदीयां कल्पक्षये प्रलयकाले। पुनः भूयः तानि भूतानि उत्पत्तिकाले कल्पादौ विसृजामि उत्पादयामि अहं पूर्ववत्॥ ७॥", "padacchedaText": "", "audioFile": "PB_001625.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001626", "originalText": "एवम् अविद्यालक्षणाम्—\nप्रकृतिं स्वामवष्टभ्य विसृजामि पुनः पुनः। भूतग्राममिमं कृत्स्नमवशं प्रकृतेर्वशात्॥ ८॥", "padacchedaText": "", "audioFile": "PB_001626.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001627", "originalText": "प्रकृतिं स्वां स्वीयाम् अवष्टभ्य वशीकृत्य विसृजामि पुनः पुनः प्रकृतितो जातं भूतग्रामं भूतसमुदायम् इमं वर्तमानं कृत्स्नं समग्रम् अवशम् अस्वतन्त्रम्, अविद्यादिदोषैः परवशीकृतम्, प्रकृतेः वशात् स्वभाववशात्॥ ८॥", "padacchedaText": "", "audioFile": "PB_001627.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001628", "originalText": "तर्हि तस्य ते परमेश्वरस्य, भूतग्रामम् इमं विषमं विदधतः, तन्निमित्ताभ्यां धर्माधर्माभ्यां सम्बन्धः स्यादिति, इदम् आह भगवान्—\nन च मां तानि कर्माणि निबध्नन्ति धनञ्जय।", "padacchedaText": "", "audioFile": "PB_001628.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001629", "originalText": "उदासीनवदासीनमसक्तं तेषु कर्मसु॥ ९॥", "padacchedaText": "", "audioFile": "PB_001629.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001630", "originalText": "न च माम् ईश्वरं तानि भूतग्रामस्य विषमसर्गनिमित्तानि कर्माणि निबध्नन्ति धनञ्जय।", "padacchedaText": "", "audioFile": "PB_001630.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001631", "originalText": "तत्र कर्मणां असम्बन्धित्वे कारणमाह— उदासीनवत् आसीनं यथा उदासीनः उपेक्षकः कश्चित् तद्वत् आसीनम्, आत्मनः अविक्रियत्वात्, असक्तं फलासङ्गरहितम्, अभिमानवर्जितम् ‘अहं करोमि’ इति तेषु कर्मसु।", "padacchedaText": "", "audioFile": "PB_001631.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001632", "originalText": "अतः अन्यस्यापि कर्तृत्वाभिमानाभावः फलासङ्गाभावश्च असम्बन्धकारणम्, अन्यथा कर्मभिः बध्यते मूढः कोशकारवत् इत्यभिप्रायः॥ ९॥", "padacchedaText": "", "audioFile": "PB_001632.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001633", "originalText": "तत्र ‘भूतग्राममिमं विसृजामि’ (भ.गी.९.८) ‘उदासीनवदासीनम्’ (भ.गी.९.९) इति च विरुद्धम् उच्यते, इति तत्परिहारार्थम् आह—\nमयाध्यक्षेण प्रकृतिः सूयते सचराचरम्।", "padacchedaText": "", "audioFile": "PB_001633.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001634", "originalText": "हेतुनानेन कौन्तेय जगद्विपरिवर्तते॥ १०॥", "padacchedaText": "", "audioFile": "PB_001634.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001635", "originalText": "मया अध्यक्षेण सर्वतो दृशिमात्रस्वरूपेण अविक्रियात्मना अध्यक्षेण मया, मम माया त्रिगुणात्मिका अविद्यालक्षणा प्रकृतिः सूयते उत्पादयति सचराचरं जगत्।", "padacchedaText": "", "audioFile": "PB_001635.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001636", "originalText": "तथा च मन्त्रवर्णः— ‘एको देवः सर्वभूतेषु गूढः सर्वव्यापी सर्वभूतान्तरात्मा।", "padacchedaText": "", "audioFile": "PB_001636.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001637", "originalText": "कर्माध्यक्षः सर्वभूताधिवासः साक्षी चेता केवलो निर्गुणश्च’ (श्वे.६.११) इति।", "padacchedaText": "", "audioFile": "PB_001637.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001638", "originalText": "हेतुना निमित्तेन अनेन अध्यक्षत्वेन कौन्तेय जगत् सचराचरं व्यक्ताव्यक्तात्मकं विपरिवर्तते सर्वावस्थासु।", "padacchedaText": "", "audioFile": "PB_001638.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001639", "originalText": "दृशिकर्मत्वापत्तिनिमित्ता हि जगतः सर्वा प्रवृत्तिः— अहम् इदं भोक्ष्ये, पश्यामि इदम्, शृणोमि इदम्, सुखमनुभवामि, दुःखमनुभवामि, तदर्थमिदं करिष्ये, इदं ज्ञास्यामि, इत्याद्या अवगतिनिष्ठा अवगत्यवसानैव।", "padacchedaText": "", "audioFile": "PB_001639.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001640", "originalText": "‘यो अस्याध्यक्षः परमे व्योमन्’ (ऋ.१०.१२९.७), (तै.ब्रा.२.८.९) इत्यादयश्च मन्त्राः एतमर्थं दर्शयन्ति।", "padacchedaText": "", "audioFile": "PB_001640.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001641", "originalText": "ततश्च एकस्य देवस्य सर्वाध्यक्षभूतचैतन्यमात्रस्य परमार्थतः सर्वभोगानभिसम्बन्धिनः अन्यस्य चेतनान्तरस्य अभावे भोक्तुः अन्यस्य अभावात्।", "padacchedaText": "", "audioFile": "PB_001641.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001642", "originalText": "किंनिमित्ता इयं सृष्टिः इत्यत्र प्रश्नप्रतिवचने अनुपपन्ने, ‘को अद्धा वेद क इह प्रवोचत्।", "padacchedaText": "", "audioFile": "PB_001642.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001643", "originalText": "कुत आजाता कुत इयं विसृष्टिः’ (ऋ.१०.१२९.६), (तै.ब्रा.२.८.९) इत्यादिमन्त्रवर्णेभ्यः। दर्शितं च भगवता— ‘अज्ञानेनावृतं ज्ञानं तेन मुह्यन्ति जन्तवः’ (भ.गी.५.१५) इति॥ १०॥", "padacchedaText": "", "audioFile": "PB_001643.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001644", "originalText": "एवं मां नित्यशुद्धबुद्धमुक्तस्वभावं सर्वज्ञं सर्वजन्तूनाम् आत्मानमपि सन्तम्—\nअवजानन्ति मां मूढा मानुषीं तनुमाश्रितम्। परं भावमजानन्तो मम भूतमहेश्वरम्॥ ११॥", "padacchedaText": "", "audioFile": "PB_001644.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001645", "originalText": "अवजानन्ति अवज्ञां परिभवं कुर्वन्ति मां मूढाः अविवेकिनः मानुषीं मनुष्यसम्बन्धिनीं तनुं देहम् आश्रितम्, मनुष्यदेहेन व्यवहरन्तमित्येतत्, परं प्रकृष्टं भावं परमात्मतत्त्वम् आकाशकल्पम् आकाशादपि अन्तरतमम् अजानन्तो मम भूतमहेश्वरं सर्वभूतानां महान्तम् ईश्वरं स्वात्मानम्।", "padacchedaText": "", "audioFile": "PB_001645.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001646", "originalText": "ततश्च तस्य मम अवज्ञानभावनेन आहताः ते वराकाः॥ ११॥", "padacchedaText": "", "audioFile": "PB_001646.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001647", "originalText": "कथम्?—\nमोघाशा मोघकर्माणो मोघज्ञाना विचेतसः। राक्षसीमासुरीं चैव प्रकृतिं मोहिनीं श्रिताः॥ १२॥", "padacchedaText": "", "audioFile": "PB_001647.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001648", "originalText": "मोघाशाः वृथा आशाः आशिषः येषां ते मोघाशाः, तथा मोघकर्माणः यानि च अग्निहोत्रादीनि तैः अनुष्ठीयमानानि कर्माणि तानि च, तेषां भगवत्परिभवात्, स्वात्मभूतस्य अवज्ञानात्, मोघान्येव निष्फलानि कर्माणि भवन्तीति मोघकर्माणः।", "padacchedaText": "", "audioFile": "PB_001648.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001649", "originalText": "तथा मोघज्ञानाः मोघं निष्फलं ज्ञानं येषां ते मोघज्ञानाः, ज्ञानमपि तेषां निष्फलमेव स्यात्।", "padacchedaText": "", "audioFile": "PB_001649.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001650", "originalText": "विचेतसः विगतविवेकाश्च ते भवन्ति इत्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_001650.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001651", "originalText": "किञ्च— ते भवन्ति राक्षसीं रक्षसां प्रकृतिं स्वभावम् आसुरीम् असुराणां च प्रकृतिं मोहिनीं मोहकरीं देहात्मवादिनीं श्रिताः आश्रिताः, छिन्द्धि, भिन्द्धि, पिब, खाद, परस्वमपहर, इत्येवं वदनशीलाः क्रूरकर्माणो भवन्ति इत्यर्थः, ‘असुर्या नाम ते लोकाः’ (ई.३) इति श्रुतेः॥ १२॥", "padacchedaText": "", "audioFile": "PB_001651.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001652", "originalText": "ये पुनः श्रद्दधानाः भगवद्भक्तिलक्षणे मोक्षमार्गे प्रवृत्ताः—\nमहात्मानस्तु मां पार्थ दैवीं प्रकृतिमाश्रिताः। भजन्त्यनन्यमनसो ज्ञात्वा भूतादिमव्ययम्॥ १३॥", "padacchedaText": "", "audioFile": "PB_001652.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001653", "originalText": "महात्मानस्तु अक्षुद्रचित्ताः माम् ईश्वरं पार्थ दैवीं देवानां प्रकृतिं शमदमदयाश्रद्धादिलक्षणाम् आश्रिताः सन्तः भजन्ति सेवंते अनन्यमनसः अनन्यचित्ताः ज्ञात्वा भूतादिं भूतानां वियदादीनां प्राणिनां च आदिं कारणम् अव्ययम्॥ १३॥", "padacchedaText": "", "audioFile": "PB_001653.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001654", "originalText": "कथम्?—\nसततं कीर्तयन्तो मां यतन्तश्च दृढव्रताः। नमस्यन्तश्च मां भक्त्या नित्ययुक्ता उपासते॥ १४॥", "padacchedaText": "", "audioFile": "PB_001654.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001655", "originalText": "सततं सर्वदा भगवन्तं ब्रह्मस्वरूपं मां कीर्तयन्तः, यतन्तश्च इन्द्रियोपसंहारशमदमदयाहिंसादिलक्षणैः धर्मैः प्रयतन्तश्च, दृढव्रताः दृढं स्थिरम् अचाल्यं व्रतं येषां ते दृढव्रताः नमस्यन्तश्च मां हृदयेशयम् आत्मानं भक्त्या नित्ययुक्ताः सन्तः उपासते सेवंते॥ १४॥", "padacchedaText": "", "audioFile": "PB_001655.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001656", "originalText": "ते केन केन प्रकारेण उपासते इत्युच्यते—\nज्ञानयज्ञेन चाप्यन्ये यजन्तो मामुपासते। एकत्वेन पृथक्त्वेन बहुधा विश्वतोमुखम्॥ १५॥", "padacchedaText": "", "audioFile": "PB_001656.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001657", "originalText": "ज्ञानयज्ञेन ज्ञानमेव भगवद्विषयं यज्ञः तेन ज्ञानयज्ञेन, यजन्तः पूजयन्तः माम् ईश्वरं च अपि अन्ये अन्याम् उपासनां परित्यज्य उपासते।", "padacchedaText": "", "audioFile": "PB_001657.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001658", "originalText": "तच्च ज्ञानम्— एकत्वेन ‘एकमेव परं ब्रह्म’ इति परमार्थदर्शनेन यजन्तः उपासते।", "padacchedaText": "", "audioFile": "PB_001658.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001659", "originalText": "केचिच्च पृथक्त्वेन ‘आदित्यचन्द्रादिभेदेन स एव भगवान् विष्णुः अवस्थितः’ इति उपासते। केचित् ‘बहुधा अवस्थितः स एव भगवान् सर्वतोमुखः विश्वरूपः’ इति तं विश्वरूपं सर्वतोमुखं बहुधा बहुप्रकारेण उपासते॥ १५॥", "padacchedaText": "", "audioFile": "PB_001659.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001660", "originalText": "यदि बहुभिः प्रकारैः उपासते, कथं त्वामेव उपासते इति, अत आह—\nअहं क्रतुरहं यज्ञः स्वधाहमहमौषधम्। मन्त्रोऽहमहमेवाज्यमहमग्निरहं हुतम्॥ १६॥", "padacchedaText": "", "audioFile": "PB_001660.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001661", "originalText": "अहं क्रतुः श्रौतकर्मभेदः अहमेव।", "padacchedaText": "", "audioFile": "PB_001661.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001662", "originalText": "अहं यज्ञः स्मार्तः।", "padacchedaText": "", "audioFile": "PB_001662.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001663", "originalText": "किञ्च स्वधा अन्नम् अहम्, पितृभ्यो यत् दीयते।", "padacchedaText": "", "audioFile": "PB_001663.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001664", "originalText": "अहम् औषधं सर्वप्राणिभिः यत् अद्यते तत् औषधशब्दशब्दितं व्रीहियवादिसाधारणम्।", "padacchedaText": "", "audioFile": "PB_001664.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001665", "originalText": "अथवा स्वधा इति सर्वप्राणिसाधारणम् अन्नम्, औषधम् इति व्याध्युपशमनार्थं भेषजम्।", "padacchedaText": "", "audioFile": "PB_001665.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001666", "originalText": "मन्त्रः अहम्, येन पितृभ्यो देवताभ्यश्च हविः दीयते।", "padacchedaText": "", "audioFile": "PB_001666.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001667", "originalText": "अहमेव आज्यं हविश्च।", "padacchedaText": "", "audioFile": "PB_001667.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001668", "originalText": "अहम् अग्निः, यस्मिन् हूयते हविः सः अग्निः अहम्। अहं हुतं हवनकर्म च॥ १६॥", "padacchedaText": "", "audioFile": "PB_001668.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001669", "originalText": "किञ्च—\nपिताहमस्य जगतो माता धाता पितामहः। वेद्यं पवित्रमोङ्कार ऋक्साम यजुरेव च॥ १७॥", "padacchedaText": "", "audioFile": "PB_001669.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001670", "originalText": "पिता जनयिता अहम् अस्य जगतः, माता जनयित्री, धाता कर्मफलस्य प्राणिभ्यो विधाता, पितामहः पितुः पिता, वेद्यं वेदितव्यम्, पवित्रं पावनम् ओङ्कारः, ऋक् साम यजुः एव च॥ १७॥", "padacchedaText": "", "audioFile": "PB_001670.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001671", "originalText": "किञ्च—\nगतिर्भर्ता प्रभुः साक्षी निवासः शरणं सुहृत्। प्रभवः प्रलयः स्थानं निधानं बीजमव्ययम्॥ १८॥", "padacchedaText": "", "audioFile": "PB_001671.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001672", "originalText": "गतिः कर्मफलम्, भर्ता पोष्टा, प्रभुः स्वामी, साक्षी प्राणिनां कृताकृतस्य, निवासः यस्मिन् प्राणिनो निवसन्ति, शरणम् आर्तानाम्, प्रपन्नानामार्तिहरः।", "padacchedaText": "", "audioFile": "PB_001672.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001673", "originalText": "सुहृत् प्रत्युपकारानपेक्षः सन् उपकारी, प्रभवः उत्पत्तिः जगतः, प्रलयः प्रलीयते अस्मिन् इति, तथा स्थानं तिष्ठति अस्मिन् इति, निधानं निक्षेपः कालान्तरोपभोग्यं प्राणिनाम्, बीजं प्ररोहकारणं प्ररोहधर्मिणाम्, अव्ययं यावत्संसारभावित्वात् अव्ययम्, न हि अबीजं किञ्चित् प्ररोहति, नित्यं च प्ररोहदर्शनात् बीजसन्ततिः न व्येति इति गम्यते॥ १८॥", "padacchedaText": "", "audioFile": "PB_001673.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001674", "originalText": "किञ्च—\nतपाम्यहमहं वर्षं निगृह्णाम्युत्सृजामि च। अमृतं चैव मृत्युश्च सदसच्चाहमर्जुन॥ १९॥", "padacchedaText": "", "audioFile": "PB_001674.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001675", "originalText": "तपामि अहम् आदित्यो भूत्वा कैश्चित् रश्मिभिः उल्बणैः।", "padacchedaText": "", "audioFile": "PB_001675.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001676", "originalText": "अहं वर्षं कैश्चित् रश्मिभिः उत्सृजामि।", "padacchedaText": "", "audioFile": "PB_001676.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001677", "originalText": "उत्सृज्य पुनः निगृह्णामि कैश्चित् रश्मिभिः अष्टभिः मासैः पुनः उत्सृजामि प्रावृषि।", "padacchedaText": "", "audioFile": "PB_001677.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001678", "originalText": "अमृतं चैव देवानाम्, मृत्युश्च मर्त्यानाम्।", "padacchedaText": "", "audioFile": "PB_001678.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001679", "originalText": "सत् यस्य यत् सम्बन्धितया विद्यमानं तत्, तद्विपरीतम् असच्च एव अहम् अर्जुन।", "padacchedaText": "", "audioFile": "PB_001679.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001680", "originalText": "न पुनः अत्यन्तमेव असत् भगवान्, स्वयं कार्यकारणे वा सदसती ये पूर्वोक्तैः निवृत्तिप्रकारैः एकत्वपृथक्त्वादिविज्ञानैः यज्ञैः मां पूजयन्तः उपासते ज्ञानविदः, ते यथाविज्ञानं मामेव प्राप्नुवन्ति॥ १९॥", "padacchedaText": "", "audioFile": "PB_001680.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001681", "originalText": "ये पुनः अज्ञाः कामकामाः—\nत्रैविद्या मां सोमपाः पूतपापा यज्ञैरिष्ट्वा स्वर्गतिं प्रार्थयन्ते। ते पुण्यमासाद्य सुरेन्द्रलोकमश्नन्ति दिव्यान्दिवि देवभोगान्॥ २०॥", "padacchedaText": "", "audioFile": "PB_001681.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001682", "originalText": "त्रैविद्याः ऋग्यजुःसामविदः मां वस्वादिदेवरूपिणं सोमपाः सोमं पिबन्तीति सोमपाः, तेनैव सोमपानेन पूतपापाः शुद्धकिल्बिषाः, यज्ञैः अग्निष्टोमादिभिः इष्ट्वा पूजयित्वा स्वर्गतिं स्वर्गगमनं स्वरेव गतिः स्वर्गतिः ताम्, प्रार्थयन्ते।", "padacchedaText": "", "audioFile": "PB_001682.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001683", "originalText": "ते च पुण्यं पुण्यफलम् आसाद्य सम्प्राप्य सुरेन्द्रलोकं शतक्रतोः स्थानम् अश्नन्ति भुञ्जते दिव्यान् दिवि भवान् अप्राकृतान् देवभोगान् देवानां भोगान्॥ २०॥", "padacchedaText": "", "audioFile": "PB_001683.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001684", "originalText": "ते तं भुक्त्वा स्वर्गलोकं विशालं\nक्षीणे पुण्ये मर्त्यलोकं विशन्ति। एवं त्रयीधर्ममनुप्रपन्ना\nगतागतं कामकामा लभन्ते॥ २१॥", "padacchedaText": "", "audioFile": "PB_001684.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001685", "originalText": "ते तं भुक्त्वा स्वर्गलोकं विशालं विस्तीर्णं क्षीणे पुण्ये मर्त्यलोकं विशन्ति आविशन्ति।", "padacchedaText": "", "audioFile": "PB_001685.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001686", "originalText": "एवं यथोक्तेन प्रकारेण त्रयीधर्मं केवलं वैदिकं कर्म अनुप्रपन्नाः गतागतं गतं च आगतं च गतागतं गमनागमनं कामकामाः कामान् कामयन्ते इति कामकामाः लभन्ते गतागतमेव, न तु स्वातन्त्र्यं क्वचित् लभन्ते इत्यर्थः॥ २१॥", "padacchedaText": "", "audioFile": "PB_001686.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001687", "originalText": "ये पुनः निष्कामाः सम्यग्दर्शिनः—\nअनन्याश्चिन्तयन्तो मां\nये जनाः पर्युपासते। तेषां नित्याभियुक्तानां\nयोगक्षेमं वहाम्यहम्॥ २२॥", "padacchedaText": "", "audioFile": "PB_001687.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001688", "originalText": "अनन्याः अपृथग्भूताः परं देवं नारायणम् आत्मत्वेन गताः सन्तः चिन्तयन्तः मां ये जनाः संन्यासिनः पर्युपासते, तेषां परमार्थदर्शिनां नित्याभियुक्तानां सतताभियोगिनां योगक्षेमं योगः अप्राप्तस्य प्रापणं क्षेमः तद्रक्षणं तदुभयं वहामि प्रापयामि अहम्, ‘ज्ञानी त्वात्मैव मे मतम्’ (भ.गी.७.१८) ‘स च मम प्रियः’ (भ.गी.७.१७) यस्मात्, तस्मात् ते मम आत्मभूताः प्रियाश्च इति॥", "padacchedaText": "", "audioFile": "PB_001688.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001689", "originalText": "ननु अन्येषामपि भक्तानां योगक्षेमं वहत्येव भगवान्।", "padacchedaText": "", "audioFile": "PB_001689.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001690", "originalText": "सत्यं वहत्येव, किन्तु अयं विशेषः— अन्ये ये भक्ताः ते आत्मार्थं स्वयमपि योगक्षेमम् ईहन्ते, अनन्यदर्शिनस्तु न आत्मार्थं योगक्षेमम् ईहन्ते, न हि ते जीविते मरणे वा आत्मनः गृद्धिं कुर्वन्ति, केवलमेव भगवच्छरणाः ते, अतः भगवानेव तेषां योगक्षेमं वहतीति॥ २२॥", "padacchedaText": "", "audioFile": "PB_001690.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001691", "originalText": "ननु अन्या अपि देवताः त्वमेव चेत्, तद्भक्ताश्च त्वामेव यजन्ते।", "padacchedaText": "", "audioFile": "PB_001691.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001692", "originalText": "सत्यमेवम्—\nयेऽप्यन्यदेवताभक्ता\nयजन्ते श्रद्धयान्विताः। तेऽपि मामेव कौन्तेय\nयजन्त्यविधिपूर्वकम्॥ २३॥", "padacchedaText": "", "audioFile": "PB_001692.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001693", "originalText": "येऽपि अन्यदेवताभक्ताः अन्यासु देवतासु भक्ताः अन्यदेवताभक्ताः सन्तः यजन्ते पूजयन्ति श्रद्धया आस्तिक्यबुद्ध्या अन्विताः अनुगताः, तेऽपि मामेव कौन्तेय यजन्ति अविधिपूर्वकम् अविधिः अज्ञानं तत्पूर्वकं यजन्ते इत्यर्थः॥ २३॥", "padacchedaText": "", "audioFile": "PB_001693.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001694", "originalText": "कस्मात् ते अविधिपूर्वकं यजन्ते इत्युच्यते, यस्मात्—\nअहं हि सर्वयज्ञानां\nभोक्ता च प्रभुरेव च। न तु मामभिजानन्ति\nतत्त्वेनातश्च्यवन्ति ते॥ २४॥", "padacchedaText": "", "audioFile": "PB_001694.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001695", "originalText": "अहं हि सर्वयज्ञानां श्रौतानां स्मार्तानां च सर्वेषां यज्ञानां देवतात्मत्वेन भोक्ता च प्रभुः एव च।", "padacchedaText": "", "audioFile": "PB_001695.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001696", "originalText": "मत्स्वामिको हि यज्ञः, ‘अधियज्ञोऽहमेवात्र’ (भ.गी.८.४) इति हि उक्तम्।", "padacchedaText": "", "audioFile": "PB_001696.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001697", "originalText": "तथा न तु माम् अभिजानन्ति तत्त्वेन यथावत्। अतश्च अविधिपूर्वकम् इष्ट्वा यागफलात् च्यवन्ति प्रच्यवन्ते ते॥ २४॥", "padacchedaText": "", "audioFile": "PB_001697.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001698", "originalText": "येऽपि अन्यदेवताभक्तिमत्त्वेन अविधिपूर्वकं यजन्ते, तेषामपि यागफलं अवश्यंभावि।", "padacchedaText": "", "audioFile": "PB_001698.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001699", "originalText": "कथम्?—\nयान्ति देवव्रता देवान्पितॄन्यान्ति पितृव्रताः। भूतानि यान्ति भूतेज्या यान्ति मद्याजिनोऽपि माम्॥ २५॥", "padacchedaText": "", "audioFile": "PB_001699.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001700", "originalText": "यान्ति गच्छन्ति देवव्रताः देवेषु व्रतं नियमो भक्तिश्च येषां ते देवव्रताः देवान् यान्ति।", "padacchedaText": "", "audioFile": "PB_001700.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001701", "originalText": "पितॄन् अग्निष्वात्तादीन् यान्ति पितृव्रताः श्राद्धादिक्रियापराः पितृभक्ताः।", "padacchedaText": "", "audioFile": "PB_001701.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001702", "originalText": "भूतानि विनायकमातृगणचतुर्भगिन्यादीनि यान्ति भूतेज्याः भूतानां पूजकाः।", "padacchedaText": "", "audioFile": "PB_001702.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001703", "originalText": "यान्ति मद्याजिनः मद्यजनशीलाः वैष्णवाः मामेव यान्ति। समाने अपि आयासे मामेव न भजन्ते अज्ञानात्, तेन ते अल्पफलभाजः भवन्ति इत्यर्थः॥ २५॥", "padacchedaText": "", "audioFile": "PB_001703.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001704", "originalText": "न केवलं मद्भक्तानाम् अनावृत्तिलक्षणम् अनन्तफलम्, सुखाराधनश्च अहम्।", "padacchedaText": "", "audioFile": "PB_001704.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001705", "originalText": "कथम्?—\nपत्रं पुष्पं फलं तोयं यो मे भक्त्या प्रयच्छति। तदहं भक्त्युपहृतमश्नामि प्रयतात्मनः॥ २६॥", "padacchedaText": "", "audioFile": "PB_001705.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001706", "originalText": "पत्रं पुष्पं फलं तोयम् उदकं यः मे मह्यं भक्त्या प्रयच्छति, तत् अहं पत्रादि भक्त्या उपहृतं भक्तिपूर्वकं प्रापितं भक्त्युपहृतम् अश्नामि गृह्णामि प्रयतात्मनः शुद्धबुद्धेः॥ २६॥", "padacchedaText": "", "audioFile": "PB_001706.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001707", "originalText": "यतः एवम्, अतः—\nयत्करोषि यदश्नासि\nयज्जुहोषि ददासि यत्। यत्तपस्यसि कौन्तेय\nतत्कुरुष्व मदर्पणम्॥ २७॥", "padacchedaText": "", "audioFile": "PB_001707.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001708", "originalText": "यत् करोषि स्वतः प्राप्तम्, यत् अश्नासि, यच्च जुहोषि हवनं निर्वर्तयसि श्रौतं स्मार्तं वा, यत् ददासि प्रयच्छसि ब्राह्मणादिभ्यः हिरण्यान्नाज्यादि, यत् तपस्यसि तपः चरसि कौन्तेय, तत् कुरुष्व मदर्पणं मत्समर्पणम्॥ २७॥", "padacchedaText": "", "audioFile": "PB_001708.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001709", "originalText": "एवं कुर्वतः तव यत् भवति, तत् शृणु—\nशुभाशुभफलैरेवं\nमोक्ष्यसे कर्मबन्धनैः। संन्यासयोगयुक्तात्मा\nविमुक्तो मामुपैष्यसि॥ २८॥", "padacchedaText": "", "audioFile": "PB_001709.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001710", "originalText": "शुभाशुभफलैः शुभाशुभे इष्टानिष्टे फले येषां तानि शुभाशुभफलानि कर्माणि तैः शुभाशुभफलैः कर्मबन्धनैः कर्माण्येव बन्धनानि कर्मबन्धनानि तैः कर्मबन्धनैः एवं मदर्पणं कुर्वन् मोक्ष्यसे।", "padacchedaText": "", "audioFile": "PB_001710.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001711", "originalText": "सोऽयं संन्यासयोगो नाम, संन्यासश्च असौ मत्समर्पणतया कर्मत्वात् योगश्च असौ इति, तेन संन्यासयोगेन युक्तः आत्मा अन्तःकरणं यस्य तव सः त्वं संन्यासयोगयुक्तात्मा सन् विमुक्तः कर्मबन्धनैः जीवन्नेव पतिते चास्मिन् शरीरे माम् उपैष्यसि आगमिष्यसि॥ २८॥", "padacchedaText": "", "audioFile": "PB_001711.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001712", "originalText": "रागद्वेषवान् तर्हि भगवान्, यतो भक्तान् अनुगृह्णाति, न इतरान् इति।", "padacchedaText": "", "audioFile": "PB_001712.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001713", "originalText": "तत् न—\nसमोऽहं सर्वभूतेषु\nन मे द्वेष्योऽस्ति न प्रियः। ये भजन्ति तु मां भक्त्या\nमयि ते तेषु चाप्यहम्॥ २९॥", "padacchedaText": "", "audioFile": "PB_001713.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001714", "originalText": "समः तुल्यः अहं सर्वभूतेषु।", "padacchedaText": "", "audioFile": "PB_001714.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001715", "originalText": "न मे द्वेष्यः अस्ति न प्रियः।", "padacchedaText": "", "audioFile": "PB_001715.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001716", "originalText": "अग्निवत् अहम्— दूरस्थानां यथा अग्निः शीतं न अपनयति, समीपम् उपसर्पतां अपनयति, तथा अहं भक्तान् अनुगृह्णामि, न इतरान्।", "padacchedaText": "", "audioFile": "PB_001716.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001717", "originalText": "ये भजन्ति तु माम् ईश्वरं भक्त्या मयि ते— स्वभावत एव, न मम रागनिमित्तम्— वर्तन्ते।", "padacchedaText": "", "audioFile": "PB_001717.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001718", "originalText": "तेषु च अपि अहं स्वभावत एव वर्ते, न इतरेषु। न एतावता तेषु द्वेषो मम॥ २९॥", "padacchedaText": "", "audioFile": "PB_001718.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001719", "originalText": "शृणु मद्भक्तेर्माहात्म्यम्—\nअपि चेत्सुदुराचारो\nभजते मामनन्यभाक्। साधुरेव स मन्तव्यः\nसम्यग्व्यवसितो हि सः॥ ३०॥", "padacchedaText": "", "audioFile": "PB_001719.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001720", "originalText": "अपि चेत् यद्यपि सुदुराचारः सुष्ठु दुराचारः अतीव कुत्सिताचारोऽपि भजते माम् अनन्यभाक् अनन्यभक्तिः सन्, साधुरेव सम्यग्वृत्त एव सः मन्तव्यः ज्ञातव्यः, सम्यक् यथावत् व्यवसितो हि सः, यस्मात् साधुनिश्चयः सः॥ ३०॥", "padacchedaText": "", "audioFile": "PB_001720.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001721", "originalText": "उत्सृज्य च बाह्यां दुराचारतां अन्तः सम्यग्व्यवसायसामर्थ्यात्—\nक्षिप्रं भवति धर्मात्मा\nशश्वच्छान्तिं निगच्छति। कौन्तेय प्रतिजानीहि\nन मे भक्तः प्रणश्यति॥ ३१॥", "padacchedaText": "", "audioFile": "PB_001721.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001722", "originalText": "क्षिप्रं शीघ्रं भवति धर्मात्मा धर्मचित्तः एव।", "padacchedaText": "", "audioFile": "PB_001722.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001723", "originalText": "शश्वत् नित्यं शान्तिं च उपशमं निगच्छति प्राप्नोति। शृणु परमार्थम्, कौन्तेय प्रतिजानीहि निश्चितां प्रतिज्ञां कुरु, न मे मम भक्तः मयि समर्पितान्तरात्मा मद्भक्तः न प्रणश्यति इति॥ ३१॥", "padacchedaText": "", "audioFile": "PB_001723.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001724", "originalText": "किञ्च—\nमां हि पार्थ व्यपाश्रित्य येऽपि स्युः पापयोनयः। स्त्रियो वैश्यास्तथा शूद्रास्तेऽपि यान्ति परां गतिम्॥ ३२॥", "padacchedaText": "", "audioFile": "PB_001724.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001725", "originalText": "मां हि यस्मात् पार्थ व्यपाश्रित्य माम् आश्रयत्वेन गृहीत्वा येऽपि स्युः भवेयुः पापयोनयः पापा योनिः येषां ते पापयोनयः पापजन्मानः। के ते इति, आह— स्त्रियः वैश्याः तथा शूद्राः तेऽपि यान्ति गच्छन्ति परां प्रकृष्टां गतिम्॥ ३२॥", "padacchedaText": "", "audioFile": "PB_001725.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001726", "originalText": "किं पुनर्ब्राह्मणाः पुण्या भक्ता राजर्षयस्तथा। अनित्यमसुखं लोकमिमं प्राप्य भजस्व माम्॥ ३३॥", "padacchedaText": "", "audioFile": "PB_001726.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001727", "originalText": "किं पुनः ब्राह्मणाः पुण्याः पुण्ययोनयः भक्ताः राजर्षयः तथा।", "padacchedaText": "", "audioFile": "PB_001727.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001728", "originalText": "राजानश्च ते ऋषयश्च राजर्षयः। यतः एवम्, अतः अनित्यं क्षणभङ्गुरम् असुखं च सुखवर्जितम् इमं लोकं मनुष्यलोकं प्राप्य पुरुषार्थसाधनं दुर्लभं मनुष्यत्वं लब्ध्वा भजस्व सेवस्व माम्॥ ३३॥", "padacchedaText": "", "audioFile": "PB_001728.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001729", "originalText": "कथम्—\nमन्मना भव मद्भक्तो मद्याजी मां नमस्कुरु। मामेवैष्यसि युक्त्वैवमात्मानं मत्परायणः॥ ३४॥", "padacchedaText": "", "audioFile": "PB_001729.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001730", "originalText": "मयि वासुदेवे मनः यस्य तव स त्वं मन्मनाः भव।", "padacchedaText": "", "audioFile": "PB_001730.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001731", "originalText": "तथा मद्भक्तः भव मद्याजी मद्यजनशीलः भव।", "padacchedaText": "", "audioFile": "PB_001731.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001732", "originalText": "माम् एव च नमस्कुरु।", "padacchedaText": "", "audioFile": "PB_001732.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001733", "originalText": "माम् एव ईश्वरम् एष्यसि आगमिष्यसि युक्त्वा समाधाय चित्तम्। एवम् आत्मानम्, अहं हि सर्वेषां भूतानाम् आत्मा, परा च गतिः, परम् अयनम्, तं माम् एवंभूतम्, एष्यसि इति अतीतेन सम्बन्धः, मत्परायणः सन् इत्यर्थः॥ ३४॥", "padacchedaText": "", "audioFile": "PB_001733.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001734", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ श्रीमद्भगवद्गीताभाष्ये नवमोऽध्यायः॥", "padacchedaText": "", "audioFile": "PB_001734.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001735", "originalText": "दशमोऽध्यायः\nसप्तमे अध्याये भगवतस्तत्त्वं विभूतयश्च प्रकाशिताः, नवमे च।", "padacchedaText": "", "audioFile": "PB_001735.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001736", "originalText": "अथ इदानीं येषु येषु भावेषु चिन्त्यो भगवान्, ते ते भावा वक्तव्याः, तत्त्वं च भगवतो वक्तव्यम् उक्तमपि, दुर्विज्ञेयत्वात्, इत्यतः श्रीभगवानुवाच—\nश्रीभगवानुवाच—\nभूय एव महाबाहो शृणु मे परमं वचः।", "padacchedaText": "", "audioFile": "PB_001736.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001737", "originalText": "यत्तेऽहं प्रीयमाणाय वक्ष्यामि हितकाम्यया॥ १॥", "padacchedaText": "", "audioFile": "PB_001737.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001738", "originalText": "भूयः एव भूयः पुनः हे महाबाहो शृणु मे मदीयं परमं प्रकृष्टं निरतिशयवस्तुनः प्रकाशकं वचः वाक्यं यत् परमं ते तुभ्यं प्रीयमाणाय— मद्वचनात् प्रीयसे त्वम् अतीव अमृतमिव पिबन्, ततः— वक्ष्यामि हितकाम्यया हितेच्छया॥ १॥", "padacchedaText": "", "audioFile": "PB_001738.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001739", "originalText": "किमर्थम् अहं वक्ष्यामि इत्यत आह—\nन मे विदुः सुरगणाः प्रभवं न महर्षयः। अहमादिर्हि देवानां महर्षीणां च सर्वशः॥ २॥", "padacchedaText": "", "audioFile": "PB_001739.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001740", "originalText": "न मे विदुः न जानन्ति सुरगणाः ब्रह्मादयः।", "padacchedaText": "", "audioFile": "PB_001740.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001741", "originalText": "किं ते न विदुः? मम प्रभवं प्रभावं प्रभुशक्त्यतिशयम्, अथवा प्रभवं प्रभवनम् उत्पत्तिम्।", "padacchedaText": "", "audioFile": "PB_001741.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001742", "originalText": "नापि महर्षयः भृग्वादयः विदुः। कस्मात् ते न विदुरित्युच्यते— अहम् आदिः कारणं हि यस्मात् देवानां महर्षीणां च सर्वशः सर्वप्रकारैः॥ २॥", "padacchedaText": "", "audioFile": "PB_001742.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001743", "originalText": "किञ्च—\nयो मामजमनादिं च वेत्ति लोकमहेश्वरम्। असंमूढः स मर्त्येषु सर्वपापैः प्रमुच्यते॥ ३॥", "padacchedaText": "", "audioFile": "PB_001743.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001744", "originalText": "यः माम् अजम् अनादिं च, यस्मात् अहम् आदिः देवानां महर्षीणां च, न मम अन्यः आदिः विद्यते, अतः अहम् अजः अनादिश्च, अनादित्वम् अजत्वे हेतुः, तं माम् अजम् अनादिं च यः वेत्ति विजानाति लोकमहेश्वरं लोकानां महान्तम् ईश्वरं तुरीयम् अज्ञानतत्कार्यवर्जितम् असंमूढः संमोहवर्जितः सः मर्त्येषु मनुष्येषु, सर्वपापैः सर्वैः पापैः मतिपूर्वामतिपूर्वकृतैः प्रमुच्यते प्रमोक्ष्यते॥ ३॥", "padacchedaText": "", "audioFile": "PB_001744.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001745", "originalText": "इतश्चाहं महेश्वरो लोकानाम्—\nबुद्धिर्ज्ञानमसंमोहः क्षमा सत्यं दमः शमः। सुखं दुःखं भवोऽभावो भयं चाभयमेव च॥ ४॥", "padacchedaText": "", "audioFile": "PB_001745.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001746", "originalText": "बुद्धिः अन्तःकरणस्य सूक्ष्माद्यर्थावबोधनसामर्थ्यम्, तद्वन्तं बुद्धिमानिति हि वदन्ति।", "padacchedaText": "", "audioFile": "PB_001746.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001747", "originalText": "ज्ञानम् आत्मादिपदार्थानामवबोधः।", "padacchedaText": "", "audioFile": "PB_001747.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001748", "originalText": "असंमोहः प्रत्युत्पन्नेषु बोद्धव्येषु विवेकपूर्विका प्रवृत्तिः।", "padacchedaText": "", "audioFile": "PB_001748.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001749", "originalText": "क्षमा आक्रुष्टस्य ताडितस्य वा अविकृतचित्तता।", "padacchedaText": "", "audioFile": "PB_001749.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001750", "originalText": "सत्यं यथादृष्टस्य यथाश्रुतस्य च आत्मानुभवस्य परबुद्धिसङ्क्रान्तये तथैव उच्चार्यमाणा वाक् सत्यम् उच्यते।", "padacchedaText": "", "audioFile": "PB_001750.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001751", "originalText": "दमः बाह्येन्द्रियोपशमः।", "padacchedaText": "", "audioFile": "PB_001751.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001752", "originalText": "शमः अन्तःकरणस्य उपशमः।", "padacchedaText": "", "audioFile": "PB_001752.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001753", "originalText": "सुखम् आह्लादः।", "padacchedaText": "", "audioFile": "PB_001753.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001754", "originalText": "दुःखं सन्तापः।", "padacchedaText": "", "audioFile": "PB_001754.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001755", "originalText": "भवः उद्भवः।", "padacchedaText": "", "audioFile": "PB_001755.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001756", "originalText": "अभावः तद्विपर्ययः। भयं च त्रासः, अभयमेव च तद्विपरीतम्॥ ४॥", "padacchedaText": "", "audioFile": "PB_001756.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001757", "originalText": "अहिंसा समता तुष्टिस्तपो दानं यशोऽयशः। भवन्ति भावा भूतानां मत्त एव पृथग्विधाः॥ ५॥", "padacchedaText": "", "audioFile": "PB_001757.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001758", "originalText": "अहिंसा अपीडा प्राणिनाम्।", "padacchedaText": "", "audioFile": "PB_001758.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001759", "originalText": "समता समचित्तता।", "padacchedaText": "", "audioFile": "PB_001759.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001760", "originalText": "तुष्टिः सन्तोषः पर्याप्तबुद्धिर्लाभेषु।", "padacchedaText": "", "audioFile": "PB_001760.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001761", "originalText": "तपः इन्द्रियसंयमपूर्वकं शरीरपीडनम्।", "padacchedaText": "", "audioFile": "PB_001761.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001762", "originalText": "दानं यथाशक्ति संविभागः।", "padacchedaText": "", "audioFile": "PB_001762.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001763", "originalText": "यशः धर्मनिमित्ता कीर्तिः।", "padacchedaText": "", "audioFile": "PB_001763.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001764", "originalText": "अयशस्तु अधर्मनिमित्ता अकीर्तिः। भवन्ति भावाः यथोक्ताः बुद्ध्यादयः भूतानां प्राणिनां मत्तः एव ईश्वरात् पृथग्विधाः नानाविधाः स्वकर्मानुरूपेण॥ ५॥", "padacchedaText": "", "audioFile": "PB_001764.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001765", "originalText": "किञ्च—\nमहर्षयः सप्त पूर्वे चत्वारो मनवस्तथा। मद्भावा मानसा जाता येषां लोक इमाः प्रजाः॥ ६॥", "padacchedaText": "", "audioFile": "PB_001765.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001766", "originalText": "महर्षयः सप्त भृग्वादयः पूर्वे अतीतकालसम्बन्धिनः, चत्वारः मनवः तथा सावर्णा इति प्रसिद्धाः, ते च मद्भावाः मद्गतभावनाः वैष्णवेन सामर्थ्येन उपेताः, मानसाः मनसैव उत्पादिताः मया जाताः उत्पन्नाः, येषां मनूनां महर्षीणां च सृष्टिः लोके इमाः स्थावरजङ्गमलक्षणाः प्रजाः॥ ६॥", "padacchedaText": "", "audioFile": "PB_001766.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001767", "originalText": "एतां विभूतिं योगं च मम यो वेत्ति तत्त्वतः। सोऽविकम्पेन योगेन युज्यते नात्र संशयः॥ ७॥", "padacchedaText": "", "audioFile": "PB_001767.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001768", "originalText": "एतां यथोक्तां विभूतिं विस्तारं योगं च युक्तिं च आत्मनः घटनम्, अथवा योगैश्वर्यसामर्थ्यं सर्वज्ञत्वं योगजं योगः उच्यते, मम मदीयं योगं यः वेत्ति तत्त्वतः तत्त्वेन यथावदित्येतत्, सः अविकम्पेन अप्रचलितेन योगेन सम्यग्दर्शनस्थैर्यलक्षणेन युज्यते सम्बध्यते।", "padacchedaText": "", "audioFile": "PB_001768.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001769", "originalText": "न अत्र संशयः न अस्मिन् अर्थे संशयः अस्ति॥ ७॥", "padacchedaText": "", "audioFile": "PB_001769.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001770", "originalText": "कीदृशेन अविकम्पेन योगेन युज्यते इत्युच्यते—\nअहं सर्वस्य प्रभवो मत्तः सर्वं प्रवर्तते। इति मत्वा भजन्ते मां बुधा भावसमन्विताः॥ ८॥", "padacchedaText": "", "audioFile": "PB_001770.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001771", "originalText": "अहं परं ब्रह्म वासुदेवाख्यं सर्वस्य जगतः प्रभवः उत्पत्तिः।", "padacchedaText": "", "audioFile": "PB_001771.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001772", "originalText": "मत्तः एव स्थितिनाशक्रियाफलोपभोगलक्षणं विक्रियारूपं सर्वं जगत् प्रवर्तते। इति एवं मत्वा भजन्ते सेवंते मां बुधाः अवगतपरमार्थतत्त्वाः, भावसमन्विताः भावः भावना परमार्थतत्त्वाभिनिवेशः तेन समन्विताः संयुक्ताः इत्यर्थः॥ ८॥", "padacchedaText": "", "audioFile": "PB_001772.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001773", "originalText": "किञ्च—\nमच्चित्ता मद्गतप्राणा बोधयन्तः परस्परम्। कथयन्तश्च मां नित्यं तुष्यन्ति च रमन्ति च॥ ९॥", "padacchedaText": "", "audioFile": "PB_001773.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001774", "originalText": "मच्चित्ताः, मयि चित्तं येषां ते मच्चित्ताः, मद्गतप्राणाः मां गताः प्राप्ताः चक्षुरादयः प्राणाः येषां ते मद्गतप्राणाः, मयि उपसंहृतकरणाः इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001774.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001775", "originalText": "अथवा, मद्गतप्राणाः मद्गतजीवनाः इत्येतत्।", "padacchedaText": "", "audioFile": "PB_001775.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001776", "originalText": "बोधयन्तः अवगमयन्तः परस्परम् अन्योन्यम्, कथयन्तश्च ज्ञानबलवीर्यादिधर्मैः विशिष्टं माम्, तुष्यन्ति च परितोषम् उपयान्ति च रमन्ति च रतिं च प्राप्नुवन्ति प्रियसङ्गत्येव॥ ९॥", "padacchedaText": "", "audioFile": "PB_001776.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001777", "originalText": "ये यथोक्तैः प्रकारैः भजन्ते मां भक्ताः सन्तः—\nतेषां सततयुक्तानां भजतां प्रीतिपूर्वकम्। ददामि बुद्धियोगं तं येन मामुपयान्ति ते॥ १०॥", "padacchedaText": "", "audioFile": "PB_001777.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001778", "originalText": "तेषां सततयुक्तानां नित्याभियुक्तानां निवृत्तसर्वबाह्यैषणानां भजतां सेवमानानाम्।", "padacchedaText": "", "audioFile": "PB_001778.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001779", "originalText": "किम् अर्थित्वादिना कारणेन? नेत्याह— प्रीतिपूर्वकं प्रीतिः स्नेहः तत्पूर्वकं मां भजतामित्यर्थः।", "padacchedaText": "", "audioFile": "PB_001779.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001780", "originalText": "ददामि प्रयच्छामि बुद्धियोगं बुद्धिः सम्यग्दर्शनं मत्तत्त्वविषयं तेन योगः बुद्धियोगः तं बुद्धियोगम्, येन बुद्धियोगेन सम्यग्दर्शनलक्षणेन मां परमेश्वरम् आत्मभूतम् आत्मत्वेन उपयान्ति प्रतिपद्यन्ते।", "padacchedaText": "", "audioFile": "PB_001780.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001781", "originalText": "के? ते ये मच्चित्तत्वादिप्रकारैः मां भजन्ते॥ १०॥", "padacchedaText": "", "audioFile": "PB_001781.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001782", "originalText": "किमर्थम्, कस्य वा, त्वत्प्राप्तिप्रतिबन्धहेतोः नाशकं बुद्धियोगं तेषां त्वद्भक्तानां ददासि इत्यपेक्षायामाह—\nतेषामेवानुकम्पार्थमहमज्ञानजं तमः। नाशयाम्यात्मभावस्थो ज्ञानदीपेन भास्वता॥ ११॥", "padacchedaText": "", "audioFile": "PB_001782.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001783", "originalText": "तेषामेव कथं नु नाम श्रेयः स्यात् इति अनुकम्पार्थं दयाहेतोः अहम् अज्ञानजम् अविवेकतः जातं मिथ्याप्रत्ययलक्षणं मोहान्धकारं तमः नाशयामि, आत्मभावस्थः आत्मनः भावः अन्तःकरणाशयः तस्मिन्नेव स्थितः सन् ज्ञानदीपेन विवेकप्रत्ययरूपेण भक्तिप्रसादस्नेहाभिषिक्तेन मद्भावनाभिनिवेशवातेरितेन ब्रह्मचर्यादिसाधनसंस्कारवत्प्रज्ञावर्तिना विरक्तान्तःकरणाधारेण विषयव्यावृत्तचित्तरागद्वेषाकलुषितनिवातापवरकस्थेन नित्यप्रवृत्तैकाग्र्यध्यानजनितसम्यग्दर्शनभास्वता ज्ञानदीपेनेत्यर्थः॥ ११॥", "padacchedaText": "", "audioFile": "PB_001783.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001784", "originalText": "यथोक्तां भगवतः विभूतिं योगं च श्रुत्वा अर्जुन उवाच—\nअर्जुन उवाच—\nपरं ब्रह्म परं धाम पवित्रं परमं भवान्। पुरुषं शाश्वतं दिव्यमादिदेवमजं विभुम्॥ १२॥", "padacchedaText": "", "audioFile": "PB_001784.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001785", "originalText": "परं ब्रह्म परमात्मा परं धाम परं तेजः पवित्रं पावनं परमं प्रकृष्टं भवान्। पुुुरुषं शाश्वतं नित्यं दिव्यं दिवि भवम् आदिदेवं सर्वदेवानाम् आदौ भवम् आदिदेवम् अजं विभुं विभवनशीलम्॥ १२॥", "padacchedaText": "", "audioFile": "PB_001785.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001786", "originalText": "ईदृशम्—\nआहुस्त्वामृषयः सर्वे देवर्षिर्नारदस्तथा। असितो देवलो व्यासः स्वयं चैव ब्रवीषि मे॥ १३॥", "padacchedaText": "", "audioFile": "PB_001786.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001787", "originalText": "आहुः कथयन्ति त्वाम् ऋषयः वसिष्ठादयः सर्वे देवर्षिः नारदः तथा। असितः देवलोऽपि एवमेवाह, व्यासश्च, स्वयं चैव त्वं च ब्रवीषि मे॥ १३॥", "padacchedaText": "", "audioFile": "PB_001787.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001788", "originalText": "सर्वमेतदृतं मन्ये यन्मां वदसि केशव। न हि ते भगवन्व्यक्तिं विदुर्देवा न दानवाः॥ १४॥", "padacchedaText": "", "audioFile": "PB_001788.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001789", "originalText": "सर्वमेतत् यथोक्तम् ऋषिभिः त्वया च एतत् ऋतं सत्यमेव मन्ये, यत् मां प्रति वदसि भाषसे हे केशव। न हि ते तव भगवन् व्यक्तिं प्रभवं विदुः न देवाः, न दानवाः॥ १४॥", "padacchedaText": "", "audioFile": "PB_001789.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001790", "originalText": "यतः त्वं देवादीनाम् आदिः, अतः—\nस्वयमेवात्मनात्मानं वेत्थ त्वं पुरुषोत्तम। भूतभावन भूतेश देवदेव जगत्पते॥ १५॥", "padacchedaText": "", "audioFile": "PB_001790.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001791", "originalText": "स्वयमेव आत्मना आत्मानं वेत्थ जानासि त्वं निरतिशयज्ञानैश्वर्यबलादिशक्तिमन्तम् ईश्वरं पुरुषोत्तम।", "padacchedaText": "", "audioFile": "PB_001791.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001792", "originalText": "भूतानि भावयतीति भूतभावनः, हे भूतभावन।", "padacchedaText": "", "audioFile": "PB_001792.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001793", "originalText": "भूतेश भूतानाम् ईशितः। हे देवदेव जगत्पते॥ १५॥", "padacchedaText": "", "audioFile": "PB_001793.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001794", "originalText": "वक्तुमर्हस्यशेषेण दिव्या ह्यात्मविभूतयः। याभिर्विभूतिभिर्लोकानिमांस्त्वं व्याप्य तिष्ठसि॥ १६॥", "padacchedaText": "", "audioFile": "PB_001794.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001795", "originalText": "वक्तुं कथयितुम् अर्हसि अशेषेण।", "padacchedaText": "", "audioFile": "PB_001795.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001796", "originalText": "दिव्याः हि आत्मविभूतयः।", "padacchedaText": "", "audioFile": "PB_001796.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001797", "originalText": "आत्मनो विभूतयो याः ताः वक्तुम् अर्हसि। याभिः विभूतिभिः आत्मनो माहात्म्यविस्तरैः इमान् लोकान् त्वं व्याप्य तिष्ठसि॥ १६॥", "padacchedaText": "", "audioFile": "PB_001797.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001798", "originalText": "कथं विद्यामहं योगिंस्त्वां सदा परिचिन्तयन्। केषु केषु च भावेषु चिन्त्योऽसि भगवन्मया॥ १७॥", "padacchedaText": "", "audioFile": "PB_001798.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001799", "originalText": "कथं विद्यां विजानीयाम् अहं हे योगिन् त्वां सदा परिचिन्तयन्। केषु केषु च भावेषु वस्तुषु चिन्त्यः असि ध्येयः असि भगवन् मया॥ १७॥", "padacchedaText": "", "audioFile": "PB_001799.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001800", "originalText": "विस्तरेणात्मनो योगं विभूतिं च जनार्दन। भूयः कथय तृप्तिर्हि शृण्वतो नास्ति मेऽमृतम्॥ १८॥", "padacchedaText": "", "audioFile": "PB_001800.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001801", "originalText": "विस्तरेण आत्मनः योगं योगैश्वर्यशक्तिविशेषं विभूतिं च विस्तरं ध्येयपदार्थानां हे जनार्दन, अर्दतेः गतिकर्मणः रूपम्, असुराणां देवप्रतिपक्षभूतानां जनानां नरकादिगमयितृत्वात् जनार्दनः अभ्युदयनिःश्रेयसपुरुषार्थप्रयोजनं सर्वैः जनैः याच्यते इति वा।", "padacchedaText": "", "audioFile": "PB_001801.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001802", "originalText": "भूयः पूर्वम् उक्तमपि कथय, तृप्तिः परितोषः हि यस्मात् नास्ति मे मम शृण्वतः त्वन्मुखनिःसृतवाक्यामृतम्॥ १८॥", "padacchedaText": "", "audioFile": "PB_001802.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001803", "originalText": "श्रीभगवानुवाच—\nहन्त ते कथयिष्यामि दिव्या ह्यात्मविभूतयः। प्राधान्यतः कुरुश्रेष्ठ नास्त्यन्तो विस्तरस्य मे॥ १९॥", "padacchedaText": "", "audioFile": "PB_001803.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001804", "originalText": "हन्त इदानीं ते तव दिव्याः दिवि भवाः आत्मविभूतयः आत्मनः मम विभूतयः याः ताः कथयिष्यामि इत्येतत्।", "padacchedaText": "", "audioFile": "PB_001804.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001805", "originalText": "प्राधान्यतः यत्र यत्र प्रधाना या या विभूतिः तां तां प्रधानां प्राधान्यतः कथयिष्यामि अहं कुरुश्रेष्ठ। अशेषतस्तु वर्षशतेनापि न शक्या वक्तुम्, यतः नास्ति अन्तः विस्तरस्य मे मम विभूतीनाम् इत्यर्थः॥ १९॥", "padacchedaText": "", "audioFile": "PB_001805.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001806", "originalText": "तत्र प्रथममेव तावत् शृणु—\nअहमात्मा गुडाकेश सर्वभूताशयस्थितः। अहमादिश्च मध्यं च भूतानामन्त एव च॥ २०॥", "padacchedaText": "", "audioFile": "PB_001806.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001807", "originalText": "अहम् आत्मा प्रत्यगात्मा गुडाकेश, गुडाका निद्रा तस्याः ईशः गुडाकेशः, जितनिद्रः इत्यर्थः, घनकेश इति वा।", "padacchedaText": "", "audioFile": "PB_001807.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001808", "originalText": "सर्वभूताशयस्थितः सर्वेषां भूतानाम् आशये अन्तर्हृदि स्थितः अहम् आत्मा प्रत्यगात्मा नित्यं ध्येयः। तदशक्तेन च उत्तरेषु भावेषु चिन्त्यः अहम्, यस्मात् अहम् एव आदिः भूतानां कारणं तथा मध्यं च स्थितिः अन्तः प्रलयश्च॥ २०॥", "padacchedaText": "", "audioFile": "PB_001808.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001809", "originalText": "एवं च ध्येयोऽहम्—\nआदित्यानामहं विष्णुर्ज्योतिषां रविरंशुमान्। मरीचिर्मरुतामस्मि नक्षत्राणामहं शशी॥ २१॥", "padacchedaText": "", "audioFile": "PB_001809.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001810", "originalText": "आदित्यानां द्वादशानां विष्णुः नाम आदित्यः अहम्।", "padacchedaText": "", "audioFile": "PB_001810.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001811", "originalText": "ज्योतिषां रविः प्रकाशयितॄणाम् अंशुमान् रश्मिमान्।", "padacchedaText": "", "audioFile": "PB_001811.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001812", "originalText": "मरीचिः नाम मरुतां मरुद्देवताभेदानाम् अस्मि। नक्षत्राणाम् अहं शशी चन्द्रमाः॥ २१॥", "padacchedaText": "", "audioFile": "PB_001812.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001813", "originalText": "वेदानां सामवेदोऽस्मि देवानामस्मि वासवः। इन्द्रियाणां मनश्चास्मि भूतानामस्मि चेतना॥ २२॥", "padacchedaText": "", "audioFile": "PB_001813.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001814", "originalText": "वेदानां मध्ये सामवेदः अस्मि।", "padacchedaText": "", "audioFile": "PB_001814.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001815", "originalText": "देवानां रुद्रादित्यादीनां वासवः इन्द्रः अस्मि।", "padacchedaText": "", "audioFile": "PB_001815.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001816", "originalText": "इन्द्रियाणां एकादशानां चक्षुरादीनां मनश्च अस्मि सङ्कल्पविकल्पात्मकं मनश्चास्मि। भूतानाम् अस्मि चेतना कार्यकरणसङ्घाते नित्याभिव्यक्ता बुद्धिवृत्तिः चेतना॥ २२॥", "padacchedaText": "", "audioFile": "PB_001816.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001817", "originalText": "रुद्राणां शङ्करश्चास्मि वित्तेशो यक्षरक्षसाम्। वसूनां पावकश्चास्मि मेरुः शिखरिणामहम्॥ २३॥", "padacchedaText": "", "audioFile": "PB_001817.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001818", "originalText": "रुद्राणाम् एकादशानां शङ्करश्च अस्मि।", "padacchedaText": "", "audioFile": "PB_001818.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001819", "originalText": "वित्तेशः कुबेरः यक्षरक्षसां यक्षाणां रक्षसां च।", "padacchedaText": "", "audioFile": "PB_001819.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001820", "originalText": "वसूनाम् अष्टानां पावकश्च अस्मि अग्निः। मेरुः शिखरिणां शिखरवताम् अहम्॥ २३॥", "padacchedaText": "", "audioFile": "PB_001820.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001821", "originalText": "पुरोधसां च मुख्यं मां विद्धि पार्थ बृहस्पतिम्। सेनानीनामहं स्कन्दः सरसामस्मि सागरः॥ २४॥", "padacchedaText": "", "audioFile": "PB_001821.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001822", "originalText": "पुरोधसां च राजपुरोहितानां च मुख्यं प्रधानं मां विद्धि हे पार्थ बृहस्पतिम्।", "padacchedaText": "", "audioFile": "PB_001822.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001823", "originalText": "स हि इन्द्रस्येति मुख्यः स्यात् पुरोधाः।", "padacchedaText": "", "audioFile": "PB_001823.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001824", "originalText": "सेनानीनां सेनापतीनाम् अहं स्कन्दः देवसेनापतिः। सरसां यानि देवखातानि सरांसि तेषां सरसां सागरः अस्मि भवामि॥ २४॥", "padacchedaText": "", "audioFile": "PB_001824.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001825", "originalText": "महर्षीणां भृगुरहं गिरामस्म्येकमक्षरम्। यज्ञानां जपयज्ञोऽस्मि स्थावराणां हिमालयः॥ २५॥", "padacchedaText": "", "audioFile": "PB_001825.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001826", "originalText": "महर्षीणां भृगुः अहम्।", "padacchedaText": "", "audioFile": "PB_001826.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001827", "originalText": "गिरां वाचां पदलक्षणानाम् एकम् अक्षरम् ओङ्कारः अस्मि। यज्ञानां जपयज्ञः अस्मि, स्थावराणां स्थितिमतां हिमालयः॥ २५॥", "padacchedaText": "", "audioFile": "PB_001827.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001828", "originalText": "अश्वत्थः सर्ववृक्षाणां देवर्षीणां च नारदः। गन्धर्वाणां चित्ररथः सिद्धानां कपिलो मुनिः॥ २६॥", "padacchedaText": "", "audioFile": "PB_001828.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001829", "originalText": "अश्वत्थः सर्ववृक्षाणाम्, देवर्षीणां च नारदः देवाः एव सन्तः ऋषित्वं प्राप्ताः मन्त्रदर्शित्वात्ते देवर्षयः, तेषां नारदः अस्मि।", "padacchedaText": "", "audioFile": "PB_001829.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001830", "originalText": "गन्धर्वाणां चित्ररथः नाम गन्धर्वः अस्मि। सिद्धानां जन्मनैव धर्मज्ञानवैराग्यैश्वर्यातिशयं प्राप्तानां कपिलो मुनिः॥ २६॥", "padacchedaText": "", "audioFile": "PB_001830.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001831", "originalText": "उच्चैःश्रवसमश्वानां विद्धि माममृतोद्भवम्। ऐरावतं गजेन्द्राणां नराणां च नराधिपम्॥ २७॥", "padacchedaText": "", "audioFile": "PB_001831.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001832", "originalText": "उच्चैःश्रवसम् अश्वानां उच्चैःश्रवाः नाम अश्वराजः तं मां विद्धि विजानीहि अमृतोद्भवम् अमृतनिमित्तमथनोद्भवम्।", "padacchedaText": "", "audioFile": "PB_001832.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001833", "originalText": "ऐरावतम् इरावत्याः अपत्यं गजेन्द्राणां हस्तीश्वराणाम्, तम् ‘मां विद्धि’ इति अनुवर्तते। नराणां च मनुष्याणां नराधिपं राजानं मां विद्धि जानीहि॥ २७॥", "padacchedaText": "", "audioFile": "PB_001833.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001834", "originalText": "आयुधानामहं वज्रं धेनूनामस्मि कामधुक्। प्रजनश्चास्मि कन्दर्पः सर्पाणामस्मि वासुकिः॥ २८॥", "padacchedaText": "", "audioFile": "PB_001834.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001835", "originalText": "आयुधानाम् अहं वज्रं दधीच्यस्थिसम्भवम्।", "padacchedaText": "", "audioFile": "PB_001835.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001836", "originalText": "धेनूनां दोग्ध्रीणाम् अस्मि कामधुक् वसिष्ठस्य सर्वकामानां दोग्ध्री, सामान्या वा कामधुक्। प्रजनः प्रजनयिता अस्मि कन्दर्पः कामः सर्पाणां सर्पभेदानाम् अस्मि वासुकिः सर्पराजः॥ २८॥", "padacchedaText": "", "audioFile": "PB_001836.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001837", "originalText": "अनन्तश्चास्मि नागानां वरुणो यादसामहम्। पितॄणामर्यमा चास्मि यमः संयमतामहम्॥ २९॥", "padacchedaText": "", "audioFile": "PB_001837.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001838", "originalText": "अनन्तश्च अस्मि नागानां नागविशेषाणां नागराजश्च अस्मि।", "padacchedaText": "", "audioFile": "PB_001838.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001839", "originalText": "वरुणो यादसाम् अहम् अब्देवतानां राजा अहम्।", "padacchedaText": "", "audioFile": "PB_001839.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001840", "originalText": "पितॄणाम् अर्यमा नाम पितृराजश्च अस्मि। यमः संयमतां संयमनं कुर्वताम् अहम्॥ २९॥", "padacchedaText": "", "audioFile": "PB_001840.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001841", "originalText": "प्रह्लादश्चास्मि दैत्यानां कालः कलयतामहम्। मृगाणां च मृगेन्द्रोऽहं वैनतेयश्च पक्षिणाम्॥ ३०॥", "padacchedaText": "", "audioFile": "PB_001841.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001842", "originalText": "प्रह्लादो नाम च अस्मि दैत्यानां दितिवंश्यानाम्।", "padacchedaText": "", "audioFile": "PB_001842.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001843", "originalText": "कालः कलयतां कलनं गणनं कुर्वताम् अहम्।", "padacchedaText": "", "audioFile": "PB_001843.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001844", "originalText": "मृगाणां च मृगेन्द्रः सिंहो व्याघ्रो वा अहम्। वैनतेयश्च गरुत्मान् विनतासुतः पक्षिणां पतत्रिणाम्॥ ३०॥", "padacchedaText": "", "audioFile": "PB_001844.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001845", "originalText": "पवनः पवतामस्मि रामः शस्त्रभृतामहम्। झषाणां मकरश्चास्मि स्रोतसामस्मि जाह्नवी॥ ३१॥", "padacchedaText": "", "audioFile": "PB_001845.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001846", "originalText": "पवनः वायुः पवतां पावयितॄणाम् अस्मि।", "padacchedaText": "", "audioFile": "PB_001846.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001847", "originalText": "रामः शस्त्रभृताम् अहं शस्त्राणां धारयितॄणां दाशरथिः रामः अहम्।", "padacchedaText": "", "audioFile": "PB_001847.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001848", "originalText": "झषाणां मत्स्यादीनां मकरः नाम जातिविशेषः अहम्। स्रोतसां स्रवन्तीनाम् अस्मि जाह्नवी गङ्गा॥ ३१॥", "padacchedaText": "", "audioFile": "PB_001848.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001849", "originalText": "सर्गाणामादिरन्तश्च मध्यं चैवाहमर्जुन। अध्यात्मविद्या विद्यानां वादः प्रवदतामहम्॥ ३२॥", "padacchedaText": "", "audioFile": "PB_001849.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001850", "originalText": "सर्गाणां सृष्टीनाम् आदिः अन्तश्च मध्यं चैव अहम् उत्पत्तिस्थितिलयाः अहम् अर्जुन।", "padacchedaText": "", "audioFile": "PB_001850.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001851", "originalText": "भूतानां जीवाधिष्ठितानामेव आदिः अन्तश्च इत्याद्युक्तम् उपक्रमे, इह तु सर्वस्यैव सर्गमात्रस्य इति विशेषः।", "padacchedaText": "", "audioFile": "PB_001851.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001852", "originalText": "अध्यात्मविद्या विद्यानां मोक्षार्थत्वात् प्रधानमस्मि।", "padacchedaText": "", "audioFile": "PB_001852.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001853", "originalText": "वादः अर्थनिर्णयहेतुत्वात् प्रवदतां प्रधानम्, अतः सः अहम् अस्मि। प्रवत्त्कृद्वारेण वदनभेदानामेव वादजल्पवितण्डानाम् इह ग्रहणं प्रवदताम् इति॥ ३२॥", "padacchedaText": "", "audioFile": "PB_001853.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001854", "originalText": "अक्षराणामकारोऽस्मि\nद्वन्द्वः सामासिकस्य च। अहमेवाक्षयः कालो\nधाताहं विश्वतोमुखः॥ ३३॥", "padacchedaText": "", "audioFile": "PB_001854.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001855", "originalText": "अक्षराणां वर्णानाम् अकारः वर्णः अस्मि।", "padacchedaText": "", "audioFile": "PB_001855.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001856", "originalText": "द्वन्द्वः समासः अस्मि सामासिकस्य च समाससमूहस्य।", "padacchedaText": "", "audioFile": "PB_001856.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001857", "originalText": "किञ्च अहमेव अक्षयः अक्षीणः कालः प्रसिद्धः क्षणाद्याख्यः, अथवा परमेश्वरः कालस्यापि कालः अस्मि। धाता अहं कर्मफलस्य विधाता सर्वजगतः विश्वतोमुखः सर्वतोमुखः॥ ३३॥", "padacchedaText": "", "audioFile": "PB_001857.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001858", "originalText": "मृत्युः सर्वहरश्चाहमुद्भवश्च भविष्यताम्। कीर्तिः श्रीर्वाक्च नारीणां स्मृतिर्मेधा धृतिः क्षमा॥ ३४॥", "padacchedaText": "", "audioFile": "PB_001858.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001859", "originalText": "मृत्युः द्विविधः धनादिहरः प्राणहरश्च, तत्र यः प्राणहरः, स सर्वहरः उच्यते, सः अहम् इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001859.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001860", "originalText": "अथवा, परः ईश्वरः प्रलये सर्वहरणात् सर्वहरः, सः अहम्।", "padacchedaText": "", "audioFile": "PB_001860.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001861", "originalText": "उद्भवः उत्कर्षः अभ्युदयः तत्प्राप्तिहेतुश्च अहम्।", "padacchedaText": "", "audioFile": "PB_001861.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001862", "originalText": "केषाम्? भविष्यतां भाविकल्याणानाम्, उत्कर्षप्राप्तियोग्यानाम् इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001862.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001863", "originalText": "कीर्तिः श्रीः वाक् च नारीणां स्मृतिः मेधा धृतिः क्षमा इत्येताः उत्तमाः स्त्रीणाम् अहम् अस्मि, यासाम् आभासमात्रसम्बन्धेनापि लोकः कृतार्थमात्मानं मन्यते॥ ३४॥", "padacchedaText": "", "audioFile": "PB_001863.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001864", "originalText": "बृहत्साम तथा साम्नां गायत्री च्छन्दसामहम्। मासानां मार्गशीर्षोऽहमृतूनां कुसुमाकरः॥ ३५॥", "padacchedaText": "", "audioFile": "PB_001864.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001865", "originalText": "बृहत्साम तथा साम्नां प्रधानमस्मि।", "padacchedaText": "", "audioFile": "PB_001865.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001866", "originalText": "गायत्री च्छन्दसाम् अहं गायत्र्यादिच्छन्दोविशिष्टानामृचां गायत्री ऋक् अहम् अस्मि इत्यर्थः। मासानां मार्गशीर्षः अहम्, ऋतूनां कुसुमाकरः वसन्तः॥ ३५॥", "padacchedaText": "", "audioFile": "PB_001866.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001867", "originalText": "द्यूतं छलयतामस्मि\nतेजस्तेजस्विनामहम्। जयोऽस्मि व्यवसायोऽस्मि\nसत्त्वं सत्त्ववतामहम्॥ ३६॥", "padacchedaText": "", "audioFile": "PB_001867.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001868", "originalText": "द्यूतम् अक्षदेवनादिलक्षणं छलयतां छलस्य कर्तॄणाम् अस्मि।", "padacchedaText": "", "audioFile": "PB_001868.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001869", "originalText": "तेजस्विनां तेजः अहम्। जयः अस्मि जेतॄणाम्, व्यवसायः अस्मि व्यवसायिनाम्, सत्त्वं सत्त्ववतां सात्त्विकानाम् अहम्॥ ३६॥", "padacchedaText": "", "audioFile": "PB_001869.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001870", "originalText": "वृष्णीनां वासुदेवोऽस्मि\nपाण्डवानां धनञ्जयः। मुनीनामप्यहं व्यासः\nकवीनामुशना कविः॥ ३७॥", "padacchedaText": "", "audioFile": "PB_001870.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001871", "originalText": "वृष्णीनां यादवानां वासुदेवः अस्मि अयमेव अहं त्वत्सखः।", "padacchedaText": "", "audioFile": "PB_001871.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001872", "originalText": "पाण्डवानां धनञ्जयः\nत्वमेव। मुनीनां मननशीलानां सर्वपदार्थज्ञानिनाम् अपि अहं व्यासः, कवीनां क्रान्तदर्शिनाम् उशना कविः अस्मि॥ ३७॥", "padacchedaText": "", "audioFile": "PB_001872.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001873", "originalText": "दण्डो दमयतामस्मि\nनीतिरस्मि जिगीषताम्। मौनं चैवास्मि गुह्यानां\nज्ञानं ज्ञानवतामहम्॥ ३८॥", "padacchedaText": "", "audioFile": "PB_001873.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001874", "originalText": "दण्डः दमयतां दमयितॄणाम् अस्मि अदान्तानां दमनकारणम्।", "padacchedaText": "", "audioFile": "PB_001874.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001875", "originalText": "नीतिः अस्मि जिगीषतां जेतुमिच्छताम्।", "padacchedaText": "", "audioFile": "PB_001875.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001876", "originalText": "मौनं चैव अस्मि गुह्यानां गोप्यानाम्। ज्ञानं ज्ञानवताम् अहम्॥ ३८॥", "padacchedaText": "", "audioFile": "PB_001876.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001877", "originalText": "यच्चापि सर्वभूतानां बीजं तदहमर्जुन। न तदस्ति विना यत्स्यान्मया भूतं चराचरम्॥ ३९॥", "padacchedaText": "", "audioFile": "PB_001877.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001878", "originalText": "यच्चापि सर्वभूतानां बीजं प्ररोहकारणम्, तत् अहम् अर्जुन।", "padacchedaText": "", "audioFile": "PB_001878.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001879", "originalText": "प्रकरणोपसंहारार्थं विभूतिसङ्क्षेपमाह— न तत् अस्ति भूतं चराचरं चरम् अचरं वा, मया विना यत् स्यात् भवेत्।", "padacchedaText": "", "audioFile": "PB_001879.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001880", "originalText": "मया अपकृष्टं परित्यक्तं निरात्मकं शून्यं हि तत् स्यात्। अतः मदात्मकं सर्वमित्यर्थः॥ ३९॥", "padacchedaText": "", "audioFile": "PB_001880.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001881", "originalText": "नान्तोऽस्ति मम दिव्यानां\nविभूतीनां परन्तप। एष तूद्देशतः प्रोक्तो\nविभूतेर्विस्तरो मया॥ ४०॥", "padacchedaText": "", "audioFile": "PB_001881.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001882", "originalText": "न अन्तः अस्ति मम दिव्यानां विभूतीनां विस्तराणां परन्तप।", "padacchedaText": "", "audioFile": "PB_001882.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001883", "originalText": "न हि ईश्वरस्य सर्वात्मनः दिव्यानां विभूतीनाम् इयत्ता शक्या वक्तुं ज्ञातुं वा केनचित्। एष तु उद्देशतः एकदेशेन प्रोक्तः विभूतेः विस्तरः मया॥ ४०॥", "padacchedaText": "", "audioFile": "PB_001883.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001884", "originalText": "यद्यद्विभूतिमत्सत्त्वं श्रीमदूर्जितमेव वा। तत्तदेवावगच्छ त्वं मम तेजोंशसम्भवम्॥ ४१॥", "padacchedaText": "", "audioFile": "PB_001884.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001885", "originalText": "यद्यत् लोके विभूतिमत् विभूतियुक्तं सत्त्वं वस्तु श्रीमत् ऊर्जितमेव वा श्रीर्लक्ष्मीः तया सहितम् उत्साहोपेतं वा, तत्तदेव अवगच्छ त्वं जानीहि मम ईश्वरस्य तेजोंशसम्भवं तेजसः अंशः एकदेशः सम्भवः यस्य तत् तेजोंशसम्भवमिति अवगच्छ त्वम्॥ ४१॥", "padacchedaText": "", "audioFile": "PB_001885.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001886", "originalText": "अथवा बहुनैतेन किं ज्ञातेन तवार्जुन। विष्टभ्याहमिदं कृत्स्नमेकांशेन स्थितो जगत्॥ ४२॥", "padacchedaText": "", "audioFile": "PB_001886.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001887", "originalText": "अथवा बहुना एतेन एवमादिना किं ज्ञातेन तव अर्जुन स्यात् सावशेषेण।", "padacchedaText": "", "audioFile": "PB_001887.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001888", "originalText": "अशेषतः त्वम् उच्यमानम् अर्थं शृणु— विष्टभ्य विशेषतः स्तम्भनं दृढं कृत्वा इदं कृत्स्नं जगत् एकांशेन एकावयवेन एकपादेन, सर्वभूतस्वरूपेण इत्येतत्, तथा च मन्त्रवर्णः— ‘पादोऽस्य विश्वा भूतानि’ (ऋ.१०.८.९०.३) इति, स्थितः अहम् इति॥ ४२॥", "padacchedaText": "", "audioFile": "PB_001888.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001889", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ श्रीमद्भगवद्गीताभाष्ये दशमोऽध्यायः॥", "padacchedaText": "", "audioFile": "PB_001889.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001890", "originalText": "एकादशोऽध्यायः\nभगवतो विभूतय उक्ताः।", "padacchedaText": "", "audioFile": "PB_001890.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001891", "originalText": "तत्र च ‘विष्टभ्याहमिदं कृत्स्नमेकांशेन स्थितो जगत्’ (भ.गी.१०.४२) इति भगवता अभिहितं श्रुत्वा, यत् जगदात्मरूपम् आद्यमैश्वरं तत् साक्षात्कर्तुमिच्छन्, अर्जुन उवाच—\nअर्जुन उवाच—\nमदनुग्रहाय परमं गुह्यमध्यात्मसंज्ञितम्।", "padacchedaText": "", "audioFile": "PB_001891.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001892", "originalText": "यत्त्वयोक्तं वचस्तेन मोहोऽयं विगतो मम॥ १॥", "padacchedaText": "", "audioFile": "PB_001892.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001893", "originalText": "मदनुग्रहाय ममानुग्रहार्थं परमं निरतिशयं गुह्यं गोप्यम् अध्यात्मसंज्ञितम् आत्मानात्मविवेकविषयं यत् त्वया उक्तं वचः वाक्यं तेन ते वचसा मोहः अयं विगतः मम, अविवेकबुद्धिः अपगता इत्यर्थः॥ १॥", "padacchedaText": "", "audioFile": "PB_001893.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001894", "originalText": "किञ्च—\nभवाप्ययौ हि भूतानां श्रुतौ विस्तरशो मया। त्वत्तः कमलपत्राक्ष माहात्म्यमपि चाव्ययम्॥ २॥", "padacchedaText": "", "audioFile": "PB_001894.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001895", "originalText": "भवः उत्पत्तिः अप्ययः प्रलयः तौ भवाप्ययौ हि भूतानां श्रुतौ विस्तरशः मया, न सङ्क्षेपतः, त्वत्तः त्वत्सकाशात्, कमलपत्राक्ष कमलस्य पत्रं कमलपत्रं तद्वत् अक्षिणी यस्य तव स त्वं कमलपत्राक्षः हे कमलपत्राक्ष, महात्मनः भावः माहात्म्यमपि च अव्ययम् अक्षयम् ‘श्रुतम्’ इति अनुवर्तते॥ २॥", "padacchedaText": "", "audioFile": "PB_001895.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001896", "originalText": "एवमेतद्यथात्थ त्वमात्मानं परमेश्वर। द्रष्टुमिच्छामि ते रूपमैश्वरं पुरुषोत्तम॥ ३॥", "padacchedaText": "", "audioFile": "PB_001896.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001897", "originalText": "एवमेतत् नान्यथा यथा येन प्रकारेण आत्थ कथयसि त्वम् आत्मानं परमेश्वर। तथापि द्रष्टुमिच्छामि ते तव ज्ञानैश्वर्यशक्तिबलवीर्यतेजोभिः सम्पन्नम् ऐश्वरं वैष्णवं रूपं पुरुषोत्तम॥ ३॥", "padacchedaText": "", "audioFile": "PB_001897.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001898", "originalText": "मन्यसे यदि तच्छक्यं मया द्रष्टुमिति प्रभो। योगेश्वर ततो मे त्वं दर्शयात्मानमव्ययम्॥ ४॥", "padacchedaText": "", "audioFile": "PB_001898.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001899", "originalText": "मन्यसे चिन्तयसि यदि मया अर्जुनेन तत् शक्यं द्रष्टुम् इति प्रभो, स्वामिन्, योगेश्वर योगिनो योगाः, तेषां ईश्वरः योगेश्वरः, हे योगेश्वर। यस्मात् अहम् अतीव अर्थी द्रष्टुम्, ततः तस्मात् मे मदर्थं दर्शय त्वम् आत्मानम् अव्ययम्॥ ४॥", "padacchedaText": "", "audioFile": "PB_001899.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001900", "originalText": "एवं चोदितः अर्जुनेन भगवान् उवाच—\nश्रीभगवानुवाच—\nपश्य मे पार्थ रूपाणि शतशोऽथ सहस्रशः। नानाविधानि दिव्यानि नानावर्णाकृतीनि च॥ ५॥", "padacchedaText": "", "audioFile": "PB_001900.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001901", "originalText": "पश्य मे पार्थ, रूपाणि शतशः अथ सहस्रशः, अनेकशः इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001901.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001902", "originalText": "तानि च नानाविधानि अनेकप्रकाराणि दिवि भवानि दिव्यानि अप्राकृतानि नानावर्णाकृतीनि च नाना विलक्षणाः नीलपीतादिप्रकाराः वर्णाः तथा आकृतयश्च अवयवसंस्थानविशेषाः येषां रूपाणां तानि नानावर्णाकृतीनि च॥ ५॥", "padacchedaText": "", "audioFile": "PB_001902.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001903", "originalText": "पश्यादित्यान्वसून्रुद्रानश्विनौ मरुतस्तथा। बहून्यदृष्टपूर्वाणि पश्याश्चर्याणि भारत॥ ६॥", "padacchedaText": "", "audioFile": "PB_001903.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001904", "originalText": "पश्य आदित्यान् द्वादश, वसून् अष्टौ, रुद्रान् एकादश, अश्विनौ द्वौ, मरुतः सप्त सप्त गणाः ये तान्। तथा च बहूनि अन्यान्यपि अदृष्टपूर्वाणि मनुष्यलोके त्वया, त्वत्तः अन्येन वा केनचित्, पश्य आश्चर्याणि अद्भुतानि भारत॥ ६॥", "padacchedaText": "", "audioFile": "PB_001904.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001905", "originalText": "न केवलम् एतावदेव—\nइहैकस्थं जगत्कृत्स्नं पश्याद्य सचराचरम्। मम देहे गुडाकेश यच्चान्यद्द्रष्टुमिच्छसि॥ ७॥", "padacchedaText": "", "audioFile": "PB_001905.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001906", "originalText": "इह एकस्थम् एकस्मिन्नेव स्थितं जगत् कृत्स्नं समस्तं पश्य अद्य इदानीं सचराचरं सह चरेण अचरेण च वर्तते मम देहे गुडाकेश। यच्च अन्यत् जयपराजयादि, यत् शङ्कसे, ‘यद्वा जयेम यदि वा नो जयेयुः’ (भ.गी.२.६) इति यत् अवोचः, तदपि द्रष्टुं यदि इच्छसि॥ ७॥", "padacchedaText": "", "audioFile": "PB_001906.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001907", "originalText": "किं तु—\nन तु मां शक्यसे द्रष्टुमनेनैव स्वचक्षुषा। दिव्यं ददामि ते चक्षुः पश्य मे योगमैश्वरम्॥ ८॥", "padacchedaText": "", "audioFile": "PB_001907.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001908", "originalText": "न तु मां विश्वरूपधरं शक्यसे द्रष्टुम् अनेनैव प्राकृतेन स्वचक्षुषा स्वकीयेन चक्षुषा।", "padacchedaText": "", "audioFile": "PB_001908.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001909", "originalText": "येन तु शक्यसे द्रष्टुं दिव्येन, तत् दिव्यं ददामि ते तुभ्यं चक्षुः। तेन पश्य मे योगम् ऐश्वरम् ईश्वरस्य मम ऐश्वरं योगं योगशक्त्यतिशयम् इत्यर्थः॥ ८॥", "padacchedaText": "", "audioFile": "PB_001909.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001910", "originalText": "सञ्जय उवाच—\nएवमुक्त्वा ततो राजन्महायोगेश्वरो हरिः। दर्शयामास पार्थाय परमं रूपमैश्वरम्॥ ९॥", "padacchedaText": "", "audioFile": "PB_001910.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001911", "originalText": "एवं यथोक्तप्रकारेण उक्त्वा ततः अनन्तरं राजन् धृतराष्ट्र, महायोगेश्वरः महांश्च असौ योगेश्वरश्च हरिः नारायणः दर्शयामास दर्शितवान् पार्थाय पृथासुताय परमं रूपं विश्वरूपम् ऐश्वरम्॥ ९॥", "padacchedaText": "", "audioFile": "PB_001911.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001912", "originalText": "अनेकवक्त्रनयनमनेकाद्भुतदर्शनम्। अनेकदिव्याभरणं दिव्यानेकोद्यतायुधम्॥ १०॥", "padacchedaText": "", "audioFile": "PB_001912.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001913", "originalText": "अनेकवक्त्रनयनम् अनेकानि वक्त्राणि नयनानि च यस्मिन् रूपे तत् अनेकवक्त्रनयनम्, अनेकाद्भुतदर्शनम् अनेकानि अद्भुतानि विस्मापकानि दर्शनानि यस्मिन् रूपे तत् अनेकाद्भुतदर्शनं रूपम्, तथा अनेकदिव्याभरणम् अनेकानि दिव्यानि आभरणानि यस्मिन् तत् अनेकदिव्याभरणम्, तथा दिव्यानेकोद्यतायुधं दिव्यानि अनेकानि अस्यादीनि उद्यतानि आयुधानि यस्मिन् तत् दिव्यानेकोद्यतायुधम्, ‘दर्शयामास’ इति पूर्वेण सम्बन्धः॥ १०॥", "padacchedaText": "", "audioFile": "PB_001913.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001914", "originalText": "किञ्च—\nदिव्यमाल्याम्बरधरं दिव्यगन्धानुलेपनम्। सर्वाश्चर्यमयं देवमनन्तं विश्वतोमुखम्॥ ११॥", "padacchedaText": "", "audioFile": "PB_001914.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001915", "originalText": "दिव्यमाल्याम्बरधरं दिव्यानि माल्यानि पुष्पाणि अम्बराणि वस्त्राणि च ध्रियन्ते येन ईश्वरेण तं दिव्यमाल्याम्बरधरम्, दिव्यगन्धानुलेपनं दिव्यं गन्धानुलेपनं यस्य तं दिव्यगन्धानुलेपनम्, सर्वाश्चर्यमयं सर्वाश्चर्यप्रायं देवम् अनन्तं न अस्य अन्तः अस्ति इति अनन्तः तम्, विश्वतोमुखं सर्वतोमुखं सर्वभूतात्मभूतत्वात्, तं दर्शयामास।", "padacchedaText": "", "audioFile": "PB_001915.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001916", "originalText": "‘अर्जुनः ददर्श’ इति वा अध्याह्रियते॥ ११॥", "padacchedaText": "", "audioFile": "PB_001916.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001917", "originalText": "या पुनर्भगवतः विश्वरूपस्य भाः, तस्या उपमा उच्यते—\nदिवि सूर्यसहस्रस्य भवेद्युगपदुत्थिता। यदि भाः सदृशी सा स्याद्भासस्तस्य महात्मनः॥ १२॥", "padacchedaText": "", "audioFile": "PB_001917.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001918", "originalText": "दिवि अन्तरिक्षे तृतीयस्यां वा दिवि सूर्याणां सहस्रं सूर्यसहस्रं तस्य युगपदुत्थितस्य सूर्यसहस्रस्य या युगपदुत्थिता भाः, सा यदि, सदृशी स्यात् तस्य महात्मनः विश्वरूपस्यैव भासः।", "padacchedaText": "", "audioFile": "PB_001918.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001919", "originalText": "यदि वा न स्यात्, ततः विश्वरूपस्यैव भाः अतिरिच्यते इत्यभिप्रायः॥ १२॥", "padacchedaText": "", "audioFile": "PB_001919.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001920", "originalText": "किञ्च—\nतत्रैकस्थं जगत्कृत्स्नं प्रविभक्तमनेकधा। अपश्यद्देवदेवस्य शरीरे पाण्डवस्तदा॥ १३॥", "padacchedaText": "", "audioFile": "PB_001920.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001921", "originalText": "तत्र तस्मिन् विश्वरूपे एकस्मिन् स्थितम् एकस्थं जगत् कृत्स्नं प्रविभक्तम् अनेकधा देवपितृमनुष्यादिभेदैः अपश्यत् दृष्टवान् देवदेवस्य हरेः शरीरे पाण्डवः अर्जुनः तदा॥ १३॥", "padacchedaText": "", "audioFile": "PB_001921.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001922", "originalText": "ततः स विस्मयाविष्टो हृष्टरोमा धनञ्जयः। प्रणम्य शिरसा देवं कृताञ्जलिरभाषत॥ १४॥", "padacchedaText": "", "audioFile": "PB_001922.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001923", "originalText": "ततः तं दृष्ट्वा सः विस्मयेन आविष्टः विस्मयाविष्टः हृष्टानि रोमाणि यस्य सः अयं हृष्टरोमा च अभवत् धनञ्जयः। प्रणम्य प्रकर्षेण नमनं कृत्वा प्रह्वीभूतः सन् शिरसा देवं विश्वरूपधरं कृताञ्जलिः नमस्कारार्थं सम्पुटीकृतहस्तः सन् अभाषत उक्तवान्॥ १४॥", "padacchedaText": "", "audioFile": "PB_001923.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001924", "originalText": "कथम्? यत् त्वया दर्शितं विश्वरूपम्, तत् अहं पश्यामीति स्वानुभवमाविष्कुर्वन् अर्जुन उवाच—\nअर्जुन उवाच—\nपश्यामि देवांस्तव देव देहे सर्वांस्तथा भूतविशेषसङ्घान्।", "padacchedaText": "", "audioFile": "PB_001924.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001925", "originalText": "ब्रह्माणमीशं कमलासनस्थमृषींश्च सर्वानुरगांश्च दिव्यान्॥ १५॥", "padacchedaText": "", "audioFile": "PB_001925.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001926", "originalText": "पश्यामि उपलभे हे देव, तव देहे देवान् सर्वान्, तथा भूतविशेषसङ्घान् भूतविशेषाणां स्थावरजङ्गमानां नानासंस्थानविशेषाणां सङ्घाः भूतविशेषसङ्घाः तान्, किञ्च— ब्रह्माणं चतुर्मुखम् ईशम् ईशितारं प्रजानां कमलासनस्थं पृथिवीपद्ममध्ये मेरुकर्णिकासनस्थमित्यर्थः, ऋषींश्च वसिष्ठादीन् सर्वान्, उरगांश्च वासुकिप्रभृतीन् दिव्यान् दिवि भवान्॥ १५॥", "padacchedaText": "", "audioFile": "PB_001926.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001927", "originalText": "अनेकबाहूदरवक्त्रनेत्रं\nपश्यामि त्वा सर्वतोऽनन्तरूपम्। नान्तं न मध्यं न पुनस्तवादिं\nपश्यामि विश्वेश्वर विश्वरूप॥ १६॥", "padacchedaText": "", "audioFile": "PB_001927.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001928", "originalText": "अनेकबाहूदरवक्त्रनेत्रम् अनेके बाहवः उदराणि वक्त्राणि नेत्राणि च यस्य तव सः त्वम् अनेकबाहूदरवक्त्रनेत्रः तम् अनेकबाहूदरवक्त्रनेत्रम्।", "padacchedaText": "", "audioFile": "PB_001928.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001929", "originalText": "पश्यामि त्वा त्वां सर्वतः सर्वत्र अनन्तरूपम् अनन्तानि रूपाणि अस्य इति अनन्तरूपः तम् अनन्तरूपम्।", "padacchedaText": "", "audioFile": "PB_001929.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001930", "originalText": "न अन्तम्, अन्तः अवसानम्, न मध्यम्, मध्यं नाम द्वयोः कोट्योः अन्तरम्, न पुनः तव आदिम्— न देवस्य अन्तं पश्यामि, न मध्यं पश्यामि, न पुनः आदिं पश्यामि, हे विश्वेश्वर विश्वरूप॥ १६॥", "padacchedaText": "", "audioFile": "PB_001930.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001931", "originalText": "किञ्च—\nकिरीटिनं गदिनं चक्रिणं च तेजोराशिं सर्वतोदीप्तिमन्तम्। पश्यामि त्वां दुर्निरीक्ष्यं समन्ताद्दीप्तानलार्कद्युतिमप्रमेयम्॥ १७॥", "padacchedaText": "", "audioFile": "PB_001931.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001932", "originalText": "किरीटिनं किरीटं नाम शिरोभूषणविशेषः तत् यस्य अस्ति सः किरीटी तं किरीटिनम्, तथा गदिनं गदा अस्य विद्यते इति गदी तं गदिनम्, तथा चक्रिणं चक्रम् अस्य अस्तीति चक्री तं चक्रिणं च, तेजोराशिं तेजःपुञ्जं सर्वतोदीप्तिमन्तं सर्वतोदीप्तिः अस्य अस्तीति सर्वतोदीप्तिमान्, तं सर्वतोदीप्तिमन्तं पश्यामि त्वां दुर्निरीक्ष्यं दुःखेन निरीक्ष्यः दुर्निरीक्ष्यः तं दुर्निरीक्ष्यं समन्तात् समन्ततः सर्वत्र दीप्तानलार्कद्युतिम् अनलश्च अर्कश्च अनलार्कौ दीप्तौ अनलार्कौ दीप्तानलार्कौ तयोः दीप्तानलार्कयोः द्युतिरिव द्युतिः तेजः यस्य तव स त्वं दीप्तानलार्कद्युतिः तं त्वां दीप्तानलार्कद्युतिम्, अप्रमेयं न प्रमेयम् अशक्यपरिच्छेदम् इत्येतत्॥ १७॥", "padacchedaText": "", "audioFile": "PB_001932.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001933", "originalText": "इत
