्मना समाधिपरिशुद्धेन अन्तःकरणेन आत्मानं परं चैतन्यं ज्योतिःस्वरूपं पश्यन् उपलभमानः स्वे एव आत्मनि तुष्यति तुष्टिं भजते॥ २०॥", "padacchedaText": "", "audioFile": "PB_001284.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001285", "originalText": "किञ्च—\nसुखमात्यन्तिकं यत्तद्बुद्धिग्राह्यमतीन्द्रियम्। वेत्ति यत्र न चैवायं स्थितश्चलति तत्त्वतः॥ २१॥", "padacchedaText": "", "audioFile": "PB_001285.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001286", "originalText": "सुखम् आत्यन्तिकं अत्यन्तमेव भवति इत्यात्यन्तिकम् अनन्तमित्यर्थः, यत् तत् बुद्धिग्राह्यं बुद्ध्यैव इन्द्रियनिरपेक्षया गृह्यते इति बुद्धिग्राह्यम् अतीन्द्रियम् इन्द्रियगोचरातीतम् अविषयजनितमित्यर्थः, वेत्ति तत् ईदृशं सुखमनुभवति यत्र यस्मिन् काले, न च एव अयं विद्वान् आत्मस्वरूपे स्थितः तस्मात् नैव चलति तत्त्वतः तत्त्वस्वरूपात् न प्रच्यवते इत्यर्थः॥ २१॥", "padacchedaText": "", "audioFile": "PB_001286.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001287", "originalText": "किञ्च—\nयं लब्ध्वा चापरं लाभं मन्यते नाधिकं ततः। यस्मिन्स्थितो न दुःखेन गुरुणापि विचाल्यते॥ २२॥", "padacchedaText": "", "audioFile": "PB_001287.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001288", "originalText": "यं लब्ध्वा यम् आत्मलाभं लब्ध्वा प्राप्य च अपरम् अन्यत् लाभं लाभान्तरं ततः अधिकम् अस्तीति न मन्यते न चिन्तयति। किञ्च, यस्मिन् आत्मतत्त्वे स्थितः दुःखेन शस्त्रनिपातादिलक्षणेन गुरुणा महता अपि न विचाल्यते॥ २२॥", "padacchedaText": "", "audioFile": "PB_001288.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001289", "originalText": "‘यत्रोपरमते’ (भ.गी.६.२०) इत्याद्यारभ्य यावद्भिः विशेषणैः विशिष्ट आत्मावस्थाविशेषः योगः उक्तः—\nतं विद्याद्दुःखसंयोगवियोगं योगसंज्ञितम्। स निश्चयेन योक्तव्यो योगोऽनिर्विण्णचेतसा॥ २३॥", "padacchedaText": "", "audioFile": "PB_001289.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001290", "originalText": "तं विद्यात् विजानीयात् दुःखसंयोगवियोगं दुःखैः संयोगः दुःखसंयोगः, तेन वियोगः दुःखसंयोगवियोगः, तं दुःखसंयोगवियोगं योग इत्येव संज्ञितं विपरीतलक्षणेन विद्यात् विजानीयादित्यर्थः।", "padacchedaText": "", "audioFile": "PB_001290.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001291", "originalText": "योगफलमुपसंहृत्य पुनरन्वारम्भेण योगस्य कर्तव्यता उच्यते निश्चयानिर्वेदयोः योगसाधनत्वविधानार्थम्।", "padacchedaText": "", "audioFile": "PB_001291.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001292", "originalText": "स यथोक्तफलो योगः निश्चयेन अध्यवसायेन योक्तव्यः अनिर्विण्णचेतसा न निर्विण्णम् अनिर्विण्णम्। किं तत्? चेतः तेन निर्वेदरहितेन चेतसा चित्तेनेत्यर्थः॥ २३॥", "padacchedaText": "", "audioFile": "PB_001292.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001293", "originalText": "किञ्च—\nसङ्कल्पप्रभवान्कामांस्त्यक्त्वा सर्वानशेषतः। मनसैवेन्द्रियग्रामं विनियम्य समन्ततः॥ २४॥", "padacchedaText": "", "audioFile": "PB_001293.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001294", "originalText": "सङ्कल्पप्रभवान् सङ्कल्पः प्रभवः येषां कामानां ते सङ्कल्पप्रभवाः कामाः तान् त्यक्त्वा परित्यज्य सर्वान् अशेषतः निर्लेपेन। किञ्च, मनसैव विवेकयुक्तेन इन्द्रियग्रामम् इन्द्रियसमुदायं विनियम्य नियमनं कृत्वा समन्ततः समन्तात्॥ २४॥", "padacchedaText": "", "audioFile": "PB_001294.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001295", "originalText": "शनैः शनैरुपरमेद्बुद्ध्या धृतिगृहीतया। आत्मसंस्थं मनः कृत्वा न किञ्चिदपि चिन्तयेत्॥ २५॥", "padacchedaText": "", "audioFile": "PB_001295.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001296", "originalText": "शनैः शनैः न सहसा उपरमेत् उपरतिं कुर्यात्।", "padacchedaText": "", "audioFile": "PB_001296.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001297", "originalText": "कया? बुद्ध्या।", "padacchedaText": "", "audioFile": "PB_001297.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001298", "originalText": "किंविशिष्टया? धृतिगृहीतया धृत्या धैर्येण गृहीतया धृतिगृहीतया धैर्येण युक्तया इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001298.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001299", "originalText": "आत्मसंस्थम् आत्मनि संस्थितम् ‘आत्मैव सर्वं न ततोऽन्यत् किञ्चिदस्ति’ इत्येवमात्मसंस्थं मनः कृत्वा न किञ्चिदपि चिन्तयेत्। एष योगस्य परमो विधिः॥ २५॥", "padacchedaText": "", "audioFile": "PB_001299.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001300", "originalText": "तत्र एवमात्मसंस्थं मनः कर्तुं प्रवृत्तो योगी—\nयतो यतो निश्चरति मनश्चञ्चलमस्थिरम्। ततस्ततो नियम्यैतदात्मन्येव वशं नयेत्॥ २६॥", "padacchedaText": "", "audioFile": "PB_001300.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001301", "originalText": "यतो यतः यस्माद्यस्मात् निमित्तात् शब्दादेः निश्चरति निर्गच्छति स्वभावदोषात् मनः चञ्चलम् अत्यर्थं चलम्, अत एव अस्थिरम्, ततस्ततः तस्मात्तस्मात् शब्दादेः निमित्तात् नियम्य तत्तन्निमित्तं याथात्म्यनिरूपणेन आभासीकृत्य वैराग्यभावनया च एतत् मनः आत्मन्येव वशं नयेत् आत्मवश्यतामापादयेत्।", "padacchedaText": "", "audioFile": "PB_001301.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001302", "originalText": "एवं योगाभ्यासबलात् योगिनः आत्मन्येव प्रशाम्यति मनः॥ २६॥", "padacchedaText": "", "audioFile": "PB_001302.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001303", "originalText": "प्रशान्तमनसं ह्येनं योगिनं सुखमुत्तमम्। उपैति शान्तरजसं ब्रह्मभूतमकल्मषम्॥ २७॥", "padacchedaText": "", "audioFile": "PB_001303.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001304", "originalText": "प्रशान्तमनसं प्रकर्षेण शान्तं मनः यस्य सः प्रशान्तमनाः तं प्रशान्तमनसं हि एनं योगिनं सुखम् उत्तमं निरतिशयम् उपैति उपगच्छति शान्तरजसं प्रक्षीणमोहादिक्लेशरजसमित्यर्थः, ब्रह्मभूतं जीवन्मुक्तम्, ‘ब्रह्मैव सर्वम्’ इत्येवं निश्चयवन्तं ब्रह्मभूतम् अकल्मषं धर्माधर्मादिवर्जितम्॥ २७॥", "padacchedaText": "", "audioFile": "PB_001304.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001305", "originalText": "युञ्जन्नेवं सदात्मानं योगी विगतकल्मषः। सुखेन ब्रह्मसंस्पर्शमत्यन्तं सुखमश्नुते॥ २८॥", "padacchedaText": "", "audioFile": "PB_001305.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001306", "originalText": "युञ्जन् एवं यथोक्तेन क्रमेण योगी योगान्तरायवर्जितः सदा सर्वदा आत्मानं विगतकल्मषः विगतपापः, सुखेन अनायासेन ब्रह्मसंस्पर्शं ब्रह्मणा परेण संस्पर्शो यस्य तत् ब्रह्मसंस्पर्शं सुखम् अत्यन्तम् अन्तमतीत्य वर्तत इत्यत्यन्तम् उत्कृष्टं निरतिशयम् अश्नुते व्याप्नोति॥ २८॥", "padacchedaText": "", "audioFile": "PB_001306.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001307", "originalText": "इदानीं योगस्य यत् फलं ब्रह्मैकत्वदर्शनं सर्वसंसारविच्छेदकारणं तत् प्रदर्श्यते—\nसर्वभूतस्थमात्मानं सर्वभूतानि चात्मनि। ईक्षते योगयुक्तात्मा सर्वत्र समदर्शनः॥ २९॥", "padacchedaText": "", "audioFile": "PB_001307.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001308", "originalText": "सर्वभूतस्थं सर्वेषु भूतेषु स्थितं स्वम् आत्मानं सर्वभूतानि च आत्मनि ब्रह्मादीनि स्तम्बपर्यन्तानि च सर्वभूतानि आत्मनि एकतां गतानि ईक्षते पश्यति योगयुक्तात्मा समाहितान्तःकरणः सर्वत्र समदर्शनः सर्वेषु ब्रह्मादिस्थावरान्तेषु विषमेषु सर्वभूतेषु समं निर्विशेषं ब्रह्मात्मैकत्वविषयं दर्शनं ज्ञानं यस्य स सर्वत्र समदर्शनः॥ २९॥", "padacchedaText": "", "audioFile": "PB_001308.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001309", "originalText": "एतस्य आत्मैकत्वदर्शनस्य फलम् उच्यते—\nयो मां पश्यति सर्वत्र सर्वं च मयि पश्यति। तस्याहं न प्रणश्यामि स च मे न प्रणश्यति॥ ३०॥", "padacchedaText": "", "audioFile": "PB_001309.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001310", "originalText": "यो मां पश्यति वासुदेवं सर्वस्य आत्मानं सर्वत्र सर्वेषु भूतेषु सर्वं च ब्रह्मादिभूतजातं मयि सर्वात्मनि पश्यति, तस्य एवं आत्मैकत्वदर्शिनः अहम् ईश्वरो न प्रणश्यामि न परोक्षतां गमिष्यामि।", "padacchedaText": "", "audioFile": "PB_001310.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001311", "originalText": "स च मे न प्रणश्यति स च विद्वान् मम वासुदेवस्य न प्रणश्यति न परोक्षो भवति, तस्य च मम च एकात्मकत्वात्, स्वात्मा हि नाम आत्मनः प्रिय एव भवति, यस्माच्च अहमेव सर्वात्मैकत्वदर्शी॥ ३०॥", "padacchedaText": "", "audioFile": "PB_001311.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001312", "originalText": "इत्येतत् पूर्वश्लोकार्थं सम्यग्दर्शनमनूद्य तत्फलं मोक्षः अभिधीयते—\nसर्वभूतस्थितं यो मां भजत्येकत्वमास्थितः। सर्वथा वर्तमानोऽपि स योगी मयि वर्तते॥ ३१॥", "padacchedaText": "", "audioFile": "PB_001312.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001313", "originalText": "सर्वथा सर्वप्रकारैः वर्तमानोऽपि सम्यग्दर्शी योगी मयि वैष्णवे परमे पदे वर्तते, नित्यमुक्त एव सः, न मोक्षं प्रति केनचित् प्रतिबध्यते इत्यर्थः॥ ३१॥", "padacchedaText": "", "audioFile": "PB_001313.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001314", "originalText": "किञ्च अन्यत्—\nआत्मौपम्येन सर्वत्र समं पश्यति योऽर्जुन। सुखं वा यदि वा दुःखं स योगी परमो मतः॥ ३२॥", "padacchedaText": "", "audioFile": "PB_001314.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001315", "originalText": "आत्मौपम्येन आत्मा स्वयमेव उपमीयते अनया इत्युपमा तस्या उपमाया भावः औपम्यं तेन आत्मौपम्येन, सर्वत्र सर्वभूतेषु समं तुल्यं पश्यति यः अर्जुन, स च किं समं पश्यति इत्युच्यते— यथा मम सुखम् इष्टं तथा सर्वप्राणिनां सुखम् अनुकूलम्।", "padacchedaText": "", "audioFile": "PB_001315.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001316", "originalText": "वाशब्दः चार्थे।", "padacchedaText": "", "audioFile": "PB_001316.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001317", "originalText": "यदि वा यच्च दुःखं मम प्रतिकूलम् अनिष्टं यथा तथा सर्वप्राणिनां दुःखम् अनिष्टं प्रतिकूलं इत्येवम् आत्मौपम्येन सुखदुःखे अनुकूलप्रतिकूले तुल्यतया सर्वभूतेषु समं पश्यति, न कस्यचित् प्रतिकूलमाचरति, अहिंसक इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001317.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001318", "originalText": "यः एवमहिंसकः सम्यग्दर्शननिष्ठः स योगी परमः उत्कृष्टः मतः अभिप्रेतः सर्वयोगिनां मध्ये॥ ३२॥", "padacchedaText": "", "audioFile": "PB_001318.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001319", "originalText": "एतस्य यथोक्तस्य सम्यग्दर्शनलक्षणस्य योगस्य दुःखसम्पाद्यतामालक्ष्य शुश्रूषुः ध्रुवं तत्प्राप्त्युपायमर्जुन उवाच—\nअर्जुन उवाच—\nयोऽयं योगस्त्वया प्रोक्तः\nसाम्येन मधुसूदन।", "padacchedaText": "", "audioFile": "PB_001319.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001320", "originalText": "एतस्याहं न पश्यामि\nचञ्चलत्वात्स्थितिं स्थिराम्॥ ३३॥", "padacchedaText": "", "audioFile": "PB_001320.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001321", "originalText": "यः अयं योगः त्वया प्रोक्तः साम्येन समत्वेन हे मधुसूदन एतस्य योगस्य अहं न पश्यामि नोपलभे, चञ्चलत्वात् मनसः। किम्? स्थिराम् अचलां स्थितिम्॥ ३३॥", "padacchedaText": "", "audioFile": "PB_001321.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001322", "originalText": "प्रसिद्धमेतत्—\nचञ्चलं हि मनः कृष्ण प्रमाथि बलवद्दृढम्। तस्याहं निग्रहं मन्ये वायोरिव सुदुष्करम्॥ ३४॥", "padacchedaText": "", "audioFile": "PB_001322.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001323", "originalText": "चञ्चलं हि मनः।", "padacchedaText": "", "audioFile": "PB_001323.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001324", "originalText": "कृष्ण इति कृषतेः विलेखनार्थस्य रूपम्।", "padacchedaText": "", "audioFile": "PB_001324.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001325", "originalText": "भक्तजनपापादिदोषाकर्षणात् कृष्णः, तस्य सम्बुद्धिः हे कृष्ण।", "padacchedaText": "", "audioFile": "PB_001325.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001326", "originalText": "हि यस्मात् मनः चञ्चलं न केवलमत्यर्थं चञ्चलम्, प्रमाथि च प्रमथनशीलम्, प्रमथ्नाति शरीरम् इन्द्रियाणि च विक्षिपत् सत् परवशीकरोति।", "padacchedaText": "", "audioFile": "PB_001326.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001327", "originalText": "किञ्च— बलवत् प्रबलम्, न केनचित् नियन्तुं शक्यम्, दुर्निवारत्वात्।", "padacchedaText": "", "audioFile": "PB_001327.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001328", "originalText": "किञ्च— दृढं तन्तुनागवत् अच्छेद्यम्। तस्य एवंभूतस्य मनसः अहं निग्रहं निरोधं मन्ये वायोरिव यथा वायोः दुष्करो निग्रहः ततोऽपि दुष्करं मन्ये इत्यभिप्रायः॥ ३४॥", "padacchedaText": "", "audioFile": "PB_001328.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001329", "originalText": "श्रीभगवानुवाच, एवम् एतत् यथा ब्रवीषि—\nश्रीभगवानुवाच—\nअसंशयं महाबाहो मनो दुर्निग्रहं चलम्। अभ्यासेन तु कौन्तेय वैराग्येण च गृह्यते॥ ३५॥", "padacchedaText": "", "audioFile": "PB_001329.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001330", "originalText": "असंशयं नास्ति संशयः ‘मनो दुर्निग्रहं चलम्’ इत्यत्र हे महाबाहो।", "padacchedaText": "", "audioFile": "PB_001330.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001331", "originalText": "किन्तु अभ्यासेन तु अभ्यासो नाम चित्तभूमौ कस्याञ्चित् समानप्रत्ययावृत्तिः चित्तस्य।", "padacchedaText": "", "audioFile": "PB_001331.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001332", "originalText": "वैराग्येण वैराग्यं नाम दृष्टादृष्टेष्टभोगेषु दोषदर्शनाभ्यासात् वैतृष्ण्यम्।", "padacchedaText": "", "audioFile": "PB_001332.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001333", "originalText": "तेन च वैराग्येण गृह्यते विक्षेपरूपः प्रचारः चित्तस्य। एवं तत् मनः गृह्यते निगृह्यते निरुध्यते इत्यर्थः॥ ३५॥", "padacchedaText": "", "audioFile": "PB_001333.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001334", "originalText": "यः पुनः असंयतात्मा, तेन—\nअसंयतात्मना योगो दुष्प्राप इति मे मतिः। वश्यात्मना तु यतता शक्योऽवाप्तुमुपायतः॥ ३६॥", "padacchedaText": "", "audioFile": "PB_001334.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001335", "originalText": "असंयतात्मना अभ्यासवैराग्याभ्यामसंयतः आत्मा अन्तःकरणं यस्य सोऽयम् असंयतात्मा तेन असंयतात्मना योगो दुष्प्रापः दुःखेन प्राप्यत इति मे मतिः।", "padacchedaText": "", "audioFile": "PB_001335.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001336", "originalText": "यस्तु पुनः वश्यात्मा अभ्यासवैराग्याभ्यां वश्यत्वमापादितः आत्मा मनः यस्य सोऽयं वश्यात्मा तेन वश्यात्मना तु यतता भूयोऽपि प्रयत्नं कुर्वता शक्यः अवाप्तुं योगः उपायतः यथोक्तादुपायात्॥ ३६॥", "padacchedaText": "", "audioFile": "PB_001336.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001337", "originalText": "तत्र योगाभ्यासाङ्गीकरणेन इहलोकपरलोकप्राप्तिनिमित्तानि कर्माणि संन्यस्तानि, योगसिद्धिफलं च मोक्षसाधनं सम्यग्दर्शनं न प्राप्तमिति, योगी योगमार्गात् मरणकाले चलितचित्तः इति तस्य नाशमशङ्क्य अर्जुन उवाच—\nअर्जुन उवाच—\nअयतिः श्रद्धयोपेतो योगाच्चलितमानसः।", "padacchedaText": "", "audioFile": "PB_001337.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001338", "originalText": "अप्राप्य योगसंसिद्धिं कां गतिं कृष्ण गच्छति॥ ३७॥", "padacchedaText": "", "audioFile": "PB_001338.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001339", "originalText": "अयतिः अप्रयत्नवान् योगमार्गे श्रद्धया आस्तिक्यबुद्ध्या च उपेतः योगात् अन्तकाले च चलितं मानसं मनो यस्य सः चलितमानसः भ्रष्टस्मृतिः सः अप्राप्य योगसंसिद्धिं योगफलं सम्यग्दर्शनं कां गतिं हे कृष्ण गच्छति॥ ३७॥", "padacchedaText": "", "audioFile": "PB_001339.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001340", "originalText": "कच्चिन्नोभयविभ्रष्टश्छिन्नाभ्रमिव नश्यति। अप्रतिष्ठो महाबाहो विमूढो ब्रह्मणः पथि॥ ३८॥", "padacchedaText": "", "audioFile": "PB_001340.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001341", "originalText": "कच्चित् किं न उभयविभ्रष्टः कर्ममार्गात् योगमार्गाच्च विभ्रष्टः सन् छिन्नाभ्रमिव नश्यति, किं वा न नश्यति अप्रतिष्ठो निराश्रयः हे महाबाहो विमूढः सन् ब्रह्मणः पथि ब्रह्मप्राप्तिमार्गे॥ ३८॥", "padacchedaText": "", "audioFile": "PB_001341.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001342", "originalText": "एतन्मे संशयं कृष्ण च्छेत्तुमर्हस्यशेषतः। त्वदन्यः संशयस्यास्य च्छेत्ता न ह्युपपद्यते॥ ३९॥", "padacchedaText": "", "audioFile": "PB_001342.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001343", "originalText": "एतत् मे मम संशयं कृष्ण च्छेत्तुम् अपनेतुम् अर्हसि अशेषतः।", "padacchedaText": "", "audioFile": "PB_001343.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001344", "originalText": "त्वदन्यः त्वत्तः अन्यः ऋषिः देवो वा च्छेत्ता नाशयिता संशयस्य अस्य न हि यस्मात् उपपद्यते न सम्भवति। अतः त्वमेव च्छेत्तुमर्हसि इत्यर्थः॥ ३९॥", "padacchedaText": "", "audioFile": "PB_001344.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001345", "originalText": "श्रीभगवानुवाच—\nपार्थ नैवेह नामुत्र विनाशस्तस्य विद्यते। न हि कल्याणकृत्कश्चिद्दुर्गतिं तात गच्छति॥ ४०॥", "padacchedaText": "", "audioFile": "PB_001345.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001346", "originalText": "हे पार्थ नैव इह लोके नामुत्र परस्मिन् वा लोके विनाशः तस्य विद्यते नास्ति।", "padacchedaText": "", "audioFile": "PB_001346.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001347", "originalText": "नाशो नाम पूर्वस्मात् हीनजन्मप्राप्तिः स योगभ्रष्टस्य नास्ति।", "padacchedaText": "", "audioFile": "PB_001347.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001348", "originalText": "न हि यस्मात् कल्याणकृत् शुभकृत् कश्चित् दुर्गतिं कुत्सितां गतिं हे तात, तनोति आत्मानं पुत्ररूपेणेति पिता तात उच्यते।", "padacchedaText": "", "audioFile": "PB_001348.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001349", "originalText": "पितैव पुत्र इति पुत्रोऽपि तात उच्यते।", "padacchedaText": "", "audioFile": "PB_001349.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001350", "originalText": "शिष्योऽपि पुत्र उच्यते। यतो न गच्छति॥ ४०॥", "padacchedaText": "", "audioFile": "PB_001350.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001351", "originalText": "किं तु अस्य भवति?—\nप्राप्य पुण्यकृतां लोकानुषित्वा शाश्वतीः समाः। शुचीनां श्रीमतां गेहे योगभ्रष्टोऽभिजायते॥ ४१॥", "padacchedaText": "", "audioFile": "PB_001351.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001352", "originalText": "योगमार्गे प्रवृत्तः संन्यासी सामर्थ्यात् प्राप्य गत्वा पुण्यकृताम् अश्वमेधादियाजिनां लोकान्, तत्र च उषित्वा वासमनुभूय शाश्वतीः नित्याः समाः संवत्सरान्, तद्भोगक्षये शुचीनां यथोक्तकारिणां श्रीमतां विभूतिमतां गेहे गृहे योगभ्रष्टः अभिजायते॥ ४१॥", "padacchedaText": "", "audioFile": "PB_001352.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001353", "originalText": "अथवा योगिनामेव कुले भवति धीमताम्। एतद्धि दुर्लभतरं लोके जन्म यदीदृशम्॥ ४२॥", "padacchedaText": "", "audioFile": "PB_001353.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001354", "originalText": "अथवा श्रीमतां कुलात् अन्यस्मिन् योगिनामेव दरिद्राणां कुले भवति जायते धीमतां बुद्धिमताम्। एतत् हि जन्म, यत् दरिद्राणां योगिनां कुले, दुर्लभतरं दुःखलभ्यतरं पूर्वमपेक्ष्य लोके जन्म यत् ईदृशं यथोक्तविशेषणे कुले॥ ४२॥", "padacchedaText": "", "audioFile": "PB_001354.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001355", "originalText": "यस्मात्—\nतत्र तं बुद्धिसंयोगं लभते पौर्वदेहिकम्। यतते च ततो भूयः संसिद्धौ कुरुनन्दन॥ ४३॥", "padacchedaText": "", "audioFile": "PB_001355.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001356", "originalText": "तत्र योगिनां कुले तं बुद्धिसंयोगं बुद्ध्या संयोगं बुद्धिसंयोगं लभते पौर्वदेहिकं पूर्वस्मिन् देहे भवं पौर्वदेहिकम्। यतते च प्रयत्नं च करोति ततः तस्मात् पूर्वकृतात् संस्कारात् भूयः बहुतरं संसिद्धौ संसिद्धिनिमित्तं हे कुरुनन्दन॥ ४३॥", "padacchedaText": "", "audioFile": "PB_001356.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001357", "originalText": "कथं पूर्वदेहबुद्धिसंयोग इति तदुच्यते—\nपूर्वाभ्यासेन तेनैव ह्रियते ह्यवशोऽपि सः। जिज्ञासुरपि योगस्य शब्दब्रह्मातिवर्तते॥ ४४॥", "padacchedaText": "", "audioFile": "PB_001357.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001358", "originalText": "यः पूर्वजन्मनि कृतः अभ्यासः सः पूर्वाभ्यासः, तेनैव बलवता ह्रियते संसिद्धौ हि यस्मात् अवशोऽपि सः योगभ्रष्टः, न कृतं चेत् योगाभ्यासजात् संस्कारात् बलवत्तरमधर्मादिलक्षणं कर्म, तदा योगाभ्यासजनितेन संस्कारेण ह्रियते, अधर्मश्चेत् बलवत्तरः कृतः, तेन योगजोऽपि संस्कारः अभिभूयत एव, तत्क्षये तु योगजः संस्कारः स्वयमेव कार्यमारभते, न दीर्घकालस्थस्यापि विनाशः तस्य अस्ति इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001358.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001359", "originalText": "अतः जिज्ञासुरपि योगस्य स्वरूपं ज्ञातुमिच्छन् अपि योगमार्गे प्रवृत्तः संन्यासी योगभ्रष्टः, सामर्थ्यात् सोऽपि शब्दब्रह्म वेदोक्तकर्मानुष्ठानफलम् अतिवर्तते अतिक्रामति अपाकरिष्यति, किमुत बुद्ध्वा यः योगं तन्निष्ठः अभ्यासं कुर्यात्॥ ४४॥", "padacchedaText": "", "audioFile": "PB_001359.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001360", "originalText": "कुतश्च योगित्वं श्रेयः इति—\nप्रयत्नाद्यतमानस्तु योगी संशुद्धकिल्बिषः। अनेकजन्मसंसिद्धस्ततो याति परां गतिम्॥ ४५॥", "padacchedaText": "", "audioFile": "PB_001360.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001361", "originalText": "प्रयत्नात् यतमानः, अधिकं यतमान इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001361.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001362", "originalText": "तत्र योगी विद्वान् संशुद्धकिल्बिषः विशुद्धकिल्बिषः संशुद्धपापः अनेकजन्मसंसिद्धः अनेकेषु जन्मसु किञ्चित्किञ्चित् संस्कारजातम् उपचित्य तेन उपचितेन अनेकजन्मकृतेन संसिद्धः अनेकजन्मसंसिद्धः ततः लब्धसम्यग्दर्शनः सन् याति परां प्रकृष्टां गतिम्॥ ४५॥", "padacchedaText": "", "audioFile": "PB_001362.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001363", "originalText": "यस्मादेवं तस्मात्—\nतपस्विभ्योऽधिको योगी\nज्ञानिभ्योऽपि मतोऽधिकः। कर्मिभ्यश्चाधिको योगी\nतस्माद्योगी भवार्जुन॥ ४६॥", "padacchedaText": "", "audioFile": "PB_001363.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001364", "originalText": "तपस्विभ्यः अधिकः योगी, ज्ञानिभ्योऽपि ज्ञानमत्र शास्त्रार्थपाण्डित्यम्, तद्वद्भ्योऽपि मतः ज्ञातः अधिकः श्रेष्ठः इति। कर्मिभ्यः, अग्निहोत्रादि कर्म, तद्वद्भ्यः अधिकः योगी विशिष्टः यस्मात् तस्मात् योगी भव अर्जुन॥ ४६॥", "padacchedaText": "", "audioFile": "PB_001364.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001365", "originalText": "योगिनामपि सर्वेषां मद्गतेनान्तरात्मना। श्रद्धावान्भजते यो मां स मे युक्ततमो मतः॥ ४७॥", "padacchedaText": "", "audioFile": "PB_001365.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001366", "originalText": "योगिनामपि सर्वेषां रुद्रादित्यादिध्यानपराणां मध्ये मद्गतेन मयि वासुदेवे समाहितेन अन्तरात्मना अन्तःकरणेन श्रद्धावान् श्रद्दधानः सन् भजते सेवते यो माम्, स मे मम युक्ततमः अतिशयेन युक्तः मतः अभिप्रेतः इति॥ ४७॥", "padacchedaText": "", "audioFile": "PB_001366.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001367", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ श्रीमद्भगवद्गीताभाष्ये षष्ठोऽध्यायः॥", "padacchedaText": "", "audioFile": "PB_001367.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001368", "originalText": "सप्तमोऽध्यायः\n‘योगिनामपि सर्वेषां मद्गतेनान्तरात्मना।", "padacchedaText": "", "audioFile": "PB_001368.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001369", "originalText": "श्रद्धावान्भजते यो मां स मे युक्ततमो मतः’ (भ.गी.६.४७) इति प्रश्नबीजम् उपन्यस्य, स्वयमेव ‘ईदृशं मदीयं तत्त्वम्, एवं मद्गतान्तरात्मा स्यात्’ इत्येतत् विवक्षुः श्रीभगवानुवाच—\nश्रीभगवानुवाच—\nमय्यासक्तमनाः पार्थ योगं युञ्जन्मदाश्रयः।", "padacchedaText": "", "audioFile": "PB_001369.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001370", "originalText": "असंशयं समग्रं मां यथा ज्ञास्यसि तच्छृणु॥ १॥", "padacchedaText": "", "audioFile": "PB_001370.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001371", "originalText": "मयि वक्ष्यमाणविशेषणे परमेश्वरे आसक्तं मनः यस्य सः मय्यासक्तमनाः, हे पार्थ योगं युञ्जन् मनःसमाधानं कुर्वन्, मदाश्रयः अहमेव परमेश्वरः आश्रयो यस्य सः मदाश्रयः।", "padacchedaText": "", "audioFile": "PB_001371.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001372", "originalText": "यो हि कश्चित् पुरुषार्थेन केनचित् अर्थी भवति स तत्साधनं कर्म अग्निहोत्रादि तपः दानं वा किञ्चित् आश्रयं प्रतिपद्यते, अयं तु योगी मामेव आश्रयं प्रतिपद्यते, हित्वा अन्यत् साधनान्तरं मय्येव आसक्तमनाः भवति।", "padacchedaText": "", "audioFile": "PB_001372.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001373", "originalText": "यः त्वं एवंभूतः सन् असंशयं समग्रं समस्तं विभूतिबलशक्त्यैश्वर्यादिगुणसम्पन्नं मां यथा येन प्रकारेण ज्ञास्यसि संशयमन्तरेण ‘एवमेव भगवान्’ इति, तत् शृणु उच्यमानं मया॥ १॥", "padacchedaText": "", "audioFile": "PB_001373.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001374", "originalText": "तच्च मद्विषयम्—\nज्ञानं तेऽहं सविज्ञानमिदं वक्ष्याम्यशेषतः। यज्ज्ञात्वा नेह भूयोऽन्यज्ज्ञातव्यमवशिष्यते॥ २॥", "padacchedaText": "", "audioFile": "PB_001374.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001375", "originalText": "ज्ञानं ते तुभ्यम् अहं सविज्ञानं विज्ञानसहितं स्वानुभवयुक्तम् इदं वक्ष्यामि कथयिष्यामि अशेषतः कार्‌त्स्न्येन।", "padacchedaText": "", "audioFile": "PB_001375.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001376", "originalText": "तत् ज्ञानं विवक्षितं स्तौति श्रोतुः अभिमुखीकरणाय— यत् ज्ञात्वा यत् ज्ञानं ज्ञात्वा न इह भूयः पुनः अन्यत् ज्ञातव्यं पुरुषार्थसाधनम् अवशिष्यते नावशिष्टं भवति।", "padacchedaText": "", "audioFile": "PB_001376.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001377", "originalText": "इति मत्तत्त्वज्ञो यः, सः सर्वज्ञो भवतीत्यर्थः। अतो विशिष्टफलत्वात् दुर्लभं ज्ञानम्॥ २॥", "padacchedaText": "", "audioFile": "PB_001377.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001378", "originalText": "कथमित्युच्यते—\nमनुष्याणां सहस्रेषु कश्चिद्यतति सिद्धये। यततामपि सिद्धानां कश्चिन्मां वेत्ति तत्त्वतः॥ ३॥", "padacchedaText": "", "audioFile": "PB_001378.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001379", "originalText": "मनुष्याणां मध्ये सहस्रेषु अनेकेषु कश्चित् यतति प्रयत्नं करोति सिद्धये सिद्ध्यर्थम्। तेषां यततामपि सिद्धानाम्, सिद्धा एव हि ते ये मोक्षाय यतन्ते, तेषां कश्चित् एव हि मां वेत्ति तत्त्वतः यथावत्॥ ३॥", "padacchedaText": "", "audioFile": "PB_001379.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001380", "originalText": "श्रोतारं प्ररोचनेन अभिमुखीकृत्याह—\nभूमिरापोऽनलो वायुः खं मनो बुद्धिरेव च। अहङ्कार इतीयं मे भिन्ना प्रकृतिरष्टधा॥ ४॥", "padacchedaText": "", "audioFile": "PB_001380.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001381", "originalText": "भूमिः इति पृथिवीतन्मात्रमुच्यते, न स्थूला, ‘भिन्ना प्रकृतिरष्टधा’ इति वचनात्।", "padacchedaText": "", "audioFile": "PB_001381.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001382", "originalText": "तथा अबादयोऽपि तन्मात्राण्येव उच्यन्ते— आपः अनलः वायुः खम्।", "padacchedaText": "", "audioFile": "PB_001382.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001383", "originalText": "मनः इति मनसः कारणमहङ्कारो गृह्यते।", "padacchedaText": "", "audioFile": "PB_001383.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001384", "originalText": "बुद्धिः इति अहङ्कारकारणं महत्तत्त्वम्।", "padacchedaText": "", "audioFile": "PB_001384.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001385", "originalText": "अहङ्कारः इति अविद्यासंयुक्तमव्यक्तम्।", "padacchedaText": "", "audioFile": "PB_001385.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001386", "originalText": "यथा विषसंयुक्तमन्नं विषमित्युच्यते, एवमहङ्कारवासनावत् अव्यक्तं मूलकारणमहङ्कार इत्युच्यते, प्रवर्तकत्वात् अहङ्कारस्य।", "padacchedaText": "", "audioFile": "PB_001386.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001387", "originalText": "अहङ्कार एव हि सर्वस्य प्रवृत्तिबीजं दृष्टं लोके। इतीयं यथोक्ता प्रकृतिः मे मम ऐश्वरी मायाशक्तिः अष्टधा भिन्ना भेदमागता॥ ४॥", "padacchedaText": "", "audioFile": "PB_001387.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001388", "originalText": "अपरेयमितस्त्वन्यां प्रकृतिं विद्धि मे पराम्। जीवभूतां महाबाहो ययेदं धार्यते जगत्॥ ५॥", "padacchedaText": "", "audioFile": "PB_001388.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001389", "originalText": "अपरा न परा निकृष्टा अशुद्धा अनर्थकरी संसारबन्धनात्मिका इयम्।", "padacchedaText": "", "audioFile": "PB_001389.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001390", "originalText": "इतः अस्याः यथोक्तायाः तु अन्यां विशुद्धां प्रकृतिं मम आत्मभूतां विद्धि मे परां प्रकृष्टां जीवभूतां क्षेत्रज्ञलक्षणां प्राणधारणनिमित्तभूतां हे महाबाहो, यया प्रकृत्या इदं धार्यते जगत् अन्तः प्रविष्टया॥ ५॥", "padacchedaText": "", "audioFile": "PB_001390.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001391", "originalText": "एतद्योनीनि भूतानि सर्वाणीत्युपधारय। अहं कृत्स्नस्य जगतः प्रभवः प्रलयस्तथा॥ ६॥", "padacchedaText": "", "audioFile": "PB_001391.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001392", "originalText": "एतद्योनीनि एते परापरे क्षेत्रक्षेत्रज्ञलक्षणे प्रकृती योनिः येषां भूतानां तानि एतद्योनीनि, भूतानि सर्वाणि इति एवम् उपधारय जानीहि।", "padacchedaText": "", "audioFile": "PB_001392.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001393", "originalText": "यस्मात् मम प्रकृती योनिः कारणं सर्वभूतानाम्, अतः अहं कृत्स्नस्य समस्तस्य जगतः प्रभवः उत्पत्तिः प्रलयः विनाशः तथा। प्रकृतिद्वयद्वारेण अहं सर्वज्ञः ईश्वरः जगतः कारणमित्यर्थः॥ ६॥", "padacchedaText": "", "audioFile": "PB_001393.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001394", "originalText": "यतः तस्मात्—\nमत्तः परतरं नान्यत्किञ्चिदस्ति धनञ्जय। मयि सर्वमिदं प्रोतं सूत्रे मणिगणा इव॥ ७॥", "padacchedaText": "", "audioFile": "PB_001394.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001395", "originalText": "मत्तः परमेश्वरात् परतरम् अन्यत् कारणान्तरं किञ्चित् नास्ति न विद्यते, अहमेव जगत्कारणमित्यर्थः, हे धनञ्जय।", "padacchedaText": "", "audioFile": "PB_001395.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001396", "originalText": "यस्मादेवं तस्मात् मयि परमेश्वरे सर्वाणि भूतानि सर्वमिदं जगत् प्रोतं अनुस्यूतम् अनुगतम् अनुविद्धं ग्रथितमित्यर्थ, दीर्घतन्तुषु पटवत्, सूत्रे च मणिगणा इव॥ ७॥", "padacchedaText": "", "audioFile": "PB_001396.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001397", "originalText": "केन केन धर्मेण विशिष्टे त्वयि सर्वमिदं प्रोतमित्युच्यते—\nरसोऽहमप्सु कौन्तेय प्रभास्मि शशिसूर्ययोः। प्रणवः सर्ववेदेषु शब्दः खे पौरुषं नृषु॥ ८॥", "padacchedaText": "", "audioFile": "PB_001397.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001398", "originalText": "रसः अहम्, अपां यः सारः स रसः, तस्मिन् रसभूते मयि आपः प्रोता इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001398.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001399", "originalText": "एवं सर्वत्र।", "padacchedaText": "", "audioFile": "PB_001399.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001400", "originalText": "यथा अहम् अप्सु रसः, एवं प्रभा अस्मि शशिसूर्ययोः।", "padacchedaText": "", "audioFile": "PB_001400.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001401", "originalText": "प्रणवः ओङ्कारः सर्ववेदेषु, तस्मिन् प्रणवभूते मयि सर्वे वेदाः प्रोताः।", "padacchedaText": "", "audioFile": "PB_001401.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001402", "originalText": "तथा खे आकाशे शब्दः सारभूतः, तस्मिन् मयि खं प्रोतम्। तथा पौरुषं पुरुषस्य भावः पौरुषं यतः पुम्बुद्धिः नृषु, तस्मिन् मयि पुरुषाः प्रोताः॥ ८॥", "padacchedaText": "", "audioFile": "PB_001402.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001403", "originalText": "पुण्यो गन्धः पृथिव्यां च\nतेजश्चास्मि विभावसौ। जीवनं सर्वभूतेषु\nतपश्चास्मि तपस्विषु॥ ९॥", "padacchedaText": "", "audioFile": "PB_001403.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001404", "originalText": "पुण्यः सुरभिः गन्धः पृथिव्यां च अहम्, तस्मिन् मयि गन्धभूते पृथिवी प्रोता।", "padacchedaText": "", "audioFile": "PB_001404.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001405", "originalText": "पुण्यत्वं गन्धस्य स्वभावत एव पृथिव्यां दर्शितम् अबादिषु रसादेः पुण्यत्वोपलक्षणार्थम्।", "padacchedaText": "", "audioFile": "PB_001405.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001406", "originalText": "अपुण्यत्वं तु गन्धादीनाम् अविद्याधर्माद्यपेक्षं संसारिणां भूतविशेषसंसर्गनिमित्तं भवति।", "padacchedaText": "", "audioFile": "PB_001406.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001407", "originalText": "तेजश्च दीप्तिश्च अस्मि विभावसौ अग्नौ।", "padacchedaText": "", "audioFile": "PB_001407.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001408", "originalText": "तथा जीवनं सर्वभूतेषु, येन जीवन्ति सर्वाणि भूतानि तत् जीवनम्। तपश्च अस्मि तपस्विषु, तस्मिन् तपसि मयि तपस्विनः प्रोताः॥ ९॥", "padacchedaText": "", "audioFile": "PB_001408.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001409", "originalText": "बीजं मां सर्वभूतानां विद्धि पार्थ सनातनम्। बुद्धिर्बुद्धिमतामस्मि तेजस्तेजस्विनामहम्॥ १०॥", "padacchedaText": "", "audioFile": "PB_001409.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001410", "originalText": "बीजं प्ररोहकारणं मां विद्धि सर्वभूतानां हे पार्थ सनातनं चिरन्तनम्। किञ्च, बुद्धिः विवेकशक्तिः अन्तःकरणस्य बुद्धिमतां विवेकशक्तिमताम् अस्मि, तेजः प्रागल्भ्यं तद्वतां तेजस्विनाम् अहम्॥ १०॥", "padacchedaText": "", "audioFile": "PB_001410.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001411", "originalText": "बलं बलवतां चाहं कामरागविवर्जितम्। धर्माविरुद्धो भूतेषु कामोऽस्मि भरतर्षभ॥ ११॥", "padacchedaText": "", "audioFile": "PB_001411.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001412", "originalText": "बलं सामर्थ्यम् ओजो बलवताम् अहम्, तच्च बलं कामरागविवर्जितम्, कामश्च रागश्च कामरागौ— कामः तृष्णा असंनिकृष्टेषु विषयेषु, रागो रञ्जना प्राप्तेषु विषयेषु— ताभ्यां कामरागाभ्यां विवर्जितं देहादिधारणमात्रार्थं बलं सत्त्वमहमस्मि, न तु यत्संसारिणां तृष्णारागकारणम्।", "padacchedaText": "", "audioFile": "PB_001412.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001413", "originalText": "किञ्च— धर्माविरुद्धः धर्मेण शास्त्रार्थेन अविरुद्धो यः प्राणिषु भूतेषु कामः, यथा देहधारणमात्राद्यर्थः अशनपानादिविषयः, स कामः अस्मि हे भरतर्षभ॥ ११॥", "padacchedaText": "", "audioFile": "PB_001413.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001414", "originalText": "किञ्च—\nये चैव सात्त्विका भावा राजसास्तमसाश्च ये। मत्त एवेति तान्विद्धि न त्वहं तेषु ते मयि॥ १२॥", "padacchedaText": "", "audioFile": "PB_001414.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001415", "originalText": "ये चैव सात्त्विकाः सत्त्वनिर्वृत्ताः भावाः पदार्थाः, राजसाः रजोनिर्वृत्ताः, तामसाः तमोनिर्वृत्ताश्च, ये केचित् प्राणिनां स्वकर्मवशात् जायन्ते भावाः, तान् मत्त एव जायमानान् इति एवं विद्धि सर्वान् समस्तानेव।", "padacchedaText": "", "audioFile": "PB_001415.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001416", "originalText": "यद्यपि ते मत्तः जायन्ते, तथापि न तु अहं तेषु तदधीनः तद्वशः, यथा संसारिणः। ते पुनः मयि मद्वशाः मदधीनाः॥ १२॥", "padacchedaText": "", "audioFile": "PB_001416.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001417", "originalText": "एवंभूतमपि परमेश्वरं नित्यशुद्धबुद्धमुक्तस्वभावं सर्वभूतात्मानं निर्गुणं संसारदोषबीजप्रदाहकारणं मां नाभिजानाति जगत् इति अनुक्रोशं दर्शयति भगवान्।", "padacchedaText": "", "audioFile": "PB_001417.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001418", "originalText": "तच्च किंनिमित्तं जगतः अज्ञानमित्युच्यते—\nत्रिभिर्गुणमयैर्भावैरेभिः सर्वमिदं जगत्। मोहितं नाभिजानाति मामेभ्यः परमव्ययम्॥ १३॥", "padacchedaText": "", "audioFile": "PB_001418.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001419", "originalText": "त्रिभिः गुणमयैः गुणविकारैः रागद्वेषमोहादिप्रकारैः भावैः पदार्थैः एभिः यथोक्तैः सर्वम् इदं प्राणिजातं जगत् मोहितम् अविवेकितामापादितं सत् न अभिजानाति माम्, एभ्यः यथोक्तेभ्यः गुणेभ्यः परं व्यतिरिक्तं विलक्षणं च अव्ययं व्ययरहितं जन्मादिसर्वभावविकारवर्जितम् इत्यर्थः॥ १३॥", "padacchedaText": "", "audioFile": "PB_001419.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001420", "originalText": "कथं पुनः दैवीम् एतां त्रिगुणात्मिकां वैष्णवीं मायामतिक्रामति इत्युच्यते—\nदैवी ह्येषा गुणमयी मम माया दुरत्यया। मामेव ये प्रपद्यन्ते मायामेतां तरन्ति ते॥ १४॥", "padacchedaText": "", "audioFile": "PB_001420.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001421", "originalText": "दैवी देवस्य मम ईश्वरस्य विष्णोः स्वभावभूता हि यस्मात् एषा यथोक्ता गुणमयी मम माया दुरत्यया दुःखेन अत्ययः अतिक्रमणं यस्याः सा दुरत्यया।", "padacchedaText": "", "audioFile": "PB_001421.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001422", "originalText": "तत्र एवं सति सर्वधर्मान् परित्यज्य मामेव मायाविनं स्वात्मभूतं सर्वात्मना ये प्रपद्यन्ते ते मायाम् एतां सर्वभूतमोहिनीं तरन्ति अतिक्रामन्ति, ते संसारबन्धनात् मुच्यन्ते इत्यर्थः॥ १४॥", "padacchedaText": "", "audioFile": "PB_001422.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001423", "originalText": "यदि त्वां प्रपन्नाः मायामेतां तरन्ति, कस्मात् त्वामेव सर्वे न प्रपद्यन्ते इत्युच्यते—\nन मां दुष्कृतिनो मूढाः प्रपद्यन्ते नराधमाः। माययापहृतज्ञाना आसुरं भावमाश्रिताः॥ १५॥", "padacchedaText": "", "audioFile": "PB_001423.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001424", "originalText": "न मां परमेश्वरं नारायणं दुष्कृतिनः पापकारिणः मूढाः प्रपद्यन्ते नराधमाः नराणां मध्ये अधमाः निकृष्टाः। ते च मायया अपहृतज्ञानाः संमुषितज्ञानाः आसुरं भावं हिंसानृतादिलक्षणम् आश्रिताः॥ १५॥", "padacchedaText": "", "audioFile": "PB_001424.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001425", "originalText": "ये पुनर्नरोत्तमाः पुण्यकर्माणः—\nचतुर्विधा भजन्ते मां जनाः सुकृतिनोऽर्जुन। आर्तो जिज्ञासुरर्थार्थी ज्ञानी च भरतर्षभ॥ १६॥", "padacchedaText": "", "audioFile": "PB_001425.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001426", "originalText": "चतुर्विधाः चतुःप्रकाराः भजन्ते सेवंते मां जनाः सुकृतिनः पुण्यकर्माणः हे अर्जुन।", "padacchedaText": "", "audioFile": "PB_001426.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001427", "originalText": "आर्तः आर्तिपरिगृहीतः तस्करव्याघ्ररोगादिना अभिभूतः आपन्नः, जिज्ञासुः भगवत्तत्त्वं ज्ञातुमिच्छति यः, अर्थार्थी धनकामः, ज्ञानी विष्णोः तत्त्वविच्च हे भरतर्षभ॥ १६॥", "padacchedaText": "", "audioFile": "PB_001427.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001428", "originalText": "तेषां ज्ञानी नित्ययुक्त एकभक्तिर्विशिष्यते। प्रियो हि ज्ञानिनोऽत्यर्थमहं स च मम प्रियः॥ १७॥", "padacchedaText": "", "audioFile": "PB_001428.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001429", "originalText": "तेषां चतुर्णां मध्ये ज्ञानी तत्त्ववित् तत्ववित्त्वात् नित्ययुक्तः भवति एकभक्तिश्च, अन्यस्य भजनीयस्य अदर्शनात्, अतः स एकभक्तिः विशिष्यते विशेषम् आधिक्यम् आपद्यते, अतिरिच्यते इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001429.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001430", "originalText": "प्रियो हि यस्मात् अहम् आत्मा ज्ञानिनः, अतः तस्य अहम् अत्यर्थं प्रियः, प्रसिद्धं हि लोके ‘आत्मा प्रियो भवति’ इति।", "padacchedaText": "", "audioFile": "PB_001430.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001431", "originalText": "तस्मात् ज्ञानिनः आत्मत्वात् वासुदेवः प्रियो भवतीत्यर्थः। स च ज्ञानी मम वासुदेवस्य आत्मैवेति मम अत्यर्थं प्रियः॥ १७॥", "padacchedaText": "", "audioFile": "PB_001431.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001432", "originalText": "न तर्हि आर्तादयः त्रयः वासुदेवस्य प्रियाः? न, किं तर्हि?—\nउदाराः सर्व एवैते\nज्ञानी त्वात्मैव मे मतम्। आस्थितः स हि युक्तात्मा\nमामेवानुत्तमां गतिम्॥ १८॥", "padacchedaText": "", "audioFile": "PB_001432.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001433", "originalText": "उदाराः उत्कृष्टाः सर्व एव एते, त्रयोऽपि मम प्रिया एवेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001433.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001434", "originalText": "न हि कश्चित् मद्भक्तः मम वासुदेवस्य अप्रियः भवति।", "padacchedaText": "", "audioFile": "PB_001434.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001435", "originalText": "ज्ञानी तु अत्यर्थं प्रियो भवतीति विशेषः।", "padacchedaText": "", "audioFile": "PB_001435.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001436", "originalText": "तत् कस्मात् इत्यत आह— ज्ञानी तु आत्मैव न अन्यो मत्तः इति मे मम मतं निश्चयः।", "padacchedaText": "", "audioFile": "PB_001436.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001437", "originalText": "आस्थितः आरोढुं प्रवृत्तः सः ज्ञानी हि यस्मात् ‘अहमेव भगवान् वासुदेवः न अन्योऽस्मि’ इत्येवं युक्तात्मा समाहितचित्तः सन् मामेव परं ब्रह्म गन्तव्यम् अनुत्तमां गन्तुं प्रवृत्त इत्यर्थः॥ १८॥", "padacchedaText": "", "audioFile": "PB_001437.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001438", "originalText": "ज्ञानी पुनरपि स्तूयते—\nबहूनां जन्मनामन्ते ज्ञानवान्मां प्रपद्यते। वासुदेवः सर्वमिति स महात्मा सुदुर्लभः॥ १९॥", "padacchedaText": "", "audioFile": "PB_001438.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001439", "originalText": "बहूनां जन्मनां ज्ञानार्थसंस्काराश्रयाणाम् अन्ते समाप्तौ ज्ञानवान् प्राप्तपरिपाकज्ञानः मां वासुदेवं प्रत्यगात्मानं प्रत्यक्षतः प्रपद्यते।", "padacchedaText": "", "audioFile": "PB_001439.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001440", "originalText": "कथम्? वासुदेवः सर्वम् इति।", "padacchedaText": "", "audioFile": "PB_001440.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001441", "originalText": "यः एवं सर्वात्मानं मां नारायणं प्रतिपद्यते, सः महात्मा, न तत्समः अन्यः अस्ति, अधिको वा। अतः सुदुर्लभः, ‘मनुष्याणां सहस्रेषु’ (भ.गी.७.३) इति हि उक्तम्॥ १९॥", "padacchedaText": "", "audioFile": "PB_001441.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001442", "originalText": "आत्मैव सर्वो वासुदेव इत्येवमप्रतिपत्तौ कारणमुच्यते—\nकामैस्तैस्तैर्हृतज्ञानाः प्रपद्यन्तेऽन्यदेवताः। तं तं नियममास्थाय प्रकृत्या नियताः स्वया॥ २०॥", "padacchedaText": "", "audioFile": "PB_001442.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001443", "originalText": "कामैः तैस्तैः पुत्रपशुस्वर्गादिविषयैः हृतज्ञानाः अपहृतविवेकविज्ञानाः प्रपद्यन्ते अन्यदेवताः प्राप्नुवन्ति वासुदेवात् आत्मनः अन्याः देवताः, तं तं नियमं देवताराधने प्रसिद्धो यो यो नियमः तं तम् आस्थाय आश्रित्य प्रकृत्या स्वभावेन जन्मान्तरार्जितसंस्कारविशेषेण नियताः नियमिताः स्वया आत्मीयया॥ २०॥", "padacchedaText": "", "audioFile": "PB_001443.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001444", "originalText": "तेषां च कामीनाम्—\nयो यो यां यां तनुं भक्तः श्रद्धयार्चितुमिच्छति। तस्य तस्याचलां श्रद्धां तामेव विदधाम्यहम्॥ २१॥", "padacchedaText": "", "audioFile": "PB_001444.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001445", "originalText": "यः यः कामी यां यां देवतातनुं श्रद्धया संयुक्तः भक्तश्च सन् अर्चितुं पूजयितुम् इच्छति, तस्य तस्य कामिनः अचलां स्थिरां श्रद्धां तामेव विदधामि स्थिरीकरोमि॥ २१॥", "padacchedaText": "", "audioFile": "PB_001445.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001446", "originalText": "ययैव पूर्वं प्रवृत्तः स्वभावतो यः यां देवतातनुं श्रद्धया अर्चितुम् इच्छति—\nस तया श्रद्धया युक्तस्तस्या राधनमीहते। लभते च ततः कामान्मयैव विहितान्हि तान्॥ २२॥", "padacchedaText": "", "audioFile": "PB_001446.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001447", "originalText": "स तया मद्विहितया श्रद्धया युक्तः सन् तस्याः देवतातन्वाः राधनम् आराधनम् ईहते चेष्टते।", "padacchedaText": "", "audioFile": "PB_001447.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001448", "originalText": "लभते च ततः तस्याः आराधितायाः देवतातन्वाः कामान् ईप्सितान् मयैव परमेश्वरेण सर्वज्ञेन कर्मफलविभागज्ञतया विहितान् निर्मितान् तान्, हि यस्मात् ते भगवता विहिताः कामाः तस्मात् तान् अवश्यं लभते इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001448.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001449", "originalText": "‘हितान्’ इति पदच्छेदे हितत्वं कामानामुपचरितं कल्प्यम्, न हि कामा हिताः कस्यचित्॥ २२॥", "padacchedaText": "", "audioFile": "PB_001449.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001450", "originalText": "यस्मात् अन्तवत्साधनव्यापारा अविवेकिनः कामिनश्च ते, अतः—\nअन्तवत्तु फलं तेषां\nतद्भवत्यल्पमेधसाम्। देवान्देवयजो यान्ति\nमद्भक्ता यान्ति मामपि॥ २३॥", "padacchedaText": "", "audioFile": "PB_001450.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001451", "originalText": "अन्तवत् विनाशि तु फलं तेषां तत् भवति अल्पमेधसां अल्पप्रज्ञानाम्।", "padacchedaText": "", "audioFile": "PB_001451.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001452", "originalText": "देवान्देवयजो यान्ति देवान् यजन्त इति देवयजः, ते देवान् यान्ति, मद्भक्ता यान्ति मामपि। एवं समाने अपि आयासे मामेव न प्रपद्यन्ते अनन्तफलाय, अहो खलु कष्टं वर्तन्ते, इत्यनुक्रोशं दर्शयति भगवान्॥ २३॥", "padacchedaText": "", "audioFile": "PB_001452.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001453", "originalText": "किंनिमित्तं मामेव न प्रपद्यन्ते इत्युच्यते—\nअव्यक्तं व्यक्तिमापन्नं मन्यन्ते मामबुद्धयः। परं भावमजानन्तो ममाव्ययमनुत्तमम्॥ २४॥", "padacchedaText": "", "audioFile": "PB_001453.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001454", "originalText": "अव्यक्तम् अप्रकाशं व्यक्तिम् आपन्नं प्रकाशं गतम् इदानीं मन्यन्ते मां नित्यप्रसिद्धमीश्वरमपि सन्तम् अबुद्धयः अविवेकिनः परं भावं परमात्मस्वरूपम् अजानन्तः अविवेकिनः मम अव्ययं व्ययरहितम् अनुत्तमं निरतिशयं मदीयं भावमजानन्तः मन्यन्ते इत्यर्थः॥ २४॥", "padacchedaText": "", "audioFile": "PB_001454.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001455", "originalText": "तदज्ञानं किंनिमित्तमित्युच्यते—\nनाहं प्रकाशः सर्वस्य योगमायासमावृतः। मूढोऽयं नाभिजानाति लोको मामजमव्ययम्॥ २५॥", "padacchedaText": "", "audioFile": "PB_001455.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001456", "originalText": "न अहं प्रकाशः सर्वस्य लोकस्य, केषाञ्चिदेव मद्भक्तानां प्रकाशः अहमित्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_001456.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001457", "originalText": "योगमायासमावृतः योगः गुणानां युक्तिः घटनं सैव माया योगमाया, तया योगमायया समावृतः, सञ्छन्नः इत्यर्थः। अत एव मूढो लोकः अयं न अभिजानाति माम् अजम् अव्ययम्॥", "padacchedaText": "", "audioFile": "PB_001457.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001458", "originalText": "यया योगमायया समावृतं मां लोकः नाभिजानाति, नासौ योगमाया मदीया सती मम ईश्वरस्य मायाविनो ज्ञानं प्रतिबध्नाति, यथा अन्यस्यापि मायाविनः मायाज्ञानं तद्वत्॥ २५॥", "padacchedaText": "", "audioFile": "PB_001458.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001459", "originalText": "यतः एवम्, अतः—\nवेदाहं समतीतानि वर्तमानानि चार्जुन। भविष्याणि च भूतानि मां तु वेद न कश्चन॥ २६॥", "padacchedaText": "", "audioFile": "PB_001459.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001460", "originalText": "अहं तु वेद जाने समतीतानि समतिक्रान्तानि भूतानि, वर्तमानानि च अर्जुन, भविष्याणि च भूतानि वेद अहम्। मां तु वेद न कश्चन मद्भक्तं मच्छरणम् एकं मुक्त्वा, मत्तत्त्ववेदनाभावादेव न मां भजते॥ २६॥", "padacchedaText": "", "audioFile": "PB_001460.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001461", "originalText": "केन पुनः मत्तत्त्ववेदनप्रतिबन्धेन प्रतिबद्धानि सन्ति जायमानानि सर्वभूतानि मां न विदन्ति इत्यपेक्षायामिदमाह—\nइच्छाद्वेषसमुत्थेन द्वन्द्वमोहेन भारत। सर्वभूतानि संमोहं सर्गे यान्ति परन्तप॥ २७॥", "padacchedaText": "", "audioFile": "PB_001461.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001462", "originalText": "इच्छाद्वेषसमुत्थेन इच्छा च द्वेषश्च इच्छाद्वेषौ ताभ्यां समुत्तिष्ठतीति इच्छाद्वेषसमुत्थः तेन इच्छाद्वेषसमुत्थेन।", "padacchedaText": "", "audioFile": "PB_001462.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001463", "originalText": "केनेति विशेषापेक्षायामिदमाह— द्वन्द्वमोहेन द्वन्द्वनिमित्तः मोहः द्वन्द्वमोहः तेन।", "padacchedaText": "", "audioFile": "PB_001463.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001464", "originalText": "तावेव इच्छाद्वेषौ शीतोष्णवत् परस्परविरुद्धौ सुखदुःखतद्धेतुविषयौ यथाकालं सर्वभूतैः सम्बध्यमानौ द्वन्द्वशब्देन अभिधीयेते।", "padacchedaText": "", "audioFile": "PB_001464.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001465", "originalText": "यत्र यदा इच्छाद्वेषौ सुखदुःखतद्धेतुसम्प्राप्त्या लब्धात्मकौ भवतः, तदा तौ सर्वभूतानां प्रज्ञायाः स्ववशापादनद्वारेण परमार्थात्मतत्त्वविषयज्ञानोत्पत्तिप्रतिबन्धकारणं मोहं जनयतः।", "padacchedaText": "", "audioFile": "PB_001465.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001466", "originalText": "न हि इच्छाद्वेषदोषवशीकृतचित्तस्य यथाभूतार्थविषयज्ञानमुत्पद्यते बहिरपि, किमु वक्तव्यं ताभ्यामाविष्टबुद्धेः संमूढस्य प्रत्यगात्मनि बहुप्रतिबन्धे ज्ञानं नोत्पद्यत इति।", "padacchedaText": "", "audioFile": "PB_001466.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001467", "originalText": "अतः तेन इच्छाद्वेषसमुत्थेन द्वन्द्वमोहेन, भारत भरतान्वयज, सर्वभूतानि संमोहितानि सन्ति संमोहं संमूढतां सर्गे जन्मनि, उत्पत्तिकाले इत्येतत्, यान्ति गच्छन्ति हे परन्तप।", "padacchedaText": "", "audioFile": "PB_001467.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001468", "originalText": "मोहवशान्येव सर्वभूतानि जायमानानि जायन्ते इत्यभिप्रायः। यतः एवम्, अतः तेन द्वन्द्वमोहेन प्रतिबद्धप्रज्ञानानि सर्वभूतानि संमोहितानि मामात्मभूतं न जानन्ति, अत एव आत्मभावे मां न भजन्ते॥ २७॥", "padacchedaText": "", "audioFile": "PB_001468.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001469", "originalText": "के पुनः अनेन द्वन्द्वमोहेन निर्मुक्ताः सन्तः त्वां विदित्वा यथाशास्त्रमात्मभावेन भजन्ते इत्यपेक्षितमर्थं दर्शितुम् उच्यते—\nयेषां त्वन्तगतं पापं\nजनानां पुण्यकर्मणाम्।", "padacchedaText": "", "audioFile": "PB_001469.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001470", "originalText": "ते द्वन्द्वमोहनिर्मुक्ता\nभजन्ते मां दृढव्रताः॥ २८॥", "padacchedaText": "", "audioFile": "PB_001470.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001471", "originalText": "येषां तु पुनः अन्तगतं समाप्तप्रायं क्षीणं पापं जनानां पुण्यकर्मणां पुण्यं कर्म येषां सत्त्वशुद्धिकारणं विद्यते ते पुण्यकर्माणः तेषां पुण्यकर्मणाम्, ते द्वन्द्वमोहनिर्मुक्ताः यथोक्तेन द्वन्द्वमोहेन निर्मुक्ताः भजन्ते मां परमात्मानं दृढव्रताः।", "padacchedaText": "", "audioFile": "PB_001471.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001472", "originalText": "‘एवमेव परमार्थतत्त्वं नान्यथा’ इत्येवं सर्वपरित्यागव्रतेन निश्चितविज्ञानाः दृढव्रताः उच्यन्ते॥ २८॥", "padacchedaText": "", "audioFile": "PB_001472.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001473", "originalText": "ते किमर्थं भजन्ते इत्युच्यते—\nजरामरणमोक्षाय मामाश्रित्य यतन्ति ये। ते ब्रह्म तद्विदुः कृत्स्नमध्यात्मं कर्म चाखिलम्॥ २९॥", "padacchedaText": "", "audioFile": "PB_001473.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001474", "originalText": "जरामरणमोक्षाय जरामरणयोः मोक्षार्थं मां परमेश्वरम् आश्रित्य मत्समाहितचित्ताः सन्तः यतन्ति प्रयतन्ते ये, ते यत् ब्रह्म परं तत् विदुः कृत्स्नं समस्तम् अध्यात्मं प्रत्यगात्मविषयं वस्तु तत् विदुः, कर्म च अखिलं समस्तं विदुः॥ २९॥", "padacchedaText": "", "audioFile": "PB_001474.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001475", "originalText": "साधिभूताधिदैवं मां साधियज्ञं च ये विदुः। प्रयाणकालेऽपि च मां ते विदुर्युक्तचेतसः॥ ३०॥", "padacchedaText": "", "audioFile": "PB_001475.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001476", "originalText": "साधिभूताधिदैवम् अधिभूतं च अधिदैवं च अधिभूताधिदैवम्, सह अधिभूताधिदैवेन वर्तते इति साधिभूताधिदैवं च मां ये विदुः, साधियज्ञं च सह अधियज्ञेन साधियज्ञं ये विदुः, प्रयाणकाले मरणकाले अपि च मां ते विदुः युक्तचेतसः समाहितचित्ता इति॥ ३०॥", "padacchedaText": "", "audioFile": "PB_001476.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001477", "originalText": "इति श्रीमत्परमहंसपरिवारजकाचार्यस्य श्रीगोविन्दभगवत्पूजयपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ श्रीमद्भगवद्गीताभाष्ये सप्तमोऽध्यायः॥", "padacchedaText": "", "audioFile": "PB_001477.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001478", "originalText": "अष्टमोऽध्यायः\n‘ते ब्रह्म तद्विदुः कृत्स्नम्’ (भ.गी.७.२९) इत्यादिना भगवता अर्जुनस्य प्रश्नबीजानि उपदिष्टानि।", "padacchedaText": "", "audioFile": "PB_001478.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001479", "originalText": "अतः तत्प्रश्नार्थम् अर्जुनः उवाच—\nअर्जुन उवाच—\nकिं तद्ब्रह्म किमध्यात्मं किं कर्म पुरुषोत्तम। अधिभूतं च किं प्रोक्तमधिदैवं किमुच्यते॥ १॥", "padacchedaText": "", "audioFile": "PB_001479.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001480", "originalText": "अधियज्ञः कथं कोऽत्र देहेऽस्मिन्मधुसूदन। प्रयाणकाले च कथं ज्ञेयोऽसि नियतात्मभिः॥ २॥", "padacchedaText": "", "audioFile": "PB_001480.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001481", "originalText": "एषां प्रश्नानां यथाक्रमं निर्णयाय श्रीभगवानुवाच—\nश्रीभगवानुवाच—\nअक्षरं ब्रह्म परमं स्वभावोऽध्यात्ममुच्यते। भूतभावोद्भवकरो विसर्गः कर्मसंज्ञितः॥ ३॥", "padacchedaText": "", "audioFile": "PB_001481.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001482", "originalText": "अक्षरं न क्षरतीति अक्षरं परमात्मा, ‘एतस्य वा अक्षरस्य प्रशासने गार्गि’ (बृ.३.८.९) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_001482.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001483", "originalText": "ओङ्कारस्य च ‘ओमित्येकाक्षरं ब्रह्म’ (भ.गी.८.१३) इति परेण विशेषणात् अग्रहणम्।", "padacchedaText": "", "audioFile": "PB_001483.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001484", "originalText": "परमम् इति च निरतिशये ब्रह्मणि अक्षरे उपपन्नतरम् विशेषणम्।", "padacchedaText": "", "audioFile": "PB_001484.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001485", "originalText": "तस्यैव परस्य ब्रह्मणः प्रतिदेहं प्रत्यगात्मभावः स्वभावः, स्वो भावः स्वभावः अध्यात्मम् उच्यते।", "padacchedaText": "", "audioFile": "PB_001485.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001486", "originalText": "आत्मानं देहम् अधिकृत्य प्रत्यगात्मतया प्रवृत्तं परमार्थब्रह्मावसानं वस्तु स्वभावः अध्यात्मम् उच्यते अध्यात्मशब्देन अभिधीयते।", "padacchedaText": "", "audioFile": "PB_001486.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001487", "originalText": "भूतभावोद्भवकरः भूतानां भावः भूतभावः तस्य उद्भवः भूतभावोद्भवः तं करोतीति भूतभावोद्भवकरः, भूतवस्तूत्पत्तिकर इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001487.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001488", "originalText": "विसर्गः विसर्जनं देवतोद्देशेन चरुपुरोडाशादेः द्रव्यस्य परित्यागः, स एष विसर्गलक्षणो यज्ञः कर्मसंज्ञितः कर्मशब्दित इत्येतत्। एतस्मात् हि बीजभूतात् वृष्ट्यादिक्रमेण स्थावरजङ्गमानि भूतानि उद्भवन्ति॥ ३॥", "padacchedaText": "", "audioFile": "PB_001488.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001489", "originalText": "अधिभूतं क्षरो भावः पुरुषश्चाधिदैवतम्। अधियज्ञोऽहमेवात्र देहे देहभृतां वर॥ ४॥", "padacchedaText": "", "audioFile": "PB_001489.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001490", "originalText": "अधिभूतं प्राणिजातम् अधिकृत्य भवतीति।", "padacchedaText": "", "audioFile": "PB_001490.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001491", "originalText": "कोऽसौ? क्षरः क्षरतीति क्षरः विनाशी, भावः यत्किञ्चित् जनिमत् वस्तु इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001491.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001492", "originalText": "पुरुषः पूर्णम् अनेन सर्वमिति, पुरि शयनात् वा, पुरुषः आदित्यान्तर्गतो हिरण्यगर्भः, सर्वप्राणिकरणानाम् अनुग्राहकः, सः अधिदैवतम्।", "padacchedaText": "", "audioFile": "PB_001492.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001493", "originalText": "अधियज्ञः सर्वयज्ञाभिमानिनी विष्ण्वाख्या देवता, ‘यज्ञो वै विष्णुः’ (तै.सं.१.७.४) इति श्रुतेः। स हि विष्णुः अहमेव, अत्र अस्मिन् देहे यो यज्ञः तस्य अहम् अधियज्ञः, यज्ञो हि देहनिर्वर्त्यत्वेन देहसमवायी इति देहाधिकरणो भवति, देहभृतां वर॥ ४॥", "padacchedaText": "", "audioFile": "PB_001493.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001494", "originalText": "अन्तकाले च मामेव स्मरन्मुक्त्वा कलेबरम्। यः प्रयाति स मद्भावं याति नास्त्यत्र संशयः॥ ५॥", "padacchedaText": "", "audioFile": "PB_001494.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001495", "originalText": "अन्तकाले मरणकाले च मामेव परमेश्वरं विष्णुं स्मरन् मुक्त्वा परित्यज्य कलेबरं शरीरं यः प्रयाति गच्छति, सः मद्भावं वैष्णवं तत्त्वं याति। नास्ति न विद्यते अत्र अस्मिन् अर्थे संशयः— याति वा न वा इति॥ ५॥", "padacchedaText": "", "audioFile": "PB_001495.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001496", "originalText": "न मद्विषय एव अयं नियमः।", "padacchedaText": "", "audioFile": "PB_001496.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001497", "originalText": "किं तर्हि?—\nयं यं वापि स्मरन्भावं त्यजत्यन्ते कलेबरम्। तं तमेवैति कौन्तेय सदा तद्भावभावितः॥ ६॥", "padacchedaText": "", "audioFile": "PB_001497.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001498", "originalText": "यं यं वापि यं यं भावं देवताविशेषं स्मरन् चिन्तयन् त्यजति परित्यजति अन्ते अन्तकाले प्राणवियोगकाले कलेबरं शरीरं तं तमेव स्मृतं भावमेव एति नान्यं कौन्तेय, सदा सर्वदा तद्भावभावितः तस्मिन् भावः तद्भावः स भावितः स्मर्यमाणतया अभ्यस्तः येन सः तद्भावभावितः सन्॥ ६॥", "padacchedaText": "", "audioFile": "PB_001498.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001499", "originalText": "यस्मात् एवम् अन्त्या भावना देहान्तरप्राप्तौ कारणम्—\nतस्मात्सर्वेषु कालेषु मामनुस्मर युध्य च। मय्यर्पितमनोबुद्धिर्मामेवैष्यस्यसंशयः॥ ७॥", "padacchedaText": "", "audioFile": "PB_001499.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001500", "originalText": "तस्मात् सर्वेषु कालेषु माम् अनुस्मर यथाशास्त्रम्।", "padacchedaText": "", "audioFile": "PB_001500.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001501", "originalText": "युध्य च युद्धं च स्वधर्मं कुरु। मयि वासुदेवे अर्पिते मनोबुद्धी यस्य तव स त्वं मयि अर्पितमनोबुद्धिः सन् मामेव यथास्मृतम् एष्यसि आगमिष्यसि, असंशयः न संशयः अत्र विद्यते॥ ७॥", "padacchedaText": "", "audioFile": "PB_001501.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001502", "originalText": "किञ्च—\nअभ्यासयोगयुक्तेन चेतसा नान्यगामिना। परमं पुरुषं दिव्यं याति पार्थानुचिन्तयन्॥ ८॥", "padacchedaText": "", "audioFile": "PB_001502.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001503", "originalText": "अभ्यासयोगयुक्तेन मयि चित्तसमर्पणविषयभूते एकस्मिन् तुल्यप्रत्ययावृत्तिलक्षणः विलक्षणप्रत्ययानन्तरितः अभ्यासः स चाभ्यासो योगः तेन युक्तं तत्रैव व्यापृतं योगिनः चेतः तेन, चेतसा नान्यगामिना न अन्यत्र विषयान्तरे गन्तुं शीलम् अस्येति नान्यगामि तेन नान्यगामिना, परमं निरतिशयं पुरुषं दिव्यं दिवि सूर्यमण्डले भवं याति गच्छति हे पार्थ अनुचिन्तयन् शास्त्राचार्योपदेशम् अनुध्यायन् इत्येतत्॥ ८॥", "padacchedaText": "", "audioFile": "PB_001503.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001504", "originalText": "किंविशिष्टं च पुरुषं याति इति उच्यते—\nकविं पुराणमनुशासितारमणोरणीयांसमनुस्मरेद्यः। सर्वस्य धातारमचिन्त्यरूपमादित्यवर्णं तमसः परस्तात्॥ ९॥", "padacchedaText": "", "audioFile": "PB_001504.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001505", "originalText": "कविं क्रान्तदर्शिनं सर्वज्ञं पुराणं चिरन्तनम् अनुशासितारं सर्वस्य जगतः प्रशासितारम् अणोः सूक्ष्मादपि अणीयांसं सूक्ष्मतरम् अनुस्मरेत् अनुचिन्तयेत् यः कश्चित्, सर्वस्य कर्मफलजातस्य धातारं विधातारं विचित्रतया प्राणिभ्यो विभक्तारम्, अचिन्त्यरूपं न अस्य रूपं नियतं विद्यमानमपि केनचित् चिन्तयितुं शक्यते इति अचिन्त्यरूपः तम्, आदित्यवर्णम् आदित्यस्येव नित्यचैतन्यप्रकाशो वर्णो यस्य तम् आदित्यवर्णम्, तमसः परस्तात् अज्ञानलक्षणात् मोहान्धकारात् परं तम् अनुचिन्तयन् याति इति पूर्वेण सम्बन्धः॥ ९॥", "padacchedaText": "", "audioFile": "PB_001505.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001506", "originalText": "किञ्च—\nप्रयाणकाले मनसाचलेन\nभक्त्या युक्तो योगबलेन चैव। भ्रुवोर्मध्ये प्राणमावेश्य सम्य\nक्स तं परं पुरुषमुपैति दिव्यम्॥ १०॥", "padacchedaText": "", "audioFile": "PB_001506.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001507", "originalText": "प्रयाणकाले मरणकाले मनसा अचलेन चलनवर्जितेन भक्त्या युक्तः भजनं भक्तिः तया युक्तः योगबलेन चैव योगस्य बलं योगबलं समाधिजसंस्कारप्रचयजनितचित्तस्थैर्यलक्षणं योगबलं तेन च युक्तः इत्यर्थः, पूर्वं हृदयपुण्डरीके वशीकृत्य चित्तं ततः ऊर्ध्वगामिन्या नाड्या भूमिजयक्रमेण भ्रुवोः मध्ये प्राणम् आवेश्य स्थापयित्वा सम्यक् अप्रमत्तः सन्, सः एवं विद्वान् योगी ‘कविं पुराणम्’ (भ.गी.८.९) इत्यादिलक्षणं तं परं परतरं पुरुषम् उपैति प्रतिपद्यते दिव्यं द्योतनात्मकम्॥ १०॥", "padacchedaText": "", "audioFile": "PB_001507.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001508", "originalText": "पुनरपि वक्ष्यमाणेन उपायेन प्रतिपित्सितस्य ब्रह्मणो वेदविद्वदनादिविशेषणविशेष्यस्य अभिधानं करोति भगवान्—\nयदक्षरं वेदविदो वदन्ति\nविशन्ति यद्यतयो वीतरागाः।", "padacchedaText": "", "audioFile": "PB_001508.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001509", "originalText": "यदिच्छन्तो ब्रह्मचर्यं चरन्ति\nतत्ते पदं सङ्ग्रहेण प्रवक्ष्ये॥ ११॥", "padacchedaText": "", "audioFile": "PB_001509.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001510", "originalText": "यत् अक्षरं न क्षरतीति अक्षरम् अविनाशि वेदविदः वेदार्थज्ञाः वदन्ति, ‘तद्वा एतदक्षरं गार्गि ब्राह्मणा अभिवदन्ति’ (बृ.३.८.८) इति श्रुतेः, सर्वविशेषनिवर्तकत्वेन अभिवदन्ति ‘अस्थूलमनणु’ इत्यादि।", "padacchedaText": "", "audioFile": "PB_001510.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001511", "originalText": "किञ्च— विशन्ति प्रविशन्ति सम्यग्दर्शनप्राप्तौ सत्यां यत् यतयः यतनशीलाः संन्यासिनः वीतरागाः वीतः विगतः रागः येभ्यः ते वीतरागाः।", "padacchedaText": "", "audioFile": "PB_001511.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001512", "originalText": "यच्च अक्षरमिच्छन्तः— ज्ञातुम् इति वाक्यशेषः— ब्रह्मचर्यं गुरौ चरन्ति आचरन्ति, तत् ते पदं तत् अक्षराख्यं पदं पदनीयं ते तव सङ्ग्रहेण सङ्ग्रहः सङ्क्षेपः तेन सङ्क्षेपेण प्रवक्ष्ये कथयिष्यामि॥ ११॥", "padacchedaText": "", "audioFile": "PB_001512.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001513", "originalText": "‘स यो ह वै तद्भगवन्मनुष्येषु प्रायणान्तमोङ्कारमभिध्यायीत कतमम् वाव स तेन लोकं जयतीति।", "padacchedaText": "", "audioFile": "PB_001513.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001514", "originalText": "’ (प्र.५.१)‘तस्मै स होवाच एतद्वै सत्यकाम परं चापरं च ब्रह्म यदोङ्कारः’ (प्र.५.२) इत्युपक्रम्य ‘यः पुनरेतं त्रिमात्रेणोमित्येतेनैवाक्षरेण परं पुरुषमभिध्यायीत— स सामभिरुन्नीयते ब्रह्मलोकम्’ (प्र.५.५) इत्यादिना वचनेन, ‘अन्यत्र धर्मादन्यत्राधर्मात्’ (क.१.२.१४) इति च उपक्रम्य ‘सर्वे वेदा यत्पदमामनन्ति।", "padacchedaText": "", "audioFile": "PB_001514.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001515", "originalText": "तपांसि सर्वाणि च यद्वदन्ति।", "padacchedaText": "", "audioFile": "PB_001515.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001516", "originalText": "यदिच्छन्तो ब्रह्मचर्यं चरन्ति तत्ते पदं सङ्ग्रहेण ब्रवीम्योमित्येतत्’ (क.१.२.१५) इत्यादिभिश्च वचनैः परस्य ब्रह्मणो वाचकरूपेण, प्रतिमावत् प्रतीकरूपेण वा, परब्रह्मप्रतिपत्तिसाधनत्वेन मन्दमध्यमबुद्धीनां विवक्षितस्य ओङ्कारस्य उपासनं कालान्तरे मुक्तिफलम् उक्तं यत्, तदेव इहापि ‘कविं पुराणमनुशासितारम्’ (भ.गी.८.९) ‘यदक्षरं वेदविदो वदन्ति’ (भ.गी.८.११) इति च उपन्यस्तस्य परस्य ब्रह्मणः पूर्वोक्तरूपेण प्रतिपत्त्युपायभूतस्य ओङ्कारस्य कालान्तरमुक्तिफलम् उपासनं योगधारणासहितं वक्तव्यम्, प्रसक्तानुप्रसक्तं च यत्किञ्चित्, इत्येवमर्थः उत्तरो ग्रन्थ आरभ्यते—\nसर्वद्वाराणि संयम्य मनो हृदि निरुध्य च।", "padacchedaText": "", "audioFile": "PB_001516.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001517", "originalText": "मूर्ध्न्याधायात्मनः प्राणमास्थितो योगधारणाम्॥ १२॥", "padacchedaText": "", "audioFile": "PB_001517.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001518", "originalText": "सर्वद्वाराणि सर्वाणि च तानि द्वाराणि च सर्वद्वाराणि उपलब्धौ, तानि सर्वाणि संयम्य संयमनं कृत्वा मनः हृदि हृदयपुण्डरीके निरुध्य निरोधं कृत्वा निष्प्रचारमापाद्य, तत्र वशीकृतेन मनसा हृदयात् ऊर्ध्वगामिन्या नाड्या ऊर्ध्वमारुह्य मूर्ध्नि आधाय आत्मनः प्राणम् आस्थितः प्रवृत्तः योगधारणां धारयितुम्॥ १२॥", "padacchedaText": "", "audioFile": "PB_001518.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001519", "originalText": "तत्रैव च धारयन्—\nओमित्येकाक्षरं ब्रह्म\nव्याहरन्मामनुस्मरन्। यः प्रयाति त्यजन्देहं\nस याति परमां गतिम्॥ १३॥", "padacchedaText": "", "audioFile": "PB_001519.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001520", "originalText": "ओमिति एकाक्षरं ब्रह्म ब्रह्मणः अभिधानभूतम् ओङ्कारं व्याहरन् उच्चारयन्, तदर्थभूतं माम् ईश्वरम् अनुस्मरन् अनुचिन्तयन् यः प्रयाति म्रियते, सः त्यजन् परित्यजन् देहं शरीरम्— ‘त्यजन् देहम्’ इति प्रयाणविशेषणार्थम् देहत्यागेन प्रयाणम् आत्मनः, न स्वरूपनाशेनेत्यर्थः— सः एवं याति गच्छति परमां प्रकृष्टां गतिम्॥ १३॥", "padacchedaText": "", "audioFile": "PB_001520.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001521", "originalText": "किञ्च—\nअनन्यचेताः सततं यो मां स्मरति नित्यशः। तस्याहं सुलभः पार्थ नित्ययुक्तस्य योगिनः॥ १४॥", "padacchedaText": "", "audioFile": "PB_001521.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001522", "originalText": "अनन्यचेताः न अन्यविषये चेतः यस्य सोऽयम् अनन्यचेताः, योगी सततं सर्वदा यः मां परमेश्वरं स्मरति नित्यशः।", "padacchedaText": "", "audioFile": "PB_001522.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001523", "originalText": "सततम् इति नैरन्तर्यम् उच्यते, नित्यशः इति दीर्घकालत्वम् उच्यते।", "padacchedaText": "", "audioFile": "PB_001523.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001524", "originalText": "न षण्मासं संवत्सरं वा, किं तर्हि? यावज्जीवं नैरन्तर्येण यः मां स्मरतीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001524.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001525", "originalText": "तस्य योगिनः अहं सुलभः सुखेन लभ्यः हे पार्थ, नित्ययुक्तस्य सदा समाहितचित्तस्य योगिनः। यतः एवम्, अतः अनन्यचेताः सन् मयि सदा समाहितः भवेत्॥ १४॥", "padacchedaText": "", "audioFile": "PB_001525.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001526", "originalText": "तव सौलभ्येन किं स्यात् इत्युच्यते, शृणु तत् मम सौलभ्येन यत् भवति—\nमामुपेत्य पुनर्जन्म दुःखालयमशाश्वतम्। नाप्नुवन्ति महात्मानः संसिद्धिं परमां गताः॥ १५॥", "padacchedaText": "", "audioFile": "PB_001526.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001527", "originalText": "माम् उपेत्य माम् ईश्वरम् उपेत्य मद्भावमापद्य पुनर्जन्म पुनरुत्पत्तिं नाप्नुवन्ति न प्राप्नुवन्ति।", "padacchedaText": "", "audioFile": "PB_001527.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001528", "originalText": "किंविशिष्टं पुनर्जन्म न प्राप्नुवन्ति इति, तद्विशेषणमाह— दुःखालयं दुःखानाम् आध्यात्मिकादीनां आलयम् आश्रयम् आलीयन्ते यस्मिन् दुःखानि इति दुःखालयं जन्म।", "padacchedaText": "", "audioFile": "PB_001528.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001529", "originalText": "न केवलं दुःखालयम्, अशाश्वतम् अनवस्थितस्वरूपं च।", "padacchedaText": "", "audioFile": "PB_001529.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001530", "originalText": "नाप्नुवन्ति ईदृशं पुनर्जन्म महात्मानः यतयः संसिद्धिं मोक्षाख्यां परमां प्रकृष्टां गताः प्राप्ताः। ये पुनः मां न प्राप्नुवन्ति ते पुनः आवर्तन्ते॥ १५॥", "padacchedaText": "", "audioFile": "PB_001530.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001531", "originalText": "किं पुनः त्वत्तः अन्यत् प्राप्ताः पुनरावर्तन्ते इति, उच्यते—\nआ ब्रह्मभुवनाल्लोकाः पुनरावर्तिनोऽर्जुन। मामुपेत्य तु कौन्तेय पुनर्जन्म न विद्यते॥ १६॥", "padacchedaText": "", "audioFile": "PB_001531.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001532", "originalText": "आ ब्रह्मभुवनात् भवन्ति अस्मिन् भूतानि इति भुवनम्, ब्रह्मणो भुवनं ब्रह्मभुवनम्, ब्रह्मलोक इत्यर्थः, आ ब्रह्मभुवनात् सह ब्रह्मभुवनेन लोकाः सर्वे पुनरावर्तिनः पुनरावर्तनस्वभावाः हे अर्जुन।", "padacchedaText": "", "audioFile": "PB_001532.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001533", "originalText": "माम् एकम् उपेत्य तु कौन्तेय पुनर्जन्म पुनरुत्पत्तिः न विद्यते॥ १६॥", "padacchedaText": "", "audioFile": "PB_001533.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001534", "originalText": "ब्रह्मलोकसहिताः लोकाः कस्मात् पुनरावर्तिनः? कालपरिच्छिन्नत्वात्।", "padacchedaText": "", "audioFile": "PB_001534.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001535", "originalText": "कथम्?—\nसहस्रयुगपर्यन्तमहर्यद्ब्रह्मणो विदुः। रात्रिं युगसहस्रान्तां तेऽहोरात्रविदो जनाः॥ १७॥", "padacchedaText": "", "audioFile": "PB_001535.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001536", "originalText": "सहस्रयुगपर्यन्तं सहस्राणि युगानि पर्यन्तः पर्यवसानं यस्य अह्नः तत् अहः सहस्रयुगपर्यन्तम्, ब्रह्मणः प्रजापतेः विराजः विदुः, रात्रिम् अपि युगसहस्रान्तां अहःपरिमाणामेव।", "padacchedaText": "", "audioFile": "PB_001536.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001537", "originalText": "के विदुरित्याह— ते अहोरात्रविदः कालसङ्ख्याविदो जनाः इत्यर्थः। यतः एवं कालपरिच्छिन्नाः ते, अतः पुनरावर्तिनो लोकाः॥ १७॥", "padacchedaText": "", "audioFile": "PB_001537.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001538", "originalText": "प्रजापतेः अहनि यत् भवति रात्रौ च, तत् उच्यते—\nअव्यक्ताद्व्यक्तयः सर्वाः प्रभवन्त्यहरागमे। रात्र्यागमे प्रलीयन्ते तत्रैवाव्यक्तसंज्ञके॥ १८॥", "padacchedaText": "", "audioFile": "PB_001538.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001539", "originalText": "अव्यक्तात् अव्यक्तं प्रजापतेः स्वापावस्था तस्मात् अव्यक्तात् व्यक्तयः व्यज्यन्त इति व्यक्तयः स्थावरजङ्गमलक्षणाः सर्वाः प्रजाः प्रभवन्ति अभिव्यज्यन्ते, अह्नः आगमः अहरागमः तस्मिन् अहरागमे काले ब्रह्मणः प्रबोधकाले।", "padacchedaText": "", "audioFile": "PB_001539.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001540", "originalText": "तथा रात्र्यागमे ब्रह्मणः स्वापकाले प्रलीयन्ते सर्वाः व्यक्तयः तत्रैव पूर्वोक्ते अव्यक्तसंज्ञके॥ १८॥", "padacchedaText": "", "audioFile": "PB_001540.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001541", "originalText": "अकृताभ्यागमकृतविप्रणाशदोषपरिहारार्थम्, बन्धमोक्षशास्त्रप्रवृत्तिसाफल्यप्रदर्शनार्थम् अविद्यादिक्लेशमूलकर्माशयवशाच्च अवशः भूतग्रामः भूत्वा भूत्वा प्रलीयते इत्यतः संसारे वैराग्यप्रदर्शनार्थं च इदमाह—\nभूतग्रामः स एवायं भूत्वा भूत्वा प्रलीयते।", "padacchedaText": "", "audioFile": "PB_001541.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001542", "originalText": "रात्र्यागमेऽवशः पार्थ प्रभवत्यहरागमे॥ १९॥", "padacchedaText": "", "audioFile": "PB_001542.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001543", "originalText": "भूतग्रामः भूतसमुदायः स्थावरजङ्गमलक्षणः यः पूर्वस्मिन् कल्पे आसीत् स एव अयं नान्यः। भूत्वा भूत्वा अहरागमे, प्रलीयते पुनः पुनः रात्र्यागमे अह्नः क्षये अवशः अस्वतन्त्र एव, हे पार्थ, प्रभवति जायते अवश एव अहरागमे॥ १९॥", "padacchedaText": "", "audioFile": "PB_001543.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001544", "originalText": "यत् उपन्यस्तम् अक्षरम्, तस्य प्राप्त्युपायो निर्दिष्टः ‘ओमित्येकाक्षरं ब्रह्म’ (भ.गी.८.१३) इत्यादिना।", "padacchedaText": "", "audioFile": "PB_001544.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001545", "originalText": "अथ इदानीम् अक्षरस्यैव स्वरूपनिर्दिदिक्षया इदम् उच्यते, अनेन योगमार्गेण इदं गन्तव्यमिति—\nपरस्तस्मात्तु भावोऽन्योऽव्यक्तोऽव्यक्तात्सनातनः। यः स सर्वेषु भूतेषु नश्यत्सु न विनश्यति॥ २०॥", "padacchedaText": "", "audioFile": "PB_001545.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001546", "originalText": "परः व्यतिरिक्तः भिन्नः, कुतः? तस्मात् पूर्वोक्तात्।", "padacchedaText": "", "audioFile": "PB_001546.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001547", "originalText": "तु—शब्दः अक्षरस्य विवक्षितस्य अव्यक्तात् वैलक्षण्यविशेषणार्थः।", "padacchedaText": "", "audioFile": "PB_001547.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001548", "originalText": "भावः अक्षराख्यं परं ब्रह्म।", "padacchedaText": "", "audioFile": "PB_001548.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001549", "originalText": "व्यतिरिक्तत्वे सत्यपि सालक्षण्यप्रसङ्गोऽस्तीति तद्विनिवृत्त्यर्थम् आह— अन्यः इति।", "padacchedaText": "", "audioFile": "PB_001549.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001550", "originalText": "अन्यः विलक्षणः।", "padacchedaText": "", "audioFile": "PB_001550.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001551", "originalText": "स च अव्यक्तः अनिन्द्रियगोचरः।", "padacchedaText": "", "audioFile": "PB_001551.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001552", "originalText": "‘परस्तस्मात्’ इत्युक्तम्, कस्मात् पुनः परः? पूर्वोक्तात् भूतग्रामबीजभूतात् अविद्यालक्षणात् अव्यक्तात्।", "padacchedaText": "", "audioFile": "PB_001552.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001553", "originalText": "अन्यः विलक्षणः भावः इत्यभिप्रायः। सनातनः चिरन्तनः यः सः भावः सर्वेषु भूतेषु ब्रह्मादिषु नश्यत्सु न विनश्यति॥ २०॥", "padacchedaText": "", "audioFile": "PB_001553.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001554", "originalText": "अव्यक्तोऽक्षर इत्युक्तस्तमाहुः परमां गतिम्। यं प्राप्य न निवर्तन्ते तद्धाम परमं मम॥ २१॥", "padacchedaText": "", "audioFile": "PB_001554.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001555", "originalText": "योऽसौ अव्यक्तः अक्षरः इत्युक्तः, तमेव अक्षरसंज्ञकम् अव्यक्तं भावम् आहुः परमां प्रकृष्टां गतिम्। यं परं भावं प्राप्य गत्वा न निवर्तन्ते संसाराय, तत् धाम स्थानं परमं प्रकृष्टं मम, विष्णोः परमं पदमित्यर्थः॥ २१॥", "padacchedaText": "", "audioFile": "PB_001555.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001556", "originalText": "तल्लब्धेः उपायः उच्यते—\nपुरुषः स परः पार्थ भक्त्या लभ्यस्त्वनन्यया। यस्यान्तःस्थानि भूतानि येन सर्वमिदं ततम्॥ २२॥", "padacchedaText": "", "audioFile": "PB_001556.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001557", "originalText": "पुरुषः पुरि शयनात् पूर्णत्वाद्वा, स परः पार्थ, परः निरतिशयः, यस्मात् पुरुषात् न परं किञ्चित्।", "padacchedaText": "", "audioFile": "PB_001557.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001558", "originalText": "सः भक्त्या लभ्यस्तु ज्ञानलक्षणया अनन्यया आत्मविषयया।", "padacchedaText": "", "audioFile": "PB_001558.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001559", "originalText": "यस्य पुरुषस्य अन्तःस्थानि मध्यस्थानि भूतानि कार्यभूतानि, कार्यं हि कारणस्य अन्तर्वर्ति भवति। येन पुरुषेण सर्वं इदं जगत् ततं व्याप्तम् आकाशेनेव घटादि॥ २२॥", "padacchedaText": "", "audioFile": "PB_001559.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001560", "originalText": "प्रकृतानां योगिनां प्रणवावेशितब्रह्मबुद्धीनां कालान्तरमुक्तिभाजां ब्रह्मप्रतिपत्तये उत्तरो मार्गो वक्तव्य इति ‘यत्र काले’ इत्यादि विवक्षितार्थसमर्पणार्थम् उच्यते, आवृत्तिमार्गोपन्यासः इतरमार्गस्तुत्यर्थः—\nयत्र काले त्वनावृत्तिमावृत्तिं चैव योगिनः।", "padacchedaText": "", "audioFile": "PB_001560.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001561", "originalText": "प्रयाता यान्ति तं कालं वक्ष्यामि भरतर्षभ॥ २३॥", "padacchedaText": "", "audioFile": "PB_001561.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001562", "originalText": "यत्र काले प्रयाताः इति व्यवहितेन सम्बन्धः।", "padacchedaText": "", "audioFile": "PB_001562.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001563", "originalText": "यत्र यस्मिन् काले तु अनावृत्तिम् अपुनर्जन्म आवृत्तिं तद्विपरीतां चैव।", "padacchedaText": "", "audioFile": "PB_001563.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001564", "originalText": "योगिनः इति योगिनः कर्मिणश्च उच्यन्ते, कर्मिणस्तु गुणतः— ‘कर्मयोगेन योगिनाम्’ (भ.गी.३.३) इति विशेषणात्— योगिनः। यत्र काले प्रयाताः मृताः योगिनः अनावृत्तिं यान्ति, यत्र काले च प्रयाताः आवृत्तिं यान्ति, तं कालं वक्ष्यामि भरतर्षभ॥ २३॥", "padacchedaText": "", "audioFile": "PB_001564.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001565", "originalText": "तं कालमाह—\nअग्निर्ज्योतिरहः शुक्लः षण्मासा उत्तरायणम्। तत्र प्रयाता गच्छन्ति ब्रह्म ब्रह्मविदो जनाः॥ २४॥", "padacchedaText": "", "audioFile": "PB_001565.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001566", "originalText": "अग्निः कालाभिमानिनी देवता।", "padacchedaText": "", "audioFile": "PB_001566.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001567", "originalText": "तथा ज्योतिरपि देवतैव कालाभिमानिनी।", "padacchedaText": "", "audioFile": "PB_001567.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001568", "originalText": "अथवा, अग्निज्योतिषी यथाश्रुते एव देवते।", "padacchedaText": "", "audioFile": "PB_001568.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001569", "originalText": "भूयसा तु निर्देशो ‘यत्र काले’ ‘तं कालम्’ इति आम्रवणवत्।", "padacchedaText": "", "audioFile": "PB_001569.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001570", "originalText": "तथा अहः देवता अहरभिमानिनी, शुक्लः शुक्लपक्षदेवता, षण्मासा उत्तरायणम्, तत्रापि देवतैव मार्गभूता इति स्थितः अन्यत्र अयं न्यायः।", "padacchedaText": "", "audioFile": "PB_001570.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001571", "originalText": "तत्र तस्मिन् मार्गे प्रयाताः मृताः गच्छन्ति ब्रह्म ब्रह्मविदो ब्रह्मोपासकाः ब्रह्मोपासनपरा जनाः।", "padacchedaText": "", "audioFile": "PB_001571.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001572", "originalText": "‘क्रमेण’ इति वाक्यशेषः।", "padacchedaText": "", "audioFile": "PB_001572.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001573", "originalText": "न हि सद्योमुक्तिभाजां सम्यग्दर्शननिष्ठानां गतिः आगतिर्वा क्वचित् अस्ति, ‘न तस्य प्राणा उत्क्रामन्ति’ (बृ.४.४.६) इति श्रुतेः। ब्रह्मसंलीनप्राणा एव ते ब्रह्ममया ब्रह्मभूता एव ते॥ २४॥", "padacchedaText": "", "audioFile": "PB_001573.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001574", "originalText": "धूमो रात्रिस्तथा कृष्णः षण्मासा दक्षिणायनम्। तत्र चान्द्रमसं ज्योतिर्योगी प्राप्य निवर्तते॥ २५॥", "padacchedaText": "", "audioFile": "PB_001574.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001575", "originalText": "धूमो रात्रिः धूमाभिमानिनी रात्र्यभिमानिनी च देवता।", "padacchedaText": "", "audioFile": "PB_001575.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001576", "originalText": "तथा कृष्णः कृष्णपक्षदेवता।", "padacchedaText": "", "audioFile": "PB_001576.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001577", "originalText": "षण्मासा दक्षिणायनम् इति च पूर्ववत् देवतैव। तत्र चन्द्रमसि भवं चान्द्रमसं ज्योतिः फलम् इष्टादिकारी योगी कर्मी प्राप्य भुक्त्वा तत्क्षयात् इह पुनः निवर्तते॥ २५॥", "padacchedaText": "", "audioFile": "PB_001577.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001578", "originalText": "शुक्लकृष्णे गती ह्येते जगतः शाश्वते मते। एकया यात्यनावृत्तिमन्ययावर्तते पुनः॥ २६॥", "padacchedaText": "", "audioFile": "PB_001578.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001579", "originalText": "शुक्लकृष्णे शुक्ला च कृष्णा च शुक्लकृष्णे, ज्ञानप्रकाशकत्वात् शुक्ला, तदभावात् कृष्णा, एते शुक्लकृष्णे हि गती जगतः इति अधिकृतानां ज्ञानकर्मणोः, न जगतः सर्वस्यैव एते गती सम्भवतः, शाश्वते नित्ये, संसारस्य नित्यत्वात्, मते अभिप्रेते।", "padacchedaText": "", "audioFile": "PB_001579.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001580", "originalText": "तत्र एकया शुक्लया याति अनावृत्तिम्, अन्यया इतरया आवर्तते पुनः भूयः॥ २६॥", "padacchedaText": "", "audioFile": "PB_001580.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001581", "originalText": "नैते सृती पार्थ जानन्योगी मुह्यति कश्चन। तस्मात्सर्वेषु कालेषु योगयुक्तो भवार्जुन॥ २७॥", "padacchedaText": "", "audioFile": "PB_001581.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001582", "originalText": "न एते यथोक्ते सृती मार्गौ पार्थ जानन् संसाराय एका, अन्या मोक्षाय इति, योगी न मुह्यति कश्चन कश्चिदपि। तस्मात् सर्वेषु कालेषु योगयुक्तः समाहितो भव अर्जुन॥ २७॥", "padacchedaText": "", "audioFile": "PB_001582.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001583", "originalText": "शृणु तस्य योगस्य माहात्म्यम्—\nवेदेषु यज्ञेषु तपःसु चैव\nदानेषु यत्पुण्यफलं प्रदिष्टम्। अत्येति तत्सर्वमिदं विदित्वा\nयोगी परं स्थानमुपैति चाद्यम्॥ २८॥", "padacchedaText": "", "audioFile": "PB_001583.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001584", "originalText": "वेदेषु सम्यगधीतेषु यज्ञेषु च साद्गुण्येन अनुष्ठितेषु तपःसु च सुतप्तेषु दानेषु च सम्यग्दत्तेषु, एतेषु यत् पुण्यफलं प्रदिष्टं शास्त्रेण, अत्येति अतीत्य गच्छति तत् सर्वं फलजातम्, इदं विदित्वा सप्तप्रश्ननिर्णयद्वारेण उक्तम् अर्थं सम्यक् अवधार्य अनुष्ठाय योगी, परम् उत्कृष्टम् ऐश्वरं स्थानम् उपैति च प्रतिपद्यते आद्यम् आदौ भवम्, कारणं ब्रह्म इत्यर्थः॥ २८॥", "padacchedaText": "", "audioFile": "PB_001584.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001585", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ श्रीमद्भगवद्गीताभाष्ये अष्टमोऽध्यायः॥", "padacchedaText": "", "audioFile": "PB_001585.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001586", "originalText": "नवमोऽध्यायः\nअष्टमे नाडीद्वारेण धारणायोगः सगुणः उक्तः।", "padacchedaText": "", "audioFile": "PB_001586.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001587", "originalText": "तस्य च फलम् अग्न्यर्चिरादिक्रमेण कालान्तरे ब्रह्मप्राप्तिलक्षणमेव अनावृत्तिरूपं निर्दिष्टम्।", "padacchedaText": "", "audioFile": "PB_001587.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001588", "originalText": "तत्र ‘अनेनैव प्रकारेण मोक्षप्राप्तिफलम् अधिगम्यते, न अन्यथा’ इति तदाशङ्काव्याविवर्तयिषया श्रीभगवान् उवाच—\nश्रीभगवानुवाच—\nइदं तु ते गुह्यतमं\nप्रवक्ष्याम्यनसूयवे।", "padacchedaText": "", "audioFile": "PB_001588.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001589", "originalText": "ज्ञानं विज्ञानसहितं\nयज्ज्ञात्वा मोक्ष्यसेऽशुभात्॥ १॥", "padacchedaText": "", "audioFile": "PB_001589.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001590", "originalText": "इदं ब्रह्मज्ञानं वक्ष्यमाणम् उक्तं च पूर्वेषु अध्यायेषु,\nतत् बुद्धौ संनिधीकृत्य इदम् इत्याह।", "padacchedaText": "", "audioFile": "PB_001590.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001591", "originalText": "तु—शब्दो विशेषनिर्धारणार्थः।", "padacchedaText": "", "audioFile": "PB_001591.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001592", "originalText": "इदमेव तु सम्यग्ज्ञानं साक्षात् मोक्षप्राप्तिसाधनम् ‘वासुदेवः सर्वमिति’ (भ.गी.७.१९) ‘आत्मैवेदं सर्वम्’ (छा.७.२५.२) ‘एकमेवाद्वितीयम्’ (छा.६.२.१) इत्यादिश्रुतिस्मृतिभ्यः, नान्यत्, ‘अथ ते येऽन्यथातो विदुः अन्यराजानः ते क्षय्यलोका भवन्ति’ (छा.७.२५.२) इत्यादिश्रुतिभ्यश्च।", "padacchedaText": "", "audioFile": "PB_001592.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001593", "originalText": "ते तुभ्यं गुह्यतमं गोप्यतमं प्रवक्ष्यामि कथयिष्यामि अनसूयवे असूयारहिताय।", "padacchedaText": "", "audioFile": "PB_001593.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001594", "originalText": "किं तत्? ज्ञानम्। किंविशिष्टम्? विज्ञानसहितम् अनुभवयुक्तम्, यत् ज्ञात्वा प्राप्य मोक्ष्यसे अशुभात् संसारबन्धनात्॥ १॥", "padacchedaText": "", "audioFile": "PB_001594.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001595", "originalText": "तच्च—\nराजविद्या राजगुह्यं पवित्रमिदमुत्तमम्। प्रत्यक्षावगमं धर्म्यं सुसुखं कर्तुमव्ययम्॥ २॥", "padacchedaText": "", "audioFile": "PB_001595.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001596", "originalText": "राजविद्या विद्यानां राजा, दीप्त्यतिशयवत्त्वात्, दीप्यते हि इयम् अतिशयेन ब्रह्मविद्या सर्वविद्यानाम्।", "padacchedaText": "", "audioFile": "PB_001596.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001597", "originalText": "तथा राजगुह्यं गुह्यानां राजा।", "padacchedaText": "", "audioFile": "PB_001597.
