File": "PB_003219.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003220", "originalText": "न तत् अस्ति तत् नास्ति पृथिव्यां वा मनुष्यादिषु सत्त्वं प्राणिजातम् अन्यद्वा अप्राणि, दिवि देवेषु वा पुनः सत्त्वम्, प्रकृतिजैः प्रकृतितः जातैः एभिः त्रिभिः गुणैः सत्त्वादिभिः मुक्तं परित्यक्तं यत् स्यात्, न तत् अस्ति इति पूर्वेण सम्बन्धः॥ ४०॥", "padacchedaText": "", "audioFile": "PB_003220.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003221", "originalText": "सर्वः संसारः क्रियाकारकफललक्षणः सत्त्वरजस्तमोगुणात्मकः अविद्यापरिकल्पितः समूलः अनर्थः उक्तः, वृक्षरूपकल्पनया च ‘ऊर्ध्वमूलम्’ (भ.गी.१५.१) इत्यादिना,तं च ‘असङ्गशस्त्रेण दृढेन च्छित्त्वा' 'ततः पदं तत्परिमार्गितव्यम्’ (भ.गी.१५.३), (भ.गी.१५.४) इति च उक्तम्।", "padacchedaText": "", "audioFile": "PB_003221.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003222", "originalText": "तत्र च सर्वस्य त्रिगुणात्मकत्वात् संसारकारणनिवृत्त्यनुपपत्तौ प्राप्तायाम्, यथा तन्निवृत्तिः स्यात् तथा वक्तव्यम्, सर्वश्च गीताशास्त्रार्थः उपसंहर्तव्यः, एतावानेव च सर्ववेदस्मृत्यर्थः पुरुषार्थम् इच्छद्भिः अनुष्ठेयः इत्येवमर्थम् ‘ब्राह्मणक्षत्रियविशाम्’ इत्यादिः आरभ्यते—\nब्राह्मणक्षत्रियविशां शूद्राणां च परन्तप।", "padacchedaText": "", "audioFile": "PB_003222.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003223", "originalText": "कर्माणि प्रविभक्तानि स्वभावप्रभवैर्गुणैः॥ ४१॥", "padacchedaText": "", "audioFile": "PB_003223.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003224", "originalText": "ब्राह्मणाश्च क्षत्रियाश्च विशश्च ब्राह्मणक्षत्रियविशः, तेषां ब्राह्मणक्षत्रियविशां शूद्राणां च— शूद्राणाम् असमासकरणम् एकजातित्वे सति वेदानधिकारात्— हे परन्तप, कर्माणि प्रविभक्तानि इतरेतरविभागेन व्यवस्थापितानि।", "padacchedaText": "", "audioFile": "PB_003224.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003225", "originalText": "केन? स्वभावप्रभवैः गुणैः, स्वभावः ईश्वरस्य प्रकृतिः त्रिगुणात्मिका माया सा प्रभवः येषां गुणानां ते स्वभावप्रभवाः, तैः, शमादीनि कर्माणि प्रविभक्तानि ब्राह्मणादीनाम्।", "padacchedaText": "", "audioFile": "PB_003225.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003226", "originalText": "अथवा ब्राह्मणस्वभावस्य सत्त्वगुणः प्रभवः कारणम्, तथा क्षत्रियस्वभावस्य सत्त्वोपसर्जनं रजः प्रभवः, वैश्यस्वभावस्य तमउपसर्जनं रजः प्रभवः, शूद्रस्वभावस्य रजउपसर्जनं तमः प्रभवः, प्रशान्त्यैश्वर्येहामूढतास्वभावदर्शनात् चतुर्णाम्।", "padacchedaText": "", "audioFile": "PB_003226.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003227", "originalText": "अथवा, जन्मान्तरकृतसंस्कारः प्राणिनां वर्तमानजन्मनि स्वकार्याभिमुखत्वेन अभिव्यक्तः स्वभावः, सः प्रभवो येषां गुणानां ते स्वभावप्रभवाः गुणाः, गुणप्रादुर्भावस्य निष्कारणत्वानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_003227.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003228", "originalText": "‘स्वभावः कारणम्’ इति च कारणविशेषोपादानम्। एवं स्वभावप्रभवैः प्रकृतिभवैः सत्त्वरजस्तमोभिः गुणैः स्वकार्यानुरूपेण शमादीनि कर्माणि प्रविभक्तानि॥", "padacchedaText": "", "audioFile": "PB_003228.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003229", "originalText": "ननु शास्त्रप्रविभक्तानि शास्त्रेण विहितानि ब्राह्मणादीनां शमादीनि कर्माणि, कथम् उच्यते सत्त्वादिगुणप्रविभक्तानि इति? नैष दोषः, शास्त्रेणापि ब्राह्मणादीनां सत्त्वादिगुणविशेषापेक्षयैव शमादीनि कर्माणि प्रविभक्तानि, न गुणानपेक्षया, इति शास्त्रप्रविभक्तान्यपि कर्माणि गुणप्रविभक्तानि इति उच्यते॥ ४१॥", "padacchedaText": "", "audioFile": "PB_003229.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003230", "originalText": "कानि पुनः तानि कर्माणि इति, उच्यते—\nशमो दमस्तपः शौचं\nक्षान्तिरार्जवमेव च। ज्ञानं विज्ञानमास्तिक्यं\nब्रह्मकर्म स्वभावजम्॥ ४२॥", "padacchedaText": "", "audioFile": "PB_003230.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003231", "originalText": "शमः दमश्च यथाव्याख्यातार्थौ, तपः यथोक्तं शारीरादि, शौचं व्याख्यातम्, क्षान्तिः क्षमा, आर्जवम् ऋजुता एव च ज्ञानं विज्ञानम्, आस्तिक्यम् आस्तिकभावः श्रद्दधानता आगमार्थेषु, ब्रह्मकर्म ब्राह्मणजातेः कर्म स्वभावजम्— यत् उक्तं स्वभावप्रभवैर्गुणैः प्रविभक्तानि इति तदेवोक्तं स्वभावजम् इति॥ ४२॥", "padacchedaText": "", "audioFile": "PB_003231.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003232", "originalText": "शौर्यं तेजो धृतिर्दाक्ष्यं युद्धे चाप्यपलायनम्। दानमीश्वरभावश्च क्षात्रं कर्म स्वभावजम्॥ ४३॥", "padacchedaText": "", "audioFile": "PB_003232.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003233", "originalText": "शौर्यं शूरस्य भावः, तेजः प्रागल्भ्यम्, धृतिः धारणम्, सर्वावस्थासु अनवसादः भवति यया धृत्या उत्तम्भितस्य, दाक्ष्यं दक्षस्य भावः, सहसा प्रत्युत्पन्नेषु कार्येषु अव्यामोहेन प्रवृत्तिः, युद्धे चापि अपलायनम् अपराङ्मुखीभावः शत्रुभ्यः, दानं देयद्रव्येषु मुक्तहस्तता, ईश्वरभावश्च ईश्वरस्य भावः, प्रभुशक्तिप्रकटीकरणम् ईशितव्यान् प्रति, क्षात्रं कर्म क्षत्रियजातेः विहितं कर्म क्षात्रं कर्म स्वभावजम्॥ ४३॥", "padacchedaText": "", "audioFile": "PB_003233.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003234", "originalText": "कृषिगौरक्ष्यवाणिज्यं वैश्यकर्म स्वभावजम्। परिचर्यात्मकं कर्म शूद्रस्यापि स्वभावजम्॥ ४४॥", "padacchedaText": "", "audioFile": "PB_003234.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003235", "originalText": "कृषिगौरक्ष्यवाणिज्यं कृषिश्च गौरक्ष्यं च वाणिज्यं च कृषिगौरक्ष्यवाणिज्यम्, कृषिः भूमेः विलेखनम्, गौरक्ष्यं गाः रक्षतीति गोरक्षः तस्य भावः गौरक्ष्यम्, पाशुपाल्यम् इत्यर्थः, वाणिज्यं वणिक्कर्म क्रयविक्रयादिलक्षणं वैश्यकर्म वैश्यजातेः कर्म वैश्यकर्म स्वभावजम्।", "padacchedaText": "", "audioFile": "PB_003235.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003236", "originalText": "परिचर्यात्मकं शुश्रूषास्वभावं कर्म शूद्रस्यापि स्वभावजम्॥ ४४॥", "padacchedaText": "", "audioFile": "PB_003236.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003237", "originalText": "एतेषां जातिविहितानां कर्मणां सम्यगनुष्ठितानां स्वर्गप्राप्तिः फलं स्वभावतः, ‘वर्णा आश्रमाश्च स्वकर्मनिष्ठाः प्रेत्य कर्मफलमनुभूय ततः शेषेण विशिष्टदेशजातिकुलधर्मायुःश्रुतवृत्तवित्तसुखमेधसो जन्म प्रतिपद्यन्ते’ (गौ.ध.२.२.२९), (मै.गौ.ध.११.३१) इत्यादिस्मृतिभ्यः, पुराणे च वर्णिनाम् आश्रमिणां च लोकफलभेदविशेषस्मरणात्।", "padacchedaText": "", "audioFile": "PB_003237.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003238", "originalText": "कारणान्तरात्तु इदं वक्ष्यमाणं फलम्—\nस्वे स्वे कर्मण्यभिरतः\nसंसिद्धिं लभते नरः। स्वकर्मनिरतः सिद्धिं\nयथा विन्दति तच्छृणु॥ ४५॥", "padacchedaText": "", "audioFile": "PB_003238.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003239", "originalText": "स्वे स्वे यथोक्तलक्षणभेदे कर्मणि अभिरतः तत्परः संसिद्धिं स्वकर्मानुष्ठानात् अशुद्धिक्षये सति कायेन्द्रियाणां ज्ञाननिष्ठायोग्यतालक्षणां संसिद्धिं लभते प्राप्नोति नरः अधिकृतः पुरुषः, किं स्वकर्मानुष्ठानत एव साक्षात् संसिद्धिः? न, कथं तर्हि? स्वकर्मनिरतः सिद्धिं यथा येन प्रकारेण विन्दति, तत् शृणु॥ ४५॥", "padacchedaText": "", "audioFile": "PB_003239.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003240", "originalText": "यतः प्रवृत्तिर्भूतानां\nयेन सर्वमिदं ततम्। स्वकर्मणा तमभ्यर्च्य\nसिद्धिं विन्दति मानवः॥ ४६॥", "padacchedaText": "", "audioFile": "PB_003240.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003241", "originalText": "यतः यस्मात् प्रवृत्तिः उत्पत्तिः चेष्टा वा यस्मात् अन्तर्यामिणः ईश्वरात् भूतानां प्राणिनां स्यात्, येन ईश्वरेण सर्वम् इदं ततं जगत् व्याप्तं स्वकर्मणा पूर्वोक्तेन प्रतिवर्णं तम् ईश्वरम् अभ्यर्च्य पूजयित्वा आराध्य केवलं ज्ञाननिष्ठायोग्यतालक्षणां सिद्धिं विन्दति मानवः मनुष्यः॥ ४६॥", "padacchedaText": "", "audioFile": "PB_003241.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003242", "originalText": "यतः एवम्, अतः—\nश्रेयान्स्वधर्मो विगुणः\nपरधर्मात्स्वनुष्ठितात्। स्वभावनियतं कर्म\nकुर्वन्नाप्नोति किल्बिषम्॥ ४७॥", "padacchedaText": "", "audioFile": "PB_003242.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003243", "originalText": "श्रेयान् प्रशस्यतरः स्वो धर्मः स्वधर्मः, विगुणोऽपि इति अपिशब्दो द्रष्टव्यः, परधर्मात्।", "padacchedaText": "", "audioFile": "PB_003243.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003244", "originalText": "स्वभावनियतं स्वभावेन नियतम्, यदुक्तं स्वभावजमिति, तदेवोक्तं स्वभावनियतम् इति, यथा विषजातस्य कृमेः विषं न दोषकरम्, तथा स्वभावनियतं कर्म कुर्वन् न आप्नोति किल्बिषं पापम्॥ ४७॥", "padacchedaText": "", "audioFile": "PB_003244.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003245", "originalText": "स्वभावनियतं कर्म कुर्वाणो विषजः इव कृमिः किल्बिषं न आप्नोतीति उक्तम्, परधर्मश्च भयावहः इति, अनात्मज्ञश्च ‘न हि कश्चित्क्षणमपि अकर्मकृत्तिष्ठति’ (भ.गी.३.५) इति।", "padacchedaText": "", "audioFile": "PB_003245.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003246", "originalText": "अतः—\nसहजं कर्म कौन्तेय\nसदोषमपि न त्यजेत्। सर्वारम्भा हि दोषेण\nधूमेनाग्निरिवावृताः॥ ४८॥", "padacchedaText": "", "audioFile": "PB_003246.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003247", "originalText": "सहजं सह जन्मनैव उत्पन्नम्।", "padacchedaText": "", "audioFile": "PB_003247.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003248", "originalText": "किं तत्? कर्म कौन्तेय सदोषमपि त्रिगुणात्मकत्वात् न त्यजेत्।", "padacchedaText": "", "audioFile": "PB_003248.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003249", "originalText": "सर्वारम्भाः आरभ्यन्त इति आरम्भाः, सर्वकर्माणि इत्येतत्, प्रकरणात् ये केचित् आरम्भाः स्वधर्माः परधर्माश्च, ते सर्वे हि यस्मात्— त्रिगुणात्मकत्वम् अत्र हेतुः— त्रिगुणात्मकत्वात् दोषेण धूमेन सहजेन अग्निरिव, आवृताः।", "padacchedaText": "", "audioFile": "PB_003249.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003250", "originalText": "सहजस्य कर्मणः स्वधर्माख्यस्य परित्यागेन परधर्मानुष्ठानेऽपि दोषात् नैव मुच्यते, भयावहश्च परधर्मः। न च शक्यते अशेषतः त्यक्तुम् अज्ञेन कर्म यतः, तस्मात् न त्यजेत् इत्यर्थः॥", "padacchedaText": "", "audioFile": "PB_003250.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003251", "originalText": "किम् अशेषतः त्यक्तुम् अशक्यं कर्म इति न त्यजेत्? किं वा सहजस्य कर्मणः त्यागे दोषो भवतीति? किं च अतः? यदि तावत् अशेषतः त्यक्तुम् अशक्यम् इति न त्याज्यं सहजं कर्म, एवं तर्हि अशेषतः त्यागे गुण एव स्यादिति सिद्धं भवति।", "padacchedaText": "", "audioFile": "PB_003251.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003252", "originalText": "सत्यम् एवम्, अशेषतः त्याग एव न उपपद्यते इति चेत्, किं नित्यप्रचलितात्मकः पुरुषः, यथा साङ्ख्यानां गुणाः? किं वा क्रियैव कारकम्, यथा बौद्धानां स्कन्धाः क्षणप्रध्वंसिनः? उभयथापि कर्मणः अशेषतः त्यागः न सम्भवति।", "padacchedaText": "", "audioFile": "PB_003252.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003253", "originalText": "अथ तृतीयोऽपि पक्षः— यदा करोति तदा सक्रियं वस्तु।", "padacchedaText": "", "audioFile": "PB_003253.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003254", "originalText": "यदा न करोति, तदा निष्क्रियं तदेव।", "padacchedaText": "", "audioFile": "PB_003254.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003255", "originalText": "तत्र एवं सति शक्यं कर्म अशेषतः त्यक्तुम्।", "padacchedaText": "", "audioFile": "PB_003255.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003256", "originalText": "अयं तु अस्मिन् तृतीये पक्षे विशेषः— न नित्यप्रचलितं वस्तु, नापि क्रियैव कारकम्।", "padacchedaText": "", "audioFile": "PB_003256.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003257", "originalText": "किं तर्हि? व्यवस्थिते द्रव्ये अविद्यमाना क्रिया उत्पद्यते, विद्यमाना च विनश्यति।", "padacchedaText": "", "audioFile": "PB_003257.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003258", "originalText": "शुद्धं तत् द्रव्यं शक्तिमत् अवतिष्ठते।", "padacchedaText": "", "audioFile": "PB_003258.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003259", "originalText": "इति एवम् आहुः काणादाः।", "padacchedaText": "", "audioFile": "PB_003259.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003260", "originalText": "तदेव च कारकम् इति।", "padacchedaText": "", "audioFile": "PB_003260.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003261", "originalText": "अस्मिन् पक्षे को दोषः इति।", "padacchedaText": "", "audioFile": "PB_003261.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003262", "originalText": "अयमेव तु दोषः— यतस्तु अभागवतं मतम् इदम्।", "padacchedaText": "", "audioFile": "PB_003262.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003263", "originalText": "कथं ज्ञायते? यतः आह भगवान् ‘नासतो विद्यते भावः’ (भ.गी.२.१६) इत्यादि।", "padacchedaText": "", "audioFile": "PB_003263.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003264", "originalText": "काणादानां हि असतः भावः, सतश्च अभावः, इति इदं मतम् अभागवतम्।", "padacchedaText": "", "audioFile": "PB_003264.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003265", "originalText": "अभागवतमपि न्यायवच्चेत् को दोषः इति चेत्, उच्यते— दोषवत्तु इदम्, सर्वप्रमाणविरोधात्।", "padacchedaText": "", "audioFile": "PB_003265.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003266", "originalText": "कथम्? यदि तावत् द्व्यणुकादि द्रव्यं प्राक् उत्पत्तेः अत्यन्तमेव असत्, उत्पन्नं च स्थितं कञ्चित् कालं पुनः अत्यन्तमेव असत्त्वम् आपद्यते, तथा च सति असदेव सत् जायते, सदेव असत्त्वम् आपद्यते, अभावः भावो भवति, भावश्च अभावो भवति, तत्र अभावः जायमानः प्राक् उत्पत्तेः शशविषाणकल्पः समवाय्यसमवायिनिमित्ताख्यं कारणम् अपेक्ष्य जायते इति।", "padacchedaText": "", "audioFile": "PB_003266.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003267", "originalText": "न च एवम् अभावः उत्पद्यते, कारणं च अपेक्षते इति शक्यं वक्तुम्, असतां शशविषाणादीनाम् अदर्शनात्।", "padacchedaText": "", "audioFile": "PB_003267.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003268", "originalText": "भावात्मकाश्चेत् घटादयः उत्पद्यमानाः, किञ्चित् अभिव्यक्तिमात्रे कारणम् अपेक्ष्य उत्पद्यन्ते इति शक्यं प्रतिपत्तुम्। किञ्च, असतश्च सतश्च सद्भावे असद्भावे न क्वचित् प्रमाणप्रमेयव्यवहारेषु विश्वासः कस्यचित् स्यात्, ‘सत् सदेव असत् असदेव’ इति निश्चयानुपपत्तेः॥", "padacchedaText": "", "audioFile": "PB_003268.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003269", "originalText": "किञ्च, उत्पद्यते इति द्व्यणुकादेः द्रव्यस्य स्वकारणसत्तासम्बन्धम् आहुः।", "padacchedaText": "", "audioFile": "PB_003269.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003270", "originalText": "प्राक् उत्पत्तेश्च असत्, पश्चात् कारणव्यापारम् अपेक्ष्य स्वकारणैः परमाणुभिः सत्तया च समवायलक्षणेन सम्बन्धेन सम्बध्यते।", "padacchedaText": "", "audioFile": "PB_003270.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003271", "originalText": "सम्बद्धं सत् कारणसमवेतं सत् भवति। तत्र वक्तव्यं कथम् असतः स्वं कारणं भवेत् सम्बन्धो वा केनचित् स्यात्? न हि वन्ध्यापुत्रस्य स्वं कारणं सम्बन्धो वा केनचित् प्रमाणतः कल्पयितुं शक्यते॥", "padacchedaText": "", "audioFile": "PB_003271.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003272", "originalText": "ननु नैवं वैशेषिकैः अभावस्य सम्बन्धः कल्प्यते।", "padacchedaText": "", "audioFile": "PB_003272.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003273", "originalText": "द्व्यणुकादीनां हि द्रव्याणां स्वकारणसमवायलक्षणः सम्बन्धः सतामेव उच्यते इति।", "padacchedaText": "", "audioFile": "PB_003273.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003274", "originalText": "न, सम्बन्धात् प्राक् सत्त्वानभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_003274.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003275", "originalText": "न हि वैशेषिकैः कुलालदण्डचक्रादिव्यापारात् प्राक् घटादीनाम् अस्तित्वम् इष्यते।", "padacchedaText": "", "audioFile": "PB_003275.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003276", "originalText": "न च मृद एव घटाद्याकारप्राप्तिम् इच्छन्ति। ततश्च असत एव सम्बन्धः पारिशेष्यात् इष्टो भवति॥", "padacchedaText": "", "audioFile": "PB_003276.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003277", "originalText": "ननु असतोऽपि समवायलक्षणः सम्बन्धः न विरुद्धः।", "padacchedaText": "", "audioFile": "PB_003277.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003278", "originalText": "न, वन्ध्यापुत्रादीनाम् अदर्शनात्।", "padacchedaText": "", "audioFile": "PB_003278.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003279", "originalText": "घटादेरेव प्रागभावस्य स्वकारणसम्बन्धो भवति न वन्ध्यापुत्रादेः, अभावस्य तुल्यत्वेऽपि इति विशेषः अभावस्य वक्तव्यः।", "padacchedaText": "", "audioFile": "PB_003279.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003280", "originalText": "एकस्य अभावः, द्वयोः अभावः, सर्वस्य अभावः, प्रागभावः, प्रध्वंसाभावः, इतरेतराभावः, अत्यन्ताभावः इति लक्षणतो न केनचित् विशेषो दर्शयितुं शक्यः।", "padacchedaText": "", "audioFile": "PB_003280.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003281", "originalText": "असति च विशेषे घटस्य प्रागभावः एव कुलालादिभिः घटभावम् आपद्यते सम्बध्यते च भावेन कपालाख्येन, सम्बद्धश्च सर्वव्यवहारयोग्यश्च भवति, न तु घटस्यैव प्रध्वंसाभावः अभावत्वे सत्यपि, इति प्रध्वंसाद्यभावानां न क्वचित् व्यवहारयोग्यत्वम्, प्रागभावस्यैव द्व्यणुकादिद्रव्याख्यस्य उत्पत्त्यादिव्यवहारार्हत्वम् इत्येतत् असमञ्जसम्, अभावत्वाविशेषात् अत्यन्तप्रध्वंसाभावयोरिव॥", "padacchedaText": "", "audioFile": "PB_003281.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003282", "originalText": "ननु नैव अस्माभिः प्रागभावस्य भावापत्तिः उच्यते।", "padacchedaText": "", "audioFile": "PB_003282.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003283", "originalText": "भावस्यैव तर्हि भावापत्तिः, यथा घटस्य घटापत्तिः, पटस्य वा पटापत्तिः।", "padacchedaText": "", "audioFile": "PB_003283.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003284", "originalText": "एतदपि अभावस्य भावापत्तिवदेव प्रमाणविरुद्धम्।", "padacchedaText": "", "audioFile": "PB_003284.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003285", "originalText": "साङ्ख्यस्यापि यः परिणामपक्षः सोऽपि अपूर्वधर्मोत्पत्तिविनाशाङ्गीकरणात् वैशेषिकपक्षात् न विशिष्यते।", "padacchedaText": "", "audioFile": "PB_003285.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003286", "originalText": "अभिव्यक्तितिरोभावाङ्गीकरणेऽपि अभिव्यक्तितिरोभावयोः विद्यमानत्वाविद्यमानत्वनिरूपणे पूर्ववदेव प्रमाणविरोधः। एतेन कारणस्यैव संस्थानम् उत्पत्त्यादि इत्येतदपि प्रत्युक्तम्॥", "padacchedaText": "", "audioFile": "PB_003286.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003287", "originalText": "पारिशेष्यात् सत् एकमेव वस्तु अविद्यया उत्पत्तिविनाशादिधर्मैः अनेकधा नटवत् विकल्प्यते इति। इदं भागवतं मतम् उक्तम् ‘नासतो विद्यते भावः’ (भ.गी.२.१६) इत्यस्मिन् श्लोके, सत्प्रत्ययस्य अव्यभिचारात्, व्यभिचाराच्च इतरेषामिति॥", "padacchedaText": "", "audioFile": "PB_003287.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003288", "originalText": "कथं तर्हि आत्मनः अविक्रियत्वे अशेषतः कर्मणः त्यागः न उपपद्यते इति? यदि वस्तुभूताः गुणाः, यदि वा अविद्याकल्पिताः, तद्धर्मः कर्म, तदा आत्मनि अविद्याध्यारोपितमेव इति अविद्वान् ‘न हि कश्चित् क्षणमपि अशेषतः त्यक्तुं शक्नोति’ (भ.गी.३.५) इति उक्तम्।", "padacchedaText": "", "audioFile": "PB_003288.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003289", "originalText": "विद्वांस्तु पुनः विद्यया अविद्यायां निवृत्तायां शक्नोत्येव अशेषतः कर्म परित्यक्तुम्, अविद्याध्यारोपितस्य शेषानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_003289.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003290", "originalText": "न हि तैमिरिकदृष्ट्या अध्यारोपितस्य द्विचन्द्रादेः तिमिरापगमेऽपि शेषः अवतिष्ठते।", "padacchedaText": "", "audioFile": "PB_003290.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003291", "originalText": "एवं च सति इदं वचनम् उपपन्नम् ‘सर्वकर्माणि मनसा’ (भ.गी.५.१३) इत्यादि, ‘स्वे स्वे कर्मण्यभिरतः संसिद्धिं लभते नरः’ (भ.गी.१८.४५) ‘स्वकर्मणा तमभ्यर्च्य सिद्धिं विन्दति मानवः’ (भ.गी.१८.४६) इति च॥ ४८॥", "padacchedaText": "", "audioFile": "PB_003291.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003292", "originalText": "या कर्मजा सिद्धिः उक्ता ज्ञाननिष्ठायोग्यतालक्षणा, तस्याः फलभूता नैष्कर्म्यसिद्धिः ज्ञाननिष्ठालक्षणा च वक्तव्येति श्लोकः आरभ्यते—\nअसक्तबुद्धिः सर्वत्र\nजितात्मा विगतस्पृहः।", "padacchedaText": "", "audioFile": "PB_003292.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003293", "originalText": "नैष्कर्म्यसिद्धिं परमां\nसंन्यासेनाधिगच्छति॥ ४९॥", "padacchedaText": "", "audioFile": "PB_003293.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003294", "originalText": "असक्तबुद्धिः असक्ता सङ्गरहिता बुद्धिः अन्तःकरणं यस्य सः असक्तबुद्धिः सर्वत्र पुत्रदारादिषु आसक्तिनिमित्तेषु, जितात्मा जितः वशीकृतः आत्मा अन्तःकरणं यस्य सः जितात्मा, विगतस्पृहः विगता स्पृहा तृष्णा देहजीवितभोगेषु यस्मात् सः विगतस्पृहः, यः एवंभूतः आत्मज्ञः सः नैष्कर्म्यसिद्धिं निर्गतानि कर्माणि यस्मात् निष्क्रियब्रह्मात्मसम्बोधात् सः निष्कर्मा तस्य भावः नैष्कर्म्यम्, नैष्कर्म्यं च तत् सिद्धिश्च सा नैष्कर्म्यसिद्धिः, निष्कर्मत्वस्य वा निष्क्रियात्मरूपावस्थानलक्षणस्य सिद्धिः निष्पत्तिः, तां नैष्कर्म्यसिद्धिं परमां प्रकृष्टां कर्मजसिद्धिविलक्षणां सद्योमुक्त्यवस्थानरूपां संन्यासेन सम्यग्दर्शनेन तत्पूर्वकेण वा सर्वकर्मसंन्यासेन, अधिगच्छति प्राप्नोति।", "padacchedaText": "", "audioFile": "PB_003294.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003295", "originalText": "तथा च उक्तम्— ‘सर्वकर्माणि मनसा संन्यस्य नैव कुर्वन्न कारयन्नास्ते’ (भ.गी.५.१३) इति॥ ४९॥", "padacchedaText": "", "audioFile": "PB_003295.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003296", "originalText": "पूर्वोक्तेन स्वकर्मानुष्ठानेन ईश्वराभ्यर्चनरूपेण जनितां प्रागुक्तलक्षणां सिद्धिं प्राप्तस्य उत्पन्नात्मविवेकज्ञानस्य केवलात्मज्ञाननिष्ठारूपा नैष्कर्म्यलक्षणा सिद्धिः येन क्रमेण भवति, तत् वक्तव्यमिति आह—\nसिद्धिं प्राप्तो यथा ब्रह्म तथाप्नोति निबोध मे।", "padacchedaText": "", "audioFile": "PB_003296.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003297", "originalText": "समासेनैव कौन्तेय निष्ठा ज्ञानस्य या परा॥ ५०॥", "padacchedaText": "", "audioFile": "PB_003297.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003298", "originalText": "सिद्धिं प्राप्तः स्वकर्मणा ईश्वरं समभ्यर्च्य तत्प्रसादजां कायेन्द्रियाणां ज्ञाननिष्ठायोग्यतालक्षणां सिद्धिं प्राप्तः— सिद्धिं प्राप्तः इति तदनुवादः उत्तरार्थः।", "padacchedaText": "", "audioFile": "PB_003298.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003299", "originalText": "किं तत् उत्तरम्, यदर्थः अनुवादः इति, उच्यते— यथा येन प्रकारेण ज्ञाननिष्ठारूपेण ब्रह्म परमात्मानम् आप्नोति, तथा तं प्रकारं ज्ञाननिष्ठाप्राप्तिक्रमं मे मम वचनात् निबोध त्वं निश्चयेन अवधारय इत्येतत्।", "padacchedaText": "", "audioFile": "PB_003299.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003300", "originalText": "किं विस्तरेण? न इति आह— समासेनैव सङ्क्षेपेणैव हे कौन्तेय, यथा ब्रह्म प्राप्नोति तथा निबोधेति।", "padacchedaText": "", "audioFile": "PB_003300.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003301", "originalText": "अनेन या प्रतिज्ञाता ब्रह्मप्राप्तिः, ताम् इदन्तया दर्शयितुम् आह— ‘निष्ठा ज्ञानस्य या परा’ इति।", "padacchedaText": "", "audioFile": "PB_003301.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003302", "originalText": "निष्ठा पर्यवसानं परिसमाप्तिः इत्येतत्।", "padacchedaText": "", "audioFile": "PB_003302.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003303", "originalText": "कस्य? ब्रह्मज्ञानस्य या परा।", "padacchedaText": "", "audioFile": "PB_003303.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003304", "originalText": "कीदृशी सा? यादृशम् आत्मज्ञानम्।", "padacchedaText": "", "audioFile": "PB_003304.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003305", "originalText": "कीदृक् तत्? यादृशः आत्मा। कीदृशः सः? यादृशो भगवता उक्तः, उपनिषद्वाक्यैश्च न्यायतश्च॥", "padacchedaText": "", "audioFile": "PB_003305.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003306", "originalText": "ननु विषयाकारं ज्ञानम्।", "padacchedaText": "", "audioFile": "PB_003306.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003307", "originalText": "न ज्ञानविषयः, नापि आकारवान् आत्मा इष्यते क्वचित्।", "padacchedaText": "", "audioFile": "PB_003307.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003308", "originalText": "ननु ‘आदित्यवर्णम्’ (श्वे.३.८) ‘भारूपः’ (छा.३.१४.२) ‘स्वयञ्ज्योतिः’ (बृ.४.३.९) इति आकारवत्त्वम् आत्मनः श्रूयते।", "padacchedaText": "", "audioFile": "PB_003308.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003309", "originalText": "न, तमोरूपत्वप्रतिषेधार्थत्वात् तेषां वाक्यानाम्— द्रव्यगुणाद्याकारप्रतिषेधे आत्मनः तमोरूपत्वे प्राप्ते तत्प्रतिषेधार्थानि ‘आदित्यवर्णम्’ (श्वे.३.८) इत्यादीनि वाक्यानि।", "padacchedaText": "", "audioFile": "PB_003309.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003310", "originalText": "‘अरूपम्’ (क.१.३.१५) इति च विशेषतः रूपप्रतिषेधात्।", "padacchedaText": "", "audioFile": "PB_003310.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003311", "originalText": "अविषयत्वाच्च— ‘न सन्दृशे तिष्ठति रूपमस्य न चक्षुषा पश्यति कश्चनैनम्’ (श्वे.४.२०) ‘अशब्दमस्पर्शम्’ (क.१.३.१५) इत्यादेः। तस्मात् आत्माकारं ज्ञानम् इति अनुपपन्नम्॥", "padacchedaText": "", "audioFile": "PB_003311.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003312", "originalText": "कथं तर्हि आत्मनः ज्ञानम्? सर्वं हि यद्विषयं यत् ज्ञानम्, तत् तदाकारं भवति।", "padacchedaText": "", "audioFile": "PB_003312.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003313", "originalText": "निराकारश्च आत्मा इत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_003313.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003314", "originalText": "ज्ञानात्मनोश्च उभयोः निराकारत्वे कथं तद्भावनानिष्ठा इति? न, अत्यन्तनिर्मलत्वातिस्वच्छत्वातिसूक्ष्मत्वोपपत्तेः आत्मनः।", "padacchedaText": "", "audioFile": "PB_003314.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003315", "originalText": "बुद्धेश्च आत्मवत् नैर्मल्याद्युपपत्तेः आत्मचैतन्याकाराभासत्वोपपत्तिः।", "padacchedaText": "", "audioFile": "PB_003315.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003316", "originalText": "बुद्ध्याभासं मनः, तदाभासानि इन्द्रियाणि, इन्द्रियाभासश्च देहः। अतः लौकिकैः देहमात्रे एव आत्मदृष्टिः क्रियते॥", "padacchedaText": "", "audioFile": "PB_003316.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003317", "originalText": "देहचैतन्यवादिनश्च लोकायतिकाः ‘चैतन्यविशिष्टः कायः पुरुषः’ इत्याहुः।", "padacchedaText": "", "audioFile": "PB_003317.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003318", "originalText": "तथा अन्ये इन्द्रियचैतन्यवादिनः, अन्ये मनश्चैतन्यवादिनः, अन्ये बुद्धिचैतन्यवादिनः।", "padacchedaText": "", "audioFile": "PB_003318.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003319", "originalText": "ततोऽपि आन्तरम् अव्यक्तम् अव्याकृताख्यम् अविद्यावस्थम् आत्मत्वेन प्रतिपन्नाः केचित्।", "padacchedaText": "", "audioFile": "PB_003319.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003320", "originalText": "सर्वत्र बुद्ध्यादिदेहान्ते आत्मचैतन्याभासता आत्मभ्रान्तिकारणम् इत्यतश्च आत्मविषयं ज्ञानं न विधातव्यम्।", "padacchedaText": "", "audioFile": "PB_003320.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003321", "originalText": "किं तर्हि? नामरूपाद्यनात्माध्यारोपणनिवृत्तिरेव कार्या, नात्मचैतन्यविज्ञानं कार्यम्, अविद्याध्यारोपितसर्वपदार्थाकारैः अविशिष्टतया दृश्यमानत्वात् इति।", "padacchedaText": "", "audioFile": "PB_003321.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003322", "originalText": "अत एव हि विज्ञानवादिनो बौद्धाः विज्ञानव्यतिरेकेण वस्त्वेव नास्तीति प्रतिपन्नाः, प्रमाणान्तरनिरपेक्षतां च स्वसंविदितत्वाभ्युपगमेन।", "padacchedaText": "", "audioFile": "PB_003322.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003323", "originalText": "तस्मात् अविद्याध्यारोपितनिराकरणमात्रं ब्रह्मणि कर्तव्यम्, न तु ब्रह्मविज्ञाने यत्नः, अत्यन्तप्रसिद्धत्वात्।", "padacchedaText": "", "audioFile": "PB_003323.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003324", "originalText": "अविद्याकल्पितनामरूपविशेषाकारापहृतबुद्धीनाम् अत्यन्तप्रसिद्धं सुविज्ञेयम् आसन्नतरम् आत्मभूतमपि, अप्रसिद्धं दुर्विज्ञेयम् अतिदूरम् अन्यदिव च प्रतिभाति अविवेकिनाम्।", "padacchedaText": "", "audioFile": "PB_003324.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003325", "originalText": "बाह्याकारनिवृत्तबुद्धीनां तु लब्धगुर्वात्मप्रसादानां न अतः परं सुखं सुप्रसिद्धं सुविज्ञेयं स्वासन्नतरम् अस्ति। तथा चोक्तम्— ‘प्रत्यक्षावगमं धर्म्यम्’ (भ.गी.९.२) इत्यादि॥", "padacchedaText": "", "audioFile": "PB_003325.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003326", "originalText": "केचित्तु पण्डितंमन्याः ‘निराकारत्वात् आत्मवस्तु न उपैति बुद्धिः।", "padacchedaText": "", "audioFile": "PB_003326.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003327", "originalText": "अतः दुःसाध्या सम्यग्ज्ञाननिष्ठा’ इत्याहुः।", "padacchedaText": "", "audioFile": "PB_003327.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003328", "originalText": "सत्यम्, एवं गुरुसम्प्रदायरहितानाम् अश्रुतवेदान्तानाम् अत्यन्तबहिर्विषयासक्तबुद्धीनां सम्यक्प्रमाणेषु अकृतश्रमाणाम्।", "padacchedaText": "", "audioFile": "PB_003328.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003329", "originalText": "तद्विपरीतानां तु लौकिकग्राह्यग्राहकद्वैतवस्तुनि सद्बुद्धिः नितरां दुःसम्पादा, आत्मचैतन्यव्यतिरेकेण वस्त्वन्तरस्य अनुपलब्धेः, यथा च ‘एतत् एवमेव, न अन्यथा’ इति अवोचाम, उक्तं च भगवता ‘यस्यां जाग्रति भूतानि सा निशा पश्यतो मुनेः’ (भ.गी.२.६९) इति।", "padacchedaText": "", "audioFile": "PB_003329.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003330", "originalText": "तस्मात् बाह्याकारभेदबुद्धिनिवृत्तिरेव आत्मस्वरूपावलम्बनकारणम्।", "padacchedaText": "", "audioFile": "PB_003330.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003331", "originalText": "न हि आत्मा नाम कस्यचित् कदाचित् अप्रसिद्धः प्राप्यः हेयः उपादेयो वा, अप्रसिद्धे हि तस्मिन् आत्मनि स्वार्थाः सर्वाः प्रवृत्तयः व्यर्थाः प्रसज्येरन्।", "padacchedaText": "", "audioFile": "PB_003331.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003332", "originalText": "न च देहाद्यचेतनार्थत्वं शक्यं कल्पयितुम्।", "padacchedaText": "", "audioFile": "PB_003332.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003333", "originalText": "न च सुखार्थं सुखम्, दुःखार्थं दुःखम्।", "padacchedaText": "", "audioFile": "PB_003333.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003334", "originalText": "आत्मावगत्यवसानार्थत्वाच्च सर्वव्यवहारस्य।", "padacchedaText": "", "audioFile": "PB_003334.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003335", "originalText": "तस्मात् यथा स्वदेहस्य परिच्छेदाय न प्रमाणान्तरापेक्षा, ततोऽपि आत्मनः अन्तरतमत्वात् तदवगतिं प्रति न प्रमाणान्तरापेक्षा, इति आत्मज्ञाननिष्ठा विवेकिनां सुप्रसिद्धा इति सिद्धम्॥", "padacchedaText": "", "audioFile": "PB_003335.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003336", "originalText": "येषामपि निराकारं ज्ञानम् अप्रत्यक्षम्, तेषामपि ज्ञानवशेनैव ज्ञेयावगतिरिति ज्ञानम् अत्यन्तप्रसिद्धं सुखादिवदेव इति अभ्युपगन्तव्यम्।", "padacchedaText": "", "audioFile": "PB_003336.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003337", "originalText": "जिज्ञासानुपपत्तेश्च— अप्रसिद्धं चेत् ज्ञानम्, ज्ञेयवत् जिज्ञास्येत।", "padacchedaText": "", "audioFile": "PB_003337.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003338", "originalText": "यथा ज्ञेयं घटादिलक्षणं ज्ञानेन ज्ञाता व्याप्तुम् इच्छति, तथा ज्ञानमपि ज्ञानान्तरेण ज्ञातव्यम् आप्तुम् इच्छेत्।", "padacchedaText": "", "audioFile": "PB_003338.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003339", "originalText": "न एतत् अस्ति।", "padacchedaText": "", "audioFile": "PB_003339.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003340", "originalText": "अतः अत्यन्तप्रसिद्धं ज्ञानम्, ज्ञातापि अत एव प्रसिद्धः इति।", "padacchedaText": "", "audioFile": "PB_003340.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003341", "originalText": "तस्मात् ज्ञाने यत्नो न कर्तव्यः, किं तु अनात्मनि आत्मबुद्धिनिवृत्तावेव। तस्मात् ज्ञाननिष्ठा सुसम्पाद्या॥ ५०॥", "padacchedaText": "", "audioFile": "PB_003341.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003342", "originalText": "सा इयं ज्ञानस्य परा निष्ठा उच्यते, कथं कार्या इति—\nबुद्ध्या विशुद्धया युक्तो\nधृत्यात्मानं नियम्य च। शब्दादीन्विषयांस्त्यक्त्वा\nरागद्वेषौ व्युदस्य च॥ ५१॥", "padacchedaText": "", "audioFile": "PB_003342.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003343", "originalText": "बुद्ध्या अध्यवसायलक्षणया विशुद्धया मायारहितया युक्तः सम्पन्नः, धृत्या धैर्येण आत्मानं कार्यकरणसङ्घातं नियम्य च नियमनं कृत्वा वशीकृत्य, शब्दादीन् शब्दः आदिः येषां तान् विषयान् त्यक्त्वा, सामर्थ्यात् शरीरस्थितिमात्रहेतुभूतान् केवलान् मुक्त्वा ततः अधिकान् सुखार्थान् त्यक्त्वा इत्यर्थः, शरीरस्थित्यर्थत्वेन प्राप्तेषु रागद्वेषौ व्युदस्य च परित्यज्य च॥ ५१॥", "padacchedaText": "", "audioFile": "PB_003343.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003344", "originalText": "ततः—\nविविक्तसेवी लघ्वाशी\nयतवाक्कायमानसः। ध्यानयोगपरो नित्यं\nवैराग्यं समुपाश्रितः॥ ५२॥", "padacchedaText": "", "audioFile": "PB_003344.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003345", "originalText": "विविक्तसेवी अरण्यनदीपुलिनगिरिगुहादीन् विविक्तान् देशान् सेवितुं शीलम् अस्य इति विविक्तसेवी, लघ्वाशी लघ्वशनशीलः— विविक्तसेवालघ्वशनयोः निद्रादिदोषनिवर्तकत्वेन चित्तप्रसादहेतुत्वात् ग्रहणम्, यतवाक्कायमानसः वाक् च कायश्च मानसं च यतानि संयतानि यस्य ज्ञाननिष्ठस्य सः ज्ञाननिष्ठः यतिः यतवाक्कायमानसः स्यात्।", "padacchedaText": "", "audioFile": "PB_003345.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003346", "originalText": "एवम् उपरतसर्वकरणः सन् ध्यानयोगपरः ध्यानम् आत्मस्वरूपचिन्तनम्, योगः आत्मविषये एकाग्रीकरणम् तौ परत्वेन कर्तव्यौ यस्य सः ध्यानयोगपरः नित्यं नित्यग्रहणं मन्त्रजपाद्यन्यकर्तव्याभावप्रदर्शनार्थम्, वैराग्यं विरागस्य भावः दृष्टादृष्टेषु विषयेषु वैतृष्ण्यं समुपाश्रितः सम्यक् उपाश्रितः नित्यमेव इत्यर्थः॥ ५२॥", "padacchedaText": "", "audioFile": "PB_003346.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003347", "originalText": "किञ्च—\nअहङ्कारं बलं दर्पं\nकामं क्रोधं परिग्रहम्। विमुच्य निर्ममः शान्तो\nब्रह्मभूयाय कल्पते॥ ५३॥", "padacchedaText": "", "audioFile": "PB_003347.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003348", "originalText": "अहङ्कारम् अहङ्करणम् अहङ्कारः देहादिषु तम्, बलं सामर्थ्यं कामरागसंयुक्तम्— न इतरत् शरीरादिसामर्थ्यं स्वाभाविकत्वेन तत्त्यागस्य अशक्यत्वात्— दर्पं दर्पो नाम हर्षानन्तरभावी धर्मातिक्रमहेतुः ‘हृष्टो दृप्यति दृप्तो धर्ममतिक्रामति’ (आ.ध.सू.१.१३.४) इति स्मरणात्, तं च, कामम् इच्छां क्रोधं द्वेषं परिग्रहम् इन्द्रियमनोगतदोषपरित्यागेऽपि शरीरधारणप्रसङ्गेन धर्मानुष्ठाननिमित्तेन वा बाह्यः परिग्रहः प्राप्तः, तं च विमुच्य परित्यज्य, परमहंसपरिव्राजको भूत्वा, देहजीवनमात्रेऽपि निर्गतममभावः निर्ममः, अत एव शान्तः उपरतः, यः संहृतहर्षायासः यतिः ज्ञाननिष्ठः ब्रह्मभूयाय ब्रह्मभवनाय कल्पते समर्थो भवति॥ ५३॥", "padacchedaText": "", "audioFile": "PB_003348.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003349", "originalText": "अनेन क्रमेण—\nब्रह्मभूतः प्रसन्नात्मा\nन शोचति न काङ्क्षति। समः सर्वेषु भूतेषु\nमद्भक्तिं लभते पराम्॥ ५४॥", "padacchedaText": "", "audioFile": "PB_003349.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003350", "originalText": "ब्रह्मभूतः ब्रह्मप्राप्तः प्रसन्नात्मा लब्धाध्यात्मप्रसादस्वभावः न शोचति, किञ्चित् अर्थवैकल्यम् आत्मनः वैगुण्यं वा उद्दिश्य न शोचति न सन्तप्यते, न काङ्क्षति, न हि अप्राप्तविषयाकाङ्क्षा ब्रह्मविदः उपपद्यते, अतः ब्रह्मभूतस्य अयं स्वभावः अनूद्यते— न शोचति न काङ्क्षति इति।", "padacchedaText": "", "audioFile": "PB_003350.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003351", "originalText": "‘न हृष्यति’ इति वा पाठान्तरम्।", "padacchedaText": "", "audioFile": "PB_003351.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003352", "originalText": "समः सर्वेषु भूतेषु, आत्मौपम्येन सर्वभूतेषु सुखं दुःखं वा सममेव पश्यति इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_003352.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003353", "originalText": "न आत्मसमदर्शनम् इह, तस्य वक्ष्यमाणत्वात् ‘भक्त्या मामभिजानाति’ (भ.गी.१८.५५) इति। एवंभूतः ज्ञाननिष्ठः, मद्भक्तिं मयि परमेश्वरे भक्तिं भजनं पराम् उत्तमां ज्ञानलक्षणां चतुर्थीं लभते, ‘चतुर्विधा भजन्ते माम्’ (भ.गी.७.१६) इति हि उक्तम्॥ ५४॥", "padacchedaText": "", "audioFile": "PB_003353.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003354", "originalText": "ततः ज्ञानलक्षणया—\nभक्त्या मामभिजानाति\nयावान्यश्चास्मि तत्त्वतः। ततो मां तत्त्वतो ज्ञात्वा\nविशते तदनन्तरम्॥ ५५॥", "padacchedaText": "", "audioFile": "PB_003354.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003355", "originalText": "भक्त्या माम् अभिजानाति यावान् अहम् उपाधिकृतविस्तरभेदः, यश्च अहम् अस्मि विध्वस्तसर्वोपाधिभेदः उत्तमः पुरुषः आकाशकल्पः, तं माम् अद्वैतं चैतन्यमात्रैकरसम् अजरम् अभयम् अनिधनं तत्त्वतः अभिजानाति।", "padacchedaText": "", "audioFile": "PB_003355.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003356", "originalText": "ततः माम् एवं तत्त्वतः ज्ञात्वा विशते तदनन्तरं मामेव ज्ञानानन्तरम्।", "padacchedaText": "", "audioFile": "PB_003356.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003357", "originalText": "नात्र ज्ञानप्रवेशक्रिये भिन्ने विवक्षिते ‘ज्ञात्वा विशते तदनन्तरम्’ इति। किं तर्हि? फलान्तराभावात् ज्ञानमात्रमेव, ‘क्षेत्रज्ञं चापि मां विद्धि’ (भ.गी.१३.२) इति उक्तत्वात्॥", "padacchedaText": "", "audioFile": "PB_003357.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003358", "originalText": "ननु विरुद्धम् इदम् उक्तम् ‘ज्ञानस्य या परा निष्ठा तया माम् अभिजानाति’ इति।", "padacchedaText": "", "audioFile": "PB_003358.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003359", "originalText": "कथं विरुद्धम् इति चेत्, उच्यते— यदैव यस्मिन् विषये ज्ञानम् उत्पद्यते ज्ञातुः, तदैव तं विषयम् अभिजानाति ज्ञाता इति न ज्ञाननिष्ठां ज्ञानावृत्तिलक्षणाम् अपेक्षते इति, अतश्च ज्ञानेन न अभिजानाति, ज्ञानावृत्त्या तु ज्ञाननिष्ठया अभिजानातीति।", "padacchedaText": "", "audioFile": "PB_003359.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003360", "originalText": "नैष दोषः, ज्ञानस्य स्वात्मोत्पत्तिपरिपाकहेतुयुक्तस्य प्रतिपक्षविहीनस्य यत् आत्मानुभवनिश्चयावसानत्वं तस्य निष्ठाशब्दाभिलापात्।", "padacchedaText": "", "audioFile": "PB_003360.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003361", "originalText": "शास्त्राचार्योपदेशेन ज्ञानोत्पत्तिहेतुं सहकारिकारणं बुद्धिविशुद्धत्वादि अमानित्वादिगुणं च अपेक्ष्य जनितस्य क्षेत्रज्ञपरमात्मैकत्वज्ञानस्य कर्तृत्वादिकारकभेदबुद्धिनिबन्धनसर्वकर्मसंन्याससहितस्य स्वात्मानुभवनिश्चयरूपेण यत् अवस्थानम्, सा परा ज्ञाननिष्ठा इति उच्यते।", "padacchedaText": "", "audioFile": "PB_003361.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003362", "originalText": "सा इयं ज्ञाननिष्ठा आर्तादिभक्तित्रयापेक्षया परा चतुर्थी भक्तिरिति उक्ता।", "padacchedaText": "", "audioFile": "PB_003362.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003363", "originalText": "तया परया भक्त्या भगवन्तं तत्त्वतः अभिजानाति, यदनन्तरमेव ईश्वरक्षेत्रज्ञभेदबुद्धिः अशेषतः निवर्तते।", "padacchedaText": "", "audioFile": "PB_003363.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003364", "originalText": "अतः ज्ञाननिष्ठालक्षणया भक्त्या माम् अभिजानातीति वचनं न विरुध्यते।", "padacchedaText": "", "audioFile": "PB_003364.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003365", "originalText": "अत्र च सर्वं निवृत्तिविधायि शास्त्रं वेदान्तेतिहासपुराणस्मृतिलक्षणं न्यायप्रसिद्धम् अर्थवत् भवति— ‘विदित्वा... व्युत्थायाथ भिक्षाचर्यं चरन्ति’ (बृ.३.५.१) ‘तस्मान्न्यासमेषां तपसामतिरिक्तमाहुः’ (तै.ना.७९) ‘न्यास एवात्यरेचयत्’ (तै.ना.७८) इति।", "padacchedaText": "", "audioFile": "PB_003365.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003366", "originalText": "‘संन्यासः कर्मणां न्यासः’ (?) ‘वेदानिमं च लोकममुं च परित्यज्य’ (आ.ध.२.९.१३) ‘त्यज धर्ममधर्मं च’ (मो.ध.३२९.४०) इत्यादि।", "padacchedaText": "", "audioFile": "PB_003366.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003367", "originalText": "इह च प्रदर्शितानि वाक्यानि।", "padacchedaText": "", "audioFile": "PB_003367.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003368", "originalText": "न च तेषां वाक्यानाम् आनर्थक्यं युक्तम्, न च अर्थवादत्वम्, स्वप्रकरणस्थत्वात्, प्रत्यगात्माविक्रियस्वरूपनिष्ठत्वाच्च मोक्षस्य।", "padacchedaText": "", "audioFile": "PB_003368.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003369", "originalText": "न हि पूर्वसमुद्रं जिगमिषोः प्रातिलोम्येन प्रत्यक्समुद्रजिगमिषुणा समानमार्गत्वं सम्भवति।", "padacchedaText": "", "audioFile": "PB_003369.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003370", "originalText": "प्रत्यगात्मविषयप्रत्ययसन्तानकरणाभिनिवेशश्च ज्ञाननिष्ठा, सा च प्रत्यक्समुद्रगमनवत् कर्मणा सहभावित्वेन विरुध्यते।", "padacchedaText": "", "audioFile": "PB_003370.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003371", "originalText": "पर्वतसर्षपयोरिव अन्तरवान् विरोधः प्रमाणविदां निश्चितः। तस्मात् सर्वकर्मसंन्यासेनैव ज्ञाननिष्ठा कार्या इति सिद्धम्॥ ५५॥", "padacchedaText": "", "audioFile": "PB_003371.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003372", "originalText": "स्वकर्मणा भगवतः अभ्यर्चनभक्तियोगस्य सिद्धिप्राप्तिः फलं ज्ञाननिष्ठायोग्यता, यन्निमित्ता ज्ञाननिष्ठा मोक्षफलावसाना।", "padacchedaText": "", "audioFile": "PB_003372.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003373", "originalText": "सः भगवद्भक्तियोगः अधुना स्तूयते शास्त्रार्थोपासंहारप्रकरणे शास्त्रार्थनिश्चयदार्ढ्याय—\nसर्वकर्माण्यपि सदा कुर्वाणो मद्व्यपाश्रयः। मत्प्रसादादवाप्नोति शाश्वतं पदमव्ययम्॥ ५६॥", "padacchedaText": "", "audioFile": "PB_003373.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003374", "originalText": "सर्वकर्माण्यपि प्रतिषिद्धान्यपि सदा कुर्वाणः अनुतिष्ठन् मद्व्यपाश्रयः अहं वासुदेवः ईश्वरः व्यपाश्रयो व्यपाश्रयणं यस्य सः मद्व्यपाश्रयः मय्यर्पितसर्वभावः इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_003374.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003375", "originalText": "सोऽपि मत्प्रसादात् मम ईश्वरस्य प्रसादात् अवाप्नोति शाश्वतं नित्यं वैष्णवं पदम् अव्ययम्॥ ५६॥", "padacchedaText": "", "audioFile": "PB_003375.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003376", "originalText": "यस्मात् एवम्—\nचेतसा सर्वकर्माणि मयि संन्यस्य मत्परः। बुद्धियोगमपाश्रित्य मच्चित्तः सततं भव॥ ५७॥", "padacchedaText": "", "audioFile": "PB_003376.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003377", "originalText": "चेतसा विवेकबुद्ध्या सर्वकर्माणि दृष्टादृष्टार्थानि मयि ईश्वरे संन्यस्य ‘यत् करोषि यदश्नासि’ (भ.गी.९.२७) इति उक्तन्यायेन, मत्परः अहं वासुदेवः परो यस्य तव सः त्वं मत्परः सन् मय्यर्पितसर्वात्मभावः बुद्धियोगं समाहितबुद्धित्वं बुद्धियोगः तं बुद्धियोगम् अपाश्रित्य अपाश्रयः अनन्यशरणत्वं मच्चित्तः मय्येव चित्तं यस्य तव सः त्वं मच्चित्तः सततं सर्वदा भव॥ ५७॥", "padacchedaText": "", "audioFile": "PB_003377.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003378", "originalText": "मच्चित्तः सर्वदुर्गाणि मत्प्रसादात्तरिष्यसि। अथ चेत्त्वमहङ्कारान्न श्रोष्यसि विनङ्क्ष्यसि॥ ५८॥", "padacchedaText": "", "audioFile": "PB_003378.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003379", "originalText": "मच्चित्तः सर्वदुर्गाणि सर्वाणि दुस्तराणि संसारहेतुजातानि मत्प्रसादात् तरिष्यसि अतिक्रमिष्यसि। अथ चेत् यदि त्वं मदुक्तम् अहङ्कारात् ‘पण्डितः अहम्’ इति न श्रोष्यसि न ग्रहीष्यसि, ततः त्वं विनङ्क्ष्यसि विनाशं गमिष्यसि॥ ५८॥", "padacchedaText": "", "audioFile": "PB_003379.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003380", "originalText": "इदं च त्वया न मन्तव्यम् ‘स्वतन्त्रः अहम्, किमर्थं परोक्तं करिष्यामि? ’ इति—\nयद्यहङ्कारमाश्रित्य\nन योत्स्य इति मन्यसे। मिथ्यैष व्यवसायस्ते\nप्रकृतिस्त्वां नियोक्ष्यति॥ ५९॥", "padacchedaText": "", "audioFile": "PB_003380.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003381", "originalText": "यदि चेत् त्वम् अहङ्कारम् आश्रित्य न योत्स्ये इति न युद्धं करिष्यामि इति मन्यसे चिन्तयसि निश्चयं करोषि, मिथ्या एषः व्यवसायः निश्चयः ते तव, यस्मात् प्रकृतिः क्षत्रियस्वभावः त्वां नियोक्ष्यति॥ ५९॥", "padacchedaText": "", "audioFile": "PB_003381.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003382", "originalText": "यस्माच्च—\nस्वभावजेन कौन्तेय निबद्धः स्वेन कर्मणा। कर्तुं नेच्छसि यन्मोहात्करिष्यस्यवशोऽपि तत्॥ ६०॥", "padacchedaText": "", "audioFile": "PB_003382.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003383", "originalText": "स्वभावजेन शौर्यादिना यथोक्तेन कौन्तेय निबद्धः निश्चयेन बद्धः स्वेन आत्मीयेन कर्मणा कर्तुं न इच्छसि यत् कर्म, मोहात् अविवेकतः करिष्यसि अवशोऽपि परवश एव तत् कर्म॥ ६०॥", "padacchedaText": "", "audioFile": "PB_003383.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003384", "originalText": "यस्मात्—\nईश्वरः सर्वभूतानां हृद्देशेऽर्जुन तिष्ठति। भ्रामयन्सर्वभूतानि यन्त्रारूढानि मायया॥ ६१॥", "padacchedaText": "", "audioFile": "PB_003384.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003385", "originalText": "ईश्वरः ईशनशीलः नारायणः सर्वभूतानां सर्वप्राणिनां हृद्देशे हृदयदेशे अर्जुन शुक्लान्तरात्मस्वभावः विशुद्धान्तःकरणः— ‘अहश्च कृष्णमहरर्जुनं च’ (ऋ.मं.६.१.९.१) इति दर्शनात्— तिष्ठति स्थितिं लभते।", "padacchedaText": "", "audioFile": "PB_003385.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003386", "originalText": "तेषु सः कथं तिष्ठतीति, आह— भ्रामयन् भ्रमणं कारयन् सर्वभूतानि यन्त्रारूढानि यन्त्राणि आरूढानि अधिष्ठितानि इव— इति इवशब्दः अत्र द्रष्टव्यः— यथा दारुकृतपुरुषादीनि यन्त्रारूढानि।", "padacchedaText": "", "audioFile": "PB_003386.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003387", "originalText": "मायया च्छद्मना भ्रामयन् तिष्ठति इति सम्बन्धः॥ ६१॥", "padacchedaText": "", "audioFile": "PB_003387.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003388", "originalText": "तमेव शरणं गच्छ\nसर्वभावेन भारत। तत्प्रसादात्परां शान्तिं\nस्थानं प्राप्स्यसि शाश्वतम्॥ ६२॥", "padacchedaText": "", "audioFile": "PB_003388.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003389", "originalText": "तमेव ईश्वरं शरणम् आश्रयं संसारार्तिहरणार्थं गच्छ आश्रय सर्वभावेन सर्वात्मना हे भारत। ततः तत्प्रसादात् ईश्वरानुग्रहात् परां प्रकृष्टां शान्तिम् उपरतिं स्थानं च मम विष्णोः परमं पदं प्राप्स्यसि शाश्वतं नित्यम्॥ ६२॥", "padacchedaText": "", "audioFile": "PB_003389.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003390", "originalText": "इति ते ज्ञानमाख्यातं गुह्याद्गुह्यतरं मया। विमृश्यैतदशेषेण यथेच्छसि तथा कुरु॥ ६३॥", "padacchedaText": "", "audioFile": "PB_003390.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003391", "originalText": "इति एतत् ते तुभ्यं ज्ञानम् आख्यातं कथितं गुह्यात् गोप्यात् गुह्यतरम् अतिशयेन गुह्यं रहस्यम् इत्यर्थः, मया सर्वज्ञेन ईश्वरेण। विमृश्य विमर्शनम् आलोचनं कृत्वा एतत् यथोक्तं शास्त्रम् अशेषेण समस्तं यथोक्तं च अर्थजातं यथा इच्छसि तथा कुरु॥ ६३॥", "padacchedaText": "", "audioFile": "PB_003391.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003392", "originalText": "भूयोऽपि मया उच्यमानं शृणु—\nसर्वगुह्यतमं भूयः\nशृणु मे परमं वचः। इष्टोऽसि मे दृढमिति\nततो वक्ष्यामि ते हितम्॥ ६४॥", "padacchedaText": "", "audioFile": "PB_003392.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003393", "originalText": "सर्वगुह्यतमं सर्वेभ्यः गुह्येभ्यः अत्यन्तगुह्यतमम् अत्यन्तरहस्यम्, उक्तमपि असकृत् भूयः पुनः शृणु मे मम परमं प्रकृष्टं वचः वाक्यम्।", "padacchedaText": "", "audioFile": "PB_003393.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003394", "originalText": "न भयात् नापि अर्थकारणाद्वा वक्ष्यामि, किं तर्हि? इष्टः प्रियः असि मे मम दृढम् अव्यभिचारेण इति कृत्वा ततः तेन कारणेन वक्ष्यामि कथयिष्यामि ते तव हितं परमं ज्ञानप्राप्तिसाधनम्, तद्धि सर्वहितानां हिततमम्॥ ६४॥", "padacchedaText": "", "audioFile": "PB_003394.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003395", "originalText": "किं तत् इति, आह—\nमन्मना भव मद्भक्तो\nमद्याजी मां नमस्कुरु। मामेवैष्यसि सत्यं ते\nप्रतिजाने प्रियोऽसि मे॥ ६५॥", "padacchedaText": "", "audioFile": "PB_003395.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003396", "originalText": "मन्मनाः भव मच्चित्तः भव।", "padacchedaText": "", "audioFile": "PB_003396.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003397", "originalText": "मद्भक्तः भव मद्भजनो भव।", "padacchedaText": "", "audioFile": "PB_003397.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003398", "originalText": "मद्याजी मद्यजनशीलो भव।", "padacchedaText": "", "audioFile": "PB_003398.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003399", "originalText": "मां नमस्कुरु नमस्कारम् अपि ममैव कुरु।", "padacchedaText": "", "audioFile": "PB_003399.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003400", "originalText": "तत्र एवं वर्तमानः वासुदेवे एव समर्पितसाध्यसाधनप्रयोजनः मामेव एष्यसि आगमिष्यसि।", "padacchedaText": "", "audioFile": "PB_003400.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003401", "originalText": "सत्यं ते तव प्रतिजाने, सत्यां प्रतिज्ञां करोमि एतस्मिन् वस्तुनि इत्यर्थः, यतः प्रियः असि मे। एवं भगवतः सत्यप्रतिज्ञत्वं बुद्ध्वा भगवद्भक्तेः अवश्यंभावि मोक्षफलम् अवधार्य भगवच्छरणैकपरायणः भवेत् इति वाक्यार्थः॥ ६५॥", "padacchedaText": "", "audioFile": "PB_003401.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003402", "originalText": "कर्मयोगनिष्ठायाः परमरहस्यम् ईश्वरशरणताम् उपसंहृत्य, अथ इदानीं कर्मयोगनिष्ठाफलं सम्यग्दर्शनं सर्ववेदान्तसारविहितं वक्तव्यमिति आह—\nसर्वधर्मान्परित्यज्य\nमामेकं शरणं व्रज।", "padacchedaText": "", "audioFile": "PB_003402.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003403", "originalText": "अहं त्वा सर्वपापेभ्यो\nमोक्षयिष्यामि मा शुचः॥ ६६॥", "padacchedaText": "", "audioFile": "PB_003403.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003404", "originalText": "सर्वधर्मान् सर्वे च ते धर्माश्च सर्वधर्माः तान्— धर्मशब्देन अत्र अधर्मोऽपि गृह्यते, नैष्कर्म्यस्य विवक्षितत्वात्, ‘नाविरतो दुश्चरितात्’ (क.१.२.२४) ‘त्यज धर्ममधर्मं च’ (मो.ध.३२९.४०) इत्यादिश्रुतिस्मृतिभ्यः— सर्वधर्मान् परित्यज्य संन्यस्य सर्वकर्माणि इत्येतत्।", "padacchedaText": "", "audioFile": "PB_003404.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003405", "originalText": "माम् एकं सर्वात्मानं समं सर्वभूतस्थितम् ईश्वरम् अच्युतं गर्भजन्मजरामरणवर्जितम् ‘अहमेव’ इत्येवं शरणं व्रज, न मत्तः अन्यत् अस्ति इति अवधारय इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_003405.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003406", "originalText": "अहं त्वा त्वाम् एवं निश्चितबुद्धिं सर्वपापेभ्यः सर्वधर्माधर्मबन्धनरूपेभ्यः मोक्षयिष्यामि स्वात्मभावप्रकाशीकरणेन।", "padacchedaText": "", "audioFile": "PB_003406.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003407", "originalText": "उक्तं च ‘नाशयाम्यात्मभावस्थो ज्ञानदीपेन भास्वता’ (भ.गी.१०.११) इति। अतः मा शुचः शोकं मा कार्षीः इत्यर्थः॥", "padacchedaText": "", "audioFile": "PB_003407.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003408", "originalText": "अस्मिन्गीताशास्त्रे परमनिःश्रेयससाधनं निश्चितं किं ज्ञानम्, कर्म वा, आहोस्वित् उभयम्? इति।", "padacchedaText": "", "audioFile": "PB_003408.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003409", "originalText": "कुतः संशयः? ‘यज्ज्ञात्वामृतमश्नुते’ (भ.गी.१३.१२) ‘ततो मां तत्त्वतो ज्ञात्वा विशते तदनन्तरम्’ (भ.गी.१८.५५) इत्यादीनि वाक्यानि केवलाज्ज्ञानात् निःश्रेयसप्राप्तिं दर्शयन्ति।", "padacchedaText": "", "audioFile": "PB_003409.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003410", "originalText": "‘कर्मण्येवाधिकारस्ते’ (भ.गी.२.४७) ‘कुरु कर्मैव’ (भ.गी.४.१५) इत्येवमादीनि कर्मणामवश्यकर्तव्यतां दर्शयन्ति।", "padacchedaText": "", "audioFile": "PB_003410.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003411", "originalText": "एवं ज्ञानकर्मणोः कर्तव्यत्वोपदेशात् समुच्चितयोरपि निःश्रेयसहेतुत्वं स्यात् इति भवेत् संशयः कस्यचित्। किं पुनरत्र मीमांसाफलम्? ननु एतदेव— एषामन्यतमस्य परमनिःश्रेयससाधनत्वावधारणम्, अतः विस्तीर्णतरं मीमांस्यम् एतत्॥", "padacchedaText": "", "audioFile": "PB_003411.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003412", "originalText": "आत्मज्ञानस्य तु केवलस्य निःश्रेयसहेतुत्वम्, भेदप्रत्ययनिवर्तकत्वेन कैवल्यफलावसायित्वात्।", "padacchedaText": "", "audioFile": "PB_003412.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003413", "originalText": "क्रियाकारकफलभेदबुद्धिः अविद्यया आत्मनि नित्यप्रवृत्ता— ‘मम कर्म, अहं कर्तामुष्मै फलायेदं कर्म करिष्यामि’ इति इयम् अविद्या अनादिकालप्रवृत्ता।", "padacchedaText": "", "audioFile": "PB_003413.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003414", "originalText": "अस्या अविद्यायाः निवर्तकम् ‘अयमहमस्मि केवलोऽकर्ता अक्रियोऽफलः, न मत्तोऽन्योऽस्ति कश्चित्’ इत्येवंरूपम् आत्मविषयं ज्ञानम् उत्पद्यमानम्, कर्मप्रवृत्तिहेतुभूतायाः भेदबुद्धेः निवर्तकत्वात्।", "padacchedaText": "", "audioFile": "PB_003414.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003415", "originalText": "तु— शब्दः पक्षव्यावृत्त्यर्थः— न केवलेभ्यः कर्मभ्यः, न च ज्ञानकर्मभ्यां समुच्चिताभ्यां निःश्रेयसप्राप्तिः इति पक्षद्वयं निवर्तयति।", "padacchedaText": "", "audioFile": "PB_003415.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003416", "originalText": "अकार्यत्वाच्च निःश्रेयसस्य कर्मसाधनत्वानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_003416.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003417", "originalText": "न हि नित्यं वस्तु कर्मणा ज्ञानेन वा क्रियते।", "padacchedaText": "", "audioFile": "PB_003417.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003418", "originalText": "केवलं ज्ञानमपि अनर्थकं तर्हि? न, अविद्यानिवर्तकत्वे सति दृष्टकैवल्यफलावसानत्वात्।", "padacchedaText": "", "audioFile": "PB_003418.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003419", "originalText": "अविद्यातमोनिवर्तकस्य ज्ञानस्य दृष्टं कैवल्यफलावसानत्वम्, रज्ज्वादिविषये सर्पाद्यज्ञानतमोनिवर्तकप्रदीपप्रकाशफलवत्।", "padacchedaText": "", "audioFile": "PB_003419.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003420", "originalText": "विनिवृत्तसर्पादिविकल्परज्जुकैवल्यावसानं हि प्रकाशफलम्, तथा ज्ञानम्।", "padacchedaText": "", "audioFile": "PB_003420.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003421", "originalText": "दृष्टार्थानां च च्छिदिक्रियाग्निमन्थनादीनां व्यापृतकर्त्रादिकारकाणां द्वैधीभावाग्निदर्शनादिफलात् अन्यफले कर्मान्तरे वा व्यापारानुपपत्तिः यथा, तथा दृष्टार्थायां ज्ञाननिष्ठाक्रियायां व्यापृतस्य ज्ञात्रादिकारकस्य आत्मकैवल्यफलात् कर्मान्तरे प्रवृत्तिः अनुपपन्ना इति न ज्ञाननिष्ठा कर्मसहिता उपपद्यते।", "padacchedaText": "", "audioFile": "PB_003421.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003422", "originalText": "भुज्यग्निहोत्रादिक्रियावत्स्यात् इति चेत्, न, कैवल्यफले ज्ञाने क्रियाफलार्थित्वानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_003422.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003423", "originalText": "कैवल्यफले हि ज्ञाने प्राप्ते, सर्वतःसम्प्लुतोदकफले कूपतटाकादिक्रियाफलार्थित्वाभाववत्, फलान्तरे तत्साधनभूतायां वा क्रियायाम् अर्थित्वानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_003423.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003424", "originalText": "न हि राज्यप्राप्तिफले कर्मणि व्यापृतस्य क्षेत्रमात्रप्राप्तिफले व्यापारः उपपद्यते, तद्विषयं वा अर्थित्वम्।", "padacchedaText": "", "audioFile": "PB_003424.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003425", "originalText": "तस्मात् न कर्मणोऽस्ति निःश्रेयससाधनत्वम्।", "padacchedaText": "", "audioFile": "PB_003425.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003426", "originalText": "न च ज्ञानकर्मणोः समुच्चितयोः।", "padacchedaText": "", "audioFile": "PB_003426.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003427", "originalText": "नापि ज्ञानस्य कैवल्यफलस्य कर्मसाहाय्यापेक्षा, अविद्यानिवर्तकत्वेन विरोधात्।", "padacchedaText": "", "audioFile": "PB_003427.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003428", "originalText": "न हि तमः तमसः निवर्तकम्।", "padacchedaText": "", "audioFile": "PB_003428.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003429", "originalText": "अतः केवलमेव ज्ञानं निःश्रेयससाधनम् इति।", "padacchedaText": "", "audioFile": "PB_003429.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003430", "originalText": "न, नित्याकरणे प्रत्यवायप्राप्तेः, कैवल्यस्य च नित्यत्वात्।", "padacchedaText": "", "audioFile": "PB_003430.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003431", "originalText": "यत् तावत् केवलाज्ज्ञानात् कैवल्यप्राप्तिः इत्येतत्, तत् असत्, यतः नित्यानां कर्मणां श्रुत्युक्तानाम् अकरणे प्रत्यवायः नरकादिप्राप्तिलक्षणः स्यात्।", "padacchedaText": "", "audioFile": "PB_003431.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003432", "originalText": "ननु एवं तर्हि कर्मभ्यो मोक्षो नास्ति इति अनिर्मोक्ष एव।", "padacchedaText": "", "audioFile": "PB_003432.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003433", "originalText": "नैष दोषः, नित्यत्वात् मोक्षस्य।", "padacchedaText": "", "audioFile": "PB_003433.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003434", "originalText": "नित्यानां कर्मणाम् अनुष्ठानात् प्रत्यवायस्य अप्राप्तिः, प्रतिषिद्धस्य च अकरणात् अनिष्टशरीरानुपपत्तिः, काम्यानां च वर्जनात् इष्टशरीरानुपपत्तिः, वर्तमानशरीरारम्भकस्य च कर्मणः फलोपभोगक्षये पतिते अस्मिन् शरीरे देहान्तरोत्पत्तौ च कारणाभावात् आत्मनः रागादीनां च अकरणे स्वरूपावस्थानमेव कैवल्यमिति अयत्नसिद्धं कैवल्यम् इति।", "padacchedaText": "", "audioFile": "PB_003434.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003435", "originalText": "अतिक्रान्तानेकजन्मान्तरकृतस्य स्वर्गनरकादिप्राप्तिफलस्य अनारब्धकार्यस्य उपभोगानुपपत्तेः क्षयाभावः इति चेत्, न, नित्यकर्मानुष्ठानायासदुःखोपभोगस्य तत्फलोपभोगत्वोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_003435.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003436", "originalText": "प्रायश्चित्तवद्वा पूर्वोपात्तदुरितक्षयार्थं नित्यं कर्म।", "padacchedaText": "", "audioFile": "PB_003436.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003437", "originalText": "आरब्धानां च कर्मणाम् उपभोगेनैव क्षीणत्वात् अपूर्वाणां च कर्मणाम् अनारम्भे अयत्नसिद्धं कैवल्यमिति।", "padacchedaText": "", "audioFile": "PB_003437.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003438", "originalText": "न, ‘तमेव विदित्वातिमृत्युमेति नान्यः पन्था विद्यतेऽयनाय’ (श्वे.३.८) इति विद्याया अन्यः पन्थाः मोक्षाय न विद्यते इति श्रुतेः, चर्मवदाकाशवेष्टनासम्भववत् अविदुषः मोक्षासम्भवश्रुतेः, ‘ज्ञानात्कैवल्यमाप्नोति’ (?) इति च पुराणस्मृतेः, अनारब्धफलानां पुण्यानां कर्मणां क्षयानुपपत्तेश्च।", "padacchedaText": "", "audioFile": "PB_003438.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003439", "originalText": "यथा पूर्वोपात्तानां दुरितानाम् अनारब्धफलानां सम्भवः, तथा पुण्यानाम् अनारब्धफलानां स्यात्सम्भवः।", "padacchedaText": "", "audioFile": "PB_003439.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003440", "originalText": "तेषां च देहान्तरम् अकृत्वा क्षयानुपपत्तौ मोक्षानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_003440.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003441", "originalText": "धर्माधर्महेतूनां च रागद्वेषमोहानाम् अन्यत्र आत्मज्ञानात् उच्छेदानुपपत्तेः धर्माधर्मोच्छेदानुपपत्तिः। नित्यानां च कर्मणां पुण्यफलत्वश्रुतेः, ‘वर्णा आश्रमाश्च स्वकर्मनिष्ठाः’ (गौ.ध.सू.२.२.२९) इत्यादिस्मृतेश्च कर्मक्षयानुपपत्तिः॥", "padacchedaText": "", "audioFile": "PB_003441.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003442", "originalText": "ये तु आहुः— नित्यानि कर्माणि दुःखरूपत्वात् पूर्वकृतदुरितकर्मणां फलमेव, न तु तेषां स्वरूपव्यतिरेकेण अन्यत् फलम् अस्ति, अश्रुतत्वात्, जीवनादिनिमित्ते च विधानात् इति।", "padacchedaText": "", "audioFile": "PB_003442.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003443", "originalText": "न अप्रवृत्तानां कर्मणां फलदानासम्भवात्, दुःखफलविशेषानुपपत्तिश्च स्यात्।", "padacchedaText": "", "audioFile": "PB_003443.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003444", "originalText": "यदुक्तं पूर्वजन्मकृतदुरितानां कर्मणां फलं नित्यकर्मानुष्ठानायासदुःखं भुज्यत इति, तदसत्।", "padacchedaText": "", "audioFile": "PB_003444.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003445", "originalText": "न हि मरणकाले फलदानाय अनङ्कुरीभूतस्य कर्मणः फलम् अन्यकर्मारब्धे जन्मनि उपभुज्यते इति उपपत्तिः।", "padacchedaText": "", "audioFile": "PB_003445.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003446", "originalText": "अन्यथा स्वर्गफलोपभोगाय अग्निहोत्रादिकर्मारब्धे जन्मनि नरकफलोपभोगानुपपत्तिः न स्यात्।", "padacchedaText": "", "audioFile": "PB_003446.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003447", "originalText": "तस्य दुरितस्य दुःखविशेषफलत्वानुपपत्तेश्च— अनेकेषु हि दुरितेषु सम्भवत्सु भिन्नदुःखसाधनफलेषु नित्यकर्मानुष्ठानायासदुःखमात्रफलेषु कल्प्यमानेषु द्वन्द्वरोगादिबाधनं निर्निमित्तं न हि शक्यते कल्पयितुम्, नित्यकर्मानुष्ठानायासदुःखमेव पूर्वोपात्तदुरितफलं न शिरसा पाषाणवहनादिदुःखमिति।", "padacchedaText": "", "audioFile": "PB_003447.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003448", "originalText": "अप्रकृतं च इदम् उच्यते— नित्यकर्मानुष्ठानायासदुःखं पूर्वकृतदुरितकर्मफलम् इति।", "padacchedaText": "", "audioFile": "PB_003448.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003449", "originalText": "कथम्? अप्रसूतफलस्य हि पूर्वकृतदुरितस्य क्षयः न उपपद्यत इति प्रकृतम्।", "padacchedaText": "", "audioFile": "PB_003449.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003450", "originalText": "तत्र प्रसूतफलस्य कर्मणः फलं नित्यकर्मानुष्ठानायासदुःखम् आह भवान्, न अप्रसूतफलस्येति।", "padacchedaText": "", "audioFile": "PB_003450.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003451", "originalText": "अथ सर्वमेव पूर्वकृतं दुरितं प्रसूतफलमेव इति मन्यते भवान्, ततः नित्यकर्मानुष्ठानायासदुःखमेव फलम् इति विशेषणम् अयुक्तम्।", "padacchedaText": "", "audioFile": "PB_003451.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003452", "originalText": "नित्यकर्मविध्यानर्थक्यप्रसङ्गश्च, उपभोगेनैव प्रसूतफलस्य दुरितकर्मणः क्षयोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_003452.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003453", "originalText": "किञ्च, श्रुतस्य नित्यस्य कर्मणः दुःखं चेत् फलम्, नित्यकर्मानुष्ठानायासादेव तत् दृश्यते व्यायामादिवत्, तत् अन्यस्य इति कल्पनानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_003453.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003454", "originalText": "जीवनादिनिमित्ते च विधानात्, नित्यानां कर्मणां प्रायश्चित्तवत् पूर्वकृतदुरितफलत्वानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_003454.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003455", "originalText": "यस्मिन् पापकर्मणि निमित्ते यत् विहितं प्रायश्चित्तम् न तु तस्य पापस्य तत् फलम्।", "padacchedaText": "", "audioFile": "PB_003455.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003456", "originalText": "अथ तस्यैव पापस्य निमित्तस्य प्रायश्चित्तदुःखं फलम्, जीवनादिनिमित्तेऽपि नित्यकर्मानुष्ठानायासदुःखं जीवनादिनिमित्तस्यैव फलं प्रसज्येत, नित्यप्रायश्चित्तयोः नैमित्तिकत्वाविशेषात्।", "padacchedaText": "", "audioFile": "PB_003456.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003457", "originalText": "किञ्च अन्यत्— नित्यस्य काम्यस्य च अग्निहोत्रादेः अनुष्ठानायासदुःखस्य तुल्यत्वात् नित्यानुष्ठानायासदुःखमेव पूर्वकृतदुरितस्य फलम्, न तु काम्यानुष्ठानायासदुःखम् इति विशेषो नास्तीति तदपि पूर्वकृतदुरितफलं प्रसज्येत।", "padacchedaText": "", "audioFile": "PB_003457.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003458", "originalText": "तथा च सति नित्यानां फलाश्रवणात् तद्विधानान्यथानुपपत्तेश्च नित्यानुष्ठानायासदुःखं पूर्वकृतदुरितफलम् इति अर्थापत्तिकल्पना च अनुपपन्ना, एवं विधानान्यथानुपपत्तेः अनुष्ठानायासदुःखव्यतिरिक्तफलत्वानुमानाच्च नित्यानाम्।", "padacchedaText": "", "audioFile": "PB_003458.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003459", "originalText": "विरोधाच्च, विरुद्धं च इदम् उच्यते— नित्यकर्मणा अनुष्टीयमानेन अन्यस्य कर्मणः फलं भुज्यते इति अभ्युपगम्यमाने स एव उपभोगः नित्यस्य कर्मणः फलम् इति, नित्यस्य कर्मणः फलाभाव इति च विरुद्धम् उच्यते।", "padacchedaText": "", "audioFile": "PB_003459.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003460", "originalText": "किञ्च, काम्याग्निहोत्रादौ अनुष्ठीयमाने नित्यमपि अग्निहोत्रादि तन्त्रेणैव अनुष्ठितं भवतीति तदायासदुःखेनैव काम्याग्निहोत्रादिफलम् उपक्षीणं स्यात्, तत्तन्त्रत्वात्।", "padacchedaText": "", "audioFile": "PB_003460.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003461", "originalText": "अथ काम्याग्निहोत्रादिफलम् अन्यदेव स्वर्गादि, तदनुष्ठानायासदुःखमपि भिन्नं प्रसज्येत।", "padacchedaText": "", "audioFile": "PB_003461.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003462", "originalText": "न च तदस्ति, दृष्टविरोधात्, न हि काम्यानुष्ठानायासदुःखात् केवलनित्यानुष्ठानायासदुःखं भिन्नं दृश्यते।", "padacchedaText": "", "audioFile": "PB_003462.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003463", "originalText": "किञ्च अन्यत्— अविहितमप्रतिषिद्धं च कर्म तत्कालफलम्, न तु शास्त्रचोदितं प्रतिषिद्धं वा तत्कालफलं भवेत्।", "padacchedaText": "", "audioFile": "PB_003463.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003464", "originalText": "तदा स्वर्गादिष्वपि अदृष्टफलाशासनेन उद्यमो न स्यात्— अग्निहोत्रादीनामेव कर्मस्वरूपाविशेषे अनुष्ठानायासदुःखमात्रेण उपक्षयः नित्यानाम्, स्वर्गादिमहाफलत्वं काम्यानाम्, अङ्गेतिकर्तव्यताद्याधिक्ये तु असति, फलकामित्वमात्रेणेति।", "padacchedaText": "", "audioFile": "PB_003464.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003465", "originalText": "तस्माच्च न नित्यानां कर्मणाम् अदृष्टफलाभावः कदाचिदपि उपपद्यते।", "padacchedaText": "", "audioFile": "PB_003465.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003466", "originalText": "अतश्च अविद्यापूर्वकस्य कर्मणः विद्यैव शुभस्य अशुभस्य वा क्षयकारणम् अशेषतः, न नित्यकर्मानुष्ठानम्।", "padacchedaText": "", "audioFile": "PB_003466.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003467", "originalText": "अविद्याकामबीजं हि सर्वमेव कर्म।", "padacchedaText": "", "audioFile": "PB_003467.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003468", "originalText": "तथा च उपपादितमविद्वद्विषयं कर्म, विद्वद्विषया च सर्वकर्मसंन्यासपूर्विका ज्ञाननिष्ठा— ‘उभौ तौ न विजानीतः’ (भ.गी.२.१९) ‘वेदाविनाशिनं नित्यम्’ (भ.गी.२.२१) ‘ज्ञानयोगेन साङ्ख्यानां कर्मयोगेन योगिनाम्’ (भ.गी.३.३) ‘अज्ञानां कर्मसङ्गिनाम्’ (भ.गी.३.२६) ‘तत्त्ववित्तु महाबाहो गुणा गुणेषु वर्तन्ते इति मत्वा न सज्जते’ (भ.गी.३.२८) ‘सर्वकर्माणि मनसा संन्यस्यास्ते’ (भ.गी.५.१३) ‘नैव किञ्चित् करोमीति युक्तो मन्येत तत्त्ववित्’ (भ.गी.५.८), अर्थात् अज्ञः करोमि इति, आरुरुक्षोः कर्म कारणम्, आरूढस्य योगस्थस्य शम एव कारणम्, उदाराः त्रयोऽपि अज्ञाः, ‘ज्ञानी त्वात्मैव मे मतम्’ (भ.गी.७.१८) ‘अज्ञाः कर्मिणः गतागतं कामकामाः लभन्ते’, अनन्याश्चिन्तयन्तो मां नित्ययुक्ताः यथोक्तम् आत्मानम् आकाशकल्पम् उपासते, ‘ददामि बुद्धियोगं तं येन मामुपयान्ति ते’, अर्थात् न कर्मिणः अज्ञाः उपयान्ति।", "padacchedaText": "", "audioFile": "PB_003468.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003469", "originalText": "भगवत्कर्मकारिणः ये युक्ततमा अपि कर्मिणः अज्ञाः, ते उत्तरोत्तरहीनफलत्यागावसानसाधनाः, अनिर्देश्याक्षरोपासकास्तु ‘अद्वेष्टा सर्वभूतानाम्’ (भ.गी.१२.१३) इति आध्यायपरिसमाप्ति उक्तसाधनाः क्षेत्राध्यायाद्यध्यायत्रयोक्तज्ञानसाधनाश्च।", "padacchedaText": "", "audioFile": "PB_003469.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003470", "originalText": "अधिष्ठानादिपञ्चकहेतुकसर्वकर्मसंन्यासिनां आत्मैकत्वाकर्तृत्वज्ञानवतां परस्यां ज्ञाननिष्ठायां वर्तमानानां भगवत्तत्त्वविदाम् अनिष्टादिकर्मफलत्रयं परमहंसपरिव्राजकानामेव लब्धभगवत्स्वरूपात्मैकत्वशरणानां न भवति, भवत्येव अन्येषामज्ञानां कर्मिणामसंन्यासिनाम् इत्येषः गीताशास्त्रोक्तकर्तव्यार्थस्य विभागः॥", "padacchedaText": "", "audioFile": "PB_003470.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003471", "originalText": "अविद्यापूर्वकत्वं सर्वस्य कर्मणः असिद्धमिति चेत्, न, ब्रह्महत्यादिवत्।", "padacchedaText": "", "audioFile": "PB_003471.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003472", "originalText": "यद्यपि शास्त्रावगतं नित्यं कर्म, तथापि अविद्यावत एव भवति।", "padacchedaText": "", "audioFile": "PB_003472.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003473", "originalText": "यथा प्रतिषेधशास्त्रावगतमपि ब्रह्महत्यादिलक्षणं कर्म अनर्थकारणम् अविद्याकामादिदोषवतः भवति, अन्यथा प्रवृत्त्यनुपपत्तेः, तथा नित्यनैमित्तिककाम्यान्यपीति।", "padacchedaText": "", "audioFile": "PB_003473.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003474", "originalText": "देहव्यतिरिक्तात्मनि अज्ञाते प्रवृत्तिः नित्यादिकर्मसु अनुपपन्ना इति चेत्, न, चलनात्मकस्य कर्मणः अनात्मकर्तृकस्य ‘अहं करोमि’ इति प्रवृत्तिदर्शनात्।", "padacchedaText": "", "audioFile": "PB_003474.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003475", "originalText": "देहादिसङ्घाते अहंप्रत्ययः गौणः, न मिथ्या इति चेत्, न, तत्कार्येष्वपि गौणत्वोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_003475.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003476", "originalText": "आत्मीये देहादिसङ्घाते अहंप्रत्ययः गौणः, यथा आत्मीये पुत्रे ‘आत्मा वै पुत्रनामासि’ (तै.आ.एका.२.११) इति, लोके च ‘मम प्राण एव अयं गौः’ इति, तद्वत्।", "padacchedaText": "", "audioFile": "PB_003476.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003477", "originalText": "नैवायं मिथ्याप्रत्ययः।", "padacchedaText": "", "audioFile": "PB_003477.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003478", "originalText": "मिथ्याप्रत्ययस्तु स्थाणुपुरुषयोः अगृह्यमाणविशेषयोः।", "padacchedaText": "", "audioFile": "PB_003478.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003479", "originalText": "न गौणप्रत्ययस्य मुख्यकार्यार्थता, अधिकरणस्तुत्यर्थत्वात् लुप्तोपमाशब्देन।", "padacchedaText": "", "audioFile": "PB_003479.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003480", "originalText": "यथा ‘सिंहो देवदत्तः’ ‘अग्निर्माणवकः’ इति सिंह इव अग्निरिव क्रौर्यपैङ्गल्यादिसामान्यवत्त्वात् देवदत्तमाणवकाधिकरणस्तुत्यर्थमेव, न तु सिंहकार्यम् अग्निकार्यं वा गौणशब्दप्रत्ययनिमित्तं किञ्चित्साध्यते, मिथ्याप्रत्ययकार्यं तु अनर्थमनुभवति इति।", "padacchedaText": "", "audioFile": "PB_003480.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003481", "originalText": "गौणप्रत्ययविषयं जानाति ‘नैष सिंहः देवदत्तः’, तथा ‘नायमग्निर्माणवकः’ इति।", "padacchedaText": "", "audioFile": "PB_003481.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003482", "originalText": "तथा गौणेन देहादिसङ्घातेन आत्मना कृतं कर्म न मुख्येन अहंप्रत्ययविषयेण आत्मना कृतं स्यात्।", "padacchedaText": "", "audioFile": "PB_003482.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003483", "originalText": "न हि गौणसिंहाग्निभ्यां कृतं कर्म मुख्यसिंहाग्निभ्यां कृतं स्यात्।", "padacchedaText": "", "audioFile": "PB_003483.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003484", "originalText": "न च क्रौर्येण पैङ्गल्येन वा मुख्यसिंहाग्न्योः कार्यं किञ्चित् क्रियते, स्तुत्यर्थत्वेन उपक्षीणत्वात्।", "padacchedaText": "", "audioFile": "PB_003484.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003485", "originalText": "स्तूयमानौ च जानीतः ‘न अहं सिंहः’ ‘न अहम् अग्निः’ इति, न हि ‘सिंहस्य कर्म मम अग्नेश्च’ इति।", "padacchedaText": "", "audioFile": "PB_003485.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003486", "originalText": "तथा ‘न सङ्घातस्य कर्म मम मुख्यस्य आत्मनः’ इति प्रत्ययः युक्ततरः स्यात्, न पुनः ‘अहं कर्ता मम कर्म’ इति।", "padacchedaText": "", "audioFile": "PB_003486.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003487", "originalText": "यच्च आहुः ‘आत्मीयैः स्मृतीच्छाप्रयत्नैः कर्महेतुभिरात्मा कर्म करोति’ इति, न, तेषां मिथ्याप्रत्ययपूर्वकत्वात्।", "padacchedaText": "", "audioFile": "PB_003487.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003488", "originalText": "मिथ्याप्रत्ययनिमित्तेष्टानिष्टानुभूतक्रियाफलजनितसंस्कारपूर्वकाः हि स्मृतीच्छाप्रयत्नादयः।", "padacchedaText": "", "audioFile": "PB_003488.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003489", "originalText": "यथा अस्मिन् जन्मनि देहादिसङ्घाताभिमानरागद्वेषादिकृतौ धर्माधर्मौ तत्फलानुभवश्च, तथा अतीते अतीततरेऽपि जन्मनि इति अनादिरविद्याकृतः संसारः अतीतोऽनागतश्च अनुमेयः।", "padacchedaText": "", "audioFile": "PB_003489.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003490", "originalText": "ततश्च सर्वकर्मसंन्याससहितज्ञाननिष्ठया आत्यन्तिकः संसारोपरम इति सिद्धम्।", "padacchedaText": "", "audioFile": "PB_003490.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003491", "originalText": "अविद्यात्मकत्वाच्च देहाभिमानस्य, तन्निवृत्तौ देहानुपपत्तेः संसारानुपपत्तिः।", "padacchedaText": "", "audioFile": "PB_003491.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003492", "originalText": "देहादिसङ्घाते आत्माभिमानः अविद्यात्मकः।", "padacchedaText": "", "audioFile": "PB_003492.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003493", "originalText": "न हि लोके ‘गवादिभ्योऽन्योऽहम्, मत्तश्चान्ये गवादयः’ इति जानन् तान् ‘अहम्’ इति मन्यते कश्चित्।", "padacchedaText": "", "audioFile": "PB_003493.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003494", "originalText": "अजानंस्तु स्थाणौ पुरुषविज्ञानवत् अविवेकतः देहादिसङ्घाते कुर्यात् ‘अहम्’ इति प्रत्ययम्, न विवेकतः जानन्।", "padacchedaText": "", "audioFile": "PB_003494.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003495", "originalText": "यस्तु ‘आत्मा वै पुत्र नामासि’ (तै.आ.एका.२.११) इति पुत्रे अहंप्रत्ययः, स तु जन्यजनकसम्बन्धनिमित्तः गौणः। गौणेन च आत्मना भोजनादिवत् परमार्थकार्यं न शक्यते कर्तुम्, गौणसिंहाग्निभ्यां मुख्यसिंहाग्निकार्यवत्॥", "padacchedaText": "", "audioFile": "PB_003495.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003496", "originalText": "अदृष्टविषयचोदनाप्रामाण्यात् आत्मकर्तव्यं गौणैः देहेन्द्रियात्मभिः क्रियत एव इति चेत्, न, अविद्याकृतात्मत्वात्तेषाम्।", "padacchedaText": "", "audioFile": "PB_003496.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003497", "originalText": "न च गौणाः आत्मानः देहेन्द्रियादयः, किं तर्हि? मिथ्याप्रत्ययेनैव अनात्मानः सन्तः आत्मत्वमापाद्यन्ते, तद्भावे भावात्, तदभावे च अभावात्।", "padacchedaText": "", "audioFile": "PB_003497.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003498", "originalText": "अविवेकिनां हि अज्ञानकाले बालानां दृश्यते ‘दीर्घोऽहम्’ ‘गौरोऽहम्’ इति देहादिसङ्घाते अहंप्रत्ययः।", "padacchedaText": "", "audioFile": "PB_003498.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003499", "originalText": "न तु विवेकिनाम् ‘अन्योऽहं देहादिसङ्घातात्’ इति जानतां तत्काले देहादिसङ्घाते अहंप्रत्ययः भवति।", "padacchedaText": "", "audioFile": "PB_003499.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003500", "originalText": "तस्मात् मिथ्याप्रत्ययाभावे अभावात् तत्कृत एव, न गौणः।", "padacchedaText": "", "audioFile": "PB_003500.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003501", "originalText": "पृथग्गृह्यमाणविशेषसामान्ययोर्हि सिंहदेवदत्तयोः अग्निमाणवकयोर्वा गौणः प्रत्ययः शब्दप्रयोगो वा स्यात्, न अगृह्यमाणविशेषसामान्ययोः।", "padacchedaText": "", "audioFile": "PB_003501.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003502", "originalText": "यत्तु उक्तम् ‘श्रुतिप्रामाण्यात्’ इति, तत् न, तत्प्रामाण्यस्य अदृष्टविषयत्वात्।", "padacchedaText": "", "audioFile": "PB_003502.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003503", "originalText": "प्रत्यक्षादिप्रमाणानुपलब्धे हि विषये अग्निहोत्रादिसाध्यसाधनसम्बन्धे श्रुतेः प्रामाण्यम्, न प्रत्यक्षादिविषये, अदृष्टदर्शनार्थविषयत्वात् प्रामाण्यस्य।", "padacchedaText": "", "audioFile": "PB_003503.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003504", "originalText": "तस्मात् न दृष्टमिथ्याज्ञाननिमित्तस्य अहंप्रत्ययस्य देहादिसङ्घाते गौणत्वं कल्पयितुं शक्यम्।", "padacchedaText": "", "audioFile": "PB_003504.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003505", "originalText": "न हि श्रुतिशतमपि ‘शीतोऽग्निरप्रकाशो वा’ इति ब्रुवत् प्रामाण्यमुपैति।", "padacchedaText": "", "audioFile": "PB_003505.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003506", "originalText": "यदि ब्रूयात् ‘शीतोऽग्निरप्रकाशो वा’ इति, तथापि अर्थान्तरं श्रुतेः विवक्षितं कल्प्यम्, प्रामाण्यान्यथानुपपत्तेः, न तु प्रमाणान्तरविरुद्धं स्ववचनविरुद्धं वा।", "padacchedaText": "", "audioFile": "PB_003506.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003507", "originalText": "कर्मणः मिथ्याप्रत्ययवत्कर्तृकत्वात् कर्तुरभावे श्रुतेरप्रामाण्यमिति चेत्, न, ब्रह्मविद्यायामर्थवत्त्वोपपत्तेः॥", "padacchedaText": "", "audioFile": "PB_003507.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003508", "originalText": "कर्मविधिश्रुतिवत् ब्रह्मविद्याविधिश्रुतेरपि अप्रामाण्यप्रसङ्ग इति चेत्, न, बाधकप्रत्ययानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_003508.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003509", "originalText": "यथा ब्रह्मविद्याविधिश्रुत्या आत्मनि अवगते देहादिसङ्घाते अहंप्रत्ययः बाध्यते, तथा आत्मन्येव आत्मावगतिः न कदाचित् केनचित् कथञ्चिदपि बाधितुं शक्या, फलाव्यतिरेकादवगतेः, यथा अग्निः उष्णः प्रकाशश्च इति।", "padacchedaText": "", "audioFile": "PB_003509.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003510", "originalText": "न च एवं कर्मविधिश्रुतेरप्रामाण्यम्, पूर्वपूर्वप्रवृत्तिनिरोधेन उत्तरोत्तरापूर्वप्रवृत्तिजननस्य प्रत्यगात्माभिमुख्येन प्रवृत्त्युत्पादनार्थत्वात्।", "padacchedaText": "", "audioFile": "PB_003510.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003511", "originalText": "मिथ्यात्वेऽपि उपायस्य उपेयसत्यतया सत्यत्वमेव स्यात्, यथा अर्थवादानां विधिशेषाणाम्, लोकेऽपि बालोन्मत्तादीनां पयआदौ पाययितव्ये चूडावर्धनादिवचनम्।", "padacchedaText": "", "audioFile": "PB_003511.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003512", "originalText": "प्रकारान्तरस्थानां च साक्षादेव वा प्रामाण्यं सिद्धम्, प्रागात्मज्ञानात् देहाभिमाननिमित्तप्रत्यक्षादिप्रामाण्यवत्।", "padacchedaText": "", "audioFile": "PB_003512.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003513", "originalText": "यत्तु मन्यसे— स्वयमव्याप्रियमाणोऽपि आत्मा संनिधिमात्रेण करोति, तदेव मुख्यं कर्तृत्वमात्मनः, यथा राजा युध्यमानेषु योधेषु युध्यत इति प्रसिद्धं स्वयमयुध्यमानोऽपि संनिधानादेव जितः पराजितश्चेति, तथा सेनापतिः वाचैव करोति, क्रियाफलसम्बन्धश्च राज्ञः सेनापतेश्च दृष्टः।", "padacchedaText": "", "audioFile": "PB_003513.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003514", "originalText": "यथा च ऋत्विक्कर्म यजमानस्य, तथा देहादीनां कर्म आत्मकृतं स्यात्, फलस्य आत्मगामित्वात्।", "padacchedaText": "", "audioFile": "PB_003514.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003515", "originalText": "यथा वा भ्रामकस्य लोहभ्रामयितृत्वात् अव्यापृतस्यैव मुख्यमेव कर्तृत्वम्, तथा च आत्मनः इति।", "padacchedaText": "", "audioFile": "PB_003515.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003516", "originalText": "तत् असत्, अकुर्वतः कारकत्वप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_003516.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003517", "originalText": "कारकमनेकप्रकारमिति चेत्, न, राजप्रभृतीनां मुख्यस्यापि कर्तृत्वस्य दर्शनात्।", "padacchedaText": "", "audioFile": "PB_003517.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003518", "originalText": "राजा तावत् स्वव्यापारेणापि युध्यते, योधानां च योधयितृत्वे धनदाने च मुख्यमेव कर्तृत्वम्, तथा जयपराजयफलोपभोगे।", "padacchedaText": "", "audioFile": "PB_003518.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003519", "originalText": "यजमानस्यापि प्रधानत्यागे दक्षिणादाने च मुख्यमेव कर्तृत्वम्।", "padacchedaText": "", "audioFile": "PB_003519.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003520", "originalText": "तस्मात् अव्यापृतस्य कर्तृत्वोपचारो यः, सः गौणः इति अवगम्यते।", "padacchedaText": "", "audioFile": "PB_003520.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003521", "originalText": "यदि मुख्यं कर्तृत्वं स्वव्यापारलक्षणं नोपलभ्यते राजयजमानप्रभृतीनाम्, तदा संनिधिमात्रेणापि कर्तृत्वं मुख्यं परिकल्प्येत, यथा भ्रामकस्य लोहभ्रमणेन, न तथा राजयजमानादीनां स्वव्यापारो नोपलभ्यते।", "padacchedaText": "", "audioFile": "PB_003521.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003522", "originalText": "तस्मात् संनिधिमात्रेण कर्तृत्वं गौणमेव।", "padacchedaText": "", "audioFile": "PB_003522.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003523", "originalText": "तथा च सति तत्फलसम्बन्धोऽपि गौण एव स्यात्।", "padacchedaText": "", "audioFile": "PB_003523.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003524", "originalText": "न गौणेन मुख्यं कार्यं निर्वर्त्यते।", "padacchedaText": "", "audioFile": "PB_003524.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003525", "originalText": "तस्मात् असदेव एतत् गीयते ‘देहादीनां व्यापारेण अव्यापृतः आत्मा कर्ता भोक्ता च स्यात्’ इति।", "padacchedaText": "", "audioFile": "PB_003525.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003526", "originalText": "भ्रान्तिनिमित्तं तु सर्वम् उपपद्यते, यथा स्वप्ने, मायायां च एवम्।", "padacchedaText": "", "audioFile": "PB_003526.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003527", "originalText": "न च देहाद्यात्मप्रत्ययभ्रान्तिसन्तानविच्छेदेषु सुषुप्तिसमाध्यादिषु कर्तृत्वभोक्तृत्वाद्यनर्थः उपलभ्यते। तस्मात् भ्रान्तिप्रत्ययनिमित्तः एव अयं संसारभ्रमः, न तु परमार्थः, इति सम्यग्दर्शनात् अत्यन्त एवोपरम इति सिद्धम्॥ ६६॥", "padacchedaText": "", "audioFile": "PB_003527.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003528", "originalText": "सर्वं गीताशास्त्रार्थमुपसंहृत्य अस्मिन्नध्याये, विशेषतश्च अन्ते, इह शास्त्रार्थदार्ढ्याय सङ्क्षेपतः उपसंहारं कृत्वा, अथ इदानीं शास्त्रसम्प्रदायविधिमाह—\nइदं ते नातपस्काय\nनाभक्ताय कदाचन।", "padacchedaText": "", "audioFile": "PB_003528.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003529", "originalText": "न चाशुश्रूषवे वाच्यं\nन च मां योऽभ्यसूयति॥ ६७॥", "padacchedaText": "", "audioFile": "PB_003529.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003530", "originalText": "इदं शास्त्रं ते तव हिताय मया उक्तं संसारविच्छित्तये अतपस्काय तपोरहिताय न वाच्यम् इति व्यवहितेन सम्बध्यते।", "padacchedaText": "", "audioFile": "PB_003530.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003531", "originalText": "तपस्विनेऽपि अभक्ताय गुरौ देवे च भक्तिरहिताय कदाचन कस्याञ्चिदपि अवस्थायां न वाच्यम्।", "padacchedaText": "", "audioFile": "PB_003531.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003532", "originalText": "भक्तः तपस्वी अपि सन् अशुश्रूषुः यो भवति तस्मै अपि न वाच्यम्।", "padacchedaText": "", "audioFile": "PB_003532.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003533", "originalText": "न च यो मां वासुदेवं प्राकृतं मनुष्यं मत्वा अभ्यसूयति आत्मप्रशंसादिदोषाध्यारोपणेन ईश्वरत्वं मम अजानन् न सहते, असावपि अयोग्यः, तस्मै अपि न वाच्यम्।", "padacchedaText": "", "audioFile": "PB_003533.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003534", "originalText": "भगवति अनसूयायुक्ताय तपस्विने भक्ताय शुश्रूषवे वाच्यं शास्त्रम् इति सामर्थ्यात् गम्यते।", "padacchedaText": "", "audioFile": "PB_003534.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003535", "originalText": "तत्र ‘मेधाविने तपस्विने वा’ (यास्क.नि.२.१.६) इति अनयोः विकल्पदर्शनात् शुश्रूषाभक्तियुक्ताय तपस्विने तद्युक्ताय मेधाविने वा वाच्यम्।", "padacchedaText": "", "audioFile": "PB_003535.wav", "
