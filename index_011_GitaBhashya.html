chedaText": "", "audioFile": "PB_002917.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002918", "originalText": "तान् अहं सन्मार्गप्रतिपक्षभूतान् साधुद्वेषिणः द्विषतश्च मां क्रूरान् संसारेषु एव अनेकनरकसंसरणमार्गेषु नराधमान् अधर्मदोषवत्त्वात् क्षिपामि प्रक्षिपामि अजस्रं सन्ततम् अशुभान् अशुभकर्मकारिणः आसुरीष्वेव क्रूरकर्मप्रायासु व्याघ्रसिंहादियोनिषु ‘क्षिपामि’ इत्यनेन सम्बन्धः॥ १९॥", "padacchedaText": "", "audioFile": "PB_002918.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002919", "originalText": "आसुरीं योनिमापन्ना\nमूढा जन्मनि जन्मनि। मामप्राप्यैव कौन्तेय\nततो यान्त्यधमां गतिम्॥ २०॥", "padacchedaText": "", "audioFile": "PB_002919.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002920", "originalText": "आसुरीं योनिम् आपन्नाः प्रतिपन्नाः मूढाः अविवेकिनः जन्मनि जन्मनि प्रतिजन्म तमोबहुलास्वेव योनिषु जायमानाः अधो गच्छन्तो मूढाः माम् ईश्वरम् अप्राप्य अनासाद्य एव हे कौन्तेय, ततः तस्मादपि यान्ति अधमां गतिं निकृष्टतमां गतिम्।", "padacchedaText": "", "audioFile": "PB_002920.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002921", "originalText": "‘माम् अप्राप्यैव’ इति न मत्प्राप्तौ काचिदपि आशङ्का अस्ति, अतः मच्छिष्टसाधुमार्गम् अप्राप्य इत्यर्थः॥ २०॥", "padacchedaText": "", "audioFile": "PB_002921.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002922", "originalText": "सर्वस्या आसुर्याः सम्पदः सङ्क्षेपः अयम् उच्यते, यस्मिन् त्रिविधे सर्वः आसुरीसम्पद्भेदः अनन्तोऽपि अन्तर्भवति।", "padacchedaText": "", "audioFile": "PB_002922.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002923", "originalText": "यत्परिहारेण परिहृतश्च भवति, यत् मूलं सर्वस्य अनर्थस्य, तत् एतत् उच्यते—\nत्रिविधं नरकस्येदं द्वारं नाशनमात्मनः। कामः क्रोधस्तथा लोभस्तस्मादेतत्त्रयं त्यजेत्॥ २१॥", "padacchedaText": "", "audioFile": "PB_002923.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002924", "originalText": "त्रिविधं त्रिप्रकारं नरकस्य प्राप्तौ इदं द्वारं नाशनम् आत्मनः, यत् द्वारं प्रविशन्नेव नश्यति आत्मा, कस्मैचित् पुरुषार्थाय योग्यो न भवति इत्येतत्, अतः उच्यते ‘द्वारं नाशनमात्मनः’ इति।", "padacchedaText": "", "audioFile": "PB_002924.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002925", "originalText": "किं तत्? कामः क्रोधः तथा लोभः।", "padacchedaText": "", "audioFile": "PB_002925.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002926", "originalText": "तस्मात् एतत् त्रयं त्यजेत्। यतः एतत् द्वारं नाशनम् आत्मनः तस्मात् कामादित्रयमेतत् त्यजेत्॥ २१॥", "padacchedaText": "", "audioFile": "PB_002926.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002927", "originalText": "त्यागस्तुतिरियम्—\nएतैर्विमुक्तः कौन्तेय तमोद्वारैस्त्रिभिर्नरः। आचरत्यात्मनः श्रेयस्ततो याति परां गतिम्॥ २२॥", "padacchedaText": "", "audioFile": "PB_002927.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002928", "originalText": "एतैः विमुक्तः कौन्तेय तमोद्वारैः तमसः नरकस्य दुःखमोहात्मकस्य द्वाराणि कामादयः तैः, एतैः त्रिभिः विमुक्तः नरः आचरति अनुतिष्ठति।", "padacchedaText": "", "audioFile": "PB_002928.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002929", "originalText": "किम्? आत्मनः श्रेयः।", "padacchedaText": "", "audioFile": "PB_002929.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002930", "originalText": "यत्प्रतिबद्धः पूर्वं न आचचार, तदपगमात् आचरति। ततः तदाचरणात् याति परां गतिं मोक्षमपि इति॥ २२॥", "padacchedaText": "", "audioFile": "PB_002930.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002931", "originalText": "सर्वस्य एतस्य आसुरीसम्पत्परिवर्जनस्य श्रेयआचरणस्य च शास्त्रं कारणम्।", "padacchedaText": "", "audioFile": "PB_002931.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002932", "originalText": "शास्त्रप्रमाणात् उभयं शक्यं कर्तुम्, न अन्यथा।", "padacchedaText": "", "audioFile": "PB_002932.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002933", "originalText": "अतः—\nयः शास्त्रविधिमुत्सृज्य\nवर्तते कामकारतः। न स सिद्धिमवाप्नोति\nन सुखं न परां गतिम्॥ २३॥", "padacchedaText": "", "audioFile": "PB_002933.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002934", "originalText": "यः शास्त्रविधिं शास्त्रं वेदः तस्य विधिं कर्तव्याकर्तव्यज्ञानकारणं विधिप्रतिषेधाख्यम् उत्सृज्य त्यक्त्वा वर्तते कामकारतः कामप्रयुक्तः सन्, न सः सिद्धिं पुरुषार्थयोग्यताम् अवाप्नोति, न अपि अस्मिन् लोके सुखं न अपि परां प्रकृष्टां गतिं स्वर्गं मोक्षं वा॥ २३॥", "padacchedaText": "", "audioFile": "PB_002934.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002935", "originalText": "तस्माच्छास्त्रं प्रमाणं ते\nकार्याकार्यव्यवस्थितौ। ज्ञात्वा शास्त्रविधानोक्तं\nकर्म कर्तुमिहार्हसि॥ २४॥", "padacchedaText": "", "audioFile": "PB_002935.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002936", "originalText": "तस्मात् शास्त्रं प्रमाणं ज्ञानसाधनं ते तव कार्याकार्यव्यवस्थितौ कर्तव्याकर्तव्यव्यवस्थायाम्।", "padacchedaText": "", "audioFile": "PB_002936.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002937", "originalText": "अतः ज्ञात्वा बुद्ध्वा शास्त्रविधानोक्तं विधिः विधानं शास्त्रमेव विधानं शास्त्रविधानम् ‘कुर्यात्, न कुर्यात्’ इत्येवंलक्षणम्, तेन उक्तं स्वकर्म यत् तत् कर्तुम् इह अर्हसि, इह इति कर्माधिकारभूमिप्रदर्शनार्थम् इति॥ २४॥", "padacchedaText": "", "audioFile": "PB_002937.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002938", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ श्रीमद्भगवद्गीताभाष्ये षोडशोऽध्यायः॥", "padacchedaText": "", "audioFile": "PB_002938.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002939", "originalText": "सप्तदशोऽध्यायः\n‘तस्माच्छास्त्रं प्रमाणं ते’ (भ.गी.१६.२४) इति भगवद्वाक्यात् लब्धप्रश्नबीजः अर्जुन उवाच—\nअर्जुन उवाच—\nये शास्त्रविधिमुत्सृज्य\nयजन्ते श्रद्धयान्विताः।", "padacchedaText": "", "audioFile": "PB_002939.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002940", "originalText": "तेषां निष्ठा तु का कृष्ण\nसत्त्वमाहो रजस्तमः॥ १॥", "padacchedaText": "", "audioFile": "PB_002940.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002941", "originalText": "ये केचित् अविशेषिताः शास्त्रविधिं शास्त्रविधानं श्रुतिस्मृतिशास्त्रचोदनाम् उत्सृज्य परित्यज्य यजन्ते देवादीन् पूजयन्ति श्रद्धया अन्विताः श्रद्धया आस्तिक्यबुद्ध्या अन्विताः संयुक्ताः सन्तः— श्रुतिलक्षणं स्मृतिलक्षणं वा कञ्चित् शास्त्रविधिम् अपश्यन्तः वृद्धव्यवहारदर्शनादेव श्रद्दधानतया ये देवादीन् पूजयन्ति, ते इह ‘ये शास्त्रविधिमुत्सृज्य यजन्ते श्रद्धयान्विताः’ इत्येवं गृह्यन्ते।", "padacchedaText": "", "audioFile": "PB_002941.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002942", "originalText": "ये पुनः कञ्चित् शास्त्रविधिं उपलभमाना एव तम् उत्सृज्य अयथाविधि देवादीन् पूजयन्ति, ते इह ‘ये शास्त्रविधिमुत्सृज्य यजन्ते’ इति न परिगृह्यन्ते।", "padacchedaText": "", "audioFile": "PB_002942.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002943", "originalText": "कस्मात्? श्रद्धया अन्वितत्वविशेषणात्।", "padacchedaText": "", "audioFile": "PB_002943.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002944", "originalText": "देवादिपूजाविधिपरं किञ्चित् शास्त्रं पश्यन्त एव तत् उत्सृज्य अश्रद्दधानतया तद्विहितायां देवादिपूजायां श्रद्धया अन्विताः प्रवर्तन्ते इति न शक्यं कल्पयितुं यस्मात्, तस्मात् पूर्वोक्ता एव ‘ये शास्त्रविधिमुत्सृज्य यजन्ते श्रद्धयान्विताः’ इत्यत्र गृह्यन्ते तेषाम् एवंभूतानां निष्ठा तु का कृष्ण सत्त्वम् आहो रजः तमः, किं सत्त्वं निष्ठा अवस्थानम्, आहोस्वित् रजः, अथवा तमः इति।", "padacchedaText": "", "audioFile": "PB_002944.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002945", "originalText": "एतत् उक्तं भवति— या तेषां देवादिविषया पूजा, सा किं सात्त्विकी, आहोस्वित् राजसी, उत तामसी इति॥ १॥", "padacchedaText": "", "audioFile": "PB_002945.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002946", "originalText": "सामान्यविषयः अयं प्रश्नः न अप्रविभज्यं प्रतिवचनम् अर्हतीति श्रीभगवानुवाच—\nश्रीभगवानुवाच—\nत्रिविधा भवति श्रद्धा\nदेहिनां सा स्वभावजा। सात्त्विकी राजसी चैव\nतामसी चेति तां शृणु॥ २॥", "padacchedaText": "", "audioFile": "PB_002946.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002947", "originalText": "त्रिविधा त्रिप्रकारा भवति श्रद्धा, यस्यां निष्ठायां त्वं पृच्छसि, देहिनां शरीरिणां सा स्वभावजा, जन्मान्तरकृतः धर्मादिसंस्कारः मरणकाले अभिव्यक्तः स्वभावः उच्यते, ततो जाता स्वभावजा।", "padacchedaText": "", "audioFile": "PB_002947.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002948", "originalText": "सात्त्विकी सत्त्वनिर्वृत्ता देवपूजादिविषया, राजसी रजोनिर्वृत्ता यक्षरक्षःपूजादिविषया, तामसी तमोनिर्वृत्ता प्रेतपिशाचादिपूजाविषया, एवं त्रिविधां ताम् उच्यमानां श्रद्धां शृणु अवधारय॥ २॥", "padacchedaText": "", "audioFile": "PB_002948.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002949", "originalText": "सा इयं त्रिविधा भवति—\nसत्त्वानुरूपा सर्वस्य\nश्रद्धा भवति भारत। श्रद्धामयोऽयं पुरुषो\nयो यच्छ्रद्धः स एव सः॥ ३॥", "padacchedaText": "", "audioFile": "PB_002949.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002950", "originalText": "सत्त्वानुरूपा विशिष्टसंस्कारोपेतान्तःकरणानुरूपा सर्वस्य प्राणिजातस्य श्रद्धा भवति भारत।", "padacchedaText": "", "audioFile": "PB_002950.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002951", "originalText": "यदि एवं ततः किं स्यादिति, उच्यते— श्रद्धामयः अयं श्रद्धाप्रायः पुरुषः संसारी जीवः। कथम्? यः यच्छ्रद्धः या श्रद्धा यस्य जीवस्य सः यच्छ्रद्धः स एव तच्छ्रद्धानुरूप एव सः जीवः॥ ३॥", "padacchedaText": "", "audioFile": "PB_002951.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002952", "originalText": "ततश्च कार्येण लिङ्गेन देवादिपूजया सत्त्वादिनिष्ठा अनुमेया इत्याह—\nयजन्ते सात्त्विका देवान्यक्षरक्षांसि राजसाः। प्रेतान्भूतगणांश्चान्ये यजन्ते तामसा जनाः॥ ४॥", "padacchedaText": "", "audioFile": "PB_002952.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002953", "originalText": "यजन्ते पूजयन्ति सात्त्विकाः सत्त्वनिष्ठाः देवान्, यक्षरक्षांसि राजसाः, प्रेतान् भूतगणांश्च सप्तमातृकादींश्च अन्ये यजन्ते तामसाः जनाः॥ ४॥", "padacchedaText": "", "audioFile": "PB_002953.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002954", "originalText": "एवं कार्यतो निर्णीताः सत्त्वादिनिष्ठाः शास्त्रविध्युत्सर्गे।", "padacchedaText": "", "audioFile": "PB_002954.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002955", "originalText": "तत्र कश्चिदेव सहस्रेषु देवपूजादिपरः सत्त्वनिष्ठो भवति, बाहुल्येन तु रजोनिष्ठाः तमोनिष्ठाश्चैव प्राणिनो भवन्ति।", "padacchedaText": "", "audioFile": "PB_002955.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002956", "originalText": "कथम्?—\nअशास्त्रविहितं घोरं तप्यन्ते ये तपो जनाः। दम्भाहङ्कारसंयुक्ताः कामरागबलान्विताः॥ ५॥", "padacchedaText": "", "audioFile": "PB_002956.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002957", "originalText": "अशास्त्रविहितं न शास्त्रविहितम् अशास्त्रविहितं घोरं पीडाकरं प्राणिनाम् आत्मनश्च तपः तप्यन्ते निर्वर्तयन्ति ये जनाः ते च दम्भाहङ्कारसंयुक्ताः, दम्भश्च अहङ्कारश्च दम्भाहङ्कारौ, ताभ्यां संयुक्ताः दम्भाहङ्कारसंयुक्ताः, कामरागबलान्विताः कामश्च रागश्च कामरागौ तत्कृतं बलं कामरागबलं तेन अन्विताः कामरागबलान्विताः॥ ५॥", "padacchedaText": "", "audioFile": "PB_002957.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002958", "originalText": "कर्शयन्तः शरीरस्थं\nभूतग्राममचेतसः। मां चैवान्तःशरीरस्थं\nतान्विद्ध्यासुरनिश्चयान्॥ ६॥", "padacchedaText": "", "audioFile": "PB_002958.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002959", "originalText": "कर्शयन्तः कृशीकुर्वन्तः शरीरस्थं भूतग्रामं करणसमुदायम् अचेतसः अविवेकिनः मां चैव तत्कर्मबुद्धिसाक्षिभूतम् अन्तःशरीरस्थं नारायणं कर्शयन्तः, मदनुशासनाकरणमेव मत्कर्शनम्, तान् विद्धि आसुरनिश्चयान् आसुरो निश्चयो येषां ते आसुरनिश्चयाः तान् परिहरणार्थं विद्धि इति उपदेशः॥ ६॥", "padacchedaText": "", "audioFile": "PB_002959.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002960", "originalText": "आहाराणां च रस्यस्निग्धादिवर्गत्रयरूपेण भिन्नानां यथाक्रमं सात्त्विकराजसतामसपुरुषप्रियत्वदर्शनम् इह क्रियते रस्यस्निग्धादिषु आहारविशेषेषु आत्मनः प्रीत्यतिरेकेण लिङ्गेन सात्त्विकत्वं राजसत्वं तामसत्वं च बुद्ध्वा रजस्तमोलिङ्गानाम् आहाराणां परिवर्जनार्थं सत्त्वलिङ्गानां च उपादानार्थम्।", "padacchedaText": "", "audioFile": "PB_002960.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002961", "originalText": "तथा यज्ञादीनामपि सत्त्वादिगुणभेदेन त्रिविधत्वप्रतिपादनम् इह ‘राजसतामसान् बुद्ध्वा कथं नु नाम परित्यजेत्, सात्त्विकानेव अनुतिष्ठेत्’ इत्येवमर्थम्।", "padacchedaText": "", "audioFile": "PB_002961.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002962", "originalText": "आह—\nआहारस्त्वपि सर्वस्य त्रिविधो भवति प्रियः। यज्ञस्तपस्तथा दानं तेषां भेदमिमं शृणु॥ ७॥", "padacchedaText": "", "audioFile": "PB_002962.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002963", "originalText": "आहारस्त्वपि सर्वस्य भोक्तुः प्राणिनः त्रिविधो भवति प्रियः इष्टः, तथा यज्ञः, तथा तपः, तथा दानम्। तेषाम् आहारादीनां भेदम् इमं वक्ष्यमाणं शृणु॥ ७॥", "padacchedaText": "", "audioFile": "PB_002963.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002964", "originalText": "आयुःसत्त्वबलारोग्यसुखप्रीतिविवर्धनाः। रस्याः स्निग्धाः स्थिरा हृद्या आहाराः सात्त्विकप्रियाः॥ ८॥", "padacchedaText": "", "audioFile": "PB_002964.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002965", "originalText": "आयुश्च सत्त्वं च बलं च आरोग्यं च सुखं च प्रीतिश्च आयुःसत्त्वबलारोग्यसुखप्रीतयः तासां विवर्धनाः आयुःसत्त्वबलारोग्यसुखप्रीतिविवर्धनाः, ते च रस्याः रसोपेताः, स्निग्धाः स्नेहवन्तः, स्थिराः चिरकालस्थायिनः देहे, हृद्याः हृदयप्रियाः आहाराः सात्त्विकप्रियाः सात्त्विकस्य इष्टाः॥ ८॥", "padacchedaText": "", "audioFile": "PB_002965.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002966", "originalText": "कट्वम्ललवणात्युष्णतीक्ष्णरूक्षविदाहिनः। आहारा राजसस्येष्टा दुःखशोकामयप्रदाः॥ ९॥", "padacchedaText": "", "audioFile": "PB_002966.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002967", "originalText": "कट्वम्ललवणात्युष्णतीक्ष्णरूक्षविदाहिनः इत्यत्र अतिशब्दः कट्वादिषु सर्वत्र योज्यः, अतिकटुः अतितीक्ष्णः इत्येवम्।", "padacchedaText": "", "audioFile": "PB_002967.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002968", "originalText": "कटुश्च अम्लश्च लवणश्च अत्युष्णश्च तीक्ष्णश्च रूक्षश्च विदाही च ते आहाराः राजसस्य इष्टाः, दुःखशोकामयप्रदाः दुःखं च शोकं च आमयं च प्रयच्छन्तीति दुःखशोकामयप्रदाः॥ ९॥", "padacchedaText": "", "audioFile": "PB_002968.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002969", "originalText": "यातयामं गतरसं पूति पर्युषितं च यत्। उच्छिष्टमपि चामेध्यं भोजनं तामसप्रियम्॥ १०॥", "padacchedaText": "", "audioFile": "PB_002969.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002970", "originalText": "यातयामं मन्दपक्वम्, निर्वीर्यस्य गतरसशब्देन उक्तत्वात्।", "padacchedaText": "", "audioFile": "PB_002970.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002971", "originalText": "गतरसं रसवियुक्तम्, पूति दुर्गन्धि, पर्युषितं च पक्वं सत् रात्र्यन्तरितं च यत्, उच्छिष्टमपि भुक्तशिष्टम् उच्छिष्टम्, अमेध्यम् अयज्ञार्हम्, भोजनम् ईदृशं तामसप्रियम्॥ १०॥", "padacchedaText": "", "audioFile": "PB_002971.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002972", "originalText": "अथ इदानीं यज्ञः त्रिविधः उच्यते—\nअफलाकाङ्क्षिभिर्यज्ञो विधिदृष्टो य इज्यते। यष्टव्यमेवेति मनः समाधाय स सात्त्विकः॥ ११॥", "padacchedaText": "", "audioFile": "PB_002972.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002973", "originalText": "अफलाकाङ्क्षिभिः अफलार्थिभिः यज्ञः विधिदृष्टः शास्त्रचोदनादृष्टो यः यज्ञः इज्यते निर्वर्त्यते, यष्टव्यमेवेति यज्ञस्वरूपनिर्वर्तनमेव कार्यम् इति मनः समाधाय, न अनेन पुरुषार्थो मम कर्तव्यः इत्येवं निश्चित्य, सः सात्त्विकः यज्ञः उच्यते॥ ११॥", "padacchedaText": "", "audioFile": "PB_002973.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002974", "originalText": "अभिसन्धाय तु फलं दम्भार्थमपि चैव यत्। इज्यते भरतश्रेष्ठ तं यज्ञं विद्धि राजसम्॥ १२॥", "padacchedaText": "", "audioFile": "PB_002974.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002975", "originalText": "अभिसन्धाय तु उद्दिश्य फलं दम्भार्थमपि चैव यत् इज्यते भरतश्रेष्ठ तं यज्ञं विद्धि राजसम्॥ १२॥", "padacchedaText": "", "audioFile": "PB_002975.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002976", "originalText": "विधिहीनमसृष्टान्नं मन्त्रहीनमदक्षिणम्। श्रद्धाविरहितं यज्ञं तामसं परिचक्षते॥ १३॥", "padacchedaText": "", "audioFile": "PB_002976.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002977", "originalText": "विधिहीनं यथाचोदितविपरीतम्, असृष्टान्नं ब्राह्मणेभ्यो न सृष्टं न दत्तम् अन्नं यस्मिन् यज्ञे सः असृष्टान्नः तम् असृष्टान्नम्, मन्त्रहीनं मन्त्रतः स्वरतो वर्णतो वा वियुक्तं मन्त्रहीनम्, अदक्षिणम् उक्तदक्षिणारहितम्, श्रद्धाविरहितं यज्ञं तामसं परिचक्षते तमोनिर्वृत्तं कथयन्ति॥ १३॥", "padacchedaText": "", "audioFile": "PB_002977.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002978", "originalText": "अथ इदानीं तपः त्रिविधम् उच्यते—\nदेवद्विजगुरुप्राज्ञपूजनं शौचमार्जवम्। ब्रह्मचर्यमहिंसा च शारीरं तप उच्यते॥ १४॥", "padacchedaText": "", "audioFile": "PB_002978.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002979", "originalText": "देवाश्च द्विजाश्च गुरवश्च प्राज्ञाश्च देवद्विजगुरुप्राज्ञाः तेषां पूजनं देवद्विजगुरुप्राज्ञपूजनम्, शौचम्, आर्जवम् ऋजुत्वम्, ब्रह्मचर्यम् अहिंसा च शरीरनिर्वर्त्यं शारीरं शरीरप्रधानैः सर्वैरेव कार्यकरणैः कर्त्रादिभिः साध्यं शारीरं तपः उच्यते।", "padacchedaText": "", "audioFile": "PB_002979.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002980", "originalText": "‘पञ्चैते तस्य हेतवः’ (भ.गी.१८.१५) इति हि वक्ष्यति॥ १४॥", "padacchedaText": "", "audioFile": "PB_002980.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002981", "originalText": "अनुद्वेगकरं वाक्यं सत्यं प्रियहितं च यत्। स्वाध्यायाभ्यसनं चैव वाङ्मयं तप उच्यते॥ १५॥", "padacchedaText": "", "audioFile": "PB_002981.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002982", "originalText": "अनुद्वेगकरं प्राणिनाम् अदुःखकरं वाक्यं सत्यं प्रियहितं च यत् प्रियहिते दृष्टादृष्टार्थे।", "padacchedaText": "", "audioFile": "PB_002982.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002983", "originalText": "अनुद्वेगकरत्वादिभिः धर्मैः वाक्यं विशेष्यते।", "padacchedaText": "", "audioFile": "PB_002983.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002984", "originalText": "विशेषणधर्मसमुच्चयार्थः च—शब्दः।", "padacchedaText": "", "audioFile": "PB_002984.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002985", "originalText": "परप्रत्ययार्थं प्रयुक्तस्य वाक्यस्य सत्यप्रियहितानुद्वेगकरत्वानाम् अन्यतमेन द्वाभ्यां त्रिभिर्वा हीनता स्याद्यदि, न तद्वाङ्मयं तपः।", "padacchedaText": "", "audioFile": "PB_002985.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002986", "originalText": "तथा सत्यवाक्यस्य इतरेषाम् अन्यतमेन द्वाभ्यां त्रिभिर्वा विहीनतायां न वाङ्मयतपस्त्वम्।", "padacchedaText": "", "audioFile": "PB_002986.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002987", "originalText": "तथा प्रियवाक्यस्यापि इतरेषाम् अन्यतमेन द्वाभ्यां त्रिभिर्वा विहीनस्य न वाङ्मयतपस्त्वम्।", "padacchedaText": "", "audioFile": "PB_002987.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002988", "originalText": "तथा हितवाक्यस्यापि इतरेषाम् अन्यतमेन द्वाभ्यां त्रिभिर्वा विहीनस्य न वाङ्मयतपस्त्वम्।", "padacchedaText": "", "audioFile": "PB_002988.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002989", "originalText": "किं पुनः तत् तपः? यत् सत्यं वाक्यम् अनुद्वेगकरं प्रियं हितं च, तत् तपः वाङ्मयम्, यथा ‘शान्तो भव वत्स, स्वाध्यायं योगं च अनुतिष्ठ, तथा ते श्रेयो भविष्यति’ इति।", "padacchedaText": "", "audioFile": "PB_002989.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002990", "originalText": "स्वाध्यायाभ्यसनं चैव यथाविधि वाङ्मयं तपः उच्यते॥ १५॥", "padacchedaText": "", "audioFile": "PB_002990.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002991", "originalText": "मनःप्रसादः सौम्यत्वं मौनमात्मविनिग्रहः। भावसंशुद्धिरित्येतत्तपो मानसमुच्यते॥ १६॥", "padacchedaText": "", "audioFile": "PB_002991.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002992", "originalText": "मनःप्रसादः मनसः प्रशान्तिः, स्वच्छतापादनं प्रसादः, सौम्यत्वं यत् सौमनस्यम् आहुः— मुखादिप्रसादादिकार्योन्नेया अन्तःकरणस्य वृत्तिः।", "padacchedaText": "", "audioFile": "PB_002992.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002993", "originalText": "मौनं वाङ्‌नियमोऽपि मनःसंयमपूर्वको भवति इति कार्येण कारणम् उच्यते मनःसंयमो मौनमिति।", "padacchedaText": "", "audioFile": "PB_002993.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002994", "originalText": "आत्मविनिग्रहः मनोनिरोधः सर्वतः सामान्यरूपः आत्मविनिग्रहः, वाग्विषयस्यैव मनसः संयमः मौनम् इति विशेषः।", "padacchedaText": "", "audioFile": "PB_002994.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002995", "originalText": "भावसंशुद्धिः परैः व्यवहारकाले अमायावित्वं भावसंशुद्धिः। इत्येतत् तपः मानसम् उच्यते॥ १६॥", "padacchedaText": "", "audioFile": "PB_002995.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002996", "originalText": "यथोक्तं कायिकं वाचिकं मानसं च तपः तप्तं नरैः सत्त्वादिगुणभेदेन कथं त्रिविधं भवतीति, उच्यते—\nश्रद्धया परया तप्तं तपस्तत्त्रिविधं नरैः। अफलकाङ्क्षिभिर्युक्तैः सात्त्विकं परिचक्षते॥ १७॥", "padacchedaText": "", "audioFile": "PB_002996.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002997", "originalText": "श्रद्धया आस्तिक्यबुद्ध्या परया प्रकृष्टया तप्तम् अनुष्ठितं तपः तत् प्रकृतं त्रिविधं त्रिप्रकारं त्र्यधिष्ठानं नरैः अनुष्ठातृभिः अफलाकाङ्क्षिभिः फलाकाङ्क्षारहितैः युक्तैः समाहितैः— यत् ईदृशं तपः, तत् सात्त्विकं सत्त्वनिर्वृत्तं परिचक्षते कथयन्ति शिष्टाः॥ १७॥", "padacchedaText": "", "audioFile": "PB_002997.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002998", "originalText": "सत्कारमानपूजार्थं तपो दम्भेन चैव यत्। क्रियते तदिह प्रोक्तं राजसं चलमध्रुवम्॥ १८॥", "padacchedaText": "", "audioFile": "PB_002998.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002999", "originalText": "सत्कारः साधुकारः ‘साधुः अयं तपस्वी ब्राह्मणः’ इत्येवमर्थम्, मानो माननं प्रत्युत्थानाभिवादनादिः तदर्थम्, पूजा पादप्रक्षालनार्चनाशयितृत्वादिः तदर्थं च तपः सत्कारमानपूजार्थम्, दम्भेन चैव यत् क्रियते तपः तत् इह प्रोक्तं कथितं राजसं चलं कादाचित्कफलत्वेन अध्रुवम्॥ १८॥", "padacchedaText": "", "audioFile": "PB_002999.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003000", "originalText": "मूढग्राहेणात्मनो यत्पीडया क्रियते तपः। परस्योत्सादनार्थं वा तत्तामसमुदाहृतम्॥ १९॥", "padacchedaText": "", "audioFile": "PB_003000.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003001", "originalText": "मूढग्राहेण अविवेकनिश्चयेन आत्मनः पीडया यत् क्रियते तपः परस्य उत्सादनार्थं विनाशार्थं वा, तत् तामसं तपः उदाहृतम्॥ १९॥", "padacchedaText": "", "audioFile": "PB_003001.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003002", "originalText": "इदानीं दानत्रैविध्यम् उच्यते—\nदातव्यमिति यद्दानं\nदीयतेऽनुपकारिणे। देशे काले च पात्रे च\nतद्दानं सात्त्विकं स्मृतम्॥ २०॥", "padacchedaText": "", "audioFile": "PB_003002.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003003", "originalText": "दातव्यमिति एवं मनः कृत्वा यत् दानं दीयते अनुपकारिणे प्रत्युपकारासमर्थाय, समर्थायापि निरपेक्षं दीयते, देशे पुण्ये कुरुक्षेत्रादौ, काले सङ्क्रान्त्यादौ, पात्रे च षडङ्गविद्वेदपारग इत्यादौ, तत् दानं सात्त्विकं स्मृतम्॥ २०॥", "padacchedaText": "", "audioFile": "PB_003003.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003004", "originalText": "यत्तु प्रत्युपकारार्थं\nफलमुद्दिश्य वा पुनः। दीयते च परिक्लिष्टं\nतद्दानं राजसं स्मृतम्॥ २१॥", "padacchedaText": "", "audioFile": "PB_003004.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003005", "originalText": "यत्तु दानं प्रत्युपकारार्थं काले तु अयं मां प्रत्युपकरिष्यति इत्येवमर्थम्, फलं वा अस्य दानस्य मे भविष्यति अदृष्टम् इति, तत् उद्दिश्य पुनः दीयते च परिक्लिष्टं खेदसंयुक्तम्, तत् दानं राजसं स्मृतम्॥ २१॥", "padacchedaText": "", "audioFile": "PB_003005.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003006", "originalText": "अदेशकाले यद्दानमपात्रेभ्यश्च दीयते। असत्कृतमवज्ञातं तत्तामसमुदाहृतम्॥ २२॥", "padacchedaText": "", "audioFile": "PB_003006.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003007", "originalText": "अदेशकाले अदेशे अपुण्यदेशे म्लेच्छाशुच्यादिसङ्कीर्णे अकाले पुण्यहेतुत्वेन अप्रख्याते सङ्क्रान्त्यादिविशेषरहिते अपात्रेभ्यश्च मूर्खतस्करादिभ्यः, देशादिसम्पत्तौ वा असत्कृतं प्रियवचनपादप्रक्षालनपूजादिरहितम् अवज्ञातं पात्रपरिभवयुक्तं च यत् दानम्, तत् तामसम् उदाहृतम्॥ २२॥", "padacchedaText": "", "audioFile": "PB_003007.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003008", "originalText": "यज्ञदानतपःप्रभृतीनां साद्गुण्यकरणाय अयम् उपदेशः उच्यते—\nओं तत्सदिति निर्देशो ब्रह्मणस्त्रिविधः स्मृतः। ब्राह्मणास्तेन वेदाश्च यज्ञाश्च विहिताः पुरा॥ २३॥", "padacchedaText": "", "audioFile": "PB_003008.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003009", "originalText": "ओं तत् सत् इति एवं निर्देशः, निर्दिश्यते अनेनेति निर्देशः, त्रिविधो नामनिर्देशः ब्रह्मणः स्मृतः चिन्तितः वेदान्तेषु ब्रह्मविद्भिः। ब्राह्मणाः तेन निर्देशेन त्रिविधेन वेदाश्च यज्ञाश्च विहिताः निर्मिताः पुरा पूर्वम् इति निर्देशस्तुत्यर्थम् उच्यते॥ २३॥", "padacchedaText": "", "audioFile": "PB_003009.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003010", "originalText": "तस्मादोमित्युदाहृत्य यज्ञदानतपःक्रियाः। प्रवर्तन्ते विधानोक्ताः सततं ब्रह्मवादिनाम्॥ २४॥", "padacchedaText": "", "audioFile": "PB_003010.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003011", "originalText": "तस्मात् ‘ओम् इति उदाहृत्य’ उच्चार्य यज्ञदानतपःक्रियाः यज्ञादिस्वरूपाः क्रियाः प्रवर्तन्ते विधानोक्ताः शास्त्रचोदिताः सततं सर्वदा ब्रह्मवादिनां ब्रह्मवदनशीलानाम्॥ २४॥", "padacchedaText": "", "audioFile": "PB_003011.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003012", "originalText": "तदित्यनभिसन्धाय\nफलं यज्ञतपःक्रियाः। दानक्रियाश्च विविधाः\nक्रियन्ते मोक्षकाङ्क्षिभिः॥ २५॥", "padacchedaText": "", "audioFile": "PB_003012.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003013", "originalText": "तत् इति अनभिसन्धाय, ‘तत्’ इति ब्रह्माभिधानम् उच्चार्य अनभिसन्धाय च यज्ञादिकर्मणः फलं यज्ञतपःक्रियाः यज्ञक्रियाश्च तपःक्रियाश्च यज्ञतपःक्रियाः दानक्रियाश्च विविधाः क्षेत्रहिरण्यप्रदानादिलक्षणाः क्रियन्ते निर्वर्त्यन्ते मोक्षकाङ्क्षिभिः मोक्षार्थिभिः मुमुक्षुभिः॥ २५॥", "padacchedaText": "", "audioFile": "PB_003013.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003014", "originalText": "ओन्तच्छब्दयोः विनियोगः उक्तः।", "padacchedaText": "", "audioFile": "PB_003014.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003015", "originalText": "अथ इदानीं सच्छब्दस्य विनियोगः कथ्यते—\nसद्भावे साधुभावे च सदित्येतत्प्रयुज्यते। प्रशस्ते कर्मणि तथा सच्छब्दः पार्थ युज्यते॥ २६॥", "padacchedaText": "", "audioFile": "PB_003015.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003016", "originalText": "सद्भावे, असतः सद्भावे यथा अविद्यमानस्य पुत्रस्य जन्मनि, तथा साधुभावे च असद्वृत्तस्य असाधोः सद्वृत्तता साधुभावः तस्मिन् साधुभावे च सत् इत्येतत् अभिधानं ब्रह्मणः प्रयुज्यते अभिधीयते।", "padacchedaText": "", "audioFile": "PB_003016.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003017", "originalText": "प्रशस्ते कर्मणि विवाहादौ च तथा सच्छब्दः पार्थ, युज्यते प्रयुज्यते इत्येतत्॥ २६॥", "padacchedaText": "", "audioFile": "PB_003017.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003018", "originalText": "यज्ञे तपसि दाने च स्थितिः सदिति चोच्यते। कर्म चैव तदर्थीयं सदित्येवाभिधीयते॥ २७॥", "padacchedaText": "", "audioFile": "PB_003018.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003019", "originalText": "यज्ञे यज्ञकर्मणि या स्थितिः, तपसि च या स्थितिः, दाने च या स्थितिः, सा सत् इति च उच्यते विद्वद्भिः।", "padacchedaText": "", "audioFile": "PB_003019.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003020", "originalText": "कर्म च एव तदर्थीयं यज्ञदानतपोर्थीयम्, अथवा, यस्य अभिधानत्रयं प्रकृतं तदर्थीयं यज्ञदानतपोर्थीयम् ईश्वरार्थीयम् इत्येतत्, सत् इत्येव अभिधीयते। तत् एतत् यज्ञदानतपआदि कर्म असात्त्विकं विगुणमपि श्रद्धापूर्वकं ब्रह्मणः अभिधानत्रयप्रयोगेण सगुणं सात्त्विकं सम्पादितं भवति॥ २७॥", "padacchedaText": "", "audioFile": "PB_003020.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003021", "originalText": "तत्र च सर्वत्र श्रद्धाप्रधानतया सर्वं सम्पाद्यते यस्मात्, तस्मात्—\nअश्रद्धया हुतं दत्तं तपस्तप्तं कृतं च यत्। असदित्युच्यते पार्थ न च तत्प्रेत्य नो इह॥ २८॥", "padacchedaText": "", "audioFile": "PB_003021.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003022", "originalText": "अश्रद्धया हुतं हवनं कृतम्, अश्रद्धया दत्तं ब्राह्मणेभ्यः, अश्रद्धया तपः तप्तम् अनुष्ठितम्, तथा अश्रद्धयैव कृतं यत् स्तुतिनमस्कारादि, तत् सर्वम् असत् इति उच्यते, मत्प्राप्तिसाधनमार्गबाह्यत्वात् पार्थ।", "padacchedaText": "", "audioFile": "PB_003022.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003023", "originalText": "न च तत् बहुलायासमपि प्रेत्य फलाय नो अपि इहार्थम्, साधुभिः निन्दितत्वात् इति॥ २८॥", "padacchedaText": "", "audioFile": "PB_003023.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003024", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ श्रीमद्भगवद्गीताभाष्ये सप्तदशोऽध्यायः॥", "padacchedaText": "", "audioFile": "PB_003024.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003025", "originalText": "अष्टादशोऽध्यायः\nसर्वस्यैव गीताशास्त्रस्य अर्थः अस्मिन् अध्याये उपसंहृत्य सर्वश्च वेदार्थो वक्तव्यः इत्येवमर्थः अयम् अध्यायः आरभ्यते।", "padacchedaText": "", "audioFile": "PB_003025.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003026", "originalText": "सर्वेषु हि अतीतेषु अध्यायेषु उक्तः अर्थः अस्मिन् अध्याये अवगम्यते।", "padacchedaText": "", "audioFile": "PB_003026.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003027", "originalText": "अर्जुनस्तु संन्यासत्यागशब्दार्थयोरेव विशेषबुभुत्सुः उवाच—\nअर्जुन उवाच—\nसंन्यासस्य महाबाहो तत्त्वमिच्छामि वेदितुम्। त्यागस्य च हृषीकेश पृथक्केशिनिषूदन॥ १॥", "padacchedaText": "", "audioFile": "PB_003027.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003028", "originalText": "संन्यासस्य संन्यासशब्दार्थस्य इत्येतत्, हे महाबाहो, तत्त्वं तस्य भावः तत्त्वम्, याथात्म्यमित्येतत्, इच्छामि वेदितुं ज्ञातुम्, त्यागस्य च त्यागशब्दार्थस्येत्येतत्, हृषीकेश, पृथक् इतरेतरविभागतः केशिनिषूदन केशिनामा हयच्छद्मा कश्चित् असुरः तं निषूदितवान् भगवान् वासुदेवः, तेन तन्नाम्ना सम्बोध्यते अर्जुनेन॥ १॥", "padacchedaText": "", "audioFile": "PB_003028.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003029", "originalText": "संन्यासत्यागशब्दौ तत्र तत्र निर्दिष्टौ, न निर्लुठितार्थौ पूर्वेषु अध्यायेषु।", "padacchedaText": "", "audioFile": "PB_003029.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003030", "originalText": "अतः अर्जुनाय पृष्टवते तन्निर्णयाय भगवान् उवाच—\nश्रीभगवानुवाच—\nकाम्यानां कर्मणां न्यासं संन्यासं कवयो विदुः। सर्वकर्मफलत्यागं प्राहुस्त्यागं विचक्षणाः॥ २॥", "padacchedaText": "", "audioFile": "PB_003030.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003031", "originalText": "काम्यानाम् अश्वमेधादीनां कर्मणां न्यासं संन्यासशब्दार्थम्, अनुष्ठेयत्वेन प्राप्तस्य अनुष्ठानम्, कवयः पण्डिताः केचित् विदुः विजानन्ति।", "padacchedaText": "", "audioFile": "PB_003031.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003032", "originalText": "नित्यनैमित्तिकानाम् अनुष्ठीयमानानां सर्वकर्मणाम् आत्मसम्बन्धितया प्राप्तस्य फलस्य परित्यागः सर्वकर्मफलत्यागः तं प्राहुः कथयन्ति त्यागं त्यागशब्दार्थं विचक्षणाः पण्डिताः।", "padacchedaText": "", "audioFile": "PB_003032.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003033", "originalText": "यदि काम्यकर्मपरित्यागः फलपरित्यागो वा अर्थः वक्तव्यः, सर्वथा परित्यागमात्रं संन्यासत्यागशब्दयोः एकः अर्थः स्यात्, न घटपटशब्दाविव जात्यन्तरभूतार्थौ॥", "padacchedaText": "", "audioFile": "PB_003033.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003034", "originalText": "ननु नित्यनैमित्तिकानां कर्मणां फलमेव नास्ति इति आहुः।", "padacchedaText": "", "audioFile": "PB_003034.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003035", "originalText": "कथम् उच्यते तेषां फलत्यागः, यथा वन्ध्यायाः पुत्रत्यागः? नैष दोषः, नित्यानामपि कर्मणां भगवता फलवत्त्वस्य इष्टत्वात्।", "padacchedaText": "", "audioFile": "PB_003035.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003036", "originalText": "वक्ष्यति हि भगवान् ‘अनिष्टमिष्टं मिश्रं च’ (भ.गी.१८.१२) इति ‘न तु संन्यासिनाम्’ (भ.गी.१८.१२) इति च। संन्यासिनामेव हि केवलं कर्मफलासम्बन्धं दर्शयन् असंन्यासिनां नित्यकर्मफलप्राप्तिम् ‘भवत्यत्यागिनां प्रेत्य’ (भ.गी.१८.१२) इति दर्शयति॥ २॥", "padacchedaText": "", "audioFile": "PB_003036.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003037", "originalText": "त्याज्यं दोषवदित्येके कर्म प्राहुर्मनीषिणः। यज्ञदानतपःकर्म न त्याज्यमिति चापरे॥ ३॥", "padacchedaText": "", "audioFile": "PB_003037.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003038", "originalText": "त्याज्यं त्यक्तव्यं दोषवत् दोषः अस्य अस्तीति दोषवत्।", "padacchedaText": "", "audioFile": "PB_003038.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003039", "originalText": "किं तत्? कर्म बन्धहेतुत्वात् सर्वमेव।", "padacchedaText": "", "audioFile": "PB_003039.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003040", "originalText": "अथवा, दोषः यथा रागादिः त्यज्यते, तथा त्याज्यम् इति एके कर्म प्राहुः मनीषिणः पण्डिताः साङ्ख्यादिदृष्टिम् आश्रिताः, अधिकृतानां कर्मिणामपि इति। तत्रैव यज्ञदानतपःकर्म न त्याज्यम् इति च अपरे॥", "padacchedaText": "", "audioFile": "PB_003040.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003041", "originalText": "कर्मिणः एव अधिकृताः, तान् अपेक्ष्य एते विकल्पाः, न तु ज्ञाननिष्ठान् व्युत्थायिनः संन्यासिनः अपेक्ष्य। ‘ज्ञानयोगेन साङ्ख्यानां निष्ठा मया पुरा प्रोक्ता’ (भ.गी.३.३) इति कर्माधिकारात् अपोद्धृताः ये, न तान् प्रति चिन्ता॥", "padacchedaText": "", "audioFile": "PB_003041.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003042", "originalText": "ननु ‘कर्मयोगेन योगिनाम्’ (भ.गी.३.३) इति अधिकृताः पूर्वं विभक्तनिष्ठाः अपि इह सर्वशास्त्रार्थोपसंहारप्रकरणे यथा विचार्यन्ते, तथा साङ्ख्या अपि ज्ञाननिष्ठाः विचार्यन्ताम् इति।", "padacchedaText": "", "audioFile": "PB_003042.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003043", "originalText": "न, तेषां मोहदुःखनिमित्तत्यागानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_003043.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003044", "originalText": "न कायक्लेशनिमित्तं दुःखं साङ्ख्याः आत्मनि पश्यन्ति, इच्छादीनां क्षेत्रधर्मत्वेनैव दर्शितत्वात्।", "padacchedaText": "", "audioFile": "PB_003044.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003045", "originalText": "अतः ते न कायक्लेशदुःखभयात् कर्म परित्यजन्ति।", "padacchedaText": "", "audioFile": "PB_003045.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003046", "originalText": "नापि ते कर्माणि आत्मनि पश्यन्ति, येन नियतं कर्म मोहात् परित्यजेयुः।", "padacchedaText": "", "audioFile": "PB_003046.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003047", "originalText": "गुणानां कर्म ‘नैव किञ्चित्करोमि’ (भ.गी.५.८) इति हि ते संन्यस्यन्ति।", "padacchedaText": "", "audioFile": "PB_003047.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003048", "originalText": "‘सर्वकर्माणि मनसा संन्यस्य’ (भ.गी.५.१३) इत्यादिभिः तत्त्वविदः संन्यासप्रकारः उक्तः।", "padacchedaText": "", "audioFile": "PB_003048.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003049", "originalText": "तस्मात् ये अन्ये अधिकृताः कर्मणि अनात्मविदः, येषां च मोहनिमित्तः त्यागः सम्भवति कायक्लेशभयाच्च, ते एव तामसाः त्यागिनः राजसाश्च इति निन्द्यन्ते कर्मिणाम् अनात्मज्ञानां कर्मफलत्यागस्तुत्यर्थम्, ‘सर्वारम्भपरित्यागी’ (भ.गी.१२.१६) ‘मौनी सन्तुष्टो येन केनचित्।", "padacchedaText": "", "audioFile": "PB_003049.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003050", "originalText": "अनिकेतः स्थिरमतिः’ (भ.गी.१२.१९) इति गुणातीतलक्षणे च परमार्थसंन्यासिनः विशेषितत्वात्।", "padacchedaText": "", "audioFile": "PB_003050.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003051", "originalText": "वक्ष्यति च ‘निष्ठा ज्ञानस्य या परा’ (भ.गी.१८.५८) इति।", "padacchedaText": "", "audioFile": "PB_003051.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003052", "originalText": "तस्मात् ज्ञाननिष्ठाः संन्यासिनः न इह विवक्षिताः। कर्मफलत्यागः एव सात्त्विकत्वेन गुणेन तामसत्वाद्यपेक्षया संन्यासः उच्यते, न मुख्यः सर्वकर्मसंन्यासः॥", "padacchedaText": "", "audioFile": "PB_003052.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003053", "originalText": "सर्वकर्मसंन्यासासम्भवे च ‘न हि देहभृता’ (भ.गी.१८.११) इति हेतुवचनात् मुख्य एव इति चेत्, न, हेतुवचनस्य स्तुत्यर्थत्वात्।", "padacchedaText": "", "audioFile": "PB_003053.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003054", "originalText": "यथा ‘त्यागाच्छान्तिरनन्तरम्’ (भ.गी.१२.१२) इति कर्मफलत्यागस्तुतिरेव यथोक्तानेकपक्षानुष्ठानाशक्तिमन्तम् अर्जुनम् अज्ञं प्रति विधानात्, तथा इदमपि ‘न हि देहभृता शक्यम्’ (भ.गी.१८.११) इति कर्मफलत्यागस्तुत्यर्थम्, न ‘सर्वकर्माणि मनसा संन्यस्य नैव कुर्वन्न कारयन्नास्ते’ (भ.गी.५.१३) इत्यस्य पक्षस्य अपवादः केनचित् दर्शयितुं शक्यः।", "padacchedaText": "", "audioFile": "PB_003054.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003055", "originalText": "तस्मात् कर्मणि अधिकृतान् प्रत्येव एषः संन्यासत्यागविकल्पः।", "padacchedaText": "", "audioFile": "PB_003055.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003056", "originalText": "ये तु परमार्थदर्शिनः साङ्ख्याः, तेषां ज्ञाननिष्ठायामेव सर्वकर्मसंन्यासलक्षणायाम् अधिकारः, न अन्यत्र, इति न ते विकल्पार्हाः। तच्च उपपादितम् अस्माभिः ‘वेदाविनाशिनम्’ (भ.गी.२.२१) इत्यस्मिन्प्रदेशे, तृतीयादौ च॥ ३॥", "padacchedaText": "", "audioFile": "PB_003056.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003057", "originalText": "तत्र एतेषु विकल्पभेदेषु—\nनिश्चयं शृणु मे तत्र\nत्यागे भरतसत्तम। त्यागो हि पुरुषव्याघ्र\nत्रिविधः सम्प्रकीर्तितः॥ ४॥", "padacchedaText": "", "audioFile": "PB_003057.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003058", "originalText": "निश्चयं शृणु अवधारय मे मम वचनात्, तत्र त्यागे त्यागसंन्यासविकल्पे यथादर्शिते भरतसत्तम भरतानां साधुतम।", "padacchedaText": "", "audioFile": "PB_003058.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003059", "originalText": "त्यागो हि, त्यागसंन्यासशब्दवाच्यो हि यः अर्थः सः एक एवेति अभिप्रेत्य आह— त्यागो हि इति।", "padacchedaText": "", "audioFile": "PB_003059.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003060", "originalText": "पुरुषव्याघ्र, त्रिविधः त्रिप्रकारः तामसादिप्रकारैः सम्प्रकीर्तितः शास्त्रेषु सम्यक् कथितः यस्मात् तामसादिभेदेन त्यागसंन्यासशब्दवाच्यः अर्थः अधिकृतस्य कर्मिणः अनात्मज्ञस्य त्रिविधः सम्भवति, न परमार्थदर्शिनः, इत्ययमर्थः दुर्ज्ञानः, तस्मात् अत्र तत्त्वं न अन्यः वक्तुं समर्थः।", "padacchedaText": "", "audioFile": "PB_003060.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003061", "originalText": "तस्मात् निश्चयं परमार्थशास्त्रार्थविषयम् अध्यवसायम् ऐश्वरं मे मत्तः शृणु॥ ४॥", "padacchedaText": "", "audioFile": "PB_003061.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003062", "originalText": "कः पुनः असौ निश्चयः इति, आह—\nयज्ञदानतपःकर्म न त्याज्यं कार्यमेव तत्। यज्ञो दानं तपश्चैव पावनानि मनीषिणाम्॥ ५॥", "padacchedaText": "", "audioFile": "PB_003062.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003063", "originalText": "यज्ञः दानं तपः इत्येतत् त्रिविधं कर्म न त्याज्यं न त्यक्तव्यम्, कार्यं करणीयम् एव तत्। कस्मात्? यज्ञः दानं तपश्चैव पावनानि विशुद्धिकराणि मनीषिणां फलानभिसन्धीनाम् इत्येतत्॥ ५॥", "padacchedaText": "", "audioFile": "PB_003063.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003064", "originalText": "एतान्यपि तु कर्माणि\nसङ्गं त्यक्त्वा फलानि च। कर्तव्यानीति मे पार्थ\nनिश्चितं मतमुत्तमम्॥ ६॥", "padacchedaText": "", "audioFile": "PB_003064.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003065", "originalText": "एतान्यपि तु कर्माणि यज्ञदानतपांसि पावनानि उक्तानि सङ्गम् आसक्तिं तेषु त्यक्त्वा फलानि च तेषां परित्यज्य कर्तव्यानि इति अनुष्ठेयानि इति मे मम निश्चितं मतम् उत्तमम्॥", "padacchedaText": "", "audioFile": "PB_003065.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003066", "originalText": "‘निश्चयं शृणु मे तत्र’ (भ.गी.१८.४) इति प्रतिज्ञाय, पावनत्वं च हेतुम् उक्त्वा, ‘एतान्यपि कर्माणि कर्तव्यानि’ इत्येतत् ‘निश्चितं मतमुत्तमम्’ इति प्रतिज्ञातार्थोपसंहार एव, न अपूर्वार्थं वचनम्, ‘एतान्यपि’ इति प्रकृतसंनिकृष्टार्थत्वोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_003066.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003067", "originalText": "सासङ्गस्य फलार्थिनः बन्धहेतवः एतान्यपि कर्माणि मुमुक्षोः कर्तव्यानि इति अपिशब्दस्य अर्थः। न तु अन्यानि कर्माणि अपेक्ष्य ‘एतान्यपि’ इति उच्यते॥", "padacchedaText": "", "audioFile": "PB_003067.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003068", "originalText": "अन्ये तु वर्णयन्ति— नित्यानां कर्मणां फलाभावात् ‘सङ्गं त्यक्त्वा फलानि च’ इति न उपपद्यते।", "padacchedaText": "", "audioFile": "PB_003068.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003069", "originalText": "अतः ‘एतान्यपि’ इति यानि काम्यानि कर्मणि नित्येभ्यः अन्यानि, एतानि अपि कर्तव्यानि, किमुत यज्ञदानतपांसि नित्यानि इति।", "padacchedaText": "", "audioFile": "PB_003069.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003070", "originalText": "तत् असत्, नित्यानामपि कर्मणाम् इह फलवत्त्वस्य उपपादितत्वात् ‘यज्ञो दानं तपश्चैव पावनानि’ (भ.गी.१८.५) इत्यादिना वचनेन।", "padacchedaText": "", "audioFile": "PB_003070.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003071", "originalText": "नित्यान्यपि कर्माणि बन्धहेतुत्वाशङ्कया जिहासोः मुमुक्षोः कुतः काम्येषु प्रसङ्गः? ‘दूरेण ह्यवरं कर्म’ (भ.गी.२.४९) इति च निन्दितत्वात्, ‘यज्ञार्थात् कर्मणोऽन्यत्र’ (भ.गी.३.९) इति च काम्यकर्मणां बन्धहेतुत्वस्य निश्चितत्वात्, ‘त्रैगुण्यविषया वेदाः’ (भ.गी.२.४५) ‘त्रैविद्या मां सोमपाः’ (भ.गी.९.२०) ‘क्षीणे पुण्ये मर्त्यलोकं विशन्ति’ (भ.गी.९.२१) इति च, दूरव्यवहितत्वाच्च, न काम्येषु ‘एतान्यपि’ इति व्यपदेशः॥ ६॥", "padacchedaText": "", "audioFile": "PB_003071.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003072", "originalText": "तस्मात् अज्ञस्य अधिकृतस्य मुमुक्षोः—\nनियतस्य तु संन्यासः कर्मणो नोपपद्यते। मोहात्तस्य परित्यागस्तामसः परिकीर्तितः॥ ७॥", "padacchedaText": "", "audioFile": "PB_003072.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003073", "originalText": "नियतस्य तु नित्यस्य संन्यासः परित्यागः कर्मणः न उपपद्यते, अज्ञस्य पावनत्वस्य इष्टत्वात्।", "padacchedaText": "", "audioFile": "PB_003073.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003074", "originalText": "मोहात् अज्ञानात् तस्य नियतस्य परित्यागः— नियतं च अवश्यं कर्तव्यम्, त्यज्यते च, इति विप्रतिषिद्धम्, अतः मोहनिमित्तः परित्यागः तामसः परिकीर्तितः मोहश्च तमः इति॥ ७॥", "padacchedaText": "", "audioFile": "PB_003074.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003075", "originalText": "किंच\nदुःखमित्येव यत्कर्म कायक्लेशभयात्त्यजेत्। स कृत्वा राजसं त्यागं नैव त्यागफलं लभेत्॥ ८॥", "padacchedaText": "", "audioFile": "PB_003075.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003076", "originalText": "दुःखम् इति एव यत् कर्म कायक्लेशभयात् शरीरदुःखभयात् त्यजेत्, सः कृत्वा राजसं रजोनिर्वर्त्यं त्यागं नैव त्यागफलं ज्ञानपूर्वकस्य सर्वकर्मत्यागस्य फलं मोक्षाख्यं न लभेत् नैव लभेत॥ ८॥", "padacchedaText": "", "audioFile": "PB_003076.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003077", "originalText": "कः पुनः सात्त्विकः त्यागः इति, आह—\nकार्यमित्येव यत्कर्म\nनियतं क्रियतेऽर्जुन। सङ्गं त्यक्त्वा फलं चैव\nस त्यागः सात्त्विको मतः॥ ९॥", "padacchedaText": "", "audioFile": "PB_003077.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003078", "originalText": "कार्यं कर्तव्यम् इत्येव यत् कर्म नियतं नित्यं क्रियते निर्वर्त्यते हे अर्जुन, सङ्गं त्यक्त्वा फलं च एव।", "padacchedaText": "", "audioFile": "PB_003078.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003079", "originalText": "एतत् नित्यानां कर्मणां फलवत्त्वे भगवद्वचनं प्रमाणम् अवोचाम।", "padacchedaText": "", "audioFile": "PB_003079.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003080", "originalText": "अथवा, यद्यपि फलं न श्रूयते नित्यस्य कर्मणः, तथापि नित्यं कर्म कृतम् आत्मसंस्कारं प्रत्यवायपरिहारं वा फलं करोति आत्मनः इति कल्पयत्येव अज्ञः।", "padacchedaText": "", "audioFile": "PB_003080.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003081", "originalText": "तत्र तामपि कल्पनां निवारयति ‘फलं त्यक्त्वा’ इत्यनेन।", "padacchedaText": "", "audioFile": "PB_003081.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003082", "originalText": "अतः साधु उक्तम् ‘सङ्गं त्यक्त्वा फलं च’ इति। सः त्यागः नित्यकर्मसु सङ्गफलपरित्यागः सात्त्विकः सत्त्वनिर्वृत्तः मतः अभिप्रेतः॥", "padacchedaText": "", "audioFile": "PB_003082.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003083", "originalText": "ननु कर्मपरित्यागः त्रिविधः संन्यासः इति च प्रकृतः।", "padacchedaText": "", "audioFile": "PB_003083.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003084", "originalText": "तत्र तामसो राजसश्च उक्तः त्यागः।", "padacchedaText": "", "audioFile": "PB_003084.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003085", "originalText": "कथम् इह सङ्गफलत्यागः तृतीयत्वेन उच्यते? यथा त्रयो ब्राह्मणाः आगताः, तत्र षडङ्गविदौ द्वौ, क्षत्रियः तृतीयः इति तद्वत्।", "padacchedaText": "", "audioFile": "PB_003085.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003086", "originalText": "नैष दोषः त्यागसामान्येन स्तुत्यर्थत्वात्।", "padacchedaText": "", "audioFile": "PB_003086.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003087", "originalText": "अस्ति हि कर्मसंन्यासस्य फलाभिसन्धित्यागस्य च त्यागत्वसामान्यम्। तत्र राजसतामसत्वेन कर्मत्यागनिन्दया कर्मफलाभिसन्धित्यागः सात्त्विकत्वेन स्तूयते ‘स त्यागः सात्त्विको मतः’ इति॥ ९॥", "padacchedaText": "", "audioFile": "PB_003087.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003088", "originalText": "यस्तु अधिकृतः सङ्गं त्यक्त्वा फलाभिसन्धिं च नित्यं कर्म करोति, तस्य फलरागादिना अकलुषीक्रियमाणम् अन्तःकरणं नित्यैश्च कर्मभिः संस्क्रियमाणं विशुध्यति।", "padacchedaText": "", "audioFile": "PB_003088.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003089", "originalText": "तत् विशुद्धं प्रसन्नम् आत्मालोचनक्षमं भवति।", "padacchedaText": "", "audioFile": "PB_003089.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003090", "originalText": "तस्यैव नित्यकर्मानुष्ठानेन विशुद्धान्तःकरणस्य आत्मज्ञानाभिमुखस्य क्रमेण यथा तन्निष्ठा स्यात्, तत् वक्तव्यमिति आह—\nन द्वेष्ट्यकुशलं कर्म\nकुशले नानुषज्जते।", "padacchedaText": "", "audioFile": "PB_003090.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003091", "originalText": "त्यागी सत्त्वसमाविष्टो\nमेधावी च्छिन्नसंशयः॥ १०॥", "padacchedaText": "", "audioFile": "PB_003091.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003092", "originalText": "न द्वेष्टि अकुशलम् अशोभनं काम्यं कर्म, शरीरारम्भद्वारेण संसारकारणम्, ‘किमनेन? ’ इत्येवम्।", "padacchedaText": "", "audioFile": "PB_003092.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003093", "originalText": "कुशले शोभने नित्ये कर्मणि सत्त्वशुद्धिज्ञानोत्पत्तितन्निष्ठाहेतुत्वेन ‘मोक्षकारणम् इदम्’ इत्येवं न अनुषज्जते अनुषङ्गं प्रीतिं न करोति इत्येतत्।", "padacchedaText": "", "audioFile": "PB_003093.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003094", "originalText": "कः पुनः असौ? त्यागी पूर्वोक्तेन सङ्गफलत्यागेन तद्वान् त्यागी, यः कर्मणि सङ्गं त्यक्त्वा तत्फलं च नित्यकर्मानुष्ठायी सः त्यागी।", "padacchedaText": "", "audioFile": "PB_003094.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003095", "originalText": "कदा पुनः असौ अकुशलं कर्म न द्वेष्टि, कुशले च न अनुषज्जते इति, उच्यते— सत्त्वसमाविष्टः यदा सत्त्वेन आत्मानात्मविवेकविज्ञानहेतुना समाविष्टः संव्याप्तः, संयुक्त इत्येतत्।", "padacchedaText": "", "audioFile": "PB_003095.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003096", "originalText": "अत एव च मेधावी मेधया आत्मज्ञानलक्षणया प्रज्ञया संयुक्तः तद्वान् मेधावी। मेधावित्वादेव च्छिन्नसंशयः छिन्नः अविद्याकृतः संशयः यस्य ‘आत्मस्वरूपावस्थानमेव परं निःश्रेयससाधनम्, न अन्यत् किञ्चित्’ इत्येवं निश्चयेन च्छिन्नसंशयः॥", "padacchedaText": "", "audioFile": "PB_003096.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003097", "originalText": "यः अधिकृतः पुरुषः पूर्वोक्तेन प्रकारेण कर्मयोगानुष्ठानेन क्रमेण संस्कृतात्मा सन् जन्मादिविक्रियारहितत्वेन निष्क्रियम् आत्मानम् आत्मत्वेन सम्बुद्धः, सः सर्वकर्माणि मनसा संन्यस्य नैव कुर्वन् न कारयन् आसीनः नैष्कर्म्यलक्षणां ज्ञाननिष्ठाम् अश्नुते इत्येतत्।", "padacchedaText": "", "audioFile": "PB_003097.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003098", "originalText": "पूर्वोक्तस्य कर्मयोगस्य प्रयोजनम् अनेनैव श्लोकेन उक्तम्॥ १०॥", "padacchedaText": "", "audioFile": "PB_003098.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003099", "originalText": "यः पुनः अधिकृतः सन् देहात्माभिमानित्वेन देहभृत् अज्ञः अबाधितात्मकर्तृत्वविज्ञानतया ‘अहं कर्ता’ इति निश्चितबुद्धिः तस्य अशेषकर्मपरित्यागस्य अशक्यत्वात् कर्मफलत्यागेन चोदितकर्मानुष्ठाने एव अधिकारः, न तत्त्यागे इति एतम् अर्थं दर्शयितुम् आह—\nन हि देहभृता शक्यं त्यक्तुं कर्माण्यशेषतः।", "padacchedaText": "", "audioFile": "PB_003099.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003100", "originalText": "यस्तु कर्मफलत्यागी स त्यागीत्यभिधीयते॥ ११॥", "padacchedaText": "", "audioFile": "PB_003100.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003101", "originalText": "न हि यस्मात् देहभृता, देहं बिभर्तीति देहभृत्, देहात्माभिमानवान् देहभृत् उच्यते, न विवेकी, स हि ‘वेदाविनाशिनम्’ (भ.गी.२.२१) इत्यादिना कर्तृत्वाधिकारात् निवर्तितः।", "padacchedaText": "", "audioFile": "PB_003101.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003102", "originalText": "अतः तेन देहभृता अज्ञेन न शक्यं त्यक्तुं संन्यसितुं कर्माणि अशेषतः निःशेषेण।", "padacchedaText": "", "audioFile": "PB_003102.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003103", "originalText": "तस्मात् यस्तु अज्ञः अधिकृतः नित्यानि कर्माणि कुर्वन् कर्मफलत्यागी कर्मफलाभिसन्धिमात्रसंन्यासी सः त्यागी इति अभिधीयते कर्मी अपि सन् इति स्तुत्यभिप्रायेण।", "padacchedaText": "", "audioFile": "PB_003103.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003104", "originalText": "तस्मात् परमार्थदर्शिनैव अदेहभृता देहात्मभावरहितेन अशेषकर्मसंन्यासः शक्यते कर्तुम्॥ ११॥", "padacchedaText": "", "audioFile": "PB_003104.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003105", "originalText": "किं पुनः तत् प्रयोजनम्, यत् सर्वकर्मसंन्यासात् स्यादिति, उच्यते—\nअनिष्टमिष्टं मिश्रं च\nत्रिविधं कर्मणः फलम्। भवत्यत्यागिनां प्रेत्य\nन तु संन्यासिनां क्वचित्॥ १२॥", "padacchedaText": "", "audioFile": "PB_003105.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003106", "originalText": "अनिष्टं नरकतिर्यगादिलक्षणम्, इष्टं देवादिलक्षणम्, मिश्रम् इष्टानिष्टसंयुक्तं मनुष्यलक्षणं च, तत्र त्रिविधं त्रिप्रकारं कर्मणः धर्माधर्मलक्षणस्य फलं बाह्यानेककारकव्यापारनिष्पन्नं सत् अविद्याकृतम् इन्द्रजालमायोपमं महामोहकरं प्रत्यगात्मोपसर्पि इव— फल्गुतया लयम् अदर्शनं गच्छतीति फलनिर्वचनम्— तत् एतत् एवंलक्षणं फलं भवति अत्यागिनाम् अज्ञानां कर्मिणां अपरमार्थसंन्यासिनां प्रेत्य शरीरपातात् ऊर्ध्वम्।", "padacchedaText": "", "audioFile": "PB_003106.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003107", "originalText": "न तु संन्यासिनां परमार्थसंन्यासिनां परमहंसपरिव्राजकानां केवलज्ञाननिष्ठानां क्वचित्। न हि केवलसम्यग्दर्शननिष्ठा अविद्यादिसंसारबीजं न उन्मूलयति कदाचित् इत्यर्थः॥ १२॥", "padacchedaText": "", "audioFile": "PB_003107.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003108", "originalText": "अतः परमार्थदर्शिनः एव अशेषकर्मसंन्यासित्वं सम्भवति, अविद्याध्यारोपितत्वात् आत्मनि क्रियाकारकफलानाम्, न तु अज्ञस्य अधिष्ठानादीनि क्रियाकर्तृकारकाणि आत्मत्वेनैव पश्यतः अशेषकर्मसंन्यासः सम्भवति तदेतत् उत्तरैः श्लोकैः दर्शयति—\nपञ्चैतानि महाबाहो\nकारणानि निबोध मे।", "padacchedaText": "", "audioFile": "PB_003108.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003109", "originalText": "साङ्ख्ये कृतान्ते प्रोक्तानि\nसिद्धये सर्वकर्मणाम्॥ १३॥", "padacchedaText": "", "audioFile": "PB_003109.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003110", "originalText": "पञ्च एतानि वक्ष्यमाणानि हे महाबाहो, कारणानि निर्वर्तकानि।", "padacchedaText": "", "audioFile": "PB_003110.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003111", "originalText": "निबोध मे मम इति उत्तरत्र चेतःसमाधानार्थम्, वस्तुवैषम्यप्रदर्शनार्थं च।", "padacchedaText": "", "audioFile": "PB_003111.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003112", "originalText": "तानि च कारणानि ज्ञातव्यतया स्तौति— साङ्ख्ये ज्ञातव्याः पदार्थाः सङ्ख्यायन्ते यस्मिन् शास्त्रे तत् साङ्ख्यं वेदान्तः।", "padacchedaText": "", "audioFile": "PB_003112.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003113", "originalText": "कृतान्ते इति तस्यैव विशेषणम्।", "padacchedaText": "", "audioFile": "PB_003113.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003114", "originalText": "कृतम् इति कर्म उच्यते, तस्य अन्तः परिसमाप्तिः यत्र सः कृतान्तः, कर्मान्तः इत्येतत्।", "padacchedaText": "", "audioFile": "PB_003114.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003115", "originalText": "‘यावानर्थ उदपाने’ (भ.गी.२.४६) ‘सर्वं कर्माखिलं पार्थ ज्ञाने परिसमाप्यते’ (भ.गी.४.३३) इति आत्मज्ञाने सञ्जाते सर्वकर्मणां निवृत्तिं दर्शयति। अतः तस्मिन् आत्मज्ञानार्थे साङ्ख्ये कृतान्ते वेदान्ते प्रोक्तानि कथितानि सिद्धये निष्पत्त्यर्थं सर्वकर्मणाम्॥ १३॥", "padacchedaText": "", "audioFile": "PB_003115.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003116", "originalText": "कानि तानीति, उच्यते—\nअधिष्ठानं तथा कर्ता करणं च पृथग्विधम्। विविधाश्च पृथक्चेष्टा दैवं चैवात्र पञ्चमम्॥ १४॥", "padacchedaText": "", "audioFile": "PB_003116.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003117", "originalText": "अधिष्ठानम् इच्छाद्वेषसुखदुःखज्ञानादीनाम् अभिव्यक्तेराश्रयः अधिष्ठानं शरीरम्, तथा कर्ता उपाधिलक्षणः भोक्ता, करणं च श्रोत्रादि शब्दाद्युपलब्धये पृथग्विधं नानाप्रकारं तत् द्वादशसङ्ख्यं विविधाश्च पृथक्चेष्टाः वायवीयाः प्राणापानाद्याः दैवं चैव दैवमेव च अत्र एतेषु चतुर्षु पञ्चमं पञ्चानां पूरणम् आदित्यादि चक्षुराद्यनुग्राहकम्॥ १४॥", "padacchedaText": "", "audioFile": "PB_003117.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003118", "originalText": "शरीरवाङ्मनोभिर्यत्कर्म प्रारभते नरः। न्याय्यं वा विपरीतं वा पञ्चैते तस्य हेतवः॥ १५॥", "padacchedaText": "", "audioFile": "PB_003118.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003119", "originalText": "शरीरवाङ्मनोभिः यत् कर्म त्रिभिः एतैः प्रारभते निर्वर्तयति नरः, न्याय्यं वा धर्म्यं शास्त्रीयम्, विपरीतं वा अशास्त्रीयम् अधर्म्यं यच्चापि निमिषितचेष्टितादि जीवनहेतुः तदपि पूर्वकृतधर्माधर्मयोरेव कार्यमिति न्याय्यविपरीतयोरेव ग्रहणेन गृहीतम्, पञ्च एते यथोक्ताः तस्य सर्वस्यैव कर्मणो हेतवः कारणानि॥", "padacchedaText": "", "audioFile": "PB_003119.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003120", "originalText": "ननु एतानि अधिष्ठानादीनि सर्वकर्मणां निर्वर्तकानि।", "padacchedaText": "", "audioFile": "PB_003120.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003121", "originalText": "कथम् उच्यते ‘शरीरवाङ्मनोभिः यत् कर्म प्रारभते’ इति? नैष दोषः, विधिप्रतिषेधलक्षणं सर्वं कर्म शरीरादित्रयप्रधानम्, तदङ्गतया दर्शनश्रवणादि च जीवनलक्षणं त्रिधैव राशीकृतम् उच्यते शरीरादिभिः आरभ्यते इति।", "padacchedaText": "", "audioFile": "PB_003121.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003122", "originalText": "फलकालेऽपि तत्प्रधानैः साधनैः भुज्यते इति पञ्चानामेव हेतुत्वं न विरुध्यते इति॥ १५॥", "padacchedaText": "", "audioFile": "PB_003122.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003123", "originalText": "तत्रैवं सति कर्तारमात्मानं केवलं तु यः। पश्यत्यकृतबुद्धित्वान्न स पश्यति दुर्मतिः॥ १६॥", "padacchedaText": "", "audioFile": "PB_003123.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003124", "originalText": "तत्र इति प्रकृतेन सम्बध्यते।", "padacchedaText": "", "audioFile": "PB_003124.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003125", "originalText": "एवं सति एवं यथोक्तैः पञ्चभिः हेतुभिः निर्वर्त्ये सति कर्मणि।", "padacchedaText": "", "audioFile": "PB_003125.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003126", "originalText": "तत्रैवं सति इति दुर्मतित्वस्य हेतुत्वेन सम्बध्यते।", "padacchedaText": "", "audioFile": "PB_003126.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003127", "originalText": "तत्र एतेषु आत्मानन्यत्वेन अविद्यया परिकल्पितैः क्रियमाणस्य कर्मणः ‘अहमेव कर्ता’ इति कर्तारम् आत्मानं केवलं शुद्धं तु यः पश्यति अविद्वान्, कस्मात्? वेदान्ताचार्योपदेशन्यायैः अकृतबुद्धित्वात् असंस्कृतबुद्धित्वात्, योऽपि देहादिव्यतिरिक्तात्मवादी आत्मानमेव केवलं कर्तारं पश्यति, असावपि अकृतबुद्धिः, अतः अकृतबुद्धित्वात् न सः पश्यति आत्मनः तत्त्वं कर्मणो वा इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_003127.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003128", "originalText": "अतः दुर्मतिः, कुत्सिता विपरीता दुष्टा अजस्रं जननमरणप्रतिपत्तिहेतुभूता मतिः अस्य इति दुर्मतिः। सः पश्यन्नपि न पश्यति, यथा तैमिरिकः अनेकं चन्द्रम्, यथा वा अभ्रेषु धावत्सु चन्द्रं धावन्तम्, यथा वा वाहने उपविष्टः अन्येषु धावत्सु आत्मानं धावन्तम्॥ १६॥", "padacchedaText": "", "audioFile": "PB_003128.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003129", "originalText": "कः पुनः सुमतिः यः सम्यक् पश्यतीति, उच्यते—\nयस्य नाहङ्कृतो भावो बुद्धिर्यस्य न लिप्यते। हत्वापि स इमांल्लोकान्न हन्ति न निबध्यते॥ १७॥", "padacchedaText": "", "audioFile": "PB_003129.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003130", "originalText": "यस्य शास्त्राचार्योपदेशन्यायसंस्कृतात्मनः न भवति अहङ्कृतः ‘अहं कर्ता’ इत्येवंलक्षणः भावः भावना प्रत्ययः— एते एव पञ्च अधिष्ठानादयः अविद्यया आत्मनि कल्पिताः सर्वकर्मणां कर्तारः, न अहम्, अहं तु तद्व्यापाराणां साक्षिभूतः ‘अप्राणो ह्यमनाः शुभ्रो ह्यक्षरात्परतः परः’ (मु.२.१.२) केवलः अविक्रियः इत्येवं पश्यतीति एतत्— बुद्धिः अन्तःकरणं यस्य आत्मनः उपाधिभूता न लिप्यते न अनुशयिनी भवति— ‘इदमहमकार्षम्, तेन अहं नरकं गमिष्यामि’ इत्येवं यस्य बुद्धिः न लिप्यते— सः सुमतिः, सः पश्यति।", "padacchedaText": "", "audioFile": "PB_003130.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003131", "originalText": "हत्वा अपि सः इमान् लोकान्, सर्वान् इमान् प्राणिनः इत्यर्थः, न हन्ति हननक्रियां न करोति, न निबध्यते नापि तत्कार्येण अधर्मफलेन सम्बध्यते॥", "padacchedaText": "", "audioFile": "PB_003131.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003132", "originalText": "ननु हत्वापि न हन्ति इति विप्रतिषिद्धम् उच्यते यद्यपि स्तुतिः।", "padacchedaText": "", "audioFile": "PB_003132.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003133", "originalText": "नैष दोषः, लौकिकपारमार्थिकदृष्ट्यपेक्षया तदुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_003133.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003134", "originalText": "देहाद्यात्मबुद्ध्या ‘हन्ता अहम्’ इति लौकिकीं दृष्टिम् आश्रित्य ‘हत्वापि’ इति आह।", "padacchedaText": "", "audioFile": "PB_003134.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003135", "originalText": "यथादर्शितां पारमार्थिकीं दृष्टिम् आश्रित्य ‘न हन्ति न निबध्यते’ इति। एतत् उभयम् उपपद्यते एव॥", "padacchedaText": "", "audioFile": "PB_003135.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003136", "originalText": "ननु अधिष्ठानादिभिः सम्भूय करोत्येव आत्मा, ‘कर्तारमात्मानं केवलं तु’ (भ.गी.१८.१६) इति केवलशब्दप्रयोगात्।", "padacchedaText": "", "audioFile": "PB_003136.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003137", "originalText": "नैष दोषः, आत्मनः अविक्रियस्वभावत्वे अधिष्ठानादिभिः, संहतत्वानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_003137.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003138", "originalText": "विक्रियावतो हि अन्यैः संहननं सम्भवति, संहत्य वा कर्तृत्वं स्यात्।", "padacchedaText": "", "audioFile": "PB_003138.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003139", "originalText": "न तु अविक्रियस्य आत्मनः केनचित् संहननम् अस्ति इति न सम्भूय कर्तृत्वम् उपपद्यते।", "padacchedaText": "", "audioFile": "PB_003139.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003140", "originalText": "अतः केवलत्वम् आत्मनः स्वाभाविकमिति केवलशब्दः अनुवादमात्रम्।", "padacchedaText": "", "audioFile": "PB_003140.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003141", "originalText": "अविक्रियत्वं च आत्मनः श्रुतिस्मृतिन्यायप्रसिद्धम्।", "padacchedaText": "", "audioFile": "PB_003141.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003142", "originalText": "‘अविकार्योऽयमुच्यते’ (भ.गी.२.२५) ‘गुणैरेव कर्माणि क्रियन्ते’ (भ.गी.३.२७) ‘शरीरस्थोऽपि न करोति’ (भ.गी.१३.३१) इत्यादि असकृत् उपपादितं गीतास्वेव तावत्।", "padacchedaText": "", "audioFile": "PB_003142.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003143", "originalText": "श्रुतिषु च ‘ध्यायतीव लेलायतीव’ (बृ.४.३.७) इत्येवमाद्यासु।", "padacchedaText": "", "audioFile": "PB_003143.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003144", "originalText": "न्यायतश्च— निरवयवम् अपरतन्त्रम् अविक्रियम् आत्मतत्त्वम् इति राजमार्गः।", "padacchedaText": "", "audioFile": "PB_003144.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003145", "originalText": "विक्रियावत्त्वाभ्युपगमेऽपि आत्मनः स्वकीयैव विक्रिया स्वस्य भवितुम् अर्हति, न अधिष्ठानादीनां कर्माणि आत्मकर्तृकाणि स्युः।", "padacchedaText": "", "audioFile": "PB_003145.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003146", "originalText": "न हि परस्य कर्म परेण अकृतम् आगन्तुम् अर्हति।", "padacchedaText": "", "audioFile": "PB_003146.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003147", "originalText": "यत्तु अविद्यया गमितम्, न तत् तस्य।", "padacchedaText": "", "audioFile": "PB_003147.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003148", "originalText": "यथा रजतत्वं न शुक्तिकायाः, यथा वा तलमलिनत्वं बालैः गमितम् अविद्यया, न आकाशस्य, तथा अधिष्ठानादिविक्रियापि तेषामेव, न आत्मनः।", "padacchedaText": "", "audioFile": "PB_003148.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003149", "originalText": "तस्मात् युक्तम् उक्तम् ‘अहङ्कृतत्वबुद्धिलेपाभावात् विद्वान् न हन्ति न निबध्यते’ इति।", "padacchedaText": "", "audioFile": "PB_003149.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003150", "originalText": "‘नायं हन्ति न हन्यते’ (भ.गी.२.१९) इति प्रतिज्ञाय ‘न जायते’ (भ.गी.२.२०) इत्यादिहेतुवचनेन अविक्रियत्वम् आत्मनः उक्त्वा, ‘वेदाविनाशिनम्’ (भ.गी.२.२१) इति विदुषः कर्माधिकारनिवृत्तिं शास्त्रादौ सङ्क्षेपतः उक्त्वा, मध्ये प्रसारितां तत्र तत्र प्रसङ्गं कृत्वा इह उपसंहरति शास्त्रार्थपिण्डीकरणाय ‘विद्वान् न हन्ति न निबध्यते’ इति।", "padacchedaText": "", "audioFile": "PB_003150.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003151", "originalText": "एवं च सति देहभृत्त्वाभिमानानुपपत्तौ अविद्याकृताशेषकर्मसंन्यासोपपत्तेः संन्यासिनाम् अनिष्टादि त्रिविधं कर्मणः फलं न भवति इति उपपन्नम्, तद्विपर्ययाच्च इतरेषां भवति इत्येतच्च अपरिहार्यम् इति एषः गीताशास्त्रार्थः उपसंहृतः।", "padacchedaText": "", "audioFile": "PB_003151.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003152", "originalText": "स एषः सर्ववेदार्थसारः निपुणमतिभिः पण्डितैः विचार्य प्रतिपत्तव्यः इति तत्र तत्र प्रकरणविभागेन दर्शितः अस्माभिः शास्त्रन्यायानुसारेण॥ १७॥", "padacchedaText": "", "audioFile": "PB_003152.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003153", "originalText": "अथ इदानीं कर्मणां प्रवर्तकम् उच्यते—\nज्ञानं ज्ञेयं परिज्ञाता त्रिविधा कर्मचोदना। करणं कर्म कर्तेति त्रिविधः कर्मसङ्ग्रहः॥ १८॥", "padacchedaText": "", "audioFile": "PB_003153.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003154", "originalText": "ज्ञानं ज्ञायते अनेन इति सर्वविषयम् अविशेषेण उच्यते।", "padacchedaText": "", "audioFile": "PB_003154.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003155", "originalText": "तथा ज्ञेयं ज्ञातव्यम्, तदपि सामान्येनैव सर्वम् उच्यते।", "padacchedaText": "", "audioFile": "PB_003155.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003156", "originalText": "तथा परिज्ञाता उपाधिलक्षणः अविद्याकल्पितः भोक्ता।", "padacchedaText": "", "audioFile": "PB_003156.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003157", "originalText": "इति एतत् त्रयम् अविशेषेण सर्वकर्मणां प्रवर्तिका त्रिविधा त्रिप्रकारा कर्मचोदना।", "padacchedaText": "", "audioFile": "PB_003157.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003158", "originalText": "ज्ञानादीनां हि त्रयाणां संनिपाते हानोपादानादिप्रयोजनः सर्वकर्मारम्भः स्यात्।", "padacchedaText": "", "audioFile": "PB_003158.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003159", "originalText": "ततः पञ्चभिः अधिष्ठानादिभिः आरब्धं वाङ्मनःकायाश्रयभेदेन त्रिधा राशीभूतं त्रिषु करणादिषु सङ्गृह्यते इत्येतत् उच्यते— करणं क्रियते अनेन इति बाह्यं श्रोत्रादि, अन्तःस्थं बुद्ध्यादि, कर्म ईप्सिततमं कर्तुः क्रियया व्याप्यमानम्, कर्ता करणानां व्यापारयिता उपाधिलक्षणः, इति त्रिविधः त्रिप्रकारः कर्मसङ्ग्रहः, सङ्गृह्यते अस्मिन्निति सङ्ग्रहः, कर्मणः सङ्ग्रहः कर्मसङ्ग्रहः, कर्म एषु हि त्रिषु समवैति, तेन अयं त्रिविधः कर्मसङ्ग्रहः॥ १८॥", "padacchedaText": "", "audioFile": "PB_003159.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003160", "originalText": "अथ इदानीं क्रियाकारकफलानां सर्वेषां गुणात्मकत्वात् सत्त्वरजस्तमोगुणभेदतः त्रिविधः भेदः वक्तव्य इति आरभ्यते—\nज्ञानं कर्म च कर्ता च\nत्रिधैव गुणभेदतः। प्रोच्यते गुणसङ्ख्याने\nयथावच्छृणु तान्यपि॥ १९॥", "padacchedaText": "", "audioFile": "PB_003160.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003161", "originalText": "ज्ञानं कर्म च, कर्म क्रिया, न कारकं पारिभाषिकम् ईप्सिततमं कर्म, कर्ता च निर्वर्तकः क्रियाणां त्रिधा एव, अवधारणं गुणव्यतिरिक्तजात्यन्तराभावप्रदर्शनार्थं गुणभेदतः सत्त्वादिभेदेन इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_003161.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003162", "originalText": "प्रोच्यते कथ्यते गुणसङ्ख्याने कापिले शास्त्रे तदपि गुणसङ्ख्यानशास्त्रं गुणभोक्तृविषये प्रमाणमेव।", "padacchedaText": "", "audioFile": "PB_003162.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003163", "originalText": "परमार्थब्रह्मैकत्वविषये यद्यपि विरुध्यते, तथापि ते हि कापिलाः गुणगौणव्यापारनिरूपणे अभियुक्ताः इति तच्छास्त्रमपि वक्ष्यमाणार्थस्तुत्यर्थत्वेन उपादीयते इति न विरोधः।", "padacchedaText": "", "audioFile": "PB_003163.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003164", "originalText": "यथावत् यथान्यायं यथाशास्त्रं शृणु तान्यपि ज्ञानादीनि तद्भेदजातानि गुणभेदकृतानि शृणु, वक्ष्यमाणे अर्थे मनःसमाधिं कुरु इत्यर्थः॥ १९॥", "padacchedaText": "", "audioFile": "PB_003164.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003165", "originalText": "ज्ञानस्य तु तावत् त्रिविधत्वम् उच्यते—\nसर्वभूतेषु येनैकं\nभावमव्ययमीक्षते। अविभक्तं विभक्तेषु\nतज्ज्ञानं विद्धि सात्त्विकम्॥ २०॥", "padacchedaText": "", "audioFile": "PB_003165.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003166", "originalText": "सर्वभूतेषु अव्यक्तादिस्थावरान्तेषु भूतेषु येन ज्ञानेन एकं भावं वस्तु— भावशब्दः वस्तुवाची, एकम् आत्मवस्तु इत्यर्थः, अव्ययं न व्येति स्वात्मना स्वधर्मेण वा, कूटस्थम् इत्यर्थः, ईक्षते पश्यति येन ज्ञानेन, तं च भावम् अविभक्तं प्रतिदेहं विभक्तेषु देहभेदेषु न विभक्तं तत् आत्मवस्तु, व्योमवत् निरन्तरमित्यर्थः, तत् ज्ञानं साक्षात् सम्यग्दर्शनम् अद्वैतात्मविषयं सात्त्विकं विद्धि इति॥ २०॥", "padacchedaText": "", "audioFile": "PB_003166.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003167", "originalText": "यानि द्वैतदर्शनानि तानि असम्यग्भूतानि राजसानि तामसानि च इति न साक्षात् संसारोच्छित्तये भवन्ति—\nपृथक्त्वेन तु यज्ज्ञानं\nनानाभावान्पृथग्विधान्। वेत्ति सर्वेषु भूतेषु\nतज्ज्ञानं विद्धि राजसम्॥ २१॥", "padacchedaText": "", "audioFile": "PB_003167.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003168", "originalText": "पृथक्त्वेन तु भेदेन प्रतिशरीरम् अन्यत्वेन यत् ज्ञानं नानाभावान् भिन्नान् आत्मनः पृथग्विधान् पृथक्प्रकारान् भिन्नलक्षणान् इत्यर्थः, वेत्ति विजानाति यत् ज्ञानं सर्वेषु भूतेषु, ज्ञानस्य कर्तृत्वासम्भवात् येन ज्ञानेन वेत्ति इत्यर्थः, तत् ज्ञानं विद्धि राजसं रजोगुणनिर्वृत्तम्॥ २१॥", "padacchedaText": "", "audioFile": "PB_003168.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003169", "originalText": "यत्तु कृत्स्नवदेकस्मिन्कार्ये सक्तमहैतुकम्। अतत्त्वार्थवदल्पं च तत्तामसमुदाहृतम्॥ २२॥", "padacchedaText": "", "audioFile": "PB_003169.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003170", "originalText": "यत् ज्ञानं कृत्स्नवत् समस्तवत् सर्वविषयमिव एकस्मिन् कार्ये देहे बहिर्वा प्रतिमादौ सक्तम् ‘एतावानेव आत्मा ईश्वरो वा, न अतः परम् अस्ति’ इति, यथा नग्नक्षपणकादीनां शरीरान्तर्वर्ती देहपरिमाणो जीवः, ईश्वरो वा पाषाणदार्वादिमात्रम्, इत्येवम् एकस्मिन् कार्ये सक्तम् अहैतुकं हेतुवर्जितं निर्युक्तिकम्, अतत्त्वार्थवत् अयथाभूतार्थवत्, यथाभूतः अर्थः तत्त्वार्थः, सः अस्य ज्ञेयभूतः अस्तीति तत्त्वार्थवत्, न तत्त्वार्थवत् अतत्त्वार्थवत्, अहैतुकत्वादेव अल्पं च, अल्पविषयत्वात् अल्पफलत्वाद्वा।", "padacchedaText": "", "audioFile": "PB_003170.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003171", "originalText": "तत् तामसम् उदाहृतम्। तामसानां हि प्राणिनाम् अविवेकिनाम् ईदृशं ज्ञानं दृश्यते॥ २२॥", "padacchedaText": "", "audioFile": "PB_003171.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003172", "originalText": "अथ इदानीं कर्मणः त्रैविध्यम् उच्यते—\nनियतं सङ्गरहितमरागद्वेषतःकृतम्। अफलप्रेप्सुना कर्म यत्तत्सात्त्विकमुच्यते॥ २३॥", "padacchedaText": "", "audioFile": "PB_003172.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003173", "originalText": "नियतं नित्यं सङ्गरहितम् आसक्तिवर्जितम् अरागद्वेषतःकृतं रागप्रयुक्तेन द्वेषप्रयुक्तेन च कृतं रागद्वेषतःकृतम्, तद्विपरीतम् अरागद्वेषतःकृतम्, अफलप्रेप्सुना फलं प्रेप्सतीति फलप्रेप्सुः फलतृष्णः तद्विपरीतेन अफलप्रेप्सुना कर्त्रा कृतं कर्म यत्, तत् सात्त्विकम् उच्यते॥ २३॥", "padacchedaText": "", "audioFile": "PB_003173.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003174", "originalText": "यत्तु कामेप्सुना कर्म साहङ्कारेण वा पुनः। क्रियते बहुलायासं तद्राजसमुदाहृतम्॥ २४॥", "padacchedaText": "", "audioFile": "PB_003174.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003175", "originalText": "यत्तु कामेप्सुना कर्मफलप्रेप्सुना इत्यर्थः, कर्म साहङ्कारेण इति न तत्त्वज्ञानापेक्षया।", "padacchedaText": "", "audioFile": "PB_003175.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003176", "originalText": "किं तर्हि? लौकिकश्रोत्रियनिरहङ्कारापेक्षया।", "padacchedaText": "", "audioFile": "PB_003176.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003177", "originalText": "यो हि परमार्थनिरहङ्कारः आत्मवित्, न तस्य कामेप्सुत्वबहुलायासकर्तृत्वप्राप्तिः अस्ति।", "padacchedaText": "", "audioFile": "PB_003177.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003178", "originalText": "सात्त्विकस्यापि कर्मणः अनात्मवित् साहङ्कारः कर्ता, किमुत राजसतामसयोः।", "padacchedaText": "", "audioFile": "PB_003178.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003179", "originalText": "लोके अनात्मविदपि श्रोत्रियो निरहङ्कारः उच्यते ‘निरहङ्कारः अयं ब्राह्मणः’ इति।", "padacchedaText": "", "audioFile": "PB_003179.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003180", "originalText": "तस्मात् तदपेक्षयैव ‘साहङ्कारेण वा’ इति उक्तम्।", "padacchedaText": "", "audioFile": "PB_003180.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003181", "originalText": "पुनःशब्दः पादपूरणार्थः। क्रियते बहुलायासं कर्त्रा महता आयासेन निर्वर्त्यते, तत् कर्म राजसम् उदाहृतम्॥ २४॥", "padacchedaText": "", "audioFile": "PB_003181.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003182", "originalText": "अनुबन्धं क्षयं हिंसामनपेक्ष्य च पौरुषम्। मोहादारभ्यते कर्म यत्तत्तामसमुच्यते॥ २५॥", "padacchedaText": "", "audioFile": "PB_003182.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003183", "originalText": "अनुबन्धं पश्चाद्भावि यत् वस्तु सः अनुबन्धः उच्यते तं च अनुबन्धम्, क्षयं यस्मिन् कर्मणि क्रियमाणे शक्तिक्षयः अर्थक्षयो वा स्यात् तं क्षयम्, हिंसां प्राणिबाधां च, अनपेक्ष्य च पौरुषं पुरुषकारम् ‘शक्नोमि इदं कर्म समापयितुम्’ इत्येवम् आत्मसामर्थ्यम्, इत्येतानि अनुबन्धादीनि अनपेक्ष्य पौरुषान्तानि मोहात् अविवेकतः आरभ्यते कर्म यत्, तत् तामसं तमोनिर्वृत्तम् उच्यते॥ २५॥", "padacchedaText": "", "audioFile": "PB_003183.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003184", "originalText": "इदानीं कर्तृभेदः उच्यते—\nमुक्तसङ्गोऽनहंवादी\nधृत्युत्साहसमन्वितः। सिद्ध्यसिद्ध्योर्निर्विकारः\nकर्ता सात्त्विक उच्यते॥ २६॥", "padacchedaText": "", "audioFile": "PB_003184.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003185", "originalText": "मुक्तसङ्गः मुक्तः परित्यक्तः सङ्गः येन सः मुक्तसङ्गः, अनहंवादी न अहंवदनशीलः, धृत्युत्साहसमन्वितः धृतिः धारणम् उत्साहः उद्यमः ताभ्यां समन्वितः संयुक्तः धृत्युत्साहसमन्वितः, सिद्ध्यसिद्ध्योः क्रियमाणस्य कर्मणः फलसिद्धौ असिद्धौ च सिद्ध्यसिद्ध्योः निर्विकारः, केवलं शास्त्रप्रमाणेन प्रयुक्तः न फलरागादिना यः सः निर्विकारः उच्यते।", "padacchedaText": "", "audioFile": "PB_003185.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003186", "originalText": "एवंभूतः कर्ता यः सः सात्त्विकः उच्यते॥ २६॥", "padacchedaText": "", "audioFile": "PB_003186.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003187", "originalText": "रागी कर्मफलप्रेप्सुर्लुब्धो हिंसात्मकोऽशुचिः। हर्षशोकान्वितः कर्ता राजसः परिकीर्तितः॥ २७॥", "padacchedaText": "", "audioFile": "PB_003187.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003188", "originalText": "रागी रागः अस्य अस्तीति रागी, कर्मफलप्रेप्सुः कर्मफलार्थी इत्यर्थः, लुब्धः परद्रव्येषु सञ्जाततृष्णः, तीर्थादौ स्वद्रव्यापरित्यागी वा, हिंसात्मकः परपीडाकरस्वभावः, अशुचिः बाह्याभ्यन्तरशौचवर्जितः, हर्षशोकान्वितः इष्टप्राप्तौ हर्षः अनिष्टप्राप्तौ इष्टवियोगे च शोकः ताभ्यां हर्षशोकाभ्याम् अन्वितः संयुक्तः, तस्यैव च कर्मणः सम्पत्तिविपत्तिभ्यां हर्षशोकौ स्याताम्, ताभ्यां संयुक्तो यः कर्ता सः राजसः परिकीर्तितः॥ २७॥", "padacchedaText": "", "audioFile": "PB_003188.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003189", "originalText": "अयुक्तः प्राकृतः स्तब्धः\nशठो नैकृतिकोऽलसः। विषादी दीर्घसूत्री च\nकर्ता तामस उच्यते॥ २८॥", "padacchedaText": "", "audioFile": "PB_003189.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003190", "originalText": "अयुक्तः न युक्तः असमाहितः, प्राकृतः अत्यन्तासंस्कृतबुद्धिः बालसमः, स्तब्धः दण्डवत् न नमति कस्मैचित्, शठः मायावी शक्तिगूहनकारी, नैकृतिकः परविभेदनपरः, अलसः अप्रवृत्तिशीलः कर्तव्येष्वपि, विषादी विषादवान् सर्वदा अवसन्नस्वभावः, दीर्घसूत्री च कर्तव्यानां दीर्घप्रसारणः, सर्वदा मन्दस्वभावः, यत् अद्य श्वो वा कर्तव्यं तत् मासेनापि न करोति, यश्च एवंभूतः, सः कर्ता तामसः उच्यते॥ २८॥", "padacchedaText": "", "audioFile": "PB_003190.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003191", "originalText": "बुद्धेर्भेदं धृतेश्चैव गुणतस्त्रिविधं शृणु। प्रोच्यमानमशेषेण पृथक्त्वेन धनञ्जय॥ २९॥", "padacchedaText": "", "audioFile": "PB_003191.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003192", "originalText": "बुद्धेः भेदं धृतेश्चैव भेदं गुणतः सत्त्वादिगुणतः त्रिविधं शृणु इति सूत्रोपन्यासः। प्रोच्यमानं कथ्यमानम् अशेषेण निरवशेषतः यथावत् पृथक्त्वेन विवेकतः धनञ्जय, दिग्विजये मानुषं दैवं च प्रभूतं धनं जितवान्, तेन असौ धनञ्जयः अर्जुनः॥ २९॥", "padacchedaText": "", "audioFile": "PB_003192.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003193", "originalText": "प्रवृत्तिं च निवृत्तिं च\nकार्याकार्ये भयाभये। बन्धं मोक्षं च या वेत्ति\nबुद्धिः सा पार्थ सात्त्विकी॥ ३०॥", "padacchedaText": "", "audioFile": "PB_003193.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003194", "originalText": "प्रवृत्तिं च प्रवृत्तिः प्रवर्तनं बन्धहेतुः कर्ममार्गः शास्त्रविहितविषयः, निवृत्तिं च निर्वृत्तिः मोक्षहेतुः संन्यासमार्गः— बन्धमोक्षसमानवाक्यत्वात् प्रवृत्तिनिवृत्ती कर्मसंन्यासमार्गौ इति अवगम्यते— कार्याकार्ये विहितप्रतिषिद्धे लौकिके वैदिके वा शास्त्रबुद्धेः कर्तव्याकर्तव्ये करणाकरणे इत्येतत्, कस्य? देशकालाद्यपेक्षया दृष्टादृष्टार्थानां कर्मणाम्।", "padacchedaText": "", "audioFile": "PB_003194.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003195", "originalText": "भयाभये बिभेति अस्मादिति भयं चोरव्याघ्रादि, न भयं अभयम्, भयं च अभयं च भयाभये, दृष्टादृष्टविषययोः भयाभययोः कारणे इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_003195.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003196", "originalText": "बन्धं सहेतुकं मोक्षं च सहेतुकं या वेत्ति विजानाति बुद्धिः, सा पार्थ सात्त्विकी।", "padacchedaText": "", "audioFile": "PB_003196.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003197", "originalText": "तत्र ज्ञानं बुद्धेः वृत्तिः, बुद्धिस्तु वृत्तिमती। धृतिरपि वृत्तिविशेषः एव बुद्धेः॥ ३०॥", "padacchedaText": "", "audioFile": "PB_003197.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003198", "originalText": "यया धर्ममधर्मं च\nकार्यं चाकार्यमेव च। अयथावत्प्रजानाति\nबुद्धिः सा पार्थ राजसी॥ ३१॥", "padacchedaText": "", "audioFile": "PB_003198.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003199", "originalText": "यया धर्मं शास्त्रचोदितम् अधर्मं च तत्प्रतिषिद्धं कार्यं च अकार्यमेव च पूर्वोक्ते एव कार्याकार्ये अयथावत् न यथावत् सर्वतः निर्णयेन न प्रजानाति, बुद्धिः सा पार्थ, राजसी॥ ३१॥", "padacchedaText": "", "audioFile": "PB_003199.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003200", "originalText": "अधर्मं धर्ममिति या\nमन्यते तमसावृता। सर्वार्थान्विपरीतांश्च\nबुद्धिः सा पार्थ तामसी॥ ३२॥", "padacchedaText": "", "audioFile": "PB_003200.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003201", "originalText": "अधर्मं प्रतिषिद्धं धर्मं विहितम् इति या मन्यते जानाति तमसा आवृता सती, सर्वार्थान् सर्वानेव ज्ञेयपदार्थान् विपरीतांश्च विपरीतानेव विजानाति, बुद्धिः सा पार्थ, तामसी॥ ३२॥", "padacchedaText": "", "audioFile": "PB_003201.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003202", "originalText": "धृत्या यया धारयते\nमनःप्राणेन्द्रियक्रियाः। योगेनाव्यभिचारिण्या\nधृतिः सा पार्थ सात्त्विकी॥ ३३॥", "padacchedaText": "", "audioFile": "PB_003202.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003203", "originalText": "धृत्या यया— अव्यभिचारिण्या इति व्यवहितेन सम्बन्धः, धारयते, किम्? मनःप्राणेन्द्रियक्रियाः मनश्च प्राणाश्च इन्द्रियाणि च मनःप्राणेन्द्रियाणि, तेषां क्रियाः चेष्टाः, ताः उच्छास्त्रमार्गप्रवृत्तेः धारयते धारयति— धृत्या हि धार्यमाणाः उच्छास्त्रमार्गविषयाः न भवन्ति— योगेन समाधिना, अव्यभिचारिण्या, नित्यसमाध्यनुगतया इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_003203.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003204", "originalText": "एतत् उक्तं भवति— अव्यभिचारिण्या धृत्या मनःप्राणेन्द्रियक्रियाः धार्यमाणाः योगेन धारयतीति। या एवंलक्षणा धृतिः, सा पार्थ, सात्त्विकी॥ ३३॥", "padacchedaText": "", "audioFile": "PB_003204.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003205", "originalText": "यया तु धर्मकामार्थान्धृत्या धारयतेऽर्जुन। प्रसङ्गेन फलाकाङ्क्षी धृतिः सा पार्थ राजसी॥ ३४॥", "padacchedaText": "", "audioFile": "PB_003205.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003206", "originalText": "यया तु धर्मकामार्थान् धर्मश्च कामश्च अर्थश्च धर्मकामार्थाः तान् धर्मकामार्थान् धृत्या यया धारयते मनसि नित्यमेव कर्तव्यरूपान् अवधारयति हे अर्जुन, प्रसङ्गेन यस्य यस्य धर्मादेः धारणप्रसङ्गः तेन तेन प्रसङ्गेन फलाकाङ्क्षी च भवति यः पुरुषः, तस्य धृतिः या, सा पार्थ, राजसी॥ ३४॥", "padacchedaText": "", "audioFile": "PB_003206.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003207", "originalText": "यया स्वप्नं भयं शोकं\nविषादं मदमेव च। न विमुञ्चति दुर्मेधा\nधृतिः सा तामसी मता॥ ३५॥", "padacchedaText": "", "audioFile": "PB_003207.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003208", "originalText": "यया स्वप्नं निद्रां भयं त्रासं शोकं विषादं विषण्णतां मदं विषयसेवाम् आत्मनः बहुमन्यमानः मत्त इव मदम् एव च मनसि नित्यमेव कर्तव्यरूपतया कुर्वन् न विमुञ्चति धारयत्येव दुर्मेधाः कुत्सितमेधाः पुरुषः यः, तस्य धृतिः या, सा तामसी मता॥ ३५॥", "padacchedaText": "", "audioFile": "PB_003208.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003209", "originalText": "गुणभेदेन क्रियाणां कारकाणां च त्रिविधो भेदः उक्तः।", "padacchedaText": "", "audioFile": "PB_003209.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003210", "originalText": "अथ इदानीं फलस्य सुखस्य त्रिविधो भेदः उच्यते—\nसुखं त्विदानीं त्रिविधं\nशृणु मे भरतर्षभ। अभ्यासाद्रमते यत्र\nदुःखान्तं च निगच्छति॥ ३६॥", "padacchedaText": "", "audioFile": "PB_003210.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003211", "originalText": "सुखं तु इदानीं त्रिविधं शृणु, समाधानं कुरु इत्येतत्, मे मम भरतर्षभ। अभ्यासात् परिचयात् आवृत्तेः रमते रतिं प्रतिपद्यते यत्र यस्मिन् सुखानुभवे दुःखान्तं च दुःखावसानं दुःखोपशमं च निगच्छति निश्चयेन प्राप्नोति॥ ३६॥", "padacchedaText": "", "audioFile": "PB_003211.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003212", "originalText": "यत्तदग्रे विषमिव परिणामेऽमृतोपमम्। तत्सुखं सात्त्विकं प्रोक्तमात्मबुद्धिप्रसादजम्॥ ३७॥", "padacchedaText": "", "audioFile": "PB_003212.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003213", "originalText": "यत् तत् सुखम् अग्रे पूर्वं प्रथमसंनिपाते ज्ञानवैराग्यध्यानसमाध्यारम्भे अत्यन्तायासपूर्वकत्वात् विषमिव दुःखात्मकं भवति, परिणामे ज्ञानवैराग्यादिपरिपाकजं सुखम् अमृतोपमम्, तत् सुखं सात्त्विकं प्रोक्तं विद्वद्भिः, आत्मनः बुद्धिः आत्मबुद्धिः, आत्मबुद्धेः प्रसादः नैर्मल्यं सलिलस्य इव स्वच्छता, ततः जातं आत्मबुद्धिप्रसादजम्।", "padacchedaText": "", "audioFile": "PB_003213.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003214", "originalText": "आत्मविषया वा आत्मावलम्बना वा बुद्धिः आत्मबुद्धिः, तत्प्रसादप्रकर्षाद्वा जातमित्येतत्। तस्मात् सात्त्विकं तत्॥ ३७॥", "padacchedaText": "", "audioFile": "PB_003214.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003215", "originalText": "विषयेन्द्रियसंयोगाद्यत्तदग्रेऽमृतोपमम्। परिणामे विषमिव तत्सुखं राजसं स्मृतम्॥ ३८॥", "padacchedaText": "", "audioFile": "PB_003215.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003216", "originalText": "विषयेन्द्रियसंयोगात् जायते यत् सुखम् तत् सुखम् अग्रे प्रथमक्षणे अमृतोपमम् अमृतसमम्, परिणामे विषमिव, बलवीर्यरूपप्रज्ञामेधाधनोत्साहहानिहेतुत्वात् अधर्मतज्जनितनरकादिहेतुत्वाच्च परिणामे तदुपभोगपरिणामान्ते विषमिव, तत् सुखं राजसं स्मृतम्॥ ३८॥", "padacchedaText": "", "audioFile": "PB_003216.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003217", "originalText": "यदग्रे चानुबन्धे च सुखं मोहनमात्मनः। निद्रालस्यप्रमादोत्थं तत्तामसमुदाहृतम्॥ ३९॥", "padacchedaText": "", "audioFile": "PB_003217.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003218", "originalText": "यत् अग्रे च अनुबन्धे च अवसानोत्तरकाले च सुखं मोहनं मोहकरम् आत्मनः निद्रालस्यप्रमादोत्थं निद्रा च आलस्यं च प्रमादश्च तेभ्यः समुत्तिष्ठतीति निद्रालस्यप्रमादोत्थम्, तत् तामसम् उदाहृतम्॥ ३९॥", "padacchedaText": "", "audioFile": "PB_003218.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_003219", "originalText": "अथ इदानीं प्रकरणोपसंहारार्थः श्लोकः आरभ्यते—\nन तदस्ति पृथिव्यां वा दिवि देवेषु वा पुनः। सत्त्वं प्रकृतिजैर्मुक्तं यदेभिः स्यात्त्रिभिर्गुणैः॥ ४०॥", "padacchedaText": "", "audio
