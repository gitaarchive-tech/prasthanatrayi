एव ते योगशक्तिदर्शनात् अनुमिनोमि—\nत्वमक्षरं परमं वेदितव्यं\nत्वमस्य विश्वस्य परं निधानम्। त्वमव्ययः शाश्वतधर्मगोप्ता\nसनातनस्त्वं पुरुषो मतो मे॥ १८॥", "padacchedaText": "", "audioFile": "PB_001933.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001934", "originalText": "त्वम् अक्षरं न क्षरतीति, परमं ब्रह्म वेदितव्यं ज्ञातव्यं मुमुक्षुभिः।", "padacchedaText": "", "audioFile": "PB_001934.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001935", "originalText": "त्वम् अस्य विश्वस्य समस्तस्य जगतः परं प्रकृष्टं निधानं निधीयते अस्मिन्निति निधानं परः आश्रयः इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001935.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001936", "originalText": "किञ्च, त्वम् अव्ययः न तव व्ययो विद्यते इति अव्ययः, शाश्वतधर्मगोप्ता शश्वद्भवः शाश्वतः नित्यः धर्मः तस्य गोप्ता शाश्वतधर्मगोप्ता। सनातनः चिरन्तनः त्वं पुरुषः परमः मतः अभिप्रेतः मे मम॥ १८॥", "padacchedaText": "", "audioFile": "PB_001936.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001937", "originalText": "किञ्च—\nअनादिमध्यान्तमनन्तवीर्यमनन्तबाहुं शशिसूर्यनेत्रम्। पश्यामि त्वां दीप्तहुताशवक्त्रं स्वतेजसा विश्वमिदं तपन्तम्॥ १९॥", "padacchedaText": "", "audioFile": "PB_001937.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001938", "originalText": "अनादिमध्यान्तम् आदिश्च मध्यं च अन्तश्च न विद्यते यस्य सः अयम् अनादिमध्यान्तः तं त्वां अनादिमध्यान्तम्, अनन्तवीर्यं न तव वीर्यस्य अन्तः अस्ति इति अनन्तवीर्यः तं त्वाम् अनन्तवीर्यम्, तथा अनन्तबाहुम् अनन्ताः बाहवः यस्य तव सः त्वम्, अनन्तबाहुः तं त्वाम् अनन्तबाहुम्, शशिसूर्यनेत्रं शशिशूर्यौ नेत्रे यस्य तव सः त्वं शशिसूर्यनेत्रः तं त्वां शशिसूर्यनेत्रं चन्द्रादित्यनयनम्, पश्यामि त्वां दीप्तहुताशवक्त्रं दीप्तश्च असौ हुताशश्च वक्त्रं यस्य तव सः त्वं दीप्तहुताशवक्त्रः तं त्वां दीप्तहुताशवक्त्रम्, स्वतेजसा विश्वम् इदं समस्तं तपन्तम्॥ १९॥", "padacchedaText": "", "audioFile": "PB_001938.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001939", "originalText": "द्यावापृथिव्योरिदमन्तरं हि\nव्याप्तं त्वयैकेन दिशश्च सर्वाः। दृष्ट्वाद्भुतं रूपमिदं तवोग्रं\nलोकत्रयं प्रव्यथितं महात्मन्॥ २०॥", "padacchedaText": "", "audioFile": "PB_001939.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001940", "originalText": "द्यावापृथिव्योः इदम् अन्तरं हि अन्तरिक्षं व्याप्तं त्वया एकेन विश्वरूपधरेण दिशश्च सर्वाः व्याप्ताः। दृष्ट्वा उपलभ्य अद्भुतं विस्मापकं रूपम् इदं तव उग्रं क्रूरं लोकानां त्रयं लोकत्रयं प्रव्यथितं भीतं प्रचलितं वा हे महात्मन् अक्षुद्रस्वभाव॥ २०॥", "padacchedaText": "", "audioFile": "PB_001940.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001941", "originalText": "अथ अधुना पुरा ‘यद्वा जयेम यदि वा नो जयेयुः’ (भ.गी.२.६) इति अर्जुनस्य यः संशयः आसीत्, तन्निर्णयाय पाण्डवजयम् ऐकान्तिकं दर्शयामि इति प्रवृत्तो भगवान्।", "padacchedaText": "", "audioFile": "PB_001941.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001942", "originalText": "तं पश्यन् आह— किञ्च—\nअमी हि त्वा सुरसङ्घा विशन्ति\nकेचिद्भीताः प्राञ्जलयो गृणन्ति। स्वस्तीत्युक्त्वा महर्षिसिद्धसङ्घाः\nस्तुवन्ति त्वां स्तुतिभिः पुष्कलाभिः॥ २१॥", "padacchedaText": "", "audioFile": "PB_001942.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001943", "originalText": "अमी हि युध्यमाना योद्धारः त्वा त्वां सुरसङ्घाः ये अत्र भूभारावताराय अवतीर्णाः वस्वादिदेवसङ्घाः मनुष्यसंस्थानाः त्वां विशन्ति प्रविशन्तः दृश्यन्ते।", "padacchedaText": "", "audioFile": "PB_001943.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001944", "originalText": "तत्र केचित् भीताः प्राञ्जलयः सन्तो गृणन्ति स्तुवन्ति त्वाम् अन्ये पलायनेऽपि अशक्ताः सन्तः।", "padacchedaText": "", "audioFile": "PB_001944.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001945", "originalText": "युद्धे प्रत्युपस्थिते उत्पातादिनिमित्तानि उपलक्ष्य स्वस्ति अस्तु जगतः इति उक्त्वा महर्षिसिद्धसङ्घाः महर्षीणां सिद्धानां च सङ्घाः स्तुवन्ति त्वां स्तुतिभिः पुष्कलाभिः सम्पूर्णाभिः॥ २१॥", "padacchedaText": "", "audioFile": "PB_001945.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001946", "originalText": "किञ्चान्यत्—\nरुद्रादित्या वसवो ये च साध्या\nविश्वेऽश्विनौ मरुतश्चोष्मपाश्च। गन्धर्वयक्षासुरसिद्धसङ्घा\nवीक्षन्ते त्वां विस्मिताश्चैव सर्वे॥ २२॥", "padacchedaText": "", "audioFile": "PB_001946.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001947", "originalText": "रुद्रादित्याः वसवो ये च साध्याः रुद्रादयः गणाः विश्वेदेवाः अश्विनौ च देवौ मरुतश्च ऊष्मपाश्च पितरः, गन्धर्वयक्षासुरसिद्धसङ्घाः गन्धर्वाः हाहाहूहूप्रभृतयः यक्षाः कुबेरप्रभृतयः असुराः विरोचनप्रभृतयः सिद्धाः कपिलादयः तेषां सङ्घाः गन्धर्वयक्षासुरसिद्धसङ्घाः, ते वीक्षन्ते पश्यन्ति त्वां विस्मिताः विस्मयमापन्नाः सन्तः ते एव सर्वे॥ २२॥", "padacchedaText": "", "audioFile": "PB_001947.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001948", "originalText": "यस्मात्—\nरूपं महत्ते बहुवक्त्रनेत्रं\nमहाबाहो बहुबाहूरुपादम्। बहूदरं बहुदंष्ट्राकरालं\nदृष्ट्वा लोकाः प्रव्यथितास्तथाहम्॥ २३॥", "padacchedaText": "", "audioFile": "PB_001948.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001949", "originalText": "रूपं महत् अतिप्रमाणं ते तव बहुवक्त्रनेत्रं बहूनि वक्त्राणि मुखानि नेत्राणि चक्षूंषि च यस्मिन् तत् रूपं बहुवक्त्रनेत्रम्, हे महाबाहो, बहुबाहूरुपादं बहवो बाहवः ऊरवः पादाश्च यस्मिन् रूपे तत् बहुबाहूरुपादम्, किञ्च, बहूदरं बहूनि उदराणि यस्मिन्निति बहूदरम्, बहुदंष्ट्राकरालं बह्वीभिः दंष्ट्राभिः करालं विकृतं तत् बहुदंष्ट्राकरालम्, दृष्ट्वा रूपम् ईदृशं लोकाः लौकिकाः प्राणिनः प्रव्यथिताः प्रचलिताः भयेन, तथा अहमपि॥ २३॥", "padacchedaText": "", "audioFile": "PB_001949.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001950", "originalText": "तत्रेदं कारणम्—\nनभःस्पृशं दीप्तमनेकवर्णं\nव्यात्ताननं दीप्तविशालनेत्रम्। दृष्ट्वा हि त्वां प्रव्यथितान्तरात्मा\nधृतिं न विन्दामि शमं च विष्णो॥ २४॥", "padacchedaText": "", "audioFile": "PB_001950.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001951", "originalText": "नभःस्पृशं द्युस्पर्शम् इत्यर्थः, दीप्तं प्रज्वलितम्, अनेकवर्णम् अनेके वर्णाः भयङ्कराः नानासंस्थानाः यस्मिन् त्वयि तं त्वाम् अनेकवर्णम्, व्यात्ताननं व्यात्तानि विवृतानि आननानि मुखानि यस्मिन् त्वयि तं त्वां व्यात्ताननम्, दीप्तविशालनेत्रं दीप्तानि प्रज्वलितानि विशालानि विस्तीर्णानि नेत्राणि यस्मिन् त्वयि तं त्वां दीप्तविशालनेत्रं दृष्ट्वा हि त्वां प्रव्यथितान्तरात्मा प्रव्यथितः प्रभीतः अन्तरात्मा मनः यस्य मम सः अहं प्रव्यथितान्तरात्मा सन् धृतिं धैर्यं न विन्दामि न लभे शमं च उपशमनं मनस्तुष्टिं हे विष्णो॥ २४॥", "padacchedaText": "", "audioFile": "PB_001951.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001952", "originalText": "कस्मात्—\nदंष्ट्राकरालानि च ते मुखानि\nदृष्ट्वैव कालानलसंनिभानि। दिशो न जाने न लभे च शर्म\nप्रसीद देवेश जगन्निवास॥ २५॥", "padacchedaText": "", "audioFile": "PB_001952.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001953", "originalText": "दंष्ट्राकरालानि दंष्ट्राभिः करालानि विकृतानि ते तव मुखानि दृष्ट्वैव उपलभ्य कालानलसंनिभानि प्रलयकाले लोकानां दाहकः अग्निः कालानलः तत्सदृशानि कालानलसंनिभानि मुखानि दृष्ट्वेत्येतत्।", "padacchedaText": "", "audioFile": "PB_001953.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001954", "originalText": "दिशः पूर्वापरविवेकेन न जाने दिङ्मूढो जातः अस्मि।", "padacchedaText": "", "audioFile": "PB_001954.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001955", "originalText": "अतः न लभे च न उपलभे च शर्म सुखम्। अतः प्रसीद प्रसन्नो भव हे देवेश, जगन्निवास॥ २५॥", "padacchedaText": "", "audioFile": "PB_001955.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001956", "originalText": "येभ्यो मम पराजयाशङ्का या आसीत् सा च अपगता।", "padacchedaText": "", "audioFile": "PB_001956.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001957", "originalText": "यतः—\nअमी च त्वां धृतराष्ट्रस्य पुत्राः\nसर्वे सहैवावनिपालसङ्घैः। भीष्मो द्रोणः सूतपुत्रस्तथासौ\nसहास्मदीयैरपि योधमुख्यैः॥ २६॥", "padacchedaText": "", "audioFile": "PB_001957.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001958", "originalText": "अमी च त्वां धृतराष्ट्रस्य पुत्राः दुर्योधनप्रभृतयः— ‘त्वरमाणाः विशन्ति’ इति व्यवहितेन सम्बन्धः— सर्वे सहैव सहिताः अवनिपालसङ्घैः अवनिं पृथ्वीं पालयन्तीति अवनिपालाः तेषां सङ्घैः, किञ्च भीष्मो द्रोणः सूतपुत्रः कर्णः तथा असौ सह अस्मदीयैरपि धृष्टद्युम्नप्रभृतिभिः योधमुख्यैः योधानां मुख्यैः प्रधानैः सह॥ २६॥", "padacchedaText": "", "audioFile": "PB_001958.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001959", "originalText": "किञ्च—\nवक्त्राणि ते त्वरमाणा विशन्ति\nदंष्ट्राकरालानि भयानकानि। केचिद्विलग्ना दशनान्तरेषु\nसन्दृश्यन्ते चूर्णितैरुत्तमाङ्गैः॥ २७॥", "padacchedaText": "", "audioFile": "PB_001959.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001960", "originalText": "वक्त्राणि मुखानि ते तव त्वरमाणाः त्वरायुक्ताः सन्तः विशन्ति, किंविशिष्टानि मुखानि? दंष्ट्राकरालानि भयानकानि भयङ्कराणि। किञ्च, केचित् मुखानि प्रविष्टानां मध्ये विलग्नाः दशनान्तरेषु मांसमिव भक्षितं सन्दृश्यन्ते उपलभ्यन्ते चूर्णितैः चूर्णीकृतैः उत्तमाङ्गैः शिरोभिः॥ २७॥", "padacchedaText": "", "audioFile": "PB_001960.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001961", "originalText": "कथं प्रविशन्ति मुखानि इत्याह—\nयथा नदीनां बहवोऽम्बुवेगाः\nसमुद्रमेवाभिमुखा द्रवन्ति। तथा तवामी नरलोकवीरा\nविशन्ति वक्त्राण्यभिविज्वलन्ति॥ २८॥", "padacchedaText": "", "audioFile": "PB_001961.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001962", "originalText": "यथा नदीनां स्रवन्तीनां बहवः अनेके अम्बूनां वेगाः अम्बुवेगाः त्वराविशेषाः समुद्रमेव अभिमुखाः प्रतिमुखाः द्रवन्ति प्रविशन्ति, तथा तद्वत् तव अमी भीष्मादयः नरलोकवीराः मनुष्यलोके शूराः विशन्ति वक्त्राणि अभिविज्वलन्ति प्रकाशमानानि॥ २८॥", "padacchedaText": "", "audioFile": "PB_001962.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001963", "originalText": "ते किमर्थं प्रविशन्ति कथं च इत्याह—\nयथा प्रदीप्तं ज्वलनं पतङ्गा विशन्ति नाशाय समृद्धवेगाः। तथैव नाशाय विशन्ति लोकास्तवापि वक्त्राणि समृद्धवेगाः॥ २९॥", "padacchedaText": "", "audioFile": "PB_001963.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001964", "originalText": "यथा प्रदीप्तं ज्वलनम् अग्निं पतङ्गाः पक्षिणः विशन्ति नाशाय विनाशाय समृद्धवेगाः समृद्धः उद्भूतः वेगः गतिः येषां ते समृद्धवेगाः, तथैव नाशाय विशन्ति लोकाः प्राणिनः तवापि वक्त्राणि समृद्धवेगाः॥ २९॥", "padacchedaText": "", "audioFile": "PB_001964.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001965", "originalText": "त्वं पुनः—\nलेलिह्यसे ग्रसमानः समन्ताल्लोकान्समग्रान्वदनैर्ज्वलद्भिः। तेजोभिरापूर्य जगत्समग्रं भासस्तवोग्राः प्रतपन्ति विष्णो॥ ३०॥", "padacchedaText": "", "audioFile": "PB_001965.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001966", "originalText": "लेलिह्यसे आस्वादयसि ग्रसमानः अन्तः प्रवेशयन् समन्तात् समन्ततः लोकान् समग्रान् समस्तान् वदनैः वक्त्रैः ज्वलद्भिः दीप्यमानैः तेजोभिः आपूर्य संव्याप्य जगत् समग्रं सह अग्रेण समस्तम् इत्येतत्।", "padacchedaText": "", "audioFile": "PB_001966.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001967", "originalText": "किञ्च, भासः दीप्तयः तव उग्राः क्रूराः प्रतपन्ति प्रतापं कुर्वन्ति हे विष्णो व्यापनशील॥ ३०॥", "padacchedaText": "", "audioFile": "PB_001967.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001968", "originalText": "यतः एवमुग्रस्वभावः, अतः—\nआख्याहि मे को भवानुग्ररूपो नमोऽस्तु ते देववर प्रसीद। विज्ञातुमिच्छामि भवन्तमाद्यं न हि प्रजानामि तव प्रवृत्तिम्॥ ३१॥", "padacchedaText": "", "audioFile": "PB_001968.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001969", "originalText": "आख्याहि कथय मे मह्यं कः भवान् उग्ररूपः क्रूराकारः, नमः अस्तु ते तुभ्यं हे देववर देवानां प्रधान, प्रसीद प्रसादं कुरु। विज्ञातुं विशेषेण ज्ञातुम् इच्छामि भवन्तम् आद्यम् आदौ भवम् आद्यम्, न हि यस्मात् प्रजानामि तव त्वदीयां प्रवृत्तिं चेष्टाम्॥ ३१॥", "padacchedaText": "", "audioFile": "PB_001969.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001970", "originalText": "श्रीभगवानुवाच—\nकालोऽस्मि लोकक्षयकृत्प्रवृद्धो लोकान्समाहर्तुमिह प्रवृत्तः। ऋतेऽपि त्वा न भविष्यन्ति सर्वे येऽवस्थिताः प्रत्यनीकेषु योधाः॥ ३२॥", "padacchedaText": "", "audioFile": "PB_001970.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001971", "originalText": "कालः अस्मि लोकक्षयकृत् लोकानां क्षयं करोतीति लोकक्षयकृत् प्रवृद्धः वृद्धिं गतः।", "padacchedaText": "", "audioFile": "PB_001971.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001972", "originalText": "यदर्थं प्रवृद्धः तत् शृणु— लोकान् समाहर्तुं संहर्तुम् इह अस्मिन् काले प्रवृत्तः।", "padacchedaText": "", "audioFile": "PB_001972.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001973", "originalText": "ऋतेऽपि विनापि त्वा त्वां न भविष्यन्ति भीष्मद्रोणकर्णप्रभृतयः सर्वे, येभ्यः तव आशङ्का, ये अवस्थिताः प्रत्यनीकेषु अनीकमनीकं प्रति प्रत्यनीकेषु प्रतिपक्षभूतेषु अनीकेषु योधाः योद्धारः॥ ३२॥", "padacchedaText": "", "audioFile": "PB_001973.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001974", "originalText": "यस्मात् एवम्—\nतस्मात्त्वमुत्तिष्ठ यशो लभस्व\nजित्वा शत्रून्भुङ्क्ष्व राज्यं समृद्धम्। मयैवैते निहताः पूर्वमेव\nनिमित्तमात्रं भव सव्यसाचिन्॥ ३३॥", "padacchedaText": "", "audioFile": "PB_001974.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001975", "originalText": "तस्मात् त्वम् उत्तिष्ठ ‘भीष्मप्रभृतयः अतिरथाः अजेयाः देवैरपि, अर्जुनेन जिताः’ इति यशः लभस्व, केवलं पुण्यैः हि तत् प्राप्यते।", "padacchedaText": "", "audioFile": "PB_001975.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001976", "originalText": "जित्वा शत्रून् दुर्योधनप्रभृतीन् भुङ्क्ष्व राज्यं समृद्धम् असपत्नम् अकण्टकम्।", "padacchedaText": "", "audioFile": "PB_001976.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001977", "originalText": "मया एव एते निहताः निश्चयेन हताः प्राणैः वियोजिताः पूर्वमेव। निमित्तमात्रं भव त्वं हे सव्यसाचिन्, सव्येन वामेनापि हस्तेन शराणां क्षेप्ता सव्यसाची इति उच्यते अर्जुनः॥ ३३॥", "padacchedaText": "", "audioFile": "PB_001977.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001978", "originalText": "द्रोणं च भीष्मं च जयद्रथं च\nकर्णं तथान्यानपि योधवीरान्। मया हतांस्त्वं जहि मा व्यथिष्ठा\nयुध्यस्व जेतासि रणे सपत्नान्॥ ३४॥", "padacchedaText": "", "audioFile": "PB_001978.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001979", "originalText": "द्रोणं च, येषु येषु योधेषु अर्जुनस्य आशङ्का तांस्तान् व्यपदिशति भगवान्, मया हतानिति।", "padacchedaText": "", "audioFile": "PB_001979.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001980", "originalText": "तत्र द्रोणभीष्मयोः तावत् प्रसिद्धम् आशङ्काकारणम्।", "padacchedaText": "", "audioFile": "PB_001980.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001981", "originalText": "द्रोणस्तु धनुर्वेदाचार्यः दिव्यास्त्रसम्पन्नः, आत्मनश्च विशेषतः गुरुः गरिष्ठः।", "padacchedaText": "", "audioFile": "PB_001981.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001982", "originalText": "भीष्मश्च स्वच्छन्दमृत्युः दिव्यास्त्रसम्पन्नश्च परशुरामेण द्वन्द्वयुद्धम् अगमत्, न च पराजितः।", "padacchedaText": "", "audioFile": "PB_001982.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001983", "originalText": "तथा जयद्रथः, यस्य पिता तपः चरति ‘मम पुत्रस्य शिरः भूमौ निपातयिष्यति यः, तस्यापि शिरः पतिष्यति’ इति।", "padacchedaText": "", "audioFile": "PB_001983.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001984", "originalText": "कर्णोऽपि वासवदत्तया शक्त्या त्वमोघया सम्पन्नः सूर्यपुत्रः कानीनः यतः, अतः तन्नाम्नैव निर्देशः।", "padacchedaText": "", "audioFile": "PB_001984.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001985", "originalText": "मया हतान् त्वं जहि निमित्तमात्रेण।", "padacchedaText": "", "audioFile": "PB_001985.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001986", "originalText": "मा व्यथिष्ठाः तेभ्यः भयं मा कार्षीः। युध्यस्व जेतासि दुर्योधनप्रभृतीन् रणे युद्धे सपत्नान् शत्रून्॥ ३४॥", "padacchedaText": "", "audioFile": "PB_001986.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001987", "originalText": "सञ्जय उवाच—\nएतच्छ्रुत्वा वचनं केशवस्य\nकृताञ्जलिर्वेपमानः किरीटी। नमस्कृत्वा भूय एवाह कृष्णं\nसगद्गदं भीतभीतः प्रणम्य॥ ३५॥", "padacchedaText": "", "audioFile": "PB_001987.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001988", "originalText": "एतत् श्रुत्वा वचनं केशवस्य पूर्वोक्तं कृताञ्जलिः सन् वेपमानः कम्पमानः किरीटी नमस्कृत्वा, भूयः पुनः एव आह उक्तवान् कृष्णं सगद्गदं भयाविष्टस्य दुःखाभिघातात् स्नेहाविष्टस्य च हर्षोद्भवात्, अश्रुपूर्णनेत्रत्वे सति श्लेष्मणा कण्ठावरोधः, ततश्च वाचः अपाटवं मन्दशब्दत्वं यत् स गद्गदः तेन सह वर्तत इति सगद्गदं वचनम् आह इति वचनक्रियाविशेषणम् एतत्।", "padacchedaText": "", "audioFile": "PB_001988.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001989", "originalText": "भीतभीतः पुनः पुनः भयाविष्टचेताः सन् प्रणम्य प्रह्वः भूत्वा, ‘आह’ इति व्यवहितेन सम्बन्धः॥", "padacchedaText": "", "audioFile": "PB_001989.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001990", "originalText": "अत्र अवसरे सञ्जयवचनं साभिप्रायम्।", "padacchedaText": "", "audioFile": "PB_001990.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001991", "originalText": "कथम्? द्रोणादिषु अर्जुनेन निहतेषु अजेयेषु चतुर्षु, निराश्रयः दुर्योधनः निहतः एव इति मत्वा धृतराष्ट्रः जयं प्रति निराशः सन् सन्धिं करिष्यति, ततः शान्तिः उभयेषां भविष्यति इति।", "padacchedaText": "", "audioFile": "PB_001991.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001992", "originalText": "तदपि न अश्रौषीत् धृतराष्ट्रः भवितव्यवशात्॥ ३५॥", "padacchedaText": "", "audioFile": "PB_001992.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001993", "originalText": "अर्जुन उवाच—\nस्थाने हृषीकेश तव प्रकीर्त्या\nजगत्प्रहृष्यत्यनुरज्यते च। रक्षांसि भीतानि दिशो द्रवन्ति\nसर्वे नमस्यन्ति च सिद्धसङ्घाः॥ ३६॥", "padacchedaText": "", "audioFile": "PB_001993.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001994", "originalText": "स्थाने युक्तम्।", "padacchedaText": "", "audioFile": "PB_001994.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001995", "originalText": "किं तत्? तव प्रकीर्त्या त्वन्माहात्म्यकीर्तनेन श्रुतेन, हे हृषीकेश, यत् जगत् प्रहृष्यति प्रहर्षम् उपैति, तत् स्थाने युक्तम्, इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_001995.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001996", "originalText": "अथवा विषयविशेषणं स्थाने इति।", "padacchedaText": "", "audioFile": "PB_001996.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001997", "originalText": "युक्तः हर्षादिविषयः भगवान्, यतः ईश्वरः सर्वात्मा सर्वभूतसुहृच्च इति।", "padacchedaText": "", "audioFile": "PB_001997.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001998", "originalText": "तथा अनुरज्यते अनुरागं च उपैति, तच्च विषये इति व्याख्येयम्।", "padacchedaText": "", "audioFile": "PB_001998.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_001999", "originalText": "किञ्च, रक्षांसि भीतानि भयाविष्टानि दिशः द्रवन्ति गच्छन्ति, तच्च स्थाने विषये। सर्वे नमस्यन्ति नमस्कुर्वन्ति च सिद्धसङ्घाः सिद्धानां समुदायाः कपिलादीनाम्, तच्च स्थाने॥ ३६॥", "padacchedaText": "", "audioFile": "PB_001999.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002000", "originalText": "भगवतो हर्षादिविषयत्वे हेतुं दर्शयति—\nकस्माच्च ते न नमेरन्महात्मन्गरीयसे ब्रह्मणोऽप्यादिकर्त्रे। अनन्त देवेश जगन्निवास त्वमक्षरं सदसत्तत्परं यत्॥ ३७॥", "padacchedaText": "", "audioFile": "PB_002000.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002001", "originalText": "कस्माच्च हेतोः ते तुभ्यं न नमेरन् नमस्कुर्युः हे महात्मन्, गरीयसे गुरुतराय, यतः ब्रह्मणः हिरण्यगर्भस्य अपि आदिकर्ता कारणम् अतः तस्मात् आदिकर्त्रे।", "padacchedaText": "", "audioFile": "PB_002001.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002002", "originalText": "कथम् एते न नमस्कुर्युः? अतः हर्षादीनां नमस्कारस्य च स्थानं त्वं अर्हः विषयः इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_002002.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002003", "originalText": "हे अनन्त देवेश हे जगन्निवास त्वम् अक्षरं तत् परम्, यत् वेदान्तेषु श्रूयते।", "padacchedaText": "", "audioFile": "PB_002003.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002004", "originalText": "किं तत्? सदसत् इति।", "padacchedaText": "", "audioFile": "PB_002004.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002005", "originalText": "सत् विद्यमानम्, असत् च यत्र नास्ति इति बुद्धिः, ते उपधानभूते सदसती यस्य अक्षरस्य, यद्द्वारेण सदसती इति उपचर्यते।", "padacchedaText": "", "audioFile": "PB_002005.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002006", "originalText": "परमार्थतस्तु सदसतोः परं तत् अक्षरं यत् अक्षरं वेदविदः वदन्ति। तत् त्वमेव, न अन्यत् इति अभिप्रायः॥ ३७॥", "padacchedaText": "", "audioFile": "PB_002006.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002007", "originalText": "पुनरपि स्तौति—\nत्वमादिदेवः पुरुषः पुराणस्त्वमस्य विश्वस्य परं निधानम्। वेत्तासि वेद्यं च परं च धाम त्वया ततं विश्वमनन्तरूप॥ ३८॥", "padacchedaText": "", "audioFile": "PB_002007.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002008", "originalText": "त्वम् आदिदेवः, जगतः स्रष्टृत्वात्।", "padacchedaText": "", "audioFile": "PB_002008.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002009", "originalText": "पुरुषः, पुरि शयनात् पुराणः चिरन्तनः त्वम् एव अस्य विश्वस्य परं प्रकृष्टं निधानं निधीयते अस्मिन् जगत् सर्वं महाप्रलयादौ इति।", "padacchedaText": "", "audioFile": "PB_002009.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002010", "originalText": "किञ्च, वेत्ता असि, वेदिता असि सर्वस्यैव वेद्यजातस्य।", "padacchedaText": "", "audioFile": "PB_002010.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002011", "originalText": "यत् च वेद्यं वेदनार्हं तच्च असि परं च धाम परमं पदं वैष्णवम्। त्वया ततं व्याप्तं विश्वं समस्तम्, हे अनन्तरूप अन्तो न विद्यते तव रूपाणाम्॥ ३८॥", "padacchedaText": "", "audioFile": "PB_002011.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002012", "originalText": "किञ्च—\nवायुर्यमोऽग्निर्वरुणः शशाङ्कः\nप्रजापतिस्त्वं प्रपितामहश्च। नमो नमस्तेऽस्तु सहस्रकृत्वः\nपुनश्च भूयोऽपि नमो नमस्ते॥ ३९॥", "padacchedaText": "", "audioFile": "PB_002012.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002013", "originalText": "वायुः त्वं यमश्च अग्निः वरुणः अपां पतिः शशाङ्कः चन्द्रमाः प्रजापतिः त्वं कश्यपादिः प्रपितामहश्च पितामहस्यापि पिता प्रपितामहः, ब्रह्मणोऽपि पिता इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_002013.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002014", "originalText": "नमो नमः ते तुभ्यम् अस्तु सहस्रकृत्वः।", "padacchedaText": "", "audioFile": "PB_002014.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002015", "originalText": "पुनश्च भूयोऽपि नमो नमः ते।", "padacchedaText": "", "audioFile": "PB_002015.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002016", "originalText": "बहुशो नमस्कारक्रियाभ्यासावृत्तिगणनं कृत्वसुचा उच्यते। ‘पुनश्च’ ‘भूयोऽपि’ इति श्रद्धाभक्त्यतिशयात् अपरितोषम् आत्मनः दर्शयति॥ ३९॥", "padacchedaText": "", "audioFile": "PB_002016.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002017", "originalText": "तथा—\nनमः पुरस्तादथ पृष्ठतस्ते\nनमोऽस्तु ते सर्वत एव सर्व। अनन्तवीर्यामितविक्रमस्त्वं\nसर्वं समाप्नोषि ततोऽसि सर्वः॥ ४०॥", "padacchedaText": "", "audioFile": "PB_002017.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002018", "originalText": "नमः पुरस्तात् पूर्वस्यां दिशि तुभ्यम्, अथ पृष्ठतः ते पृष्ठतः अपि च ते नमोऽस्तु, ते सर्वत एव सर्वासु दिक्षु सर्वत्र स्थिताय हे सर्व।", "padacchedaText": "", "audioFile": "PB_002018.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002019", "originalText": "अनन्तवीर्यामितविक्रमः अनन्तं वीर्यम् अस्य, अमितः विक्रमः अस्य।", "padacchedaText": "", "audioFile": "PB_002019.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002020", "originalText": "वीर्यं सामर्थ्यं विक्रमः पराक्रमः।", "padacchedaText": "", "audioFile": "PB_002020.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002021", "originalText": "वीर्यवानपि कश्चित् शत्रुवधादिविषये न पराक्रमते, मन्दपराक्रमो वा।", "padacchedaText": "", "audioFile": "PB_002021.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002022", "originalText": "त्वं तु अनन्तवीर्यः अमितविक्रमश्च इति अनन्तवीर्यामितविक्रमः। सर्वं समस्तं जगत् समाप्तोषि सम्यक् एकेन आत्मना व्याप्नोषि यतः, ततः तस्मात् असि भवसि सर्वः त्वम्, त्वया विनाभूतं न किञ्चित् अस्ति इति अभिप्रायः॥ ४०॥", "padacchedaText": "", "audioFile": "PB_002022.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002023", "originalText": "यतः अहं त्वन्माहात्म्यापरिज्ञानात् अपराद्धः, अतः—\nसखेति मत्वा प्रसभं यदुक्तं\nहे कृष्ण हे यादव हे सखेति। अजानता महिमानं तवेदं\nमया प्रमादात्प्रणयेन वापि॥ ४१॥", "padacchedaText": "", "audioFile": "PB_002023.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002024", "originalText": "सखा समानवयाः इति मत्वा ज्ञात्वा विपरीतबुद्ध्या प्रसभम् अभिभूय प्रसह्य यत् उक्तं हे कृष्ण हे यादव हे सखेति च अजानता अज्ञानिना मूढेन, किम् अजानता इति आह— महिमानं महात्म्यं तव इदम् ईश्वरस्य विश्वरूपम्।", "padacchedaText": "", "audioFile": "PB_002024.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002025", "originalText": "‘तव इदं महिमानम् अजानता’ इति वैयधिकरण्येन सम्बन्धः।", "padacchedaText": "", "audioFile": "PB_002025.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002026", "originalText": "‘तवेमम्’ इति पाठः यदि अस्ति, तदा सामानाधिकरण्यमेव। मया प्रमादात् विक्षिप्तचित्ततया, प्रणयेन वापि, प्रणयो नाम स्नेहनिमित्तः विस्रम्भः तेनापि कारणेन यत् उक्तवान् अस्मि॥ ४१॥", "padacchedaText": "", "audioFile": "PB_002026.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002027", "originalText": "यच्चावहासार्थमसत्कृतोऽसि\nविहारशय्यासनभोजनेषु। एकोऽथवाप्यच्युत तत्समक्षं\nतत्क्षामये त्वामहमप्रमेयम्॥ ४२॥", "padacchedaText": "", "audioFile": "PB_002027.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002028", "originalText": "यच्च अवहासार्थं परिहासप्रयोजनाय असत्कृतः परिभूतः असि भवसि, क्व? विहारशय्यासनभोजनेषु, विहरणं विहारः पादव्यायामः, शयनं शय्या, आसनम् आस्थायिका, भोजनम् अदनम्, इति एतेषु विहारशय्यासनभोजनेषु, एकः परोक्षः सन् असत्कृतः असि परिभूतः असि, अथवापि हे अच्युत, तत् समक्षम्, तच्छब्दः क्रियाविशेषणार्थः, प्रत्यक्षं वा असत्कृतः असि तत् सर्वम् अपराधजातं क्षामये क्षमां कारये त्वाम् अहम् अप्रमेयं प्रमाणातीतम्॥ ४२॥", "padacchedaText": "", "audioFile": "PB_002028.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002029", "originalText": "यतः त्वम्—\nपितासि लोकस्य चराचरस्य\nत्वमस्य पूज्यश्च गुरुर्गरीयान्। न त्वत्समोऽस्त्यभ्यधिकः कुतोऽन्यो\nलोकत्रयेऽप्यप्रतिमप्रभाव॥ ४३॥", "padacchedaText": "", "audioFile": "PB_002029.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002030", "originalText": "पिता असि जनयिता असि लोकस्य प्राणिजातस्य चराचरस्य स्थावरजङ्गमस्य।", "padacchedaText": "", "audioFile": "PB_002030.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002031", "originalText": "न केवलं त्वम् अस्य जगतः पिता, पूज्यश्च पूजार्हः, यतः गुरुः गरीयान् गुरुतरः।", "padacchedaText": "", "audioFile": "PB_002031.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002032", "originalText": "कस्मात् गुरुतरः त्वम् इति आह— न त्वत्समः त्वत्तुल्यः अस्ति।", "padacchedaText": "", "audioFile": "PB_002032.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002033", "originalText": "न हि ईश्वरद्वयं सम्भवति, अनेकेश्वरत्वे व्यवहारानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_002033.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002034", "originalText": "त्वत्सम एव तावत् अन्यः न सम्भवति, कुतः एव अन्यः अभ्यधिकः स्यात् लोकत्रयेऽपि सर्वस्मिन्? अप्रतिमप्रभाव प्रतिमीयते यया सा प्रतिमा, न विद्यते प्रतिमा यस्य तव प्रभावस्य सः त्वम् अप्रतिमप्रभावः, हे अप्रतिमप्रभाव निरतिशयप्रभाव इत्यर्थः॥ ४३॥", "padacchedaText": "", "audioFile": "PB_002034.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002035", "originalText": "यतः एवम्—\nतस्मात्प्रणम्य प्रणिधाय कायं\nप्रसादये त्वामहमीशमीड्यम्। पितेव पुत्रस्य सखेव सख्युः\nप्रियः प्रियायार्हसि देव सोढुम्॥ ४४॥", "padacchedaText": "", "audioFile": "PB_002035.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002036", "originalText": "तस्मात् प्रणम्य नमस्कृत्य, प्रणिधाय प्रकर्षेण नीचैः धृत्वा कायं शरीरम्, प्रसादये प्रसादं कारये त्वाम् अहम् ईशम् ईशितारम्, ईड्यं स्तुत्यम्।", "padacchedaText": "", "audioFile": "PB_002036.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002037", "originalText": "त्वं पुनः पुत्रस्य अपराधं पिता यथा क्षमते, सर्वं सखा इव सख्युः अपराधम्, यथा वा प्रियः प्रियायाः अपराधं क्षमते, एवम् अर्हसि हे देव सोढुं प्रसहितुम् क्षन्तुम् इत्यर्थः॥ ४४॥", "padacchedaText": "", "audioFile": "PB_002037.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002038", "originalText": "अदृष्टपूर्वं हृषितोऽस्मि दृष्ट्वा\nभयेन च प्रव्यथितं मनो मे। तदेव मे दर्शय देव रूपं\nप्रसीद देवेश जगन्निवास॥ ४५॥", "padacchedaText": "", "audioFile": "PB_002038.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002039", "originalText": "अदृष्टपूर्वं न कदाचिदपि दृष्टपूर्वम् इदं विश्वरूपं तव मया अन्यैर्वा, तत् अहं दृष्ट्वा हृषितः अस्मि।", "padacchedaText": "", "audioFile": "PB_002039.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002040", "originalText": "भयेन च प्रव्यथितं मनः मे।", "padacchedaText": "", "audioFile": "PB_002040.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002041", "originalText": "अतः तदेव मे मम दर्शय हे देव रूपं यत् मत्सखम्। प्रसीद देवेश, जगन्निवास जगतो निवासो जगन्निवासः, हे जगन्निवास॥ ४५॥", "padacchedaText": "", "audioFile": "PB_002041.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002042", "originalText": "किरीटिनं गदिनं चक्रहस्तमिच्छामि त्वां द्रष्टुमहं तथैव। तेनैव रूपेण चतुर्भुजेन सहस्रबाहो भव विश्वमूर्ते॥ ४६॥", "padacchedaText": "", "audioFile": "PB_002042.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002043", "originalText": "किरीटिनं किरीटवन्तं तथा गदिनं गदावन्तं चक्रहस्तम् इच्छामि त्वां प्रार्थये त्वां द्रष्टुम् अहं तथैव, पूर्ववत् इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_002043.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002044", "originalText": "यतः एवम्, तस्मात् तेनैव रूपेण वसुदेवपुत्ररूपेण चतुर्भुजेन, सहस्रबाहो वार्तमानिकेन विश्वरूपेण, भव विश्वमूर्ते, उपसंहृत्य विश्वरूपम्, तेनैव रूपेण भव इत्यर्थः॥ ४६॥", "padacchedaText": "", "audioFile": "PB_002044.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002045", "originalText": "अर्जुनं भीतम् उपलभ्य, उपसंहृत्य विश्वरूपम्, प्रियवचनेन आश्वासयन् श्रीभगवान् उवाच—\nश्रीभगवानुवाच—\nमया प्रसन्नेन तवार्जुनेदं\nरूपं परं दर्शितमात्मयोगात्।", "padacchedaText": "", "audioFile": "PB_002045.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002046", "originalText": "तेजोमयं विश्वमनन्तमाद्यं\nयन्मे त्वदन्येन न दृष्टपूर्वम्॥ ४७॥", "padacchedaText": "", "audioFile": "PB_002046.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002047", "originalText": "मया प्रसन्नेन, प्रसादो नाम त्वयि अनुग्रहबुद्धिः, तद्वता प्रसन्नेन मया तव हे अर्जुन, इदं परं रूपं विश्वरूपं दर्शितम् आत्मयोगात् आत्मनः ऐश्वर्यस्य सामर्थ्यात्।", "padacchedaText": "", "audioFile": "PB_002047.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002048", "originalText": "तेजोमयं तेजःप्रायं विश्वं समस्तम् अनन्तम् अन्तरहितं आदौ भवम् आद्यं यत् रूपं मे मम त्वदन्येन त्वत्तः अन्येन केनचित् न दृष्टपूर्वम्॥ ४७॥", "padacchedaText": "", "audioFile": "PB_002048.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002049", "originalText": "आत्मनः मम रूपदर्शनेन कृतार्थ एव त्वं संवृत्तः इति तत् स्तौति—\nन वेदयज्ञाध्ययनैर्न दानैर्न च क्रियाभिर्न तपोभिरुग्रैः। एवंरूपः शक्य अहं नृलोके द्रष्टुं त्वदन्येन कुरुप्रवीर॥ ४८॥", "padacchedaText": "", "audioFile": "PB_002049.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002050", "originalText": "न वेदयज्ञाध्ययनैः चतुर्णामपि वेदानाम् अध्ययनैः यथावत् यज्ञाध्ययनैश्च— वेदाध्ययनैरेव यज्ञाध्ययनस्य सिद्धत्वात् पृथक् यज्ञाध्ययनग्रहणं यज्ञविज्ञानोपलक्षणार्थम्— तथा न दानैः तुलापुरुषादिभिः, न च क्रियाभिः अग्निहोत्रादिभिः श्रौतादिभिः, न अपि तपोभिः उग्रैः चान्द्रायणादिभिः उग्रैः घोरैः, एवंरूपः यथादर्शितं विश्वरूपं यस्य सोऽहम् एवंरूपः न शक्यः अहं नृलोके मनुष्यलोके द्रष्टुं त्वदन्येन त्वत्तः अन्येन कुरुप्रवीर॥ ४८॥", "padacchedaText": "", "audioFile": "PB_002050.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002051", "originalText": "मा ते व्यथा मा च विमूढभावो\nदृष्ट्वा रूपं घोरमीदृङ्ममेदम्। व्यपेतभीः प्रीतमनाः पुनस्त्वं\nतदेव मे रूपमिदं प्रपश्य॥ ४९॥", "padacchedaText": "", "audioFile": "PB_002051.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002052", "originalText": "मा ते व्यथा मा भूत् ते भयम्, मा च विमूढभावः विमूढचित्तता, दृष्ट्वा उपलभ्य रूपं घोरम् ईदृक् यथादर्शितं मम इदम्। व्यपेतभीः विगतभयः, प्रीतमनाश्च सन् पुनः भूयः त्वं तदेव चतुर्भुजं रूपं शङ्खचक्रगदाधरं तव इष्टं रूपम् इदं प्रपश्य॥ ४९॥", "padacchedaText": "", "audioFile": "PB_002052.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002053", "originalText": "सञ्जय उवाच—\nइत्यर्जुनं वासुदेवस्तथोक्त्वा\nस्वकं रूपं दर्शयामास भूयः। आश्वासयामास च भीतमेनं\nभूत्वा पुनःसौम्यवपुर्महात्मा॥ ५०॥", "padacchedaText": "", "audioFile": "PB_002053.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002054", "originalText": "इति एवम् अर्जुनं वासुदेवः तथाभूतं वचनम् उक्त्वा, स्वकं वसुदेवस्य गृहे जातं रूपं दर्शयामास दर्शितवान् भूयः पुनः। आश्वासयामास च आश्वासितवान् भीतम् एनम्, भूत्वा पुनः सौम्यवपुः प्रसन्नदेहः महात्मा॥ ५०॥", "padacchedaText": "", "audioFile": "PB_002054.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002055", "originalText": "अर्जुन उवाच—\nदृष्ट्वेदं मानुषं रूपं\nतव सौम्यं जनार्दन। इदानीमस्मि संवृत्तः\nसचेताः प्रकृतिं गतः॥ ५१॥", "padacchedaText": "", "audioFile": "PB_002055.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002056", "originalText": "दृष्ट्वा इदं मानुषं रूपं मत्सखं प्रसन्नं तव सौम्यं जनार्दन, इदानीम् अधुना अस्मि संवृत्तः सञ्जातः। किम्? सचेताः प्रसन्नचित्तः प्रकृतिं स्वभावं गतश्च अस्मि॥ ५१॥", "padacchedaText": "", "audioFile": "PB_002056.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002057", "originalText": "श्रीभगवानुवाच—\nसुदुर्दर्शमिदं रूपं\nदृष्टवानसि यन्मम। देवा अप्यस्य रूपस्य\nनित्यं दर्शनकाङ्क्षिणः॥ ५२॥", "padacchedaText": "", "audioFile": "PB_002057.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002058", "originalText": "सुदुर्दर्शं सुष्ठु दुःखेन दर्शनम् अस्य इति सुदुर्दर्शम्, इदं रूपं दृष्टवान् असि यत् मम, देवादयः अपि अस्य मम रूपस्य नित्यं सर्वदा दर्शनकाङ्क्षिणः, दर्शनेप्सवोऽपि न त्वमिव दृष्टवन्तः, न द्रक्ष्यन्ति च इति अभिप्रायः॥ ५२॥", "padacchedaText": "", "audioFile": "PB_002058.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002059", "originalText": "कस्मात्?—\nनाहं वेदैर्न तपसा\nन दानेन न चेज्यया। शक्य एवंविधो द्रष्टुं\nदृष्टवानसि मां यथा॥ ५३॥", "padacchedaText": "", "audioFile": "PB_002059.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002060", "originalText": "न अहं वेदैः ऋग्यजुःसामाथर्ववेदैः चतुर्भिरपि, न तपसा उग्रेण चान्द्रायणादिना, न दानेन गोभूहिरण्यादिना, न च इज्यया यज्ञेन पूजया वा शक्यः एवंविधः यथादर्शितप्रकारः द्रष्टुं दृष्टावान् असि मां यथा त्वम्॥ ५३॥", "padacchedaText": "", "audioFile": "PB_002060.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002061", "originalText": "कथं पुनः शक्यः इति उच्यते—\nभक्त्या त्वनन्यया शक्य\nअहमेवंविधोऽर्जुन। ज्ञातुं द्रष्टुं च तत्त्वेन\nप्रवेष्टुं च परन्तप॥ ५४॥", "padacchedaText": "", "audioFile": "PB_002061.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002062", "originalText": "भक्त्या तु किंविशिष्टया इति आह— अनन्यया अपृथग्भूतया, भगवतः अन्यत्र पृथक् न कदाचिदपि या भवति सा त्वनन्या भक्तिः।", "padacchedaText": "", "audioFile": "PB_002062.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002063", "originalText": "सर्वैरपि करणैः वासुदेवादन्यत् न उपलभ्यते यया, सा अनन्या भक्तिः, तया भक्त्या शक्यः अहम् एवंविधः विश्वरूपप्रकारः हे अर्जुन, ज्ञातुं शास्त्रतः। न केवलं ज्ञातुं शास्त्रतः, द्रष्टुं च साक्षात्कर्तुं तत्त्वेन तत्त्वतः, प्रवेष्टुं च मोक्षं च गन्तुं परन्तप॥ ५४॥", "padacchedaText": "", "audioFile": "PB_002063.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002064", "originalText": "अधुना सर्वस्य गीताशास्त्रस्य सारभूतः अर्थः निःश्रेयसार्थः अनुष्ठेयत्वेन समुच्चित्य उच्यते—\nमत्कर्मकृन्मत्परमो\nमद्भक्तः सङ्गवर्जितः। निर्वैरः सर्वभूतेषु\nयः स मामेति पाण्डव॥ ५५॥", "padacchedaText": "", "audioFile": "PB_002064.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002065", "originalText": "मत्कर्मकृत् मदर्थं कर्म मत्कर्म, तत् करोतीति मत्कर्मकृत्।", "padacchedaText": "", "audioFile": "PB_002065.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002066", "originalText": "मत्परमः— करोति भृत्यः स्वामिकर्म, न तु आत्मनः परमा प्रेत्य गन्तव्या गतिरिति स्वामिनं प्रतिपद्यते, अयं तु मत्कर्मकृत् मामेव परमां गतिं प्रतिपद्यते इति मत्परमः, अहं परमः परा गतिः यस्य सोऽयं मत्परमः।", "padacchedaText": "", "audioFile": "PB_002066.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002067", "originalText": "तथा मद्भक्तः मामेव सर्वप्रकारैः सर्वात्मना सर्वोत्साहेन भजते इति मद्भक्तः।", "padacchedaText": "", "audioFile": "PB_002067.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002068", "originalText": "सङ्गवर्जितः धनपुत्रमित्रकलत्रबन्धुवर्गेषु सङ्गवर्जितः सङ्गः प्रीतिः स्नेहः तद्वर्जितः।", "padacchedaText": "", "audioFile": "PB_002068.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002069", "originalText": "निर्वैरः निर्गतवैरः सर्वभूतेषु शत्रुभावरहितः आत्मनः अत्यन्तापकारप्रवृत्तेष्वपि।", "padacchedaText": "", "audioFile": "PB_002069.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002070", "originalText": "यः ईदृशः मद्भक्तः सः माम् एति, अहमेव तस्य परा गतिः, न अन्या गतिः काचित् भवति। अयं तव उपदेशः इष्टः मया उपदिष्टः हे पाण्डव इति॥ ५५॥", "padacchedaText": "", "audioFile": "PB_002070.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002071", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ श्रीमद्भगवद्गीताभाष्ये एकादशोऽध्यायः॥", "padacchedaText": "", "audioFile": "PB_002071.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002072", "originalText": "द्वादशोऽध्यायः\nद्वितीयाध्यायप्रभृतिषु विभूत्यन्तेषु अध्यायेषु परमात्मनः ब्रह्मणः अक्षरस्य विध्वस्तसर्वोपाधिविशेषस्य उपासनम् उक्तम्, सर्वयोगैश्वर्यसर्वज्ञानशक्तिमत्सत्त्वोपाधेः ईश्वरस्य तव च उपासनं तत्र तत्र उक्तम्।", "padacchedaText": "", "audioFile": "PB_002072.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002073", "originalText": "विश्वरूपाध्याये तु ऐश्वरम् आद्यं समस्तजगदात्मरूपं विश्वरूपं त्वदीयं दर्शितम् उपासनार्थमेव त्वया।", "padacchedaText": "", "audioFile": "PB_002073.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002074", "originalText": "तच्च दर्शयित्वा उक्तवानसि ‘मत्कर्मकृत्’ (भ.गी.११.५५) इत्यादि।", "padacchedaText": "", "audioFile": "PB_002074.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002075", "originalText": "अतः अहम् अनयोः उभयोः पक्षयोः विशिष्टतरबुभुत्सया त्वां पृच्छामि इति अर्जुन उवाच—\nअर्जुन उवाच—\nएवं सततयुक्ता ये भक्तास्त्वां पर्युपासते। ये चाप्यक्षरमव्यक्तं तेषां के योगवित्तमाः॥ १॥", "padacchedaText": "", "audioFile": "PB_002075.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002076", "originalText": "एवम् इति अतीतानन्तरश्लोकेन उक्तम् अर्थं परामृशति ‘मत्कर्मकृत्’ (भ.गी.११.५५) इत्यादिना।", "padacchedaText": "", "audioFile": "PB_002076.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002077", "originalText": "एवं सततयुक्ताः, नैरन्तर्येण भगवत्कर्मादौ यथोक्ते अर्थे समाहिताः सन्तः प्रवृत्ता इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_002077.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002078", "originalText": "ये भक्ताः अनन्यशरणाः सन्तः त्वां यथादर्शितं विश्वरूपं पर्युपासते ध्यायन्ति, ये चान्येऽपि त्यक्तसर्वैषणाः संन्यस्तसर्वकर्माणः यथाविशेषितं ब्रह्म अक्षरं निरस्तसर्वोपाधित्वात् अव्यक्तम् अकरणगोचरम्।", "padacchedaText": "", "audioFile": "PB_002078.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002079", "originalText": "यत् हि करणगोचरं तत् व्यक्तम् उच्यते, अञ्जेः धातोः तत्कर्मकत्वात्, इदं तु अक्षरं तद्विपरीतम्, शिष्टैश्च उच्यमानैः विशेषणैः विशिष्टम्, तत् ये चापि पर्युपासते, तेषाम् उभयेषां मध्ये के योगवित्तमाः? के अतिशयेन योगविदः इत्यर्थः॥ १॥", "padacchedaText": "", "audioFile": "PB_002079.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002080", "originalText": "श्रीभगवान् उवाच— ये तु अक्षरोपासकाः सम्यग्दर्शिनः निवृत्तैषणाः, ते तावत् तिष्ठन्तु, तान् प्रति यत् वक्तव्यम्, तत् उपरिष्टात् वक्ष्यामः।", "padacchedaText": "", "audioFile": "PB_002080.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002081", "originalText": "ये तु इतरे—\nश्रीभगवानुवाच—\nमय्यावेश्य मनो ये मां नित्ययुक्ता उपासते। श्रद्धया परयोपेतास्ते मे युक्ततमा मताः॥ २॥", "padacchedaText": "", "audioFile": "PB_002081.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002082", "originalText": "मयि विश्वरूपे परमेश्वरे आवेश्य समाधाय मनः, ये भक्ताः सन्तः, मां सर्वयोगेश्वराणाम् अधीश्वरं सर्वज्ञं विमुक्तरागादिक्लेशतिमिरदृष्टिम्, नित्ययुक्ताः अतीतानन्तराध्यायान्तोक्तश्लोकार्थन्यायेन सततयुक्ताः सन्तः उपासते श्रद्धया परया प्रकृष्टया उपेताः, ते मे मम मताः अभिप्रेताः युक्ततमाः इति।", "padacchedaText": "", "audioFile": "PB_002082.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002083", "originalText": "नैरन्तर्येण हि ते मच्चित्ततया अहोरात्रम् अतिवाहयन्ति। अतः युक्तं तान् प्रति युक्ततमाः इति वक्तुम्॥ २॥", "padacchedaText": "", "audioFile": "PB_002083.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002084", "originalText": "किमितरे युक्ततमाः न भवन्ति? न, किन्तु तान् प्रति यत् वक्तव्यम्, तत् शृणु—\nये त्वक्षरमनिर्देश्यमव्यक्तं पर्युपासते। सर्वत्रगमचिन्त्यं च कूटस्थमचलं ध्रुवम्॥ ३॥", "padacchedaText": "", "audioFile": "PB_002084.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002085", "originalText": "ये तु अक्षरम् अनिर्देश्यम्, अव्यक्तत्वात् अशब्दगोचर इति न निर्देष्टुं शक्यते, अतः अनिर्देश्यम्, अव्यक्तं न केनापि प्रमाणेन व्यज्यत इत्यव्यक्तं पर्युपासते परि समन्तात् उपासते।", "padacchedaText": "", "audioFile": "PB_002085.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002086", "originalText": "उपासनं नाम यथाशास्त्रम् उपास्यस्य अर्थस्य विषयीकरणेन सामीप्यम् उपगम्य तैलधारावत् समानप्रत्ययप्रवाहेण दीर्घकालं यत् आसनम्, तत् उपासनमाचक्षते।", "padacchedaText": "", "audioFile": "PB_002086.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002087", "originalText": "अक्षरस्य विशेषणमाह उपास्यस्य— सर्वत्रगं व्योमवत् व्यापि अचिन्त्यं च अव्यक्तत्वादचिन्त्यम्।", "padacchedaText": "", "audioFile": "PB_002087.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002088", "originalText": "यद्धि करणगोचरम्, तत् मनसापि चिन्त्यम्, तद्विपरीतत्वात् अचिन्त्यम् अक्षरम्, कूटस्थं दृश्यमानगुणम् अन्तर्दोषं वस्तु कूटम्।", "padacchedaText": "", "audioFile": "PB_002088.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002089", "originalText": "‘कूटरूपम्’ ’ कूटसाक्ष्यम्’ इत्यादौ कूटशब्दः प्रसिद्धः लोके।", "padacchedaText": "", "audioFile": "PB_002089.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002090", "originalText": "तथा च अविद्याद्यनेकसंसारबीजम् अन्तर्दोषवत् मायाव्याकृतादिशब्दवाच्यतया ‘मायां तु प्रकृतिं विद्यान्मायिनं तु महेश्वरम्’ (श्वे.४.१०) ‘मम माया दुरत्यया’ (भ.गी.७.१४) इत्यादौ प्रसिद्धं यत् तत् कूटम्, तस्मिन् कूटे स्थितं कूटस्थं तदध्यक्षतया।", "padacchedaText": "", "audioFile": "PB_002090.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002091", "originalText": "अथवा, राशिरिव स्थितं कूटस्थम्।", "padacchedaText": "", "audioFile": "PB_002091.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002092", "originalText": "अत एव अचलम्। यस्मात् अचलम्, तस्मात् ध्रुवम्, नित्यमित्यर्थः॥ ३॥", "padacchedaText": "", "audioFile": "PB_002092.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002093", "originalText": "संनियम्येन्द्रियग्रामं सर्वत्र समबुद्धयः। ते प्राप्नुवन्ति मामेव सर्वभूतहिते रताः॥ ४॥", "padacchedaText": "", "audioFile": "PB_002093.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002094", "originalText": "सन्नियम्य सम्यक् नियम्य उपसंहृत्य इन्द्रियग्रामम् इन्द्रियसमुदायं सर्वत्र सर्वस्मिन् काले समबुद्धयः समा तुल्या बुद्धिः येषाम् इष्टानिष्टप्राप्तौ ते समबुद्धयः।", "padacchedaText": "", "audioFile": "PB_002094.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002095", "originalText": "ते ये एवंविधाः ते प्राप्नुवन्ति मामेव सर्वभूतहिते रताः।", "padacchedaText": "", "audioFile": "PB_002095.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002096", "originalText": "न तु तेषां वक्तव्यं किञ्चित् ‘मां ते प्राप्नुवन्ति’ इति, ‘ज्ञानी त्वात्मैव मे मतम्’ (भ.गी.७.१८) इति हि उक्तम्। न हि भगवत्स्वरूपाणां सतां युक्ततमत्वमयुक्ततमत्वं वा वाच्यम्॥ ४॥", "padacchedaText": "", "audioFile": "PB_002096.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002097", "originalText": "किं तु—\nक्लेशोऽधिकतरस्तेषामव्यक्तासक्तचेतसाम्। अव्यक्ता हि गतिर्दुःखं देहवद्भिरवाप्यते॥ ५॥", "padacchedaText": "", "audioFile": "PB_002097.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002098", "originalText": "क्लेशः अधिकतरः, यद्यपि मत्कर्मादिपराणां क्लेशः अधिक एव क्लेशः अधिकतरस्तु अक्षरात्मनां परमात्मदर्शिनां देहाभिमानपरित्यागनिमित्तः।", "padacchedaText": "", "audioFile": "PB_002098.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002099", "originalText": "अव्यक्तासक्तचेतसाम् अव्यक्ते आसक्तं चेतः येषां ते अव्यक्तासक्तचेतसः तेषाम् अव्यक्तासक्तचेतसाम्। अव्यक्ता हि यस्मात् या गतिः अक्षरात्मिका दुःखं सा देहवद्भिः देहाभिमानवद्भिः अवाप्यते, अतः क्लेशः अधिकतरः॥ ५॥", "padacchedaText": "", "audioFile": "PB_002099.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002100", "originalText": "अक्षरोपासकानां यत् वर्तनम्, तत् उपरिष्टाद्वक्ष्यामः—\nये तु सर्वाणि कर्माणि मयि संन्यस्य मत्पराः। अनन्येनैव योगेन मां ध्यायन्त उपासते॥ ६॥", "padacchedaText": "", "audioFile": "PB_002100.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002101", "originalText": "ये तु सर्वाणि कर्माणि मयि ईश्वरे संन्यस्य मत्पराः अहं परः येषां ते मत्पराः सन्तः अनन्येनैव अविद्यमानम् अन्यत् आलम्बनं विश्वरूपं देवम् आत्मानं मुक्त्वा यस्य सः अनन्यः तेन अनन्येनैव, केन? योगेन समाधिना मां ध्यायन्तः चिन्तयन्तः उपासते॥ ६॥", "padacchedaText": "", "audioFile": "PB_002101.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002102", "originalText": "तेषां किम्?—\nतेषामहं समुद्धर्ता मृत्युसंसारसागरात्। भवामि न चिरात्पार्थ मय्यावेशितचेतसाम्॥ ७॥", "padacchedaText": "", "audioFile": "PB_002102.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002103", "originalText": "तेषां मदुपासनैकपराणाम् अहम् ईश्वरः समुद्धर्ता।", "padacchedaText": "", "audioFile": "PB_002103.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002104", "originalText": "कुतः इति आह— मृत्युसंसारसागरात् मृत्युयुक्तः संसारः मृत्युसंसारः, स एव सागर इव सागरः, दुस्तरत्वात्, तस्मात् मृत्युसंसारसागरात् अहं तेषां समुद्धर्ता भवामि न चिरात्।", "padacchedaText": "", "audioFile": "PB_002104.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002105", "originalText": "किं तर्हि? क्षिप्रमेव हे पार्थ, मयि आवेशितचेतसां मयि विश्वरूपे आवेशितं समाहितं चेतः येषां ते मय्यावेशितचेतसः तेषाम्॥ ७॥", "padacchedaText": "", "audioFile": "PB_002105.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002106", "originalText": "यतः एवम्, तस्मात्—\nमय्येव मन आधत्स्व मयि बुद्धिं निवेशय। निवसिष्यसि मय्येव अत ऊर्ध्वं न संशयः॥ ८॥", "padacchedaText": "", "audioFile": "PB_002106.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002107", "originalText": "मयि एव विश्वरूपे ईश्वरे मनः सङ्कल्पविकल्पात्मकं आधत्स्व स्थापय।", "padacchedaText": "", "audioFile": "PB_002107.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002108", "originalText": "मयि एव अध्यवसायं कुर्वतीं बुद्धिम् आधत्स्व निवेशय।", "padacchedaText": "", "audioFile": "PB_002108.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002109", "originalText": "ततः ते किं स्यात् इति शृणु— निवसिष्यसि निवत्स्यसि निश्चयेन मदात्मना मयि निवासं करिष्यसि एव अतः शरीरपातात् ऊर्ध्वम्। न संशयः संशयः अत्र न कर्तव्यः॥ ८॥", "padacchedaText": "", "audioFile": "PB_002109.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002110", "originalText": "अथ चित्तं समाधातुं\nन शक्नोषि मयि स्थिरम्। अभ्यासयोगेन ततो\nमामिच्छाप्तुं धनञ्जय॥ ९॥", "padacchedaText": "", "audioFile": "PB_002110.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002111", "originalText": "अथ एवं यथा अवोचं तथा मयि चित्तं समाधातुं स्थापयितुं स्थिरम् अचलं न शक्नोषि चेत्, ततः पश्चात् अभ्यासयोगेन, चित्तस्य एकस्मिन् आलम्बने सर्वतः समाहृत्य पुनः पुनः स्थापनम् अभ्यासः, तत्पूर्वको योगः समाधानलक्षणः तेन अभ्यासयोगेन मां विश्वरूपम् इच्छ प्रार्थयस्व आप्तुं प्राप्तुं हे धनञ्जय॥ ९॥", "padacchedaText": "", "audioFile": "PB_002111.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002112", "originalText": "अभ्यासेऽप्यसमर्थोऽसि\nमत्कर्मपरमो भव। मदर्थमपि कर्माणि\nकुर्वन्सिद्धिमवाप्स्यसि॥ १०॥", "padacchedaText": "", "audioFile": "PB_002112.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002113", "originalText": "अभ्यासे अपि असमर्थः असि अशक्तः असि, तर्हि मत्कर्मपरमः भव मदर्थं कर्म मत्कर्म तत्परमः मत्कर्मपरमः, मत्कर्मप्रधानः इत्यर्थः। अभ्यासेन विना मदर्थमपि कर्माणि केवलं कुर्वन् सिद्धिं सत्त्वशुद्धियोगज्ञानप्राप्तिद्वारेण अवाप्स्यसि॥ १०॥", "padacchedaText": "", "audioFile": "PB_002113.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002114", "originalText": "अथैतदप्यशक्तोऽसि कर्तुं मद्योगमाश्रितः। सर्वकर्मफलत्यागं ततः कुरु यतात्मवान्॥ ११॥", "padacchedaText": "", "audioFile": "PB_002114.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002115", "originalText": "अथ पुनः एतदपि यत् उक्तं मत्कर्मपरमत्वम्, तत् कर्तुम् अशक्तः असि, मद्योगम् आश्रितः मयि क्रियमाणानि कर्माणि संन्यस्य यत् करणं तेषाम् अनुष्ठानं सः मद्योगः, तम् आश्रितः सन्, सर्वकर्मफलत्यागं सर्वेषां कर्मणां फलसंन्यासं सर्वकर्मफलत्यागं ततः अनन्तरं कुरु यतात्मवान् संयतचित्तः सन् इत्यर्थः॥ ११॥", "padacchedaText": "", "audioFile": "PB_002115.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002116", "originalText": "इदानीं सर्वकर्मफलत्यागं स्तौति—\nश्रेयो हि ज्ञानमभ्यासाज्ज्ञानाद्ध्यानं विशिष्यते। ध्यानात्कर्मफलत्यागस्त्यागाच्छान्तिरनन्तरम्॥ १२॥", "padacchedaText": "", "audioFile": "PB_002116.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002117", "originalText": "श्रेयः हि प्रशस्यतरं ज्ञानम्।", "padacchedaText": "", "audioFile": "PB_002117.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002118", "originalText": "कस्मात्? विवेकपूर्वकात् अभ्यासात्।", "padacchedaText": "", "audioFile": "PB_002118.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002119", "originalText": "तस्मादपि ज्ञानात् ज्ञानपूर्वकं ध्यानं विशिष्यते।", "padacchedaText": "", "audioFile": "PB_002119.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002120", "originalText": "ज्ञानवतो ध्यानात् अपि कर्मफलत्यागः, ‘विशिष्यते’ इति अनुषज्यते। एवं कर्मफलत्यागात् पूर्वविशेषणवतः शान्तिः उपशमः सहेतुकस्य संसारस्य अनन्तरमेव स्यात्, न तु कालान्तरम् अपेक्षते॥", "padacchedaText": "", "audioFile": "PB_002120.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002121", "originalText": "अज्ञस्य कर्मणि प्रवृत्तस्य पूर्वोपदिष्टोपायानुष्ठानाशक्तौ सर्वकर्मणां फलत्यागः श्रेयःसाधनम् उपदिष्टम्, न प्रथममेव।", "padacchedaText": "", "audioFile": "PB_002121.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002122", "originalText": "अतश्च ‘श्रेयो हि ज्ञानमभ्यासात्’ इत्युत्तरोत्तरविशिष्टत्वोपदेशेन सर्वकर्मफलत्यागः स्तूयते, सम्पन्नसाधनानुष्ठानाशक्तौ अनुष्ठेयत्वेन श्रुतत्वात्।", "padacchedaText": "", "audioFile": "PB_002122.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002123", "originalText": "केन साधर्म्येण स्तुतित्वम्? ‘यदा सर्वे प्रमुच्यन्ते’ (क.२.३.१४) इति सर्वकामप्रहाणात् अमृतत्वम् उक्तम्, तत् प्रसिद्धम्।", "padacchedaText": "", "audioFile": "PB_002123.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002124", "originalText": "कामाश्च सर्वे श्रौतस्मार्तकर्मणां फलानि।", "padacchedaText": "", "audioFile": "PB_002124.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002125", "originalText": "तत्त्यागे च विदुषः ध्याननिष्ठस्य अनन्तरैव शान्तिः इति सर्वकामत्यागसामान्यम् अज्ञकर्मफलत्यागस्य अस्ति इति तत्सामान्यात् सर्वकर्मफलत्यागस्तुतिः इयं प्ररोचनार्था।", "padacchedaText": "", "audioFile": "PB_002125.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002126", "originalText": "यथा अगस्त्येन ब्राह्मणेन समुद्रः पीतः इति इदानीन्तनाः अपि ब्राह्मणाः ब्राह्मणत्वसामान्यात् स्तूयन्ते, एवं कर्मफलत्यागात् कर्मयोगस्य श्रेयःसाधनत्वमभिहितम्॥ १२॥", "padacchedaText": "", "audioFile": "PB_002126.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002127", "originalText": "अत्र च आत्मेश्वरभेदमाश्रित्य विश्वरूपे ईश्वरे चेतःसमाधानलक्षणः योगः उक्तः, ईश्वरार्थं कर्मानुष्ठानादि च।", "padacchedaText": "", "audioFile": "PB_002127.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002128", "originalText": "‘अथैतदप्यशक्तोऽसि’ (भ.गी.१२.११) इति अज्ञानकार्यसूचनात् न अभेददर्शिनः अक्षरोपासकस्य कर्मयोगः उपपद्यते इति दर्शयति, तथा कर्मयोगिनः अक्षरोपासनानुपपत्तिम्।", "padacchedaText": "", "audioFile": "PB_002128.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002129", "originalText": "‘ते प्राप्नुवन्ति मामेव’ (भ.गी.१२.४) इति अक्षरोपासकानां कैवल्यप्राप्तौ स्वातन्त्र्यम् उक्त्वा, इतरेषां पारतन्त्र्यात् ईश्वराधीनतां दर्शितवान् ‘तेषामहं समुद्धर्ता’ (भ.गी.१२.७) इति।", "padacchedaText": "", "audioFile": "PB_002129.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002130", "originalText": "यदि हि ईश्वरस्य आत्मभूताः ते मताः अभेददर्शित्वात्, अक्षरस्वरूपाः एव ते इति समुद्धरणकर्मवचनं तान् प्रति अपेशलं स्यात्।", "padacchedaText": "", "audioFile": "PB_002130.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002131", "originalText": "यस्माच्च अर्जुनस्य अत्यन्तमेव हितैषी भगवान् तस्य सम्यग्दर्शनानन्वितं कर्मयोगं भेददृष्टिमन्तमेव उपदिशति।", "padacchedaText": "", "audioFile": "PB_002131.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002132", "originalText": "न च आत्मानम् ईश्वरं प्रमाणतः बुद्ध्वा कस्यचित् गुणभावं जिगमिषति कश्चित्, विरोधात्।", "padacchedaText": "", "audioFile": "PB_002132.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002133", "originalText": "तस्मात् अक्षरोपासकानां सम्यग्दर्शननिष्ठानां संन्यासिनां त्यक्तसर्वैषणानाम् ‘अद्वेष्टा सर्वभूतानाम्’ इत्यादिधर्मपूगं साक्षात् अमृतत्वकारणं वक्ष्यामीति प्रवर्तते—\nअद्वेष्टा सर्वभूतानां मैत्रः करुण एव च।", "padacchedaText": "", "audioFile": "PB_002133.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002134", "originalText": "निर्ममो निरहङ्कारः समदुःखसुखः क्षमी॥ १३॥", "padacchedaText": "", "audioFile": "PB_002134.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002135", "originalText": "अद्वेष्टा सर्वभूतानां न द्वेष्टा, आत्मनः दुःखहेतुमपि न किञ्चित् द्वेष्टि, सर्वाणि भूतानि आत्मत्वेन हि पश्यति।", "padacchedaText": "", "audioFile": "PB_002135.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002136", "originalText": "मैत्रः मित्रभावः मैत्री मित्रतया वर्तते इति मैत्रः।", "padacchedaText": "", "audioFile": "PB_002136.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002137", "originalText": "करुणः एव च, करुणा कृपा दुःखितेषु दया, तद्वान् करुणः, सर्वभूताभयप्रदः, संन्यासी इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_002137.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002138", "originalText": "निर्ममः ममप्रत्ययवर्जितः।", "padacchedaText": "", "audioFile": "PB_002138.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002139", "originalText": "निरहङ्कारः निर्गताहंप्रत्ययः।", "padacchedaText": "", "audioFile": "PB_002139.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002140", "originalText": "समदुःखसुखः समे दुःखसुखे द्वेषरागयोः अप्रवर्तके यस्य सः समदुःखसुखः। क्षमी क्षमावान्, आक्रुष्टः अभिहतो वा अविक्रियः एव आस्ते॥ १३॥", "padacchedaText": "", "audioFile": "PB_002140.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002141", "originalText": "सन्तुष्टः सततं योगी यतात्मा दृढनिश्चयः। मय्यर्पितमनोबुद्धिर्यो मद्भक्तः स मे प्रियः॥ १४॥", "padacchedaText": "", "audioFile": "PB_002141.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002142", "originalText": "सन्तुष्टः सततं नित्यं देहस्थितिकारणस्य लाभे अलाभे च उत्पन्नालंप्रत्ययः।", "padacchedaText": "", "audioFile": "PB_002142.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002143", "originalText": "तथा गुणवल्लाभे विपर्यये च सन्तुष्टः।", "padacchedaText": "", "audioFile": "PB_002143.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002144", "originalText": "सततं योगी समाहितचित्तः।", "padacchedaText": "", "audioFile": "PB_002144.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002145", "originalText": "यतात्मा संयतस्वभावः।", "padacchedaText": "", "audioFile": "PB_002145.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002146", "originalText": "दृढनिश्चयः दृढः स्थिरः निश्चयः अध्यवसायः यस्य आत्मतत्त्वविषये स दृढनिश्चयः।", "padacchedaText": "", "audioFile": "PB_002146.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002147", "originalText": "मय्यर्पितमनोबुद्धिः सङ्कल्पविकल्पात्मकं मनः, अध्यवसायलक्षणा बुद्धिः, ते मय्येव अर्पिते स्थापिते यस्य संन्यासिनः सः मय्यर्पितमनोबुद्धिः।", "padacchedaText": "", "audioFile": "PB_002147.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002148", "originalText": "यः ईदृशः मद्भक्तः सः मे प्रियः। ‘प्रियो हि ज्ञानिनोऽत्यर्थमहं स च मम प्रियः’ (भ.गी.७.१७) इति सप्तमे अध्याये सूचितम्, तत् इह प्रपञ्च्यते॥ १४॥", "padacchedaText": "", "audioFile": "PB_002148.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002149", "originalText": "यस्मान्नोद्विजते लोको लोकान्नोद्विजते च यः। हर्षामर्षभयोद्वेगैर्मुक्तो यः स च मे प्रियः॥ १५॥", "padacchedaText": "", "audioFile": "PB_002149.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002150", "originalText": "यस्मात् संन्यासिनः न उद्विजते न उद्वेगं गच्छति न सन्तप्यते न सङ्क्षुभ्यति लोकः, तथा लोकात् न उद्विजते च यः, हर्षामर्षभयोद्वेगैः हर्षश्च अमर्षश्च भयं च उद्वेगश्च तैः हर्षामर्षभयोद्वेगैः मुक्तः, हर्षः प्रियलाभे अन्तःकरणस्य उत्कर्षः रोमाञ्चनाश्रुपातादिलिङ्गः, अमर्षः असहिष्णुता, भयं त्रासः, उद्वेगः उद्विग्नता, तैः मुक्तः यः स च मे प्रियः॥ १५॥", "padacchedaText": "", "audioFile": "PB_002150.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002151", "originalText": "अनपेक्षः शुचिर्दक्ष\nउदासीनो गतव्यथः। सर्वारम्भपरित्यागी\nयो मद्भक्तः स मे प्रियः॥ १६॥", "padacchedaText": "", "audioFile": "PB_002151.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002152", "originalText": "देहेन्द्रियविषयसम्बन्धादिषु अपेक्षाविषयेषु अनपेक्षः निःस्पृहः।", "padacchedaText": "", "audioFile": "PB_002152.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002153", "originalText": "शुचिः बाह्येन आभ्यन्तरेण च शौचेन सम्पन्नः।", "padacchedaText": "", "audioFile": "PB_002153.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002154", "originalText": "दक्षः प्रत्युत्पन्नेषु कार्येषु सद्यः यथावत् प्रतिपत्तुं समर्थः।", "padacchedaText": "", "audioFile": "PB_002154.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002155", "originalText": "उदासीनः न कस्यचित् मित्रादेः पक्षं भजते यः, सः उदासीनः यतिः।", "padacchedaText": "", "audioFile": "PB_002155.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002156", "originalText": "गतव्यथः गतभयः।", "padacchedaText": "", "audioFile": "PB_002156.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002157", "originalText": "सर्वारम्भपरित्यागी आरभ्यन्त इति आरम्भाः इहामुत्रफलभोगार्थानि कामहेतूनि कर्माणि सर्वारम्भाः, तान् परित्यक्तुं शीलम् अस्येति सर्वारम्भपरित्यागी यः मद्भक्तः सः मे प्रियः॥ १६॥", "padacchedaText": "", "audioFile": "PB_002157.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002158", "originalText": "किञ्च—\nयो न हृष्यति न द्वेष्टि\nन शोचति न काङ्क्षति। शुभाशुभपरित्यागी\nभक्तिमान्यः स मे प्रियः॥ १७॥", "padacchedaText": "", "audioFile": "PB_002158.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002159", "originalText": "यः न हृष्यति इष्टप्राप्तौ, न द्वेष्टि अनिष्टप्राप्तौ, न शोचति प्रियवियोगे, न च अप्राप्तं काङ्क्षति, शुभाशुभे कर्मणी परित्यक्तुं शीलम् अस्य इति शुभाशुभपरित्यागी भक्तिमान् यः सः मे प्रियः॥ १७॥", "padacchedaText": "", "audioFile": "PB_002159.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002160", "originalText": "समः शत्रौ च मित्रे च\nतथा मानापमानयोः। शीतोष्णसुखदुःखेषु\nसमः सङ्गविवर्जितः॥ १८॥", "padacchedaText": "", "audioFile": "PB_002160.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002161", "originalText": "समः शत्रौ च मित्रे च, तथा मानापमानयोः पूजापरिभवयोः, शीतोष्णसुखदुःखेषु समः, सर्वत्र च सङ्गविवर्जितः॥ १८॥", "padacchedaText": "", "audioFile": "PB_002161.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002162", "originalText": "किञ्च—\nतुल्यनिन्दास्तुतिर्मौनी सन्तुष्टो येन केनचित्। अनिकेतः स्थिरमतिर्भक्तिमान्मे प्रियो नरः॥ १९॥", "padacchedaText": "", "audioFile": "PB_002162.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002163", "originalText": "तुल्यनिन्दास्तुतिः निन्दा च स्तुतिश्च निन्दास्तुती ते तुल्ये यस्य सः तुल्यनिन्दास्तुतिः।", "padacchedaText": "", "audioFile": "PB_002163.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002164", "originalText": "मौनी मौनवान् संयतवाक्।", "padacchedaText": "", "audioFile": "PB_002164.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002165", "originalText": "सन्तुष्टः येन केनचित् शरीरस्थितिहेतुमात्रेण, तथा च उक्तम्— ‘येन केनचिदाच्छन्नो येन केनचिदाशितः।", "padacchedaText": "", "audioFile": "PB_002165.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002166", "originalText": "यत्र क्वचन शायी स्यात्तं देवा ब्राह्मणं विदुः’ (मो.ध.२४५.१२) इति।", "padacchedaText": "", "audioFile": "PB_002166.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002167", "originalText": "किञ्च, अनिकेतः निकेतः आश्रयः निवासः नियतः न विद्यते यस्य सः अनिकेतः, ‘नागारे’ (?) इत्यादिस्मृत्यन्तरात्।", "padacchedaText": "", "audioFile": "PB_002167.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002168", "originalText": "स्थिरमतिः स्थिरा परमार्थविषया यस्य मतिः सः स्थिरमतिः। भक्तिमान् मे प्रियः नरः॥ १९॥", "padacchedaText": "", "audioFile": "PB_002168.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002169", "originalText": "‘अद्वेष्टा सर्वभूतानाम्’ (भ.गी.१२.१३), इत्यादिना अक्षरोपासकानां निवृत्तसर्वैषणानां सन्यासिनां परमार्थज्ञाननिष्ठानां धर्मजातं प्रक्रान्तम् उपसंह्रियते—\nये तु धर्म्यामृतमिदं\nयथोक्तं पर्युपासते।", "padacchedaText": "", "audioFile": "PB_002169.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002170", "originalText": "श्रद्दधाना मत्परमा\nभक्तास्तेऽतीव मे प्रियाः॥ २०॥", "padacchedaText": "", "audioFile": "PB_002170.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002171", "originalText": "ये तु संन्यासिनः धर्म्यामृतं धर्मादनपेतं धर्म्यं च तत् अमृतं च तत्, अमृतत्वहेतुत्वात्, इदं यथोक्तम् ‘अद्वेष्टा सर्वभूतानाम्’ (भ.गी.१२.१३) इत्यादिना पर्युपासते अनुतिष्ठन्ति श्रद्दधानाः सन्तः मत्परमाः यथोक्तः अहं अक्षरात्मा परमः निरतिशया गतिः येषां ते मत्परमाः, मद्भक्ताः च उत्तमां परमार्थज्ञानलक्षणां भक्तिमाश्रिताः, ते अतीव मे प्रियाः।", "padacchedaText": "", "audioFile": "PB_002171.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002172", "originalText": "‘प्रियो हि ज्ञानिनोऽत्यर्थम्’ (भ.गी.७.१७) इति यत् सूचितं तत् व्याख्याय इह उपसंहृतम् ‘भक्तास्तेऽतीव मे प्रियाः’ इति।", "padacchedaText": "", "audioFile": "PB_002172.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002173", "originalText": "यस्मात् धर्म्यामृतमिदं यथोक्तमनुतिष्ठन् भगवतः विष्णोः परमेश्वरस्य अतीव प्रियः भवति, तस्मात् इदं धर्म्यामृतं मुमुक्षुणा यत्नतः अनुष्ठेयं विष्णोः प्रियं परं धाम जिगमिषुणा इति वाक्यार्थः॥ २०॥", "padacchedaText": "", "audioFile": "PB_002173.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002174", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ श्रीमद्भगवद्गीताभाष्ये द्वादशोऽध्यायः॥", "padacchedaText": "", "audioFile": "PB_002174.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002175", "originalText": "त्रयोदशोऽध्यायः\nसप्तमे अध्याये सूचिते द्वे प्रकृती ईश्वरस्य— त्रिगुणात्मिका अष्टधा भिन्ना अपरा, संसारहेतुत्वात्, परा च अन्या जीवभूता क्षेत्रज्ञलक्षणा ईश्वरात्मिका— याभ्यां प्रकृतिभ्यामीश्वरः जगदुत्पत्तिस्थितिलयहेतुत्वं प्रतिपद्यते।", "padacchedaText": "", "audioFile": "PB_002175.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002176", "originalText": "तत्र क्षेत्रक्षेत्रज्ञलक्षणप्रकृतिद्वयनिरूपणद्वारेण तद्वतः ईश्वरस्य तत्त्वनिर्धारणार्थं क्षेत्राध्यायः आरभ्यते।", "padacchedaText": "", "audioFile": "PB_002176.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002177", "originalText": "अतीतानन्तराध्याये च ‘अद्वेष्टा सर्वभूतानाम्’ (भ.गी.१२.१३) इत्यादिना यावत् अध्यायपरिसमाप्तिः तावत् तत्त्वज्ञानिनां संन्यासिनां निष्ठा यथा ते वर्तन्ते इत्येतत् उक्तम्।", "padacchedaText": "", "audioFile": "PB_002177.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002178", "originalText": "केन पुनः ते तत्त्वज्ञानेन युक्ताः यथोक्तधर्माचरणात् भगवतः प्रिया भवन्तीति एवमर्थश्च अयमध्यायः आरभ्यते।", "padacchedaText": "", "audioFile": "PB_002178.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002179", "originalText": "प्रकृतिश्च त्रिगुणात्मिका सर्वकार्यकरणविषयाकारेण परिणता पुरुषस्य भोगापवर्गार्थकर्तव्यतया देहेन्द्रियाद्याकारेण संहन्यते।", "padacchedaText": "", "audioFile": "PB_002179.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002180", "originalText": "सोऽयं सङ्घातः इदं शरीरम्।", "padacchedaText": "", "audioFile": "PB_002180.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002181", "originalText": "तदेतत् भगवान् उवाच—\nश्रीभगवानुवाच—\nइदं शरीरं कौन्तेय क्षेत्रमित्यभिधीयते। एतद्यो वेत्ति तं प्राहुः क्षेत्रज्ञ इति तद्विदः॥ १॥", "padacchedaText": "", "audioFile": "PB_002181.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002182", "originalText": "इदम् इति सर्वनाम्ना उक्तं विशिनष्टि शरीरम् इति।", "padacchedaText": "", "audioFile": "PB_002182.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002183", "originalText": "हे कौन्तेय, क्षतत्राणात्, क्षयात्, क्षरणात्, क्षेत्रवद्वा अस्मिन् कर्मफलनिष्पत्तेः क्षेत्रम् इति— इतिशब्दः एवंशब्दपदार्थकः— क्षेत्रम् इत्येवम् अभिधीयते कथ्यते।", "padacchedaText": "", "audioFile": "PB_002183.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002184", "originalText": "एतत् शरीरं क्षेत्रं यः वेत्ति विजानाति, आपादतलमस्तकं ज्ञानेन विषयीकरोति, स्वाभाविकेन औपदेशिकेन वा वेदनेन विषयीकरोति विभागशः, तं वेदितारं प्राहुः कथयन्ति क्षेत्रज्ञः इति— इतिशब्दः एवंशब्दपदार्थकः एव पूर्ववत्— क्षेत्रज्ञः इत्येवम् आहुः।", "padacchedaText": "", "audioFile": "PB_002184.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002185", "originalText": "के? तद्विदः तौ क्षेत्रक्षेत्रज्ञौ ये विदन्ति ते तद्विदः॥ १॥", "padacchedaText": "", "audioFile": "PB_002185.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002186", "originalText": "एवं क्षेत्रक्षेत्रज्ञौ उक्तौ।", "padacchedaText": "", "audioFile": "PB_002186.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002187", "originalText": "किम् एतावन्मात्रेण ज्ञानेन ज्ञातव्यौ इति? न इति उच्यते—\nक्षेत्रज्ञं चापि मां विद्धि सर्वक्षेत्रेषु भारत। क्षेत्रक्षेत्रज्ञयोर्ज्ञानं यत्तज्ज्ञानं मतं मम॥ २॥", "padacchedaText": "", "audioFile": "PB_002187.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002188", "originalText": "क्षेत्रज्ञं यथोक्तलक्षणं चापि मां परमेश्वरम् असंसारिणं विद्धि जानीहि।", "padacchedaText": "", "audioFile": "PB_002188.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002189", "originalText": "सर्वक्षेत्रेषु यः क्षेत्रज्ञः ब्रह्मादिस्तम्बपर्यन्तानेकक्षेत्रोपाधिप्रविभक्तः, तं निरस्तसर्वोपाधिभेदं सदसदादिशब्दप्रत्ययागोचरं विद्धि इति अभिप्रायः।", "padacchedaText": "", "audioFile": "PB_002189.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002190", "originalText": "हे भारत, यस्मात् क्षेत्रक्षेत्रज्ञेश्वरयाथात्म्यव्यतिरेकेण न ज्ञानगोचरम् अन्यत् अवशिष्टम् अस्ति, तस्मात् क्षेत्रक्षेत्रज्ञयोः ज्ञेयभूतयोः यत् ज्ञानं क्षेत्रक्षेत्रज्ञौ येन ज्ञानेन विषयीक्रियेते, तत् ज्ञानं सम्यग्ज्ञानम् इति मतम् अभिप्रायः मम ईश्वरस्य विष्णोः॥", "padacchedaText": "", "audioFile": "PB_002190.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002191", "originalText": "ननु सर्वक्षेत्रेषु एक एव ईश्वरः, न अन्यः तद्व्यतिरिक्तः भोक्ता विद्यते चेत्, ततः ईस्वरस्य संसारित्वं प्राप्तम्, ईश्वरव्यतिरेकेण वा संसारिणः अन्यस्य अभावात् संसाराभावप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_002191.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002192", "originalText": "तच्च उभयमनिष्टम्, बन्धमोक्षतद्धेतुशास्त्रानर्थक्यप्रसङ्गात्, प्रत्यक्षादिप्रमाणविरोधाच्च।", "padacchedaText": "", "audioFile": "PB_002192.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002193", "originalText": "प्रत्यक्षेण तावत् सुखदुःखतद्धेतुलक्षणः संसारः उपलभ्यते, जगद्वैचित्र्योपलब्धेश्च धर्माधर्मनिमित्तः संसारः अनुमीयते। सर्वमेतत् अनुपपन्नमात्मेश्वरैकत्वे॥", "padacchedaText": "", "audioFile": "PB_002193.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002194", "originalText": "न, ज्ञानाज्ञानयोः अन्यत्वेनोपपत्तेः— ‘दूरमेते विपरीते विषूची अविद्या या च विद्येति ज्ञाता’ (क.१.२.४)।", "padacchedaText": "", "audioFile": "PB_002194.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002195", "originalText": "तथा तयोः विद्याविद्याविषययोः फलभेदोऽपि विरुद्धः निर्दिष्टः— ‘श्रेयश्च प्रेयश्च’ (क.१.२.२) इति, विद्याविषयः श्रेयः, प्रेयस्तु अविद्याकार्यम् इति।", "padacchedaText": "", "audioFile": "PB_002195.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002196", "originalText": "तथा च व्यासः— ‘द्वाविमावथ पन्थानौ’ (मो.ध.२४१.६) इत्यादि, ‘इमौ द्वावेव पन्थानौ’ इत्यादि च।", "padacchedaText": "", "audioFile": "PB_002196.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002197", "originalText": "इह च द्वे निष्ठे उक्ते।", "padacchedaText": "", "audioFile": "PB_002197.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002198", "originalText": "अविद्या च सह कार्येण हातव्या इति श्रुतिस्मृतिन्यायेभ्यः अवगम्यते।", "padacchedaText": "", "audioFile": "PB_002198.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002199", "originalText": "श्रुतयः तावत्— ‘इह चेदवेदीदथ सत्यमस्ति न चेदिहावेदीन्महती विनष्टिः’ (के.२.५) ‘तमेवं विद्वानमृत इह भवति।", "padacchedaText": "", "audioFile": "PB_002199.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002200", "originalText": "नान्यः पन्था विद्यतेऽयनाय’ (तै.आ.३.१३) ‘विद्वान्न बिभेति कुतश्चन’ (तै.२.९.१)।", "padacchedaText": "", "audioFile": "PB_002200.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002201", "originalText": "अविदुषस्तु— ‘अथ तस्य भयं भवति’ (तै.२.७.१), ‘अविद्यायामन्तरे वर्तमानाः’ (क.१.२.५), ‘ब्रह्म वेद ब्रह्मैव भवति’ ‘अन्योऽसावन्योऽहमस्मीति न स वेद यथा पशुरेवं स देवानाम्’ (बृ.१.४.१०) आत्मवित् यः ‘स इदं सर्वं भवति’ (बृ.१.४.१०), ‘यदा चर्मवत्’ (श्वे.६.२०) इत्याद्याः सहस्रशः।", "padacchedaText": "", "audioFile": "PB_002201.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002202", "originalText": "स्मृतयश्च— ‘अज्ञानेनावृतं ज्ञानं तेन मुह्यन्ति जन्तवः’ (भ.गी.५.१५) ‘इहैव तैर्जितः सर्गो येषां साम्ये स्थितं मनः’ (भ.गी.५.१९) ‘समं पश्यन् हि सर्वत्र’ (भ.गी.१३.२८) इत्याद्याः।", "padacchedaText": "", "audioFile": "PB_002202.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002203", "originalText": "न्यायतश्च— ‘सर्पान्कुशाग्राणि तथोदपानं ज्ञात्वा मनुष्याः परिवर्जयन्ति।", "padacchedaText": "", "audioFile": "PB_002203.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002204", "originalText": "अज्ञानतस्तत्र पतन्ति केचिज्ज्ञाने फलं पश्य यथाविशिष्टम्’ (मो.ध.२०१.१७)।", "padacchedaText": "", "audioFile": "PB_002204.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002205", "originalText": "तथा च— देहादिषु आत्मबुद्धिः अविद्वान् रागद्वेषादिप्रयुक्तः धर्माधर्मानुष्ठानकृत् जायते म्रियते च इति अवगम्यते, देहादिव्यतिरिक्तात्मदर्शिनः रागद्वेषादिप्रहाणापेक्षधर्माधर्मप्रवृत्त्युपशमात् मुच्यन्ते इति न केनचित् प्रत्याख्यातुं शक्यं न्यायतः।", "padacchedaText": "", "audioFile": "PB_002205.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002206", "originalText": "तत्र एवं सति, क्षेत्रज्ञस्य ईश्वरस्यैव सतः अविद्याकृतोपाधिभेदतः संसारित्वमिव भवति, यथा देहाद्यात्मत्वमात्मनः।", "padacchedaText": "", "audioFile": "PB_002206.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002207", "originalText": "सर्वजन्तूनां हि प्रसिद्धः देहादिषु अनात्मसु आत्मभावः निश्चितः अविद्याकृतः, यथा स्थाणौ पुरुषनिश्चयः, न च एतावता पुरुषधर्मः स्थाणोः भवति, स्थाणुधर्मो वा पुरुषस्य, तथा न चैतन्यधर्मो देहस्य, देहधर्मो वा चेतनस्य सुखदुःखमोहात्मकत्वादिः आत्मनः न युक्तः, अविद्याकृतत्वाविशेषात्, जरामृत्युवत्॥", "padacchedaText": "", "audioFile": "PB_002207.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002208", "originalText": "न, अतुल्यत्वात्, इति चेत्— स्थाणुपुरुषौ ज्ञेयावेव सन्तौ ज्ञात्रा अन्योन्यस्मिन् अध्यस्तौ अविद्यया, देहात्मनोस्तु ज्ञेयज्ञात्रोरेव इतरेतराध्यासः, इति न समः दृष्टान्तः।", "padacchedaText": "", "audioFile": "PB_002208.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002209", "originalText": "अतः देहधर्मः ज्ञेयोऽपि ज्ञातुरात्मनः भवतीति चेत्, न, अचैतन्यादिप्रसङ्गात्।", "padacchedaText": "", "audioFile": "PB_002209.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002210", "originalText": "यदि हि ज्ञेयस्य देहादेः क्षेत्रस्य धर्माः सुखदुःखमोहेच्छादयः ज्ञातुः भवन्ति, तर्हि, ‘ज्ञेयस्य क्षेत्रस्य धर्माः केचित् आत्मनः भवन्ति अविद्याध्यारोपिताः, जरामरणादयस्तु न भवन्ति’ इति विशेषहेतुः वक्तव्यः।", "padacchedaText": "", "audioFile": "PB_002210.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002211", "originalText": "‘न भवन्ति’ इति अस्ति अनुमानम्— अविद्याध्यारोपितत्वात् जरामरणादिवत् इति, हेयत्वात्, उपादेयत्वाच्च इत्यादि।", "padacchedaText": "", "audioFile": "PB_002211.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002212", "originalText": "तत्र एवं सति, कर्तृत्वभोक्तृत्वलक्षणः संसारः ज्ञेयस्थः ज्ञातरि अविद्यया अध्यारोपितः इति, न तेन ज्ञातुः किञ्चित् दुष्यति, यथा बालैः अध्यारोपितेन आकाशस्य तलमलिनत्वादिना॥", "padacchedaText": "", "audioFile": "PB_002212.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002213", "originalText": "एवं च सति, सर्वक्षेत्रेष्वपि सतः भगवतः क्षेत्रज्ञस्य ईश्वरस्य संसारित्वगन्धमात्रमपि नाशङ्क्यम्। न हि क्वचिदपि लोके अविद्याध्यस्तेन धर्मेण कस्यचित् उपकारः अपकारो वा दृष्टः॥", "padacchedaText": "", "audioFile": "PB_002213.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002214", "originalText": "यत्तु उक्तम्— न समः दृष्टान्तः इति, तत् असत्।", "padacchedaText": "", "audioFile": "PB_002214.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002215", "originalText": "कथम्? अविद्याध्यासमात्रं हि दृष्टान्तदार्ष्टान्तिकयोः साधर्म्यं विवक्षितम्।", "padacchedaText": "", "audioFile": "PB_002215.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002216", "originalText": "तत् न व्यभिचरति। यत्तु ज्ञातरि व्यभिचरति इति मन्यसे, तस्यापि अनैकान्तिकत्वं दर्शितं जरादिभिः॥", "padacchedaText": "", "audioFile": "PB_002216.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002217", "originalText": "अविद्यावत्त्वात् क्षेत्रज्ञस्य संसारित्वम् इति चेत्, न, अविद्यायाः तामसत्वात्।", "padacchedaText": "", "audioFile": "PB_002217.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002218", "originalText": "तामसो हि प्रत्ययः, आवरणात्मकत्वात् अविद्या विपरीतग्राहकः, संशयोपस्थापको वा, अग्रहणात्मको वा, विवेकप्रकाशभावे तदभावात्, तामसे च आवरणात्मके तिमिरादिदोषे सति अग्रहणादेः अविद्यात्रयस्य उपलब्धेः॥", "padacchedaText": "", "audioFile": "PB_002218.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002219", "originalText": "अत्र आह— एवं तर्हि ज्ञातृधर्मः अविद्या।", "padacchedaText": "", "audioFile": "PB_002219.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002220", "originalText": "न, करणे चक्षुषि तैमिरिकत्वादिदोषोपलब्धेः।", "padacchedaText": "", "audioFile": "PB_002220.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002221", "originalText": "यत्तु मन्यसे— ज्ञातृधर्मः अविद्या, तदेव च अविद्याधर्मवत्त्वं क्षेत्रज्ञस्य संसारित्वम्, तत्र यदुक्तम् ‘ईश्वर एव क्षेत्रज्ञः, न संसारी’ इत्येतत् अयुक्तमिति— तत् न, यथा करणे चक्षुषि विपरीतग्राहकादिदोषस्य दर्शनात्।", "padacchedaText": "", "audioFile": "PB_002221.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002222", "originalText": "न विपरीतादिग्रहणं तन्निमित्तं वा तैमिरिकत्वादिदोषः ग्रहीतुः, चक्षुषः संस्कारेण तिमिरे अपनीते ग्रहीतुः अदर्शनात् न ग्रहीतुर्धर्मः यथा, तथा सर्वत्रैव अग्रहणविपरीतसंशयप्रत्ययास्तन्निमित्ताः करणस्यैव कस्यचित् भवितुमर्हन्ति, न ज्ञातुः क्षेत्रज्ञस्य।", "padacchedaText": "", "audioFile": "PB_002222.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002223", "originalText": "संवेद्यत्वाच्च तेषां प्रदीपप्रकाशवत् न ज्ञातृधर्मत्वम्— संवेद्यत्वादेव स्वात्मव्यतिरिक्तसंवेद्यत्वम्, सर्वकरणवियोगे च कैवल्ये सर्ववादिभिः अविद्यादिदोषवत्त्वानभ्युपगमात्।", "padacchedaText": "", "audioFile": "PB_002223.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002224", "originalText": "आत्मनः यदि क्षेत्रज्ञस्य अग्न्युष्णवत् स्वः धर्मः, ततः न कदाचिदपि तेन वियोगः स्यात्।", "padacchedaText": "", "audioFile": "PB_002224.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002225", "originalText": "अविक्रियस्य च व्योमवत् सर्वगतस्य अमूर्तस्य आत्मनः केनचित् संयोगवियोगानुपपत्तेः, सिद्धं क्षेत्रज्ञस्य नित्यमेव ईश्वरत्वम्, ‘अनादित्वान्निर्गुणत्वात्’ (भ.गी.१३.३१) इत्यादीश्वरवचनाच्च॥", "padacchedaText": "", "audioFile": "PB_002225.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002226", "originalText": "ननु एवं सति संसारसंसारित्वाभावे शास्त्रानर्थक्यादिदोषः स्यादिति चेत्, न, सर्वैरभ्युपगतत्वात्।", "padacchedaText": "", "audioFile": "PB_002226.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002227", "originalText": "सर्वैः आत्मवादिभिः अभ्युपगतः दोषः न एकेन परिहर्तव्यः भवति।", "padacchedaText": "", "audioFile": "PB_002227.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002228", "originalText": "कथम् अभ्युपगतः इति? मुक्तात्मनां हि संसारसंसारित्वव्यवहाराभावः सर्वैरेव आत्मवादिभिः इष्यते।", "padacchedaText": "", "audioFile": "PB_002228.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002229", "originalText": "न च तेषां शास्त्रानर्थक्यादिदोषप्राप्तिः अभ्युपगता।", "padacchedaText": "", "audioFile": "PB_002229.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002230", "originalText": "तथा नः क्षेत्रज्ञानाम् ईश्वरैकत्वे सति, शास्त्रानर्थक्यं भवतु, अविद्याविषये च अर्थवत्त्वम्— यथा द्वैतिनां सर्वेषां बन्धावस्थायामेव शास्त्राद्यर्थवत्त्वम्, न मुक्तावस्थायाम्, एवम्॥", "padacchedaText": "", "audioFile": "PB_002230.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002231", "originalText": "ननु आत्मनः बन्धमुक्तावस्थे परमार्थत एव वस्तुभूते द्वैतिनां सर्वेषाम्।", "padacchedaText": "", "audioFile": "PB_002231.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002232", "originalText": "अतः हेयोपादेयतत्साधनसद्भावे शास्त्राद्यर्थवत्त्वं स्यात्।", "padacchedaText": "", "audioFile": "PB_002232.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002233", "originalText": "अद्वैतिनां पुनः, द्वैतस्य अपरमार्थत्वात्, अविद्याकृतत्वात् बन्धावस्थायाश्च आत्मनः अपरमार्थत्वे निर्विषयत्वात्, शास्त्राद्यानर्थक्यम् इति चेत्, न, आत्मनः अवस्थाभेदानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_002233.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002234", "originalText": "यदि तावत् आत्मनः बन्धमुक्तावस्थे, युगपत् स्याताम्, क्रमेण वा।", "padacchedaText": "", "audioFile": "PB_002234.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002235", "originalText": "युगपत् तावत् विरोधात् न सम्भवतः स्थितिगती इव एकस्मिन्।", "padacchedaText": "", "audioFile": "PB_002235.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002236", "originalText": "क्रमभावित्वे च, निर्निमित्तत्वे अनिर्मोक्षप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_002236.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002237", "originalText": "अन्यनिमित्तत्वे च स्वतः अभावात् अपरमार्थत्वप्रसङ्गः।", "padacchedaText": "", "audioFile": "PB_002237.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002238", "originalText": "तथा च सति अभ्युपगमहानिः।", "padacchedaText": "", "audioFile": "PB_002238.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002239", "originalText": "किञ्च, बन्धमुक्तावस्थयोः पौर्वापर्यनिरूपणायां बन्धावस्था पूर्वं प्रकल्प्या, अनादिमती अन्तवती च, तच्च प्रमाणविरुद्धम्।", "padacchedaText": "", "audioFile": "PB_002239.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002240", "originalText": "तथा मोक्षावस्था आदिमती अनन्ता च प्रमाणविरुद्धैव अभ्युपगम्यते।", "padacchedaText": "", "audioFile": "PB_002240.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002241", "originalText": "न च अवस्थावतः अवस्थान्तरं गच्छतः नित्यत्वम् उपपादयितुं शक्यम्।", "padacchedaText": "", "audioFile": "PB_002241.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002242", "originalText": "अथ अनित्यत्वदोषपरिहाराय बन्धमुक्तावस्थाभेदो न कल्प्यते, अतः द्वैतिनामपि शास्त्रानर्थक्यादिदोषः अपरिहार्य एव, इति समानत्वात् न अद्वैतवादिना परिहर्तव्यः दोषः॥", "padacchedaText": "", "audioFile": "PB_002242.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002243", "originalText": "न च शास्त्रानर्थक्यम्, यथाप्रसिद्धाविद्वत्पुरुषविषयत्वात् शास्त्रस्य।", "padacchedaText": "", "audioFile": "PB_002243.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002244", "originalText": "अविदुषां हि फलहेत्वोः अनात्मनोः आत्मदर्शनम्, न विदुषाम्, विदुषां हि फलहेतुभ्याम् आत्मनः अन्यत्वदर्शने सति, तयोः अहमिति आत्मदर्शनानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_002244.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002245", "originalText": "न हि अत्यन्तमूढः उन्मत्तादिरपि जलाग्न्योः छायाप्रकाशयोर्वा ऐकात्म्यं पश्यति, किमुत विवेकी।", "padacchedaText": "", "audioFile": "PB_002245.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002246", "originalText": "तस्मात् न विधिप्रतिषेधशास्त्रं तावत् फलहेतुभ्याम् आत्मनः अन्यत्वदर्शिनः भवति।", "padacchedaText": "", "audioFile": "PB_002246.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002247", "originalText": "न हि ‘देवदत्त, त्वम् इदं कुरु’ इति कस्मिंश्चित् कर्मणि नियुक्ते, विष्णुमित्रः ‘अहं नियुक्तः’ इति तत्रस्थः नियोगं शृण्वन्नपि प्रतिपद्यते। वियोगविषयविवेकाग्रहणात् तु उपपद्यते प्रतिपत्तिः, तथा फलहेत्वोरपि॥", "padacchedaText": "", "audioFile": "PB_002247.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002248", "originalText": "ननु प्राकृतसम्बन्धापेक्षया युक्तैव प्रतिपत्तिः शास्त्रार्थविषया— फलहेतुभ्याम् अन्यात्मविषयदर्शनेऽपि सति— इष्टफलहेतौ प्रवर्तितः अस्मि, अनिष्टफलहेतोश्च निवर्तितः अस्मीति, यथा पितृपुत्रादीनाम् इतरेतरात्मान्यत्वदर्शने सत्यपि अन्योन्यनियोगप्रतिषेधार्थप्रतिपत्तिः।", "padacchedaText": "", "audioFile": "PB_002248.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002249", "originalText": "न, व्यतिरिक्तात्मदर्शनप्रतिपत्तेः प्रागेव फलहेत्वोः आत्माभिमानस्य सिद्धत्वात्।", "padacchedaText": "", "audioFile": "PB_002249.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002250", "originalText": "प्रतिपन्ननियोग
