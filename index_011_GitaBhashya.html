 वा’ इति निश्चयं कृत्वेत्यर्थः॥ ३७॥", "padacchedaText": "", "audioFile": "PB_000347.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000348", "originalText": "तत्र युद्धं स्वधर्मं इत्येवं युध्यमानस्योपदेशमिमं शृणु—\nसुखदुःखे समे कृत्वा लाभालाभौ जयाजयौ। ततो युद्धाय युज्यस्व नैवं पापमवाप्स्यसि॥ ३८॥", "padacchedaText": "", "audioFile": "PB_000348.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000349", "originalText": "सुखदुःखे समे तुल्ये कृत्वा, रागद्वेषावप्यकृत्वेत्येतत्।", "padacchedaText": "", "audioFile": "PB_000349.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000350", "originalText": "तथा लाभालाभौ जयाजयौ च समौ कृत्वा ततो युद्धाय युज्यस्व घटस्व।", "padacchedaText": "", "audioFile": "PB_000350.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000351", "originalText": "न एवं युद्धं कुर्वन् पापम् अवाप्स्यसि। इत्येष उपदेशः प्रासङ्गिकः॥ ३८॥", "padacchedaText": "", "audioFile": "PB_000351.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000352", "originalText": "शोकमोहापनयनाय लौकिको न्यायः ‘स्वधर्ममपि चावेक्ष्य’ (भ.गी.२.३१) इत्याद्यैः श्लोकैरुक्तः, न तु तात्पर्येण।", "padacchedaText": "", "audioFile": "PB_000352.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000353", "originalText": "परमार्थदर्शनमिह प्रकृतम्।", "padacchedaText": "", "audioFile": "PB_000353.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000354", "originalText": "तच्चोक्तमुपसंह्रियते— ‘एषा तेऽभिहिता’ (भ.गी.२.३९) इति शास्त्रविषयविभागप्रदर्शनाय।", "padacchedaText": "", "audioFile": "PB_000354.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000355", "originalText": "इह हि प्रदर्शिते पुनः शास्त्रविषयविभागे उपरिष्टात् ‘ज्ञानयोगेन साङ्‍ख्यानां कर्मयोगेन योगिनाम्’ (भ.गी.३.३) इति निष्ठाद्वयविषयं शास्त्रं सुखं प्रवर्तिष्यते, श्रोतारश्च विषयविभागेन सुखं ग्रहीष्यन्ति इत्यत आह—\nएषा तेऽभिहिता साङ्‍ख्ये बुद्धिर्योगे त्विमां शृणु।", "padacchedaText": "", "audioFile": "PB_000355.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000356", "originalText": "बुद्ध्या युक्तो यया पार्थ कर्मबन्धं प्रहास्यसि॥ ३९॥", "padacchedaText": "", "audioFile": "PB_000356.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000357", "originalText": "एषा ते तुभ्यम् अभिहिता उक्ता साङ्‍ख्ये परमार्थवस्तुविवेकविषये बुद्धिः ज्ञानं साक्षात् शोकमोहादिसंसारहेतुदोषनिवृत्तिकारणम्।", "padacchedaText": "", "audioFile": "PB_000357.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000358", "originalText": "योगे तु तत्प्राप्त्युपाये निःसङ्गतया द्वन्द्वप्रहाणपूर्वकम् ईश्वराराधनार्थे कर्मयोगे कर्मानुष्ठाने समाधियोगे च इमाम् अनन्तरमेवोच्यमानां बुद्धिं शृणु।", "padacchedaText": "", "audioFile": "PB_000358.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000359", "originalText": "तां च बुद्धिं स्तौति प्ररोचनार्थम्— बुद्ध्या यया योगविषयया युक्तः हे पार्थ, कर्मबन्धं कर्मैव धर्माधर्माख्यो बन्धः कर्मबन्धः तं प्रहास्यसि ईश्वरप्रसादनिमित्तज्ञानप्राप्त्यैव इत्यभिप्रायः॥ ३९॥", "padacchedaText": "", "audioFile": "PB_000359.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000360", "originalText": "किञ्च अन्यत्—\nनेहाभिक्रमनाशोऽस्ति प्रत्यवायो न विद्यते। स्वल्पमप्यस्य धर्मस्य त्रायते महतो भयात्॥ ४०॥", "padacchedaText": "", "audioFile": "PB_000360.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000361", "originalText": "न इह मोक्षमार्गे कर्मयोगे अभिक्रमनाशः अभिक्रमणमभिक्रमः प्रारम्भः तस्य नाशः नास्ति यथा कृष्यादेः।", "padacchedaText": "", "audioFile": "PB_000361.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000362", "originalText": "योगविषये प्रारम्भस्य न अनैकान्तिकफलत्वमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000362.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000363", "originalText": "किञ्च— नापि चिकित्सावत् प्रत्यवायः विद्यते भवति। किं तु स्वल्पमपि अस्य धर्मस्य योगधर्मस्य अनुष्ठितं त्रायते रक्षति महतः भयात् संसारभयात् जन्ममरणादिलक्षणात्॥ ४०॥", "padacchedaText": "", "audioFile": "PB_000363.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000364", "originalText": "येयं साङ्‍ख्ये बुद्धिरुक्ता योगे च, वक्ष्यमाणलक्षणा सा—\nव्यवसायात्मिका बुद्धिरेकेह कुरुनन्दन। बहुशाखा ह्यनन्ताश्च बुद्धयोऽव्यवसायिनाम्॥ ४१॥", "padacchedaText": "", "audioFile": "PB_000364.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000365", "originalText": "व्यवसायात्मिका निश्चयस्वभावा एका एव बुद्धिः इतरविपरीतबुद्धिशाखाभेदस्य बाधिका, सम्यक्प्रमाणजनितत्वात्, इह श्रेयोमार्गे हे कुरुनन्दन।", "padacchedaText": "", "audioFile": "PB_000365.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000366", "originalText": "याः पुनः इतरा विपरीतबुद्धयः, यासां शाखाभेदप्रचारवशात् अनन्तः अपारः अनुपरतः संसारो नित्यप्रततो विस्तीर्णो भवति, प्रमाणजनितविवेकबुद्धिनिमित्तवशाच्च उपरतास्वनन्तभेदबुद्धिषु संसारोऽप्युपरमते ता बुद्धयः बहुशाखाः बह्वयः शाखाः यासां ताः बहुशाखाः, बहुभेदा इत्येतत्।", "padacchedaText": "", "audioFile": "PB_000366.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000367", "originalText": "प्रतिशाखाभेदेन हि अनन्ताश्च बुद्धयः। केषाम्? अव्यवसायिनां प्रमाणजनितविवेकबुद्धिरहितानामित्यर्थः॥ ४१॥", "padacchedaText": "", "audioFile": "PB_000367.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000368", "originalText": "येषां व्यवसायात्मिका बुद्धिर्नास्ति ते—\nयामिमां पुष्पितां वाचं प्रवदन्त्यविपश्चितः। वेदवादरताः पार्थ नान्यदस्तीति वादिनः॥ ४२॥", "padacchedaText": "", "audioFile": "PB_000368.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000369", "originalText": "याम् इमां वक्ष्यमाणां पुष्पितां पुष्पित इव वृक्षः शोभमानां श्रूयमाणरमणीयां वाचं वाक्यलक्षणां प्रवदन्ति।", "padacchedaText": "", "audioFile": "PB_000369.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000370", "originalText": "के? अविपश्चितः अमेधसः अविवेकिन इत्यर्थः। वेदवादरताः बह्वर्थवादफलसाधनप्रकाशकेषु वेदवाक्येषु रताः हे पार्थ, न अन्यत् स्वर्गपश्वादिफलसाधनेभ्यः कर्मभ्यः अस्ति इति एवं वादिनः वदनशीलाः॥ ४२॥", "padacchedaText": "", "audioFile": "PB_000370.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000371", "originalText": "ते च—\nकामात्मानः स्वर्गपरा जन्मकर्मफलप्रदाम्। क्रियाविशेषबहुलां भोगैश्वर्यगतिं प्रति॥ ४३॥", "padacchedaText": "", "audioFile": "PB_000371.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000372", "originalText": "कामात्मानः कामस्वभावाः, कामपरा इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000372.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000373", "originalText": "स्वर्गपराः स्वर्गः परः पुरुषार्थः येषां ते स्वर्गपराः स्वर्गप्रधानाः।", "padacchedaText": "", "audioFile": "PB_000373.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000374", "originalText": "जन्मकर्मफलप्रदां कर्मणः फलं कर्मफलं जन्मैव कर्मफलं जन्मकर्मफलं तत् प्रददातीति जन्मकर्मफलप्रदा, तां वाचम्।", "padacchedaText": "", "audioFile": "PB_000374.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000375", "originalText": "प्रवदन्ति इत्यनुषज्यते।", "padacchedaText": "", "audioFile": "PB_000375.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000376", "originalText": "क्रियाविशेषबहुलां क्रियाणां विशेषाः क्रियाविशेषाः ते बहुला यस्यां वाचि तां स्वर्गपशुपुत्राद्यर्थाः यया वाचा बाहुल्येन प्रकाश्यन्ते।", "padacchedaText": "", "audioFile": "PB_000376.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000377", "originalText": "भोगैश्वर्यगतिं प्रति भोगश्च ऐश्वर्यं च भोगैश्वर्ये, तयोर्गतिः प्राप्तिः भोगैश्वर्यगतिः, तां प्रति साधनभूताः ये क्रियाविशेषाः तद्बहुलां तां वाचं प्रवदन्तः मूढाः संसारे परिवर्तन्ते इत्यभिप्रायः॥ ४३॥", "padacchedaText": "", "audioFile": "PB_000377.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000378", "originalText": "तेषां च—\nभोगैश्वर्यप्रसक्तानां तयापहृतचेतसाम्। व्यवसायात्मिका बुद्धिः समाधौ न विधीयते॥ ४४॥", "padacchedaText": "", "audioFile": "PB_000378.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000379", "originalText": "भोगैश्वर्यप्रसक्तानां भोगः कर्तव्यः ऐश्वर्यं च इति भोगैश्वर्ययोरेव प्रणयवतां तदात्मभूतानाम्।", "padacchedaText": "", "audioFile": "PB_000379.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000380", "originalText": "तया क्रियाविशेषबहुलया वाचा अपहृतचेतसाम् आच्छादितविवेकप्रज्ञानां व्यवसायात्मिका साङ्‍ख्ये योगे वा बुद्धिः समाधौ समाधीयते अस्मिन् पुरुषोपभोगाय सर्वमिति समाधिः अन्तःकरणं बुद्धिः तस्मिन् समाधौ, न विधीयते न भवति इत्यर्थः॥ ४४॥", "padacchedaText": "", "audioFile": "PB_000380.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000381", "originalText": "ये एवं विवेकबुद्धिरहिताः तेषां कामात्मनां यत् फलं तदाह—\nत्रैगुण्यविषया वेदा निस्त्रैगुण्यो भवार्जुन। निर्द्वन्द्वो नित्यसत्त्वस्थो निर्योगक्षेम आत्मवान्॥ ४५॥", "padacchedaText": "", "audioFile": "PB_000381.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000382", "originalText": "त्रैगुण्यविषयाः त्रैगुण्यं संसारो विषयः प्रकाशयितव्यः येषां ते वेदाः त्रैगुण्यविषयाः।", "padacchedaText": "", "audioFile": "PB_000382.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000383", "originalText": "त्वं तु निस्त्रैगुण्यो भव अर्जुन, निष्कामो भव इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000383.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000384", "originalText": "निर्द्वन्द्वः सुखदुःखहेतू सप्रतिपक्षौ पदार्थौ द्वन्द्वशब्दवाच्यौ, ततः निर्गतः निर्द्वन्द्वो भव।", "padacchedaText": "", "audioFile": "PB_000384.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000385", "originalText": "नित्यसत्त्वस्थः सदा सत्त्वगुणाश्रितो भव।", "padacchedaText": "", "audioFile": "PB_000385.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000386", "originalText": "तथा निर्योगक्षेमः अनुपात्तस्य उपादानं योगः, उपात्तस्य रक्षणं क्षेमः, योगक्षेमप्रधानस्य श्रेयसि प्रवृत्तिर्दुष्करा इत्यतः निर्योगक्षेमो भव।", "padacchedaText": "", "audioFile": "PB_000386.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000387", "originalText": "आत्मवान् अप्रमत्तश्च भव। एष तव उपदेशः स्वधर्ममनुतिष्ठतः॥ ४५॥", "padacchedaText": "", "audioFile": "PB_000387.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000388", "originalText": "सर्वेषु वेदोक्तेषु कर्मसु यान्युक्तान्यनन्तानि फलानि तानि नापेक्ष्यन्ते चेत्, किमर्थं तानि ईश्वरायेत्यनुष्ठीयन्ते इत्युच्यते, शृणु—\nयावानर्थ उदपाने सर्वतःसम्प्लुतोदके।", "padacchedaText": "", "audioFile": "PB_000388.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000389", "originalText": "तावान् सर्वेषु वेदेषु ब्राह्मणस्य विजानतः॥ ४६॥", "padacchedaText": "", "audioFile": "PB_000389.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000390", "originalText": "यथा लोके कूपतडागाद्यनेकस्मिन् उदपाने परिच्छिन्नोदके यावान् यावत्परिमाणः स्नानपानादिः अर्थः फलं प्रयोजनं स सर्वः अर्थः सर्वतः सम्प्लुतोदकेऽपि यः अर्थः तावानेव सम्पद्यते, तत्र अन्तर्भवतीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000390.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000391", "originalText": "एवं तावान् तावत्परिमाण एव सम्पद्यते सर्वेषु वेदेषु वेदोक्तेषु कर्मसु यः अर्थः यत्कर्मफलं सः अर्थः ब्राह्मणस्य संन्यासिनः परमार्थतत्त्वं विजानतः यः अर्थः यत् विज्ञानफलं सर्वतःसम्प्लुतोदकस्थानीयं तस्मिन् तावानेव सम्पद्यते तत्रैवान्तर्भवतीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000391.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000392", "originalText": "‘यथा कृताय विजितायाधरेयाः संयन्त्येवमेनं सर्वं तदभिसमेति यत् किञ्चित् प्रजाः साधु कुर्वन्ति यस्तद्वेद यत्स वेद’ (छा.४.१.४) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_000392.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000393", "originalText": "‘सर्वं कर्माखिलम्’ (भ.गी.४.३३) इति च वक्ष्यति। तस्मात् प्राक् ज्ञाननिष्ठाधिकारप्राप्तेः कर्मण्यधिकृतेन कूपतडागाद्यर्थस्थानीयमपि कर्म कर्तव्यम्॥ ४६॥", "padacchedaText": "", "audioFile": "PB_000393.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000394", "originalText": "तव च—\nकर्मण्येवाधिकारस्ते मा फलेषु कदाचन। मा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि॥ ४७॥", "padacchedaText": "", "audioFile": "PB_000394.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000395", "originalText": "कर्मण्येव अधिकारः न ज्ञाननिष्ठायां ते तव।", "padacchedaText": "", "audioFile": "PB_000395.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000396", "originalText": "तत्र च कर्म कुर्वतः मा फलेषु अधिकारः अस्तु, कर्मफलतृष्णा मा भूत् कदाचन कस्याञ्चिदप्यवस्थायामित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000396.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000397", "originalText": "यदा कर्मफले तृष्णा ते स्यात् तदा कर्मफलप्राप्तेः हेतुः स्याः, एवं मा कर्मफलहेतुः भूः।", "padacchedaText": "", "audioFile": "PB_000397.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000398", "originalText": "यदा हि कर्मफलतृष्णाप्रयुक्तः कर्मणि प्रवर्तते तदा कर्मफलस्यैव जन्मनो हेतुर्भवेत्। यदि कर्मफलं नेष्यते, किं कर्मणा दुःखरूपेण? इति मा ते तव सङ्गः अस्तु अकर्मणि अकरणे प्रीतिर्मा भूत्॥ ४७॥", "padacchedaText": "", "audioFile": "PB_000398.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000399", "originalText": "यदि कर्मफलप्रयुक्तेन न कर्तव्यं कर्म, कथं तर्हि कर्तव्यमिति, उच्यते—\nयोगस्थः कुरु कर्माणि सङ्गं त्यक्त्वा धनञ्जय। सिद्ध्यसिद्ध्योः समो भूत्वा समत्वं योग उच्यते॥ ४८॥", "padacchedaText": "", "audioFile": "PB_000399.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000400", "originalText": "योगस्थः सन् कुरु कर्माणि केवलमीश्वरार्थम्, तत्रापि ‘ईश्वरो मे तुष्यतु’ इति सङ्गं त्यक्त्वा धनञ्जय।", "padacchedaText": "", "audioFile": "PB_000400.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000401", "originalText": "फलतृष्णाशून्येन क्रियमाणे कर्मणि सत्त्वशुद्धिजा ज्ञानप्राप्तिलक्षणा सिद्धिः, तद्विपर्ययजा असिद्धिः, तयोः सिद्ध्यसिद्ध्योः अपि समः तुल्यः भूत्वा कुरु कर्माणि।", "padacchedaText": "", "audioFile": "PB_000401.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000402", "originalText": "कोऽसौ योगः यत्रस्थः कुरु इति उक्तम्? इदमेव तत्— सिद्ध्यसिद्ध्योः समत्वं योगः उच्यते॥ ४८॥", "padacchedaText": "", "audioFile": "PB_000402.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000403", "originalText": "यत्पुनः समत्वबुद्धियुक्तमीश्वराराधनार्थं कर्मोक्तम्, एतस्मात्कर्मणः—\nदूरेण ह्यवरं कर्म बुद्धियोगाद्धनञ्जय। बुद्धौ शरणमन्विच्छ कृपणाः फलहेतवः॥ ४९॥", "padacchedaText": "", "audioFile": "PB_000403.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000404", "originalText": "दूरेण अतिविप्रकर्षेण अत्यन्तमेव हि अवरम् अधमं निकृष्टं कर्म फलार्थिना क्रियमाणं बुद्धियोगात् समत्वबुद्धियुक्तात् कर्मणः, जन्ममरणादिहेतुत्वात्।", "padacchedaText": "", "audioFile": "PB_000404.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000405", "originalText": "हे धनञ्जय, यत एवं ततः योगविषयायां बुद्धौ तत्परिपाकजायां वा साङ्‍ख्यबुद्धौ शरणम् आश्रयमभयप्राप्तिकारणम् अन्विच्छ प्रार्थयस्व, परमार्थज्ञानशरणो भवेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000405.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000406", "originalText": "यतः अवरं कर्म कुर्वाणाः कृपणाः दीनाः फलहेतवः फलतृष्णाप्रयुक्ताः सन्तः, ‘यो वा एतदक्षरं गार्ग्यविदित्वास्माल्लोकात्प्रैति स कृपणः’ (बृ.३.८.१०) इति श्रुतेः॥ ४९॥", "padacchedaText": "", "audioFile": "PB_000406.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000407", "originalText": "समत्वबुद्धियुक्तः सन् स्वधर्ममनुतिष्ठन् यत्फलं प्राप्नोति तच्छृणु—\nबुद्धियुक्तो जहातीह उभे सुकृतदुष्कृते। तस्माद्योगाय युज्यस्व योगः कर्मसु कौशलम्॥ ५०॥", "padacchedaText": "", "audioFile": "PB_000407.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000408", "originalText": "बुद्धियुक्तः कर्मसमत्वविषयया बुद्ध्या युक्तः बुद्धियुक्तः सः जहाति परित्यजति इह अस्मिन् लोके उभे सुकृतदुष्कृते पुण्यपापे सत्त्वशुद्धिज्ञानप्राप्तिद्वारेण यतः, तस्मात् समत्वबुद्धियोगाय युज्यस्व घटस्व।", "padacchedaText": "", "audioFile": "PB_000408.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000409", "originalText": "योगो हि कर्मसु कौशलम्, स्वधर्माख्येषु कर्मसु वर्तमानस्य या सिद्ध्यासिद्ध्योः समत्वबुद्धिः ईश्वरार्पितचेतस्तया तत् कौशलं कुशलभावः।", "padacchedaText": "", "audioFile": "PB_000409.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000410", "originalText": "तद्धि कौशलं यत् बन्धनस्वभावान्यपि कर्माणि समत्वबुद्ध्या स्वभावात् निवर्तन्ते। तस्मात्समत्वबुद्धियुक्तो भव त्वम्॥ ५०॥", "padacchedaText": "", "audioFile": "PB_000410.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000411", "originalText": "यस्मात्—\nकर्मजं बुद्धियुक्ता हि फलं त्यक्त्वा मनीषिणः। जन्मबन्धविनिर्मुक्ताः पदं गच्छन्त्यनामयम्॥ ५१॥", "padacchedaText": "", "audioFile": "PB_000411.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000412", "originalText": "कर्मजं फलं त्यक्त्वा इति व्यवहितेन सम्बन्धः।", "padacchedaText": "", "audioFile": "PB_000412.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000413", "originalText": "इष्टानिष्टदेहप्राप्तिः कर्मजं फलं कर्मभ्यो जातं बुद्धियुक्ताः समत्वबुद्धियुक्ताः सन्तः हि यस्मात् फलं त्यक्त्वा परित्यज्य मनीषिणः ज्ञानिनो भूत्वा, जन्मबन्धविनिर्मुक्ताः जन्मैव बन्धः जन्मबन्धः तेन विनिर्मुक्ताः जीवन्त एव जन्मबन्धात् विनिर्मुक्ताः सन्तः, पदं परमं विष्णोः मोक्षाख्यं गच्छन्ति अनामयं सर्वोपद्रवरहितमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000413.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000414", "originalText": "अथवा ‘बुद्धियोगाद्धनञ्जय’ (भ.गी.२.४९) इत्यारभ्य परमार्थदर्शनलक्षणैव सर्वतःसम्प्लुतोदकस्थानीया कर्मयोगजसत्त्वशुद्धिजनिता बुद्धिर्दर्शिता, साक्षात्सुकृतदुष्कृतप्रहाणादिहेतुत्वश्रवणात्॥ ५१॥", "padacchedaText": "", "audioFile": "PB_000414.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000415", "originalText": "योगानुष्ठानजनितसत्त्वशुद्धिजा बुद्धिः कदा प्राप्स्यते इत्युच्यते—\nयदा ते मोहकलिलं बुद्धिर्व्यतितरिष्यति। तदा गन्तासि निर्वेदं श्रोतव्यस्य श्रुतस्य च॥ ५२॥", "padacchedaText": "", "audioFile": "PB_000415.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000416", "originalText": "यदा यस्मिन्काले ते तव मोहकलिलं मोहात्मकमविवेकरूपं कालुष्यं येन आत्मानात्मविवेकबोधं कलुषीकृत्य विषयं प्रत्यन्तःकरणं प्रवर्तते, तत् तव बुद्धिः व्यतितरिष्यति व्यतिक्रमिष्यति, अतिशुद्धभावमापत्स्यते इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000416.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000417", "originalText": "तदा तस्मिन् काले गन्तासि प्राप्स्यसि निर्वेदं वैराग्यं श्रोतव्यस्य श्रुतस्य च, तदा श्रोतव्यं श्रुतं च ते निष्फलं प्रतिभातीत्यभिप्रायः॥ ५२॥", "padacchedaText": "", "audioFile": "PB_000417.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000418", "originalText": "मोहकलिलात्ययद्वारेण लब्धात्मविवेकजप्रज्ञः कदा कर्मयोगजं फलं परमार्थयोगमवाप्स्यामीति चेत्, तत् शृणु—\nश्रुतिविप्रतिपन्ना ते यदा स्थास्यति निश्चला। समाधावचला बुद्धिस्तदा योगमवाप्स्यसि॥ ५३॥", "padacchedaText": "", "audioFile": "PB_000418.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000419", "originalText": "श्रुतिविप्रतिपन्ना अनेकसाध्यसाधनसम्बन्धप्रकाशनश्रुतिभिः श्रवणैः प्रवृत्तिनिवृत्तिलक्षणैः विप्रतिपन्ना नानाप्रतिपन्ना विक्षिप्ता सती ते तव बुद्धिः यदि यस्मिन् काले स्थास्यति स्थिरीभूता भविष्यति निश्चला विक्षेपचलनवर्जिता सती समाधौ, समाधीयते चित्तमस्मिन्निति समाधिः आत्मा, तस्मिन् आत्मनि इत्येतत्।", "padacchedaText": "", "audioFile": "PB_000419.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000420", "originalText": "अचला तत्रापि विकल्पवर्जिता इत्येतत्।", "padacchedaText": "", "audioFile": "PB_000420.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000421", "originalText": "बुद्धिः अन्तःकरणम्। तदा तस्मिन्काले योगम् अवाप्स्यसि विवेकप्रज्ञां समाधिं प्राप्स्यसि॥ ५३॥", "padacchedaText": "", "audioFile": "PB_000421.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000422", "originalText": "प्रश्नबीजं प्रतिलभ्य अर्जुन उवाच लब्धसमाधिप्रज्ञस्य लक्षणबुभुत्सया—\nअर्जुन उवाच—\nस्थितप्रज्ञस्य का भाषा समाधिस्थस्य केशव। स्थितधीः किं पृभाषेत किमासीत व्रजेत किम्॥ ५४॥", "padacchedaText": "", "audioFile": "PB_000422.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000423", "originalText": "स्थिता प्रतिष्ठिता ‘अहमस्मि परं ब्रह्म’ इति प्रज्ञा यस्य सः स्थितप्रज्ञः तस्य स्थितप्रज्ञस्य का भाषा किं भाषणं वचनं कथमसौ परैर्भाष्यते समाधिस्थस्य समाधौ स्थितस्य हे केशव।", "padacchedaText": "", "audioFile": "PB_000423.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000424", "originalText": "स्थितधीः स्थितप्रज्ञः स्वयं वा किं प्रभाषेत।", "padacchedaText": "", "audioFile": "PB_000424.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000425", "originalText": "किम् आसीत व्रजेत किम् आसनं व्रजनं वा तस्य कथमित्यर्थः। स्थितप्रज्ञस्य लक्षणमनेन श्लोकेन पृच्छ्यते॥ ५४॥", "padacchedaText": "", "audioFile": "PB_000425.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000426", "originalText": "यो ह्यादित एव संन्यस्य कर्माणि ज्ञानयोगनिष्ठायां प्रवृत्तः, यश्च कर्मयोगेन, तयोः ‘प्रजहाति’ इत्यारभ्य आ अध्यायपरिसमाप्तेः स्थितप्रज्ञलक्षणं साधनं चोपदिश्यते।", "padacchedaText": "", "audioFile": "PB_000426.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000427", "originalText": "सर्वत्रैव हि अध्यात्मशास्त्रे कृतार्थलक्षणानि यानि तान्येव साधनानि उपदिश्यन्ते, यत्नसाध्यत्वात्।", "padacchedaText": "", "audioFile": "PB_000427.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000428", "originalText": "यानि यत्नसाध्यानि साधनानि लक्षणानि च भवन्ति तानि श्रीभगवानुवाच—\nश्रीभगवानुवाच—\nप्रजहाति यदा कामान्सर्वान्पार्थ मनोगतान्। आत्मन्येवात्मना तुष्टः स्थितप्रज्ञस्तदोच्यते॥ ५५॥", "padacchedaText": "", "audioFile": "PB_000428.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000429", "originalText": "प्रजहाति प्रकर्षेण जहाति परित्यजति यदा यस्मिन्काले सर्वान् समस्तान् कामान् इच्छाभेदान् हे पार्थ, मनोगतान् मनसि प्रविष्टान् हृदि प्रविष्टान्।", "padacchedaText": "", "audioFile": "PB_000429.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000430", "originalText": "सर्वकामपरित्यागे तुष्टिकारणाभावात् शरीरधारणनिमित्तशेषे च सति उन्मत्तप्रमत्तस्येव प्रवृत्तिः प्राप्ता, इत्यत उच्यते— आत्मन्येव प्रत्यगात्मस्वरूपे एव आत्मना स्वेनैव बाह्यलाभनिरपेक्षः तुष्टः परमार्थदर्शनामृतरसलाभेन अन्यस्मादलंप्रत्ययवान् स्थितप्रज्ञः स्थिता प्रतिष्ठिता आत्मानात्मविवेकजा प्रज्ञा यस्य सः स्थितप्रज्ञः विद्वान् तदा उच्यते।", "padacchedaText": "", "audioFile": "PB_000430.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000431", "originalText": "त्यक्तपुत्रवित्तलोकैषणः संन्यासी आत्माराम आत्मक्रीडः स्थितप्रज्ञ इत्यर्थः॥ ५५॥", "padacchedaText": "", "audioFile": "PB_000431.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000432", "originalText": "किञ्च—\nदुःखेष्वनुद्विग्नमनाः सुखेषु विगतस्पृहः। वीतरागभयक्रोधः स्थितधीर्मुनिरुच्यते॥ ५६॥", "padacchedaText": "", "audioFile": "PB_000432.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000433", "originalText": "दुःखेषु आध्यात्मिकादिषु प्राप्तेषु न उद्विग्नं न प्रक्षुभितं दुःखप्राप्तौ मनो यस्य सोऽयम् अनुद्विग्नमनाः।", "padacchedaText": "", "audioFile": "PB_000433.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000434", "originalText": "तथा सुखेषु प्राप्तेषु विगता स्पृहा तृष्णा यस्य, न अग्निरिव इन्धनाद्याधाने सुखान्यनु विवर्धते स विगतस्पृहः।", "padacchedaText": "", "audioFile": "PB_000434.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000435", "originalText": "वीतरागभयक्रोधः रागश्च भयं च क्रोधश्च वीता विगता यस्मात् स वीतरागभयक्रोधः। स्थितधीः स्थितप्रज्ञो मुनिः संन्यासी तदा उच्यते॥ ५६॥", "padacchedaText": "", "audioFile": "PB_000435.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000436", "originalText": "किञ्च—\nयः सर्वत्रानभिस्नेहस्तत्तत्प्राप्य शुभाशुभम्। नाभिनन्दति न द्वेष्टि तस्य प्रज्ञा प्रतिष्ठिता॥ ५७॥", "padacchedaText": "", "audioFile": "PB_000436.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000437", "originalText": "यः मुनिः सर्वत्र देहजीवितादिष्वपि अनभिस्नेहः अभिस्नेहवर्जितः तत्तत् प्राप्य शुभाशुभं तत्तत् शुभं अशुभं वा लब्ध्वा न अभिनन्दति न द्वेष्टि शुभं प्राप्य न तुष्यति न हृष्यति, अशुभं च प्राप्य न द्वेष्टि इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000437.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000438", "originalText": "तस्य एवं हर्षविषादवर्जितस्य विवेकजा प्रज्ञा प्रतिष्ठिता भवति॥ ५७॥", "padacchedaText": "", "audioFile": "PB_000438.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000439", "originalText": "किञ्च—\nयदा संहरते चायं कूर्मोऽङ्गानीव सर्वशः। इन्द्रियाणीन्द्रियार्थेभ्यस्तस्य प्रज्ञा प्रतिष्ठिता॥ ५८॥", "padacchedaText": "", "audioFile": "PB_000439.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000440", "originalText": "यदा संहरते सम्यगुपसंहरते च अयं ज्ञाननिष्ठायां प्रवृत्तो यतिः कूर्मः अङ्गानि इव यथा कूर्मः भयात् स्वान्यङ्गानि उपसंहरति सर्वशः सर्वतः, एवं ज्ञाननिष्ठः इन्द्रियाणि इन्द्रियार्थेभ्यः सर्वविषयेभ्यः उपसंहरते।", "padacchedaText": "", "audioFile": "PB_000440.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000441", "originalText": "तस्य प्रज्ञा प्रतिष्ठिता इत्युक्तार्थं वाक्यम्॥ ५८॥", "padacchedaText": "", "audioFile": "PB_000441.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000442", "originalText": "तत्र विषयाननाहरतः आतुरस्यापि इन्द्रियाणि कूर्माङ्गानीव संह्रियन्ते न तु तद्विषयो रागः स कथं संह्रियते इति उच्यते—\nविषया विनिवर्तन्ते निराहारस्य देहिनः।", "padacchedaText": "", "audioFile": "PB_000442.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000443", "originalText": "रसवर्जं रसोऽप्यस्य परं दृष्ट्वा निवर्तते॥ ५९॥", "padacchedaText": "", "audioFile": "PB_000443.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000444", "originalText": "यद्यपि विषयाः विषयोपलक्षितानि विषयशब्दवाच्यानि इन्द्रियाणि निराहारस्य अनाह्रियमाणविषयस्य कष्टे तपसि स्थितस्य मूर्खस्यापि विनिवर्तन्ते देहिनो देहवतः रसवर्जं रसो रागो विषयेषु यः तं वर्जयित्वा।", "padacchedaText": "", "audioFile": "PB_000444.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000445", "originalText": "रसशब्दो रागे प्रसिद्धः, स्वरसेन प्रवृत्तः रसिकः रसज्ञः, इत्यादिदर्शनात्।", "padacchedaText": "", "audioFile": "PB_000445.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000446", "originalText": "सोऽपि रसो रञ्जनारूपः सूक्ष्मः अस्य यतेः परं परमार्थतत्त्वं ब्रह्म दृष्ट्वा उपलभ्य ‘अहमेव तत्’ इति वर्तमानस्य निवर्तते निर्बीजं विषयविज्ञानं सम्पद्यते इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000446.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000447", "originalText": "न असति सम्यग्दर्शने रसस्य उच्छेदः। तस्मात् सम्यग्दर्शनात्मिकायाः प्रज्ञायाः स्थैर्यं कर्तव्यमित्यभिप्रायः॥ ५९॥", "padacchedaText": "", "audioFile": "PB_000447.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000448", "originalText": "सम्यग्दर्शनलक्षणप्रज्ञास्थैर्यं चिकीर्षता आदौ इन्द्रियाणि स्ववशे स्थापयितव्यानि, यस्मात्तदनवस्थापने दोषमाह—\nयततो ह्यपि कौन्तेय पुरुषस्य विपश्चितः। इन्द्रियाणि प्रमाथीनि हरन्ति प्रसभं मनः॥ ६०॥", "padacchedaText": "", "audioFile": "PB_000448.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000449", "originalText": "यततः प्रयत्नं कुर्वतः हि यस्मात् कौन्तेय पुरुषस्य विपश्चितः मेधाविनः अपि इति व्यवहितेन सम्बन्धः।", "padacchedaText": "", "audioFile": "PB_000449.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000450", "originalText": "इन्द्रियाणि प्रमाथीनि प्रमथनशीलानि विषयाभिमुखं हि पुरुषं विक्षोभयन्ति आकुलीकुर्वन्ति, आकुलीकृत्य च हरन्ति प्रसभं प्रसह्य प्रकाशमेव पश्यतो विवेकविज्ञानयुक्तं मनः॥ ६०॥", "padacchedaText": "", "audioFile": "PB_000450.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000451", "originalText": "यतः तस्मात्—\nतानि सर्वाणि संयम्य युक्त आसीत मत्परः। वशे हि यस्येन्द्रियाणि तस्य प्रज्ञा प्रतिष्ठिता॥ ६१॥", "padacchedaText": "", "audioFile": "PB_000451.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000452", "originalText": "तानि सर्वाणि संयम्य संयमनं वशीकरणं कृत्वा युक्तः समाहितः सन् आसीत मत्परः अहं वासुदेवः सर्वप्रत्यगात्मा परो यस्य सः मत्परः, ‘न अन्योऽहं तस्मात्’ इति आसीत इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000452.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000453", "originalText": "एवमासीनस्य यतेः वशे हि यस्य इन्द्रियाणि वर्तन्ते अभ्यासबलात् तस्य प्रज्ञा प्रतिष्ठिता॥ ६१॥", "padacchedaText": "", "audioFile": "PB_000453.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000454", "originalText": "अथेदानीं पराभविष्यतः सर्वानर्थमूलमिदमुच्यते—\nध्यायतो विषयान्पुंसः सङ्गस्तेषूपजायते। सङ्गात्सञ्जायते कामः कामात्क्रोधोऽभिजायते॥ ६२॥", "padacchedaText": "", "audioFile": "PB_000454.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000455", "originalText": "ध्यायतः चिन्तयतः विषयान् शब्दादीन् विषयविशेषान् आलोचयतः पुंसः पुरुषस्य सङ्गः आसक्तिः प्रीतिः तेषु विषयेषु उपजायते उत्पद्यते।", "padacchedaText": "", "audioFile": "PB_000455.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000456", "originalText": "सङ्गात् प्रीतेः सञ्जायते समुत्पद्यते कामः तृष्णा। कामात् कुतश्चित् प्रतिहतात् क्रोधः अभिजायते॥ ६२॥", "padacchedaText": "", "audioFile": "PB_000456.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000457", "originalText": "क्रोधाद्भवति संमोहः संमोहात्स्मृतिविभ्रमः। स्मृतिभ्रंशाद्बुद्धिनाशो बुद्धिनाशात्प्रणश्यति॥ ६३॥", "padacchedaText": "", "audioFile": "PB_000457.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000458", "originalText": "क्रोधात् भवति संमोहः अविवेकः कार्याकार्यविषयः।", "padacchedaText": "", "audioFile": "PB_000458.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000459", "originalText": "क्रुद्धो हि संमूढः सन् गुरुमप्याक्रोशति।", "padacchedaText": "", "audioFile": "PB_000459.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000460", "originalText": "संमोहात् स्मृतिविभ्रमः शास्त्राचार्योपदेशाहितसंस्कारजनितायाः स्मृतेः स्यात् विभ्रमो भ्रंशः स्मृत्युत्पत्तिनिमित्तप्राप्तौ अनुत्पत्तिः।", "padacchedaText": "", "audioFile": "PB_000460.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000461", "originalText": "ततः स्मृतिभ्रंशात् बुद्धिनाशः बुद्धेर्नाशः।", "padacchedaText": "", "audioFile": "PB_000461.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000462", "originalText": "कार्याकार्यविषयविवेकायोग्यता अन्तःकरणस्य बुद्धेर्नाश उच्यते।", "padacchedaText": "", "audioFile": "PB_000462.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000463", "originalText": "बुद्धिनाशात् प्रणश्यति।", "padacchedaText": "", "audioFile": "PB_000463.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000464", "originalText": "तावदेव हि पुरुषः यावदन्तःकरणं तदीयं कार्याकार्यविषयविवेकयोग्यम्।", "padacchedaText": "", "audioFile": "PB_000464.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000465", "originalText": "तदयोग्यत्वे नष्ट एव पुरुषो भवति। अतः तस्यान्तःकरणस्य बुद्धेर्नाशात् प्रणश्यति पुरुषार्थायोग्यो भवतीत्यर्थः॥ ६३॥", "padacchedaText": "", "audioFile": "PB_000465.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000466", "originalText": "सर्वानर्थस्य मूलमुक्तं विषयाभिध्यानम्।", "padacchedaText": "", "audioFile": "PB_000466.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000467", "originalText": "अथ इदानीं मोक्षकारणमिदमुच्यते—\nरागद्वेषवियुक्तैस्तु विषयानिन्द्रियैश्चरन्। आत्मवश्यैर्विधेयात्मा प्रसादमधिगच्छति॥ ६४॥", "padacchedaText": "", "audioFile": "PB_000467.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000468", "originalText": "रागद्वेषवियुक्तैः रागश्च द्वेषश्च रागद्वेषौ, तत्पुरःसरा हि इन्द्रियाणां प्रवृत्तिः स्वाभाविकी, तत्र यो मुमुक्षुः भवति सः ताभ्यां वियुक्तैः श्रोत्रादिभिः इन्द्रियैः विषयान् अवर्जनीयान् चरन् उपलभमानः आत्मवश्यैः आत्मनः वश्यानि वशीभूतानि इन्द्रियाणि तैः आत्मवश्यैः विधेयात्मा इच्छातः विधेयः आत्मा अन्तःकरणं यस्य सः अयं प्रसादम् अधिगच्छति।", "padacchedaText": "", "audioFile": "PB_000468.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000469", "originalText": "प्रसादः प्रसन्नता स्वास्थ्यम्॥ ६४॥", "padacchedaText": "", "audioFile": "PB_000469.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000470", "originalText": "प्रसादे सति किं स्यात् इत्युच्यते—\nप्रसादे सर्वदुःखानां हानिरस्योपजायते। प्रसन्नचेतसो ह्याशु बुद्धिः पर्यवतिष्ठते॥ ६५॥", "padacchedaText": "", "audioFile": "PB_000470.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000471", "originalText": "प्रसादे सर्वदुःखानाम् आध्यात्मिकादीनां हानिः विनाशः अस्य यतेः उपजायते। किञ्च— प्रसन्नचेतसः स्वस्थान्तःकरणस्य हि यस्मात् आशु शीघ्रं बुद्धिः पर्यवतिष्ठते आकाशमिव परि समन्तात् अवतिष्ठते, आत्मस्वरूपेणैव निश्चलीभवतीत्यर्थः॥", "padacchedaText": "", "audioFile": "PB_000471.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000472", "originalText": "एवं प्रसन्नचेतसः अवस्थितबुद्धेः कृतकृत्यता यतः, तस्मात् रागद्वेषवियुक्तैः इन्द्रियैः शास्त्राविरुद्धेषु अवर्जनीयेषु युक्तः समाचरेत् इति वाक्यार्थः॥ ६५॥", "padacchedaText": "", "audioFile": "PB_000472.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000473", "originalText": "सेयं प्रसन्नता स्तूयते—\nनास्ति बुद्धिरयुक्तस्य न चायुक्तस्य भावना। न चाभावयतः शान्तिरशान्तस्य कुतः सुखम्॥ ६६॥", "padacchedaText": "", "audioFile": "PB_000473.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000474", "originalText": "नास्ति न विद्यते न भवतीत्यर्थः, बुद्धिः आत्मस्वरूपविषया अयुक्तस्य असमाहितान्तःकरणस्य।", "padacchedaText": "", "audioFile": "PB_000474.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000475", "originalText": "न च अस्ति अयुक्तस्य भावना आत्मज्ञानाभिनिवेशः।", "padacchedaText": "", "audioFile": "PB_000475.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000476", "originalText": "तथा— न च अस्ति अभावयतः आत्मज्ञानाभिनिवेशमकुर्वतः शान्तिः उपशमः।", "padacchedaText": "", "audioFile": "PB_000476.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000477", "originalText": "अशान्तस्य कुतः सुखम्? इन्द्रियाणां हि विषयसेवातृष्णातः निवृत्तिर्या तत्सुखम्, न विषयविषया तृष्णा।", "padacchedaText": "", "audioFile": "PB_000477.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000478", "originalText": "दुःखमेव हि सा। न तृष्णायां सत्यां सुखस्य गन्धमात्रमप्युपपद्यते इत्यर्थः॥ ६६॥", "padacchedaText": "", "audioFile": "PB_000478.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000479", "originalText": "अयुक्तस्य कस्माद्बुद्धिर्नास्ति इत्युच्यते—\nइन्द्रियाणां हि चरतां यन्मनोऽनुविधीयते। तदस्य हरति प्रज्ञां वायुर्नावमिवाम्भसि॥ ६७॥", "padacchedaText": "", "audioFile": "PB_000479.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000480", "originalText": "इन्द्रियाणां हि यस्मात् चरतां स्वस्वविषयेषु प्रवर्तमानानां यत् मनः अनुविधीयते अनुप्रवर्तते तत् इन्द्रियविषयविकल्पनेन प्रवृत्तं मनः अस्य यतेः हरति प्रज्ञाम् आत्मानात्मविवेकजां नाशयति।", "padacchedaText": "", "audioFile": "PB_000480.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000481", "originalText": "कथम्? वायुः नावमिव अम्भसि उदके जिगमिषतां मार्गादुद्धृत्य उन्मार्गे यथा वायुः नावं प्रवर्तयति, एवमात्मविषयां प्रज्ञां हृत्वा मनो विषयविषयां करोति॥ ६७॥", "padacchedaText": "", "audioFile": "PB_000481.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000482", "originalText": "‘यततो हि’ (भ.गी.२.६०) इत्युपन्यस्तस्यार्थस्य अनेकधा उपपत्तिमुक्त्वा तं चार्थमुपपाद्य उपसंहरति—\nतस्माद्यस्य महाबाहो निगृहीतानि सर्वशः। इन्द्रियाणीन्द्रियार्थेभ्यस्तस्य प्रज्ञा प्रतिष्ठिता॥ ६८॥", "padacchedaText": "", "audioFile": "PB_000482.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000483", "originalText": "इन्द्रियाणां प्रवृत्तौ दोष उपपादितो यस्मात्, तस्मात् यस्य यतेः हे महाबाहो, निगृहीतानि सर्वशः सर्वप्रकारैः मानसादिभेदैः इन्द्रियाणि इन्द्रियार्थेभ्यः शब्दादिभ्यः तस्य प्रज्ञा प्रतिष्ठिता॥ ६८॥", "padacchedaText": "", "audioFile": "PB_000483.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000484", "originalText": "योऽयं लौकिको वैदिकश्च व्यवहारः स उत्पन्नविवेकज्ञानस्य स्थितप्रज्ञस्य अविद्याकार्यत्वात् अविद्यानिवृत्तौ निवर्तते, अविद्यायाश्च विद्याविरोधात् निवृत्तिः, इत्येतमर्थं स्फुटीकुर्वन् आह—\nया निशा सर्वभूतानां तस्यां जागर्ति संयमी।", "padacchedaText": "", "audioFile": "PB_000484.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000485", "originalText": "यस्यां जाग्रति भूतानि सा निशा पश्यतो मुनेः॥ ६९॥", "padacchedaText": "", "audioFile": "PB_000485.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000486", "originalText": "या निशा रात्रिः सर्वपदार्थानामविवेककरी तमःस्वभावत्वात् सर्वभूतानां सर्वेषां भूतानाम्।", "padacchedaText": "", "audioFile": "PB_000486.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000487", "originalText": "किं तत् परमार्थतत्त्वं स्थितप्रज्ञस्य विषयः।", "padacchedaText": "", "audioFile": "PB_000487.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000488", "originalText": "यथा नक्तञ्चराणाम् अहरेव सदन्येषां निशा भवति, तद्वत् नक्तञ्चरस्थानीयानामज्ञानां सर्वभूतानां निशेव निशा परमार्थतत्त्वम्, अगोचरत्वादतद्बुद्धीनाम्।", "padacchedaText": "", "audioFile": "PB_000488.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000489", "originalText": "तस्यां परमार्थतत्त्वलक्षणायामज्ञाननिद्रायाः प्रबुद्धो जागर्ति संयमी संयमवान्, जितेन्द्रियो योगीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000489.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000490", "originalText": "यस्यां ग्राह्यग्राहकभेदलक्षणायामविद्यानिशायां प्रसुप्तान्येव भूतानि जाग्रति इति उच्यन्ते, यस्यां निशायां प्रसुप्ता इव स्वप्नदृशः, सा निशा अविद्यारूपत्वात् परमार्थतत्त्वं पश्यतो मुनेः॥", "padacchedaText": "", "audioFile": "PB_000490.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000491", "originalText": "अतः कर्माणि अविद्यावस्थायामेव चोद्यन्ते, न विद्यावस्थायाम्।", "padacchedaText": "", "audioFile": "PB_000491.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000492", "originalText": "विद्यायां हि सत्याम् उदिते सवितरि शार्वरमिव तमः प्रणाशमुपगच्छति अविद्या।", "padacchedaText": "", "audioFile": "PB_000492.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000493", "originalText": "प्राक् विद्योत्पत्तेः अविद्या प्रमाणबुद्ध्या गृह्यमाणा क्रियाकारकफलभेदरूपा सती सर्वकर्महेतुत्वं प्रतिपद्यते।", "padacchedaText": "", "audioFile": "PB_000493.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000494", "originalText": "न अप्रमाणबुद्ध्या गृह्यमाणायाः कर्महेतुत्वोपपत्तिः, ‘प्रमाणभूतेन वेदेन मम चोदितं कर्तव्यं कर्म’ इति हि कर्मणि कर्ता प्रवर्तते, न ‘अविद्यामात्रमिदं सर्वं निशेव’ इति।", "padacchedaText": "", "audioFile": "PB_000494.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000495", "originalText": "यस्य पुनः ‘निशेव अविद्यामात्रमिदं सर्वं भेदजातम्’ इति ज्ञानं तस्य आत्मज्ञस्य सर्वकर्मसंन्यासे एव अधिकारो न प्रवृत्तौ। तथा च दर्शयिष्यति— ‘तद्बुद्धयस्तदात्मानः’ (भ.गी.५.१७) इत्यादिना ज्ञाननिष्ठायामेव तस्य अधिकारम्॥", "padacchedaText": "", "audioFile": "PB_000495.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000496", "originalText": "तत्रापि प्रवर्तकप्रमाणाभावे प्रवृत्त्यनुपपत्तिः इति चेत्, न, स्वात्मविषयत्वादात्मविज्ञानस्य।", "padacchedaText": "", "audioFile": "PB_000496.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000497", "originalText": "न हि आत्मनः स्वात्मनि प्रवर्तकप्रमाणापेक्षता, आत्मत्वादेव।", "padacchedaText": "", "audioFile": "PB_000497.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000498", "originalText": "तदन्तत्वाच्च सर्वप्रमाणानां प्रमाणत्वस्य।", "padacchedaText": "", "audioFile": "PB_000498.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000499", "originalText": "न हि आत्मस्वरूपाधिगमे सति पुनः प्रमाणप्रमेयव्यवहारः सम्भवति।", "padacchedaText": "", "audioFile": "PB_000499.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000500", "originalText": "प्रमातृत्वं हि आत्मनः निवर्तयति अन्त्यं प्रमाणम्, निवर्तयदेव च अप्रमाणीभवति, स्वप्नकालप्रमाणमिव प्रबोधे।", "padacchedaText": "", "audioFile": "PB_000500.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000501", "originalText": "लोके च वस्त्वधिगमे प्रवृत्तिहेतुत्त्वादर्शनात् प्रमाणस्य। तस्मात् न आत्मविदः कर्मण्यधिकार इति सिद्धम्॥ ६९॥", "padacchedaText": "", "audioFile": "PB_000501.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000502", "originalText": "विदुषः त्यक्तैषणस्य स्थितप्रज्ञस्य यतेरेव मोक्षप्राप्तिः, न तु असंन्यासिनः कामकामिनः इत्येतमर्थं दृष्टान्तेन प्रतिपादयिष्यन् आह—\nआपूर्यमाणमचलप्रतिष्ठं समुद्रमापः प्रविशन्ति यद्वत्।", "padacchedaText": "", "audioFile": "PB_000502.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000503", "originalText": "तद्वत्कामा यं प्रविशन्ति सर्वे स शान्तिमाप्नोति न कामकामी॥ ७०॥", "padacchedaText": "", "audioFile": "PB_000503.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000504", "originalText": "आपूर्यमाणम् अद्भिः अचलप्रतिष्ठम् अचलतया प्रतिष्ठा अवस्थितिः यस्य तम् अचलप्रतिष्ठं समुद्रम् आपः सर्वतो गताः प्रविशन्ति स्वात्मस्थमविक्रियमेव सन्तं यद्वत्, तद्वत् कामाः विषयसंनिधावपि सर्वतः इच्छाविशेषाः यं पुरुषम्— समुद्रमिव आपः— अविकुर्वन्तः प्रविशन्ति सर्वे आत्मन्येव प्रलीयन्ते न स्वात्मवशं कुर्वन्ति, सः शान्तिं मोक्षम् आप्नोति, न इतरः कामकामी, काम्यन्त इति कामाः विषयाः तान् कामयितुं शीलं यस्य सः कामकामी, नैव प्राप्नोति इत्यर्थः॥ ७०॥", "padacchedaText": "", "audioFile": "PB_000504.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000505", "originalText": "यस्मादेवं तस्मात्—\nविहाय कामान्यः सर्वान्पुमांश्चरति निःस्पृहः। निर्ममो निरहङ्कारः स शान्तिमधिगच्छति॥ ७१॥", "padacchedaText": "", "audioFile": "PB_000505.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000506", "originalText": "विहाय परित्यज्य कामान् यः संन्यासी पुमान् सर्वान् अशेषतः कार्‌त्स्न्येन चरति, जीवनमात्रचेष्टाशेषः पर्यटतीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000506.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000507", "originalText": "निःस्पृहः शरीरजीवनमात्रेऽपि निर्गता स्पृहा यस्य सः निःस्पृहः सन्, निर्ममः शरीरजीवनमात्राक्षिप्तपरिग्रहेऽपि ममेदम् इत्यपभिनिवेशवर्जितः, निरहङ्कारः विद्यावत्त्वादिनिमित्तात्मसम्भावनारहितः इत्येतत्।", "padacchedaText": "", "audioFile": "PB_000507.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000508", "originalText": "सः एवंभूतः स्थितप्रज्ञः ब्रह्मवित् शान्तिं सर्वसंसारदुःखोपरमलक्षणां निर्वाणाख्याम् अधिगच्छति प्राप्नोति ब्रह्मभूतो भवति इत्यर्थः॥ ७१॥", "padacchedaText": "", "audioFile": "PB_000508.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000509", "originalText": "सैषा ज्ञाननिष्ठा स्तूयते—\nएषा ब्राह्मी स्थितिः पार्थ नैनां प्राप्य विमुह्यति। स्थित्वास्यामन्तकालेऽपि ब्रह्मनिर्वाणमृच्छति॥ ७२॥", "padacchedaText": "", "audioFile": "PB_000509.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000510", "originalText": "एषा यथोक्ता ब्राह्मी ब्रह्मणि भवा इयं स्थितिः सर्वं कर्म संन्यस्य ब्रह्मरूपेणैव अवस्थानम् इत्येतत्।", "padacchedaText": "", "audioFile": "PB_000510.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000511", "originalText": "हे पार्थ, न एनां स्थितिं प्राप्य लब्ध्वा न विमुह्यति न मोहं प्राप्नोति।", "padacchedaText": "", "audioFile": "PB_000511.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000512", "originalText": "स्थित्वा अस्यां स्थितौ ब्राह्म्यां यथोक्तायां अन्तकालेऽपि अन्त्ये वयस्यपि ब्रह्मनिर्वाणं ब्रह्मनिर्वृतिं मोक्षम् ऋच्छति गच्छति। किमु वक्तव्यं ब्रह्मचर्यादेव संन्यस्य यावज्जीवं यो ब्रह्मण्येव अवतिष्ठते स ब्रह्मनिर्वाणमृच्छति इति॥ ७२॥", "padacchedaText": "", "audioFile": "PB_000512.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000513", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ श्रीमत्भगवद्गीताभाष्ये द्वितीयोऽध्यायः॥", "padacchedaText": "", "audioFile": "PB_000513.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000514", "originalText": "तृतीयोऽध्यायः\nशास्त्रस्य प्रवृत्तिनिवृत्तिविषयभूते द्वे बुद्धी भगवता निर्दिष्टे, साङ्‍ख्ये बुद्धिः योगे बुद्धिः इति च।", "padacchedaText": "", "audioFile": "PB_000514.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000515", "originalText": "तत्र ‘प्रजहाति यदा कामान्’ (भ.गी.२.५५) इत्यारभ्य आ अध्यायपरिसमाप्तेः साङ्‍ख्यबुद्ध्याश्रितानां संन्यासं कर्तव्यमुक्त्वा तेषां तन्निष्ठतयैव च कृतार्थता उक्ता— ‘एषा ब्राह्मी स्थितिः’ (भ.गी.२.७२) इति।", "padacchedaText": "", "audioFile": "PB_000515.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000516", "originalText": "अर्जुनाय च ‘कर्मण्येवाधिकारस्ते... मा ते सङ्गोऽस्त्वकर्मणि’ (भ.गी.२.४७) इति कर्मैव कर्तव्यमुक्तवान् योगबुद्धिमाश्रित्य, न तत एव श्रेयःप्राप्तिम् उक्तवान्।", "padacchedaText": "", "audioFile": "PB_000516.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000517", "originalText": "तदेतदालक्ष्य पर्याकुलीकृतबुद्धिः अर्जुनः उवाच।", "padacchedaText": "", "audioFile": "PB_000517.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000518", "originalText": "कथं भक्ताय श्रेयोर्थिने यत् साक्षात् श्रेयःप्राप्तिसाधनं साङ्‍ख्यबुद्धिनिष्ठां श्रावयित्वा मां कर्मणि दृष्टानेकानर्थयुक्ते पारम्पर्येणापि अनैकान्तिकश्रेयःप्राप्तिफले नियुञ्ज्यात् इति युक्तः पर्याकुलीभावः अर्जुनस्य, तदनुरूपश्च प्रश्नः ‘ज्यायसी चेत्’ (भ.गी.३.१) इत्यादिः, प्रश्नापाकरणवाक्यं च भगवतः युक्तं यथोक्तविभागविषये शास्त्रे॥", "padacchedaText": "", "audioFile": "PB_000518.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000519", "originalText": "केचित्तु— अर्जुनस्य प्रश्नार्थमन्यथा कल्पयित्वा तत्प्रतिकूलं भगवतः प्रतिवचनं वर्णयन्ति, यथा च आत्मना सम्बन्धग्रन्थे गीतार्थो निरूपितः तत्प्रतिकूलं च इह पुनः प्रश्नप्रतिवचनयोः अर्थं निरूपयन्ति।", "padacchedaText": "", "audioFile": "PB_000519.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000520", "originalText": "कथम्? तत्र सम्बन्धग्रन्थे तावत्— सर्वेषामाश्रमिणां ज्ञानकर्मणोः समुच्चयः गीताशास्त्रे निरूपितः अर्थः इत्युक्तम्, पुनः विशेषितं च यावज्जीवश्रुतिचोदितानि कर्माणि परित्यज्य केवलादेव ज्ञानात् मोक्षः प्राप्यते इत्येतत् एकान्तेनैव प्रतिषिद्धमिति।", "padacchedaText": "", "audioFile": "PB_000520.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000521", "originalText": "इह तु आश्रमविकल्पं दर्शयता यावज्जीवश्रुतिचोदितानामेव कर्मणां परित्याग उक्तः। तत् कथम् ईदृशं विरुद्धमर्थम् अर्जुनाय ब्रूयात् भगवान्, श्रोता वा कथं विरुद्धमर्थमवधारयेत्॥", "padacchedaText": "", "audioFile": "PB_000521.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000522", "originalText": "तत्रैतत् स्यात्— गृहस्थानामेव श्रौतकर्मपरित्यागेन केवलादेव ज्ञानात् मोक्षः प्रतिषिध्यते, न तु आश्रमान्तराणामिति।", "padacchedaText": "", "audioFile": "PB_000522.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000523", "originalText": "एतदपि पूर्वोत्तरविरुद्धमेव।", "padacchedaText": "", "audioFile": "PB_000523.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000524", "originalText": "कथम्? सर्वाश्रमिणां ज्ञानकर्मणोः समुच्चयो गीताशास्त्रे निश्चितः अर्थः इति प्रतिज्ञाय इह कथं तद्विरुद्धं केवलादेव ज्ञानात् मोक्षं ब्रूयात् आश्रमान्तराणाम्॥", "padacchedaText": "", "audioFile": "PB_000524.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000525", "originalText": "अथ मतं श्रौतकर्मापेक्षया एतद्वचनम् ‘केवलादेव ज्ञानात् श्रौतकर्मरहितात् गृहस्थानां मोक्षः प्रतिषिध्यते’ इति, तत्र गृहस्थानां विद्यमानमपि स्मार्तं कर्म अविद्यमानवत् उपेक्ष्य ‘ज्ञानादेव केवलात्’ इत्युच्यते इति।", "padacchedaText": "", "audioFile": "PB_000525.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000526", "originalText": "एतदपि विरुद्धम्।", "padacchedaText": "", "audioFile": "PB_000526.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000527", "originalText": "कथम्? गृहस्थस्यैव स्मार्तकर्मणा समुच्चितात् ज्ञानात् मोक्षः प्रतिषिध्यते न तु आश्रमान्तराणामिति कथं विवेकिभिः शक्यमवधारयितुम्। किञ्च— यदि मोक्षसाधनत्वेन स्मार्तानि कर्माणि ऊर्ध्वरेतसां समुच्चीयन्ते तथा गृहस्थस्यापि इष्यतां स्मार्तैरेव समुच्चयो न श्रौतैः॥", "padacchedaText": "", "audioFile": "PB_000527.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000528", "originalText": "अथ श्रौतैः स्मार्तैश्च गृहस्थस्यैव समुच्चयः मोक्षाय, ऊर्ध्वरेतसां तु स्मार्तकर्ममात्रसमुच्चितात् ज्ञानात् मोक्ष इति। तत्रैवं सति गृहस्थस्य आयासबाहुल्यात्, श्रौतं स्मार्तं च बहुदुःखरूपं कर्म शिरसि आरोपितं स्यात्॥", "padacchedaText": "", "audioFile": "PB_000528.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000529", "originalText": "अथ गृहस्थस्यैव आयासबाहुल्यकारणात् मोक्षः स्यात्, न आश्रमान्तराणां श्रौतनित्यकर्मरहितत्वात् इति। तदप्यसत्, सर्वोपनिषत्सु इतिहासपुराणयोगशास्त्रेषु च ज्ञानाङ्गत्वेन मुमुक्षोः सर्वकर्मसंन्यासविधानात्, आश्रमविकल्पसमुच्चयविधानाच्च श्रुतिस्मृत्योः॥", "padacchedaText": "", "audioFile": "PB_000529.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000530", "originalText": "सिद्धस्तर्हि सर्वाश्रमिणां ज्ञानकर्मणोः समुच्चयः— न, मुमुक्षोः सर्वकर्मसंन्यासविधानात्।", "padacchedaText": "", "audioFile": "PB_000530.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000531", "originalText": "‘पुत्रैषणाया वित्तैषणायाश्च लोकैषणायाश्च व्युत्थायाथ भिक्षाचर्यं चरन्ति’ (बृ.३.५.१) ‘तस्मात् न्यासमेषां तपसामतिरिक्तमाहुः’ (तै.ना.७९) ‘न्यास एवात्यरेचयत्’ (तै.ना.७८) इति, ‘न कर्मणा न प्रजया धनेन त्यागेनैके अमृतत्वमानशुः’ (तै.ना.१२) इति च।", "padacchedaText": "", "audioFile": "PB_000531.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000532", "originalText": "‘ब्रह्मचर्यादेव प्रव्रजेत्’ (जा.४) इत्याद्याः श्रुतयः।", "padacchedaText": "", "audioFile": "PB_000532.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000533", "originalText": "‘त्यज धर्ममधर्मं च उभे सत्यानृते त्यज।", "padacchedaText": "", "audioFile": "PB_000533.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000534", "originalText": "उभे सत्यानृते त्यक्त्वा येन त्यजसि तत्त्यज।", "padacchedaText": "", "audioFile": "PB_000534.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000535", "originalText": "’ (मो.ध.३२९.४०) ‘संसारमेव निःसारं दृष्ट्वा सारदिदृक्षया।", "padacchedaText": "", "audioFile": "PB_000535.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000536", "originalText": "प्रव्रजन्त्यकृतोद्वाहाः परं वैराग्यमाश्रिताः’ (?) इति बृहस्पतिः।", "padacchedaText": "", "audioFile": "PB_000536.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000537", "originalText": "‘कर्मणा बध्यते जन्तुर्विद्यया च विमुच्यते।", "padacchedaText": "", "audioFile": "PB_000537.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000538", "originalText": "तस्मात्कर्म न कुर्वन्ति यतयः पारदर्शिनः’ (मो.ध.२४१.७) इति शुकानुशासनम्। इहापि च ‘सर्वकर्माणि मनसा संन्यस्य’ (भ.गी.५.१३) इत्यादि॥", "padacchedaText": "", "audioFile": "PB_000538.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000539", "originalText": "मोक्षस्य च अकार्यत्वात् मुमुक्षोः कर्मानर्थक्यम्।", "padacchedaText": "", "audioFile": "PB_000539.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000540", "originalText": "नित्यानि प्रत्यवायपरिहारार्थानि इति चेत्, न, असंन्यासिविषयत्वात् प्रत्यवायप्राप्तेः।", "padacchedaText": "", "audioFile": "PB_000540.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000541", "originalText": "न हि अग्निकार्याद्यकरणात् संन्यासिनः प्रत्यवायः कल्पयितुं शक्यः, यथा ब्रह्मचारिणामसंन्यासिनामपि कर्मिणाम्।", "padacchedaText": "", "audioFile": "PB_000541.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000542", "originalText": "न तावत् नित्यानां कर्मणामभावादेव भावरूपस्य प्रत्यवायस्य उत्पत्तिः कल्पयितुं शक्या, ‘कथमसतः सज्जायेत’ (छा.६.२.२) इति असतः सज्जन्मासम्भवश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000542.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000543", "originalText": "यदि विहिताकरणात् असम्भाव्यमपि प्रत्यवायं ब्रूयात् वेदः, तदा अनर्थकरः वेदः अप्रमाणमित्युक्तं स्यात्, विहितस्य करणाकरणयोः दुःखमात्रफलत्वात्।", "padacchedaText": "", "audioFile": "PB_000543.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000544", "originalText": "तथा च कारकं शास्त्रं न ज्ञापकम् इत्यनुपपन्नार्थं कल्पितं स्यात्।", "padacchedaText": "", "audioFile": "PB_000544.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000545", "originalText": "न चैतदिष्टम्।", "padacchedaText": "", "audioFile": "PB_000545.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000546", "originalText": "तस्मात् न संन्यासिनां कर्माणि। अतो ज्ञानकर्मणोः समुच्चयानुपपत्तिः, ‘ज्यायसी चेत् कर्मणस्ते मता बुद्धिः’ (भ.गी.३.१) इति अर्जुनस्य प्रश्नानुपपत्तेश्च॥", "padacchedaText": "", "audioFile": "PB_000546.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000547", "originalText": "यदि हि भगवता द्वितीयेऽध्याये ज्ञानं कर्म च समुच्चित्य त्वया अनुष्ठेयम् इत्युक्तं स्यात्, ततः अर्जुनस्य प्रश्नः अनुपपन्नः ‘ज्यायसी चेत्कर्मणस्ते मता बुद्धिः’ (भ.गी.३.१) इति।", "padacchedaText": "", "audioFile": "PB_000547.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000548", "originalText": "अर्जुनाय चेत् बुद्धिकर्मणी त्वया अनुष्ठेये इत्युक्ते, या कर्मणो ज्यायसी बुद्धिः सापि उक्तैव इति ‘तत् किं कर्मणि घोरे मां नियोजयसि केशव’ (भ.गी.३.१) इति उपालम्भः प्रश्नो वा न कथञ्चन उपपद्यते।", "padacchedaText": "", "audioFile": "PB_000548.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000549", "originalText": "न च अर्जुनस्यैव ज्यायसी बुद्धिः न अनुष्ठेया इति भगवता उक्तं पूर्वम् इति कल्पयितुं युक्तम्, येन ‘ज्यायसी चेत्’ इति विवेकतः प्रश्नः स्यात्॥", "padacchedaText": "", "audioFile": "PB_000549.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000550", "originalText": "यदि पुनः एकस्य पुरुषस्य ज्ञानकर्मणोर्विरोधात् युगपदनुष्ठानं न सम्भवतीति भिन्नपुरुषानुष्ठेयत्वं भगवता पूर्वमुक्तं स्यात्, ततोऽयं प्रश्न उपपन्नः ‘ज्यायसी चेत्’ इत्यादिः।", "padacchedaText": "", "audioFile": "PB_000550.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000551", "originalText": "अविवेकतः प्रश्नकल्पनायामपि भिन्नपुरुषानुष्ठेयत्वेन ज्ञानकर्मनिष्ठयोः भगवतः प्रतिवचनं नोपपद्यते।", "padacchedaText": "", "audioFile": "PB_000551.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000552", "originalText": "न च अज्ञाननिमित्तं भगवत्प्रतिवचनं कल्पनीयम्।", "padacchedaText": "", "audioFile": "PB_000552.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000553", "originalText": "अस्माच्च भिन्नपुरुषानुष्ठेयत्वेन ज्ञानकर्मनिष्ठयोः भगवतः प्रतिवचनदर्शनात् ज्ञानकर्मणोः समुच्चयानुपपत्तिः। तस्मात् केवलादेव ज्ञानात् मोक्ष इत्येषोऽर्थो निश्चितो गीतासु सर्वोपनिषत्सु च॥", "padacchedaText": "", "audioFile": "PB_000553.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000554", "originalText": "ज्ञानकर्मणोः ‘एकं वद निश्चित्य’ (भ.गी.३.२) इति च एकविषयैव प्रार्थना अनुपपन्ना, उभयोः समुच्चयसम्भवे। ‘कुरु कर्मैव तस्मात्त्वम्’ (भ.गी.४.१५) इति च ज्ञाननिष्ठासम्भवम् अर्जुनस्य अवधारणेन दर्शयिष्यति॥", "padacchedaText": "", "audioFile": "PB_000554.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000555", "originalText": "अर्जुन उवाच—\nज्यायसी चेत्कर्मणस्ते मता बुद्धिर्जनार्दन। तत्किं कर्मणि घोरे मां नियोजयसि केशव॥ १॥", "padacchedaText": "", "audioFile": "PB_000555.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000556", "originalText": "ज्यायसी श्रेयसी चेत् यदि कर्मणः सकाशात् ते तव मता अभिप्रेता बुद्धिर्ज्ञानं हे जनार्दन।", "padacchedaText": "", "audioFile": "PB_000556.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000557", "originalText": "यदि बुद्धिकर्मणी समुच्चिते इष्टे तदा एकं श्रेयःसाधनमिति कर्मणो ज्यायसी बुद्धिः इति कर्मणः अतिरिक्तकरणं बुद्धेरनुपपन्नम् अर्जुनेन कृतं स्यात्, न हि तदेव तस्मात् फलतोऽतिरिक्तं स्यात्।", "padacchedaText": "", "audioFile": "PB_000557.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000558", "originalText": "तथा च, कर्मणः श्रेयस्करी भगवतोक्ता बुद्धिः, अश्रेयस्करं च कर्म कुर्विति मां प्रतिपादयति, तत् किं नु कारणमिति भगवत उपालम्भमिव कुर्वन् तत् किं कस्मात् कर्मणि घोरे क्रूरे हिंसालक्षणे मां नियोजयसि केशव इति च यदाह, तच्च नोपपद्यते।", "padacchedaText": "", "audioFile": "PB_000558.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000559", "originalText": "अथ स्मार्तेनैव कर्मणा समुच्चयः सर्वेषां भगवता उक्तः अर्जुनेन च अवधारितश्चेत्, ‘तत्किं कर्मणि घोरे मां नियोजयसि’ (भ.गी.३.१) इत्यादि कथं युक्तं वचनम्॥ १॥", "padacchedaText": "", "audioFile": "PB_000559.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000560", "originalText": "किञ्च—\nव्यामिश्रेणेव वाक्येन बुद्धिं मोहयसीव मे। तदेकं वद निश्चित्य येन श्रेयोऽहमाप्नुयाम्॥ २॥", "padacchedaText": "", "audioFile": "PB_000560.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000561", "originalText": "व्यामिश्रेणेव, यद्यपि विविक्ताभिधायी भगवान्, तथापि मम मन्दबुद्धेः व्यामिश्रमिव भगवद्वाक्यं प्रतिभाति।", "padacchedaText": "", "audioFile": "PB_000561.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000562", "originalText": "तेन मम बुद्धिं मोहयसि इव, मम बुद्धिव्यामोहापनयाय हि प्रवृत्तः त्वं तु कथं मोहयसि? अतः ब्रवीमि बुद्धिं मोहयसि इव मे मम इति।", "padacchedaText": "", "audioFile": "PB_000562.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000563", "originalText": "त्वं तु भिन्नकर्तृकयोः ज्ञानकर्मणोः एकपुरुषानुष्ठानासम्भवं यदि मन्यसे, तत्रैवं सति तत् तयोः एकं बुद्धिं कर्म वा इदमेव अर्जुनस्य योग्यं बुद्धिशक्त्यवस्थानुरूपमिति निश्चित्य वद ब्रूहि, येन ज्ञानेन कर्मणा वा अन्यतरेण श्रेयः अहम् आप्नुयां प्राप्नुयाम्, इति यदुक्तं तदपि नोपपद्यते॥", "padacchedaText": "", "audioFile": "PB_000563.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000564", "originalText": "यदि हि कर्मनिष्ठायां गुणभूतमपि ज्ञानं भगवता उक्तं स्यात्, तत् कथं तयोः ‘एकं वद’ इति एकविषयैव अर्जुनस्य शुश्रूषा स्यात्। न हि भगवता पूर्वमुक्तम् ‘अन्यतरदेव ज्ञानकर्मणोः वक्ष्यामि, नैव द्वयम्’ इति, येन उभयप्राप्त्यसम्भवम् आत्मनो मन्यमानः एकमेव प्रार्थयेत्॥ २॥", "padacchedaText": "", "audioFile": "PB_000564.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000565", "originalText": "प्रश्नानुरूपमेव प्रतिवचनं श्रीभगवानुवाच—\nश्रीभगवानुवाच—\nलोकेऽस्मिन्द्विविधा निष्ठा पुरा प्रोक्ता मयानघ। ज्ञानयोगेन साङ्‍ख्यानां कर्मयोगेन योगिनाम्॥ ३॥", "padacchedaText": "", "audioFile": "PB_000565.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000566", "originalText": "लोके अस्मिन् शास्त्रार्थानुष्ठानाधिकृतानां त्रैवर्णिकानां द्विविधा द्विप्रकारा निष्ठा स्थितिः अनुष्ठेयतात्पर्यं पुरा पूर्वं सर्गादौ प्रजाः सृष्ट्वा तासाम् अभ्युदयनिःश्रेयसप्राप्तिसाधनं वेदार्थसम्प्रदायमाविष्कुर्वता प्रोक्ता मया सर्वज्ञेन ईश्वरेण हे अनघ अपाप।", "padacchedaText": "", "audioFile": "PB_000566.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000567", "originalText": "तत्र का सा द्विविधा निष्ठा इत्याह— तत्र ज्ञानयोगेन ज्ञानमेव योगः तेन साङ्ख्यानाम् आत्मानात्मविषयविवेकविज्ञानवतां ब्रह्मचर्याश्रमादेव कृतसंन्यासानां वेदान्तविज्ञानसुनिश्चितार्थानां परमहंसपरिव्राजकानां ब्रह्मण्येव अवस्थितानां निष्ठा प्रोक्ता।", "padacchedaText": "", "audioFile": "PB_000567.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000568", "originalText": "कर्मयोगेन कर्मैव योगः कर्मयोगः तेन कर्मयोगेन योगिनां कर्मिणां निष्ठा प्रोक्ता इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000568.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000569", "originalText": "यदि च एकेन पुरुषेण एकस्मै पुरुषार्थाय ज्ञानं कर्म च समुच्चित्य अनुष्ठेयं भगवता इष्टम् उक्तं वक्ष्यमाणं वा गीतासु वेदेषु चोक्तम्, कथमिह अर्जुनाय उपसन्नाय प्रियाय विशिष्टभिन्नपुरुषकर्तृके एव ज्ञानकर्मनिष्ठे ब्रूयात्? यदि पुनः ‘अर्जुनः ज्ञानं कर्म च द्वयं श्रुत्वा स्वयमेवानुष्ठास्यति अन्येषां तु भिन्नपुरुषानुष्ठेयतां वक्ष्यामि इति’ मतं भगवतः कल्प्येत, तदा रागद्वेषवान् अप्रमाणभूतो भगवान् कल्पितः स्यात्।", "padacchedaText": "", "audioFile": "PB_000569.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000570", "originalText": "तच्चायुक्तम्। तस्मात् कयापि युक्त्या न समुच्चयो ज्ञानकर्मणोः॥", "padacchedaText": "", "audioFile": "PB_000570.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000571", "originalText": "यत् अर्जुनेन उक्तं कर्मणो ज्यायस्त्वं बुद्धेः, तच्च स्थितम्, अनिराकरणात्।", "padacchedaText": "", "audioFile": "PB_000571.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000572", "originalText": "तस्याश्च ज्ञाननिष्ठायाः संन्यासिनामेवानुष्ठेयत्वम्, भिन्नपुरुषानुष्ठेयत्ववचनात्। भगवतः एवमेव अनुमतमिति गम्यते॥ ३॥", "padacchedaText": "", "audioFile": "PB_000572.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000573", "originalText": "‘मां च बन्धकारणे कर्मण्येव नियोजयसि’ इति विषण्णमनसमर्जुनम् ‘कर्म नारभे’ इत्येवं मन्वानमालक्ष्य आह भगवान्— न कर्मणामनारम्भात् इति।", "padacchedaText": "", "audioFile": "PB_000573.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000574", "originalText": "अथवा— ज्ञानकर्मनिष्ठयोः परस्परविरोधात् एकेन पुरुषेण युगपत् अनुष्ठातुमशक्त्यत्वे सति इतरेतरानपेक्षयोरेव पुरुषार्थहेतुत्वे प्राप्ते कर्मनिष्ठाया ज्ञाननिष्ठाप्राप्तिहेतुत्वेन पुरुषार्थहेतुत्वम्, न स्वातन्त्र्येण, ज्ञाननिष्ठा तु कर्मनिष्ठोपायलब्धात्मिका सती स्वातन्त्र्येण पुरुषार्थहेतुः अन्यानपेक्षा, इत्येतमर्थं प्रदर्शयिष्यन् आह भगवान्—\nन कर्मणामनारम्भान्नैष्कर्म्यं पुरुषोऽश्नुते।", "padacchedaText": "", "audioFile": "PB_000574.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000575", "originalText": "न च संन्यसनादेव सिद्धिं समधिगच्छति॥ ४॥", "padacchedaText": "", "audioFile": "PB_000575.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000576", "originalText": "न कर्मणां क्रियाणां यज्ञादीनाम् इह जन्मनि जन्मान्तरे वा अनुष्ठितानाम् उपात्तदुरितक्षयहेतुत्वेन सत्त्वशुद्धिकारणानां तत्कारणत्वेन च ज्ञानोत्पत्तिद्वारेण ज्ञाननिष्ठाहेतूनाम्, ‘ज्ञानमुत्पद्यते पुंसां क्षयात्पापस्य कर्मणः।", "padacchedaText": "", "audioFile": "PB_000576.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000577", "originalText": "यथादर्शतलप्रख्ये पश्यत्यात्मानमात्मनि’ (मो.ध.२०४.८) इत्यादिस्मरणात्, अनारम्भात् अननुष्ठानात् नैष्कर्म्यं निष्कर्मभावं कर्मशून्यतां ज्ञानयोगेन निष्ठां निष्क्रियात्मस्वरूपेणैव अवस्थानमिति यावत्।", "padacchedaText": "", "audioFile": "PB_000577.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000578", "originalText": "पुरुषः न अश्नुते न प्राप्नोतीत्यर्थः॥", "padacchedaText": "", "audioFile": "PB_000578.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000579", "originalText": "कर्मणामनारम्भान्नैष्कर्म्यं नाश्नुते इति वचनात् तद्विपर्ययात् तेषामारम्भात् नैष्कर्म्यमश्नुते इति गम्यते।", "padacchedaText": "", "audioFile": "PB_000579.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000580", "originalText": "कस्मात् पुनः कारणात् कर्मणामनारम्भान्नैष्कर्म्यं नाश्नुते इति? उच्यते, कर्मारम्भस्यैव नैष्कर्म्योपायत्वात्।", "padacchedaText": "", "audioFile": "PB_000580.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000581", "originalText": "न ह्युपायमन्तरेण उपेयप्राप्तिरस्ति।", "padacchedaText": "", "audioFile": "PB_000581.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000582", "originalText": "कर्मयोगोपायत्वं च नैष्कर्म्यलक्षणस्य ज्ञानयोगस्य, श्रुतौ इह च, प्रतिपादनात्।", "padacchedaText": "", "audioFile": "PB_000582.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000583", "originalText": "श्रुतौ तावत् प्रकृतस्य आत्मलोकस्य वेद्यस्य वेदनोपायत्वेन ‘तमेतं वेदानुवचनेन ब्राह्मणा विविदिषन्ति यज्ञेन’ (बृ.४.४.२२) इत्यादिना कर्मयोगस्य ज्ञानयोगोपायत्वं प्रतिपादितम्।", "padacchedaText": "", "audioFile": "PB_000583.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000584", "originalText": "इहापि च— ‘संन्यासस्तु महाबाहो दुःखमाप्तुमयोगतः’ (भ.गी.५.६) ‘योगिनः कर्म कुर्वन्ति सङ्गं त्यक्त्वात्मशुद्धये’ (भ.गी.५.११) ‘यज्ञो दानं तपश्चैव पावनानि मनीषिणाम्’ (भ.गी.१८.५) इत्यादि प्रतिपादयिष्यति॥", "padacchedaText": "", "audioFile": "PB_000584.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000585", "originalText": "ननु च ‘अभयं सर्वभूतेभ्यो दत्त्वा नैष्कर्म्यमाचरेत्’ (अश्व.४६.१८) इत्यादौ कर्तव्यकर्मसंन्यासादपि नैष्कर्म्यप्राप्तिं दर्शयति।", "padacchedaText": "", "audioFile": "PB_000585.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000586", "originalText": "लोके च कर्मणामनारम्भान्नैष्कर्म्यमिति प्रसिद्धतरम्।", "padacchedaText": "", "audioFile": "PB_000586.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000587", "originalText": "अतश्च नैष्कर्म्यार्थिनः किं कर्मारम्भेण? इति प्राप्तम्।", "padacchedaText": "", "audioFile": "PB_000587.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000588", "originalText": "अत आह— न च संन्यसनादेवेति। नापि संन्यसनादेव केवलात् कर्मपरित्यागमात्रादेव ज्ञानरहितात् सिद्धिं नैष्कर्म्यलक्षणां ज्ञानयोगेन निष्ठां समधिगच्छति न प्राप्नोति॥ ४॥", "padacchedaText": "", "audioFile": "PB_000588.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000589", "originalText": "कस्मात् पुनः कारणात् कर्मसंन्यासमात्रादेव केवलात् ज्ञानरहितात् सिद्धिं नैष्कर्म्यलक्षणां पुरुषो नाधिगच्छति इति हेत्वाकाङ्क्षायामाह—\nन हि कश्चित्क्षणमपि जातु तिष्ठत्यकर्मकृत्।", "padacchedaText": "", "audioFile": "PB_000589.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000590", "originalText": "कार्यते ह्यवशः कर्म सर्वः प्रकृतिजैर्गुणैः॥ ५॥", "padacchedaText": "", "audioFile": "PB_000590.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000591", "originalText": "न हि यस्मात् क्षणमपि कालं जातु कदाचित् कश्चित् तिष्ठति अकर्मकृत् सन्।", "padacchedaText": "", "audioFile": "PB_000591.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000592", "originalText": "कस्मात्? कार्यते प्रवर्त्यते हि यस्मात् अवश एव अस्वतन्त्र एव कर्म सर्वः प्राणी प्रकृतिजैः प्रकृतितो जातैः सत्त्वरजस्तमोभिः गुणैः।", "padacchedaText": "", "audioFile": "PB_000592.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000593", "originalText": "अज्ञ इति वाक्यशेषः, यतो वक्ष्यति ‘गुणैर्यो न विचाल्यते’ (भ.गी.१४.२३) इति।", "padacchedaText": "", "audioFile": "PB_000593.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000594", "originalText": "साङ्‍ख्यानां पृथक्करणात् अज्ञानामेव हि कर्मयोगः, न ज्ञानिनाम्।", "padacchedaText": "", "audioFile": "PB_000594.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000595", "originalText": "ज्ञानिनां तु गुणैरचाल्यमानानां स्वतश्चलनाभावात् कर्मयोगो नोपपद्यते। तथा च व्याख्यातम् ‘वेदाविनाशिनम्’ (भ.गी.२.२१) इत्यत्र॥ ५॥", "padacchedaText": "", "audioFile": "PB_000595.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000596", "originalText": "यत्त्वनात्मज्ञः चोदितं कर्म नारभते इति तदसदेवेत्याह—\nकर्मेन्द्रियाणि संयम्य य आस्ते मनसा स्मरन्। इन्द्रियार्थान्विमूढात्मा मिथ्याचारः स उच्यते॥ ६॥", "padacchedaText": "", "audioFile": "PB_000596.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000597", "originalText": "कर्मेन्द्रियाणि हस्तादीनि संयम्य संहृत्य यः आस्ते तिष्ठति मनसा स्मरन् चिन्तयन् इन्द्रियार्थान् विषयान् विमूढात्मा विमूढान्तःकरणः मिथ्याचारो मृषाचारः पापाचारः\nसः उच्यते॥ ६॥", "padacchedaText": "", "audioFile": "PB_000597.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000598", "originalText": "यस्त्विन्द्रियाणि मनसा नियम्यारभतेऽर्जुन। कर्मेन्द्रियैः कर्मयोगमसक्तः स विशिष्यते॥ ७॥", "padacchedaText": "", "audioFile": "PB_000598.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000599", "originalText": "यस्तु पुनः कर्मण्यधिकृतः अज्ञः बुद्धीन्द्रियाणि मनसा नियम्य आरभते अर्जुन कर्मेन्द्रियैः वाक्पाण्यादिभिः। किमारभते इत्याह— कर्मयोगम् असक्तः सन् फलाभिसन्धिवर्जितः सः विशिष्यते इतरस्मात् मिथ्याचारात्॥ ७॥", "padacchedaText": "", "audioFile": "PB_000599.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000600", "originalText": "यतः एवम् अतः—\nनियतं कुरु कर्म त्वं कर्म ज्यायो ह्यकर्मणः। शरीरयात्रापि च ते न प्रसिध्येदकर्मणः॥ ८॥", "padacchedaText": "", "audioFile": "PB_000600.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000601", "originalText": "नियतं नित्यं शास्त्रोपदिष्टम्, यो यस्मिन् कर्मणि अधिकृतः फलाय च अश्रुतं तत् नियतं कर्म, तत् कुरु त्वं हे अर्जुन, यतः कर्म ज्यायः अधिकतरं फलतः, हि यस्मात् अकर्मणः अकरणात् अनारम्भात्।", "padacchedaText": "", "audioFile": "PB_000601.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000602", "originalText": "कथम्? शरीरयात्रा शरीरस्थितिः अपि च ते तव न प्रसिध्येत् प्रसिद्धिं न गच्छेत् अकर्मणः अकरणात्। अतः दृष्टः कर्माकर्मणोर्विशेषो लोके॥ ८॥", "padacchedaText": "", "audioFile": "PB_000602.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000603", "originalText": "यच्च मन्यसे बन्धार्थत्वात् कर्म न कर्तव्यमिति तदप्यसत्।", "padacchedaText": "", "audioFile": "PB_000603.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000604", "originalText": "कथम्—\nयज्ञार्थात्कर्मणोऽन्यत्र लोकोऽयं कर्मबन्धनः। तदर्थं कर्म कौन्तेय मुक्तसङ्गः समाचर॥ ९॥", "padacchedaText": "", "audioFile": "PB_000604.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000605", "originalText": "‘यज्ञो वै विष्णुः’ (तै.स.१.७.४) इति श्रुतेः यज्ञः ईश्वरः, तदर्थं यत् क्रियते तत् यज्ञार्थं कर्म।", "padacchedaText": "", "audioFile": "PB_000605.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000606", "originalText": "तस्मात् कर्मणः अन्यत्र अन्येन कर्मणा लोकः अयम् अधिकृतः कर्मकृत् कर्मबन्धनः कर्म बन्धनं यस्य सोऽयं कर्मबन्धनः लोकः, न तु यज्ञार्थात्। अतः तदर्थं यज्ञार्थं कर्म कौन्तेय, मुक्तसङ्गः कर्मफलसङ्गवर्जितः सन् समाचर निर्वर्तय॥ ९॥", "padacchedaText": "", "audioFile": "PB_000606.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000607", "originalText": "इतश्च अधिकृतेन कर्म कर्तव्यम्—\nसहयज्ञाः प्रजाः सृष्ट्वा पुरोवाच प्रजापतिः। अनेन प्रसविष्यध्वमेष वोऽस्त्विष्टकामधुक्॥ १०॥", "padacchedaText": "", "audioFile": "PB_000607.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000608", "originalText": "सहयज्ञाः यज्ञसहिताः प्रजाः त्रयो वर्णाः ताः सृष्ट्वा उत्पाद्य पुरा पूर्वं सर्गादौ उवाच उक्तवान् प्रजापतिः प्रजानां स्रष्टा अनेन यज्ञेन प्रसविष्यध्वं प्रसवः वृद्धिः उत्पत्तिः तं कुरुध्वम्।", "padacchedaText": "", "audioFile": "PB_000608.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000609", "originalText": "एष यज्ञः वः युष्माकम् अस्तु भवतु इष्टकामधुक् इष्टान् अभिप्रेतान् कामान् फलविशेषान् दोग्धीति इष्टकामधुक्॥ १०॥", "padacchedaText": "", "audioFile": "PB_000609.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000610", "originalText": "कथम्—\nदेवान्भावयतानेन ते देवा भावयन्तु वः। परस्परं भावयन्तः श्रेयः परमवाप्स्यथ॥ ११॥", "padacchedaText": "", "audioFile": "PB_000610.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000611", "originalText": "देवान् इन्द्रादीन् भावयत वर्धयत अनेन यज्ञेन।", "padacchedaText": "", "audioFile": "PB_000611.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000612", "originalText": "ते देवा भावयन्तु आप्याययन्तु वृष्ट्यादिना वः युष्मान्।", "padacchedaText": "", "audioFile": "PB_000612.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000613", "originalText": "एवं परस्परम् अन्योन्यं भावयन्तः श्रेयः परं मोक्षलक्षणं ज्ञानप्राप्तिक्रमेण अवाप्स्यथ। स्वर्गं वा परं श्रेयः अवाप्स्यथ॥ ११॥", "padacchedaText": "", "audioFile": "PB_000613.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000614", "originalText": "किञ्च—\nइष्टान्भोगान्हि वो देवा दास्यन्ते यज्ञभाविताः। तैर्दत्तानप्रदायैभ्यो यो भुङ्क्ते स्तेन एव सः॥ १२॥", "padacchedaText": "", "audioFile": "PB_000614.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000615", "originalText": "इष्टान् अभिप्रेतान् भोगान् हि वः युष्मभ्यं देवाः दास्यन्ते वितरिष्यन्ति स्त्रीपशुपुत्रादीन् यज्ञभाविताः यज्ञैः वर्धिताः तोषिताः इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000615.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000616", "originalText": "तैः देवैः दत्तान् भोगान् अप्रदाय अदत्त्वा, आनृण्यमकृत्वा इत्यर्थः, एभ्यः देवेभ्यः, यः भुङ्क्ते स्वदेहेन्द्रियाण्येव तर्पयति स्तेन एव तस्कर एव सः देवादिस्वापहारी॥ १२॥", "padacchedaText": "", "audioFile": "PB_000616.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000617", "originalText": "ये पुनः—\nयज्ञशिष्टाशिनः सन्तो मुच्यन्ते सर्वकिल्बिषैः। भुञ्जते ते त्वघं पापा ये पचन्त्यात्मकारणात्॥ १३॥", "padacchedaText": "", "audioFile": "PB_000617.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000618", "originalText": "देवयज्ञादीन् निर्वर्त्य तच्छिष्टम् अशनम् अमृताख्यम् अशितुं शीलं येषां ते यज्ञशिष्टाशिनः सन्तः मुच्यन्ते सर्वकिल्बिषैः सर्वपापैः चुल्ल्यादिपञ्चसूनाकृतैः प्रमादकृतहिंसादिजनितैश्च अन्यैः।", "padacchedaText": "", "audioFile": "PB_000618.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000619", "originalText": "ये तु आत्मम्भरयः, भुञ्जते ते तु अघं पापं स्वयमपि पापाः— ये पचन्ति पाकं निर्वर्तयन्ति आत्मकारणात् आत्महेतोः॥ १३॥", "padacchedaText": "", "audioFile": "PB_000619.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000620", "originalText": "इतश्च अधिकृतेन कर्म कर्तव्यम् जगच्चक्रप्रवृत्तिहेतुर्हि कर्म।", "padacchedaText": "", "audioFile": "PB_000620.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000621", "originalText": "कथमिति उच्यते—\nअन्नाद्भवन्ति भूतानि पर्जन्यादन्नसम्भवः। यज्ञाद्भवति पर्जन्यो यज्ञः कर्मसमुद्भवः॥ १४॥", "padacchedaText": "", "audioFile": "PB_000621.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000622", "originalText": "अन्नात् भुक्तात् लोहितरेतःपरिणतात् प्रत्यक्षं भवन्ति जायन्ते भूतानि।", "padacchedaText": "", "audioFile": "PB_000622.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000623", "originalText": "पर्जन्यात् वृष्टेः अन्नस्य सम्भवः अन्नसम्भवः।", "padacchedaText": "", "audioFile": "PB_000623.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000624", "originalText": "यज्ञात् भवति पर्जन्यः, ‘अग्नौ प्रास्ताहुतिः सम्यगादित्यमुपतिष्ठते।", "padacchedaText": "", "audioFile": "PB_000624.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000625", "originalText": "आदित्याज्जायते वृष्टिर्वृष्टेरन्नं ततः प्रजाः’ (मनु.३.७६) इति स्मृतेः।", "padacchedaText": "", "audioFile": "PB_000625.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000626", "originalText": "यज्ञः अपूर्वम्। स च यज्ञः कर्मसमुद्भवः ऋत्विग्यजमानयोश्च व्यापारः कर्म, तत् समुद्भवः यस्य यज्ञस्य अपूर्वस्य स यज्ञः कर्मसमुद्भवः॥ १४॥", "padacchedaText": "", "audioFile": "PB_000626.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000627", "originalText": "तच्चैवंविधं कर्म कुतो जातमित्याह—\nकर्म ब्रह्मोद्भवं विद्धि ब्रह्माक्षरसमुद्भवम्। तस्मात्सर्वगतं ब्रह्म नित्यं यज्ञे प्रतिष्ठितम्॥ १५॥", "padacchedaText": "", "audioFile": "PB_000627.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000628", "originalText": "कर्म ब्रह्मोद्भवं ब्रह्म वेदः सः उद्भवः कारणं प्रकाशको यस्य तत् कर्म ब्रह्मोद्भवं विद्धि विजानीहि।", "padacchedaText": "", "audioFile": "PB_000628.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000629", "originalText": "ब्रह्म पुनः वेदाख्यम् अक्षरसमुद्भवम् अक्षरं ब्रह्म परमात्मा समुद्भवो यस्य तत् अक्षरसमुद्भवम्।", "padacchedaText": "", "audioFile": "PB_000629.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000630", "originalText": "ब्रह्म वेद इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000630.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000631", "originalText": "यस्मात् साक्षात् परमात्माख्यात् अक्षरात् पुरुषनिःश्वासवत् समुद्भूतं ब्रह्म तस्मात् सर्वार्थप्रकाशकत्वात् सर्वगतम्, सर्वगतमपि सत् नित्यं सदा यज्ञविधिप्रधानत्वात् यज्ञे प्रतिष्ठितम्॥ १५॥", "padacchedaText": "", "audioFile": "PB_000631.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000632", "originalText": "एवं प्रवर्तितं चक्रं नानुवर्तयतीह यः। अघायुरिन्द्रियारामो मोघं पार्थ स जीवति॥ १६॥", "padacchedaText": "", "audioFile": "PB_000632.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000633", "originalText": "एवम् इत्थम् ईश्वरेण वेदयज्ञपूर्वकं जगच्चक्रं प्रवर्तितं न अनुवर्तयति इह लोके यः कर्मणि अधिकृतः सन् अघायुः अघं पापम् आयुः जीवनं यस्य सः अघायुः, पापजीवनः इति यावत्।", "padacchedaText": "", "audioFile": "PB_000633.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000634", "originalText": "इन्द्रियारामः इन्द्रियैः आरामः आरमणम् आक्रीडा विषयेषु यस्य सः इन्द्रियारामः मोघं वृथा हे पार्थ, स जीवति॥", "padacchedaText": "", "audioFile": "PB_000634.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000635", "originalText": "तस्मात् अज्ञेन अधिकृतेन कर्तव्यमेव कर्मेति प्रकरणार्थः।", "padacchedaText": "", "audioFile": "PB_000635.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000636", "originalText": "प्राक् आत्मज्ञाननिष्ठायोग्यताप्राप्तेः तादर्थ्येन कर्मयोगानुष्ठानम् अधिकृतेन अनात्मज्ञेन कर्तव्यमेवेत्येतत् ‘न कर्मणामनारम्भात्’ (भ.गी.३.४) इत्यत आरभ्य ‘शरीरयात्रापि च ते न प्रसिध्येदकर्मणः’ (भ.गी.३.८) इत्येवमन्तेन प्रतिपाद्य, ‘यज्ञार्थात् कर्मणोऽन्यत्र’ (भ.गी.३.९) इत्यादिना ‘मोघं पार्थ स जीवति’ (भ.गी.३.१६) इत्येवमन्तेनापि ग्रन्थेन प्रासङ्गिकम् अधिकृतस्य अनात्मविदः कर्मानुष्ठाने बहु कारणमुक्तम्।", "padacchedaText": "", "audioFile": "PB_000636.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000637", "originalText": "तदकरणे च दोषसङ्कीर्तनं कृतम्॥ १६॥", "padacchedaText": "", "audioFile": "PB_000637.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000638", "originalText": "एवं स्थिते किमेवं प्रवर्तितं चक्रं सर्वेणानुवर्तनीयम्, आहोस्वित् पूर्वोक्तकर्मयोगानुष्ठानोपायप्राप्याम् अनात्मविदः ज्ञानयोगेनैव निष्ठाम् आत्मविद्भिः साङ्ख्यैः अनुष्ठेयामप्राप्तेनैव, इत्येवमर्थम् अर्जुनस्य प्रश्नमाशङ्क्य स्वयमेव वा शास्त्रार्थस्य विवेकप्रतिपत्त्यर्थम् ‘एतं वै तमात्मानं विदित्वा निवृत्तमिथ्याज्ञानाः सन्तः ब्राह्मणाः मिथ्याज्ञानवद्भिः अवश्यं कर्तव्येभ्यः पुत्रैषणादिभ्यो व्युत्थायाथ भिक्षाचर्यं शरीरस्थितिमात्रप्रयुक्तं चरन्ति न तेषामात्मज्ञाननिष्ठाव्यतिरेकेण अन्यत् कार्यमस्ति’ (बृ.३.५.१) इत्येवं श्रुत्यर्थमिह गीताशास्त्रे प्रतिपिपादयिषितमाविष्कुर्वन् आह भगवान्—\nयस्त्वात्मरतिरेव स्यादात्मतृप्तश्च मानवः।", "padacchedaText": "", "audioFile": "PB_000638.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000639", "originalText": "आत्मन्येव च सन्तुष्टस्तस्य कार्यं न विद्यते॥ १७॥", "padacchedaText": "", "audioFile": "PB_000639.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000640", "originalText": "यस्तु साङ्ख्यः आत्मज्ञाननिष्ठः आत्मरतिः आत्मन्येव रतिः न विषयेषु यस्य सः आत्मरतिरेव स्यात् भवेत् आत्मतृप्तश्च आत्मनैव तृप्तः न अन्नरसादिना सः मानवः मनुष्यः संन्यासी आत्मन्येव च सन्तुष्टः।", "padacchedaText": "", "audioFile": "PB_000640.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000641", "originalText": "सन्तोषो हि बाह्यार्थलाभे सर्वस्य भवति, तमनपेक्ष्य आत्मन्येव च सन्तुष्टः सर्वतो वीततृष्ण इत्येतत्। यः ईदृशः आत्मवित् तस्य कार्यं करणीयं न विद्यते नास्ति इत्यर्थः॥ १७॥", "padacchedaText": "", "audioFile": "PB_000641.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000642", "originalText": "किञ्च—\nनैव तस्य कृतेनार्थो नाकृतेनेह कश्चन। न चास्य सर्वभूतेषु कश्चिदर्थव्यपाश्रयः॥ १८॥", "padacchedaText": "", "audioFile": "PB_000642.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000643", "originalText": "नैव तस्य परमात्मरतेः कृतेन कर्मणा अर्थः प्रयोजनमस्ति।", "padacchedaText": "", "audioFile": "PB_000643.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000644", "originalText": "अस्तु तर्हि अकृतेन अकरणेन प्रत्यवायाख्यः अनर्थः, न अकृतेन इह लोके कश्चन कश्चिदपि प्रत्यवायप्राप्तिरूपः आत्महानिलक्षणो वा नैव अस्ति।", "padacchedaText": "", "audioFile": "PB_000644.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000645", "originalText": "न च अस्य सर्वभूतेषु ब्रह्मादिस्थावरान्तेषु भूतेषु कश्चित् अर्थव्यपाश्रयः प्रयोजननिमित्तक्रियासाध्यः व्यपाश्रयः व्यपाश्रयणम् आलम्बनं कञ्चित् भूतविशेषमाश्रित्य न साध्यः कश्चिदर्थः अस्ति, येन तदर्था क्रिया अनुष्ठेया स्यात्।", "padacchedaText": "", "audioFile": "PB_000645.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000646", "originalText": "न त्वम् एतस्मिन् सर्वतःसम्प्लुतोदकस्थानीये सम्यग्दर्शने वर्तसे॥ १८॥", "padacchedaText": "", "audioFile": "PB_000646.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000647", "originalText": "यतः एवम्—\nतस्मादसक्तः सततं कार्यं कर्म समाचर। असक्तो ह्याचरन्कर्म परमाप्नोति पूरुषः॥ १९॥", "padacchedaText": "", "audioFile": "PB_000647.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000648", "originalText": "तस्मात् असक्तः सङ्गवर्जितः सततं सर्वदा कार्यं कर्तव्यं नित्यं कर्म समाचर निर्वर्तय। असक्तो हि यस्मात् समाचरन् ईश्वरार्थं कर्म कुर्वन् परं मोक्षम् आप्नोति पूरुषः सत्त्वशुद्धिद्वारेण इत्यर्थः॥ १९॥", "padacchedaText": "", "audioFile": "PB_000648.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000649", "originalText": "यस्माच्च—\nकर्मणैव हि संसिद्धिमास्थिता जनकादयः। लोकसङ्ग्रहमेवापि सम्पश्यन्कर्तुमर्हसि॥ २०॥", "padacchedaText": "", "audioFile": "PB_000649.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000650", "originalText": "कर्मणैव हि यस्मात् पूर्वे क्षत्रियाः विद्वांसः संसिद्धिं मोक्षं गन्तुम् आस्थिताः प्रवृत्ताः।", "padacchedaText": "", "audioFile": "PB_000650.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000651", "originalText": "के? जनकादयः जनकाश्वपतिप्रभृतयः।", "padacchedaText": "", "audioFile": "PB_000651.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000652", "originalText": "यदि ते प्राप्तसम्यग्दर्शनाः, ततः लोकसङ्ग्रहार्थं प्रारब्धकर्मत्वात् कर्मणा सहैव असंन्यस्यैव कर्म संसिद्धिमास्थिता इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000652.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000653", "originalText": "अथ अप्राप्तसम्यग्दर्शनाः जनकादयः, तदा कर्मणा सत्त्वशुद्धिसाधनभूतेन क्रमेण संसिद्धिमास्थिता इति व्याख्येयः श्लोकः।", "padacchedaText": "", "audioFile": "PB_000653.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000654", "originalText": "अथ मन्यसे पूर्वैरपि जनकादिभिः अजानद्भिरेव कर्तव्यं कर्म कृतम्, तावता नावश्यमन्येन कर्तव्यं सम्यग्दर्शनवता कृतार्थेनेति, तथापि प्रारब्धकर्मायत्तः त्वं लोकसङ्ग्रहम् एव अपि लोकस्य उन्मार्गप्रवृत्तिनिवारणं लोकसङ्ग्रहः तमेवापि प्रयोजनं सम्पश्यन् कर्तुम् अर्हसि॥ २०॥", "padacchedaText": "", "audioFile": "PB_000654.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000655", "originalText": "लोकसङ्ग्रहः किमर्थं कर्तव्य इत्युच्यते—\nयद्यदाचरति श्रेष्ठस्तत्तदेवेतरो जनः। स यत्प्रमाणं कुरुते लोकस्तदनुवर्तते॥ २१॥", "padacchedaText": "", "audioFile": "PB_000655.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000656", "originalText": "यद्यत् कर्म आचरति करोति श्रेष्ठः प्रधानः तत्तदेव कर्म आचरति इतरः अन्यः जनः तदनुगतः। किञ्च सः श्रेष्ठः यत् प्रमाणं कुरुते लौकिकं वैदिकं वा लोकः तत् अनुवर्तते तदेव प्रमाणीकरोति इत्यर्थः॥ २१॥", "padacchedaText": "", "audioFile": "PB_000656.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000657", "originalText": "यदि अत्र ते लोकसङ्ग्रहकर्तव्यतायां विप्रतिपत्तिः तर्हि मां किं न पश्यसि?—\nन मे पार्थास्ति कर्तव्यं त्रिषु लोकेषु किञ्चन। नानवाप्तमवाप्तव्यं वर्त एव च कर्मणि॥ २२॥", "padacchedaText": "", "audioFile": "PB_000657.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000658", "originalText": "न मे मम पार्थ न अस्ति न विद्यते कर्तव्यं त्रिषु अपि लोकेषु किञ्चन किञ्चिदपि। कस्मात्? न अनवाप्तम् अप्राप्तम् अवाप्तव्यं प्रापणीयम्, तथापि वर्ते एव च कर्मणि अहम्॥ २२॥", "padacchedaText": "", "audioFile": "PB_000658.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000659", "originalText": "यदि ह्यहं न वर्तेय जातु कर्मण्यतन्द्रितः। मम वर्त्मानुवर्तन्ते मनुष्याः पार्थ सर्वशः॥ २३॥", "padacchedaText": "", "audioFile": "PB_000659.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000660", "originalText": "यदि हि पुनः अहं न वर्तेय जातु कदाचित् कर्मणि अतन्द्रितः अनलसः सन् मम श्रेष्ठस्य सतः वर्त्म मार्गम् अनुवर्तन्ते मनुष्याः हे पार्थ, सर्वशः सर्वप्रकारैः॥ २३॥", "padacchedaText": "", "audioFile": "PB_000660.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000661", "originalText": "उत्सीदेयुरिमे लोका न कुर्यां कर्म चेदहम्। सङ्करस्य च कर्ता स्यामुपहन्यामिमाः प्रजाः॥ २४॥", "padacchedaText": "", "audioFile": "PB_000661.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_000662", "originalText": "उत्सीदेयुः विनश्येयुः इमे सर्वे लोकाः लोकस्थितिनिमित्तस्य कर्मणः अभावात् न कुर्यां कर्म चेत् अहम्।", "padacchedaText": "", "audioFile": "PB_000662.wav", "zipFile": "011_GitaBh
