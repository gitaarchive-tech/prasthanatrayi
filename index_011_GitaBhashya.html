प्रतिषेधार्थो हि फलहेतुभ्याम् आत्मनः अन्यत्वं प्रतिपद्यते, न पूर्वम्। तस्मात् विधिप्रतिषेधशास्त्रम् अविद्वद्विषयम् इति सिद्धम्॥", "padacchedaText": "", "audioFile": "PB_002250.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002251", "originalText": "ननु ‘स्वर्गकामो यजेत’ (?) ‘न कलञ्जं भक्षयेत्’ (?) इत्यादौ आत्मव्यतिरेकदर्शिनाम् अप्रवृत्तौ, केवलदेहाद्यात्मदृष्टीनां च, अतः कर्तुः अभावात् शास्त्रानर्थक्यमिति चेत्, न, यथाप्रसिद्धित एव प्रवृत्तिनिवृत्त्युपपत्तेः।", "padacchedaText": "", "audioFile": "PB_002251.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002252", "originalText": "ईश्वरक्षेत्रज्ञैकत्वदर्शी ब्रह्मवित् तावत् न प्रवर्तते।", "padacchedaText": "", "audioFile": "PB_002252.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002253", "originalText": "तथा नैरात्म्यवाद्यपि नास्ति परलोकः इति न प्रवर्तते।", "padacchedaText": "", "audioFile": "PB_002253.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002254", "originalText": "यथाप्रसिद्धितस्तु विधिप्रतिषेधशास्त्रश्रवणान्यथानुपपत्त्या अनुमितात्मास्तित्वः आत्मविशेषानभिज्ञः कर्मफलसञ्जाततृष्णः श्रद्दधानतया च प्रवर्तते।", "padacchedaText": "", "audioFile": "PB_002254.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002255", "originalText": "इति सर्वेषां नः प्रत्यक्षम्। अतः न शास्त्रानर्थक्यम्॥", "padacchedaText": "", "audioFile": "PB_002255.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002256", "originalText": "विवेकिनाम् अप्रवृत्तिदर्शनात् तदनुगामिनाम् अप्रवृत्तौ शास्त्रानर्थक्यम् इति चेत्, न,\nकस्यचिदेव विवेकोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_002256.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002257", "originalText": "अनेकेषु हि प्राणिषु कश्चिदेव विवेकी स्यात्, यथेदानीम्।", "padacchedaText": "", "audioFile": "PB_002257.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002258", "originalText": "न च विवेकिनम् अनुवर्तन्ते मूढाः, रागादिदोषतन्त्रत्वात् प्रवृत्तेः, अभिचरणादौ च प्रवृत्तिदर्शनात्, स्वाभाव्याच्च प्रवृत्तेः— ‘स्वभावस्तु प्रवर्तते’ (भ.गी.५.१४) इति हि उक्तम्॥", "padacchedaText": "", "audioFile": "PB_002258.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002259", "originalText": "तस्मात् अविद्यामात्रं संसारः यथादृष्टविषयः एव।", "padacchedaText": "", "audioFile": "PB_002259.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002260", "originalText": "न क्षेत्रज्ञस्य केवलस्य अविद्या तत्कार्यं च।", "padacchedaText": "", "audioFile": "PB_002260.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002261", "originalText": "न च मिथ्याज्ञानं परमार्थवस्तु दूषयितुं समर्थम्।", "padacchedaText": "", "audioFile": "PB_002261.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002262", "originalText": "न हि ऊषरदेशं स्नेहेन पङ्कीकर्तुं शक्नोति मरीच्युदकम्।", "padacchedaText": "", "audioFile": "PB_002262.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002263", "originalText": "तथा अविद्या क्षेत्रज्ञस्य न किञ्चित् कर्तुं शक्नोति। अतश्चेदमुक्तम्— ‘क्षेत्रज्ञं चापि मां विद्धि’ (भ.गी.१३.२), ‘अज्ञानेनावृतं ज्ञानम्’ (भ.गी.५.१५) इति च॥", "padacchedaText": "", "audioFile": "PB_002263.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002264", "originalText": "अथ किमिदं संसारिणामिव ‘अहमेवं’ ‘ममैवेदम्’ इति पण्डितानामपि? शृणु, इदं तत् पाण्डित्यम्, यत् क्षेत्रे एव आत्मदर्शनम्।", "padacchedaText": "", "audioFile": "PB_002264.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002265", "originalText": "यदि पुनः क्षेत्रज्ञम् अविक्रियं पश्येयुः, ततः न भोगं कर्म वा आकाङ्क्षेयुः ‘मम स्यात्’ इति।", "padacchedaText": "", "audioFile": "PB_002265.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002266", "originalText": "विक्रियैव भोगकर्मणी।", "padacchedaText": "", "audioFile": "PB_002266.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002267", "originalText": "अथ एवं सति, फलार्थित्वात् अविद्वान् प्रवर्तते। विदुषः पुनः अविक्रियात्मदर्शिनः फलार्थित्वाभावात् प्रवृत्त्यनुपपत्तौ कार्यकरणसङ्घातव्यापारोपरमे निवृत्तिः उपचर्यते॥", "padacchedaText": "", "audioFile": "PB_002267.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002268", "originalText": "इदं च अन्यत् पाण्डित्यं केषाञ्चित् अस्तु— क्षेत्रज्ञः ईश्वर एव।", "padacchedaText": "", "audioFile": "PB_002268.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002269", "originalText": "क्षेत्रं च अन्यत् क्षेत्रज्ञस्यैव विषयः।", "padacchedaText": "", "audioFile": "PB_002269.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002270", "originalText": "अहं तु संसारी सुखी दुःखी च।", "padacchedaText": "", "audioFile": "PB_002270.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002271", "originalText": "संसारोपरमश्च मम कर्तव्यः क्षेत्रक्षेत्रज्ञविज्ञानेन, ध्यानेन च ईश्वरं क्षेत्रज्ञं साक्षात्कृत्वा तत्स्वरूपावस्थानेनेति।", "padacchedaText": "", "audioFile": "PB_002271.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002272", "originalText": "यश्च एवं बुध्यते, यश्च बोधयति, नासौ क्षेत्रज्ञः इति।", "padacchedaText": "", "audioFile": "PB_002272.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002273", "originalText": "एवं मन्वानः यः सः पण्डितापशदः, संसारमोक्षयोः शास्त्रस्य च अर्थवत्त्वं करोमीति, आत्महा स्वयं मूढः अन्यांश्च व्यामोहयति शास्त्रार्थसम्प्रदायरहितत्वात्, श्रुतहानिम् अश्रुतकल्पनां च कुर्वन्।", "padacchedaText": "", "audioFile": "PB_002273.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002274", "originalText": "तस्मात् असम्प्रदायवित् सर्वशास्त्रविदपि मूर्खवदेव उपेक्षणीयः॥", "padacchedaText": "", "audioFile": "PB_002274.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002275", "originalText": "यत्तूक्तम् ‘ईश्वरस्य क्षेत्रज्ञैकत्वे संसारित्वं प्राप्नोति, क्षेत्रज्ञानां च ईश्वरैकत्वे संसारिणः अभावात् संसाराभावप्रसङ्गः’ इति, एतौ दोषौ प्रत्युक्तौ ‘विद्याविद्ययोः वैलक्षण्याभ्युपगमात्’ इति।", "padacchedaText": "", "audioFile": "PB_002275.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002276", "originalText": "कथम्? अविद्यापरिकल्पितदोषेण तद्विषयं वस्तु पारमार्थिकं न दुष्यतीति।", "padacchedaText": "", "audioFile": "PB_002276.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002277", "originalText": "तथा च दृष्टान्तः दर्शितः— मरीच्यम्भसा ऊषरदेशो न पङ्कीक्रियते इति। संसारिणः अभावात् संसाराभावप्रसङ्गदोषोऽपि संसारसंसारिणोः अविद्याकल्पितत्वोपपत्त्या प्रत्युक्तः॥", "padacchedaText": "", "audioFile": "PB_002277.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002278", "originalText": "ननु अविद्यावत्त्वमेव क्षेत्रज्ञस्य संसारित्वदोषः।", "padacchedaText": "", "audioFile": "PB_002278.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002279", "originalText": "तत्कृतं च सुखित्वदुःखित्वादि प्रत्यक्षम् उपलभ्यते इति चेत्, न, ज्ञेयस्य क्षेत्रधर्मत्वात्, ज्ञातुः क्षेत्रज्ञस्य तत्कृतदोषानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_002279.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002280", "originalText": "यावत् किञ्चित् क्षेत्रज्ञस्य दोषजातम् अविद्यमानम् आसञ्जयसि, तस्य ज्ञेयत्वोपपत्तेः क्षेत्रधर्मत्वमेव, न क्षेत्रज्ञधर्मत्वम्।", "padacchedaText": "", "audioFile": "PB_002280.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002281", "originalText": "न च तेन क्षेत्रज्ञः दुष्यति, ज्ञेयेन ज्ञातुः संसर्गानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_002281.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002282", "originalText": "यदि हि संसर्गः स्यात्, ज्ञेयत्वमेव नोपपद्येत।", "padacchedaText": "", "audioFile": "PB_002282.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002283", "originalText": "यदि आत्मनः धर्मः अविद्यावत्त्वं दुःखित्वादि च कथं भोः प्रत्यक्षम् उपलभ्यते, कथं वा क्षेत्रज्ञधर्मः।", "padacchedaText": "", "audioFile": "PB_002283.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002284", "originalText": "‘ज्ञेयं च सर्वं क्षेत्रं ज्ञातैव क्षेत्रज्ञः’ इति अवधारिते, ‘अविद्यादुःखित्वादेः क्षेत्रज्ञविशेषणत्वं क्षेत्रज्ञधर्मत्वं तस्य च प्रत्यक्षोपलभ्यत्वम्’ इति विरुद्धम् उच्यते अविद्यामात्रावष्टम्भात् केवलम्॥", "padacchedaText": "", "audioFile": "PB_002284.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002285", "originalText": "अत्र आह— सा अविद्या कस्य इति।", "padacchedaText": "", "audioFile": "PB_002285.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002286", "originalText": "यस्य दृश्यते तस्य एव।", "padacchedaText": "", "audioFile": "PB_002286.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002287", "originalText": "कस्य दृश्यते इति।", "padacchedaText": "", "audioFile": "PB_002287.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002288", "originalText": "अत्र उच्यते— ‘अविद्या कस्य दृश्यते? ’ इति प्रश्नः निरर्थकः।", "padacchedaText": "", "audioFile": "PB_002288.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002289", "originalText": "कथम्? दृश्यते चेत् अविद्या, तद्वन्तमपि पश्यसि।", "padacchedaText": "", "audioFile": "PB_002289.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002290", "originalText": "न च तद्वति उपलभ्यमाने ‘सा कस्य? ’ इति प्रश्नो युक्तः।", "padacchedaText": "", "audioFile": "PB_002290.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002291", "originalText": "न हि गोमति उपलभ्यमाने ‘गावः कस्य? ’ इति प्रश्नः अर्थवान् भवति।", "padacchedaText": "", "audioFile": "PB_002291.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002292", "originalText": "ननु विषमो दृष्टान्तः।", "padacchedaText": "", "audioFile": "PB_002292.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002293", "originalText": "गवां तद्वतश्च प्रत्यक्षत्वात् तत्सम्बन्धोऽपि प्रत्यक्ष इति प्रश्नो निरर्थकः।", "padacchedaText": "", "audioFile": "PB_002293.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002294", "originalText": "न तथा अविद्या तद्वांश्च प्रत्यक्षौ, यतः प्रश्नः निरर्थकः स्यात्।", "padacchedaText": "", "audioFile": "PB_002294.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002295", "originalText": "अप्रत्यक्षेण अविद्यावता अविद्यासम्बन्धे ज्ञाते, किं तव स्यात्? अविद्यायाः अनर्थहेतुत्वात् परिहर्तव्या स्यात्।", "padacchedaText": "", "audioFile": "PB_002295.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002296", "originalText": "यस्य अविद्या, सः तां परिहरिष्यति।", "padacchedaText": "", "audioFile": "PB_002296.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002297", "originalText": "ननु ममैव अविद्या।", "padacchedaText": "", "audioFile": "PB_002297.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002298", "originalText": "जानासि तर्हि अविद्यां तद्वन्तं च आत्मानम्।", "padacchedaText": "", "audioFile": "PB_002298.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002299", "originalText": "जानामि, न तु प्रत्यक्षेण।", "padacchedaText": "", "audioFile": "PB_002299.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002300", "originalText": "अनुमानेन चेत् जानासि, कथं सम्बन्धग्रहणम्? न हि तव ज्ञातुः ज्ञेयभूतया अविद्यया तत्काले सम्बन्धः ग्रहीतुं शक्यते, अविद्याया विषयत्वेनैव ज्ञातुः उपयुक्तत्वात्।", "padacchedaText": "", "audioFile": "PB_002300.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002301", "originalText": "न च ज्ञातुः अविद्यायाश्च सम्बन्धस्य यः ग्रहीता, ज्ञानं च अन्यत् तद्विषयं सम्भवति, अनवस्थाप्राप्तेः।", "padacchedaText": "", "audioFile": "PB_002301.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002302", "originalText": "यदि ज्ञात्रापि ज्ञेयसम्बन्धो ज्ञायते, अन्यः ज्ञाता कल्प्यः स्यात्, तस्यापि अन्यः, तस्यापि अन्यः इति अनवस्था अपरिहार्या।", "padacchedaText": "", "audioFile": "PB_002302.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002303", "originalText": "यदि पुनः अविद्या ज्ञेया, अन्यद्वा ज्ञेयं ज्ञेयमेव।", "padacchedaText": "", "audioFile": "PB_002303.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002304", "originalText": "तथा ज्ञातापि ज्ञातैव, न ज्ञेयं भवति। यदा च एवम्, अविद्यादुःखित्वाद्यैः न ज्ञातुः क्षेत्रज्ञस्य किञ्चित् दुष्यति॥", "padacchedaText": "", "audioFile": "PB_002304.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002305", "originalText": "ननु अयमेव दोषः, यत् दोषवत्क्षेत्रविज्ञातृत्वम्, न च विज्ञानस्वरूपस्यैव अविक्रियस्य विज्ञातृत्वोपचारात्, यथा उष्णतामात्रेण अग्नेः तप्तिक्रियोपचारः तद्वत्।", "padacchedaText": "", "audioFile": "PB_002305.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002306", "originalText": "यथा अत्र भगवता क्रियाकारकफलात्मत्वाभावः आत्मनि स्वत एव दर्शितः— अविद्याध्यारोपितः एव क्रियाकारकादिः आत्मनि उपचर्यते, तथा तत्र तत्र ‘य एवं वेत्ति हन्तारम्’ (भ.गी.२.१९), ‘प्रकृतेः क्रियमाणानि गुणैः कर्माणि सर्वशः’ (भ.गी.३.२७), ‘नादत्ते कस्यचित्पापम्’ (भ.गी.५.१५) इत्यादिप्रकरणेषु दर्शितः।", "padacchedaText": "", "audioFile": "PB_002306.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002307", "originalText": "तथैव च व्याख्यातम् अस्माभिः। उत्तरेषु च प्रकरणेषु दर्शयिष्यामः॥", "padacchedaText": "", "audioFile": "PB_002307.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002308", "originalText": "हन्त।", "padacchedaText": "", "audioFile": "PB_002308.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002309", "originalText": "तर्हि आत्मनि क्रियाकारकफलात्मतायाः स्वतः अभावे, अविद्यया च अध्यारोपितत्वे, कर्माणि अविद्वत्कर्तव्यान्येव, न विदुषाम् इति प्राप्तम्।", "padacchedaText": "", "audioFile": "PB_002309.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002310", "originalText": "सत्यम् एवं प्राप्तम्, एतदेव च ‘न हि देहभृता शक्यम्’ (भ.गी.१८.११) इत्यत्र दर्शयिष्यामः।", "padacchedaText": "", "audioFile": "PB_002310.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002311", "originalText": "सर्वशास्त्रार्थोपसंहारप्रकरणे च ‘समासेनैव कौन्तेय निष्ठा ज्ञानस्य या परा’ (भ.गी.१८.५०) इत्यत्र विशेषतः दर्शयिष्यामः। अलम् इह बहुप्रपञ्चनेन, इति उपसंह्रियते॥ २॥", "padacchedaText": "", "audioFile": "PB_002311.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002312", "originalText": "‘इदं शरीरम्’ इत्यादिश्लोकोपदिष्टस्य क्षेत्राध्यायार्थस्य सङ्ग्रहश्लोकः अयम् उपन्यस्यते ‘तत्क्षेत्रं यच्च’ इत्यादि, व्याचिख्यासितस्य हि अर्थस्य सङ्ग्रहोपन्यासः न्याय्यः इति—\nतत्क्षेत्रं यच्च यादृक्च यद्विकारि यतश्च यत्।", "padacchedaText": "", "audioFile": "PB_002312.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002313", "originalText": "स च यो यत्प्रभावश्च तत्समासेन मे शृणु॥ ३॥", "padacchedaText": "", "audioFile": "PB_002313.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002314", "originalText": "यत् निर्दिष्टम् ‘इदं शरीरम्’ इति तत् तच्छब्देन परामृशति।", "padacchedaText": "", "audioFile": "PB_002314.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002315", "originalText": "यच्च इदं निर्दिष्टं क्षेत्रं तत् यादृक् यादृशं स्वकीयैः धर्मैः।", "padacchedaText": "", "audioFile": "PB_002315.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002316", "originalText": "च— शब्दः समुच्चयार्थः।", "padacchedaText": "", "audioFile": "PB_002316.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002317", "originalText": "यद्विकारि यः विकारः यस्य तत् यद्विकारि, यतः यस्मात् च यत्, कार्यम् उत्पद्यते इति वाक्यशेषः।", "padacchedaText": "", "audioFile": "PB_002317.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002318", "originalText": "स च यः क्षेत्रज्ञः निर्दिष्टः सः यत्प्रभावः ये प्रभावाः उपाधिकृताः शक्तयः यस्य सः यत्प्रभावश्च। तत् क्षेत्रक्षेत्रज्ञयोः याथात्म्यं यथाविशेषितं समासेन सङ्क्षेपेण मे मम वाक्यतः शृणु, श्रुत्वा अवधारय इत्यर्थः॥ ३॥", "padacchedaText": "", "audioFile": "PB_002318.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002319", "originalText": "तत् क्षेत्रक्षेत्रज्ञयाथात्म्यं विवक्षितं स्तौति श्रोतृबुद्धिप्ररोचनार्थम्—\nऋषिभिर्बहुधा गीतं छन्दोभिर्विविधैः पृथक्। ब्रह्मसूत्रपदैश्चैव हेतुमद्भिर्विनिश्चितैः॥ ४॥", "padacchedaText": "", "audioFile": "PB_002319.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002320", "originalText": "ऋषिभिः वसिष्ठादिभिः बहुधा बहुप्रकारं गीतं कथितम्।", "padacchedaText": "", "audioFile": "PB_002320.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002321", "originalText": "छन्दोभिः छन्दांसि ऋगादीनि तैः छन्दोभिः विविधैः नानाभावैः नानाप्रकारैः पृथक् विवेकतः गीतम्।", "padacchedaText": "", "audioFile": "PB_002321.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002322", "originalText": "किञ्च, ब्रह्मसूत्रपदैश्च एव ब्रह्मणः सूचकानि वाक्यानि ब्रह्मसूत्राणि तैः पद्यते गम्यते ज्ञायते इति तानि पदानि उच्यन्ते तैरेव च क्षेत्रक्षेत्रज्ञयाथात्म्यम् ‘गीतम्’ इति अनुवर्तते।", "padacchedaText": "", "audioFile": "PB_002322.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002323", "originalText": "‘आत्मेत्येवोपासीत’ (बृ.१.४.७) इत्येवमादिभिः ब्रह्मसूत्रपदैः आत्मा ज्ञायते, हेतुमद्भिः युक्तियुक्तैः विनिश्चितैः निःसंशयरूपैः निश्चितप्रत्ययोत्पादकैः इत्यर्थः॥ ४॥", "padacchedaText": "", "audioFile": "PB_002323.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002324", "originalText": "स्तुत्या अभिमुखीभूताय अर्जुनाय आह भगवान्—\nमहाभूतान्यहङ्कारो बुद्धिरव्यक्तमेव च। इन्द्रियाणि दशैकं च पञ्च चेन्द्रियगोचराः॥ ५॥", "padacchedaText": "", "audioFile": "PB_002324.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002325", "originalText": "महाभूतानि महान्ति च तानि सर्वविकारव्यापकत्वात् भूतानि च सूक्ष्माणि।", "padacchedaText": "", "audioFile": "PB_002325.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002326", "originalText": "स्थूलानि तु इन्द्रियगोचरशब्देन अभिधायिष्यन्ते अहङ्कारः महाभूतकारणम् अहंप्रत्ययलक्षणः।", "padacchedaText": "", "audioFile": "PB_002326.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002327", "originalText": "अहङ्कारकारणं बुद्धिः अध्यवसायलक्षणा।", "padacchedaText": "", "audioFile": "PB_002327.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002328", "originalText": "तत्कारणम् अव्यक्तमेव च, न व्यक्तम् अव्यक्तम् अव्याकृतम् ईश्वरशक्तिः ‘मम माया दुरत्यया’ (भ.गी.७.१४) इत्युक्तम्।", "padacchedaText": "", "audioFile": "PB_002328.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002329", "originalText": "एवशब्दः प्रकृत्यवधारणार्थः एतावत्येव अष्टधा भिन्ना प्रकृतिः।", "padacchedaText": "", "audioFile": "PB_002329.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002330", "originalText": "च— शब्दः भेदसमुच्चयार्थः।", "padacchedaText": "", "audioFile": "PB_002330.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002331", "originalText": "इन्द्रियाणि दश, श्रोत्रादीनि पञ्च बुद्ध्युत्पादकत्वात् बुद्धीन्द्रियाणि, वाक्पाण्यादीनि पञ्च कर्मनिवर्तकत्वात् कर्मेन्द्रियाणि, तानि दश।", "padacchedaText": "", "audioFile": "PB_002331.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002332", "originalText": "एकं च, किं तत्? मनः एकादशं सङ्कल्पाद्यात्मकम्।", "padacchedaText": "", "audioFile": "PB_002332.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002333", "originalText": "पञ्च च इन्द्रियगोचराः शब्दादयो विषयाः। तानि एतानि साङ्ख्याः चतुर्विंशतितत्त्वानि आचक्षते॥ ५॥", "padacchedaText": "", "audioFile": "PB_002333.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002334", "originalText": "अथ इदानीम् आत्मगुणा इति यानाचक्षते वैशेषिकाः तेपि क्षेत्रधर्मा एव न तु क्षेत्रज्ञस्य इत्याह भगवान्—\nइच्छा द्वेषः सुखं दुःखं सङ्घातश्चेतना धृतिः। एतत्क्षेत्रं समासेन सविकारमुदाहृतम्॥ ६॥", "padacchedaText": "", "audioFile": "PB_002334.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002335", "originalText": "इच्छा, यज्जातीयं सुखहेतुमर्थम् उपलब्धवान् पूर्वम्, पुनः तज्जातीयमुपलभमानः तमादातुमिच्छति सुखहेतुरिति, सा इयं इच्छा अन्तःकरणधर्मः ज्ञेयत्वात् क्षेत्रम्।", "padacchedaText": "", "audioFile": "PB_002335.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002336", "originalText": "तथा द्वेषः, यज्जातीयमर्थं दुःखहेतुत्वेन अनुभूतवान्, पुनः तज्जातीयमर्थमुपलभमानः तं द्वेष्टि, सोऽयं द्वेषः ज्ञेयत्वात् क्षेत्रमेव।", "padacchedaText": "", "audioFile": "PB_002336.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002337", "originalText": "तथा सुखम् अनुकूलं प्रसन्नसत्त्वात्मकं ज्ञेयत्वात् क्षेत्रमेव।", "padacchedaText": "", "audioFile": "PB_002337.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002338", "originalText": "दुःखं प्रतिकूलात्मकम्, ज्ञेयत्वात् तदपि क्षेत्रम्।", "padacchedaText": "", "audioFile": "PB_002338.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002339", "originalText": "सङ्घातः देहेन्द्रियाणां संहतिः।", "padacchedaText": "", "audioFile": "PB_002339.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002340", "originalText": "तस्यामभिव्यक्तान्तःकरणवृत्तिः, तप्त इव लोहपिण्डे अग्निः आत्मचैतन्याभासरसविद्धा चेतना, सा च क्षेत्रं ज्ञेयत्वात्।", "padacchedaText": "", "audioFile": "PB_002340.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002341", "originalText": "धृतिः यया अवसादप्राप्तानि देहेन्द्रियाणि ध्रियन्ते, सा च ज्ञेयत्वात् क्षेत्रम्।", "padacchedaText": "", "audioFile": "PB_002341.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002342", "originalText": "सर्वान्तःकरणधर्मोपलक्षणार्थम् इच्छादिग्रहणम्।", "padacchedaText": "", "audioFile": "PB_002342.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002343", "originalText": "यत उक्तमुपसंहरति— एतत् क्षेत्रं समासेन सविकारं सह विकारेण महदादिना उदाहृतम् उक्तम् यस्य क्षेत्रभेदजातस्य संहतिः ‘इदं शरीरं क्षेत्रम्’ (भ.गी.१३.१) इति उक्तम्, तत् क्षेत्रं व्याख्यातं महाभूतादिभेदभिन्नं धृत्यन्तम्।॥ ६॥", "padacchedaText": "", "audioFile": "PB_002343.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002344", "originalText": "क्षेत्रज्ञः वक्ष्यमाणविशेषणः— यस्य सप्रभावस्य क्षेत्रज्ञस्य परिज्ञानात् अमृतत्वं भवति, तम् ‘ज्ञेयं यत्तत्प्रवक्ष्यामि’ (भ.गी.१३.१२) इत्यादिना सविशेषणं स्वयमेव वक्ष्यति भगवान्।", "padacchedaText": "", "audioFile": "PB_002344.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002345", "originalText": "अधुना तु तज्ज्ञानसाधनगणममानित्वादिलक्षणम्, यस्मिन् सति तज्ज्ञेयविज्ञाने योग्यः अधिकृतः भवति, यत्परः संन्यासी ज्ञाननिष्ठः उच्यते, तम् अमानित्वादिगणं ज्ञानसाधनत्वात् ज्ञानशब्दवाच्यं विदधाति भगवान्—\nअमानित्वमदम्भित्वमहिंसा क्षान्तिरार्जवम्।", "padacchedaText": "", "audioFile": "PB_002345.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002346", "originalText": "आचार्योपासनं शौचं स्थैर्यमात्मविनिग्रहः॥ ७॥", "padacchedaText": "", "audioFile": "PB_002346.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002347", "originalText": "अमानित्वं मानिनः भावः मानित्वमात्मनः श्लाघनम्, तदभावः अमानित्वम्।", "padacchedaText": "", "audioFile": "PB_002347.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002348", "originalText": "अदम्भित्वं स्वधर्मप्रकटीकरणं दम्भित्वम्, तदभावः अदम्भित्वम्।", "padacchedaText": "", "audioFile": "PB_002348.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002349", "originalText": "अहिंसा अहिंसनं प्राणिनामपीडनम्।", "padacchedaText": "", "audioFile": "PB_002349.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002350", "originalText": "क्षान्तिः परापराधप्राप्तौ अविक्रिया।", "padacchedaText": "", "audioFile": "PB_002350.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002351", "originalText": "आर्जवम् ऋजुभावः अवक्रत्वम्।", "padacchedaText": "", "audioFile": "PB_002351.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002352", "originalText": "आचार्योपासनं मोक्षसाधनोपदेष्टुः आचार्यस्य शुश्रूषादिप्रयोगेण सेवनम्।", "padacchedaText": "", "audioFile": "PB_002352.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002353", "originalText": "शौचं कायमलानां मृज्जलाभ्यां प्रक्षालनम्, अन्तश्च मनसः प्रतिपक्षभावनया रागादिमलानामपनयनं शौचम्।", "padacchedaText": "", "audioFile": "PB_002353.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002354", "originalText": "स्थैर्यं स्थिरभावः, मोक्षमार्गे एव कृताध्यवसायत्वम्। आत्मविनिग्रहः आत्मनः अपकारकस्य आत्मशब्दवाच्यस्य कार्यकरणसङ्घातस्य विनिग्रहः स्वभावेन सर्वतः प्रवृत्तस्य सन्मार्गे एव निरोधः आत्मविनिग्रहः॥ ७॥", "padacchedaText": "", "audioFile": "PB_002354.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002355", "originalText": "किञ्च—\nइन्द्रियार्थेषु वैराग्यमनहङ्कार एव च। जन्ममृत्युजराव्याधिदुःखदोषानुदर्शनम्॥ ८॥", "padacchedaText": "", "audioFile": "PB_002355.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002356", "originalText": "इन्द्रियार्थेषु शब्दादिषु दृष्टादृष्टेषु भोगेषु विरागभावो वैराग्यम् अनहङ्कारः अहङ्काराभावः एव च जन्ममृत्युजराव्याधिदुःखदोषानुदर्शनं जन्म च मृत्युश्च जरा च व्याधयश्च दुःखानि च तेषु जन्मादिदुःखान्तेषु प्रत्येकं दोषानुदर्शनम्।", "padacchedaText": "", "audioFile": "PB_002356.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002357", "originalText": "जन्मनि गर्भवासयोनिद्वारनिःसरणं दोषः, तस्य अनुदर्शनमालोचनम्।", "padacchedaText": "", "audioFile": "PB_002357.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002358", "originalText": "तथा मृत्यौ दोषानुदर्शनम्।", "padacchedaText": "", "audioFile": "PB_002358.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002359", "originalText": "तथा जरायां प्रज्ञाशक्तितेजोनिरोधदोषानुदर्शनं परिभूतता चेति।", "padacchedaText": "", "audioFile": "PB_002359.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002360", "originalText": "तथा\nव्याधिषु शिरोरोगादिषु दोषानुदर्शनम्।", "padacchedaText": "", "audioFile": "PB_002360.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002361", "originalText": "तथा दुःखेषु अध्यात्माधिभूताधिदैवनिमित्तेषु।", "padacchedaText": "", "audioFile": "PB_002361.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002362", "originalText": "अथवा दुःखान्येव दोषः दुःखदोषः तस्य जन्मादिषु पूर्ववत् अनुदर्शनम्— दुःखं जन्म, दुःखं मृत्युः, दुःखं जरा, दुःखं व्याधयः।", "padacchedaText": "", "audioFile": "PB_002362.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002363", "originalText": "दुःखनिमित्तत्वात् जन्मादयः दुःखम्, न पुनः स्वरूपेणैव दुःखमिति।", "padacchedaText": "", "audioFile": "PB_002363.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002364", "originalText": "एवं जन्मादिषु दुःखदोषानुदर्शनात् देहेन्द्रियादिविषयभोगेषु वैराग्यमुपजायते।", "padacchedaText": "", "audioFile": "PB_002364.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002365", "originalText": "ततः प्रत्यगात्मनि प्रवृत्तिः करणानामात्मदर्शनाय। एवं ज्ञानहेतुत्वात् ज्ञानमुच्यते जन्मादिदुःखदोषानुदर्शनम्॥ ८॥", "padacchedaText": "", "audioFile": "PB_002365.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002366", "originalText": "किञ्च—\nअसक्तिरनभिष्वङ्गः पुत्रदारगृहादिषु। नित्यं च समचित्तत्वमिष्टानिष्टोपपत्तिषु॥ ९॥", "padacchedaText": "", "audioFile": "PB_002366.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002367", "originalText": "असक्तिः सक्तिः सङ्गनिमित्तेषु विषयेषु प्रीतिमात्रम्, तदभावः असक्तिः।", "padacchedaText": "", "audioFile": "PB_002367.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002368", "originalText": "अनभिष्वङ्गः अभिष्वङ्गाभावः।", "padacchedaText": "", "audioFile": "PB_002368.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002369", "originalText": "अभिष्वङ्गो नाम आसक्तिविशेष एव अनन्यात्मभावनालक्षणः, यथा अन्यस्मिन् सुखिनि दुःखिनि वा ‘अहमेव सुखी, दुःखी च, ’ जीवति मृते वा ‘अहमेव जीवामि मरिष्यामि च’ इति।", "padacchedaText": "", "audioFile": "PB_002369.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002370", "originalText": "क्व इति आह— पुत्रदारगृहादिषु, पुत्रेषु दारेषु गृहेषु आदिग्रहणात् अन्येष्वपि अत्यन्तेष्टेषु दासवर्गादिषु।", "padacchedaText": "", "audioFile": "PB_002370.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002371", "originalText": "तच्च उभयं ज्ञानार्थत्वात् ज्ञानमुच्यते।", "padacchedaText": "", "audioFile": "PB_002371.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002372", "originalText": "नित्यं च समचित्तत्वं तुल्यचित्तता।", "padacchedaText": "", "audioFile": "PB_002372.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002373", "originalText": "क्व? इष्टानिष्टोपपत्तिषु इष्टानामनिष्टानां च उपपत्तयः सम्प्राप्तयः तासु इष्टानिष्टोपपत्तिषु नित्यमेव तुल्यचित्तता।", "padacchedaText": "", "audioFile": "PB_002373.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002374", "originalText": "इष्टोपपत्तिषु न हृष्यति, न कुप्यति च अनिष्टोपपत्तिषु। तच्च एतत् नित्यं समचित्तत्वं ज्ञानम्॥ ९॥", "padacchedaText": "", "audioFile": "PB_002374.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002375", "originalText": "किञ्च—\nमयि चानन्ययोगेन भक्तिरव्यभिचारिणी। विविक्तदेशसेवित्वमरतिर्जनसंसदि॥ १०॥", "padacchedaText": "", "audioFile": "PB_002375.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002376", "originalText": "मयि च ईश्वरे अनन्ययोगेन अपृथक्समाधिना ‘न अन्यो भगवतो वासुदेवात् परः अस्ति, अतः स एव नः गतिः’ इत्येवं निश्चिता अव्यभिचारिणी बुद्धिः अनन्ययोगः, तेन भजनं भक्तिः न व्यभिचरणशीला अव्यभिचारिणी।", "padacchedaText": "", "audioFile": "PB_002376.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002377", "originalText": "सा च ज्ञानम्।", "padacchedaText": "", "audioFile": "PB_002377.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002378", "originalText": "विविक्तदेशसेवित्वम्, विविक्तः स्वभावतः संस्कारेण वा अशुच्यादिभिः सर्पव्याघ्रादिभिश्च रहितः अरण्यनदीपुलिनदेवगृहादिभिर्विविक्तो देशः, तं सेवितुं शीलमस्य इति विविक्तदेशसेवी, तद्भावः विविक्तदेशसेवित्वम्।", "padacchedaText": "", "audioFile": "PB_002378.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002379", "originalText": "विविक्तेषु हि देशेषु चित्तं प्रसीदति यतः ततः आत्मादिभावना विविक्ते उपजायते।", "padacchedaText": "", "audioFile": "PB_002379.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002380", "originalText": "अतः विविक्तदेशसेवित्वं ज्ञानमुच्यते।", "padacchedaText": "", "audioFile": "PB_002380.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002381", "originalText": "अरतिः अरमणं जनसंसदि, जनानां प्राकृतानां संस्कारशून्यानाम् अविनीतानां संसत् समवायः जनसंसत्, न संस्कारवतां विनीतानां संसत्, तस्याः ज्ञानोपकारकत्वात्। अतः प्राकृतजनसंसदि अरतिः ज्ञानार्थत्वात् ज्ञानम्॥ १०॥", "padacchedaText": "", "audioFile": "PB_002381.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002382", "originalText": "किञ्च—\nअध्यात्मज्ञाननित्यत्वं तत्त्वज्ञानार्थदर्शनम्। एतज्ज्ञानमिति प्रोक्तमज्ञानं यदतोऽन्यथा॥ ११॥", "padacchedaText": "", "audioFile": "PB_002382.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002383", "originalText": "अध्यात्मज्ञाननित्यत्वम् आत्मादिविषयं ज्ञानम् अध्यात्मज्ञानम्, तस्मिन् नित्यभावः नित्यत्वम्।", "padacchedaText": "", "audioFile": "PB_002383.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002384", "originalText": "अमानित्वादीनां ज्ञानसाधनानां भावनापरिपाकनिमित्तं तत्त्वज्ञानम्, तस्य अर्थः मोक्षः संसारोपरमः, तस्य आलोचनं तत्त्वज्ञानार्थदर्शनम्, तत्त्वज्ञानफलालोचने हि तत्साधनानुष्ठाने प्रवृत्तिः स्यादिति।", "padacchedaText": "", "audioFile": "PB_002384.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002385", "originalText": "एतत् अमानित्वादितत्त्वज्ञानार्थदर्शनान्तमुक्तं ज्ञानम् इति प्रोक्तं ज्ञानार्थत्वात्।", "padacchedaText": "", "audioFile": "PB_002385.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002386", "originalText": "अज्ञानं यत् अतः अस्मात् यथोक्तात् अन्यथा विपर्ययेण। मानित्वं दम्भित्वं हिंसा अक्षान्तिः अनार्जवम् इत्यादि अज्ञानं विज्ञेयं परिहरणाय, संसारप्रवृत्तिकारणत्वात् इति॥ ११॥", "padacchedaText": "", "audioFile": "PB_002386.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002387", "originalText": "यथोक्तेन ज्ञानेन ज्ञातव्यं किम् इत्याकाङ्क्षायामाह— ‘ज्ञेयं यत्तत्’ इत्यादि।", "padacchedaText": "", "audioFile": "PB_002387.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002388", "originalText": "ननु यमाः नियमाश्च अमानित्वादयः।", "padacchedaText": "", "audioFile": "PB_002388.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002389", "originalText": "न तैः ज्ञेयं ज्ञायते।", "padacchedaText": "", "audioFile": "PB_002389.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002390", "originalText": "न हि अमानित्वादि कस्यचित् वस्तुनः परिच्छेदकं दृष्टम्।", "padacchedaText": "", "audioFile": "PB_002390.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002391", "originalText": "सर्वत्रैव च यद्विषयं ज्ञानं तदेव तस्य ज्ञेयस्य परिच्छेदकं दृश्यते।", "padacchedaText": "", "audioFile": "PB_002391.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002392", "originalText": "न हि अन्यविषयेण ज्ञानेन अन्यत् उपलभ्यते, यथा घटविषयेण ज्ञानेन अग्निः।", "padacchedaText": "", "audioFile": "PB_002392.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002393", "originalText": "नैष दोषः, ज्ञाननिमित्तत्वात् ज्ञानमुच्यते इति हि अवोचाम, ज्ञानसहकारिकारणत्वाच्च—\nज्ञेयं यत्तत्प्रवक्ष्यामि यज्ज्ञात्वामृतमश्नुते। अनादिमत्परं ब्रह्म न सत्तन्नासदुच्यते॥ १२॥", "padacchedaText": "", "audioFile": "PB_002393.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002394", "originalText": "ज्ञेयं ज्ञातव्यं यत् तत् प्रवक्ष्यामि प्रकर्षेण यथावत् वक्ष्यामि।", "padacchedaText": "", "audioFile": "PB_002394.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002395", "originalText": "किम्फलं तत् इति प्ररोचनेन श्रोतुः अभिमुखीकरणाय आह— यत् ज्ञेयं ज्ञात्वा अमृतम् अमृतत्वम् अश्नुते, न पुनः म्रियते इत्यर्थः। अनादिमत् आदिः अस्य अस्तीति आदिमत्, न आदिमत् अनादिमत्, किं तत्? परं निरतिशयं ब्रह्म, ‘ज्ञेयम्’ इति प्रकृतम्॥", "padacchedaText": "", "audioFile": "PB_002395.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002396", "originalText": "अत्र केचित् ‘अनादि मत्परम्’ इति पदं छिन्दन्ति, बहुव्रीहिणा उक्ते अर्थे मतुपः आनर्थक्यम् अनिष्टं स्यात् इति।", "padacchedaText": "", "audioFile": "PB_002396.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002397", "originalText": "अर्थविशेषं च दर्शयन्ति— अहं वासुदेवाख्या परा शक्तिः यस्य तत् मत्परम् इति।", "padacchedaText": "", "audioFile": "PB_002397.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002398", "originalText": "सत्यमेवमपुनरुक्तं स्यात्, अर्थः चेत् सम्भवति।", "padacchedaText": "", "audioFile": "PB_002398.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002399", "originalText": "न तु अर्थः सम्भवति, ब्रह्मणः सर्वविशेषप्रतिषेधेनैव विजिज्ञापयिषितत्वात् ‘न सत्तन्नासदुच्यते’ इति।", "padacchedaText": "", "audioFile": "PB_002399.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002400", "originalText": "विशिष्टशक्तिमत्त्वप्रदर्शनं विशेषप्रतिषेधश्च इति विप्रतिषिद्धम्। तस्मात् मतुपः बहुव्रीहिणा समानार्थत्वेऽपि प्रयोगः श्लोकपूरणार्थः॥", "padacchedaText": "", "audioFile": "PB_002400.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002401", "originalText": "अमृतत्वफलं ज्ञेयं मया उच्यते इति प्ररोचनेन अभिमुखीकृत्य आह— न सत् तत् ज्ञेयमुच्यते इति न अपि असत् तत् उच्यते॥", "padacchedaText": "", "audioFile": "PB_002401.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002402", "originalText": "ननु महता परिकरबन्धेन कण्ठरवेण उद्घुष्य ‘ज्ञेयं प्रवक्ष्यामि’ इति, अननुरूपमुक्तं ‘न सत्तन्नासदुच्यते’ इति।", "padacchedaText": "", "audioFile": "PB_002402.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002403", "originalText": "न, अनुरूपमेव उक्तम्।", "padacchedaText": "", "audioFile": "PB_002403.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002404", "originalText": "कथम्? सर्वासु हि उपनिषत्सु ज्ञेयं ब्रह्म ‘नेति नेति’ (बृ.२.३.६) ‘अस्थूलमनणु’ (बृ.३.८.८) इत्यादिविशेषप्रतिषेधेनैव निर्दिश्यते, न ‘इदं तत्’ इति, वाचः अगोचरत्वात्॥", "padacchedaText": "", "audioFile": "PB_002404.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002405", "originalText": "ननु न तदस्ति, यद्वस्तु अस्तिशब्देन नोच्यते।", "padacchedaText": "", "audioFile": "PB_002405.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002406", "originalText": "अथ अस्तिशब्देन नोच्यते, नास्ति तत् ज्ञेयम्।", "padacchedaText": "", "audioFile": "PB_002406.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002407", "originalText": "विप्रतिषिद्धं च— ‘ज्ञेयं तत्, ’ ‘अस्तिशब्देन नोच्यते’ इति च। न तावन्नास्ति, नास्तिबुद्ध्यविषयत्वात्॥", "padacchedaText": "", "audioFile": "PB_002407.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002408", "originalText": "ननु सर्वाः बुद्धयः अस्तिनास्तिबुद्ध्यनुगताः एव।", "padacchedaText": "", "audioFile": "PB_002408.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002409", "originalText": "तत्र एवं सति ज्ञेयमपि अस्तिबुद्ध्यनुगतप्रत्ययविषयं वा स्यात्, नास्तिबुद्ध्यनुगतप्रत्ययविषयं वा स्यात्।", "padacchedaText": "", "audioFile": "PB_002409.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002410", "originalText": "न, अतीन्द्रियत्वेन उभयबुद्ध्यनुगतप्रत्ययाविषयत्वात्।", "padacchedaText": "", "audioFile": "PB_002410.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002411", "originalText": "यद्धि इन्द्रियगम्यं वस्तु घटादिकम्, तत् अस्तिबुद्ध्यनुगतप्रत्ययविषयं वा स्यात्, नास्तिबुद्ध्यनुगतप्रत्ययविषयं वा स्यात्। इदं तु ज्ञेयम् अतीन्द्रियत्वेन शब्दैकप्रमाणगम्यत्वात् न घटादिवत् उभयबुद्ध्यनुगतप्रत्ययविषयम् इत्यतः ‘न सत्तन्नासत्’ इति उच्यते॥", "padacchedaText": "", "audioFile": "PB_002411.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002412", "originalText": "यत्तु उक्तम्— विरुद्धमुच्यते, ‘ज्ञेयं तत्’ ‘न सत्तन्नासदुच्यते’ इति— न विरुद्धम्, ‘अन्यदेव तद्विदितादथो अविदितादधि’ (के.१.४) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_002412.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002413", "originalText": "श्रुतिरपि विरुद्धार्था इति चेत्— यथा यज्ञाय शालामारभ्य ‘यद्यमुष्मिंल्लोकेऽस्ति वा न वेति’ (तै.सं.६.१.१.१) इत्येवमिति चेत्, न, विदिताविदिताभ्यामन्यत्वश्रुतेः अवश्यविज्ञेयार्थप्रतिपादनपरत्वात् ‘यद्यमुष्मिन्’ इत्यादि तु विधिशेषः अर्थवादः।", "padacchedaText": "", "audioFile": "PB_002413.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002414", "originalText": "उपपत्तेश्च सदसदादिशब्दैः ब्रह्म नोच्यते इति।", "padacchedaText": "", "audioFile": "PB_002414.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002415", "originalText": "सर्वो हि शब्दः अर्थप्रकाशनाय प्रयुक्तः, श्रूयमाणश्च श्रोतृभिः, जातिक्रियागुणसम्बन्धद्वारेण सङ्केतग्रहणसव्यपेक्षः अर्थं प्रत्याययति, न अन्यथा, अदृष्टत्वात्।", "padacchedaText": "", "audioFile": "PB_002415.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002416", "originalText": "तत् यथा— ‘गौः’ ‘अश्वः’ इति वा जातितः, ‘पचति’ ‘पठति’ इति वा क्रियातः, ‘शुक्लः’ ‘कृष्णः’ इति वा गुणतः, ‘धनी’ ‘गोमान्’ इति वा सम्बन्धतः।", "padacchedaText": "", "audioFile": "PB_002416.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002417", "originalText": "न तु ब्रह्म जातिमत्, अतः न सदादिशब्दवाच्यम्।", "padacchedaText": "", "audioFile": "PB_002417.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002418", "originalText": "नापि गुणवत्, येन गुणशब्देन उच्येत, निर्गुणत्वात्।", "padacchedaText": "", "audioFile": "PB_002418.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002419", "originalText": "नापि क्रियाशब्दवाच्यं निष्क्रियत्वात् ‘निष्कलं निष्क्रियं शान्तम्’ (श्वे.६.१९) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_002419.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002420", "originalText": "न च सम्बन्धी, एकत्वात्। अद्वयत्वात् अविषयत्वात् आत्मत्वाच्च न केनचित् शब्देन उच्यते इति युक्तम्, ‘यतो वाचो निवर्तन्ते’ (तै.२.९.१) इत्यादिश्रुतिभिश्च॥ १२॥", "padacchedaText": "", "audioFile": "PB_002420.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002421", "originalText": "सच्छब्दप्रत्ययाविषयत्वात् असत्त्वाशङ्कायां ज्ञेयस्य सर्वप्राणिकरणोपाधिद्वारेण तदस्तित्वं प्रतिपादयन् तदाशङ्कानिवृत्त्यर्थमाह—\nसर्वतःपाणिपादं तत्सर्वतोक्षिशिरोमुखम्।", "padacchedaText": "", "audioFile": "PB_002421.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002422", "originalText": "सर्वतःश्रुतिमल्लोके सर्वमावृत्य तिष्ठति॥ १३॥", "padacchedaText": "", "audioFile": "PB_002422.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002423", "originalText": "सर्वतःपाणिपादं सर्वतः पाणयः पादाश्च अस्य इति सर्वतःपाणिपादं तत् ज्ञेयम्।", "padacchedaText": "", "audioFile": "PB_002423.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002424", "originalText": "सर्वप्राणिकरणोपाधिभिः क्षेत्रज्ञस्य अस्तित्वं विभाव्यते।", "padacchedaText": "", "audioFile": "PB_002424.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002425", "originalText": "क्षेत्रज्ञश्च क्षेत्रोपाधितः उच्यते।", "padacchedaText": "", "audioFile": "PB_002425.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002426", "originalText": "क्षेत्रं च पाणिपादादिभिः अनेकधा भिन्नम्।", "padacchedaText": "", "audioFile": "PB_002426.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002427", "originalText": "क्षेत्रोपाधिभेदकृतं विशेषजातं मिथ्यैव क्षेत्रज्ञस्य, इति तदपनयनेन ज्ञेयत्वमुक्तम् ‘न सत्तन्नासदुच्यते’ इति।", "padacchedaText": "", "audioFile": "PB_002427.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002428", "originalText": "उपाधिकृतं मिथ्यारूपमपि अस्तित्वाधिगमाय ज्ञेयधर्मवत् परिकल्प्य उच्यते ‘सर्वतःपाणिपादम्’ इत्यादि।", "padacchedaText": "", "audioFile": "PB_002428.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002429", "originalText": "तथा हि सम्प्रदायविदां वचनम्— ‘अध्यारोपापवादाभ्यां निष्प्रपञ्चं प्रपञ्च्यते’ (?) इति।", "padacchedaText": "", "audioFile": "PB_002429.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002430", "originalText": "सर्वत्र सर्वदेहावयवत्वेन गम्यमानाः पाणिपादादयः ज्ञेयशक्तिसद्भावनिमित्तस्वकार्याः इति ज्ञेयसद्भावे लिङ्गानि ‘ज्ञेयस्य’ इति उपचारतः उच्यन्ते।", "padacchedaText": "", "audioFile": "PB_002430.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002431", "originalText": "तथा व्याख्येयम् अन्यत्।", "padacchedaText": "", "audioFile": "PB_002431.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002432", "originalText": "सर्वतःपाणिपादं तत् ज्ञेयम्।", "padacchedaText": "", "audioFile": "PB_002432.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002433", "originalText": "सर्वतोक्षिशिरोमुखं सर्वतः अक्षीणि शिरांसि मुखानि च यस्य तत् सर्वतोक्षिशिरोमुखम्, सर्वतःश्रुतिमत् श्रुतिः श्रवणेन्द्रियम्, तत् यस्य तत् श्रुतिमत्, लोके प्राणिनिकाये, सर्वम् आवृत्य संव्याप्य तिष्ठति स्थितिं लभते॥ १३॥", "padacchedaText": "", "audioFile": "PB_002433.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002434", "originalText": "उपाधिभूतपाणिपादादीन्द्रियाध्यारोपणात् ज्ञेयस्य तद्वत्ताशङ्का मा भूत् इत्येवमर्थः श्लोकारम्भः—\nसर्वेन्द्रियगुणाभासं सर्वेन्द्रियविवर्जितम्। असक्तं सर्वभृच्चैव निर्गुणं गुणभोक्तृ च॥ १४॥", "padacchedaText": "", "audioFile": "PB_002434.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002435", "originalText": "सर्वेन्द्रियगुणाभासं सर्वाणि च तानि इन्द्रियाणि श्रोत्रादीनि बुद्धीन्द्रियकर्मेन्द्रियाख्यानि, अन्तःकरणे च बुद्धिमनसी, ज्ञेयोपाधित्वस्य तुल्यत्वात्, सर्वेन्द्रियग्रहणेन गृह्यन्ते।", "padacchedaText": "", "audioFile": "PB_002435.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002436", "originalText": "अपि च, अन्तःकरणोपाधिद्वारेणैव श्रोत्रादीनामपि उपाधित्वम् इत्यतः अन्तःकरणबहिष्करणोपाधिभूतैः सर्वेन्द्रियगुणैः अध्यवसायसङ्कल्पश्रवणवचनादिभिः अवभासते इति सर्वेन्द्रियगुणाभासं सर्वेन्द्रियव्यापारैः व्यापृतमिव तत् ज्ञेयम् इत्यर्थः, ‘ध्यायतीव लेलायतीव’ (बृ.४.३.७) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_002436.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002437", "originalText": "कस्मात् पुनः कारणात् न व्यापृतमेवेति गृह्यते इत्यतः आह— सर्वेन्द्रियविवर्जितम्, सर्वकरणरहितमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_002437.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002438", "originalText": "अतः न करणव्यापारैः व्यापृतं तत् ज्ञेयम्।", "padacchedaText": "", "audioFile": "PB_002438.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002439", "originalText": "यस्तु अयं मन्त्रः— ‘अपाणिपादो जवनो ग्रहीता पश्यत्यचक्षुः स शृणोत्यकर्णः’ (श्वे.३.१९) इत्यादिः, स सर्वेन्द्रियोपाधिगुणानुगुण्यभजनशक्तिमत् तत् ज्ञेयम् इत्येवं प्रदर्शनार्थः, न तु साक्षादेव जवनादिक्रियावत्त्वप्रदर्शनार्थः।", "padacchedaText": "", "audioFile": "PB_002439.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002440", "originalText": "‘अन्धो मणिमविन्दत्’ (तै.आ.१.११) इत्यादिमन्त्रार्थवत् तस्य मन्त्रस्य अर्थः।", "padacchedaText": "", "audioFile": "PB_002440.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002441", "originalText": "यस्मात् सर्वकरणवर्जितं ज्ञेयम्, तस्मात् असक्तं सर्वसंश्लेषवर्जितम्।", "padacchedaText": "", "audioFile": "PB_002441.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002442", "originalText": "यद्यपि एवम्, तथापि सर्वभृच्च एव।", "padacchedaText": "", "audioFile": "PB_002442.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002443", "originalText": "सदास्पदं हि सर्वं सर्वत्र सद्बुद्ध्यनुगमात्।", "padacchedaText": "", "audioFile": "PB_002443.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002444", "originalText": "न हि मृगतृष्णिकादयोऽपि निरास्पदाः भवन्ति।", "padacchedaText": "", "audioFile": "PB_002444.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002445", "originalText": "अतः सर्वभृत् सर्वं बिभर्ति इति।", "padacchedaText": "", "audioFile": "PB_002445.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002446", "originalText": "स्यात् इदं च अन्यत् ज्ञेयस्य सत्त्वाधिगमद्वारम्— निर्गुणं सत्त्वरजस्तमांसि गुणाः तैः वर्जितं तत् ज्ञेयम्, तथापि गुणभोक्तृ च गुणानां सत्त्वरजस्तमसां शब्दादिद्वारेण सुखदुःखमोहाकारपरिणतानां भोक्तृ च उपलब्धृ च तत् ज्ञेयम् इत्यर्थः॥ १४॥", "padacchedaText": "", "audioFile": "PB_002446.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002447", "originalText": "किञ्च—\nबहिरन्तश्च भूतानामचरं चरमेव च। सूक्ष्मत्वात्तदविज्ञेयं दूरस्थं चान्तिके च तत्॥ १५॥", "padacchedaText": "", "audioFile": "PB_002447.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002448", "originalText": "बहिः त्वक्पर्यन्तं देहम् आत्मत्वेन अविद्याकल्पितम् अपेक्ष्य तमेव अवधिं कृत्वा बहिः उच्यते।", "padacchedaText": "", "audioFile": "PB_002448.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002449", "originalText": "तथा प्रत्यगात्मानमपेक्ष्य देहमेव अवधिं कृत्वा अन्तः उच्यते।", "padacchedaText": "", "audioFile": "PB_002449.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002450", "originalText": "‘बहिरन्तश्च’ इत्युक्ते मध्ये अभावे प्राप्ते, इदमुच्यते— अचरं चरमेव च, यत् चराचरं देहाभासमपि तदेव ज्ञेयं यथा रज्जुसर्पाभासः।", "padacchedaText": "", "audioFile": "PB_002450.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002451", "originalText": "यदि अचरं चरमेव च स्यात् व्यवहारविषयं सर्वं ज्ञेयम्, किमर्थम् ‘इदम्’ इति सर्वैः न विज्ञेयम् इति? उच्यते— सत्यं सर्वाभासं तत्, तथापि व्योमवत् सूक्ष्मम्।", "padacchedaText": "", "audioFile": "PB_002451.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002452", "originalText": "अतः सूक्ष्मत्वात् स्वेन रूपेण तत् ज्ञेयमपि अविज्ञेयम् अविदुषाम्।", "padacchedaText": "", "audioFile": "PB_002452.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002453", "originalText": "विदुषां तु, ‘आत्मैवेदं सर्वम्’ (छा.७.२५.२) ‘ब्रह्मैवेदं सर्वम्’ इत्यादिप्रमाणतः नित्यं विज्ञातम्।", "padacchedaText": "", "audioFile": "PB_002453.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002454", "originalText": "अविज्ञाततया दूरस्थं वर्षसहस्रकोट्यापि अविदुषाम् अप्राप्यत्वात्। अन्तिके च तत्, आत्मत्वात् विदुषाम्॥ १५॥", "padacchedaText": "", "audioFile": "PB_002454.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002455", "originalText": "किञ्च—\nअविभक्तं च भूतेषु विभक्तमिव च स्थितम्। भूतभर्तृ च तज्ज्ञेयं ग्रसिष्णु प्रभविष्णु च॥ १६॥", "padacchedaText": "", "audioFile": "PB_002455.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002456", "originalText": "अविभक्तं च प्रतिदेहं व्योमवत् तदेकम्।", "padacchedaText": "", "audioFile": "PB_002456.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002457", "originalText": "भूतेषु सर्वप्राणिषु विभक्तमिव च स्थितं देहेष्वेव विभाव्यमानत्वात्।", "padacchedaText": "", "audioFile": "PB_002457.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002458", "originalText": "भूतभर्तृ च भूतानि बिभर्तीति तत् ज्ञेयं भूतभर्तृ च स्थितिकाले।", "padacchedaText": "", "audioFile": "PB_002458.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002459", "originalText": "प्रलयकाले गृसिष्णु ग्रसनशीलम्। उत्पत्तिकाले प्रभविष्णु च प्रभवनशीलं यथा रज्ज्वादिः सर्पादेः मिथ्याकल्पितस्य॥ १६॥", "padacchedaText": "", "audioFile": "PB_002459.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002460", "originalText": "किञ्च, सर्वत्र विद्यमानमपि सत् न उपलभ्यते चेत्, ज्ञेयं तमः तर्हि? न।", "padacchedaText": "", "audioFile": "PB_002460.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002461", "originalText": "किं तर्हि?—\nज्योतिषामपि तज्ज्योतिस्तमसः परमुच्यते। ज्ञानं ज्ञेयं ज्ञानगम्यं हृदि सर्वस्य विष्ठितम्॥ १७॥", "padacchedaText": "", "audioFile": "PB_002461.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002462", "originalText": "ज्योतिषाम् आदित्यादीनामपि तत् ज्ञेयं ज्योतिः।", "padacchedaText": "", "audioFile": "PB_002462.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002463", "originalText": "आत्मचैतन्यज्योतिषा इद्धानि हि आदित्यादीनि ज्योतींषि दीप्यन्ते, ‘येन सूर्यस्तपति तेजसेद्धः’ (तै.ब्रा.३.१२.९) ‘तस्य भासा सर्वमिदं विभाति’ (मु.२.२.११) इत्यादिश्रुतिभ्यः, स्मृतेश्च इहैव— ‘यदादित्यगतं तेजः’ (भ.गी.१५.१२) इत्यादेः।", "padacchedaText": "", "audioFile": "PB_002463.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002464", "originalText": "तमसः अज्ञानात् परम् अस्पृष्टम् उच्यते।", "padacchedaText": "", "audioFile": "PB_002464.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002465", "originalText": "ज्ञानादेः दुःसम्पादनबुद्ध्या प्राप्तावसादस्य उत्तम्भनार्थमाह— ज्ञानम् अमानित्वादि, ज्ञेयम् ‘ज्ञेयं यत् तत् प्रवक्ष्यामि’ (भ.गी.१३.१२) इत्यादिना उक्तम्, ज्ञानगम्यम् ज्ञेयमेव ज्ञातं सत् ज्ञानफलमिति ज्ञानगम्यमुच्यते, ज्ञायमानं तु ज्ञेयम्।", "padacchedaText": "", "audioFile": "PB_002465.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002466", "originalText": "तत् एतत् त्रयमपि हृदि बुद्धौ सर्वस्य प्राणिजातस्य विष्ठितं विशेषेण स्थितम्। तत्रैव हि त्रयं विभाव्यते॥ १७॥", "padacchedaText": "", "audioFile": "PB_002466.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002467", "originalText": "यथोक्तार्थोपसंहारार्थः अयं श्लोकः आरभ्यते—\nइति क्षेत्रं तथा ज्ञानं ज्ञेयं चोक्तं समासतः। मद्भक्त एतद्विज्ञाय मद्भावायोपपद्यते॥ १८॥", "padacchedaText": "", "audioFile": "PB_002467.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002468", "originalText": "इति एवं क्षेत्रं महाभूतादि धृत्यन्तं तथा ज्ञानम् अमानित्वादि तत्त्वज्ञानार्थदर्शनपर्यन्तं ज्ञेयं च ‘ज्ञेयं यत् तत्’ (भ.गी.१३.१२) इत्यादि ‘तमसः परमुच्यते’ (भ.गी.१३.१७) इत्येवमन्तम् उक्तं समासतः सङ्क्षेपतः।", "padacchedaText": "", "audioFile": "PB_002468.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002469", "originalText": "एतावान् सर्वः हि वेदार्थः गीतार्थश्च उपसंहृत्य उक्तः।", "padacchedaText": "", "audioFile": "PB_002469.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002470", "originalText": "अस्मिन् सम्यग्दर्शने कः अधिक्रियते इति उच्यते— मद्भक्तः मयि ईश्वरे सर्वज्ञे परमगुरौ वासुदेवे समर्पितसर्वात्मभावः, यत् पश्यति शृणोति स्पृशति वा ‘सर्वमेव भगवान् वासुदेवः’ इत्येवंग्रहाविष्टबुद्धिः मद्भक्तः स एतत् यथोक्तं सम्यग्दर्शनं विज्ञाय, मद्भावाय मम भावः मद्भावः परमात्मभावः तस्मै मद्भावाय उपपद्यते मोक्षं गच्छति॥ १८॥", "padacchedaText": "", "audioFile": "PB_002470.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002471", "originalText": "तत्र सप्तमे ईश्वरस्य द्वे प्रकृती उपन्यस्ते, परापरे क्षेत्रक्षेत्रज्ञलक्षणे, ‘एतद्योनीनि भूतानि’ (भ.गी.७.६) इति च उक्तम्।", "padacchedaText": "", "audioFile": "PB_002471.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002472", "originalText": "क्षेत्रक्षेत्रज्ञप्रकृतिद्वययोनित्वं कथं भूतानामिति अयमर्थः अधुना उच्यते—\nप्रकृतिं पुरुषं चैव विद्ध्यनादी उभावपि। विकारांश्च गुणांश्चैव विद्धि प्रकृतिसम्भवान्॥ १९॥", "padacchedaText": "", "audioFile": "PB_002472.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002473", "originalText": "प्रकृतिं पुरुषं चैव ईश्वरस्य प्रकृती तौ प्रकृतिपुरुषौ उभावपि अनादी विद्धि, न विद्यते आदिः ययोः तौ अनादी।", "padacchedaText": "", "audioFile": "PB_002473.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002474", "originalText": "नित्येश्वरत्वात् ईश्वरस्य तत्प्रकृत्योरपि युक्तं नित्यत्वेन भवितुम्।", "padacchedaText": "", "audioFile": "PB_002474.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002475", "originalText": "प्रकृतिद्वयवत्त्वमेव हि ईश्वरस्य ईश्वरत्वम्। याभ्यां प्रकृतिभ्याम् ईश्वरः जगदुत्पत्तिस्थितिप्रलयहेतुः, ते द्वे अनादी सत्यौ संसारस्य कारणम्॥", "padacchedaText": "", "audioFile": "PB_002475.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002476", "originalText": "न आदी अनादी इति तत्पुरुषसमासं केचित् वर्णयन्ति।", "padacchedaText": "", "audioFile": "PB_002476.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002477", "originalText": "तेन हि किल ईश्वरस्य कारणत्वं सिध्यति।", "padacchedaText": "", "audioFile": "PB_002477.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002478", "originalText": "यदि पुनः प्रकृतिपुरुषावेव नित्यौ स्यातां तत्कृतमेव जगत् न ईश्वरस्य जगतः कर्तृत्वम्।", "padacchedaText": "", "audioFile": "PB_002478.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002479", "originalText": "तत् असत्, प्राक् प्रकृतिपुरुषयोः उत्पत्तेः ईशितव्याभावात् ईश्वरस्य अनीश्वरत्वप्रसङ्गात्, संसारस्य निर्निमित्तत्वे अनिर्मोक्षप्रसङ्गात् शास्त्रानर्थक्यप्रसङ्गात् बन्धमोक्षाभावप्रसङ्गाच्च।", "padacchedaText": "", "audioFile": "PB_002479.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002480", "originalText": "नित्यत्वे पुनः ईश्वरस्य प्रकृत्योः सर्वमेतत् उपपन्नं भवेत्।", "padacchedaText": "", "audioFile": "PB_002480.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002481", "originalText": "कथम्?\nविकारांश्च गुणांश्चैव वक्ष्यमाणान्विकारान् बुद्ध्यादिदेहेन्द्रियान्तान् गुणांश्च सुखदुःखमोहप्रत्ययाकारपरिणतान् विद्धि जानीहि प्रकृतिसम्भवान्, प्रकृतिः ईश्वरस्य विकारकारणशक्तिः त्रिगुणात्मिका माया, सा सम्भवो येषां विकाराणां गुणानां च तान् विकारान् गुणांश्च विद्धि प्रकृतिसम्भवान् प्रकृतिपरिणामान्॥ १९॥", "padacchedaText": "", "audioFile": "PB_002481.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002482", "originalText": "के पुनः ते विकाराः गुणाश्च प्रकृतिसम्भवाः—\nकार्यकरणकर्तृत्वे हेतुः प्रकृतिरुच्यते। पुरुषः सुखदुःखानां भोक्तृत्वे हेतुरुच्यते॥ २०॥", "padacchedaText": "", "audioFile": "PB_002482.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002483", "originalText": "कार्यकरणकर्तृत्वे— कार्यं शरीरं करणानि तत्स्थानि त्रयोदश।", "padacchedaText": "", "audioFile": "PB_002483.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002484", "originalText": "देहस्यारम्भकाणि भूतानि पञ्च विषयाश्च प्रकृतिसम्भवाः विकाराः पूर्वोक्ताः इह कार्यग्रहणेन गृह्यन्ते।", "padacchedaText": "", "audioFile": "PB_002484.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002485", "originalText": "गुणाश्च प्रकृतिसम्भवाः सुखदुःखमोहात्मकाः करणाश्रयत्वात् करणग्रहणेन गृह्यन्ते।", "padacchedaText": "", "audioFile": "PB_002485.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002486", "originalText": "तेषां कार्यकरणानां कर्तृत्वम् उत्पादकत्वं यत् तत् कार्यकरणकर्तृत्वं तस्मिन् कार्यकरणकर्तृत्वे हेतुः कारणम् आरम्भकत्वेन प्रकृतिः उच्यते।", "padacchedaText": "", "audioFile": "PB_002486.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002487", "originalText": "एवं कार्यकरणकर्तृत्वेन संसारस्य कारणं प्रकृतिः।", "padacchedaText": "", "audioFile": "PB_002487.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002488", "originalText": "कार्यकारणकर्तृत्वे इत्यस्मिन्नपि पाठे, कार्यं यत् यस्य परिणामः तत् तस्य कार्यं विकारः विकारि कारणं तयोः विकारविकारिणोः कार्यकारणयोः कर्तृत्वे इति।", "padacchedaText": "", "audioFile": "PB_002488.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002489", "originalText": "अथवा, षोडश विकाराः कार्यं सप्त प्रकृतिविकृतयः कारणम् तान्येव कार्यकारणान्युच्यन्ते तेषां कर्तृत्वे हेतुः प्रकृतिः उच्यते, आरम्भकत्वेनैव। पुरुषश्च संसारस्य कारणं यथा स्यात् तत् उच्यते— पुरुषः जीवः क्षेत्रज्ञः भोक्ता इति पर्यायः, सुखदुःखानां भोग्यानां भोक्तृत्वे उपलब्धृत्वे हेतुः उच्यते॥", "padacchedaText": "", "audioFile": "PB_002489.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002490", "originalText": "कथं पुनः अनेन कार्यकरणकर्तृत्वेन सुखदुःखभोक्तृत्वेन च प्रकृतिपुरुषयोः संसारकारणत्वमुच्यते इति, अत्र उच्यते— कार्यकरणसुखदुःखरूपेण हेतुफलात्मना प्रकृतेः परिणामाभावे, पुरुषस्य च चेतनस्य असति तदुपलब्धृत्वे, कुतः संसारः स्यात्? यदा पुनः कार्यकरणसुखदुःखस्वरूपेण हेतुफलात्मना परिणतया प्रकृत्या भोग्यया पुरुषस्य तद्विपरीतस्य भोक्तृत्वेन अविद्यारूपः संयोगः स्यात्, तदा संसारः स्यात् इति।", "padacchedaText": "", "audioFile": "PB_002490.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002491", "originalText": "अतः यत् प्रकृतिपुरुषयोः कार्यकरणकर्तृत्वेन सुखदुःखभोक्तृत्वेन च संसारकारणत्वमुक्तम्, तत् युक्तम्।", "padacchedaText": "", "audioFile": "PB_002491.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002492", "originalText": "कः पुनः अयं संसारो नाम? सुखदुःखसम्भोगः संसारः। पुरुषस्य च सुखदुःखानां सम्भोक्तृत्वं संसारित्वमिति॥ २०॥", "padacchedaText": "", "audioFile": "PB_002492.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002493", "originalText": "यत् पुरुषस्य सुखदुःखानां भोक्तृत्वं संसारित्वम् इति उक्तं तस्य तत् किंनिमित्तमिति उच्यते—\nपुरुषः प्रकृतिस्थो हि भुङ्क्ते प्रकृतिजान्गुणान्। कारणं गुणसङ्गोऽस्य सदसद्योनिजन्मसु॥ २१॥", "padacchedaText": "", "audioFile": "PB_002493.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002494", "originalText": "पुरुषः भोक्ता प्रकृतिस्थः प्रकृतौ अविद्यालक्षणायां कार्यकरणरूपेण परिणतायां स्थितः प्रकृतिस्थः, प्रकृतिमात्मत्वेन गतः इत्येतत्, हि यस्मात्, तस्मात् भुङ्क्ते उपलभते इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_002494.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002495", "originalText": "प्रकृतिजान् प्रकृतितः जातान् सुखदुःखमोहाकाराभिव्यक्तान् गुणान् ‘सुखी, दुःखी, मूढः, पण्डितः अहम्’ इत्येवम्।", "padacchedaText": "", "audioFile": "PB_002495.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002496", "originalText": "सत्यामपि अविद्यायां सुखदुःखमोहेषु गुणेषु भुज्यमानेषु यः सङ्गः आत्मभावः संसारस्य सः प्रधानं कारणं जन्मनः, ‘सः यथाकामो भवति तत्क्रतुर्भवति’ (बृ.४.४.५) इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_002496.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002497", "originalText": "तदेतत् आह— कारणं हेतुः गुणसङ्गः गुणेषु सङ्गः अस्य पुरुषस्य भोक्तुः सदसद्योनिजन्मसु, सत्यश्च असत्यश्च योनयः सदसद्योनयः तासु सदसद्योनिषु जन्मानि सदसद्योनिजन्मानि, तेषु सदसद्योनिजन्मसु विषयभूतेषु कारणं गुणसङ्गः।", "padacchedaText": "", "audioFile": "PB_002497.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002498", "originalText": "अथवा, सदसद्योनिजन्मसु अस्य संसारस्य कारणं गुणसङ्गः इति संसारपदमध्याहार्यम्।", "padacchedaText": "", "audioFile": "PB_002498.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002499", "originalText": "सद्योनयः देवादियोनयः, असद्योनयः पश्वादियोनयः। सामर्थ्यात् सदसद्योनयः मनुष्ययोनयोऽपि अविरुद्धाः द्रष्टव्याः॥", "padacchedaText": "", "audioFile": "PB_002499.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002500", "originalText": "एतत् उक्तं भवति— प्रकृतिस्थत्वाख्या अविद्या, गुणेषु च सङ्गः कामः, संसारस्य कारणमिति।", "padacchedaText": "", "audioFile": "PB_002500.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002501", "originalText": "तच्च परिवर्जनाय उच्यते।", "padacchedaText": "", "audioFile": "PB_002501.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002502", "originalText": "अस्य च निवृत्तिकारणं ज्ञानवैराग्ये ससंन्यासे गीताशास्त्रे प्रसिद्धम्।", "padacchedaText": "", "audioFile": "PB_002502.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002503", "originalText": "तच्च ज्ञानं पुरस्तात् उपन्यस्तं क्षेत्रक्षेत्रज्ञविषयम् ‘यज्ज्ञात्वामृतमश्नुते’ (भ.गी.१३.१२) इति। उक्तं च अन्यापोहेन अतद्धर्माध्यारोपेण च॥ २१॥", "padacchedaText": "", "audioFile": "PB_002503.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002504", "originalText": "तस्यैव पुनः साक्षात् निर्देशः क्रियते—\nउपद्रष्टानुमन्ता च भर्ता भोक्ता महेश्वरः। परमात्मेति चाप्युक्तो देहेऽस्मिन्पुरुषः परः॥ २२॥", "padacchedaText": "", "audioFile": "PB_002504.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002505", "originalText": "उपद्रष्टा समीपस्थः सन् द्रष्टा स्वयम् अव्यापृतः।", "padacchedaText": "", "audioFile": "PB_002505.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002506", "originalText": "यथा ऋत्विग्यजमानेषु यज्ञकर्मव्यापृतेषु तटस्थः अन्यः अव्यापृतः यज्ञविद्याकुशलः ऋत्विग्यजमानव्यापारगुणदोषाणाम् ईक्षिता, तद्वच्च कार्यकरणव्यापारेषु अव्यापृतः अन्यः तद्विलक्षणः तेषां कार्यकरणानां सव्यापाराणां सामीप्येन द्रष्टा उपद्रष्टा।", "padacchedaText": "", "audioFile": "PB_002506.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002507", "originalText": "अथवा, देहचक्षुर्मनोबुद्ध्यात्मानः द्रष्टारः, तेषां बाह्यः द्रष्टा देहः, ततः आरभ्य अन्तरतमश्च प्रत्यक् समीपे आत्मा द्रष्टा, यतः परः अन्तरतमः नास्ति द्रष्टा, सः अतिशयसामीप्येन द्रष्टृत्वात् उपद्रष्टा स्यात्।", "padacchedaText": "", "audioFile": "PB_002507.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002508", "originalText": "यज्ञोपद्रष्टृवद्वा सर्वविषयीकरणात् उपद्रष्टा।", "padacchedaText": "", "audioFile": "PB_002508.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002509", "originalText": "अनुमन्ता च, अनुमोदनम् अनुमननं कुर्वत्सु तत्क्रियासु परितोषः, तत्कर्ता अनुमन्ता च।", "padacchedaText": "", "audioFile": "PB_002509.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002510", "originalText": "अथवा, अनुमन्ता, कार्यकरणप्रवृत्तिषु स्वयम् अप्रवृत्तोऽपि प्रवृत्त इव तदनुकूलः विभाव्यते, तेन अनुमन्ता।", "padacchedaText": "", "audioFile": "PB_002510.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002511", "originalText": "अथवा, प्रवृत्तान् स्वव्यापारेषु तत्साक्षिभूतः कदाचिदपि न निवारयति इति अनुमन्ता।", "padacchedaText": "", "audioFile": "PB_002511.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002512", "originalText": "भर्ता, भरणं नाम देहेन्द्रियमनोबुद्धीनां संहतानां चैतन्यात्मपारार्थ्येन निमित्तभूतेन चैतन्याभासानां यत् स्वरूपधारणम्, तत् चैतन्यात्मकृतमेव इति भर्ता आत्मा इति उच्यते।", "padacchedaText": "", "audioFile": "PB_002512.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002513", "originalText": "भोक्ता, अग्न्युष्णवत् नित्यचैतन्यस्वरूपेण बुद्धेः सुखदुःखमोहात्मकाः प्रत्ययाः सर्वविषयविषयाः चैतन्यात्मग्रस्ता इव जायमानाः विभक्ताः विभाव्यन्ते इति भोक्ता आत्मा उच्यते।", "padacchedaText": "", "audioFile": "PB_002513.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002514", "originalText": "महेश्वरः, सर्वात्मत्वात् स्वतन्त्रत्वाच्च महान् ईश्वरश्च इति महेश्वरः।", "padacchedaText": "", "audioFile": "PB_002514.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002515", "originalText": "परमात्मा, देहादीनां बुद्ध्यन्तानां प्रत्यगात्मत्वेन कल्पितानाम् अविद्यया परमः उपद्रष्टृत्वादिलक्षणः आत्मा इति परमात्मा।", "padacchedaText": "", "audioFile": "PB_002515.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002516", "originalText": "सः अतः ‘परमात्मा’ इत्यनेन शब्देन च अपि उक्तः कथितः श्रुतौ।", "padacchedaText": "", "audioFile": "PB_002516.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002517", "originalText": "क्व असौ? अस्मिन् देहे पुरुषः परः अव्यक्तात्, ‘उत्तमः पुरुषस्त्वन्यः परमात्मेत्युदाहृतः’ (भ.गी.१५.१७) इति यः वक्ष्यमाणः‘क्षेत्रज्ञं चापि मां विद्धि’ (भ.गी.१३.२) इति उपन्यस्तः व्याख्याय उपसंहृतश्च॥ २२॥", "padacchedaText": "", "audioFile": "PB_002517.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002518", "originalText": "तमेतं यथोक्तलक्षणम् आत्मानम्—\nय एवं वेत्ति पुरुषं प्रकृतिं च गुणैः सह। सर्वथा वर्तमानोऽपि न स भूयोऽभिजायते॥ २३॥", "padacchedaText": "", "audioFile": "PB_002518.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002519", "originalText": "यः एवं यथोक्तप्रकारेण वेत्ति पुरुषं साक्षात् अहमिति प्रकृतिं च यथोक्ताम् अविद्यालक्षणां गुणैः स्वविकारैः सह निवर्तिताम् अभावम् आपादितां विद्यया, सर्वथा सर्वप्रकारेण वर्तमानोऽपि सः भूयः पुनः पतिते अस्मिन् विद्वच्छरीरे देहान्तराय न अभिजायते न उत्पद्यते, देहान्तरं न गृह्णाति इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_002519.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002520", "originalText": "अपिशब्दात् किमु वक्तव्यं स्ववृत्तस्थो न जायते इति अभिप्रायः॥", "padacchedaText": "", "audioFile": "PB_002520.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002521", "originalText": "ननु, यद्यपि ज्ञानोत्पत्त्यनन्तरं पुनर्जन्माभाव उक्तः, तथापि प्राक् ज्ञानोत्पत्तेः कृतानां कर्मणाम् उत्तरकालभाविनां च, यानि च अतिक्रान्तानेकजन्मकृतानि तेषां च, फलमदत्त्वा नाशो न युक्त इति, स्युः त्रीणि जन्मानि, कृतविप्रणाशो हि न युक्त इति, यथा फले प्रवृत्तानाम् आरब्धजन्मनां कर्मणाम्।", "padacchedaText": "", "audioFile": "PB_002521.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002522", "originalText": "न च कर्मणां विशेषः अवगम्यते।", "padacchedaText": "", "audioFile": "PB_002522.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002523", "originalText": "तस्मात् त्रिप्रकाराण्यपि कर्माणि त्रीणि जन्मानि आरभेरन्, संहतानि वा सर्वाणि एकं जन्म आरभेरन्।", "padacchedaText": "", "audioFile": "PB_002523.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002524", "originalText": "अन्यथा कृतविनाशे सति सर्वत्र अनाश्वासप्रसङ्गः, शास्त्रानर्थक्यं च स्यात्।", "padacchedaText": "", "audioFile": "PB_002524.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002525", "originalText": "इत्यतः इदमयुक्तमुक्तम् ‘न स भूयोऽभिजायते’ इति।", "padacchedaText": "", "audioFile": "PB_002525.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002526", "originalText": "न, ‘क्षीयन्ते चास्य कर्माणि’ (मु.२.२.९) ‘ब्रह्म वेद ब्रह्मैव भवति’ (मु.३.२.९) ‘तस्य तावदेव चिरम्’ (छा.६.१४.२) ‘इषीकातूलवत् सर्वाणि कर्माणि प्रदूयन्ते’ (छा.५.२४.३) इत्यादिश्रुतिशतेभ्यः उक्तो विदुषः सर्वकर्मदाहः।", "padacchedaText": "", "audioFile": "PB_002526.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002527", "originalText": "इहापि च उक्तः ‘यथैधांसि’ (भ.गी.४.३७) इत्यादिना सर्वकर्मदाहः, वक्ष्यति च।", "padacchedaText": "", "audioFile": "PB_002527.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002528", "originalText": "उपपत्तेश्च— अविद्याकामक्लेशबीजनिमित्तानि हि कर्माणि जन्मान्तराङ्कुरम् आरभन्ते, इहापि च ‘साहङ्काराभिसन्धीनि कर्माणि फलारम्भकाणि, न इतराणि’ इति तत्र तत्र भगवता उक्तम्।", "padacchedaText": "", "audioFile": "PB_002528.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002529", "originalText": "‘बीजान्यग्न्युपदग्धानि न रोहन्ति यथा पुनः।", "padacchedaText": "", "audioFile": "PB_002529.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002530", "originalText": "ज्ञानदग्धैस्तथा क्लेशैर्नात्मा सम्पद्यते पुनः’ (मो.२११.१७) इति च।", "padacchedaText": "", "audioFile": "PB_002530.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002531", "originalText": "अस्तु तावत् ज्ञानोत्पत्त्युत्तरकालकृतानां कर्मणां ज्ञानेन दाहः ज्ञानसहभावित्वात्।", "padacchedaText": "", "audioFile": "PB_002531.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002532", "originalText": "न तु इह जन्मनि ज्ञानोत्पत्तेः प्राक् कृतानां कर्मणां अतीतजन्मकृतानां च दाहः युक्तः।", "padacchedaText": "", "audioFile": "PB_002532.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002533", "originalText": "न, ‘सर्वकर्माणि’ (भ.गी.४.३७) इति विशेषणात्।", "padacchedaText": "", "audioFile": "PB_002533.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002534", "originalText": "ज्ञानोत्तरकालभाविनामेव सर्वकर्मणाम् इति चेत्, न, सङ्कोचे कारणानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_002534.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002535", "originalText": "यत्तु उक्तम् ‘यथा वर्तमानजन्मारम्भकाणि कर्माणि न क्षीयन्ते फलदानाय प्रवृत्तान्येव सत्यपि ज्ञाने, तथा अनारब्धफलानामपि कर्मणां क्षयो न युक्तः’ इति, तत् असत्।", "padacchedaText": "", "audioFile": "PB_002535.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002536", "originalText": "कथम्? तेषां मुक्तेषुवत् प्रवृत्तफलत्वात्।", "padacchedaText": "", "audioFile": "PB_002536.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002537", "originalText": "यथा पूर्वं लक्ष्यवेधाय मुक्तः इषुः धनुषः लक्ष्यवेधोत्तरकालमपि आरब्धवेगक्षयात् पतनेनैव निवर्तते, एवं शरीरारम्भकं कर्म शरीरस्थितिप्रयोजने निवृत्तेऽपि, आ संस्कारवेगक्षयात् पूर्ववत् वर्तते एव।", "padacchedaText": "", "audioFile": "PB_002537.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002538", "originalText": "यथा स एव इषुः प्रवृत्तिनिमित्तानारब्धवेगस्तु अमुक्तो धनुषि प्रयुक्तोऽपि उपसंह्रियते, तथा अनारब्धफलानि कर्माणि स्वाश्रयस्थान्येव ज्ञानेन निर्बीजीक्रियन्ते इति, पतिते अस्मिन् विद्वच्छरीरे ‘न स भूयोऽभिजायते’ इति युक्तमेव उक्तमिति सिद्धम्॥ २३॥", "padacchedaText": "", "audioFile": "PB_002538.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002539", "originalText": "अत्र आत्मदर्शने उपायविकल्पाः इमे ध्यानादयः उच्यन्ते—\nध्यानेनात्मनि पश्यन्ति केचिदात्मानमात्मना। अन्ये साङ्ख्येन योगेन कर्मयोगेन चापरे॥ २४॥", "padacchedaText": "", "audioFile": "PB_002539.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002540", "originalText": "ध्यानेन, ध्यानं नाम शब्दादिभ्यो विषयेभ्यः श्रोत्रादीनि करणानि मनसि उपसंहृत्य, मनश्च प्रत्यक्चेतयितरि, एकाग्रतया यत् चिन्तनं तत् ध्यानम्, तथा, ध्यायतीव बकः, ध्यायतीव पृथिवी, ध्यायन्तीव पर्वताः इति उपमोपादानात्।", "padacchedaText": "", "audioFile": "PB_002540.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002541", "originalText": "तैलधारावत् सन्ततः अविच्छिन्नप्रत्ययो ध्यानम्, तेन ध्यानेन आत्मनि बुद्धौ पश्यन्ति आत्मानं प्रत्यक्चेतनम् आत्मना स्वेनैव प्रत्यक्चेतनेन ध्यानसंस्कृतेन अन्तःकरणेन केचित् योगिनः।", "padacchedaText": "", "audioFile": "PB_002541.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002542", "originalText": "अन्ये साङ्ख्येन योगेन, साङ्ख्यं नाम ‘इमे सत्त्वरजस्तमांसि गुणाः मया दृश्या अहं तेभ्योऽन्यः तद्व्यापारसाक्षिभूतः नित्यः गुणविलक्षणः आत्मा’ इति चिन्तनम् एषः साङ्ख्यो योगः, तेन ‘पश्यन्ति आत्मानमात्मना’ इति वर्तते।", "padacchedaText": "", "audioFile": "PB_002542.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002543", "originalText": "कर्मयोगेन, कर्मैव योगः, ईश्वरार्पणबुद्ध्या अनुष्ठीयमानं घटनरूपं योगार्थत्वात् योगः उच्यते गुणतः, तेन सत्त्वशुद्धिज्ञानोत्पत्तिद्वारेण च अपरे॥ २४॥", "padacchedaText": "", "audioFile": "PB_002543.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002544", "originalText": "अन्ये त्वेवमजानन्तः श्रुत्वान्येभ्य उपासते। तेऽपि चातितरन्त्येव मृत्युं श्रुतिपरायणाः॥ २५॥", "padacchedaText": "", "audioFile": "PB_002544.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002545", "originalText": "अन्ये तु एषु विकल्पेषु अन्यतमेनापि एवं यथोक्तम् आत्मानम् अजानन्तः अन्येभ्यः आचार्येभ्यः श्रुत्वा ‘इदमेव चिन्तयत’ इति उक्ताः उपासते श्रद्दधानाः सन्तः चिन्तयन्ति।", "padacchedaText": "", "audioFile": "PB_002545.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002546", "originalText": "तेऽपि च अतितरन्त्येव अतिक्रामन्त्येव मृत्युम्, मृत्युयुक्तं संसारम् इत्येतत्।", "padacchedaText": "", "audioFile": "PB_002546.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002547", "originalText": "श्रुतिपरायणाः श्रुतिः श्रवणं परम् अयनं गमनं मोक्षमार्गप्रवृत्तौ परं साधनं येषां ते श्रुतिपरायणाः, केवलपरोपदेशप्रमाणाः स्वयं विवेकरहिताः इत्यभिप्रायः। किमु वक्तव्यम् प्रमाणं प्रति स्वतन्त्राः विवेकिनः मृत्युम् अतितरन्ति इति अभिप्रायः॥ २५॥", "padacchedaText": "", "audioFile": "PB_002547.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002548", "originalText": "क्षेत्रज्ञेश्वरैकत्वविषयं ज्ञानं मोक्षसाधनम् ‘यज्ज्ञात्वामृतमश्नुते’ (भ.गी.१३.१२) इत्युक्तम्, तत् कस्मात् हेतोरिति, तद्धेतुप्रदर्शनार्थं श्लोकः आरभ्यते—\nयावत्सञ्जायते किञ्चित्सत्त्वं स्थावरजङ्गमम्।", "padacchedaText": "", "audioFile": "PB_002548.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002549", "originalText": "क्षेत्रक्षेत्रज्ञसंयोगात्तद्विद्धि भरतर्षभ॥ २६॥", "padacchedaText": "", "audioFile": "PB_002549.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002550", "originalText": "यावत् यत् किञ्चित् सञ्जायते समुत्पद्यते सत्त्वं वस्तु, किम् अविशेषेण? नेत्याह— स्थावरजङ्गमं स्थावरं जङ्गमं च क्षेत्रक्षेत्रज्ञसंयोगात् तत् जायते इत्येवं विद्धि जानीहि भरतर्षभ॥", "padacchedaText": "", "audioFile": "PB_002550.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002551", "originalText": "कः पुनः अयं क्षेत्रक्षेत्रज्ञयोः संयोगः अभिप्रेतः? न तावत् रज्ज्वेव घटस्य अवयवसंश्लेषद्वारकः सम्बन्धविशेषः संयोगः क्षेत्रेण क्षेत्रज्ञस्य सम्भवति, आकाशवत् निरवयवत्वात्।", "padacchedaText": "", "audioFile": "PB_002551.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002552", "originalText": "नापि समवायलक्षणः तन्तुपटयोरिव क्षेत्रक्षेत्रज्ञयोः इतरेतरकार्यकारणभावानभ्युपगमात् इति, उच्यते— क्षेत्रक्षेत्रज्ञयोः विषयविषयिणोः भिन्नस्वभावयोः इतरेतरतद्धर्माध्यासलक्षणः संयोगः क्षेत्रक्षेत्रज्ञस्वरूपविवेकाभावनिबन्धनः, रज्जुशुक्तिकादीनां तद्विवेकज्ञानाभावात् अध्यारोपितसर्परजतादिसंयोगवत्।", "padacchedaText": "", "audioFile": "PB_002552.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002553", "originalText": "सः अयं अध्यासस्वरूपः क्षेत्रक्षेत्रज्ञसंयोगः मिथ्याज्ञानलक्षणः।", "padacchedaText": "", "audioFile": "PB_002553.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002554", "originalText": "यथाशास्त्रं क्षेत्रक्षेत्रज्ञलक्षणभेदपरिज्ञानपूर्वकं प्राक् दर्शितरूपात् क्षेत्रात् मुञ्जादिव इषीकां यथोक्तलक्षणं क्षेत्रज्ञं प्रविभज्य ‘न सत्तन्नासदुच्यते’ (भ.गी.१३.१२) इत्यनेन निरस्तसर्वोपाधिविशेषं ज्ञेयं ब्रह्मस्वरूपेण यः पश्यति, क्षेत्रं च मायानिर्मितहस्तिस्वप्नदृष्टवस्तुगन्धर्वनगरादिवत् ‘असदेव सदिव अवभासते’ इति एवं निश्चितविज्ञानः यः, तस्य यथोक्तसम्यग्दर्शनविरोधात् अपगच्छति मिथ्याज्ञानम्।", "padacchedaText": "", "audioFile": "PB_002554.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002555", "originalText": "तस्य जन्महेतोः अपगमात् ‘य एवं वेत्ति पुरुषं प्रकृतिं च गुणैः सह’ (भ.गी.१३.२३) इत्यनेन ‘विद्वान् भूयः न अभिजायते’ इति यत् उक्तम्, तत् उपपन्नमुक्तम्॥ २६॥", "padacchedaText": "", "audioFile": "PB_002555.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002556", "originalText": "‘न स भूयोऽभिजायते’ (भ.गी.१३.२३) इति सम्यग्दर्शनफलम् अविद्यादिसंसारबीजनिवृत्तिद्वारेण जन्माभावः उक्तः।", "padacchedaText": "", "audioFile": "PB_002556.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002557", "originalText": "जन्मकारणं च अविद्यानिमित्तकः क्षेत्रक्षेत्रज्ञसंयोगः उक्तः, अतः तस्याः अविद्यायाः निवर्तकं सम्यग्दर्शनम् उक्तमपि पुनः शब्दान्तरेण उच्यते—\nसमं सर्वेषु भूतेषु तिष्ठन्तं परमेश्वरम्।", "padacchedaText": "", "audioFile": "PB_002557.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002558", "originalText": "विनश्यत्स्वविनश्यन्तं यः पश्यति स पश्यति॥ २७॥", "padacchedaText": "", "audioFile": "PB_002558.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002559", "originalText": "समं निर्विशेषं तिष्ठन्तं स्थितिं कुर्वन्तम्, क्व? सर्वेषु समस्तेषु भूतेषु ब्रह्मादिस्थावरान्तेषु प्राणिषु, कम्? परमेश्वरं देहेन्द्रियमनोबुद्ध्यव्यक्तात्मनः अपेक्ष्य परमेश्वरः, तं सर्वेषु भूतेषु समं तिष्ठन्तम्।", "padacchedaText": "", "audioFile": "PB_002559.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002560", "originalText": "तानि विशिनष्टि विनश्यत्सु इति, तं च परमेश्वरम् अविनश्यन्तम् इति, भूतानां परमेश्वरस्य च अत्यन्तवैलक्षण्यप्रदर्शनार्थम्।", "padacchedaText": "", "audioFile": "PB_002560.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002561", "originalText": "कथम्? सर्वेषां हि भावविकाराणां जनिलक्षणः भावविकारो मूलम्, जन्मोत्तरकालभाविनः अन्ये सर्वे भावविकाराः विनाशान्ताः, विनाशात् परो न कश्चित् अस्ति भावविकारः, भावाभावात्।", "padacchedaText": "", "audioFile": "PB_002561.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002562", "originalText": "सति हि धर्मिणि धर्माः भवन्ति।", "padacchedaText": "", "audioFile": "PB_002562.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002563", "originalText": "अतः अन्त्यभावविकाराभावानुवादेन पूर्वभाविनः सर्वे भावविकाराः प्रतिषिद्धाः भवन्ति सह कार्यैः।", "padacchedaText": "", "audioFile": "PB_002563.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002564", "originalText": "तस्मात् सर्वभूतैः वैलक्षण्यम् अत्यन्तमेव परमेश्वरस्य सिद्धम्, निर्विशेषत्वम् एकत्वं च। यः एवं यथोक्तं परमेश्वरं पश्यति, सः पश्यति॥", "padacchedaText": "", "audioFile": "PB_002564.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002565", "originalText": "ननु सर्वोऽपि लोकः पश्यति, किं विशेषणेन इति।", "padacchedaText": "", "audioFile": "PB_002565.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002566", "originalText": "सत्यं पश्यति, किं तु विपरीतं पश्यति।", "padacchedaText": "", "audioFile": "PB_002566.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002567", "originalText": "अतः विशिनष्टि— स एव पश्यतीति।", "padacchedaText": "", "audioFile": "PB_002567.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002568", "originalText": "यथा तिमिरदृष्टिः अनेकं चन्द्रं पश्यति, तमपेक्ष्य एकचन्द्रदर्शी विशिष्यते— स एव पश्यतीति, तथा इहापि एकम् अविभक्तं यथोक्तं आत्मानं यः पश्यति, सः विभक्तानेकात्मविपरीतदर्शिभ्यः विशिष्यते— स एव पश्यतीति।", "padacchedaText": "", "audioFile": "PB_002568.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002569", "originalText": "इतरे पश्यन्तोऽपि न पश्यन्ति, विपरीतदर्शित्वात् अनेकचन्द्रदर्शिवत् इत्यर्थः॥ २७॥", "padacchedaText": "", "audioFile": "PB_002569.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002570", "originalText": "यथोक्तस्य सम्यग्दर्शनस्य फलवचनेन स्तुतिः कर्तव्या इति श्लोकः आरभ्यते—\nसमं पश्यन्हि सर्वत्र\nसमवस्थितमीश्वरम्। न हिनस्त्यात्मनात्मानं\nततो याति परां गतिम्॥ २८॥", "padacchedaText": "", "audioFile": "PB_002570.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002571", "originalText": "समं पश्यन् उपलभमानः हि यस्मात् सर्वत्र सर्वभूतेषु समवस्थितं तुल्यतया अवस्थितम् ईश्वरम् अतीतानन्तरश्लोकोक्तलक्षणमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_002571.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002572", "originalText": "समं पश्यन् किम्? न हिनस्ति हिंसां न करोति आत्मना स्वेनैव स्वमात्मानम्। ततः तदहिंसनात् याति परां प्रकृष्टां गतिं मोक्षाख्याम्॥", "padacchedaText": "", "audioFile": "PB_002572.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002573", "originalText": "ननु नैव कश्चित् प्राणी स्वयं स्वम् आत्मानं हिनस्ति।", "padacchedaText": "", "audioFile": "PB_002573.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002574", "originalText": "कथम् उच्यते अप्राप्तम् ‘न हिनस्ति’ इति? यथा ‘न पृथिव्यामग्निश्चेतव्यो नान्तरिक्षे’ (तै.सं.५.२.७) इत्यादि।", "padacchedaText": "", "audioFile": "PB_002574.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002575", "originalText": "नैष दोषः, अज्ञानाम् आत्मतिरस्करणोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_002575.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002576", "originalText": "सर्वो हि अज्ञः अत्यन्तप्रसिद्धं साक्षात् अपरोक्षात् आत्मानं तिरस्कृत्य अनात्मानम् आत्मत्वेन परिगृह्य, तमपि धर्माधर्मौ कृत्वा उपात्तम् आत्मानं हत्वा अन्यम् आत्मानम् उपादत्ते नवं तं चैवं हत्वा अन्यमेवं तमपि हत्वा अन्यम् इत्येवम् उपात्तमुपात्तम् आत्मानं हन्ति, इति आत्महा सर्वः अज्ञः।", "padacchedaText": "", "audioFile": "PB_002576.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002577", "originalText": "यस्तु परमार्थात्मा, असावपि सर्वदा अविद्यया हत इव, विद्यमानफलाभावात्, इति सर्वे आत्महनः एव अविद्वांसः।", "padacchedaText": "", "audioFile": "PB_002577.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002578", "originalText": "यस्तु इतरः यथोक्तात्मदर्शी, सः उभयथापि आत्मना आत्मानं न हिनस्ति न हन्ति। ततः याति परां गतिम् यथोक्तं फलं तस्य भवति इत्यर्थः॥ २८॥", "padacchedaText": "", "audioFile": "PB_002578.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002579", "originalText": "सर्वभूतस्थम् ईश्वरं समं पश्यन् ‘न हिनस्ति आत्मना आत्मानम्’ इति उक्तम्।", "padacchedaText": "", "audioFile": "PB_002579.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002580", "originalText": "तत् अनुपपन्नं स्वगुणकर्मवैलक्षण्यभेदभिन्नेषु आत्मसु, इत्येतत् आशङ्क्य आह—\nप्रकृत्यैव च कर्माणि क्रियमाणानि सर्वशः। यः पश्यति तथात्मानमकर्तारं स पश्यति॥ २९॥", "padacchedaText": "", "audioFile": "PB_002580.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002581", "originalText": "प्रकृत्या प्रकृतिः भगवतः माया त्रिगुणात्मिका, ‘मायां तु प्रकृतिं विद्यात्’ (श्वे.४.१०) इति मन्त्रवर्णात्, तया प्रकृत्यैव च न अन्येन महदादिकार्यकारणाकारपरिणतया कर्माणि वाङ्मनःकायारभ्याणि क्रियमाणानि निर्वर्त्यमानानि सर्वशः सर्वप्रकारैः यः पश्यति उपलभते, तथा आत्मानं क्षेत्रज्ञम् अकर्तारं सर्वोपाधिविवर्जितं सः पश्यति, सः परमार्थदर्शी इत्यभिप्रायः, निर्गुणस्य अकर्तुः निर्विशेषस्य आकाशस्येव भेदे प्रमाणानुपपत्तिः इत्यर्थः॥ २९॥", "padacchedaText": "", "audioFile": "PB_002581.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002582", "originalText": "पुनरपि तदेव सम्यग्दर्शनं शब्दान्तरेण प्रपञ्चयति—\nयदा भूतपृथग्भावमेकस्थमनुपश्यति। तत एव च विस्तारं ब्रह्म सम्पद्यते तदा॥ ३०॥", "padacchedaText": "", "audioFile": "PB_002582.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002583", "originalText": "यदा यस्मिन् काले भूतपृथग्भावं भूतानां पृथग्भावं पृथक्त्वम् एकस्मिन् आत्मनि स्थितं एकस्थम् अनुपश्यति शास्त्राचार्योपदेशम्, अनु आत्मानं प्रत्यक्षत्वेन पश्यति ‘आत्मैव इदं सर्वम्’ (छा.७.२५.२) इति, तत एव च तस्मादेव च विस्तारं उत्पत्तिं विकासम् ‘आत्मतः प्राण आत्मत आशा आत्मतः स्मर आत्मत आकाश आत्मतस्तेज आत्मत आप आत्मत आविर्भावतिरोभावावात्मतोऽन्नम्’ (छा.७.२६.१) इत्येवमादिप्रकारैः विस्तारं यदा पश्यति, ब्रह्म सम्पद्यते ब्रह्मैव भवति तदा तस्मिन् काले इत्यर्थः॥ ३०॥", "padacchedaText": "", "audioFile": "PB_002583.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002584", "originalText": "एकस्य आत्मानः सर्वदेहात्मत्वे तद्दोषसम्बन्धे प्राप्ते, इदम् उच्यते—\nअनादित्वान्निर्गुणत्वात्परमात्मायमव्ययः। शरीरस्थोऽपि कौन्तेय न करोति न लिप्यते॥ ३१॥", "padacchedaText": "", "audioFile": "PB_002584.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002585", "originalText": "अनादित्वात् अनादेः भावः अनादित्वम्, आदिः कारणम्, तत् यस्य नास्ति तत् आनादि।", "padacchedaText": "", "audioFile": "PB_002585.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002586", "originalText": "यद्धि आदिमत् तत् स्वेन आत्मना व्येति, अयं तु अनादित्वात् निरवयव इति कृत्वा न व्येति।", "padacchedaText": "", "audioFile": "PB_002586.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002587", "originalText": "तथा निर्गुणत्वात्।", "padacchedaText": "", "audioFile": "PB_002587.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002588", "originalText": "सगुणो हि गुणव्ययात् व्येति, अयं तु निर्गुणत्वाच्च न व्येति, इति परमात्मा अयम् अव्ययः, न अस्य व्ययो विद्यते इति अव्ययः।", "padacchedaText": "", "audioFile": "PB_002588.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002589", "originalText": "यत एवमतः शरीरस्थोऽपि, शरीरेषु आत्मनः उपलब्धिः भवतीति शरीरस्थः उच्यते, तथापि न करोति।", "padacchedaText": "", "audioFile": "PB_002589.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002590", "originalText": "तदकरणादेव तत्फलेन न लिप्यते।", "padacchedaText": "", "audioFile": "PB_002590.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002591", "originalText": "यो हि कर्ता, सः कर्मफलेन लिप्यते। अयं तु अकर्ता, अतः न फलेन लिप्यते इत्यर्थः॥", "padaccheda
