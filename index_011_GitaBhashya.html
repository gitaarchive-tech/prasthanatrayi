Text": "", "audioFile": "PB_002591.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002592", "originalText": "कः पुनः देहेषु करोति लिप्यते च? यदि तावत् अन्यः परमात्मनो देही करोति लिप्यते च, ततः इदम् अनुपपन्नम् उक्तं क्षेत्रज्ञेश्वरैकत्वम् ‘क्षेत्रज्ञं चापि मां विद्धि’ (भ.गी.१३.२) इत्यादि।", "padacchedaText": "", "audioFile": "PB_002592.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002593", "originalText": "अथ नास्ति ईश्वरादन्यो देही, कः करोति लिप्यते च? इति वाच्यम्, परो वा नास्ति इति सर्वथा दुर्विज्ञेयं दुर्वाच्यं च इति भगवत्प्रोक्तम् औपनिषदं दर्शनं परित्यक्तं वैशेषिकैः साङ्ख्यार्हतबौद्धैश्च।", "padacchedaText": "", "audioFile": "PB_002593.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002594", "originalText": "तत्र अयं परिहारो भगवता स्वेनैव उक्तः ‘स्वभावस्तु प्रवर्तते’ (भ.गी.५.१४) इति।", "padacchedaText": "", "audioFile": "PB_002594.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002595", "originalText": "अविद्यामात्रस्वभावो हि करोति लिप्यते इति व्यवहारो भवति, न तु परमार्थत एकस्मिन् परमात्मनि तत् अस्ति।", "padacchedaText": "", "audioFile": "PB_002595.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002596", "originalText": "अतः एतस्मिन् परमार्थसाङ्ख्यदर्शने स्थितानां ज्ञाननिष्ठानां परमहंसपरिव्राजकानां तिरस्कृताविद्याव्यवहाराणां कर्माधिकारो नास्ति इति तत्र तत्र दर्शितं भगवता॥ ३१॥", "padacchedaText": "", "audioFile": "PB_002596.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002597", "originalText": "किमिव न करोति न लिप्यते इति अत्र दृष्टान्तमाह—\nयथा सर्वगतं सौक्ष्म्यादाकाशं नोपलिप्यते। सर्वत्रावस्थितो देहे तथात्मा नोपलिप्यते॥ ३२॥", "padacchedaText": "", "audioFile": "PB_002597.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002598", "originalText": "यथा सर्वगतं व्यापि अपि सत् सौक्ष्म्यात् सूक्ष्मभावात् आकाशं खं न उपलिप्यते न सम्बध्यते, सर्वत्र अवस्थितः देहे तथा आत्मा न उपलिप्यते॥ ३२॥", "padacchedaText": "", "audioFile": "PB_002598.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002599", "originalText": "किञ्च—\nयथा प्रकाशयत्येकः कृत्स्नं लोकमिमं रविः। क्षेत्रं क्षेत्री तथा कृत्स्नं प्रकाशयति भारत॥ ३३॥", "padacchedaText": "", "audioFile": "PB_002599.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002600", "originalText": "यथा प्रकाशयति अवभासयति एकः कृत्स्नं लोकम् इमं रविः सविता आदित्यः, तथा तद्वत् महाभूतादि धृत्यन्तं क्षेत्रम् एकः सन् प्रकाशयति।", "padacchedaText": "", "audioFile": "PB_002600.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002601", "originalText": "कः? क्षेत्री परमात्मा इत्यर्थः। रविदृष्टान्तः अत्र आत्मनः उभयार्थोऽपि भवति— रविवत् सर्वक्षेत्रेषु एक एव आत्मा, अलेपकश्च इति॥ ३३॥", "padacchedaText": "", "audioFile": "PB_002601.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002602", "originalText": "समस्ताध्यायार्थोपसंहारार्थः अयं श्लोकः—\nक्षेत्रक्षेत्रज्ञयोरेवमन्तरं ज्ञानचक्षुषा। भूतप्रकृतिमोक्षं च ये विदुर्यान्ति ते परम्॥ ३४॥", "padacchedaText": "", "audioFile": "PB_002602.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002603", "originalText": "क्षेत्रक्षेत्रज्ञयोः यथाव्याख्यातयोः एवं यथाप्रदर्शितप्रकारेण अन्तरम् इतरेतरवैलक्षण्यविशेषं ज्ञानचक्षुषा शास्त्राचार्यप्रसादोपदेशजनितम् आत्मप्रत्ययिकं ज्ञानं चक्षुः, तेन ज्ञानचक्षुषा, भूतप्रकृतिमोक्षं च, भूतानां प्रकृतिः अविद्यालक्षणा अव्यक्ताख्या, तस्याः भूतप्रकृतेः मोक्षणम् अभावगमनं च ये विदुः विजानन्ति, यान्ति गच्छन्ति ते परं परमात्मतत्त्वं ब्रह्म, न पुनः देहं आददते इत्यर्थः॥ ३४॥", "padacchedaText": "", "audioFile": "PB_002603.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002604", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ श्रीमद्भगवद्गीताभाष्ये त्रयोदशोऽध्यायः॥", "padacchedaText": "", "audioFile": "PB_002604.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002605", "originalText": "चतुर्दशोऽध्यायः\nसर्वम् उत्पद्यमानं क्षेत्रक्षेत्रज्ञसंयोगात् उत्पद्यते इति उक्तम्।", "padacchedaText": "", "audioFile": "PB_002605.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002606", "originalText": "तत् कथमिति, तत्प्रदर्शनार्थम् ‘परं भूयः’ इत्यादिः अध्यायः आरभ्यते।", "padacchedaText": "", "audioFile": "PB_002606.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002607", "originalText": "अथवा, ईश्वरपरतन्त्रयोः क्षेत्रक्षेत्रज्ञयोः जगत्कारणत्वं न तु साङ्ख्यानामिव स्वतन्त्रयोः इत्येवमर्थम्।", "padacchedaText": "", "audioFile": "PB_002607.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002608", "originalText": "प्रकृतिस्थत्वं गुणेषु च सङ्गः संसारकारणम् इति उक्तम्।", "padacchedaText": "", "audioFile": "PB_002608.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002609", "originalText": "कस्मिन् गुणे कथं सङ्गः? के वा गुणाः? कथं वा ते बध्नन्ति इति? गुणेभ्यश्च मोक्षणं कथं स्यात्? मुक्तस्य च लक्षणं वक्तव्यम्, इत्येवमर्थं च भगवान् उवाच—\nश्रीभगवानुवाच—\nपरं भूयः प्रवक्ष्यामि\nज्ञानानां ज्ञानमुत्तमम्।", "padacchedaText": "", "audioFile": "PB_002609.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002610", "originalText": "यज्ज्ञात्वा मुनयः सर्वे\nपरां सिद्धिमितो गताः॥ १॥", "padacchedaText": "", "audioFile": "PB_002610.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002611", "originalText": "परं ज्ञानम् इति व्यवहितेन सम्बन्धः, भूयः पुनः पूर्वेषु सर्वेष्वध्यायेषु असकृत् उक्तमपि प्रवक्ष्यामि।", "padacchedaText": "", "audioFile": "PB_002611.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002612", "originalText": "तच्च परं परवस्तुविषयत्वात्।", "padacchedaText": "", "audioFile": "PB_002612.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002613", "originalText": "किं तत्? ज्ञानं सर्वेषां ज्ञानानाम् उत्तमम्, उत्तमफलत्वात्।", "padacchedaText": "", "audioFile": "PB_002613.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002614", "originalText": "ज्ञानानाम् इति न अमानित्वादीनाम्, किं तर्हि? यज्ञादिज्ञेयवस्तुविषयाणाम् इति।", "padacchedaText": "", "audioFile": "PB_002614.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002615", "originalText": "तानि न मोक्षाय, इदं तु मोक्षाय इति परोत्तमशब्दाभ्यां स्तौति श्रोतृबुद्धिरुच्युत्पादनार्थम्। यत् ज्ञात्वा यत् ज्ञानं ज्ञात्वा प्राप्य मुनयः संन्यासिनः मननशीलाः सर्वे परां सिद्धिं मोक्षाख्याम् इतः अस्मात् देहबन्धनात् ऊर्ध्वं गताः प्राप्ताः॥ १॥", "padacchedaText": "", "audioFile": "PB_002615.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002616", "originalText": "अस्याश्च सिद्धेः ऐकान्तिकत्वं दर्शयति—\nइदं ज्ञानमुपाश्रित्य मम साधर्म्यमागताः। सर्गेऽपि नोपजायन्ते प्रलये न व्यथन्ति च॥ २॥", "padacchedaText": "", "audioFile": "PB_002616.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002617", "originalText": "इदं ज्ञानं यथोक्तमुपाश्रित्य, ज्ञानसाधनम् अनुष्ठाय इत्येतत्, मम परमेश्वरस्य साधर्म्यं मत्स्वरूपताम् आगताः प्राप्ताः इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_002617.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002618", "originalText": "न तु समानधर्मता साधर्म्यम्, क्षेत्रज्ञेश्वरयोः भेदानभ्युपगमात् गीताशास्त्रे।", "padacchedaText": "", "audioFile": "PB_002618.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002619", "originalText": "फलवादश्च अयं स्तुत्यर्थम् उच्यते।", "padacchedaText": "", "audioFile": "PB_002619.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002620", "originalText": "सर्गेऽपि सृष्टिकालेऽपि न उपजायन्ते।", "padacchedaText": "", "audioFile": "PB_002620.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002621", "originalText": "न उत्पद्यन्ते। प्रलये ब्रह्मणोऽपि विनाशकाले न व्यथन्ति च व्यथां न आपद्यन्ते, न च्यवन्ति इत्यर्थः॥ २॥", "padacchedaText": "", "audioFile": "PB_002621.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002622", "originalText": "क्षेत्रक्षेत्रज्ञसंयोगः ईदृशः भूतकारणम् इत्याह—\nमम योनिर्महद्ब्रह्म तस्मिन्गर्भं दधाम्यहम्। सम्भवः सर्वभूतानां ततो भवति भारत॥ ३॥", "padacchedaText": "", "audioFile": "PB_002622.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002623", "originalText": "मम स्वभूता मदीया माया त्रिगुणात्मिका प्रकृतिः योनिः सर्वभूतानां कारणम्।", "padacchedaText": "", "audioFile": "PB_002623.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002624", "originalText": "सर्वकार्येभ्यो महत्त्वात् भरणाच्च स्वविकाराणां महत् ब्रह्म इति योनिरेव विशिष्यते।", "padacchedaText": "", "audioFile": "PB_002624.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002625", "originalText": "तस्मिन् महति ब्रह्मणि योनौ गर्भं हिरण्यगर्भस्य जन्मनः बीजं सर्वभूतजन्मकारणं बीजं दधामि निक्षिपामि क्षेत्रक्षेत्रज्ञप्रकृतिद्वयशक्तिमान् ईश्वरः अहम्, अविद्याकामकर्मोपाधिस्वरूपानुविधायिनं क्षेत्रज्ञं क्षेत्रेण संयोजयामि इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_002625.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002626", "originalText": "सम्भवः उत्पत्तिः सर्वभूतानां हिरण्यगर्भोत्पत्तिद्वारेण ततः तस्मात् गर्भाधानात् भवति हे भारत॥ ३॥", "padacchedaText": "", "audioFile": "PB_002626.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002627", "originalText": "सर्वयोनिषु कौन्तेय मूर्तयः सम्भवन्ति याः। तासां ब्रह्म महद्योनिरहं बीजप्रदः पिता॥ ४॥", "padacchedaText": "", "audioFile": "PB_002627.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002628", "originalText": "देवपितृमनुष्यपशुमृगादिसर्वयोनिषु कौन्तेय, मूर्तयः देहसंस्थानलक्षणाः मूर्छिताङ्गावयवाः मूर्तयः सम्भवन्ति याः, तासां मूर्तीनां ब्रह्म महत् सर्वावस्थं योनिः कारणम् अहम् ईश्वरः बीजप्रदः गर्भाधानस्य कर्ता पिता॥ ४॥", "padacchedaText": "", "audioFile": "PB_002628.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002629", "originalText": "के गुणाः कथं बध्नन्तीति, उच्यते—\nसत्त्वं रजस्तम इति गुणाः प्रकृतिसम्भवाः। निबध्नन्ति महाबाहो देहे देहिनमव्ययम्॥ ५॥", "padacchedaText": "", "audioFile": "PB_002629.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002630", "originalText": "सत्त्वं रजः तमः इति एवंनामानः।", "padacchedaText": "", "audioFile": "PB_002630.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002631", "originalText": "गुणाः इति पारिभाषिकः शब्दः, न रूपादिवत् द्रव्याश्रिताः गुणाः।", "padacchedaText": "", "audioFile": "PB_002631.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002632", "originalText": "न च गुणगुणिनोः अन्यत्वमत्र विवक्षितम्।", "padacchedaText": "", "audioFile": "PB_002632.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002633", "originalText": "तस्मात् गुणा इव नित्यपरतन्त्राः क्षेत्रज्ञं प्रति अविद्यात्मकत्वात् क्षेत्रज्ञं निबध्नन्तीव।", "padacchedaText": "", "audioFile": "PB_002633.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002634", "originalText": "तम् आस्पदीकृत्य आत्मानं प्रतिलभन्ते इति निबध्नन्ति इति उच्यते।", "padacchedaText": "", "audioFile": "PB_002634.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002635", "originalText": "ते च प्रकृतिसम्भवाः भगवन्मायासम्भवाः निबध्नन्ति इव हे महाबाहो, महान्तौ समर्थतरौ आजानुप्रलम्बौ बाहू यस्य सः महाबाहुः, हे महाबाहो देहे शरीरे देहिनं देहवन्तम् अव्ययम्, अव्ययत्वं च उक्तम् ‘अनादित्वात्’ (भ.गी.१३.३१) इत्यादिश्लोकेन।", "padacchedaText": "", "audioFile": "PB_002635.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002636", "originalText": "ननु ‘देही न लिप्यते’ (भ.गी.१३.३१) इत्युक्तम्। तत् कथम् इह निबध्नन्ति इति अन्यथा उच्यते? परिहृतम् अस्माभिः इवशब्देन निबध्नन्ति इव इति॥ ५॥", "padacchedaText": "", "audioFile": "PB_002636.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002637", "originalText": "तत्र सत्त्वादीनां सत्त्वस्यैव तावत् लक्षणम् उच्यते—\nतत्र सत्त्वं निर्मलत्वात्प्रकाशकमनामयम्। सुखसङ्गेन बध्नाति ज्ञानसङ्गेन चानघ॥ ६॥", "padacchedaText": "", "audioFile": "PB_002637.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002638", "originalText": "निर्मलत्वात् स्फटिकमणिरिव प्रकाशकम् अनामयं निरुपद्रवं सत्त्वं तन्निबध्नाति।", "padacchedaText": "", "audioFile": "PB_002638.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002639", "originalText": "कथम्? सुखसङ्गेन ‘सुखी अहम्’ इति विषयभूतस्य सुखस्य विषयिणि आत्मनि संश्लेषापादनं मृषैव सुखे सञ्जनम् इति।", "padacchedaText": "", "audioFile": "PB_002639.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002640", "originalText": "सैषा अविद्या।", "padacchedaText": "", "audioFile": "PB_002640.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002641", "originalText": "न हि विषयधर्मः विषयिणः भवति।", "padacchedaText": "", "audioFile": "PB_002641.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002642", "originalText": "इच्छादि च धृत्यन्तं क्षेत्रस्यैव विषयस्य धर्मः इति उक्तं भगवता।", "padacchedaText": "", "audioFile": "PB_002642.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002643", "originalText": "अतः अविद्ययैव स्वकीयधर्मभूतया विषयविषय्यविवेकलक्षणया अस्वात्मभूते सुखे सञ्जयति इव, आसक्तमिव करोति, असङ्गं सक्तमिव करोति, असुखिनं सुखिनमिव।", "padacchedaText": "", "audioFile": "PB_002643.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002644", "originalText": "तथा ज्ञानसङ्गेन च, ज्ञानमिति सुखसाहचर्यात् क्षेत्रस्यैव विषयस्य अन्तःकरणस्य धर्मः, न आत्मनः, आत्मधर्मत्वे सङ्गानुपपत्तेः, बन्धानुपपत्तेश्च।", "padacchedaText": "", "audioFile": "PB_002644.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002645", "originalText": "सुखे इव ज्ञानादौ सङ्गः मन्तव्यः। हे अनघ अव्यसन॥ ६॥", "padacchedaText": "", "audioFile": "PB_002645.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002646", "originalText": "रजो रागात्मकं विद्धि तृष्णासङ्गसमुद्भवम्। तन्निबध्नाति कौन्तेय कर्मसङ्गेन देहिनम्॥ ७॥", "padacchedaText": "", "audioFile": "PB_002646.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002647", "originalText": "रजः रागात्मकं रञ्जनात् रागः गैरिकादिवद्रागात्मकं विद्धि जानीहि।", "padacchedaText": "", "audioFile": "PB_002647.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002648", "originalText": "तृष्णासङ्गसमुद्भवं तृष्णा अप्राप्ताभिलाषः, आसङ्गः प्राप्ते विषये मनसः प्रीतिलक्षणः संश्लेषः, तृष्णासङ्गयोः समुद्भवं तृष्णासङ्गसमुद्भवम्। तन्निबध्नाति तत् रजः निबध्नाति कौन्तेय कर्मसङ्गेन, दृष्टादृष्टार्थेषु कर्मसु सञ्जनं तत्परता कर्मसङ्गः, तेन निबध्नाति रजः देहिनम्॥ ७॥", "padacchedaText": "", "audioFile": "PB_002648.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002649", "originalText": "तमस्त्वज्ञानजं विद्धि मोहनं सर्वदेहिनाम्। प्रमादालस्यनिद्राभिस्तन्निबध्नाति भारत॥ ८॥", "padacchedaText": "", "audioFile": "PB_002649.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002650", "originalText": "तमः तृतीयः गुणः अज्ञानजम् अज्ञानात् जातम् अज्ञानजं विद्धि मोहनं मोहकरम् अविवेककरं सर्वदेहिनां सर्वेषां देहवताम्। प्रमादालस्यनिद्राभिः प्रमादश्च आलस्यं च निद्रा च प्रमादालस्यनिद्राः ताभिः प्रमादालस्यनिद्राभिः तत् तमः निबध्नाति भारत॥ ८॥", "padacchedaText": "", "audioFile": "PB_002650.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002651", "originalText": "पुनः गुणानां व्यापारः सङ्क्षेपतः उच्यते—\nसत्त्वं सुखे सञ्जयति रजः कर्मणि भारत। ज्ञानमावृत्य तु तमः प्रमादे सञ्जयत्युत॥ ९॥", "padacchedaText": "", "audioFile": "PB_002651.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002652", "originalText": "सत्त्वं सुखे सञ्जयति संश्लेषयति, रजः कर्मणि हे भारत सञ्जयति इति अनुवर्तते। ज्ञानं सत्त्वकृतं विवेकम् आवृत्य आच्छाद्य तु तमः स्वेन आवरणात्मना प्रमादे सञ्जयति उत प्रमादः नाम प्राप्तकर्तव्याकरणम्॥ ९॥", "padacchedaText": "", "audioFile": "PB_002652.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002653", "originalText": "उक्तं कार्यं कदा कुर्वन्ति गुणा इति उच्यते—\nरजस्तमश्चाभिभूय सत्त्वं भवति भारत। रजः सत्त्वं तमश्चैव तमः सत्त्वं रजस्तथा॥ १०॥", "padacchedaText": "", "audioFile": "PB_002653.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002654", "originalText": "रजः तमश्च उभावपि अभिभूय सत्त्‌वं भवति उद्भवति वर्धते यदा, तदा लब्धात्मकं सत्त्वं स्वकार्यं ज्ञानसुखादि आरभते हे भारत।", "padacchedaText": "", "audioFile": "PB_002654.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002655", "originalText": "तथा रजोगुणः सत्त्वं तमश्च एव उभावपि अभिभूय वर्धते यदा, तदा कर्म कृष्यादि स्वकार्यम् आरभते। तमआख्यो गुणः सत्त्वं रजश्च उभावपि अभिभूय तथैव वर्धते यदा, तदा ज्ञानावरणादि स्वकार्यम् आरभते॥ १०॥", "padacchedaText": "", "audioFile": "PB_002655.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002656", "originalText": "यदा यो गुणः उद्भूतः भवति, तदा तस्य किं लिङ्गमिति उच्यते—\nसर्वद्वारेषु देहेऽस्मिन्प्रकाश उपजायते। ज्ञानं यदा तदा विद्याद्विवृद्धं सत्त्वमित्युत॥ ११॥", "padacchedaText": "", "audioFile": "PB_002656.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002657", "originalText": "सर्वद्वारेषु, आत्मनः उपलब्धिद्वाराणि श्रोत्रादीनि सर्वाणि करणानि, तेषु सर्वद्वारेषु अन्तःकरणस्य बुद्धेः वृत्तिः प्रकाशः देहे अस्मिन् उपजायते।", "padacchedaText": "", "audioFile": "PB_002657.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002658", "originalText": "तदेव ज्ञानम्। यदा एवं प्रकाशो ज्ञानाख्यः उपजायते, तदा ज्ञानप्रकाशेन लिङ्गेन विद्यात् विवृद्धम् उद्भूतं सत्त्वम् इति उत अपि॥ ११॥", "padacchedaText": "", "audioFile": "PB_002658.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002659", "originalText": "रजसः उद्भूतस्य इदं चिह्नम्—\nलोभः प्रवृत्तिरारम्भः कर्मणामशमः स्पृहा। रजस्येतानि जायन्ते विवृद्धे भरतर्षभ॥ १२॥", "padacchedaText": "", "audioFile": "PB_002659.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002660", "originalText": "लोभः परद्रव्यादित्सा, प्रवृत्तिः प्रवर्तनं सामान्यचेष्टा, आरम्भः, कस्य? कर्मणाम्। अशमः अनुपशमः, हर्षरागादिप्रवृत्तिः, स्पृहा सर्वसामान्यवस्तुविषया तृष्णा— रजसि गुणे विवृद्धे एतानि लिङ्गानि जायन्ते हे भरतर्षभ॥ १२॥", "padacchedaText": "", "audioFile": "PB_002660.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002661", "originalText": "अप्रकाशोऽप्रवृत्तिश्च प्रमादो मोह एव च। तमस्येतानि जायन्ते विवृद्धे कुरुनन्दन॥ १३॥", "padacchedaText": "", "audioFile": "PB_002661.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002662", "originalText": "अप्रकाशः अविवेकः, अत्यन्तम् अप्रवृत्तिश्च प्रवृत्त्यभावः तत्कार्यं प्रमादो मोह एव च अविवेकः मूढता इत्यर्थः। तमसि गुणे विवृद्धे एतानि लिङ्गानि जायन्ते हे कुरुनन्दन॥ १३॥", "padacchedaText": "", "audioFile": "PB_002662.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002663", "originalText": "मरणद्वारेणापि यत् फलं प्राप्यते, तदपि सङ्गरागहेतुकं सर्वं गौणमेव इति दर्शयन् आह—\nयदा सत्त्वे प्रवृद्धे तु प्रलयं याति देहभृत्। तदोत्तमविदां लोकानमलान्प्रतिपद्यते॥ १४॥", "padacchedaText": "", "audioFile": "PB_002663.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002664", "originalText": "यदा सत्त्वे प्रवृद्धे उद्भूते तु प्रलयं मरणं याति प्रतिपद्यते देहभृत् आत्मा, तदा उत्तमविदां महदादितत्त्वविदाम् इत्येतत्, लोकान् अमलान् मलरहितान् प्रतिपद्यते प्राप्नोति इत्येतत्॥ १४॥", "padacchedaText": "", "audioFile": "PB_002664.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002665", "originalText": "रजसि प्रलयं गत्वा कर्मसङ्गिषु जायते। तथा प्रलीनस्तमसि मूढयोनिषु जायते॥ १५॥", "padacchedaText": "", "audioFile": "PB_002665.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002666", "originalText": "रजसि गुणे विवृद्धे प्रलयं मरणं गत्वा प्राप्य कर्मसङ्गिषु कर्मासक्तियुक्तेषु मनुष्येषु जायते। तथा तद्वदेव प्रलीनः मृतः तमसि विवृद्धे मूढयोनिषु पश्वादियोनिषु जायते॥ १५॥", "padacchedaText": "", "audioFile": "PB_002666.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002667", "originalText": "अतीतश्लोकार्थस्यैव सङ्क्षेपः उच्यते—\nकर्मणः सुकृतस्याहुः सात्त्विकं निर्मलं फलम्। रजसस्तु फलं दुःखमज्ञानं तमसः फलम्॥ १६॥", "padacchedaText": "", "audioFile": "PB_002667.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002668", "originalText": "कर्मणः सुकृतस्य सात्त्विकस्य इत्यर्थः, आहुः शिष्टाः सात्त्विकम् एव निर्मलं फलम् इति।", "padacchedaText": "", "audioFile": "PB_002668.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002669", "originalText": "रजसस्तु फलं दुःखं राजसस्य कर्मणः इत्यर्थः, कर्माधिकारात् फलम् अपि दुःखम् एव, कारणानुरूप्यात् राजसमेव। तथा अज्ञानं तमसः तामसस्य कर्मणः अधर्मस्य पूर्ववत्॥ १६॥", "padacchedaText": "", "audioFile": "PB_002669.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002670", "originalText": "किञ्च गुणेभ्यो भवति—\nसत्त्वात्सञ्जायते ज्ञानं रजसो लोभ एव च। प्रमादमोहौ तमसो भवतोऽज्ञानमेव च॥ १७॥", "padacchedaText": "", "audioFile": "PB_002670.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002671", "originalText": "सत्त्वात् लब्धात्मकात् सञ्जायते समुत्पद्यते ज्ञानम्, रजसो लोभ एव च, प्रमादमोहौ च उभौ तमसो भवतः, अज्ञानमेव च भवति॥ १७॥", "padacchedaText": "", "audioFile": "PB_002671.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002672", "originalText": "किञ्च—\nऊर्ध्वं गच्छन्ति सत्त्वस्था\nमध्ये तिष्ठन्ति राजसाः। जघन्यगुणवृत्तस्था\nअधो गच्छन्ति तामसाः॥ १८॥", "padacchedaText": "", "audioFile": "PB_002672.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002673", "originalText": "ऊर्ध्वं गच्छन्ति देवलोकादिषु उत्पद्यन्ते सत्त्वस्थाः सत्त्वगुणवृत्तस्थाः।", "padacchedaText": "", "audioFile": "PB_002673.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002674", "originalText": "मध्ये तिष्ठन्ति मनुष्येषु उत्पद्यन्ते राजसाः।", "padacchedaText": "", "audioFile": "PB_002674.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002675", "originalText": "जघन्यगुणवृत्तस्थाः जघन्यश्च असौ गुणश्च जघन्यगुणः तमः, तस्य वृत्तं निद्रालस्यादि, तस्मिन् स्थिताः जघन्यगुणवृत्तस्थाः मूढाः अधः गच्छन्ति पश्वादिषु उत्पद्यन्ते तामसाः॥ १८॥", "padacchedaText": "", "audioFile": "PB_002675.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002676", "originalText": "पुरुषस्य प्रकृतिस्थत्वरूपेण मिथ्याज्ञानेन युक्तस्य भोग्येषु गुणेषु सुखदुःखमोहात्मकेषु ‘सुखी दुःखी मूढः अहम् अस्मि’ इत्येवंरूपः यः सङ्गः तत्कारणं पुरुषस्य सदसद्योनिजन्मप्राप्तिलक्षणस्य संसारस्य इति समासेन पूर्वाध्याये यत् उक्तम्, तत् इह ‘सत्त्वं रजस्तम इति गुणाः प्रकृतिसम्भवाः’ (भ.गी.१४.५) इति आरभ्य गुणस्वरूपम्, गुणवृत्तम्, स्ववृत्तेन च गुणानां बन्धकत्वम्, गुणवृत्तनिबद्धस्य च पुरुषस्य या गतिः, इत्येतत् सर्वं मिथ्याज्ञानमूलं बन्धकारणं विस्तरेण उक्त्वा, अधुना सम्यग्दर्शनान्मोक्षो वक्तव्यः इत्यत आह भगवान्—\nनान्यं गुणेभ्यः कर्तारं यदा द्रष्टानुपश्यति।", "padacchedaText": "", "audioFile": "PB_002676.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002677", "originalText": "गुणेभ्यश्च परं वेत्ति मद्भावं सोऽधिगच्छति॥ १९॥", "padacchedaText": "", "audioFile": "PB_002677.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002678", "originalText": "न अन्यं कार्यकरणविषयाकारपरिणतेभ्यः गुणेभ्यः कर्तारम् अन्यं यदा द्रष्टा विद्वान् सन् न अनुपश्यति, गुणा एव सर्वावस्थाः सर्वकर्मणां कर्तारः इत्येवं पश्यति, गुणेभ्यश्च परं गुणव्यापारसाक्षिभूतं वेत्ति, मद्भावं मम भावं सः द्रष्टा अधिगच्छति॥ १९॥", "padacchedaText": "", "audioFile": "PB_002678.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002679", "originalText": "कथम् अधिगच्छति इति, उच्यते—\nगुणानेतानतीत्य त्रीन्देही देहसमुद्भवान्। जन्ममृत्युजरादुःखैर्विमुक्तोऽमृतमश्नुते॥ २०॥", "padacchedaText": "", "audioFile": "PB_002679.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002680", "originalText": "गुणान् एतान् यथोक्तान् अतीत्य जीवन्नेव अतिक्रम्य मायोपाधिभूतान् त्रीन् देही देहसमुद्भवान् देहोत्पत्तिबीजभूतान् जन्ममृत्युजरादुःखैः जन्म च मृत्युश्च जरा च दुःखानि च जन्ममृत्युजरादुःखानि तैः जीवन्नेव विमुक्तः सन् विद्वान् अमृतम् अश्नुते, एवं मद्भावम् अधिगच्छति इत्यर्थः॥ २०॥", "padacchedaText": "", "audioFile": "PB_002680.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002681", "originalText": "जीवन्नेव गुणान् अतीत्य अमृतम् अश्नुते इति प्रश्नबीजं प्रतिलभ्य, अर्जुन उवाच—\nअर्जुन उवाच—\nकैर्लिङ्गैस्त्रीन्गुणानेतानतीतो भवति प्रभो। किमाचारः कथं चैतांस्त्रीन्गुणानतिवर्तते॥ २१॥", "padacchedaText": "", "audioFile": "PB_002681.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002682", "originalText": "कैः लिङ्गैः चिह्नैः त्रीन् एतान् व्याख्यातान् गुणान् अतीतः अतिक्रान्तः भवति प्रभो, किमाचारः कः अस्य आचारः इति किमाचारः कथं केन च प्रकारेण एतान् त्रीन् गुणान् अतिवर्तते अतीत्य वर्तते॥ २१॥", "padacchedaText": "", "audioFile": "PB_002682.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002683", "originalText": "गुणातीतस्य लक्षणं गुणातीतत्वोपायं च अर्जुनेन पृष्टः अस्मिन् श्लोके प्रश्नद्वयार्थं प्रतिवचनं भगवान् उवाच।", "padacchedaText": "", "audioFile": "PB_002683.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002684", "originalText": "यत् तावत् ‘कैः लिङ्गैः युक्तो गुणातीतो भवति’ इति, तत् शृणु—\nश्रीभगवानुवाच—\nप्रकाशं च प्रवृत्तिं च मोहमेव च पाण्डव। न द्वेष्टि सम्प्रवृत्तानि न निवृत्तानि काङ्क्षति॥ २२॥", "padacchedaText": "", "audioFile": "PB_002684.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002685", "originalText": "प्रकाशं च सत्त्वकार्यं प्रवृत्तिं च रजःकार्यं मोहमेव च तमःकार्यम् इत्येतानि न द्वेष्टि सम्प्रवृत्तानि सम्यग्विषयभावेन उद्भूतानि— ‘मम तामसः प्रत्ययो जातः, तेन अहं मूढः, तथा राजसी प्रवृत्तिः मम उत्पन्ना दुःखात्मिका, तेन अहं रजसा प्रवर्तितः प्रचलितः स्वरूपात्, कष्टं मम वर्तते यः अयं मत्स्वरूपावस्थानात् भ्रंशः, तथा सात्त्विको गुणः प्रकाशात्मा मां विवेकित्वम् आपादयन् सुखे च सञ्जयन् बध्नाति’ इति तानि द्वेष्टि असम्यग्दर्शित्वेन।", "padacchedaText": "", "audioFile": "PB_002685.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002686", "originalText": "तत् एवं गुणातीतो न द्वेष्टि सम्प्रवृत्तानि।", "padacchedaText": "", "audioFile": "PB_002686.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002687", "originalText": "यथा च सात्त्विकादिपुरुषः सत्त्वादिकार्याणि आत्मानं प्रति प्रकाश्य निवृत्तानि काङ्क्षति, न तथा गुणातीतो निवृत्तानि काङ्क्षति इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_002687.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002688", "originalText": "एतत् न परप्रत्यक्षं लिङ्गम्।", "padacchedaText": "", "audioFile": "PB_002688.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002689", "originalText": "किं तर्हि? स्वात्मप्रत्यक्षत्वात् आत्मार्थमेव एतत् लक्षणम्। न हि स्वात्मविषयं द्वेषमाकाङ्क्षां वा परः पश्यति॥ २२॥", "padacchedaText": "", "audioFile": "PB_002689.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002690", "originalText": "अथ इदानीम् ‘गुणातीतः किमाचारः? ’ इति प्रश्नस्य प्रतिवचनम् आह—\nउदासीनवदासीनो गुणैर्यो न विचाल्यते। गुणा वर्तन्त इत्येव योऽवतिष्ठति नेङ्गते॥ २३॥", "padacchedaText": "", "audioFile": "PB_002690.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002691", "originalText": "उदासीनवत् यथा उदासीनः न कस्यचित् पक्षं भजते, तथा अयं गुणातीतत्वोपायमार्गेऽवस्थितः आसीनः आत्मवित् गुणैः यः संन्यासी न विचाल्यते विवेकदर्शनावस्थातः।", "padacchedaText": "", "audioFile": "PB_002691.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002692", "originalText": "तदेतत् स्फुटीकरोति— गुणाः कार्यकरणविषयाकारपरिणताः अन्योऽन्यस्मिन् वर्तन्ते इति यः अवतिष्ठति।", "padacchedaText": "", "audioFile": "PB_002692.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002693", "originalText": "छन्दोभङ्गभयात् परस्मैपदप्रयोगः।", "padacchedaText": "", "audioFile": "PB_002693.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002694", "originalText": "योऽनुतिष्ठतीति वा पाठान्तरम्। न इङ्गते न चलति, स्वरूपावस्थ एव भवति इत्यर्थः॥ २३॥", "padacchedaText": "", "audioFile": "PB_002694.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002695", "originalText": "किञ्च—\nसमदुःखसुखः स्वस्थः समलोष्टाश्मकाञ्चनः। तुल्यप्रियाप्रियो धीरस्तुल्यनिन्दात्मसंस्तुतिः॥ २४॥", "padacchedaText": "", "audioFile": "PB_002695.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002696", "originalText": "समदुःखसुखः समे दुःखसुखे यस्य सः समदुःखसुखः, स्वस्थः स्वे आत्मनि स्थितः प्रसन्नः, समलोष्टाश्मकाञ्चनः लोष्टं च अश्मा च काञ्चनं च लोष्टाश्मकाञ्चनानि समानि यस्य सः समलोष्टाश्मकाञ्चनः, तुल्यप्रियाप्रियः प्रियं च अप्रियं च प्रियाप्रिये तुल्ये समे यस्य सोऽयं तुल्यप्रियाप्रियः, धीरः धीमान्, तुल्यनिन्दात्मसंस्तुतिः निन्दा च आत्मसंस्तुतिश्च निन्दात्मसंस्तुती, तुल्ये निन्दात्मसंस्तुती यस्य यतेः सः तुल्यनिन्दात्मसंस्तुतिः॥ २४॥", "padacchedaText": "", "audioFile": "PB_002696.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002697", "originalText": "किञ्च—\nमानापमानयोस्तुल्यस्तुल्यो मित्रारिपक्षयोः। सर्वारम्भपरित्यागी गुणातीतः स उच्यते॥ २५॥", "padacchedaText": "", "audioFile": "PB_002697.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002698", "originalText": "मानापमानयोः तुल्यः समः निर्विकारः, तुल्यः मित्रारिपक्षयोः, यद्यपि उदासीना भवन्ति केचित् स्वाभिप्रायेण, तथापि पराभिप्रायेण मित्रारिपक्षयोरिव भवन्ति इति तुल्यो मित्रारिपक्षयोः इत्याह।", "padacchedaText": "", "audioFile": "PB_002698.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002699", "originalText": "सर्वारम्भपरित्यागी, दृष्टादृष्टार्थानि कर्माणि आरभ्यन्ते इति आरम्भाः, सर्वान् आरम्भान् परित्यक्तुं शीलम् अस्य इति सर्वारम्भपरित्यागी, देहधारणमात्रनिमित्तव्यतिरेकेण सर्वकर्मपरित्यागी इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_002699.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002700", "originalText": "गुणातीतः सः उच्यते ‘उदासीनवत्’ (भ.गी.१४.२३) इत्यादि ‘गुणातीतः स उच्यते’ (भ.गी.१४.२५) इत्येतदन्तम् उक्तं यावत् यत्नसाध्यं तावत् संन्यासिनः अनुष्ठेयं गुणातीतत्वसाधनं मुमुक्षोः, स्थिरीभूतं तु स्वसंवेद्यं सत् गुणातीतस्य यतेः लक्षणं भवति इति।॥ २५॥", "padacchedaText": "", "audioFile": "PB_002700.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002701", "originalText": "अधुना ‘कथं च त्रीन्गुणानतिवर्तते? ’ (भ.गी.१४.२१) इत्यस्य प्रश्नस्य प्रतिवचनम् आह—\nमां च योऽव्यभिचारेण भक्तियोगेन सेवते। स गुणान्समतीत्यैतान्ब्रह्मभूयाय कल्पते॥ २६॥", "padacchedaText": "", "audioFile": "PB_002701.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002702", "originalText": "मां च ईश्वरं नारायणं सर्वभूतहृदयाश्रितं यो यतिः कर्मी वा अव्यभिचारेण न कदाचित् यो व्यभिचरति भक्तियोगेन भजनं भक्तिः सैव योगः तेन भक्तियोगेन सेवते, सः गुणान् समतीत्य एतान् यथोक्तान् ब्रह्मभूयाय, भवनं भूयः, ब्रह्मभूयाय ब्रह्मभवनाय मोक्षाय कल्पते समर्थो भवति इत्यर्थः॥ २६॥", "padacchedaText": "", "audioFile": "PB_002702.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002703", "originalText": "कुत एतदिति उच्यते—\nब्रह्मणो हि प्रतिष्ठाहममृतस्याव्ययस्य च। शाश्वतस्य च धर्मस्य सुखस्यैकान्तिकस्य च॥ २७॥", "padacchedaText": "", "audioFile": "PB_002703.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002704", "originalText": "ब्रह्मणः परमात्मनः हि यस्मात् प्रतिष्ठा अहं प्रतितिष्ठति अस्मिन् इति प्रतिष्ठा अहं प्रत्यगात्मा।", "padacchedaText": "", "audioFile": "PB_002704.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002705", "originalText": "कीदृशस्य ब्रह्मणः? अमृतस्य अविनाशिनः अव्ययस्य अविकारिणः शाश्वतस्य च नित्यस्य धर्मस्य धर्मज्ञानस्य ज्ञानयोगधर्मप्राप्यस्य सुखस्य आनन्दरूपस्य ऐकान्तिकस्य अव्यभिचारिणः अमृतादिस्वभावस्य परमानन्दरूपस्य परमात्मनः प्रत्यगात्मा प्रतिष्ठा, सम्यग्ज्ञानेन परमात्मतया निश्चीयते।", "padacchedaText": "", "audioFile": "PB_002705.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002706", "originalText": "तदेतत् ‘ब्रह्मभूयाय कल्पते’ (भ.गी.१४.२६) इति उक्तम्।", "padacchedaText": "", "audioFile": "PB_002706.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002707", "originalText": "यया च ईश्वरशक्त्या भक्तानुग्रहादिप्रयोजनाय ब्रह्म प्रतिष्ठते प्रवर्तते, सा शक्तिः ब्रह्मैव अहम्, शक्तिशक्तिमतोः अनन्यत्वात् इत्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_002707.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002708", "originalText": "अथवा, ब्रह्मशब्दवाच्यत्वात् सविकल्पकं ब्रह्म।", "padacchedaText": "", "audioFile": "PB_002708.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002709", "originalText": "तस्य ब्रह्मणो निर्विकल्पकः अहमेव नान्यः प्रतिष्ठा आश्रयः।", "padacchedaText": "", "audioFile": "PB_002709.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002710", "originalText": "किंविशिष्टस्य? अमृतस्य अमरणधर्मकस्य अव्ययस्य व्ययरहितस्य। किञ्च, शाश्वतस्य च नित्यस्य धर्मस्य ज्ञाननिष्ठालक्षणस्य सुखस्य तज्जनितस्य ऐकान्तिकस्य एकान्तनियतस्य च, ‘प्रतिष्ठा अहम्’ इति वर्तते॥ २७॥", "padacchedaText": "", "audioFile": "PB_002710.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002711", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ श्रीमद्भगवद्गीताभाष्ये चतुर्दशोऽध्यायः॥", "padacchedaText": "", "audioFile": "PB_002711.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002712", "originalText": "पञ्चदशोऽध्यायः\nयस्मात् मदधीनं कर्मिणां कर्मफलं ज्ञानिनां च ज्ञानफलम्, अतः भक्तियोगेन मां ये सेवंते ते मम प्रसादात् ज्ञानप्राप्तिक्रमेण गुणातीताः मोक्षं गच्छन्ति।", "padacchedaText": "", "audioFile": "PB_002712.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002713", "originalText": "किमु वक्तव्यम् आत्मनः तत्त्वमेव सम्यक् विजानन्तः इति अतः भगवान् अर्जुनेन अपृष्टोऽपि आत्मनः तत्त्वं विवक्षुः उवाच ‘ऊर्ध्वमूलम्’ इत्यादिना। तत्र तावत् वृक्षरूपककल्पनया वैराग्यहेतोः संसारस्वरूपं वर्णयति— विरक्तस्य हि संसारात् भगवत्तत्त्वज्ञाने अधिकारः, न अन्यस्येति॥", "padacchedaText": "", "audioFile": "PB_002713.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002714", "originalText": "श्रीभगवानुवाच—\nऊर्ध्वमूलमधःशाखमश्वत्थं प्राहुरव्ययम्। छन्दांसि यस्य पर्णानि यस्तं वेद स वेदवित्॥ १॥", "padacchedaText": "", "audioFile": "PB_002714.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002715", "originalText": "ऊर्ध्वमूलं कालतः सूक्ष्मत्वात् कारणत्वात् नित्यत्वात् महत्त्वाच्च ऊर्ध्वम्, उच्यते ब्रह्म अव्यक्तं मायाशक्तिमत्, तत् मूलं अस्येति सोऽयं संसारवृक्षः ऊर्ध्वमूलः।", "padacchedaText": "", "audioFile": "PB_002715.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002716", "originalText": "श्रुतेश्च— ‘ऊर्ध्वमूलोऽवाक्शाख एषोऽश्वत्थः सनातनः’ (क.२.३.१) इति।", "padacchedaText": "", "audioFile": "PB_002716.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002717", "originalText": "पुराणे च—\n‘अव्यक्तमूलप्रभवस्तस्यैवानुग्रहोच्छ्रितः। बुद्धिस्कन्धमयश्चैव इन्द्रियान्तरकोटरः॥", "padacchedaText": "", "audioFile": "PB_002717.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002718", "originalText": "महाभूतविशाखश्च विषयैः पत्रवांस्तथा। धर्माधर्मसुपुष्पश्च सुखदुःखफलोदयः॥", "padacchedaText": "", "audioFile": "PB_002718.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002719", "originalText": "आजीव्यः सर्वभूतानां ब्रह्मवृक्षः सनातनः। एतद्ब्रह्मवनं चैव ब्रह्माचरति नित्यशः॥", "padacchedaText": "", "audioFile": "PB_002719.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002720", "originalText": "एतच्छित्त्वा च भित्त्वा च ज्ञानेन परमासिना। ततश्चात्मरतिं प्राप्य तस्मान्नावर्तते पुनः॥", "padacchedaText": "", "audioFile": "PB_002720.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002721", "originalText": "’इत्यादि।", "padacchedaText": "", "audioFile": "PB_002721.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002722", "originalText": "तम् ऊर्ध्वमूलं संसारं मायामयं वृक्षम् अधःशाखं महदहङ्कारतन्मात्रादयः शाखा इव अस्य अधः भवन्तीति सोऽयं अधःशाखः, तम् अधःशाखम् न श्वोऽपि स्थाता इति अश्वत्थः तं क्षणप्रध्वंसिनम् अश्वत्थं प्राहुः कथयन्ति।", "padacchedaText": "", "audioFile": "PB_002722.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002723", "originalText": "अव्ययं संसारमायायाः अनादिकालप्रवृत्तत्वात् सोऽयं संसारवृक्षः अव्ययः, अनाद्यन्तदेहादिसन्तानाश्रयः हि सुप्रसिद्धः, तम् अव्ययम्।", "padacchedaText": "", "audioFile": "PB_002723.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002724", "originalText": "तस्यैव संसारवृक्षस्य इदम् अन्यत् विशेषणम्— छन्दांसि यस्य पर्णानि, छन्दांसि च्छादनात् ऋग्यजुःसामलक्षणानि यस्य संसारवृक्षस्य पर्णानीव पर्णानि।", "padacchedaText": "", "audioFile": "PB_002724.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002725", "originalText": "यथा वृक्षस्य परिरक्षणार्थानि पर्णानि, तथा वेदाः संसारवृक्षपरिरक्षणार्थाः, धर्माधर्मतद्धेतुफलप्रदर्शनार्थत्वात्।", "padacchedaText": "", "audioFile": "PB_002725.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002726", "originalText": "यथाव्याख्यातं संसारवृक्षं समूलं यः तं वेद सः वेदवित्, वेदार्थवित् इत्यर्थः। न हि समूलात् संसारवृक्षात् अस्मात् ज्ञेयः अन्यः अणुमात्रोऽपि अवशिष्टः अस्ति इत्यतः सर्वज्ञः सर्ववेदार्थविदिति समूलसंसारवृक्षज्ञानं स्तौति॥ १॥", "padacchedaText": "", "audioFile": "PB_002726.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002727", "originalText": "तस्य एतस्य संसारवृक्षस्य अपरा अवयवकल्पना उच्यते—\nअधश्चोर्ध्वं प्रसृतास्तस्य शाखा\nगुणप्रवृद्धा विषयप्रवालाः। अधश्च मूलान्यनुसन्ततानि\nकर्मानुबन्धीनि मनुष्यलोके॥ २॥", "padacchedaText": "", "audioFile": "PB_002727.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002728", "originalText": "अधः मनुष्यादिभ्यो यावत् स्थावरम् ऊर्ध्वं च यावत् ब्रह्मणः विश्वसृजो धाम इत्येतदन्तं यथाकर्म यथाश्रुतं ज्ञानकर्मफलानि, तस्य वृक्षस्य शाखा इव शाखाः प्रसृताः प्रगताः, गुणप्रवृद्धाः गुणैः सत्त्वरजस्तमोभिः प्रवृद्धाः स्थूलीकृताः उपादानभूतैः, विषयप्रवालाः विषयाः शब्दादयः प्रवालाः इव देहादिकर्मफलेभ्यः शाखाभ्यः अङ्कुरीभवन्तीव, तेन विषयप्रवालाः शाखाः।", "padacchedaText": "", "audioFile": "PB_002728.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002729", "originalText": "संसारवृक्षस्य परममूलं उपादानकारणं पूर्वम् उक्तम्।", "padacchedaText": "", "audioFile": "PB_002729.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002730", "originalText": "अथ इदानीं कर्मफलजनितरागद्वेषादिवासनाः मूलानीव धर्माधर्मप्रवृत्तिकारणानि अवान्तरभावीनि तानि अधश्च देवाद्यपेक्षया मूलानि अनुसन्ततानि अनुप्रविष्टानि कर्मानुबन्धीनि कर्म धर्माधर्मलक्षणम् अनुबन्धः पश्चाद्भावि, येषाम् उद्भूतिम् अनु उद्भवति, तानि कर्मानुबन्धीनि मनुष्यलोके विशेषतः।", "padacchedaText": "", "audioFile": "PB_002730.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002731", "originalText": "अत्र हि मनुष्याणां कर्माधिकारः प्रसिद्धः॥ २॥", "padacchedaText": "", "audioFile": "PB_002731.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002732", "originalText": "यस्तु अयं वर्णितः संसारवृक्षः—\nन रूपमस्येह तथोपलभ्यते नान्तो न चादिर्न च सम्प्रतिष्ठा। अश्वत्थमेनं सुविरूढमूलमसङ्गशस्त्रेण दृढेन छित्त्वा॥ ३॥", "padacchedaText": "", "audioFile": "PB_002732.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002733", "originalText": "न रूपम् अस्य इह यथा उपवर्णितं तथा नैव उपलभ्यते, स्वप्नमरीच्युदकमायागन्धर्वनगरसमत्वात्, दृष्टनष्टस्वरूपो हि स इति अत एव न अन्तः न पर्यन्तः निष्ठा परिसमाप्तिर्वा विद्यते।", "padacchedaText": "", "audioFile": "PB_002733.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002734", "originalText": "तथा न च आदिः, ‘इतः आरभ्य अयं प्रवृत्तः’ इति न केनचित् गम्यते।", "padacchedaText": "", "audioFile": "PB_002734.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002735", "originalText": "न च सम्प्रतिष्ठा स्थितिः मध्यम् अस्य न केनचित् उपलभ्यते।", "padacchedaText": "", "audioFile": "PB_002735.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002736", "originalText": "अश्वत्थम् एनं यथोक्तं सुविरूढमूलं सुष्ठु विरूढानि विरोहं गतानि सुदृढानि मूलानि यस्य तम् एनं सुविरूढमूलम्, असङ्गशस्त्रेण असङ्गः पुत्रवित्तलोकैषणाभ्यः व्युत्थानं तेन असङ्गशस्त्रेण दृढेन परमात्माभिमुख्यनिश्चयदृढीकृतेन पुनः पुनः विवेकाभ्यासाश्मनिशितेन च्छित्वा संसारवृक्षं सबीजम् उद्धृत्य॥ ३॥", "padacchedaText": "", "audioFile": "PB_002736.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002737", "originalText": "ततः पदं तत्परिमार्गितव्यं\nयस्मिन्गता न निवर्तन्ति भूयः। तमेव चाद्यं पुरुषं प्रपद्ये\nयतः प्रवृत्तिः प्रसृता पुराणी॥ ४॥", "padacchedaText": "", "audioFile": "PB_002737.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002738", "originalText": "ततः पश्चात् यत् पदं वैष्णवं तत् परिमार्गितव्यम्, परिमार्गणम् अन्वेषणं ज्ञातव्यमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_002738.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002739", "originalText": "यस्मिन् पदे गताः प्रविष्टाः न निवर्तन्ति न आवर्तन्ते भूयः पुनः संसाराय।", "padacchedaText": "", "audioFile": "PB_002739.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002740", "originalText": "कथं परिमार्गितव्यमिति आह— तमेव च यः पदशब्देन उक्तः आद्यम् आदौ भवम् आद्यं पुरुषं प्रपद्ये इत्येवं परिमार्गितव्यं तच्छरणतया इत्यर्थः। कः असौ पुरुषः इति, उच्यते— यतः यस्मात् पुरुषात् संसारमायावृक्षप्रवृत्तिः प्रसृता निःसृता, ऐन्द्रजालिकादिव माया, पुराणी चिरन्तनी॥ ४॥", "padacchedaText": "", "audioFile": "PB_002740.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002741", "originalText": "कथम्भूताः तत् पदं गच्छन्तीति, उच्यते—\nनिर्मानमोहा जितसङ्गदोषा अध्यात्मनित्या विनिवृत्तकामाः। द्वन्द्वैर्विमुक्ताः सुखदुःखसंज्ञैर्गच्छन्त्यमूढाः पदमव्ययं तत्॥ ५॥", "padacchedaText": "", "audioFile": "PB_002741.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002742", "originalText": "निर्मानमोहाः मानश्च मोहश्च मानमोहौ, तौ निर्गतौ येभ्यः ते निर्मानमोहाः मानमोहवर्जिताः।", "padacchedaText": "", "audioFile": "PB_002742.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002743", "originalText": "जितसङ्गदोषाः सङ्ग एव दोषः सङ्गदोषः, जितः सङ्गदोषः यैः ते जितसङ्गदोषाः।", "padacchedaText": "", "audioFile": "PB_002743.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002744", "originalText": "अध्यात्मनित्याः परमात्मस्वरूपालोचननित्याः तत्पराः।", "padacchedaText": "", "audioFile": "PB_002744.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002745", "originalText": "विनिवृत्तकामाः विशेषतो निर्लेपेन निवृत्ताः कामाः येषां ते विनिवृत्तकामाः यतयः संन्यासिनः द्वन्द्वैः प्रियाप्रियादिभिः विमुक्ताः सुखदुःखसंज्ञैः परित्यक्ताः गच्छन्ति अमूढाः मोहवर्जिताः पदम् अव्ययं तत् यथोक्तम्॥ ५॥", "padacchedaText": "", "audioFile": "PB_002745.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002746", "originalText": "तदेव पदं पुनः विशेष्यते—\nन तद्भासयते सूर्यो न शशाङ्को न पावकः। यद्गत्वा न निवर्तन्ते तद्धाम परमं मम॥ ६॥", "padacchedaText": "", "audioFile": "PB_002746.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002747", "originalText": "तत् धाम इति व्यवहितेन धाम्ना सम्बध्यते।", "padacchedaText": "", "audioFile": "PB_002747.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002748", "originalText": "तत् धाम तेजोरूपं पदं न भासयते सूर्यः आदित्यः सर्वावभासनशक्तिमत्त्वेऽपि सति।", "padacchedaText": "", "audioFile": "PB_002748.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002749", "originalText": "तथा न शशाङ्कः चन्द्रः, न पावकः न अग्निरपि। यत् धाम वैष्णवं पदं गत्वा प्राप्य न निवर्तन्ते, यच्च सूर्यादिः न भासयते, तत् धाम पदं परमं विष्णोः मम पदम्,॥ ६॥", "padacchedaText": "", "audioFile": "PB_002749.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002750", "originalText": "यत् गत्वा न निवर्तन्ते इत्युक्तम्ननु सर्वा हि गतिः आगत्यन्ता, ‘संयोगाः विप्रयोगान्ताः’ इति प्रसिद्धम्।", "padacchedaText": "", "audioFile": "PB_002750.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002751", "originalText": "कथम् उच्यते ‘तत् धाम गतानां नास्ति निवृत्तिः’ इति? शृणु तत्र कारणम्—\nममैवांशो जीवलोके जीवभूतः सनातनः। मनःषष्ठानीन्द्रियाणि प्रकृतिस्थानि कर्षति॥ ७॥", "padacchedaText": "", "audioFile": "PB_002751.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002752", "originalText": "ममैव परमात्मनः नारायणस्य, अंशः भागः अवयवः एकदेशः इति अनर्थान्तरं जिवलोके जीवानां लोके संसारे जीवभूतः कर्ता भोक्ता इति प्रसिद्धः सनातनः चिरन्तनः, यथा जलसूर्यकः सूर्यांशः जलनिमित्तापाये सूर्यमेव गत्वा न निवर्तते च तेनैव आत्मना गच्छति, एवमेव, यथा घटाद्युपाधिपरिच्छिन्नो घटाद्याकाशः आकाशांशः सन् घटादिनिमित्तापाये आकाशं प्राप्य न निवर्तते।", "padacchedaText": "", "audioFile": "PB_002752.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002753", "originalText": "अतः उपपन्नम् उक्तम् ‘यद्गत्वा न निवर्तन्ते’ (भ.गी.१५.६) इति।", "padacchedaText": "", "audioFile": "PB_002753.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002754", "originalText": "ननु निरवयवस्य परमात्मनः कुतः अवयवः एकदेशः अंशः इति? सावयवत्वे च विनाशप्रसङ्गः अवयवविभागात्।", "padacchedaText": "", "audioFile": "PB_002754.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002755", "originalText": "नैष दोषः, अविद्याकृतोपाधिपरिच्छिन्नः एकदेशः अंश इव कल्पितो यतः।", "padacchedaText": "", "audioFile": "PB_002755.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002756", "originalText": "दर्शितश्च अयमर्थः क्षेत्राध्याये विस्तरशः।", "padacchedaText": "", "audioFile": "PB_002756.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002757", "originalText": "स च जीवो मदंशत्वेन कल्पितः कथं संसरति उत्क्रामति च इति, उच्यते— मनःषष्ठानि इन्द्रियाणि श्रोत्रादीनि प्रकृतिस्थानि स्वस्थाने कर्णशष्कुल्यादौ प्रकृतौ स्थितानि कर्षति आकर्षति॥ ७॥", "padacchedaText": "", "audioFile": "PB_002757.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002758", "originalText": "कस्मिन् काले?—\nशरीरं यदवाप्नोति यच्चाप्युत्क्रामतीश्वरः। गृहीत्वैतानि संयाति वायुर्गन्धानिवाशयात्॥ ८॥", "padacchedaText": "", "audioFile": "PB_002758.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002759", "originalText": "यच्चापि यदा चापि उत्क्रामति ईश्वरः देहादिसङ्घातस्वामी जीवः, तदा ‘कर्षति’ इति श्लोकस्य द्वितीयपादः अर्थवशात् प्राथम्येन सम्बध्यते।", "padacchedaText": "", "audioFile": "PB_002759.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002760", "originalText": "यदा च पूर्वस्मात् शरीरात् शरीरान्तरम् अवाप्नोति तदा गृहीत्वा एतानि मनःषष्ठानि इन्द्रियाणि संयाति सम्यक् याति गच्छति। किमिव इति, आह— वायुः पवनः गन्धानिव आशयात् पुष्पादेः॥ ८॥", "padacchedaText": "", "audioFile": "PB_002760.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002761", "originalText": "कानि पुनः तानि—\nश्रोत्रं चक्षुः स्पर्शनं च रसनं घ्राणमेव च। अधिष्ठाय मनश्चायं विषयानुपसेवते॥ ९॥", "padacchedaText": "", "audioFile": "PB_002761.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002762", "originalText": "श्रोत्रं चक्षुः स्पर्शनं च त्वगिन्द्रियं रसनं घ्राणमेव च मनश्च षष्ठं प्रत्येकम् इन्द्रियेण सह, अधिष्ठाय देहस्थः विषयान् शब्दादीन् उपसेवते॥ ९॥", "padacchedaText": "", "audioFile": "PB_002762.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002763", "originalText": "एवं देहगतं देहात्—\nउत्क्रामन्तं स्थितं वापि भुञ्जानं वा गुणान्वितम्। विमूढा नानुपश्यन्ति पश्यन्ति ज्ञानचक्षुषः॥ १०॥", "padacchedaText": "", "audioFile": "PB_002763.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002764", "originalText": "उत्क्रामन्तं देहं पूर्वोपात्तं परित्यजन्तं स्थितं वापि देहे तिष्ठन्तं भुञ्जानं वा शब्दादींश्च उपलभमानं गुणान्वितं सुखदुःखमोहाद्यैः गुणैः अन्वितम् अनुगतं संयुक्तमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_002764.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002765", "originalText": "एवंभूतमपि एनम् अत्यन्तदर्शनगोचरप्राप्तं विमूढाः दृष्टादृष्टविषयभोगबलाकृष्टचेतस्तया अनेकधा मूढाः न अनुपश्यन्ति— अहो कष्टं वर्तते इति अनुक्रोशति च भगवान्— ये तु पुनः प्रमाणजनितज्ञानचक्षुषः ते एनं पश्यन्ति ज्ञानचक्षुषः विविक्तदृष्टयः इत्यर्थः॥ १०॥", "padacchedaText": "", "audioFile": "PB_002765.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002766", "originalText": "केचित्तु—\nयतन्तो योगिनश्चैनं पश्यन्त्यात्मन्यवस्थितम्। यतन्तोऽप्यकृतात्मानो नैनं पश्यन्त्यचेतसः॥ ११॥", "padacchedaText": "", "audioFile": "PB_002766.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002767", "originalText": "यतन्तः प्रयत्नं कुर्वन्तः योगिनश्च समाहितचित्ताः एनं प्रकृतम् आत्मानं पश्यन्ति ‘अयम् अहम् अस्मि’ इति उपलभन्ते आत्मनि स्वस्यां बुद्धौ अवस्थितम्।", "padacchedaText": "", "audioFile": "PB_002767.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002768", "originalText": "यतन्तोऽपि शास्त्रादिप्रमाणैः, अकृतात्मानः असंस्कृतात्मानः तपसा इन्द्रियजयेन च, दुश्चरितात् अनुपरताः, अशान्तदर्पाः, प्रयत्नं कुर्वन्तोऽपि न एवं पश्यन्ति अचेतसः अविवेकिनः॥ ११॥", "padacchedaText": "", "audioFile": "PB_002768.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002769", "originalText": "यत् पदं सर्वस्य अवभासकमपि अग्न्यादित्यादिकं ज्योतिः न अवभासयते, यत् प्राप्ताश्च मुमुक्षवः पुनः संसाराभिमुखाः न निवर्तन्ते, यस्य च पदस्य उपाधिभेदम् अनुविधीयमानाः जीवाः— घटाकाशादयः इव आकाशस्य— अंशाः, तस्य पदस्य सर्वात्मत्वं सर्वव्यवहारास्पदत्वं च विवक्षुः चतुर्भिः श्लोकैः विभूतिसङ्क्षेपमाह भगवान्—\nयदादित्यगतं तेजो जगद्भासयतेऽखिलम्।", "padacchedaText": "", "audioFile": "PB_002769.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002770", "originalText": "यच्चन्द्रमसि यच्चाग्नौ तत्तेजो विद्धि मामकम्॥ १२॥", "padacchedaText": "", "audioFile": "PB_002770.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002771", "originalText": "यत् आदित्यगतम् आदित्याश्रयम्।", "padacchedaText": "", "audioFile": "PB_002771.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002772", "originalText": "किं तत्? तेजः दीप्तिः प्रकाशः जगत् भासयते प्रकाशयति अखिलं समस्तम्, यत् चन्द्रमसि शशभृति तेजः अवभासकं वर्तते, यच्च अग्नौ हुतवहे, तत् तेजः विद्धि विजानीहि मामकं मदीयं मम विष्णोः तत् ज्योतिः।", "padacchedaText": "", "audioFile": "PB_002772.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002773", "originalText": "अथवा, आदित्यगतं तेजः चैतन्यात्मकं ज्योतिः, यच्चन्द्रमसि, यच्च अग्नौ वर्तते तत् तेजः विद्धि मामकं मदीयं मम विष्णोः तत् ज्योतिः॥", "padacchedaText": "", "audioFile": "PB_002773.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002774", "originalText": "ननु स्थावरेषु जङ्गमेषु च तत् समानं चैतन्यात्मकं ज्योतिः।", "padacchedaText": "", "audioFile": "PB_002774.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002775", "originalText": "तत्र कथम् इदं विशेषणम्— ‘यदादित्यगतम्’ इत्यादि।", "padacchedaText": "", "audioFile": "PB_002775.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002776", "originalText": "नैष दोषः, सत्त्वाधिक्यात् आविस्तरत्वोपपत्तेः।", "padacchedaText": "", "audioFile": "PB_002776.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002777", "originalText": "आदित्यादिषु हि सत्त्वं अत्यन्तप्रकाशम् अत्यन्तभास्वरम्, अतः तत्रैव आविस्तरं ज्योतिः इति तत् विशिष्यते, न तु तत्रैव तत् अधिकमिति। यथा हि श्लोके तुल्येऽपि मुखसंस्थाने न काष्ठकुड्यादौ मुखम् आविर्भवति, आदर्शादौ तु स्वच्छे स्वच्छतरे च तारतम्येन आविर्भवति, तद्वत्॥ १२॥", "padacchedaText": "", "audioFile": "PB_002777.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002778", "originalText": "किञ्च—\nगामाविश्य च भूतानि\nधारयाम्यहमोजसा। पुष्णामि चौषधीः सर्वाः\nसोमो भूत्वा रसात्मकः॥ १३॥", "padacchedaText": "", "audioFile": "PB_002778.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002779", "originalText": "गां पृथिवीम् आविश्य प्रविश्य धारयामि भूतानि जगत् अहम् ओजसा बलेन, यत् बलं कामरागविवर्जितम् ऐश्वरं रूपं जगद्विधारणाय पृथिव्याम् आविष्टं येन पृथिवी गुर्वी न अधः पतति न विदीर्यते च।", "padacchedaText": "", "audioFile": "PB_002779.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002780", "originalText": "तथा च मन्त्रवर्णः— ‘येन द्यौरुग्रा पृथिवी च दृढा’ (तै.सं.४.१.८) इति, ‘स दाधार पृथिवीम्’ (तै.सं.४.१.८) इत्यादिश्च।", "padacchedaText": "", "audioFile": "PB_002780.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002781", "originalText": "अतः गामाविश्य च भूतानि चराचराणि धारयामि इति युक्तमुक्तम्।", "padacchedaText": "", "audioFile": "PB_002781.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002782", "originalText": "किञ्च, पृथिव्यां जाताः ओषधीः सर्वाः व्रीहियवाद्याः पुष्णामि पुष्टिमतीः रसस्वादुमतीश्च करोमि सोमो भूत्वा रसात्मकः सोमः सन् रसात्मकः रसस्वभावः।", "padacchedaText": "", "audioFile": "PB_002782.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002783", "originalText": "सर्वरसानाम् आकरः सोमः। स हि सर्वरसात्मकः सर्वाः ओषधीः स्वात्मरसान् अनुप्रवेशयन् पुष्णाति॥ १३॥", "padacchedaText": "", "audioFile": "PB_002783.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002784", "originalText": "किञ्च—\nअहं वैश्वानरो भूत्वा प्राणिनां देहमाश्रितः। प्राणापानसमायुक्तः पचाम्यन्नं चतुर्विधम्॥ १४॥", "padacchedaText": "", "audioFile": "PB_002784.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002785", "originalText": "अहमेव वैश्वानरः उदरस्थः अग्निः भूत्वा— ‘अयमग्निर्वैश्वानरो योऽयमन्तः पुरुषे येनेदमन्नं पच्यते’ (बृ.५.९.१) इत्यादिश्रुतेः, वैश्वानरः सन् प्राणिनां प्राणवतां देहम् आश्रितः प्रविष्टः प्राणापानसमायुक्तः प्राणापानाभ्यां समायुक्तः संयुक्तः पचामि पक्तिं करोमि अन्नम् अशनं चतुर्विधं चतुष्प्रकारं भोज्यं भक्ष्यं चोष्यं लेह्यं च।", "padacchedaText": "", "audioFile": "PB_002785.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002786", "originalText": "‘भोक्ता वैश्वानरः अग्निः, अग्नेः भोज्यम् अन्नं सोमः, तदेतत् उभयम् अग्नीषोमौ सर्वम्’ इति पश्यतः अन्नदोषलेपः न भवति॥ १४॥", "padacchedaText": "", "audioFile": "PB_002786.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002787", "originalText": "किञ्च—\nसर्वस्य चाहं हृदि संनिविष्टो\nमत्तः स्मृतिर्ज्ञानमपोहनं च। वेदैश्च सर्वैरहमेव वेद्यो\nवेदान्तकृद्वेदविदेव चाहम्॥ १५॥", "padacchedaText": "", "audioFile": "PB_002787.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002788", "originalText": "सर्वस्य च प्राणिजातस्य अहम् आत्मा सन् हृदि बुद्धौ संनिविष्टः।", "padacchedaText": "", "audioFile": "PB_002788.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002789", "originalText": "अतः मत्तः आत्मनः सर्वप्राणिनां स्मृतिः ज्ञानं तदपोहनं च अपगमनं च, येषां यथा पुण्यकर्मणां पुण्यकर्मानुरोधेन ज्ञानस्मृती भवतः, तथा पापकर्मणां पापकर्मानुरूपेण स्मृतिज्ञानयोः अपोहनं च अपायनम् अपगमनं च।", "padacchedaText": "", "audioFile": "PB_002789.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002790", "originalText": "वेदैश्च सर्वैः अहमेव परमात्मा वेद्यः वेदितव्यः। वेदान्तकृत् वेदान्तार्थसम्प्रदायकृत् इत्यर्थः, वेदवित् वेदार्थवित् एव च अहम्॥ १५॥", "padacchedaText": "", "audioFile": "PB_002790.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002791", "originalText": "भगवतः ईश्वरस्य नारायणाख्यस्य विभूतिसङ्क्षेपः उक्तः विशिष्टोपाधिकृतः ‘यदादित्यगतं तेजः’ (भ.गी.१५.१२) इत्यादिना।", "padacchedaText": "", "audioFile": "PB_002791.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002792", "originalText": "अथ अधुना तस्यैव क्षराक्षरोपाधिप्रविभक्ततया निरुपाधिकस्य केवलस्य स्वरूपनिर्दिधारयिषया उत्तरे श्लोकाः आरभ्यन्ते।", "padacchedaText": "", "audioFile": "PB_002792.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002793", "originalText": "तत्र सर्वमेव अतीतानागताध्यायार्थजातं त्रिधा राशीकृत्य आह—\nद्वाविमौ पुरुषौ लोके क्षरश्चाक्षर एव च। क्षरः सर्वाणि भूतानि कूटस्थोऽक्षर उच्यते॥ १६॥", "padacchedaText": "", "audioFile": "PB_002793.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002794", "originalText": "द्वौ इमौ पृथग्राशीकृतौ पुरुषौ इति उच्येते लोके संसारे— क्षरश्च क्षरतीति क्षरः विनाशी इति एको राशिः, अपरः पुरुषः अक्षरः तद्विपरीतः, भगवतः मायाशक्तिः, क्षराख्यस्य पुरुषस्य उत्पत्तिबीजम् अनेकसंसारिजन्तुकामकर्मादिसंस्काराश्रयः, अक्षरः पुरुषः उच्यते।", "padacchedaText": "", "audioFile": "PB_002794.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002795", "originalText": "कौ तौ पुरुषौ इति आह स्वयमेव भगवान्— क्षरः सर्वाणि भूतानि, समस्तं विकारजातम् इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_002795.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002796", "originalText": "कूटस्थः कूटः राशी राशिरिव स्थितः। अथवा, कूटः माया वञ्चना जिह्मता कुटिलता इति पर्यायाः, अनेकमायावञ्चनादिप्रकारेण स्थितः कूटस्थः, संसारबीजानन्त्यात् न क्षरति इति अक्षरः उच्यते॥ १६॥", "padacchedaText": "", "audioFile": "PB_002796.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002797", "originalText": "आभ्यां क्षराक्षराभ्यां अन्यः विलक्षणः क्षराक्षरोपाधिद्वयदोषेण अस्पृष्टः नित्यशुद्धबुद्धमुक्तस्वभावः—\nउत्तमः पुरुषस्त्वन्यः परमात्मेत्युदाहृतः। यो लोकत्रयमाविश्य बिभर्त्यव्यय ईश्वरः॥ १७॥", "padacchedaText": "", "audioFile": "PB_002797.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002798", "originalText": "उत्तमः उत्कृष्टतमः पुरुषस्तु अन्यः अत्यन्तविलक्षणः आभ्यां परमात्मा इति परमश्च असौ देहाद्यविद्याकृतात्मभ्यः, आत्मा च सर्वभूतानां प्रत्यक्चेतनः, इत्यतः परमात्मा इति उदाहृतः उक्तः वेदान्तेषु।", "padacchedaText": "", "audioFile": "PB_002798.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002799", "originalText": "स एव विशिष्यते यः लोकत्रयं भूर्भुवःस्वराख्यं स्वकीयया चैतन्यबलशक्त्या आविश्य प्रविश्य बिभर्ति स्वरूपसद्भावमात्रेण बिभर्ति धारयति, अव्ययः न अस्य व्ययः विद्यते इति अव्ययः।", "padacchedaText": "", "audioFile": "PB_002799.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002800", "originalText": "कः? ईश्वरः सर्वज्ञः नारायणाख्यः ईशनशीलः॥ १७॥", "padacchedaText": "", "audioFile": "PB_002800.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002801", "originalText": "यथाव्याख्यातस्य ईश्वरस्य ‘पुरुषोत्तमः’ इत्येतत् नाम प्रसिद्धम्।", "padacchedaText": "", "audioFile": "PB_002801.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002802", "originalText": "तस्य नामनिर्वचनप्रसिद्ध्या अर्थवत्त्वं नाम्नो दर्शयन् ‘निरतिशयः अहम् ईश्वरः’ इति आत्मानं दर्शयति भगवान्—\nयस्मात्क्षरमतीतोऽहमक्षरादपि चोत्तमः। अतोऽस्मि लोके वेदे च प्रथितः पुरुषोत्तमः॥ १८॥", "padacchedaText": "", "audioFile": "PB_002802.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002803", "originalText": "यस्मात् क्षरम् अतीतः अहं संसारमायावृक्षम् अश्वत्थाख्यम् अतिक्रान्तः अहम् अक्षरादपि संसारमायारूपवृक्षबीजभूतादपि च उत्तमः उत्कृष्टतमः ऊर्ध्वतमो वा, अतः ताभ्यां क्षराक्षराभ्याम् उत्तमत्वात् अस्मि लोके वेदे च प्रथितः प्रख्यातः।", "padacchedaText": "", "audioFile": "PB_002803.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002804", "originalText": "पुरुषोत्तमः इत्येवं मां भक्तजनाः विदुः।", "padacchedaText": "", "audioFile": "PB_002804.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002805", "originalText": "कवयः काव्यादिषु च इदं नाम निबध्नन्ति। पुरुषोत्तम इत्यनेनाभिधानेनाभिगृणन्ति॥ १८॥", "padacchedaText": "", "audioFile": "PB_002805.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002806", "originalText": "अथ इदानीं यथानिरुक्तम् आत्मानं यो वेद, तस्य इदं फलम् उच्यते—\nयो मामेवमसंमूढो जानाति पुरुषोत्तमम्। स सर्वविद्भजति मां सर्वभावेन भारत॥ १९॥", "padacchedaText": "", "audioFile": "PB_002806.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002807", "originalText": "यः माम् ईश्वरं यथोक्तविशेषणम् एवं यथोक्तेन प्रकारेण असंमूढः संमोहवर्जितः सन् जानाति ‘अयम् अहम् अस्मि’ इति पुरुषोत्तमं सः सर्ववित् सर्वात्मना सर्वं वेत्तीति सर्वज्ञः सर्वभूतस्थं भजति मां सर्वभावेन सर्वात्मतया हे भारत॥ १९॥", "padacchedaText": "", "audioFile": "PB_002807.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002808", "originalText": "अस्मिन् अध्याये भगवत्तत्त्वज्ञानं मोक्षफलम् उक्त्वा,अथ इदानीं तत् स्तौति—\nइति गुह्यतमं शास्त्रमिदमुक्तं मयानघ। एतद्बुद्ध्वा बुद्धिमान्स्यात्कृतकृत्यश्च भारत॥ २०॥", "padacchedaText": "", "audioFile": "PB_002808.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002809", "originalText": "इति एतत् गुह्यतमं गोप्यतमम्, अत्यन्तरहस्यं इत्येतत्।", "padacchedaText": "", "audioFile": "PB_002809.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002810", "originalText": "किं तत्? शास्त्रम्।", "padacchedaText": "", "audioFile": "PB_002810.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002811", "originalText": "यद्यपि गीताख्यं समस्तम् ‘शास्त्रम्’ उच्यते, तथापि अयमेव अध्यायः इह ‘शास्त्रम्’ इति उच्यते स्तुत्यर्थं प्रकरणात्।", "padacchedaText": "", "audioFile": "PB_002811.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002812", "originalText": "सर्वो हि गीताशास्त्रार्थः अस्मिन् अध्याये समासेन उक्तः।", "padacchedaText": "", "audioFile": "PB_002812.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002813", "originalText": "न केवलं गीताशास्त्रार्थ एव, किन्तु सर्वश्च वेदार्थः इह परिसमाप्तः।", "padacchedaText": "", "audioFile": "PB_002813.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002814", "originalText": "‘यस्तं वेद स वेदवित्’ (भ.गी.१५.१) ‘वेदैश्च सर्वैरहमेव वेद्यः’ (भ.गी.१५.१५) इति च उक्तम्।", "padacchedaText": "", "audioFile": "PB_002814.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002815", "originalText": "इदम् उक्तं कथितं मया हे अनघ अपाप।", "padacchedaText": "", "audioFile": "PB_002815.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002816", "originalText": "एतत् शास्त्रं यथादर्शितार्थं बुद्ध्वा बुद्धिमान् स्यात् भवेत् न अन्यथा कृतकृत्यश्च भारत कृतं कृत्यं कर्तव्यं येन सः कृतकृत्यः, विशिष्टजन्मप्रसूतेन ब्राह्मणेन यत् कर्तव्यं तत् सर्वं भगवत्तत्त्वे विदिते कृतं भवेत् इत्यर्थः, न च अन्यथा कर्तव्यं परिसमाप्यते कस्यचित् इत्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_002816.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002817", "originalText": "‘सर्वं कर्माखिलं पार्थ ज्ञाने परिसमाप्यते’ (भ.गी.४.३३) इति च उक्तम्।", "padacchedaText": "", "audioFile": "PB_002817.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002818", "originalText": "‘एतद्धि जन्मसामग्र्यं ब्राह्मणस्य विशेषतः।", "padacchedaText": "", "audioFile": "PB_002818.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002819", "originalText": "प्राप्यैतत्कृतकृत्यो हि द्विजो भवति नान्यथा’ (मनु.१२.९३) इति च मानवं वचनम्। यतः एतत् परमार्थतत्त्वं मत्तः श्रुतवान् असि, अतः कृतार्थः त्वं भारत इति॥ २०॥", "padacchedaText": "", "audioFile": "PB_002819.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002820", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ श्रीमद्भगवद्गीताभाष्ये पञ्चदशोऽध्यायः॥", "padacchedaText": "", "audioFile": "PB_002820.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002821", "originalText": "षोडशोऽध्यायः\nदैवी आसुरी राक्षसी इति प्राणिनां प्रकृतयः नवमे अध्याये सूचिताः।", "padacchedaText": "", "audioFile": "PB_002821.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002822", "originalText": "तासां विस्तरेण प्रदर्शनाय ‘अभयं सत्त्वसंशुद्धिः’ इत्यादिः अध्यायः आरभ्यते। तत्र संसारमोक्षाय दैवी प्रकृतिः, निबन्धाय आसुरी राक्षसी च इति दैव्याः आदानाय प्रदर्शनं क्रियते, इतरयोः परिवर्जनाय च॥", "padacchedaText": "", "audioFile": "PB_002822.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002823", "originalText": "श्रीभगवानुवाच—\nअभयं सत्त्वसंशुद्धिर्ज्ञानयोगव्यवस्थितिः। दानं दमश्च यज्ञश्च स्वाध्यायस्तप आर्जवम्॥ १॥", "padacchedaText": "", "audioFile": "PB_002823.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002824", "originalText": "अभयम् अभीरुता।", "padacchedaText": "", "audioFile": "PB_002824.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002825", "originalText": "सत्त्वसंशुद्धिः सत्त्वस्य अन्तःकरणस्य संशुद्धिः संव्यवहारेषु परवञ्चनामायानृतादिपरिवर्जनं शुद्धसत्त्वभावेन व्यवहारः इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_002825.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002826", "originalText": "ज्ञानयोगव्यवस्थितिः ज्ञानं शास्त्रतः आचार्यतश्च आत्मादिपदार्थानाम् अवगमः, अवगतानाम् इन्द्रियाद्युपसंहारेण एकाग्रतया स्वात्मसंवेद्यतापादनं योगः, तयोः ज्ञानयोगयोः व्यवस्थितिः व्यवस्थानं तन्निष्ठता।", "padacchedaText": "", "audioFile": "PB_002826.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002827", "originalText": "एषा प्रधाना दैवी सात्त्विकी सम्पत्।", "padacchedaText": "", "audioFile": "PB_002827.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002828", "originalText": "यत्र येषाम् अधिकृतानां या प्रकृतिः सम्भवति, सात्त्विकी सा उच्यते।", "padacchedaText": "", "audioFile": "PB_002828.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002829", "originalText": "दानं यथाशक्ति संविभागः अन्नादीनाम्।", "padacchedaText": "", "audioFile": "PB_002829.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002830", "originalText": "दमश्च बाह्यकरणानाम् उपशमः, अन्तःकरणस्य उपशमं शान्तिं वक्ष्यति।", "padacchedaText": "", "audioFile": "PB_002830.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002831", "originalText": "यज्ञश्च श्रौतः अग्निहोत्रादिः।", "padacchedaText": "", "audioFile": "PB_002831.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002832", "originalText": "स्मार्तश्च देवयज्ञादिः, स्वाध्यायः ऋग्वेदाद्यध्ययनम् अदृष्टार्थम्।", "padacchedaText": "", "audioFile": "PB_002832.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002833", "originalText": "तपः वक्ष्यमाणं शारीरादि। आर्जवम् ऋजुत्वं सर्वदा॥ १॥", "padacchedaText": "", "audioFile": "PB_002833.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002834", "originalText": "किञ्च—\nअहिंसा सत्यमक्रोधस्त्यागः शान्तिरपैशुनम्। दया भूतेष्वलोलुप्त्वं मार्दवं ह्रीरचापलम्॥ २॥", "padacchedaText": "", "audioFile": "PB_002834.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002835", "originalText": "अहिंसा अहिंसनं प्राणिनां पीडावर्जनम्।", "padacchedaText": "", "audioFile": "PB_002835.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002836", "originalText": "सत्यम् अप्रियानृतवर्जितं यथाभूतार्थवचनम्।", "padacchedaText": "", "audioFile": "PB_002836.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002837", "originalText": "अक्रोधः परैः आक्रुष्टस्य अभिहतस्य वा प्राप्तस्य क्रोधस्य उपशमनम्।", "padacchedaText": "", "audioFile": "PB_002837.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002838", "originalText": "त्यागः संन्यासः, पूर्वं दानस्य उक्तत्वात्।", "padacchedaText": "", "audioFile": "PB_002838.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002839", "originalText": "शान्तिः अन्तःकरणस्य उपशमः।", "padacchedaText": "", "audioFile": "PB_002839.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002840", "originalText": "अपैशुनं अपिशुनता, परस्मै पररन्ध्रप्रकटीकरणं पैशुनम्, तदभावः अपैशुनम्।", "padacchedaText": "", "audioFile": "PB_002840.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002841", "originalText": "दया कृपा भूतेषु दुःखितेषु।", "padacchedaText": "", "audioFile": "PB_002841.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002842", "originalText": "अलोलुप्त्वम् इन्द्रियाणां विषयसंनिधौ अविक्रिया।", "padacchedaText": "", "audioFile": "PB_002842.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002843", "originalText": "मार्दवं मृदुता अक्रौर्यम्।", "padacchedaText": "", "audioFile": "PB_002843.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002844", "originalText": "ह्रीः लज्जा। अचापलम् असति प्रयोजने वाक्पाणिपादादीनाम् अव्यापारयितृत्वम्॥ २॥", "padacchedaText": "", "audioFile": "PB_002844.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002845", "originalText": "किञ्च—\nतेजः क्षमा धृतिः शौचमद्रोहो नातिमानिता। भवन्ति सम्पदं दैवीमभिजातस्य भारत॥ ३॥", "padacchedaText": "", "audioFile": "PB_002845.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002846", "originalText": "तेजः प्रागल्भ्यं न त्वग्गता दीप्तिः।", "padacchedaText": "", "audioFile": "PB_002846.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002847", "originalText": "क्षमा आक्रुष्टस्य ताडितस्य वा अन्तर्विक्रियानुत्पत्तिः, उत्पन्नायां विक्रियायाम् उपशमनम् अक्रोधः इति अवोचाम।", "padacchedaText": "", "audioFile": "PB_002847.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002848", "originalText": "इत्थं क्षमायाः अक्रोधस्य च विशेषः।", "padacchedaText": "", "audioFile": "PB_002848.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002849", "originalText": "धृतिः देहेन्द्रियेषु अवसादं प्राप्तेषु तस्य प्रतिषेधकः अन्तःकरणवृत्तिविशेषः, येन उत्तम्भितानि करणानि देहश्च न अवसीदन्ति।", "padacchedaText": "", "audioFile": "PB_002849.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002850", "originalText": "शौचं द्विविधं मृज्जलकृतं बाह्यम् आभ्यन्तरं च मनोबुद्ध्योः नैर्मल्यं मायारागादिकालुष्याभावः, एवं द्विविधं शौचम्।", "padacchedaText": "", "audioFile": "PB_002850.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002851", "originalText": "अद्रोहः परजिघांसाभावः अहिंसनम्।", "padacchedaText": "", "audioFile": "PB_002851.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002852", "originalText": "नातिमानिता अत्यर्थं मानः अतिमानः, सः यस्य विद्यते सः अतिमानी, तद्भावः अतिमानिता, तदभावः नातिमानिता आत्मनः पूज्यतातिशयभावनाभाव इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_002852.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002853", "originalText": "भवन्ति अभयादीनि एतदन्तानि सम्पदं अभिजातस्य। किंविशिष्टां सम्पदम्? दैवीं देवानां या सम्पत् ताम् अभिलक्ष्य जातस्य देवविभूत्यर्हस्य भाविकल्याणस्य इत्यर्थः, हे भारत॥ ३॥", "padacchedaText": "", "audioFile": "PB_002853.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002854", "originalText": "अथ इदानीं आसुरी सम्पत् उच्यते—\nदम्भो दर्पोऽतिमानश्च क्रोधः पारुष्यमेव च। अज्ञानं चाभिजातस्य पार्थ सम्पदमासुरीम्॥ ४॥", "padacchedaText": "", "audioFile": "PB_002854.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002855", "originalText": "दम्भः धर्मध्वजित्वम्।", "padacchedaText": "", "audioFile": "PB_002855.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002856", "originalText": "दर्पः विद्याधनस्वजनादिनिमित्तः उत्सेकः।", "padacchedaText": "", "audioFile": "PB_002856.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002857", "originalText": "अतिमानः पूर्वोक्तः।", "padacchedaText": "", "audioFile": "PB_002857.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002858", "originalText": "क्रोधश्च।", "padacchedaText": "", "audioFile": "PB_002858.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002859", "originalText": "पारुष्यमेव च परुषवचनम्— यथा काणम् ‘चक्षुष्मान्’ विरूपम् ‘रूपवान्’ हीनाभिजनम् ‘उत्तमाभिजनः’ इत्यादि।", "padacchedaText": "", "audioFile": "PB_002859.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002860", "originalText": "अज्ञानं च अविवेकज्ञानं कर्तव्याकर्तव्यादिविषयमिथ्याप्रत्ययः।", "padacchedaText": "", "audioFile": "PB_002860.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002861", "originalText": "अभिजातस्य पार्थ। किम् अभिजातस्येति, आह— सम्पदम् आसुरीम् असुराणां सम्पत् आसुरी ताम् अभिजातस्य इत्यर्थः॥ ४॥", "padacchedaText": "", "audioFile": "PB_002861.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002862", "originalText": "अनयोः सम्पदोः कार्यम् उच्यते—\nदैवी सम्पद्विमोक्षाय निबन्धायासुरी मता। मा शुचः सम्पदं दैवीमभिजातोऽसि पाण्डव॥ ५॥", "padacchedaText": "", "audioFile": "PB_002862.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002863", "originalText": "दैवी सम्पत् या, सा विमोक्षाय संसारबन्धनात्।", "padacchedaText": "", "audioFile": "PB_002863.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002864", "originalText": "निबन्धाय नियतः बन्धः निबन्धः तदर्थम् आसुरी सम्पत् मता अभिप्रेता।", "padacchedaText": "", "audioFile": "PB_002864.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002865", "originalText": "तथा राक्षसी च।", "padacchedaText": "", "audioFile": "PB_002865.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002866", "originalText": "तत्र एवम् उक्ते सति अर्जुनस्य अन्तर्गतं भावम् ‘किम् अहम् आसुरसम्पद्युक्तः? किं वा दैवसम्पद्युक्तः? ’ इत्येवम् आलोचनारूपम् आलक्ष्य आह भगवान्— मा शुचः शोकं मा कार्षीः।", "padacchedaText": "", "audioFile": "PB_002866.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002867", "originalText": "सम्पदं दैवीम् अभिजातः असि अभिलक्ष्य जातोऽसि, भाविकल्याणः त्वम् असि इत्यर्थः, हे पाण्डव॥ ५॥", "padacchedaText": "", "audioFile": "PB_002867.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002868", "originalText": "द्वौ भूतसर्गौ लोकेऽस्मिन्दैव आसुर एव च। दैवो विस्तरशः प्रोक्त आसुरं पार्थ मे शृणु॥ ६॥", "padacchedaText": "", "audioFile": "PB_002868.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002869", "originalText": "द्वौ द्विसङ्ख्याकौ भूतसर्गौ भूतानां मनुष्याणां सर्गौ सृष्टी भूतसर्गौ सृज्येतेति सर्गौ भूतान्येव सृज्यमानानि दैवासुरसम्पद्द्वययुक्तानि इति द्वौ भूतसर्गौ इति उच्यते, ‘द्वया ह वै प्राजापत्या देवाश्चासुराश्च’ (बृ.१.३.१) इति श्रुतेः।", "padacchedaText": "", "audioFile": "PB_002869.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002870", "originalText": "लोके अस्मिन्, संसारे इत्यर्थः, सर्वेषां द्वैविध्योपपत्तेः।", "padacchedaText": "", "audioFile": "PB_002870.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002871", "originalText": "कौ तौ भूतसर्गौ इति, उच्यते— प्रकृतावेव दैव आसुर एव च।", "padacchedaText": "", "audioFile": "PB_002871.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002872", "originalText": "उक्तयोरेव पुनः अनुवादे प्रयोजनम् आह— दैवः भूतसर्गः ‘अभयं सत्त्वसंशुद्धिः’ (भ.गी.१६.१) इत्यादिना विस्तरशः विस्तरप्रकारैः प्रोक्तः कथितः, न तु आसुरः विस्तरशः, अतः तत्परिवर्जनार्थम् आसुरं पार्थ, मे मम वचनात् उच्यमानं विस्तरशः शृणु अवधारय॥ ६॥", "padacchedaText": "", "audioFile": "PB_002872.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002873", "originalText": "आ अध्यायपरिसमाप्तेः आसुरी सम्पत् प्राणिविशेषणत्वेन प्रदर्श्यते, प्रत्यक्षीकरणेन च शक्यते तस्याः परिवर्जनं कर्तुमिति—\nप्रवृत्तिं च निवृत्तिं च जना न विदुरासुराः।", "padacchedaText": "", "audioFile": "PB_002873.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002874", "originalText": "न शौचं नापि चाचारो न सत्यं तेषु विद्यते॥ ७॥", "padacchedaText": "", "audioFile": "PB_002874.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002875", "originalText": "प्रवृत्तिं च प्रवर्तनं यस्मिन् पुरुषार्थसाधने कर्तव्ये प्रवृत्तिः ताम्, निवृत्तिं च एतद्विपरीतां यस्मात् अनर्थहेतोः निवर्तितव्यं सा निवृत्तिः तां च, जनाः आसुराः न विदुः न जानन्ति।", "padacchedaText": "", "audioFile": "PB_002875.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002876", "originalText": "न केवलं प्रवृत्तिनिवृत्ती एव ते न विदुः, न शौचं नापि च आचारः न सत्यं तेषु विद्यते, अशौचाः अनाचाराः मायाविनः अनृतवादिनो हि आसुराः॥ ७॥", "padacchedaText": "", "audioFile": "PB_002876.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002877", "originalText": "किञ्च—\nअसत्यमप्रतिष्ठं ते जगदाहुरनीश्वरम्। अपरस्परसम्भूतं किमन्यत्कामहैतुकम्॥ ८॥", "padacchedaText": "", "audioFile": "PB_002877.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002878", "originalText": "असत्यं यथा वयम् अनृतप्रायाः तथा इदं जगत् सर्वम् असत्यम्, अप्रतिष्ठं च न अस्य धर्माधर्मौ प्रतिष्ठा अतः अप्रतिष्ठं च, इति ते आसुराः जनाः जगत् आहुः, अनीश्वरम् न च धर्माधर्मसव्यपेक्षकः अस्य शासिता ईश्वरः विद्यते इति अतः अनीश्वरं जगत् आहुः।", "padacchedaText": "", "audioFile": "PB_002878.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002879", "originalText": "किञ्च, अपरस्परसम्भूतं कामप्रयुक्तयोः स्त्रीपुरुषयोः अन्योन्यसंयोगात् जगत् सर्वं सम्भूतम्।", "padacchedaText": "", "audioFile": "PB_002879.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002880", "originalText": "किमन्यत् कामहैतुकं कामहेतुकमेव कामहैतुकम्। किमन्यत् जगतः कारणम्? न किञ्चित् अदृष्टं धर्माधर्मादि कारणान्तरं विद्यते जगतः ‘काम एव प्राणिनां कारणम्’ इति लोकायतिकदृष्टिः इयम्॥ ८॥", "padacchedaText": "", "audioFile": "PB_002880.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002881", "originalText": "एतां दृष्टिमवष्टभ्य नष्टात्मानोऽल्पबुद्धयः। प्रभवन्त्युग्रकर्माणः क्षयाय जगतोऽहिताः॥ ९॥", "padacchedaText": "", "audioFile": "PB_002881.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002882", "originalText": "एतां दृष्टिम् अवष्टभ्य आश्रित्य नष्टात्मानः नष्टस्वभावाः विभ्रष्टपरलोकसाधनाः अल्पबुद्धयः विषयविषया अल्पैव बुद्धिः येषां ते अल्पबुद्धयः प्रभवन्ति उद्भवन्ति उग्रकर्माणः क्रूरकर्माणः हिंसात्मकाः।", "padacchedaText": "", "audioFile": "PB_002882.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002883", "originalText": "क्षयाय जगतः प्रभवन्ति इति सम्बन्धः। जगतः अहिताः, शत्रवः इत्यर्थः॥ ९॥", "padacchedaText": "", "audioFile": "PB_002883.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002884", "originalText": "ते च—\nकाममाश्रित्य दुष्पूरं दम्भमानमदान्विताः। मोहाद्गृहीत्वासद्ग्राहान्प्रवर्तन्तेऽशुचिव्रताः॥ १०॥", "padacchedaText": "", "audioFile": "PB_002884.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002885", "originalText": "कामम् इच्छाविशेषम् आश्रित्य अवष्टभ्य दुष्पूरम् अशक्यपूरणं दम्भमानमदान्विताः दम्भश्च मानश्च मदश्च दम्भमानमदाः तैः अन्विताः दम्भमानमदान्विताः मोहात् अविवेकतः गृहीत्वा उपादाय असद्ग्राहान् अशुभनिश्चयान् प्रवर्तन्ते लोके अशुचिव्रताः अशुचीनि व्रतानि येषां ते अशुचिव्रताः॥ १०॥", "padacchedaText": "", "audioFile": "PB_002885.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002886", "originalText": "किञ्च—\nचिन्तामपरिमेयां च प्रलयान्तामुपाश्रिताः। कामोपभोगपरमा एतावदिति निश्चिताः॥ ११॥", "padacchedaText": "", "audioFile": "PB_002886.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002887", "originalText": "चिन्ताम् अपरिमेयां च, न परिमातुं शक्यते यस्याः चिन्तायाः इयत्ता सा अपरिमेया, ताम् अपरिमेयाम्, प्रलयान्तां मरणान्ताम् उपाश्रिताः, सदा चिन्तापराः इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_002887.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002888", "originalText": "कामोपभोगपरमाः, काम्यन्ते इति कामाः विषयाः शब्दादयः तदुपभोगपरमाः ‘अयमेव परमः पुरुषार्थः यः कामोपभोगः’ इत्येवं निश्चितात्मानः, एतावत् इति निश्चिताः॥ ११॥", "padacchedaText": "", "audioFile": "PB_002888.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002889", "originalText": "आशापाशशतैर्बद्धाः कामक्रोधपरायणाः। ईहन्ते कामभोगार्थमन्यायेनार्थसञ्चयान्॥ १२॥", "padacchedaText": "", "audioFile": "PB_002889.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002890", "originalText": "आशापाशशतैः आशा एव पाशाः तच्छतैः बद्धाः नियन्त्रिताः सन्तः सर्वतः आकृष्यमाणाः, कामक्रोधपरायणाः कामक्रोधौ परम् अयनम् आश्रयः येषां ते कामक्रोधपरायणाः, ईहन्ते चेष्टन्ते कामभोगार्थं कामभोगप्रयोजनाय न धर्मार्थम्, अन्यायेन परस्वापहरणादिना इत्यर्थः, किम्? अर्थसञ्चयान् अर्थप्रचयान्॥ १२॥", "padacchedaText": "", "audioFile": "PB_002890.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002891", "originalText": "ईदृशश्च तेषाम् अभिप्रायः—\nइदमद्य मया लब्धमिदं प्राप्स्ये मनोरथम्। इदमस्तीदमपि मे भविष्यति पुनर्धनम्॥ १३॥", "padacchedaText": "", "audioFile": "PB_002891.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002892", "originalText": "इदं द्रव्यं अद्य इदानीं मया लब्धम्।", "padacchedaText": "", "audioFile": "PB_002892.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002893", "originalText": "इदं च अन्यत् प्राप्स्ये मनोरथं मनस्तुष्टिकरम्। इदं च अस्ति इदमपि मे भविष्यति आगामिनि संवत्सरे पुनः धनं तेन अहं धनी विख्यातः भविष्यामि इति॥ १३॥", "padacchedaText": "", "audioFile": "PB_002893.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002894", "originalText": "असौ मया हतः शत्रुर्हनिष्ये चापरानपि। ईश्वरोऽहमहं भोगी सिद्धोऽहं बलवान्सुखी॥ १४॥", "padacchedaText": "", "audioFile": "PB_002894.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002895", "originalText": "असौ देवदत्तनामा मया हतः दुर्जयः शत्रुः।", "padacchedaText": "", "audioFile": "PB_002895.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002896", "originalText": "हनिष्ये च अपरान् अन्यान् वराकान् अपि।", "padacchedaText": "", "audioFile": "PB_002896.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002897", "originalText": "किम् एते करिष्यन्ति तपस्विनः, सर्वथापि नास्ति मत्तुल्यः।", "padacchedaText": "", "audioFile": "PB_002897.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002898", "originalText": "कथम्? ईश्वरः अहम्, अहं भोगी। सर्वप्रकारेण च सिद्धः अहं सम्पन्नः पुत्रैः नप्तृभिः, न केवलं मानुषः, बलवान् सुखी च अहमेव, अन्ये तु भूमिभारायावतीर्णाः॥ १४॥", "padacchedaText": "", "audioFile": "PB_002898.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002899", "originalText": "आढ्योऽभिजनवानस्मि\nकोऽन्योऽस्ति सदृशो मया। यक्ष्ये दास्यामि मोदिष्य\nइत्यज्ञानविमोहिताः॥ १५॥", "padacchedaText": "", "audioFile": "PB_002899.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002900", "originalText": "आढ्यः धनेन, अभिजनवान् सप्तपुरुषं श्रोत्रियत्वादिसम्पन्नः— तेनापि न मम तुल्यः अस्ति कश्चित्।", "padacchedaText": "", "audioFile": "PB_002900.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002901", "originalText": "कः अन्यः अस्ति सदृशः तुल्यः मया? किञ्च, यक्ष्ये यागेनापि अन्यान् अभिभविष्यामि, दास्यामि नटादिभ्यः, मोदिष्ये हर्षं च अतिशयं प्राप्स्यामि, इति एवम् अज्ञानविमोहिताः अज्ञानेन विमोहिताः विविधम् अविवेकभावम् आपन्नाः॥ १५॥", "padacchedaText": "", "audioFile": "PB_002901.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002902", "originalText": "अनेकचित्तविभ्रान्ता मोहजालसमावृताः। प्रसक्ताः कामभोगेषु पतन्ति नरकेऽशुचौ॥ १६॥", "padacchedaText": "", "audioFile": "PB_002902.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002903", "originalText": "अनेकचित्तविभ्रान्ताः उक्तप्रकारैः अनेकैः चित्तैः विविधं भ्रान्ताः अनेकचित्तविभ्रान्ताः, मोहजालसमावृताः मोहः अविवेकः अज्ञानं तदेव जालमिव आवरणात्मकत्वात्, तेन समावृताः।", "padacchedaText": "", "audioFile": "PB_002903.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002904", "originalText": "प्रसक्ताः कामभोगेषु तत्रैव निषण्णाः सन्तः तेन उपचितकल्मषाः पतन्ति नरके अशुचौ वैतरण्यादौ॥ १६॥", "padacchedaText": "", "audioFile": "PB_002904.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002905", "originalText": "आत्मसम्भाविताः स्तब्धा धनमानमदान्विताः। यजन्ते नामयज्ञैस्ते दम्भेनाविधिपूर्वकम्॥ १७॥", "padacchedaText": "", "audioFile": "PB_002905.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002906", "originalText": "आत्मसम्भाविताः सर्वगुणविशिष्टतया आत्मनैव सम्भाविताः आत्मसम्भाविताः, न साधुभिः।", "padacchedaText": "", "audioFile": "PB_002906.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002907", "originalText": "स्तब्धाः अप्रणतात्मानः।", "padacchedaText": "", "audioFile": "PB_002907.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002908", "originalText": "धनमानमदान्विताः धननिमित्तः मानः मदश्च, ताभ्यां धनमानमदाभ्याम् अन्विताः। यजन्ते नामयज्ञैः नाममात्रैः यज्ञैः ते दम्भेन धर्मध्वजितया अविधिपूर्वकं विधिविहिताङ्गेतिकर्तव्यतारहितम्॥ १७॥", "padacchedaText": "", "audioFile": "PB_002908.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002909", "originalText": "अहङ्कारं बलं दर्पं कामं क्रोधं च संश्रिताः। मामात्मपरदेहेषु प्रद्विषन्तोऽभ्यसूयकाः॥ १८॥", "padacchedaText": "", "audioFile": "PB_002909.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002910", "originalText": "अहङ्कारं अहङ्करणम् अहङ्कारः, विद्यमानैः अविद्यमानैश्च गुणैः आत्मनि अध्यारोपितैः ‘विशिष्टमात्मानमहम्’ इति मन्यते, सः अहङ्कारः अविद्याख्यः कष्टतमः, सर्वदोषाणां मूलं सर्वानर्थप्रवृत्तीनां च, तम्।", "padacchedaText": "", "audioFile": "PB_002910.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002911", "originalText": "तथा बलं पराभिभवनिमित्तं कामरागान्वितम्।", "padacchedaText": "", "audioFile": "PB_002911.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002912", "originalText": "दर्पं दर्पो नाम यस्य उद्भवे धर्मम् अतिक्रामति सः अयम् अन्तःकरणाश्रयः दोषविशेषः।", "padacchedaText": "", "audioFile": "PB_002912.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002913", "originalText": "कामं स्त्र्यादिविषयम्।", "padacchedaText": "", "audioFile": "PB_002913.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002914", "originalText": "क्रोधम् अनिष्टविषयम्।", "padacchedaText": "", "audioFile": "PB_002914.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002915", "originalText": "एतान् अन्यांश्च महतो दोषान् संश्रिताः।", "padacchedaText": "", "audioFile": "PB_002915.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002916", "originalText": "किञ्च ते माम् ईश्वरम् आत्मपरदेहेषु स्वदेहे परदेहेषु च तद्बुद्धिकर्मसाक्षिभूतं मां प्रद्विषन्तः, मच्छासनातिवर्तित्वं प्रद्वेषः, तं कुर्वन्तः अभ्यसूयकाः सन्मार्गस्थानां गुणेषु असहमानाः॥ १८॥", "padacchedaText": "", "audioFile": "PB_002916.wav", "zipFile": "011_GitaBhashya.zip"}, {"id": "B_002917", "originalText": "तानहं द्विषतः क्रूरान्संसारेषु नराधमान्। क्षिपाम्यजस्रमशुभानासुरीष्वेव योनिषु॥ १९॥", "padac
