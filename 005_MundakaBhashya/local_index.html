    <script>
        const manifest = [{"id": "B_000000", "originalText": "श्रीमच्छङ्करभगवत्पादविरचितम् मुण्डकोपनिषद्भाष्यम्\n\nप्रथमं मुण्डकम्\nप्रथमः खण्डः\n‘ब्रह्मा देवानाम्’ इत्याद्याथर्वणोपनिषत्।", "audioFile": "PB_hear2read_000000.mp3", "sections": ["प्रथमं मुण्डकम्", "प्रथमः खण्डः"]}, {"id": "B_000001", "originalText": "अस्याश्च विद्यासम्प्रदायकर्तृपारम्पर्यलक्षणं सम्बन्धमादावेवाह स्वयमेव स्तुत्यर्थम्— एवं हि महद्भिः परमपुरुषार्थसाधनत्वेन गुरुणायासेन लब्धा विद्येति।", "audioFile": "PB_hear2read_000001.mp3", "sections": []}, {"id": "B_000002", "originalText": "श्रोतृबुद्धिप्ररोचनाय विद्यां महीकरोति, स्तुत्या प्ररोचितायां हि विद्यायां सादराः प्रवर्तेरन्निति।", "audioFile": "PB_hear2read_000002.mp3", "sections": []}, {"id": "B_000003", "originalText": "प्रयोजनेन तु विद्यायाः साध्यसाधनलक्षणं सम्बन्धमुत्तरत्र वक्ष्यति ‘भिद्यते हृदयग्रन्थिः’ (मु.२.२.९) इत्यादिना।", "audioFile": "PB_hear2read_000003.mp3", "sections": []}, {"id": "B_000004", "originalText": "अत्र चापरशब्दवाच्याया ऋग्वेदादिलक्षणाया विधिप्रतिषेधमात्रपराया विद्यायाः संसारकारणाविद्यादिदोषनिवर्तकत्वं नास्तीति स्वयमेवोक्त्वा परापरेति विद्याभेदकरणपूर्वकम् ‘अविद्यायामन्तरे वर्तमानाः’ (मु.१.२.८) इत्यादिना, तथा परप्राप्तिसाधनं सर्वसाधनसाध्यविषयवैराग्यपूर्वकं गुरुप्रसादलभ्यां ब्रह्मविद्यामाह ‘परीक्ष्य लोकान्’ (मु.१.२.१२) इत्यादिना।", "audioFile": "PB_hear2read_000004.mp3", "sections": []}, {"id": "B_000005", "originalText": "प्रयोजनं चासकृद्ब्रवीति ‘ब्रह्म वेद ब्रह्मैव भवति’ (मु.३.२.९) इति ‘परामृताः परिमुच्यन्ति सर्वे’ (मु.३.२.६) इति च।", "audioFile": "PB_hear2read_000005.mp3", "sections": []}, {"id": "B_000006", "originalText": "ज्ञानमात्रे यद्यपि सर्वाश्रमिणामधिकारः, तथापि संन्यासनिष्ठैव ब्रह्मविद्या मोक्षसाधनं न कर्मसहितेति ‘भैक्षचर्यां चरन्तः’ (मु.१.२.११) ‘संन्यासयोगात्’ (मु.३.२.६) इति च ब्रुवन्दर्शयति।", "audioFile": "PB_hear2read_000006.mp3", "sections": []}, {"id": "B_000007", "originalText": "विद्याकर्मविरोधाच्च।", "audioFile": "PB_hear2read_000007.mp3", "sections": []}, {"id": "B_000008", "originalText": "न हि ब्रह्मात्मैकत्वदर्शनेन सह कर्म स्वप्नेऽपि सम्पादयितुं शक्यम्, विद्यायाः कालविशेषाभावादनियतनिमित्तत्वाच्च कालसङ्कोचानुपपत्तेः।", "audioFile": "PB_hear2read_000008.mp3", "sections": []}, {"id": "B_000009", "originalText": "यत्तु गृहस्थेषु ब्रह्मविद्यासम्प्रदायकर्तृत्वादि लिङ्गं न तत्स्थितं न्यायं बाधितुमुत्सहते, न हि विधिशतेनापि तमःप्रकाशयोरेकत्र सद्भावः शक्यते कर्तुम्, किमुत लिङ्गैः केवलैरिति।", "audioFile": "PB_hear2read_000009.mp3", "sections": []}, {"id": "B_000010", "originalText": "एवमुक्तसम्बन्धप्रयोजनाया उपनिषदोऽल्पग्रन्थं विवरणमारभ्यते।", "audioFile": "PB_hear2read_000010.mp3", "sections": []}, {"id": "B_000011", "originalText": "य इमां ब्रह्मविद्यामुपयन्त्यात्मभावेन श्रद्धाभक्तिपुरःसराः सन्तः, तेषां गर्भजन्मजरारोगाद्यनर्थपूगं निशातयति परं वा ब्रह्म गमयत्यविद्यादिसंसारकारणं वा अत्यन्तमवसादयति विनाशयतीत्युपनिषत्, उपनिपूर्वस्य सदेरेवमर्थस्मरणात्॥", "audioFile": "PB_hear2read_000011.mp3", "sections": []}, {"id": "B_000012", "originalText": "ब्रह्मा देवानां प्रथमः सम्बभूव विश्वस्य कर्ता भुवनस्य गोप्ता। स ब्रह्मविद्यां सर्वविद्याप्रतिष्ठामथर्वाय ज्येष्ठपुत्राय प्राह॥ १॥", "audioFile": "PB_hear2read_000012.mp3", "sections": []}, {"id": "B_000013", "originalText": "ब्रह्म परिबृढो महान् धर्मज्ञानवैराग्यैश्वर्यैः सर्वानन्यानतिशेत इति, देवानां द्योतनवतामिन्द्रादीनां प्रथमः गुणैः प्रधानः सन्, प्रथमः अग्रे वा सम्बभूव अभिव्यक्तः सम्यक् स्वातन्त्र्येणेत्यभिप्रायः।", "audioFile": "PB_hear2read_000013.mp3", "sections": []}, {"id": "B_000014", "originalText": "न तथा यथा धर्माधर्मवशात्संसारिणोऽन्ये जायन्ते, ‘योऽसावतीन्द्रियोऽग्राह्यः’ (मनु.१.७) इत्यादिस्मृतेः।", "audioFile": "PB_hear2read_000014.mp3", "sections": []}, {"id": "B_000015", "originalText": "विश्वस्य सर्वस्य जगतः कर्ता उत्पादयिता, भुवनस्य उत्पन्नस्य गोप्ता पालयितेति विशेषणं ब्रह्मणो विद्यास्तुतये।", "audioFile": "PB_hear2read_000015.mp3", "sections": []}, {"id": "B_000016", "originalText": "सः एवं प्रख्यातमहत्त्वो ब्रह्मा ब्रह्मविद्यां ब्रह्मणः परमात्मनो विद्यां ब्रह्मविद्याम्, ‘येनाक्षरं पुरुषं वेद सत्यम्’ (मु.१.२.१३) इति विशेषणात्।", "audioFile": "PB_hear2read_000016.mp3", "sections": []}, {"id": "B_000017", "originalText": "परमात्मविषया हि सा।", "audioFile": "PB_hear2read_000017.mp3", "sections": []}, {"id": "B_000018", "originalText": "ब्रह्मणा वाग्रजेनोक्तेति ब्रह्मविद्या।", "audioFile": "PB_hear2read_000018.mp3", "sections": []}, {"id": "B_000019", "originalText": "तां ब्रह्मविद्याम्, सर्वविद्याप्रतिष्ठां सर्वविद्याभिव्यक्तिहेतुत्वात्सर्वविद्याश्रयामित्यर्थः, सर्वविद्यावेद्यं वा वस्त्वनयैव ज्ञायत इति, ‘येनाश्रुतं श्रुतं भवति अमतं मतमविज्ञातं विज्ञातम्’ (छा.६.१.३) इति श्रुतेः।", "audioFile": "PB_hear2read_000019.mp3", "sections": []}, {"id": "B_000020", "originalText": "सर्वविद्याप्रतिष्ठामिति च स्तौति विद्याम्।", "audioFile": "PB_hear2read_000020.mp3", "sections": []}, {"id": "B_000021", "originalText": "अथर्वाय ज्येष्ठपुत्राय ज्येष्ठश्चासौ पुत्रश्च, अनेकेषु ब्रह्मणः सृष्टिप्रकारेष्वन्यतमस्य सृष्टिप्रकारस्य प्रमुखे पूर्वम् अथर्वा सृष्ट इति ज्येष्ठः, तस्मै ज्येष्ठपुत्राय प्राह प्रोक्तवान्॥", "audioFile": "PB_hear2read_000021.mp3", "sections": []}, {"id": "B_000022", "originalText": "अथर्वणे यां प्रवदेत ब्रह्माथर्वा तां पुरोवाचाङ्गिरे ब्रह्मविद्याम्। स भारद्वाजाय सत्यवहाय प्राह भारद्वाजोऽङ्गिरसे परावराम्॥ २॥", "audioFile": "PB_hear2read_000022.mp3", "sections": []}, {"id": "B_000023", "originalText": "याम् एताम् अथर्वणे प्रवदेत प्रावदद्ब्रह्मविद्यां ब्रह्मा, तामेव ब्रह्मणः प्राप्ताम् अथर्वां पुरा पूर्वम्, उवाच उक्तवान् अङ्गिरे अङ्गीर्नाम्ने ब्रह्मविद्याम्।", "audioFile": "PB_hear2read_000023.mp3", "sections": []}, {"id": "B_000024", "originalText": "स चाङ्गीः भारद्वजाय भरद्वाजगोत्राय सत्यवहाय सत्यवहनाम्ने प्राह प्रोक्तवान्।", "audioFile": "PB_hear2read_000024.mp3", "sections": []}, {"id": "B_000025", "originalText": "भारद्वाजः अङ्गिरसे स्वशिष्याय पुत्राय वा परावरां परस्मात्परस्मादवरेणावरेण प्राप्तेति परावरा परावरसर्वविद्याविषयव्याप्तेर्वा, तां परावरामङ्गिरसे प्राहेत्यनुषङ्गः॥", "audioFile": "PB_hear2read_000025.mp3", "sections": []}, {"id": "B_000026", "originalText": "शौनको ह वै महाशालोऽङ्गिरसं विधिवदुपसन्नः पप्रच्छ कस्मिन्नु भगवो विज्ञाते सर्वमिदं विज्ञातं भवतीति॥ ३॥", "audioFile": "PB_hear2read_000026.mp3", "sections": []}, {"id": "B_000027", "originalText": "शौनकः शुनकस्यापत्यं महाशालः महागृहस्थः अङ्गिरसं भारद्वाजशिष्यमाचार्यं विधिवत् यथाशास्त्रमित्येतत्, उपसन्नः उपगतः सन् पप्रच्छ पृष्टवान्।", "audioFile": "PB_hear2read_000027.mp3", "sections": []}, {"id": "B_000028", "originalText": "शौनकाङ्गिरसोः सम्बन्धादर्वाग्विधिवद्विशेषणाभावादुपसदनविधेः पूर्वेषामनियम इति गम्यते।", "audioFile": "PB_hear2read_000028.mp3", "sections": []}, {"id": "B_000029", "originalText": "मर्यादाकरणार्थं विशेषणम्।", "audioFile": "PB_hear2read_000029.mp3", "sections": []}, {"id": "B_000030", "originalText": "मध्यदीपिकान्यायार्थं वा विशेषणम्, अस्मदादिष्वप्युपसदनविधेरिष्टत्वात्।", "audioFile": "PB_hear2read_000030.mp3", "sections": []}, {"id": "B_000031", "originalText": "किमित्याह— कस्मिन्नु भगवो विज्ञाते, नु इति वितर्के, भगवः हे भगवन्, सर्वं यदिदं विज्ञेयं विज्ञातं विशेषेण ज्ञातमवगतं भवतीति ‘एकस्मिन्विज्ञाते सर्वविद्भवति’ इति शिष्टप्रवादं श्रुतवाञ्शौनकः तद्विशेषं विज्ञातुकामः सन्कस्मिन्निति वितर्कयन्पप्रच्छ।", "audioFile": "PB_hear2read_000031.mp3", "sections": []}, {"id": "B_000032", "originalText": "अथवा, लोकसामान्यदृष्ट्या ज्ञात्वैव पप्रच्छ।", "audioFile": "PB_hear2read_000032.mp3", "sections": []}, {"id": "B_000033", "originalText": "सन्ति हि लोके सुवर्णादिशकलभेदाः सुवर्णत्वाद्येकत्वविज्ञानेन विज्ञायमाना लौकिकैः, तथा किं न्वस्ति सर्वस्य जगद्भेदस्यैकं कारणम् यत्रैकस्मिन्विज्ञाते सर्वं विज्ञातं भवतीति।", "audioFile": "PB_hear2read_000033.mp3", "sections": []}, {"id": "B_000034", "originalText": "नन्वविदिते हि कस्मिन्निति प्रश्नोऽनुपपन्नः, किमस्ति तदिति तदा प्रश्नो युक्तः, सिद्धे ह्यस्तित्वे कस्मिन्निति स्यात्, यथा कस्मिन्निधेयमिति। न, अक्षरबाहुल्यादायासभीरुत्वात्प्रश्नः सम्भवत्येव— किं न्वस्ति तद्यस्मिन्नेकस्मिन्विज्ञाते सर्ववित्स्यादिति॥", "audioFile": "PB_hear2read_000034.mp3", "sections": []}, {"id": "B_000035", "originalText": "तस्मै स होवाच। द्वे विद्ये वेदितव्ये इति ह स्म यद्ब्रह्मविदो वदन्ति परा चैवापरा च॥ ४॥", "audioFile": "PB_hear2read_000035.mp3", "sections": []}, {"id": "B_000036", "originalText": "तस्मै शौनकाय सः अङ्गिराः ह किल उवाच उक्तवान्।", "audioFile": "PB_hear2read_000036.mp3", "sections": []}, {"id": "B_000037", "originalText": "किमिति, उच्यते— द्वे विद्ये वेदितव्ये ज्ञातव्ये इति।", "audioFile": "PB_hear2read_000037.mp3", "sections": []}, {"id": "B_000038", "originalText": "एवं ह स्म किल यत् ब्रह्मविदः वेदार्थाभिज्ञाः परमार्थदर्शिनः वदन्ति।", "audioFile": "PB_hear2read_000038.mp3", "sections": []}, {"id": "B_000039", "originalText": "के ते इत्याह— परा च परमात्मविद्या, अपरा च धर्माधर्मसाधनतत्फलविषया।", "audioFile": "PB_hear2read_000039.mp3", "sections": []}, {"id": "B_000040", "originalText": "ननु कस्मिन्विदिते सर्वविद्भवतीति शौनकेन पृष्टम्, तस्मिन्वक्तव्येऽपृष्टमाहाङ्गिराः— द्वे विद्ये इत्यादि।", "audioFile": "PB_hear2read_000040.mp3", "sections": []}, {"id": "B_000041", "originalText": "नैष दोषः, क्रमापेक्षत्वात्प्रतिवचनस्य।", "audioFile": "PB_hear2read_000041.mp3", "sections": []}, {"id": "B_000042", "originalText": "अपरा हि विद्या अविद्या, सा निराकर्तव्या तद्विषये हि अविदिते न किञ्चित्तत्त्वतो विदितं स्यादिति, ‘निराकृत्य हि पूर्वपक्षं पश्चात्सिद्धान्तो वक्तव्यो भवति’ इति न्यायात्॥", "audioFile": "PB_hear2read_000042.mp3", "sections": []}, {"id": "B_000043", "originalText": "तत्रापरा, ऋग्वेदो यजुर्वेदः सामवेदोऽथर्ववेदः शिक्षा कल्पो व्याकरणं निरुक्तं छन्दो ज्योतिषमिति। अथ परा यया तदक्षरमधिगम्यते॥ ५॥", "audioFile": "PB_hear2read_000043.mp3", "sections": []}, {"id": "B_000044", "originalText": "तत्र का अपरेत्युच्यते— ऋग्वेदो यजुर्वेदः सामवेदोऽथर्ववेदः इत्येते चत्वारो वेदाः।", "audioFile": "PB_hear2read_000044.mp3", "sections": []}, {"id": "B_000045", "originalText": "शिक्षा कल्पो व्याकरणं निरुक्तं छन्दो ज्योतिषम् इत्यङ्गानि षट्, एषा अपरा विद्योक्ता।", "audioFile": "PB_hear2read_000045.mp3", "sections": []}, {"id": "B_000046", "originalText": "अथ इदानीम् इयं परा विद्योच्यते यया तत् वक्ष्यमाणविशेषणम् अक्षरम् अधिगम्यते प्राप्यते, अधिपूर्वस्य गमेः प्रायशः प्राप्त्यर्थत्वात्, न च परप्राप्तेरवगमार्थस्य च भेदोऽस्ति, अविद्याया अपाय एव हि परप्राप्तिर्नार्थान्तरम्।", "audioFile": "PB_hear2read_000046.mp3", "sections": []}, {"id": "B_000047", "originalText": "ननु ऋग्वेदादिबाह्या तर्हि सा कथं परा विद्या स्यात् मोक्षसाधनं च।", "audioFile": "PB_hear2read_000047.mp3", "sections": []}, {"id": "B_000048", "originalText": "‘या वेदबाह्याः स्मृतयो याश्च काश्च कुदृष्टयः... ’ (मनु.१२.९५) इति हि स्मरन्ति।", "audioFile": "PB_hear2read_000048.mp3", "sections": []}, {"id": "B_000049", "originalText": "कुदृष्टित्वान्निष्फलत्वादनादेया स्यात्, उपनिषदां च ऋग्वेदादिबाह्यत्वं स्यात्।", "audioFile": "PB_hear2read_000049.mp3", "sections": []}, {"id": "B_000050", "originalText": "ऋग्वेदादित्वे तु पृथक्करणमनर्थकम् अथ परेति।", "audioFile": "PB_hear2read_000050.mp3", "sections": []}, {"id": "B_000051", "originalText": "न, वेद्यविषयविज्ञानस्य विवक्षितत्वात्।", "audioFile": "PB_hear2read_000051.mp3", "sections": []}, {"id": "B_000052", "originalText": "उपनिषद्वेद्याक्षरविषयं हि विज्ञानमिह परा विद्येति प्राधान्येन विवक्षितम्, नोपनिषच्छब्दराशिः।", "audioFile": "PB_hear2read_000052.mp3", "sections": []}, {"id": "B_000053", "originalText": "वेदशब्देन तु सर्वत्र शब्दराशिर्विवक्षितः। शब्दराश्यधिगमेऽपि यत्नान्तरमन्तरेण गुर्वभिगमनादिलक्षणं वैराग्यं च नाक्षराधिगमः सम्भवतीति पृथक्करणं ब्रह्मविद्याया अथ परा विद्येति॥", "audioFile": "PB_hear2read_000053.mp3", "sections": []}, {"id": "B_000054", "originalText": "यत्तदद्रेश्यमग्राह्यमगोत्रमवर्णमचक्षुःश्रोत्रं तदपाणिपादम्। नित्यं विभुं सर्वगतं सुसूक्ष्मं तदव्ययं यद्भूतयोनिं परिपश्यन्ति धीराः॥ ६॥", "audioFile": "PB_hear2read_000054.mp3", "sections": []}, {"id": "B_000055", "originalText": "यथा विधिविषये कर्त्राद्यनेककारकोपसंहारद्वारेण वाक्यार्थज्ञानकालादन्यत्रानुष्ठेयोऽर्थोऽस्त्यग्निहोत्रादिलक्षणः, न तथेह परविद्याविषये वाक्यार्थज्ञानसमकाल एव तु पर्यवसितो भवति, केवलशब्दप्रकाशितार्थज्ञानमात्रनिष्ठाव्यतिरिक्ताभावात्।", "audioFile": "PB_hear2read_000055.mp3", "sections": []}, {"id": "B_000056", "originalText": "तस्मादिह परां विद्यां सविशेषणेनाक्षरेण विशिनष्टि— यत्तदद्रेश्यमित्यादिना।", "audioFile": "PB_hear2read_000056.mp3", "sections": []}, {"id": "B_000057", "originalText": "वक्ष्यमाणं बुद्धौ संहृत्य सिद्धवत्परामृशति— यत्तदिति।", "audioFile": "PB_hear2read_000057.mp3", "sections": []}, {"id": "B_000058", "originalText": "अद्रेश्यम् अदृश्यं सर्वेषां बुद्धीन्द्रियाणामगम्यमित्येतत्।", "audioFile": "PB_hear2read_000058.mp3", "sections": []}, {"id": "B_000059", "originalText": "दृशेर्बहिःप्रवृत्तस्य पञ्चेन्द्रियद्वारकत्वात्।", "audioFile": "PB_hear2read_000059.mp3", "sections": []}, {"id": "B_000060", "originalText": "अग्राह्यं कर्मेन्द्रियाविषयमित्येतत्।", "audioFile": "PB_hear2read_000060.mp3", "sections": []}, {"id": "B_000061", "originalText": "अगोत्रम्, गोत्रमन्वयो मूलमित्यनर्थान्तरम्।", "audioFile": "PB_hear2read_000061.mp3", "sections": []}, {"id": "B_000062", "originalText": "अगोत्रम् अनन्वयमित्यर्थः।", "audioFile": "PB_hear2read_000062.mp3", "sections": []}, {"id": "B_000063", "originalText": "न हि तस्य मूलमस्ति येनान्वितं स्यात्।", "audioFile": "PB_hear2read_000063.mp3", "sections": []}, {"id": "B_000064", "originalText": "वर्ण्यन्त इति वर्णा द्रव्यधर्माः स्थूलत्वादयः शुक्लत्वादयो वा।", "audioFile": "PB_hear2read_000064.mp3", "sections": []}, {"id": "B_000065", "originalText": "अविद्यमाना वर्णा यस्य तत् अवर्णम् अक्षरम्।", "audioFile": "PB_hear2read_000065.mp3", "sections": []}, {"id": "B_000066", "originalText": "अचक्षुःश्रोत्रं चक्षुश्च श्रोत्रं च नामरूपविषये करणे सर्वजन्तूनाम्, ते अविद्यमाने यस्य तदचक्षुःश्रोत्रम्।", "audioFile": "PB_hear2read_000066.mp3", "sections": []}, {"id": "B_000067", "originalText": "‘यः सर्वज्ञः सर्ववित्’ (मु.१.१.९) इति चेतनावत्त्वविशेषणात्प्राप्तं संसारिणामिव चक्षुःश्रोत्रादिभिः करणैरर्थसाधकत्वम्, तदिह अचक्षुःश्रोत्रमिति वार्यते, ‘पश्यत्यचक्षुः स शृणोत्यकर्णः’ (श्वे.३.१९) इत्यादिदर्शनात्।", "audioFile": "PB_hear2read_000067.mp3", "sections": []}, {"id": "B_000068", "originalText": "किञ्च, तत् अपाणिपादं कर्मेन्द्रियरहितमित्येतत्।", "audioFile": "PB_hear2read_000068.mp3", "sections": []}, {"id": "B_000069", "originalText": "यत एवम् अग्राह्यमग्राहकं च अतो नित्यमविनाशि।", "audioFile": "PB_hear2read_000069.mp3", "sections": []}, {"id": "B_000070", "originalText": "विभुं विविधं ब्रह्मादिस्थावरान्तप्राणिभेदैर्भवतीति विभुम्।", "audioFile": "PB_hear2read_000070.mp3", "sections": []}, {"id": "B_000071", "originalText": "सर्वगतं व्यापकमाकाशवत्सुसूक्ष्मम्।", "audioFile": "PB_hear2read_000071.mp3", "sections": []}, {"id": "B_000072", "originalText": "शब्दादिस्थूलत्वकारणरहितत्वात्।", "audioFile": "PB_hear2read_000072.mp3", "sections": []}, {"id": "B_000073", "originalText": "शब्दादयो ह्याकाशवाय्वादीनामुत्तरोत्तरस्थूलत्वकारणानि, तदभावात्सुसूक्ष्मम्, किञ्च, तत् अव्ययम् उक्तधर्मत्वादेव न व्येतीत्यव्ययम्।", "audioFile": "PB_hear2read_000073.mp3", "sections": []}, {"id": "B_000074", "originalText": "न ह्यनङ्गस्य स्वाङ्गापचयलक्षणो व्ययः सम्भवति शरीरस्येव।", "audioFile": "PB_hear2read_000074.mp3", "sections": []}, {"id": "B_000075", "originalText": "नापि कोशापचयलक्षणो व्ययः सम्भवति राज्ञ इव।", "audioFile": "PB_hear2read_000075.mp3", "sections": []}, {"id": "B_000076", "originalText": "नापि गुणद्वारको व्ययः सम्भवति, अगुणत्वात्सर्वात्मकत्वाच्च।", "audioFile": "PB_hear2read_000076.mp3", "sections": []}, {"id": "B_000077", "originalText": "यत् एवंलक्षणं भूतयोनिं भूतानां कारणं पृथिवीव स्थावरजङ्गमानां परिपश्यन्ति सर्वत आत्मभूतं सर्वस्य अक्षरं पश्यन्ति धीराः धीमन्तो विवेकिनः। ईदृशमक्षरं यया विद्यया अधिगम्यते सा परा विद्येति समुदायार्थः॥", "audioFile": "PB_hear2read_000077.mp3", "sections": []}, {"id": "B_000078", "originalText": "यथोर्णनाभिः सृजते गृह्णते च यथा पृथिव्यामोषधयः सम्भवन्ति। यथा सतः पुरुषात्केशलोमानि तथाक्षरात्सम्भवतीह विश्वम्॥ ७॥", "audioFile": "PB_hear2read_000078.mp3", "sections": []}, {"id": "B_000079", "originalText": "भूतयोनिरक्षरमित्युक्तम्।", "audioFile": "PB_hear2read_000079.mp3", "sections": []}, {"id": "B_000080", "originalText": "तत्कथं भूतयोनित्वमित्युच्यते दृष्टान्तैः— यथा लोके प्रसिद्धः ऊर्णनाभिः लूताकीटः किञ्चित्कारणान्तरमनपेक्ष्य स्वयमेव सृजते स्वशरीराव्यतिरिक्तानेव तन्तून्बहिः प्रसारयति पुनस्तानेव गृह्णते च गृह्णाति स्वात्मभावमेवापादयति, यथा च पृथिव्याम् ओषधयः, व्रीह्यादिस्थावराणीत्यर्थः, स्वात्माव्यतिरिक्ता एव प्रभवन्ति सम्भवन्ति, यथा च सतः विद्यमानाज्जीवतः पुरुषात् केशलोमानि केशाश्च लोमानि च सम्भवन्ति विलक्षणानि।", "audioFile": "PB_hear2read_000080.mp3", "sections": []}, {"id": "B_000081", "originalText": "यथैते दृष्टान्ताः, तथा विलक्षणं सलक्षणं च निमित्तान्तरानपेक्षाद्यथोक्तलक्षणात् अक्षरात् सम्भवति समुत्पद्यते इह संसारमण्डले विश्वं समस्तं जगत्। अनेकदृष्टान्तोपादानं तु सुखावबोधनार्थम्॥", "audioFile": "PB_hear2read_000081.mp3", "sections": []}, {"id": "B_000082", "originalText": "तपसा चीयते ब्रह्म ततोऽन्नमभिजायते। अन्नात्प्राणो मनः सत्यं लोकाः कर्मसु चामृतम्॥ ८॥", "audioFile": "PB_hear2read_000082.mp3", "sections": []}, {"id": "B_000083", "originalText": "यद्ब्रह्मण उत्पद्यमानं विश्वं तदनेन क्रमेणोत्पद्यते, न युगपद्बदरमुष्टिप्रक्षेपवदिति क्रमनियमविवक्षार्थोऽयं मन्त्र आरभ्यते— तपसा ज्ञानेन उत्पत्तिविधिज्ञतया भूतयोन्यक्षरं ब्रह्म चीयते उपचीयते उत्पादयिष्यदिदं जगत् अङ्कुरमिव बीजमुच्छूनतां गच्छति पुत्रमिव पिता हर्षेण।", "audioFile": "PB_hear2read_000083.mp3", "sections": []}, {"id": "B_000084", "originalText": "एवं सर्वज्ञतया सृष्टिस्थितिसंहारशक्तिविज्ञानवत्तयोपचितात् ततः ब्रह्मणः अन्नम् अद्यते भुज्यत इत्यन्नमव्याकृतं साधारणं कारणं संसारिणां व्याचिकीर्षितावस्थारूपेण अभिजायते उत्पद्यते।", "audioFile": "PB_hear2read_000084.mp3", "sections": []}, {"id": "B_000085", "originalText": "ततश्च अव्याकृताद्व्याचिकीर्षितावस्थात् अन्नात् प्राणः हिरण्यगर्भो ब्रह्मणो ज्ञानक्रियाशक्त्यधिष्ठितो जगत्साधारणोऽविद्याकामकर्मभूतसमुदायबीजाङ्कुरो जगदात्मा अभिजायत इत्यनुषङ्गः।", "audioFile": "PB_hear2read_000085.mp3", "sections": []}, {"id": "B_000086", "originalText": "तस्माच्च प्राणात् मनः मनआख्यं सङ्कल्पविकल्पसंशयनिर्णयाद्यात्मकमभिजायते।", "audioFile": "PB_hear2read_000086.mp3", "sections": []}, {"id": "B_000087", "originalText": "ततोऽपि सङ्कल्पाद्यात्मकान्मनसः सत्यं सत्याख्यमाकाशादिभूतपञ्चकमभिजायते।", "audioFile": "PB_hear2read_000087.mp3", "sections": []}, {"id": "B_000088", "originalText": "तस्मात्सत्याख्याद्भूतपञ्चकादण्डक्रमेण सप्त लोकाः भूरादयः।", "audioFile": "PB_hear2read_000088.mp3", "sections": []}, {"id": "B_000089", "originalText": "तेषु मनुष्यादिप्राणिवर्णाश्रमक्रमेण कर्माणि।", "audioFile": "PB_hear2read_000089.mp3", "sections": []}, {"id": "B_000090", "originalText": "कर्मसु च निमित्तभूतेषु अमृतं कर्मजं फलम्। यावत्कर्माणि कल्पकोटिशतैरपि न विनश्यन्ति, तावत्फलं न विनश्यतीत्यमृतम्॥", "audioFile": "PB_hear2read_000090.mp3", "sections": []}, {"id": "B_000091", "originalText": "यः सर्वज्ञः सर्वविद्यस्य ज्ञानमयं तपः। तस्मादेतद्ब्रह्म नाम रूपमन्नं च जायते॥ ९॥", "audioFile": "PB_hear2read_000091.mp3", "sections": []}, {"id": "B_000092", "originalText": "उक्तमेवार्थमुपसञ्जिहीर्षुर्मन्त्रो वक्ष्यमाणार्थमाह— यः उक्तलक्षणोऽक्षराख्यः सर्वज्ञः सामान्येन सर्वं जानातीति सर्वज्ञः।", "audioFile": "PB_hear2read_000092.mp3", "sections": []}, {"id": "B_000093", "originalText": "विशेषेण सर्वं वेत्तीति सर्ववित्।", "audioFile": "PB_hear2read_000093.mp3", "sections": []}, {"id": "B_000094", "originalText": "यस्य ज्ञानमयं ज्ञानविकारमेव सार्वज्ञ्यलक्षणं तपः अनायासलक्षणम्, तस्मात् यथोक्तात्सर्वज्ञात् एतत् उक्तं कार्यलक्षणं ब्रह्म हिरण्यगर्भाख्यं जायते।", "audioFile": "PB_hear2read_000094.mp3", "sections": []}, {"id": "B_000095", "originalText": "किञ्च, नाम असौ देवदत्तो यज्ञदत्त इत्यादिलक्षणम्, रूपम् इदं शुक्लं नीलमित्यादि, अन्नं च व्रीहियवादिलक्षणम्, जायते पूर्वमन्त्रोक्तक्रमेणेत्यविरोधो द्रष्टव्यः॥", "audioFile": "PB_hear2read_000095.mp3", "sections": []}, {"id": "B_000096", "originalText": "इति प्रथममुण्डके प्रथमखण्डभाष्यम्॥", "audioFile": "PB_hear2read_000096.mp3", "sections": []}, {"id": "B_000097", "originalText": "द्वितीयः खण्डः\nतदेतत्सत्यं मन्त्रेषु कर्माणि कवयो यान्यपश्यंस्तानि त्रेतायां बहुधा सन्ततानि। तान्याचरथ नियतं सत्यकामा एष वः पन्थाः सुकृतस्य लोके॥ १॥", "audioFile": "PB_hear2read_000097.mp3", "sections": ["द्वितीयः खण्डः"]}, {"id": "B_000098", "originalText": "साङ्गा वेदा अपरा विद्योक्ता ‘ऋग्वेदो यजुर्वेदः’ (मु.१.१.५) इत्यादिना।", "audioFile": "PB_hear2read_000098.mp3", "sections": []}, {"id": "B_000099", "originalText": "‘यत्तदद्रेश्यम्’ (मु.१.१.६) इत्यादिना ‘नामरूपमन्नं च जायते’ (मु.१.१.९) इत्यन्तेन ग्रन्थेनोक्तलक्षणमक्षरं यया विद्ययाधिगम्यत इति सा परा विद्या सविशेषणोक्ता।", "audioFile": "PB_hear2read_000099.mp3", "sections": []}, {"id": "B_000100", "originalText": "अतः परमनयोर्विद्ययोर्विषयौ विवेक्तव्यौ संसारमोक्षावित्युत्तरो ग्रन्थ आरभ्यते।", "audioFile": "PB_hear2read_000100.mp3", "sections": []}, {"id": "B_000101", "originalText": "तत्रापरविद्याविषयः कर्त्रादिसाधनक्रियाफलभेदरूपः संसारोऽनादिरनन्तो दुःखस्वरूपत्वाद्धातव्यः प्रत्येकं शरीरिभिः सामस्त्येन नदीस्रोतोवदविच्छेदरूपसम्बन्धः तदुपशमलक्षणो मोक्षः परविद्याविषयोऽनाद्यनन्तोऽजरोऽमरोऽमृतोऽभयः शुद्धः प्रसन्नः स्वात्मप्रतिष्ठालक्षणः परमानन्दोऽद्वय इति।", "audioFile": "PB_hear2read_000101.mp3", "sections": []}, {"id": "B_000102", "originalText": "पूर्वं तावदपरविद्याया विषयप्रदर्शनार्थमारम्भः।", "audioFile": "PB_hear2read_000102.mp3", "sections": []}, {"id": "B_000103", "originalText": "तद्दर्शने हि तन्निर्वेदोपपत्तिः।", "audioFile": "PB_hear2read_000103.mp3", "sections": []}, {"id": "B_000104", "originalText": "तथा च वक्ष्यति— ‘परीक्ष्य लोकान्कर्मचितान्’ (मु.१.२.१२) इत्यादिना।", "audioFile": "PB_hear2read_000104.mp3", "sections": []}, {"id": "B_000105", "originalText": "न ह्यप्रदर्शिते परीक्षोपपद्यत इति तत्प्रदर्शयन्नाह— तदेतत् सत्यम् अवितथम्।", "audioFile": "PB_hear2read_000105.mp3", "sections": []}, {"id": "B_000106", "originalText": "किं तत्? मन्त्रेषु ऋग्वेदाद्याख्येषु कर्माणि अग्निहोत्रादीनि मन्त्रैरेव प्रकाशितानि कवयः मेधाविनो वसिष्ठादयः यानि अपश्यन् दृष्टवन्तः।", "audioFile": "PB_hear2read_000106.mp3", "sections": []}, {"id": "B_000107", "originalText": "यत्तदेतत्सत्यमेकान्तपुरुषार्थसाधनत्वात्, तानि च वेदविहितानि ऋषिदृष्टानि कर्माणि त्रेतायां त्रयीसंयोगलक्षणायां हौत्राध्वर्यवौद्गात्रप्रकारायामधिकरणभूतायां बहुधा बहुप्रकारं सन्ततानि सम्प्रवृत्तानि कर्मिभिः क्रियमाणानि त्रेतायां वा युगे प्रायशः प्रवृत्तानि, अतो यूयं तानि आचरथ निर्वर्तयत नियतं नित्यं सत्यकामा यथाभूतकर्मफलकामाः सन्तः।", "audioFile": "PB_hear2read_000107.mp3", "sections": []}, {"id": "B_000108", "originalText": "एषः वः युष्माकं पन्थाः मार्गः सुकृतस्य स्वयं निर्वर्तितस्य कर्मणः लोके फलनिमित्तं लोक्यते दृश्यते भुज्यत इति कर्मफलं लोक उच्यते।", "audioFile": "PB_hear2read_000108.mp3", "sections": []}, {"id": "B_000109", "originalText": "तदर्थं तत्प्राप्तये एष मार्ग इत्यर्थः। यान्येतान्यग्निहोत्रादीनि त्रय्यां विहितानि कर्माणि, तान्येष पन्था अवश्यफलप्राप्तिसाधनमित्यर्थः॥", "audioFile": "PB_hear2read_000109.mp3", "sections": []}, {"id": "B_000110", "originalText": "यदा लेलायते ह्यर्चिः समिद्धे हव्यवाहने। तदाज्यभागावन्तरेणाहुतीः प्रतिपादयेत्॥ २॥", "audioFile": "PB_hear2read_000110.mp3", "sections": []}, {"id": "B_000111", "originalText": "तत्राग्निहोत्रमेव तावत्प्रथमं प्रदर्शनार्थमुच्यते, सर्वकर्मणां प्राथम्यात्।", "audioFile": "PB_hear2read_000111.mp3", "sections": []}, {"id": "B_000112", "originalText": "तत्कथम्? यदैव इन्धनैरभ्याहितैः सम्यगिद्धे समिद्धे दीप्ते हव्यवाहने लेलायते चलति अर्चिः, तदा तस्मिन्काले लेलायमाने चलत्यर्चिषि आज्यभागौ आज्यभागयोः अन्तरेण मध्ये आवापस्थाने आहुतीः प्रतिपादयेत् प्रक्षिपेत् देवतामुद्दिश्य।", "audioFile": "PB_hear2read_000112.mp3", "sections": []}, {"id": "B_000113", "originalText": "अनेकाहःप्रयोगापेक्षया आहुतीरिति बहुवचनम्।", "audioFile": "PB_hear2read_000113.mp3", "sections": []}, {"id": "B_000114", "originalText": "एष सम्यगाहुतिप्रक्षेपादिलक्षणः कर्ममार्गो लोकप्राप्तये पन्थाः। तस्य च सम्यक्करणं दुष्करम्, विपत्तयस्त्वनेका भवन्ति॥", "audioFile": "PB_hear2read_000114.mp3", "sections": []}, {"id": "B_000115", "originalText": "यस्याग्निहोत्रमदर्शमपौर्णमासमचातुर्मास्यमनाग्रयणमतिथिवर्जितं च। अहुतमवैश्वदेवमविधिना हुतमासप्तमांस्तस्य लोकान्हिनस्ति॥ ३॥", "audioFile": "PB_hear2read_000115.mp3", "sections": []}, {"id": "B_000116", "originalText": "कथम्? यस्य अग्निहोत्रिणः अग्निहोत्रम् अदर्शं दर्शाख्येन कर्मणा वर्जितम्।", "audioFile": "PB_hear2read_000116.mp3", "sections": []}, {"id": "B_000117", "originalText": "अग्निहोत्रिभिरवश्यकर्तव्यत्वाद्दर्शस्य।", "audioFile": "PB_hear2read_000117.mp3", "sections": []}, {"id": "B_000118", "originalText": "अग्निहोत्रिसम्बन्ध्यग्निहोत्रविशेषणमिव भवति।", "audioFile": "PB_hear2read_000118.mp3", "sections": []}, {"id": "B_000119", "originalText": "तदक्रियमाणमित्येतत्।", "audioFile": "PB_hear2read_000119.mp3", "sections": []}, {"id": "B_000120", "originalText": "तथा अपौर्णमासम् इत्यादिष्वप्यग्निहोत्रविशेषणत्वं द्रष्टव्यम्।", "audioFile": "PB_hear2read_000120.mp3", "sections": []}, {"id": "B_000121", "originalText": "अग्निहोत्राङ्गत्वस्याविशिष्टत्वात्।", "audioFile": "PB_hear2read_000121.mp3", "sections": []}, {"id": "B_000122", "originalText": "अपौर्णमासं पौर्णमासकर्मवर्जितम्।", "audioFile": "PB_hear2read_000122.mp3", "sections": []}, {"id": "B_000123", "originalText": "अचातुर्मास्यं चातुर्मास्यकर्मवर्जितम्।", "audioFile": "PB_hear2read_000123.mp3", "sections": []}, {"id": "B_000124", "originalText": "अनाग्रयणम् आग्रयणं शरदादिषु कर्तव्यम्, तच्च न क्रियते यस्य तत्तथा।", "audioFile": "PB_hear2read_000124.mp3", "sections": []}, {"id": "B_000125", "originalText": "अतिथिवर्जितं च अतिथिपूजनं चाहन्यहन्यक्रियमाणं यस्य।", "audioFile": "PB_hear2read_000125.mp3", "sections": []}, {"id": "B_000126", "originalText": "स्वयं सम्यगग्निहोत्रकाले अहुतम्।", "audioFile": "PB_hear2read_000126.mp3", "sections": []}, {"id": "B_000127", "originalText": "अदर्शादिवत् अवैश्वदेवं वैश्वदेवकर्मवर्जितम्।", "audioFile": "PB_hear2read_000127.mp3", "sections": []}, {"id": "B_000128", "originalText": "हूयमानमप्यविधिना हुतम् अयथाहुतमित्येतत्।", "audioFile": "PB_hear2read_000128.mp3", "sections": []}, {"id": "B_000129", "originalText": "एवं दुःसम्पादितमसम्पादितमग्निहोत्राद्युपलक्षितं कर्म किं करोतीत्युच्यते— आसप्तमान् सप्तमसहितान् तस्य कर्तुर्लोकान् हिनस्ति हिनस्तीव आयासमात्रफलत्वात्।", "audioFile": "PB_hear2read_000129.mp3", "sections": []}, {"id": "B_000130", "originalText": "सम्यक् क्रियमाणेषु हि कर्मसु कर्मपरिणामानुरूप्येण भूरादयः सत्यान्ताः सप्त लोकाः फलं प्राप्तव्यम्।", "audioFile": "PB_hear2read_000130.mp3", "sections": []}, {"id": "B_000131", "originalText": "ते लोकाः एवंभूतेनाग्निहोत्रादिकर्मणा त्वप्राप्यत्वाद्धिंस्यन्त इव, आयासमात्रं त्वव्यभिचारीत्यतो हिनस्तीत्युच्यते।", "audioFile": "PB_hear2read_000131.mp3", "sections": []}, {"id": "B_000132", "originalText": "पिण्डदानाद्यनुग्रहेण वा सम्बध्यमानाः पितृपितामहप्रपितामहाः पुत्रपौत्रप्रपौत्राः स्वात्मोपकाराः सप्त लोका उक्तप्रकारेणाग्निहोत्रादिना न भवन्तीति हिंस्यन्त इत्युच्यते॥", "audioFile": "PB_hear2read_000132.mp3", "sections": []}, {"id": "B_000133", "originalText": "काली कराली च मनोजवा च सुलोहिता या च सुधूम्रवर्णा। स्फुलिङ्गिनी विश्वरुची च देवी लेलायमाना इति सप्त जिह्वाः॥ ४॥", "audioFile": "PB_hear2read_000133.mp3", "sections": []}, {"id": "B_000134", "originalText": "काली कराली च मनोजवा च सुलोहिता या च सुधूम्रवर्णा।", "audioFile": "PB_hear2read_000134.mp3", "sections": []}, {"id": "B_000135", "originalText": "स्फुलिङ्गिनी विश्वरुची च देवी लेलायमाना दहनस्य जिह्वाः। काल्याद्या विश्वरुच्यन्ता लेलायमानाः अग्नेर्हविराहुतिग्रसनार्था एताः किल सप्त जिह्वाः॥", "audioFile": "PB_hear2read_000135.mp3", "sections": []}, {"id": "B_000136", "originalText": "एतेषु यश्चरते भ्राजमानेषु यथाकालं चाहुतयो ह्याददायन्। तं नयन्त्येताः सूर्यस्य रश्मयो यत्र देवानां पतिरेकोऽधिवासः॥ ५॥", "audioFile": "PB_hear2read_000136.mp3", "sections": []}, {"id": "B_000137", "originalText": "एतेषु अग्निजिह्वाभेदेषु यः अग्निहोत्री चरते कर्माचरत्यग्निहोत्रादिकं भ्राजमानेषु दीप्यमानेषु।", "audioFile": "PB_hear2read_000137.mp3", "sections": []}, {"id": "B_000138", "originalText": "यथाकालं च यस्य कर्मणो यः कालस्तं कालमनतिक्रम्य यथाकालं यजमानम् आददायन् आददाना आहुतयः तं नयन्ति प्रापयन्ति।", "audioFile": "PB_hear2read_000138.mp3", "sections": []}, {"id": "B_000139", "originalText": "एताः आहुतयो या इमा अनेन निर्वर्तिताः सूर्यस्य रश्मयः भूत्वा, रश्मिद्वारैरित्यर्थः। यत्र यस्मिन्स्वर्गे देवानां पतिः इन्द्रः एकः सर्वानुपरि अधि वसतीति अधिवासः॥", "audioFile": "PB_hear2read_000139.mp3", "sections": []}, {"id": "B_000140", "originalText": "एह्येहीति तमाहुतयः सुवर्चसः सूर्यस्य रश्मिभिर्यजमानं वहन्ति। प्रियां वाचमभिवदन्त्योऽर्चयन्त्य एष वः पुण्यः सुकृतो ब्रह्मलोकः॥ ६॥", "audioFile": "PB_hear2read_000140.mp3", "sections": []}, {"id": "B_000141", "originalText": "कथं सूर्यस्य रश्मिभिर्यजमानं वहन्तीत्युच्यते— एहि एहि इति आह्वयन्त्यः तं यजमानम् आहुतयः सुवर्चसः दीप्तिमत्यः, किञ्च, प्रियाम् इष्टां वाचं स्तुत्यादिलक्षणाम् अभिवदन्त्यः उच्चारयन्त्यः अर्चयन्त्यः पूजयन्त्यश्च एषः वः युष्माकं पुण्यः सुकृतः ब्रह्मलोकः फलरूपः, इत्थं प्रियां वाचम् अभिवदन्त्यो वहन्तीत्यर्थः।", "audioFile": "PB_hear2read_000141.mp3", "sections": []}, {"id": "B_000142", "originalText": "ब्रह्मलोकः स्वर्गः प्रकरणात्॥", "audioFile": "PB_hear2read_000142.mp3", "sections": []}, {"id": "B_000143", "originalText": "प्लवा ह्येते अदृढा यज्ञरूपा अष्टादशोक्तमवरं येषु कर्म। एतच्छ्रेयो येऽभिनन्दन्ति मूढा जरामृत्युं ते पुनरेवापि यन्ति॥ ७॥", "audioFile": "PB_hear2read_000143.mp3", "sections": []}, {"id": "B_000144", "originalText": "एतच्च ज्ञानरहितं कर्मैतावत्फलमविद्याकामकर्मकार्यम् अतोऽसारं दुःखमूलमिति निन्द्यते— प्लवाः विनाशिन इत्यर्थः।", "audioFile": "PB_hear2read_000144.mp3", "sections": []}, {"id": "B_000145", "originalText": "हि यस्मात् एते अदृढाः अस्थिराः यज्ञरूपाः यज्ञस्य रूपाणि यज्ञरूपाः यज्ञनिर्वर्तकाः अष्टादश अष्टादशसङ्ख्याकाः षोडशर्त्विजः पत्नी यजमानश्चेत्यष्टादश।", "audioFile": "PB_hear2read_000145.mp3", "sections": []}, {"id": "B_000146", "originalText": "एतदाश्रयं कर्म उक्तं कथितं शास्त्रेण येषु अष्टादशसु अवरं केवलं ज्ञानवर्जितं कर्म।", "audioFile": "PB_hear2read_000146.mp3", "sections": []}, {"id": "B_000147", "originalText": "अतस्तेषामवरकर्माश्रयाणामष्टादशानामदृढतया प्लवत्वात्प्लवते सह फलेन तत्साध्यं कर्म, कुण्डविनाशादिव क्षीरदध्यादीनां तत्स्थानां नाशः, यत एवम् एतत् कर्म श्रेयः श्रेयःसाधनमिति ये अभिनन्दन्ति अभिहृष्यन्ति अविवेकिनः मूढाः, अतः ते जरां च मृत्युं च जरामृत्युं कञ्चित्कालं स्वर्गे स्थित्वा पुनरेव अपि यन्ति भूयोऽपि गच्छन्ति॥", "audioFile": "PB_hear2read_000147.mp3", "sections": []}, {"id": "B_000148", "originalText": "अविद्यायामन्तरे वर्तमानाः स्वयं धीराः पण्डितंमन्यमानाः। जङ्घन्यमानाः परियन्ति मूढा अन्धेनैव नीयमाना यथान्धाः॥ ८॥", "audioFile": "PB_hear2read_000148.mp3", "sections": []}, {"id": "B_000149", "originalText": "किञ्च, अविद्यायाम् अन्तरे मध्ये वर्तमानाः अविवेकप्रायाः स्वयं वयमेव धीराः धीमन्तः पण्डिता विदितवेदितव्याश्चेति मन्यमाना आत्मानं सम्भावयन्तः, ते च जङ्घन्यमानाः जरारोगाद्यनेकानर्थव्रातैर्हन्यमाना भृशं पीड्यमानाः परियन्ति विभ्रमन्ति मूढाः।", "audioFile": "PB_hear2read_000149.mp3", "sections": []}, {"id": "B_000150", "originalText": "दर्शनवर्जितत्वात् अन्धेनैव अचक्षुष्केणैव नीयमानाः प्रदर्श्यमानमार्गाः, यथा लोके अन्धाः चक्षूरहिता गर्तकण्टकादौ पतन्ति, तद्वत्॥", "audioFile": "PB_hear2read_000150.mp3", "sections": []}, {"id": "B_000151", "originalText": "अविद्यायां बहुधा वर्तमाना वयं कृतार्था इत्यभिमन्यन्ति बालाः। यत्कर्मिणो न प्रवेदयन्ति रागात्तेनातुराः क्षीणलोकाश्च्यवन्ते॥ ९॥", "audioFile": "PB_hear2read_000151.mp3", "sections": []}, {"id": "B_000152", "originalText": "किञ्च, अविद्यायां बहुधा बहुप्रकारं वर्तमानाः वयमेव कृतार्थाः कृतप्रयोजनाः इति एवम् अभिमन्यन्ति अभिमन्यन्ते अभिमानं कुर्वन्ति बालाः अज्ञानिनः।", "audioFile": "PB_hear2read_000152.mp3", "sections": []}, {"id": "B_000153", "originalText": "यत् यस्मादेवं कर्मिणः न प्रवेदयन्ति तत्त्वं न जानन्ति रागात् कर्मफलरागाभिभवनिमित्तम्, तेन कारणेन आतुराः दुःखार्ताः सन्तः क्षीणलोकाः क्षीणकर्मफलाः स्वर्गलोकात् च्यवन्ते॥", "audioFile": "PB_hear2read_000153.mp3", "sections": []}, {"id": "B_000154", "originalText": "इष्टापूर्तं मन्यमाना वरिष्ठं नान्यच्छ्रेयो वेदयन्ते प्रमूढाः। नाकस्य पृष्ठे ते सुकृतेऽनुभूत्वेमं लोकं हीनतरं वा विशन्ति॥ १०॥", "audioFile": "PB_hear2read_000154.mp3", "sections": []}, {"id": "B_000155", "originalText": "इष्टापूर्तम् इष्टं यागादि श्रौतं कर्म पूर्तं स्मार्तं वापीकूपतडागादिकर्म मन्यमानाः एतदेवातिशयेन पुरुषार्थसाधनं वरिष्ठं प्रधानमिति चिन्तयन्तः, अन्यत् आत्मज्ञानाख्यं श्रेयःसाधनं न वेदयन्ते न जानन्ति प्रमूढाः पुत्रपशुबान्धवादिषु प्रमत्ततया मूढाः, ते च नाकस्य स्वर्गस्य पृष्ठे उपरिस्थाने सुकृते भोगायतने अनुभूत्वा अनुभूय कर्मफलं पुनः इमं लोकं मानुषम् अस्मात् हीनतरं वा तिर्यङ्नरकादिलक्षणं यथाकर्मशेषं विशन्ति॥", "audioFile": "PB_hear2read_000155.mp3", "sections": []}, {"id": "B_000156", "originalText": "तपःश्रद्धे ये ह्युपवसन्त्यरण्ये शान्ता विद्वांसो भैक्षचर्यां चरन्तः। सूर्यद्वारेण ते विरजाः प्रयान्ति यत्रामृतः स पुरुषो ह्यव्ययात्मा॥ ११॥", "audioFile": "PB_hear2read_000156.mp3", "sections": []}, {"id": "B_000157", "originalText": "ये पुनस्तद्विपरीतज्ञानयुक्ता वानप्रस्थाः संन्यासिनश्च, तपःश्रद्धे हि तपः स्वाश्रमविहितं कर्म, श्रद्धा हिरण्यगर्भादिविषया विद्या, ते तपःश्रद्धे उपवसन्ति सेवंतेऽरण्ये वर्तमानाः सन्तः।", "audioFile": "PB_hear2read_000157.mp3", "sections": []}, {"id": "B_000158", "originalText": "शान्ताः उपरतकरणग्रामाः।", "audioFile": "PB_hear2read_000158.mp3", "sections": []}, {"id": "B_000159", "originalText": "विद्वांसः गृहस्थाश्च ज्ञानप्रधाना इत्यर्थः।", "audioFile": "PB_hear2read_000159.mp3", "sections": []}, {"id": "B_000160", "originalText": "भैक्षचर्यां चरन्तः परिग्रहाभावादुपवसन्त्यरण्ये इति सम्बन्धः।", "audioFile": "PB_hear2read_000160.mp3", "sections": []}, {"id": "B_000161", "originalText": "सूर्यद्वारेण सूर्योपलक्षितेनोत्तरेण पथा ते विरजाः विरजसः, क्षीणपुण्यपापकर्माणः सन्त इत्यर्थः।", "audioFile": "PB_hear2read_000161.mp3", "sections": []}, {"id": "B_000162", "originalText": "प्रयान्ति प्रकर्षेण यान्ति यत्र यस्मिन्सत्यलोकादौ अमृतः स पुरुषः प्रथमजो हिरण्यगर्भः हि अव्ययात्मा अव्ययस्वभावो यावत्संसारस्थायी।", "audioFile": "PB_hear2read_000162.mp3", "sections": []}, {"id": "B_000163", "originalText": "एतदन्तास्तु संसारगतयोऽपरविद्यागम्याः।", "audioFile": "PB_hear2read_000163.mp3", "sections": []}, {"id": "B_000164", "originalText": "नन्वेतं मोक्षमिच्छन्ति केचित्।", "audioFile": "PB_hear2read_000164.mp3", "sections": []}, {"id": "B_000165", "originalText": "न, ‘इहैव सर्वे प्रविलीयन्ति कामाः’ (मु.३.२.२) ‘ते सर्वगं सर्वतः प्राप्य धीरा युक्तात्मानः सर्वमेवाविशन्ति’ (मु.३.२.५) इत्यादिश्रुतिभ्यः, अप्रकरणाच्च।", "audioFile": "PB_hear2read_000165.mp3", "sections": []}, {"id": "B_000166", "originalText": "अपरविद्याप्रकरणे हि प्रवृत्ते न ह्यकस्मान्मोक्षप्रसङ्गोऽस्ति।", "audioFile": "PB_hear2read_000166.mp3", "sections": []}, {"id": "B_000167", "originalText": "विरजस्त्वं त्वापेक्षिकम्।", "audioFile": "PB_hear2read_000167.mp3", "sections": []}, {"id": "B_000168", "originalText": "समस्तमपरविद्याकार्यं साध्यसाधनलक्षणं क्रियाकारकफलभेदभिन्नं द्वैतम् एतावदेव यद्धिरण्यगर्भप्राप्त्यवसानम्।", "audioFile": "PB_hear2read_000168.mp3", "sections": []}, {"id": "B_000169", "originalText": "तथा च मनुनोक्तं स्थावराद्यां संसारगतिमनुक्रामता— ‘ब्रह्मा विश्वसृजो धर्मो महानव्यक्तमेव च। उत्तमां सात्त्विकीमेतां गतिमाहुर्मनीषिणः’ (मनु.१२.५०) इति॥", "audioFile": "PB_hear2read_000169.mp3", "sections": []}, {"id": "B_000170", "originalText": "परीक्ष्य लोकान्कर्मचितान्ब्राह्मणो निर्वेदमायान्नास्त्यकृतः कृतेन। तद्विज्ञानार्थं स गुरुमेवाभिगच्छेत्समित्पाणिः श्रोत्रियं ब्रह्मनिष्ठम्॥ १२॥", "audioFile": "PB_hear2read_000170.mp3", "sections": []}, {"id": "B_000171", "originalText": "अथेदानीमस्मात्साध्यसाधनरूपात्सर्वस्मात्संसाराद्विरक्तस्य परस्यां विद्यायामधिकारप्रदर्शनार्थमिदमुच्यते— परीक्ष्य यदेतदृग्वेदाद्यपरविद्याविषयं स्वाभाविकाविद्याकामकर्मदोषवत्पुरुषानुष्ठेयमविद्यादिदोषवन्तमेव पुरुषं प्रति विहितत्वात्तदनुष्ठानकार्यभूताश्च लोका ये दक्षिणोत्तरमार्गलक्षणाः फलभूताः, ये च विहिताकरणप्रतिषेधातिक्रमदोषसाध्या नरकतिर्यक्प्रेतलक्षणाः, तानेतान्परीक्ष्य प्रत्यक्षानुमानोपमानागमैः सर्वतो याथात्म्येनावधार्य लोकान् संसारगतिभूतान—व्यक्तादिस्थावरान्तान्व्याकृताव्याकृतलक्षणान्बीजाङ्कुरवदित—रेतरोत्पत्तिनिमित्ताननेकानर्थशतसहस्रसङ्कुलान्कदलीगर्भवद—सारान्मायामरीच्युदकगन्धर्वनगराकारस्वप्नजलबुद्बुदफेनस—मान्प्रतिक्षणप्रध्वंसान्पृष्ठतः कृत्वा विद्याकामदोषप्रवर्तितकर्मचितान्धर्माधर्मनिर्वर्तितानित्येतत्।", "audioFile": "PB_hear2read_000171.mp3", "sections": []}, {"id": "B_000172", "originalText": "ब्राह्मणः, ब्राह्मणस्यैव विशेषतोऽधिकारः सर्वत्यागेन ब्रह्मविद्यायामिति ब्राह्मणग्रहणम्।", "audioFile": "PB_hear2read_000172.mp3", "sections": []}, {"id": "B_000173", "originalText": "परीक्ष्य लोकान्किं कुर्यादित्युच्यते— निर्वेदम्, निष्पूर्वो विदिरत्र वैराग्यार्थे, वैराग्यम् आयात् कुर्यादित्येतत्।", "audioFile": "PB_hear2read_000173.mp3", "sections": []}, {"id": "B_000174", "originalText": "स वैराग्यप्रकारः प्रदर्श्यते— इह संसारे नास्ति कश्चिदपि अकृतः पदार्थः।", "audioFile": "PB_hear2read_000174.mp3", "sections": []}, {"id": "B_000175", "originalText": "सर्व एव हि लोकाः कर्मचिताः कर्मकृतत्वाच्चानित्याः।", "audioFile": "PB_hear2read_000175.mp3", "sections": []}, {"id": "B_000176", "originalText": "न नित्यं किञ्चिदस्तीत्यभिप्रायः।", "audioFile": "PB_hear2read_000176.mp3", "sections": []}, {"id": "B_000177", "originalText": "सर्वं तु कर्मानित्यस्यैव साधनम्।", "audioFile": "PB_hear2read_000177.mp3", "sections": []}, {"id": "B_000178", "originalText": "यस्माच्चतुर्विधमेव हि सर्वं कर्म कार्यम्— उत्पाद्यमाप्यं विकार्यं संस्कार्यं वा।", "audioFile": "PB_hear2read_000178.mp3", "sections": []}, {"id": "B_000179", "originalText": "नातः परं कर्मणो विषयोऽस्ति।", "audioFile": "PB_hear2read_000179.mp3", "sections": []}, {"id": "B_000180", "originalText": "अहं च नित्येनामृतेनाभयेन कूटस्थेनाचलेन ध्रुवेणार्थेनार्थी, न तद्विपरीतेन।", "audioFile": "PB_hear2read_000180.mp3", "sections": []}, {"id": "B_000181", "originalText": "अतः किं कृतेन कर्मणा आयासबहुलेनानर्थसाधनेन इत्येवं निर्विण्णोऽभयं शिवमकृतं नित्यं पदं यत्, तद्विज्ञानार्थं विशेषेणाधिगमार्थं स निर्विण्णो ब्राह्मणः गुरुमेव आचार्यं शमदमादिसम्पन्नम् अभिगच्छेत्।", "audioFile": "PB_hear2read_000181.mp3", "sections": []}, {"id": "B_000182", "originalText": "शास्त्रज्ञोऽपि स्वातन्त्र्येण ब्रह्मज्ञानान्वेषणं न कुर्यादित्येतद्गुरुमेवेत्यवधारणफलम्।", "audioFile": "PB_hear2read_000182.mp3", "sections": []}, {"id": "B_000183", "originalText": "समित्पाणिः समिद्भारगृहीतहस्तः श्रोत्रियम् अध्ययनश्रुतार्थसम्पन्नं ब्रह्मनिष्ठं हित्वा सर्वकर्माणि केवलेऽद्वये ब्रह्मणि निष्ठा यस्य सोऽयं ब्रह्मनिष्ठः, जपनिष्ठस्तपोनिष्ठ इति यद्वत्।", "audioFile": "PB_hear2read_000183.mp3", "sections": []}, {"id": "B_000184", "originalText": "न हि कर्मिणो ब्रह्मनिष्ठता सम्भवति, कर्मात्मज्ञानयोर्विरोधात्। स तं गुरुं विधिवदुपसन्नः प्रसाद्य पृच्छेदक्षरं पुरुषं सत्यम्॥", "audioFile": "PB_hear2read_000184.mp3", "sections": []}, {"id": "B_000185", "originalText": "तस्मै स विद्वानुपसन्नाय सम्यक्प्रशान्तचित्ताय शमान्विताय। येनाक्षरं पुरुषं वेद सत्यं प्रोवाच तां तत्त्वतो ब्रह्मविद्याम्॥ १३॥", "audioFile": "PB_hear2read_000185.mp3", "sections": []}, {"id": "B_000186", "originalText": "तस्मै सः विद्वान् गुरुर्ब्रह्मवित्, उपसन्नाय उपगताय।", "audioFile": "PB_hear2read_000186.mp3", "sections": []}, {"id": "B_000187", "originalText": "सम्यक् यथाशास्त्रमित्येतत्।", "audioFile": "PB_hear2read_000187.mp3", "sections": []}, {"id": "B_000188", "originalText": "प्रशान्तचित्ताय उपरतदर्पादिदोषाय।", "audioFile": "PB_hear2read_000188.mp3", "sections": []}, {"id": "B_000189", "originalText": "शमान्विताय बाह्येन्द्रियोपरमेण च युक्ताय, सर्वतो विरक्तायेत्येतत्।", "audioFile": "PB_hear2read_000189.mp3", "sections": []}, {"id": "B_000190", "originalText": "येन विज्ञानेन यया विद्यया च परया अक्षरम् अद्रेश्यादिविशेषणं तदेवाक्षरं पुरुषशब्दवाच्यं पूर्णत्वात्पुरि शयनाच्च, सत्यं तदेव परमार्थस्वाभाव्यादव्ययम्, अक्षरं चाक्षरणादक्षतत्वादक्षयत्वाच्च, वेद विजानाति तां ब्रह्मविद्यां तत्त्वतः यथावत् प्रोवाच प्रब्रूयादित्यर्थः।", "audioFile": "PB_hear2read_000190.mp3", "sections": []}, {"id": "B_000191", "originalText": "आचार्यस्याप्ययमेव नियमो यन्न्यायप्राप्तसच्छिष्यनिस्तारणमविद्यामहोदधेः॥", "audioFile": "PB_hear2read_000191.mp3", "sections": []}, {"id": "B_000192", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ मुण्डकोपनिषद्भाष्ये प्रथमं मुण्डकं समाप्तम्॥", "audioFile": "PB_hear2read_000192.mp3", "sections": []}, {"id": "B_000193", "originalText": "द्वितीयं मुण्डकम्\nप्रथमः खण्डः\nअपरविद्यायाः सर्वं कार्यमुक्तम्।", "audioFile": "PB_hear2read_000193.mp3", "sections": ["द्वितीयं मुण्डकम्", "प्रथमः खण्डः"]}, {"id": "B_000194", "originalText": "स च संसारो यत्सारो यस्मान्मूलादक्षरात्सम्भवति यस्मिंश्च प्रलीयते, तदक्षरं पुरुषाख्यं सत्यम्।", "audioFile": "PB_hear2read_000194.mp3", "sections": []}, {"id": "B_000195", "originalText": "यस्मिन्विज्ञाते सर्वमिदं विज्ञातं भवति, तत्परस्या ब्रह्मविद्याया विषयः।", "audioFile": "PB_hear2read_000195.mp3", "sections": []}, {"id": "B_000196", "originalText": "स वक्तव्य इत्युत्तरो ग्रन्थ आरभ्यते—\nतदेतत्सत्यं यथा सुदीप्तात्पावकाद्विस्फुलिङ्गाः सहस्रशः प्रभवन्ते सरूपाः। तथाक्षराद्विविधाः सोम्य भावाः प्रजायन्ते तत्र चैवापियन्ति॥ १॥", "audioFile": "PB_hear2read_000196.mp3", "sections": []}, {"id": "B_000197", "originalText": "यदपरविद्याविषयं कर्मफललक्षणम्, सत्यं तदापेक्षिकम्।", "audioFile": "PB_hear2read_000197.mp3", "sections": []}, {"id": "B_000198", "originalText": "इदं तु परविद्याविषयम्, परमार्थसल्लक्षणत्वात्।", "audioFile": "PB_hear2read_000198.mp3", "sections": []}, {"id": "B_000199", "originalText": "तदेतत् सत्यं यथाभूतं विद्याविषयम्, अविद्याविषयत्वाच्च अनृतमितरत्।", "audioFile": "PB_hear2read_000199.mp3", "sections": []}, {"id": "B_000200", "originalText": "अत्यन्तपरोक्षत्वात्कथं नाम प्रत्यक्षवत्सत्यमक्षरं प्रतिपद्येरन्निति दृष्टान्तमाह— यथा सुदीप्तात् सुष्ठु दीप्तादिद्धात् पावकात् अग्नेः विस्फुलिङ्गाः अग्न्यवयवाः सहस्रशः अनेकशः प्रभवन्ते निर्गच्छन्ति सरूपाः अग्निसलक्षणा एव, तथा उक्तलक्षणात् अक्षरात् विविधाः नानादेहोपाधिभेदमनुविधीयमानत्वाद्विविधाः हे सोम्य, भावाः जीवाः आकाशादिवद्घटादिपरिच्छिन्नाः सुषिरभेदा घटाद्युपाधिप्रभेदमनु भवन्ति, एवं नानानामरूपकृतदेहोपाधिप्रभवमनु प्रजायन्ते, तत्र चैव तस्मिन्नेव चाक्षरे अपियन्ति देहोपाधिविलयमनु विलीयन्ते घटादिविलयमन्विव सुषिरभेदाः।", "audioFile": "PB_hear2read_000200.mp3", "sections": []}, {"id": "B_000201", "originalText": "यथाऽऽकाशस्य सुषिरभेदोत्पत्तिप्रलयनिमित्तत्वं घटाद्युपाधिकृतमेव, तद्वदक्षरस्यापि नामरूपकृतदेहोपाधिनिमित्तमेव जीवोत्पत्तिप्रलयनिमित्तत्वम्॥", "audioFile": "PB_hear2read_000201.mp3", "sections": []}, {"id": "B_000202", "originalText": "दिव्यो ह्यमूर्तः पुरुषः सबाह्याभ्यन्तरो ह्यजः। अप्राणो ह्यमनाः शुभ्रो ह्यक्षरात्परतः परः॥ २॥", "audioFile": "PB_hear2read_000202.mp3", "sections": []}, {"id": "B_000203", "originalText": "नामरूपबीजभूतादव्याकृताख्यात्स्वविकारापेक्षया परादक्षरात्परं यत्सर्वोपाधिभेदवर्जितमक्षरस्यैव स्वरूपमाकाशस्येव सर्वमूर्तिवर्जितं नेति नेतीत्यादिविशेषणं विवक्षन्नाह— दिव्यः द्योतनवान्, स्वयञ्ज्योतिष्ट्वात्।", "audioFile": "PB_hear2read_000203.mp3", "sections": []}, {"id": "B_000204", "originalText": "दिवि वा स्वात्मनि भवः अलौकिको वा।", "audioFile": "PB_hear2read_000204.mp3", "sections": []}, {"id": "B_000205", "originalText": "हि यस्मात् अमूर्तः सर्वमूर्तिवर्जितः, पुरुषः पूर्णः पुरिशयो वा, सबाह्याभ्यन्तरः सह बाह्याभ्यन्तरेण वर्तत इति।", "audioFile": "PB_hear2read_000205.mp3", "sections": []}, {"id": "B_000206", "originalText": "अजः न जायते कुतश्चित्, स्वतोऽजस्य जन्मनिमित्तस्य चाभावात्, यथा जलबुद्बुदादेर्वाय्वादिः, यथा नभःसुषिरभेदानां घटादिः।", "audioFile": "PB_hear2read_000206.mp3", "sections": []}, {"id": "B_000207", "originalText": "सर्वभावविकाराणां जनिमूलत्वात् तत्प्रतिषेधेन सर्वे प्रतिषिद्धा भवन्ति।", "audioFile": "PB_hear2read_000207.mp3", "sections": []}, {"id": "B_000208", "originalText": "सबाह्याभ्यन्तरो ह्यजः अतोऽजरोऽमृतोऽक्षरो ध्रुवोऽभय इत्यर्थः।", "audioFile": "PB_hear2read_000208.mp3", "sections": []}, {"id": "B_000209", "originalText": "यद्यपि देहाद्युपाधिभेददृष्टिभेदेषु सप्राणः समनाः सेन्द्रियः सविषय इव प्रत्यवभासते तलमलादिमदिवाकाशम्, तथापि तु स्वतः परमार्थस्वरूपदृष्टीनाम् अप्राणः अविद्यमानः क्रियाशक्तिभेदवान् चलनात्मको वायुर्यस्मिन्नसौ अप्राणः।", "audioFile": "PB_hear2read_000209.mp3", "sections": []}, {"id": "B_000210", "originalText": "तथा अमनाः अनेकज्ञानशक्तिभेदवत्सङ्कल्पाद्यात्मकं मनोऽप्यविद्यमानं यस्मिन्सोऽयममनाः।", "audioFile": "PB_hear2read_000210.mp3", "sections": []}, {"id": "B_000211", "originalText": "अप्राणो ह्यमनाश्चेति प्राणादिवायुभेदाः कर्मेन्द्रियाणि तद्विषयाश्च तथा बुद्धिमनसी बुद्धीन्द्रियाणि तद्विषयाश्च प्रतिषिद्धा वेदितव्याः, यथा श्रुत्यन्तरे— ध्यायतीव लेलायतीवेति।", "audioFile": "PB_hear2read_000211.mp3", "sections": []}, {"id": "B_000212", "originalText": "यस्माच्चैवं प्रतिषिद्धोपाधिद्वयस्तस्मात् शुभ्रः शुद्धः।", "audioFile": "PB_hear2read_000212.mp3", "sections": []}, {"id": "B_000213", "originalText": "अतोऽक्षरान्नामरूपबीजोपाधिलक्षितस्वरूपात्, सर्वकार्यकरणबीजत्वेनोपलक्ष्यमाणत्वात्परं तत्त्वं तदुपाधिलक्षणमव्याकृताख्यमक्षरं सर्वविकारेभ्यतस्मात्परतोऽक्षरात्परः निरुपाधिकः पुरुष इत्यर्थः।", "audioFile": "PB_hear2read_000213.mp3", "sections": []}, {"id": "B_000214", "originalText": "यस्मिंस्तदाकाशाख्यमक्षरं संव्यवहारविषयमोतं च प्रोतं च।", "audioFile": "PB_hear2read_000214.mp3", "sections": []}, {"id": "B_000215", "originalText": "कथं पुनरप्राणादिमत्त्वं तस्येत्युच्यते।", "audioFile": "PB_hear2read_000215.mp3", "sections": []}, {"id": "B_000216", "originalText": "यदि हि प्राणादयः प्रागुत्पत्तेः पुरुष इव स्वेनात्मना सन्ति, तदा पुरुषस्य प्राणदिना विद्यमानेन प्राणादिमत्त्वं स्यात्, न तु ते प्राणादयः प्रागुत्पत्तेः सन्ति।", "audioFile": "PB_hear2read_000216.mp3", "sections": []}, {"id": "B_000217", "originalText": "अतः प्राणादिमान्परः पुरुषः, यथाऽनुत्पन्ने पुत्रे अपुत्रो देवदत्तः॥", "audioFile": "PB_hear2read_000217.mp3", "sections": []}, {"id": "B_000218", "originalText": "एतस्माज्जायते प्राणो मनः सर्वेन्द्रियाणि च। खं वायुर्ज्योतिरापः पृथिवी विश्वस्य धारिणी॥ ३॥", "audioFile": "PB_hear2read_000218.mp3", "sections": []}, {"id": "B_000219", "originalText": "कथं ते न सन्ति प्राणादय इति, उच्यते— यस्मात् एतस्मादेव पुरुषान्नामरूपबीजोपाधिलक्षितात् जायते उत्पद्यतेऽविद्याविषयो विकारभूतो नामधेयोऽनृतात्मकः प्राणः, ‘वाचारम्भणं विकारो नामधेयम्’ (छा.६.१.४) ‘अनृतम्’ इति श्रुत्यन्तरात्।", "audioFile": "PB_hear2read_000219.mp3", "sections": []}, {"id": "B_000220", "originalText": "न हि तेनाविद्याविषयेणानृतेन प्राणेन सप्राणत्वं परस्य स्यादपुत्रस्य स्वप्नदृष्टेनेव पुत्रेण सपुत्रत्वम्।", "audioFile": "PB_hear2read_000220.mp3", "sections": []}, {"id": "B_000221", "originalText": "एवं मनः सर्वाणि चेन्द्रियाणि विषयाश्चैतस्मादेव जायन्ते।", "audioFile": "PB_hear2read_000221.mp3", "sections": []}, {"id": "B_000222", "originalText": "तस्मात्सिद्धमस्य निरुपचरितमप्राणादिमत्त्वमित्यर्थः।", "audioFile": "PB_hear2read_000222.mp3", "sections": []}, {"id": "B_000223", "originalText": "यथा च प्रागुत्पत्तेः परमार्थतोऽसन्तस्तथा प्रलीनाश्चेति द्रष्टव्याः।", "audioFile": "PB_hear2read_000223.mp3", "sections": []}, {"id": "B_000224", "originalText": "यथा करणानि मनश्चेन्द्रियाणि च, तथा शरीरविषयकारणानि भूतानि खम् आकाशं, वायुः बाह्य आवहादिभेदः, ज्योतिः अग्निः, आपः उदकं, पृथिवी धरित्री विश्वस्य सर्वस्य धारिणी, एतानि च शब्दस्पर्शरूपरसगन्धोत्तरोत्तरगुणानि पूर्वपूर्वगुणसहितान्येतस्मादेव जायन्ते॥", "audioFile": "PB_hear2read_000224.mp3", "sections": []}, {"id": "B_000225", "originalText": "अग्निर्मूर्धा चक्षुषी चन्द्रसूर्यौ दिशः श्रोत्रे वाग्विवृताश्च वेदाः। वायुः प्राणो हृदयं विश्वमस्य पद्भ्यां पृथिवी ह्येष सर्वभूतान्तरात्मा॥ ४॥", "audioFile": "PB_hear2read_000225.mp3", "sections": []}, {"id": "B_000226", "originalText": "सङ्क्षेपतः परविद्याविषयमक्षरं निर्विशेषं पुरुषं सत्यम् ‘दिव्यो ह्यमूर्तः’ (मु.२.१.२) इत्यादिना मन्त्रेणोक्त्वा, पुनस्तदेव सविशेषं विस्तरेण वक्तव्यमिति प्रववृते, सङ्क्षेपविस्तरोक्तो हि पदार्थः सुखाधिगम्यो भवति सूत्रभाष्योक्तिवदिति।", "audioFile": "PB_hear2read_000226.mp3", "sections": []}, {"id": "B_000227", "originalText": "यो हि प्रथमजात्प्राणाद्धिरण्यगर्भाज्जायतेऽण्डस्यान्तर्विराट्, स तत्त्वान्तरितत्त्वेन लक्ष्यमाणोऽप्येतस्मादेव पुरुषाज्जायत एतन्मयश्चेत्येतदर्थमाह, तं च विशिनष्टि— अग्निः द्युलोकः, ‘असौ वाव लोको गौतमाग्निः’ (छा.५.४.१) इति श्रुतेः।", "audioFile": "PB_hear2read_000227.mp3", "sections": []}, {"id": "B_000228", "originalText": "मूर्धा यस्योत्तमाङ्गं शिरः, चक्षुषी चन्द्रश्च सूर्यश्चेति चन्द्रसूर्यौ, यस्येति सर्वत्रानुषङ्गः कर्तव्यः अस्येत्यस्य पदस्य वक्ष्यमाणस्य यस्येति विपरिणामं कृत्वा।", "audioFile": "PB_hear2read_000228.mp3", "sections": []}, {"id": "B_000229", "originalText": "दिशः श्रोत्रे यस्य।", "audioFile": "PB_hear2read_000229.mp3", "sections": []}, {"id": "B_000230", "originalText": "वाक् विवृताश्च उद्घाटिताः प्रसिद्धा वेदाः यस्य।", "audioFile": "PB_hear2read_000230.mp3", "sections": []}, {"id": "B_000231", "originalText": "वायुः प्राणो यस्य।", "audioFile": "PB_hear2read_000231.mp3", "sections": []}, {"id": "B_000232", "originalText": "हृदयम् अन्तःकरणं विश्वं समस्तं जगत् अस्य यस्येत्येतत्।", "audioFile": "PB_hear2read_000232.mp3", "sections": []}, {"id": "B_000233", "originalText": "सर्वं ह्यन्तःकरणविकारमेव जगत्, मनस्येव सुषुप्ते प्रलयदर्शनात्, जागरितेऽपि तत एवाग्निविस्फुलिङ्गवद्विप्रतिष्ठानात्।", "audioFile": "PB_hear2read_000233.mp3", "sections": []}, {"id": "B_000234", "originalText": "यस्य च पद्भ्यां जाता पृथिवी, एष देवो विष्णुरनन्तः प्रथमशरीरी त्रैलोक्यदेहोपाधिः सर्वेषां भूतानामन्तरात्मा। स हि सर्वभूतेषु द्रष्टा श्रोता मन्ता विज्ञाता सर्वकरणात्मा॥", "audioFile": "PB_hear2read_000234.mp3", "sections": []}, {"id": "B_000235", "originalText": "पञ्चाग्निद्वारेण च याः संसरन्ति प्रजाः, ता अपि तस्मादेव पुरुषात्प्रजायन्त इत्युच्यते—\nतस्मादग्निः समिधो यस्य सूर्यः सोमात्पर्जन्य ओषधयः पृथिव्याम्। पुमान्रेतः सिञ्चति योषितायां बह्वीः प्रजाः पुरुषात्सम्प्रसूताः॥ ५॥", "audioFile": "PB_hear2read_000235.mp3", "sections": []}, {"id": "B_000236", "originalText": "तस्मात् परस्मात्पुरुषात् प्रजावस्थानविशेषरूपः अग्निः।", "audioFile": "PB_hear2read_000236.mp3", "sections": []}, {"id": "B_000237", "originalText": "स विशेष्यते— समिधो यस्य सूर्यः, समिध इव समिधः, सूर्येण हि द्युलोकः समिध्यते।", "audioFile": "PB_hear2read_000237.mp3", "sections": []}, {"id": "B_000238", "originalText": "ततो हि द्युलोकाग्नेर्निष्पन्नात् सोमात् पर्जन्यः द्वितीयोऽग्निः सम्भवति।", "audioFile": "PB_hear2read_000238.mp3", "sections": []}, {"id": "B_000239", "originalText": "तस्माच्च पर्जन्यात् ओषधयः पृथिव्यां सम्भवन्ति।", "audioFile": "PB_hear2read_000239.mp3", "sections": []}, {"id": "B_000240", "originalText": "ओषधिभ्यः पुरुषाग्नौ हुताभ्य उपादानभूताभ्यः पुमानग्निः रेतः सिञ्चति योषितायां योषिति योषाग्नौ स्त्रियामिति। एवं क्रमेण बह्वीः बह्व्यः प्रजाः ब्राह्मणाद्याः पुरुषात् परस्मात् सम्प्रसूताः समुत्पन्नाः॥", "audioFile": "PB_hear2read_000240.mp3", "sections": []}, {"id": "B_000241", "originalText": "तस्मादृचः साम यजूंषि दीक्षा यज्ञाश्च सर्वे क्रतवो दक्षिणाश्च। संवत्सरश्च यजमानश्च लोकाः सोमो यत्र पवते यत्र सूर्यः॥ ६॥", "audioFile": "PB_hear2read_000241.mp3", "sections": []}, {"id": "B_000242", "originalText": "किञ्च, कर्मसाधनानि फलानि च तस्मादेवेत्याह— कथम्? तस्मात् पुरुषात् ऋचः नियताक्षरपादावसानाः गायत्र्यादिच्छन्दोविशिष्टा मन्त्राः, साम पाञ्चभक्तिकं साप्तभक्तिकं च स्तोभादिगीतिविशिष्टम्, यजूंषि अनियताक्षरपादावसानानि वाक्यरूपाणि, एवं त्रिविधा मन्त्राः।", "audioFile": "PB_hear2read_000242.mp3", "sections": []}, {"id": "B_000243", "originalText": "दीक्षाः मौञ्ज्यादिलक्षणाः कर्तृनियमविशेषाः।", "audioFile": "PB_hear2read_000243.mp3", "sections": []}, {"id": "B_000244", "originalText": "यज्ञाश्च सर्वे अग्निहोत्रादयः।", "audioFile": "PB_hear2read_000244.mp3", "sections": []}, {"id": "B_000245", "originalText": "क्रतवः सयूपाः।", "audioFile": "PB_hear2read_000245.mp3", "sections": []}, {"id": "B_000246", "originalText": "दक्षिणाश्च एकगवाद्या अपरिमितसर्वस्वान्ताः।", "audioFile": "PB_hear2read_000246.mp3", "sections": []}, {"id": "B_000247", "originalText": "संवत्सरश्च कालः कर्माङ्गभूतः।", "audioFile": "PB_hear2read_000247.mp3", "sections": []}, {"id": "B_000248", "originalText": "यजमानश्च कर्ता।", "audioFile": "PB_hear2read_000248.mp3", "sections": []}, {"id": "B_000249", "originalText": "लोकाः तस्य कर्मफलभूताः, ते विशेष्यन्ते— सोमः यत्र येषु लोकेषु पवते पुनाति लोकान् यत्र च येषु सूर्यस्तपति। ते च दक्षिणायनोत्तरायणमार्गद्वयगम्या विद्वदविद्वत्कर्तृफलभूताः॥", "audioFile": "PB_hear2read_000249.mp3", "sections": []}, {"id": "B_000250", "originalText": "तस्माच्च देवा बहुधा सम्प्रसूताः साध्या मनुष्याः पशवो वयांसि। प्राणापानौ व्रीहियवौ तपश्च श्रद्धा सत्यं ब्रह्मचर्यं विधिश्च॥ ७॥", "audioFile": "PB_hear2read_000250.mp3", "sections": []}, {"id": "B_000251", "originalText": "तस्माच्च पुरुषात्कर्माङ्गभूता देवाः बहुधा वस्वादिगणभेदेन सम्प्रसूताः सम्यक् प्रसूताः— साध्याः देवविशेषाः, मनुष्याः कर्माधिकृताः, पशवः ग्राम्यारण्याः, वयांसि पक्षिणः, जीवनं च मनुष्यादीनां प्राणापानौ, व्रीहियवौ हविरर्थौ, तपश्च कर्माङ्गं पुरुषसंस्कारलक्षणं स्वतन्त्रं च फलसाधनम्, श्रद्धा यत्पूर्वकः सर्वपुरुषार्थसाधनप्रयोगश्चित्तप्रसाद आस्तिक्यबुद्धिः, तथा सत्यम् अनृतवर्जनं यथाभूतार्थवचनं चापीडाकरम्, ब्रह्मचर्यं मैथुनासमाचारः, विधिश्च इतिकर्तव्यता॥", "audioFile": "PB_hear2read_000251.mp3", "sections": []}, {"id": "B_000252", "originalText": "सप्त प्राणाः प्रभवन्ति तस्मात्सप्तार्चिषः समिधः सप्त होमाः। सप्तेमे लोका येषु चरन्ति प्राणा गुहाशया निहिताः सप्त सप्त॥ ८॥", "audioFile": "PB_hear2read_000252.mp3", "sections": []}, {"id": "B_000253", "originalText": "किञ्च, सप्त शीर्षण्याः प्राणाः तस्मादेव पुरुषात् प्रभवन्ति।", "audioFile": "PB_hear2read_000253.mp3", "sections": []}, {"id": "B_000254", "originalText": "तेषां सप्त अर्चिषः दीप्तयः स्वस्वविषयावद्योतनानि।", "audioFile": "PB_hear2read_000254.mp3", "sections": []}, {"id": "B_000255", "originalText": "तथा सप्त समिधः सप्तविषयाः, विषयैर्हि समिध्यन्ते प्राणाः।", "audioFile": "PB_hear2read_000255.mp3", "sections": []}, {"id": "B_000256", "originalText": "सप्त होमा, तद्विषयविज्ञानानि, ‘यदस्य विज्ञानं तज्जुहोति’ (तै.ना.८०) इति श्रुत्यन्तरात्।", "audioFile": "PB_hear2read_000256.mp3", "sections": []}, {"id": "B_000257", "originalText": "किञ्च, सप्त इमे लोकाः इन्द्रियस्थानानि, येषु चरन्ति सञ्चरन्ति प्राणाः इति विशेषणात्।", "audioFile": "PB_hear2read_000257.mp3", "sections": []}, {"id": "B_000258", "originalText": "प्राणा येषु चरन्तीति प्राणानां विशेषणमिदं प्राणापानादिनिवृत्त्यर्थम्।", "audioFile": "PB_hear2read_000258.mp3", "sections": []}, {"id": "B_000259", "originalText": "गुहायां शरीरे हृदये वा स्वापकाले शेरत इति गुहाशयाः।", "audioFile": "PB_hear2read_000259.mp3", "sections": []}, {"id": "B_000260", "originalText": "निहिताः स्थापिता धात्रा सप्त सप्त प्रतिप्राणिभेदम्।", "audioFile": "PB_hear2read_000260.mp3", "sections": []}, {"id": "B_000261", "originalText": "यानि च आत्मयाजिनां विदुषां कर्माणि कर्मफलानि चाविदुषां च कर्माणि तत्साधनानि कर्मफलानि च सर्वं चैतत्परस्मादेव पुरुषात्सर्वज्ञात्प्रसूतमिति प्रकरणार्थः॥", "audioFile": "PB_hear2read_000261.mp3", "sections": []}, {"id": "B_000262", "originalText": "अतः समुद्रा गिरयश्च सर्वेऽस्मात्स्यन्दन्ते सिन्धवः सर्वरूपाः। अतश्च सर्वा ओषधयो रसश्च येनैष भूतैस्तिष्ठते ह्यन्तरात्मा॥ ९॥", "audioFile": "PB_hear2read_000262.mp3", "sections": []}, {"id": "B_000263", "originalText": "अतः पुरुषात् समुद्राः सर्वे क्षाराद्याः।", "audioFile": "PB_hear2read_000263.mp3", "sections": []}, {"id": "B_000264", "originalText": "गिरयश्च हिमवदादयः अस्मादेव पुरुषात् सर्वे।", "audioFile": "PB_hear2read_000264.mp3", "sections": []}, {"id": "B_000265", "originalText": "स्यन्दन्ते स्रवन्ति गङ्गाद्याः सिन्धवः नद्यः सर्वरूपाः बहुरूपाः।", "audioFile": "PB_hear2read_000265.mp3", "sections": []}, {"id": "B_000266", "originalText": "अस्मादेव पुरुषात् सर्वाः ओषधयः व्रीहियवाद्याः।", "audioFile": "PB_hear2read_000266.mp3", "sections": []}, {"id": "B_000267", "originalText": "रसश्च मधुरादिः षड्विधः, येन रसेन भूतैः पञ्चभिः स्थूलैः परिवेष्टितः तिष्ठते तिष्ठति हि अन्तरात्मा लिङ्गं सूक्ष्मं शरीरम्। तद्ध्यन्तराले शरीरस्यात्मनश्चात्मवद्वर्तत इत्यन्तरात्मा॥", "audioFile": "PB_hear2read_000267.mp3", "sections": []}, {"id": "B_000268", "originalText": "पुरुष एवेदं विश्वं कर्म तपो ब्रह्म परामृतम्। एतद्यो वेद निहितं गुहायां सोऽविद्याग्रन्थिं विकिरतीह सोम्य॥ १०॥", "audioFile": "PB_hear2read_000268.mp3", "sections": []}, {"id": "B_000269", "originalText": "एवं पुरुषात्सर्वमिदं सम्प्रसूतम्।", "audioFile": "PB_hear2read_000269.mp3", "sections": []}, {"id": "B_000270", "originalText": "अतो वाचारम्भणं विकारो नामधेयमनृतं पुरुष इत्येव सत्यम्, अतः पुरुष एव इदं विश्वं सर्वम्।", "audioFile": "PB_hear2read_000270.mp3", "sections": []}, {"id": "B_000271", "originalText": "न विश्वं नाम पुरुषादन्यत्किञ्चिदस्ति।", "audioFile": "PB_hear2read_000271.mp3", "sections": []}, {"id": "B_000272", "originalText": "अतो यदुक्तं तदेवेदमभिहितम् ‘कस्मिन्नु भगवो विज्ञाते सर्वमिदं विज्ञातं भवति’ (मु.१.१.३) इति, एतस्मिन्हि परस्मिन्नात्मनि सर्वकारणे पुरुषे विज्ञाते, पुरुष एवेदं विश्वं नान्यदस्तीति विज्ञातं भवतीति।", "audioFile": "PB_hear2read_000272.mp3", "sections": []}, {"id": "B_000273", "originalText": "किं पुनरिदं विश्वमित्युच्यते— कर्म अग्निहोत्रादिलक्षणम्, तपः ज्ञानं तत्कृतं फलमन्यदेव तावद्धीदं सर्वम्, तच्च एतद्ब्रह्मणः कार्यम्, तस्मात्सर्वं ब्रह्म परामृतं परममृतमहमेवेति यो वेद निहितं स्थितं गुहायां हृदि सर्वप्राणिनाम्, सः एवं विज्ञानात् अविद्याग्रन्थिं ग्रन्थिमिव दृढीभूतामविद्यावासनां विकिरति विक्षिपति विनाशयति इह जीवन्नेव, न मृतः सन् हे सोम्य प्रियदर्शन॥", "audioFile": "PB_hear2read_000273.mp3", "sections": []}, {"id": "B_000274", "originalText": "इति द्वितीयमुण्डके प्रथमखण्डशभाष्यम्॥", "audioFile": "PB_hear2read_000274.mp3", "sections": []}, {"id": "B_000275", "originalText": "द्वितीयः खण्डः\nआविः संनिहितं गुहाचरं नाम महत्पदमत्रैतत्समर्पितम्। एजत्प्राणन्निमिषच्च यदेतज्जानथ सदसद्वरेण्यं परं विज्ञानाद्यद्वरिष्ठं प्रजानाम्॥ १॥", "audioFile": "PB_hear2read_000275.mp3", "sections": ["द्वितीयः खण्डः"]}, {"id": "B_000276", "originalText": "अरूपं सदक्षरं केन प्रकारेण विज्ञेयमित्युच्यते— आविः प्रकाशं, संनिहितम्, वागाद्युपाधिभिः— ज्वलति भ्राजतीति श्रुत्यन्तरात्— शब्दादीनुपलभमानवदवभासते, दर्शनश्रवणमननविज्ञानाद्युपाधिधर्मैराविर्भूतं सल्लक्ष्यते हृदि सर्वप्राणिनाम्।", "audioFile": "PB_hear2read_000276.mp3", "sections": []}, {"id": "B_000277", "originalText": "यदेतदाविर्भूतं ब्रह्म संनिहितं सम्यक् स्थितं हृदि, तत् गुहाचरं नाम गुहायां चरतीति दर्शनश्रवणादिप्रकारैर्गुहाचरमिति प्रख्यातम्।", "audioFile": "PB_hear2read_000277.mp3", "sections": []}, {"id": "B_000278", "originalText": "महत् सर्वमहत्त्वात्, पदं पद्यते सर्वेणेति, सर्वपदार्थास्पदत्वात्।", "audioFile": "PB_hear2read_000278.mp3", "sections": []}, {"id": "B_000279", "originalText": "कथं तन्महत्पदमिति, उच्यते, यतः अत्र अस्मिन्ब्रह्मणि एतत्सर्वं समर्पितं सम्प्रवेशितं रथनाभाविवाराः— एजत् चलत्पक्ष्यादि, प्राणत् प्राणितीति प्राणापानादिमन्मनुष्यपश्वादि, निमिषच्च यन्निमेषादिक्रियावत्, यच्चानिमिषत्, च— शब्दात् समस्तमेतदत्रैव ब्रह्मणि समर्पितम्।", "audioFile": "PB_hear2read_000279.mp3", "sections": []}, {"id": "B_000280", "originalText": "एतत् यदास्पदं सर्वं जानथ हे शिष्याः, अवगच्छत तदात्मभूतं भवताम्, सदसत् सदसत्स्वरूपं सदसतोर्मूर्तामूर्तयोः स्थूलसूक्ष्मयोः, तद्व्यतिरेकेणाभावात्।", "audioFile": "PB_hear2read_000280.mp3", "sections": []}, {"id": "B_000281", "originalText": "वरेण्यं वरणीयम्, तदेव हि सर्वस्य नित्यत्वात्प्रार्थनीयम्, परं व्यतिरिक्तं विज्ञानात्प्रजानामिति व्यवहितेन सम्बन्धः, यल्लौकिकविज्ञानागोचरमित्यर्थः। यत् वरिष्ठं वरतमं सर्वपदार्थेषु वरेषु, तद्ध्येकं ब्रह्म अतिशयेन वरं सर्वदोषरहितत्वात्॥", "audioFile": "PB_hear2read_000281.mp3", "sections": []}, {"id": "B_000282", "originalText": "यदर्चिमद्यदणुभ्योऽणु च यस्मिंल्लोका निहिता लोकिनश्च।", "audioFile": "PB_hear2read_000282.mp3", "sections": []}, {"id": "B_000283", "originalText": "तदेतदक्षरं ब्रह्म स प्राणस्तदु वाङ्मनः। तदेतत्सत्यं तदमृतं तद्वेद्धव्यं सोम्य विद्धि॥ २॥", "audioFile": "PB_hear2read_000283.mp3", "sections": []}, {"id": "B_000284", "originalText": "किञ्च, यत् अर्चिमत् दीप्तिमत्, तद्दीप्त्या ह्यादित्यादि दीप्यत इति दीप्तिमद्ब्रह्म।", "audioFile": "PB_hear2read_000284.mp3", "sections": []}, {"id": "B_000285", "originalText": "किञ्च, यत् अणुभ्यः श्यामाकादिभ्योऽपि अणु च सूक्ष्मम्।", "audioFile": "PB_hear2read_000285.mp3", "sections": []}, {"id": "B_000286", "originalText": "चशब्दात्स्थूलेभ्योऽप्यतिशयेन स्थूलं पृथिव्यादिभ्यः।", "audioFile": "PB_hear2read_000286.mp3", "sections": []}, {"id": "B_000287", "originalText": "यस्मिन् लोकाः भूरादयः निहिताः स्थिताः, ये च लोकिनः लोकनिवासिनः मनुष्यादयः, चैतन्याश्रया हि सर्वे प्रसिद्धाः, तदेतत् सर्वाश्रयं अक्षरम् ब्रह्म स प्राणः तदु वाङ्मनः वाक्च मनश्च सर्वाणि च करणानि तदु अन्तश्चैतन्यम्, चैतन्याश्रयो हि प्राणेन्द्रियादिसर्वसङ्घातः, ‘प्राणस्य प्राणम्’ (बृ.४.४.१०) इति श्रुत्यन्तरात्।", "audioFile": "PB_hear2read_000287.mp3", "sections": []}, {"id": "B_000288", "originalText": "यत्प्राणादीनामन्तश्चैतन्यमक्षरं तदेतत् सत्यम् अवितथम्, अतः अमृतम् अविनाशि तत् वेद्धव्यं मनसा ताडयितव्यम्।", "audioFile": "PB_hear2read_000288.mp3", "sections": []}, {"id": "B_000289", "originalText": "तस्मिन्मनसः समाधानं कर्तव्यमित्यर्थः। यस्मादेवं हे सोम्य, विद्धि अक्षरे चेतः समाधत्स्व॥", "audioFile": "PB_hear2read_000289.mp3", "sections": []}, {"id": "B_000290", "originalText": "धनुर्गृहीत्वौपनिषदं महास्त्रं शरं ह्युपासानिशितं सन्दधीत। आयम्य तद्भावगतेन चेतसा लक्ष्यं तदेवाक्षरं सोम्य विद्धि॥ ३॥", "audioFile": "PB_hear2read_000290.mp3", "sections": []}, {"id": "B_000291", "originalText": "कथं वेद्धव्यमिति, उच्यते— धनुः इष्वासनं गृहीत्वा आदाय औपनिषदम् उपनिषत्सु भवं प्रसिद्धं महास्त्रं महच्च तदस्त्रं च महास्त्रं धनुः, तस्मिन् शरम्, किंविशिष्टमित्याह— उपासानिशितं सन्तताभिध्यानेन तनूकृतम्, संस्कृतमित्येतत्, सन्दधीत सन्धानं कुर्यात्।", "audioFile": "PB_hear2read_000291.mp3", "sections": []}, {"id": "B_000292", "originalText": "सन्धाय च आयम्य आकृष्य सेन्द्रियमन्तःकरणं स्वविषयाद्विनिवर्त्य लक्ष्य एवावर्जितं कृत्वेत्यर्थः।", "audioFile": "PB_hear2read_000292.mp3", "sections": []}, {"id": "B_000293", "originalText": "न हि हस्तेनेव धनुष आयमनमिह सम्भवति। तद्भावगतेन तस्मिन्ब्रह्मण्यक्षरे लक्ष्ये भावना भावः तद्गतेन चेतसा, लक्ष्यं तदेव यथोक्तलक्षणम् अक्षरं सोम्य, विद्धि॥", "audioFile": "PB_hear2read_000293.mp3", "sections": []}, {"id": "B_000294", "originalText": "प्रणवो धनुः शरो ह्यात्मा ब्रह्म तल्लक्ष्यमुच्यते। अप्रमत्तेन वेद्धव्यं शरवत्तन्मयो भवेत्॥ ४॥", "audioFile": "PB_hear2read_000294.mp3", "sections": []}, {"id": "B_000295", "originalText": "यदुक्तं धनुरादि, तदुच्यते— प्रणवः ओङ्कारः धनुः।", "audioFile": "PB_hear2read_000295.mp3", "sections": []}, {"id": "B_000296", "originalText": "यथा इष्वासनं लक्ष्ये शरस्य प्रवेशकारणम्, तथा आत्मशरस्याक्षरे लक्ष्ये प्रवेशकारणमोङ्कारः।", "audioFile": "PB_hear2read_000296.mp3", "sections": []}, {"id": "B_000297", "originalText": "प्रणवेन ह्यभ्यस्यमानेन संस्क्रियमाणस्तदालम्बनोऽप्रतिबन्धेनाक्षरेऽवतिष्ठते।", "audioFile": "PB_hear2read_000297.mp3", "sections": []}, {"id": "B_000298", "originalText": "यथा धनुषा अस्त इषुर्लक्ष्ये।", "audioFile": "PB_hear2read_000298.mp3", "sections": []}, {"id": "B_000299", "originalText": "अतः प्रणवो धनुरिव धनुः।", "audioFile": "PB_hear2read_000299.mp3", "sections": []}, {"id": "B_000300", "originalText": "शरो ह्यात्मा उपाधिलक्षणः पर एव जले सूर्यादिवदिह प्रविष्टो देहे सर्वबौद्धप्रत्ययसाक्षितया, स शर इव स्वात्मन्येवार्पितोऽक्षरे ब्रह्मणि, अतः ब्रह्म तत् लक्ष्यमुच्यते लक्ष्य इव मनः समाधित्सुभिरात्मभावेन लक्ष्यमाणत्वात्।", "audioFile": "PB_hear2read_000300.mp3", "sections": []}, {"id": "B_000301", "originalText": "तत्रैवं सति अप्रमत्तेन बाह्यविषयोपलब्धितृष्णाप्रमादवर्जितेन सर्वतो विरक्तेन जितेन्द्रियेणैकाग्रचित्तेन वेद्धव्यं ब्रह्म लक्ष्यम्। ततस्तद्वेधनादूर्ध्वं शरवत् तन्मयः भवेत्, यथा शरस्य लक्ष्यैकात्मत्वं फलं भवति, तथा देहाद्यात्मताप्रत्ययतिरस्करणेनाक्षरैकात्मत्वं फलमापादयेदित्यर्थः॥", "audioFile": "PB_hear2read_000301.mp3", "sections": []}, {"id": "B_000302", "originalText": "यस्मिन्द्यौः पृथिवी चान्तरिक्षमोतं मनः सह प्राणैश्च सर्वैः। तमेवैकं जानथ आत्मानमन्या वाचो विमुञ्चथामृतस्यैष सेतुः॥ ५॥", "audioFile": "PB_hear2read_000302.mp3", "sections": []}, {"id": "B_000303", "originalText": "अक्षरस्यैव दुर्लक्ष्यत्वात्पुनः पुनर्वचनं सुलक्षणार्थम्।", "audioFile": "PB_hear2read_000303.mp3", "sections": []}, {"id": "B_000304", "originalText": "यस्मिन् अक्षरे पुरुषे द्यौः पृथिवी च अन्तरिक्षं च ओतं समर्पितं मनश्च सह प्राणैः करणैः अन्यैः सर्वैः, तमेव सर्वाश्रयमेकमद्वितीयं जानथ जानीत हे शिष्याः।", "audioFile": "PB_hear2read_000304.mp3", "sections": []}, {"id": "B_000305", "originalText": "आत्मानं प्रत्यक्स्वरूपं युष्माकं सर्वप्राणिनां च।", "audioFile": "PB_hear2read_000305.mp3", "sections": []}, {"id": "B_000306", "originalText": "ज्ञात्वा च अन्याः वाचः अपरविद्यारूपाः विमुञ्चथ विमुञ्चत परित्यजत।", "audioFile": "PB_hear2read_000306.mp3", "sections": []}, {"id": "B_000307", "originalText": "तत्प्रकाश्यं च सर्वं कर्म ससाधनम्।", "audioFile": "PB_hear2read_000307.mp3", "sections": []}, {"id": "B_000308", "originalText": "यतः अमृतस्य एष सेतुः, एतदात्मज्ञानममृतस्यामृतत्वस्य मोक्षस्य प्राप्तये सेतुरिव सेतुः, संसारमहोदधेरुत्तरणहेतुत्वात्, तथा च श्रुत्यन्तरम्— ‘तमेव विदित्वाति मृत्युमेति नान्यः पन्था विद्यतेऽयनाय’ (श्वे.३.८) इति॥", "audioFile": "PB_hear2read_000308.mp3", "sections": []}, {"id": "B_000309", "originalText": "अरा इव रथनाभौ संहता यत्र नाड्यः स एषोऽन्तश्चरते बहुधा जायमानः। ओमित्येवं ध्यायथ आत्मानं स्वस्ति वः पाराय तमसः परस्तात्॥ ६॥", "audioFile": "PB_hear2read_000309.mp3", "sections": []}, {"id": "B_000310", "originalText": "किञ्च, अरा इव यथा रथनाभौ समर्पिता अराः, एवं संहताः सम्प्रविष्टाः यत्र यस्मिन्हृदये सर्वतो देहव्यापिन्यः नाड्यः, तस्मिन्हृदये बुद्धिप्रत्ययसाक्षिभूतः स एषः प्रकृत आत्मा अन्तः मध्ये चरते चरति वर्तते।", "audioFile": "PB_hear2read_000310.mp3", "sections": []}, {"id": "B_000311", "originalText": "पश्यन् शृण्वन्मन्वानो विजानन् बहुधा अनेकधा क्रोधहर्षादिप्रत्ययैर्जायमान इव जायमानः अन्तःकरणोपाध्यनुविधायित्वात्, वदन्ति हि लौकिका हृष्टो जातः क्रुद्धो जात इति।", "audioFile": "PB_hear2read_000311.mp3", "sections": []}, {"id": "B_000312", "originalText": "तमात्मानम् ओमित्येवम् ओङ्कारालम्बनाः सन्तः यथोक्तकल्पनया ध्यायथ चिन्तयत।", "audioFile": "PB_hear2read_000312.mp3", "sections": []}, {"id": "B_000313", "originalText": "उक्तं च वक्तव्यं शिष्येभ्य आचार्येण जानता।", "audioFile": "PB_hear2read_000313.mp3", "sections": []}, {"id": "B_000314", "originalText": "शिष्याश्च ब्रह्मविद्याविविदिषुत्वान्निवृत्तकर्माणो मोक्षपथे प्रवृत्ताः।", "audioFile": "PB_hear2read_000314.mp3", "sections": []}, {"id": "B_000315", "originalText": "तेषां निर्विघ्नतया ब्रह्मप्राप्तिमाशास्त्याचार्यः— स्वस्ति निर्विघ्नमस्तु वः युष्माकं पाराय परकूलाय, कस्य? अविद्यातमसः परस्तात्, अविद्यारहितब्रह्मात्मस्वरूपगमनायेत्यर्थः॥", "audioFile": "PB_hear2read_000315.mp3", "sections": []}, {"id": "B_000316", "originalText": "यः सर्वज्ञः सर्वविद्यस्यैष महिमा भुवि। दिव्ये ब्रह्मपुरे ह्येष व्योमन्यात्मा प्रतिष्ठितः॥ ७॥", "audioFile": "PB_hear2read_000316.mp3", "sections": []}, {"id": "B_000317", "originalText": "योऽसौ तमसः परस्तात्संसारमहोदधिं तीर्त्वा गन्तव्यः परविद्याविषयः, स कस्मिन्वर्तत इत्याह— यः सर्वज्ञः सर्ववित् व्याख्यातः।", "audioFile": "PB_hear2read_000317.mp3", "sections": []}, {"id": "B_000318", "originalText": "तं पुनर्विशिनष्टि— यस्यैष प्रसिद्धो महिमा विभूतिः।", "audioFile": "PB_hear2read_000318.mp3", "sections": []}, {"id": "B_000319", "originalText": "कोऽसौ महिमा? यस्येमे द्यावापृथिव्यौ शासने विधृते तिष्ठतः, सूर्याचन्द्रमसौ यस्य शासनेऽलातचक्रवदजस्रं भ्रमतः, यस्य शासने सरितः सागराश्च स्वगोचरं नातिक्रामन्ति, तथा स्थावरं जङ्गमं च यस्य शासने नियतम्, तथा ऋतवोऽयने अब्दाश्च यस्य शासनं नातिक्रामन्ति, तथा कर्तारः कर्माणि फलं च यच्छासनात्स्वं स्वं कालं नातिवर्तन्ते, स एष महिमा, भुवि लोके यस्य स एष सर्वज्ञ एवंमहिमा देवः।", "audioFile": "PB_hear2read_000319.mp3", "sections": []}, {"id": "B_000320", "originalText": "दिव्ये द्योतनवति सर्वबौद्धप्रत्ययकृतद्योतने ब्रह्मपुरे।", "audioFile": "PB_hear2read_000320.mp3", "sections": []}, {"id": "B_000321", "originalText": "ब्रह्मणो ह्यत्र चैतन्यस्वरूपेण नित्याभिव्यक्तत्वात्, ब्रह्मणः पुरं हृदयपुण्डरीकं तस्मिन्यद्व्योम, तस्मिन्व्योमनि आकाशे हृत्पुण्डरीकमध्यस्थे प्रतिष्ठित इवोपलभ्यते, न ह्याकाशवत्सर्वगतस्य गतिरागतिः प्रतिष्ठा वान्यथा सम्भवति॥", "audioFile": "PB_hear2read_000321.mp3", "sections": []}, {"id": "B_000322", "originalText": "मनोमयः प्राणशरीरनेता प्रतिष्ठितोऽन्ने हृदयं संनिधाय। तद्विज्ञानेन परिपश्यन्ति धीरा आनन्दरूपममृतं यद्विभाति॥ ८॥", "audioFile": "PB_hear2read_000322.mp3", "sections": []}, {"id": "B_000323", "originalText": "स ह्यात्मा तत्रस्थो मनोवृत्तिभिरेव विभाव्यत इति मनोमयः, मनउपाधित्वात्।", "audioFile": "PB_hear2read_000323.mp3", "sections": []}, {"id": "B_000324", "originalText": "प्राणशरीरनेता प्राणश्च तच्छरीरं च तत्प्राणशरीरं तस्यायं नेता।", "audioFile": "PB_hear2read_000324.mp3", "sections": []}, {"id": "B_000325", "originalText": "अस्मात्स्थूलाच्छरीराच्छरीरान्तरं सूक्ष्मं प्रति प्रतिष्ठितः अवस्थितः अन्ने भुज्यमानान्नविपरिणामे प्रतिदिनमुपचीयमाने अपचीयमाने च पिण्डरूपेऽन्ने हृदयं बुद्धिं पुण्डरीकच्छिद्रे संनिधाय समवस्थाप्य, हृदयावस्थानमेव ह्यात्मनः स्थितिः, न ह्यात्मनः स्थितिरन्ने, तत् आत्मतत्त्वं विज्ञानेन विशिष्टेन शास्त्राचार्योपदेशजनितेन ज्ञानेन शमदमध्यानसर्वत्यागवैराग्योद्भूतेन परिपश्यन्ति सर्वतः पूर्णं पश्यन्ति उपलभन्ते धीराः विवेकिनः।", "audioFile": "PB_hear2read_000325.mp3", "sections": []}, {"id": "B_000326", "originalText": "आनन्दरूपं सर्वानर्थदुःखायासप्रहीणं सुखरूपम् अमृतं यद्विभाति विशेषेण स्वात्मन्येव भाति सर्वदा॥", "audioFile": "PB_hear2read_000326.mp3", "sections": []}, {"id": "B_000327", "originalText": "भिद्यते हृदयग्रन्थिश्छिद्यन्ते सर्वसंशयाः। क्षीयन्ते चास्य कर्माणि तस्मिन्दृष्टे परावरे॥ ९॥", "audioFile": "PB_hear2read_000327.mp3", "sections": []}, {"id": "B_000328", "originalText": "अस्य परमात्मज्ञानस्य फलमिदमभिधीयते— हृदयग्रन्थिः अविद्यावासनामयो बुद्ध्याश्रयः कामः, ‘कामा येऽस्य हृदि श्रिताः’ (बृ.४.४.७), (का.२.३.१४) इति श्रुत्यन्तरात्।", "audioFile": "PB_hear2read_000328.mp3", "sections": []}, {"id": "B_000329", "originalText": "हृदयाश्रयोऽसौ, नात्माश्रयः।", "audioFile": "PB_hear2read_000329.mp3", "sections": []}, {"id": "B_000330", "originalText": "भिद्यते भेदं विनाशमुपयाति।", "audioFile": "PB_hear2read_000330.mp3", "sections": []}, {"id": "B_000331", "originalText": "छिद्यन्ते सर्वे ज्ञेयविषयाः संशयाः लौकिकानाम् आ मरणात् गङ्गास्रोतोवत्प्रवृत्ता विच्छेदमायान्ति।", "audioFile": "PB_hear2read_000331.mp3", "sections": []}, {"id": "B_000332", "originalText": "अस्य विच्छिन्नसंशयस्य निवृत्ताविद्यस्य यानि विज्ञानोत्पत्तेः प्राक्कृतानि जन्मान्तरे चाप्रवृत्तफलानि ज्ञानोत्पत्तिसहभावीनि च क्षीयन्ते कर्माणि, न त्वेतज्जन्मारम्भकाणि, प्रवृत्तफलत्वात्।", "audioFile": "PB_hear2read_000332.mp3", "sections": []}, {"id": "B_000333", "originalText": "तस्मिन् सर्वज्ञेऽसंसारिणि परावरे परं च कारणात्मना अवरं च कार्यात्मना तस्मिन्परावरे साक्षादहमस्मीति दृष्टे, संसारकारणोच्छेदान्मुच्यत इत्यर्थः॥", "audioFile": "PB_hear2read_000333.mp3", "sections": []}, {"id": "B_000334", "originalText": "हिरण्मये परे कोशे विरजं ब्रह्म निष्कलम्। तच्छुभ्रं ज्योतिषां ज्योतिस्तद्यदात्मविदो विदुः॥ १०॥", "audioFile": "PB_hear2read_000334.mp3", "sections": []}, {"id": "B_000335", "originalText": "उक्तस्यैवार्थस्य सङ्क्षेपाभिधायका उत्तरे मन्त्रास्त्रयोऽपि— हिरण्मये ज्योतिर्मये बुद्धिविज्ञानप्रकाशे परे कोशे कोश इवासेः।", "audioFile": "PB_hear2read_000335.mp3", "sections": []}, {"id": "B_000336", "originalText": "आत्मस्वरूपोपलब्धिस्थानत्वात्परं तत्सर्वाभ्यन्तरत्वात्, तस्मिन् विरजम् अविद्याद्यशेषदोषरजोमलवर्जितं ब्रह्म सर्वमहत्त्वात्सर्वात्मत्वाच्च निष्कलं निर्गताः कला यस्मात्तन्निष्कलं निरवयवमित्यर्थः।", "audioFile": "PB_hear2read_000336.mp3", "sections": []}, {"id": "B_000337", "originalText": "यस्माद्विरजं निष्कलं च अतः तच्छुभ्रं शुद्धं ज्योतिषां सर्वप्रकाशात्मनामग्न्यादीनामपि तज्ज्योतिः अवभासकम्।", "audioFile": "PB_hear2read_000337.mp3", "sections": []}, {"id": "B_000338", "originalText": "अग्न्यादीनामपि ज्योतिष्ट्वमन्तर्गतब्रह्मात्मचैतन्यज्योतिर्निमित्तमित्यर्थः।", "audioFile": "PB_hear2read_000338.mp3", "sections": []}, {"id": "B_000339", "originalText": "तद्धि परं ज्योतिर्यदन्यानवभास्यमात्मज्योतिः, तत् यत् आत्मविदः आत्मानं स्वं शब्दादिविषयबुद्धिप्रत्ययसाक्षिणं ये विवेकिनो विदुः विजानन्ति, ते आत्मविदः तद्विदुः, आत्मप्रत्ययानुसारिणः।", "audioFile": "PB_hear2read_000339.mp3", "sections": []}, {"id": "B_000340", "originalText": "यस्मात्परं ज्योतिस्तस्मात्त एव तद्विदुः, नेतरे बाह्यार्थप्रत्ययानुसारिणः॥", "audioFile": "PB_hear2read_000340.mp3", "sections": []}, {"id": "B_000341", "originalText": "न तत्र सूर्यो भाति न चन्द्रतारकं नेमा विद्युतो भान्ति कुतोऽयमग्निः। तमेव भान्तमनुभाति सर्वं तस्य भासा सर्वमिदं विभाति॥ ११॥", "audioFile": "PB_hear2read_000341.mp3", "sections": []}, {"id": "B_000342", "originalText": "कथं तत् ‘ज्योतिषां ज्योतिः’ इति, उच्यते— न तत्र तस्मिन्स्वात्मभूते ब्रह्मणि सर्वावभासकोऽपि सूर्यो भाति, तद्ब्रह्म न प्रकाशयतीत्यर्थः।", "audioFile": "PB_hear2read_000342.mp3", "sections": []}, {"id": "B_000343", "originalText": "स हि तस्यैव भासा सर्वमन्यदनात्मजातं प्रकाशयति, न तु तस्य स्वतः प्रकाशनसामर्थ्यम्।", "audioFile": "PB_hear2read_000343.mp3", "sections": []}, {"id": "B_000344", "originalText": "तथा न चन्द्रतारकम्, न इमाः विद्युतः भान्ति, कुतोऽयमग्निः अस्मद्गोचरः।", "audioFile": "PB_hear2read_000344.mp3", "sections": []}, {"id": "B_000345", "originalText": "किं बहुना।", "audioFile": "PB_hear2read_000345.mp3", "sections": []}, {"id": "B_000346", "originalText": "यदिदं जगद्भाति, तत्तमेव परमेश्वरं स्वतो भारूपत्वात् भान्तं दीप्यमानम् अनुभाति अनुदीप्यते।", "audioFile": "PB_hear2read_000346.mp3", "sections": []}, {"id": "B_000347", "originalText": "यथा जलमुल्मुकादि वा अग्निसंयोगादग्निं दहन्तमनुदहति, न स्वतः, तद्वत्तस्यैव भासा दीप्त्या सर्वमिदं सूर्यादि जगद्विभाति।", "audioFile": "PB_hear2read_000347.mp3", "sections": []}, {"id": "B_000348", "originalText": "यत एवं तदेव ब्रह्म भाति च विभाति च कार्यगतेन विविधेन भासा, अतस्तस्य ब्रह्मणो भारूपत्वं स्वतोऽवगम्यते।", "audioFile": "PB_hear2read_000348.mp3", "sections": []}, {"id": "B_000349", "originalText": "न हि स्वतोऽविद्यमानं भासनमन्यस्य कर्तुं शक्नोति। घटादीनामन्यावभासकत्वादर्शनात् भारूपाणां चादित्यादीनां तद्दर्शनात्॥", "audioFile": "PB_hear2read_000349.mp3", "sections": []}, {"id": "B_000350", "originalText": "ब्रह्मैवेदममृतं पुरस्ताद्ब्रह्म पश्चाद्ब्रह्म दक्षिणतश्चोत्तरेण। अधश्चोर्ध्वं च प्रसृतं ब्रह्मैवेदं विश्वमिदं वरिष्ठम्॥ १२॥", "audioFile": "PB_hear2read_000350.mp3", "sections": []}, {"id": "B_000351", "originalText": "यत्तज्ज्योतिषां ज्योतिर्ब्रह्म, तदेव सत्यम्, सर्वं तद्विकारः वाचारम्भणं विकारो नामधेयमात्रमनृतमितरदित्येतमर्थं विस्तरेण हेतुतः प्रतिपादितं निगमनस्थानीयेन मन्त्रेण पुनरुपसंहरति— ब्रह्मैव उक्तलक्षणम्, इदं यत् पुरस्तात् अग्रेऽब्रह्मेवाविद्यादृष्टीनां प्रत्यवभासमानं तथा पश्चाद्ब्रह्म तथा दक्षिणतश्च तथा उत्तरेण तथैवाधस्तात् ऊर्ध्वं च सर्वतोऽन्यदिव कार्याकारेण प्रसृतं प्रगतं नामरूपवदवभासमानम्।", "audioFile": "PB_hear2read_000351.mp3", "sections": []}, {"id": "B_000352", "originalText": "किं बहुना, ब्रह्मैवेदं विश्वं समस्तमिदं जगत् वरिष्ठं वरतमम्।", "audioFile": "PB_hear2read_000352.mp3", "sections": []}, {"id": "B_000353", "originalText": "अब्रह्मप्रत्ययः सर्वोऽविद्यामात्रो रज्ज्वामिव सर्पप्रत्ययः। ब्रह्मैवैकं परमार्थसत्यमिति वेदानुशासनम्॥", "audioFile": "PB_hear2read_000353.mp3", "sections": []}, {"id": "B_000354", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ मुण्डकोपनिषद्भाष्ये द्वितीयं मुण्डकं समाप्तम्॥", "audioFile": "PB_hear2read_000354.mp3", "sections": []}, {"id": "B_000355", "originalText": "तृतीयं मुण्डकम्\nप्रथमः खण्डः\nपरा विद्योक्ता यया तदक्षरं पुरुषाख्यं सत्यमधिगम्यते।", "audioFile": "PB_hear2read_000355.mp3", "sections": ["तृतीयं मुण्डकम्", "प्रथमः खण्डः"]}, {"id": "B_000356", "originalText": "यदधिगमे हृदयग्रन्थ्यादिसंसारकारणस्यात्यन्तिको विनाशः स्यात्, तद्दर्शनोपायश्च योगो धनुराद्युपादानकल्पनयोक्तः।", "audioFile": "PB_hear2read_000356.mp3", "sections": []}, {"id": "B_000357", "originalText": "अथेदानीं तत्सहकारीणि सत्यादिसाधनानि वक्तव्यानीति तदर्थ उत्तरग्रन्थारम्भः।", "audioFile": "PB_hear2read_000357.mp3", "sections": []}, {"id": "B_000358", "originalText": "प्राधान्येन तत्त्वनिर्धारणं च प्रकारान्तरेण क्रियते।", "audioFile": "PB_hear2read_000358.mp3", "sections": []}, {"id": "B_000359", "originalText": "अत्यन्तदुरवगाहत्वात्कृतमपि तत्र सूत्रभूतो मन्त्रः परमार्थवस्त्ववधारणार्थमुपन्यस्यते—\nद्वा सुपर्णा सयुजा सखाया समानं वृक्षं परिषस्वजाते। तयोरन्यः पिप्पलं स्वाद्वत्ति अनश्नन्नन्योऽभिचाकशीति॥ १॥", "audioFile": "PB_hear2read_000359.mp3", "sections": []}, {"id": "B_000360", "originalText": "द्वा द्वौ, सुपर्णा सुपर्णौ शोभनपतनौ सुपर्णौ, पक्षिसामान्याद्वा सुपर्णौ, सयुजा सयुजौ सहैव सर्वदा युक्तौ, सखाया सखायौ समानाख्यानौ समानाभिव्यक्तिकारणौ, एवंभूतौ सन्तौ समानम् अविशेषमुपलब्ध्यधिष्ठानतया, एकं वृक्षं वृक्षमिवोच्छेदसामान्याच्छरीरं वृक्षं परिषस्वजाते परिष्वक्तवन्तौ।", "audioFile": "PB_hear2read_000360.mp3", "sections": []}, {"id": "B_000361", "originalText": "सुपर्णाविवैकं वृक्षं फलोपभोगार्थम्।", "audioFile": "PB_hear2read_000361.mp3", "sections": []}, {"id": "B_000362", "originalText": "अयं हि वृक्ष ऊर्ध्वमूलोऽवाक्शाखोऽश्वत्थोऽव्यक्तमूलप्रभवः क्षेत्रसंज्ञकः सर्वप्राणिकर्मफलाश्रयः, तं परिष्वक्तवन्तौ सुपर्णाविव अविद्याकामकर्मवासनाश्रयलिङ्गोपाध्यात्मेश्वरौ।", "audioFile": "PB_hear2read_000362.mp3", "sections": []}, {"id": "B_000363", "originalText": "तयोः परिष्वक्तयोः अन्यः एकः क्षेत्रज्ञो लिङ्गोपाधिवृक्षमाश्रितः पिप्पलं कर्मनिष्पन्नं सुखदुःखलक्षणं फलं स्वादु अनेकविचित्रवेदनास्वादरूपं स्वादु अत्ति भक्षयत्युपभुङ्क्ते अविवेकतः।", "audioFile": "PB_hear2read_000363.mp3", "sections": []}, {"id": "B_000364", "originalText": "अनश्नन् अन्यः इतरः ईश्वरो नित्यशुद्धबुद्धमुक्तस्वभावः सर्वज्ञः सत्त्वोपाधिरीश्वरो नाश्नाति।", "audioFile": "PB_hear2read_000364.mp3", "sections": []}, {"id": "B_000365", "originalText": "प्रेरयिता ह्यसावुभयोर्भोज्यभोक्त्रोर्नित्यसाक्षित्वसत्तामात्रेण।", "audioFile": "PB_hear2read_000365.mp3", "sections": []}, {"id": "B_000366", "originalText": "स तु अनश्नन् अन्यः अभिचाकशीति पश्यत्येव केवलम्। दर्शनमात्रं हि तस्य प्रेरयितृत्वं राजवत्॥", "audioFile": "PB_hear2read_000366.mp3", "sections": []}, {"id": "B_000367", "originalText": "समाने वृक्षे पुरुषो निमग्नोऽनीशया शोचति मुह्यमानः। जुष्टं यदा पश्यत्यन्यमीशमस्य महिमानमिति वीतशोकः॥ २॥", "audioFile": "PB_hear2read_000367.mp3", "sections": []}, {"id": "B_000368", "originalText": "तत्रैवं सति समाने वृक्षे यथोक्ते शरीरे पुरुषः भोक्ता जीवोऽविद्याकामकर्मफलरागादिगुरुभाराक्रान्तोऽलाबुरिव सामुद्रे जले निमग्नः निश्चयेन देहात्मभावमापन्नोऽयमेवाहममुष्य पुत्रोऽस्य नप्ता कृशः स्थूलो गुणवान्निर्गुणः सुखी दुःखीत्येवंप्रत्ययो नास्त्यन्योऽस्मादिति जायते म्रियते संयुज्यते वियुज्यते च सम्बन्धिबान्धवैः, अतः अनीशया, न कस्यचित्समर्थोऽहं पुत्रो मम विनष्टो मृता मे भार्या किं मे जीवितेनेत्येवं दीनभावोऽनीशा, तया शोचति सन्तप्यते मुह्यमानः अनेकैरनर्थप्रकारैरविवेकितया अन्तश्चिन्तामापद्यमानः स एवं प्रेततिर्यङ्मनुष्यादियोनिष्वाजवञ्जवीभावमापन्नः कदाचिदनेकजन्मसु शुद्धधर्मसञ्चितनिमित्ततः केनचित्परमकारुणिकेन दर्शितयोगमार्गः अहिंसासत्यब्रह्मचर्यसर्वत्यागशमदमादिसम्पन्नः समाहितात्मा सन् जुष्टं सेवितमनेकैर्योगमार्गैः कर्मिभिश्च यदा यस्मिन्काले पश्यति ध्यायमानः अन्यं वृक्षोपाधिलक्षणाद्विलक्षणम् ईशम् असंसारिणमशनायापिपासाशोकमोहजरामृत्य्वतीतमीशं सर्वस्य जगतोऽयमहमस्म्यात्मा सर्वस्य समः सर्वभूतस्थो नेतर
