ोऽविद्याजनितोपाधिपरिच्छिन्नो मायात्मेति महिमानं विभूतिं च जगद्रूपमस्यैव मम परमेश्वरस्य इति यदैवं द्रष्टा, तदा वीतशोकः भवति सर्वस्माच्छोकसागराद्विप्रमुच्यते, कृतकृत्यो भवतीत्यर्थः॥", "audioFile": "PB_hear2read_000368.mp3", "sections": []}, {"id": "B_000369", "originalText": "यदा पश्यः पश्यते रुक्मवर्णं कर्तारमीशं पुरुषं ब्रह्मयोनिम्। तदा विद्वान्पुण्यपापे विधूय निरञ्जनः परमं साम्यमुपैति॥ ३॥", "audioFile": "PB_hear2read_000369.mp3", "sections": []}, {"id": "B_000370", "originalText": "अन्योऽपि मन्त्र इममेवार्थमाह सविस्तरम्— यदा यस्मिन्काले पश्यः पश्यतीति विद्वान् साधक इत्यर्थः।", "audioFile": "PB_hear2read_000370.mp3", "sections": []}, {"id": "B_000371", "originalText": "पश्यते पश्यति पूर्ववत्, रुक्मवर्णं स्वयञ्ज्योतिःस्वभावं रुक्मस्येव वा ज्योतिरस्याविनाशि, कर्तारं सर्वस्य जगतः ईशं पुरुषं ब्रह्मयोनिं ब्रह्म च तद्योनिश्चासौ ब्रह्मयोनिस्तं ब्रह्मयोनिं ब्रह्मणो वा अपरस्य योनिं स यदा चैवं पश्यति, तदा स विद्वान्पश्यः पुण्यपापे बन्धनभूते कर्मणी समूले विधूय निरस्य दग्ध्वा निरञ्जनः निर्लेपो विगतक्लेशः परमं प्रकृष्टं निरतिशयं साम्यं समतामद्वयलक्षणाम्, द्वैतविषयाणि साम्यान्यतः अर्वाञ्च्येव, अतोऽद्वयलक्षणमेतत् परमं साम्यमुपैति प्रतिपद्यते॥", "audioFile": "PB_hear2read_000371.mp3", "sections": []}, {"id": "B_000372", "originalText": "प्राणो ह्येष यः सर्वभूतैर्विभाति विजानन्विद्वान्भवते नातिवादी। आत्मक्रीड आत्मरतिः क्रियावानेष ब्रह्मविदां वरिष्ठः॥ ४॥", "audioFile": "PB_hear2read_000372.mp3", "sections": []}, {"id": "B_000373", "originalText": "किञ्च, योऽयं प्राणस्य प्राणः पर ईश्वरः हि एषः प्रकृतः सर्वभूतैः सर्वैर्भूतैः ब्रह्मादिस्तम्बपर्यन्तैः, इत्थम्भूतलक्षणा तृतीया।", "audioFile": "PB_hear2read_000373.mp3", "sections": []}, {"id": "B_000374", "originalText": "सर्वभूतस्थः सर्वात्मा सन्नित्यर्थः।", "audioFile": "PB_hear2read_000374.mp3", "sections": []}, {"id": "B_000375", "originalText": "विभाति विविधं दीप्यते।", "audioFile": "PB_hear2read_000375.mp3", "sections": []}, {"id": "B_000376", "originalText": "एवं सर्वभूतस्थं यः साक्षादात्मभावेनायमहमस्मीति विजानन् विद्वान् वाक्यार्थज्ञानमात्रेण न भवते न भवतीत्येतत्।", "audioFile": "PB_hear2read_000376.mp3", "sections": []}, {"id": "B_000377", "originalText": "किम्? अतिवादी अतीत्य सर्वानन्यान्वदितुं शीलमस्येत्यतिवादी।", "audioFile": "PB_hear2read_000377.mp3", "sections": []}, {"id": "B_000378", "originalText": "यस्त्वेवं साक्षादात्मानं प्राणस्य प्राणं विद्वान्, सोऽतिवादी न भवतीत्यर्थः।", "audioFile": "PB_hear2read_000378.mp3", "sections": []}, {"id": "B_000379", "originalText": "सर्वं यदा आत्मैव नान्यदस्तीति दृष्टम्, तदा किं ह्यसावतीत्य वदेत्।", "audioFile": "PB_hear2read_000379.mp3", "sections": []}, {"id": "B_000380", "originalText": "यस्य त्वपरमन्यद्दृष्टमस्ति, स तदतीत्य वदति।", "audioFile": "PB_hear2read_000380.mp3", "sections": []}, {"id": "B_000381", "originalText": "अयं तु विद्वान्नात्मनोऽन्यत्पश्यति, नान्यच्छृणोति, नान्यद्विजानाति।", "audioFile": "PB_hear2read_000381.mp3", "sections": []}, {"id": "B_000382", "originalText": "अतो नातिवदति।", "audioFile": "PB_hear2read_000382.mp3", "sections": []}, {"id": "B_000383", "originalText": "किञ्च, आत्मक्रीडः आत्मन्येव क्रीडा क्रीडनं यस्य नान्यत्र पुत्रदारादिषु, स आत्मक्रीडः।", "audioFile": "PB_hear2read_000383.mp3", "sections": []}, {"id": "B_000384", "originalText": "तथा आत्मरतिः आत्मन्येव रती रमणं प्रीतिर्यस्य, स आत्मरतिः।", "audioFile": "PB_hear2read_000384.mp3", "sections": []}, {"id": "B_000385", "originalText": "क्रीडा बाह्यसाधनसापेक्षा, रतिस्तु साधननिरपेक्षा बाह्यविषयप्रीतिमात्रमिति विशेषः।", "audioFile": "PB_hear2read_000385.mp3", "sections": []}, {"id": "B_000386", "originalText": "तथा क्रियावान् ज्ञानध्यानवैराग्यादिक्रिया यस्य सोऽयं क्रियावान्।", "audioFile": "PB_hear2read_000386.mp3", "sections": []}, {"id": "B_000387", "originalText": "समासपाठे आत्मरतिरेव क्रियास्य विद्यत इति बहुव्रीहिमतुबर्थयोरन्यतरोऽतिरिच्यते।", "audioFile": "PB_hear2read_000387.mp3", "sections": []}, {"id": "B_000388", "originalText": "केचित्त्वग्निहोत्रादिकर्मब्रह्मविद्ययोः समुच्चयार्थमिच्छन्ति।", "audioFile": "PB_hear2read_000388.mp3", "sections": []}, {"id": "B_000389", "originalText": "तच्चैष ब्रह्मविदां वरिष्ठ इत्यनेन मुख्यार्थवचनेन विरुध्यते।", "audioFile": "PB_hear2read_000389.mp3", "sections": []}, {"id": "B_000390", "originalText": "न हि बाह्यक्रियावानात्मक्रीड आत्मरतिश्च भवितुं शक्तः।", "audioFile": "PB_hear2read_000390.mp3", "sections": []}, {"id": "B_000391", "originalText": "क्वचिद्बाह्यक्रियाविनिवृत्तो ह्यात्मक्रीडो भवति बाह्यक्रियात्मक्रीडयोर्विरोधात्।", "audioFile": "PB_hear2read_000391.mp3", "sections": []}, {"id": "B_000392", "originalText": "न हि तमःप्रकाशयोर्युगपदेकत्र स्थितिः सम्भवति।", "audioFile": "PB_hear2read_000392.mp3", "sections": []}, {"id": "B_000393", "originalText": "तस्मादसत्प्रलपितमेवैतदनेन ज्ञानकर्मसमुच्चयप्रतिपादनम्।", "audioFile": "PB_hear2read_000393.mp3", "sections": []}, {"id": "B_000394", "originalText": "‘अन्या वाचो विमुञ्चथ’ (मु.२.२.५) ‘संन्यासयोगात्’ (मु.३.२.६) इत्यादिश्रुतिभ्यश्च।", "audioFile": "PB_hear2read_000394.mp3", "sections": []}, {"id": "B_000395", "originalText": "तस्मादयमेवेह क्रियावान्यो ज्ञानध्यानादिक्रियावानसम्भिन्नार्यमर्यादः संन्यासी। य एवंलक्षणो नातिवाद्यात्मक्रीड आत्मरतिः क्रियावान्ब्रह्मनिष्ठः, स ब्रह्मविदां सर्वेषां वरिष्ठः प्रधानः॥", "audioFile": "PB_hear2read_000395.mp3", "sections": []}, {"id": "B_000396", "originalText": "सत्येन लभ्यस्तपसा ह्येष आत्मा सम्यग्ज्ञानेन ब्रह्मचर्येण नित्यम्। अन्तःशरीरे ज्योतिर्मयो हि शुभ्रो यं पश्यन्ति यतयः क्षीणदोषाः॥ ५॥", "audioFile": "PB_hear2read_000396.mp3", "sections": []}, {"id": "B_000397", "originalText": "अधुना सत्यादीनि भिक्षोः सम्यग्ज्ञानसहकारीणि साधनानि विधीयन्ते निवृत्तिप्रधानानि— सत्येन अनृतत्यागेन मृषावदनत्यागेन लभ्यः प्राप्तव्यः।", "audioFile": "PB_hear2read_000397.mp3", "sections": []}, {"id": "B_000398", "originalText": "किञ्च, तपसा हीन्द्रियमनएकाग्रतया।", "audioFile": "PB_hear2read_000398.mp3", "sections": []}, {"id": "B_000399", "originalText": "‘मनसश्चेन्द्रियाणां च ह्यैकाग्र्यं परमं तपः’ (मो.ध.२५०.४) इति स्मरणात्।", "audioFile": "PB_hear2read_000399.mp3", "sections": []}, {"id": "B_000400", "originalText": "तद्ध्यनुकूलमात्मदर्शनाभिमुखीभावात्परमं साधनं तपो नेतरच्चान्द्रायणादि।", "audioFile": "PB_hear2read_000400.mp3", "sections": []}, {"id": "B_000401", "originalText": "एष आत्मा लभ्य इत्यनुषङ्गः सर्वत्र।", "audioFile": "PB_hear2read_000401.mp3", "sections": []}, {"id": "B_000402", "originalText": "सम्यग्ज्ञानेन यथाभूतात्मदर्शनेन ब्रह्मचर्येण मैथुनासमाचारेण।", "audioFile": "PB_hear2read_000402.mp3", "sections": []}, {"id": "B_000403", "originalText": "नित्यं सर्वदा, नित्यं सत्येन नित्यं तपसा नित्यं सम्यग्ज्ञानेनेति सर्वत्र नित्यशब्दोऽन्तर्दीपिकान्यायेनानुषक्तव्यः।", "audioFile": "PB_hear2read_000403.mp3", "sections": []}, {"id": "B_000404", "originalText": "वक्ष्यति च ‘न येषु जिह्ममनृतं न माया च’ (प्र.१.१६) इति।", "audioFile": "PB_hear2read_000404.mp3", "sections": []}, {"id": "B_000405", "originalText": "क्वासावात्मा य एतैः साधनैर्लभ्य इत्युच्यते— अन्तःशरीरेऽन्तर्मध्ये शरीरस्य पुण्डरीकाकाशे ज्योतिर्मयो हि रुक्मवर्णः शुभ्रः शुद्धो यमात्मानं पश्यन्ति उपलभन्ते यतयः यतनशीलाः संन्यासिनः क्षीणदोषाः क्षीणक्रोधादिचित्तमलाः, स आत्मा नित्यं सत्यादिसाधनैः संन्यासिभिर्लभ्यत इत्यर्थः।", "audioFile": "PB_hear2read_000405.mp3", "sections": []}, {"id": "B_000406", "originalText": "न कादाचित्कैः सत्यादिभिर्लभ्यते। सत्यादिसाधनस्तुत्यर्थोऽयमर्थवादः॥", "audioFile": "PB_hear2read_000406.mp3", "sections": []}, {"id": "B_000407", "originalText": "सत्यमेव जयते नानृतं सत्येन पन्था विततो देवयानः। येनाक्रमन्त्यृषयो ह्याप्तकामा यत्र तत्सत्यस्य परमं निधानम्॥ ६॥", "audioFile": "PB_hear2read_000407.mp3", "sections": []}, {"id": "B_000408", "originalText": "सत्यमेव सत्यवानेव जयते जयति, नानृतं नानृतवादीत्यर्थः।", "audioFile": "PB_hear2read_000408.mp3", "sections": []}, {"id": "B_000409", "originalText": "न हि सत्यानृतयोः केवलयोः पुरुषानाश्रितयोः जयः पराजयो वा सम्भवति।", "audioFile": "PB_hear2read_000409.mp3", "sections": []}, {"id": "B_000410", "originalText": "प्रसिद्धं लोके सत्यवादिनानृतवाद्यभिभूयते न विपर्ययः, अतः सिद्धं सत्यस्य बलवत्साधनत्वम्।", "audioFile": "PB_hear2read_000410.mp3", "sections": []}, {"id": "B_000411", "originalText": "किञ्च, शास्त्रतोऽप्यवगम्यते सत्यस्य साधनातिशयत्वम्।", "audioFile": "PB_hear2read_000411.mp3", "sections": []}, {"id": "B_000412", "originalText": "कथम्? सत्येन यथाभूतवादव्यवस्थया पन्थाः देवयानाख्यः विततो विस्तीर्णः सातत्येन प्रवृत्तः।", "audioFile": "PB_hear2read_000412.mp3", "sections": []}, {"id": "B_000413", "originalText": "येन पथा हि अक्रमन्ति आक्रमन्ते ऋषयः दर्शनवन्तः कुहकमायाशाठ्याहङ्कारदम्भानृतवर्जिता ह्याप्तकामाः विगततृष्णाः सर्वतो यत्र यस्मिन्, तत्परमार्थतत्त्वं सत्यस्य उत्तमसाधनस्य सम्बन्धि साध्यं परमं प्रकृष्टं निधानं पुरुषार्थरूपेण निधीयत इति निधानं वर्तते।", "audioFile": "PB_hear2read_000413.mp3", "sections": []}, {"id": "B_000414", "originalText": "तत्र च येन पथा आक्रमन्ति, स सत्येन वितत इति पूर्वेण सम्बन्धः॥", "audioFile": "PB_hear2read_000414.mp3", "sections": []}, {"id": "B_000415", "originalText": "बृहच्च तद्दिव्यमचिन्त्यरूपं सूक्ष्माच्च तत्सूक्ष्मतरं विभाति। दूरात्सुदूरे तदिहान्तिके च पश्यत्स्विहैव निहितं गुहायाम्॥ ७॥", "audioFile": "PB_hear2read_000415.mp3", "sections": []}, {"id": "B_000416", "originalText": "किं तत्किन्धर्मकं च तदित्युच्यते— बृहत् महच्च तत् प्रकृतं ब्रह्म सत्यादिसाधनेन सर्वतो व्याप्तत्वात्।", "audioFile": "PB_hear2read_000416.mp3", "sections": []}, {"id": "B_000417", "originalText": "दिव्यं स्वयम्प्रभमनिन्द्रियगोचरम् अत एव न चिन्तयितुं शक्यतेऽस्य रूपमिति अचिन्त्यरूपम्।", "audioFile": "PB_hear2read_000417.mp3", "sections": []}, {"id": "B_000418", "originalText": "सूक्ष्मादाकाशादेरपि तत्सूक्ष्मतरम्, निरतिशयं हि सौक्ष्म्यमस्य सर्वकारणत्वात्, विभाति विविधमादित्यचन्द्राद्याकारेण भाति दीप्यते।", "audioFile": "PB_hear2read_000418.mp3", "sections": []}, {"id": "B_000419", "originalText": "किञ्च, दूरात् विप्रकृष्टाद्देशात्सुदूरे विप्रकृष्टतरे देशे वर्ततेऽविदुषामत्यन्तागम्यत्वात्तद्ब्रह्म।", "audioFile": "PB_hear2read_000419.mp3", "sections": []}, {"id": "B_000420", "originalText": "इह देहे अन्तिके समीपे च, विदुषामात्मत्वात्।", "audioFile": "PB_hear2read_000420.mp3", "sections": []}, {"id": "B_000421", "originalText": "सर्वान्तरत्वाच्चाकाशस्याप्यन्तरश्रुतेः।", "audioFile": "PB_hear2read_000421.mp3", "sections": []}, {"id": "B_000422", "originalText": "इह पश्यत्सु चेतनावत्स्वित्येतत्, निहितं स्थितं दर्शनादिक्रियावत्त्वेन योगिभिर्लक्ष्यमाणम्।", "audioFile": "PB_hear2read_000422.mp3", "sections": []}, {"id": "B_000423", "originalText": "क्व? गुहायां बुद्धिलक्षणायाम्।", "audioFile": "PB_hear2read_000423.mp3", "sections": []}, {"id": "B_000424", "originalText": "तत्र हि निगूढं लक्ष्यते विद्वद्भिः। तथाप्यविद्यया संवृतं सन्न लक्ष्यते तत्रस्थमेवाविद्वद्भिः॥", "audioFile": "PB_hear2read_000424.mp3", "sections": []}, {"id": "B_000425", "originalText": "न चक्षुषा गृह्यते नापि वाचा नान्यैर्देवैस्तपसा कर्मणा वा। ज्ञानप्रसादेन विशुद्धसत्त्वस्ततस्तु तं पश्यते निष्कलं ध्यायमानः॥ ८॥", "audioFile": "PB_hear2read_000425.mp3", "sections": []}, {"id": "B_000426", "originalText": "पुनरप्यसाधारणं तदुपलब्धिसाधनमुच्यते— यस्मात् न चक्षुषा गृह्यते केनचिदप्यरूपत्वात् नापि गृह्यते वाचा अनभिधेयत्वात् न चान्यैर्देवैः इतरेन्द्रियैः।", "audioFile": "PB_hear2read_000426.mp3", "sections": []}, {"id": "B_000427", "originalText": "तपसः सर्वप्राप्तिसाधनत्वेऽपि न तपसा गृह्यते।", "audioFile": "PB_hear2read_000427.mp3", "sections": []}, {"id": "B_000428", "originalText": "तथा वैदिकेनाग्निहोत्रादिकर्मणा प्रसिद्धमहत्त्वेनापि न गृह्यते।", "audioFile": "PB_hear2read_000428.mp3", "sections": []}, {"id": "B_000429", "originalText": "किं पुनस्तस्य ग्रहणे साधनमित्याह— ज्ञानप्रसादेन आत्मावबोधनसमर्थमपि स्वभावेन सर्वप्राणिनां ज्ञानं बाह्यविषयरागादिदोषकलुषितमप्रसन्नमशुद्धं सन्नावबोधयति नित्यसंनिहितमप्यात्मतत्त्वं मलावनद्धमिवादर्शम्, विलुलितमिव सलिलम्।", "audioFile": "PB_hear2read_000429.mp3", "sections": []}, {"id": "B_000430", "originalText": "तद्यदेन्द्रियविषयसंसर्गजनितरागादिमलकालुष्यापनयनादादर्शसलिलादिवत्प्रसादितं स्वच्छं शान्तमवतिष्ठते, तदा ज्ञानस्य प्रसादः स्यात्।", "audioFile": "PB_hear2read_000430.mp3", "sections": []}, {"id": "B_000431", "originalText": "तेन ज्ञानप्रसादेन विशुद्धसत्त्वः विशुद्धान्तःकरणः योग्यो ब्रह्म द्रष्टुं यस्मात्, ततः तस्मात्तु तमात्मानं पश्यते पश्यति उपलभते निष्कलं सर्वावयवभेदवर्जितं ध्यायमानः सत्यादिसाधनवानुपसंहृतकरण एकाग्रेण मनसा ध्यायमानः चिन्तयन्॥", "audioFile": "PB_hear2read_000431.mp3", "sections": []}, {"id": "B_000432", "originalText": "एषोऽणुरात्मा चेतसा वेदितव्यो यस्मिन्प्राणः पञ्चधा संविवेश। प्राणैश्चित्तं सर्वमोतं प्रजानां यस्मिन्विशुद्धे विभवत्येष आत्मा॥ ९॥", "audioFile": "PB_hear2read_000432.mp3", "sections": []}, {"id": "B_000433", "originalText": "यमात्मानमेवं पश्यति, एषः अणुः सूक्ष्मः आत्मा चेतसा विशुद्धज्ञानेन केवलेन वेदितव्यः।", "audioFile": "PB_hear2read_000433.mp3", "sections": []}, {"id": "B_000434", "originalText": "क्वासौ? यस्मिन् शरीरे प्राणः वायुः पञ्चधा प्राणापानादिभेदेन संविवेश सम्यक् प्रविष्टः, तस्मिन्नेव शरीरे हृदये चेतसा ज्ञेय इत्यर्थः।", "audioFile": "PB_hear2read_000434.mp3", "sections": []}, {"id": "B_000435", "originalText": "कीदृशेन चेतसा वेदितव्य इत्याह— प्राणैः सहेन्द्रियैः चित्तं सर्वमन्तःकरणं प्रजानाम् ओतं व्याप्तं येन क्षीरमिव स्नेहेन, काष्ठमिव चाग्निना।", "audioFile": "PB_hear2read_000435.mp3", "sections": []}, {"id": "B_000436", "originalText": "सर्वं हि प्रजानामन्तःकरणं चेतनावत्प्रसिद्धं लोके। यस्मिंश्च चित्ते क्लेशादिमलवियुक्ते शुद्धे विभवति, एषः उक्त आत्मा विशेषेण स्वेनात्मना विभवति आत्मानं प्रकाशयतीत्यर्थः॥", "audioFile": "PB_hear2read_000436.mp3", "sections": []}, {"id": "B_000437", "originalText": "यं यं लोकं मनसा संविभाति विशुद्धसत्त्वः कामयते यांश्च कामान्। तं तं लोकं जयते तांश्च कामांस्तस्मादात्मज्ञं ह्यर्चयेद्भूतिकामः॥ १०॥", "audioFile": "PB_hear2read_000437.mp3", "sections": []}, {"id": "B_000438", "originalText": "य एवमुक्तलक्षणं सर्वात्मानमात्मत्वेन प्रतिपन्नस्तस्य सर्वात्मत्वादेव सर्वावाप्तिलक्षणं फलमाह— यं यं लोकं पित्रादिलक्षणं मनसा संविभाति सङ्कल्पयति मह्यमन्यस्मै वा भवेदिति, विशुद्धसत्त्वः क्षीणक्लेशः आत्मविन्निर्मलान्तःकरणः कामयते यांश्च कामान् प्रार्थयते भोगान्, तं तं लोकं जयते प्राप्नोति तांश्च कामान्सङ्कल्पितान्भोगान्।", "audioFile": "PB_hear2read_000438.mp3", "sections": []}, {"id": "B_000439", "originalText": "तस्माद्विदुषः सत्यसङ्कल्पत्वादात्मज्ञमात्मज्ञानेन विशुद्धान्तःकरणं ह्यर्चयेत्पूजयेत्पादप्रक्षालनशुश्रूषानमस्कारादिभिः भूतिकामः विभूतिमिच्छुः। ततः पूजार्ह एवासौ॥", "audioFile": "PB_hear2read_000439.mp3", "sections": []}, {"id": "B_000440", "originalText": "इति तृतीयमुण्डके प्रथमखण्डभाष्यम्॥", "audioFile": "PB_hear2read_000440.mp3", "sections": []}, {"id": "B_000441", "originalText": "द्वितीयः खण्डः\nस वेदैतत्परमं ब्रह्म धाम यत्र विश्वं निहितं भाति शुभ्रम्। उपासते पुरुषं ये ह्यकामास्ते शुक्रमेतदतिवर्तन्ति धीराः॥ १॥", "audioFile": "PB_hear2read_000441.mp3", "sections": ["द्वितीयः खण्डः"]}, {"id": "B_000442", "originalText": "यस्मात् स वेद जानाति एतत् यथोक्तलक्षणं ब्रह्म परमं प्रकृष्टं धाम सर्वकामानामाश्रयमास्पदम्, यत्र यस्मिन्ब्रह्मणि धाम्नि विश्वं समस्तं जगत् निहितम् अर्पितम्, यच्च स्वेन ज्योतिषा भाति शुभ्रं शुद्धम्, तमप्येवंविधमात्मज्ञं पुरुषं ये हि अकामाः विभूतितृष्णावर्जिता मुमुक्षवः सन्तः उपासते परमिव देवम्, ते शुक्रं नृबीजं यदेतत्प्रसिद्धं शरीरोपादानकारणम् अतिवर्तन्ति अतिगच्छन्ति धीराः बुद्धिमन्तः, न पुनर्योनिं प्रसर्पन्ति।", "audioFile": "PB_hear2read_000442.mp3", "sections": []}, {"id": "B_000443", "originalText": "‘न पुनः क्व रतिं करोति’ (?) इति श्रुतेः। अतस्तं पूजयेदित्यभिप्रायः॥", "audioFile": "PB_hear2read_000443.mp3", "sections": []}, {"id": "B_000444", "originalText": "कामान्यः कामयते मन्यमानः स कामभिर्जायते तत्र तत्र। पर्याप्तकामस्य कृतात्मनस्तु इहैव सर्वे प्रविलीयन्ति कामाः॥ २॥", "audioFile": "PB_hear2read_000444.mp3", "sections": []}, {"id": "B_000445", "originalText": "मुमुक्षोः कामत्याग एव प्रधानं साधनमित्येतद्दर्शयति— कामान् यः दृष्टादृष्टेष्टविषयान् कामयते मन्यमानः तद्गुणांश्चिन्तयानः प्रार्थयते, सः तैः कामभिः कामैर्धर्माधर्मप्रवृत्तिहेतुभिर्विषयेच्छारूपैः सह जायते, तत्र तत्र, यत्र यत्र विषयप्राप्तिनिमित्तं कामाः कर्मसु पुरुषं नियोजयन्ति, तत्र तत्र तेषु तेषु विषयेषु तैरेव कामैर्वेष्टितो जायते।", "audioFile": "PB_hear2read_000445.mp3", "sections": []}, {"id": "B_000446", "originalText": "यस्तु परमार्थतत्त्वविज्ञानात्पर्याप्तकामः आत्मकामत्वेन परि समन्ततः आप्ताः कामा यस्य, तस्य पर्याप्तकामस्य कृतात्मनः अविद्यालक्षणादपररूपादपनीय स्वेन परेण रूपेण कृत आत्मा विद्यया यस्य, तस्य कृतात्मनस्तु इहैव तिष्ठत्येव शरीरे सर्वे धर्माधर्मप्रवृत्तिहेतवः प्रविलीयन्ति प्रविलीयन्ते विलयमुपयान्ति, नश्यन्तीत्यर्थः।", "audioFile": "PB_hear2read_000446.mp3", "sections": []}, {"id": "B_000447", "originalText": "कामाः तज्जन्महेतुविनाशान्न जायन्त इत्यभिप्रायः॥", "audioFile": "PB_hear2read_000447.mp3", "sections": []}, {"id": "B_000448", "originalText": "नायमात्मा प्रवचनेन लभ्यो न मेधया न बहुना श्रुतेन। यमेवैष वृणुते तेन लभ्यस्तस्यैष आत्मा विवृणुते तनूं स्वाम्॥ ३॥", "audioFile": "PB_hear2read_000448.mp3", "sections": []}, {"id": "B_000449", "originalText": "यद्येवं सर्वलाभात्परम आत्मलाभः, तल्लाभाय प्रवचनादय उपाया बाहुल्येन कर्तव्या इति प्राप्ते, इदमुच्यते— यः अयमात्मा व्याख्यातः, यस्य लाभः परः पुरुषार्थः, नासौ वेदशास्त्राध्ययनबाहुल्येन प्रवचनेन लभ्यः।", "audioFile": "PB_hear2read_000449.mp3", "sections": []}, {"id": "B_000450", "originalText": "तथा न मेधया ग्रन्थार्थधारणशक्त्या, न बहुना श्रुतेन नापि भूयसा श्रवणेनेत्यर्थः।", "audioFile": "PB_hear2read_000450.mp3", "sections": []}, {"id": "B_000451", "originalText": "केन तर्हि लभ्य इति, उच्यते— यमेव परमात्मानमेव एषः विद्वान् वृणुते प्राप्तुमिच्छति, तेन वरणेन एष पर आत्मा लभ्यः, नान्येन साधनान्तरेण, नित्यलब्धस्वभावत्वात्।", "audioFile": "PB_hear2read_000451.mp3", "sections": []}, {"id": "B_000452", "originalText": "कीदृशोऽसौ विदुष आत्मलाभ इति, उच्यते— तस्य एष आत्मा अविद्यासञ्छन्नां स्वां परां तनूं स्वात्मतत्त्वं स्वरूपं विवृणुते प्रकाशयति, प्रकाश इव घटादिर्विद्यायां सत्यामाविर्भवतीत्यर्थः।", "audioFile": "PB_hear2read_000452.mp3", "sections": []}, {"id": "B_000453", "originalText": "तस्मादन्यत्यागेनात्मप्रार्थनैव आत्मलाभसाधनमित्यर्थः॥", "audioFile": "PB_hear2read_000453.mp3", "sections": []}, {"id": "B_000454", "originalText": "नायमात्मा बलहीनेन लभ्यो न च प्रमादात्तपसो वाप्यलिङ्गात्। एतैरुपायैर्यतते यस्तु विद्वांस्तस्यैष आत्मा विशते ब्रह्म धाम॥ ४॥", "audioFile": "PB_hear2read_000454.mp3", "sections": []}, {"id": "B_000455", "originalText": "आत्मप्रार्थनासहायभूतान्येतानि च साधनानि बलाप्रमादतपांसि लिङ्गयुक्तानि संन्याससहितानि।", "audioFile": "PB_hear2read_000455.mp3", "sections": []}, {"id": "B_000456", "originalText": "यस्मात् न अयमात्मा बलहीनेन बलप्रहीणेनात्मनिष्ठाजनितवीर्यहीनेन लभ्यः, नापि लौकिकपुत्रपश्वादिविषयासङ्गनिमित्तात्प्रमादात्, तथा तपसो वापि अलिङ्गात् लिङ्गरहितात्।", "audioFile": "PB_hear2read_000456.mp3", "sections": []}, {"id": "B_000457", "originalText": "तपोऽत्र ज्ञानम्, लिङ्गं संन्यासः, संन्यासरहिताज्ज्ञानान्न लभ्यत इत्यर्थः। एतैः उपायैः बलाप्रमादसंन्यासज्ञानैः यतते तत्परः सन्प्रयतते यस्तु विद्वान्विवेकी आत्मवित्, तस्य विदुषः एष आत्मा विशते सम्प्रविशति ब्रह्म धाम॥", "audioFile": "PB_hear2read_000457.mp3", "sections": []}, {"id": "B_000458", "originalText": "सम्प्राप्यैनमृषयो ज्ञानतृप्ताः कृतात्मानो वीतरागाः प्रशान्ताः। ते सर्वगं सर्वतः प्राप्य धीरा युक्तात्मानः सर्वमेवाविशन्ति॥ ५॥", "audioFile": "PB_hear2read_000458.mp3", "sections": []}, {"id": "B_000459", "originalText": "कथं ब्रह्म विशत इति, उच्यते— सम्प्राप्य समवगम्य एनम् आत्मानम् ऋषयः दर्शनवन्तः तेनैव ज्ञानेन तृप्ताः, न बाह्येन तृप्तिसाधनेन शरीरोपचयकारणेन।", "audioFile": "PB_hear2read_000459.mp3", "sections": []}, {"id": "B_000460", "originalText": "कृतात्मानः परमात्मस्वरूपेणैव निष्पन्नात्मानः सन्तः।", "audioFile": "PB_hear2read_000460.mp3", "sections": []}, {"id": "B_000461", "originalText": "वीतरागाः विगतरागादिदोषाः।", "audioFile": "PB_hear2read_000461.mp3", "sections": []}, {"id": "B_000462", "originalText": "प्रशान्ताः उपरतेन्द्रियाः।", "audioFile": "PB_hear2read_000462.mp3", "sections": []}, {"id": "B_000463", "originalText": "ते एवंभूताः सर्वगं सर्वव्यापिनम् आकाशवत् सर्वतः सर्वत्र प्राप्य, नोपाधिपरिच्छिन्नेनैकदेशेन, किं तर्हि, तद्ब्रह्मैवाद्वयमात्मत्वेन प्रतिपद्य धीराः अत्यन्तविवेकिनः युक्तात्मानो नित्यसमाहितस्वभावाः सर्वमेव समस्तं शरीरपातकालेऽपि आविशन्ति भिन्नघटाकाशवदविद्याकृतोपाधिपरिच्छेदं जहति।", "audioFile": "PB_hear2read_000463.mp3", "sections": []}, {"id": "B_000464", "originalText": "एवं ब्रह्मविदो ब्रह्म धाम प्रविशन्ति॥", "audioFile": "PB_hear2read_000464.mp3", "sections": []}, {"id": "B_000465", "originalText": "वेदान्तविज्ञानसुनिश्चितार्थाः संन्यासयोगाद्यतयः शुद्धसत्त्वाः। ते ब्रह्मलोकेषु परान्तकाले परामृताः परिमुच्यन्ति सर्वे॥ ६॥", "audioFile": "PB_hear2read_000465.mp3", "sections": []}, {"id": "B_000466", "originalText": "किञ्च, वेदान्तजनितं विज्ञानं वेदान्तविज्ञानं तस्यार्थः पर आत्मा विज्ञेयः, सोऽर्थः सुनिश्चितो येषां ते वेदान्तविज्ञानसुनिश्चितार्थाः।", "audioFile": "PB_hear2read_000466.mp3", "sections": []}, {"id": "B_000467", "originalText": "ते च संन्यासयोगात् सर्वकर्मपरित्यागलक्षणयोगात्केवलब्रह्मनिष्ठास्वरूपाद्योगात् यतयः यतनशीलाः शुद्धसत्त्वाः शुद्धं सत्त्वं येषां संन्यासयोगात्, ते शुद्धसत्त्वाः।", "audioFile": "PB_hear2read_000467.mp3", "sections": []}, {"id": "B_000468", "originalText": "ते ब्रह्मलोकेषु, संसारिणां ये मरणकालास्ते अपरान्तकालाः, तानपेक्ष्य मुमुक्षूणां संसारावसाने देहपरित्यागकालः परान्तकालः तस्मिन् परान्तकाले साधकानां बहुत्वाद्ब्रह्मैव लोको ब्रह्मलोकः एकोऽप्यनेकवद्दृश्यते प्राप्यते च।", "audioFile": "PB_hear2read_000468.mp3", "sections": []}, {"id": "B_000469", "originalText": "अतो बहुवचनं ब्रह्मलोकेष्विति, ब्रह्मणीत्यर्थः।", "audioFile": "PB_hear2read_000469.mp3", "sections": []}, {"id": "B_000470", "originalText": "परामृताः परम् अमृतम् अमरणधर्मकं ब्रह्म आत्मभूतं येषां ते परामृता जीवन्त एव ब्रह्मभूताः, परामृताः सन्तः परिमुच्यन्ति परि समन्तात् प्रदीपनिर्वाणवद्भिन्नघटाकाशवच्च निवृत्तिमुपयान्ति परिमुच्यन्ति परि समन्तान्मुच्यन्ते सर्वे, न देशान्तरं गन्तव्यमपेक्षन्ते।", "audioFile": "PB_hear2read_000470.mp3", "sections": []}, {"id": "B_000471", "originalText": "‘शकुनीनामिवाकाशे जले वारिचरस्य वा।", "audioFile": "PB_hear2read_000471.mp3", "sections": []}, {"id": "B_000472", "originalText": "पदं यथा न दृश्येत तथा ज्ञानवतां गतिः’ (मो.ध.१८१.९) ‘अनध्वगा अध्वसु पारयिष्णवः’ (?) इति श्रुतिस्मृतिभ्याम्, देशपरिच्छिन्ना हि गतिः संसारविषयैव, परिच्छिन्नसाधनसाध्यत्वात्।", "audioFile": "PB_hear2read_000472.mp3", "sections": []}, {"id": "B_000473", "originalText": "ब्रह्म तु समस्तत्वान्न देशपरिच्छेदेन गन्तव्यम्।", "audioFile": "PB_hear2read_000473.mp3", "sections": []}, {"id": "B_000474", "originalText": "यदि हि देशपरिच्छिन्नं ब्रह्म स्यात्, मूर्तद्रव्यवदाद्यन्तवदन्याश्रितं सावयवमनित्यं कृतकं च स्यात्।", "audioFile": "PB_hear2read_000474.mp3", "sections": []}, {"id": "B_000475", "originalText": "न त्वेवंविधं ब्रह्म भवितुमर्हति। अतस्तत्प्राप्तिश्च नैव देशपरिच्छिन्ना भवितुं युक्ता॥", "audioFile": "PB_hear2read_000475.mp3", "sections": []}, {"id": "B_000476", "originalText": "गताः कलाः पञ्चदश प्रतिष्ठा देवाश्च सर्वे प्रतिदेवतासु। कर्माणि विज्ञानमयश्च आत्मा परेऽव्यये सर्व एकीभवन्ति॥ ७॥", "audioFile": "PB_hear2read_000476.mp3", "sections": []}, {"id": "B_000477", "originalText": "अपि च, अविद्यादिसंसारबन्धापनयनमेव मोक्षमिच्छन्ति ब्रह्मविदः, न तु कार्यभूतम्।", "audioFile": "PB_hear2read_000477.mp3", "sections": []}, {"id": "B_000478", "originalText": "किञ्च, मोक्षकाले या देहारम्भिकाः कलाः प्राणाद्याः, ताः स्वाः प्रतिष्ठाः गताः स्वं स्वं कारणं गता भवन्तीत्यर्थः।", "audioFile": "PB_hear2read_000478.mp3", "sections": []}, {"id": "B_000479", "originalText": "प्रतिष्ठा इति द्वितीयाबहुवचनम्।", "audioFile": "PB_hear2read_000479.mp3", "sections": []}, {"id": "B_000480", "originalText": "पञ्चदश पञ्चदशसङ्ख्याका या अन्त्यप्रश्नपरिपठिताः प्रसिद्धाः, देवाश्च देहाश्रयाश्चक्षुरादिकरणस्थाः सर्वे प्रतिदेवतास्वादित्यादिषु गता भवन्तीत्यर्थः।", "audioFile": "PB_hear2read_000480.mp3", "sections": []}, {"id": "B_000481", "originalText": "यानि च मुमुक्षुणा कृतानि कर्माण्यप्रवृत्तफलानि, प्रवृत्तफलानामुपभोगेनैव क्षीणत्वात्।", "audioFile": "PB_hear2read_000481.mp3", "sections": []}, {"id": "B_000482", "originalText": "विज्ञानमयश्चात्मा अविद्याकृतबुद्ध्याद्युपाधिमात्मत्वेन गत्वा जलादिषु सूर्यादिप्रतिबिम्बवदिह प्रविष्टो देहभेदेषु कर्मणां तत्फलार्थत्वात्सह तेनैव विज्ञानमयेनात्मना, अतो विज्ञानमयो विज्ञानप्रायः।", "audioFile": "PB_hear2read_000482.mp3", "sections": []}, {"id": "B_000483", "originalText": "त एते कर्माणि विज्ञानमयश्च आत्मा उपाध्यपनये सति परे अव्यये अनन्तेऽक्षये ब्रह्मणि आकाशकल्पेऽजेऽजरेऽमृतेऽभयेऽपूर्वेऽनपरेऽनन्तरेऽबाह्येऽद्वये शिवे शान्ते सर्वे एकीभवन्ति अविशेषतां गच्छन्ति एकत्वमापद्यन्ते जलाद्याधारापनय इव सूर्यादिप्रतिबिम्बाः सूर्ये, घटाद्यपनय इवाकाशे घटाद्याकाशाः॥", "audioFile": "PB_hear2read_000483.mp3", "sections": []}, {"id": "B_000484", "originalText": "यथा नद्यः स्यन्दमानाः समुद्रेऽस्तं गच्छन्ति नामरूपे विहाय। तथा विद्वान्नामरूपाद्विमुक्तः परात्परं पुरुषमुपैति दिव्यम्॥ ८॥", "audioFile": "PB_hear2read_000484.mp3", "sections": []}, {"id": "B_000485", "originalText": "किञ्च, यथा नद्यः गङ्गाद्याः स्यन्दमानाः गच्छन्त्यः समुद्रे समुद्रं प्राप्य अस्तम् अदर्शनमविशेषात्मभावं गच्छन्ति प्राप्नुवन्ति नाम च रूपं च नामरूपे विहाय हित्वा, तथा अविद्याकृतनामरूपात् विमुक्तः सन् विद्वान् परात् अक्षरात्पूर्वोक्तात् परं दिव्यं पुरुषं यथोक्तलक्षणम् उपैति उपगच्छति॥", "audioFile": "PB_hear2read_000485.mp3", "sections": []}, {"id": "B_000486", "originalText": "स यो ह वै तत्परमं ब्रह्म वेद ब्रह्मैव भवति नास्याब्रह्मवित्कुले भवति। तरति शोकं तरति पाप्मानं गुहाग्रन्थिभ्यो विमुक्तोऽमृतो भवति॥ ९॥", "audioFile": "PB_hear2read_000486.mp3", "sections": []}, {"id": "B_000487", "originalText": "ननु श्रेयस्यनेके विघ्नाः प्रसिद्धाः, अतः क्लेशानामन्यतमेनान्येन वा देवादिना च विघ्नितो ब्रह्मविदप्यन्यां गतिं मृतो गच्छति न ब्रह्मैव, न, विद्ययैव सर्वप्रतिबन्धस्यापनीतत्वात्।", "audioFile": "PB_hear2read_000487.mp3", "sections": []}, {"id": "B_000488", "originalText": "अविद्याप्रतिबन्धमात्रो हि मोक्षो नान्यप्रतिबन्धः, नित्यत्वादात्मभूतत्वाच्च।", "audioFile": "PB_hear2read_000488.mp3", "sections": []}, {"id": "B_000489", "originalText": "तस्मात् सः यः कश्चित् ह वै लोके तत् परमं ब्रह्म वेद साक्षादहमेवास्मीति जानाति, स नान्यां गतिं गच्छति।", "audioFile": "PB_hear2read_000489.mp3", "sections": []}, {"id": "B_000490", "originalText": "देवैरपि तस्य ब्रह्मप्राप्तिं प्रति विघ्नो न शक्यते कर्तुम्, आत्मा ह्येषां स भवति।", "audioFile": "PB_hear2read_000490.mp3", "sections": []}, {"id": "B_000491", "originalText": "तस्माद्ब्रह्म विद्वान् ब्रह्मैव भवति।", "audioFile": "PB_hear2read_000491.mp3", "sections": []}, {"id": "B_000492", "originalText": "किञ्च, न अस्य विदुषः अब्रह्मवित् कुले भवति, किञ्च, तरति शोकम् अनेकेष्टवैकल्यनिमित्तं मानसं सन्तापं जीवन्नेवातिक्रान्तो भवति। तरति पाप्मानं धर्माधर्माख्यं गुहाग्रन्थिभ्यः हृदयाविद्याग्रन्थिभ्यः विमुक्तः सन् मृतः भवतीत्युक्तमेव ‘भिद्यते हृदयग्रन्थिः’ (मु.२.२.९) इत्यादि॥", "audioFile": "PB_hear2read_000492.mp3", "sections": []}, {"id": "B_000493", "originalText": "तदेतदृचाभ्युक्तम्—\nक्रियावन्तः श्रोत्रिया ब्रह्मनिष्ठाः स्वयं जुह्वत एकर्षिं श्रद्धयन्तः। तेषामेवैतां ब्रह्मविद्यां वदेत शिरोव्रतं विधिवद्यैस्तु चीर्णम्॥ १०॥", "audioFile": "PB_hear2read_000493.mp3", "sections": []}, {"id": "B_000494", "originalText": "अथेदानीं ब्रह्मविद्यासम्प्रदानविध्युपप्रदर्शनेनोपसंहारः क्रियते— तदेतत् विद्यासम्प्रदानविधानम् ऋचा मन्त्रेण अभ्युक्तम् अभिप्रकाशितम्।", "audioFile": "PB_hear2read_000494.mp3", "sections": []}, {"id": "B_000495", "originalText": "क्रियावन्तः यथोक्तकर्मानुष्ठानयुक्ताः।", "audioFile": "PB_hear2read_000495.mp3", "sections": []}, {"id": "B_000496", "originalText": "श्रोत्रियाः ब्रह्मनिष्ठाः अपरस्मिन्ब्रह्मण्यभियुक्ताः परं ब्रह्म बुभुत्सवः स्वयम् एकर्षिम् एकर्षिनामानमग्निं जुह्वते जुह्वति श्रद्धयन्तः श्रद्दधानाः सन्तः ये, तेषामेव संस्कृतात्मनां पात्रभूतानाम् एतां ब्रह्मविद्यां वदेत ब्रूयात् शिरोव्रतं शिरस्यग्निधारणलक्षणम्।", "audioFile": "PB_hear2read_000496.mp3", "sections": []}, {"id": "B_000497", "originalText": "यथा आथर्वणानां वेदव्रतं प्रसिद्धम्। यैस्तु यैश्च तत् चीर्णं विधिवत् यथाविधानं तेषामेव वदेत॥", "audioFile": "PB_hear2read_000497.mp3", "sections": []}, {"id": "B_000498", "originalText": "तदेतत्सत्यमृषिरङ्गिराः पुरोवाच नैतदचीर्णव्रतोऽधीते। नमः परमऋषिभ्यो नमः परमऋषिभ्यः॥ ११॥", "audioFile": "PB_hear2read_000498.mp3", "sections": []}, {"id": "B_000499", "originalText": "तदेतत् अक्षरं पुरुषं सत्यम् ऋषिः अङ्गिरा नाम पुरा पूर्वं शौनकाय विधिवदुपसन्नाय पृष्टवते उवाच।", "audioFile": "PB_hear2read_000499.mp3", "sections": []}, {"id": "B_000500", "originalText": "तद्वदन्योऽपि तथैव श्रेयोर्थिने मुमुक्षवे मोक्षार्थं विधिवदुपसन्नाय ब्रूयादित्यर्थः।", "audioFile": "PB_hear2read_000500.mp3", "sections": []}, {"id": "B_000501", "originalText": "न एतत् ग्रन्थरूपम् अचीर्णव्रतः अचरितव्रतोऽपि अधीते न पठति, चीर्णव्रतस्य हि विद्या फलाय संस्कृता भवतीति।", "audioFile": "PB_hear2read_000501.mp3", "sections": []}, {"id": "B_000502", "originalText": "समाप्ता ब्रह्मविद्या, सा येभ्यो ब्रह्मादिभ्यः पारम्पर्यक्रमेण सम्प्राप्ता, तेभ्यो नमः परमऋषिभ्यः।", "audioFile": "PB_hear2read_000502.mp3", "sections": []}, {"id": "B_000503", "originalText": "परमं ब्रह्म साक्षाद्दृष्टवन्तो ये ब्रह्मादयोऽवगतवन्तश्च, ते परमर्षयः तेभ्यो भूयोऽपि नमः। द्विर्वचनमत्यादरार्थं मुण्डकसमाप्त्यर्थं च॥", "audioFile": "PB_hear2read_000503.mp3", "sections": []}, {"id": "B_000504", "originalText": "इति तृतीयमुण्डके द्वितीयखण्डभाष्यम्॥", "audioFile": "PB_hear2read_000504.mp3", "sections": []}];
        const contentDiv = document.getElementById('content');
        const audioPlayer = document.getElementById('audio-player');
        
        const sidebar = document.getElementById('mySidebar');
        const overlay = document.getElementById('myOverlay');
        
        function toggleNav() {
            if (sidebar.style.width === "300px") {
                sidebar.style.width = "0";
                overlay.style.display = "none";
            } else {
                sidebar.style.width = "300px";
                overlay.style.display = "block";
            }
        }

        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            let val = parseInt(this.value);
            let rate = 1.0;
            if (val < 0) {
                rate = 1.0 + (val / 100);
            } else {
                rate = 1.0 + (val / 50); 
            }
            if (rate < 0.2) rate = 0.2;
            audioPlayer.playbackRate = rate;
            speedDisplay.innerText = rate.toFixed(1);
        };
        
        // Initialize speedDisplay
        speedSlider.oninput();
        
        let currentIndex = -1;

        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => playAudio(index);
            contentDiv.appendChild(div);
            
            if (item.sections && item.sections.length > 0) {
                item.sections.forEach(secTitle => {
                    const link = document.createElement('a');
                    link.href = "#";
                    link.innerText = secTitle;
                    link.onclick = (e) => {
                        e.preventDefault();
                        toggleNav();
                        playAudio(index);
                    };
                    sidebar.appendChild(link);
                });
            }
        });

        function playAudio(index) {
            if (index < 0 || index >= manifest.length) return;
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            const item = manifest[currentIndex];
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            if (item.audioFile) {
                audioPlayer.src = item.audioFile;
                
                // Re-calculate rate from slider
                let val = parseInt(document.getElementById('speed-slider').value);
                let rate = 1.0;
                if (val < 0) { rate = 1.0 + (val / 100); } 
                else { rate = 1.0 + (val / 50); }
                if (rate < 0.2) rate = 0.2;
                
                audioPlayer.playbackRate = rate;
                audioPlayer.play().catch(e => console.log("Audio play error:", e));
            } else {
                // Skip playing audio if none exists, but auto-advance after 2 seconds
                setTimeout(() => {
                    playAudio(index + 1);
                }, 2000);
            }
        }

        audioPlayer.onended = () => {
            playAudio(currentIndex + 1);
        };
    </script>
</body>
