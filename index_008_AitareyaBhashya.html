udioFile": "PB_000010.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000011", "originalText": "तथा च पूर्वोक्तानां देवतानामग्न्यादीनां संसारित्वं दर्शयिष्यत्यशनायादिदोषवत्त्वेन ‘तमशनायापिपासाभ्यामन्ववार्जत्’ (ऐ.१.२.१) इत्यादिना।", "padacchedaText": "", "audioFile": "PB_000011.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000012", "originalText": "अशनायादिमत्सर्वं संसार एव परस्य तु ब्रह्मणोऽशनायाद्यत्ययश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000012.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000013", "originalText": "भवत्वेवं केवलात्मज्ञानं मोक्षसाधनम्, न त्वत्राकर्म्येवाधिक्रियते, विशेषाश्रवणात्।", "padacchedaText": "", "audioFile": "PB_000013.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000014", "originalText": "अकर्मिण आश्रम्यन्तरस्येहाश्रवणात्।", "padacchedaText": "", "audioFile": "PB_000014.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000015", "originalText": "कर्म च बृहतीसहस्रलक्षणं प्रस्तुत्य अनन्तरमेवात्मज्ञानं प्रारभ्यते।", "padacchedaText": "", "audioFile": "PB_000015.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000016", "originalText": "तस्मात्कर्म्येवाधिक्रियते।", "padacchedaText": "", "audioFile": "PB_000016.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000017", "originalText": "न च कर्मासम्बन्ध्यात्मविज्ञानम्, पूर्ववदन्ते उपसंहारात्।", "padacchedaText": "", "audioFile": "PB_000017.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000018", "originalText": "यथा कर्मसम्बन्धिनः पुरुषस्य सूर्यात्मनः स्थावरजङ्गमादिसर्वप्राण्यात्मत्वमुक्तं ब्राह्मणेन मन्त्रेण च ‘सूर्य आत्मा’ (ऋ.सं.१.११५.१) इत्यादिना, तथैव ‘एष ब्रह्मैष इन्द्रः’ (बृ.३.१.३) इत्याद्युपक्रम्य सर्वप्राण्यात्मत्वम्।", "padacchedaText": "", "audioFile": "PB_000018.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000019", "originalText": "‘यच्च स्थावरम्, सर्वं तत्प्रज्ञानेत्रम्’ (बृ.३.१.३) इत्युपसंहरिष्यति।", "padacchedaText": "", "audioFile": "PB_000019.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000020", "originalText": "तथा च संहितोपनिषत्— ‘एतं ह्येव बह्वृचा महत्युक्थे मीमांसन्ते’ (ऐ.आ.३.२.३.१२) इत्यादिना कर्मसम्बन्धित्वमुक्त्वा ‘सर्वेषु भूतेष्वेतमेव ब्रह्मेत्याचक्षते’ इत्युपसंहरति।", "padacchedaText": "", "audioFile": "PB_000020.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000021", "originalText": "तथा तस्यैव ‘योऽयमशरीरः प्रज्ञात्मा’ इत्युक्तस्य ‘यश्चासावादित्य एकमेव तदिति विद्यात्’ इत्येकत्वमुक्तम्।", "padacchedaText": "", "audioFile": "PB_000021.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000022", "originalText": "इहापि ‘कोऽयमात्मा’ (ऐ.३.१.१) इत्युपक्रम्य प्रज्ञात्मत्वमेव ‘प्रज्ञानं ब्रह्म’ (ऐ.३.१.३) इति दर्शयिष्यति।", "padacchedaText": "", "audioFile": "PB_000022.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000023", "originalText": "तस्मान्नाकर्मसम्बन्ध्यात्मज्ञानम्।", "padacchedaText": "", "audioFile": "PB_000023.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000024", "originalText": "पुनरुक्त्यानर्थक्यमिति चेत्— ‘प्राणो वा अहमस्म्यृषे’ इत्यादिब्राह्मणेन ‘सूर्य आत्मा’ इति च मन्त्रेण निर्धारितस्यात्मनः ‘आत्मा वा इदम्’ इत्यादिब्राह्मणेन ‘कोऽयमात्मा’ (ऐ.३.१.१) इति प्रश्नपूर्वकं पुनर्निर्धारणं पुनरुक्तमनर्थकमिति चेत्, न, तस्यैव धर्मान्तरविशेषनिर्धारणार्थत्वान्न पुनरुक्ततादोषः।", "padacchedaText": "", "audioFile": "PB_000024.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000025", "originalText": "कथम्? तस्यैव कर्मसम्बन्धिनो जगत्सृष्टिस्थितिसंहारादिधर्मविशेषनिर्धारणार्थत्वात् केवलोपास्त्यर्थत्वाद्वा, अथवा, आत्मेत्यादिः परो ग्रन्थसन्दर्भः आत्मनः कर्मिणः कर्मणोऽन्यत्रोपासनाप्राप्तौ कर्मप्रस्तावेऽविहितत्वाद्वा केवलोऽप्यात्मोपास्य इत्येवमर्थः।", "padacchedaText": "", "audioFile": "PB_000025.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000026", "originalText": "भेदाभेदोपास्यत्वाच्च ‘एक एवात्मा’ कर्मविषये भेददृष्टिभाक्। स एवाकर्मकाले अभेदेनाप्युपास्य इत्येवमपुनरुक्तता॥", "padacchedaText": "", "audioFile": "PB_000026.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000027", "originalText": "‘विद्यां चाविद्यां च यस्तद्वेदोभयं सह।", "padacchedaText": "", "audioFile": "PB_000027.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000028", "originalText": "अविद्यया मृत्युं तीर्त्वा विद्ययामृतमश्नुते’ (ई.११) इति ‘कुर्वन्नेवेह कर्माणि जिजीविषेच्छतं समाः’ (ई.२) इति च वाजिनाम्।", "padacchedaText": "", "audioFile": "PB_000028.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000029", "originalText": "न च वर्षशतात्परमायुर्मर्त्यानाम्, येन कर्मपरित्यागेन आत्मानमुपासीत।", "padacchedaText": "", "audioFile": "PB_000029.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000030", "originalText": "दर्शितं च ‘तावन्ति पुरुषायुषोऽह्नां सहस्राणि भवन्ति’ इति।", "padacchedaText": "", "audioFile": "PB_000030.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000031", "originalText": "वर्षशतं चायुः कर्मणैव व्याप्तम्।", "padacchedaText": "", "audioFile": "PB_000031.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000032", "originalText": "दर्शितश्च मन्त्रः ‘कुर्वन्नेवेह कर्माणि’ इत्यादिः, तथा ‘यावज्जीवमग्निहोत्रं जुहोति’ ‘यावज्जीवं दर्शपूर्णमासाभ्यां यजेत’ इत्याद्याश्च, ‘तं यज्ञपात्रैर्दहन्ति’ इति च।", "padacchedaText": "", "audioFile": "PB_000032.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000033", "originalText": "ऋणत्रयश्रुतेश्च।", "padacchedaText": "", "audioFile": "PB_000033.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000034", "originalText": "तत्र हि पारिव्राज्यादिशास्त्रम् ‘व्युत्थायाथ भिक्षाचर्यं चरन्ति’ (बृ.३.५.१)(बृ.४.४.२२) इत्यात्मज्ञानस्तुतिपरोऽर्थवादोऽनधिकृतार्थो वा।", "padacchedaText": "", "audioFile": "PB_000034.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000035", "originalText": "न, परमार्थात्मविज्ञाने फलादर्शने क्रियानुपपत्तेः— यदुक्तं कर्मिण एव चात्मज्ञानं कर्मसम्बन्धि चेत्यादि, तन्न, परं ह्याप्तकामं सर्वसंसारदोषवर्जितं ब्रह्माहमस्मीत्यात्मत्वेन विज्ञाने, कृतेन कर्तव्येन वा प्रयोजनमात्मनोऽपश्यतः फलादर्शने क्रिया नोपपद्यते।", "padacchedaText": "", "audioFile": "PB_000035.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000036", "originalText": "फलादर्शनेऽपि नियुक्तत्वात्करोतीति चेत्, न, नियोगाविषयात्मदर्शनात्।", "padacchedaText": "", "audioFile": "PB_000036.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000037", "originalText": "इष्टयोगमनिष्टवियोगं वात्मनः प्रयोजनं पश्यंस्तदुपायार्थी यो भवति, स नियोगस्य विषयो दृष्टो लोके, न तु तद्विपरीतनियोगाविषयब्रह्मात्मत्वदर्शी।", "padacchedaText": "", "audioFile": "PB_000037.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000038", "originalText": "ब्रह्मात्मत्वदर्श्यपि संश्चेन्नियुज्येत, नियोगाविषयोऽपि सन्न कश्चिन्न नियुक्त इति सर्वं कर्म सर्वेण सर्वदा कर्तव्यं प्राप्नोति।", "padacchedaText": "", "audioFile": "PB_000038.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000039", "originalText": "तच्चानिष्टम्।", "padacchedaText": "", "audioFile": "PB_000039.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000040", "originalText": "न च स नियोक्तुं शक्यते केनचित्।", "padacchedaText": "", "audioFile": "PB_000040.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000041", "originalText": "आम्नायस्यापि तत्प्रभवत्वात्।", "padacchedaText": "", "audioFile": "PB_000041.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000042", "originalText": "न हि स्वविज्ञानोत्थेन वचसा स्वयं नियुज्यते।", "padacchedaText": "", "audioFile": "PB_000042.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000043", "originalText": "नापि बहुवित्स्वामी अविवेकिना भृत्येन।", "padacchedaText": "", "audioFile": "PB_000043.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000044", "originalText": "आम्नायस्य नित्यत्वे सति स्वातन्त्र्यात्सर्वान्प्रति नियोक्तृत्वसामर्थ्यमिति चेत्, न, उक्तदोषात्।", "padacchedaText": "", "audioFile": "PB_000044.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000045", "originalText": "तथापि सर्वेण सर्वदा सर्वमविशिष्टं कर्म कर्तव्यमित्युक्तो दोषोऽप्यपरिहार्य एव।", "padacchedaText": "", "audioFile": "PB_000045.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000046", "originalText": "तदपि शास्त्रेणैव विधीयत इति चेत्— यथा कर्मकर्तव्यता शास्त्रेण कृता, तथा तदप्यात्मज्ञानं तस्यैव कर्मिणः शास्त्रेण विधीयत इति चेत्, न, विरुद्धार्थबोधकत्वानुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_000046.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000047", "originalText": "न ह्येकस्मिन्कृताकृतसम्बन्धित्वं तद्विपरीतत्वं च बोधयितुं शक्यम्।", "padacchedaText": "", "audioFile": "PB_000047.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000048", "originalText": "शीतोष्णत्वमिवाग्नेः।", "padacchedaText": "", "audioFile": "PB_000048.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000049", "originalText": "न चेष्टयोगचिकीर्षा आत्मनोऽनिष्टवियोगचिकीर्षा च शास्त्रकृता, सर्वप्राणिनां तद्दर्शनात्।", "padacchedaText": "", "audioFile": "PB_000049.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000050", "originalText": "शास्त्रकृतं चेत्, तदुभयं गोपालादीनां न दृश्येत, अशास्त्रज्ञत्वात्तेषाम्।", "padacchedaText": "", "audioFile": "PB_000050.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000051", "originalText": "यद्धि स्वतोऽप्राप्तम्, तच्छास्त्रेण बोधयितव्यम्।", "padacchedaText": "", "audioFile": "PB_000051.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000052", "originalText": "तच्चेत्कृतकर्तव्यताविरोध्यात्मज्ञानं शास्त्रेण कृतम्, कथं तद्विरुद्धां कर्तव्यतां पुनरुत्पादयेत् शीततामिवाग्नौ, तम इव च भानौ? न बोधयत्येवेति चेत्, न, ‘स म आत्मेति विद्यात्’ (कौ.३.९) ‘प्रज्ञानं ब्रह्म’ (ऐ.३.१.३) इति चोपसंहारात्।", "padacchedaText": "", "audioFile": "PB_000052.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000053", "originalText": "‘तदात्मानमेवावेत्’ (बृ.१.४.९) ‘तत्त्वमसि’ (छा.६.८.७) इत्येवमादिवाक्यानां तत्परत्वात्।", "padacchedaText": "", "audioFile": "PB_000053.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000054", "originalText": "उत्पन्नस्य च ब्रह्मात्मविज्ञानस्याबाध्यमानत्वान्नानुत्पन्नं भ्रान्तं वा इति शक्यं वक्तुम्।", "padacchedaText": "", "audioFile": "PB_000054.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000055", "originalText": "त्यागेऽपि प्रयोजनाभावस्य तुल्यत्वमिति चेत् ‘नाकृतेनेह कश्चन’ (भ.गी.३.१८) इति स्मृतेः— य आहुर्विदित्वा ब्रह्म व्युत्थानमेव कुर्यादिति, तेषामप्येष समानो दोषः प्रयोजनाभाव इति चेत्, न, अक्रियामात्रत्वाद्व्युत्थानस्य।", "padacchedaText": "", "audioFile": "PB_000055.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000056", "originalText": "अविद्यानिमित्तो हि प्रयोजनस्य भावः, न वस्तुधर्मः, सर्वप्राणिनां तद्दर्शनात्, प्रयोजनतृष्णया च प्रेर्यमाणस्य वाङ्मनःकायैः प्रवृत्तिदर्शनात्, ‘सोऽकामयत जाया मे स्यात्’ (बृ.१.४.१७) इत्यादिना पुत्रवित्तादि पाङ्क्तलक्षणं काम्यमेवेति ‘उभे ह्येते साध्यसाधनलक्षणे एषणे एव’ (बृ.३.५.१) इति वाजसनेयिब्राह्मणेऽवधारणात्।", "padacchedaText": "", "audioFile": "PB_000056.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000057", "originalText": "अविद्याकामदोषनिमित्ताया वाङ्मनःकायप्रवृत्तेः पाङ्क्तलक्षणाया विदुषोऽविद्यादिदोषाभावादनुपपत्तेः क्रियाभावमात्रं व्युत्थानम्, न तु यागादिवदनुष्ठेयरूपं भावात्मकम्।", "padacchedaText": "", "audioFile": "PB_000057.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000058", "originalText": "तच्च विद्यावत्पुरुषधर्म इति न प्रयोजनमन्वेष्टव्यम्।", "padacchedaText": "", "audioFile": "PB_000058.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000059", "originalText": "न हि तमसि प्रवृत्तस्य उदित आलोके यद्गर्तपङ्ककण्टकाद्यपतनम्, तत्किम्प्रयोजनमिति प्रश्नार्हम्।", "padacchedaText": "", "audioFile": "PB_000059.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000060", "originalText": "व्युत्थानं तर्ह्यर्थप्राप्तत्वान्न चोदनार्थ इति।", "padacchedaText": "", "audioFile": "PB_000060.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000061", "originalText": "गार्हस्थ्ये चेत्परं ब्रह्मविज्ञानं जातम्, तत्रैवास्त्वकुर्वत आसनं न ततोऽन्यत्र गमनमिति चेत्, न, कामप्रयुक्तत्वाद्गार्हस्थ्यस्य।", "padacchedaText": "", "audioFile": "PB_000061.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000062", "originalText": "‘एतावान्वै कामः’ (बृ.१.४.१७) ‘उभे ह्येते एषणे एव’ (बृ.३.५.१)(बृ.४.४.२२) इत्यवधारणात् कामनिमित्तपुत्रवित्तादिसम्बन्धनियमाभावमात्रम्, न हि ततोऽन्यत्र गमनं व्युत्थानमुच्यते।", "padacchedaText": "", "audioFile": "PB_000062.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000063", "originalText": "अतो न गार्हस्थ्य एवाकुर्वत आसनमुत्पन्नविद्यस्य।", "padacchedaText": "", "audioFile": "PB_000063.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000064", "originalText": "एतेन गुरुशुश्रूषातपसोरप्यप्रतिपत्तिर्विदुषः सिद्धा।", "padacchedaText": "", "audioFile": "PB_000064.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000065", "originalText": "अत्र केचिद्गृहस्था भिक्षाटनादिभयात्परिभवाच्च त्रस्यमानाः सूक्ष्मदृष्टितां दर्शयन्त उत्तरमाहुः।", "padacchedaText": "", "audioFile": "PB_000065.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000066", "originalText": "भिक्षोरपि भिक्षाटनादिनियमदर्शनाद्देहधारणमात्रार्थिनो गृहस्थस्यापि साध्यसाधनैषणोभयविनिर्मुक्तस्य देहमात्रधारणार्थमशनाच्छादनमात्रमुपजीवतो गृह एवास्त्वासनमिति, न, स्वगृहविशेषपरिग्रहनियमस्य कामप्रयुक्तत्वादित्युक्तोत्तरमेतत्।", "padacchedaText": "", "audioFile": "PB_000066.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000067", "originalText": "स्वगृहविशेषपरिग्रहाभावे च शरीरधारणमात्रप्रयुक्ताशनाच्छादनार्थिनः स्वपरिग्रहविशेषभावेऽर्थाद्भिक्षुकत्वमेव।", "padacchedaText": "", "audioFile": "PB_000067.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000068", "originalText": "शरीरधारणार्थायां भिक्षाटनादिप्रवृत्तौ यथा नियमो भिक्षोः शौचादौ च, तथा गृहिणोऽपि विदुषोऽकामिनोऽस्तु नित्यकर्मसु नियमेन प्रवृत्तिर्यावज्जीवादिश्रुतिनियुक्तत्वात्प्रत्यवायपरिहारायेति।", "padacchedaText": "", "audioFile": "PB_000068.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000069", "originalText": "एतन्नियोगाविषयत्वेन विदुषः प्रत्युक्तमशक्यनियोज्यत्वाच्चेति।", "padacchedaText": "", "audioFile": "PB_000069.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000070", "originalText": "यावज्जीवादिनित्यचोदनानर्थक्यमिति चेत्, न, अविद्वद्विषयत्वेनार्थवत्त्वात्।", "padacchedaText": "", "audioFile": "PB_000070.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000071", "originalText": "यत्तु भिक्षोः शरीरधारणमात्रप्रवृत्तस्य प्रवृत्तेर्नियतत्वम्, तत्प्रवृत्तेर्न प्रयोजकम्।", "padacchedaText": "", "audioFile": "PB_000071.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000072", "originalText": "आचमनप्रवृत्तस्य पिपासापगमवन्नान्यप्रयोजनार्थत्वमवगम्यते।", "padacchedaText": "", "audioFile": "PB_000072.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000073", "originalText": "न चाग्निहोत्रादीनां तद्वदर्थप्राप्तप्रवृत्तिनियतत्वोपपत्तिः।", "padacchedaText": "", "audioFile": "PB_000073.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000074", "originalText": "अर्थप्राप्तप्रवृत्तिनियमोऽपि प्रयोजनाभावेऽनुपपन्न एवेति चेत्, न, तन्नियमस्य पूर्वप्रवृत्तिसिद्धत्वात्तदतिक्रमे यत्नगौरवादर्थप्राप्तस्य व्युत्थानस्य पुनर्वचनाद्विदुषो मुमुक्षोः कर्तव्यत्वोपपत्तिः।", "padacchedaText": "", "audioFile": "PB_000074.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000075", "originalText": "अविदुषापि मुमुक्षुणा पारिव्राज्यं कर्तव्यमेव, तथा च ‘शान्तो दान्तः’ (बृ.४.४.२३) इत्यादिवचनं प्रमाणम्।", "padacchedaText": "", "audioFile": "PB_000075.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000076", "originalText": "शमदमादीनां चात्मदर्शनसाधनानामन्याश्रमेष्वनुपपत्तेः।", "padacchedaText": "", "audioFile": "PB_000076.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000077", "originalText": "‘अत्याश्रमिभ्यः परमं पवित्रं प्रोवाच सम्यगृषिसङ्घजुष्टम्’ (श्वे.६.२१) इति च श्वेताश्वतरे विज्ञायते।", "padacchedaText": "", "audioFile": "PB_000077.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000078", "originalText": "‘न कर्मणा न प्रजया धनेन त्यागेनैके अमृतत्वमानशुः’ (कैवल्य२) इति च कैवल्यश्रुतिः।", "padacchedaText": "", "audioFile": "PB_000078.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000079", "originalText": "‘ज्ञात्वा नैष्कर्म्यमाचरेत्’ इति च स्मृतेः।", "padacchedaText": "", "audioFile": "PB_000079.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000080", "originalText": "‘ब्रह्माश्रमपदे वसेत्’ इति च ब्रह्मचर्यादिविद्यासाधनानां च साकल्येनात्याश्रमिषूपपत्तेर्गार्हस्थ्येऽसम्भवात्।", "padacchedaText": "", "audioFile": "PB_000080.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000081", "originalText": "न च असम्पन्नं साधनं कस्यचिदर्थस्य साधनायालम्।", "padacchedaText": "", "audioFile": "PB_000081.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000082", "originalText": "यद्विज्ञानोपयोगीनि च गार्हस्थ्याश्रमकर्माणि, तेषां परमफलमुपसंहृतं देवताप्ययलक्षणं संसारविषयमेव।", "padacchedaText": "", "audioFile": "PB_000082.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000083", "originalText": "यदि कर्मिण एव परमात्मविज्ञानमभविष्यत्, संसारविषयस्यैव फलस्योपसंहारो नोपापत्स्यत।", "padacchedaText": "", "audioFile": "PB_000083.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000084", "originalText": "अङ्गफलं तदिति चेत्, न, तद्विरोध्यात्मवस्तुविषयत्वादात्मविद्यायाः।", "padacchedaText": "", "audioFile": "PB_000084.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000085", "originalText": "निराकृतसर्वनामरूपकर्मपरमार्थात्मवस्तुविषयमात्मज्ञानममृतत्वसाधनम्।", "padacchedaText": "", "audioFile": "PB_000085.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000086", "originalText": "गुणफलसम्बन्धे हि निराकृतसर्वविशेषात्मवस्तुविषयत्वं ज्ञानस्य न प्राप्नोति, तच्चानिष्टम्, ‘यत्र त्वस्य सर्वमात्मैवाभूत्’ (बृ.२.४.१४) इत्यधिकृत्य क्रियाकारकफलादिसर्वव्यवहारनिराकरणाद्विदुषः, तद्विपरीतस्याविदुषः ‘यत्र हि द्वैतमिव भवति’ (बृ.२.४.१४) इत्युक्त्वा क्रियाकारकफलरूपस्य संसारस्य दर्शितत्वाच्च वाजसनेयिब्राह्मणे।", "padacchedaText": "", "audioFile": "PB_000086.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000087", "originalText": "तथेहापि देवताप्ययं संसारविषयं यत्फलमशनायादिमद्वस्त्वात्मकं तदुपसंहृत्य केवलं सर्वात्मकवस्तुविषयं ज्ञानममृतत्वाय वक्ष्यामीति प्रवर्तते।", "padacchedaText": "", "audioFile": "PB_000087.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000088", "originalText": "ऋणप्रतिबन्धश्चाविदुष एव मनुष्यपितृदेवलोकप्राप्तिं प्रति, न विदुषः, ‘सोऽयं मनुष्यलोकः पुत्रेणैव’ (बृ.१.५.१६) इत्यादिलोकत्रयसाधननियमश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000088.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000089", "originalText": "विदुषश्च ऋणप्रतिबन्धाभावो दर्शित आत्मलोकार्थिनः ‘किं प्रजया करिष्यामः’ (बृ.४.४.२२) इत्यादिना।", "padacchedaText": "", "audioFile": "PB_000089.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000090", "originalText": "तथा ‘एतद्ध स्म वै तद्विद्वांस आहुर्ऋषयः कावषेयाः’ इत्यादि ‘एतद्ध स्म वै तत्पूर्वे विद्वांसोऽग्निहोत्रं न जुहवाञ्चक्रुः’ (कौ.२.५) इति च कौषीतकिनाम्।", "padacchedaText": "", "audioFile": "PB_000090.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000091", "originalText": "अविदुषस्तर्हि ऋणानपाकरणे पारिव्राज्यानुपपत्तिरिति चेत्, न, प्राग्गार्हस्थ्यप्रतिपत्तेर्‌ऋणित्वासम्भवादधिकारानारूढोऽपि ऋणी चेत्स्यात्, सर्वस्य ऋणित्वमित्यनिष्टं प्रसज्येत।", "padacchedaText": "", "audioFile": "PB_000091.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000092", "originalText": "प्रतिपन्नगार्हस्थ्यस्यापि ‘गृहाद्वनी भूत्वा प्रव्रजेद्यदि वेतरथा ब्रह्मचर्यादेव प्रव्रर्जेद्गृहाद्वा वनाद्वा’ (जा.४) इत्यात्मदर्शनसाधनोपायत्वेनेष्यत एव पारिव्राज्यम्।", "padacchedaText": "", "audioFile": "PB_000092.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000093", "originalText": "यावज्जीवादिश्रुतीनामविद्वदमुमुक्षुविषये कृतार्थता।", "padacchedaText": "", "audioFile": "PB_000093.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000094", "originalText": "छान्दोग्ये च केषाञ्चिद्द्वादशरात्रमग्निहोत्रं हुत्वा तत ऊर्ध्वं परित्यागः श्रूयते।", "padacchedaText": "", "audioFile": "PB_000094.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000095", "originalText": "यत्त्वनधिकृतानां पारिव्राज्यमिति, तन्न, तेषां पृथगेव ‘उत्सन्नाग्निरनग्निको वा’ इत्यादिश्रवणात्, सर्वस्मृतिषु च अविशेषेण आश्रमविकल्पः प्रसिद्धः, समुच्चयश्च।", "padacchedaText": "", "audioFile": "PB_000095.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000096", "originalText": "यत्तु विदुषोऽर्थप्राप्तं व्युत्थानमित्यशास्त्रार्थत्वे, गृहे वने वा तिष्ठतो न विशेष इति, तदसत्।", "padacchedaText": "", "audioFile": "PB_000096.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000097", "originalText": "व्युत्थानस्यैवार्थप्राप्तत्वान्नान्यत्रावस्थानं स्यात्।", "padacchedaText": "", "audioFile": "PB_000097.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000098", "originalText": "अन्यत्रावस्थानस्य कामकर्मप्रयुक्तत्वं ह्यवोचाम, तदभावमात्रं व्युत्थानमिति च।", "padacchedaText": "", "audioFile": "PB_000098.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000099", "originalText": "यथाकामित्वं तु विदुषोऽत्यन्तमप्राप्तम्, अत्यन्तमूढविषयत्वेनावगमात्।", "padacchedaText": "", "audioFile": "PB_000099.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000100", "originalText": "तथा शास्त्रचोदितमपि कर्मात्मविदोऽप्राप्तं गुरुभारतयावगम्यते, किमुत अत्यन्ताविवेकनिमित्तं यथाकामित्वम्? न ह्युन्मादतिमिरदृष्ट्युपलब्धं वस्तु तदपगमेऽपि तथैव स्यात्, उन्मादतिमिरदृष्टिनिमित्तत्वादेव तस्य।", "padacchedaText": "", "audioFile": "PB_000100.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000101", "originalText": "तस्मादात्मविदो व्युत्थानव्यतिरेकेण न यथाकामित्वम्, न चान्यत्कर्तव्यमित्येतत्सिद्धम्।", "padacchedaText": "", "audioFile": "PB_000101.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000102", "originalText": "यत्तु ‘विद्यां चाविद्यां च यस्तद्वेदोभयं सह’ (ई.११) इति न विद्यावतो विद्यया सहाविद्यापि वर्तत इत्ययमर्थः, कस्तर्हि? एकस्मिन्पुरुषे एते न सह सम्बध्येयातामित्यर्थः, यथा शुक्तिकायां रजतशुक्तिकाज्ञाने एकस्य पुरुषस्य।", "padacchedaText": "", "audioFile": "PB_000102.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000103", "originalText": "‘दूरमेते विपरीते विषूची अविद्या या च विद्येति ज्ञाता’ (क.१.२.४) इति हि काठके।", "padacchedaText": "", "audioFile": "PB_000103.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000104", "originalText": "तस्मान्न विद्यायां सत्यामविद्यायाः सम्भवोऽस्ति।", "padacchedaText": "", "audioFile": "PB_000104.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000105", "originalText": "‘तपसा ब्रह्म विजिज्ञासस्व’ (तै.३.२.२) इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000105.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000106", "originalText": "तपआदि विद्योत्पत्तिसाधनं गुरूपासनादि च कर्म अविद्यात्मकत्वादविद्योच्यते।", "padacchedaText": "", "audioFile": "PB_000106.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000107", "originalText": "तेन विद्यामुत्पाद्य मृत्युं काममतितरति।", "padacchedaText": "", "audioFile": "PB_000107.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000108", "originalText": "ततो निष्कामस्त्यक्तैषणो ब्रह्मविद्यया अमृतत्वमश्नुत इत्येतमर्थं दर्शनयन्नाह— ‘अविद्यया मृत्युं तीर्त्वा विद्ययामृतमश्नुते’ (ई.११) इति।", "padacchedaText": "", "audioFile": "PB_000108.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000109", "originalText": "यत्तु पुरुषायुः सर्वं कर्मणैव व्याप्तम्, ‘कुर्वन्नेवेह कर्माणि जिजीविषेच्छतं समाः’ (ई.२) इति, तदविद्वद्विषयत्वेन परिहृतम्, इतरथा असम्भवात्।", "padacchedaText": "", "audioFile": "PB_000109.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000110", "originalText": "यत्तु वक्ष्यमाणमपि पूर्वोक्ततुल्यत्वात्कर्मणा अविरुद्धमात्मज्ञानमिति, तत्सविशेषनिर्विशेषात्मविषयतया प्रत्युक्तम्, उत्तरत्र व्याख्याने च दर्शयिष्यामः। अतः केवलनिष्क्रियब्रह्मात्मैकत्वविद्याप्रदर्शनार्थमुत्तरो ग्रन्थ आरभ्यते॥", "padacchedaText": "", "audioFile": "PB_000110.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000111", "originalText": "आत्मा वा इदमेक एवाग्र आसीत्।", "padacchedaText": "", "audioFile": "PB_000111.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000112", "originalText": "नान्यत्किञ्चन मिषत्। स ईक्षत लोकान्नु सृजा इति॥ १॥", "padacchedaText": "", "audioFile": "PB_000112.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000113", "originalText": "आत्मेति।", "padacchedaText": "", "audioFile": "PB_000113.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000114", "originalText": "आत्मा आप्नोतेरत्तेरततेर्वा परः सर्वज्ञः सर्वशक्तिरशनायादिसर्वसंसारधर्मवर्जितो नित्यत्यशुद्धबुद्धमुक्तस्वभावोऽजोऽजरोऽमरोऽमृतोऽभयोऽद्वयो वै।", "padacchedaText": "", "audioFile": "PB_000114.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000115", "originalText": "इदं यदुक्तं नामरूपकर्मभेदभिन्नं जगत् आत्मैव एकः अग्रे जगतः सृष्टेः प्राक् आसीत्।", "padacchedaText": "", "audioFile": "PB_000115.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000116", "originalText": "किं नेदानीं स एवैकः? न।", "padacchedaText": "", "audioFile": "PB_000116.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000117", "originalText": "कथं तर्हि आसीदित्युच्यते? यद्यपीदानीं स एवैकः, तथाप्यस्ति विशेषः।", "padacchedaText": "", "audioFile": "PB_000117.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000118", "originalText": "प्रागुत्पत्तेः अव्याकृतनामरूपभेदमात्मभूतमात्मैकशब्दप्रत्ययगोचरं जगत् इदानीं व्याकृतनामरूपभेदत्वादनेकशब्दप्रत्ययगोचरमात्मैकशब्दप्रत्ययगोचरं चेति विशेषः।", "padacchedaText": "", "audioFile": "PB_000118.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000119", "originalText": "यथा सलिलात्पृथक् फेननामरूपव्याकरणात्प्राक्सलिलैकशब्दप्रत्ययगोचरमेव फेनम्, यदा सलिलात्पृथङ् नामरूपभेदेन व्याकृतं भवति, तदा सलिलं फेनं चेति अनेकशब्दप्रत्ययभाक् सलिलमेवेति चैकशब्दप्रत्ययभाक्च फेनं भवति, तद्वत्।", "padacchedaText": "", "audioFile": "PB_000119.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000120", "originalText": "न अन्यत्किञ्चन न किञ्चिदपि मिषत् निमिषद्व्यापारवदितरद्वा।", "padacchedaText": "", "audioFile": "PB_000120.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000121", "originalText": "यथा साङ्‍ख्यानामनात्मपक्षपाति स्वतन्त्रं प्रधानम्, यथा च काणादानामणवः, न तद्वदिहान्यदात्मनः किञ्चिदपि वस्तु विद्यते।", "padacchedaText": "", "audioFile": "PB_000121.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000122", "originalText": "किं तर्हि? आत्मैवैक आसीदित्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_000122.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000123", "originalText": "सः सर्वज्ञस्वाभाव्यात् आत्मा एक एव सन् ईक्षत।", "padacchedaText": "", "audioFile": "PB_000123.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000124", "originalText": "ननु प्रागुत्पत्तेरकार्यकरणत्वात्कथमीक्षितवान्? नायं दोषः, सर्वज्ञस्वाभाव्यात्।", "padacchedaText": "", "audioFile": "PB_000124.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000125", "originalText": "तथा च मन्त्रवर्णः— ‘अपाणिपादो जवनो ग्रहीता’ (श्वे.३.२९) इत्यादिः। केनाभिप्रायेणेत्याह— लोकान् अम्भःप्रभृतीन्प्राणिकर्मफलोपभोगस्थानभूतान् नु सृजै सृजेऽहम् इति॥", "padacchedaText": "", "audioFile": "PB_000125.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000126", "originalText": "स इमांल्लोकानसृजत।", "padacchedaText": "", "audioFile": "PB_000126.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000127", "originalText": "अम्भो मरीचीर्मरमापोऽदोऽम्भः परेण दिवं द्यौः प्रतिष्ठान्तरिक्षं मरीचयः। पृथिवी मरो या अधस्तात्ता आपः॥ २॥", "padacchedaText": "", "audioFile": "PB_000127.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000128", "originalText": "एवमीक्षित्वा आलोच्य सः आत्मा इमान् लोकान् असृजत सृष्टवान्।", "padacchedaText": "", "audioFile": "PB_000128.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000129", "originalText": "यथेह बुद्धिमांस्तक्षादिः एवंप्रकारान्प्रासादादीन्सृजे इतीक्षित्वा ईक्षानन्तरं प्रासादादीन्सृजति, तद्वत्।", "padacchedaText": "", "audioFile": "PB_000129.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000130", "originalText": "ननु सोपादानस्तक्षादिः प्रासादादीन्सृजतीति युक्तम्, निरुपादानस्त्वात्मा कथं लोकान्सृजतीति? नैष दोषः।", "padacchedaText": "", "audioFile": "PB_000130.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000131", "originalText": "सलिलफेनस्थानीये आत्मभूते नामरूपे अव्याकृते आत्मैकशब्दवाच्ये व्याकृतफेनस्थानीयस्य जगतः उपादानभूते सम्भवतः।", "padacchedaText": "", "audioFile": "PB_000131.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000132", "originalText": "तस्मादात्मभूतनामरूपोपादानभूतः सन् सर्वज्ञो जगन्निर्मिमीते इत्यविरुद्धम्।", "padacchedaText": "", "audioFile": "PB_000132.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000133", "originalText": "अथवा, विज्ञानवान्यथा मायावी निरुपादानः आत्मानमेव आत्मान्तरत्वेन आकाशेन गच्छन्तमिव निर्मिमीते, तथा सर्वज्ञो देवः सर्वशक्तिर्महामायः आत्मानमेव आत्मान्तरत्वेन जगद्रूपेण निर्मिमीते इति युक्ततरम्।", "padacchedaText": "", "audioFile": "PB_000133.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000134", "originalText": "एवं च सति कार्यकारणोभयासद्वाद्यादिपक्षाश्च न प्रसज्जन्ते, सुनिराकृताश्च भवन्ति।", "padacchedaText": "", "audioFile": "PB_000134.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000135", "originalText": "कान् लोकानसृजतेत्याह— अम्भो मरीचीर्मरमापः इति।", "padacchedaText": "", "audioFile": "PB_000135.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000136", "originalText": "आकाशादिक्रमेण अण्डमुत्पाद्य अम्भःप्रभृतीन् लोकानसृजत।", "padacchedaText": "", "audioFile": "PB_000136.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000137", "originalText": "तत्र अम्भःप्रभृतीन्स्वयमेव व्याचष्टे श्रुतिः।", "padacchedaText": "", "audioFile": "PB_000137.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000138", "originalText": "अदः तत् अम्भःशब्दवाच्यो लोकः, परेण दिवं द्युलोकात्परेण परस्तात्, सोऽम्भःशब्दवाच्यः, अम्भोभरणात्।", "padacchedaText": "", "audioFile": "PB_000138.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000139", "originalText": "द्यौः प्रतिष्ठा आश्रयः तस्याम्भसो लोकस्य।", "padacchedaText": "", "audioFile": "PB_000139.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000140", "originalText": "द्युलोकादधस्तात् अन्तरिक्षं यत्, तत् मरीचयः।", "padacchedaText": "", "audioFile": "PB_000140.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000141", "originalText": "एकोऽपि अनेकस्थानभेदत्वाद्बहुवचनभाक्— मरीचय इति, मरीचिभिर्वा रश्मिभिः सम्बन्धात्।", "padacchedaText": "", "audioFile": "PB_000141.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000142", "originalText": "पृथिवी मरः— म्रियन्ते अस्मिन् भूतानीति।", "padacchedaText": "", "audioFile": "PB_000142.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000143", "originalText": "याः अधस्तात् पृथिव्याः, ताः आपः उच्यन्ते, आप्नोतेः, लोकाः। यद्यपि पञ्चभूतात्मकत्वं लोकानाम्, तथापि अब्बाहुल्यात् अब्नामभिरेव अम्भो मरीचीर्मरमापः इत्युच्यन्ते॥", "padacchedaText": "", "audioFile": "PB_000143.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000144", "originalText": "स ईक्षतेमे नु लोका लोकपालान्नु सृजा इति। सोऽद्भ्य एव पुरुषं समुद्धृत्यामूर्छयत्॥ ३॥", "padacchedaText": "", "audioFile": "PB_000144.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000145", "originalText": "सर्वप्राणिकर्मफलोपादानाधिष्ठानभूतांश्चतुरो लोकान्सृष्ट्वा सः ईश्वरः पुनरेव ईक्षत— इमे नु तु अम्भःप्रभृतयः मया सृष्टा लोकाः परिपालयितृवर्जिता विनश्येयुः, तस्मादेषां रक्षणार्थं लोकपालान् लोकानां पालयितॄन् नु सृजै सृजेऽहम् इति।", "padacchedaText": "", "audioFile": "PB_000145.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000146", "originalText": "एवमीक्षित्वा सः अद्भ्य एव अप्प्रधानेभ्य एव पञ्चभूतेभ्यः, येभ्योऽम्भःप्रभृतीन्सृष्टवान्, तेभ्य एवेत्यर्थः, पुरुषं पुरुषाकारं शिरःपाण्यादिमन्तं समुद्धृत्य अद्भ्यः समुपादाय, मृत्पिण्डमिव कुलालः पृथिव्याः, अमूर्छयत् मूर्छितवान्, सम्पिण्डितवान्स्वावयवसंयोजनेनेत्यर्थः॥", "padacchedaText": "", "audioFile": "PB_000146.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000147", "originalText": "तमभ्यतपत्तस्याभितप्तस्य मुखं निरभिद्यत यथाण्डं मुखाद्वाग्वाचोऽग्निर्नासिके निरभिद्येतां नासिकाभ्यां प्राणः प्राणाद्वायुरक्षिणी निरभिद्येतामक्षिभ्यां चक्षुश्चक्षुष आदित्यः कर्णौ निरभिद्येतां कर्णाभ्यां श्रोत्रं श्रोत्राद्दिशस्त्वङ् निरभिद्यत त्वचो लोमानि लोमभ्य ओषधिवनस्पतयो हृदयं निरभिद्यत हृदयान्मनो मनसश्चन्द्रमा नाभिर्निरभिद्यत नाभ्या अपानोऽपानान्मृत्युः शिश्नं निरभिद्यत शिश्नाद्रेतो रेतस आपः॥ ४॥", "padacchedaText": "", "audioFile": "PB_000147.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000148", "originalText": "इति प्रथमः खण्डः॥", "padacchedaText": "", "audioFile": "PB_000148.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000149", "originalText": "तं पिण्डं पुरुषविधमुद्दिश्य अभ्यतपत्, तदभिध्यानं सङ्कल्पं कृतवानित्यर्थः, ‘यस्य ज्ञानमयं तपः’ (मु.१.१.९) इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000149.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000150", "originalText": "तस्य अभितप्तस्य ईश्वरसङ्कल्पेन तपसाभितप्तस्य पिण्डस्य मुखं निरभिद्यत मुखाकारं सुषिरमजायत, यथा पक्षिणः अण्डं निर्भिद्यते एवम्।", "padacchedaText": "", "audioFile": "PB_000150.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000151", "originalText": "तस्माच्च निर्भिण्णात् मुखात् वाक् करणमिन्द्रियं निरवर्तत, तदधिष्ठाता अग्निः, ततो वाचः, लोकपालः।", "padacchedaText": "", "audioFile": "PB_000151.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000152", "originalText": "तथा नासिके निरभिद्येताम्।", "padacchedaText": "", "audioFile": "PB_000152.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000153", "originalText": "नासिकाभ्यां प्राणः, प्राणाद्वायुः, इति सर्वत्राधिष्ठानं करणं देवता च— त्रयं क्रमेण निर्भिण्णमिति।", "padacchedaText": "", "audioFile": "PB_000153.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000154", "originalText": "अक्षिणी, कर्णौ, त्वक्, हृदयमन्तःकरणाधिष्ठानम्, मनः अन्तःकरणम्, नाभिः सर्वप्राणबन्धनस्थानम्।", "padacchedaText": "", "audioFile": "PB_000154.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000155", "originalText": "अपानसंयुक्तत्वात् अपान इति पाय्विन्द्रियमुच्यते, तस्मात् तस्याधिष्ठात्री देवता मृत्युः।", "padacchedaText": "", "audioFile": "PB_000155.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000156", "originalText": "यथा अन्यत्र, तथा शिश्नं निरभिद्यत प्रजननेन्द्रियस्थानम्।", "padacchedaText": "", "audioFile": "PB_000156.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000157", "originalText": "इन्द्रियं रेतः रेतोविसर्गार्थत्वात्सह रेतसोच्यते। रेतस आपः इति॥", "padacchedaText": "", "audioFile": "PB_000157.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000158", "originalText": "इति प्रथमखण्डभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000158.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000159", "originalText": "द्वितीयः खण्डः\nता एता देवताः सृष्टा अस्मिन्महत्यर्णवे प्रापतंस्तमशनायापिपासाभ्यामन्ववार्जत्ता एनमब्रुवन्नायतनं नः प्रजानीहि यस्मिन्प्रतिष्ठिता अन्नमदामेति॥ १॥", "padacchedaText": "", "audioFile": "PB_000159.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000160", "originalText": "ता एता अग्न्यादयो देवताः लोकपालत्वेन सङ्कल्प्य सृष्टा ईश्वरेण अस्मिन् संसारार्णवे संसारसमुद्रे महति अविद्याकामकर्मप्रभवदुःखोदके तीव्ररोगजरामृत्युमहाग्राहे अनादौ अनन्ते अपारे निरालम्बे विषयेन्द्रियजनितसुखलवलक्षणविश्रामे पञ्चेन्द्रियार्थतृण्मारुतविक्षोभोत्थितानर्थशतमहोर्मौ महारौरवाद्यनेकनिरयगतहाहेत्यादिकूजिताक्रोशनोद्भूतमहारवे सत्यार्जवदानदयाऽहिंसाशमदमधृत्याद्यात्मगुणपाथेयपूर्णज्ञानोडुपे सत्सङ्गसर्वत्यागमार्गे मोक्षतीरे एतस्मिन् महत्यर्णवे प्रापतन् पतितवत्यः।", "padacchedaText": "", "audioFile": "PB_000160.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000161", "originalText": "तस्मादग्न्यादिदेवताप्ययलक्षणापि या गतिर्व्याख्याता ज्ञानकर्मसमुच्चयानुष्ठानफलभूता, सापि नालं संसारदुःखोपशमायेत्ययं विवक्षितोऽर्थोऽत्र।", "padacchedaText": "", "audioFile": "PB_000161.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000162", "originalText": "यत एवम्, तस्मादेवं विदित्वा, परं ब्रह्म, आत्मा आत्मनः सर्वभूतानां च, यो वक्ष्यमाणविशेषणः प्रकृतश्च जगदुत्पत्तिस्थितिसंहारहेतुत्वेन, स सर्वसंसारदुःखोपशमनाय वेदितव्यः।", "padacchedaText": "", "audioFile": "PB_000162.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000163", "originalText": "तस्मात् ‘एष पन्था एतत्कर्मैतद्ब्रह्मैतत्सत्यम्’ (ऐ.२.१.१) यदेतत्परब्रह्मात्मज्ञानम्, ‘नान्यः पन्था विद्यतेऽयनाय’ (श्वे.३.८)(श्वे.६.१५) इति मन्त्रवर्णात्।", "padacchedaText": "", "audioFile": "PB_000163.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000164", "originalText": "तं स्थानकरणदेवतोत्पत्तिबीजभूतं पुरुषं प्रथमोत्पादितं पिण्डमात्मानम् अशनायापिपासाभ्याम् अन्ववार्जत् अनुगमितवान् संयोजितवानित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000164.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000165", "originalText": "तस्य कारणभूतस्य अशनायादिदोषवत्त्वात् तत्कार्यभूतानामपि देवतानामशनायादिमत्त्वम्।", "padacchedaText": "", "audioFile": "PB_000165.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000166", "originalText": "ताः ततः अशनायापिपासाभ्यां पीड्यमानाः एनं पितामहं स्रष्टारम् अब्रुवन् उक्तवत्यः। आयतनम् अधिष्ठानं नः अस्मभ्यं प्रजानीहि विधत्स्व, यस्मिन् आयतने प्रतिष्ठिताः समर्थाः सत्यः अन्नम् अदाम भक्षयाम इति॥", "padacchedaText": "", "audioFile": "PB_000166.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000167", "originalText": "ताभ्यो गामानयत्ता अब्रुवन्न वै नोऽयमलमिति। ताभ्योऽश्वमानयत्ता अब्रुवन्न वै नोऽयमलमिति॥ २॥", "padacchedaText": "", "audioFile": "PB_000167.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000168", "originalText": "एवमुक्त ईश्वरः ताभ्यः देवताभ्यः गां गवाकृतिविशिष्टं पिण्डं ताभ्य एवाद्भ्यः पूर्ववत्पिण्डं समुद्धृत्य मूर्छयित्वा आनयत् दर्शितवान्।", "padacchedaText": "", "audioFile": "PB_000168.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000169", "originalText": "ताः पुनः गवाकृतिं दृष्ट्वा अब्रुवन्।", "padacchedaText": "", "audioFile": "PB_000169.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000170", "originalText": "न वै नः अस्मदर्थम् अधिष्ठाय अन्नमत्तुम् अयं पिण्डः अलं न वै।", "padacchedaText": "", "audioFile": "PB_000170.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000171", "originalText": "अलं पर्याप्तः।", "padacchedaText": "", "audioFile": "PB_000171.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000172", "originalText": "अत्तुं न योग्य इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000172.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000173", "originalText": "गवि प्रत्याख्याते तथैव ताभ्यः अश्वम् आनयत्। ता अब्रुवन्— न वै नोऽयमलमिति, पूर्ववत्॥", "padacchedaText": "", "audioFile": "PB_000173.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000174", "originalText": "ताभ्यः पुरुषमानयत्ता अब्रुवन्सु कृतं बतेति पुरुषो वाव सुकृतम्। ता अब्रवीद्यथायतनं प्रविशतेति॥ ३॥", "padacchedaText": "", "audioFile": "PB_000174.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000175", "originalText": "सर्वप्रत्याख्याने ताभ्यः पुरुषमानयत् स्वयोनिभूतम्।", "padacchedaText": "", "audioFile": "PB_000175.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000176", "originalText": "ताः स्वयोनिं पुरुषं दृष्ट्वा अखिन्नाः सत्यः सु कृतं शोभनं कृतम् इदमधिष्ठानं बत इति अब्रुवन्।", "padacchedaText": "", "audioFile": "PB_000176.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000177", "originalText": "तस्मात्पुरुषो वाव पुरुष एव सुकृतम्, सर्वपुण्यकर्महेतुत्वात्, स्वयं वा स्वेनैवात्मना स्वमायाभिः कृतत्वात्सुकृतमित्युच्यते। ताः देवताः ईश्वरः अब्रवीत् इष्टमासामिदमधिष्ठानमिति मत्वा— सर्वे हि स्वयोनिषु रमन्ते, अतः यथायतनं यस्य यत् वदनादिक्रियायोग्यमायतनम्, तत् प्रविशत इति॥", "padacchedaText": "", "audioFile": "PB_000177.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000178", "originalText": "अग्निर्वाग्भूत्वा मुखं प्राविशद्वायुः प्राणो भूत्वा नासिके प्राविशदादित्यश्चक्षुर्भूत्वाक्षिणी प्राविशद्दिशः श्रोत्रं भूत्वा कर्णौ प्राविशन्नोषधिवनस्पतयो लोमानि भूत्वा त्वचं प्राविशंश्चन्द्रमा मनो भूत्वा हृदयं प्राविशन्मृत्युरपानो भूत्वा नाभिं प्राविशदापो रेतो भूत्वा शिश्नं प्राविशन्॥ ४॥", "padacchedaText": "", "audioFile": "PB_000178.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000179", "originalText": "तथास्त्वित्यनुज्ञां प्रतिलभ्येश्वरस्य नगर्यामिव बलाधिकृतादयः अग्निः वागभिमानी वागेव भूत्वा स्वयोनिं मुखं प्राविशत् तथोक्तार्थमन्यत्। वायुर्नासिके, आदित्योऽक्षिणी, दिशः कर्णौ, ओषधिवनस्पतयस्त्वचम्, चन्द्रमा हृदयम्, मृत्युर्नाभिम्, आपः शिश्नम्, प्राविशन्॥", "padacchedaText": "", "audioFile": "PB_000179.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000180", "originalText": "तमशनायापिपासे अब्रूतामावाभ्यामभिप्रजानीहीति।", "padacchedaText": "", "audioFile": "PB_000180.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000181", "originalText": "ते अब्रवीदेतास्वेव वां देवतास्वाभजाम्येतासु भागिन्यौ करोमीति। तस्माद्यस्यै कस्यै च देवतायै हविर्गृह्यते भागिन्यावेवास्यामशनायापिपासे भवतः॥ ५॥", "padacchedaText": "", "audioFile": "PB_000181.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000182", "originalText": "एवं लब्धाधिष्ठानासु देवतासु निरधिष्ठाने सत्यौ अशनायापिपासे तम् ईश्वरम् अब्रूताम् उक्तवत्यौ— आवाभ्याम् अधिष्ठानम् अभिप्रजानीहि चिन्तय विधत्स्वेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000182.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000183", "originalText": "स ईश्वर एवमुक्तः ते अशनायापिपासे अब्रवीत्।", "padacchedaText": "", "audioFile": "PB_000183.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000184", "originalText": "न हि युवयोर्भावरूपत्वाच्चेतनावद्वस्त्वनाश्रित्य अन्नात्तृत्वं सम्भवति।", "padacchedaText": "", "audioFile": "PB_000184.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000185", "originalText": "तस्मात् एतास्वेव अग्न्याद्यासु वां युवां देवतासु अध्यात्माधिदेवतासु आभजामि वृत्तिसंविभागेनानुगृह्णामि।", "padacchedaText": "", "audioFile": "PB_000185.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000186", "originalText": "एतासु भागिन्यौ यद्देवत्यो यो भागो हविरादिलक्षणः स्यात्, तस्यास्तेनैव भागेन भागिन्यौ भागवत्यौ वां करोमीति।", "padacchedaText": "", "audioFile": "PB_000186.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000187", "originalText": "सृष्ट्यादावीश्वर एवं व्यदधाद्यस्मात्, तस्मात् इदानीमपि यस्यै कस्यै च देवतायै देवताया अर्थाय हविर्गृह्यते चरुपुरोडाशादिलक्षणं भागिन्यौ एव भागवत्यावेव अस्यां देवतायाम् अशनायापिपासे भवतः॥", "padacchedaText": "", "audioFile": "PB_000187.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000188", "originalText": "इति द्वितीयखण्डभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000188.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000189", "originalText": "तृतीयः खण्डः\nस ईक्षतेमे नु लोकाश्च लोकपालाश्चान्नमेभ्यः सृजा इति॥ १॥", "padacchedaText": "", "audioFile": "PB_000189.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000190", "originalText": "सः एवमीश्वरः ईक्षत।", "padacchedaText": "", "audioFile": "PB_000190.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000191", "originalText": "कथम्? इमे नु लोकाश्च लोकपालाश्च मया सृष्टाः, अशनायापिपासाभ्यां च संयोजिताः।", "padacchedaText": "", "audioFile": "PB_000191.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000192", "originalText": "अतो नैषां स्थितिरन्नमन्तरेण।", "padacchedaText": "", "audioFile": "PB_000192.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000193", "originalText": "तस्मात् अन्नम् एभ्यः लोकपालेभ्यः सृजै सृजे इति।", "padacchedaText": "", "audioFile": "PB_000193.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000194", "originalText": "एवं हि लोके ईश्वराणामनुग्रहे निग्रहे च स्वातन्त्र्यं दृष्टं स्वेषु। तद्वन्महेश्वरस्यापि सर्वेश्वरत्वात्सर्वान्प्रति निग्रहे अनुग्रहे च स्वातन्त्र्यमेव॥", "padacchedaText": "", "audioFile": "PB_000194.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000195", "originalText": "सोऽपोऽभ्यतपत्ताभ्योऽभितप्ताभ्यो मूर्तिरजायत। या वै सा मूर्तिरजायतान्नं वै तत्॥ २॥", "padacchedaText": "", "audioFile": "PB_000195.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000196", "originalText": "सः ईश्वरः अन्नं सिसृक्षुः ता एव पूर्वोक्ता अपः उद्दिश्य अभ्यतपत्।", "padacchedaText": "", "audioFile": "PB_000196.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000197", "originalText": "ताभ्यः अभितप्ताभ्यः उपादानभूताभ्यः मूर्तिः घनरूपं धारणसमर्थं चराचरलक्षणम् अजायत उत्पन्नम्। अन्नं वै तत् मूर्तिरूपं या वै सा मूर्तिरजायत॥", "padacchedaText": "", "audioFile": "PB_000197.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000198", "originalText": "तदेनदभिसृष्टं पराङत्यजिघांसत्तद्वाचाजिघृक्षत्तन्नाशक्नोद्वाचा ग्रहीतुम्। स यद्धैनद्वाचाग्रहैष्यदभिव्याहृत्य हैवान्नमत्रप्स्यत्॥ ३॥", "padacchedaText": "", "audioFile": "PB_000198.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000199", "originalText": "तत्प्राणेनाजिघृक्षत्तन्नाशक्नोत्प्राणेन ग्रहीतुम्। स यद्धैनत्प्राणेनाग्रहैष्यदभिप्राण्य हैवान्नमत्रप्स्यत्॥ ४॥", "padacchedaText": "", "audioFile": "PB_000199.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000200", "originalText": "तच्चक्षुषाजिघृक्षत्तन्नाशक्नोच्चक्षुषा ग्रहीतुम्। स यद्धैनच्चक्षुषाग्रहैष्यद्दृष्ट्वा हैवान्नमत्रप्स्यत्॥ ५॥", "padacchedaText": "", "audioFile": "PB_000200.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000201", "originalText": "तच्छ्रोत्रेणाजिघृक्षत्तन्नाशक्नोच्छ्रोत्रेण ग्रहीतुम्। स यद्धैनच्छ्रोत्रेणाग्रहैष्यच्छ्रुत्वा हैवान्नमत्रप्स्यत्॥ ६॥", "padacchedaText": "", "audioFile": "PB_000201.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000202", "originalText": "तत्त्वचाजिघृक्षत्तन्नाशक्नोत्त्वचा ग्रहीतुम्। स यद्धैनत्त्वचाग्रहैष्यत्स्पृष्ट्वा हैवान्नमत्रप्स्यत्॥ ७॥", "padacchedaText": "", "audioFile": "PB_000202.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000203", "originalText": "तन्मनसाजिघृक्षत्तन्नाशक्नोन्मनसा ग्रहीतुम्। स यद्धैनन्मनसाग्रहैष्यद्ध्यात्वा हैवान्नमत्रप्स्यत्॥ ८॥", "padacchedaText": "", "audioFile": "PB_000203.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000204", "originalText": "तच्छिश्नेनाजिघृक्षत्तन्नाशक्नोच्छिश्नेन ग्रहीतुम्। स यद्धैनच्छिश्नेनाग्रहैष्यद्विसृज्य हैवान्नमत्रप्स्यत्॥ ९॥", "padacchedaText": "", "audioFile": "PB_000204.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000205", "originalText": "तदपानेनाजिघृक्षत्तदावयत्। सैषोऽन्नस्य ग्रहो यद्वायुरन्नायुर्वा एष यद्वायुः॥ १०॥", "padacchedaText": "", "audioFile": "PB_000205.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000206", "originalText": "तदेनत् अन्नं लोकलोकपालान्नार्थ्यभिमुखे सृष्टं सत्, यथा मूषकादिर्मार्जारादिगोचरे सन्, मम मृत्युरन्नाद इति मत्वा परागञ्चतीति पराङ् पराक्सत् अत्तॄन् अतीत्य अजिघांसत् अतिगन्तुमैच्छत्, पलायितुं प्रारभतेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000206.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000207", "originalText": "तमन्नाभिप्रायं मत्वा स लोकलोकपालसङ्घातकार्यकरणलक्षणः पिण्डः प्रथमजत्वादन्यांश्चान्नादानपश्यन्, तत् अन्नं वाचा वदनव्यापारेण अजिघृक्षत् ग्रहीतुमैच्छत्।", "padacchedaText": "", "audioFile": "PB_000207.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000208", "originalText": "तत् अन्नं नाशक्नोत् न समर्थोऽभवत् वाचा वदनक्रियया ग्रहीतुम् उपादातुम्।", "padacchedaText": "", "audioFile": "PB_000208.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000209", "originalText": "सः प्रथमजः शरीरी यत् यदि ह एनत् वाचा अग्रहैष्यत् गृहीतवान्स्यात् अन्नम्, सर्वोऽपि लोकः तत्कार्यभूतत्वात् अभिव्याहृत्य हैव अन्नम् अत्रप्स्यत् तृप्तोऽभविष्यत्।", "padacchedaText": "", "audioFile": "PB_000209.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000210", "originalText": "न चैतदस्ति।", "padacchedaText": "", "audioFile": "PB_000210.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000211", "originalText": "अतो नाशक्नोद्वाचा ग्रहीतुमित्यवगच्छामः पूर्वजोऽपि।", "padacchedaText": "", "audioFile": "PB_000211.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000212", "originalText": "समानमुत्तरम्।", "padacchedaText": "", "audioFile": "PB_000212.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000213", "originalText": "तत्प्राणेन तच्चक्षुषा तच्छ्रोत्रेण तत्त्वचा तन्मनसा तच्छिश्नेन तेन तेन करणव्यापारेण अन्नं ग्रहीतुमशक्नुवन्पश्चात् अपानेन वायुना मुखच्छिद्रेण तत् अन्नम् अजिघृक्षत्, तदावयत् तदन्नमेवं जग्राह अशितवान्।", "padacchedaText": "", "audioFile": "PB_000213.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000214", "originalText": "तेन स एषः अपानवायुः अन्नस्य ग्रहः अन्नग्राहक इत्येतत्। यद्वायुः यो वायुरन्नायुः अन्नबन्धनोऽन्नजीवनो वै प्रसिद्धः, स एष यो वायुः॥", "padacchedaText": "", "audioFile": "PB_000214.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000215", "originalText": "स ईक्षत कथं न्विदं मदृते स्यादिति स ईक्षत कतरेण प्रपद्या इति स ईक्षत यदि वाचाभिव्याहृतं यदि प्राणेनाभिप्राणितं यदि चक्षुषा दृष्टं यदि श्रोत्रेण श्रुतं यदि त्वचा स्पृष्टं यदि मनसा ध्यातं यद्यपानेनाभ्यपानितं यदि शिश्नेन विसृष्टमथ कोऽहमिति॥ ११॥", "padacchedaText": "", "audioFile": "PB_000215.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000216", "originalText": "सः एवं लोकलोकपालसङ्घातस्थितिम् अन्ननिमित्तां कृत्वा पुरपौरतत्पालयितृस्थितिसमां स्वामीव ईक्षत— कथं नु केन प्रकारेण नु इति वितर्कयन्, इदं मत् ऋते मामन्तरेण पुरस्वामिनम्, यदिदं कार्यकरणसङ्घातकार्यं वक्ष्यमाणं कथं नु खलु मामन्तरेण स्यात् परार्थं सत्।", "padacchedaText": "", "audioFile": "PB_000216.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000217", "originalText": "यदि वाचाभिव्याहृतमित्यादि केवलमेव वाग्व्यवहरणादि, तन्निरर्थकं न कथञ्चन भवेत् बलिस्तुत्यादिवत्।", "padacchedaText": "", "audioFile": "PB_000217.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000218", "originalText": "पौरबन्द्यादिभिः प्रयुज्यमानं स्वाम्यर्थं सत्स्वामिनमन्तरेण असत्येव स्वामिनि, तद्वत्।", "padacchedaText": "", "audioFile": "PB_000218.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000219", "originalText": "तस्मान्मया परेण स्वामिना अधिष्ठात्रा कृताकृतफलसाक्षिभूतेन भोक्त्रा भवितव्यं पुरस्येव राज्ञा।", "padacchedaText": "", "audioFile": "PB_000219.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000220", "originalText": "यदि नामैतत्संहतकार्यस्य परार्थत्वम्, परार्थिनं मां चेतनं त्रातारमन्तरेण भवेत्, पुरपौरकार्यमिव तत्स्वामिनम्।", "padacchedaText": "", "audioFile": "PB_000220.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000221", "originalText": "अथ कोऽहं किंस्वरूपः कस्य वा स्वामी? यद्यहं कार्यकरणसङ्घातमनुप्रविश्य वागाद्यभिव्याहृतादिफलं नोपलभेय राजेव पुरमाविश्याधिकृतपुरुषकृताकृतादिलक्षणम्, न कश्चिन्माम् अयं सन् एवंरूपश्च इत्यधिगच्छेद्विचारयेत्।", "padacchedaText": "", "audioFile": "PB_000221.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000222", "originalText": "विपर्यये तु, योऽयं वागाद्यभिव्याहृतादीदमिति वेद, स सन् वेदनरूपश्च इत्यधिगन्तव्योऽहं स्याम्, यदर्थमिदं संहतानां वागादीनामभिव्याहृतादि।", "padacchedaText": "", "audioFile": "PB_000222.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000223", "originalText": "यथा स्तम्भकुड्यादीनां प्रासादादिसंहतानां स्वावयवैरसंहतपरार्थत्वम्, तद्वदिति।", "padacchedaText": "", "audioFile": "PB_000223.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000224", "originalText": "एवमीक्षित्वा अतः कतरेण प्रपद्या इति। प्रपदं च मूर्धा च अस्य सङ्घातस्य प्रवेशमार्गौ, अनयोः कतरेण मार्गेणेदं कार्यकरणसङ्घातलक्षणं पुरं प्रपद्यै प्रपद्ये इति॥", "padacchedaText": "", "audioFile": "PB_000224.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000225", "originalText": "स एतमेव सीमानं विदार्यैतया द्वारा प्रापद्यत।", "padacchedaText": "", "audioFile": "PB_000225.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000226", "originalText": "सैषा विदृतिर्नाम द्वास्तदेतन्नान्दनम्। तस्य त्रय आवसथास्त्रयः स्वप्ना अयमावसथोऽयमावसथोऽयमावसथ इति॥ १२॥", "padacchedaText": "", "audioFile": "PB_000226.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000227", "originalText": "एवमीक्षित्वा न तावन्मद्भृत्यस्य प्राणस्य मम सर्वार्थाधिकृतस्य प्रवेशमार्गेण प्रपदाभ्यामधः प्रपद्ये।", "padacchedaText": "", "audioFile": "PB_000227.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000228", "originalText": "किं तर्हि, पारिशेष्यादस्य मूर्धानं विदार्य प्रपद्ये इति लोक इव ईक्षितकारी य स्रष्टेश्वरः, स एतमेव मूर्धसीमानं केशविभागावसानं विदार्य च्छिद्रं कृत्वा एतया द्वारा मार्गेण इमं कार्यकारणसङ्घातं प्रापद्यत प्रविवेश।", "padacchedaText": "", "audioFile": "PB_000228.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000229", "originalText": "सेयं हि प्रसिद्धा द्वाः, मूर्ध्नि तैलादिधारणकाले अन्तस्तद्रसादिसंवेदनात्।", "padacchedaText": "", "audioFile": "PB_000229.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000230", "originalText": "सैषा विदृतिः विदारितत्वाद्विदृतिर्नाम प्रसिद्धा द्वाः।", "padacchedaText": "", "audioFile": "PB_000230.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000231", "originalText": "इतराणि तु श्रोत्रादिद्वाराणि भृत्यादिस्थानीयसाधारणमार्गत्वान्न समृद्धीनि नानन्दहेतूनि।", "padacchedaText": "", "audioFile": "PB_000231.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000232", "originalText": "इदं तु द्वारं परमेश्वरस्यैव केवलस्येति।", "padacchedaText": "", "audioFile": "PB_000232.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000233", "originalText": "तदेतत् नान्दनं नन्दनमेव।", "padacchedaText": "", "audioFile": "PB_000233.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000234", "originalText": "नान्दनमिति दैर्घ्यं छान्दसम्।", "padacchedaText": "", "audioFile": "PB_000234.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000235", "originalText": "नन्दत्यनेन द्वारेण गत्वा परस्मिन्ब्रह्मणीति।", "padacchedaText": "", "audioFile": "PB_000235.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000236", "originalText": "तस्यैवं सृष्ट्वा प्रविष्टस्यानेन जीवेनात्मना राज्ञ इव पुरम्, त्रय आवसथाः— जागरितकाले इन्द्रियस्थानं दक्षिणं चक्षुः, स्वप्नकाले अन्तर्मनः, सुषुप्तिकाले हृदयाकाश इत्येते, वक्ष्यमाणा वा त्रय आवसथाः— पितृशरीरं मातृगर्भाशयः स्वं च शरीरमिति।", "padacchedaText": "", "audioFile": "PB_000236.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000237", "originalText": "त्रयः स्वप्ना जाग्रत्स्वप्नसुषुप्त्याख्याः।", "padacchedaText": "", "audioFile": "PB_000237.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000238", "originalText": "ननु जागरितं प्रबोधरूपत्वान्न स्वप्नः।", "padacchedaText": "", "audioFile": "PB_000238.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000239", "originalText": "नैवम्, स्वप्न एव।", "padacchedaText": "", "audioFile": "PB_000239.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000240", "originalText": "कथम्? परमार्थस्वात्मप्रबोधाभावात् स्वप्नवदसद्वस्तुदर्शनाच्च।", "padacchedaText": "", "audioFile": "PB_000240.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000241", "originalText": "अयमेव आवसथश्चक्षुर्दक्षिणं प्रथमः।", "padacchedaText": "", "audioFile": "PB_000241.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000242", "originalText": "मनोऽन्तरं द्वितीयः।", "padacchedaText": "", "audioFile": "PB_000242.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000243", "originalText": "हृदयाकाशस्तृतीयः।", "padacchedaText": "", "audioFile": "PB_000243.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000244", "originalText": "अयमावसथः इत्युक्तानुकीर्तनमेव।", "padacchedaText": "", "audioFile": "PB_000244.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000245", "originalText": "तेषु ह्ययमावसथेषु पर्यायेणात्मभावेन वर्तमानोऽविद्यया दीर्घकालं गाढं प्रसुप्तः स्वाभाविक्या, न प्रबुध्यतेऽनेकशतसहस्रानर्थसंनिपादजदुःखमुद्गराभिघातानुभवैरपि॥", "padacchedaText": "", "audioFile": "PB_000245.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000246", "originalText": "स जातो भूतान्यभिव्यैख्यत्किमिहान्यं वावदिषदिति। स एतमेव पुरुषं ब्रह्म ततममपश्यदिदमदर्शमिती३॥ १३॥", "padacchedaText": "", "audioFile": "PB_000246.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000247", "originalText": "स जातः शरीरे प्रविष्टो जीवात्मना भूतानि अभिव्यैख्यत् व्याकरोत्।", "padacchedaText": "", "audioFile": "PB_000247.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000248", "originalText": "स कदाचित्परमकारुणिकेन आचार्येणात्मज्ञानप्रबोधकृच्छब्दिकायां वेदान्तमहाभेर्यां तत्कर्णमूले ताड्यमानायाम्, एतमेव सृष्ट्यादिकर्तृत्वेन प्रकृतं पुरुषं पुरि शयानमात्मानं ब्रह्म बृहत् ततमं तकारेणैकेन लुप्तेन तततमं व्याप्ततमं परिपूर्णमाकाशवत् प्रत्यबुध्यत अपश्यत्।", "padacchedaText": "", "audioFile": "PB_000248.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000249", "originalText": "कथम्? इदं ब्रह्म मम आत्मनः स्वरूपमदर्शं दृष्टवानस्मि।", "padacchedaText": "", "audioFile": "PB_000249.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000250", "originalText": "अहो इति। विचारणार्था प्लुतिः पूर्वम्॥", "padacchedaText": "", "audioFile": "PB_000250.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000251", "originalText": "तस्मादिदन्द्रो नामेदन्द्रो ह वै नाम तमिदन्द्रं सन्तमिन्द्र इत्याचक्षते परोक्षेण। परोक्षप्रिया इव हि देवाः परोक्षप्रिया इव हि देवाः॥ १४॥", "padacchedaText": "", "audioFile": "PB_000251.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000252", "originalText": "इति तृतीयः खण्डः॥", "padacchedaText": "", "audioFile": "PB_000252.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000253", "originalText": "यस्मादिदमित्येव यत्साक्षादपरोक्षाद्ब्रह्म सर्वान्तरमपश्यत् न परोक्षेण, तस्मात् इदं पश्यतीति इदन्द्रो नाम परमात्मा।", "padacchedaText": "", "audioFile": "PB_000253.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000254", "originalText": "इदन्द्रो ह वै नाम प्रसिद्धो लोके ईश्वरः।", "padacchedaText": "", "audioFile": "PB_000254.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000255", "originalText": "तम् एवम् इदन्द्रं सन्तम् इन्द्र इति परोक्षेण परोक्षाभिधानेन आचक्षते ब्रह्मविदः संव्यवहारार्थं पूज्यतमत्वात्प्रत्यक्षनामग्रहणभयात्।", "padacchedaText": "", "audioFile": "PB_000255.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000256", "originalText": "तथा हि परोक्षप्रियाः परोक्षनामग्रहणप्रिया इव एव हि यस्मात् देवाः।", "padacchedaText": "", "audioFile": "PB_000256.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000257", "originalText": "किमुत सर्वदेवानामपि देवो महेश्वरः। द्विर्वचनं प्रकृताध्यायपरिसमाप्त्यर्थम्॥", "padacchedaText": "", "audioFile": "PB_000257.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000258", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ ऐतरेयोपनिषद्भाष्ये प्रथमोऽध्यायः॥", "padacchedaText": "", "audioFile": "PB_000258.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000259", "originalText": "इति तृतीयखण्डभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000259.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000260", "originalText": "द्वितीयः अध्यायः\nचतुर्थः खण्डः\nअस्मिन्नध्याये एष वाक्यार्थः— जगदुत्पत्तिस्थितिप्रलयकृदसंसारी सर्वज्ञः सर्वशक्तिः सर्ववित्सर्वमिदं जगत्स्वतोऽन्यद्वस्त्वन्तरमनुपादायैव आकाशादिक्रमेण सृष्ट्वा स्वात्मप्रबोधनार्थं सर्वाणि च प्राणादिमच्छरीराणि स्वयं प्रविवेश, प्रविश्य च स्वमात्मानं यथाभूतमिदं ब्रह्मास्मीति साक्षात्प्रत्यबुध्यत, तस्मात्स एव सर्वशरीरेष्वेक एवात्मा, नान्य इति।", "padacchedaText": "", "audioFile": "PB_000260.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000261", "originalText": "अन्योऽपि ‘स म आत्मा ब्रह्मास्मीत्येवं विद्यात्’ इति ‘आत्मा वा इदमेक एवाग्र आसीत्’ (ऐ.१.१.१) ‘ब्रह्म ततमम्’ (ऐ.१.३.१३) इति चोक्तम्।", "padacchedaText": "", "audioFile": "PB_000261.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000262", "originalText": "अन्यत्र च सर्वगतस्य सर्वात्मनो वालाग्रमात्रमप्यप्रविष्टं नास्तीति कथं सीमानं विदार्य प्रापद्यत पिपीलिकेव सुषिरम्? नन्वत्यल्पमिदं चोद्यम्।", "padacchedaText": "", "audioFile": "PB_000262.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000263", "originalText": "बहु चात्र चोदयितव्यम्।", "padacchedaText": "", "audioFile": "PB_000263.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000264", "originalText": "अकरणः सन्नीक्षत।", "padacchedaText": "", "audioFile": "PB_000264.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000265", "originalText": "अनुपादाय किञ्चिल्लोकानसृजत।", "padacchedaText": "", "audioFile": "PB_000265.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000266", "originalText": "अद्भ्यः पुरुषं समुद्धृत्यामूर्छयत्।", "padacchedaText": "", "audioFile": "PB_000266.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000267", "originalText": "तस्याभिध्यानान्मुखादि निर्भिन्नं मुखादिभ्यश्चाग्न्यादयो लोकपालाः।", "padacchedaText": "", "audioFile": "PB_000267.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000268", "originalText": "तेषां चाशनायादिसंयोजनं तदायतनप्रार्थनं तदर्थं गवादिप्रदर्शनं तेषां च यथायतनप्रवेशनं सृष्टस्यान्नस्य पलायनं वागादिभिस्तज्जिघृक्षेति। एतत्सर्वं सीमाविदारणप्रवेशसममेव॥", "padacchedaText": "", "audioFile": "PB_000268.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000269", "originalText": "अस्तु तर्हि सर्वमेवेदमनुपपन्नम्।", "padacchedaText": "", "audioFile": "PB_000269.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000270", "originalText": "न, अत्रात्माववोधमात्रस्य विवक्षितत्वात्सर्वोऽयमर्थवाद इत्यदोषः।", "padacchedaText": "", "audioFile": "PB_000270.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000271", "originalText": "मायाविवद्वा, महामायावी देवः सर्वज्ञः सर्वशक्तिः सर्वमेतच्चकार सुखावबोधप्रतिपत्त्यर्थं लोकवदाख्यायिकादिप्रपञ्च इति युक्ततरः पक्षः।", "padacchedaText": "", "audioFile": "PB_000271.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000272", "originalText": "न हि सृष्ट्याख्यायिकादिपरिज्ञानात्किञ्चित्फलमिष्यते।", "padacchedaText": "", "audioFile": "PB_000272.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000273", "originalText": "ऐकात्म्यस्वरूपपरिज्ञानात्तु अमृतत्वं फलं सर्वोपनिषत्प्रसिद्धम्।", "padacchedaText": "", "audioFile": "PB_000273.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000274", "originalText": "स्मृतिषु च गीताद्यासु ‘समं सर्वेषु भूतेषु तिष्ठन्तं परमेश्वरम्’ (भ.गी.१३.२७) इत्यादिना।", "padacchedaText": "", "audioFile": "PB_000274.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000275", "originalText": "ननु त्रय आत्मानो भोक्ता कर्ता संसारी जीव एकः सर्वलोकशास्त्रप्रसिद्धः।", "padacchedaText": "", "audioFile": "PB_000275.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000276", "originalText": "अनेकप्राणिकर्मफलोपभोगयोग्यानेकाधिष्ठानवल्लोकदेहनिर्माणेन लिङ्गेन यथाशास्त्रप्रदर्शितेन पुरप्रासादादिनिर्माणलिङ्गेन तद्विषयकौशलज्ञानवांस्तत्कर्ता तक्षादिरिव ईश्वरः सर्वज्ञो जगतः कर्ता द्वितीयश्चेतन आत्मा अवगम्यते।", "padacchedaText": "", "audioFile": "PB_000276.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000277", "originalText": "‘यतो वाचो निवर्तन्ते’ (तै.२.४.१) ‘नेति नेति’ (बृ.३.९.२६) इत्यादिशास्त्रप्रसिद्ध औपनिषदः पुरुषस्तृतीयः।", "padacchedaText": "", "audioFile": "PB_000277.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000278", "originalText": "एवमेते त्रय आत्मानोऽन्योन्यविलक्षणाः।", "padacchedaText": "", "audioFile": "PB_000278.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000279", "originalText": "तत्र कथमेक एवात्मा अद्वितीयः असंसारीति ज्ञातुं शक्यते? तत्र जीव एव तावत्कथं ज्ञायते? नन्वेवं ज्ञायते श्रोता मन्ता द्रष्टा आदेष्टाघोष्टा विज्ञाता प्रज्ञातेति।", "padacchedaText": "", "audioFile": "PB_000279.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000280", "originalText": "ननु विप्रतिषिद्धं ज्ञायते यः श्रवणादिकर्तृत्वेन अमतो मन्ता अविज्ञातो विज्ञाता इति च।", "padacchedaText": "", "audioFile": "PB_000280.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000281", "originalText": "तथा ‘न मतेर्मन्तारं मन्वीथा न विज्ञातेर्विज्ञातारं विजानीयाः’ (बृ.३.४.२) इत्यादि च।", "padacchedaText": "", "audioFile": "PB_000281.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000282", "originalText": "सत्यं विप्रतिषिद्धम्, यदि प्रत्यक्षेण ज्ञायेत सुखादिवत्।", "padacchedaText": "", "audioFile": "PB_000282.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000283", "originalText": "प्रत्यक्षज्ञानं च निवार्यते ‘न मतेर्मन्तारम्’ (बृ.३.४.२) इत्यादिना।", "padacchedaText": "", "audioFile": "PB_000283.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000284", "originalText": "ज्ञायते तु श्रवणादिलिङ्गेन, तत्र कुतो विप्रतिषेधः? ननु श्रवणादिलिङ्गेनापि कथं ज्ञायते, यावता यदा शृणोत्यात्मा श्रोतव्यं शब्दम्, तदा तस्य श्रवणक्रिययैव वर्तमानत्वान्मननविज्ञानक्रिये न सम्भवत आत्मनि परत्र वा।", "padacchedaText": "", "audioFile": "PB_000284.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000285", "originalText": "तथा अन्यत्रापि मननादिक्रियासु।", "padacchedaText": "", "audioFile": "PB_000285.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000286", "originalText": "श्रवणादिक्रियाश्च स्वविषयेष्वेव।", "padacchedaText": "", "audioFile": "PB_000286.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000287", "originalText": "न हि मन्तव्यादन्यत्र मन्तुः मननक्रिया सम्भवति।", "padacchedaText": "", "audioFile": "PB_000287.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000288", "originalText": "ननु मनसः सर्वमेव मन्तव्यम्।", "padacchedaText": "", "audioFile": "PB_000288.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000289", "originalText": "सत्यमेवम्, तथापि सर्वमपि मन्तव्यं मन्तारमन्तरेण न मन्तुं शक्यम्।", "padacchedaText": "", "audioFile": "PB_000289.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000290", "originalText": "यद्येवं किं स्यात्? इदमत्र स्यात्— सर्वस्य योऽयं मन्ता, स मन्तैवेति न स मन्तव्यः स्यात्।", "padacchedaText": "", "audioFile": "PB_000290.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000291", "originalText": "न च द्वितीयो मन्तुर्मन्तास्ति।", "padacchedaText": "", "audioFile": "PB_000291.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000292", "originalText": "यदा स आत्मनैव मन्तव्यः, तदा येन च मन्तव्य आत्मा आत्मना, यश्च मन्तव्य आत्मा, तौ द्वौ प्रसज्येयाताम्।", "padacchedaText": "", "audioFile": "PB_000292.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000293", "originalText": "एक एव आत्मा द्विधा मन्तृमन्तव्यत्वेन द्विशकलीभवेद्वंशादिवत्, उभयथाप्यनुपपत्तिरेव।", "padacchedaText": "", "audioFile": "PB_000293.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000294", "originalText": "यथा प्रदीपयोः प्रकाश्यप्रकाशकत्वानुपपत्तिः, समत्वात्, तद्वत्।", "padacchedaText": "", "audioFile": "PB_000294.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000295", "originalText": "न च मन्तुर्मन्तव्ये मननव्यापारशून्यः कालेऽस्त्यात्ममननाय।", "padacchedaText": "", "audioFile": "PB_000295.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000296", "originalText": "यदापि लिङ्गेनात्मानं मनुते मन्ता, तदापि पूर्ववदेव लिङ्गेन मन्तव्य आत्मा, यश्च तस्य मन्ता, तौ द्वौ प्रसज्येयाताम्, एक एव वा द्विधेति पूर्वोक्तो दोषः।", "padacchedaText": "", "audioFile": "PB_000296.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000297", "originalText": "न प्रत्यक्षेण, नाप्यनुमानेन ज्ञायते चेत्, कथमुच्यते ‘स म आत्मेति विद्यात्’ (कौ.३.९) इति, कथं वा श्रोता मन्तेत्यादि? ननु श्रोतृत्वादिधर्मवानात्मा, अश्रोतृत्वादि च प्रसिद्धमात्मनः, किमत्र विषमं पश्यसि? यद्यपि तव न विषमम्, तथापि मम तु विषमं प्रतिभाति।", "padacchedaText": "", "audioFile": "PB_000297.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000298", "originalText": "कथम्? यदासौ श्रोता, तदा न मन्ता, यदा मन्ता, तदा न श्रोता।", "padacchedaText": "", "audioFile": "PB_000298.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000299", "originalText": "तत्रैवं सति, पक्षे श्रोता मन्ता, पक्षे न श्रोता नापि मन्ता।", "padacchedaText": "", "audioFile": "PB_000299.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000300", "originalText": "तथा अन्यत्रापि च।", "padacchedaText": "", "audioFile": "PB_000300.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000301", "originalText": "यदैवम्, तदा श्रोतृत्वादिधर्मवानात्मा अश्रोतृत्वादिधर्मवान्वेति संशयस्थाने कथं तव न वैषम्यम्? यदा देवदत्तो गच्छति, तदा न स्थाता, गन्तैव।", "padacchedaText": "", "audioFile": "PB_000301.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000302", "originalText": "यदा तिष्ठति, न गन्ता, स्थातैव, तदास्य पक्ष एव गन्तृत्वं स्थातृत्वं च, न नित्यं गन्तृत्वं स्थातृत्वं वा, तद्वत्।", "padacchedaText": "", "audioFile": "PB_000302.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000303", "originalText": "तथैवात्र काणादादयः पश्यन्ति।", "padacchedaText": "", "audioFile": "PB_000303.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000304", "originalText": "पक्षप्राप्तेनैव श्रोतृत्वादिना आत्मोच्यते श्रोता मन्तेत्यादिवचनात्।", "padacchedaText": "", "audioFile": "PB_000304.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000305", "originalText": "संयोगजत्वमयौगपद्यं च ज्ञानस्य ह्याचक्षते।", "padacchedaText": "", "audioFile": "PB_000305.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000306", "originalText": "दर्शयन्ति च अन्यत्रमना अभूवं नादर्शम् इत्यादि युगपज्ज्ञानानुत्पत्तिर्मनसो लिङ्गमिति च न्याय्यम्।", "padacchedaText": "", "audioFile": "PB_000306.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000307", "originalText": "भवत्वेवं किं तव नष्टं यद्येवं स्यात्? अस्त्वेवं तवेष्टं चेत्, श्रुत्यर्थस्तु न सम्भवति।", "padacchedaText": "", "audioFile": "PB_000307.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000308", "originalText": "किं न श्रोता मन्तेत्यादिश्रुत्यर्थः? न, न श्रोता न मन्तेत्यादिवचनात्।", "padacchedaText": "", "audioFile": "PB_000308.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000309", "originalText": "ननु पाक्षिकत्वेन प्रत्युक्तं त्वया, न, नित्यमेव श्रोतृत्वाद्यभ्युपगमात्, ‘न हि श्रोतुः श्रुतेर्विपरिलोपो विद्यते’ (बृ.४.३.२७) इत्यादिश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000309.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000310", "originalText": "एवं तर्हि नित्यमेव श्रोतृत्वाद्यभ्युपगमे, प्रत्यक्षविरुद्धा युगपज्ज्ञानोत्पत्तिः अज्ञानाभावश्चात्मनः कल्पितः स्यात्।", "padacchedaText": "", "audioFile": "PB_000310.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000311", "originalText": "तच्चानिष्टमिति।", "padacchedaText": "", "audioFile": "PB_000311.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000312", "originalText": "नोभयदोषोपपत्तिः, आत्मनः श्रुत्यादिश्रोतृत्वादिधर्मवत्त्वश्रुतेः।", "padacchedaText": "", "audioFile": "PB_000312.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000313", "originalText": "अनित्यानां मूर्तानां च चक्षुरादीनां दृष्ट्याद्यनित्यमेव संयोगवियोगधर्मिणाम्।", "padacchedaText": "", "audioFile": "PB_000313.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000314", "originalText": "यथा अग्नेर्ज्वलनं तृणादिसंयोगजत्वात्, तद्वत्।", "padacchedaText": "", "audioFile": "PB_000314.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000315", "originalText": "न तु नित्यस्यामूर्तस्यासंयोगविभागधर्मिणः संयोगजदृष्ट्याद्यनित्यधर्मवत्त्वं सम्भवति।", "padacchedaText": "", "audioFile": "PB_000315.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000316", "originalText": "तथा च श्रुतिः ‘न हि द्रष्टुर्दृष्टेर्विपरिलोपो विद्यते’ (बृ.४.३.२३) इत्याद्या।", "padacchedaText": "", "audioFile": "PB_000316.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000317", "originalText": "एवं तर्हि द्वे दृष्टी चक्षुषोऽनित्या दृष्टिः, नित्या चात्मनः।", "padacchedaText": "", "audioFile": "PB_000317.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000318", "originalText": "तथा च द्वे श्रुती श्रोत्रस्यानित्या, नित्या चात्मस्वरूपस्य।", "padacchedaText": "", "audioFile": "PB_000318.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000319", "originalText": "तथा द्वे मती विज्ञाती बाह्याबाह्ये।", "padacchedaText": "", "audioFile": "PB_000319.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000320", "originalText": "एवं ह्येव चेयं श्रुतिरुपपन्ना भवति— ‘दृष्टेर्द्रष्टा श्रुतेः श्रोता’ इत्याद्या।", "padacchedaText": "", "audioFile": "PB_000320.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000321", "originalText": "लोकेऽपि प्रसिद्धं चक्षुषस्तिमिरागमापाययोः नष्टा दृष्टिः जाता दृष्टिः इति चक्षुर्दृष्टेरनित्यत्वम्।", "padacchedaText": "", "audioFile": "PB_000321.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000322", "originalText": "तथा च श्रुतिमत्यादीनामात्मदृष्ट्यादीनां च नित्यत्वं प्रसिद्धमेव लोके।", "padacchedaText": "", "audioFile": "PB_000322.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000323", "originalText": "वदति ह्युद्धृतचक्षुः स्वप्नेऽद्य मया भ्राता दृष्ट इति।", "padacchedaText": "", "audioFile": "PB_000323.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000324", "originalText": "तथा अवगतबाधिर्यः स्वप्ने श्रुतो मन्त्रोऽद्येत्यादि।", "padacchedaText": "", "audioFile": "PB_000324.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000325", "originalText": "यदि चक्षुःसंयोगजैवात्मनो नित्या दृष्टिस्तन्नाशे नश्येत्, तदा उद्धृतचक्षुः स्वप्ने नीलपीतादि न पश्येत्।", "padacchedaText": "", "audioFile": "PB_000325.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000326", "originalText": "‘न हि द्रष्टुर्दृष्टेः’ (बृ.४.३.२३) इत्याद्या च श्रुतिः अनुपपन्ना स्यात्।", "padacchedaText": "", "audioFile": "PB_000326.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000327", "originalText": "‘तच्चक्षुः पुरुषे येन स्वप्नं पश्यति’ इत्याद्या च श्रुतिः।", "padacchedaText": "", "audioFile": "PB_000327.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000328", "originalText": "नित्या आत्मनो दृष्टिर्बाह्यानित्यदृष्टेर्ग्राहिका।", "padacchedaText": "", "audioFile": "PB_000328.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000329", "originalText": "बाह्यदृष्टेश्च उपजनापायाद्यनित्यधर्मवत्त्वात् ग्राहिकाया आत्मदृष्टेस्तद्वदवभासत्वमनित्यत्वादि भ्रान्तिनिमित्तं लोकस्येति युक्तम्।", "padacchedaText": "", "audioFile": "PB_000329.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000330", "originalText": "यथा भ्रमणादिधर्मवदलातादिवस्तुविषयदृष्टिरपि भ्रमतीव, तद्वत्।", "padacchedaText": "", "audioFile": "PB_000330.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000331", "originalText": "तथा च श्रुतिः ‘ध्यायतीव लेलायतीव’ (बृ.४.३.७) इति।", "padacchedaText": "", "audioFile": "PB_000331.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000332", "originalText": "तस्मादात्मदृष्टेर्नित्यत्वान्न यौगपद्यमयौगपद्यं वा अस्ति।", "padacchedaText": "", "audioFile": "PB_000332.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000333", "originalText": "बाह्यानित्यदृष्ट्युपाधिवशात्तु लोकस्य तार्किकाणां च आगमसम्प्रदायवर्जितत्वात् अनित्या आत्मनो दृष्टिरिति भ्रान्तिरुपपन्नैव।", "padacchedaText": "", "audioFile": "PB_000333.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000334", "originalText": "जीवेश्वरपरमात्मभेदकल्पना च एतन्निमित्तैव।", "padacchedaText": "", "audioFile": "PB_000334.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000335", "originalText": "तथा अस्ति, नास्ति, इत्याद्याश्च यावन्तो वाङ्मनसयोर्भेदा यत्रैकं भवन्ति, तद्विषयाया नित्याया दृष्टेर्निर्विशेषायाः।", "padacchedaText": "", "audioFile": "PB_000335.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000336", "originalText": "अस्ति नास्ति, एकं नाना, गुणवदगुणम्, जानाति न जानाति, क्रियावदक्रियम्, फलवदफलम्, सबीजं निर्बीजम्, सुखं दुःखम्, मध्यममध्यम्, शून्यमशून्यम्, परोऽहमन्यः, इति वा सर्ववाक्प्रत्ययागोचरे स्वरूपे यो विकल्पयितुमिच्छति, स नूनं खमपि चर्मवद्वेष्टयितुमिच्छति, सोपानमिव च पद्भ्यामारोढुम्, जले खे च मीनानां वयसां च पदं दिदृक्षते, ‘नेति नेति’ (बृ.३.९.२६) ‘यतो वाचो निवर्तन्ते’ (तै.२.४.१) इत्यादिश्रुतिभ्यः, ‘को अद्धा वेद’ (ऋ.सं.१.३०.६) इत्यादिमन्त्रवर्णात्॥", "padacchedaText": "", "audioFile": "PB_000336.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000337", "originalText": "कथं तर्हि तस्य स म आत्मेति वेदनम्, ब्रूहि केन प्रकारेण तमहं स म आत्मेति विद्याम्।", "padacchedaText": "", "audioFile": "PB_000337.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000338", "originalText": "अत्राख्यायिकामाचक्षते— कश्चित्किल मनुष्यो मुग्धः कैश्चिदुक्तः कस्मिंश्चिदपराधे सति धिक्त्वां नासि मनुष्य इति।", "padacchedaText": "", "audioFile": "PB_000338.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000339", "originalText": "स मुग्धतया आत्मनो मनुष्यत्वं प्रत्याययितुं कञ्चिदुपेत्याह— ब्रवीतु भवान्कोऽहमस्मीति।", "padacchedaText": "", "audioFile": "PB_000339.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000340", "originalText": "स तस्य मुग्धतां ज्ञात्वा आह— क्रमेण बोधयिष्यामीति।", "padacchedaText": "", "audioFile": "PB_000340.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000341", "originalText": "स्थावराद्यात्मभावमपोह्य न त्वममनुष्य इत्युक्त्वोपरराम।", "padacchedaText": "", "audioFile": "PB_000341.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000342", "originalText": "स तं मुग्धः प्रत्याह— भवान्मां बोधयितुं प्रवृत्तस्तूष्णीं बभूव, किं न बोधयतीति।", "padacchedaText": "", "audioFile": "PB_000342.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000343", "originalText": "तादृगेव तद्भवतो वचनम्।", "padacchedaText": "", "audioFile": "PB_000343.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000344", "originalText": "नास्यमनुष्य इत्युक्तेऽपि मनुष्यत्वमात्मनो न प्रतिपद्यते यः, स कथं मनुष्योऽसीत्युक्तोऽपि मनुष्यत्वमात्मनः प्रतिपद्येत? तस्माद्यथाशास्त्रोपदेश एवात्मावबोधविधिः, नान्यः।", "padacchedaText": "", "audioFile": "PB_000344.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000345", "originalText": "न ह्यग्नेर्दाह्यं तृणादि अन्येन केनचिद्दग्धुं शक्यम्।", "padacchedaText": "", "audioFile": "PB_000345.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000346", "originalText": "अत एव शास्त्रमात्मस्वरूपं बोधयितुं प्रवृत्तं सत् अमनुष्यत्वप्रतिषेधेनेव ‘नेति नेति’ (बृ.३.९.२६) इत्युक्त्वोपरराम।", "padacchedaText": "", "audioFile": "PB_000346.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000347", "originalText": "तथा ‘अनन्तरमबाह्यम्’ (बृ.२.५.१९)(बृ.३.८.८) ‘अयमात्मा ब्रह्म सर्वानुभूः’ (बृ.२.५.१९) इत्यनुशासनम्, ‘तत्त्वमसि’ (छा.६.८.७) ‘यत्र त्वस्य सर्वमात्मैवाभूत्तत्केन कं पश्येत्’ (बृ.२.४.१४)(बृ.४.५.१५) इत्येवमाद्यपि च।", "padacchedaText": "", "audioFile": "PB_000347.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000348", "originalText": "यावदयमेव यथोक्तमिममात्मानं न वेत्ति, तावदयं ब्राह्मानित्यदृष्टिलक्षणमुपाधिमात्मत्वेनोपेत्य अविद्यया उपाधिधर्मानात्मनो मन्यमानो ब्रह्मादिस्तम्बपर्यन्तेषु स्थानेषु पुनः पुनरावर्तमानः अविद्याकामकर्मवशात्संसरति।", "padacchedaText": "", "audioFile": "PB_000348.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000349", "originalText": "स एवं संसरन् उपात्तदेहेन्द्रियसङ्घातं त्यजति।", "padacchedaText": "", "audioFile": "PB_000349.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000350", "originalText": "त्यक्त्वा अन्यमुपादत्ते।", "padacchedaText": "", "audioFile": "PB_000350.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000351", "originalText": "पुनः पुनरेवमेव नदीस्रोतोवज्जन्ममरणप्रबन्धाविच्छेदेन वर्तमानः काभिरवस्थाभिर्वर्तते इत्येतमर्थं दर्शयन्त्याह श्रुतिः वैराग्यहेतोः—\nपुरुषे ह वा अयमादितो गर्भो भवति।", "padacchedaText": "", "audioFile": "PB_000351.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000352", "originalText": "यदेतद्रेतस्तदेतत्सर्वेभ्योऽङ्गेभ्यस्तेजः सम्भूतमात्मन्येवात्मानं बिभर्ति तद्यथा स्त्रियां सिञ्चत्यथैनज्जनयति तदस्य प्रथमं जन्म॥ १॥", "padacchedaText": "", "audioFile": "PB_000352.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000353", "originalText": "अयमेवाविद्याकामकर्माभिमानवान् यज्ञादिकर्म कृत्वा अस्माल्लोकाद्धूमादिक्रमेण चन्द्रमसं प्राप्य क्षीणकर्मा वृष्ट्यादिक्रमेण इमं लोकं प्राप्य अन्नभूतः पुरुषाग्नौ हुतः।", "padacchedaText": "", "audioFile": "PB_000353.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000354", "originalText": "तस्मिन्पुरुषे ह वै अयं संसारी रसादिक्रमेण आदितः प्रथमतः रेतोरूपेण गर्भो भवतीति एतदाह— यदेतत्पुरुषे रेतः, तेन रूपेणेति।", "padacchedaText": "", "audioFile": "PB_000354.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000355", "originalText": "तच्च एतत् रेतः अन्नमयस्य पिण्डस्य सर्वेभ्यः अङ्गेभ्यः अवयवेभ्यो रसादिलक्षणेभ्यः तेजः साररूपं शरीरस्य सम्भूतं परिनिष्पन्नं तत् पुरुषस्य आत्मभूतत्वादात्मा, तमात्मानं रेतोरूपेण गर्भीभूतम् आत्मन्येव स्वशरीर एव आत्मानं बिभर्ति धारयति।", "padacchedaText": "", "audioFile": "PB_000355.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000356", "originalText": "तत् रेतः स्त्रियां सिञ्चति यदा, यदा यस्मिन्काले भार्या ऋतुमती तस्यां योषाग्नौ स्त्रियां सिञ्चति उपगच्छन्, अथ तदा एनत् एतद्रेतः आत्मनो गर्भरूपं जनयति पिता।", "padacchedaText": "", "audioFile": "PB_000356.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000357", "originalText": "तत् अस्य पुरुषस्य स्थानान्निर्गमनं रेतःसेककाले रेतोरूपेण अस्य संसारिणः प्रथमं जन्म प्रथमावस्थाभिव्यक्तिः। तदेतदुक्तं पुरस्तात् ‘असावात्मा अमुमात्मानम्’ इत्यादिना॥", "padacchedaText": "", "audioFile": "PB_000357.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000358", "originalText": "तत्स्त्रिया आत्मभूयं गच्छति यथा स्वमङ्गं तथा। तस्मादेनां न हिनस्ति सास्यैतमात्मानमत्र गतं भावयति॥ २॥", "padacchedaText": "", "audioFile": "PB_000358.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000359", "originalText": "तत् रेतः यस्यां स्त्रियां सिक्तं सत्तस्याः स्त्रियाः आत्मभूयम् आत्माव्यतिरेकतां यथा पितुः एवं गच्छति प्राप्नोति यथा स्वमङ्गं स्तनादि, तथा तद्वदेव।", "padacchedaText": "", "au
