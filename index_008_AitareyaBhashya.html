dioFile": "PB_000359.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000360", "originalText": "तस्माद्धेतोः एनां मातरं स गर्भो न हिनस्ति पिटकादिवत्।", "padacchedaText": "", "audioFile": "PB_000360.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000361", "originalText": "यस्मात्स्तनादि स्वाङ्गवदात्मभूयं गतम्, तस्मान्न हिनस्ति न बाधत इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000361.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000362", "originalText": "सा अन्तर्वत्नी एतम् अस्य भर्तुरात्मानम् अत्र आत्मन उदरे गतं प्रविष्टं बुद्ध्वा भावयति वर्धयति परिपालयति गर्भविरुद्धाशनादिपरिहारम् अनुकूलाशनाद्युपयोगं च कुर्वती॥", "padacchedaText": "", "audioFile": "PB_000362.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000363", "originalText": "सा भावयित्री भावयितव्या भवति तं स्त्री गर्भं बिभर्ति सोऽग्र एव कुमारं जन्मनोऽग्रेऽधि भावयति। स यत्कुमारं जन्मनोऽग्रेऽधि भावयत्यात्मानमेव तद्भावयत्येषां लोकानां सन्तत्या एवं सन्तता हीमे लोकास्तदस्य द्वितीयं जन्म॥ ३॥", "padacchedaText": "", "audioFile": "PB_000363.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000364", "originalText": "सा भावयित्री वर्धयित्री भर्तुरात्मनो गर्भभूतस्य भावयितव्या वर्धयितव्या च भर्त्रा भवति।", "padacchedaText": "", "audioFile": "PB_000364.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000365", "originalText": "न ह्युपकारप्रत्युपकारमन्तरेण लोके कस्यचित्केनचित्सम्बन्ध उपपद्यते।", "padacchedaText": "", "audioFile": "PB_000365.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000366", "originalText": "तं गर्भं स्त्री यथोक्तेन गर्भधारणविधानेन बिभर्ति धारयति अग्रे प्राग्जन्मनः।", "padacchedaText": "", "audioFile": "PB_000366.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000367", "originalText": "सः पिता अग्रे एव पूर्वमेव जातमात्रं कुमारं जन्मनः अधि ऊर्ध्वं जन्मनः जातं कुमारं जातकर्मादिना पिता भावयति।", "padacchedaText": "", "audioFile": "PB_000367.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000368", "originalText": "सः पिता यत् यस्मात् कुमारं जन्मनः अधि ऊर्ध्वं अग्रे जातमात्रमेव जातकर्मादिना यद्भावयति, तत् आत्मानमेव भावयति, पितुरात्मैव हि पुत्ररूपेण जायते।", "padacchedaText": "", "audioFile": "PB_000368.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000369", "originalText": "तथा ह्युक्तम् ‘पतिर्जायां प्रविशति’ (हरि.३.७३.७१) इत्यादि।", "padacchedaText": "", "audioFile": "PB_000369.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000370", "originalText": "तत्किमर्थमात्मानं पुत्ररूपेण जनयित्वा भावयतीति? उच्यते— एषां लोकानां सन्तत्यै अविच्छेदायेत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000370.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000371", "originalText": "विच्छिद्येरन्हीमे लोकाः पुत्रोत्पादनादि यदि न कुर्युः।", "padacchedaText": "", "audioFile": "PB_000371.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000372", "originalText": "एवं पुत्रोत्पादनादिकर्माविच्छेदेनैव सन्तताः प्रबन्धरूपेण वर्तन्ते हि यस्मात् इमे लोकाः, तस्मात्तदविच्छेदाय तत्कर्तव्यम्, न मोक्षायेत्यर्थः। तत् अस्य संसारिणः कुमाररूपेण मातुरुदराद्यन्निर्गमनम्, तत् रेतोरूपापेक्षया द्वितीयं जन्म द्वितीयावस्थाभिव्यक्तिः॥", "padacchedaText": "", "audioFile": "PB_000372.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000373", "originalText": "सोऽस्यायमात्मा पुण्येभ्यः कर्मभ्यः प्रतिधीयते। अथास्यायमितर आत्मा कृतकृत्यो वयोगतः प्रैति स इतः प्रयन्नेव पुनर्जायते तदस्य तृतीयं जन्म॥ ४॥", "padacchedaText": "", "audioFile": "PB_000373.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000374", "originalText": "अस्य पितुः सोऽयं पुत्रात्मा पुण्येभ्यः शास्त्रोक्तेभ्यः कर्मभ्यः कर्मनिष्पादनार्थं प्रतिधीयते पितुः स्थाने पित्रा यत्कर्तव्यं तत्करणाय प्रतिनिधीयत इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000374.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000375", "originalText": "तथा च सम्प्रत्तिविद्यायां वाजसनेयके— ‘पित्रानुशिष्टोऽहं ब्रह्माहं यज्ञ इत्यादि प्रतिपद्यते’ (बृ.१.५.१७) इति।", "padacchedaText": "", "audioFile": "PB_000375.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000376", "originalText": "अथ अनन्तरं पुत्रे निवेश्यात्मनो भारम् अस्य पुत्रस्य इतरः अयं यः पित्रात्मा कृतकृत्यः, कर्तव्यात् ऋणत्रयात् विमुक्तः कृतकर्तव्य इत्यर्थः, वयोगतः गतवयाः जीर्णः सन् प्रैति म्रियते।", "padacchedaText": "", "audioFile": "PB_000376.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000377", "originalText": "सः इतः अस्मात् प्रयन्नेव शरीरं परित्यजन्नेव, तृणजलूकादिवत्, देहान्तरमुपाददानः कर्मचितम्, पुनर्जायते।", "padacchedaText": "", "audioFile": "PB_000377.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000378", "originalText": "तदस्य मृत्वा प्रतिपत्तव्यं यत्, तत् तृतीयं जन्म।", "padacchedaText": "", "audioFile": "PB_000378.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000379", "originalText": "ननु संसरतः पितुः सकाशाद्रेतोरूपेण प्रथमं जन्म, तस्यैव कुमाररूपेण मातुर्द्वितीयं जन्मोक्तम्, तस्यैव तृतीये जन्मनि वक्तव्ये, प्रयतस्तस्य पितुर्यज्जन्म, तत्तृतीयमिति कथमुच्यते? नैष दोषः, पितापुत्रयोरेकात्मत्वस्य विवक्षितत्वात्।", "padacchedaText": "", "audioFile": "PB_000379.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000380", "originalText": "सोऽपि पुत्रः स्वपुत्रे भारं निधाय इतः प्रयन्नेव पुनर्जायते यथा पिता।", "padacchedaText": "", "audioFile": "PB_000380.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000381", "originalText": "तदन्यत्रोक्तमितरत्राप्युक्तमेव भवतीति मन्यते श्रुतिः। पितापुत्रयोरेकात्मत्वात्॥", "padacchedaText": "", "audioFile": "PB_000381.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000382", "originalText": "तदुक्तमृषिणा।", "padacchedaText": "", "audioFile": "PB_000382.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000383", "originalText": "गर्भे नु सन्नन्वेषामवेदमहं देवानां जनिमानि विश्वा। शतं मा पुर आयसीररक्षन्नधः श्येनो जवसा निरदीयमिति गर्भ एवैतच्छयानो वामदेव एवमुवाच॥ ५॥", "padacchedaText": "", "audioFile": "PB_000383.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000384", "originalText": "एवं संसरन्नवस्थाभिव्यक्तित्रयेण जन्ममरणप्रबन्धारूढः सर्वो लोकः संसारसमुद्रे निपतितः कथञ्चिद्यदा श्रुत्युक्तमात्मानं विजानाति यस्यां कस्याञ्चिदवस्थायाम्, तदैव मुक्तसर्वसंसारबन्धनः कृतकृत्यो भवतीत्येतद्वस्तु, तत् ऋषिणा मन्त्रेणापि उक्तमित्याह— गर्भे नु मातुर्गर्भाशय एव सन्, नु इति वितर्के।", "padacchedaText": "", "audioFile": "PB_000384.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000385", "originalText": "अनेकजन्मान्तरभावनापरिपाकवशात् एषां देवानां वागग्न्यादीनां जनिमानि जन्मानि विश्वा विश्वानि सर्वाणि अन्ववेदम् अहम् अहो अनुबुद्धवानस्मीत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000385.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000386", "originalText": "शतम् अनेकाः बह्व्यः मा मां पुरः आयसीः आयस्यो लोहमय्य इवाभेद्यानि शरीराणीत्यभिप्रायः।", "padacchedaText": "", "audioFile": "PB_000386.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000387", "originalText": "अरक्षन् रक्षितवत्यः संसारपाशनिर्गमनात् अधः।", "padacchedaText": "", "audioFile": "PB_000387.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000388", "originalText": "अथ श्येन इव जालं भित्त्वा जवसा आत्मज्ञानकृतसामर्थ्येन निरदीयं निर्गतोऽस्मि। अहो गर्भ एव शयानो वामदेवः ऋषिः एवमुवाच एतत्॥", "padacchedaText": "", "audioFile": "PB_000388.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000389", "originalText": "स एवं विद्वानस्माच्छरीरभेदादूर्ध्व उत्क्रम्यामुष्मिन्स्वर्गे लोके सर्वान्कामानाप्त्वामृतः समभवत्समभवत्॥ ६॥", "padacchedaText": "", "audioFile": "PB_000389.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000390", "originalText": "इति चतुर्थः खण्डः॥", "padacchedaText": "", "audioFile": "PB_000390.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000391", "originalText": "सः वामदेव ऋषिः यथोक्तमात्मानम् एवं विद्वान् अस्मात् शरीरभेदात् शरीरस्य अविद्यापरिकल्पितस्य आयसवदनिर्भेद्यस्य जननमरणाद्यनेकानर्थशताविष्टशरीरप्रबन्धस्य परमात्मज्ञानामृतोपयोगजनितवीर्यकृतभेदात् शरीरोत्पत्तिबीजाविद्यादिनिमित्तोपमर्दहेतोः शरीरविनाशादित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000391.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000392", "originalText": "ऊर्ध्वः परमात्मभूतः सन् अधोभवात्संसारात् उत्क्रम्य ज्ञानावद्योतितामलसर्वात्मभावमापन्नः सन् अमुष्मिन् यथोक्ते अजरेऽमरेऽमृतेऽभये सर्वज्ञेऽपूर्वेऽनपरेऽनन्तरेऽबाह्ये प्रज्ञानामृतैकरसे स्वर्गे लोके स्वस्मिन्नात्मनि स्वे स्वरूपे अमृतः समभवत् आत्मज्ञानेन पूर्वमाप्तकामतया जीवन्नेव सर्वान्कामानाप्त्वा इत्यर्थः।", "padacchedaText": "", "audioFile": "PB_000392.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000393", "originalText": "द्विर्वचनं सफलस्य सोदाहरणस्य आत्मज्ञानस्य परिसमाप्तिप्रदर्शनार्थम्॥", "padacchedaText": "", "audioFile": "PB_000393.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000394", "originalText": "इति चतुर्थखण्डभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000394.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000395", "originalText": "इति श्रीमत्परमहंसपरिव्राजकाचार्यस्य श्रीगोविन्दभगवत्पूज्यपादशिष्यस्य श्रीमच्छङ्करभगवतः कृतौ ऐतरेयोपनिषद्भाष्ये द्वितीयोऽध्यायः॥", "padacchedaText": "", "audioFile": "PB_000395.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000396", "originalText": "तृतीयः अध्यायः\nपञ्चमः खण्डः\nब्रह्मविद्यासाधनकृतसर्वात्मभावफलावाप्तिं वामदेवाद्याचार्यपरम्परया पारम्पर्यश्रुत्यावद्योत्यमानां ब्रह्मवित्परिषद्यत्यन्तप्रसिद्धाम् उपलभमाना मुमुक्षवो ब्राह्मणा अधुनातनाः ब्रह्म जिज्ञासवः अनित्यात्साध्यसाधनलक्षणात्संसारात् आ जीवभावाद्व्याविवृत्सवो विचारयन्तः अन्योन्यं पृच्छन्ति।", "padacchedaText": "", "audioFile": "PB_000396.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000397", "originalText": "कथम्?—\nकोऽयमात्मेति वयमुपास्महे कतरः स आत्मा येन वा पश्यति येन वा शृणोति येन वा गन्धानाजिघ्रति येन वा वाचं व्याकरोति येन वा स्वादु चास्वादु च विजानाति॥ १॥", "padacchedaText": "", "audioFile": "PB_000397.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000398", "originalText": "यमात्मानम् अयमात्मा इति साक्षात् वयमुपास्महे कः स आत्मेति, यं चात्मानमयमात्मेति साक्षादुपासीनो वामदेवः अमृतः समभवत्, तमेव वयमप्युपास्महे को नु खलु स आत्मेति एवं जिज्ञासापूर्वमन्योन्यं पृच्छताम् अतिक्रान्तविशेषविषयश्रुतिसंस्कारजनिता स्मृतिरजायत— तम् ‘प्रपदाभ्यां प्रापद्यत ब्रह्मेमं पुरुषम्’ ‘स एतमेव सीमानं विदार्य एतया द्वारा प्रापद्यत’ एतमेव पुरुषं द्वे ब्रह्मणी इतरेतरप्रातिकूल्येन प्रतिपन्ने— इति।", "padacchedaText": "", "audioFile": "PB_000398.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000399", "originalText": "ते चास्य पिण्डस्यात्मभूते।", "padacchedaText": "", "audioFile": "PB_000399.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000400", "originalText": "तयोरन्यतर आत्मोपास्यो भवितुमर्हति।", "padacchedaText": "", "audioFile": "PB_000400.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000401", "originalText": "योऽत्रोपास्यः, कतरः स आत्मा इति विशेषनिर्धारणार्थं पुनरन्योन्यं पप्रच्छुर्विचारयन्तः।", "padacchedaText": "", "audioFile": "PB_000401.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000402", "originalText": "पुनस्तेषां विचारयतां विशेषविचारणास्पदविषया मतिरभूत्।", "padacchedaText": "", "audioFile": "PB_000402.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000403", "originalText": "कथम्? द्वे वस्तुनी अस्मिन्पिण्डे उपलभ्येते— अनेकभेदभिन्नेन करणेन येनोपलभते, यश्चैक उपलभते, करणान्तरोपलब्धिविषयस्मृतिप्रतिसन्धानात्।", "padacchedaText": "", "audioFile": "PB_000403.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000404", "originalText": "तत्र न तावत् येनोपलभते, स आत्मा भवितुमर्हति।", "padacchedaText": "", "audioFile": "PB_000404.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000405", "originalText": "केन पुनरुपलभत इति, उच्यते— येन वा चक्षुर्भूतेन रूपं पश्यति, येन वा शृणोति श्रोत्रभूतेन शब्दम्, येन वा घ्राणभूतेन गन्धानाजिघ्रति, येन वा वाक्करणभूतेन वाचं नामात्मिकां व्याकरोति गौरश्व इत्येवमाद्याम्, साध्वसाध्विति च, येन वा जिह्वाभूतेन स्वादु च अस्वादु च विजानातीति॥", "padacchedaText": "", "audioFile": "PB_000405.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000406", "originalText": "यदेतद्धृदयं मनश्चैतत्।", "padacchedaText": "", "audioFile": "PB_000406.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000407", "originalText": "संज्ञानमाज्ञानं विज्ञानं प्रज्ञानं मेधा दृष्टिर्धृतिर्मतिर्मनीषा जूतिः स्मृतिः सङ्कल्पः क्रतुरसुः कामो वश इति। सर्वाण्येवैतानि प्रज्ञानस्य नामधेयानि भवन्ति॥ २॥", "padacchedaText": "", "audioFile": "PB_000407.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000408", "originalText": "किं पुनस्तदेकमनेकधा भिन्नं करणमिति, उच्यते।", "padacchedaText": "", "audioFile": "PB_000408.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000409", "originalText": "यदुक्तं पुरस्तात् प्रजानां रेतो हृदयं हृदयस्य रेतो मनः मनसा सृष्टा आपश्च वरुणश्च हृदयान्मनो मनसश्चन्द्रमाः, तदेवैतद्धृदयं मनश्च, एकमेव तदनेकधा।", "padacchedaText": "", "audioFile": "PB_000409.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000410", "originalText": "एतेनान्तःकरणेनैकेन चक्षुर्भूतेन रूपं पश्यति, श्रोत्रभूतेन शृणोति, घ्राणभूतेन जिघ्रति, वाग्भूतेन वदति, जिह्वाभूतेन रसयति, स्वेनैव विकल्पनारूपेण मनसा सङ्कल्पयति, हृदयरूपेणाध्यवस्यति।", "padacchedaText": "", "audioFile": "PB_000410.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000411", "originalText": "तस्मात्सर्वकरणविषयव्यापारकमेकमिदं करणं सर्वोपलब्ध्यर्थमुपलब्धुः।", "padacchedaText": "", "audioFile": "PB_000411.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000412", "originalText": "तथा च कौषीतकिनाम् ‘प्रज्ञया वाचं समारुह्य वाचा सर्वाणि नामान्याप्नोति प्रज्ञया चक्षुः समारुह्य चक्षुषा सर्वाणि रूपाण्याप्नोति’ (कौ.३.६) इत्यादि।", "padacchedaText": "", "audioFile": "PB_000412.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000413", "originalText": "वाजसनेयके च— ‘मनसा ह्येव पश्यति मनसा शृणोति हृदयेन हि रूपाणि विजानाति’ (बृ.१.५.३) इत्यादि।", "padacchedaText": "", "audioFile": "PB_000413.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000414", "originalText": "तस्माद्धृदयमनोवाच्यस्य सर्वोपलब्धिकरणत्वं प्रसिद्धम्।", "padacchedaText": "", "audioFile": "PB_000414.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000415", "originalText": "तदात्मकश्च प्राणः ‘यो वै प्राणः, सा प्रज्ञा या वै प्रज्ञा स प्राणः’ (कौ.३.३) इति हि ब्राह्मणम्।", "padacchedaText": "", "audioFile": "PB_000415.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000416", "originalText": "करणसंहतिरूपश्च प्राण इत्यवोचाम प्राणसंवादादौ।", "padacchedaText": "", "audioFile": "PB_000416.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000417", "originalText": "तस्माद्यत्पद्भ्यां प्रापद्यत, तद्ब्रह्म तदुपलब्धुरुपलब्धिकरणत्वेन गुणभूतत्वान्नैव तद्वस्तु ब्रह्म उपास्य आत्मा भवितुमर्हति।", "padacchedaText": "", "audioFile": "PB_000417.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000418", "originalText": "पारिशेष्याद्यस्योपलब्धुरुपलब्ध्यर्था एतस्य हृदयमनोरूपस्य करणस्य वृत्तयो वक्ष्यमाणाः, स उपलब्धा उपास्य आत्मा नोऽस्माकं भवितुमर्हतीति निश्चयं कृतवन्तः।", "padacchedaText": "", "audioFile": "PB_000418.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000419", "originalText": "तदन्तःकरणोपाधिस्थस्योपलब्धुः प्रज्ञानरूपस्य ब्रह्मण उपलब्ध्यर्था या अन्तःकरणवृत्तयो बाह्यान्तर्वर्तिविषयविषयाः, ता इमा उच्यन्ते— संज्ञानं संज्ञप्तिः चेतनभावः, आज्ञानम् आज्ञप्तिः ईश्वरभावः, विज्ञानं कलादिपरिज्ञानम्, प्रज्ञानं प्रज्ञप्तिः प्रज्ञता, मेधा ग्रन्थधारणसामर्थ्यम्, दृष्टिः इन्द्रियद्वारा सर्वविषयोपलब्धिः, धृतिः धारणम् अवसन्नानां शरीरेन्द्रियाणां ययोत्तम्भनं भवति, ‘धृत्या शरीरमुद्वहन्ति’ इति हि वदन्ति, मतिः मननम्, मनीषा तत्र स्वातन्त्र्यम्, जूतिः चेतसो रुजादिदुःखित्वभावः, स्मृतिः स्मरणम्, सङ्कल्पः शुक्लकृष्णादिभावेन सङ्कल्पनं रूपादीनाम्, क्रतुः अध्यवसायः, असुः प्राणनादिजीवनक्रियानिमित्ता वृत्तिः, कामः असंनिहितविषयाकाङ्क्षा तृष्णा, वशः स्त्रीव्यतिकराद्यभिलाषः, इत्येवमाद्या अन्तःकरणवृत्तयः उपलब्धुरुपलब्ध्यर्थत्वाच्छुद्धप्रज्ञानरूपस्य ब्रह्मण उपाधिभूतास्तदुपाधिजनितगुणनामधेयानि संज्ञानादीनि सर्वाण्येवैतानि प्रज्ञप्तिमात्रस्य प्रज्ञानस्य नामधेयानि भवन्ति, न स्वतः साक्षात्।", "padacchedaText": "", "audioFile": "PB_000419.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000420", "originalText": "तथा चोक्तम् ‘प्राणन्नेव प्राणो नाम भवति’ (बृ.१.४.७) इत्यादि॥", "padacchedaText": "", "audioFile": "PB_000420.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000421", "originalText": "एष ब्रह्मैष इन्द्र एष प्रजापतिरेते सर्वे देवा इमानि च पञ्च महाभूतानि पृथिवी वायुराकाश आपो ज्योतींषीत्येतानीमानि च क्षुद्रमिश्राणीव।", "padacchedaText": "", "audioFile": "PB_000421.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000422", "originalText": "बीजानीतराणि चेतराणि चाण्डजानि च जारुजानि च स्वेदजानि चोद्भिज्जानि चाश्वा गावः पुरुषा हस्तिनो यत्किञ्चेदं प्राणि जङ्गमं च पतत्रि च यच्च स्थावरम्। सर्वं तत्प्रज्ञानेत्रं प्रज्ञाने प्रतिष्ठितं प्रज्ञानेत्रो लोकः प्रज्ञा प्रतिष्ठा प्रज्ञानं ब्रह्म॥ ३॥", "padacchedaText": "", "audioFile": "PB_000422.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000423", "originalText": "स एषः प्रज्ञानरूप आत्मा ब्रह्म अपरं सर्वशरीरस्थः प्राणः प्रज्ञात्मा अन्तःकरणोपाधिष्वनुप्रविष्टो जलभेदगतसूर्यप्रतिबिम्बवत् हिरण्यगर्भः प्राणः प्रज्ञात्मा।", "padacchedaText": "", "audioFile": "PB_000423.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000424", "originalText": "एष एव इन्द्रः गुणात्, देवराजो वा।", "padacchedaText": "", "audioFile": "PB_000424.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000425", "originalText": "एष प्रजापतिः यः प्रथमजः शरीरी, यतो मुखादिनिर्भेदद्वारेणाग्न्यादयो लोकपाला जाताः, स प्रजापतिरेष एव।", "padacchedaText": "", "audioFile": "PB_000425.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000426", "originalText": "येऽपि एते अग्न्यादयः सर्वे देवा एष एव।", "padacchedaText": "", "audioFile": "PB_000426.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000427", "originalText": "इमानि च सर्वशरीरोपादानभूतानि पञ्च पृथिव्यादीनि महाभूतानि अन्नान्नादत्वलक्षणानि एतानि।", "padacchedaText": "", "audioFile": "PB_000427.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000428", "originalText": "किञ्च, इमानि च क्षुद्रमिश्राणि क्षुद्रैरल्पकैर्मिश्राणि, इवशब्दः अनर्थकः, सर्पादीनि।", "padacchedaText": "", "audioFile": "PB_000428.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000429", "originalText": "बीजानि कारणानि इतराणि चेतराणि च द्वैराश्येन निर्दिश्यमानानि।", "padacchedaText": "", "audioFile": "PB_000429.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000430", "originalText": "कानि तानि? उच्यन्ते— अण्डजानि पक्ष्यादीनि, जारुजानि जरायुजानि मनुष्यादीनि, स्वेदजानि यूकादीनि, उद्भिज्जानि च वृक्षादीनि।", "padacchedaText": "", "audioFile": "PB_000430.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000431", "originalText": "अश्वाः गावः पुरुषाः हस्तिनः अन्यच्च यत्किञ्चेदं प्राणि।", "padacchedaText": "", "audioFile": "PB_000431.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000432", "originalText": "किं तत्? जङ्गमं यच्चलति पद्भ्यां गच्छति, यच्च पतत्रि आकाशेन पतनशीलम्, यच्च स्थावरम् अचलम्, सर्वं तत् अशेषतः प्रज्ञानेत्रम्, प्रज्ञप्तिः प्रज्ञा, तच्च ब्रह्मैव, नीयतेऽनेनेति नेत्रम्, प्रज्ञा नेत्रं यस्य तदिदं प्रज्ञानेत्रम्, प्रज्ञाने ब्रह्मण्युत्पत्तिस्थितिलयकालेषु प्रतिष्ठितम्, प्रज्ञाश्रयमित्यर्थः।", "padacchedaText": "", "audioFile": "PB_000432.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000433", "originalText": "प्रज्ञानेत्रो लोकः पूर्ववत्, प्रज्ञाचक्षुर्वा सर्व एव लोकः।", "padacchedaText": "", "audioFile": "PB_000433.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000434", "originalText": "प्रज्ञा प्रतिष्ठा सर्वस्य जगतः।", "padacchedaText": "", "audioFile": "PB_000434.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000435", "originalText": "तस्मात् प्रज्ञानं ब्रह्म।", "padacchedaText": "", "audioFile": "PB_000435.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000436", "originalText": "तदेतत्प्रत्यस्तमितसर्वोपाधिविशेषं सत् निरञ्जनं निर्मलं निष्क्रियं शान्तम् एकम् अद्वयं ‘नेति नेति’ (बृ.३.९.२६) इति सर्वविशेषापोहसंवेद्यं सर्वशब्दप्रत्ययागोचरं तदत्यन्तविशुद्धप्रज्ञोपाधिसम्बन्धेन सर्वज्ञमीश्वरं सर्वसाधारणाव्याकृतजगद्बीजप्रवर्तकं नियन्तृत्वादन्तर्यामिसंज्ञं भवति।", "padacchedaText": "", "audioFile": "PB_000436.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000437", "originalText": "तदेव व्याकृतजगद्बीजभूतबुद्ध्यात्माभिमानलक्षणं हिरण्यगर्भसंज्ञं भवति।", "padacchedaText": "", "audioFile": "PB_000437.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000438", "originalText": "तदेव अन्तरण्डोद्भूतप्रथमशरीरोपाधिमत् विराट्प्रजापतिसंज्ञं भवति।", "padacchedaText": "", "audioFile": "PB_000438.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000439", "originalText": "तदुद्भूताग्न्याद्युपाधिमत् देवतासंज्ञं भवति।", "padacchedaText": "", "audioFile": "PB_000439.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000440", "originalText": "तथा विशेषशरीरोपाधिष्वपि ब्रह्मादिस्तम्बपर्यन्तेषु तत्तन्नामरूपलाभो ब्रह्मणः।", "padacchedaText": "", "audioFile": "PB_000440.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000441", "originalText": "तदेवैकं सर्वोपाधिभेदभिन्नं सर्वैः प्राणिभिस्तार्किकैश्च सर्वप्रकारेण ज्ञायते विकल्प्यते च अनेकधा।", "padacchedaText": "", "audioFile": "PB_000441.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000442", "originalText": "‘एतमेके वदन्त्यग्निं मनुमन्ये प्रजापतिम्। इन्द्रमेकेऽपरे प्राणमपरे ब्रह्म शाश्वतम्’ (मनु.१२.१२३) इत्याद्या स्मृतिः॥", "padacchedaText": "", "audioFile": "PB_000442.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000443", "originalText": "स एतेन प्रज्ञेनात्मनास्माल्लोकादुत्क्रम्यामुष्मिन्स्वर्गे लोके सर्वान्कामानाप्त्वामृतः समभवत्समभवत्॥ ४॥", "padacchedaText": "", "audioFile": "PB_000443.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000444", "originalText": "इति पञ्चमः खण्डः॥", "padacchedaText": "", "audioFile": "PB_000444.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000445", "originalText": "स वामदेवोऽन्यो वा एवं यथोक्तं ब्रह्म वेद प्रज्ञेनात्मना, येनैव प्रज्ञेन आत्मना पूर्वे विद्वांसोऽमृता अभूवन् तथा अयमपि विद्वान् एतेनैव प्रज्ञेन आत्मना अस्मात् लोकात् उत्क्रम्येत्यादि व्याख्यातम्।", "padacchedaText": "", "audioFile": "PB_000445.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000446", "originalText": "अस्माल्लोकादुत्क्रम्य अमुष्मिन् स्वर्गे लोके सर्वान्कामान् आप्त्वा अमृतः समभवत्समभवदित्योमिति॥", "padacchedaText": "", "audioFile": "PB_000446.wav", "zipFile": "008_AitareyaBhashya.zip"}, {"id": "B_000447", "originalText": "इति पञ्चमखण्डभाष्यम्॥", "padacchedaText": "", "audioFile": "PB_000447.wav", "zipFile": "008_AitareyaBhashya.zip"}];
        const contentDiv = document.getElementById('content');
        
        let currentIndex = -1;
        let isPlaying = false;
        
        // Use standard HTML5 audio to preserve pitch on speed changes
        const audioEl = new Audio();
        audioEl.preservesPitch = true;
        
        const speedSlider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');
        speedSlider.oninput = function() {
            audioEl.playbackRate = this.value;
            speedDisplay.innerText = parseFloat(this.value).toFixed(1);
        };
        
        let currentScript = 'devanagari';
        const scriptSelect = document.getElementById('script-select');
        scriptSelect.onchange = function() {
            currentScript = this.value;
            document.querySelectorAll('.sentence-text').forEach((span, index) => {
                let origText = manifest[index].originalText;
                if (currentScript === 'devanagari') {
                    span.innerText = origText;
                } else {
                    span.innerText = Sanscript.t(origText, 'devanagari', currentScript);
                }
            });
        };
        
        const playPauseBtn = document.getElementById('play-pause-btn');
        playPauseBtn.onclick = () => {
            if (isPlaying) {
                audioEl.pause();
                isPlaying = false;
                playPauseBtn.innerText = "Resume";
            } else {
                playAudio(Math.max(0, currentIndex));
                playPauseBtn.innerText = "Stop";
            }
        };
        
        manifest.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'sentence';
            div.id = 'sentence-' + index;
            
            const idSpan = document.createElement('span');
            idSpan.className = 'sentence-id';
            idSpan.innerText = '[' + item.id + ']';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'sentence-text';
            textSpan.innerText = item.originalText;
            
            div.appendChild(idSpan);
            div.appendChild(textSpan);
            
            div.onclick = () => {
                playPauseBtn.innerText = "Stop";
                playAudio(index);
            };
            contentDiv.appendChild(div);
        });
        
        // --- HTML5 Audio Prefetching Logic (via Blob URLs) ---
        const PREFETCH_BUFFER_SIZE = 3;
        let prefetchQueue = new Map(); // index -> Blob URL

        function getAudioUrl(index) {
            if (index < 0 || index >= manifest.length) return null;
            const item = manifest[index];
            const zipToUse = item.zipFile || ZIP_NAME;
            return WORKER_URL + '/' + BUCKET_NAME + '/' + zipToUse + '/' + item.audioFile;
        }

        async function fetchBlobUrl(url) {
            const response = await fetch(url);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const blob = await response.blob();
            return URL.createObjectURL(blob);
        }

        async function prefetchNext(fromIndex) {
            for (let i = fromIndex + 1; i <= fromIndex + PREFETCH_BUFFER_SIZE; i++) {
                if (i >= manifest.length) break;
                if (!prefetchQueue.has(i)) {
                    prefetchQueue.set(i, 'fetching');
                    const url = getAudioUrl(i);
                    try {
                        const blobUrl = await fetchBlobUrl(url);
                        if (prefetchQueue.get(i) === 'fetching') {
                            prefetchQueue.set(i, blobUrl);
                        } else {
                            URL.revokeObjectURL(blobUrl);
                        }
                    } catch (err) {
                        console.error("Prefetch failed for index", i, err);
                        prefetchQueue.delete(i);
                    }
                }
            }
            // Cleanup old blobs to free memory
            for (let [key, val] of prefetchQueue.entries()) {
                if (key < fromIndex) {
                    if (typeof val === 'string' && val.startsWith('blob:')) {
                        URL.revokeObjectURL(val);
                    }
                    prefetchQueue.delete(key);
                }
            }
        }
        // ------------------------

        async function playAudio(index) {
            if (index < 0 || index >= manifest.length) {
                isPlaying = false;
                playPauseBtn.innerText = "Start Reading";
                return;
            }
            
            if (currentIndex >= 0) {
                const prevDiv = document.getElementById('sentence-' + currentIndex);
                if (prevDiv) prevDiv.classList.remove('active');
            }
            
            currentIndex = index;
            
            const currentDiv = document.getElementById('sentence-' + currentIndex);
            if (currentDiv) {
                currentDiv.classList.add('active');
                currentDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            audioEl.pause();
            
            try {
                let audioUrl;
                if (prefetchQueue.has(index) && prefetchQueue.get(index) !== 'fetching') {
                    audioUrl = prefetchQueue.get(index);
                } else {
                    const sourceUrl = getAudioUrl(index);
                    audioUrl = await fetchBlobUrl(sourceUrl);
                }
                
                audioEl.src = audioUrl;
                audioEl.playbackRate = speedSlider.value;
                audioEl.onended = () => { playAudio(currentIndex + 1); };
                
                await audioEl.play();
                isPlaying = true;
                
            } catch (e) {
                console.error("Audio play error:", e);
                // Fallback to next track if error
                setTimeout(() => playAudio(currentIndex + 1), 500);
            }
            
            // Trigger prefetch for upcoming sentences
            prefetchNext(index);
        }
    </script>
